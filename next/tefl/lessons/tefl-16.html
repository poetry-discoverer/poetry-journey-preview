<script>window.LESSON_ID="tefl-16";window.STEPS=[{"t": "section", "h": "Why tenses are tricky, and CASSIAL | ليه الأزمنة صعبة، وطريقة CASSIAL", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Teaching tenses is hard for two reasons. First, the differences are subtle, like I went to Brazil in 2006 versus I have been to Brazil.</div><div class=\"u\">تدريس الأزمنة صعب لسببين. أول حاجة، الفروق دقيقة، زي الفرق بين I went to Brazil in 2006 وI have been to Brazil.</div>", "n": 1, "i": 1, "a": "tefl-16-001", "x": "b4198484"}, {"t": "learn", "h": "<div class=\"u\">Second, we wrongly assume other languages have matching tenses. European languages overlap a lot, but other cultures see time and tense very differently.</div><div class=\"u\">ثاني حاجة، بنفترض غلط إن اللغات التانية عندها أزمنة مطابقة. اللغات الأوروبية متقاربة كتير، بس ثقافات تانية شايفة الوقت والزمن بشكل مختلف خالص.</div>", "n": 1, "i": 2, "a": "tefl-16-002", "x": "af5043d1"}, {"t": "learn", "h": "<div class=\"u\">Rosemary Aitken suggests the CASSIAL approach: Choose, Analyse, Sequence, Select, Identify context, Auxiliary materials, Learner error.</div><div class=\"u\">روزماري أيتكين اقترحت طريقة اسمها CASSIAL: اختار، حلّل، رتّب، انتقي، حدّد السياق، مواد مساعدة، أخطاء المتعلم.</div>", "n": 1, "i": 3, "a": "tefl-16-003", "x": "805e6540"}, {"t": "learn", "h": "<div class=\"u\">The idea is simple. Think about the tense you chose to teach: what is its purpose? When do we use it? Are there exceptions?</div><div class=\"u\">الفكرة بسيطة. فكّر في الزمن اللي اخترته: هدفه إيه؟ بنستخدمه إمتى؟ فيه استثناءات؟</div>", "n": 1, "i": 4, "a": "tefl-16-004", "x": "f60b6bd1"}, {"t": "learn", "h": "<div class=\"u\">Prepare enough material to show your point, and pre-empt the problems students may have with the fine details of that tense.</div><div class=\"u\">جهّز مادة كفاية توضّح نقطتك، وتوقّع المشاكل اللي ممكن تقابل الطلبة مع تفاصيل الزمن ده الدقيقة.</div>", "n": 1, "i": 5, "a": "tefl-16-005", "x": "5855a61e"}, {"t": "learn", "h": "<div class=\"u\">Deeper understanding of tenses grows as you teach them more. This unit gives you the overview to get started.</div><div class=\"u\">الفهم الأعمق للأزمنة بيكبر كل ما تدرّسها أكتر. الوحدة دي بتديك النظرة العامة عشان تبدأ.</div>", "n": 1, "i": 6, "a": "tefl-16-006", "x": "6522194b"}, {"t": "section", "h": "Past simple versus present perfect | الماضي البسيط ضد المضارع التام", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">I went to Brazil in 2006 is past simple: the verb go in its past form, went.</div><div class=\"u\">I went to Brazil in 2006 زمنها past simple: الفعل go في صيغة الماضي went.</div>", "n": 1, "i": 8, "a": "tefl-16-007", "x": "4da35fc1"}, {"t": "learn", "h": "<div class=\"u\">I have been to Brazil is present perfect: have or has plus the past participle of the verb. Here the past participle of go is been.</div><div class=\"u\">I have been to Brazil زمنها present perfect: have أو has زائد التصريف التالت للفعل. هنا التصريف التالت لـgo هو been.</div>", "n": 1, "i": 9, "a": "tefl-16-008", "x": "6a514c8d"}, {"t": "learn", "h": "<div class=\"u\">Do not let the name present perfect fool you. It still talks about the past.</div><div class=\"u\">مايضحكش عليك اسم present perfect (المضارع التام). هو كمان بيتكلم عن الماضي.</div>", "n": 1, "i": 10, "a": "tefl-16-009", "x": "0408d05e"}, {"t": "learn", "h": "<div class=\"u\">Both sentences talk about the past, so why two tenses? Why can we not say I have been to Brazil in 2006?</div><div class=\"u\">الجملتين بيتكلموا عن الماضي، طيب ليه زمنين؟ ليه منقدرش نقول I have been to Brazil in 2006؟</div>", "n": 1, "i": 11, "a": "tefl-16-010", "x": "58dab7e1"}, {"t": "learn", "h": "<div class=\"u\">Answer: the present perfect talks about general past experience, with no specific time.</div><div class=\"u\">الإجابة: الـpresent perfect بيتكلم عن خبرة ماضية عامة، من غير وقت محدد.</div>", "n": 1, "i": 12, "a": "tefl-16-011", "x": "5901ad95"}, {"t": "learn", "h": "<div class=\"u\">The past simple needs a specific time period: in 2006, yesterday, last week. That is why in 2006 forces the past simple.</div><div class=\"u\">الـpast simple محتاج وقت محدد: in 2006 أو yesterday أو last week. عشان كده وجود in 2006 بيفرض الـpast simple.</div>", "n": 1, "i": 13, "a": "tefl-16-012", "x": "7f4407a5"}, {"t": "section", "h": "Present and past tenses | أزمنة المضارع والماضي", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">Present simple: routines, habits, and things generally true. Examples: I work every Saturday. Cats chase mice.</div><div class=\"u\">المضارع البسيط: الروتين والعادات والحاجات الصح عمومًا. أمثلة: I work every Saturday. وCats chase mice.</div>", "n": 1, "i": 15, "a": "tefl-16-013", "x": "94151d91"}, {"t": "learn", "h": "<div class=\"u\">Present continuous, also called present progressive: happening now or around now. Form: am/is/are + verb + -ing.</div><div class=\"u\">المضارع المستمر، واسمه كمان present progressive: بيحصل دلوقتي أو حوالين دلوقتي. التكوين: am/is/are زائد الفعل زائد ing.</div>", "n": 1, "i": 16, "a": "tefl-16-014", "x": "e5ec53d1"}, {"t": "learn", "h": "<div class=\"u\">Example: John is working today.</div><div class=\"u\">مثال: John is working today.</div>", "n": 1, "i": 17, "a": "tefl-16-015", "x": "6ab5154f"}, {"t": "learn", "h": "<div class=\"u\">Past simple: completed, finished actions with a specific time reference. Form: the past form of the verb.</div><div class=\"u\">الماضي البسيط: أفعال خلصت واتعملت في وقت محدد. التكوين: صيغة الماضي من الفعل.</div>", "n": 1, "i": 18, "a": "tefl-16-016", "x": "38483750"}, {"t": "learn", "h": "<div class=\"u\">Example: I wrote 10 letters yesterday.</div><div class=\"u\">مثال: I wrote 10 letters yesterday.</div>", "n": 1, "i": 19, "a": "tefl-16-017", "x": "13799a9b"}, {"t": "learn", "h": "<div class=\"u\">Past continuous: an action in progress at a past time, an interrupted past action, or two past actions happening at the same time.</div><div class=\"u\">الماضي المستمر: فعل كان شغال في وقت معين في الماضي، أو فعل ماضي اتقطع، أو فعلين حصلوا مع بعض في الماضي.</div>", "n": 1, "i": 20, "a": "tefl-16-018", "x": "15c60b1c"}, {"t": "learn", "h": "<div class=\"u\">Form: was/were + verb + -ing. Examples: What were you doing at 10.00 last night? I was writing letters.</div><div class=\"u\">التكوين: was/were زائد الفعل زائد ing. أمثلة: What were you doing at 10.00 last night? وI was writing letters.</div>", "n": 1, "i": 21, "a": "tefl-16-019", "x": "2471e653"}, {"t": "section", "h": "Talking about the future | الكلام عن المستقبل", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">English has no separate future verb form. We use several structures, and each one has its own meaning.</div><div class=\"u\">الإنجليزية مفيهاش صيغة ماضي خاصة بالمستقبل. بنستخدم تراكيب مختلفة، وكل تركيب ليه معناه.</div>", "n": 1, "i": 23, "a": "tefl-16-020", "x": "7488ce1c"}, {"t": "learn", "h": "<div class=\"u\">Present continuous for the future: fixed plans and arrangements with a specific time. Example: He is seeing Jim on Sunday afternoon.</div><div class=\"u\">المضارع المستمر للمستقبل: خطط ومواعيد ثابتة بوقت محدد. مثال: He is seeing Jim on Sunday afternoon.</div>", "n": 1, "i": 24, "a": "tefl-16-021", "x": "4c1968fa"}, {"t": "learn", "h": "<div class=\"u\">Going to plus the base verb: future intentions and predictions. Example: She is going to have a baby!</div><div class=\"u\">going to زائد الفعل في المصدر: نوايا وتوقعات مستقبلية. مثال: She is going to have a baby!</div>", "n": 1, "i": 25, "a": "tefl-16-022", "x": "4e765a51"}, {"t": "learn", "h": "<div class=\"u\">Will, will not, or shall plus the base verb: predictions, instant decisions, promises, suggestions, and offers.</div><div class=\"u\">will أو won't أو shall زائد الفعل في المصدر: توقعات، قرارات لحظية، وعود، اقتراحات، وعروض.</div>", "n": 1, "i": 26, "a": "tefl-16-023", "x": "a25e4cb6"}, {"t": "learn", "h": "<div class=\"u\">Examples: I think it will rain tomorrow. I promise I will do my homework later.</div><div class=\"u\">أمثلة: I think it will rain tomorrow. وI promise I will do my homework later.</div>", "n": 1, "i": 27, "a": "tefl-16-024", "x": "a593fb51"}, {"t": "learn", "h": "<div class=\"u\">Future continuous: an action in progress at a particular time in the future. Form: will + be + verb + -ing.</div><div class=\"u\">المستقبل المستمر: فعل هيكون شغال في وقت معين في المستقبل. التكوين: will زائد be زائد الفعل زائد ing.</div>", "n": 1, "i": 28, "a": "tefl-16-025", "x": "4eb252fd"}, {"t": "learn", "h": "<div class=\"u\">Example: In 2050 we will all be driving electric cars.</div><div class=\"u\">مثال: In 2050 we will all be driving electric cars.</div>", "n": 1, "i": 29, "a": "tefl-16-026", "x": "aaba2da3"}, {"t": "section", "h": "The perfect aspect | الجانب التام", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">The perfect aspect links two times. Present perfect simple: general past experience with no specific time, or a past action important now.</div><div class=\"u\">الجانب التام (perfect) بيربط وقتين ببعض. المضارع التام البسيط: خبرة ماضية عامة من غير وقت محدد، أو فعل ماضي ليه أهمية دلوقتي.</div>", "n": 1, "i": 31, "a": "tefl-16-027", "x": "c6b3e60e"}, {"t": "learn", "h": "<div class=\"u\">We also use it with yet, since, for, already, just, and for actions that started in the past and continue now, but only with non-action verbs.</div><div class=\"u\">وبنستخدمه كمان مع yet وsince وfor وalready وjust، وللأفعال اللي بدأت في الماضي ولسه شغالة، بس مع أفعال الحالة (non-action).</div>", "n": 1, "i": 32, "a": "tefl-16-028", "x": "5727b68d"}, {"t": "learn", "h": "<div class=\"u\">Form: have/has + past participle. Examples: I have worked here for 3 years. A car has crashed into a house. I have known her since I was at school.</div><div class=\"u\">التكوين: have/has زائد التصريف التالت. أمثلة: I have worked here for 3 years. وA car has crashed into a house. وI have known her since I was at school.</div>", "n": 1, "i": 33, "a": "tefl-16-029", "x": "0dd6f814"}, {"t": "learn", "h": "<div class=\"u\">Present perfect continuous: actions that started in the past and continue now with action verbs, or recent continuous actions.</div><div class=\"u\">المضارع التام المستمر: أفعال بدأت في الماضي ولسه شغالة مع أفعال الحركة، أو أفعال مستمرة حصلت قريب.</div>", "n": 1, "i": 34, "a": "tefl-16-030", "x": "bdbd86db"}, {"t": "learn", "h": "<div class=\"u\">Form: have/has + been + verb + -ing. Example: I have been learning English for 4 years.</div><div class=\"u\">التكوين: have/has زائد been زائد الفعل زائد ing. مثال: I have been learning English for 4 years.</div>", "n": 1, "i": 35, "a": "tefl-16-031", "x": "b3507448"}, {"t": "learn", "h": "<div class=\"u\">Another example: You are all red, what have you been doing? I have been sunbathing in the garden.</div><div class=\"u\">مثال تاني: You are all red, what have you been doing? I have been sunbathing in the garden.</div>", "n": 1, "i": 36, "a": "tefl-16-032", "x": "4133536d"}, {"t": "learn", "h": "<div class=\"u\">Past perfect simple: we are already talking about the past and want an earlier past time. Form: had + past participle.</div><div class=\"u\">الماضي التام البسيط: بنتكلم أصلًا عن الماضي وعايزين نشير لوقت أقدم منه. التكوين: had زائد التصريف التالت.</div>", "n": 1, "i": 37, "a": "tefl-16-033", "x": "2f86f2a4"}, {"t": "learn", "h": "<div class=\"u\">Example: I could not get in because I had forgotten my keys.</div><div class=\"u\">مثال: I could not get in because I had forgotten my keys.</div>", "n": 1, "i": 38, "a": "tefl-16-034", "x": "a148c61c"}, {"t": "learn", "h": "<div class=\"u\">Past perfect continuous: an action in progress in the past leading up to another past moment. Form: had + been + verb + -ing.</div><div class=\"u\">الماضي التام المستمر: فعل كان شغال في الماضي لحد لحظة ماضية تانية. التكوين: had زائد been زائد الفعل زائد ing.</div>", "n": 1, "i": 39, "a": "tefl-16-035", "x": "983c3be5"}, {"t": "learn", "h": "<div class=\"u\">Example: He had been cleaning the car for an hour before he stopped because of the rain.</div><div class=\"u\">مثال: He had been cleaning the car for an hour before he stopped because of the rain.</div>", "n": 1, "i": 40, "a": "tefl-16-036", "x": "6f390c06"}, {"t": "learn", "h": "<div class=\"u\">Future perfect simple: an action that will already be finished before a future point. Form: will + have + past participle.</div><div class=\"u\">المستقبل التام البسيط: فعل هيكون خلص قبل نقطة معينة في المستقبل. التكوين: will زائد have زائد التصريف التالت.</div>", "n": 1, "i": 41, "a": "tefl-16-037", "x": "da8abe1f"}, {"t": "learn", "h": "<div class=\"u\">Example: I will have already left by the time you arrive.</div><div class=\"u\">مثال: I will have already left by the time you arrive.</div>", "n": 1, "i": 42, "a": "tefl-16-038", "x": "89d838a9"}, {"t": "learn", "h": "<div class=\"u\">Future perfect continuous: an action continuing up to a future point. Form: will + have + been + verb + -ing.</div><div class=\"u\">المستقبل التام المستمر: فعل هيفضل شغال لحد نقطة في المستقبل. التكوين: will زائد have زائد been زائد الفعل زائد ing.</div>", "n": 1, "i": 43, "a": "tefl-16-039", "x": "0e6dce46"}, {"t": "learn", "h": "<div class=\"u\">Example: I will have been working here for 10 years when I retire.</div><div class=\"u\">مثال: I will have been working here for 10 years when I retire.</div>", "n": 1, "i": 44, "a": "tefl-16-040", "x": "c6587128"}, {"t": "section", "h": "Practice answers | حلول التدريب", "n": 1, "i": 45}, {"t": "learn", "h": "<div class=\"u\">The unit's matching practice, solved. I was sleeping when you called is past continuous: an action in progress interrupted in the past.</div><div class=\"u\">تدريب المطابقة بتاع الوحدة، محلول. I was sleeping when you called ماضي مستمر: فعل كان شغال واتقطع في الماضي.</div>", "n": 1, "i": 46, "a": "tefl-16-041", "x": "11162ab9"}, {"t": "learn", "h": "<div class=\"u\">I have been working in the garden all afternoon is present perfect continuous: a recent continuous action with a result now.</div><div class=\"u\">I have been working in the garden all afternoon مضارع تام مستمر: فعل مستمر حصل قريب ونتيجته ظاهرة دلوقتي.</div>", "n": 1, "i": 47, "a": "tefl-16-042", "x": "99333bd1"}, {"t": "learn", "h": "<div class=\"u\">I am playing tennis with Joe tomorrow is present continuous: a fixed future arrangement.</div><div class=\"u\">I am playing tennis with Joe tomorrow مضارع مستمر: ميعاد مستقبلي ثابت.</div>", "n": 1, "i": 48, "a": "tefl-16-043", "x": "f5bff996"}, {"t": "learn", "h": "<div class=\"u\">I just ate a sandwich for lunch is past simple: a finished action. With just, many speakers also use the present perfect.</div><div class=\"u\">I just ate a sandwich for lunch ماضي بسيط: فعل خلص. ومع just ناس كتير بتستخدم المضارع التام كمان.</div>", "n": 1, "i": 49, "a": "tefl-16-044", "x": "cac7586b"}, {"t": "learn", "h": "<div class=\"u\">Don't worry, I will have finished by 5pm is future perfect: finished before a future time.</div><div class=\"u\">Don't worry, I will have finished by 5pm مستقبل تام: هيكون خلص قبل وقت معين في المستقبل.</div>", "n": 1, "i": 50, "a": "tefl-16-045", "x": "5b06f632"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 51}, {"t": "learn", "h": "<div class=\"u\">Tense: the verb form that shows when something happens: past, present, or future.</div><div class=\"u\">الزمن (tense): صيغة الفعل اللي بتوضح إمتى بيحصل الحدث: ماضي أو مضارع أو مستقبل.</div>", "n": 1, "i": 52, "a": "tefl-16-046", "x": "d3392c48"}, {"t": "learn", "h": "<div class=\"u\">Aspect: how the action is viewed, simple, continuous, or perfect, separate from when it happens.</div><div class=\"u\">الجانب (aspect): شكل النظرة للفعل، بسيط أو مستمر أو تام، مستقل عن وقت حدوثه.</div>", "n": 1, "i": 53, "a": "tefl-16-047", "x": "a26e6067"}, {"t": "learn", "h": "<div class=\"u\">Past simple: finished past actions with a specific time reference, like I wrote 10 letters yesterday.</div><div class=\"u\">الماضي البسيط: أفعال ماضية خلصت بوقت محدد، زي I wrote 10 letters yesterday.</div>", "n": 1, "i": 54, "a": "tefl-16-048", "x": "abe2e089"}, {"t": "learn", "h": "<div class=\"u\">Present perfect: have/has + past participle, for general past experience or past actions important now.</div><div class=\"u\">المضارع التام: have/has زائد التصريف التالت، للخبرة الماضية العامة أو أفعال ماضية ليها أهمية دلوقتي.</div>", "n": 1, "i": 55, "a": "tefl-16-049", "x": "6db1f1b6"}, {"t": "learn", "h": "<div class=\"u\">Present continuous: am/is/are + verb-ing, for now or around now, and for fixed future plans.</div><div class=\"u\">المضارع المستمر: am/is/are زائد الفعل زائد ing، لدلوقتي أو حوالين دلوقتي، وللخطط المستقبلية الثابتة.</div>", "n": 1, "i": 56, "a": "tefl-16-050", "x": "ddfc9442"}, {"t": "learn", "h": "<div class=\"u\">Going to future: be + going to + base verb, for intentions and predictions.</div><div class=\"u\">مستقبل going to: be زائد going to زائد المصدر، للنوايا والتوقعات.</div>", "n": 1, "i": 57, "a": "tefl-16-051", "x": "02e62288"}, {"t": "learn", "h": "<div class=\"u\">Non-action verbs: state verbs like know, like, be. They do not normally take the continuous form.</div><div class=\"u\">أفعال الحالة (non-action): زي know وlike وbe. عادة مبتاخدش صيغة المستمر.</div>", "n": 1, "i": 58, "a": "tefl-16-052", "x": "d9d8aba1"}, {"t": "learn", "h": "<div class=\"u\">CASSIAL: Aitken's checklist for teaching a tense: Choose, Analyse, Sequence, Select, Identify context, Auxiliary materials, Learner error.</div><div class=\"u\">CASSIAL: قائمة أيتكين لتدريس زمن: اختار، حلّل، رتّب، انتقي، حدّد السياق، مواد مساعدة، أخطاء المتعلم.</div>", "n": 1, "i": 59, "a": "tefl-16-053", "x": "5ed8cfeb"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 60}, {"t": "learn", "h": "<div class=\"u\">Past simple needs a specific time; present perfect talks about general experience with no time. So: I went in 2006, never I have been in 2006.</div><div class=\"u\">الماضي البسيط محتاج وقت محدد؛ المضارع التام بيتكلم عن خبرة عامة من غير وقت. يعني: I went in 2006، ومستحيل I have been in 2006.</div>", "n": 1, "i": 61, "a": "tefl-16-054", "x": "8549feb0"}, {"t": "learn", "h": "<div class=\"u\">Present simple for habits; present continuous for now and for fixed future plans.</div><div class=\"u\">المضارع البسيط للعادات؛ المضارع المستمر لدلوقتي وللخطط المستقبلية الثابتة.</div>", "n": 1, "i": 62, "a": "tefl-16-055", "x": "c781a755"}, {"t": "learn", "h": "<div class=\"u\">Future forms: present continuous for arrangements, going to for intentions, will for instant decisions and promises, will be + -ing for actions in progress ahead.</div><div class=\"u\">تراكيب المستقبل: المضارع المستمر للمواعيد، going to للنوايا، will للقرارات اللحظية والوعود، will be زائد ing للأفعال الشغالة قدام.</div>", "n": 1, "i": 63, "a": "tefl-16-056", "x": "848f91a2"}, {"t": "learn", "h": "<div class=\"u\">Perfect aspect links two times: have/has + past participle, had + past participle, will have + past participle; add been + -ing for the continuous versions.</div><div class=\"u\">الجانب التام بيربط وقتين: have/has زائد التصريف التالت، had زائد التصريف التالت، will have زائد التصريف التالت؛ وضيف been زائد ing للنسخ المستمرة.</div>", "n": 1, "i": 64, "a": "tefl-16-057", "x": "1d73ae66"}, {"t": "learn", "h": "<div class=\"u\">Non-action verbs like know and like take the simple perfect, not the continuous: I have known her since school.</div><div class=\"u\">أفعال الحالة زي know وlike بتاخد التام البسيط مش المستمر: I have known her since school.</div>", "n": 1, "i": 65, "a": "tefl-16-058", "x": "510d2f80"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 66}, {"t": "mc", "q": "Which tense talks about general past experience with no specific time?<br>أنهي زمن بيتكلم عن خبرة ماضية عامة من غير وقت محدد؟", "opts": ["present perfect | المضارع التام", "past simple | الماضي البسيط", "past continuous | الماضي المستمر"], "ans": 0, "why": "The present perfect is for experience without a time reference. The past simple needs a specific time. | المضارع التام للخبرة من غير وقت. الماضي البسيط محتاج وقت محدد.", "ex": ["Correct. | صح.", "No. The past simple requires a specific time period. | غلط: الماضي البسيط بيشترط وقت محدد.", "No. The past continuous is for actions in progress at a past moment. | غلط: الماضي المستمر للأفعال الشغالة في لحظة ماضية."], "n": 1, "i": 67, "h": ""}, {"t": "mc", "q": "Which tense requires a specific time period, like in 2006 or yesterday?<br>أنهي زمن بيشترط وقت محدد، زي in 2006 أو yesterday؟", "opts": ["past simple | الماضي البسيط", "present perfect | المضارع التام", "future perfect | المستقبل التام"], "ans": 0, "why": "A specific time reference forces the past simple: I went to Brazil in 2006. | الوقت المحدد بيفرض الماضي البسيط: I went to Brazil in 2006.", "ex": ["Correct. | صح.", "No. The present perfect never takes a specific past time. | غلط: المضارع التام مابياخدش وقت ماضي محدد.", "No. That one points forward, not back. | غلط: ده بيبص قدام مش ورا."], "n": 1, "i": 68, "h": ""}, {"t": "mc", "q": "How do we form the present perfect?<br>بنكوّن المضارع التام إزاي؟", "opts": ["have/has + past participle | have/has + التصريف التالت", "have/has + verb + -ing | have/has + الفعل + ing", "had + past participle | had + التصريف التالت"], "ans": 0, "why": "Have or has plus the past participle: I have been to Brazil. | have أو has زائد التصريف التالت: I have been to Brazil.", "ex": ["Correct. | صح.", "No. That pattern does not make the present perfect. | غلط: التركيب ده مش بيعمل المضارع التام.", "No. Had + past participle is the past perfect. | غلط: had زائد التصريف التالت ده الماضي التام."], "n": 1, "i": 69, "h": ""}, {"t": "tf", "q": "The present perfect talks about the present, not the past.<br>المضارع التام بيتكلم عن المضارع مش عن الماضي.", "ans": false, "why": "Despite its name, it still refers to the past, often with importance now. | بالرغم من اسمه، هو لسه بيتكلم عن الماضي، وغالبًا بأهمية للحاضر.", "ex": ["Wrong. It is about the past. | غلط: هو عن الماضي.", "Correct. | صح."], "n": 1, "i": 70, "h": ""}, {"t": "mc", "q": "She is going to have a baby! This structure expresses:<br>She is going to have a baby! التركيب ده بيعبّر عن:", "opts": ["a future intention or prediction | نية أو توقع مستقبلي", "an instant decision | قرار لحظي", "a fixed arrangement with a time | ميعاد ثابت بوقت"], "ans": 0, "why": "Going to + base verb is for intentions and predictions. | going to زائد المصدر للنوايا والتوقعات.", "ex": ["Correct. | صح.", "No. Instant decisions take will. | غلط: القرارات اللحظية بتاخد will.", "No. Fixed arrangements take the present continuous. | غلط: المواعيد الثابتة بتاخد المضارع المستمر."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "I promise I will do my homework later. Why will here?<br>I promise I will do my homework later. ليه will هنا؟", "opts": ["promises take will + base verb | الوعود بتاخد will + المصدر", "promises take going to | الوعود بتاخد going to", "promises take present simple | الوعود بتاخد المضارع البسيط"], "ans": 0, "why": "Will covers predictions, instant decisions, promises, suggestions, and offers. | will بتغطي التوقعات والقرارات اللحظية والوعود والاقتراحات والعروض.", "ex": ["Correct. | صح.", "No. Going to is for intentions and predictions. | غلط: going to للنوايا والتوقعات.", "No. The present simple is for habits and facts. | غلط: المضارع البسيط للعادات والحقائق."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "I was sleeping when you called. Which tense is was sleeping?<br>I was sleeping when you called. زمن was sleeping إيه؟", "opts": ["past continuous | الماضي المستمر", "past simple | الماضي البسيط", "past perfect | الماضي التام"], "ans": 0, "why": "Was/were + verb-ing: an action in progress interrupted in the past. | was/were زائد الفعل زائد ing: فعل كان شغال واتقطع في الماضي.", "ex": ["Correct. | صح.", "No. The past simple is called, the short interrupting action. | غلط: الماضي البسيط هو called، الفعل القصير اللي قطع.", "No. The past perfect needs had + past participle. | غلط: الماضي التام محتاج had زائد التصريف التالت."], "n": 1, "i": 73, "h": ""}, {"t": "tf", "q": "We can normally use non-action verbs like know and like in continuous tenses.<br>نقدر عادة نستخدم أفعال الحالة زي know وlike في الأزمنة المستمرة.", "ans": false, "why": "No. State verbs take simple forms: I have known her since school, not I have been knowing her. | لأ. أفعال الحالة بتاخد الصيغ البسيطة: I have known her since school، مش I have been knowing her.", "ex": ["Wrong. State verbs avoid the continuous. | غلط: أفعال الحالة بتتجنب المستمر.", "Correct. | صح."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "I could not get in because I had forgotten my keys. Why past perfect?<br>I could not get in because I had forgotten my keys. ليه ماضي تام؟", "opts": ["an earlier past inside a past story | ماضي أقدم جوه حكاية ماضية", "a habit in the past | عادة في الماضي", "a future plan | خطة مستقبلية"], "ans": 0, "why": "We were already in the past (could not get in) and needed an earlier past (had forgotten). | كنا أصلًا في الماضي (مقدرتش أدخل) واحتجنا ماضي أقدم (كنت نسيت).", "ex": ["Correct. | صح.", "No. Habits take the past simple. | غلط: العادات بتاخد الماضي البسيط.", "No. This is about the past, not the future. | غلط: ده عن الماضي مش المستقبل."], "n": 1, "i": 75, "h": ""}, {"t": "mc", "q": "Don't worry, I will have finished by 5pm. Which tense?<br>Don't worry, I will have finished by 5pm. ده أنهي زمن؟", "opts": ["future perfect | المستقبل التام", "future continuous | المستقبل المستمر", "present perfect | المضارع التام"], "ans": 0, "why": "Will + have + past participle: finished before a future point. | will زائد have زائد التصريف التالت: هيكون خلص قبل نقطة مستقبلية.", "ex": ["Correct. | صح.", "No. That would be will be finishing, in progress then. | غلط: ده هيبقى will be finishing، شغال ساعتها.", "No. The present perfect cannot point to a future deadline. | غلط: المضارع التام مابيتكلمش عن ميعاد مستقبلي."], "n": 1, "i": 76, "h": ""}, {"t": "mc", "q": "He had been cleaning the car for an hour before the rain stopped him. The form is:<br>He had been cleaning the car for an hour قبل ما المطر وقفه. التكوين هو:", "opts": ["had + been + verb-ing | had + been + الفعل-ing", "had + past participle | had + التصريف التالت", "have + been + verb-ing | have + been + الفعل-ing"], "ans": 0, "why": "Past perfect continuous: an action in progress up to another past moment. | الماضي التام المستمر: فعل كان شغال لحد لحظة ماضية تانية.", "ex": ["Correct. | صح.", "No. That is the past perfect simple, for a finished earlier past. | غلط: ده الماضي التام البسيط، لماضي أقدم خلص.", "No. Have been is present perfect continuous, tied to now. | غلط: have been ده المضارع التام المستمر، مربوط بدلوقتي."], "n": 1, "i": 77, "h": ""}, {"t": "tf", "q": "English has one single verb form for the future, like Arabic.<br>الإنجليزية فيها صيغة فعل واحدة للمستقبل، زي العربي.", "ans": false, "why": "No. English uses several structures: present continuous, going to, will, and will be + -ing, each with its own meaning. | لأ. الإنجليزية بتستخدم تراكيب مختلفة: المضارع المستمر، going to، will، وwill be زائد ing، وكل واحد ليه معناه.", "ex": ["Wrong. There are several future structures. | غلط: فيه تراكيب مستقبل كتير.", "Correct. | صح."], "n": 1, "i": 78, "h": ""}, {"t": "recall", "q": "What does CASSIAL stand for, and what is it for?<br>CASSIAL اختصار لإيه، وهدفها إيه؟", "a": "Choose, Analyse, Sequence, Select, Identify context, Auxiliary materials, Learner error. A checklist for preparing to teach a tense.<br>اختار، حلّل، رتّب، انتقي، حدّد السياق، مواد مساعدة، أخطاء المتعلم. قائمة تجهيز لتدريس أي زمن.", "n": 1, "i": 79, "h": ""}, {"t": "recall", "q": "Give the form of each: present perfect, past perfect, future perfect continuous.<br>اديني تكوين كل واحد: المضارع التام، الماضي التام، المستقبل التام المستمر.", "a": "have/has + past participle; had + past participle; will + have + been + verb-ing.<br>have/has زائد التصريف التالت؛ had زائد التصريف التالت؛ will زائد have زائد been زائد الفعل-ing.", "n": 1, "i": 80, "h": ""}, {"t": "write", "q": "Explain why we say I went to Brazil in 2006 but not I have been to Brazil in 2006 (3-4 sentences).<br>اشرح ليه بنقول I went to Brazil in 2006 ومينفعش I have been to Brazil in 2006 (٣-٤ جمل).", "key": "tefl-16:1", "a": "Both tenses talk about the past, but they do different jobs. The past simple needs a specific time reference, and in 2006 is a specific time. The present perfect talks about general past experience with no specific time, so it cannot carry in 2006. That is why the first sentence works and the second does not.<br>الزمنين بيتكلموا عن الماضي، بس كل واحد ليه شغلانة. الماضي البسيط محتاج وقت محدد، وin 2006 وقت محدد. المضارع التام بيتكلم عن خبرة ماضية عامة من غير وقت محدد، فمابيقدرش يشيل in 2006. عشان كده الجملة الأولى صح والتانية لأ.", "n": 1, "i": 81, "h": ""}, {"t": "write", "q": "A student says: I have been knowing her since school. Correct the mistake and explain it (2-3 sentences).<br>طالب قال: I have been knowing her since school. صحّح الغلط واشرحه (٢-٣ جمل).", "key": "tefl-16:2", "a": "Know is a non-action, state verb, and state verbs do not take continuous forms. For an action or state continuing from the past to now with a non-action verb, we use the present perfect simple: I have known her since school. The continuous perfect is for action verbs, like I have been learning English.<br>know فعل حالة (non-action)، وأفعال الحالة مابتاخدش صيغ مستمرة. لحاجة بدأت في الماضي ولسه شغالة مع فعل حالة، بنستخدم المضارع التام البسيط: I have known her since school. التام المستمر لأفعال الحركة، زي I have been learning English.", "n": 1, "i": 82, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the FULL tense table, all twelve tenses with positive, question, and negative forms.</div><div class=\"u\">الدرس الجاي: جدول الأزمنة الكامل، الأزمنة الاتناشر كلها بصيغ المثبت والسؤال والمنفي.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 83}];</script>
