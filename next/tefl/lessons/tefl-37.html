<h1>عالم تيفل ٣٧: النطق وخريطة الأصوات</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٣٧</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-37";window.STEPS=[{"t": "section", "h": "What pronunciation is + aims | يعني إيه النطق + الأهداف", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Pronunciation simply refers to how a person articulates specific sounds.</div><div class=\"u\">النطق ببساطة بيشير لإزاي الشخص بيلفظ أصوات معينة.</div>", "n": 1, "i": 1, "a": "tefl-37-001", "x": "822124f6"}, {"t": "learn", "h": "<div class=\"u\">Do not confuse this with phonological or phonemic awareness. Pronunciation is also very important.</div><div class=\"u\">ماتلخبطش ده مع الوعي الصوتي أو الفونيمي. النطق كمان مهم جدًا.</div>", "n": 1, "i": 2, "a": "tefl-37-002", "x": "383ee8b7"}, {"t": "learn", "h": "<div class=\"u\">The overall aim of teaching pronunciation is for the learner to develop spoken English so that the learner is easy to understand when speaking.</div><div class=\"u\">الهدف العام من تعليم النطق إن المتعلم يطوّر إنجليزي منطوق بحيث يبقى سهل الفهم وهو بيتكلم.</div>", "n": 1, "i": 3, "a": "tefl-37-003", "x": "0d43c61b"}, {"t": "learn", "h": "<div class=\"u\">And so that it gives the learner a positive image of himself as a speaker of English.</div><div class=\"u\">وعشان يدّي المتعلم صورة إيجابية عن نفسه كمتكلم إنجليزي.</div>", "n": 1, "i": 4, "a": "tefl-37-004", "x": "46526b8c"}, {"t": "section", "h": "How to teach it | بتتعلّم إزاي", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">Here is what to do and what not to do when teaching pronunciation.</div><div class=\"u\">دي اللي تعمله واللي ماتعملوش في تعليم النطق.</div>", "n": 1, "i": 6, "a": "tefl-37-005", "x": "193f4e3b"}, {"t": "learn", "h": "<div class=\"u\">One: ensure pronunciation work is an integral part of communication.</div><div class=\"u\">واحد: خلّي شغل النطق جزء أساسي من التواصل.</div>", "n": 1, "i": 7, "a": "tefl-37-006", "x": "72b86411"}, {"t": "learn", "h": "<div class=\"u\">Students will do well if the pronunciation episode is not run in isolation but becomes an integral part of communication in the class.</div><div class=\"u\">الطلبة هيبلوا كويس لو فقرة النطق مش شغالة منعزلة بس بقت جزء أساسي من تواصل الفصل.</div>", "n": 1, "i": 8, "a": "tefl-37-007", "x": "0fdde84d"}, {"t": "learn", "h": "<div class=\"u\">Two: do not aim for perfection.</div><div class=\"u\">اتنين: ماتهدفش للكمال.</div>", "n": 1, "i": 9, "a": "tefl-37-008", "x": "a2671e55"}, {"t": "learn", "h": "<div class=\"u\">The goal in the communicative class is not perfect pronunciation. Who has this, anyway? Who says it is perfect? And how can it be proved?</div><div class=\"u\">الهدف في الفصل التواصلي مش النطق المثالي. مين عنده ده أصلًا؟ ومين قال إنه مثالي؟ وإزاي ممكن يتثبت؟</div>", "n": 1, "i": 10, "a": "tefl-37-009", "x": "92de1fd7"}, {"t": "learn", "h": "<div class=\"u\">The realistic goals: develop intelligibility, the degree to which the learner's speech can be understood in different language situations.</div><div class=\"u\">الأهداف الواقعية: طوّر الوضوح، درجة إن كلام المتعلم يتفهم في مواقف لغوية مختلفة.</div>", "n": 1, "i": 11, "a": "tefl-37-010", "x": "2982bc65"}, {"t": "learn", "h": "<div class=\"u\">Also increase communication ability, and increase self-confidence in speaking the language and in listening and understanding it.</div><div class=\"u\">وكمان زوّد قدرة التواصل، وزوّد الثقة بالنفس في تكلّم اللغة وفي سماعها وفهمها.</div>", "n": 1, "i": 12, "a": "tefl-37-011", "x": "88d12d4e"}, {"t": "learn", "h": "<div class=\"u\">Three: give lots of practice. Remember: the more practice given, the better the pronunciation will be.</div><div class=\"u\">تلاتة: وفّر تدريب كتير. افتكر: كل ما التدريب يزيد، النطق هيتحسّن.</div>", "n": 1, "i": 13, "a": "tefl-37-012", "x": "5a9f0da3"}, {"t": "learn", "h": "<div class=\"u\">All the activities from the phonological and phonemic awareness unit can enhance pronunciation, as can the phonemic chart.</div><div class=\"u\">كل أنشطة وحدة الوعي الصوتي والفونيمي تقدر تعزّز النطق، وزيها خريطة الفونيمات.</div>", "n": 1, "i": 14, "a": "tefl-37-013", "x": "d0710ecc"}, {"t": "section", "h": "The phonemic chart and symbols | خريطة الفونيمات والرموز", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">The phonemic chart is an alternative method of approaching the teaching and learning of English pronunciation.</div><div class=\"u\">خريطة الفونيمات طريقة بديلة للتعامل مع تعليم وتعلم نطق الإنجليزي.</div>", "n": 1, "i": 16, "a": "tefl-37-014", "x": "971f3e44"}, {"t": "learn", "h": "<div class=\"u\">A phonemic chart provides a set of symbols. Each one represents an individual sound of the language, irrespective of the way it appears in the standard written script.</div><div class=\"u\">خريطة الفونيمات بتوفر مجموعة رموز. كل واحد بيمثل صوت مفرد من اللغة، بغض النظر عن شكله في الكتابة العادية.</div>", "n": 1, "i": 17, "a": "tefl-37-015", "x": "0da6a77e"}, {"t": "learn", "h": "<div class=\"u\">Each phonemic symbol represents a phoneme, a single unit of sound that, alone or combined, can carry linguistic meaning.</div><div class=\"u\">كل رمز فونيمي بيمثل فونيم، وحدة صوت واحدة، لوحدها أو متجمعة، تقدر تحمل معنى لغوي.</div>", "n": 1, "i": 18, "a": "tefl-37-016", "x": "fbe00f9d"}, {"t": "learn", "h": "<div class=\"u\">Some symbols look like letters from the English alphabet. But remember: the normal alphabet gives us letters for writing a word, while the phonetic alphabet tells us how they sound.</div><div class=\"u\">بعض الرموز شكلها زي حروف الأبجدية الإنجليزية. بس افتكر: الأبجدية العادية بتدّينا حروف لكتابة الكلمة، بينما الأبجدية الصوتية بتقولنا صوتهم إيه.</div>", "n": 1, "i": 19, "a": "tefl-37-017", "x": "a151f495"}, {"t": "learn", "h": "<div class=\"u\">Example: the letter i in fit is spelt phonetically with the phoneme /I/. The same letter in pile has a different pronunciation, the phoneme /ai/.</div><div class=\"u\">مثال: حرف الآي في مناسب بيتكتب صوتيًا بالفونيم آي القصيرة. نفس الحرف في كومة ليه نطق مختلف، الفونيم آي الطويلة.</div>", "n": 1, "i": 20, "a": "tefl-37-018", "x": "893bcb33"}, {"t": "learn", "h": "<div class=\"u\">So do not get confused just because a phoneme looks like a normal letter.</div><div class=\"u\">فماتتلخبطش بس لأن الفونيم شكله زي حرف عادي.</div>", "n": 1, "i": 21, "a": "tefl-37-019", "x": "97fdd16d"}, {"t": "section", "h": "Vowels, diphthongs, consonants | متحركات ومزدوجات وسوaken", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">Phonemes are divided into vowel sounds, diphthongs, and consonants, according to how we make the sound with our mouths.</div><div class=\"u\">الفونيمات بتتقسم لأصوات متحركة، وأصوات متحركة مزدوجة، وأسوكنة، حسب إزاي بنعمل الصوت ببؤنا.</div>", "n": 1, "i": 23, "a": "tefl-37-020", "x": "cadf0824"}, {"t": "learn", "h": "<div class=\"u\">Vowel sounds are made when the mouth is open and not blocked by the tongue, for example /e/ as in men.</div><div class=\"u\">الأصوات المتحركة بتتعمل لما البؤ يكون مفتوح ومش متسد باللسان، مثال إيه زي في رجالة.</div>", "n": 1, "i": 24, "a": "tefl-37-021", "x": "030ca691"}, {"t": "learn", "h": "<div class=\"u\">Diphthongs are sounds made when one vowel sound transforms into another in a single syllable, like the /ei/ sound in say.</div><div class=\"u\">المتحركات المزدوجة أصوات بتتعمل لما صوت متحرك يتحوّل لمتحرك تاني في مقطع واحد، زي صوت إيه آي في يقول.</div>", "n": 1, "i": 25, "a": "tefl-37-022", "x": "12dd2c8b"}, {"t": "learn", "h": "<div class=\"u\">Consonant sounds occur when the tongue, lips, or teeth partly block the sound, like the /m/ in milk.</div><div class=\"u\">الأصوات الساكنة بتحصل لما اللسان أو الشفايف أو السنان تسد الصوت جزئيًا، زي الميم في لبن.</div>", "n": 1, "i": 26, "a": "tefl-37-023", "x": "b7e6c95a"}, {"t": "learn", "h": "<div class=\"u\">Vowels are made with the mouth open and the airway unobstructed, while consonants briefly obstruct the flow of air.</div><div class=\"u\">المتحركات بتتعمل والبؤ مفتوح ومجرى الهوا مش متسد، بينما السواكن بتسد تدفق الهوا للحظة.</div>", "n": 1, "i": 27, "a": "tefl-37-024", "x": "46bc67c0"}, {"t": "learn", "h": "<div class=\"u\">The exact number of vowels depends on regional accent, but there are more than twenty English vowel sounds.</div><div class=\"u\">العدد بالظبط للمتحركات بيعتمد على اللهجة المحلية، بس في أكتر من عشرين صوت متحرك في الإنجليزي.</div>", "n": 1, "i": 28, "a": "tefl-37-025", "x": "24fa880b"}, {"t": "learn", "h": "<div class=\"u\">A diphthong is a vowel sound composed of a sequence of two vowels. The vowel in so begins with the o sound of hot and glides into the u sound of put.</div><div class=\"u\">المتحرك المزدوج صوت متحرك متكوّن من تسلسل متحركين. المتحرك في كده بيبدأ بصوت الأو بتاع سخن وبينزلق لصوت الأو بتاع يحط.</div>", "n": 1, "i": 29, "a": "tefl-37-026", "x": "cf6878ac"}, {"t": "learn", "h": "<div class=\"u\">Other diphthongs: the vowel sounds in high and late.</div><div class=\"u\">متحركات مزدوجة تانية: أصوات المتحرك في عالي ومتأخر.</div>", "n": 1, "i": 30, "a": "tefl-37-027", "x": "5df59b7f"}, {"t": "learn", "h": "<div class=\"u\">For consonants: the first sound in mark is made by closing the lips briefly; the last sound is made by pressing the blade of the tongue up against the hard palate.</div><div class=\"u\">للسواكن: أول صوت في علامة بيتعمل بقفل الشفايف للحظة؛ وآخر صوت بيتعمل بضغط شفرة اللسان على الحنك الصلب.</div>", "n": 1, "i": 31, "a": "tefl-37-028", "x": "abd4ff32"}, {"t": "learn", "h": "<div class=\"u\">There are twenty-two consonants in spoken English.</div><div class=\"u\">في اتنين وعشرين ساكن في الإنجليزي المنطوق.</div>", "n": 1, "i": 32, "a": "tefl-37-029", "x": "b655ca2b"}, {"t": "section", "h": "Charts, reluctance, and good news | الخرايط والتردد والأخبار الحلوة", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">Practice answer: the underlined sounds match like this: these is /ð/, hat is /æ/, alone is /ə/, thin is /θ/.</div><div class=\"u\">إجابة التمرين: الأصوات المتعلّم تحتها بتتطابق كده: دول هي الزال، قبعة هي الألف المفتوحة، لوحده هي الشوا، رفيع هي الثاء.</div>", "n": 1, "i": 34, "a": "tefl-37-030", "x": "b8420ed1"}, {"t": "learn", "h": "<div class=\"u\">There are a few different phonemic charts. You can use one from your course or the British Council phonemic chart.</div><div class=\"u\">في كذا خريطة فونيمات مختلفة. تقدر تستخدم واحدة من كورسك أو خريطة الفونيمات بتاعة المجلس البريطاني.</div>", "n": 1, "i": 35, "a": "tefl-37-031", "x": "3128d47c"}, {"t": "learn", "h": "<div class=\"u\">On the British Council site you can see the symbols, hear all the sounds, and download the chart to your computer or tablet.</div><div class=\"u\">على موقع المجلس البريطاني تقدر تشوف الرموز، وتسمع كل الأصوات، وتنزّل الخريطة على الكمبيوتر أو التابلت بتاعك.</div>", "n": 1, "i": 36, "a": "tefl-37-032", "x": "7300fa6e"}, {"t": "learn", "h": "<div class=\"u\">It may take several weeks to familiarise yourself with all the sounds. But it will be worth it. Start familiarising yourself with the chart now, in preparation for your teaching career.</div><div class=\"u\">ممكن تاخد كذا أسبوع عشان تتعود على كل الأصوات. بس هتستاهل. ابدأ اتعود على الخريطة من دلوقتي، تحضيرًا لمسيرتك في التدريس.</div>", "n": 1, "i": 37, "a": "tefl-37-033", "x": "818daab9"}, {"t": "learn", "h": "<div class=\"u\">With basic knowledge of this system and a good English-English dictionary, most older learners should be able to discover the pronunciation of unknown words without your help.</div><div class=\"u\">بمعرفة أساسية بالنظام ده وقاموس إنجليزي-إنجليزي كويس، معظم المتعلمين الأكبر سنًا المفروض يقدروا يكتشفوا نطق الكلمات المجهولة من غير مساعدتك.</div>", "n": 1, "i": 38, "a": "tefl-37-034", "x": "869a3f69"}, {"t": "learn", "h": "<div class=\"u\">Many teachers are reluctant to introduce the phonemic chart. They feel the time spent learning the system is not justified.</div><div class=\"u\">مدرسين كتير مترددين في تقديم خريطة الفونيمات. حاسين إن الوقت المبذول في تعلم النظام مش مبرر.</div>", "n": 1, "i": 39, "a": "tefl-37-035", "x": "9dfb7d51"}, {"t": "learn", "h": "<div class=\"u\">They feel learners already have an uphill task with English spelling, without learning another alphabet. And they feel unsure about the system.</div><div class=\"u\">حاسين إن المتعلمين عندهم أصلًا مهمة شاقة مع إملاء الإنجليزي، من غير ما يتعلّموا أبجدية تانية. وحاسين إنهم مش واثقين من النظام.</div>", "n": 1, "i": 40, "a": "tefl-37-036", "x": "39f2c8a0"}, {"t": "learn", "h": "<div class=\"u\">But learning the phonemic alphabet is not as difficult as it first appears. Introduce it piece by piece as part of your daily lesson plan.</div><div class=\"u\">بس تعلم الأبجدية الفونيمية مش بالصعوبة اللي باينة أول مرة. قدّمها قطعة قطعة كجزء من خطتك اليومية للدروس.</div>", "n": 1, "i": 41, "a": "tefl-37-037", "x": "ffd2a05f"}, {"t": "learn", "h": "<div class=\"u\">With a little application, the system often becomes second nature.</div><div class=\"u\">مع شوية ممارسة، النظام في الغالب بيبقى طبيعة تانية.</div>", "n": 1, "i": 42, "a": "tefl-37-038", "x": "cf9d7061"}, {"t": "section", "h": "Important notes | ملاحظات مهمة", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Some important notes.</div><div class=\"u\">شوية ملاحظات مهمة.</div>", "n": 1, "i": 44, "a": "tefl-37-039", "x": "e3f8f54a"}, {"t": "learn", "h": "<div class=\"u\">Languages across the world have unique phonemic systems. For second-language learners, the phonemic system of their first language commonly influences their production of English sounds.</div><div class=\"u\">لغات العالم كلها عندها أنظمة فونيمية فريدة. لمتعلمي اللغة التانية، النظام الفونيمي للغتهم الأم غالبًا بيأثر في إنتاجهم لأصوات الإنجليزي.</div>", "n": 1, "i": 45, "a": "tefl-37-040", "x": "5ed87642"}, {"t": "learn", "h": "<div class=\"u\">In an English-speaking country, consider dialectal differences when using the phonemic charts.</div><div class=\"u\">في بلد بتتكلم إنجليزي، راعي الفروق اللهجية لما تستخدم خرايط الفونيمات.</div>", "n": 1, "i": 46, "a": "tefl-37-041", "x": "7f5c4df3"}, {"t": "learn", "h": "<div class=\"u\">Note: there is not always a correspondence between the number of letters and the number of sounds.</div><div class=\"u\">لاحظ: مش دايمًا في تطابق بين عدد الحروف وعدد الأصوات.</div>", "n": 1, "i": 47, "a": "tefl-37-042", "x": "66a983f6"}, {"t": "learn", "h": "<div class=\"u\">Also note: most English dictionaries show where the stress of a word is by using a small raised mark.</div><div class=\"u\">وكمان لاحظ: معظم القواميس الإنجليزية بتوضح مكان النبر في الكلمة بعلامة صغيرة مرفوعة.</div>", "n": 1, "i": 48, "a": "tefl-37-043", "x": "d3b3e281"}, {"t": "learn", "h": "<div class=\"u\">Give the chart a go!</div><div class=\"u\">جرّب الخريطة!</div>", "n": 1, "i": 49, "a": "tefl-37-044", "x": "58408c54"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">pronunciation: how a person articulates specific sounds.</div><div class=\"u\">النطق: إزاي الشخص بيلفظ أصوات معينة.</div>", "n": 1, "i": 51, "a": "tefl-37-045", "x": "97f490b2"}, {"t": "learn", "h": "<div class=\"u\">articulate: to produce a speech sound clearly.</div><div class=\"u\">يلفظ: يطلّع صوت كلام بوضوح.</div>", "n": 1, "i": 52, "a": "tefl-37-046", "x": "9d21dc27"}, {"t": "learn", "h": "<div class=\"u\">phonemic chart: a chart of symbols, one for each sound of the language.</div><div class=\"u\">خريطة الفونيمات: خريطة رموز، واحد لكل صوت في اللغة.</div>", "n": 1, "i": 53, "a": "tefl-37-047", "x": "367c996e"}, {"t": "learn", "h": "<div class=\"u\">phonemic symbol: a written sign representing one phoneme.</div><div class=\"u\">الرمز الفونيمي: علامة مكتوبة بتمثل فونيم واحد.</div>", "n": 1, "i": 54, "a": "tefl-37-048", "x": "0d44ea91"}, {"t": "learn", "h": "<div class=\"u\">phonetic alphabet: the set of symbols showing how words sound.</div><div class=\"u\">الأبجدية الصوتية: مجموعة الرموز اللي بتوضح الكلمات بتتنطق إزاي.</div>", "n": 1, "i": 55, "a": "tefl-37-049", "x": "afd78642"}, {"t": "learn", "h": "<div class=\"u\">vowel: a sound made with the mouth open and unblocked.</div><div class=\"u\">المتحرك: صوت بيتعمل والبؤ مفتوح ومش متسد.</div>", "n": 1, "i": 56, "a": "tefl-37-050", "x": "fff754f9"}, {"t": "learn", "h": "<div class=\"u\">diphthong: one vowel gliding into another in a single syllable.</div><div class=\"u\">المتحرك المزدوج: متحرك بينزلق لمتحرك تاني في مقطع واحد.</div>", "n": 1, "i": 57, "a": "tefl-37-051", "x": "aed20ccc"}, {"t": "learn", "h": "<div class=\"u\">consonant: a sound made by partly blocking the airflow.</div><div class=\"u\">الساكن: صوت بيتعمل بسد تدفق الهوا جزئيًا.</div>", "n": 1, "i": 58, "a": "tefl-37-052", "x": "2a9ca433"}, {"t": "learn", "h": "<div class=\"u\">hard palate: the hard roof of the mouth, behind the teeth.</div><div class=\"u\">الحنك الصلب: سقف البؤ الصلب، ورا السنان.</div>", "n": 1, "i": 59, "a": "tefl-37-053", "x": "d584d341"}, {"t": "learn", "h": "<div class=\"u\">dialect: a regional variety of a language.</div><div class=\"u\">اللهجة: نوع محلي من اللغة.</div>", "n": 1, "i": 60, "a": "tefl-37-054", "x": "5bd6a78b"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">Pronunciation is how a person articulates sounds. The aim: learners who are easy to understand and confident.</div><div class=\"u\">النطق هو إزاي الشخص بيلفظ الأصوات. الهدف: متعلمين سهل يتفهموا وواثقين.</div>", "n": 1, "i": 62, "a": "tefl-37-055", "x": "9f3abae9"}, {"t": "learn", "h": "<div class=\"u\">Keep it inside communication, skip perfection, and give lots of practice.</div><div class=\"u\">خلّيه جوه التواصل، وسيب الكمال، ووفّر تدريب كتير.</div>", "n": 1, "i": 63, "a": "tefl-37-056", "x": "2dae66e7"}, {"t": "learn", "h": "<div class=\"u\">The phonemic chart maps one symbol to one sound, separate from spelling. Vowels, diphthongs, consonants.</div><div class=\"u\">خريطة الفونيمات بترابط رمز واحد بصوت واحد، منفصل عن الهجاء. متحركات، متحركات مزدوجة، سواكن.</div>", "n": 1, "i": 64, "a": "tefl-37-057", "x": "ff07b830"}, {"t": "learn", "h": "<div class=\"u\">Teachers hesitate, but introduced piece by piece the chart becomes second nature and frees older learners with a dictionary.</div><div class=\"u\">المدرسين بيترددوا، بس لما تتقدّم قطعة قطعة الخريطة بتبقى طبيعة تانية وبتحرّر المتعلمين الأكبر بالقاموس.</div>", "n": 1, "i": 65, "a": "tefl-37-058", "x": "c309baf9"}, {"t": "learn", "h": "<div class=\"u\">Remember: the learner's first language shapes their sounds, dialects differ, and letters do not always match sounds.</div><div class=\"u\">افتكر: لغة المتعلم الأم بتشكّل أصواته، واللهجات بتختلف، والحروف مش دايمًا بتطابق الأصوات.</div>", "n": 1, "i": 66, "a": "tefl-37-059", "x": "bf6f0401"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 67}, {"t": "mc", "q": "Pronunciation refers to:<br>النطق بيشير لـ:", "opts": ["how a person articulates specific sounds | إزاي الشخص بيلفظ أصوات معينة", "the letters of a word | حروف الكلمة", "the meaning of a word | معنى الكلمة"], "ans": 0, "why": "Pronunciation is about articulating sounds, not spelling or meaning. | النطق عن لفظ الأصوات، مش الهجاء أو المعنى.", "ex": ["Correct. | صح.", "No. That is spelling. | غلط: ده إملاء.", "No. That is semantics. | غلط: ده معنى."], "n": 1, "i": 68, "h": ""}, {"t": "mc", "q": "The overall aim of teaching pronunciation is that the learner:<br>الهدف العام من تعليم النطق إن المتعلم:", "opts": ["is easy to understand and has a positive self-image | يبقى سهل الفهم وعنده صورة إيجابية عن نفسه", "sounds exactly like a native speaker | يطلّع صوت زي أهل اللغة بالظبط", "learns every phonemic symbol in one week | يتعلّم كل الرموز الفونيمية في أسبوع"], "ans": 0, "why": "The aims are intelligibility and a positive image as an English speaker, not perfection. | الأهداف هي الوضوح وصورة إيجابية كمتكلم إنجليزي، مش الكمال.", "ex": ["Correct. | صح.", "No. Perfection is not the goal. | غلط: الكمال مش الهدف.", "No. Familiarisation takes weeks, gently. | غلط: التعود بياخد أسابيع، بهدوء."], "n": 1, "i": 69, "h": ""}, {"t": "tf", "q": "A phonemic chart gives one symbol for each sound, irrespective of how the word is written.<br>خريطة الفونيمات بتدّي رمز واحد لكل صوت، بغض النظر عن إزاي الكلمة مكتوبة.", "ans": true, "why": "True. The symbols represent sounds, not spelling. | صح. الرموز بتمثل أصوات، مش هجاء.", "ex": ["Correct. | صح.", "Wrong. That is exactly what it does. | غلط: ده بالظبط اللي بتعمله."], "n": 1, "i": 70, "h": ""}, {"t": "mc", "q": "The letter i sounds different in fit and pile. This shows:<br>حرف الآي صوته مختلف في مناسب وكومة. ده بيوضح:", "opts": ["letters and sounds do not always match one-to-one | الحروف والأصوات مش دايمًا متطابقين واحد لواحد", "the i is always silent | الآي دايمًا ساكتة", "pile is spelt wrong | كومة مكتوبة غلط"], "ans": 0, "why": "Fit uses /I/ and pile uses /ai/: same letter, different phonemes. | مناسب بتستخدم آي قصيرة وكومة بتستخدم آي طويلة: نفس الحرف، فونيمات مختلفة.", "ex": ["Correct. | صح.", "No. It is pronounced in both. | غلط: بتتنطق في الاتنين.", "No. The spelling is fine. | غلط: الهجاء سليم."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "A diphthong is:<br>المتحرك المزدوج هو:", "opts": ["one vowel gliding into another in a single syllable | متحرك بينزلق لمتحرك تاني في مقطع واحد", "two consonants together | ساكنين مع بعض", "a silent vowel | متحرك ساكت"], "ans": 0, "why": "Like /ei/ in say: one vowel transforms into another in one syllable. | زي إيه آي في يقول: متحرك بيتحوّل لمتحرك تاني في مقطع واحد.", "ex": ["Correct. | صح.", "No. It is about vowels. | غلط: هو عن المتحركات.", "No. Both vowels are heard. | غلط: المتحركين بيتسمعوا."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "Consonant sounds are made when:<br>الأصوات الساكنة بتتعمل لما:", "opts": ["the tongue, lips or teeth partly block the airflow | اللسان أو الشفايف أو السنان تسد تدفق الهوا جزئيًا", "the mouth is fully open and unblocked | البؤ يكون مفتوح بالكامل ومش متسد", "two vowels glide together | متحركين ينزلقوا مع بعض"], "ans": 0, "why": "Like /m/ in milk: the airflow is briefly obstructed. | زي الميم في لبن: تدفق الهوا بيتسد للحظة.", "ex": ["Correct. | صح.", "No. That describes a vowel. | غلط: ده وصف المتحرك.", "No. That describes a diphthong. | غلط: ده وصف المتحرك المزدوج."], "n": 1, "i": 73, "h": ""}, {"t": "tf", "q": "There are more than twenty English vowel sounds.<br>في أكتر من عشرين صوت متحرك في الإنجليزي.", "ans": true, "why": "True. The exact number depends on regional accent. | صح. العدد بالظبط بيعتمد على اللهجة المحلية.", "ex": ["Correct. | صح.", "Wrong. Twenty-plus, depending on accent. | غلط: أكتر من عشرين، حسب اللهجة."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "Why are many teachers reluctant to introduce the phonemic chart?<br>ليه مدرسين كتير مترددين في تقديم خريطة الفونيمات؟", "opts": ["they doubt the time is justified and feel unsure of the system | شاكين إن الوقت مبرر ومش واثقين من النظام", "the chart costs too much money | الخريطة غالية أوي", "students refuse to look at it | الطلبة بيرفضوا يبصوا عليها"], "ans": 0, "why": "They also feel learners already struggle with spelling without another alphabet. | هُم كمان حاسين إن المتعلمين بيعانوا أصلًا مع الإملاء من غير أبجدية تانية.", "ex": ["Correct. | صح.", "No. Charts are free to download. | غلط: الخرايط بتتنزّل مجانًا.", "No. The reluctance is the teachers'. | غلط: التردد بتاع المدرسين."], "n": 1, "i": 75, "h": ""}, {"t": "recall", "q": "What are the three realistic goals for pronunciation teaching?<br>إيه الأهداف الواقعية التلاتة لتعليم النطق؟", "a": "Develop intelligibility, increase communication ability, and increase self-confidence in speaking, listening and understanding the language.<br>تطوير الوضوح، وزيادة قدرة التواصل، وزيادة الثقة بالنفس في تكلّم اللغة وسماعها وفهمها.", "n": 1, "i": 76, "h": ""}, {"t": "recall", "q": "Name the three groups phonemes are divided into, with one example each.<br>اذكر المجموعات التلاتة اللي بتتقسم ليها الفونيمات، مع مثال لكل واحدة.", "a": "Vowels, like /e/ in men; diphthongs, like /ei/ in say; consonants, like /m/ in milk.<br>متحركات، زي إيه في رجالة؛ متحركات مزدوجة، زي إيه آي في يقول؛ سواكن، زي الميم في لبن.", "n": 1, "i": 77, "h": ""}, {"t": "write", "q": "Why is perfect pronunciation not the goal? (3-4 sentences)<br>ليه النطق المثالي مش هو الهدف؟ (٣-٤ جمل).", "key": "tefl-37:1", "a": "Perfect pronunciation is nearly impossible to define. Who has it, who says it is perfect, and how could it be proved? The realistic aim is intelligibility: speech that can be understood in different situations. Add communication ability and self-confidence in speaking and listening, and you have goals a class can actually reach.<br>النطق المثالي شبه مستحيل يتعرّف. مين عنده، ومين قال إنه مثالي، وإزاي ممكن يتثبت؟ الهدف الواقعي هو الوضوح: كلام يتفهم في مواقف مختلفة. ضيف عليه قدرة التواصل والثقة بالنفس في الكلام والاستماع، وهتبقى عندك أهداف الفصل يقدر فعلًا يوصلها.", "n": 1, "i": 78, "h": ""}, {"t": "write", "q": "How can you overcome teacher reluctance about the phonemic chart? (3-4 sentences)<br>تقدر تتغلّب على تردد المدرسين تجاه خريطة الفونيمات إزاي؟ (٣-٤ جمل).", "key": "tefl-37:2", "a": "The system is not as difficult as it first appears. Introduce it piece by piece, as part of the daily lesson plan, rather than all at once. With a little regular application it becomes second nature for the class. And the payoff is big: older learners with a good dictionary can discover unknown pronunciations alone.<br>النظام مش بالصعوبة اللي باينة أول مرة. قدّمه قطعة قطعة، كجزء من خطة الدرس اليومية، مش كله مرة واحدة. مع شوية ممارسة منتظمة بيبقى طبيعة تانية للفصل. والمكسب كبير: المتعلمين الأكبر بالقاموس الكويس يقدروا يكتشفوا النطق المجهول لوحدهم.", "n": 1, "i": 79, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: word stress and sentence stress.</div><div class=\"u\">الدرس الجاي: نبر الكلمة ونبر الجملة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 80}];</script>
