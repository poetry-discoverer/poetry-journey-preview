<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ١٩</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-19";window.STEPS=[{"t": "section", "h": "Grouping by age | التقسيم حسب العمر", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Presenting grammar is like teaching any other skill: consider age, level of competence, and previous grammar experience in the native language.</div><div class=\"u\">تقديم القواعد زي تدريس أي مهارة: حط في اعتبارك السن، ومستوى الكفاءة، والخبرة السابقة بالقواعد في اللغة الأم.</div>", "n": 1, "i": 1, "a": "tefl-19-001", "x": "1b9570fb"}, {"t": "learn", "h": "<div class=\"u\">Nobody can say a specific structure must always be taught at a specific age. There are several variables at play.</div><div class=\"u\">محدش يقدر يقول تركيبة معينة لازم تتدرّس في سن معينة على طول. فيه متغيرات كتير بتتدخل.</div>", "n": 1, "i": 2, "a": "tefl-19-002", "x": "117d5fdf"}, {"t": "learn", "h": "<div class=\"u\">A useful grouping: younger young learners, older young learners, teenagers, adults.</div><div class=\"u\">تقسيمة مفيدة: الأطفال الصغيرين، والأطفال الأكبر، والمراهقين، والكبار.</div>", "n": 1, "i": 3, "a": "tefl-19-003", "x": "16fb8fe1"}, {"t": "learn", "h": "<div class=\"u\">You will know it is time to focus more on grammar when learners ask: why does this word have an extra letter (dogs) but the other one has not (dog)?</div><div class=\"u\">هتعرف إن الوقت جه للتركيز على القواعد أكتر لما المتعلمين يسألوا: ليه الكلمة دي فيها حرف زيادة (dogs) والتانية لأ (dog)؟</div>", "n": 1, "i": 4, "a": "tefl-19-004", "x": "156cc51a"}, {"t": "section", "h": "Younger young learners | الأطفال الصغيرين", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">Younger young learners are under about 8-9 years old. Teaching grammar formally and explicitly is not appropriate at this age, but you will still do grammar activities.</div><div class=\"u\">الأطفال الصغيرين تحت سن ٨-٩ سنين تقريبًا. تدريس القواعد بشكل رسمي ومباشر مش مناسب في السن ده، بس لسه هتعمل أنشطة قواعد.</div>", "n": 1, "i": 6, "a": "tefl-19-005", "x": "3948fd92"}, {"t": "learn", "h": "<div class=\"u\">Do not use metalanguage with them, unless they already know terms like naming word or noun from their first language classes. Find out first.</div><div class=\"u\">ماتستخدمش ميتالغة معاهم، إلا لو عارفين أصلًا مصطلحات زي naming word أو noun من حصص لغتهم الأم. اتأكد الأول.</div>", "n": 1, "i": 7, "a": "tefl-19-006", "x": "2a5797fc"}, {"t": "learn", "h": "<div class=\"u\">Your aim: get them to notice forms and patterns, then use them automatically after lots of practice.</div><div class=\"u\">هدفك: تخليهم يلاحظوا الأشكال والأنماط، وبعدين يستخدموها تلقائيًا بعد تمرين كتير.</div>", "n": 1, "i": 8, "a": "tefl-19-007", "x": "f3193c40"}, {"t": "learn", "h": "<div class=\"u\">The grammar must emerge from meaningful contexts, like listening to a story or singing a song such as This is the way we wash our hands.</div><div class=\"u\">القواعد لازم تطلع من سياقات ليها معنى، زي سماع قصة أو غنية زي This is the way we wash our hands.</div>", "n": 1, "i": 9, "a": "tefl-19-008", "x": "0ad0b311"}, {"t": "learn", "h": "<div class=\"u\">Never teach grammar in isolation with younger young learners. That would be a recipe for disaster.</div><div class=\"u\">ممنوع تدرّس القواعد لوحدها معزولة مع الأطفال الصغيرين. دي وصفة أكيدة للكارثة.</div>", "n": 1, "i": 10, "a": "tefl-19-009", "x": "2595437b"}, {"t": "learn", "h": "<div class=\"u\">They need to gradually see the relationship between form, function, meaning and use: which form expresses which meaning, like Please Miss, can I have a pencil?</div><div class=\"u\">محتاجين يشوفوا بالتدريج العلاقة بين الشكل والوظيفة والمعنى والاستخدام: أنهي شكل بيعبّر عن أنهي معنى، زي Please Miss, can I have a pencil?</div>", "n": 1, "i": 11, "a": "tefl-19-010", "x": "1121894f"}, {"t": "learn", "h": "<div class=\"u\">If grammar progress is slow, do not blame it all on the first language. Some learners struggle with grammar in their own language, and some difficulties are universal.</div><div class=\"u\">لو التقدم في القواعد بطيء، ماتلومش اللغة الأم على كل حاجة. بعض المتعلمين بيتعبوا مع القواعد في لغتهم أصلًا، وبعض الصعوبات عالمية.</div>", "n": 1, "i": 12, "a": "tefl-19-011", "x": "a5dc7cde"}, {"t": "learn", "h": "<div class=\"u\">Building foreign language knowledge is a long, complex process, and not a straight line. Take your time with them.</div><div class=\"u\">بناء المعرفة بلغة أجنبية عملية طويلة ومعقدة، ومش خط مستقيم. خد وقتك معاهم.</div>", "n": 1, "i": 13, "a": "tefl-19-012", "x": "4b2e90e3"}, {"t": "section", "h": "The apples story: noticing grammar | قصة التفاح: ملاحظة القواعد", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">Your key role is helping them notice grammar. They will not know they are getting grammar input. You select features in stories, dialogues, songs, chants, and rhymes.</div><div class=\"u\">دورك الأساسي إنك تساعدهم يلاحظوا القواعد. هما مش هيعرفوا إنهم بياخدوا قواعد. إنت بتختار الأشكال من القصص والحوارات والأغاني والأناشيد.</div>", "n": 1, "i": 15, "a": "tefl-19-013", "x": "a3fecd83"}, {"t": "learn", "h": "<div class=\"u\">The apples example. Read a story: One day, Piggy the pig ate one apple. Lionel the lion ate two apples. Ellie the elephant ate three apples.</div><div class=\"u\">مثال التفاح. اقرا قصة: One day, Piggy the pig ate one apple. وLionel the lion ate two apples. وEllie the elephant ate three apples.</div>", "n": 1, "i": 16, "a": "tefl-19-014", "x": "7c78fca5"}, {"t": "learn", "h": "<div class=\"u\">Bring three real apples to class and hold up the right number each time. Emphasise the bold words.</div><div class=\"u\">هات تلات تفاحات حقيقيين للكلاس وارفع العدد الصح كل مرة. وشدّد على الكلمات المهمة.</div>", "n": 1, "i": 17, "a": "tefl-19-015", "x": "862e1c71"}, {"t": "learn", "h": "<div class=\"u\">Ask: What did Piggy ate? A student says: One apple. Confirm, ask others, then the whole class repeats: One apple.</div><div class=\"u\">اسأل: Piggy أكل إيه؟ طالب يقول: One apple. أكّد، واسأل غيره، وبعدين الكلاس كله يعيد: One apple.</div>", "n": 1, "i": 18, "a": "tefl-19-016", "x": "1fd24bee"}, {"t": "learn", "h": "<div class=\"u\">For Lionel, a student may say Two apple. Say: Yes, he ate two apples. Listen everyone: two apples. Class repeats.</div><div class=\"u\">مع Lionel، طالب ممكن يقول Two apple. قول: أيوه، أكل two apples. اسمعوا يا جماعة: two apples. والكلاس يعيد.</div>", "n": 1, "i": 19, "a": "tefl-19-017", "x": "5cb1727d"}, {"t": "learn", "h": "<div class=\"u\">Then ask: What do you hear? Is it the same? One apple, two apples. A student notices: Two apples has a sss sound.</div><div class=\"u\">بعدين اسأل: سامعين إيه؟ نفس الصوت؟ One apple وtwo apples. طالب هيلاحظ: Two apples فيها صوت سسس.</div>", "n": 1, "i": 20, "a": "tefl-19-018", "x": "6a69a97a"}, {"t": "learn", "h": "<div class=\"u\">Now state it simply: when we have one apple we say apple. When we have more than one, we say apples, with a sss sound at the end.</div><div class=\"u\">دلوقتي قولها ببساطة: لما يكون عندنا تفاحة واحدة نقول apple. لما يكون أكتر من واحدة، نقول apples، بصوت سسس في الآخر.</div>", "n": 1, "i": 21, "a": "tefl-19-019", "x": "4aafc8d0"}, {"t": "learn", "h": "<div class=\"u\">You would not mention the word plural. Leave exceptions for another time. Finish with a fun oral exercise on the sss sound with other animals.</div><div class=\"u\">مش هتذكر كلمة plural (جمع) خالص. وسيب الاستثناءات لوقت تاني. واختم بتدريب شفوي ممتع على صوت السين مع حيوانات تانية.</div>", "n": 1, "i": 22, "a": "tefl-19-020", "x": "fedc1967"}, {"t": "learn", "h": "<div class=\"u\">Research beforehand how the plural works in the learners own language. If you use a bit of their language to show the difference, they will love it.</div><div class=\"u\">اعمل بحث قبلها عن إزاي الجمع بيتكوّن في لغة المتعلمين. لو استخدمت شوية من لغتهم توضح الفرق، هيحبوها جدًا.</div>", "n": 1, "i": 23, "a": "tefl-19-021", "x": "7d45b9f4"}, {"t": "learn", "h": "<div class=\"u\">Often the best way is to make up your own material. A short story of one or two pages with a few words is easy to build. The apples part took about 10 minutes to create.</div><div class=\"u\">كتير أحسن طريقة إنك تعمل مادتك بنفسك. قصة قصيرة صفحة أو اتنين بكلمات قليلة سهلة تتعمل. جزء التفاح ده اتعمل في حوالي ١٠ دقايق.</div>", "n": 1, "i": 24, "a": "tefl-19-022", "x": "aa27c8d9"}, {"t": "learn", "h": "<div class=\"u\">This is learning-centred grammar: you highlight a form while learners are in the middle of the learning process, without them being aware of it.</div><div class=\"u\">دي قواعد متمحورة حوالين التعلم: بتسلّط الضوء على شكل والمتعلمين في نص عملية التعلم، من غير ما يحسوا.</div>", "n": 1, "i": 25, "a": "tefl-19-023", "x": "3e262429"}, {"t": "learn", "h": "<div class=\"u\">Early years teaching centres mostly on meaning, like This is a dog. That makes sense. But do not overlook accuracy: grasp opportune moments to help with form.</div><div class=\"u\">التدريس في السنين الأولى بيركز أساسًا على المعنى، زي This is a dog. وده منطقي. بس ماتهملش الدقة: اقتنص اللحظات المناسبة تساعد فيها على الشكل.</div>", "n": 1, "i": 26, "a": "tefl-19-024", "x": "6d52bc6b"}, {"t": "learn", "h": "<div class=\"u\">Fun exercises and games are useful tools to make the grammar input more enjoyable and less abstract. They need to learn words and expressions in context.</div><div class=\"u\">التمارين والألعاب الممتعة أدوات مفيدة بتخلي القواعد أمتع وأقل تجريد. هم محتاجين يتعلموا الكلمات والتعبيرات في سياق.</div>", "n": 1, "i": 27, "a": "tefl-19-025", "x": "b1dabf18"}, {"t": "section", "h": "Practical techniques for the young | تقنيات عملية للصغيرين", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Practical techniques. First: classroom routines. Learners pick up chunks of language from you, like Good Morning, Mr Brown or Please Miss. That is the start of their internal grammar.</div><div class=\"u\">تقنيات عملية. أول حاجة: روتين الفصل. المتعلمين بيلتقطوا قطع لغة (chunks) منك، زي Good Morning, Mr Brown أو Please Miss. ودي بداية قواعدهم الداخلية.</div>", "n": 1, "i": 29, "a": "tefl-19-026", "x": "0f15aa28"}, {"t": "learn", "h": "<div class=\"u\">Second: whole class instructions with gestures and mime, or a game like Simon Says: Speak quietly, please. Stand up, please. Sit down, please. Choose a partner, please.</div><div class=\"u\">تاني حاجة: تعليمات للكلاس كله مع إيماءات وتمثيل، أو لعبة زي Simon Says: Speak quietly, please. وStand up, please. وSit down, please. وChoose a partner, please.</div>", "n": 1, "i": 30, "a": "tefl-19-027", "x": "1f02cd93"}, {"t": "learn", "h": "<div class=\"u\">Third: chants and rhymes. Use traditional songs like This is the way we wash our hands, or write your own to the same tune: This is the way we stand up quietly.</div><div class=\"u\">تالت حاجة: الأناشيد والقوافي. استخدم الأغاني التقليدية زي This is the way we wash our hands، أو اكتب بتاعتك على نفس اللحن: This is the way we stand up quietly.</div>", "n": 1, "i": 31, "a": "tefl-19-028", "x": "87a6ed0a"}, {"t": "learn", "h": "<div class=\"u\">Do not hang back from singing, even if you cannot keep a tune. You could always try rapping.</div><div class=\"u\">ماتترددش تغني، حتى لو صوتك مش مظبوط. وتقدر تجرب الراب كمان.</div>", "n": 1, "i": 32, "a": "tefl-19-029", "x": "dd2ed51e"}, {"t": "learn", "h": "<div class=\"u\">Fourth: little planned conversations every day, with individuals, pairs, or groups. They build bonds and reveal useful information about their language and interests.</div><div class=\"u\">رابع حاجة: محادثات صغيرة متخطط ليها كل يوم، مع أفراد أو أزواج أو مجموعات. بتبني روابط وبتكشف معلومات مفيدة عن لغتهم واهتماماتهم.</div>", "n": 1, "i": 33, "a": "tefl-19-030", "x": "008377f3"}, {"t": "learn", "h": "<div class=\"u\">A chat may reveal a structure to fix: My foot sore becomes Oh, your foot is sore? Why is it sore? My books is wet becomes Oh, your books are wet?</div><div class=\"u\">محادثة ممكن تكشف تركيبة تتصلح: My foot sore تبقى Oh, your foot is sore? Why is it sore? وMy books is wet تبقى Oh, your books are wet?</div>", "n": 1, "i": 34, "a": "tefl-19-031", "x": "b5dc162c"}, {"t": "learn", "h": "<div class=\"u\">This corrective feedback is an essential tool for learners of all ages. Chats also tell you their likes, so you know the next topic: pets, football, superheroes.</div><div class=\"u\">التغذية الراجعة التصحيحية دي أداة أساسية للمتعلمين من كل الأعمار. والمحادثات كمان بتقولك بيحبوا إيه، فتعرف الموضوع الجاي: حيوانات أليفة، كورة، أبطال خارقين.</div>", "n": 1, "i": 35, "a": "tefl-19-032", "x": "ed008c35"}, {"t": "learn", "h": "<div class=\"u\">Fifth: noticing-skill activities. Prepare a worksheet: The cup is ___ the table, with a drawing and the words on and under beside it.</div><div class=\"u\">خامس حاجة: أنشطة مهارة الملاحظة. جهّز ورقة عمل: The cup is ___ the table، مع رسمة وكلمتي on وunder جنبها.</div>", "n": 1, "i": 36, "a": "tefl-19-033", "x": "e54ba86c"}, {"t": "learn", "h": "<div class=\"u\">Teach on and under with visuals, mime, puppets, or dolls. Then read a story: Mummy put baby Alexa's cup on the table. Baby Alexa put her spoon under the table.</div><div class=\"u\">علّم on وunder بالصور والتمثيل والعرائس. وبعدين اقرا قصة: Mummy put baby Alexa's cup on the table. وBaby Alexa put her spoon under the table.</div>", "n": 1, "i": 37, "a": "tefl-19-034", "x": "15f10ec2"}, {"t": "learn", "h": "<div class=\"u\">Read it slowly, then at normal pace. In pairs, learners tick the right choice. Later, add more prepositions, remove the drawings, or mix the question order.</div><div class=\"u\">اقراها ببطء، وبعدين بسرعة طبيعية. في أزواج، المتعلمين يعلّموا على الاختيار الصح. وبعدين، زوّد حروف جر أكتر، أو شيل الرسومات، أو لخبط ترتيب الأسئلة.</div>", "n": 1, "i": 38, "a": "tefl-19-035", "x": "91e8c6a9"}, {"t": "learn", "h": "<div class=\"u\">Sixth: practice activities for form: story reading, drilling, cloze activities, questionnaires and surveys, quizzes, information gap activities, projects.</div><div class=\"u\">سادس حاجة: أنشطة تمرين على الشكل: قراية قصص، وتدريبات تكرار، وأنشطة كليوز (ملء فراغات)، واستبيانات ومسوح، وكويزات، وأنشطة فجوة المعلومات، ومشاريع.</div>", "n": 1, "i": 39, "a": "tefl-19-036", "x": "94b69f06"}, {"t": "learn", "h": "<div class=\"u\">Information gap: a worksheet activity where each learner has different missing information and they work it out together.</div><div class=\"u\">فجوة المعلومات: نشاط ورقة عمل كل متعلم فيه عنده معلومات ناقصة مختلفة، وبيشتغلوا يطلعوها مع بعض.</div>", "n": 1, "i": 40, "a": "tefl-19-037", "x": "00ab82f3"}, {"t": "learn", "h": "<div class=\"u\">Project example: with The Very Hungry Caterpillar, keep caterpillars in the classroom. Grammar chances are immense: Alejandra, your caterpillar is big. But look, Pablo's is bigger.</div><div class=\"u\">مثال مشروع: مع قصة The Very Hungry Caterpillar، ربّي يرقات في الفصل. فرص القواعد هائلة: Alejandra, your caterpillar is big. But look, Pablo's is bigger.</div>", "n": 1, "i": 41, "a": "tefl-19-038", "x": "07fd05f7"}, {"t": "section", "h": "Older young learners | الأطفال الأكبر", "n": 1, "i": 42}, {"t": "learn", "h": "<div class=\"u\">Older young learners, about 8-9 up to 12. Everything for younger learners still applies, but activities go deeper and get more complex.</div><div class=\"u\">الأطفال الأكبر، من ٨-٩ لحد ١٢ سنة تقريبًا. كل اللي قلناه للصغيرين لسه شغال، بس الأنشطة بتبقى أعمق وأعقد شوية.</div>", "n": 1, "i": 43, "a": "tefl-19-039", "x": "fb0b6e1b"}, {"t": "learn", "h": "<div class=\"u\">Keep using rhymes, chats, some drilling, cloze activities, questionnaires, information gap, presentations, and fun games.</div><div class=\"u\">كمل استخدام الأناشيد، والمحادثات، وشوية تكرار، وأنشطة الكليوز، والاستبيانات، وفجوة المعلومات، والعروض، والألعاب الممتعة.</div>", "n": 1, "i": 44, "a": "tefl-19-040", "x": "fe8a7f2c"}, {"t": "learn", "h": "<div class=\"u\">If they are ready, gradually introduce language analysis and some metalanguage. If the school sets no curriculum, you decide when.</div><div class=\"u\">لو مستعدين، قدّم تحليل اللغة وشوية ميتالغة بالتدريج. لو المدرسة مش محددة منهج، إنت اللي بتقرر إمتى.</div>", "n": 1, "i": 45, "a": "tefl-19-041", "x": "fc001737"}, {"t": "learn", "h": "<div class=\"u\">You will know it is time when they show active interest: Why does eat become ate but beat does not become bate?</div><div class=\"u\">هتعرف إن الوقت جه لما يبدأوا يهتموا بجد: ليه eat بتبقى ate بس beat مابتبقاش bate؟</div>", "n": 1, "i": 46, "a": "tefl-19-042", "x": "3f4b694e"}, {"t": "learn", "h": "<div class=\"u\">Know what grammar they have learned in their first language and what metalanguage they know. Do not overdo it.</div><div class=\"u\">اعرف اتعلموا إيه من القواعد في لغتهم الأم وأنهي ميتالغة يعرفوها. وماتزودهاش.</div>", "n": 1, "i": 47, "a": "tefl-19-043", "x": "00128981"}, {"t": "learn", "h": "<div class=\"u\">They should be ready for work on some tenses and punctuation, and may be ready for some self-correcting.</div><div class=\"u\">المفروض يكونوا مستعدين لشغل على بعض الأزمنة وعلامات الترقيم، وممكن يكونوا مستعدين لشوية تصحيح ذاتي.</div>", "n": 1, "i": 48, "a": "tefl-19-044", "x": "8094a88d"}, {"t": "learn", "h": "<div class=\"u\">They enjoy puzzles and crosswords where they discover basic rules themselves: most nouns take -s or -es in the plural, but other groups form it differently.</div><div class=\"u\">بيحبوا الألغاز والكلمات المتقاطعة اللي بيكتشفوا بيها القواعد بأنفسهم: أغلب الأسماء بتاخد s أو es في الجمع، بس مجموعات تانية بتجمع بطرق مختلفة.</div>", "n": 1, "i": 49, "a": "tefl-19-045", "x": "9259e67d"}, {"t": "learn", "h": "<div class=\"u\">They may be ready for sentence models: Pronoun + Verb + Noun, like I like apples. Or Pronoun + Verb + Adjective + Noun: I like green apples.</div><div class=\"u\">ممكن يكونوا مستعدين لنماذج الجمل: ضمير زائد فعل زائد اسم، زي I like apples. أو ضمير زائد فعل زائد صفة زائد اسم: I like green apples.</div>", "n": 1, "i": 50, "a": "tefl-19-046", "x": "fe517859"}, {"t": "learn", "h": "<div class=\"u\">Always think: how can I make this easier? Give every word class a different colour. To make it harder, mix the words and let them rearrange them to the model.</div><div class=\"u\">دايمًا فكّر: أسهّلها إزاي؟ خلّي لكل نوع كلمة لون مختلف. وعشان تزوّد التحدي، لخبط الكلمات وسيبهم يرتبوها على النموذج.</div>", "n": 1, "i": 51, "a": "tefl-19-047", "x": "3be450e1"}, {"t": "learn", "h": "<div class=\"u\">Recycling is critical: meeting and using a word several times, so eventually it is remembered and recalled naturally. Frequency is the key factor.</div><div class=\"u\">التدوير (recycling) أساسي: تقابل الكلمة وتستخدمها كذا مرة، لحد ما تتفتكر وتتسترجع طبيعي. التكرار هو العامل الأساسي.</div>", "n": 1, "i": 52, "a": "tefl-19-048", "x": "b8b486fa"}, {"t": "learn", "h": "<div class=\"u\">Grammar is tricky at this age. It needs lots of meaningful practice, recycling, and guidance in attending to form.</div><div class=\"u\">القواعد صعبة في السن ده. محتاجة تمرين مفيد كتير، وتدوير، وتوجيه للانتباه للشكل.</div>", "n": 1, "i": 53, "a": "tefl-19-049", "x": "9cd86696"}, {"t": "section", "h": "Teenagers | المراهقين", "n": 1, "i": 54}, {"t": "learn", "h": "<div class=\"u\">Teenagers up to about 16-17 continue the same kind of study at a more complex level. Some just keep progressing, so there is not much to add for them.</div><div class=\"u\">المراهقين لحد ١٦-١٧ سنة بيكملوا نفس نوع الدراسة بمستوى أعقد. بعضهم بيكمل تقدم عادي، فمفيش حاجة كتير تتضاف ليهم.</div>", "n": 1, "i": 55, "a": "tefl-19-050", "x": "0bdb915b"}, {"t": "learn", "h": "<div class=\"u\">But this group can be challenging: some reach a plateau, and some act too cool for school and lose interest in grammar.</div><div class=\"u\">بس المجموعة دي ممكن تبقى صعبة: بعضهم بيوصل لمرحلة ركود (plateau)، وبعضهم بيتعامل كأنه أشيك من المدرسة وبيفقد اهتمامه بالقواعد.</div>", "n": 1, "i": 56, "a": "tefl-19-051", "x": "f6d5c152"}, {"t": "learn", "h": "<div class=\"u\">First tip: avoid metalanguage. Say instead: Let's look at another way of describing things you will be doing tomorrow by using an -ing word.</div><div class=\"u\">أول نصيحة: ابعد عن الميتالغة. قول بدلها: تعالوا نشوف طريقة تانية نوصف بيها حاجات هنعملها بكرة باستخدام كلمة فيها ing.</div>", "n": 1, "i": 57, "a": "tefl-19-052", "x": "7d8986e1"}, {"t": "learn", "h": "<div class=\"u\">Second: empathise. Tell them you also struggled with grammar when you were younger, but with extra effort you came through. And look at you now.</div><div class=\"u\">ثاني حاجة: تعاطف معاهم. قولهم إنك إنت كمان اتعبت مع القواعد وإنت صغير، بس بمجهود زيادة عدّيت. وبص لنفسك دلوقتي.</div>", "n": 1, "i": 58, "a": "tefl-19-053", "x": "39f3c63f"}, {"t": "learn", "h": "<div class=\"u\">Remind them how useful grammar is: writing blogs and stories others admire, passing exams, and later travelling or working in an English-speaking country.</div><div class=\"u\">فكّرهم القواعد مفيدة قد إيه: كتابة مدونات وقصص الناس هتعجب بيها، ونجاح في الامتحانات، وبعدين سفر أو شغل في بلد بتتكلم إنجليزية.</div>", "n": 1, "i": 59, "a": "tefl-19-054", "x": "c0a9010a"}, {"t": "learn", "h": "<div class=\"u\">Third: play to their interests. Find out what they really like: action movies, soccer, fashion programmes. Catch their interest first.</div><div class=\"u\">تالت حاجة: العب على اهتماماتهم. اعرف بيحبوا إيه بجد: أفلام أكشن، كورة، برامج موضة. اجذب اهتمامهم الأول.</div>", "n": 1, "i": 60, "a": "tefl-19-055", "x": "4fe21440"}, {"t": "learn", "h": "<div class=\"u\">Then stop the video at specific parts and ask why the character made two similar statements but used different words for each.</div><div class=\"u\">وبعدين وقّف الفيديو في أجزاء معينة واسأل ليه الشخصية قالت جملتين بنفس المعنى بس بكلمات مختلفة.</div>", "n": 1, "i": 61, "a": "tefl-19-056", "x": "79088b67"}, {"t": "learn", "h": "<div class=\"u\">Fourth: controlled competitiveness, always in pairs or groups so nobody is embarrassed alone. Put time limits to heighten the tension. Keep the activity simple.</div><div class=\"u\">رابع حاجة: منافسة مضبوطة، دايمًا في أزواج أو مجموعات عشان محدش يتكسف لوحده. حط وقت محدد عشان تزوّد الحماس. وخلّي النشاط بسيط.</div>", "n": 1, "i": 62, "a": "tefl-19-057", "x": "ef6ac802"}, {"t": "learn", "h": "<div class=\"u\">Example: a sheet with will and won't several times; groups replace them with am going to or am not going to. Careful: some places cannot change, like Will you come back tomorrow?</div><div class=\"u\">مثال: ورقة فيها will وwon't كذا مرة؛ المجموعات بتبدلهم بـam going to أو am not going to. خد بالك: فيه أماكن ماتتغيرش، زي Will you come back tomorrow?</div>", "n": 1, "i": 63, "a": "tefl-19-058", "x": "f095cda5"}, {"t": "learn", "h": "<div class=\"u\">One person per group raises their hand when the group has finished and checked everything.</div><div class=\"u\">واحد من كل مجموعة يرفع إيده لما المجموعة تخلص وتراجع كل حاجة.</div>", "n": 1, "i": 64, "a": "tefl-19-059", "x": "c0ddbca7"}, {"t": "learn", "h": "<div class=\"u\">Fully correct means points toward the end-of-term group prize. Not fully correct means no points, and the sheet passes to the next group.</div><div class=\"u\">الصح بالكامل يعني نقاط لجايزة آخر الترم للمجموعات. والغلط يعني مفيش نقاط، والورقة بتروح للمجموعة اللي بعدها.</div>", "n": 1, "i": 65, "a": "tefl-19-060", "x": "d83ccab6"}, {"t": "learn", "h": "<div class=\"u\">Make sure it is not the same group winning all the time. Change the groups around from time to time for balance, but never tell them why.</div><div class=\"u\">اتأكد إن مش نفس المجموعة بتكسب كل مرة. غيّر المجموعات من وقت للتاني للتوازن، بس متقولهمش السبب أبدًا.</div>", "n": 1, "i": 66, "a": "tefl-19-061", "x": "80b2fc63"}, {"t": "learn", "h": "<div class=\"u\">Fifth: give them autonomy. Let them do the dictionary work to find synonyms for a passage.</div><div class=\"u\">خامس حاجة: اديهم استقلالية. سيبهم يشتغلوا بالقاموس يلاقوا مرادفات لقطعة.</div>", "n": 1, "i": 67, "a": "tefl-19-062", "x": "5f741e2d"}, {"t": "learn", "h": "<div class=\"u\">Sometimes ask those who grasped a concept to help teach those who have not.</div><div class=\"u\">أحيانًا اطلب من اللي فهموا المفهوم يساعدوا يعلّموا اللي لسه مفهموش.</div>", "n": 1, "i": 68, "a": "tefl-19-063", "x": "80bdf422"}, {"t": "learn", "h": "<div class=\"u\">Let them choose the video or story from a choice of three. You will have chosen the grammar targets inside all three beforehand.</div><div class=\"u\">سيبهم يختاروا الفيديو أو القصة من تلات اختيارات. وإنت تكون مخطط من بدري أهداف القواعد جوه التلاتة.</div>", "n": 1, "i": 69, "a": "tefl-19-064", "x": "f18d5a11"}, {"t": "learn", "h": "<div class=\"u\">Sixth: make it fun. Games like snakes and ladders with cards you prepared: decide if the sentence is correct to move up the board.</div><div class=\"u\">سادس حاجة: خلّيها ممتعة. ألعاب زي السلم والتعبان بكروت من تجهيزك: يقرروا لو الجملة صح عشان يطلعوا على السلم.</div>", "n": 1, "i": 70, "a": "tefl-19-065", "x": "ecd9dcd2"}, {"t": "learn", "h": "<div class=\"u\">Give groups some autonomy in deciding what is correct, but move around, monitor, and listen to make sure they got it right.</div><div class=\"u\">ادّي المجموعات شوية استقلالية في تقرير الصح، بس اتحرك وراقب واسمع عشان تتأكد إنهم مظبطينها.</div>", "n": 1, "i": 71, "a": "tefl-19-066", "x": "84856c79"}, {"t": "section", "h": "Adults and grammar detectives | الكبار ومحققي القواعد", "n": 1, "i": 72}, {"t": "learn", "h": "<div class=\"u\">Adults, including older teenagers as young adults. The grammar items may be the same as for older young learners, so the focus here is on best practices for this diverse group.</div><div class=\"u\">الكبار، ومنهم المراهقين الأكبر كشباب. عناصر القواعد ممكن تبقى نفسها زي الأطفال الأكبر، فالتركيز هنا على أفضل الممارسات للمجموعة المتنوعة دي.</div>", "n": 1, "i": 73, "a": "tefl-19-067", "x": "d836e0c8"}, {"t": "learn", "h": "<div class=\"u\">An adult class is diverse: educational background, age, employment history, and culture all differ.</div><div class=\"u\">فصل الكبار متنوع: الخلفية التعليمية والسن وتاريخ الشغل والثقافة كلهم مختلفين.</div>", "n": 1, "i": 74, "a": "tefl-19-068", "x": "0165f86d"}, {"t": "learn", "h": "<div class=\"u\">Goals differ too: immigrants who need English quickly to secure a job, and young adults aiming for college or vocational programmes.</div><div class=\"u\">والأهداف مختلفة كمان: مهاجرين محتاجين الإنجليزية بسرعة عشان يظمنوا شغل، وشباب بيستعدوا للكلية أو برامج مهنية.</div>", "n": 1, "i": 75, "a": "tefl-19-069", "x": "8a9eee19"}, {"t": "learn", "h": "<div class=\"u\">Also workers who need it for their job, and people who want to travel, work overseas, or just learn English because it is good to have.</div><div class=\"u\">وكمان موظفين محتاجينها لشغلهم، وناس عايزة تسافر أو تشتغل برا، أو بس تتعلم الإنجليزية لأنها حاجة كويسة.</div>", "n": 1, "i": 76, "a": "tefl-19-070", "x": "91dc7eb3"}, {"t": "learn", "h": "<div class=\"u\">The challenge: how do you satisfy the grammar needs of such a diverse group? One key characteristic helps: they all want to succeed. Otherwise, why would they be there?</div><div class=\"u\">التحدي: تلبّي احتياجات القواعد لمجموعة متنوعة كده إزاي؟ خاصية أساسية بتساعدك: كلهم عايزين ينجحوا. غير كده كانوا جايين ليه؟</div>", "n": 1, "i": 77, "a": "tefl-19-071", "x": "1c8c7b51"}, {"t": "learn", "h": "<div class=\"u\">So they will be motivated. That is a huge plus point.</div><div class=\"u\">فهيكون عندهم دافع. ودي نقطة إيجابية ضخمة.</div>", "n": 1, "i": 78, "a": "tefl-19-072", "x": "cdece03c"}, {"t": "learn", "h": "<div class=\"u\">Practice 1: do not assume adults are competent in grammar. Some may be no more competent than a young learner. There is no guarantee.</div><div class=\"u\">ممارسة ١: ماتفترضش إن الكبار متمكنين في القواعد. بعضهم ممكن ميكونش أحسن من طفل صغير. مفيش ضمانة.</div>", "n": 1, "i": 79, "a": "tefl-19-073", "x": "44ec7508"}, {"t": "learn", "h": "<div class=\"u\">Practice 2: do not worry about the level. Everything about young learners and teenagers still applies.</div><div class=\"u\">ممارسة ٢: ماتقلقش بخصوص المستوى. كل اللي قلناه عن الصغيرين والمراهقين لسه شغال.</div>", "n": 1, "i": 80, "a": "tefl-19-074", "x": "fd4d9b78"}, {"t": "learn", "h": "<div class=\"u\">The differences: there will likely be more explicit grammar sessions, and you will help them be much more autonomous, identifying and fixing errors themselves.</div><div class=\"u\">الفروق: غالبًا هتكون فيه جلسات قواعد مباشرة أكتر، وهتساعدهم يبقوا أكتر استقلالية، بيلاقوا أخطائهم ويصلّحوها بنفسهم.</div>", "n": 1, "i": 81, "a": "tefl-19-075", "x": "8ccdc7ac"}, {"t": "learn", "h": "<div class=\"u\">Practice 3: do a needs analysis. It is a process of finding out what needs a learner has. Do it informally, during your first meeting, not as a big formal event.</div><div class=\"u\">ممارسة ٣: اعمل تحليل احتياجات (needs analysis). ده ببساطة إنك تعرف المتعلم محتاج إيه. اعمله بشكل غير رسمي، في أول مقابلة، مش كحدث رسمي كبير.</div>", "n": 1, "i": 82, "a": "tefl-19-076", "x": "fcd5d970"}, {"t": "learn", "h": "<div class=\"u\">Find out two things. First: how good is her English at present, and what aspects need improving to reach the target situation?</div><div class=\"u\">اعرف حاجتين. أولًا: مستوى إنجليزيتها دلوقتي عامل إزاي، وأنهي جوانب محتاجة تتحسن عشان توصل للوضع المطلوب؟</div>", "n": 1, "i": 83, "a": "tefl-19-077", "x": "68dabc78"}, {"t": "learn", "h": "<div class=\"u\">Second: what will she have to do in English? Ask directly: when you go to college next year, what do you have to do in English? Or: when you are at work, what do you have to do in English?</div><div class=\"u\">ثانيًا: هتعمل إيه بالإنجليزية؟ اسأل مباشرة: لما تروحي الكلية السنة الجاية، هتعملي إيه بالإنجليزية؟ أو: في شغلك، بتعملي إيه بالإنجليزية؟</div>", "n": 1, "i": 84, "a": "tefl-19-078", "x": "531036fb"}, {"t": "learn", "h": "<div class=\"u\">Then analyse and decide what your teaching must do to get the learners to their desired situation.</div><div class=\"u\">وبعدين حلّل وقرر التدريس بتاعك محتاج يعمل إيه عشان يوصّل المتعلمين للوضع اللي عايزينه.</div>", "n": 1, "i": 85, "a": "tefl-19-079", "x": "c758e336"}, {"t": "learn", "h": "<div class=\"u\">Practice 4: help them become grammar detectives. Adults handle concepts much more easily than young learners, so you can introduce concepts directly, with metalanguage. That saves time.</div><div class=\"u\">ممارسة ٤: ساعدهم يبقوا محققين في القواعد. الكبار بيمسكوا المفاهيم أسهل بكتير من الصغيرين، فتقدر تقدّم المفاهيم مباشرة، وبالميتالغة. وده بيوفّر وقت.</div>", "n": 1, "i": 86, "a": "tefl-19-080", "x": "c33e6da1"}, {"t": "learn", "h": "<div class=\"u\">Four critical concepts: meaning, form, framework (setting), and function. With these, learners can analyse sentences, work out what went wrong, and self-correct.</div><div class=\"u\">أربع مفاهيم أساسية: المعنى، والشكل، والإطار (setting)، والوظيفة. بيهم، المتعلمين يقدروا يحلّلوا الجمل، ويعرفوا إيه اللي غلط، ويصلّحوا نفسهم.</div>", "n": 1, "i": 87, "a": "tefl-19-081", "x": "66150d12"}, {"t": "learn", "h": "<div class=\"u\">Meaning: words have a literal meaning and a meaning for the context. Wet literally means covered in water: I slipped on the wet floor.</div><div class=\"u\">المعنى: الكلمات ليها معنى حرفي ومعنى حسب السياق. wet حرفيًا يعني مبلول بالمية: I slipped on the wet floor.</div>", "n": 1, "i": 88, "a": "tefl-19-082", "x": "b0579089"}, {"t": "learn", "h": "<div class=\"u\">But in Come on, John, do not be such a tiresome wet, the word wet means a weak person with no forceful opinions, someone who sits on the fence.</div><div class=\"u\">بس في Come on, John, do not be such a tiresome wet، كلمة wet معناها شخص ضعيف الشخصية مالوش رأي قوي، واحد قاعد على الحيطة.</div>", "n": 1, "i": 89, "a": "tefl-19-083", "x": "62c0e807"}, {"t": "learn", "h": "<div class=\"u\">The grammar shows it: after the word a, it must be a noun, some kind of person. The not-dry adjective would not make sense there.</div><div class=\"u\">القواعد بتوضح ده: بعد كلمة a، لازم تبقى اسم، نوع من الأشخاص. الصفة اللي معناها مش ناشف ماهتبقاش منطقية هنا.</div>", "n": 1, "i": 90, "a": "tefl-19-084", "x": "794140c4"}, {"t": "learn", "h": "<div class=\"u\">So grammar and meaning are intertwined: grammatical constructions create mental images that help us work out meaning.</div><div class=\"u\">فالقواعد والمعنى متشابكين: التراكيب النحوية بتعمل صور ذهنية بتساعدنا نستنتج المعنى.</div>", "n": 1, "i": 91, "a": "tefl-19-085", "x": "2d445ea9"}, {"t": "learn", "h": "<div class=\"u\">Form: what a word looks like, how it is structured. In The big boy took the small boy's ball, we can work out that boy is a noun.</div><div class=\"u\">الشكل: الكلمة شكلها عامل إزاي، متكوّنة إزاي. في The big boy took the small boy's ball، نقدر نستنتج إن boy اسم.</div>", "n": 1, "i": 92, "a": "tefl-19-086", "x": "fa8a0abf"}, {"t": "learn", "h": "<div class=\"u\">Not just from meaning: nearly all nouns add endings in the plural and in possession, like boys and boy's. Adjectives, adverbs, and determiners do not do this.</div><div class=\"u\">ومش بس من المعنى: تقريبًا كل الأسماء بتزوّد إضافات في الجمع والملكية، زي boys وboy's. الصفات والأحوال وأدوات التحديد مابتعملش كده.</div>", "n": 1, "i": 93, "a": "tefl-19-087", "x": "e5e6c064"}, {"t": "learn", "h": "<div class=\"u\">Function: what a word does in a sentence. Nouns mainly function as subjects, objects, and complements.</div><div class=\"u\">الوظيفة: الكلمة بتعمل إيه في الجملة. الأسماء أساسًا بتشتغل كفاعل ومفعول وتكملة.</div>", "n": 1, "i": 94, "a": "tefl-19-088", "x": "e1417481"}, {"t": "learn", "h": "<div class=\"u\">Try: The ugggawagga kicked a thnollanugga. You do not know these words, but the ugggawagga comes after The and does the kicking, so it is a noun functioning as the subject.</div><div class=\"u\">جرب: The ugggawagga kicked a thnollanugga. إنت مش عارف الكلمتين دول، بس ugggawagga جاية بعد The وهي اللي بتعمل فعل الركل، فهي اسم شغال كفاعل.</div>", "n": 1, "i": 95, "a": "tefl-19-089", "x": "6e7190bf"}, {"t": "learn", "h": "<div class=\"u\">Setting, also called framework: words form a setting into which other words fit. The/A/An ___ ate the apple: after the article, only a noun fits, and it is the subject.</div><div class=\"u\">الإطار (setting): الكلمات بتعمل إطار بتركب فيه كلمات تانية. The/A/An ___ ate the apple: بعد أداة التعريف، ميركبش غير اسم، وهو الفاعل.</div>", "n": 1, "i": 96, "a": "tefl-19-090", "x": "dd19fd13"}, {"t": "learn", "h": "<div class=\"u\">The big boy ___ the small boy's ball: to be a sentence, a verb must fill the frame, and because there is an object, it must be a transitive verb.</div><div class=\"u\">The big boy ___ the small boy's ball: عشان تبقى جملة، لازم فعل يملى الفراغ، وعشان فيه مفعول، لازم يبقى فعل متعدّي.</div>", "n": 1, "i": 97, "a": "tefl-19-091", "x": "6384ef04"}, {"t": "learn", "h": "<div class=\"u\">Practice 5: use games and drills sparingly with adults. They are there to achieve a goal within a time limit, and many see drilling as childish.</div><div class=\"u\">ممارسة ٥: استخدم الألعاب والتكرار باعتدال مع الكبار. هما موجودين يحققوا هدف في وقت محدد، وكتير منهم شايفين التكرار حاجة للأطفال.</div>", "n": 1, "i": 98, "a": "tefl-19-092", "x": "59e5695d"}, {"t": "learn", "h": "<div class=\"u\">A disgruntled look can spoil the good atmosphere. Use the odd game if you explain the end goal, and play it by ear.</div><div class=\"u\">نظرة متضايقة ممكن تبوّظ الجو الكويس. استخدم لعبة أو اتنين لو شرحت الهدف النهائي، وتصرّف حسب الموقف.</div>", "n": 1, "i": 99, "a": "tefl-19-093", "x": "413b104c"}, {"t": "section", "h": "Unit 5 questions answered | أسئلة الوحدة الخامسة متجاوبة", "n": 1, "i": 100}, {"t": "learn", "h": "<div class=\"u\">The unit's questions, answered. Descriptive grammar describes real-world language use: True.</div><div class=\"u\">أسئلة الوحدة، متجاوبة. القواعد الواقعية بتوصف استخدام اللغة الحقيقي: صح.</div>", "n": 1, "i": 101, "a": "tefl-19-094", "x": "30ba510e"}, {"t": "learn", "h": "<div class=\"u\">Prescriptive rules are not important: False. They give a standard form and vital guidelines for learners.</div><div class=\"u\">القوانين الوصفية مش مهمة: غلط. بتدي صيغة قياسية وإرشادات حيوية للمتعلمين.</div>", "n": 1, "i": 102, "a": "tefl-19-095", "x": "20fcc8c7"}, {"t": "learn", "h": "<div class=\"u\">Timelines help learners see relationships between verb forms and time: True.</div><div class=\"u\">الخطوط الزمنية بتساعد المتعلمين يشوفوا العلاقة بين صيغ الأفعال والوقت: صح.</div>", "n": 1, "i": 103, "a": "tefl-19-096", "x": "374c53da"}, {"t": "learn", "h": "<div class=\"u\">There is a set format for making a timeline: False. Any clear format works.</div><div class=\"u\">فيه شكل ثابت لعمل الخط الزمني: غلط. أي شكل واضح بينفع.</div>", "n": 1, "i": 104, "a": "tefl-19-097", "x": "88e5ac99"}, {"t": "learn", "h": "<div class=\"u\">Teaching grammar formally and explicitly to under-8-9s is appropriate: False.</div><div class=\"u\">تدريس القواعد بشكل رسمي ومباشر لتحت سن ٨-٩ مناسب: غلط.</div>", "n": 1, "i": 105, "a": "tefl-19-098", "x": "583a4ee2"}, {"t": "learn", "h": "<div class=\"u\">Never teach grammar in isolation with younger young learners: True.</div><div class=\"u\">ممنوع تدرّس القواعد منعزلة مع الأطفال الصغيرين: صح.</div>", "n": 1, "i": 106, "a": "tefl-19-099", "x": "c816b601"}, {"t": "learn", "h": "<div class=\"u\">Language recycling is meeting and using a word several times until it is remembered naturally: True.</div><div class=\"u\">التدوير اللغوي هو مقابلة الكلمة واستخدامها كذا مرة لحد ما تتفتكر طبيعي: صح.</div>", "n": 1, "i": 107, "a": "tefl-19-100", "x": "a0043ccf"}, {"t": "learn", "h": "<div class=\"u\">When teenagers struggle or feel disenchanted, use metalanguage: False. Avoid it.</div><div class=\"u\">لما المراهقين يتعبوا أو يزهقوا، استخدم ميتالغة: غلط. ابعد عنها.</div>", "n": 1, "i": 108, "a": "tefl-19-101", "x": "e5c4c826"}, {"t": "learn", "h": "<div class=\"u\">A needs analysis finds out what needs a learner has: True.</div><div class=\"u\">تحليل الاحتياجات بيكشف المتعلم محتاج إيه: صح.</div>", "n": 1, "i": 109, "a": "tefl-19-102", "x": "b16022b6"}, {"t": "learn", "h": "<div class=\"u\">Function is what a word does in a sentence: True.</div><div class=\"u\">الوظيفة هي إيه اللي الكلمة بتعمله في الجملة: صح.</div>", "n": 1, "i": 110, "a": "tefl-19-103", "x": "613038d6"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 111}, {"t": "learn", "h": "<div class=\"u\">Noticing: helping learners spot a form or pattern themselves, the key job with young learners.</div><div class=\"u\">الملاحظة (noticing): تساعد المتعلمين يلاحظوا الشكل أو النمط بنفسهم، ودي الشغلانة الأساسية مع الصغيرين.</div>", "n": 1, "i": 112, "a": "tefl-19-104", "x": "579b4123"}, {"t": "learn", "h": "<div class=\"u\">Chunk: a ready-made piece of language learners pick up whole, like Good Morning, Mr Brown.</div><div class=\"u\">القطعة اللغوية (chunk): جزء لغة جاهز المتعلمين بيلتقطوه كوحدة واحدة، زي Good Morning, Mr Brown.</div>", "n": 1, "i": 113, "a": "tefl-19-105", "x": "406d5a9b"}, {"t": "learn", "h": "<div class=\"u\">Corrective feedback: responding to an error by modelling the correct form, like Oh, your foot is sore?</div><div class=\"u\">التغذية الراجعة التصحيحية: الرد على الغلط بإنك تمثّل الصيغة الصح، زي Oh, your foot is sore?</div>", "n": 1, "i": 114, "a": "tefl-19-106", "x": "ffd31783"}, {"t": "learn", "h": "<div class=\"u\">Information gap: a worksheet activity where learners hold different missing information and share to complete it.</div><div class=\"u\">فجوة المعلومات: نشاط كل متعلم فيه عنده معلومات ناقصة مختلفة وبيشاركوا عشان يكملوها.</div>", "n": 1, "i": 115, "a": "tefl-19-107", "x": "2fe98e3a"}, {"t": "learn", "h": "<div class=\"u\">Recycling: meeting and using a word several times until it is recalled naturally.</div><div class=\"u\">التدوير: مقابلة الكلمة واستخدامها كذا مرة لحد ما تتسترجع طبيعي.</div>", "n": 1, "i": 116, "a": "tefl-19-108", "x": "71baed67"}, {"t": "learn", "h": "<div class=\"u\">Needs analysis: finding out, informally, what a learner needs English for.</div><div class=\"u\">تحليل الاحتياجات: إنك تعرف بشكل غير رسمي المتعلم محتاج الإنجليزية في إيه.</div>", "n": 1, "i": 117, "a": "tefl-19-109", "x": "6fa7c992"}, {"t": "learn", "h": "<div class=\"u\">Plateau: a flat stage where a learner stops making visible progress.</div><div class=\"u\">مرحلة الركود (plateau): مرحلة ثابتة المتعلم فيها بيوقف تقدم واضح.</div>", "n": 1, "i": 118, "a": "tefl-19-110", "x": "39e06c1d"}, {"t": "learn", "h": "<div class=\"u\">Function: what a word does in a sentence, like subject or object.</div><div class=\"u\">الوظيفة: إيه اللي الكلمة بتعمله في الجملة، زي فاعل أو مفعول.</div>", "n": 1, "i": 119, "a": "tefl-19-111", "x": "f061cfaf"}, {"t": "learn", "h": "<div class=\"u\">Setting or framework: the frame words create that other words fit into.</div><div class=\"u\">الإطار (setting): الفريم اللي الكلمات بتعمله عشان كلمات تانية تركب فيه.</div>", "n": 1, "i": 120, "a": "tefl-19-112", "x": "1ef2fecc"}, {"t": "learn", "h": "<div class=\"u\">Self-correcting: when learners find and fix their own errors.</div><div class=\"u\">التصحيح الذاتي: لما المتعلمين يلاقوا أخطائهم ويصلّحوها بنفسهم.</div>", "n": 1, "i": 121, "a": "tefl-19-113", "x": "79cbdb4b"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 122}, {"t": "learn", "h": "<div class=\"u\">Match the grammar teaching to the age group. Under 8-9: no formal grammar, no metalanguage, just noticing inside stories, songs, and play.</div><div class=\"u\">ظبّط تدريس القواعد على الفئة العمرية. تحت ٨-٩: مفيش قواعد رسمية، مفيش ميتالغة، بس ملاحظة جوه القصص والأغاني واللعب.</div>", "n": 1, "i": 123, "a": "tefl-19-114", "x": "fbee5c50"}, {"t": "learn", "h": "<div class=\"u\">Older young learners, 8-12: same activities but deeper, plus gradual metalanguage, sentence models, puzzles, and lots of recycling.</div><div class=\"u\">الأطفال الأكبر، ٨-١٢: نفس الأنشطة بس أعمق، زائد ميتالغة بالتدريج، ونماذج جمل، وألغاز، وتدوير كتير.</div>", "n": 1, "i": 124, "a": "tefl-19-115", "x": "5d380722"}, {"t": "learn", "h": "<div class=\"u\">Teenagers: avoid metalanguage, empathise, play to their interests, add controlled competition, autonomy, and fun.</div><div class=\"u\">المراهقين: ابعد عن الميتالغة، تعاطف معاهم، العب على اهتماماتهم، زوّد منافسة مضبوطة، واستقلالية، ومرح.</div>", "n": 1, "i": 125, "a": "tefl-19-116", "x": "08a1e22f"}, {"t": "learn", "h": "<div class=\"u\">Adults: never assume grammar competence, do an informal needs analysis, and turn them into grammar detectives with meaning, form, setting, and function.</div><div class=\"u\">الكبار: ماتفترضش تمكنهم من القواعد أبدًا، اعمل تحليل احتياجات غير رسمي، وحوّلهم لمحققين في القواعد بالمعنى والشكل والإطار والوظيفة.</div>", "n": 1, "i": 126, "a": "tefl-19-117", "x": "27bd61f6"}, {"t": "learn", "h": "<div class=\"u\">With adults, use games and drills sparingly and explain the goal; with children, games and songs are the main road in.</div><div class=\"u\">مع الكبار، استخدم الألعاب والتكرار باعتدال واشرح الهدف؛ مع الأطفال، الألعاب والأغاني هي الطريق الأساسي.</div>", "n": 1, "i": 127, "a": "tefl-19-118", "x": "297f92aa"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 128}, {"t": "tf", "q": "It is appropriate to teach grammar formally and explicitly to students under 8-9 years old.<br>من المناسب تدريس القواعد بشكل رسمي ومباشر لطلبة تحت سن ٨-٩ سنين.", "ans": false, "why": "False. At this age grammar comes through noticing in stories, songs, and routines, never in isolation. | غلط. في السن ده القواعد بتيجي من خلال الملاحظة في القصص والأغاني والروتين، وممنوع منعزلة.", "ex": ["Wrong. Formal explicit grammar is not appropriate under 8-9. | غلط: القواعد الرسمية المباشرة مش مناسبة تحت ٨-٩.", "Correct. | صح."], "n": 1, "i": 129, "h": ""}, {"t": "tf", "q": "Never teach grammar in isolation when teaching younger young learners.<br>ممنوع تدرّس القواعد منعزلة مع الأطفال الصغيرين.", "ans": true, "why": "True. Grammar must emerge from meaningful contexts like stories and songs. | صح. القواعد لازم تطلع من سياقات ليها معنى زي القصص والأغاني.", "ex": ["Correct. | صح.", "Wrong. Isolated grammar with this age is a recipe for disaster. | غلط: القواعد المنعزلة مع السن ده وصفة للكارثة."], "n": 1, "i": 130, "h": ""}, {"t": "mc", "q": "In the apples story, what is the teacher's main goal?<br>في قصة التفاح، إيه هدف المدرس الأساسي؟", "opts": ["help learners notice the -s ending | يساعد المتعلمين يلاحظوا نهاية الـs", "teach the word plural | يعلّم كلمة plural", "count apples | يعد التفاح"], "ans": 0, "why": "The goal is noticing the sss sound at the end of plural nouns, without ever saying plural. | الهدف ملاحظة صوت السين في آخر الأسماء الجمع، من غير ما نقول plural خالص.", "ex": ["Correct. | صح.", "No. The word plural is never mentioned. | غلط: كلمة plural مابتتقالش أبدًا.", "No. The apples are just realia supporting the story. | غلط: التفاح مجرد مجسمات بتدعم القصة."], "n": 1, "i": 131, "h": ""}, {"t": "mc", "q": "My books is wet. The best teacher response is:<br>My books is wet. أحسن رد من المدرس هو:", "opts": ["Oh, your books are wet. Why are they wet? | Oh, your books are wet. Why are they wet?", "Wrong. Say are, not is. | غلط. قول are مش is.", "Open your books to page ten. | افتحوا الكتب على صفحة عشرة."], "ans": 0, "why": "Corrective feedback models the correct form naturally inside the conversation. | التغذية الراجعة التصحيحية بتمثّل الصيغة الصح طبيعي جوه المحادثة.", "ex": ["Correct. | صح.", "No. Direct metalanguage correction does not fit this age. | غلط: التصحيح المباشر بالميتالغة مش مناسب للسن ده.", "No. That ignores the learning moment. | غلط: ده بيتجاهل لحظة التعلم."], "n": 1, "i": 132, "h": ""}, {"t": "tf", "q": "Language recycling is meeting and using a word several times until it is remembered naturally.<br>التدوير اللغوي هو مقابلة الكلمة واستخدامها كذا مرة لحد ما تتفتكر طبيعي.", "ans": true, "why": "True. Frequency, how often they meet a word, is the key factor. | صح. التكرار، يعني كل قد إيه بيقابلوا الكلمة، هو العامل الأساسي.", "ex": ["Correct. | صح.", "Wrong. That is exactly the definition of recycling. | غلط: ده بالظبط تعريف التدوير."], "n": 1, "i": 133, "h": ""}, {"t": "mc", "q": "For disenchanted teenagers, which technique does the unit recommend?<br>للمراهقين الزهقانين، أنهي تقنية الوحدة بتوصي بيها؟", "opts": ["controlled competition in pairs or groups | منافسة مضبوطة في أزواج أو مجموعات", "heavy use of metalanguage | استخدام مكثف للميتالغة", "long grammar lectures | محاضرات قواعد طويلة"], "ans": 0, "why": "Competition in groups with time limits raises energy, and nobody is embarrassed alone. | المنافسة في مجموعات بوقت محدد بتعلّي الحماس، ومحدش بيتكسف لوحده.", "ex": ["Correct. | صح.", "No. The unit says to avoid metalanguage with teenagers. | غلط: الوحدة بتقول ابعد عن الميتالغة مع المراهقين.", "No. Lectures kill their interest further. | غلط: المحاضرات بتموّت اهتمامهم أكتر."], "n": 1, "i": 134, "h": ""}, {"t": "tf", "q": "A needs analysis is a process of finding out what needs a learner has.<br>تحليل الاحتياجات هو عملية اكتشاف المتعلم محتاج إيه.", "ans": true, "why": "True, and do it informally, not as a big formal event. | صح، واعمله بشكل غير رسمي، مش كحدث رسمي كبير.", "ex": ["Correct. | صح.", "Wrong. Finding out needs is exactly what it is. | غلط: اكتشاف الاحتياجات هو هو بالظبط."], "n": 1, "i": 135, "h": ""}, {"t": "mc", "q": "The ugggawagga kicked a thnollanugga. We know ugggawagga is a noun because of:<br>The ugggawagga kicked a thnollanugga. عرفنا إن ugggawagga اسم بسبب:", "opts": ["its function and setting: after The, doing the action | وظيفتها وإطارها: بعد The وبتعمل الفعل", "its meaning | معناها", "its plural ending | نهاية الجمع بتاعتها"], "ans": 0, "why": "We do not know the meaning at all. It sits after The and does the kicking, so it is the subject noun. | إحنا مش عارفين المعنى خالص. هي بعد The وبتعمل فعل الركل، فهي الاسم الفاعل.", "ex": ["Correct. | صح.", "No. The word is invented; nobody knows its meaning. | غلط: الكلمة مختلقة؛ محدش يعرف معناها.", "No. There is no plural ending here. | غلط: مفيش نهاية جمع هنا."], "n": 1, "i": 136, "h": ""}, {"t": "mc", "q": "In The big boy ___ the small boy's ball, the missing word must be:<br>في The big boy ___ the small boy's ball، الكلمة الناقصة لازم تبقى:", "opts": ["a transitive verb | فعل متعدّي", "a noun | اسم", "an adjective | صفة"], "ans": 0, "why": "A sentence needs a verb, and the presence of an object (the ball) makes it transitive. | الجملة محتاجة فعل، ووجود مفعول (الكورة) بيخليه متعدّي.", "ex": ["Correct. | صح.", "No. The frame needs the action word. | غلط: الفريم محتاج كلمة الحدث.", "No. An adjective cannot complete this frame. | غلط: الصفة ماتكملش الفريم ده."], "n": 1, "i": 137, "h": ""}, {"t": "mc", "q": "How should games and drills be used with adult learners?<br>الألعاب والتكرار يتستخدموا إزاي مع المتعلمين الكبار؟", "opts": ["sparingly, with the end goal explained | باعتدال، مع شرح الهدف النهائي", "as much as possible | بأكبر قدر ممكن", "never, under any circumstances | أبدًا، تحت أي ظرف"], "ans": 0, "why": "Many adults see drilling as childish, and they have a goal and a time limit. The odd game is fine if you explain why. | كتير من الكبار شايفين التكرار للأطفال، وعندهم هدف ووقت محدد. لعبة أو اتنين تمام لو شرحت ليه.", "ex": ["Correct. | صح.", "No. Too much can dampen the class atmosphere. | غلط: الكتر ممكن يبوّظ جو الفصل.", "No. The unit allows the odd game or two. | غلط: الوحدة بتسمح بلعبة أو اتنين."], "n": 1, "i": 138, "h": ""}, {"t": "tf", "q": "When teenagers reach a plateau, the unit says to remind them how grammar helps with blogs, exams, and future travel or work.<br>لما المراهقين يوصلوا لمرحلة ركود، الوحدة بتقول فكّرهم إن القواعد بتساعد في المدونات والامتحانات والسفر أو الشغل مستقبلًا.", "ans": true, "why": "True. Empathising and reminding them of the real-world payoff is part of the approach. | صح. التعاطف وتذكيرهم بالفايدة الحقيقية جزء من المنهج.", "ex": ["Correct. | صح.", "Wrong. Reminding them of the payoff is recommended. | غلط: تذكيرهم بالفايدة حاجة موصى بيها."], "n": 1, "i": 139, "h": ""}, {"t": "recall", "q": "Name the four age groupings for teaching grammar, and one key rule for the youngest.<br>اذكر الفئات العمرية الأربعة لتدريس القواعد، وقاعدة أساسية واحدة لأصغر فئة.", "a": "Younger young learners, older young learners, teenagers, adults. For the youngest: never teach grammar formally or in isolation; build noticing through stories and songs.<br>الأطفال الصغيرين، الأطفال الأكبر، المراهقين، الكبار. لأصغر فئة: ممنوع تدرّس قواعد رسميًا أو منعزلة؛ ابني الملاحظة من خلال القصص والأغاني.", "n": 1, "i": 140, "h": ""}, {"t": "recall", "q": "Name the four grammar-detective concepts for adults, with a one-line meaning of each.<br>اذكر مفاهيم محقق القواعد الأربعة للكبار، بمعنى سطر واحد لكل واحد.", "a": "Meaning: literal vs contextual. Form: what the word looks like. Function: what the word does. Setting: the frame other words fit into.<br>المعنى: حرفي ضد سياقي. الشكل: الكلمة شكلها إيه. الوظيفة: الكلمة بتعمل إيه. الإطار: الفريم اللي الكلمات التانية بتركب فيه.", "n": 1, "i": 141, "h": ""}, {"t": "write", "q": "Explain how the apples story teaches grammar without the children noticing (4-5 sentences).<br>اشرح إزاي قصة التفاح بتعلّم القواعد من غير ما الأطفال يحسوا (٤-٥ جمل).", "key": "tefl-19:1", "a": "The teacher reads a story where Piggy eats one apple and Lionel eats two apples, holding up real apples as props. Through questions and choral repetition, the class says one apple and two apples many times. Then the teacher asks if the two phrases sound the same, and a learner notices the sss sound at the end of apples. The teacher states the pattern simply, without ever saying the word plural. The grammar point is learned inside the story, as learning-centred grammar.<br>المدرس بيقرا قصة فيها Piggy بياكل one apple وLionel بياكل two apples، وبيرفع تفاحات حقيقية كمجسمات. من خلال الأسئلة والتكرار الجماعي، الكلاس بيقول one apple وtwo apples مرات كتير. وبعدين المدرس بيسأل لو العبارتين صوتهم واحد، ومتعلم بيلاحظ صوت السين في آخر apples. المدرس بيصرّح بالنمط ببساطة، من غير ما يقول كلمة plural أبدًا. نقطة القواعد اتعلمت جوه القصة، كقواعد متمحورة حوالين التعلم.", "n": 1, "i": 142, "h": ""}, {"t": "write", "q": "Why do adults need a needs analysis before grammar teaching, and how is it done (3-4 sentences)?<br>ليه الكبار محتاجين تحليل احتياجات قبل تدريس القواعد، وبيتعمل إزاي (٣-٤ جمل)؟", "key": "tefl-19:2", "a": "An adult class is diverse in background, culture, and goals, so one grammar plan cannot fit everyone. A needs analysis finds out what each learner needs English for: their current level and their future target, like college or work tasks. It is done informally, through a chat in the first meeting, with direct questions like: what do you have to do in English at work? The teacher then plans the grammar teaching to close that gap.<br>فصل الكبار متنوع في الخلفية والثقافة والأهداف، فخطة قواعد واحدة مستحيل تناسب الكل. تحليل الاحتياجات بيكشف كل متعلم محتاج الإنجليزية في إيه: مستواه الحالي وهدفه المستقبلي، زي مهام الكلية أو الشغل. وبيتعمل بشكل غير رسمي، من خلال دردشة في أول مقابلة، بأسئلة مباشرة زي: محتاج تعمل إيه بالإنجليزية في شغلك؟ وبعدين المدرس بيخطط تدريس القواعد عشان يقفل الفجوة دي.", "n": 1, "i": 143, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 3, lesson planning, starting with the PPP approach: Presentation, Practice, Production.</div><div class=\"u\">الدرس الجاي: الموديول التالت، التخطيط للدروس، نبدأ بطريقة PPP: التقديم والتمرين والإنتاج.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 144}];</script>
