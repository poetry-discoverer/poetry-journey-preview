<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤٥</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-45";window.STEPS=[{"t": "section", "h": "Module 9 welcome | ترحيب الموديول التاسع", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Module 9. The two productive skills are speaking and writing, because they require students to produce language.</div><div class=\"u\">أهلاً بيك في الموديول التاسع. المهارتين الإنتاجيتين هما الكلام والكتابة، لأنهم بيطلبوا من الطلبة ينتجوا لغة.</div>", "n": 1, "i": 1, "a": "tefl-45-001", "x": "7059a426"}, {"t": "learn", "h": "<div class=\"u\">They are sometimes also called active skills, as opposed to the passive, or receptive, skills of listening and reading.</div><div class=\"u\">وأحيانًا بتتسمى المهارات النشطة، عكس المهارات السلبية، أو الاستقبالية، بتاعة الاستماع والقراءة.</div>", "n": 1, "i": 2, "a": "tefl-45-002", "x": "230d0c79"}, {"t": "learn", "h": "<div class=\"u\">Normally these skills develop after the receptive skills, because students need to receive language before they can produce it.</div><div class=\"u\">عادة المهارات دي بتتطور بعد الاستقبالية، لأن الطلبة محتاجين يستقبلوا اللغة قبل ما يقدروا ينتجوها.</div>", "n": 1, "i": 3, "a": "tefl-45-003", "x": "62ad2588"}, {"t": "learn", "h": "<div class=\"u\">But ideally they should be developed simultaneously, as they complement each other.</div><div class=\"u\">بس المثالي إنهم يتطوروا في نفس الوقت، لأنهم بيكمّلوا بعض.</div>", "n": 1, "i": 4, "a": "tefl-45-004", "x": "8ef4baa8"}, {"t": "learn", "h": "<div class=\"u\">This unit looks in detail at speaking skills and what is required to develop them. The Functions video from Module 6 is a good example of a speaking lesson.</div><div class=\"u\">الوحدة دي بتبص بالتفصيل على مهارات الكلام وإيه المطلوب لتنميتها. وفيديو الوظايف من الموديول السادس مثال كويس لدرس كلام.</div>", "n": 1, "i": 5, "a": "tefl-45-005", "x": "e08f185e"}, {"t": "section", "h": "Speaking is complex | الكلام معقد", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">As with reading, when we speak there is a lot more going on than you might realise.</div><div class=\"u\">وزي القراءة، لما بنتكلم في حاجات كتير بتحصل أكتر مما ممكن تتخيل.</div>", "n": 1, "i": 7, "a": "tefl-45-006", "x": "7977f4dc"}, {"t": "learn", "h": "<div class=\"u\">It is not just about using grammar and vocabulary accurately.</div><div class=\"u\">مش بس استخدام القواعد والمفردات بدقة.</div>", "n": 1, "i": 8, "a": "tefl-45-007", "x": "d2ecb032"}, {"t": "learn", "h": "<div class=\"u\">We also use an appropriate register (level of formality), self-correct, hesitate, use stress and intonation, and use different interactive strategies to communicate effectively.</div><div class=\"u\">كمان بنستخدم مستوى مناسب (درجة الرسمية)، وبنصحّح لنفسنا، وبنتردد، وبنستخدم النبر والتنغيم، وبنستخدم استراتيجيات تفاعلية مختلفة عشان نوصّل بفاعلية.</div>", "n": 1, "i": 9, "a": "tefl-45-008", "x": "6ef311d5"}, {"t": "learn", "h": "<div class=\"u\">These strategies can be anything from asking opinions and clarifying our meaning to turn-taking and agreeing or disagreeing, to keep up interaction.</div><div class=\"u\">الاستراتيجيات دي ممكن تبقى أي حاجة من سؤال الآراء وتوضيح معناها لتبادل الأدوار والموافقة أو الاعتراض، عشان نحافظ على التفاعل.</div>", "n": 1, "i": 10, "a": "tefl-45-009", "x": "2cd0b85b"}, {"t": "learn", "h": "<div class=\"u\">Even native speakers are not actually one hundred percent accurate when they speak, because of the necessity to talk in real time.</div><div class=\"u\">حتى أصحاب اللغة الأصليين مش بيبقوا دقتهم مية في المية لما بيتكلموا، بسبب ضرورة الكلام في الوقت الحقيقي.</div>", "n": 1, "i": 11, "a": "tefl-45-010", "x": "c48fe9df"}, {"t": "learn", "h": "<div class=\"u\">Unlike when we write, we do not have time to properly organise our thoughts, so we often make mistakes, interrupt, flit between topics, and correct ourselves or clarify meaning.</div><div class=\"u\">عكس الكتابة، ماعندناش وقت نرتّب أفكارنا كويس، فغالبًا بنغلط، وبنقاطع، وبنطّ من موضوع لموضوع، وبنصحّح لنفسنا أو بنوضّح المعنى.</div>", "n": 1, "i": 12, "a": "tefl-45-011", "x": "6a9d540c"}, {"t": "learn", "h": "<div class=\"u\">This lack of preparation time makes speaking in a foreign language especially difficult.</div><div class=\"u\">غياب وقت التحضير ده بيخلي الكلام بلغة أجنبية صعب بالذات.</div>", "n": 1, "i": 13, "a": "tefl-45-012", "x": "4eafeec6"}, {"t": "learn", "h": "<div class=\"u\">Your students may not know the necessary vocabulary for a topic, and on top of that they may not have the skills to respond immediately. That is why you need to develop these skills.</div><div class=\"u\">طلبتك ممكن ميبقوش عارفين المفردات الضرورية لموضوع معين، وفوق كده ممكن مايبقاش عندهم المهارات إنهم يردّوا فورًا. عشان كده لازم تنمّي المهارات دي فيهم.</div>", "n": 1, "i": 14, "a": "tefl-45-013", "x": "6561885b"}, {"t": "section", "h": "Controlled practice | التدريب الموجّه", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">Before any speaking lesson, decide if your main aim is fluency, accuracy or both. This affects how you conduct the lesson, the activities, and how or whether to correct.</div><div class=\"u\">قبل أي درس كلام، قرر إذا كان هدفك الرئيسي الطلاقة، أو الدقة، أو الاتنين. ده بيأثر في إدارتك للدرس والأنشطة وإزاي أو لو هتصحّح.</div>", "n": 1, "i": 16, "a": "tefl-45-014", "x": "36838fdc"}, {"t": "learn", "h": "<div class=\"u\">Controlled practice: examples are scripted role-plays, repetition and drilling.</div><div class=\"u\">التدريب الموجّه: أمثلته لعب الأدوار المكتوب، والتكرار، والتدريبات.</div>", "n": 1, "i": 17, "a": "tefl-45-015", "x": "33688612"}, {"t": "learn", "h": "<div class=\"u\">These do not give practice of fluency or interaction, but they are very useful for accuracy, pronunciation and word and sentence stress.</div><div class=\"u\">دي مابتدّيش تدريب على الطلاقة أو التفاعل، بس مفيدة جدًا للدقة والنطق ونبر الكلمات والجمل.</div>", "n": 1, "i": 18, "a": "tefl-45-016", "x": "a73b6c1b"}, {"t": "learn", "h": "<div class=\"u\">They help build learners' confidence, motivate them to produce grammatically correct language, and are less overwhelming for shyer students, so they lead nicely into freer practice.</div><div class=\"u\">بتساعد تبني ثقة المتعلمين، وبيحفّزهم ينتجوا لغة صح قواعديًا، وأقل إرباكًا للطلبة الخجولين، فبتوصّل بشكل حلو للتدريب الحر.</div>", "n": 1, "i": 19, "a": "tefl-45-017", "x": "5e595f2a"}, {"t": "learn", "h": "<div class=\"u\">Students often find it difficult to transfer the knowledge in their heads to what comes out of their mouths, so controlled practice is a good midway point on the road to spontaneous communication.</div><div class=\"u\">الطلبة غالبًا بيلاقوا صعوبة ينقلوا المعرفة اللي في دماغهم للي بيطلع من بقهم، فالتدريب الموجّه نقطة وسط كويسة على طريق التواصل التلقائي.</div>", "n": 1, "i": 20, "a": "tefl-45-018", "x": "3241dd63"}, {"t": "learn", "h": "<div class=\"u\">Through controlled practice, learners apply what they know passively to active production, so that passive knowledge is not wasted.</div><div class=\"u\">من خلال التدريب الموجّه، المتعلمين بيطبّقوا اللي عارفينه سلبيًا على الإنتاج النشط، عشان المعرفة السلبية ماتروحش هدر.</div>", "n": 1, "i": 21, "a": "tefl-45-019", "x": "869c89b2"}, {"t": "learn", "h": "<div class=\"u\">It can be embarrassing when students do not know what they are supposed to say and fear errors, so having the language in front of them is reassuring.</div><div class=\"u\">ممكن يبقى محرج لما الطلبة مابيبقوش عارفين المفروض يقولوا إيه وخايفين من الغلط، فإن اللغة تبقى قدامهم بيطمّنهم.</div>", "n": 1, "i": 22, "a": "tefl-45-020", "x": "43ab5723"}, {"t": "learn", "h": "<div class=\"u\">Controlled practice confines the conversation to the target language, with fully predictable prompts and responses, so the language point sticks in their heads.</div><div class=\"u\">التدريب الموجّه بيحصّر المحادثة في اللغة المستهدفة، بمحفّزات وردود متوقعة تمامًا، فالنقطة اللغوية بتثبت في دماغهم.</div>", "n": 1, "i": 23, "a": "tefl-45-021", "x": "d7e9172d"}, {"t": "learn", "h": "<div class=\"u\">For polite requests, have students act out a scripted dialogue so they memorise the useful fixed expressions.</div><div class=\"u\">للطلبات المؤدبة، خلّي الطلبة يمثّلوا حوار مكتوب عشان يحفظوا التعبيرات الثابتة المفيدة.</div>", "n": 1, "i": 24, "a": "tefl-45-022", "x": "c9f5e289"}, {"t": "learn", "h": "<div class=\"u\">For a numbers lesson, put students in pairs with question cards like: what is the population of the UK? Each student has half the answers, and by asking and answering they complete both sets.</div><div class=\"u\">لدرس الأرقام، حط الطلبة في أزواج بكروت أسئلة زي: إيه عدد سكان بريطانيا؟ كل طالب معاه نص الإجابات، وبالسؤال والجواب بيكمّلوا المجموعتين.</div>", "n": 1, "i": 25, "a": "tefl-45-023", "x": "41ccb961"}, {"t": "learn", "h": "<div class=\"u\">Only the target language is practised, and responses are one hundred percent predictable.</div><div class=\"u\">بس اللغة المستهدفة هي اللي بتتدرب، والردود متوقعة مية في المية.</div>", "n": 1, "i": 26, "a": "tefl-45-024", "x": "0b33eb40"}, {"t": "section", "h": "Accuracy exercises | تمارين الدقة", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">Which speaking exercises improve accuracy? Word and sentence stress, distinguishing minimal pairs of sounds, using intonation to show doubt, and intonation in tag questions.</div><div class=\"u\">أنهي تمارين كلام بتحسّن الدقة؟ نبر الكلمات والجمل، والتمييز بين الأزواج الصوتية الدنيا، واستخدام التنغيم لإظهار الشك، والتنغيم في الأسئلة المذيلة.</div>", "n": 1, "i": 28, "a": "tefl-45-025", "x": "ff86eb95"}, {"t": "learn", "h": "<div class=\"u\">Also accuracy: using conjunctions and past tenses in stories.</div><div class=\"u\">وكمان من الدقة: استخدام أدوات الربط والأزمنة الماضية في القصص.</div>", "n": 1, "i": 29, "a": "tefl-45-026", "x": "aca5c090"}, {"t": "learn", "h": "<div class=\"u\">The others are about interaction: clarification, informal greetings, suggesting, discussions, getting agreement, stories, and interrupting politely.</div><div class=\"u\">الباقي بيتعلق بالتفاعل: التوضيح، التحيات غير الرسمية، الاقتراح، المناقشات، الإقناع، القصص، والمقاطعة بأدب.</div>", "n": 1, "i": 30, "a": "tefl-45-027", "x": "7fd1e71b"}, {"t": "section", "h": "Free practice | التدريب الحر", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">Free practice, on the other hand, is more challenging. It improves fluency: the ability to speak at a natural speed without too many hesitations.</div><div class=\"u\">التدريب الحر، على الناحية التانية، أصعب. بيحسّن الطلاقة: القدرة على الكلام بسرعة طبيعية من غير ترددات كتير.</div>", "n": 1, "i": 32, "a": "tefl-45-028", "x": "01929733"}, {"t": "learn", "h": "<div class=\"u\">The idea is that your students get better at speaking by speaking.</div><div class=\"u\">الفكرة إن طلبتك بيتحسّنوا في الكلام عن طريق الكلام.</div>", "n": 1, "i": 33, "a": "tefl-45-029", "x": "f6ee1ba5"}, {"t": "learn", "h": "<div class=\"u\">In the past, learners often had a good grammatical and theoretical knowledge of the language but were unable to use it.</div><div class=\"u\">في الماضي، المتعلمين غالبًا كان عندهم معرفة قواعدية ونظرية كويسة باللغة بس مابيقدروش يستخدموها.</div>", "n": 1, "i": 34, "a": "tefl-45-030", "x": "c33a7389"}, {"t": "learn", "h": "<div class=\"u\">This is more or less useless in today's society, where people from all over the world must communicate effectively in English.</div><div class=\"u\">وده عديم الفايدة تقريبًا في مجتمع النهارده، اللي ناس من كل أنحاء العالم لازم يتواصلوا فيه بفاعلية بالإنجليزية.</div>", "n": 1, "i": 35, "a": "tefl-45-031", "x": "1556ce43"}, {"t": "learn", "h": "<div class=\"u\">Communicative activities encourage fluency, but the important thing is to maximise the time the students themselves speak. It can be hard to step back from jumping into the discussion.</div><div class=\"u\">الأنشطة التواصلية بتشجّع الطلاقة، بس المهم إنك تعظّم وقت كلام الطلبة نفسهم. وممكن يبقى صعب تبعد عن النط في المناقشة.</div>", "n": 1, "i": 36, "a": "tefl-45-032", "x": "b913e231"}, {"t": "learn", "h": "<div class=\"u\">Error correction needs to be used tentatively with fluency activities, so the flow is not interrupted too much. Give students the freedom, and more importantly the time, they need for the task.</div><div class=\"u\">تصحيح الأخطاء لازم يتستخدم بتحفّظ مع أنشطة الطلاقة، عشان التدفق ميتقطعش كتير. ادّي الطلبة الحرية، والأهم الوقت، اللي محتاجينه للمهمة.</div>", "n": 1, "i": 37, "a": "tefl-45-033", "x": "0fe256d5"}, {"t": "section", "h": "Starting discussions | بدء المناقشات", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">An appropriate lead-in can be key to starting a discussion task well: focusing on an image or a statement to get ideas flowing.</div><div class=\"u\">المقدمة المناسبة ممكن تبقى مفتاح بداية كويسة لمهمة نقاش: التركيز على صورة أو عبارة عشان الأفكار تجري.</div>", "n": 1, "i": 39, "a": "tefl-45-034", "x": "5ac6c613"}, {"t": "learn", "h": "<div class=\"u\">A lead-in is also a good chance to pre-teach essential vocabulary.</div><div class=\"u\">والمقدمة كمان فرصة كويسة لتعليم المفردات الأساسية مسبقًا.</div>", "n": 1, "i": 40, "a": "tefl-45-035", "x": "edeb00ff"}, {"t": "learn", "h": "<div class=\"u\">Do not just start with: let's talk about global warming. Ahmed, what do you think? This catches students completely off-guard and is not conducive to a lively debate.</div><div class=\"u\">ماتبدأش بـ: يلا نتكلم عن الاحتباس الحراري. أحمد، رأيك إيه؟ ده بياخد الطلبة على غفلة تمامًا ومابيشجّعش نقاش حيوي.</div>", "n": 1, "i": 41, "a": "tefl-45-036", "x": "9d120e66"}, {"t": "learn", "h": "<div class=\"u\">Although it is supposed to be free speaking, that does not mean there should be no structure.</div><div class=\"u\">بالرغم إن المفروض إنه كلام حر، ده مش معناه إن ميبقاش في هيكل.</div>", "n": 1, "i": 42, "a": "tefl-45-037", "x": "81071d88"}, {"t": "learn", "h": "<div class=\"u\">You could give students role cards, like: you are a member of a green activist group, or: you work for the logging industry.</div><div class=\"u\">ممكن تدّي الطلبة كروت أدوار، زي: إنت عضو في جماعة نشطاء بيئيين، أو: إنت شغال في صناعة قطع الأشجار.</div>", "n": 1, "i": 43, "a": "tefl-45-038", "x": "db3195c9"}, {"t": "learn", "h": "<div class=\"u\">Or set a scenario and give the class some information or data to read through first.</div><div class=\"u\">أو حط سيناريو وادّي الفصل معلومات أو بيانات يقرأوها الأول.</div>", "n": 1, "i": 44, "a": "tefl-45-039", "x": "98286fae"}, {"t": "learn", "h": "<div class=\"u\">Simulating real-life situations also works well: a wind farm is planned three miles from your house, and you are going to a meeting for local residents to discuss your views.</div><div class=\"u\">محاكاة مواقف الحياة الحقيقية كمان بتنجح: مزرعة رياح متخطط تتبني على تلاتة ميل من بيتك، وإنت رايح اجتماع لسكان المنطقة تناقشوا آراءكم.</div>", "n": 1, "i": 45, "a": "tefl-45-040", "x": "03b00e10"}, {"t": "learn", "h": "<div class=\"u\">The whole point is to provoke spontaneity and challenge learners to use language they perhaps have not tried before.</div><div class=\"u\">الفكرة كلها إنك تستفز التلقائية وتحدّي المتعلمين يستخدموا لغة ممكن يكونوا مجربوهاش قبل كده.</div>", "n": 1, "i": 46, "a": "tefl-45-041", "x": "555692db"}, {"t": "section", "h": "Fluency exercises | تمارين الطلاقة", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">And which exercises improve fluency? The interactive ones: taking part in discussions, getting your partner to agree with you, telling stories, and interrupting politely.</div><div class=\"u\">وأنهي تمارين بتحسّن الطلاقة؟ التفاعلية: المشاركة في المناقشات، إقناع شريكك برأيك، حكاية القصص، والمقاطعة بأدب.</div>", "n": 1, "i": 48, "a": "tefl-45-042", "x": "09e58d05"}, {"t": "learn", "h": "<div class=\"u\">The functional language ones, like asking for clarification politely, informal greetings, and suggesting and recommending, serve both interaction and everyday communication.</div><div class=\"u\">والتمارين الوظيفية، زي طلب التوضيح بأدب، والتحيات غير الرسمية، والاقتراح والتوصية، بتخدم التفاعل والتواصل اليومي.</div>", "n": 1, "i": 49, "a": "tefl-45-043", "x": "06e030ee"}, {"t": "section", "h": "The teacher's role | دور المدرس", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">Your role in fluency activities is to introduce the task and then monitor, rather than being a full contributor.</div><div class=\"u\">دورك في أنشطة الطلاقة إنك تقدّم المهمة وبعدين تراقب، بدل ما تبقى مشارك كامل.</div>", "n": 1, "i": 51, "a": "tefl-45-044", "x": "588fe14a"}, {"t": "learn", "h": "<div class=\"u\">Avoid taking part too much yourself, but you can play devil's advocate every so often to prompt the discussion if it starts to die off.</div><div class=\"u\">تجنّب المشاركة الكتير بنفسك، بس تقدر تلعب دور محامي الشيطان من وقت للتاني عشان تنشّط المناقشة لو بدأت تموت.</div>", "n": 1, "i": 52, "a": "tefl-45-045", "x": "9c694148"}, {"t": "learn", "h": "<div class=\"u\">Another method is to split students into smaller groups which switch round, to keep their interest if conversation is dwindling.</div><div class=\"u\">طريقة تانية إنك تقسّم الطلبة لمجموعات أصغر بتتبدّل، عشان تحافظ على اهتمامهم لو الكلام بيخفت.</div>", "n": 1, "i": 53, "a": "tefl-45-046", "x": "e0296667"}, {"t": "learn", "h": "<div class=\"u\">A common cause of students drying up is that they have not had any preparation time. Speaking in a foreign language is a slower process and needs more time to think.</div><div class=\"u\">سبب شائع لجفاف كلام الطلبة إنهم ماخدوش وقت تحضير. الكلام بلغة أجنبية عملية أبطأ ومحتاجة وقت تفكير أكتر.</div>", "n": 1, "i": 54, "a": "tefl-45-047", "x": "6af70d3d"}, {"t": "learn", "h": "<div class=\"u\">If you throw your class in at the deep end without thinking time, they may become too flustered to find the words, and say nothing at all.</div><div class=\"u\">لو رميت فصلك في العمق من غير وقت تفكير، ممكن يتوتروا عشان يلاقوا الكلمات، فمايقولوش أي حاجة.</div>", "n": 1, "i": 55, "a": "tefl-45-048", "x": "ca42a87b"}, {"t": "learn", "h": "<div class=\"u\">Step back and give them time to process the task.</div><div class=\"u\">ابعد وادّيهم وقت يعالجوا المهمة.</div>", "n": 1, "i": 56, "a": "tefl-45-049", "x": "09febb98"}, {"t": "section", "h": "Lead or monitor? | قيادة أو مراقبة؟", "n": 1, "i": 57}, {"t": "learn", "h": "<div class=\"u\">The stages of a fluency speaking lesson, and whether the teacher takes the lead or monitors, adapted from Scrivener.</div><div class=\"u\">مراحل درس كلام للطلاقة، وإمتى المدرس بيقود وإمتى بيراقب، مأخوذة من سكريفنر.</div>", "n": 1, "i": 58, "a": "tefl-45-050", "x": "1bf9973f"}, {"t": "learn", "h": "<div class=\"u\">Stage one, introduce the task and pre-teach vocabulary: take the lead.</div><div class=\"u\">المرحلة الأولى، تقديم المهمة وتعليم المفردات مسبقًا: خد القيادة.</div>", "n": 1, "i": 59, "a": "tefl-45-051", "x": "c89bd6fe"}, {"t": "learn", "h": "<div class=\"u\">Stage two, set up the task, give instructions and put students into pairs or groups: take the lead.</div><div class=\"u\">المرحلة التانية، تجهيز المهمة، إعطاء التعليمات ووضع الطلبة في أزواج أو مجموعات: خد القيادة.</div>", "n": 1, "i": 60, "a": "tefl-45-052", "x": "75244582"}, {"t": "learn", "h": "<div class=\"u\">Stage three, run the activity: monitor.</div><div class=\"u\">المرحلة التالتة، تشغيل النشاط: راقب.</div>", "n": 1, "i": 61, "a": "tefl-45-053", "x": "14a63082"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">fluency: speaking at a natural speed without too many hesitations.</div><div class=\"u\">الطلاقة: الكلام بسرعة طبيعية من غير ترددات كتير.</div>", "n": 1, "i": 63, "a": "tefl-45-054", "x": "0c065e88"}, {"t": "learn", "h": "<div class=\"u\">accuracy: producing correct grammar, vocabulary and pronunciation.</div><div class=\"u\">الدقة: إنتاج قواعد ومفردات ونطق صح.</div>", "n": 1, "i": 64, "a": "tefl-45-055", "x": "d0768397"}, {"t": "learn", "h": "<div class=\"u\">controlled practice: guided exercises with predictable responses.</div><div class=\"u\">التدريب الموجّه: تمارين موجّهة بردود متوقعة.</div>", "n": 1, "i": 65, "a": "tefl-45-056", "x": "65ffc1fa"}, {"t": "learn", "h": "<div class=\"u\">free practice: open activities where students speak freely.</div><div class=\"u\">التدريب الحر: أنشطة مفتوحة الطلبة بيتكلموا فيها بحرية.</div>", "n": 1, "i": 66, "a": "tefl-45-057", "x": "d068a274"}, {"t": "learn", "h": "<div class=\"u\">drilling: repeating language many times to fix it.</div><div class=\"u\">التدريب: تكرار اللغة مرات كتير عشان تثبت.</div>", "n": 1, "i": 67, "a": "tefl-45-058", "x": "a44d1271"}, {"t": "learn", "h": "<div class=\"u\">turn-taking: knowing when to speak and when to listen in a conversation.</div><div class=\"u\">تبادل الأدوار: معرفة إمتى تتكلم وإمتى تسمع في المحادثة.</div>", "n": 1, "i": 68, "a": "tefl-45-059", "x": "267fd90f"}, {"t": "learn", "h": "<div class=\"u\">self-correction: fixing your own mistakes while speaking.</div><div class=\"u\">التصحيح الذاتي: إصلاح غلطاتك بنفسك أثناء الكلام.</div>", "n": 1, "i": 69, "a": "tefl-45-060", "x": "ec771616"}, {"t": "learn", "h": "<div class=\"u\">role card: a card giving a student a character or position in an activity.</div><div class=\"u\">كارت الدور: كارت بيدّي الطالب شخصية أو موقف في نشاط.</div>", "n": 1, "i": 70, "a": "tefl-45-061", "x": "a324a1ef"}, {"t": "learn", "h": "<div class=\"u\">monitor: to watch and listen while students work, without joining in.</div><div class=\"u\">المراقبة: التفرج والاستماع أثناء شغل الطلبة، من غير مشاركة.</div>", "n": 1, "i": 71, "a": "tefl-45-062", "x": "8ca0f255"}, {"t": "learn", "h": "<div class=\"u\">minimal pair: two words differing in one sound, like ship and sheep.</div><div class=\"u\">الزوج الدنيا: كلمتين مختلفين في صوت واحد، زي سفينة وخروف بالإنجليزي.</div>", "n": 1, "i": 72, "a": "tefl-45-063", "x": "55bcc289"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 73}, {"t": "learn", "h": "<div class=\"u\">Speaking and writing are the productive, active skills; develop them alongside the receptive ones because they complement each other.</div><div class=\"u\">الكلام والكتابة هما المهارات الإنتاجية النشطة؛ نمّيهم جنب الاستقبالية لأنهم بيكمّلوا بعض.</div>", "n": 1, "i": 74, "a": "tefl-45-064", "x": "7393f0f8"}, {"t": "learn", "h": "<div class=\"u\">Speaking is more than grammar and vocabulary: register, self-correction, hesitation, stress, intonation and interactive strategies all play a part.</div><div class=\"u\">الكلام أكتر من قواعد ومفردات: المستوى والتصحيح الذاتي والتردد والنبر والتنغيم والاستراتيجيات التفاعلية كلها بتلعب دور.</div>", "n": 1, "i": 75, "a": "tefl-45-065", "x": "4eac1c9d"}, {"t": "learn", "h": "<div class=\"u\">Decide your aim first: fluency, accuracy or both; it shapes the activities and your correction style.</div><div class=\"u\">قرر هدفك الأول: طلاقة أو دقة أو الاتنين؛ ده بيشكّل الأنشطة وأسلوب تصحيحك.</div>", "n": 1, "i": 76, "a": "tefl-45-066", "x": "cbab8916"}, {"t": "learn", "h": "<div class=\"u\">Controlled practice builds accuracy and confidence with predictable language; free practice builds fluency by maximising student talk time.</div><div class=\"u\">التدريب الموجّه بيبني الدقة والثقة بلغة متوقعة؛ التدريب الحر بيبني الطلاقة بتعظيم وقت كلام الطلبة.</div>", "n": 1, "i": 77, "a": "tefl-45-067", "x": "993c4136"}, {"t": "learn", "h": "<div class=\"u\">Lead discussions with images, role cards and scenarios; then step back, monitor, and give students thinking time so they do not dry up.</div><div class=\"u\">قدّم المناقشات بصور وكروت أدوار وسيناريوهات؛ وبعدين ابعد، راقب، وادّي الطلبة وقت تفكير عشان كلامهم ميجفّش.</div>", "n": 1, "i": 78, "a": "tefl-45-068", "x": "665b4c01"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 79}, {"t": "tf", "q": "Native speakers are one hundred percent accurate when they speak.<br>أصحاب اللغة الأصليين بيبقوا دقتهم مية في المية لما بيتكلموا.", "ans": false, "why": "False. Speaking happens in real time, so even native speakers make mistakes, interrupt and correct themselves. | غلط. الكلام بيحصل في الوقت الحقيقي، فحتى أصحاب اللغة بيغلطوا وبيقاطعوا وبيصحّحوا لنفسهم.", "ex": ["Correct. Real-time speech always carries some inaccuracy. | صح: الكلام الفوري دايمًا فيه شوية عدم دقة.", "Wrong. Nobody speaks with perfect accuracy. | غلط: محدش بيتكلم بدقة مثالية."], "n": 1, "i": 80, "h": ""}, {"t": "mc", "q": "Which is an example of controlled speaking practice?<br>أنهي مثال للتدريب الموجّه على الكلام؟", "opts": ["a scripted role-play | لعب أدوار مكتوب", "an open class debate | مناقشة مفتوحة للفصل", "a free discussion about global warming | نقاش حر عن الاحتباس الحراري"], "ans": 0, "why": "Scripted role-plays, repetition and drilling are controlled practice. | لعب الأدوار المكتوب والتكرار والتدريبات تدريب موجّه.", "ex": ["Correct. | صح.", "No. An open debate is free practice. | غلط: المناقشة المفتوحة تدريب حر.", "No. Free discussion is free practice. | غلط: النقاش الحر تدريب حر."], "n": 1, "i": 81, "h": ""}, {"t": "tf", "q": "Controlled practice is designed to improve fluency.<br>التدريب الموجّه مصمم يحسّن الطلاقة.", "ans": false, "why": "False. Controlled practice works on accuracy, pronunciation and stress; free practice improves fluency. | غلط. التدريب الموجّه بيشتغل على الدقة والنطق والنبر؛ التدريب الحر بيحسّن الطلاقة.", "ex": ["Correct. Accuracy is its job. | صح: الدقة شغلته.", "Wrong. Fluency belongs to free practice. | غلط: الطلاقة للتدريب الحر."], "n": 1, "i": 82, "h": ""}, {"t": "mc", "q": "Free practice mainly improves:<br>التدريب الحر بيحسّن أساسًا:", "opts": ["fluency, speaking at a natural speed | الطلاقة، الكلام بسرعة طبيعية", "perfect grammar in every sentence | قواعد مثالية في كل جملة", "memorisation of dialogues | حفظ الحوارات"], "ans": 0, "why": "Free practice builds fluency: natural speed without too many hesitations. | التدريب الحر بيبني الطلاقة: سرعة طبيعية من غير ترددات كتير.", "ex": ["Correct. | صح.", "No. Accuracy is controlled practice's job. | غلط: الدقة شغلانة التدريب الموجّه.", "No. Free practice is unscripted. | غلط: التدريب الحر مش مكتوب."], "n": 1, "i": 83, "h": ""}, {"t": "tf", "q": "During fluency activities, error correction should be used tentatively so the flow is not interrupted.<br>أثناء أنشطة الطلاقة، تصحيح الأخطاء لازم يتستخدم بتحفّظ عشان التدفق ميتقطعش.", "ans": true, "why": "True. Give students freedom and time; heavy correction breaks the flow. | صح. ادّي الطلبة الحرية والوقت؛ التصحيح التقيل بيكسّر التدفق.", "ex": ["Correct. | صح.", "Wrong. Interrupting to correct kills fluency. | غلط: المقاطعة للتصحيح بتموّت الطلاقة."], "n": 1, "i": 84, "h": ""}, {"t": "mc", "q": "Which is a good way to start a discussion task?<br>أنهي طريقة كويسة لبدء مهمة نقاش؟", "opts": ["giving students role cards or a scenario to read | إعطاء الطلبة كروت أدوار أو سيناريو يقرأوه", "asking one student cold: what do you think? | سؤال طالب على غفلة: رأيك إيه؟", "starting with no instructions at all | البدء من غير أي تعليمات"], "ans": 0, "why": "Role cards, scenarios and data give structure; a cold question catches students off-guard. | كروت الأدوار والسيناريوهات والبيانات بتدّي هيكل؛ السؤال المفاجئ بياخد الطلبة على غفلة.", "ex": ["Correct. | صح.", "No. That catches students off-guard. | غلط: ده بياخد الطلبة على غفلة.", "No. Free speaking still needs structure. | غلط: الكلام الحر لسه محتاج هيكل."], "n": 1, "i": 85, "h": ""}, {"t": "mc", "q": "Which exercise improves accuracy?<br>أنهي تمرين بيحسّن الدقة؟", "opts": ["distinguishing minimal pairs of sounds | التمييز بين الأزواج الصوتية الدنيا", "taking part in discussions | المشاركة في المناقشات", "getting your partner to agree with you | إقناع شريكك برأيك"], "ans": 0, "why": "Minimal pairs train pronunciation precision, an accuracy skill. Discussions and persuading are fluency and interaction work. | الأزواج الدنيا بتدرب دقة النطق، مهارة دقة. المناقشات والإقناع شغل طلاقة وتفاعل.", "ex": ["Correct. | صح.", "No. Discussions build fluency. | غلط: المناقشات بتبني الطلاقة.", "No. Persuading is interactive fluency work. | غلط: الإقناع شغل طلاقة تفاعلي."], "n": 1, "i": 86, "h": ""}, {"t": "mc", "q": "During the run-the-activity stage, the teacher should:<br>أثناء مرحلة تشغيل النشاط، المدرس المفروض:", "opts": ["monitor | يراقب", "take the lead | ياخد القيادة", "join every conversation | يدخل في كل محادثة"], "ans": 0, "why": "The teacher leads the introduction and setup stages, but monitors while the activity runs. | المدرس بيقود مرحلتي التقديم والتجهيز، بس بيراقب أثناء تشغيل النشاط.", "ex": ["Correct. | صح.", "No. Leading happens in the first two stages. | غلط: القيادة بتحصل في أول مرحلتين.", "No. Too much participation shrinks student talk time. | غلط: المشاركة الكتير بتقلّل وقت كلام الطلبة."], "n": 1, "i": 87, "h": ""}, {"t": "recall", "q": "Name the three stages of a fluency speaking lesson and the teacher's role in each.<br>اذكر مراحل درس الكلام للطلاقة التلاتة ودور المدرس في كل واحدة.", "a": "1. Introduce the task and pre-teach vocabulary: take the lead. 2. Set up the task, give instructions, put students into pairs or groups: take the lead. 3. Run the activity: monitor.<br>١. تقديم المهمة وتعليم المفردات مسبقًا: خد القيادة. ٢. تجهيز المهمة وإعطاء التعليمات ووضع الطلبة في أزواج أو مجموعات: خد القيادة. ٣. تشغيل النشاط: راقب.", "n": 1, "i": 88, "h": ""}, {"t": "recall", "q": "Name four things we do when we speak besides using grammar and vocabulary.<br>اذكر أربع حاجات بنعملها واحنا بنتكلم غير استخدام القواعد والمفردات.", "a": "Use an appropriate register; self-correct; hesitate; use stress and intonation; use interactive strategies like asking opinions, clarifying, turn-taking and agreeing or disagreeing.<br>بنستخدم مستوى مناسب؛ بنصحّح لنفسنا؛ بنتردد؛ بنستخدم النبر والتنغيم؛ بنستخدم استراتيجيات تفاعلية زي سؤال الآراء والتوضيح وتبادل الأدوار والموافقة أو الاعتراض.", "n": 1, "i": 89, "h": ""}, {"t": "write", "q": "Why is speaking in a foreign language especially difficult? (3-4 sentences)<br>ليه الكلام بلغة أجنبية صعب بالذات؟ (٣-٤ جمل).", "key": "tefl-45:1", "a": "Speaking happens in real time, so there is no time to organise thoughts properly, which leads to mistakes, interruptions and self-correction. Students may not know the necessary vocabulary for a topic. On top of that, they may not have the skills to respond immediately to a task. That is why teachers need to develop these skills in their students.<br>الكلام بيحصل في الوقت الحقيقي، فمفيش وقت نرتّب الأفكار كويس، وده بيؤدي لغلطات ومقاطعات وتصحيح ذاتي. الطلبة ممكن ميبقوش عارفين المفردات الضرورية لموضوع. وفوق كده، ممكن مايبقاش عندهم المهارات إنهم يردّوا فورًا على مهمة. عشان كده المدرسين محتاجين ينمّوا المهارات دي في طلبتهم.", "n": 1, "i": 90, "h": ""}, {"t": "write", "q": "How can you stop a discussion from drying up? (3-4 sentences)<br>إزاي تمنع المناقشة من الجفاف؟ (٣-٤ جمل).", "key": "tefl-45:2", "a": "First, give students preparation time before the discussion, because speaking in a foreign language is a slower process and needs thinking time. During the activity, monitor rather than dominate, but you can play devil's advocate to provoke the discussion if it starts to die. Another method is to split students into smaller groups that switch round to keep their interest. Most of all, step back and let them process the task.<br>أول حاجة، ادّي الطلبة وقت تحضير قبل المناقشة، لأن الكلام بلغة أجنبية عملية أبطأ ومحتاجة وقت تفكير. أثناء النشاط، راقب بدل ما تسيطر، بس ممكن تلعب دور محامي الشيطان عشان تنشّط المناقشة لو بدأت تموت. طريقة تانية إنك تقسّم الطلبة لمجموعات أصغر بتتبدّل عشان تحافظ على اهتمامهم. والأهم، ابعد وسيّبهم يعالجوا المهمة.", "n": 1, "i": 91, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 2, speaking strategies and activities, plus how to present new vocabulary.</div><div class=\"u\">الدرس الجاي: الوحدة التانية، استراتيجيات وأنشطة الكلام، وإزاي تقدّم مفردات جديدة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 92}];</script>
