<h1>عالم تيفل ٥١: الأشكال الشرطية</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٥١</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-51";window.STEPS=[{"t": "section", "h": "What conditionals are | إيه هي الشرطيات", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit four: conditional forms. First, a reminder: a clause is a part of a sentence that typically has its own subject and verb.</div><div class=\"u\">الوحدة الرابعة: الأشكال الشرطية. الأول، تذكير: الجملة الفرعية جزء من الجملة عادة ليها فاعل وفعل خاصين بيها.</div>", "n": 1, "i": 1, "a": "tefl-51-001", "x": "80ca088b"}, {"t": "learn", "h": "<div class=\"u\">A conditional clause describes something that is possible or probable, depending on something else happening. Such clauses usually begin with if or unless, and we often call them if clauses.</div><div class=\"u\">الجملة الشرطية بتوصّف حاجة ممكنة أو محتملة، معتمدة على حاجة تانية تحصل. الجمل دي عادة بتبدأ بـ لو أو ما لم، وبنسمّيها غالبًا جمل اللو.</div>", "n": 1, "i": 2, "a": "tefl-51-002", "x": "2add3b42"}, {"t": "learn", "h": "<div class=\"u\">They all focus on what may or may not happen, and what might have happened but did not. They express different degrees of reality.</div><div class=\"u\">كلها بتركّز على اللي ممكن يحصل أو مايحصلش، واللي كان ممكن يحصل بس ماحصلش. بتعبّر عن درجات مختلفة من الواقعية.</div>", "n": 1, "i": 3, "a": "tefl-51-003", "x": "ba280d44"}, {"t": "learn", "h": "<div class=\"u\">We can put the if or unless clause before or after the main clause: if it snows, we won't get the car out. I'm not going shopping unless Jane comes too.</div><div class=\"u\">نقدر نحط جملة اللو أو الما لم قبل أو بعد الجملة الرئيسية: لو نزل تلج، مش هنقدر نطلّع العربية. أنا مش رايح أتسوّق ما لم جين تيجي كمان.</div>", "n": 1, "i": 4, "a": "tefl-51-004", "x": "f9c290da"}, {"t": "learn", "h": "<div class=\"u\">Note: if we put the condition before the main clause, we use a comma.</div><div class=\"u\">لاحظ: لو حطينا الشرط قبل الجملة الرئيسية، بنستخدم فاصلة.</div>", "n": 1, "i": 5, "a": "tefl-51-005", "x": "39b33489"}, {"t": "section", "h": "Real and unreal conditions | الشروط الحقيقية وغير الحقيقية", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Conditions can be categorised as real and unreal.</div><div class=\"u\">الشروط ممكن تتصنّف حقيقية وغير حقيقية.</div>", "n": 1, "i": 7, "a": "tefl-51-006", "x": "f6de042e"}, {"t": "learn", "h": "<div class=\"u\">With real conditions, we do not know if the condition is, will be or was true: if it rains tomorrow, I'll stay in. If Lisa is coming to the party, you can tell her the news.</div><div class=\"u\">مع الشروط الحقيقية، إحنا مش عارفين لو الشرط صح أو هيبقى صح أو كان صح: لو نزل مطر بكرة، هفضل في البيت. لو ليزا جاية الحفلة، تقدر تقولها الخبر.</div>", "n": 1, "i": 8, "a": "tefl-51-007", "x": "5b6ffd1e"}, {"t": "learn", "h": "<div class=\"u\">Note: we cannot use will for future time in a condition. We say if it rains tomorrow, not if it will rain. We say if she's coming, not if she will be coming.</div><div class=\"u\">لاحظ: مابنقدرش نستخدم الويل للمستقبل في الشرط. بنقول لو نزل مطر بكرة، مش لو هينزل. بنقول لو هي جاية، مش لو هتبقى جاية.</div>", "n": 1, "i": 9, "a": "tefl-51-008", "x": "c18dc221"}, {"t": "learn", "h": "<div class=\"u\">We sometimes use unless at the beginning of a condition: unless it rains tomorrow, I'll go to the beach. Unless she's in England, I'm sure she'll come.</div><div class=\"u\">أحيانًا بنستخدم الما لم في بداية الشرط: ما لم ينزل مطر بكرة، هروح الشاطئ. ما لم تبقى في إنجلترا، أنا متأكد إنها هتيجي.</div>", "n": 1, "i": 10, "a": "tefl-51-009", "x": "0f801b1f"}, {"t": "learn", "h": "<div class=\"u\">With unreal conditions for present and future, the condition is not, or probably will not be, true. We use a simple or continuous verb formation.</div><div class=\"u\">مع الشروط غير الحقيقية للحاضر والمستقبل، الشرط مش صح، أو غالبًا مش هيبقى صح. بنستخدم تركيبة فعل بسيطة أو مستمرة.</div>", "n": 1, "i": 11, "a": "tefl-51-010", "x": "68c5547c"}, {"t": "learn", "h": "<div class=\"u\">If Maria was coming, you could tell her the news, but she isn't coming. I would have more money if I didn't smoke, but I do smoke.</div><div class=\"u\">لو ماريا كانت جاية، كنت هتقدر تقولها الخبر، بس هي مش جاية. كنت هيبقى معايا فلوس أكتر لو مابدخنش، بس أنا بدخّن.</div>", "n": 1, "i": 12, "a": "tefl-51-011", "x": "2644b28c"}, {"t": "learn", "h": "<div class=\"u\">If I found a lot of money in the road, I'd give it to the police; I'm just imagining.</div><div class=\"u\">لو لقيت فلوس كتير في الشارع، هدّيها للبوليس؛ أنا بتخيّل بس.</div>", "n": 1, "i": 13, "a": "tefl-51-012", "x": "35bb826a"}, {"t": "learn", "h": "<div class=\"u\">Note this construction: would you mind if I left early? Would plus mind plus an unreal condition is a polite way to ask for permission.</div><div class=\"u\">لاحظ التركيبة دي: عندك مانع لو انصرفت بدري؟ الوود زائد المايند زائد شرط غير حقيقي طريقة مؤدبة لطلب الإذن.</div>", "n": 1, "i": 14, "a": "tefl-51-013", "x": "570af39c"}, {"t": "learn", "h": "<div class=\"u\">For past time, when the condition was not true, we use a perfect verb formation in the condition: if Maria had come, you could have told her the news, but she didn't come.</div><div class=\"u\">للوقت الماضي، لما الشرط مكانش صح، بنستخدم تركيبة تامة في الشرط: لو ماريا كانت جت، كنت هتقدر تقولها الخبر، بس هي ماجتش.</div>", "n": 1, "i": 15, "a": "tefl-51-014", "x": "fb47894e"}, {"t": "learn", "h": "<div class=\"u\">I'm sure Maria would've come if John hadn't forgotten to tell her.</div><div class=\"u\">أنا متأكد ماريا كانت هتيجي لو جون ماكانش نسي يقولها.</div>", "n": 1, "i": 16, "a": "tefl-51-015", "x": "517eaf5e"}, {"t": "section", "h": "The zero conditional | الشرطية الصفرية", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">There are four types of conditional constructions: zero, first, second and third.</div><div class=\"u\">في أربع أنواع من التراكيب الشرطية: الصفرية والأولى والتانية والتالتة.</div>", "n": 1, "i": 18, "a": "tefl-51-016", "x": "ed6fb854"}, {"t": "learn", "h": "<div class=\"u\">The zero conditional, certainty. Form: if plus present simple for the condition, and present simple in the main clause for the result.</div><div class=\"u\">الشرطية الصفرية، اليقين. الصيغة: لو زائد مضارع بسيط للشرط، ومضارع بسيط في الجملة الرئيسية للنتيجة.</div>", "n": 1, "i": 19, "a": "tefl-51-017", "x": "41a2dd27"}, {"t": "learn", "h": "<div class=\"u\">Examples: if people don't eat, they get hungry. If you heat ice, it melts. Babies cry if they are hungry.</div><div class=\"u\">أمثلة: لو الناس مابتأكلش، بيجوعوا. لو بتسخّن التلج، بيدوب. البيبيهات بتعيّط لو جوعانين.</div>", "n": 1, "i": 20, "a": "tefl-51-018", "x": "fef78022"}, {"t": "learn", "h": "<div class=\"u\">It does not matter if the if clause starts the sentence or sits in the middle, and you can replace if with when in a zero conditional.</div><div class=\"u\">مابيفرقش لو جملة اللو بدأت الجملة أو قعدت في نصها، وتقدر تبدّل اللو بـ عندما في الشرطية الصفرية.</div>", "n": 1, "i": 21, "a": "tefl-51-019", "x": "4f794a07"}, {"t": "learn", "h": "<div class=\"u\">Use: when the result is always true for this type of condition. The result is certain, a fact. No thought is given to future or past.</div><div class=\"u\">الاستخدام: لما النتيجة دايمًا صح لنوع الشرط ده. النتيجة مؤكدة، حقيقة. مفيش تفكير في مستقبل أو ماضي.</div>", "n": 1, "i": 22, "a": "tefl-51-020", "x": "0ae3253c"}, {"t": "section", "h": "First, second and third | الأولى والتانية والتالتة", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">The first conditional, real possibility. Form: if plus present simple for the condition, and will plus verb stem in the main clause.</div><div class=\"u\">الشرطية الأولى، إمكانية حقيقية. الصيغة: لو زائد مضارع بسيط للشرط، وويل زائد الفعل الأساسي في الجملة الرئيسية.</div>", "n": 1, "i": 24, "a": "tefl-51-021", "x": "a04f4569"}, {"t": "learn", "h": "<div class=\"u\">Examples: if I see Valeria tomorrow, I'll tell her about the party. If it rains, I won't go shopping. If I study hard, I'll pass my exams. Will you walk to work if the bus is late?</div><div class=\"u\">أمثلة: لو شفت فاليريا بكرة، هقولها عن الحفلة. لو نزل مطر، مش هروح أتسوّق. لو ذاكرت كويس، هنجح في امتحاناتي. هتمشي للشغل لو الأتوبيس اتأخر؟</div>", "n": 1, "i": 25, "a": "tefl-51-022", "x": "01faa0fc"}, {"t": "learn", "h": "<div class=\"u\">Use: there is a good possibility the condition will happen at a future time. I may not see Valeria tomorrow, but I might.</div><div class=\"u\">الاستخدام: في احتمال كويس إن الشرط هيحصل في وقت مستقبلي. ممكن ماشوفش فاليريا بكرة، بس ممكن.</div>", "n": 1, "i": 26, "a": "tefl-51-023", "x": "d9d08342"}, {"t": "learn", "h": "<div class=\"u\">The second conditional, unreal possibility. Form: if plus past simple for the condition, and would plus verb stem in the main clause.</div><div class=\"u\">الشرطية التانية، إمكانية غير حقيقية. الصيغة: لو زائد ماضي بسيط للشرط، ووود زائد الفعل الأساسي في الجملة الرئيسية.</div>", "n": 1, "i": 27, "a": "tefl-51-024", "x": "8382195c"}, {"t": "learn", "h": "<div class=\"u\">Examples: if I married Taylor Swift, I'd be the happiest person on earth. If I won the lottery, I would quit my job. Would Camila be happy if she married you?</div><div class=\"u\">أمثلة: لو اتجوزت تايلور سويفت، هبقى أسعد شخص على الأرض. لو كسبت اليانصيب، هستقيل من شغلي. كاميلا هتبقى مبسوطة لو اتجوزتك؟</div>", "n": 1, "i": 28, "a": "tefl-51-025", "x": "8852556a"}, {"t": "learn", "h": "<div class=\"u\">Use: a particular condition in the future, but there is no real possibility it will ever happen. It is all a bit of a dream.</div><div class=\"u\">الاستخدام: شرط معين في المستقبل، بس مفيش إمكانية حقيقية إنه يحصل أبدًا. ده كله نوع من الحلم.</div>", "n": 1, "i": 29, "a": "tefl-51-026", "x": "18c145bf"}, {"t": "learn", "h": "<div class=\"u\">We also use the second conditional for impossible situations in the present: if I knew where he was, I'd contact him, but I have no idea.</div><div class=\"u\">بنستخدم الشرطية التانية كمان لمواقف مستحيلة في الحاضر: لو كنت عارف هو فين، كنت هتواصل معاه، بس ماعنديش فكرة.</div>", "n": 1, "i": 30, "a": "tefl-51-027", "x": "2b33971c"}, {"t": "learn", "h": "<div class=\"u\">If I were you, I wouldn't get involved, but I'm not you.</div><div class=\"u\">لو كنت مكانك، مكنتش هتدخّل، بس أنا مش إنت.</div>", "n": 1, "i": 31, "a": "tefl-51-028", "x": "4eb71fbe"}, {"t": "learn", "h": "<div class=\"u\">The third conditional, no possibility. Form: if plus past perfect for the condition, and would have plus past participle in the main clause.</div><div class=\"u\">الشرطية التالتة، مفيش إمكانية. الصيغة: لو زائد ماضي تام للشرط، ووود هاف زائد التصريف التالت في الجملة الرئيسية.</div>", "n": 1, "i": 32, "a": "tefl-51-029", "x": "8afc427d"}, {"t": "learn", "h": "<div class=\"u\">Examples: if I had seen Alejandro, I would have asked him, but I didn't see him. If we had grabbed a taxi, we wouldn't have missed the train, but we didn't grab one and we did miss it.</div><div class=\"u\">أمثلة: لو كنت شفت أليخاندرو، كنت هسأله، بس ماشفتهوش. لو كنا لقطنا تاكسي، مكانش فاتنا القطر، بس ملقطناش وفاتنا فعلًا.</div>", "n": 1, "i": 33, "a": "tefl-51-030", "x": "9ecd7fe2"}, {"t": "learn", "h": "<div class=\"u\">Use: the focus is on the past, a condition that did not happen. We imagine the result. There is no possibility for this condition, not then and not now.</div><div class=\"u\">الاستخدام: التركيز على الماضي، شرط ماحصلش. بنتخيّل النتيجة. مفيش إمكانية للشرط ده، لا ساعتها ولا دلوقتي.</div>", "n": 1, "i": 34, "a": "tefl-51-031", "x": "50a6ceba"}, {"t": "section", "h": "Teaching conditionals | تعليم الشرطيات", "n": 1, "i": 35}, {"t": "learn", "h": "<div class=\"u\">Teaching conditional forms. They are tricky for learners, and the key problem is usually an inexperienced teacher taking learners too far too quickly.</div><div class=\"u\">تعليم الأشكال الشرطية. هما شوكة للمتعلمين، والمشكلة الأساسية عادة مدرس قليل الخبرة بياخد المتعلمين لأبعد من اللازم بسرعة أوي.</div>", "n": 1, "i": 36, "a": "tefl-51-032", "x": "05272805"}, {"t": "learn", "h": "<div class=\"u\">Students' ages and levels decide whether they are ready for a particular construction. Wait your time, see how well the learning is embedded, then try another type. Take it softly, softly.</div><div class=\"u\">سن الطلبة ومستواهم بيحدّدوا لو جاهزين لتركيبة معينة. استنى وقتك، شوف التعلّم ثبت قد إيه، وبعدين جرب نوع تاني. خدها بالراحة.</div>", "n": 1, "i": 37, "a": "tefl-51-033", "x": "a47b1c76"}, {"t": "learn", "h": "<div class=\"u\">Step one: awareness in context. Get them to notice conditionals in written pieces you use in class, or make up your own pieces containing the form you plan to teach.</div><div class=\"u\">خطوة واحد: الوعي في سياق. خلّيهم يلاحظوا الشرطيات في القطع المكتوبة اللي بتستخدمها في الفصل، أو اعمل قطع من عندك فيها الشكل اللي ناوي تعلّمه.</div>", "n": 1, "i": 38, "a": "tefl-51-034", "x": "c9c2311b"}, {"t": "learn", "h": "<div class=\"u\">Point attention to the construction and get them to have a go at the meaning, then mirror it with other situations. Do not get too hung up about tenses at this time.</div><div class=\"u\">وجّه الانتباه للتركيبة وخلّيهم يحاولوا يطلّعوا المعنى، وبعدين يقلّدوها بمواقف تانية. ماتعلقش أوي في الأزمنة في الوقت ده.</div>", "n": 1, "i": 39, "a": "tefl-51-035", "x": "68939927"}, {"t": "learn", "h": "<div class=\"u\">Step two: start at the beginning. Some teachers start with the first conditional and leave the zero till last. We do not know why.</div><div class=\"u\">خطوة اتنين: ابدأ من البداية. بعض المدرسين بيبدأوا بالشرطية الأولى وبيسيبوا الصفرية للآخر. إحنا مش عارفين ليه.</div>", "n": 1, "i": 40, "a": "tefl-51-036", "x": "ec1c77d1"}, {"t": "learn", "h": "<div class=\"u\">We always start with the zero conditional: it is good fun thinking about certainties, like if you heat ice, it melts.</div><div class=\"u\">إحنا دايمًا بنبدأ بالصفرية: ممتع تفكّر في اليقينيات، زي لو بتسخّن التلج، بيدوب.</div>", "n": 1, "i": 41, "a": "tefl-51-037", "x": "9d3f34d4"}, {"t": "learn", "h": "<div class=\"u\">Once they have offered lots of suggestions, see if they can work out the structure and tenses for themselves. Then it is time to practise.</div><div class=\"u\">أول ما يقدّموا اقتراحات كتير، شوف لو يقدروا يطلّعوا التركيبة والأزمنة بأنفسهم. وبعدين يبقى وقت التدريب.</div>", "n": 1, "i": 42, "a": "tefl-51-038", "x": "deb5eb0e"}, {"t": "section", "h": "Practice activities | أنشطة التدريب", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Practice activities for conditionals. Matching exercises: match the condition with the result, and the result with the condition.</div><div class=\"u\">أنشطة تدريب للشرطيات. تمارين مطابقة: طابق الشرط بالنتيجة، والنتيجة بالشرط.</div>", "n": 1, "i": 44, "a": "tefl-51-039", "x": "76e7ef37"}, {"t": "learn", "h": "<div class=\"u\">Cloze activities: insert a selection of if clauses into a piece with six or seven blanks.</div><div class=\"u\">أنشطة ملء فراغات: دخّل مجموعة من جمل اللو في قطعة فيها ستة أو سبعة فراغات.</div>", "n": 1, "i": 45, "a": "tefl-51-040", "x": "f0bcb103"}, {"t": "learn", "h": "<div class=\"u\">Partnering activity: one student states the condition and the other completes it with a sensible result. Then they reverse roles.</div><div class=\"u\">نشاط الشراكة: طالب يقول الشرط والتاني يكمّله بنتيجة منطقية. وبعدين يتبادلوا الأدوار.</div>", "n": 1, "i": 46, "a": "tefl-51-041", "x": "5b2b1a01"}, {"t": "learn", "h": "<div class=\"u\">Student surveys: students survey each other about what they will and would like to do in the future, using the appropriate conditional forms.</div><div class=\"u\">استبيانات الطلبة: الطلبة بيعملوا استبيانات لبعض عن اللي هيعملوه ويحبوا يعملوه في المستقبل، باستخدام الأشكال الشرطية المناسبة.</div>", "n": 1, "i": 47, "a": "tefl-51-042", "x": "c738ff2d"}, {"t": "learn", "h": "<div class=\"u\">Wish lists: emphasising the unreal conditionals, students interview each other and make up wish lists for their partners.</div><div class=\"u\">قوائم الأمنيات: بالتركيز على الشرطيات غير الحقيقية، الطلبة بيعملوا مقابلات مع بعض ويعملوا قوائم أمنيات لشركائهم.</div>", "n": 1, "i": 48, "a": "tefl-51-043", "x": "8e3b981b"}, {"t": "learn", "h": "<div class=\"u\">Advice columns: students write letters of advice to each other or to famous figures, like the president, using the conditional.</div><div class=\"u\">أعمدة النصايح: الطلبة بيكتبوا خطابات نصيحة لبعض أو لشخصيات مشهورة، زي الرئيس، باستخدام الشرطية.</div>", "n": 1, "i": 49, "a": "tefl-51-044", "x": "58b81f60"}, {"t": "learn", "h": "<div class=\"u\">Probability discussions: guessing the probability of events using the conditional: if Chelsea are on form, they'll win the match.</div><div class=\"u\">نقاشات الاحتمالات: تخمين احتمالية الأحداث باستخدام الشرطية: لو تشيلسي في فورمتهم، هيكسبوا الماتش.</div>", "n": 1, "i": 50, "a": "tefl-51-045", "x": "50466034"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 51}, {"t": "learn", "h": "<div class=\"u\">clause: a part of a sentence with its own subject and verb.</div><div class=\"u\">الجملة الفرعية: جزء من الجملة ليه فاعل وفعل خاصين.</div>", "n": 1, "i": 52, "a": "tefl-51-046", "x": "a4988bcf"}, {"t": "learn", "h": "<div class=\"u\">conditional clause: a clause about what depends on something else, starting with if or unless.</div><div class=\"u\">الجملة الشرطية: جملة فرعية عن اللي بيعتمد على حاجة تانية، بتبدأ بـ لو أو ما لم.</div>", "n": 1, "i": 53, "a": "tefl-51-047", "x": "b495d093"}, {"t": "learn", "h": "<div class=\"u\">if clause: the condition part of the sentence.</div><div class=\"u\">جملة اللو: جزء الشرط من الجملة.</div>", "n": 1, "i": 54, "a": "tefl-51-048", "x": "62249354"}, {"t": "learn", "h": "<div class=\"u\">unless: if not.</div><div class=\"u\">ما لم: لو مش.</div>", "n": 1, "i": 55, "a": "tefl-51-049", "x": "12e9fc6d"}, {"t": "learn", "h": "<div class=\"u\">zero conditional: if plus present simple; a certain, factual result.</div><div class=\"u\">الشرطية الصفرية: لو زائد مضارع بسيط؛ نتيجة مؤكدة، حقيقة.</div>", "n": 1, "i": 56, "a": "tefl-51-050", "x": "5fb89d09"}, {"t": "learn", "h": "<div class=\"u\">first conditional: if plus present simple, will for a real future possibility.</div><div class=\"u\">الشرطية الأولى: لو زائد مضارع بسيط، وويل لإمكانية مستقبلية حقيقية.</div>", "n": 1, "i": 57, "a": "tefl-51-051", "x": "3b1a4be8"}, {"t": "learn", "h": "<div class=\"u\">second conditional: if plus past simple, would for an unreal or dream condition.</div><div class=\"u\">الشرطية التانية: لو زائد ماضي بسيط، ووود لشرط غير حقيقي أو حلم.</div>", "n": 1, "i": 58, "a": "tefl-51-052", "x": "1d517de7"}, {"t": "learn", "h": "<div class=\"u\">third conditional: if plus past perfect, would have for a past condition that did not happen.</div><div class=\"u\">الشرطية التالتة: لو زائد ماضي تام، ووود هاف لشرط ماضي ماحصلش.</div>", "n": 1, "i": 59, "a": "tefl-51-053", "x": "eaf64423"}, {"t": "learn", "h": "<div class=\"u\">cloze activity: a text with gaps to fill.</div><div class=\"u\">نشاط ملء الفراغات: نص فيه فراغات تتملى.</div>", "n": 1, "i": 60, "a": "tefl-51-054", "x": "2e80074a"}, {"t": "learn", "h": "<div class=\"u\">wish list: a list of things you would like, practising unreal conditions.</div><div class=\"u\">قائمة الأمنيات: قائمة حاجات تتمنّاها، بتدرب الشروط غير الحقيقية.</div>", "n": 1, "i": 61, "a": "tefl-51-055", "x": "ce8a6f41"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Conditional clauses describe what depends on something else; they start with if or unless and express degrees of reality.</div><div class=\"u\">الجمل الشرطية بتوصّف اللي بيعتمد على حاجة تانية؛ بتبدأ بـ لو أو ما لم وبتعبّر عن درجات من الواقعية.</div>", "n": 1, "i": 63, "a": "tefl-51-056", "x": "5956ff00"}, {"t": "learn", "h": "<div class=\"u\">Never use will for future time inside the condition itself.</div><div class=\"u\">أبدًا ماتستخدم الويل للمستقبل جوه الشرط نفسه.</div>", "n": 1, "i": 64, "a": "tefl-51-057", "x": "6031a2e2"}, {"t": "learn", "h": "<div class=\"u\">Zero: facts. First: real future possibility. Second: unreal dreams, present or future. Third: past conditions that never happened.</div><div class=\"u\">الصفرية: حقائق. الأولى: إمكانية مستقبلية حقيقية. التانية: أحلام غير حقيقية، حاضر أو مستقبل. التالتة: شروط ماضية ماحصلتش.</div>", "n": 1, "i": 65, "a": "tefl-51-058", "x": "3361513f"}, {"t": "learn", "h": "<div class=\"u\">A condition before the main clause takes a comma; the order of clauses is flexible.</div><div class=\"u\">الشرط قبل الجملة الرئيسية بياخد فاصلة؛ ترتيب الجملتين مرن.</div>", "n": 1, "i": 66, "a": "tefl-51-059", "x": "16ac9b90"}, {"t": "learn", "h": "<div class=\"u\">Teach slowly: awareness in context first, and start with the zero conditional.</div><div class=\"u\">علّم بالراحة: الوعي في سياق الأول، وابدأ بالشرطية الصفرية.</div>", "n": 1, "i": 67, "a": "tefl-51-060", "x": "21b344d1"}, {"t": "learn", "h": "<div class=\"u\">Then practise with matching, cloze, partnering, surveys, wish lists, advice columns and probability talks.</div><div class=\"u\">وبعدين درّب بالمطابقة وملء الفراغات والشراكة والاستبيانات وقوائم الأمنيات وأعمدة النصايح ونقاشات الاحتمالات.</div>", "n": 1, "i": 68, "a": "tefl-51-061", "x": "5bce8d8e"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 69}, {"t": "mc", "q": "Which is the zero conditional?<br>أنهي الشرطية الصفرية؟", "opts": ["If you heat ice, it melts. | لو بتسخّن التلج، بيدوب.", "If I see Valeria, I'll tell her. | لو شفت فاليريا، هقولها.", "If I had seen him, I would have asked. | لو كنت شفته، كنت هسأله."], "ans": 0, "why": "Zero conditional: if plus present simple with a certain, factual result. | الشرطية الصفرية: لو زائد مضارع بسيط بنتيجة مؤكدة، حقيقة.", "ex": ["Correct. | صح.", "No. That is the first conditional. | غلط: دي الشرطية الأولى.", "No. That is the third conditional. | غلط: دي الشرطية التالتة."], "n": 1, "i": 70, "h": ""}, {"t": "mc", "q": "If I won the lottery, I would quit my job. Which conditional is this?<br>لو كسبت اليانصيب، هستقيل من شغلي. دي أنهي شرطية؟", "opts": ["second conditional | الشرطية التانية", "first conditional | الشرطية الأولى", "zero conditional | الشرطية الصفرية"], "ans": 0, "why": "If plus past simple with would: an unreal, dream-like future condition. | لو زائد ماضي بسيط مع ووود: شرط مستقبلي غير حقيقي، حلم.", "ex": ["Correct. | صح.", "No. The first uses will, not would. | غلط: الأولى بتستخدم الويل مش الوود.", "No. The zero states facts. | غلط: الصفرية بتصرّح حقائق."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "If we had grabbed a taxi, we wouldn't have missed the train. This tells us:<br>لو كنا لقطنا تاكسي، مكانش فاتنا القطر. ده بيقولنا إيه؟", "opts": ["we did not grab a taxi and we missed the train | ملقطناش تاكسي والقطر فاتنا", "we grabbed a taxi and caught the train | لقطنا تاكسي ولحقنا القطر", "we might grab a taxi tomorrow | ممكن نلقط تاكسي بكرة"], "ans": 0, "why": "Third conditional: a past condition that did not happen, with an imagined result. | الشرطية التالتة: شرط ماضي ماحصلش، بنتيجة متخيّلة.", "ex": ["Correct. | صح.", "No. It says the opposite. | غلط: ده بيقول العكس.", "No. It is about the past, not the future. | غلط: ده عن الماضي مش المستقبل."], "n": 1, "i": 72, "h": ""}, {"t": "tf", "q": "We can say: if it will rain tomorrow, I'll stay in.<br>نقدر نقول: لو هينزل مطر بكرة، هفضل في البيت.", "ans": false, "why": "False. We cannot use will for future time in the condition: if it rains tomorrow. | غلط. مابنقدرش نستخدم الويل للمستقبل في الشرط: لو نزل مطر بكرة.", "ex": ["Correct. | صح.", "Wrong. Will is banned inside the condition. | غلط: الويل ممنوعة جوه الشرط."], "n": 1, "i": 73, "h": ""}, {"t": "mc", "q": "Would you mind if I left early? This construction is:<br>عندك مانع لو انصرفت بدري؟ التركيبة دي إيه؟", "opts": ["a polite way to ask for permission | طريقة مؤدبة لطلب الإذن", "a factual statement | تصريح حقيقة", "a third conditional | شرطية تالتة"], "ans": 0, "why": "Would plus mind plus an unreal condition makes a polite permission request. | الوود زائد المايند زائد شرط غير حقيقي بتعمل طلب إذن مؤدب.", "ex": ["Correct. | صح.", "No. It is a request, not a fact. | غلط: ده طلب مش حقيقة.", "No. Nothing happened in the past here. | غلط: مفيش حاجة حصلت في الماضي هنا."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "If it snows, we won't get the car out. Where can the if clause go?<br>لو نزل تلج، مش هنقدر نطلّع العربية. جملة اللو ممكن تروح فين؟", "opts": ["before or after the main clause | قبل أو بعد الجملة الرئيسية", "only at the start | في البداية بس", "only at the end | في الآخر بس"], "ans": 0, "why": "The order is flexible; a condition placed first takes a comma. | الترتيب مرن؛ الشرط اللي بييجي الأول بياخد فاصلة.", "ex": ["Correct. | صح.", "No. It can also come second. | غلط: ممكن تيجي تانية كمان.", "No. It can also come first. | غلط: ممكن تيجي أولى كمان."], "n": 1, "i": 75, "h": ""}, {"t": "tf", "q": "In the second conditional, the condition is expected to happen.<br>في الشرطية التانية، الشرط متوقع يحصل.", "ans": false, "why": "False. There is no real possibility it will happen; it is a dream or an impossible present. | غلط. مفيش إمكانية حقيقية إنه يحصل؛ ده حلم أو حاضر مستحيل.", "ex": ["Correct. | صح.", "Wrong. Real possibility belongs to the first conditional. | غلط: الإمكانية الحقيقية للشرطية الأولى."], "n": 1, "i": 76, "h": ""}, {"t": "mc", "q": "Which conditional should you teach first?<br>أنهي شرطية المفروض تعلّمها الأول؟", "opts": ["the zero conditional | الشرطية الصفرية", "the third conditional | الشرطية التالتة", "the second conditional | الشرطية التانية"], "ans": 0, "why": "Start at the beginning with certainties: if you heat ice, it melts. Take it softly, softly. | ابدأ من البداية باليقينيات: لو بتسخّن التلج، بيدوب. خدها بالراحة.", "ex": ["Correct. | صح.", "No. The third is the hardest. | غلط: التالتة هي الأصعب.", "No. Dreams come after facts. | غلط: الأحلام بعد الحقائق."], "n": 1, "i": 77, "h": ""}, {"t": "recall", "q": "Give the form of each of the four conditionals.<br>ادّي صيغة كل واحدة من الشرطيات الأربعة.", "a": "Zero: if + present simple, present simple. First: if + present simple, will + verb. Second: if + past simple, would + verb. Third: if + past perfect, would have + past participle.<br>الصفرية: لو + مضارع بسيط، مضارع بسيط. الأولى: لو + مضارع بسيط، ويل + فعل. التانية: لو + ماضي بسيط، وود + فعل. التالتة: لو + ماضي تام، وود هاف + تصريف تالت.", "n": 1, "i": 78, "h": ""}, {"t": "recall", "q": "Name five practice activities for conditionals.<br>اذكر خمس أنشطة تدريب للشرطيات.", "a": "Any five of: matching exercises, cloze activities, partnering activity, student surveys, wish lists, advice columns, probability discussions.<br>أي خمسة من: تمارين المطابقة، أنشطة ملء الفراغات، نشاط الشراكة، استبيانات الطلبة، قوائم الأمنيات، أعمدة النصايح، نقاشات الاحتمالات.", "n": 1, "i": 79, "h": ""}, {"t": "write", "q": "Explain the difference between real and unreal conditions, with examples. (3-4 sentences)<br>اشرح الفرق بين الشروط الحقيقية وغير الحقيقية، بأمثلة. (٣-٤ جمل).", "key": "tefl-51:1", "a": "With real conditions, we do not know if the condition is or will be true: if it rains tomorrow, I'll stay in. It might rain, or it might not. With unreal conditions, the condition is not, or probably will not be, true: if Maria was coming, you could tell her the news, but she isn't coming. For the past, unreal conditions use a perfect form: if Maria had come, you could have told her, but she didn't come.<br>مع الشروط الحقيقية، إحنا مش عارفين لو الشرط صح أو هيبقى صح: لو نزل مطر بكرة، هفضل في البيت. ممكن ينزل، وممكن لأ. مع الشروط غير الحقيقية، الشرط مش صح، أو غالبًا مش هيبقى صح: لو ماريا كانت جاية، كنت هتقدر تقولها الخبر، بس هي مش جاية. للماضي، الشروط غير الحقيقية بتستخدم صيغة تامة: لو ماريا كانت جت، كنت هتقدر تقولها، بس هي ماجتش.", "n": 1, "i": 80, "h": ""}, {"t": "write", "q": "How would you introduce conditionals to a class for the first time? (3-4 sentences)<br>إزاي هتقدّم الشرطيات لفصل لأول مرة؟ (٣-٤ جمل).", "key": "tefl-51:2", "a": "I would start with awareness in context: students notice conditionals in pieces we read, or in pieces I write containing the target form. I would draw attention to the construction and let them have a go at the meaning, without getting hung up on tenses. Then I would start teaching with the zero conditional, because certainties like if you heat ice, it melts are fun and simple. Once they work out the structure themselves, we practise with matching, cloze and partnering activities.<br>أنا هبدأ بالوعي في سياق: الطلبة يلاحظوا الشرطيات في قطع بنقراها، أو في قطع بكتبها فيها الشكل المستهدف. هوجّه الانتباه للتركيبة وأسيّبهم يحاولوا يطلّعوا المعنى، من غير ما أعلق في الأزمنة. وبعدين هبدأ التعليم بالشرطية الصفرية، لأن اليقينيات زي لو بتسخّن التلج، بيدوب ممتعة وبسيطة. وأول ما يطلّعوا التركيبة بأنفسهم، هنتدرب بالمطابقة وملء الفراغات وأنشطة الشراكة.", "n": 1, "i": 81, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: direct and reported speech.</div><div class=\"u\">الدرس الجاي: الكلام المباشر والمنقول.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 82}];</script>
