<h1>عالم تيفل ٤١: أنماط التعلم</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤١</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-41";window.STEPS=[{"t": "section", "h": "Module 7 welcome: the four skills | ترحيب الموديول السابع: المهارات الأربعة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Module 7. This module is about the four language skills: listening, reading, writing and speaking.</div><div class=\"u\">أهلاً بيك في الموديول السابع. الموديول ده عن مهارات اللغة الأربعة: الاستماع والقراءة والكتابة والكلام.</div>", "n": 1, "i": 1, "a": "tefl-41-001", "x": "01f84b9b"}, {"t": "learn", "h": "<div class=\"u\">These skills fall into two groups: receptive (or passive) skills, and productive (or active) skills.</div><div class=\"u\">المهارات دي بتتقسم لمجموعتين: مهارات استقبالية (أو سلبية)، ومهارات إنتاجية (أو نشطة).</div>", "n": 1, "i": 2, "a": "tefl-41-002", "x": "12642b58"}, {"t": "learn", "h": "<div class=\"u\">Listening and reading are receptive skills, because learners receive language and understand it.</div><div class=\"u\">الاستماع والقراءة مهارات استقبالية، لأن المتعلمين بيستقبلوا اللغة ويفهموها.</div>", "n": 1, "i": 3, "a": "tefl-41-003", "x": "25e0b6ab"}, {"t": "learn", "h": "<div class=\"u\">Speaking and writing are productive skills, because students produce language for themselves.</div><div class=\"u\">الكلام والكتابة مهارات إنتاجية، لأن الطلبة بينتجوا اللغة بأنفسهم.</div>", "n": 1, "i": 4, "a": "tefl-41-004", "x": "2287268d"}, {"t": "learn", "h": "<div class=\"u\">Learners often find receptive skills easier at the beginning, because they need to be exposed to the language before they can produce it.</div><div class=\"u\">المتعلمين بيلاقوا المهارات الاستقبالية أسهل في الأول، لأنهم محتاجين يتعرضوا للغة قبل ما يقدروا ينتجوها.</div>", "n": 1, "i": 5, "a": "tefl-41-005", "x": "e7cdc874"}, {"t": "learn", "h": "<div class=\"u\">But all four skills are linked and must grow more or less together. If a student can pronounce a word correctly, they are more likely to understand it when they hear it.</div><div class=\"u\">بس المهارات الأربعة مرتبطة ببعض ولازم بتكبر مع بعض تقريبًا. لو الطالب بينطق كلمة صح، غالبًا هيفهمها لما يسمعها.</div>", "n": 1, "i": 6, "a": "tefl-41-006", "x": "21ad8740"}, {"t": "learn", "h": "<div class=\"u\">In the same way, working on reading helps a student's writing. The four skills naturally support and complete one another.</div><div class=\"u\">وبنفس الطريقة، الشغل على القراءة بيساعد كتابة الطالب. المهارات الأربعة بتدعم وبتكمّل بعض بشكل طبيعي.</div>", "n": 1, "i": 7, "a": "tefl-41-007", "x": "7c5a67d3"}, {"t": "learn", "h": "<div class=\"u\">The coming modules look at each skill in detail. But first we must explore learning styles, because they shape the materials, examples and presentation you will use.</div><div class=\"u\">الموديولات الجاية بتبص على كل مهارة بالتفصيل. بس الأول لازم نستكشف أنماط التعلم، لأنها بتشكّل المواد والأمثلة وطريقة العرض اللي هتستخدمها.</div>", "n": 1, "i": 8, "a": "tefl-41-008", "x": "d468a75a"}, {"t": "learn", "h": "<div class=\"u\">Awareness of learning styles is paramount when teaching the four skills, and also vocabulary and grammar.</div><div class=\"u\">الوعي بأنماط التعلم حاجة أساسية لما بتدرّس المهارات الأربعة، وكمان المفردات والقواعد.</div>", "n": 1, "i": 9, "a": "tefl-41-009", "x": "464b659a"}, {"t": "section", "h": "What is a learning style? | يعني إيه أسلوب تعلم؟", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">So, what is a learning style? It is a more or less consistent way in which a person perceives, conceptualises, organises and recalls information.</div><div class=\"u\">طيب، يعني إيه أسلوب تعلم؟ هو طريقة ثابتة لحد كبير بيفهم بيها الشخص المعلومة وبيصوّرها وبيظبطها وبيسترجعها.</div>", "n": 1, "i": 11, "a": "tefl-41-010", "x": "c6520e23"}, {"t": "learn", "h": "<div class=\"u\">In essence, a learner often has a preferred learning style, for example learning through visual activities rather than audio activities.</div><div class=\"u\">في الجوهر، المتعلم غالبًا عنده أسلوب تعلم مفضّل، مثلًا التعلم بأنشطة بصرية بدل أنشطة سمعية.</div>", "n": 1, "i": 12, "a": "tefl-41-011", "x": "0c8cf03b"}, {"t": "learn", "h": "<div class=\"u\">There are other preferences too, as we will see below.</div><div class=\"u\">في تفضيلات تانية كمان، زي ما هنشوف تحت.</div>", "n": 1, "i": 13, "a": "tefl-41-012", "x": "2bd0a9a8"}, {"t": "learn", "h": "<div class=\"u\">Proponents say learning styles are influenced by the individual's genetic make-up, previous learning experiences, culture and society.</div><div class=\"u\">المؤيدين بيقولوا إن أنماط التعلم بتتأثر بالتكوين الجيني للشخص، وخبراته التعليمية السابقة، والثقافة والمجتمع.</div>", "n": 1, "i": 14, "a": "tefl-41-013", "x": "72a14da1"}, {"t": "section", "h": "Is it useful? The debate | هل هو مفيد؟ النقاش", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">Is identifying learning styles useful or not? There are different opinions and lobbies on both sides of the debate.</div><div class=\"u\">هل تحديد أنماط التعلم مفيد ولا لأ؟ في آراء وجماعات ضغط مختلفة على طرفي النقاش.</div>", "n": 1, "i": 16, "a": "tefl-41-014", "x": "0c0453ae"}, {"t": "learn", "h": "<div class=\"u\">Unfortunately, many opinions on both sides lack real or scientific proof, because learning style methodologies remain unproven.</div><div class=\"u\">للأسف، آراء كتير من الطرفين ناقصها دليل حقيقي أو علمي، لأن منهجيات أنماط التعلم لسه مثبتتش.</div>", "n": 1, "i": 17, "a": "tefl-41-015", "x": "2512d417"}, {"t": "learn", "h": "<div class=\"u\">Our opinion, based on experience, is that learning style identification is useful and pretty successful, particularly with adult learners.</div><div class=\"u\">رأينا، مبني على الخبرة، إن تحديد أنماط التعلم مفيد وناجح لحد كبير، خصوصًا مع المتعلمين الكبار.</div>", "n": 1, "i": 18, "a": "tefl-41-016", "x": "4c5d2d62"}, {"t": "learn", "h": "<div class=\"u\">Many teachers and educators continue to find value and benefit in using learning styles approaches in one way or another.</div><div class=\"u\">مدرسين ومربين كتير لسه بيلاقوا قيمة وفايدة في استخدام مناهج أنماط التعلم بطريقة أو بأخرى.</div>", "n": 1, "i": 19, "a": "tefl-41-017", "x": "6387e3ab"}, {"t": "learn", "h": "<div class=\"u\">As often happens, there is usage which is appropriate and usage which is not.</div><div class=\"u\">وزي ما بيحصل غالبًا، في استخدام مناسب واستخدام مش مناسب.</div>", "n": 1, "i": 20, "a": "tefl-41-018", "x": "2bf74004"}, {"t": "learn", "h": "<div class=\"u\">So, especially with young people, use these methodologies with care. It is wrong to apply any methodology blindly, and wrong not to review and assess its effectiveness.</div><div class=\"u\">عشان كده، خصوصًا مع الصغيرين، استخدم المنهجيات دي بحذر. غلط تطبّق أي منهجية بشكل أعمى، وغلط متعملش مراجعة وتقييم لفاعليتها.</div>", "n": 1, "i": 21, "a": "tefl-41-019", "x": "c2f85050"}, {"t": "learn", "h": "<div class=\"u\">In any case, it is important that you are aware of learning styles, whether you end up for them or against them.</div><div class=\"u\">على أي حال، المهم إنك تبقى واعي بأنماط التعلم، سواء طلعت معاها أو ضدها.</div>", "n": 1, "i": 22, "a": "tefl-41-020", "x": "e64fabf6"}, {"t": "section", "h": "Kolb's theory | نظرية كولب", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">There are many different approaches to determine a person's learning style. We will focus on two of them.</div><div class=\"u\">في مناهج كتير مختلفة لتحديد أسلوب تعلم الشخص. إحنا هنركّز على اتنين منهم.</div>", "n": 1, "i": 24, "a": "tefl-41-021", "x": "2f5d009c"}, {"t": "learn", "h": "<div class=\"u\">The first is Kolb's theory. It classifies learners into four groups: activists, reflectors, theorists and pragmatists.</div><div class=\"u\">أولهم نظرية كولب. بتصنّف المتعلمين لأربع مجموعات: النشيطين، والمتأملين، والنظريين، والعمليين.</div>", "n": 1, "i": 25, "a": "tefl-41-022", "x": "5e6d4fd1"}, {"t": "learn", "h": "<div class=\"u\">Activists like practical work such as labs, field work, observation exercises and using visual source material for information.</div><div class=\"u\">النشيطين بيحبوا الشغل العملي زي المعامل، والشغل الميداني، وتمارين الملاحظة، واستخدام مواد بصرية للمعلومات.</div>", "n": 1, "i": 26, "a": "tefl-41-023", "x": "d7b280e7"}, {"t": "learn", "h": "<div class=\"u\">Reflectors like to learn by watching others, and by taking time to consider observations of their own experience.</div><div class=\"u\">المتأملين بيحبوا يتعلموا بمشاهدة الآخرين، وبأخد وقت عشان يتأملوا ملاحظاتهم عن خبرتهم الخاصة.</div>", "n": 1, "i": 27, "a": "tefl-41-024", "x": "7f47b5b4"}, {"t": "learn", "h": "<div class=\"u\">Theorists like lectures, reading papers on topics, and considering analogies.</div><div class=\"u\">النظريين بيحبوا المحاضرات، وقراءة الأوراق في المواضيع، والتفكير في التشبيهات.</div>", "n": 1, "i": 28, "a": "tefl-41-025", "x": "651d69cb"}, {"t": "learn", "h": "<div class=\"u\">Pragmatists like simulations, case studies and homework.</div><div class=\"u\">العمليين بيحبوا المحاكاة، ودراسات الحالة، والواجبات البيتية.</div>", "n": 1, "i": 29, "a": "tefl-41-026", "x": "8041ef88"}, {"t": "learn", "h": "<div class=\"u\">Learning a software programme shows the difference: activists just start using it and feel their way into it.</div><div class=\"u\">تعلم برنامج كمبيوتر بيبيّن الفرق: النشيطين بيبدأوا يستخدموه على طول وبيتحسسوا طريقهم جواه.</div>", "n": 1, "i": 30, "a": "tefl-41-027", "x": "6c464f05"}, {"t": "learn", "h": "<div class=\"u\">Reflectors have a go at using it, then take time to think about what they have just done.</div><div class=\"u\">المتأملين بيجربوا يستخدموه، وبعدين بياخدوا وقت يفكروا في اللي عملوه للتو.</div>", "n": 1, "i": 31, "a": "tefl-41-028", "x": "38ca7f49"}, {"t": "learn", "h": "<div class=\"u\">Theorists begin by reading the manual. Pragmatists start using the programme, but make frequent references to the help files.</div><div class=\"u\">النظريين بيبدأوا بقراءة الدليل. العمليين بيبدأوا يستخدموا البرنامج، بس بيرجعوا كتير لملفات المساعدة.</div>", "n": 1, "i": 32, "a": "tefl-41-029", "x": "9b9dc287"}, {"t": "learn", "h": "<div class=\"u\">The four types can also be seen as cyclical stages a learner can progress through: Watch, then Think, then Feel, then Do.</div><div class=\"u\">الأنواع الأربعة ممكن كمان تتشاف كمراحل دائرية بيعدّي عليها المتعلم: اتفرّج، وبعدين فكّر، وبعدين احسّ، وبعدين اعمل.</div>", "n": 1, "i": 33, "a": "tefl-41-030", "x": "99d37be9"}, {"t": "section", "h": "The VAK approach | منهج فياك", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">The second approach is VAK, and it is our preferred approach. It is simple and easy to administer.</div><div class=\"u\">المنهج التاني هو فياك، وده منهجنا المفضّل. بسيط وسهل التطبيق.</div>", "n": 1, "i": 35, "a": "tefl-41-031", "x": "78e5d941"}, {"t": "learn", "h": "<div class=\"u\">The VAK analysis identifies three learning styles: Visual, Auditory and Kinesthetic (sometimes spelled kinaesthetic).</div><div class=\"u\">تحليل فياك بيحدد تلات أنماط تعلم: البصري، والسمعي، والحركي (وأحيانًا بتتكتب كيناستيتك).</div>", "n": 1, "i": 36, "a": "tefl-41-032", "x": "cef58135"}, {"t": "learn", "h": "<div class=\"u\">Sometimes kinesthetic is said to include tactile learning, and sometimes tactile is added as a separate style.</div><div class=\"u\">أحيانًا الحركي بيتقال إنه بيشمل التعلم اللمسي، وأحيانًا اللمسي بيتضاف كنمط منفصل.</div>", "n": 1, "i": 37, "a": "tefl-41-033", "x": "2f1c2482"}, {"t": "learn", "h": "<div class=\"u\">Key point: any individual operates in all three modalities, but with a preference for one or two.</div><div class=\"u\">نقطة أساسية: أي شخص بيشتغل بالقنوات التلاتة، بس بتفضيل لواحدة أو اتنين.</div>", "n": 1, "i": 38, "a": "tefl-41-034", "x": "5ebb4624"}, {"t": "learn", "h": "<div class=\"u\">Visual learners likely prefer mind-maps, diagrams, picturesque language, flow charts, use of colour, and white space on the page.</div><div class=\"u\">المتعلمين البصريين غالبًا بيفضّلوا الخرايط الذهنية، والرسوم التوضيحية، واللغة المصوّرة، والمخططات الانسيابية، واستخدام الألوان، والمساحات البيضا في الصفحة.</div>", "n": 1, "i": 39, "a": "tefl-41-035", "x": "fb631953"}, {"t": "learn", "h": "<div class=\"u\">Auditory learners likely prefer discussion, explaining things to others, using a tape recorder, and teaching linked to anecdotes and jokes.</div><div class=\"u\">المتعلمين السمعيين غالبًا بيفضّلوا المناقشة، وشرح الحاجات للآخرين، واستخدام المسجل، والتدريس المربوط بالنوادر والنكت.</div>", "n": 1, "i": 40, "a": "tefl-41-036", "x": "89b55473"}, {"t": "learn", "h": "<div class=\"u\">Kinesthetic learners likely prefer group work, using models and objects when describing things, walking around while learning, hands-on activities, and books with a strong plot.</div><div class=\"u\">المتعلمين الحركيين غالبًا بيفضّلوا الشغل الجماعي، واستخدام المجسمات والأشياء لما بيوصفوا حاجة، والمشي أثناء التعلم، والأنشطة العملية، والكتب اللي ليها حبكة قوية.</div>", "n": 1, "i": 41, "a": "tefl-41-037", "x": "d2ea8a3a"}, {"t": "learn", "h": "<div class=\"u\">You should be aware of your own VAK preferences, and when you analyse students, make them aware of their individual preferences too.</div><div class=\"u\">لازم تبقى واعي بتفضيلات الفياك بتاعتك، ولما تحلّل الطلبة، خلّيهم هما كمان واعيين بتفضيلاتهم الفردية.</div>", "n": 1, "i": 42, "a": "tefl-41-038", "x": "462cff47"}, {"t": "learn", "h": "<div class=\"u\">Some research shows students perform better on tests if they change their study habits to fit their personal learning style.</div><div class=\"u\">أبحاث معينة بتبين إن الطلبة بيأدوا أحسن في الامتحانات لو غيّروا عادات مذاكرتهم عشان تناسب أسلوب تعلمهم الشخصي.</div>", "n": 1, "i": 43, "a": "tefl-41-039", "x": "3f4f7aaf"}, {"t": "learn", "h": "<div class=\"u\">For example, visual learners sometimes struggle in essay exams, because they cannot recall test material that was heard in a lecture.</div><div class=\"u\">مثلًا، المتعلمين البصريين أحيانًا بيتعبوا في الامتحانات المقالية، لأنهم مابيعرفوش يسترجعوا المادة اللي اتسمعت في محاضرة.</div>", "n": 1, "i": 44, "a": "tefl-41-040", "x": "cac463d1"}, {"t": "learn", "h": "<div class=\"u\">But if a visual learner studies with a visual aid, like a colourful outline of the test materials, they may retain much more information.</div><div class=\"u\">بس لو المتعلم البصري ذاكر بوسيلة بصرية، زي مخطط ملوّن لمواد الامتحان، ممكن يحتفظ بمعلومات أكتر بكتير.</div>", "n": 1, "i": 45, "a": "tefl-41-041", "x": "153e6207"}, {"t": "section", "h": "Visual learners | المتعلمين البصريين", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">Visual learners learn best through seeing things. A visual learner is good at spelling but forgets names.</div><div class=\"u\">المتعلمين البصريين بيتعلموا أحسن حاجة عن طريق رؤية الحاجات. المتعلم البصري كويس في الإملاء بس بينسى الأسماء.</div>", "n": 1, "i": 47, "a": "tefl-41-042", "x": "57cf5060"}, {"t": "learn", "h": "<div class=\"u\">More visual traits: needs quiet study time, thinks a while before understanding a lecture, likes colours and fashion.</div><div class=\"u\">صفات بصرية زيادة: محتاج وقت مذاكرة هادي، بيفكر شوية قبل ما يفهم المحاضرة، بيحب الألوان والموضة.</div>", "n": 1, "i": 48, "a": "tefl-41-043", "x": "0662edf0"}, {"t": "learn", "h": "<div class=\"u\">Also: dreams in colour, understands and likes charts, and is good with sign language.</div><div class=\"u\">وكمان: بيحلم بالألوان، بيفهم وبيحب الرسوم البيانية، وكويس في لغة الإشارة.</div>", "n": 1, "i": 49, "a": "tefl-41-044", "x": "686909fb"}, {"t": "learn", "h": "<div class=\"u\">Learning suggestions for visual learners: draw a map of events in history or draw a scientific process; make outlines of everything; copy what is on the board.</div><div class=\"u\">اقتراحات مذاكرة للمتعلمين البصريين: ارسم خريطة لأحداث التاريخ أو ارسم عملية علمية؛ اعمل مخططات لكل حاجة؛ انسخ اللي على السبورة.</div>", "n": 1, "i": 50, "a": "tefl-41-045", "x": "77851cfb"}, {"t": "learn", "h": "<div class=\"u\">More suggestions: ask the teacher to make a diagram or sketch; take notes and make lists; watch videos; colour code words.</div><div class=\"u\">اقتراحات زيادة: اطلب من المدرس يعمل رسم توضيحي أو تخطيط؛ خد ملاحظات واعمل قوائم؛ اتفرج على فيديوهات؛ لوّن الكلمات بالأكواد.</div>", "n": 1, "i": 51, "a": "tefl-41-046", "x": "1c1ee579"}, {"t": "learn", "h": "<div class=\"u\">Also: outline the reading, use flashcards, and use highlighters, circle words and underline.</div><div class=\"u\">وكمان: اعمل مخطط للقراءة، استخدم البطاقات التعليمية، واستخدم الأقلام الفسفورية، وضع دواير حوالين الكلمات وخط تحتها.</div>", "n": 1, "i": 52, "a": "tefl-41-047", "x": "c1cb217c"}, {"t": "learn", "h": "<div class=\"u\">Best test types for visual learners: diagramming, reading maps, essays, and showing a process.</div><div class=\"u\">أحسن أنواع امتحانات للمتعلمين البصريين: الرسم التخطيطي، وقراءة الخرايط، والمقالات، وعرض عملية.</div>", "n": 1, "i": 53, "a": "tefl-41-048", "x": "f196e171"}, {"t": "learn", "h": "<div class=\"u\">Worst test type for visual learners: listen and respond tests.</div><div class=\"u\">أسوأ نوع امتحان للمتعلمين البصريين: امتحانات اسمع ورد.</div>", "n": 1, "i": 54, "a": "tefl-41-049", "x": "d0fb3edf"}, {"t": "section", "h": "Auditory learners | المتعلمين السمعيين", "n": 1, "i": 55}, {"t": "learn", "h": "<div class=\"u\">Auditory learners learn best through hearing things. You may be one if you like to read to yourself out loud and are not afraid to speak in class.</div><div class=\"u\">المتعلمين السمعيين بيتعلموا أحسن حاجة عن طريق سماع الحاجات. ممكن تكون واحد منهم لو بتحب تقرالنفسك بصوت عالي ومابتخافش تتكلم في الفصل.</div>", "n": 1, "i": 56, "a": "tefl-41-050", "x": "acace104"}, {"t": "learn", "h": "<div class=\"u\">More auditory traits: likes oral reports, is good at explaining, remembers names, notices sound effects in movies, enjoys music.</div><div class=\"u\">صفات سمعية زيادة: بيحب التقارير الشفوية، كويس في الشرح، بيفتكر الأسماء، بيلاحظ المؤثرات الصوتية في الأفلام، بيستمتع بالموسيقى.</div>", "n": 1, "i": 57, "a": "tefl-41-051", "x": "32c7b626"}, {"t": "learn", "h": "<div class=\"u\">Also: good at grammar and foreign languages, reads slowly, and follows spoken directions well.</div><div class=\"u\">وكمان: كويس في القواعد واللغات الأجنبية، بيقرأ ببطء، وبيتبع التوجيهات المنطوقة كويس.</div>", "n": 1, "i": 58, "a": "tefl-41-052", "x": "f9727924"}, {"t": "learn", "h": "<div class=\"u\">And: cannot keep quiet for long, enjoys acting and being on stage, and is good in study groups.</div><div class=\"u\">وكمان: مابيعرفش يفضل ساكت فترة طويلة، بيستمتع بالتمثيل والوقوف على المسرح، وكويس في مجموعات المذاكرة.</div>", "n": 1, "i": 59, "a": "tefl-41-053", "x": "aefb9625"}, {"t": "learn", "h": "<div class=\"u\">Auditory learners can benefit from: using word association to remember facts and lines, recording lectures, and watching videos.</div><div class=\"u\">المتعلمين السمعيين ممكن يستفيدوا من: استخدام الربط بين الكلمات عشان يفتكروا الحقائق والأسطر، وتسجيل المحاضرات، ومشاهدة الفيديوهات.</div>", "n": 1, "i": 60, "a": "tefl-41-054", "x": "c1d802d5"}, {"t": "learn", "h": "<div class=\"u\">Also: repeating facts with eyes closed, participating in group discussions, using audiotapes for language practice, and taping notes after writing them.</div><div class=\"u\">وكمان: تكرار الحقائق والعينين مقفولة، والمشاركة في المناقشات الجماعية، واستخدام الأشرطة الصوتية لممارسة اللغة، وتسجيل الملاحظات صوتيًا بعد كتابتها.</div>", "n": 1, "i": 61, "a": "tefl-41-055", "x": "e099a039"}, {"t": "learn", "h": "<div class=\"u\">Best test types for auditory learners: writing responses to lectures they have heard, and oral exams.</div><div class=\"u\">أحسن أنواع امتحانات للمتعلمين السمعيين: كتابة ردود على محاضرات سمعوها، والامتحانات الشفوية.</div>", "n": 1, "i": 62, "a": "tefl-41-056", "x": "104d30d0"}, {"t": "learn", "h": "<div class=\"u\">Worst test type for auditory learners: reading passages and writing answers about them in a timed test.</div><div class=\"u\">أسوأ نوع امتحان للمتعلمين السمعيين: قراءة قطع والكتابة عنها في امتحان بوقت محدد.</div>", "n": 1, "i": 63, "a": "tefl-41-057", "x": "77d6954d"}, {"t": "section", "h": "Kinesthetic learners | المتعلمين الحركيين", "n": 1, "i": 64}, {"t": "learn", "h": "<div class=\"u\">Kinesthetic learners learn best through doing and moving. Traits: good at sport, cannot sit still for long, not great at spelling, and does not have great handwriting.</div><div class=\"u\">المتعلمين الحركيين بيتعلموا أحسن حاجة عن طريق العمل والحركة. الصفات: كويس في الرياضة، مابيعرفش يقعد ساكن فترة طويلة، مش قوي في الإملاء، وخطه مش حلو.</div>", "n": 1, "i": 65, "a": "tefl-41-058", "x": "19c0edfc"}, {"t": "learn", "h": "<div class=\"u\">More kinesthetic traits: likes working in science labs, studies with loud music on, likes adventure books and movies, likes role playing.</div><div class=\"u\">صفات حركية زيادة: بيحب الشغل في معامل العلوم، بيذاكر بموسيقى عالية، بيحب كتب وأفلام المغامرات، بيحب لعب الأدوار.</div>", "n": 1, "i": 66, "a": "tefl-41-059", "x": "08b651d1"}, {"t": "learn", "h": "<div class=\"u\">Also: takes breaks when studying, builds models, is involved in martial arts or dance, and is fidgety (restless) during lectures.</div><div class=\"u\">وكمان: بياخد بريك أثناء المذاكرة، بيبني مجسمات، بيمارس فنون قتالية أو رقص، وبيبقى قلقان ومش مستقر أثناء المحاضرات.</div>", "n": 1, "i": 67, "a": "tefl-41-060", "x": "d2fd52cb"}, {"t": "learn", "h": "<div class=\"u\">Kinesthetic learners can benefit from: studying in short blocks, taking lab classes, role playing, and taking field trips and visiting museums.</div><div class=\"u\">المتعلمين الحركيين ممكن يستفيدوا من: المذاكرة في فترات قصيرة، وحصص المعامل، ولعب الأدوار، والرحلات الميدانية وزيارة المتاحف.</div>", "n": 1, "i": 68, "a": "tefl-41-061", "x": "078e165e"}, {"t": "learn", "h": "<div class=\"u\">Also: studying with others, using memory games, and using flash cards to memorise.</div><div class=\"u\">وكمان: المذاكرة مع الآخرين، واستخدام ألعاب الذاكرة، واستخدام البطاقات التعليمية للحفظ.</div>", "n": 1, "i": 69, "a": "tefl-41-062", "x": "cee9449f"}, {"t": "section", "h": "Teaching points + your own analysis | نقاط التدريس + تحليلك الخاص", "n": 1, "i": 70}, {"t": "learn", "h": "<div class=\"u\">Key points to consider when you start teaching: does your teaching provide a range of activities to cater for the visual, audio and kinesthetic styles?</div><div class=\"u\">نقاط أساسية لما تبدأ تدرّس: هل تدريسك بيوفّر تشكيلة أنشطة بتغطي الأنماط البصرية والسمعية والحركية؟</div>", "n": 1, "i": 71, "a": "tefl-41-063", "x": "6465a2dc"}, {"t": "learn", "h": "<div class=\"u\">What opportunities do you see to enhance the range of activity types in your classroom? And what is your own learning style preference, or is it a mix of two or more?</div><div class=\"u\">إيه الفرص اللي شايفها عشان تزوّد تشكيلة أنواع الأنشطة في فصلك؟ وإيه تفضيل أسلوب تعلمك أنت، ولا هو خليط من اتنين أو أكتر؟</div>", "n": 1, "i": 72, "a": "tefl-41-064", "x": "f79108e1"}, {"t": "learn", "h": "<div class=\"u\">Some people find that their learning style is a blend of two or three styles.</div><div class=\"u\">بعض الناس بيلاقوا إن أسلوب تعلمهم خليط من نمطين أو تلاتة.</div>", "n": 1, "i": 73, "a": "tefl-41-065", "x": "c6dbbe38"}, {"t": "learn", "h": "<div class=\"u\">Naturally, it is not always practical or possible to account for all learning styles in a class.</div><div class=\"u\">طبعًا، مش دايمًا عملي أو ممكن إنك تراعي كل أنماط التعلم في الفصل.</div>", "n": 1, "i": 74, "a": "tefl-41-066", "x": "d090f8fd"}, {"t": "learn", "h": "<div class=\"u\">But if you do identify learning styles to inform your classroom approach, you may gain a deeper understanding of your students' preferences and a greater appreciation of their strengths.</div><div class=\"u\">بس لو حددت أنماط التعلم عشان توجّه طريقة فصلك، ممكن تكسب فهم أعمق لتفضيلات طلبتك وتقدير أكبر لنقاط قوتهم.</div>", "n": 1, "i": 75, "a": "tefl-41-067", "x": "50365e69"}, {"t": "learn", "h": "<div class=\"u\">Awareness of the different learning styles will also help you create more creative and appealing lessons, which promotes more student engagement.</div><div class=\"u\">الوعي بأنماط التعلم المختلفة هيساعدك كمان تعمل دروس أكتر إبداعًا وجاذبية، وده بيعزّز تفاعل الطلبة أكتر.</div>", "n": 1, "i": 76, "a": "tefl-41-068", "x": "95c21645"}, {"t": "learn", "h": "<div class=\"u\">Their increased engagement and success may stimulate you to raise their expectations, starting a powerful expectation-response cycle that leads to greater achievement.</div><div class=\"u\">تفاعلهم ونجاحهم المتزايد ممكن يحفّزك ترفع توقعاتك منهم، وده بيبدأ دورة توقع واستجابة قوية بتقود لإنجاز أكبر.</div>", "n": 1, "i": 77, "a": "tefl-41-069", "x": "f0a4d050"}, {"t": "learn", "h": "<div class=\"u\">This in turn leads to increased motivation for your students and for you.</div><div class=\"u\">وده بدوره بيقود لدافعية متزايدة لطلبتك ولك أنت.</div>", "n": 1, "i": 78, "a": "tefl-41-070", "x": "31087b37"}, {"t": "learn", "h": "<div class=\"u\">You can do your own analysis of students' learning styles through close observation, noting what you hear and see.</div><div class=\"u\">تقدر تعمل تحليلك الخاص لأنماط تعلم طلبتك عن طريق الملاحظة الدقيقة، وتدوين اللي بتسمعه وبتشوفه.</div>", "n": 1, "i": 79, "a": "tefl-41-071", "x": "816bcbd3"}, {"t": "learn", "h": "<div class=\"u\">There are also materials on the internet that can give you ideas, and you can even try a learning styles analysis on yourself.</div><div class=\"u\">في كمان مواد على الإنترنت ممكن تدّيك أفكار، وتقدر حتى تجرب تحليل أنماط التعلم على نفسك.</div>", "n": 1, "i": 80, "a": "tefl-41-072", "x": "9e502745"}, {"t": "learn", "h": "<div class=\"u\">But note: internet materials may be protected by copyright. You may be restricted to personal use, so you must not print them and use them with a group of students. Check carefully.</div><div class=\"u\">بس خد بالك: مواد الإنترنت ممكن تكون محمية بحقوق نشر. ممكن تكون مقصورة على الاستخدام الشخصي، فمينفعش تطبعها وتستخدمها مع مجموعة طلبة. اتأكد كويس.</div>", "n": 1, "i": 81, "a": "tefl-41-073", "x": "47854c71"}, {"t": "learn", "h": "<div class=\"u\">The best route is always to carry out your own analysis via your own approach, by observing your students closely.</div><div class=\"u\">أحسن طريق دايمًا إنك تعمل تحليلك الخاص بطريقتك الخاصة، عن طريق ملاحظة طلبتك من قريب.</div>", "n": 1, "i": 82, "a": "tefl-41-074", "x": "8a57c316"}, {"t": "section", "h": "Summary: using VAK | الخلاصة: استخدام فياك", "n": 1, "i": 83}, {"t": "learn", "h": "<div class=\"u\">Summary: as with any learning approach, you need to decide whether VAK offers you any practical usage. It has proponents and detractors.</div><div class=\"u\">الخلاصة: زي أي منهج تعلم، لازم تقرر إذا كان فياك بيقدملك استخدام عملي ولا لأ. ليه مؤيدين ومعارضين.</div>", "n": 1, "i": 84, "a": "tefl-41-075", "x": "1724d3f6"}, {"t": "learn", "h": "<div class=\"u\">Overall, we feel it serves as a good aid and reminder when you choose appropriate learning activities. First: structure learning materials around the learners' strengths.</div><div class=\"u\">إجمالًا، إحنا حاسين إنه بيخدم كوسيلة مساعدة وتذكير كويس لما بتختار أنشطة تعلم مناسبة. أول حاجة: ابني مواد التعلم حوالين نقاط قوة المتعلمين.</div>", "n": 1, "i": 85, "a": "tefl-41-076", "x": "6498ce33"}, {"t": "learn", "h": "<div class=\"u\">If individuals or groups have particular interests or strengths, like sport or music, structure your materials around these so they are involved and successful.</div><div class=\"u\">لو أفراد أو مجموعات عندهم اهتمامات أو نقاط قوة معينة، زي الرياضة أو الموسيقى، ابني موادك حوالينها عشان يتشاركوا وينجحوا.</div>", "n": 1, "i": 86, "a": "tefl-41-077", "x": "dd1b3230"}, {"t": "learn", "h": "<div class=\"u\">Second: variety brings life to the classroom. A rich mix of activities derived from the different preferences makes a lively, engaging classroom for all learners.</div><div class=\"u\">تاني حاجة: التنوع بيحط روح في الفصل. خليط غني من الأنشطة المشتقة من التفضيلات المختلفة بيعمل فصل حيوي وجذاب لكل المتعلمين.</div>", "n": 1, "i": 87, "a": "tefl-41-078", "x": "ded258b9"}, {"t": "learn", "h": "<div class=\"u\">Third: a whole person approach. Every individual exercises all preferences to some degree, so a multi-faceted approach appeals to all of them.</div><div class=\"u\">تالت حاجة: منهج الشخص الكامل. كل فرد بيستخدم كل التفضيلات بدرجة أو بأخرى، فالمنهج متعدد الأوجه بيلاقي صدى عند كلهم.</div>", "n": 1, "i": 88, "a": "tefl-41-079", "x": "cf82f7a8"}, {"t": "learn", "h": "<div class=\"u\">The VAK approach helps develop the whole person within each learner, which best serves the person's language learning requirements.</div><div class=\"u\">منهج فياك بيساعد ينمّي الشخص الكامل جوا كل متعلم، وده أحسن خدمة لمتطلبات تعلم اللغة عنده.</div>", "n": 1, "i": 89, "a": "tefl-41-080", "x": "1fc0e0ec"}, {"t": "learn", "h": "<div class=\"u\">Give it a try, preferably with older students.</div><div class=\"u\">جرّبه، ويفضّل مع الطلبة الكبار.</div>", "n": 1, "i": 90, "a": "tefl-41-081", "x": "597dfed4"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 91}, {"t": "learn", "h": "<div class=\"u\">learning style: a person's consistent way of perceiving, organising and recalling information.</div><div class=\"u\">أسلوب التعلم: الطريقة الثابتة للشخص في فهم وتنظيم واسترجاع المعلومات.</div>", "n": 1, "i": 92, "a": "tefl-41-082", "x": "b2135f68"}, {"t": "learn", "h": "<div class=\"u\">receptive skills: listening and reading, receiving language.</div><div class=\"u\">المهارات الاستقبالية: الاستماع والقراءة، استقبال اللغة.</div>", "n": 1, "i": 93, "a": "tefl-41-083", "x": "16650ddb"}, {"t": "learn", "h": "<div class=\"u\">productive skills: speaking and writing, producing language.</div><div class=\"u\">المهارات الإنتاجية: الكلام والكتابة، إنتاج اللغة.</div>", "n": 1, "i": 94, "a": "tefl-41-084", "x": "28d88082"}, {"t": "learn", "h": "<div class=\"u\">Kolb's theory: classifies learners into activists, reflectors, theorists and pragmatists.</div><div class=\"u\">نظرية كولب: بتصنّف المتعلمين لنشيطين ومتأملين ونظريين وعمليين.</div>", "n": 1, "i": 95, "a": "tefl-41-085", "x": "dc3544ac"}, {"t": "learn", "h": "<div class=\"u\">VAK: the visual, auditory and kinesthetic learning styles.</div><div class=\"u\">فياك: أنماط التعلم البصري والسمعي والحركي.</div>", "n": 1, "i": 96, "a": "tefl-41-086", "x": "dc851892"}, {"t": "learn", "h": "<div class=\"u\">modality: a channel of learning, like seeing or hearing.</div><div class=\"u\">القناة الحسية: قناة تعلم، زي الرؤية أو السمع.</div>", "n": 1, "i": 97, "a": "tefl-41-087", "x": "368da949"}, {"t": "learn", "h": "<div class=\"u\">tactile learning: learning through touch.</div><div class=\"u\">التعلم اللمسي: التعلم عن طريق اللمس.</div>", "n": 1, "i": 98, "a": "tefl-41-088", "x": "0ec2eeef"}, {"t": "learn", "h": "<div class=\"u\">mind-map: a diagram that links ideas around a centre.</div><div class=\"u\">الخريطة الذهنية: رسم بيربط الأفكار حوالين مركز.</div>", "n": 1, "i": 99, "a": "tefl-41-089", "x": "8b2f01ec"}, {"t": "learn", "h": "<div class=\"u\">flashcard: a card with a prompt on one side and the answer on the other.</div><div class=\"u\">البطاقة التعليمية: كارت عليه سؤال على وش وإجابة على ضهره.</div>", "n": 1, "i": 100, "a": "tefl-41-090", "x": "d7f24500"}, {"t": "learn", "h": "<div class=\"u\">outline: a short structured plan of the main points.</div><div class=\"u\">المخطط: خطة قصيرة منظمة للنقاط الرئيسية.</div>", "n": 1, "i": 101, "a": "tefl-41-091", "x": "9c0ec577"}, {"t": "learn", "h": "<div class=\"u\">field trip: a learning visit outside the classroom.</div><div class=\"u\">الرحلة الميدانية: زيارة تعليمية برا الفصل.</div>", "n": 1, "i": 102, "a": "tefl-41-092", "x": "33e0500f"}, {"t": "learn", "h": "<div class=\"u\">expectation-response cycle: higher expectations leading to higher achievement and back.</div><div class=\"u\">دورة التوقع والاستجابة: توقعات أعلى بتقود لإنجاز أعلى وهكذا.</div>", "n": 1, "i": 103, "a": "tefl-41-093", "x": "f46367e1"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 104}, {"t": "learn", "h": "<div class=\"u\">The four skills split into receptive (listening, reading) and productive (speaking, writing), and they grow together and support one another.</div><div class=\"u\">المهارات الأربعة بتتقسم لاستقبالية (استماع، قراءة) وإنتاجية (كلام، كتابة)، وبتكبر مع بعض وبتدعم بعض.</div>", "n": 1, "i": 105, "a": "tefl-41-094", "x": "b70c35d3"}, {"t": "learn", "h": "<div class=\"u\">A learning style is a consistent way of taking in and recalling information, influenced by genes, experience, culture and society.</div><div class=\"u\">أسلوب التعلم طريقة ثابتة لاستقبال واسترجاع المعلومات، بتتأثر بالجينات والخبرة والثقافة والمجتمع.</div>", "n": 1, "i": 106, "a": "tefl-41-095", "x": "40fcb408"}, {"t": "learn", "h": "<div class=\"u\">The science is unproven, so use learning styles with care, never blindly, especially with young learners.</div><div class=\"u\">العلم لسه مش مثبت، فاستخدم أنماط التعلم بحذر، وأبدًا بشكل أعمى، خصوصًا مع الصغيرين.</div>", "n": 1, "i": 107, "a": "tefl-41-096", "x": "d9ee4fc2"}, {"t": "learn", "h": "<div class=\"u\">Kolb sorts learners into activists, reflectors, theorists and pragmatists; VAK sorts them into visual, auditory and kinesthetic, with everyone using all three.</div><div class=\"u\">كولب بيرتّب المتعلمين لنشيطين ومتأملين ونظريين وعمليين؛ فياك بيرتّبهم لبصري وسمعي وحركي، وكل واحد بيستخدم التلاتة.</div>", "n": 1, "i": 108, "a": "tefl-41-097", "x": "8fca1931"}, {"t": "learn", "h": "<div class=\"u\">Know your own style, observe your students closely, build materials around strengths, and keep activities varied for the whole person.</div><div class=\"u\">اعرف أسلوبك أنت، ولاحظ طلبتك من قريب، وابني المواد حوالين نقاط القوة، وخلّي الأنشطة متنوعة للشخص الكامل.</div>", "n": 1, "i": 109, "a": "tefl-41-098", "x": "ce90ba59"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 110}, {"t": "tf", "q": "A learning style is a more or less consistent way in which a person perceives, conceptualises, organises and recalls information.<br>أسلوب التعلم طريقة ثابتة لحد كبير بيفهم بيها الشخص المعلومة وبيصوّرها وبيظبطها وبيسترجعها.", "ans": true, "why": "True. That is the definition of a learning style. | صح. ده تعريف أسلوب التعلم.", "ex": ["Correct. | صح.", "Wrong. That is exactly the definition. | غلط: ده هو التعريف بالظبط."], "n": 1, "i": 111, "h": ""}, {"t": "tf", "q": "Proponents of learning styles say that learning styles are influenced wholly by the individual's genetic make-up.<br>مؤيدو أنماط التعلم بيقولوا إنها بتتأثر بالكامل بالتكوين الجيني للشخص.", "ans": false, "why": "False. They say styles are influenced by genes AND previous learning experiences, culture and society. | غلط. بيقولوا الأنماط بتتأثر بالجينات وكمان الخبرات السابقة والثقافة والمجتمع.", "ex": ["Correct. It is genes plus experience, culture and society, not wholly genetic. | صح: جينات + خبرة وثقافة ومجتمع، مش جينات بس.", "Wrong. Wholly is the trap word here. | غلط: كلمة بالكامل هي الفخ هنا."], "n": 1, "i": 112, "h": ""}, {"t": "tf", "q": "There is only one approach used to determine an individual's learning style: the VAK approach.<br>في منهج واحد بس لتحديد أسلوب تعلم الفرد: منهج فياك.", "ans": false, "why": "False. There are many approaches; the course focuses on two: Kolb's theory and VAK. | غلط. في مناهج كتير؛ الكورس بيركّز على اتنين: نظرية كولب وفياك.", "ex": ["Correct. Many approaches exist. | صح: في مناهج كتير.", "Wrong. VAK is one of many. | غلط: فياك واحد من كتير."], "n": 1, "i": 113, "h": ""}, {"t": "tf", "q": "Any individual will operate in all three learning style modalities, but with a preference for one or two.<br>أي شخص بيشتغل بقنوات أنماط التعلم التلاتة، بس بتفضيل لواحدة أو اتنين.", "ans": true, "why": "True. That is a key point of the VAK approach. | صح. دي نقطة أساسية في منهج فياك.", "ex": ["Correct. | صح.", "Wrong. Everyone uses all three, with a preference. | غلط: الكل بيستخدم التلاتة، مع تفضيل."], "n": 1, "i": 114, "h": ""}, {"t": "tf", "q": "A kinesthetic learner will likely benefit from being involved in role playing.<br>المتعلم الحركي غالبًا هيستفيد من المشاركة في لعب الأدوار.", "ans": true, "why": "True. Role playing is on the kinesthetic list, along with labs, field trips and short study blocks. | صح. لعب الأدوار في قائمة الحركيين، مع المعامل والرحلات الميدانية وفترات المذاكرة القصيرة.", "ex": ["Correct. | صح.", "Wrong. Doing and moving suit kinesthetic learners. | غلط: العمل والحركة بيناسبوا المتعلم الحركي."], "n": 1, "i": 115, "h": ""}, {"t": "mc", "q": "In Kolb's theory, which group likes lectures, reading papers and considering analogies?<br>في نظرية كولب، أنهي مجموعة بتحب المحاضرات وقراءة الأوراق والتفكير في التشبيهات؟", "opts": ["theorists | النظريين", "activists | النشيطين", "pragmatists | العمليين"], "ans": 0, "why": "Theorists like lectures, reading papers on topics and considering analogies. | النظريين بيحبوا المحاضرات وقراءة الأوراق والتشبيهات.", "ex": ["Correct. | صح.", "No. Activists prefer practical work like labs and field work. | غلط: النشيطين بيفضّلوا الشغل العملي زي المعامل والشغل الميداني.", "No. Pragmatists prefer simulations, case studies and homework. | غلط: العمليين بيفضّلوا المحاكاة ودراسات الحالة والواجبات."], "n": 1, "i": 116, "h": ""}, {"t": "mc", "q": "VAK stands for:<br>فياك اختصار لـ:", "opts": ["Visual, Auditory, Kinesthetic | بصري، سمعي، حركي", "Verbal, Active, Kinetic | لفظي، نشيط، حركي", "Visual, Active, Knowledge | بصري، نشيط، معرفة"], "ans": 0, "why": "VAK identifies three styles: visual, auditory and kinesthetic. | فياك بيحدد تلات أنماط: بصري وسمعي وحركي.", "ex": ["Correct. | صح.", "No. Those are not the three VAK styles. | غلط: دول مش أنماط فياك التلاتة.", "No. The A is auditory, not active. | غلط: الحرف A هو سمعي، مش نشيط."], "n": 1, "i": 117, "h": ""}, {"t": "mc", "q": "The worst test type for a visual learner is:<br>أسوأ نوع امتحان للمتعلم البصري هو:", "opts": ["listen and respond tests | امتحانات اسمع ورد", "diagramming | الرسم التخطيطي", "essays | المقالات"], "ans": 0, "why": "Listen and respond tests are the worst fit for visual learners; diagramming and essays are among their best. | امتحانات اسمع ورد أسوأ حاجة للبصريين؛ الرسم التخطيطي والمقالات من أحسن حاجاتهم.", "ex": ["Correct. | صح.", "No. Diagramming is one of their best test types. | غلط: الرسم التخطيطي من أحسن أنواع الامتحانات ليهم.", "No. Essays suit visual learners. | غلط: المقالات بتناسب المتعلم البصري."], "n": 1, "i": 118, "h": ""}, {"t": "recall", "q": "Name Kolb's four learner types and one thing each type likes.<br>اذكر الأنواع الأربعة للمتعلمين عند كولب وحاجة واحدة كل نوع بيحبها.", "a": "Activists like practical work such as labs and field work; reflectors like watching others and thinking over their own experience; theorists like lectures, reading papers and analogies; pragmatists like simulations, case studies and homework.<br>النشيطين بيحبوا الشغل العملي زي المعامل والشغل الميداني؛ المتأملين بيحبوا مشاهدة الآخرين والتفكير في خبرتهم الخاصة؛ النظريين بيحبوا المحاضرات وقراءة الأوراق والتشبيهات؛ العمليين بيحبوا المحاكاة ودراسات الحالة والواجبات.", "n": 1, "i": 119, "h": ""}, {"t": "recall", "q": "Name the three VAK styles and the best test type for each.<br>اذكر أنماط فياك التلاتة وأحسن نوع امتحان لكل واحد.", "a": "Visual: diagramming, reading maps, essays, showing a process. Auditory: writing responses to lectures heard, and oral exams. Kinesthetic learners learn best by doing, so practical, hands-on assessment suits them.<br>البصري: الرسم التخطيطي وقراءة الخرايط والمقالات وعرض عملية. السمعي: كتابة ردود على محاضرات اتسمعت، والامتحانات الشفوية. الحركي بيتعلم أحسن بالعمل، فالتقييم العملي اليدوي بيناسبه.", "n": 1, "i": 120, "h": ""}, {"t": "write", "q": "Why should a teacher be careful when using learning style methodologies, especially with young learners? (3-4 sentences)<br>ليه المدرس لازم يكون حذر لما يستخدم منهجيات أنماط التعلم، خصوصًا مع الصغيرين؟ (٣-٤ جمل).", "key": "tefl-41:1", "a": "Learning style methodologies remain unproven, and many opinions on both sides lack real scientific proof. It is wrong to apply any methodology blindly and unquestioningly. Teachers must review and assess the effectiveness of the methods they use. So a teacher should use learning styles as a helpful reminder, with extra care when working with young people.<br>منهجيات أنماط التعلم لسه مش مثبتة، وآراء كتير من الطرفين ناقصها دليل علمي حقيقي. غلط تطبّق أي منهجية بشكل أعمى ومن غير تساؤل. المدرسين لازم يراجعوا ويقيّموا فاعلية الطرق اللي بيستخدموها. فالمدرس المفروض يستخدم أنماط التعلم كتذكير مفيد، مع حذر زيادة وهو شغال مع الصغيرين.", "n": 1, "i": 121, "h": ""}, {"t": "write", "q": "How can you find out your students' learning styles? (3-4 sentences)<br>إزاي تقدر تعرف أنماط تعلم طلبتك؟ (٣-٤ جمل).", "key": "tefl-41:2", "a": "The best route is your own analysis through close observation, noting what you hear and see in class. Internet materials can give you ideas for how to approach this, but they may be protected by copyright and restricted to personal use, so check carefully before printing anything for a group. You can also try a learning styles analysis on yourself first. When you analyse students, make them aware of their individual preferences too.<br>أحسن طريق هو تحليلك الخاص عن طريق الملاحظة الدقيقة، وتدوين اللي بتسمعه وبتشوفه في الفصل. مواد الإنترنت ممكن تدّيك أفكار عن إزاي تتعامل مع ده، بس ممكن تكون محمية بحقوق نشر ومقصورة على الاستخدام الشخصي، فاتأكد كويس قبل ما تطبع أي حاجة لمجموعة. تقدر كمان تجرب تحليل أنماط التعلم على نفسك الأول. ولما تحلّل الطلبة، خلّيهم واعيين بتفضيلاتهم الفردية كمان.", "n": 1, "i": 122, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 2, the listening skill, why listening is hard for learners and the strategies that build it.</div><div class=\"u\">الدرس الجاي: الوحدة التانية، مهارة الاستماع، ليه الاستماع صعب على المتعلمين والاستراتيجيات اللي بتبنيه.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 123}];</script>
