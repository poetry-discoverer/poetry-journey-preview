<script>window.LESSON_ID="tefl-49";window.STEPS=[{"t": "section", "h": "Module 11 welcome | ترحيب الموديول الحداشر", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Module 11. Here we explore the areas of grammar that are often deemed a little bit tricky.</div><div class=\"u\">أهلاً بيك في الموديول الحداشر. هنا هنستكشف مناطق القواعد اللي غالبًا بتتعتبر شوكة شوية.</div>", "n": 1, "i": 1, "a": "tefl-49-001", "x": "2e05252a"}, {"t": "learn", "h": "<div class=\"u\">Often it is not the meaning of the grammar that is tricky. It is the teaching of it where some teachers feel unsure.</div><div class=\"u\">غالبًا مش معنى القاعدة هو الشوكة. التعليم هو اللي بعض المدرسين بيحسّوا فيه بعدم ثقة.</div>", "n": 1, "i": 2, "a": "tefl-49-002", "x": "a0a109e2"}, {"t": "learn", "h": "<div class=\"u\">The tricky areas are in separate units: phrasal verbs, prepositions, idioms, conditional forms, direct and reported speech, and modal verbs.</div><div class=\"u\">المناطق الشوكة في وحدات منفصلة: الأفعال المركبة، حروف الجر، التعبيرات الاصطلاحية، الأشكال الشرطية، الكلام المباشر والمنقول، والأفعال المساعدة النموذجية.</div>", "n": 1, "i": 3, "a": "tefl-49-003", "x": "8e8e0c55"}, {"t": "learn", "h": "<div class=\"u\">Then come very useful practical grammar DVD lessons.</div><div class=\"u\">وبعدين بتيجي دروس قواعد عملية مفيدة جدًا بالفيديو.</div>", "n": 1, "i": 4, "a": "tefl-49-004", "x": "bb6d3b7c"}, {"t": "learn", "h": "<div class=\"u\">With this module plus what you learned in Module 2, Grammar Awareness, you will be ready to handle any grammar question in any situation.</div><div class=\"u\">بالموديول ده زائد اللي اتعلمته في الموديول التاني، الوعي بالقواعد، هتبقى جاهز تتعامل مع أي سؤال قواعد في أي موقف.</div>", "n": 1, "i": 5, "a": "tefl-49-005", "x": "630256ec"}, {"t": "section", "h": "What phrasal verbs are | إيه هي الأفعال المركبة", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Unit one: phrasal verbs. They present learners with a huge challenge, because there are thousands of them, all with different meanings.</div><div class=\"u\">الوحدة الأولى: الأفعال المركبة. بتحط المتعلمين قدام تحدي ضخم، لأن فيه الآلاف منهم، وكلهم بمعاني مختلفة.</div>", "n": 1, "i": 7, "a": "tefl-49-006", "x": "f4a4f65f"}, {"t": "learn", "h": "<div class=\"u\">They are so prevalent in everyday speaking and informal writing that learners must learn them; otherwise they will have difficulty communicating fully.</div><div class=\"u\">هما منتشرين أوي في الكلام اليومي والكتابة غير الرسمية لدرجة إن المتعلمين لازم يتعلّموهم؛ وإلا هيبقى عندهم صعوبة في التواصل الكامل.</div>", "n": 1, "i": 8, "a": "tefl-49-007", "x": "ea3b1177"}, {"t": "learn", "h": "<div class=\"u\">A phrasal verb is a verb plus a preposition or adverb, or both: hopefully, they'll put us up for the night. I'll pick up some coffee when I'm out. If we all chip in, we'll finish it soon.</div><div class=\"u\">الفعل المركب هو فعل زائد حرف جر أو حال، أو الاتنين: يا ريت يضيّفونا الليلة. هجيب شوية قهوة وأنا طالع. لو كلنا نشارك، هنخلّصها قريب.</div>", "n": 1, "i": 9, "a": "tefl-49-008", "x": "9236ada6"}, {"t": "learn", "h": "<div class=\"u\">A good definition: a phrase consisting of a verb with a preposition or adverb or both, whose meaning is different from the meaning of its separate parts.</div><div class=\"u\">تعريف كويس: عبارة مكوّنة من فعل مع حرف جر أو حال أو الاتنين، معناها مختلف عن معنى أجزائها المنفصلة.</div>", "n": 1, "i": 10, "a": "tefl-49-009", "x": "dc510dfa"}, {"t": "learn", "h": "<div class=\"u\">These items exist in many languages in different shapes and forms. Inexperienced teachers often give the impression they only exist in English. That is just wrong.</div><div class=\"u\">العناصر دي موجودة في لغات كتير بأشكال وصور مختلفة. المدرسين قليلي الخبرة غالبًا بيدّوا انطباع إنها موجودة بس في الإنجليزي. وده غلط ببساطة.</div>", "n": 1, "i": 11, "a": "tefl-49-010", "x": "cc33f4cf"}, {"t": "learn", "h": "<div class=\"u\">People use them because they are often less formal and more colloquial than established single words, and they often convey more emotion and stronger images.</div><div class=\"u\">الناس بتستخدمهم لأنهم غالبًا أقل رسمية وأكثر عامية من الكلمات المفردة المعروفة، وغالبًا بينقلوا مشاعر أكتر وصور أقوى.</div>", "n": 1, "i": 12, "a": "tefl-49-011", "x": "ce0e3c21"}, {"t": "section", "h": "The come and look examples | أمثلة الكوم واللوك", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">Take the everyday verb come. Learners quickly learn it means moving forwards or to a place: come here; she came to her house.</div><div class=\"u\">خد فعل الكوم اليومي. المتعلمين بيتعلّموا بسرعة إنه معناه التحرك لقدام أو لمكان: تعال هنا؛ هي جت بيتها.</div>", "n": 1, "i": 14, "a": "tefl-49-012", "x": "0cf81254"}, {"t": "learn", "h": "<div class=\"u\">Now add tiny words and the meaning bears no relation to come at all.</div><div class=\"u\">دلوقتي ضيف كلمات صغيرة والمعنى مالوش أي علاقة بالكوم خالص.</div>", "n": 1, "i": 15, "a": "tefl-49-013", "x": "4b2af9d0"}, {"t": "learn", "h": "<div class=\"u\">I've been looking for this for ages. I've just come across it: found. My bag has come apart: broken up. I think she has come up with a good idea: thought of.</div><div class=\"u\">أنا بدوّر على ده من زمان. لقيته بالصدفة: وجدت. شنطتي تفكّكت: اتكسرت. أنا فاكر إنها طلعت بفكرة كويسة: فكّرت.</div>", "n": 1, "i": 16, "a": "tefl-49-014", "x": "d8fb42de"}, {"t": "learn", "h": "<div class=\"u\">How did that come about: transpire. Then it came back to me: remembered. I'm sure he'll come around: change his mind.</div><div class=\"u\">ده حصل إزاي: حدث. وبعدين فكّرت: اتذكرت. أنا متأكد إنه هيغيّر رأيه: يعدّل موقفه.</div>", "n": 1, "i": 17, "a": "tefl-49-015", "x": "fcbc5e26"}, {"t": "learn", "h": "<div class=\"u\">He came down on us like a ton of bricks: scold. I think she's about to come down with something: be ill. Two witnesses have come forward: contacted willingly. She comes from Edinburgh: hails from.</div><div class=\"u\">هو اتهجم علينا بعنف: عنّف. أنا فاكر إنها على وشك تمرض: تبقى عيانة. شاهدين اتقدّموا: اتواصلوا طوعًا. هي من أدنبرة: أصلها من.</div>", "n": 1, "i": 18, "a": "tefl-49-016", "x": "5a6d9eb0"}, {"t": "learn", "h": "<div class=\"u\">The meaning of come down cannot be worked out by joining the meanings of come and down.</div><div class=\"u\">معنى الكوم داون مابيقدرش يتطلّع من جمع معنى الكوم والداون.</div>", "n": 1, "i": 19, "a": "tefl-49-017", "x": "9220f2fc"}, {"t": "learn", "h": "<div class=\"u\">The verb look has the same problem. Look after: take care of. Look ahead: plan the future. Look back: think about the past. Look down on: consider inferior.</div><div class=\"u\">فعل اللوك عنده نفس المشكلة. لوك أفتر: يعتني بـ. لوك أهيد: يخطط للمستقبل. لوك باك: يفكر في الماضي. لوك داون أون: يحتقر.</div>", "n": 1, "i": 20, "a": "tefl-49-018", "x": "2ce031f9"}, {"t": "learn", "h": "<div class=\"u\">Look for: try to find. Look forward to: feel excited about something coming. Look into: examine a problem.</div><div class=\"u\">لوك فور: يدوّر. لوك فورورد تو: يبقى متحمس لحاجة جاية. لوك إنتو: يفحص مشكلة.</div>", "n": 1, "i": 21, "a": "tefl-49-019", "x": "90d328e4"}, {"t": "learn", "h": "<div class=\"u\">And look at itself has two meanings: read something quickly, or investigate a problem carefully.</div><div class=\"u\">واللوك آت نفسها ليها معنيين: تقرا حاجة بسرعة، أو تتحرّى مشكلة بعناية.</div>", "n": 1, "i": 22, "a": "tefl-49-020", "x": "f569cd3b"}, {"t": "section", "h": "Why they are difficult | ليه هما صعبة", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">Why are phrasal verbs so difficult? First, there are few clues to the meaning of each construction.</div><div class=\"u\">ليه الأفعال المركبة صعبة أوي كده؟ أول حاجة، مفيش شوية قرائن على معنى كل تركيبة.</div>", "n": 1, "i": 24, "a": "tefl-49-021", "x": "8c52ba7e"}, {"t": "learn", "h": "<div class=\"u\">Worse, supposed clues can mislead. If you teach that in suggests going inside something, look in the shop seems fine.</div><div class=\"u\">والأسوأ، القرائن المفترضة ممكن تضلّل. لو علّمت إن الإن بتقترح الدخول جوه حاجة، لوك إن زا شوب باينة تمام.</div>", "n": 1, "i": 25, "a": "tefl-49-022", "x": "c3e1b27a"}, {"t": "learn", "h": "<div class=\"u\">But look in on old Mrs Brown means drop in for a short unplanned visit to check she is OK.</div><div class=\"u\">بس لوك إن أون مدام براون الكبيرة معناها زيارة قصيرة غير مخططة تطمن فيها عليها.</div>", "n": 1, "i": 26, "a": "tefl-49-023", "x": "9a3d2415"}, {"t": "learn", "h": "<div class=\"u\">Second, the same construction can have different meanings: I looked at your drawing is a quick look; oil prices are rising, we need to look at that is a longer investigation.</div><div class=\"u\">تاني حاجة، نفس التركيبة ممكن يبقى ليها معاني مختلفة: أنا بصيت على رسمتك دي نظرة سريعة؛ أسعار البترول بترتفع، محتاجين نتحرّى ده ده تحقيق أطول.</div>", "n": 1, "i": 27, "a": "tefl-49-024", "x": "c9fa0560"}, {"t": "learn", "h": "<div class=\"u\">Third, some constructions just have to be learned: we almost always say the curtain went up, even when the curtain actually opens sideways.</div><div class=\"u\">تالت حاجة، بعض التراكيب لازم تتحفظ وبس: تقريبًا دايمًا بنقول الستارة طلعت، حتى لما الستارة فعلًا بتتفتح من الجناب.</div>", "n": 1, "i": 28, "a": "tefl-49-025", "x": "2749f32a"}, {"t": "learn", "h": "<div class=\"u\">We use raise before the event: it was time to raise the curtain; the curtain went up; the show began.</div><div class=\"u\">بنستخدم الرايز قبل الحدث: كان وقت رفع الستارة؛ الستارة طلعت؛ العرض بدأ.</div>", "n": 1, "i": 29, "a": "tefl-49-026", "x": "7d507ed3"}, {"t": "learn", "h": "<div class=\"u\">The particle is the word tagged onto the verb, like on or back. It has a grammatical purpose but little or no meaning in itself.</div><div class=\"u\">الجسيم هو الكلمة الملزوقة في الفعل، زي الأون أو الباك. ليها هدف قواعدي بس معناها قليل أو معدوم في نفسها.</div>", "n": 1, "i": 30, "a": "tefl-49-027", "x": "27d64c14"}, {"t": "learn", "h": "<div class=\"u\">Sometimes the particle can move: I put my coat on or I put on my coat. But: she gave it back, never she gave back it.</div><div class=\"u\">أحيانًا الجسيم بيتحرك: أنا لبست البالطو أو أنا لبست البالطو بترتيب تاني. بس: هي رجّعتهالي، أبدًا بترتيب غلط.</div>", "n": 1, "i": 31, "a": "tefl-49-028", "x": "a70da4f6"}, {"t": "learn", "h": "<div class=\"u\">Three-part phrasal verbs are especially hard, because the learner hears words they all know that make no sense together.</div><div class=\"u\">الأفعال المركبة التلاتية صعبة بالذات، لأن المتعلم بيسمع كلمات كلها يعرفها بس مالهاش معنى مع بعض.</div>", "n": 1, "i": 32, "a": "tefl-49-029", "x": "0262fe8a"}, {"t": "learn", "h": "<div class=\"u\">For example: get up to means doing; go in for means like; come out with means saying.</div><div class=\"u\">مثال: جت أب تو معناها بيعمل؛ جو إن فور معناها بيحب؛ كم آوت ويز معناها بيقول.</div>", "n": 1, "i": 33, "a": "tefl-49-030", "x": "800742fe"}, {"t": "section", "h": "Key characteristics | الخصائص الأساسية", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">The key characteristics. A phrasal verb combines a verb with a preposition or adverb, taking a different meaning from the original verb.</div><div class=\"u\">الخصائص الأساسية. الفعل المركب بيجمع فعل مع حرف جر أو حال، وبياخد معنى مختلف عن الفعل الأصلي.</div>", "n": 1, "i": 35, "a": "tefl-49-031", "x": "b187f034"}, {"t": "learn", "h": "<div class=\"u\">They are idiomatic: each one must be learned as a single lexical item, like a separate verb with a specific meaning.</div><div class=\"u\">هما اصطلاحيين: كل واحد لازم يتتحفظ كعنصر معجمي واحد، زي فعل منفصل بمعنى محدد.</div>", "n": 1, "i": 36, "a": "tefl-49-032", "x": "56344b97"}, {"t": "learn", "h": "<div class=\"u\">We use them like normal verbs, regular or irregular: Lisa tore up the card and threw it in the bin. The bus broke down. Did you deal with the complaint?</div><div class=\"u\">بنستخدمهم زي الأفعال العادية، منتظمة أو شاذة: ليزا مزّقت الكارت ورمته في الزبالة. الأتوبيس عطّل. تعاملت مع الشكوى؟</div>", "n": 1, "i": 37, "a": "tefl-49-033", "x": "db24a3ab"}, {"t": "learn", "h": "<div class=\"u\">They tend to be more informal and more spoken than written, but some pop up in formal communication too.</div><div class=\"u\">هما بيميلوا يبقوا أقل رسمية وأكتر منطوقين من مكتوبين، بس بعضهم بيظهر في التواصل الرسمي كمان.</div>", "n": 1, "i": 38, "a": "tefl-49-034", "x": "64993ec6"}, {"t": "learn", "h": "<div class=\"u\">Some are transitive, taking an object: I made up an excuse. Some are intransitive, with no object: her ex-husband suddenly showed up; the baby woke up early.</div><div class=\"u\">بعضهم متعدّي، بياخد مفعول: أنا اخترعت عذر. وبعضهم لازم، من غير مفعول: جوزها السابق ظهر فجأة؛ البيبي صحي بدري.</div>", "n": 1, "i": 39, "a": "tefl-49-035", "x": "5d39460e"}, {"t": "learn", "h": "<div class=\"u\">Intransitive phrasal verbs are inseparable: the baby woke up early today is correct; the baby woke early up today is not.</div><div class=\"u\">الأفعال المركبة اللازمة مابتتفصلش: البيبي صحي بدري النهارده صح؛ ترتيب الجسيم في الآخر غلط.</div>", "n": 1, "i": 40, "a": "tefl-49-036", "x": "d5bfa1f5"}, {"t": "learn", "h": "<div class=\"u\">Some transitive ones are separable: Matteo looked the phone number up. Some are inseparable: the police are looking into the theft; Bill ran into an old colleague.</div><div class=\"u\">بعض المتعدّية بتتفصل: ماتيو دوّر على الرقم فوق. وبعضها مابتتفصلش: البوليس بيتحرّى السرقة؛ بيل قابل زميل قديم بالصدفة.</div>", "n": 1, "i": 41, "a": "tefl-49-037", "x": "1b3a6bcb"}, {"t": "learn", "h": "<div class=\"u\">Some take the object in both places: I looked the number up or I looked up the number. They turned down my request or they turned my request down.</div><div class=\"u\">بعضها بياخد المفعول في المكانين: دوّرت على الرقم بترتيبين. رفضوا طلبي بترتيبين.</div>", "n": 1, "i": 42, "a": "tefl-49-038", "x": "0bcc1ef3"}, {"t": "learn", "h": "<div class=\"u\">But if the object is a pronoun, there is no choice: Madison looked it up is correct; Madison looked up it is wrong.</div><div class=\"u\">بس لو المفعول ضمير، مفيش اختيار: ماديسون دوّرت عليه صح؛ الترتيب التاني غلط.</div>", "n": 1, "i": 43, "a": "tefl-49-039", "x": "d6f0c810"}, {"t": "learn", "h": "<div class=\"u\">A good dictionary will often tell you whether a phrasal verb is separable or inseparable.</div><div class=\"u\">القاموس الكويس غالبًا هيقولك لو الفعل المركب بيتفصل ولا لأ.</div>", "n": 1, "i": 44, "a": "tefl-49-040", "x": "d21e402a"}, {"t": "section", "h": "Teaching traps | مصايد التعليم", "n": 1, "i": 45}, {"t": "learn", "h": "<div class=\"u\">Inexperienced teachers fall into traps when teaching phrasal verbs. Trap one: randomly selecting a list for students to learn by next meeting.</div><div class=\"u\">المدرسين قليلي الخبرة بيقعوا في مصايد وهما بيعلّموا الأفعال المركبة. المصيدة الأولى: اختيار قائمة عشوائية للطلبة يحفظوها للحصة الجاية.</div>", "n": 1, "i": 46, "a": "tefl-49-041", "x": "ab2e00bb"}, {"t": "learn", "h": "<div class=\"u\">Trap two: asking students to pick phrasal verbs from the dictionary and demonstrate their usage.</div><div class=\"u\">المصيدة التانية: طلب من الطلبة يختاروا أفعال مركبة من القاموس ويوضّحوا استخدامها.</div>", "n": 1, "i": 47, "a": "tefl-49-042", "x": "13dfad56"}, {"t": "learn", "h": "<div class=\"u\">Trap three: after a random passage, asking students to identify the phrasal verbs and work out their meanings.</div><div class=\"u\">المصيدة التالتة: بعد قطعة عشوائية، طلب من الطلبة يحدّدوا الأفعال المركبة ويطلّعوا معانيها.</div>", "n": 1, "i": 48, "a": "tefl-49-043", "x": "a9385286"}, {"t": "learn", "h": "<div class=\"u\">Trap four: brainstorming sessions where students create lists of phrasal verbs to share.</div><div class=\"u\">المصيدة الرابعة: جلسات عصف ذهني الطلبة بيعملوا فيها قوائم أفعال مركبة يتشاركوها.</div>", "n": 1, "i": 49, "a": "tefl-49-044", "x": "ed20176e"}, {"t": "learn", "h": "<div class=\"u\">Trap five: sessions focused on one verb and all its combinations, which floods students with meanings they will never use.</div><div class=\"u\">المصيدة الخامسة: جلسات مركّزة على فعل واحد وكل تركيباته، وده بيغرق الطلبة بمعاني أبدًا مش هيستخدموها.</div>", "n": 1, "i": 50, "a": "tefl-49-045", "x": "169391fb"}, {"t": "learn", "h": "<div class=\"u\">Why are these traps? Random learning is not conducive to learning. Students need meaningful language in context to draw the meaning from their memory bank later.</div><div class=\"u\">ليه دي مصايد؟ التعلّم العشوائي مش بيساعد التعلّم. الطلبة محتاجين لغة ذات معنى في سياق عشان يسحبوا المعنى من بنك ذاكرتهم بعدين.</div>", "n": 1, "i": 51, "a": "tefl-49-046", "x": "cb7a1ccb"}, {"t": "learn", "h": "<div class=\"u\">Brainstorming is uncontrolled and may produce obscure items. And passages must be selected carefully or written bespoke, so what they learn can actually be used.</div><div class=\"u\">العصف الذهني غير متحكم فيه وممكن ينتج عناصر غامضة. والقطع لازم تتختار بعناية أو تتكتب مخصوص، عشان اللي بيتعلّموه يقدروا فعلًا يستخدموه.</div>", "n": 1, "i": 52, "a": "tefl-49-047", "x": "7999a4ba"}, {"t": "section", "h": "Teaching them well | تعليمهم كويس", "n": 1, "i": 53}, {"t": "learn", "h": "<div class=\"u\">So how do you teach phrasal verbs effectively? One: start right from the beginning, with plenty of phrasal verbs at elementary level, inside general vocabulary teaching.</div><div class=\"u\">طب إزاي تعلّم الأفعال المركبة بفاعلية؟ واحد: ابدأ من البداية، بأفعال مركبة كتير في المستوى الابتدائي، جوه تعليم المفردات العام.</div>", "n": 1, "i": 54, "a": "tefl-49-048", "x": "c3f7e0c5"}, {"t": "learn", "h": "<div class=\"u\">Do not suddenly start teaching hundreds of them all together at higher levels.</div><div class=\"u\">ماتبدأش فجأة تعلّم المئات منهم مع بعض في المستويات العليا.</div>", "n": 1, "i": 55, "a": "tefl-49-049", "x": "d41797a6"}, {"t": "learn", "h": "<div class=\"u\">Two: do not isolate them. Use very small sets, like get up, get ready, get dressed for younger students, or the turn down, turn up, turn out set for more competent ones.</div><div class=\"u\">اتنين: ماتعزلهمش. استخدم مجموعات صغيرة جدًا، زي قوم وجهّز والبس للصغيرين، أو مجموعة التيرن داون والتيرن أب والتيرن آوت للأقدر.</div>", "n": 1, "i": 56, "a": "tefl-49-050", "x": "4481229e"}, {"t": "learn", "h": "<div class=\"u\">Three: vary your approach. Cartoons are excellent for illustrating phrasal verbs visually.</div><div class=\"u\">تلاتة: نوّع أسلوبك. الكرتون ممتاز لتوضيح الأفعال المركبة بصريًا.</div>", "n": 1, "i": 57, "a": "tefl-49-051", "x": "91fbb9e8"}, {"t": "learn", "h": "<div class=\"u\">For example: come down with shown as upright and active versus in bed with spots; come up with shown as a character jumping up with a solution in hand.</div><div class=\"u\">مثال: كم داون ويز متوضحة بواحد واقف ونشيط مقابل واحد في السرير بطفح؛ كم أب ويز متوضحة بشخصية بتنط واقفة ومعاها الحل في إيدها.</div>", "n": 1, "i": 58, "a": "tefl-49-052", "x": "12f62857"}, {"t": "learn", "h": "<div class=\"u\">Four: compare with their native language. Germanic languages like German and Dutch have separable prefix verbs similar to English phrasal verbs.</div><div class=\"u\">أربعة: قارن بلغتهم الأصلية. اللغات الجرمانية زي الألماني والهولندي عندها أفعال بادئاتها بتتفصل شبه الأفعال المركبة الإنجليزية.</div>", "n": 1, "i": 59, "a": "tefl-49-053", "x": "3e0a4230"}, {"t": "learn", "h": "<div class=\"u\">Foster an awareness of any similarities between English and the learners' first language.</div><div class=\"u\">نمّي الوعي بأي تشابهات بين الإنجليزي واللغة الأولى للمتعلمين.</div>", "n": 1, "i": 60, "a": "tefl-49-054", "x": "b0515429"}, {"t": "learn", "h": "<div class=\"u\">Five: focus on everyday communicative language. Phrasal verbs from a discussion about the moon may be interesting, but everyday contexts make students ready to use them.</div><div class=\"u\">خمسة: ركّز على اللغة التواصلية اليومية. الأفعال المركبة من نقاش عن القمر ممكن تبقى ممتعة، بس السياقات اليومية بتجهّز الطلبة يستخدموها.</div>", "n": 1, "i": 61, "a": "tefl-49-055", "x": "3581e2fb"}, {"t": "section", "h": "The key: everyday topics | المفتاح: المواضيع اليومية", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">The key: think of an everyday context and topic that applies to all of them. Ask yourself: what do all of my students do to some degree?</div><div class=\"u\">المفتاح: فكّر في سياق يومي وموضوع بينطبق عليهم كلهم. اسأل نفسك: كل طلبتي بيعملوا إيه بدرجة ما؟</div>", "n": 1, "i": 63, "a": "tefl-49-056", "x": "ab834481"}, {"t": "learn", "h": "<div class=\"u\">All of your students need to eat, use a phone, shop, and travel from school to home. Each of these events includes relevant phrasal verbs in common use.</div><div class=\"u\">كل طلبتك محتاجين ياكلوا، يستخدموا تليفون، يتسوّقوا، ويروحوا من المدرسة للبيت. كل حدث من دول فيه أفعال مركبة مناسبة في الاستخدام الشائع.</div>", "n": 1, "i": 64, "a": "tefl-49-057", "x": "f893ef4b"}, {"t": "learn", "h": "<div class=\"u\">Example topic: making a sandwich. Use your teacher table as the kitchen top and plastic vegetables for the demonstration.</div><div class=\"u\">موضوع مثال: عمل ساندويتش. استخدم ترابيزة المدرس كسطح مطبخ وخضار بلاستيك للعرض.</div>", "n": 1, "i": 65, "a": "tefl-49-058", "x": "c7981bbd"}, {"t": "learn", "h": "<div class=\"u\">The phrasal verbs to bring out: peel off the skin, fry up breakfast, slice off meat from the bone, cut up into slices.</div><div class=\"u\">الأفعال المركبة المطلوبة: يقشّر القشر، يقلي الفطار، يشرّح اللحمة من على العضم، يقطّع شرايع.</div>", "n": 1, "i": 66, "a": "tefl-49-059", "x": "e13d7198"}, {"t": "learn", "h": "<div class=\"u\">Also: cut off the fat, chop up into pieces, boil away for a set time, and boil over when there is too much heat.</div><div class=\"u\">وكمان: يشيل الدهن، يفرم قطع صغيرة، يغلي لوقت محدد، ويفور لو النار عالية.</div>", "n": 1, "i": 67, "a": "tefl-49-060", "x": "f318b25a"}, {"t": "learn", "h": "<div class=\"u\">Explain them, get students to repeat the sounds, write what is necessary on the board, then let students role play making a sandwich and explaining what they are doing.</div><div class=\"u\">اشرحهم، خلّي الطلبة يكرروا الأصوات، اكتب اللازم على السبورة، وبعدين سيّب الطلبة يلعبوا دور عمل ساندويتش ويشرحوا بيعملوا إيه.</div>", "n": 1, "i": 68, "a": "tefl-49-061", "x": "1c130fc5"}, {"t": "learn", "h": "<div class=\"u\">Reinforce later with a gap-fill exercise or a short written piece: how to make the perfect sandwich. Add dictionary work, and encourage them to use the verbs at home with their parents.</div><div class=\"u\">ثبّت بعدين بتمرين ملء فراغات أو قطعة مكتوبة قصيرة: إزاي تعمل الساندويتش المثالي. ضيف شغل قاموس، وشجّعهم يستخدموا الأفعال في البيت مع أهلهم.</div>", "n": 1, "i": 69, "a": "tefl-49-062", "x": "8b7cb36a"}, {"t": "learn", "h": "<div class=\"u\">Another example topic: using a phone. Mix phrasal verbs with other useful vocabulary.</div><div class=\"u\">موضوع مثال تاني: استخدام التليفون. امزج الأفعال المركبة بمفردات مفيدة تانية.</div>", "n": 1, "i": 70, "a": "tefl-49-063", "x": "317c0cec"}, {"t": "learn", "h": "<div class=\"u\">Phrasal verbs: to ring somebody up, to get through, to hang on, to hang up.</div><div class=\"u\">الأفعال المركبة: تكلم حد، توصل، استنى، اقفل.</div>", "n": 1, "i": 71, "a": "tefl-49-064", "x": "72beda3c"}, {"t": "learn", "h": "<div class=\"u\">Other phone vocabulary: dialling tone, hold the line, wrong number, speaking, leave a message, bad line.</div><div class=\"u\">مفردات تليفون تانية: نغمة الاتصال، خليك على الخط، رقم غلط، اتفضل، سيب رسالة، الخط وحش.</div>", "n": 1, "i": 72, "a": "tefl-49-065", "x": "fdc2d6f0"}, {"t": "learn", "h": "<div class=\"u\">And always remember the general recommendations for grammar: practice, exposure, recycling, and learning in context.</div><div class=\"u\">ودايمًا افتكر التوصيات العامة للقواعد: التدريب، والتعرض، وإعادة التدوير، والتعلّم في سياق.</div>", "n": 1, "i": 73, "a": "tefl-49-066", "x": "e4369b0b"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 74}, {"t": "learn", "h": "<div class=\"u\">phrasal verb: a verb plus particle(s) with a new idiomatic meaning.</div><div class=\"u\">الفعل المركب: فعل زائد جسيم أو أكتر بمعنى اصطلاحي جديد.</div>", "n": 1, "i": 75, "a": "tefl-49-067", "x": "0e01b645"}, {"t": "learn", "h": "<div class=\"u\">particle: the small word tagged onto the verb, like up or off.</div><div class=\"u\">الجسيم: الكلمة الصغيرة الملزوقة في الفعل، زي أب أو أوف.</div>", "n": 1, "i": 76, "a": "tefl-49-068", "x": "cf2d8093"}, {"t": "learn", "h": "<div class=\"u\">idiomatic: the meaning cannot be deduced from the parts.</div><div class=\"u\">اصطلاحي: المعنى مابيتطلّعش من الأجزاء.</div>", "n": 1, "i": 77, "a": "tefl-49-069", "x": "00ded124"}, {"t": "learn", "h": "<div class=\"u\">transitive: takes an object.</div><div class=\"u\">متعدّي: بياخد مفعول.</div>", "n": 1, "i": 78, "a": "tefl-49-070", "x": "41ef4f25"}, {"t": "learn", "h": "<div class=\"u\">intransitive: takes no object.</div><div class=\"u\">لازم: مابياخدش مفعول.</div>", "n": 1, "i": 79, "a": "tefl-49-071", "x": "f84a9581"}, {"t": "learn", "h": "<div class=\"u\">separable: the object can sit between verb and particle.</div><div class=\"u\">قابل للفصل: المفعول ممكن يقعد بين الفعل والجسيم.</div>", "n": 1, "i": 80, "a": "tefl-49-072", "x": "0d6456ec"}, {"t": "learn", "h": "<div class=\"u\">inseparable: the object must follow the particle.</div><div class=\"u\">غير قابل للفصل: المفعول لازم ييجي بعد الجسيم.</div>", "n": 1, "i": 81, "a": "tefl-49-073", "x": "eb9c1370"}, {"t": "learn", "h": "<div class=\"u\">colloquial: informal, everyday spoken style.</div><div class=\"u\">عامي: أسلوب منطوق يومي غير رسمي.</div>", "n": 1, "i": 82, "a": "tefl-49-074", "x": "db388824"}, {"t": "learn", "h": "<div class=\"u\">lexical item: a unit of vocabulary learned as one piece.</div><div class=\"u\">العنصر المعجمي: وحدة مفردات بتتتحفظ كقطعة واحدة.</div>", "n": 1, "i": 83, "a": "tefl-49-075", "x": "12c84e4a"}, {"t": "learn", "h": "<div class=\"u\">rote learning: learning by repetition and memorisation.</div><div class=\"u\">الحفظ بالتكرار: التعلّم بالتكرار والاستظهار.</div>", "n": 1, "i": 84, "a": "tefl-49-076", "x": "25afb07c"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 85}, {"t": "learn", "h": "<div class=\"u\">A phrasal verb is a verb plus a preposition or adverb whose meaning differs from its parts; there are thousands, and learners must learn them to communicate fully.</div><div class=\"u\">الفعل المركب هو فعل زائد حرف جر أو حال معناه مختلف عن أجزائه؛ فيه الآلاف منهم، والمتعلمين لازم يتعلّموهم عشان يتواصلوا بشكل كامل.</div>", "n": 1, "i": 86, "a": "tefl-49-077", "x": "c5426d04"}, {"t": "learn", "h": "<div class=\"u\">They are idiomatic, confusing and often informal; one verb can carry many combinations, and one combination can carry many meanings.</div><div class=\"u\">هما اصطلاحيين ومحيّرين وغالبًا غير رسميين؛ فعل واحد ممكن يحمل تركيبات كتير، وتركيبة واحدة ممكن تحمل معاني كتير.</div>", "n": 1, "i": 87, "a": "tefl-49-078", "x": "6bfaf3c0"}, {"t": "learn", "h": "<div class=\"u\">Form matters: transitive or intransitive, separable or inseparable, and pronouns must split the separable ones.</div><div class=\"u\">الشكل مهم: متعدّي أو لازم، قابل للفصل أو لأ، والضماير لازم تفصل القابلة للفصل.</div>", "n": 1, "i": 88, "a": "tefl-49-079", "x": "3db1bdc8"}, {"t": "learn", "h": "<div class=\"u\">Avoid the traps: random lists, dictionary selections, random passages, uncontrolled brainstorming and single-verb floods.</div><div class=\"u\">تجنّب المصايد: القوائم العشوائية، اختيارات القاموس، القطع العشوائية، العصف الذهني غير المتحكم فيه وغرق الفعل الواحد.</div>", "n": 1, "i": 89, "a": "tefl-49-080", "x": "17545860"}, {"t": "learn", "h": "<div class=\"u\">Teach them early, in small sets, visually, linked to the L1, and above all inside everyday topics like food, phones, shopping and travel.</div><div class=\"u\">علّمهم بدري، في مجموعات صغيرة، بصريًا، مربوطين باللغة الأولى، وفوق كل حاجة جوه مواضيع يومية زي الأكل والتليفون والتسوق والمواصلات.</div>", "n": 1, "i": 90, "a": "tefl-49-081", "x": "19f1086e"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 91}, {"t": "mc", "q": "A phrasal verb is:<br>الفعل المركب هو:", "opts": ["a verb plus preposition or adverb with a new meaning | فعل زائد حرف جر أو حال بمعنى جديد", "two nouns joined together | اسمين متجمعين", "a very formal verb | فعل رسمي جدًا"], "ans": 0, "why": "Its meaning differs from the meaning of its separate parts. | معناه مختلف عن معنى أجزائه المنفصلة.", "ex": ["Correct. | صح.", "No. It centres on a verb. | غلط: بيتمركز حوالين فعل.", "No. They are usually less formal. | غلط: هما عادة أقل رسمية."], "n": 1, "i": 92, "h": ""}, {"t": "mc", "q": "I've just come across it means:<br>جيت عليها بالصدفة معناها:", "opts": ["I found it | لقيتها", "I crossed the road | عدّيت الشارع", "I arrived | وصلت"], "ans": 0, "why": "Come across means to find something, often by chance. | كم أكراس معناها تلاقي حاجة، غالبًا بالصدفة.", "ex": ["Correct. | صح.", "No. That would be literal, not idiomatic. | غلط: ده هيبقى حرفي مش اصطلاحي.", "No. That is arrive, not come across. | غلط: دي وصول مش كم أكراس."], "n": 1, "i": 93, "h": ""}, {"t": "tf", "q": "The meaning of a phrasal verb can usually be worked out from its parts.<br>معنى الفعل المركب عادة ممكن يتطلّع من أجزائه.", "ans": false, "why": "False. They are idiomatic: come down on has nothing to do with coming or down. | غلط. هما اصطلاحيين: كم داون أون مالهاش علاقة بالمجيء أو النزول.", "ex": ["Correct. | صح.", "Wrong. Each one is learned as a single item. | غلط: كل واحد بيتحفظ كعنصر واحد."], "n": 1, "i": 94, "h": ""}, {"t": "mc", "q": "Which sentence is correct?<br>أنهي جملة صح؟", "opts": ["Madison looked it up in the phone book. | ماديسون دوّرت عليه في دليل التليفون.", "Madison looked up it in the phone book. | ماديسون دوّرت عليه بالترتيب التاني.", "Madison up looked it in the phone book. | ترتيب تالت."], "ans": 0, "why": "When the object is a pronoun, it must go between the verb and the particle. | لما المفعول ضمير، لازم ييجي بين الفعل والجسيم.", "ex": ["Correct. | صح.", "No. A pronoun cannot follow the particle. | غلط: الضمير مابيقدرش ييجي بعد الجسيم.", "No. The particle cannot lead the verb. | غلط: الجسيم مابيقودش الفعل."], "n": 1, "i": 95, "h": ""}, {"t": "mc", "q": "The baby woke up early. What kind of phrasal verb is wake up?<br>البيبي صحي بدري. فعل الاستيقاظ ده أنهي نوع؟", "opts": ["intransitive and inseparable | لازم وغير قابل للفصل", "transitive and separable | متعدّي وقابل للفصل", "transitive and inseparable | متعدّي وغير قابل للفصل"], "ans": 0, "why": "Wake up takes no object, so it is intransitive, and intransitive phrasal verbs cannot be separated. | صحى مابياخدش مفعول، فهو لازم، والأفعال اللازمة مابتتفصلش.", "ex": ["Correct. | صح.", "No. There is no object here. | غلط: مفيش مفعول هنا.", "No. It cannot take an object. | غلط: مابيقدرش ياخد مفعول."], "n": 1, "i": 96, "h": ""}, {"t": "mc", "q": "Which is one of the teaching traps?<br>أنهي واحدة من مصايد التعليم؟", "opts": ["giving a random list of phrasal verbs to memorise | إعطاء قائمة عشوائية من الأفعال المركبة للحفظ", "teaching them inside an everyday topic | تعليمهم جوه موضوع يومي", "using cartoons to illustrate them | استخدام الكرتون لتوضيحهم"], "ans": 0, "why": "Random learning does not stick; learners need meaningful language in context. | التعلّم العشوائي مابيثبتش؛ المتعلمين محتاجين لغة ذات معنى في سياق.", "ex": ["Correct. | صح.", "No. Everyday topics are the recommended way. | غلط: المواضيع اليومية هي الطريقة الموصى بيها.", "No. Visuals are a good technique. | غلط: البصريات تقنية كويسة."], "n": 1, "i": 97, "h": ""}, {"t": "mc", "q": "What is the key to teaching phrasal verbs well?<br>إيه مفتاح تعليم الأفعال المركبة كويس؟", "opts": ["an everyday topic that applies to all students, like making a sandwich | موضوع يومي بينطبق على كل الطلبة، زي عمل ساندويتش", "learning a hundred verbs before the next meeting | حفظ مية فعل قبل الحصة الجاية", "covering every combination of one verb in one session | تغطية كل تركيبات فعل واحد في جلسة واحدة"], "ans": 0, "why": "A shared everyday context brings out related phrasal verbs students will actually use. | السياق اليومي المشترك بيطلّع أفعال مركبة مترابطة الطلبة فعلًا هيستخدموها.", "ex": ["Correct. | صح.", "No. That is trap one. | غلط: دي المصيدة الأولى.", "No. That is trap five. | غلط: دي المصيدة الخامسة."], "n": 1, "i": 98, "h": ""}, {"t": "tf", "q": "Phrasal verbs exist only in English.<br>الأفعال المركبة موجودة بس في الإنجليزي.", "ans": false, "why": "False. Many languages have similar composite verbs; German and Dutch separable prefix verbs work similarly. | غلط. لغات كتير عندها أفعال مركبة مشابهة؛ أفعال البادئة القابلة للفصل في الألماني والهولندي بتشتغل بنفس الشكل.", "ex": ["Correct. | صح.", "Wrong. They appear in many languages. | غلط: بيظهروا في لغات كتير."], "n": 1, "i": 99, "h": ""}, {"t": "recall", "q": "Give four phrasal verbs from the verb come, with their meanings.<br>ادّي أربع أفعال مركبة من فعل الكوم، بمعانيهم.", "a": "Any four of: come across (find), come apart (break up), come up with (think of), come about (happen), come back to (remember), come around (change mind), come down on (scold), come down with (be ill), come forward (contact willingly), come from (hail from).<br>أي أربعة من: يجي على حاجة بالصدفة (يلاقي)، يتفكّك (يتكسر)، يطلع بفكرة (يفكّر)، يحصل، يفتكر، يغيّر رأيه، يتهجم (يعنّف)، يمرض، يتقدّم طوعًا، أصله من.", "n": 1, "i": 100, "h": ""}, {"t": "recall", "q": "Name the five traps in teaching phrasal verbs.<br>اذكر المصايد الخمسة في تعليم الأفعال المركبة.", "a": "1. Random lists to memorise. 2. Students picking verbs from the dictionary. 3. Identifying verbs in a random passage. 4. Uncontrolled brainstorming lists. 5. One verb with all its combinations in one session.<br>١. قوائم عشوائية للحفظ. ٢. الطلبة يختاروا أفعال من القاموس. ٣. تحديد الأفعال في قطعة عشوائية. ٤. قوائم عصف ذهني غير متحكم فيها. ٥. فعل واحد بكل تركيباته في جلسة واحدة.", "n": 1, "i": 101, "h": ""}, {"t": "write", "q": "Why are phrasal verbs hard for learners? Give three reasons. (3-4 sentences)<br>ليه الأفعال المركبة صعبة على المتعلمين؟ ادّي تلات أسباب. (٣-٤ جمل).", "key": "tefl-49:1", "a": "First, there are few clues to each construction's meaning, and supposed clues can mislead, like look in meaning to visit. Second, the same construction can have different meanings, like look at for a quick look or an investigation. Third, some constructions simply have to be learned, like the curtain went up. On top of that, the particle's position changes, and three-part verbs sound like nonsense even when the learner knows every word.<br>أول حاجة، مفيش قرائن كتير على معنى كل تركيبة، والقرائن المفترضة ممكن تضلّل، زي لوك إن بمعنى يزور. تاني حاجة، نفس التركيبة ممكن يبقى ليها معاني مختلفة، زي لوك آت لنظرة سريعة أو تحقيق. تالت حاجة، بعض التراكيب ببساطة لازم تتحفظ، زي الستارة طلعت. وفوق ده، مكان الجسيم بيتغيّر، والأفعال التلاتية بتبان كلام فاضي حتى لما المتعلم عارف كل كلمة.", "n": 1, "i": 102, "h": ""}, {"t": "write", "q": "Describe how you would teach phrasal verbs through the topic of making a sandwich. (4-5 sentences)<br>اوصف إزاي هتعلّم الأفعال المركبة من خلال موضوع عمل ساندويتش. (٤-٥ جمل).", "key": "tefl-49:2", "a": "I would use my teacher table as a kitchen top and plastic vegetables for demonstration. Then I would bring out the topic's phrasal verbs: peel off, fry up, slice off, cut up, cut off, chop up, boil away and boil over. I would explain them, get students to repeat the sounds and write the key items on the board. Then students would role play making a sandwich, explaining what they are doing. Finally I would reinforce with a gap-fill or a short piece on how to make the perfect sandwich, plus dictionary work and home practice with parents.<br>أنا هستخدم ترابيزة المدرس كسطح مطبخ وخضار بلاستيك للعرض. وبعدين هطلّع الأفعال المركبة بتاعة الموضوع: يقشّر، يقلي، يشرّح، يقطّع، يشيل الدهن، يفرم، يغلي ويفور. هشرحهم، هخلّي الطلبة يكرروا الأصوات وهكتب العناصر الأساسية على السبورة. وبعدين الطلبة هيلعبوا دور عمل ساندويتش، بيشرحوا بيعملوا إيه. وفي الآخر هثبّت بملء فراغات أو قطعة قصيرة عن إزاي تعمل الساندويتش المثالي، زائد شغل قاموس وتدريب بيتي مع الأهل.", "n": 1, "i": 103, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: prepositions and idioms.</div><div class=\"u\">الدرس الجاي: حروف الجر والتعبيرات الاصطلاحية.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 104}];</script>
