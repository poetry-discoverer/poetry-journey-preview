<script>window.LESSON_ID="tefl-13";window.STEPS=[{"t": "section", "h": "Why the jargon matters | ليه المصطلحات مهمة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Many new EFL teachers are afraid of teaching grammar. They can feel if a sentence is right or wrong, but they cannot explain why, because they do not know the jargon.</div><div class=\"u\">مدرسين EFL الجداد كتير بيخافوا من تدريس القواعد. بيحسوا لو الجملة صح أو غلط، بس ميعرفوش يشرحوا ليه، لأنهم مش عارفين المصطلحات.</div>", "n": 1, "i": 1, "a": "tefl-13-001", "x": "0f16360b"}, {"t": "learn", "h": "<div class=\"u\">If you cannot tell nouns from pronouns, or adjectives from adverbs, you are not alone. But grasping these key concepts is essential for EFL teaching.</div><div class=\"u\">لو مش قادر تفرّق بين الأسماء والضمائر، أو الصفات والظروف، انت مش لوحدك. بس فهم المفاهيم الأساسية دي ضروري لتدريس EFL.</div>", "n": 1, "i": 2, "a": "tefl-13-002", "x": "d114986a"}, {"t": "learn", "h": "<div class=\"u\">So here are the nine parts of speech: adjectives, adverbs, conjunctions, determiners, exclamations, nouns, prepositions, pronouns, and verbs.</div><div class=\"u\">فهنا أقسام الكلام التسعة: الصفات، الظروف، أدوات الربط، المحددات، التعجبات، الأسماء، حروف الجر، الضمائر، والأفعال.</div>", "n": 1, "i": 3, "a": "tefl-13-003", "x": "342564cf"}, {"t": "learn", "h": "<div class=\"u\">We will go deeper than the school definition, deeper than a verb is a doing word.</div><div class=\"u\">هنتعمق أكتر من التعريف المدرسي، أعمق من جملة الفعل هو كلمة فعل.</div>", "n": 1, "i": 4, "a": "tefl-13-004", "x": "88f25f66"}, {"t": "section", "h": "Adjectives, adverbs, conjunctions | الصفات والظروف وأدوات الربط", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">Adjective: describes a noun, a pronoun, or part of a sentence. Examples: tall, intelligent. Subcategories include the comparative, taller, and the superlative, most intelligent.</div><div class=\"u\">الصفة: بتوصف اسم أو ضمير أو جزء من جملة. أمثلة: tall وintelligent. من أقسامها: المقارنة زي taller، والتفضيل زي most intelligent.</div>", "n": 1, "i": 6, "a": "tefl-13-005", "x": "e723e9c1"}, {"t": "learn", "h": "<div class=\"u\">Adverb: describes a verb, an adjective, or another adverb, giving more information about how or when something happens. Examples: quickly, finally, sometimes, yesterday.</div><div class=\"u\">الظرف: بيوصف فعل أو صفة أو ظرف تاني، وبيدي معلومات زيادة عن إزاي أو إمتى الحاجة بتحصل. أمثلة: quickly وfinally وsometimes وyesterday.</div>", "n": 1, "i": 7, "a": "tefl-13-006", "x": "84adcbb6"}, {"t": "learn", "h": "<div class=\"u\">Adverb subcategories: frequency (sometimes), time (yesterday), manner (angrily), degree (completely), quantity (few), and attitude markers (apparently).</div><div class=\"u\">أقسام الظرف: التكرار زي sometimes، والوقت زي yesterday، والكيفية زي angrily، والدرجة زي completely، والكمية زي few، وعلامات الموقف زي apparently.</div>", "n": 1, "i": 8, "a": "tefl-13-007", "x": "006e46b8"}, {"t": "learn", "h": "<div class=\"u\">Conjunction: connects a clause, a sentence, or a word. Examples: but, and, so.</div><div class=\"u\">أداة الربط: بتوصل جملة أو جملتين أو كلمة. أمثلة: but وand وso.</div>", "n": 1, "i": 9, "a": "tefl-13-008", "x": "7b08e8a5"}, {"t": "learn", "h": "<div class=\"u\">Conjunction subcategories by function: addition (and), condition (since), contrast (yet), purpose (so that), reason (because), result (therefore), time (before).</div><div class=\"u\">أقسام أدوات الربط حسب الوظيفة: الإضافة زي and، والشرط زي since، والتباين زي yet، والغرض زي so that، والسبب زي because، والنتيجة زي therefore، والوقت زي before.</div>", "n": 1, "i": 10, "a": "tefl-13-009", "x": "13de165f"}, {"t": "section", "h": "Determiners, exclamations, nouns | المحددات والتعجبات والأسماء", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">Determiner: clarifies which noun we are referring to. Examples: this, my, both.</div><div class=\"u\">المحدد: بيوضح أنهي اسم بنقصد بالظبط. أمثلة: this وmy وboth.</div>", "n": 1, "i": 12, "a": "tefl-13-010", "x": "50038878"}, {"t": "learn", "h": "<div class=\"u\">Determiner subcategories: articles (the), demonstrative adjectives (that), possessive adjectives (his), and quantifiers (both).</div><div class=\"u\">أقسام المحددات: أدوات التعريف زي the، وأسماء الإشارة زي that، وصفات الملكية زي his، والمكمّمات زي both.</div>", "n": 1, "i": 13, "a": "tefl-13-011", "x": "91e31e9c"}, {"t": "learn", "h": "<div class=\"u\">Exclamation: expresses strong feeling, mostly in informal spoken language. Examples: ouch, wow, oh no. Subcategories include doubt (erm) and pain (ouch).</div><div class=\"u\">التعجب: بيعبّر عن شعور قوي، غالبًا في الكلام غير الرسمي. أمثلة: ouch وwow وoh no. من أقسامه: الشك زي erm، والألم زي ouch.</div>", "n": 1, "i": 14, "a": "tefl-13-012", "x": "303bfb80"}, {"t": "learn", "h": "<div class=\"u\">Noun: names things, people, places, and concepts. Examples: milk, parents, beauty.</div><div class=\"u\">الاسم: بيسمّي أشياء وناس وأماكن ومفاهيم. أمثلة: milk وparents وbeauty.</div>", "n": 1, "i": 15, "a": "tefl-13-013", "x": "2c1b6845"}, {"t": "learn", "h": "<div class=\"u\">Noun subcategories: abstract (hope), countable (people), uncountable (sugar), proper (Liverpool), and collective (army).</div><div class=\"u\">أقسام الاسم: المجرد زي hope، والمعدود زي people، وغير المعدود زي sugar، والعلم زي Liverpool، والجمعي زي army.</div>", "n": 1, "i": 16, "a": "tefl-13-014", "x": "28ce32c0"}, {"t": "section", "h": "Prepositions, pronouns, verbs | حروف الجر والضمائر والأفعال", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">Preposition: links a noun, noun phrase, or pronoun to another word or phrase. Examples: at, until, throughout.</div><div class=\"u\">حرف الجر: بيربط اسم أو عبارة اسمية أو ضمير بكلمة أو عبارة تانية. أمثلة: at وuntil وthroughout.</div>", "n": 1, "i": 18, "a": "tefl-13-015", "x": "f9415301"}, {"t": "learn", "h": "<div class=\"u\">Preposition subcategories by meaning: cause/effect (due to), contrast (unlike), dependent (wait for), movement (towards), place (under), time (during).</div><div class=\"u\">أقسام حروف الجر حسب المعنى: السبب والنتيجة زي due to، والتباين زي unlike، والتابعة زي wait for، والحركة زي towards، والمكان زي under، والوقت زي during.</div>", "n": 1, "i": 19, "a": "tefl-13-016", "x": "4356c4cb"}, {"t": "learn", "h": "<div class=\"u\">Pronoun: replaces or refers to a noun or noun phrase. Examples: I, him, ours, herself.</div><div class=\"u\">الضمير: بيحل محل اسم أو عبارة اسمية أو بيشاور عليها. أمثلة: I وhim وours وherself.</div>", "n": 1, "i": 20, "a": "tefl-13-017", "x": "490d31c4"}, {"t": "learn", "h": "<div class=\"u\">Pronoun subcategories: personal (subject pronouns like he, object pronouns like them), possessive (mine), reflexive (himself), and relative (who).</div><div class=\"u\">أقسام الضمير: الشخصية (ضمائر الفاعل زي he وضمائر المفعول زي them)، والملكية زي mine، والانعكاسية زي himself، والصلة زي who.</div>", "n": 1, "i": 21, "a": "tefl-13-018", "x": "483a27b9"}, {"t": "learn", "h": "<div class=\"u\">Verb: shows an action or a state. Examples: walk, believe, try. Subcategories: transitive and intransitive, which we look at next.</div><div class=\"u\">الفعل: بيبيّن حدث أو حالة. أمثلة: walk وbelieve وtry. أقسامه: المتعدي واللازم، وهنشوفهم دلوقتي.</div>", "n": 1, "i": 22, "a": "tefl-13-019", "x": "cc18be4c"}, {"t": "section", "h": "Transitive and intransitive verbs | الأفعال المتعدية واللازمة", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">A transitive verb takes a direct object: it transmits the action to an object. He sent the letter. The letter is the direct object; something is done to it.</div><div class=\"u\">الفعل المتعدي بياخد مفعول مباشر: بينقل الفعل لمفعول. He sent the letter. كلمة letter هي المفعول المباشر؛ الفعل حصل عليها.</div>", "n": 1, "i": 24, "a": "tefl-13-020", "x": "72ede65f"}, {"t": "learn", "h": "<div class=\"u\">She gave the lecture is the same: the lecture receives the action of gave.</div><div class=\"u\">She gave the lecture نفس الشيء: lecture مستقبلة فعل gave.</div>", "n": 1, "i": 25, "a": "tefl-13-021", "x": "a412198a"}, {"t": "learn", "h": "<div class=\"u\">A transitive verb can also have an indirect object before the direct object. It tells us to whom or for whom the action is done, without the words to or for.</div><div class=\"u\">الفعل المتعدي ممكن ياخد كمان مفعول غير مباشر قبل المباشر. بيقول لمن أو لصالح من الفعل اتعمل، من غير كلمات to أو for.</div>", "n": 1, "i": 26, "a": "tefl-13-022", "x": "5e73ada9"}, {"t": "learn", "h": "<div class=\"u\">He sent Robert the letter. The letter is the direct object. Robert is the indirect object: the person the letter was sent to.</div><div class=\"u\">He sent Robert the letter. letter مفعول مباشر. Robert مفعول غير مباشر: الشخص اللي الخطاب اتبعتله.</div>", "n": 1, "i": 27, "a": "tefl-13-023", "x": "f67e8f9f"}, {"t": "learn", "h": "<div class=\"u\">She gave her class the lecture. Same pattern: lecture is direct, class is indirect.</div><div class=\"u\">She gave her class the lecture. نفس النمط: lecture مباشر، وclass غير مباشر.</div>", "n": 1, "i": 28, "a": "tefl-13-024", "x": "ce8eeefe"}, {"t": "learn", "h": "<div class=\"u\">When these objects are pronouns, they must be in the object form: him, her, us, them.</div><div class=\"u\">ولما المفعولات دي تكون ضمائر، لازم تكون في صيغة المفعول: him وher وus وthem.</div>", "n": 1, "i": 29, "a": "tefl-13-025", "x": "881c59c4"}, {"t": "learn", "h": "<div class=\"u\">An intransitive verb never takes an object. She sleeps too much. He complains frequently. Nothing receives the action.</div><div class=\"u\">الفعل اللازم مبياخدش مفعول أبدًا. She sleeps too much. He complains frequently. مفيش حاجة بتستقبل الفعل.</div>", "n": 1, "i": 30, "a": "tefl-13-026", "x": "f164e832"}, {"t": "learn", "h": "<div class=\"u\">Many verbs can be both. She sings every day: no object, intransitive. She sings rock and roll tunes: the tunes receive the action, transitive.</div><div class=\"u\">أفعال كتير ممكن تكون الاتنين. She sings every day: مفيش مفعول، لازم. She sings rock and roll tunes: الأغاني مستقبلة الفعل، متعدي.</div>", "n": 1, "i": 31, "a": "tefl-13-027", "x": "95122086"}, {"t": "section", "h": "Gerunds | المصادر بـ-ing", "n": 1, "i": 32}, {"t": "learn", "h": "<div class=\"u\">Gerunds are words formed from verbs but acting as nouns. You can spot them: verb plus ing, doing the job of a noun.</div><div class=\"u\">المصادر بـ-ing كلمات متكونة من أفعال بس شغالة كأسماء. تعرفها بسهولة: فعل زائد ing، وبيقوم بعمل الاسم.</div>", "n": 1, "i": 33, "a": "tefl-13-028", "x": "355afedc"}, {"t": "learn", "h": "<div class=\"u\">I love shopping! Shop is a verb, but shopping is a verb with -ing acting as a noun: it is the subject-like thing that I love.</div><div class=\"u\">I love shopping! كلمة shop فعل، لكن shopping فعل مضاف ليه -ing وشغال كاسم: هو الحاجة اللي أنا بحبها.</div>", "n": 1, "i": 34, "a": "tefl-13-029", "x": "f66e9a56"}, {"t": "section", "h": "Practice and root words | تدريب والكلمات الجذرية", "n": 1, "i": 35}, {"t": "learn", "h": "<div class=\"u\">Practice: sort these words into the nine categories. Adverbs: sometimes, quickly. Conjunctions: but, and, either.</div><div class=\"u\">تدريب: صنّف الكلمات دي في الفئات التسعة. الظروف: sometimes وquickly. أدوات الربط: but وand وeither.</div>", "n": 1, "i": 36, "a": "tefl-13-030", "x": "f976a64e"}, {"t": "learn", "h": "<div class=\"u\">Determiners: that, her. Exclamation: ow! Nouns: table, health. Preposition: on.</div><div class=\"u\">المحددات: that وher. التعجب: ow!. الأسماء: table وhealth. حرف الجر: on.</div>", "n": 1, "i": 37, "a": "tefl-13-031", "x": "7b2b9117"}, {"t": "learn", "h": "<div class=\"u\">Pronoun: us. Verbs: go, walk. Adjectives: huge, beautiful, fastest.</div><div class=\"u\">الضمير: us. الأفعال: go وwalk. الصفات: huge وbeautiful وfastest.</div>", "n": 1, "i": 38, "a": "tefl-13-032", "x": "0e2cc947"}, {"t": "learn", "h": "<div class=\"u\">Now root words. Word trees or maps help students see parts of speech and grow vocabulary.</div><div class=\"u\">دلوقتي الكلمات الجذرية. أشجار أو خرايط الكلمات بتساعد الطلاب يشوفوا أقسام الكلام ويكبّروا مفرداتهم.</div>", "n": 1, "i": 39, "a": "tefl-13-033", "x": "b1d09750"}, {"t": "learn", "h": "<div class=\"u\">Start with a root word, then add prefixes like un- and mis-, or suffixes like -ly and -ful.</div><div class=\"u\">ابدأ بكلمة جذر، وبعدين ضيف سوابق زي un- وmis-، أو لواحق زي -ly و-ful.</div>", "n": 1, "i": 40, "a": "tefl-13-034", "x": "5287fc98"}, {"t": "learn", "h": "<div class=\"u\">For example, from the root believe you can build believer, belief, believable, unbelievable, unbelievably, disbelieve.</div><div class=\"u\">مثال، من الجذر believe تقدر تبني believer وbelief وbelievable وunbelievable وunbelievably وdisbelieve.</div>", "n": 1, "i": 41, "a": "tefl-13-035", "x": "fda318af"}, {"t": "learn", "h": "<div class=\"u\">Try it yourself with the root understand before you read on. How many words can you build?</div><div class=\"u\">جرب بنفسك مع الجذر understand قبل ما تكمل قراية. تقدر تبني كام كلمة؟</div>", "n": 1, "i": 42, "a": "tefl-13-036", "x": "1230a3c4"}, {"t": "learn", "h": "<div class=\"u\">Here are some answers: understanding, understandable, understandably, misunderstand, misunderstanding, pre-understood.</div><div class=\"u\">دي شوية إجابات: understanding وunderstandable وunderstandably وmisunderstand وmisunderstanding وpre-understood.</div>", "n": 1, "i": 43, "a": "tefl-13-037", "x": "eb7101c3"}, {"t": "section", "h": "Unit 2 review questions | أسئلة مراجعة الوحدة التانية", "n": 1, "i": 44}, {"t": "learn", "h": "<div class=\"u\">The unit's own questions. First: in He thought the test was really difficult even though he had studied so hard, which word has a different function: really, difficult, or so?</div><div class=\"u\">أسئلة الوحدة نفسها. أولًا: في He thought the test was really difficult even though he had studied so hard، أنهي كلمة وظيفتها مختلفة: really ولا difficult ولا so؟</div>", "n": 1, "i": 45, "a": "tefl-13-038", "x": "d399fad3"}, {"t": "learn", "h": "<div class=\"u\">Answer: difficult. Really and so are adverbs; difficult is an adjective describing the test.</div><div class=\"u\">الإجابة: difficult. really وso ظروف؛ أما difficult صفة بتوصف الامتحان.</div>", "n": 1, "i": 46, "a": "tefl-13-039", "x": "ebf1bc52"}, {"t": "learn", "h": "<div class=\"u\">Second: from the root satisfy, which is NOT an adjective: satisfied, satisfactory, satisfactorily, satisfying? Answer: satisfactorily. It is an adverb; the others are adjectives.</div><div class=\"u\">تاني: من الجذر satisfy، أنهي واحدة مش صفة: satisfied وsatisfactory وsatisfactorily وsatisfying؟ الإجابة: satisfactorily. دي ظرف؛ الباقي صفات.</div>", "n": 1, "i": 47, "a": "tefl-13-040", "x": "d7a8cbc9"}, {"t": "learn", "h": "<div class=\"u\">Third: in His incredible bravery was rewarded with the badge of honour, what part of speech is bravery? Answer: a noun. It names a concept.</div><div class=\"u\">تالت: في His incredible bravery was rewarded with the badge of honour، كلمة bravery قسمها إيه؟ الإجابة: اسم. بتسمّي مفهوم.</div>", "n": 1, "i": 48, "a": "tefl-13-041", "x": "0d6f4212"}, {"t": "learn", "h": "<div class=\"u\">Fourth: which can an adverb NOT modify: a noun, an adjective, a verb, or another adverb? Answer: a noun. Adjectives modify nouns; adverbs modify the rest.</div><div class=\"u\">رابع: الظرف ميقدرش يوصف إيه: اسم، صفة، فعل، ولا ظرف تاني؟ الإجابة: الاسم. الصفات هي اللي بتوصف الأسماء؛ الظروف بتوصف الباقي.</div>", "n": 1, "i": 49, "a": "tefl-13-042", "x": "88ea64d6"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">Part of speech: the grammatical category of a word, like noun, verb, or adjective. English has nine main ones.</div><div class=\"u\">قسم الكلام: الفئة النحوية للكلمة، زي اسم أو فعل أو صفة. الإنجليزية فيها تسع فئات رئيسية.</div>", "n": 1, "i": 51, "a": "tefl-13-043", "x": "ca8777ad"}, {"t": "learn", "h": "<div class=\"u\">Transitive verb: a verb that takes a direct object, which receives the action, like He sent the letter.</div><div class=\"u\">الفعل المتعدي: فعل بياخد مفعول مباشر بيستقبل الفعل، زي He sent the letter.</div>", "n": 1, "i": 52, "a": "tefl-13-044", "x": "a2b36fd2"}, {"t": "learn", "h": "<div class=\"u\">Intransitive verb: a verb that never takes an object, like She sleeps too much.</div><div class=\"u\">الفعل اللازم: فعل مبياخدش مفعول أبدًا، زي She sleeps too much.</div>", "n": 1, "i": 53, "a": "tefl-13-045", "x": "99e29600"}, {"t": "learn", "h": "<div class=\"u\">Direct object: the thing that directly receives the action of the verb.</div><div class=\"u\">المفعول المباشر: الحاجة اللي بتستقبل فعل الفعل مباشرة.</div>", "n": 1, "i": 54, "a": "tefl-13-046", "x": "ddff8c25"}, {"t": "learn", "h": "<div class=\"u\">Indirect object: tells to whom or for whom the action is done, coming before the direct object, like Robert in He sent Robert the letter.</div><div class=\"u\">المفعول غير المباشر: بيقول لمن أو لصالح من الفعل اتعمل، وبييجي قبل المباشر، زي Robert في He sent Robert the letter.</div>", "n": 1, "i": 55, "a": "tefl-13-047", "x": "c2605017"}, {"t": "learn", "h": "<div class=\"u\">Root word: the base word you build other words from, like believe or understand.</div><div class=\"u\">الكلمة الجذر: الكلمة الأساسية اللي بتبني منها كلمات تانية، زي believe أو understand.</div>", "n": 1, "i": 56, "a": "tefl-13-048", "x": "2a95690d"}, {"t": "learn", "h": "<div class=\"u\">Prefix: letters added to the start of a word that change its meaning, like un- and mis-.</div><div class=\"u\">السابقة: حروف بتتحط في أول الكلمة وبتغير معناها، زي un- وmis-.</div>", "n": 1, "i": 57, "a": "tefl-13-049", "x": "6353fff7"}, {"t": "learn", "h": "<div class=\"u\">Suffix: letters added to the end of a word that change its form or category, like -ly and -ful.</div><div class=\"u\">اللاحقة: حروف بتتحط في آخر الكلمة وبتغير شكلها أو فئتها، زي -ly و-ful.</div>", "n": 1, "i": 58, "a": "tefl-13-050", "x": "b8238bd7"}, {"t": "learn", "h": "<div class=\"u\">Countable noun: a noun you can count, like people or chairs.</div><div class=\"u\">الاسم المعدود: اسم تقدر تعدّه، زي people أو chairs.</div>", "n": 1, "i": 59, "a": "tefl-13-051", "x": "e0321c90"}, {"t": "learn", "h": "<div class=\"u\">Uncountable noun: a noun you cannot count, like sugar or milk.</div><div class=\"u\">الاسم غير المعدود: اسم متقدرش تعدّه، زي sugar أو milk.</div>", "n": 1, "i": 60, "a": "tefl-13-052", "x": "713356fb"}, {"t": "learn", "h": "<div class=\"u\">Abstract noun: a noun that names an idea or feeling, not a physical thing, like hope or beauty.</div><div class=\"u\">الاسم المجرد: اسم بيسمّي فكرة أو شعور، مش حاجة ملموسة، زي hope أو beauty.</div>", "n": 1, "i": 61, "a": "tefl-13-053", "x": "52a88474"}, {"t": "learn", "h": "<div class=\"u\">Attitude marker: an adverb that shows the speaker's attitude, like apparently.</div><div class=\"u\">علامة الموقف: ظرف بيبيّن موقف المتكلم، زي apparently.</div>", "n": 1, "i": 62, "a": "tefl-13-054", "x": "90f49d39"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 63}, {"t": "learn", "h": "<div class=\"u\">The nine parts of speech: adjective, adverb, conjunction, determiner, exclamation, noun, preposition, pronoun, verb. Each has its function and subcategories.</div><div class=\"u\">أقسام الكلام التسعة: الصفة، الظرف، أداة الربط، المحدد، التعجب، الاسم، حرف الجر، الضمير، الفعل. كل واحد ليه وظيفته وأقسامه.</div>", "n": 1, "i": 64, "a": "tefl-13-055", "x": "5bbbebb9"}, {"t": "learn", "h": "<div class=\"u\">Transitive verbs take a direct object and can add an indirect object before it. Intransitive verbs never take an object. Many verbs can be both.</div><div class=\"u\">الأفعال المتعدية بتاخد مفعول مباشر وممكن تضيف غير مباشر قبله. الأفعال اللازمة مبتاخدش مفعول أبدًا. وأفعال كتير ممكن تكون الاتنين.</div>", "n": 1, "i": 65, "a": "tefl-13-056", "x": "2cd7677f"}, {"t": "learn", "h": "<div class=\"u\">Gerunds are verb plus ing acting as nouns: I love shopping.</div><div class=\"u\">المصادر بـ-ing أفعال مضاف ليها ing وشغالة كأسماء: I love shopping.</div>", "n": 1, "i": 66, "a": "tefl-13-057", "x": "e240cb95"}, {"t": "learn", "h": "<div class=\"u\">Root-word trees grow vocabulary: believe gives believable, unbelievable, disbelieve; understand gives understanding, misunderstand, and more.</div><div class=\"u\">أشجار الكلمات الجذرية بتكبّر المفردات: believe بتدينا believable وunbelievable وdisbelieve؛ وunderstand بتدينا understanding وmisunderstand وأكتر.</div>", "n": 1, "i": 67, "a": "tefl-13-058", "x": "35d29c09"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 68}, {"t": "mc", "q": "In He thought the test was really difficult, which word is the adjective?<br>في He thought the test was really difficult، أنهي كلمة هي الصفة؟", "opts": ["difficult | difficult", "really | really", "thought | thought"], "ans": 0, "why": "Difficult describes the test. Really is an adverb; thought is a verb. | difficult بتوصف الامتحان. really ظرف؛ وthought فعل.", "ex": ["Correct. | صح.", "No. Really is an adverb of degree. | غلط: really ظرف درجة.", "No. Thought is a verb. | غلط: thought فعل."], "n": 1, "i": 69, "h": ""}, {"t": "mc", "q": "From the root satisfy, which word is NOT an adjective?<br>من الجذر satisfy، أنهي كلمة مش صفة؟", "opts": ["satisfactorily | satisfactorily", "satisfied | satisfied", "satisfying | satisfying", "satisfactory | satisfactory"], "ans": 0, "why": "Satisfactorily is an adverb. The other three are adjectives. | satisfactorily ظرف. التلاتة التانيين صفات.", "ex": ["Correct. | صح.", "No. That is an adjective. | غلط: دي صفة.", "No. That is an adjective. | غلط: دي صفة.", "No. That is an adjective. | غلط: دي صفة."], "n": 1, "i": 70, "h": ""}, {"t": "mc", "q": "In His incredible bravery was rewarded, what part of speech is bravery?<br>في His incredible bravery was rewarded، كلمة bravery قسمها إيه؟", "opts": ["noun | اسم", "adjective | صفة", "adverb | ظرف", "verb | فعل"], "ans": 0, "why": "Bravery names a concept, so it is an abstract noun. Incredible is the adjective describing it. | bravery بتسمّي مفهوم، فهي اسم مجرد. incredible هي الصفة اللي بتوصفها.", "ex": ["Correct. | صح.", "No. The adjective here is incredible. | غلط: الصفة هنا هي incredible.", "No. | غلط.", "No. | غلط."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "An adverb canNOT modify:<br>الظرف ميقدرش يوصف:", "opts": ["a noun | اسم", "an adjective | صفة", "a verb | فعل", "another adverb | ظرف تاني"], "ans": 0, "why": "Nouns are modified by adjectives. Adverbs modify verbs, adjectives, and other adverbs. | الأسماء بتوصفها الصفات. الظروف بتوصف الأفعال والصفات والظروف التانية.", "ex": ["Correct. | صح.", "No. Adverbs can modify adjectives, like really difficult. | غلط: الظروف بتوصف الصفات، زي really difficult.", "No. Adverbs often modify verbs. | غلط: الظروف كتير بتوصف الأفعال.", "No. An adverb can modify another adverb. | غلط: الظرف يقدر يوصف ظرف تاني."], "n": 1, "i": 72, "h": ""}, {"t": "tf", "q": "An intransitive verb never takes an object.<br>الفعل اللازم مبياخدش مفعول أبدًا.", "ans": true, "why": "That is the definition. She sleeps too much: nothing receives the action. | ده التعريف. She sleeps too much: مفيش حاجة بتستقبل الفعل.", "ex": ["Correct. | صح.", "Wrong. That is exactly what intransitive means. | غلط: ده بالظبط معنى لازم."], "n": 1, "i": 73, "h": ""}, {"t": "mc", "q": "In She gave her class the lecture, the indirect object is:<br>في She gave her class the lecture، المفعول غير المباشر هو:", "opts": ["her class | her class", "the lecture | the lecture", "she | she"], "ans": 0, "why": "The lecture is the direct object that was given; her class is who it was given to. | lecture هو المفعول المباشر اللي اتقدّم؛ her class هو اللي اتقدمله.", "ex": ["Correct. | صح.", "No. The lecture is the direct object. | غلط: lecture هو المفعول المباشر.", "No. She is the subject. | غلط: she هو الفاعل."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "In I love shopping, the word shopping is:<br>في I love shopping، كلمة shopping هي:", "opts": ["a gerund, a verb with -ing acting as a noun | مصدر بـ-ing: فعل مضاف ليه ing شغال كاسم", "a present continuous verb | فعل مضارع مستمر", "an adjective | صفة"], "ans": 0, "why": "Shopping is verb plus -ing doing the job of a noun here: the thing I love. | shopping فعل زائد -ing بيقوم بعمل الاسم هنا: الحاجة اللي بحبها.", "ex": ["Correct. | صح.", "No. There is no be, so it is not continuous. | غلط: مفيش be، فمش مستمر.", "No. | غلط."], "n": 1, "i": 75, "h": ""}, {"t": "mc", "q": "The word ow! belongs to which part of speech?<br>كلمة ow! بتنتمي لأنهي قسم كلام؟", "opts": ["exclamation | تعجب", "adverb | ظرف", "interjection is not listed; it is a verb | فعل"], "ans": 0, "why": "Exclamations express strong feeling in informal speech, like ouch, wow, oh no. | التعجبات بتعبّر عن شعور قوي في الكلام غير الرسمي، زي ouch وwow وoh no.", "ex": ["Correct. | صح.", "No. | غلط.", "No. It expresses pain, it does not show an action. | غلط: بتعبّر عن ألم، مش بتبيّن فعل."], "n": 1, "i": 76, "h": ""}, {"t": "tf", "q": "In She sings every day, the verb sings is transitive.<br>في She sings every day، الفعل sings متعدي.", "ans": false, "why": "There is no object, so here it is intransitive. In She sings rock and roll tunes, it is transitive. | مفيش مفعول، فهنا هو لازم. في She sings rock and roll tunes، يبقى متعدي.", "ex": ["Wrong. No object means intransitive here. | غلط: مفيش مفعول يبقى لازم هنا.", "Correct. | صح."], "n": 1, "i": 77, "h": ""}, {"t": "mc", "q": "From the root understand, which of these can you build?<br>من الجذر understand، تقدر تبني أنهي واحدة؟", "opts": ["misunderstanding | misunderstanding", "underfully | underfully", "understandful | understandful"], "ans": 0, "why": "The prefix mis- plus the root plus the suffix -ing gives misunderstanding. The other two are not real words. | السابقة mis- زائد الجذر زائد اللاحقة -ing بتدينا misunderstanding. الاتنين التانيين مش كلمات حقيقية.", "ex": ["Correct. | صح.", "No. Not a real word. | غلط: مش كلمة حقيقية.", "No. Not a real word. | غلط: مش كلمة حقيقية."], "n": 1, "i": 78, "h": ""}, {"t": "recall", "q": "Name the nine parts of speech.<br>اذكر أقسام الكلام التسعة.", "a": "Adjective, adverb, conjunction, determiner, exclamation, noun, preposition, pronoun, verb.<br>الصفة، الظرف، أداة الربط، المحدد، التعجب، الاسم، حرف الجر، الضمير، الفعل.", "n": 1, "i": 79, "h": ""}, {"t": "recall", "q": "Build four words from the root understand.<br>ابني ٤ كلمات من الجذر understand.", "a": "Any 4: understanding, understandable, understandably, misunderstand, misunderstanding, pre-understood.<br>أي ٤: understanding وunderstandable وunderstandably وmisunderstand وmisunderstanding وpre-understood.", "n": 1, "i": 80, "h": ""}, {"t": "write", "q": "Explain the difference between transitive and intransitive verbs, with one example of each (3-4 sentences).<br>اشرح الفرق بين الفعل المتعدي واللازم، مع مثال لكل واحد (٣-٤ جمل).", "key": "tefl-13:1", "a": "A transitive verb takes a direct object that receives the action, as in He sent the letter. It can also take an indirect object telling to whom or for whom, as in He sent Robert the letter. An intransitive verb never takes an object, as in She sleeps too much. Many verbs can be both: sings is intransitive in She sings every day and transitive in She sings rock tunes.<br>الفعل المتعدي بياخد مفعول مباشر بيستقبل الفعل، زي He sent the letter. وممكن ياخد كمان مفعول غير مباشر بيقول لمن أو لصالح من، زي He sent Robert the letter. الفعل اللازم مبياخدش مفعول أبدًا، زي She sleeps too much. وأفعال كتير ممكن تكون الاتنين: sings لازمة في She sings every day ومتعدية في She sings rock tunes.", "n": 1, "i": 81, "h": ""}, {"t": "write", "q": "Explain what a gerund is, with an example (2-3 sentences).<br>اشرح يعني إيه مصدر بـ-ing، مع مثال (٢-٣ جمل).", "key": "tefl-13:2", "a": "A gerund is a verb with -ing that acts as a noun. In I love shopping, the word shopping names the thing I love, so it works as a noun, not a verb. You can spot gerunds because they are verb plus -ing doing a noun's job.<br>المصدر بـ-ing هو فعل مضاف ليه -ing بيشتغل كاسم. في I love shopping، كلمة shopping بتسمّي الحاجة اللي بحبها، فبتشتغل كاسم مش فعل. تعرف المصادر لأنها فعل زائد -ing بيعمل عمل الاسم.", "n": 1, "i": 82, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: sentence structure, subjects and predicates, and the basic English sentence patterns.</div><div class=\"u\">الدرس الجاي: تركيب الجملة، المبتدأ والخبر، وأنماط الجملة الإنجليزية الأساسية.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 83}];</script>
