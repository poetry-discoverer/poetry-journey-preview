<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٢٢</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-22";window.STEPS=[{"t": "section", "h": "The TBL concept | فكرة TBL", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Task-based Learning is a method that focuses on learner autonomy and fluency, through students doing real-life or problem-solving activities.</div><div class=\"u\">التعلم بالمهام طريقة بتركّز على استقلالية المتعلم والطلاقة، من خلال إن الطلبة يعملوا أنشطة من الحياة الحقيقية أو حل مشاكل.</div>", "n": 1, "i": 1, "a": "tefl-22-001", "x": "4730481e"}, {"t": "learn", "h": "<div class=\"u\">Nunan describes it as teaching and learning a language by using the language to accomplish open-ended tasks.</div><div class=\"u\">نونان بيوصفها إنها تدريس وتعلم اللغة عن طريق استخدام اللغة في إنجاز مهام مفتوحة النهايات.</div>", "n": 1, "i": 2, "a": "tefl-22-002", "x": "a761ffb7"}, {"t": "learn", "h": "<div class=\"u\">Learners are given a problem or objective to accomplish, but they keep some freedom in how they approach it.</div><div class=\"u\">المتعلمين بياخدوا مشكلة أو هدف ينجزوه، بس بيفضل عندهم حرية في طريقة التعامل معاه.</div>", "n": 1, "i": 3, "a": "tefl-22-003", "x": "f02d68ff"}, {"t": "learn", "h": "<div class=\"u\">Usually there is an introduction to the theme first, then a quite open task like plan a birthday party, or a murder mystery style activity.</div><div class=\"u\">عادة في مقدمة عن الموضوع الأول، وبعدين مهمة مفتوحة زي خطط لحفلة عيد ميلاد، أو نشاط بأسلوب لغز جريمة قتل.</div>", "n": 1, "i": 4, "a": "tefl-22-004", "x": "95e66e84"}, {"t": "learn", "h": "<div class=\"u\">Afterwards, learners give feedback through a report or by reviewing the language used for the task.</div><div class=\"u\">بعد كده، المتعلمين بيعملوا مراجعة عن طريق تقرير أو بمراجعة اللغة المستخدمة في المهمة.</div>", "n": 1, "i": 5, "a": "tefl-22-005", "x": "8d208550"}, {"t": "learn", "h": "<div class=\"u\">Five tips for tasks, from the Asian ESL journal. One: the purpose of the task must be clearly stated.</div><div class=\"u\">خمس نصايح للمهام، من Asian ESL journal. واحد: هدف المهمة لازم يكون معلن بوضوح.</div>", "n": 1, "i": 6, "a": "tefl-22-006", "x": "caa3b8d0"}, {"t": "learn", "h": "<div class=\"u\">Two: the task must be suitable for the level of the students.</div><div class=\"u\">اتنين: المهمة لازم تكون مناسبة لمستوى الطلبة.</div>", "n": 1, "i": 7, "a": "tefl-22-007", "x": "ca9d3f32"}, {"t": "learn", "h": "<div class=\"u\">Three: tasks must be interesting and motivating to the students.</div><div class=\"u\">تلاتة: المهام لازم تكون ممتعة ومحفّزة للطلبة.</div>", "n": 1, "i": 8, "a": "tefl-22-008", "x": "dbb52492"}, {"t": "learn", "h": "<div class=\"u\">Four: the language that the task will produce must be predicted.</div><div class=\"u\">أربعة: اللغة اللي المهمة هتنتجها لازم تكون متوقعة مسبقًا.</div>", "n": 1, "i": 9, "a": "tefl-22-009", "x": "a503ff77"}, {"t": "learn", "h": "<div class=\"u\">Five: tasks should have variety and flexibility.</div><div class=\"u\">خمسة: المهام المفروض يكون فيها تنوع ومرونة.</div>", "n": 1, "i": 10, "a": "tefl-22-010", "x": "dc8005d4"}, {"t": "section", "h": "The five TBL stages | مراحل TBL الخمسة", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">Task-based Learning was pioneered by N. Prabhu, and it offers an alternative for language teachers.</div><div class=\"u\">التعلم بالمهام أسسه N. Prabhu، وبيقدّم بديل لمدرسي اللغة.</div>", "n": 1, "i": 12, "a": "tefl-22-011", "x": "b72c1e6e"}, {"t": "learn", "h": "<div class=\"u\">In a task-based lesson the teacher does not pre-determine what language will be studied.</div><div class=\"u\">في الدرس المبني على المهام المدرس مابيحدّدش مسبقًا أنهي لغة هتتدرّس.</div>", "n": 1, "i": 13, "a": "tefl-22-012", "x": "2cb09780"}, {"t": "learn", "h": "<div class=\"u\">The lesson is built around completing a central task, and the language studied is decided by what happens as students complete it.</div><div class=\"u\">الدرس مبني حوالين إنجاز مهمة مركزية، واللغة اللي بتتدرّس بيحددها اللي بيحصل أثناء ما الطلبة بيكمّلوها.</div>", "n": 1, "i": 14, "a": "tefl-22-013", "x": "2a335a51"}, {"t": "learn", "h": "<div class=\"u\">The lesson follows five stages: assignment, planning, reporting, analysis, practice.</div><div class=\"u\">الدرس بيتبع خمس مراحل: التكليف، التخطيط، التقرير، التحليل، التمرين.</div>", "n": 1, "i": 15, "a": "tefl-22-014", "x": "f084ff51"}, {"t": "learn", "h": "<div class=\"u\">Assignment: resources and instructions are given to the students.</div><div class=\"u\">التكليف: الموارد والتعليمات بتتعطى للطلبة.</div>", "n": 1, "i": 16, "a": "tefl-22-015", "x": "157d17cc"}, {"t": "learn", "h": "<div class=\"u\">Planning: students use the resources to complete their assignment.</div><div class=\"u\">التخطيط: الطلبة بيستخدموا الموارد عشان يكملوا تكليفهم.</div>", "n": 1, "i": 17, "a": "tefl-22-016", "x": "4314a256"}, {"t": "learn", "h": "<div class=\"u\">Reporting: results are reported orally, through a formal oral report before the class or conversational engagement.</div><div class=\"u\">التقرير: النتايج بتتقال شفوي، عن طريق تقرير شفوي رسمي قدام الكلاس أو تفاعل حواري.</div>", "n": 1, "i": 18, "a": "tefl-22-017", "x": "663327f0"}, {"t": "learn", "h": "<div class=\"u\">Analysis: the teacher evaluates the performance of tasks and highlights areas of interest.</div><div class=\"u\">التحليل: المدرس بيقيّم أداء المهام وبيسلّط الضوء على نقاط مهمة.</div>", "n": 1, "i": 19, "a": "tefl-22-018", "x": "84034afd"}, {"t": "learn", "h": "<div class=\"u\">Practice: by joining relevant, practical tasks, the student's confidence and proficiency in the new language grow.</div><div class=\"u\">التمرين: بالمشاركة في مهام عملية مناسبة، ثقة الطالب وكفاءته في اللغة الجديدة بتكبر.</div>", "n": 1, "i": 20, "a": "tefl-22-019", "x": "d9eae3ac"}, {"t": "learn", "h": "<div class=\"u\">In the pre-task, the teacher announces the material and tells students what they will have to do.</div><div class=\"u\">في ما قبل المهمة، المدرس بيعلن المادة وبيقول للطلبة هيعملوا إيه.</div>", "n": 1, "i": 21, "a": "tefl-22-020", "x": "a9dc8cce"}, {"t": "learn", "h": "<div class=\"u\">The teacher may prompt students to remember useful language, or play a recording of other students doing the task so they know exactly what to do.</div><div class=\"u\">المدرس ممكن يفتّكر الطلبة بلغة مفيدة، أو يشغّل تسجيل لطلبة تانيين بيعملوا المهمة عشان يعرفوا بالظبط هيعملوا إيه.</div>", "n": 1, "i": 22, "a": "tefl-22-021", "x": "9b74e5ee"}, {"t": "learn", "h": "<div class=\"u\">During the task, the teacher guides the students and praises them as they work, applying the language skills they have acquired.</div><div class=\"u\">أثناء المهمة، المدرس بيوجّه الطلبة ويمدحهم أثناء شغلهم، وهما بيطبّقوا مهارات اللغة اللي اكتسبوها.</div>", "n": 1, "i": 23, "a": "tefl-22-022", "x": "fa50ac7d"}, {"t": "learn", "h": "<div class=\"u\">In planning, groups create lists of everyday problems and the people, places, things and actions related to them, then prepare a written report.</div><div class=\"u\">في التخطيط، المجموعات بتعمل قوايم بمشاكل يومية والناس والأماكن والحاجات والأفعال المرتبطة بيها، وبعدين بيجهّزوا تقرير مكتوب.</div>", "n": 1, "i": 24, "a": "tefl-22-023", "x": "43a75bae"}, {"t": "learn", "h": "<div class=\"u\">In reporting, students report back to the class; the teacher advises on the order of reports and may compare other students' interpretations of the same task.</div><div class=\"u\">في التقرير، الطلبة بيعرضوا على الكلاس؛ المدرس بينصح في ترتيب التقارير وممكن يقارن تفسيرات طلبة تانيين لنفس المهمة.</div>", "n": 1, "i": 25, "a": "tefl-22-024", "x": "3dafce04"}, {"t": "learn", "h": "<div class=\"u\">In analysis, the teacher highlights relevant parts of the recording's text and may ask students to identify remarkable features in it.</div><div class=\"u\">في التحليل، المدرس بيسلّط الضوء على أجزاء مناسبة من نص التسجيل وممكن يطلب من الطلبة يحدّدوا سمات ملحوظة فيه.</div>", "n": 1, "i": 26, "a": "tefl-22-025", "x": "3c57d8af"}, {"t": "learn", "h": "<div class=\"u\">In practice, the teacher picks language areas to focus on based on students' needs and what came out of the main task and reporting.</div><div class=\"u\">في التمرين، المدرس بيختار مناطق لغة يركّز عليها حسب احتياجات الطلبة واللي طلع من المهمة والتقرير.</div>", "n": 1, "i": 27, "a": "tefl-22-026", "x": "5b9b00e7"}, {"t": "learn", "h": "<div class=\"u\">Students then do practice activities to grow their confidence, while noting useful language.</div><div class=\"u\">وبعدين الطلبة بيعملوا أنشطة تمرين عشان تكبر ثقتهم، وبيسجّلوا لغة مفيدة.</div>", "n": 1, "i": 28, "a": "tefl-22-027", "x": "1184508e"}, {"t": "section", "h": "Why TBL works | ليه TBL بتشتغل", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Teachers who use TBL provide engaging learning opportunities that are practical for their students.</div><div class=\"u\">المدرسين اللي بيستخدموا TBL بيوفّروا فرص تعلم جذابة وعملية لطلبتهم.</div>", "n": 1, "i": 30, "a": "tefl-22-028", "x": "4bd4bcfb"}, {"t": "learn", "h": "<div class=\"u\">Why TBL works. One: freedom in applying language to practical tasks that are relevant to the student.</div><div class=\"u\">ليه TBL بتشتغل. واحد: حرية في تطبيق اللغة على مهام عملية مرتبطة بالطالب.</div>", "n": 1, "i": 31, "a": "tefl-22-029", "x": "fe97ff15"}, {"t": "learn", "h": "<div class=\"u\">Two: natural language patterns develop within the context of the tasks.</div><div class=\"u\">اتنين: أنماط لغة طبيعية بتتطور جوه سياق المهام.</div>", "n": 1, "i": 32, "a": "tefl-22-030", "x": "f133b3cc"}, {"t": "learn", "h": "<div class=\"u\">Three: exposure to a broader vocabulary results, including phrases and figures of speech.</div><div class=\"u\">تلاتة: تعرّض لمفردات أوسع بيحصل، من ضمنها عبارات وتعابير مجازية.</div>", "n": 1, "i": 33, "a": "tefl-22-031", "x": "1df028ca"}, {"t": "learn", "h": "<div class=\"u\">Four: language responds directly to the needs of the students.</div><div class=\"u\">أربعة: اللغة بتستجيب مباشرة لاحتياجات الطلبة.</div>", "n": 1, "i": 34, "a": "tefl-22-032", "x": "7fc1312b"}, {"t": "learn", "h": "<div class=\"u\">Five: TBL is communication centred, which is motivational.</div><div class=\"u\">خمسة: TBL متمحورة حوالين التواصل، وده محفّز.</div>", "n": 1, "i": 35, "a": "tefl-22-033", "x": "8a93f181"}, {"t": "learn", "h": "<div class=\"u\">Six: the students' needs dictate what will be covered, rather than a decision made by the teacher or the course book.</div><div class=\"u\">سته: احتياجات الطلبة هي اللي بتحدد إيه اللي هيتغطى، مش قرار المدرس أو الكتاب.</div>", "n": 1, "i": 36, "a": "tefl-22-034", "x": "2387eaa6"}, {"t": "learn", "h": "<div class=\"u\">Seven: it demands a strong communicative approach where students spend a lot of time speaking; PPP lessons seem very teacher-centred by comparison.</div><div class=\"u\">سبعة: بتتطلب منهج تواصلي قوي الطلبة بيقضوا فيه وقت كبير بيتكلموا؛ دروس PPP جنبها بتبان متمحورة حوالين المدرس جدًا.</div>", "n": 1, "i": 37, "a": "tefl-22-035", "x": "1d66cfe5"}, {"t": "learn", "h": "<div class=\"u\">Eight: the focus is on the task itself, taking the focus off learning and producing English, which increases self-confidence and is authentically communicative.</div><div class=\"u\">تمانية: التركيز على المهمة نفسها، وده بيشيل التركيز من على تعلم وإنتاج الإنجليزية، وده بيزوّد الثقة بالنفس وبيكون تواصل حقيقي.</div>", "n": 1, "i": 38, "a": "tefl-22-036", "x": "696f2c91"}, {"t": "learn", "h": "<div class=\"u\">Nine: it is enjoyable and motivating.</div><div class=\"u\">تسعة: ممتعة ومحفّزة.</div>", "n": 1, "i": 39, "a": "tefl-22-037", "x": "1db5de98"}, {"t": "section", "h": "Example: paper objects lesson | مثال: درس الأشياء الورقية", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">A TBL lesson plan example. Aims: students will collaboratively write instructions, and demonstrate understanding of their peers by making a paper wallet and boat.</div><div class=\"u\">مثال خطة درس TBL. الأهداف: الطلبة هيكتبوا تعليمات بالتعاون، وهيثبتوا فهمهم لزمايلهم بعمل محفظة ومركب ورق.</div>", "n": 1, "i": 41, "a": "tefl-22-038", "x": "18a8c312"}, {"t": "learn", "h": "<div class=\"u\">Teacher's instruction: Today you are the teachers. The teacher appoints two groups, A and B.</div><div class=\"u\">تعليمات المدرس: النهارده انتوا المدرسين. المدرس بيقسّم مجموعتين، A وB.</div>", "n": 1, "i": 42, "a": "tefl-22-039", "x": "26167dec"}, {"t": "learn", "h": "<div class=\"u\">Each group watches a video of how to make something, about 2 minutes long, in different rooms, as many times as they like.</div><div class=\"u\">كل مجموعة بتتفرج على فيديو إزاي تعمل حاجة، حوالي دقيقتين، في أوض مختلفة، أي عدد مرات يحبوه.</div>", "n": 1, "i": 43, "a": "tefl-22-040", "x": "3535cd57"}, {"t": "learn", "h": "<div class=\"u\">Task: students write instructions on how to make the object, with a time limit of say 20 minutes.</div><div class=\"u\">المهمة: الطلبة يكتبوا تعليمات إزاي يعملوا الحاجة دي، بحد زمني مثلًا ٢٠ دقيقة.</div>", "n": 1, "i": 44, "a": "tefl-22-041", "x": "63a296ec"}, {"t": "learn", "h": "<div class=\"u\">Instruction check questions: What are you doing now? How long is the video? How many times can you watch it?</div><div class=\"u\">أسئلة التحقق من التعليمات: بتعملوا إيه دلوقتي؟ الفيديو طوله قد إيه؟ تقدروا تتفرجوا عليه كام مرة؟</div>", "n": 1, "i": 45, "a": "tefl-22-042", "x": "7543654c"}, {"t": "learn", "h": "<div class=\"u\">The teacher monitors each group, correcting and feeding in useful language.</div><div class=\"u\">المدرس بيراقب كل مجموعة، بيصحّح وبيدخّل لغة مفيدة.</div>", "n": 1, "i": 46, "a": "tefl-22-043", "x": "5ad61d22"}, {"t": "learn", "h": "<div class=\"u\">After 20 minutes, the teacher brings everyone back together. A's sit directly opposite B's with a desk between them, and paper is handed out.</div><div class=\"u\">بعد ٢٠ دقيقة، المدرس بيرجّع الكل مع بعض. طلبة A يقعدوا قصاد طلبة B بالظبط وبينهم ترابيزة، والورق بيتوزّع.</div>", "n": 1, "i": 47, "a": "tefl-22-044", "x": "fe74b6e3"}, {"t": "learn", "h": "<div class=\"u\">Teacher instruction: A's go first. Do not show the object. Do not say the name of the object. Do not use your hands to gesture.</div><div class=\"u\">تعليمات المدرس: طلبة A يبدأوا. ممنوع توروا الحاجة. ممنوع تقولوا اسمها. ممنوع تستخدموا إيديكوا في الإشارة.</div>", "n": 1, "i": 48, "a": "tefl-22-045", "x": "6ee9a40a"}, {"t": "learn", "h": "<div class=\"u\">B's listen and do what A asks. Hopefully most students manage to make the paper boat and wallet.</div><div class=\"u\">طلبة B بيسمعوا وبينفّذوا اللي A بيطلبه. يارب أغلب الطلبة يقدروا يعملوا المركب والمحفظة الورق.</div>", "n": 1, "i": 49, "a": "tefl-22-046", "x": "374ad1e1"}, {"t": "learn", "h": "<div class=\"u\">Post task: students write a short text on what they did in class.</div><div class=\"u\">بعد المهمة: الطلبة بيكتبوا نص قصير عن اللي عملوه في الكلاس.</div>", "n": 1, "i": 50, "a": "tefl-22-047", "x": "ca4bc493"}, {"t": "section", "h": "Example: soap opera lesson | مثال: درس المسلسل", "n": 1, "i": 51}, {"t": "learn", "h": "<div class=\"u\">Another task-based lesson plan: students prepare their own role-plays or dialogues, inventing new characters and using their imagination.</div><div class=\"u\">خطة درس تانية بالمهام: الطلبة بيجهّزوا لعب أدوار أو حوارات خاصة بيهم، بيخترعوا شخصيات جديدة وبيستخدموا خيالهم.</div>", "n": 1, "i": 52, "a": "tefl-22-048", "x": "8facbb2d"}, {"t": "learn", "h": "<div class=\"u\">The drag-and-drop ordering, solved. Stage one: show the students a 5-minute video clip of a soap opera that ends in a cliff-hanger.</div><div class=\"u\">ترتيب السحب والإفلات، محلول. مرحلة واحد: اعرض للطلبة مقطع ٥ دقايق من مسلسل بينتهي بلحظة مشوّقة.</div>", "n": 1, "i": 53, "a": "tefl-22-049", "x": "56aff2a2"}, {"t": "learn", "h": "<div class=\"u\">Stage two: get the students to note down the names of characters, setting, level of speech formality and any key words or expressions.</div><div class=\"u\">مرحلة اتنين: خلّي الطلبة يسجّلوا أسماء الشخصيات، والمكان، ومستوى رسمية الكلام، وأي كلمات أو تعابير أساسية.</div>", "n": 1, "i": 54, "a": "tefl-22-050", "x": "f7e6d410"}, {"t": "learn", "h": "<div class=\"u\">Stage three: write what happens next? on the board.</div><div class=\"u\">مرحلة تلاتة: اكتب على السبورة: إيه اللي هيحصل بعد كده؟</div>", "n": 1, "i": 55, "a": "tefl-22-051", "x": "b5694eb7"}, {"t": "learn", "h": "<div class=\"u\">Stage four: put students into groups and get them to prepare their own role-plays or dialogues, making it clear they can invent new characters and use their imagination.</div><div class=\"u\">مرحلة أربعة: قسّم الطلبة لمجموعات وخلّيهم يجهّزوا لعب أدوار أو حوارات خاصة بيهم، ووضّح إنهم يقدروا يخترعوا شخصيات جديدة ويستخدموا خيالهم.</div>", "n": 1, "i": 56, "a": "tefl-22-052", "x": "0682c2a5"}, {"t": "learn", "h": "<div class=\"u\">Stage five: students act out their role-play in front of the group.</div><div class=\"u\">مرحلة خمسة: الطلبة بيمثّلوا لعب الأدوار بتاعهم قدام المجموعة.</div>", "n": 1, "i": 57, "a": "tefl-22-053", "x": "220790a9"}, {"t": "learn", "h": "<div class=\"u\">Stage six: get students to vote on the best ending to the clip.</div><div class=\"u\">مرحلة ستة: خلّي الطلبة يصوّتوا على أحسن نهاية للمقطع.</div>", "n": 1, "i": 58, "a": "tefl-22-054", "x": "fe569a03"}, {"t": "section", "h": "Module 3 summary | خلاصة الموديول ٣", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">Module summary. Many teachers are trained to use PPP, but the task-based approach has been proven more effective, specifically when teaching a new language.</div><div class=\"u\">خلاصة الموديول. مدرسين كتير اتدربوا على PPP، بس طريقة المهام اتثبت إنها أكتر فاعلية، خصوصًا في تدريس لغة جديدة.</div>", "n": 1, "i": 60, "a": "tefl-22-055", "x": "846e903c"}, {"t": "learn", "h": "<div class=\"u\">A standard PPP lesson: the teacher presents a language item in context through a text, situation, or conversation.</div><div class=\"u\">درس PPP عادي: المدرس بيقدّم نقطة لغة في سياق عن طريق نص أو موقف أو محادثة.</div>", "n": 1, "i": 61, "a": "tefl-22-056", "x": "48ea3b8e"}, {"t": "learn", "h": "<div class=\"u\">Then students complete controlled practice: choral or individual drilling, gap-fills, matching, with emphasis on using the language correctly and comfortably.</div><div class=\"u\">وبعدين الطلبة بيكمّلوا تمرين مضبوط: تدريب جماعي أو فردي، ملء فراغات، توصيل، بتركيز على استخدام اللغة بشكل صحيح ومريح.</div>", "n": 1, "i": 62, "a": "tefl-22-057", "x": "e7dd8ef1"}, {"t": "learn", "h": "<div class=\"u\">The final stage is production, the free practice stage: a communication task like a role-play using the target language plus any other suitable language they know.</div><div class=\"u\">المرحلة الأخيرة هي الإنتاج، مرحلة التمرين الحر: مهمة تواصل زي لعب أدوار باللغة المستهدفة زائد أي لغة تانية مناسبة يعرفوها.</div>", "n": 1, "i": 63, "a": "tefl-22-058", "x": "db386eb8"}, {"t": "learn", "h": "<div class=\"u\">PPP weakness one: students often produce the language but it sounds unnatural, because they completely overuse the target structure.</div><div class=\"u\">ضعف PPP الأول: الطلبة غالبًا بينتجوا اللغة بس بتبان مش طبيعية، لأنهم بيفرطوا في استخدام التركيبة المستهدفة.</div>", "n": 1, "i": 64, "a": "tefl-22-059", "x": "8c415e50"}, {"t": "learn", "h": "<div class=\"u\">PPP weakness two: they may not produce the target language in the practice stage, because they fall back on language they already know to complete the task.</div><div class=\"u\">ضعف PPP التاني: ممكن ماينتجوش اللغة المستهدفة في مرحلة التمرين، لأنهم بيرجعوا للغة اللي عارفينها أصلًا عشان يخلّصوا المهمة.</div>", "n": 1, "i": 65, "a": "tefl-22-060", "x": "4e5b115f"}, {"t": "learn", "h": "<div class=\"u\">Students respond better to TBL, and it delivers a better quality of learning and more natural, organic speech.</div><div class=\"u\">الطلبة بيستجيبوا أحسن لـTBL، وهي بتقدّم جودة تعلم أعلى وكلام طبيعي وعفوي أكتر.</div>", "n": 1, "i": 66, "a": "tefl-22-061", "x": "b200557c"}, {"t": "learn", "h": "<div class=\"u\">Producing structured language through PPP does not create the results students need outside the classroom.</div><div class=\"u\">إنتاج لغة منظمة عن طريق PPP مابيعملش النتايج اللي الطلبة محتاجينها بره الفصل.</div>", "n": 1, "i": 67, "a": "tefl-22-062", "x": "cfff8edd"}, {"t": "learn", "h": "<div class=\"u\">With interesting, engaging activities, TBL also produces those results in a shorter period of time.</div><div class=\"u\">وبأنشطة ممتعة وجذابة، TBL كمان بتوصل للنتايج دي في وقت أقصر.</div>", "n": 1, "i": 68, "a": "tefl-22-063", "x": "e3df3d89"}, {"t": "learn", "h": "<div class=\"u\">Further reading: A Framework for Task-Based Learning by Jane Wills, Longman; and Doing Task-Based Teaching by Dave and Jane Willis, OUP 2007.</div><div class=\"u\">للقراية الزيادة: كتاب A Framework for Task-Based Learning بتاع Jane Wills من Longman؛ وكتاب Doing Task-Based Teaching بتاع Dave وJane Willis من OUP سنة ٢٠٠٧.</div>", "n": 1, "i": 69, "a": "tefl-22-064", "x": "c101eb2d"}, {"t": "learn", "h": "<div class=\"u\">There are many more lesson planning styles beyond the three in this module, all with their own advantages and disadvantages.</div><div class=\"u\">في أساليب تخطيط دروس أكتر بكتير من التلاتة اللي في الموديول ده، كلها ليها مميزاتها وعيوبها.</div>", "n": 1, "i": 70, "a": "tefl-22-065", "x": "26929a42"}, {"t": "learn", "h": "<div class=\"u\">As long as your aims are well thought-out and you have a clear plan for each lesson, you are already more than half way there.</div><div class=\"u\">طالما أهدافك متفكّر فيها كويس وعندك خطة واضحة لكل درس، انت كده عدّيت أكتر من نص الطريق.</div>", "n": 1, "i": 71, "a": "tefl-22-066", "x": "f558c4eb"}, {"t": "learn", "h": "<div class=\"u\">Play around with the different styles to see what suits you best, and most of all, keep you and your students engaged and responsive.</div><div class=\"u\">جرّب الأساليب المختلفة عشان تشوف أنهي أنسب ليك، والأهم من كل ده، خلّيك انت وطلبتك متفاعلين ومستجيبين.</div>", "n": 1, "i": 72, "a": "tefl-22-067", "x": "9661bc13"}, {"t": "section", "h": "Unit 3 questions | أسئلة الوحدة ٣", "n": 1, "i": 73}, {"t": "learn", "h": "<div class=\"u\">Unit 3 questions. Question 1: In the TTT approach, what step comes first? Options: teach, test. Correct answer: test.</div><div class=\"u\">أسئلة الوحدة التالتة. سؤال ١: في طريقة TTT، أنهي خطوة بتيجي الأول؟ الاختيارات: تدريس، اختبار. الإجابة الصح: الاختبار.</div>", "n": 1, "i": 74, "a": "tefl-22-068", "x": "650fb5be"}, {"t": "learn", "h": "<div class=\"u\">Question 2: The TTT approach requires you to tailor your lesson to the students' needs. True or false? Correct answer: true.</div><div class=\"u\">سؤال ٢: طريقة TTT بتتطلب إنك تفصّل درسك على احتياجات الطلبة. صح ولا غلط؟ الإجابة الصح: صح.</div>", "n": 1, "i": 75, "a": "tefl-22-069", "x": "a13cc0de"}, {"t": "learn", "h": "<div class=\"u\">Question 3: The TTT method allows students to call upon their prior knowledge of the target language. True or false? Correct answer: true.</div><div class=\"u\">سؤال ٣: طريقة TTT بتسمح للطلبة يستخدموا معرفتهم السابقة باللغة المستهدفة. صح ولا غلط؟ الإجابة الصح: صح.</div>", "n": 1, "i": 76, "a": "tefl-22-070", "x": "6366d575"}, {"t": "learn", "h": "<div class=\"u\">Question 4: Once you have found a lesson planning method that suits you, you should always stick to it. True or false? Correct answer: false.</div><div class=\"u\">سؤال ٤: لما تلاقي طريقة تخطيط تناسبك، المفروض تلتزم بيها دايمًا. صح ولا غلط؟ الإجابة الصح: غلط.</div>", "n": 1, "i": 77, "a": "tefl-22-071", "x": "b689b5e9"}, {"t": "learn", "h": "<div class=\"u\">Question 5: Task-based learning should involve a task which is controlled or free? Correct answer: free.</div><div class=\"u\">سؤال ٥: التعلم بالمهام المفروض يتضمن مهمة تكون مضبوطة ولا حرة؟ الإجابة الصح: حرة.</div>", "n": 1, "i": 78, "a": "tefl-22-072", "x": "ade9ea84"}, {"t": "learn", "h": "<div class=\"u\">The feedback explains: TBL should be all about producing language and encouraging learner autonomy through tasks such as role-play, problem-solving or free writing.</div><div class=\"u\">التغذية الراجعة بتوضح: TBL المفروض تكون كلها عن إنتاج اللغة وتشجيع استقلالية المتعلم عن طريق مهام زي لعب الأدوار أو حل المشاكل أو الكتابة الحرة.</div>", "n": 1, "i": 79, "a": "tefl-22-073", "x": "5cc6dc00"}, {"t": "learn", "h": "<div class=\"u\">Question 6: PPP, TTT and Task-based Learning are the only three styles of lesson planning. True or false? Correct answer: false.</div><div class=\"u\">سؤال ٦: PPP وTTT والتعلم بالمهام هما الأساليب التلاتة الوحيدة لتخطيط الدروس. صح ولا غلط؟ الإجابة الصح: غلط.</div>", "n": 1, "i": 80, "a": "tefl-22-074", "x": "d9732909"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 81}, {"t": "learn", "h": "<div class=\"u\">Task-based Learning (TBL): a method where the lesson is built around completing a central open task.</div><div class=\"u\">التعلم بالمهام (TBL): طريقة الدرس فيها مبني حوالين إنجاز مهمة مركزية مفتوحة.</div>", "n": 1, "i": 82, "a": "tefl-22-075", "x": "93db5f1d"}, {"t": "learn", "h": "<div class=\"u\">Learner autonomy: students directing their own learning with freedom of approach.</div><div class=\"u\">استقلالية المتعلم: الطلبة بيوجّهوا تعلمهم بنفسهم بحرية في الطريقة.</div>", "n": 1, "i": 83, "a": "tefl-22-076", "x": "dd955027"}, {"t": "learn", "h": "<div class=\"u\">Open-ended task: a task with no single fixed answer, like plan a birthday party.</div><div class=\"u\">مهمة مفتوحة النهاية: مهمة مالهاش إجابة واحدة ثابتة، زي خطط لحفلة عيد ميلاد.</div>", "n": 1, "i": 84, "a": "tefl-22-077", "x": "5ad75045"}, {"t": "learn", "h": "<div class=\"u\">Pre-task: the stage where the teacher announces the material and what students will do.</div><div class=\"u\">ما قبل المهمة: المرحلة اللي المدرس بيعلن فيها المادة وإيه اللي الطلبة هيعملوه.</div>", "n": 1, "i": 85, "a": "tefl-22-078", "x": "53e6d39e"}, {"t": "learn", "h": "<div class=\"u\">Cliff-hanger: a story ending that stops at an exciting, unresolved moment.</div><div class=\"u\">النهاية المشوّقة (cliff-hanger): نهاية قصة بتقف عند لحظة مثيرة ومعلّقة.</div>", "n": 1, "i": 86, "a": "tefl-22-079", "x": "0a2f17ed"}, {"t": "learn", "h": "<div class=\"u\">Instruction check question: a quick question confirming students understood the instructions.</div><div class=\"u\">سؤال التحقق من التعليمات: سؤال سريع بيأكّد إن الطلبة فهموا التعليمات.</div>", "n": 1, "i": 87, "a": "tefl-22-080", "x": "6266fc26"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 88}, {"t": "learn", "h": "<div class=\"u\">TBL builds the lesson around an open, real-life task; the teacher does not pre-decide the language, it emerges from the task.</div><div class=\"u\">TBL بتبني الدرس حوالين مهمة مفتوحة من الحياة الحقيقية؛ المدرس مابيقرّرش اللغة مسبقًا، هي بتطلع من المهمة.</div>", "n": 1, "i": 89, "a": "tefl-22-081", "x": "d5be77de"}, {"t": "learn", "h": "<div class=\"u\">Good tasks have a clear purpose, fit the level, motivate, produce predictable language, and offer variety and flexibility.</div><div class=\"u\">المهام الكويسة ليها هدف واضح، ومناسبة للمستوى، ومحفّزة، وبتنتج لغة متوقعة، وفيها تنوع ومرونة.</div>", "n": 1, "i": 90, "a": "tefl-22-082", "x": "e4558275"}, {"t": "learn", "h": "<div class=\"u\">The five stages: assignment, planning, reporting, analysis, practice; reporting and analysis turn the task into language study.</div><div class=\"u\">المراحل الخمسة: التكليف، التخطيط، التقرير، التحليل، التمرين؛ التقرير والتحليل بيحوّلوا المهمة لدراسة لغة.</div>", "n": 1, "i": 91, "a": "tefl-22-083", "x": "dc996460"}, {"t": "learn", "h": "<div class=\"u\">PPP risks unnatural overuse of the target structure and falling back on old language; TBL gives more natural speech and faster results.</div><div class=\"u\">PPP فيها خطر الاستخدام المفرط غير الطبيعي للتركيبة والرجوع للغة القديمة؛ TBL بتدّي كلام طبيعي أكتر ونتايج أسرع.</div>", "n": 1, "i": 92, "a": "tefl-22-084", "x": "578419aa"}, {"t": "learn", "h": "<div class=\"u\">There are more than three planning styles: experiment, keep your aims clear, and keep everyone engaged.</div><div class=\"u\">في أكتر من تلات أساليب تخطيط: جرّب، وخلّي أهدافك واضحة، وخلّي الكل متفاعل.</div>", "n": 1, "i": 93, "a": "tefl-22-085", "x": "171c69ba"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 94}, {"t": "mc", "q": "What does a task-based lesson revolve around?<br>الدرس المبني على المهام بيدور حوالين إيه؟", "opts": ["completing a central task | إنجاز مهمة مركزية", "a grammar rule decided before the lesson | قاعدة نحوية متقرة قبل الدرس", "a long reading text | نص قراية طويل"], "ans": 0, "why": "The teacher does not pre-determine the language; the central task drives what is studied. | المدرس مابيحدّدش اللغة مسبقًا؛ المهمة المركزية هي اللي بتحدد اللي بيتدرّس.", "ex": ["Correct. | صح.", "No. Pre-decided grammar is the PPP way. | غلط: القواعد المتقرة مسبقًا طريقة PPP.", "No. A text may appear, but the task is the centre. | غلط: ممكن يظهر نص، بس المهمة هي المركز."], "n": 1, "i": 95, "h": ""}, {"t": "mc", "q": "Which is the correct order of the five TBL stages?<br>أنهي هو الترتيب الصح لمراحل TBL الخمسة؟", "opts": ["assignment, planning, reporting, analysis, practice | تكليف، تخطيط، تقرير، تحليل، تمرين", "planning, assignment, practice, reporting, analysis | تخطيط، تكليف، تمرين، تقرير، تحليل", "practice, analysis, assignment, planning, reporting | تمرين، تحليل، تكليف، تخطيط، تقرير"], "ans": 0, "why": "Assignment, planning, reporting, analysis, practice. | التكليف، التخطيط، التقرير، التحليل، التمرين.", "ex": ["Correct. | صح.", "No. Assignment comes before planning. | غلط: التكليف بييجي قبل التخطيط.", "No. Practice is the final stage. | غلط: التمرين هو المرحلة الأخيرة."], "n": 1, "i": 96, "h": ""}, {"t": "mc", "q": "Which of these is NOT one of the five task tips from the Asian ESL journal?<br>أنهي دي مش من نصايح المهام الخمسة بتاعة Asian ESL journal؟", "opts": ["the task must test memorized grammar rules | المهمة لازم تختبر القواعد المحفوظة", "the task must suit the students' level | المهمة لازم تناسب مستوى الطلبة", "the task's language must be predicted | لغة المهمة لازم تكون متوقعة"], "ans": 0, "why": "The five tips: clear purpose, suitable level, interesting and motivating, predictable language, variety and flexibility. | النصايح الخمسة: هدف واضح، مستوى مناسب، ممتعة ومحفّزة، لغة متوقعة، تنوع ومرونة.", "ex": ["Correct. | صح.", "No. Suiting the level is tip two. | غلط: مناسبة المستوى هي النصيحة التانية.", "No. Predicting the language is tip four. | غلط: توقع اللغة هو النصيحة الرابعة."], "n": 1, "i": 97, "h": ""}, {"t": "tf", "q": "Task-based learning should involve a task which is free.<br>التعلم بالمهام المفروض يتضمن مهمة حرة.", "ans": true, "why": "True. TBL is about producing language and learner autonomy through role-play, problem-solving, or free writing. | صح. TBL كلها عن إنتاج اللغة واستقلالية المتعلم عن طريق لعب الأدوار أو حل المشاكل أو الكتابة الحرة.", "ex": ["Correct. | صح.", "Wrong. Free tasks build autonomy; controlled tasks belong to PPP practice. | غلط: المهام الحرة بتبني الاستقلالية؛ المضبوطة تبع تمرين PPP."], "n": 1, "i": 98, "h": ""}, {"t": "mc", "q": "In the paper wallet and boat lesson, what are group A told NOT to do?<br>في درس المحفظة والمركب الورق، طلبة A اتقالهم يعملوا إيه لأ؟", "opts": ["show the object, say its name, or gesture with hands | يوروا الحاجة أو يقولوا اسمها أو يشيروا بإيديهم", "write instructions | يكتبوا تعليمات", "watch the video twice | يتفرجوا على الفيديو مرتين"], "ans": 0, "why": "No showing, no naming, no hands. B's must rely on the spoken instructions alone. | ممنوع الإظهار، ممنوع الاسم، ممنوع الإيدين. طلبة B لازم يعتمدوا على التعليمات المنطوقة بس.", "ex": ["Correct. | صح.", "No. Writing instructions is exactly what group A did. | غلط: كتابة التعليمات هي اللي مجموعة A عملتها.", "No. They could watch the video as many times as they liked. | غلط: كانوا يقدروا يتفرجوا على الفيديو أي عدد مرات."], "n": 1, "i": 99, "h": ""}, {"t": "mc", "q": "In the soap opera lesson plan, what happens right after students note the characters, setting and key words?<br>في خطة درس المسلسل، إيه اللي بيحصل بعد ما الطلبة يسجّلوا الشخصيات والمكان والكلمات الأساسية على طول؟", "opts": ["the teacher writes what happens next? on the board | المدرس بيكتب إيه اللي هيحصل بعد كده؟ على السبورة", "students vote on the best ending | الطلبة بيصوّتوا على أحسن نهاية", "students act out their role-plays | الطلبة بيمثّلوا لعب الأدوار"], "ans": 0, "why": "Order: clip, notes, what happens next?, group role-play prep, acting, voting. | الترتيب: مقطع، ملاحظات، إيه اللي هيحصل بعد كده؟، تجهيز لعب الأدوار، التمثيل، التصويت.", "ex": ["Correct. | صح.", "No. Voting is the final stage. | غلط: التصويت هو المرحلة الأخيرة.", "No. Acting comes after preparation in groups. | غلط: التمثيل بييجي بعد التجهيز في المجموعات."], "n": 1, "i": 100, "h": ""}, {"t": "tf", "q": "In PPP production, students sometimes sound unnatural because they overuse the target structure.<br>في إنتاج PPP، الطلبة ساعات بيبانوا مش طبيعيين لأنهم بيفرطوا في استخدام التركيبة المستهدفة.", "ans": true, "why": "True. That is one of the two PPP weaknesses named in the module summary. | صح. ده واحد من ضعفين لـPPP مذكورين في خلاصة الموديول.", "ex": ["Correct. | صح.", "Wrong. Overusing the target structure is a stated PPP weakness. | غلط: الإفراط في استخدام التركيبة ضعف معلن في PPP."], "n": 1, "i": 101, "h": ""}, {"t": "tf", "q": "Once you find a lesson planning method that suits you, you should always stick to it.<br>لما تلاقي طريقة تخطيط تناسبك، المفروض تلتزم بيها دايمًا.", "ans": false, "why": "False. There are many styles; play around with them and keep everyone engaged. | غلط. في أساليب كتير؛ جرّب بينها وخلّي الكل متفاعل.", "ex": ["Wrong. Experimenting across styles is encouraged. | غلط: التجريب بين الأساليب متشجّع.", "Correct. | صح."], "n": 1, "i": 102, "h": ""}, {"t": "mc", "q": "Who pioneered Task-based Learning?<br>مين أسس التعلم بالمهام؟", "opts": ["N. Prabhu | N. Prabhu", "Jane Wills | Jane Wills", "Nunan | Nunan"], "ans": 0, "why": "Prabhu pioneered TBL. Nunan defined open-ended tasks; Wills wrote the further-reading book. | Prabhu أسس TBL. نونان عرّف المهام مفتوحة النهاية؛ Wills كاتبة كتاب القراية الزيادة.", "ex": ["Correct. | صح.", "No. Jane Wills wrote A Framework for Task-Based Learning. | غلط: Jane Wills كاتبة A Framework for Task-Based Learning.", "No. Nunan described TBL, but Prabhu pioneered it. | غلط: نونان وصف TBL، بس Prabhu أسسها."], "n": 1, "i": 103, "h": ""}, {"t": "mc", "q": "In the analysis stage, the teacher:<br>في مرحلة التحليل، المدرس:", "opts": ["highlights relevant parts of the recording text and notable features | بيسلّط الضوء على أجزاء مناسبة من نص التسجيل وسمات ملحوظة", "gives a gap-fill worksheet | بيدّي ورقة ملء فراغات", "announces the material for the first time | بيعلن المادة لأول مرة"], "ans": 0, "why": "Analysis follows reporting; announcing the material is the pre-task. | التحليل بييجي بعد التقرير؛ إعلان المادة هو ما قبل المهمة.", "ex": ["Correct. | صح.", "No. Gap-fills are controlled practice, not analysis. | غلط: ملء الفراغات تمرين مضبوط مش تحليل.", "No. Announcing the material happens in the pre-task. | غلط: إعلان المادة بيحصل في ما قبل المهمة."], "n": 1, "i": 104, "h": ""}, {"t": "recall", "q": "List the five tips for good tasks from the Asian ESL journal.<br>اذكر نصايح المهام الكويسة الخمسة من Asian ESL journal.", "a": "Clear purpose; suitable for the level; interesting and motivating; predictable language output; variety and flexibility.<br>هدف واضح؛ مناسبة للمستوى؛ ممتعة ومحفّزة؛ مخرجات لغة متوقعة؛ تنوع ومرونة.", "n": 1, "i": 105, "h": ""}, {"t": "recall", "q": "Name the two PPP weaknesses given in the module summary.<br>اذكر ضعفين لـPPP مذكورين في خلاصة الموديول.", "a": "Students overuse the target structure so production sounds unnatural, and they may fall back on existing language during practice instead of using the target language.<br>الطلبة بيفرطوا في استخدام التركيبة المستهدفة فالإنتاج بيبان مش طبيعي، وممكن يرجعوا للغة القديمة أثناء التمرين بدل اللغة المستهدفة.", "n": 1, "i": 106, "h": ""}, {"t": "write", "q": "Explain how the five TBL stages turn one task into language learning (4-5 sentences).<br>اشرح إزاي مراحل TBL الخمسة بتحوّل مهمة واحدة لتعلم لغة (٤-٥ جمل).", "key": "tefl-22:1", "a": "In assignment, students receive resources and instructions for the central task. In planning, they use those resources, creating lists or notes for their report. In reporting, they present results orally to the class, which pushes them to speak. In analysis, the teacher highlights relevant language from the recording or text and notable features. Finally, in practice, the teacher picks language areas based on what the task revealed, and students do activities that grow confidence and proficiency.<br>في التكليف، الطلبة بياخدوا الموارد والتعليمات للمهمة المركزية. في التخطيط، بيستخدموا الموارد دي، بيعملوا قوايم أو ملاحظات لتقريرهم. في التقرير، بيعرضوا النتايج شفوي على الكلاس، وده بيدفعهم يتكلموا. في التحليل، المدرس بيسلّط الضوء على لغة مناسبة من التسجيل أو النص وسمات ملحوظة. وأخيرًا في التمرين، المدرس بيختار مناطق لغة حسب اللي كشفته المهمة، والطلبة بيعملوا أنشطة بتزوّد الثقة والكفاءة.", "n": 1, "i": 107, "h": ""}, {"t": "write", "q": "Describe the soap opera lesson plan in order (4-5 sentences).<br>اوصف خطة درس المسلسل بالترتيب (٤-٥ جمل).", "key": "tefl-22:2", "a": "First, the class watches a 5-minute soap opera clip that ends on a cliff-hanger. Second, students note the characters, setting, formality level, and key words. Third, the teacher writes what happens next? on the board. Fourth, groups prepare their own role-plays or dialogues, inventing new characters freely. Finally, students act out their role-plays and vote on the best ending.<br>أولًا، الكلاس بيتفرج على مقطع ٥ دقايق من مسلسل بينتهي بلحظة مشوّقة. تانيًا، الطلبة بيسجّلوا الشخصيات والمكان ومستوى الرسمية والكلمات الأساسية. تالتًا، المدرس بيكتب إيه اللي هيحصل بعد كده؟ على السبورة. رابعًا، المجموعات بتجهّز لعب أدوار أو حوارات خاصة بيها، بتخترع شخصيات جديدة بحرية. وأخيرًا، الطلبة بيمثّلوا لعب الأدوار ويصوّتوا على أحسن نهاية.", "n": 1, "i": 108, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 4, Motivation, why learners keep going and how teachers feed it.</div><div class=\"u\">الدرس الجاي: الوحدة الرابعة، التحفيز، ليه المتعلمين بيكمّلوا وإزاي المدرسين بيغذّوه.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 109}];</script>
