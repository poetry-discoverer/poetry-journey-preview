<h1>عالم تيفل ٢٥: مكونات خطة الدرس</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٢٥</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-25";window.STEPS=[{"t": "section", "h": "Essential and optional | الأساسي والاختياري", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Identifying aims is a key component of any lesson plan, but there are several other aspects to consider.</div><div class=\"u\">تحديد الأهداف مكوّن أساسي في أي خطة درس، بس في كذا جانب تاني لازم تفكّر فيه.</div>", "n": 1, "i": 1, "a": "tefl-25-001", "x": "4cb0a352"}, {"t": "learn", "h": "<div class=\"u\">Some components are essential to every lesson plan; others are optional and not always necessary.</div><div class=\"u\">بعض المكونات أساسية لكل خطة درس؛ وغيرها اختيارية ومش دايمًا لازمة.</div>", "n": 1, "i": 2, "a": "tefl-25-002", "x": "f9310b4b"}, {"t": "learn", "h": "<div class=\"u\">The essential components: information about the learners (level and number), main aim, stage aims, procedures, and materials used.</div><div class=\"u\">المكونات الأساسية: معلومات عن المتعلمين (المستوى والعدد)، الهدف الرئيسي، أهداف المراحل، الإجراءات، والخامات المستخدمة.</div>", "n": 1, "i": 3, "a": "tefl-25-003", "x": "d69b0dd1"}, {"t": "learn", "h": "<div class=\"u\">The optional components: timings, anticipated problems and potential solutions, subsidiary and personal aims, homework.</div><div class=\"u\">المكونات الاختيارية: التوقيتات، المشاكل المتوقعة والحلول المحتملة، الأهداف الفرعية والشخصية، الواجب.</div>", "n": 1, "i": 4, "a": "tefl-25-004", "x": "fff1e272"}, {"t": "learn", "h": "<div class=\"u\">Also optional: extra teaching aids, reserve tasks, assumed knowledge, and interaction.</div><div class=\"u\">وكمان اختياري: وسائل تعليمية إضافية، مهام احتياطية، المعرفة المفترضة، والتفاعل.</div>", "n": 1, "i": 5, "a": "tefl-25-005", "x": "b323dbb6"}, {"t": "section", "h": "The questions behind each component | الأسئلة ورا كل مكوّن", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Each component answers a question you ask yourself when planning.</div><div class=\"u\">كل مكوّن بيجاوب على سؤال بتسأله لنفسك أثناء التخطيط.</div>", "n": 1, "i": 7, "a": "tefl-25-006", "x": "e17a0bd9"}, {"t": "learn", "h": "<div class=\"u\">Information about the learners: who are the students? What level are they? How many are in the class?</div><div class=\"u\">معلومات عن المتعلمين: مين الطلبة؟ مستواهم إيه؟ عددهم كام في الفصل؟</div>", "n": 1, "i": 8, "a": "tefl-25-007", "x": "a99a21c6"}, {"t": "learn", "h": "<div class=\"u\">Materials used: what course book or materials do I need? Extra teaching aids: is there anything else I need to bring, like an overhead projector?</div><div class=\"u\">الخامات المستخدمة: أنهي كتاب أو خامات محتاجها؟ الوسائل الإضافية: في حاجة تانية محتاج أجيبها معايا، زي جهاز عرض؟</div>", "n": 1, "i": 9, "a": "tefl-25-008", "x": "b5d41dbd"}, {"t": "learn", "h": "<div class=\"u\">Main aim: what is the overall lesson objective? Assumed knowledge: what do the students already know in relation to the topic?</div><div class=\"u\">الهدف الرئيسي: إيه هدف الدرس العام؟ المعرفة المفترضة: الطلبة عارفين إيه أصلًا في علاقة بالموضوع؟</div>", "n": 1, "i": 10, "a": "tefl-25-009", "x": "1ccf00dd"}, {"t": "learn", "h": "<div class=\"u\">Subsidiary aims: what are some of the other lesson goals? Personal aims: in what ways can I develop or improve my own teaching?</div><div class=\"u\">الأهداف الفرعية: إيه بعض أهداف الدرس التانية؟ الأهداف الشخصية: أقدر أطوّر تدريسي إزاي؟</div>", "n": 1, "i": 11, "a": "tefl-25-010", "x": "8e66c0c6"}, {"t": "learn", "h": "<div class=\"u\">Procedures: what are the activities for each stage?</div><div class=\"u\">الإجراءات: إيه أنشطة كل مرحلة؟</div>", "n": 1, "i": 12, "a": "tefl-25-011", "x": "0eab34d3"}, {"t": "learn", "h": "<div class=\"u\">Interaction: will students work in pairs or groups? Will they feedback to the teacher, or will the teacher present to the class?</div><div class=\"u\">التفاعل: الطلبة هيشتغلوا في أزواج ولا مجموعات؟ هيعرضوا على المدرس ولا المدرس هيقدّم للكلاس؟</div>", "n": 1, "i": 13, "a": "tefl-25-012", "x": "4b75db1e"}, {"t": "learn", "h": "<div class=\"u\">Stage aims: what is the goal of each stage? Timing: how long will each stage take?</div><div class=\"u\">أهداف المراحل: إيه هدف كل مرحلة؟ التوقيت: كل مرحلة هتاخد وقت قد إيه؟</div>", "n": 1, "i": 14, "a": "tefl-25-013", "x": "59c3dc93"}, {"t": "learn", "h": "<div class=\"u\">Anticipated problems: what might go wrong? What might students find difficult? Potential solutions: how can I deal with any problems?</div><div class=\"u\">المشاكل المتوقعة: إيه اللي ممكن يحصل غلط؟ إيه اللي الطلبة ممكن يلاقوه صعب؟ الحلول المحتملة: أقدر أتعامل مع المشاكل إزاي؟</div>", "n": 1, "i": 15, "a": "tefl-25-014", "x": "1a8db88c"}, {"t": "learn", "h": "<div class=\"u\">Reserve tasks: what will I do if students complete tasks ahead of schedule? Homework: what extra work will students do at home?</div><div class=\"u\">المهام الاحتياطية: هعمل إيه لو الطلبة خلّصوا المهام قبل معادها؟ الواجب: إيه الشغل الزيادة اللي الطلبة هيعملوه في البيت؟</div>", "n": 1, "i": 16, "a": "tefl-25-015", "x": "fe7242ea"}, {"t": "learn", "h": "<div class=\"u\">For assumed knowledge, ask: what do they already know how to do in relation to this lesson? Will this be new to them, or a consolidation of previous work?</div><div class=\"u\">للمعرفة المفترضة، اسأل: بيعرفوا يعملوا إيه أصلًا في علاقة بالدرس ده؟ ده هيبقى جديد عليهم ولا تثبيت لشغل سابق؟</div>", "n": 1, "i": 17, "a": "tefl-25-016", "x": "7b248eff"}, {"t": "section", "h": "The plan as a road map | الخطة كخريطة طريق", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">Rather than thinking of a lesson plan as a formal procedure, think of it as answering a series of questions like these.</div><div class=\"u\">بدل ما تفكّر في خطة الدرس كإجراء رسمي، فكّر فيها كإجابة على سلسلة أسئلة زي دي.</div>", "n": 1, "i": 19, "a": "tefl-25-017", "x": "d19b6724"}, {"t": "learn", "h": "<div class=\"u\">Try to use colours and diagrams even, whatever makes it clear to you.</div><div class=\"u\">جرب تستخدم ألوان ورسومات حتى، أي حاجة تخلّيها واضحة ليك.</div>", "n": 1, "i": 20, "a": "tefl-25-018", "x": "1ad71b57"}, {"t": "learn", "h": "<div class=\"u\">The idea is that it works like a road map, as Scrivener calls it, guiding you through the stages of the lesson.</div><div class=\"u\">الفكرة إنها بتشتغل زي خريطة طريق، زي ما سكريفنر بيسمّيها، بترشدك خلال مراحل الدرس.</div>", "n": 1, "i": 21, "a": "tefl-25-019", "x": "015543f7"}, {"t": "learn", "h": "<div class=\"u\">And it ensures that you meet all your objectives successfully.</div><div class=\"u\">وبتضمن إنك بتحقق كل أهدافك بنجاح.</div>", "n": 1, "i": 22, "a": "tefl-25-020", "x": "fb57adf5"}, {"t": "section", "h": "Unit 2 questions | أسئلة الوحدة ٢", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">Unit 2 questions. Question 1: which of the following is a key component for any lesson plan? Options: reserve tasks, personal aims, timing, main aim.</div><div class=\"u\">أسئلة الوحدة التانية. سؤال ١: أنهي دي مكوّن أساسي لأي خطة درس؟ الاختيارات: مهام احتياطية، أهداف شخصية، توقيت، هدف رئيسي.</div>", "n": 1, "i": 24, "a": "tefl-25-021", "x": "2f5a302e"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: main aim. The other three are optional components.</div><div class=\"u\">الإجابة الصح: الهدف الرئيسي. التلاتة التانيين مكونات اختيارية.</div>", "n": 1, "i": 25, "a": "tefl-25-022", "x": "0d1b9435"}, {"t": "learn", "h": "<div class=\"u\">Question 2: when we ask ourselves how can I deal with any problems, this relates to which component? Options: anticipated problems, reserve tasks, potential solutions.</div><div class=\"u\">سؤال ٢: لما بنسأل نفسنا أقدر أتعامل مع المشاكل إزاي، ده مرتبط بأنهي مكوّن؟ الاختيارات: المشاكل المتوقعة، المهام الاحتياطية، الحلول المحتملة.</div>", "n": 1, "i": 26, "a": "tefl-25-023", "x": "0a4c2332"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: potential solutions.</div><div class=\"u\">الإجابة الصح: الحلول المحتملة.</div>", "n": 1, "i": 27, "a": "tefl-25-024", "x": "58a3d33d"}, {"t": "learn", "h": "<div class=\"u\">Question 3: when thinking about the assumed knowledge component, we ask ourselves what is the purpose of the lesson. True or false?</div><div class=\"u\">سؤال ٣: لما بنفكّر في مكوّن المعرفة المفترضة، بنسأل نفسنا إيه غرض الدرس. صح ولا غلط؟</div>", "n": 1, "i": 28, "a": "tefl-25-025", "x": "b351bfb4"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: false. What is the purpose of the lesson belongs to the main aim; assumed knowledge asks what students already know.</div><div class=\"u\">الإجابة الصح: غلط. إيه غرض الدرس دي بتاعت الهدف الرئيسي؛ المعرفة المفترضة بتسأل الطلبة عارفين إيه أصلًا.</div>", "n": 1, "i": 29, "a": "tefl-25-026", "x": "1b068a92"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Essential components: the parts every lesson plan must have: learners info, main aim, stage aims, procedures, materials.</div><div class=\"u\">المكونات الأساسية: الأجزاء اللي لازم تبقى في كل خطة درس: معلومات المتعلمين، الهدف الرئيسي، أهداف المراحل، الإجراءات، الخامات.</div>", "n": 1, "i": 31, "a": "tefl-25-027", "x": "1f3ae4c8"}, {"t": "learn", "h": "<div class=\"u\">Optional components: parts you add when useful, like timings, homework, and reserve tasks.</div><div class=\"u\">المكونات الاختيارية: أجزاء بتضيفها لما تفيد، زي التوقيتات والواجب والمهام الاحتياطية.</div>", "n": 1, "i": 32, "a": "tefl-25-028", "x": "d56568e8"}, {"t": "learn", "h": "<div class=\"u\">Assumed knowledge: what students already know in relation to the lesson topic.</div><div class=\"u\">المعرفة المفترضة: إيه اللي الطلبة عارفينه أصلًا في علاقة بموضوع الدرس.</div>", "n": 1, "i": 33, "a": "tefl-25-029", "x": "b17ab05a"}, {"t": "learn", "h": "<div class=\"u\">Anticipated problems: difficulties you predict before the lesson.</div><div class=\"u\">المشاكل المتوقعة: الصعوبات اللي بتتنبأ بيها قبل الدرس.</div>", "n": 1, "i": 34, "a": "tefl-25-030", "x": "17b5384c"}, {"t": "learn", "h": "<div class=\"u\">Reserve task: an extra activity ready in case students finish early.</div><div class=\"u\">المهمة الاحتياطية: نشاط زيادة جاهز في حالة الطلبة خلصوا بدري.</div>", "n": 1, "i": 35, "a": "tefl-25-031", "x": "1551d60c"}, {"t": "learn", "h": "<div class=\"u\">Interaction pattern: how students are grouped, like pairs or groups, and who talks to whom.</div><div class=\"u\">نمط التفاعل: الطلبة متقسمين إزاي، زي أزواج أو مجموعات، ومين بيكلم مين.</div>", "n": 1, "i": 36, "a": "tefl-25-032", "x": "25332153"}, {"t": "learn", "h": "<div class=\"u\">Road map: Scrivener's image for a lesson plan guiding you through the stages.</div><div class=\"u\">خريطة الطريق: صورة سكريفنر لخطة الدرس اللي بترشدك خلال المراحل.</div>", "n": 1, "i": 37, "a": "tefl-25-033", "x": "5f03f187"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">A lesson plan has five essential components: learners info, main aim, stage aims, procedures, materials; the rest are optional.</div><div class=\"u\">خطة الدرس ليها خمس مكونات أساسية: معلومات المتعلمين، الهدف الرئيسي، أهداف المراحل، الإجراءات، الخامات؛ الباقي اختياري.</div>", "n": 1, "i": 39, "a": "tefl-25-034", "x": "f1ae89a6"}, {"t": "learn", "h": "<div class=\"u\">Each component answers a planning question, from who are the students to what if they finish early.</div><div class=\"u\">كل مكوّن بيجاوب على سؤال تخطيط، من مين الطلبة لحد إيه لو خلصوا بدري.</div>", "n": 1, "i": 40, "a": "tefl-25-035", "x": "9adeb481"}, {"t": "learn", "h": "<div class=\"u\">Think of the plan as answers to questions, not a formal document; use colours and diagrams.</div><div class=\"u\">فكّر في الخطة كإجابات على أسئلة، مش مستند رسمي؛ استخدم ألوان ورسومات.</div>", "n": 1, "i": 41, "a": "tefl-25-036", "x": "dbe86440"}, {"t": "learn", "h": "<div class=\"u\">The plan is a road map: it guides you through the stages and keeps every objective in sight.</div><div class=\"u\">الخطة خريطة طريق: بترشدك خلال المراحل وبتخلّي كل هدف قدام عينك.</div>", "n": 1, "i": 42, "a": "tefl-25-037", "x": "25b0de23"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 43}, {"t": "mc", "q": "Which is an essential component of every lesson plan?<br>أنهي دي مكوّن أساسي في كل خطة درس؟", "opts": ["main aim | الهدف الرئيسي", "reserve tasks | مهام احتياطية", "homework | واجب"], "ans": 0, "why": "Essential: learners info, main aim, stage aims, procedures, materials. Reserve tasks and homework are optional. | الأساسي: معلومات المتعلمين، الهدف الرئيسي، أهداف المراحل، الإجراءات، الخامات. المهام الاحتياطية والواجب اختياري.", "ex": ["Correct. | صح.", "No. Reserve tasks are optional. | غلط: المهام الاحتياطية اختيارية.", "No. Homework is optional. | غلط: الواجب اختياري."], "n": 1, "i": 44, "h": ""}, {"t": "mc", "q": "How can I deal with any problems? belongs to which component?<br>أقدر أتعامل مع المشاكل إزاي؟ بتنتمي لأنهي مكوّن؟", "opts": ["potential solutions | الحلول المحتملة", "anticipated problems | المشاكل المتوقعة", "reserve tasks | المهام الاحتياطية"], "ans": 0, "why": "Anticipated problems asks what might go wrong; solutions asks how to deal with it. | المشاكل المتوقعة بتسأل إيه اللي ممكن يحصل غلط؛ الحلول بتسأل تتعامل معاه إزاي.", "ex": ["Correct. | صح.", "No. Anticipated problems is the what-might-go-wrong question. | غلط: المشاكل المتوقعة هي سؤال إيه-اللي-ممكن-يحصل-غلط.", "No. Reserve tasks cover finishing early, not problems. | غلط: المهام الاحتياطية بتغطي الخلاص بدري مش المشاكل."], "n": 1, "i": 45, "h": ""}, {"t": "mc", "q": "What do the students already know in relation to the topic? is the question for:<br>الطلبة عارفين إيه أصلًا في علاقة بالموضوع؟ هو سؤال مكوّن:", "opts": ["assumed knowledge | المعرفة المفترضة", "main aim | الهدف الرئيسي", "interaction | التفاعل"], "ans": 0, "why": "That is the assumed knowledge question. Main aim asks what the overall objective is. | ده سؤال المعرفة المفترضة. الهدف الرئيسي بيسأل إيه الهدف العام.", "ex": ["Correct. | صح.", "No. Main aim asks what the lesson's overall objective is. | غلط: الهدف الرئيسي بيسأل إيه هدف الدرس العام.", "No. Interaction asks about pairs, groups, and feedback. | غلط: التفاعل بيسأل عن الأزواج والمجموعات والعرض."], "n": 1, "i": 46, "h": ""}, {"t": "mc", "q": "Which component asks about pairs, groups, and who feeds back to whom?<br>أنهي مكوّن بيسأل عن الأزواج والمجموعات ومين بيعرض على مين؟", "opts": ["interaction | التفاعل", "procedures | الإجراءات", "timing | التوقيت"], "ans": 0, "why": "Interaction covers grouping and feedback direction. | التفاعل بيغطي التقسيم واتجاه العرض.", "ex": ["Correct. | صح.", "No. Procedures are the activities for each stage. | غلط: الإجراءات هي أنشطة كل مرحلة.", "No. Timing is how long each stage takes. | غلط: التوقيت هو كل مرحلة بتاخد قد إيه."], "n": 1, "i": 47, "h": ""}, {"t": "tf", "q": "Timings are an essential component of every lesson plan.<br>التوقيتات مكوّن أساسي في كل خطة درس.", "ans": false, "why": "False. Timings are optional; the five essentials are learners info, main aim, stage aims, procedures, materials. | غلط. التوقيتات اختيارية؛ الأساسيات الخمسة هي معلومات المتعلمين والهدف الرئيسي وأهداف المراحل والإجراءات والخامات.", "ex": ["Wrong. Timings sit on the optional list. | غلط: التوقيتات في القايمة الاختيارية.", "Correct. | صح."], "n": 1, "i": 48, "h": ""}, {"t": "mc", "q": "What will I do if students complete tasks ahead of schedule? belongs to:<br>هعمل إيه لو الطلبة خلّصوا المهام قبل معادها؟ بتنتمي لـ:", "opts": ["reserve tasks | المهام الاحتياطية", "homework | الواجب", "stage aims | أهداف المراحل"], "ans": 0, "why": "Reserve tasks are the early-finisher plan. | المهام الاحتياطية هي خطة اللي بيخلص بدري.", "ex": ["Correct. | صح.", "No. Homework is extra work at home. | غلط: الواجب شغل زيادة في البيت.", "No. Stage aims are each stage's goal. | غلط: أهداف المراحل هي هدف كل مرحلة."], "n": 1, "i": 49, "h": ""}, {"t": "tf", "q": "Scrivener compares the lesson plan to a road map.<br>سكريفنر بيشبّه خطة الدرس بخريطة طريق.", "ans": true, "why": "True. It guides you through the stages and ensures you meet all objectives. | صح. بترشدك خلال المراحل وبتضمن إنك بتحقق كل الأهداف.", "ex": ["Correct. | صح.", "Wrong. Road map is exactly Scrivener's image. | غلط: خريطة الطريق هي بالظبط صورة سكريفنر."], "n": 1, "i": 50, "h": ""}, {"t": "mc", "q": "Is there anything else I need to bring, like an overhead projector? belongs to:<br>في حاجة تانية محتاج أجيبها، زي جهاز عرض؟ بتنتمي لـ:", "opts": ["extra teaching aids | وسائل تعليمية إضافية", "materials used | الخامات المستخدمة", "personal aims | الأهداف الشخصية"], "ans": 0, "why": "Extra teaching aids cover what to bring beyond the core materials. | الوسائل الإضافية بتغطي اللي بتجيبه زيادة على الخامات الأساسية.", "ex": ["Correct. | صح.", "No. Materials used asks about the course book and core materials. | غلط: الخامات المستخدمة بتسأل عن الكتاب المقرر والخامات الأساسية.", "No. Personal aims are about developing your teaching. | غلط: الأهداف الشخصية عن تطوير تدريسك."], "n": 1, "i": 51, "h": ""}, {"t": "recall", "q": "List the five essential components of a lesson plan.<br>اذكر المكونات الخمسة الأساسية لخطة الدرس.", "a": "Information about the learners, main aim, stage aims, procedures, materials used.<br>معلومات عن المتعلمين، الهدف الرئيسي، أهداف المراحل، الإجراءات، الخامات المستخدمة.", "n": 1, "i": 52, "h": ""}, {"t": "recall", "q": "Give four optional components of a lesson plan.<br>اذكر أربع مكونات اختيارية لخطة الدرس.", "a": "Any four of: timings, anticipated problems, potential solutions, subsidiary aims, personal aims, homework, extra teaching aids, reserve tasks, assumed knowledge, interaction.<br>أي أربعة من: التوقيتات، المشاكل المتوقعة، الحلول المحتملة، الأهداف الفرعية، الأهداف الشخصية، الواجب، الوسائل الإضافية، المهام الاحتياطية، المعرفة المفترضة، التفاعل.", "n": 1, "i": 53, "h": ""}, {"t": "write", "q": "Explain the difference between essential and optional components, with examples (3-4 sentences).<br>اشرح الفرق بين المكونات الأساسية والاختيارية، بأمثلة (٣-٤ جمل).", "key": "tefl-25:1", "a": "Essential components are the ones no lesson plan can work without: information about the learners, the main aim, stage aims, procedures, and materials. Optional components strengthen the plan when they are useful, but a lesson can run without them. For example, timings, homework, and reserve tasks are optional. A teacher who knows the class well may skip assumed knowledge, while one covering for a colleague should include everything.<br>المكونات الأساسية هي اللي مفيش خطة درس تشتغل من غيرها: معلومات عن المتعلمين، الهدف الرئيسي، أهداف المراحل، الإجراءات، والخامات. المكونات الاختيارية بتقوّي الخطة لما تفيد، بس الدرس يقدر يشتغل من غيرها. مثال، التوقيتات والواجب والمهام الاحتياطية اختيارية. مدرس عارف الفصل كويس ممكن يتخطى المعرفة المفترضة، بينما اللي بيغطي لزميل المفروض يدخّل كل حاجة.", "n": 1, "i": 54, "h": ""}, {"t": "write", "q": "Show how one component question leads to the next in planning (3-4 sentences).<br>ورّي إزاي سؤال مكوّن واحد بيقود للي بعده في التخطيط (٣-٤ جمل).", "key": "tefl-25:2", "a": "Start with the learners: who are they and what level? Their assumed knowledge then tells you what the main aim can realistically be. The main aim breaks into stage aims, and each stage aim demands a procedure, an activity that achieves it. Procedures then force the remaining questions: how long each stage takes, what might go wrong, and what you will do if students finish early. Each answer makes the next question sharper.<br>ابدأ بالمتعلمين: مين هما ومستواهم إيه؟ معرفتهم المفترضة بتقولك الهدف الرئيسي يقدر يبقى إيه بواقعية. الهدف الرئيسي بيتقسم لأهداف مراحل، وكل هدف مرحلة بيطلب إجراء، نشاط بيحققه. الإجراءات بعد كده بتفرض الأسئلة الباقية: كل مرحلة بتاخد قد إيه، إيه اللي ممكن يحصل غلط، وهتعمل إيه لو الطلبة خلصوا بدري. كل إجابة بتخلّي السؤال اللي بعده أحد.", "n": 1, "i": 55, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 3, planning an individual lesson, comparing two real lesson procedures.</div><div class=\"u\">الدرس الجاي: الوحدة التالتة، تخطيط درس فردي، مقارنة بين إجراءين حقيقيين لدروس.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 56}];</script>
