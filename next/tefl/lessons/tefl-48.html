<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤٨</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-48";window.STEPS=[{"t": "section", "h": "Why strategies matter | ليه الاستراتيجيات مهمة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">To operate effectively, your students need a wide variety of writing strategies and activities, made interesting, productive, enjoyable and fun, but not too much fun with young adults and adults.</div><div class=\"u\">عشان يشتغلوا بفاعلية، طلبتك محتاجين تشكيلة واسعة من استراتيجيات وأنشطة الكتابة، متعمولة بشكل ممتع ومنتج ومسلي، بس مش مسلي أوي مع الشباب والكبار.</div>", "n": 1, "i": 1, "a": "tefl-48-001", "x": "52b0cf46"}, {"t": "learn", "h": "<div class=\"u\">Research seems to show that many learners do not use many strategies when writing in a second language. The reasons are not clear.</div><div class=\"u\">البحث باين إنه بيوضّح إن متعلمين كتير مابيستخدموش استراتيجيات كتير لما بيكتبوا بلغة تانية. الأسباب مش واضحة.</div>", "n": 1, "i": 2, "a": "tefl-48-002", "x": "30348984"}, {"t": "learn", "h": "<div class=\"u\">Here are strategies some learners do use, which you can introduce to learners who have few or none.</div><div class=\"u\">دي استراتيجيات بعض المتعلمين بيستخدموها، تقدر تقدّمها للمتعلمين اللي معندهمش استراتيجيات أو عندهم قليل.</div>", "n": 1, "i": 3, "a": "tefl-48-003", "x": "f7c0ffbc"}, {"t": "section", "h": "Learner strategies one to five | استراتيجيات المتعلم من ١ لـ ٥", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">Strategy one: rewriting spelling patterns, to embed the word structure in their mind.</div><div class=\"u\">الاستراتيجية الأولى: إعادة كتابة أنماط التهجية، عشان تركيب الكلمة يثبت في دماغهم.</div>", "n": 1, "i": 5, "a": "tefl-48-004", "x": "8583f469"}, {"t": "learn", "h": "<div class=\"u\">Strategy two: copying pieces of text.</div><div class=\"u\">الاستراتيجية التانية: نسخ قطع من النصوص.</div>", "n": 1, "i": 6, "a": "tefl-48-005", "x": "f4042a86"}, {"t": "learn", "h": "<div class=\"u\">Strategy three: writing numerous sentences with the structures they have newly studied.</div><div class=\"u\">الاستراتيجية التالتة: كتابة جمل كتير بالتراكيب اللي لسه دارسينها.</div>", "n": 1, "i": 7, "a": "tefl-48-006", "x": "992a3266"}, {"t": "learn", "h": "<div class=\"u\">Strategy four: practising by translating a piece from their first language into English, and sometimes using a translator tool to check it.</div><div class=\"u\">الاستراتيجية الرابعة: التدريب بترجمة قطعة من لغتهم الأولى للإنجليزي، وأحيانًا استخدام أداة ترجمة للتأكد منها.</div>", "n": 1, "i": 8, "a": "tefl-48-007", "x": "427e74d6"}, {"t": "learn", "h": "<div class=\"u\">Strategy five: note-taking, to increase their practice in writing.</div><div class=\"u\">الاستراتيجية الخامسة: تدوين الملاحظات، عشان يزوّدوا تدريبهم في الكتابة.</div>", "n": 1, "i": 9, "a": "tefl-48-008", "x": "ff289a1a"}, {"t": "section", "h": "Learner strategies six to ten | استراتيجيات المتعلم من ٦ لـ ١٠", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">Strategy six: seeking amusing punctuation examples, where the punctuation changes the meaning, so they grasp the difference punctuation can make.</div><div class=\"u\">الاستراتيجية السادسة: دوّر على أمثلة ترقيم مضحكة، اللي الترقيم فيها بيغيّر المعنى، عشان يستوعبوا الفرق اللي الترقيم ممكن يعمله.</div>", "n": 1, "i": 11, "a": "tefl-48-009", "x": "471dc6fa"}, {"t": "learn", "h": "<div class=\"u\">Strategy seven: writing word connections and phrases down for later use.</div><div class=\"u\">الاستراتيجية السابعة: تدوين روابط الكلمات والعبارات للاستخدام بعدين.</div>", "n": 1, "i": 12, "a": "tefl-48-010", "x": "3054212a"}, {"t": "learn", "h": "<div class=\"u\">Strategy eight: consulting textbooks and dictionaries.</div><div class=\"u\">الاستراتيجية التامنة: الرجوع للكتب الدراسية والقواميس.</div>", "n": 1, "i": 13, "a": "tefl-48-011", "x": "1019ac9d"}, {"t": "learn", "h": "<div class=\"u\">Strategy nine: summarising a larger piece of text.</div><div class=\"u\">الاستراتيجية التاسعة: تلخيص قطعة نص أكبر.</div>", "n": 1, "i": 14, "a": "tefl-48-012", "x": "949f6285"}, {"t": "learn", "h": "<div class=\"u\">Strategy ten: highlighting little chunks of language they can later use in writing.</div><div class=\"u\">الاستراتيجية العاشرة: تظليل قطع صغيرة من اللغة يقدروا يستخدموها بعدين في الكتابة.</div>", "n": 1, "i": 15, "a": "tefl-48-013", "x": "ca5f2eb2"}, {"t": "section", "h": "Motivating writers, part one | تحفيز الكتّاب، جزء أول", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">Beyond making students aware of strategies, what can you do to drive them to perform better in writing?</div><div class=\"u\">بعد ما تخلّي الطلبة واعيين بالاستراتيجيات، إيه اللي تقدر تعمله عشان تدفّعهم يأدّوا أحسن في الكتابة؟</div>", "n": 1, "i": 17, "a": "tefl-48-014", "x": "7f558c3a"}, {"t": "learn", "h": "<div class=\"u\">Let students know that you value good writing. This may inspire them.</div><div class=\"u\">خلّي الطلبة يعرفوا إنك بتقدّر الكتابة الكويسة. ده ممكن يلهمهم.</div>", "n": 1, "i": 18, "a": "tefl-48-015", "x": "c5318e80"}, {"t": "learn", "h": "<div class=\"u\">Regularly assign brief writing pieces in class and for homework, not just filling in the blanks.</div><div class=\"u\">بانتظام كلّفهم بقطع كتابة قصيرة في الفصل وللواجب، مش بس ملء الفراغات.</div>", "n": 1, "i": 19, "a": "tefl-48-016", "x": "856118b9"}, {"t": "learn", "h": "<div class=\"u\">Draw up some short writing guidelines. Students welcome handouts that give them specific instructions.</div><div class=\"u\">اعمل إرشادات كتابة قصيرة. الطلبة بيرحّبوا بالمطبوعات اللي بتدّيهم تعليمات محددة.</div>", "n": 1, "i": 20, "a": "tefl-48-017", "x": "1dd953aa"}, {"t": "learn", "h": "<div class=\"u\">Remind students that you were exactly the same when you were learning to write in a foreign language, but you stuck at it. Share your own struggles with difficult topics.</div><div class=\"u\">فكّر الطلبة إنك كنت نفس الحاجة بالظبط وإنت بتتعلّم تكتب بلغة أجنبية، بس كمّلت. شاركهم معاناتك مع المواضيع الصعبة.</div>", "n": 1, "i": 21, "a": "tefl-48-018", "x": "8a832001"}, {"t": "learn", "h": "<div class=\"u\">Give students opportunities to talk about their writing. Take five or ten minutes of class time for students to read their writing to each other in small groups or pairs.</div><div class=\"u\">ادّي الطلبة فرص يتكلموا عن كتابتهم. خد خمس أو عشر دقايق من وقت الفصل عشان الطلبة يقرأوا كتابتهم لبعض في مجموعات صغيرة أو أزواج.</div>", "n": 1, "i": 22, "a": "tefl-48-019", "x": "03576b81"}, {"t": "learn", "h": "<div class=\"u\">It is important for students to hear what their peers have written.</div><div class=\"u\">مهم الطلبة يسمعوا اللي زمايلهم كتبوه.</div>", "n": 1, "i": 23, "a": "tefl-48-020", "x": "f84c48d6"}, {"t": "section", "h": "Motivating writers, part two | تحفيز الكتّاب، جزء تاني", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Emphasise that good writing skills are important, both to complete the unit satisfactorily and for their future careers.</div><div class=\"u\">أكّد إن مهارات الكتابة الكويسة مهمة، سواء لإتمام الوحدة بشكل مرضي أو لمستقبلهم المهني.</div>", "n": 1, "i": 25, "a": "tefl-48-021", "x": "d2ee0167"}, {"t": "learn", "h": "<div class=\"u\">Give adult students an anecdote about the implications of substandard writing: for example, a job candidate who missed selection because of his poor writing.</div><div class=\"u\">احكي للطلبة الكبار قصة عن تبعات الكتابة الرديئة: مثلاً، مرشّح لوظيفة ضيّع الاختيار بسبب كتابته الضعيفة.</div>", "n": 1, "i": 26, "a": "tefl-48-022", "x": "1e53b245"}, {"t": "learn", "h": "<div class=\"u\">Read aloud quality writing done by a former student, and encourage students to listen to its flow.</div><div class=\"u\">اقرا بصوت عالي كتابة عالية الجودة لطالب سابق، وشجّع الطلبة يسمعوا تدفقها.</div>", "n": 1, "i": 27, "a": "tefl-48-023", "x": "d375d81d"}, {"t": "learn", "h": "<div class=\"u\">Encourage students to pay close attention to the grammar and punctuation they see in textbooks and other books and articles.</div><div class=\"u\">شجّع الطلبة يدّوا انتباه قوي للقواعد والترقيم اللي بيشوفوه في الكتب الدراسية والكتب والمقالات التانية.</div>", "n": 1, "i": 28, "a": "tefl-48-024", "x": "80279d7a"}, {"t": "learn", "h": "<div class=\"u\">Provide students with poorly structured sentences from assignments of prior years. Ask them to improve the sentences, then discuss the improvements as a class.</div><div class=\"u\">ادّي الطلبة جمل مهيكلة بشكل وحش من واجبات سنين سابقة. اطلب منهم يحسّنوا الجمل، وبعدين ناقشوا التحسينات كفصل.</div>", "n": 1, "i": 29, "a": "tefl-48-025", "x": "99f58d1d"}, {"t": "section", "h": "Activities one and two | النشاط الأول والتاني", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Now the activities. Choose passages, topics and exercises that are participative, interesting and good fun.</div><div class=\"u\">دلوقتي الأنشطة. اختار نصوص ومواضيع وتمارين تشاركية وممتعة ومسلية.</div>", "n": 1, "i": 31, "a": "tefl-48-026", "x": "5dc2e944"}, {"t": "learn", "h": "<div class=\"u\">Activity one: copying text, for beginners.</div><div class=\"u\">النشاط الأول: نسخ نص، للمبتدئين.</div>", "n": 1, "i": 32, "a": "tefl-48-027", "x": "4c3e9792"}, {"t": "learn", "h": "<div class=\"u\">Activity two: grouping. Give learners three headings, say classroom, my kitchen and a fruit shop, plus a separate list of words like teacher, fridge, tap and banana.</div><div class=\"u\">النشاط التاني: التصنيف. ادّي المتعلمين تلات عناوين، مثلاً الفصل ومطبخي ومحل فاكهة، زائد قائمة منفصلة بكلمات زي مدرس وتلاجة وحنفية وموز.</div>", "n": 1, "i": 33, "a": "tefl-48-028", "x": "d57baa0c"}, {"t": "learn", "h": "<div class=\"u\">They write the right words under the right heading.</div><div class=\"u\">هما يكتبوا الكلمات الصح تحت العنوان الصح.</div>", "n": 1, "i": 34, "a": "tefl-48-029", "x": "f076625e"}, {"t": "learn", "h": "<div class=\"u\">You can expand this with a question-mark heading, where they write silly words from your list that cannot fit under the other headings, like a blue elephant or a square football.</div><div class=\"u\">تقدر توسّع ده بعنوان علامة استفهام، يكتبوا تحته الكلمات المضحكة من قائمتك اللي مابتدخلش تحت العناوين التانية، زي فيل أزرق أو كورة مربعة.</div>", "n": 1, "i": 35, "a": "tefl-48-030", "x": "1ba28762"}, {"t": "section", "h": "Substitution and matching tables | جداول الاستبدال والمطابقة", "n": 1, "i": 36}, {"t": "learn", "h": "<div class=\"u\">Activity three: substitution tables. Learners take one item from each box to create and write a new sentence.</div><div class=\"u\">النشاط التالت: جداول الاستبدال. المتعلمين بياخدوا عنصر واحد من كل خانة عشان يكوّنوا ويكتبوا جملة جديدة.</div>", "n": 1, "i": 37, "a": "tefl-48-031", "x": "5d02cdda"}, {"t": "learn", "h": "<div class=\"u\">With a correctly prepared substitution table, as long as learners select one item from each box, they will always write a grammatically correct sentence.</div><div class=\"u\">مع جدول استبدال متجهّز صح، طول ما المتعلمين بيختاروا عنصر واحد من كل خانة، دايمًا هيكتبوا جملة صح قواعديًا.</div>", "n": 1, "i": 38, "a": "tefl-48-032", "x": "ae09f455"}, {"t": "learn", "h": "<div class=\"u\">For example: the old, poor or tall man or woman is carrying or buying a black, brown or blue coat, hat or walking stick.</div><div class=\"u\">مثال: الراجل أو الست العجوز أو الفقير أو الطويل بيحمل أو بيشتري معطف أو برنيطة أو عصاية سودا أو بنية أو زرقا.</div>", "n": 1, "i": 39, "a": "tefl-48-033", "x": "f01b8784"}, {"t": "learn", "h": "<div class=\"u\">Activity four: matching tables. This requires learners to think very carefully before they match items and write a sentence.</div><div class=\"u\">النشاط الرابع: جداول المطابقة. ده بيطلب من المتعلمين يفكّروا بعناية جدًا قبل ما يطابقوا العناصر ويكتبوا جملة.</div>", "n": 1, "i": 40, "a": "tefl-48-034", "x": "f782ddc3"}, {"t": "learn", "h": "<div class=\"u\">The result will be incorrect in grammar or meaning unless they select very carefully. This is not just copying: it requires thinking about meaning and accuracy.</div><div class=\"u\">النتيجة هتبقى غلط في القواعد أو المعنى لو ماختاروش بعناية جدًا. ده مش بس نسخ: بيطلب تفكير في المعنى والدقة.</div>", "n": 1, "i": 41, "a": "tefl-48-035", "x": "b504f8b3"}, {"t": "learn", "h": "<div class=\"u\">For example: the boy, girl or children visit or visits her, his or their elderly or young children, grandparents or friend every day, week or month.</div><div class=\"u\">مثال: الولد أو البنت أو الأولاد بيزوروا أبوهم أو أمهم أو جدهم وجدتهم كل يوم أو أسبوع أو شهر.</div>", "n": 1, "i": 42, "a": "tefl-48-036", "x": "cdac368b"}, {"t": "section", "h": "Gap filling and charts | ملء الفراغات والجداول", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Activity five: gap filling. Learners complete sentences using appropriate words, often filling the gaps with the correct vocabulary or tense.</div><div class=\"u\">النشاط الخامس: ملء الفراغات. المتعلمين بيكمّلوا جمل بكلمات مناسبة، غالبًا بيملوا الفراغات بالمفردات أو الزمن الصح.</div>", "n": 1, "i": 44, "a": "tefl-48-037", "x": "40bd2e1b"}, {"t": "learn", "h": "<div class=\"u\">For example, using the verb base to form the correct tense: Thomas enjoys swimming in the clear, blue sea every morning. Maria is working in the shop today.</div><div class=\"u\">مثال، استخدام الفعل الأساسي لتكوين الزمن الصح: توماس بيستمتع بالسباحة في البحر الأزرق الصافي كل صبح. ماريا شغالة في المحل النهارده.</div>", "n": 1, "i": 45, "a": "tefl-48-038", "x": "5c1a0289"}, {"t": "learn", "h": "<div class=\"u\">Activity six: tables and charts. These work very effectively in writing exercises, and the work can be designed around the learners themselves for a more personal task.</div><div class=\"u\">النشاط السادس: الجداول والرسوم. دي بتشتغل بفاعلية جدًا في تمارين الكتابة، والشغل ممكن يتصمم حوالين المتعلمين نفسهم عشان مهمة أشخص.</div>", "n": 1, "i": 46, "a": "tefl-48-039", "x": "ea1ce727"}, {"t": "learn", "h": "<div class=\"u\">For example, learners survey or interview five other learners and list information in a table with the headings: name, sisters, brothers, hobby and pets.</div><div class=\"u\">مثال، المتعلمين بيعملوا استبيان أو مقابلة مع خمس متعلمين تانيين ويسجّلوا المعلومة في جدول بعناوين: الاسم، الأخوات، الإخوة، الهواية والحيوانات الأليفة.</div>", "n": 1, "i": 47, "a": "tefl-48-040", "x": "b73cce0b"}, {"t": "learn", "h": "<div class=\"u\">Then they produce sentences about the other five orally, and then write them.</div><div class=\"u\">وبعدين ينتجوا جمل عن الخمسة شفهيًا، وبعدين يكتبوها.</div>", "n": 1, "i": 48, "a": "tefl-48-041", "x": "3ee7a6b9"}, {"t": "section", "h": "Reordering and completion | إعادة الترتيب والإكمال", "n": 1, "i": 49}, {"t": "learn", "h": "<div class=\"u\">Activity seven: reordering. Young learners get a sentence with a word in the wrong place and rewrite it so it makes sense: I like to the guitar play.</div><div class=\"u\">النشاط السابع: إعادة الترتيب. الصغيرين بياخدوا جملة فيها كلمة في المكان الغلط ويعيدوا كتابتها عشان تبقى مفهومة: أنا بحب أعزف الجيتار بس مكتوبة متلخبطة.</div>", "n": 1, "i": 50, "a": "tefl-48-042", "x": "2d4303e4"}, {"t": "learn", "h": "<div class=\"u\">Teenagers and adults, when ready, can reorder whole sentences into a story. For example, the haunted house set.</div><div class=\"u\">المراهقين والكبار، لما يبقوا جاهزين، يقدروا يعيدوا ترتيب جمل كاملة في قصة. مثال، مجموعة البيت المسكون.</div>", "n": 1, "i": 51, "a": "tefl-48-043", "x": "be8f87f4"}, {"t": "learn", "h": "<div class=\"u\">One: they decided to walk to the top of the hill. Two: when they reached the top, they saw the haunted house.</div><div class=\"u\">واحد: قرروا يمشوا لقمة التل. اتنين: لما وصلوا القمة، شافوا البيت المسكون.</div>", "n": 1, "i": 52, "a": "tefl-48-044", "x": "c969aa14"}, {"t": "learn", "h": "<div class=\"u\">Three: the old, rusted gate creaked as they walked towards the door. Four: suddenly, on reaching the door, they heard a noise coming from inside.</div><div class=\"u\">تلاتة: البوابة العتيقة الصدية صرّت وهما ماشيين ناحية الباب. أربعة: فجأة، عند وصول الباب، سمعوا صوت جاي من جوه.</div>", "n": 1, "i": 53, "a": "tefl-48-045", "x": "7c1009e4"}, {"t": "learn", "h": "<div class=\"u\">Activity eight: sentence completion. Learners may get alternatives to choose from, or they may have to decide how to complete the sentences themselves.</div><div class=\"u\">النشاط التامن: إكمال الجمل. المتعلمين ممكن ياخدوا بدائل يختاروا منها، أو ممكن يضطروا يقرروا بأنفسهم يكمّلوا الجمل إزاي.</div>", "n": 1, "i": 54, "a": "tefl-48-046", "x": "09d8123c"}, {"t": "learn", "h": "<div class=\"u\">For example: I wonder if they arrived tomorrow, they will arrive tomorrow, or they have arrived tomorrow. Only the second one works.</div><div class=\"u\">مثال: أنا متسائل لو هيوصلوا بكرة. بس الصيغة بالمستقبل هي اللي بتنفع.</div>", "n": 1, "i": 55, "a": "tefl-48-047", "x": "3c8c81bb"}, {"t": "section", "h": "Transformations to picture essays | من التحويلات للمقالات المصورة", "n": 1, "i": 56}, {"t": "learn", "h": "<div class=\"u\">Activity nine: transformations. Learners alter an existing passage according to specific instructions, like changing it from positive to negative or from present to past.</div><div class=\"u\">النشاط التاسع: التحويلات. المتعلمين بيغيّروا قطعة موجودة حسب تعليمات محددة، زي تحويلها من مثبت لمنفي أو من مضارع لماضي.</div>", "n": 1, "i": 57, "a": "tefl-48-048", "x": "dc52f7c1"}, {"t": "learn", "h": "<div class=\"u\">Activity ten: dictation. Make sure learners are already familiar with the text, perhaps from previous readings. If you use a recording, make sure it is clear.</div><div class=\"u\">النشاط العاشر: الإملاء. اتأكد إن المتعلمين عارفين النص خلاص، ممكن من قرايات سابقة. لو هتستخدم تسجيل، اتأكد إنه واضح.</div>", "n": 1, "i": 58, "a": "tefl-48-049", "x": "b816157b"}, {"t": "learn", "h": "<div class=\"u\">Do not be afraid to try recordings where the speaker has an accent, as long as the words are clear. Accents are a key part of the real world.</div><div class=\"u\">ماتخافش تجرب تسجيلات المتكلم فيها بلكنة، طول ما الكلمات واضحة. اللكنات جزء أساسي من العالم الحقيقي.</div>", "n": 1, "i": 59, "a": "tefl-48-050", "x": "3e5aff36"}, {"t": "learn", "h": "<div class=\"u\">Activity eleven: short essays based on pictures. For younger learners, use an explicit, uncomplicated picture, like a cat chasing a mouse.</div><div class=\"u\">النشاط الحداشر: مقالات قصيرة مبنية على صور. للمتعلمين الصغيرين، استخدم صورة واضحة وبسيطة، زي قطة بتجري ورا فار.</div>", "n": 1, "i": 60, "a": "tefl-48-051", "x": "b40ce490"}, {"t": "learn", "h": "<div class=\"u\">For older learners, use several pictures from which they deduce what happened.</div><div class=\"u\">للمتعلمين الكبار، استخدم كذا صورة يستنتجوا منها اللي حصل.</div>", "n": 1, "i": 61, "a": "tefl-48-052", "x": "9749f787"}, {"t": "learn", "h": "<div class=\"u\">For example: a schoolboy misses the bus and arrives late, as the school clock shows. The teacher gives him a row.</div><div class=\"u\">مثال: تلميذ فاتته الأتوبيس ووصل متأخر، زي ما ساعة المدرسة بتوري. المدرس بيعنّفه.</div>", "n": 1, "i": 62, "a": "tefl-48-053", "x": "2a2855b4"}, {"t": "learn", "h": "<div class=\"u\">Back home, a parent holds up a newspaper saying buses are late today. The boy takes the newspaper to school, and the teacher looks apologetic.</div><div class=\"u\">في البيت، ولي أمر رافع جورنال مكتوب فيه الأتوبيسات متأخرة النهارده. الولد واخد الجورنال المدرسة، والمدرس باين عليه الاعتذار.</div>", "n": 1, "i": 63, "a": "tefl-48-054", "x": "279994fa"}, {"t": "section", "h": "Dialogues, letters, predictions | الحوارات والخطابات والتوقعات", "n": 1, "i": 64}, {"t": "learn", "h": "<div class=\"u\">Activity twelve: dialogues. Give learners half of a dialogue and let them use their own words to complete the conversation.</div><div class=\"u\">النشاط الاتناشر: الحوارات. ادّي المتعلمين نص حوار وسيّبهم يستخدموا كلماتهم هم عشان يكمّلوا المحادثة.</div>", "n": 1, "i": 65, "a": "tefl-48-055", "x": "ebae7ed8"}, {"t": "learn", "h": "<div class=\"u\">For example: what is your favourite food? I don't like them, I like pears. I've never liked apples because they're sometimes sour.</div><div class=\"u\">مثال: إيه أكلك المفضل؟ مابحبهومش، أنا بحب الكمثرى. عمري ما حبيت التفاح لأنه أحيانًا بيبقى حامض.</div>", "n": 1, "i": 66, "a": "tefl-48-056", "x": "2a17d902"}, {"t": "learn", "h": "<div class=\"u\">Activity thirteen: letters. Informal mostly for younger learners; older learners may be ready for a slightly more formal letter.</div><div class=\"u\">النشاط التلتاشر: الخطابات. غير رسمية غالبًا للمتعلمين الصغيرين؛ الكبار ممكن يبقوا جاهزين لخطاب أرسم شوية.</div>", "n": 1, "i": 67, "a": "tefl-48-057", "x": "8b72ba59"}, {"t": "learn", "h": "<div class=\"u\">Where possible, ask the head of department if you can pop the letters in the school's mail basket, with the school providing the stamps. Or take the class to the post office if it is not too far.</div><div class=\"u\">لو ممكن، اسأل رئيس القسم لو تقدر تحط الخطابات في سلة البريد بتاعة المدرسة، والمدرسة توفر الطوابع. أو ودّي الفصل لمكتب البريد لو مش بعيد.</div>", "n": 1, "i": 68, "a": "tefl-48-058", "x": "a301b8c0"}, {"t": "learn", "h": "<div class=\"u\">Get them to write a suitable letter to their parents or carers. The students will be really happy and inspired when the parents thank them for the wonderful letter.</div><div class=\"u\">خلّيهم يكتبوا خطاب مناسب لأهلهم أو القائمين عليهم. الطلبة هيبقوا مبسوطين وملهمين جدًا لما الأهل يشكروهم على الخطاب الجميل.</div>", "n": 1, "i": 69, "a": "tefl-48-059", "x": "2398d7ea"}, {"t": "learn", "h": "<div class=\"u\">Activity fourteen: writing predictions. For young learners, predicting what happens next in a story is usually done orally. With older learners, it can be done in writing.</div><div class=\"u\">النشاط الأربعتاشر: كتابة التوقعات. للمتعلمين الصغيرين، توقع اللي هيحصل بعد كده في القصة عادة بيتعمل شفهيًا. مع الكبار، ممكن يتعمل كتابة.</div>", "n": 1, "i": 70, "a": "tefl-48-060", "x": "52cbe8ad"}, {"t": "learn", "h": "<div class=\"u\">At various points in a story, stop and ask them to write their prediction of what happens next. You can also use a suitable video, stopping it at relevant parts for written predictions.</div><div class=\"u\">في نقاط مختلفة من القصة، وقّف واسألهم يكتبوا توقعهم لإيه اللي هيحصل بعد كده. تقدر كمان تستخدم فيديو مناسب، توقفه في الأجزاء المناسبة للتوقعات المكتوبة.</div>", "n": 1, "i": 71, "a": "tefl-48-061", "x": "a1caf89c"}, {"t": "section", "h": "Projects | المشاريع", "n": 1, "i": 72}, {"t": "learn", "h": "<div class=\"u\">Activity fifteen: projects. Suitable for older learners. In groups, they collate and write down information from short interviews and surveys in the school.</div><div class=\"u\">النشاط الخمستاشر: المشاريع. مناسبة للمتعلمين الكبار. في مجموعات، بيجمّعوا ويكتبوا معلومات من مقابلات واستبيانات قصيرة في المدرسة.</div>", "n": 1, "i": 73, "a": "tefl-48-062", "x": "f34a33a6"}, {"t": "learn", "h": "<div class=\"u\">For example, they could interview some teachers about what they like doing in their spare time.</div><div class=\"u\">مثال، ممكن يعملوا مقابلات مع شوية مدرسين عن بيحبوا يعملوا إيه في وقت فراغهم.</div>", "n": 1, "i": 74, "a": "tefl-48-063", "x": "d0b8b11b"}, {"t": "learn", "h": "<div class=\"u\">Then you guide them to collate and group the information under headings, showing the most and least popular likes.</div><div class=\"u\">وبعدين إنت بترشدهم يجمّعوا ويصنّفوا المعلومات تحت عناوين، بتوضّح الأكثر والأقل شعبية.</div>", "n": 1, "i": 75, "a": "tefl-48-064", "x": "5b30f253"}, {"t": "learn", "h": "<div class=\"u\">To make it more interesting, ask learners to predict and write down the top three likes before the survey. The person whose prediction is closest could get a small prize.</div><div class=\"u\">عشان تخليها أشوق، اطلب من المتعلمين يتوقعوا ويكتبوا أعلى تلاتة إعجابات قبل الاستبيان. الشخص اللي توقعه الأقرب ممكن ياخد جايزة صغيرة.</div>", "n": 1, "i": 76, "a": "tefl-48-065", "x": "1f1aca80"}, {"t": "learn", "h": "<div class=\"u\">Or, in groups, they could design a holiday leaflet or mini-brochure.</div><div class=\"u\">أو، في مجموعات، ممكن يصمّموا مطوية أجازة أو بروشور صغير.</div>", "n": 1, "i": 77, "a": "tefl-48-066", "x": "a1383e5b"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 78}, {"t": "learn", "h": "<div class=\"u\">substitution table: boxes of items; pick one from each to build a correct sentence.</div><div class=\"u\">جدول الاستبدال: خانات عناصر؛ اختار واحد من كل خانة عشان تبني جملة صح.</div>", "n": 1, "i": 79, "a": "tefl-48-067", "x": "6d7fd2f4"}, {"t": "learn", "h": "<div class=\"u\">matching table: a table where only careful choices make a correct sentence.</div><div class=\"u\">جدول المطابقة: جدول بس الاختيارات الدقيقة بتعمل جملة صح.</div>", "n": 1, "i": 80, "a": "tefl-48-068", "x": "b79fd7c6"}, {"t": "learn", "h": "<div class=\"u\">gap filling: completing sentences with the correct words or tense.</div><div class=\"u\">ملء الفراغات: إكمال الجمل بالكلمات أو الزمن الصح.</div>", "n": 1, "i": 81, "a": "tefl-48-069", "x": "dbc9d119"}, {"t": "learn", "h": "<div class=\"u\">transformation: rewriting a passage by a rule, like present to past.</div><div class=\"u\">التحويل: إعادة كتابة قطعة بقاعدة، زي من مضارع لماضي.</div>", "n": 1, "i": 82, "a": "tefl-48-070", "x": "ce2f37c2"}, {"t": "learn", "h": "<div class=\"u\">dictation: writing down what you hear.</div><div class=\"u\">الإملاء: كتابة اللي بتسمعه.</div>", "n": 1, "i": 83, "a": "tefl-48-071", "x": "8a929785"}, {"t": "learn", "h": "<div class=\"u\">prediction: saying or writing what you think happens next.</div><div class=\"u\">التوقع: قول أو كتابة اللي فاكر هيحصل بعد كده.</div>", "n": 1, "i": 84, "a": "tefl-48-072", "x": "a01e2dab"}, {"t": "learn", "h": "<div class=\"u\">project: a bigger group task that collects and presents information.</div><div class=\"u\">المشروع: مهمة جماعية أكبر بتجمّع وتقدّم معلومات.</div>", "n": 1, "i": 85, "a": "tefl-48-073", "x": "3a925946"}, {"t": "learn", "h": "<div class=\"u\">guidelines: a short handout of specific writing instructions.</div><div class=\"u\">الإرشادات: مطبوعة قصيرة بتعليمات كتابة محددة.</div>", "n": 1, "i": 86, "a": "tefl-48-074", "x": "feb74b94"}, {"t": "learn", "h": "<div class=\"u\">punctuation: marks like full stops and commas that shape meaning.</div><div class=\"u\">الترقيم: علامات زي النقط والفواصل بتشكّل المعنى.</div>", "n": 1, "i": 87, "a": "tefl-48-075", "x": "da52a038"}, {"t": "learn", "h": "<div class=\"u\">summary: a short version of a longer text.</div><div class=\"u\">الملخص: نسخة قصيرة من نص أطول.</div>", "n": 1, "i": 88, "a": "tefl-48-076", "x": "fa082306"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 89}, {"t": "learn", "h": "<div class=\"u\">Many learners use few writing strategies in a second language; teach them ones like spelling-pattern rewriting, translation practice, note-taking and punctuation play.</div><div class=\"u\">متعلمين كتير بيستخدموا استراتيجيات كتابة قليلة بلغة تانية؛ علّمهم استراتيجيات زي إعادة كتابة أنماط التهجية وتدريب الترجمة وتدوين الملاحظات واللعب بالترقيم.</div>", "n": 1, "i": 90, "a": "tefl-48-077", "x": "a9e200a2"}, {"t": "learn", "h": "<div class=\"u\">Motivate writers by valuing their work, assigning real short pieces, sharing your own struggles, and letting them read their writing aloud to each other.</div><div class=\"u\">حفّز الكتّاب بتقدير شغلهم، وتكليفهم بقطع قصيرة حقيقية، ومشاركة معاناتك، وخلّيهم يقرأوا كتابتهم بصوت عالي لبعض.</div>", "n": 1, "i": 91, "a": "tefl-48-078", "x": "7c876c08"}, {"t": "learn", "h": "<div class=\"u\">Substitution tables guarantee grammar; matching tables demand thinking about meaning and accuracy.</div><div class=\"u\">جداول الاستبدال بتضمن القواعد؛ جداول المطابقة بتطلب تفكير في المعنى والدقة.</div>", "n": 1, "i": 92, "a": "tefl-48-079", "x": "5d09c132"}, {"t": "learn", "h": "<div class=\"u\">The fifteen activities run from copying, grouping and gap filling to predictions, letters and group projects.</div><div class=\"u\">الخمستاشر نشاط بيمشوا من النسخ والتصنيف وملء الفراغات للتوقعات والخطابات والمشاريع الجماعية.</div>", "n": 1, "i": 93, "a": "tefl-48-080", "x": "2f9db55f"}, {"t": "learn", "h": "<div class=\"u\">Make writing real: post actual letters, survey real people, and let students hear quality writing read aloud.</div><div class=\"u\">خلّي الكتابة حقيقية: ابعت خطابات فعلية، اعمل استبيانات على ناس حقيقيين، وخلّي الطلبة يسمعوا كتابة عالية الجودة بصوت عالي.</div>", "n": 1, "i": 94, "a": "tefl-48-081", "x": "7a8161e6"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 95}, {"t": "mc", "q": "Which learner strategy embeds word structure in the mind?<br>أنهي استراتيجية متعلم بتثبّت تركيب الكلمة في الدماغ؟", "opts": ["rewriting spelling patterns | إعادة كتابة أنماط التهجية", "reading lines backwards | قراية الأسطر بالعكس", "skimming a text | تقليب نص بسرعة"], "ans": 0, "why": "Rewriting spelling patterns fixes the shape of words in memory. | إعادة كتابة أنماط التهجية بتثبّت شكل الكلمات في الذاكرة.", "ex": ["Correct. | صح.", "No. That is a proofreading technique. | غلط: دي تقنية تدقيق.", "No. That is a reading technique. | غلط: دي تقنية قراية."], "n": 1, "i": 96, "h": ""}, {"t": "mc", "q": "Why seek amusing punctuation examples?<br>ليه ندوّر على أمثلة ترقيم مضحكة؟", "opts": ["because punctuation can change the meaning | لأن الترقيم ممكن يغيّر المعنى", "because commas are funny | لأن الفواصل مضحكة", "because students hate grammar | لأن الطلبة بيكرهوا القواعد"], "ans": 0, "why": "Such examples show students the differences punctuation can make. | الأمثلة دي بتوري الطلبة الفروق اللي الترقيم ممكن يعملها.", "ex": ["Correct. | صح.", "No. The humour is a tool, not the point. | غلط: الضحك أداة مش الهدف.", "No. The point is meaning, not attitude. | غلط: الهدف المعنى مش الموقف."], "n": 1, "i": 97, "h": ""}, {"t": "tf", "q": "Matching tables are basically just copying.<br>جداول المطابقة في الأساس مجرد نسخ.", "ans": false, "why": "False. Unless learners select very carefully, the result is wrong in grammar or meaning; it requires thinking. | غلط. لو المتعلمين ماختاروش بعناية جدًا، النتيجة غلط في القواعد أو المعنى؛ ده بيطلب تفكير.", "ex": ["Correct. | صح.", "Wrong. Careful selection is the whole exercise. | غلط: الاختيار الدقيق هو التمرين كله."], "n": 1, "i": 98, "h": ""}, {"t": "mc", "q": "With a correctly prepared substitution table, picking one item from each box always gives:<br>مع جدول استبدال متجهّز صح، اختيار عنصر واحد من كل خانة دايمًا بيدّي:", "opts": ["a grammatically correct sentence | جملة صح قواعديًا", "a random sentence | جملة عشوائية", "a spelling test | اختبار إملاء"], "ans": 0, "why": "That is the design: any combination of one item per box is grammatical. | ده التصميم: أي تشكيلة من عنصر لكل خانة بتبقى صح قواعديًا.", "ex": ["Correct. | صح.", "No. Every combination is designed to be correct. | غلط: كل تشكيلة متصممة تبقى صح.", "No. It is a sentence-building exercise. | غلط: ده تمرين بناء جمل."], "n": 1, "i": 99, "h": ""}, {"t": "mc", "q": "In the grouping activity, the question-mark heading is for:<br>في نشاط التصنيف، عنوان علامة الاستفهام بيتعمل لإيه؟", "opts": ["silly words that fit under no other heading | الكلمات المضحكة اللي مابتدخلش تحت أي عنوان تاني", "the hardest vocabulary | أصعب مفردات", "the teacher's answers | إجابات المدرس"], "ans": 0, "why": "Words like a blue elephant or a square football go under the question mark. | كلمات زي فيل أزرق أو كورة مربعة بتروح تحت علامة الاستفهام.", "ex": ["Correct. | صح.", "No. It is for words that fit nowhere. | غلط: للكلمات اللي مالهاش مكان.", "No. Students fill every heading. | غلط: الطلبة بيملوا كل العناوين."], "n": 1, "i": 100, "h": ""}, {"t": "mc", "q": "What does the module say about accented speakers in dictation recordings?<br>الموديول بيقول إيه عن المتكلمين بلكنات في تسجيلات الإملاء؟", "opts": ["fine to use, as long as the words are clear | عادي نستخدمهم، طول ما الكلمات واضحة", "never use them | أبدًا ماتستخدمهمش", "only use them for adults | استخدمهم بس مع الكبار"], "ans": 0, "why": "Accents are a key part of the real world; just make sure the recording is clear and the text familiar. | اللكنات جزء أساسي من العالم الحقيقي؛ بس اتأكد إن التسجيل واضح والنص معروف.", "ex": ["Correct. | صح.", "No. Real-world accents are welcome if clear. | غلط: لكنات العالم الحقيقي مرحب بيها لو واضحة.", "No. Age is not the criterion here. | غلط: السن مش المعيار هنا."], "n": 1, "i": 101, "h": ""}, {"t": "mc", "q": "Which is an example of a transformation exercise?<br>أنهي مثال على تمرين تحويل؟", "opts": ["changing a passage from present to past | تحويل قطعة من مضارع لماضي", "copying a text word for word | نسخ نص كلمة كلمة", "labelling the parts of a bicycle | تسمية أجزاء عجلة"], "ans": 0, "why": "Transformations alter a passage by a rule: positive to negative, present to past. | التحويلات بتغيّر قطعة بقاعدة: من مثبت لمنفي، من مضارع لماضي.", "ex": ["Correct. | صح.", "No. That is copying. | غلط: ده نسخ.", "No. That is a vocabulary activity. | غلط: ده نشاط مفردات."], "n": 1, "i": 102, "h": ""}, {"t": "tf", "q": "Posting real letters to parents can make students happy and inspired.<br>إرسال خطابات حقيقية للأهل ممكن يخلي الطلبة مبسوطين وملهمين.", "ans": true, "why": "True. When parents thank them for the wonderful letter, the motivation is real. Use the school mail basket or a post office trip if possible. | صح. لما الأهل بيشكروهم على الخطاب الجميل، التحفيز بيبقى حقيقي. استخدم سلة بريد المدرسة أو مشوار مكتب البريد لو ممكن.", "ex": ["Correct. | صح.", "Wrong. Real audiences create real motivation. | غلط: الجمهور الحقيقي بيخلق تحفيز حقيقي."], "n": 1, "i": 103, "h": ""}, {"t": "recall", "q": "Name five writing strategies learners can use.<br>اذكر خمس استراتيجيات كتابة يقدر المتعلمين يستخدموها.", "a": "Any five of: rewriting spelling patterns; copying pieces of text; writing many sentences with new structures; translating from L1 into English; note-taking; collecting amusing punctuation examples; writing down word connections and phrases; consulting textbooks and dictionaries; summarising a larger text; highlighting useful chunks of language.<br>أي خمسة من: إعادة كتابة أنماط التهجية؛ نسخ قطع من النصوص؛ كتابة جمل كتير بالتراكيب الجديدة؛ الترجمة من اللغة الأولى للإنجليزي؛ تدوين الملاحظات؛ تجميع أمثلة الترقيم المضحكة؛ تدوين روابط الكلمات والعبارات؛ الرجوع للكتب والقواميس؛ تلخيص نص أكبر؛ تظليل قطع لغة مفيدة.", "n": 1, "i": 104, "h": ""}, {"t": "recall", "q": "Name five writing activities from this lesson.<br>اذكر خمس أنشطة كتابة من الدرس ده.", "a": "Any five of: copying text; grouping; substitution tables; matching tables; gap filling; tables and charts; reordering; sentence completion; transformations; dictation; picture essays; dialogues; letters; writing predictions; projects.<br>أي خمسة من: نسخ نص؛ التصنيف؛ جداول الاستبدال؛ جداول المطابقة؛ ملء الفراغات؛ الجداول والرسوم؛ إعادة الترتيب؛ إكمال الجمل؛ التحويلات؛ الإملاء؛ المقالات المصورة؛ الحوارات؛ الخطابات؛ كتابة التوقعات؛ المشاريع.", "n": 1, "i": 105, "h": ""}, {"t": "write", "q": "Why should students read their writing aloud to each other? (3-4 sentences)<br>ليه الطلبة المفروض يقرأوا كتابتهم بصوت عالي لبعض؟ (٣-٤ جمل).", "key": "tefl-48:1", "a": "Writing feels like an individual activity, so reading it aloud turns it into communication. It is important for students to hear what their peers have written, because it gives them new ideas and a real audience. Five or ten minutes of class time in small groups or pairs is enough. Knowing classmates will hear their work also pushes students to write better.<br>الكتابة بتحس كأنها نشاط فردي، فقرايتها بصوت عالي بتحوّلها لتواصل. مهم الطلبة يسمعوا اللي زمايلهم كتبوه، لأن ده بيدّيهم أفكار جديدة وجمهور حقيقي. خمس أو عشر دقايق من وقت الفصل في مجموعات صغيرة أو أزواج كفاية. ومعرفة إن الزمايل هيسمعوا شغلهم كمان بتدفّع الطلبة يكتبوا أحسن.", "n": 1, "i": 106, "h": ""}, {"t": "write", "q": "Explain the difference between a substitution table and a matching table. (3-4 sentences)<br>اشرح الفرق بين جدول الاستبدال وجدول المطابقة. (٣-٤ جمل).", "key": "tefl-48:2", "a": "In a substitution table, learners take one item from each box to build a sentence, and a well-prepared table always produces a grammatically correct result. In a matching table, learners must think very carefully, because the result will be wrong in grammar or meaning unless they select the right items. A substitution table builds confidence with guaranteed success. A matching table is not copying; it demands real thinking about meaning and accuracy.<br>في جدول الاستبدال، المتعلمين بياخدوا عنصر واحد من كل خانة عشان يبنوا جملة، والجدول المتجهّز كويس دايمًا بيطلّع نتيجة صح قواعديًا. في جدول المطابقة، المتعلمين لازم يفكّروا بعناية جدًا، لأن النتيجة هتبقى غلط في القواعد أو المعنى لو ماختاروش العناصر الصح. جدول الاستبدال بيبني الثقة بنجاح مضمون. جدول المطابقة مش نسخ؛ بيطلب تفكير حقيقي في المعنى والدقة.", "n": 1, "i": 107, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 11, the grammar focus.</div><div class=\"u\">الدرس الجاي: الموديول الحداشر، التركيز على القواعد.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 108}];</script>
