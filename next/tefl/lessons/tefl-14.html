<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ١٤</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-14";window.STEPS=[{"t": "section", "h": "What is a sentence? | يعني إيه جملة؟", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">In this unit we explore the main parts of a sentence: morpheme, word, phrase, clause, subject, and predicate.</div><div class=\"u\">في الوحدة دي بنستكشف الأجزاء الأساسية للجملة: المورفيم، الكلمة، العبارة، الجملة الصغيرة (clause)، الفاعل، والخبر.</div>", "n": 1, "i": 1, "a": "tefl-14-001", "x": "84ade39d"}, {"t": "learn", "h": "<div class=\"u\">A dictionary might define a sentence like this: a set of words, complete in itself, usually with a subject and a predicate, giving a statement, question, exclamation, or command.</div><div class=\"u\">القاموس ممكن يعرّف الجملة كده: مجموعة كلمات كاملة بذاتها، غالبًا فيها فاعل وخبر، بتنقل خبر أو سؤال أو تعجب أو أمر.</div>", "n": 1, "i": 2, "a": "tefl-14-002", "x": "e75aeb09"}, {"t": "learn", "h": "<div class=\"u\">A sentence consists of a main clause, and sometimes one or more subordinate clauses too.</div><div class=\"u\">الجملة بتتكون من clause رئيسية، وساعات clause تابعة واحدة أو أكتر كمان.</div>", "n": 1, "i": 3, "a": "tefl-14-003", "x": "c996492e"}, {"t": "learn", "h": "<div class=\"u\">Basically, a sentence is words put together to complete a purpose. One purpose is making a statement; another is asking a question.</div><div class=\"u\">ببساطة، الجملة كلمات متحطوطين مع بعض لتحقيق غرض. غرض ممكن يكون إخبار بحاجة، وغرض تاني إنك تسأل سؤال.</div>", "n": 1, "i": 4, "a": "tefl-14-004", "x": "1e2270f1"}, {"t": "learn", "h": "<div class=\"u\">In English, sentences begin with a capital letter and include a verb. The end is marked by a full stop, a question mark, or an exclamation mark.</div><div class=\"u\">في الإنجليزية، الجمل بتبدأ بحرف كبير وفيها فعل. ونهايتها بتتعلّم بنقطة أو علامة استفهام أو علامة تعجب.</div>", "n": 1, "i": 5, "a": "tefl-14-005", "x": "3591bd71"}, {"t": "learn", "h": "<div class=\"u\">There is no minimum number of words. The only requirement is a main subject and a main verb. I exist is as much a sentence as The early bird catches the worm.</div><div class=\"u\">مفيش حد أدنى لعدد الكلمات. الشرط الوحيد هو فاعل رئيسي وفعل رئيسي. I exist جملة زيها زي The early bird catches the worm.</div>", "n": 1, "i": 6, "a": "tefl-14-006", "x": "98cea57e"}, {"t": "section", "h": "Morphemes | المورفيمات", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">A morpheme is the smallest unit of language that can carry meaning. You cannot break it into anything smaller that has meaning.</div><div class=\"u\">المورفيم هو أصغر وحدة في اللغة ليها معنى. مينفعش تكسّره لحاجة أصغر ليها معنى.</div>", "n": 1, "i": 8, "a": "tefl-14-007", "x": "37d7ba01"}, {"t": "learn", "h": "<div class=\"u\">Many simple words are single morphemes: boy, hut, talk.</div><div class=\"u\">كلمات بسيطة كتير عبارة عن مورفيم واحد: boy وhut وtalk.</div>", "n": 1, "i": 9, "a": "tefl-14-008", "x": "9569444b"}, {"t": "learn", "h": "<div class=\"u\">Some words have two or more morphemes: child plus ren, talk plus s, blind plus ness.</div><div class=\"u\">بعض الكلمات فيها مورفيمين أو أكتر: child زائد ren، وtalk زائد s، وblind زائد ness.</div>", "n": 1, "i": 10, "a": "tefl-14-009", "x": "54a5ac27"}, {"t": "learn", "h": "<div class=\"u\">ren, s, and ness each carry some meaning, even though none of them is a word on its own.</div><div class=\"u\">ren وs وness كل واحدة فيهم ليها معنى، مع إن مفيش واحدة فيهم كلمة لوحدها.</div>", "n": 1, "i": 11, "a": "tefl-14-010", "x": "5e390342"}, {"t": "learn", "h": "<div class=\"u\">If we break them down further, like r plus e plus n, we just end up with graphemes or phonemes, which have no meaning alone.</div><div class=\"u\">لو كسّرناهم أكتر، زي r زائد e زائد n، هنوصل لجرافيمات أو فونيمات، ودي ملهاش معنى لوحدها.</div>", "n": 1, "i": 12, "a": "tefl-14-011", "x": "d5a35c5b"}, {"t": "section", "h": "Graphemes and phonemes | الجرافيمات والفونيمات", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">A grapheme is a term from linguistics: the smallest unit in writing that can change meaning. It is a letter or group of letters representing one phoneme, like b, ng, or ea.</div><div class=\"u\">الجرافيم مصطلح من اللسانيات: أصغر وحدة في الكتابة ممكن تغير المعنى. وهي حرف أو مجموعة حروف بتمثل فونيم واحد، زي b أو ng أو ea.</div>", "n": 1, "i": 14, "a": "tefl-14-012", "x": "79b55564"}, {"t": "learn", "h": "<div class=\"u\">A phoneme is a distinctive speech sound. In writing a word is made of letters; in speech it is made of a series of phonemes.</div><div class=\"u\">الفونيم هو صوت كلامي مميّز. في الكتابة الكلمة بتتكون من حروف؛ في الكلام بتتكون من سلسلة فونيمات.</div>", "n": 1, "i": 15, "a": "tefl-14-013", "x": "54b3a78c"}, {"t": "learn", "h": "<div class=\"u\">There are 44 phonemes in standard modern English, fairly evenly divided between vowels and consonants.</div><div class=\"u\">فيه 44 فونيم في الإنجليزية الحديثة القياسية، متقسمين بالتساوي تقريبًا بين حروف متحركة وساكنة.</div>", "n": 1, "i": 16, "a": "tefl-14-014", "x": "d6d70038"}, {"t": "learn", "h": "<div class=\"u\">The phonemes of a word do not match its letters. The word singing has 7 letters but only 5 sounds: s-i-ng-i-ng.</div><div class=\"u\">فونيمات الكلمة مش مطابقة لحروفها. كلمة singing فيها 7 حروف بس 5 أصوات بس: s-i-ng-i-ng.</div>", "n": 1, "i": 17, "a": "tefl-14-015", "x": "b1f3dcd0"}, {"t": "section", "h": "Words and their jobs | الكلمات وشغلها", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">A word is the smallest meaningful bit of a sentence. Each word has a different job. Take four words: roared, mighty, lion, the.</div><div class=\"u\">الكلمة هي أصغر جزء ليه معنى في الجملة. كل كلمة ليها شغلانة مختلفة. خد 4 كلمات: roared وmighty وlion وthe.</div>", "n": 1, "i": 19, "a": "tefl-14-016", "x": "554b9c4d"}, {"t": "learn", "h": "<div class=\"u\">roared is a verb: it tells us what happens. mighty is an adjective: it tells us more about a noun, and a sentence can live without it.</div><div class=\"u\">roared فعل: بتقولنا إيه اللي حصل. mighty صفة: بتقولنا أكتر عن اسم، والجملة تقدر تعيش من غيرها.</div>", "n": 1, "i": 20, "a": "tefl-14-017", "x": "a395a714"}, {"t": "learn", "h": "<div class=\"u\">lion is a noun: it names things, people, or places.</div><div class=\"u\">lion اسم: بتسمّي أشياء أو ناس أو أماكن.</div>", "n": 1, "i": 21, "a": "tefl-14-018", "x": "fe24ce82"}, {"t": "learn", "h": "<div class=\"u\">the is a definite article. We use it before a noun when the listener knows exactly which one we mean, or when there is only one of it around.</div><div class=\"u\">the أداة تعريف. بنستخدمها قبل الاسم لما السامع يعرف بالظبط أنهي واحد بنقصده، أو لما يكون فيه واحد بس منه في المكان.</div>", "n": 1, "i": 22, "a": "tefl-14-019", "x": "0dc69715"}, {"t": "learn", "h": "<div class=\"u\">Articles are part of a larger family called determiners. And like adjectives, we do not always need one to make a sentence.</div><div class=\"u\">الأدوات جزء من عائلة أكبر اسمها المحددات (determiners). وزي الصفات، مش دايمًا محتاجينها عشان نعمل جملة.</div>", "n": 1, "i": 23, "a": "tefl-14-020", "x": "59bae452"}, {"t": "learn", "h": "<div class=\"u\">We put words together to make a phrase.</div><div class=\"u\">بنحط الكلمات مع بعض عشان نعمل عبارة (phrase).</div>", "n": 1, "i": 24, "a": "tefl-14-021", "x": "d821e99d"}, {"t": "section", "h": "Phrases | العبارات", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">A phrase is a short, single piece of information: a word or a small group of words that forms a meaningful unit inside a sentence, like mighty lion.</div><div class=\"u\">العبارة (phrase) قطعة معلومة واحدة قصيرة: كلمة أو مجموعة كلمات صغيرة بتكوّن وحدة ليها معنى جوه الجملة، زي mighty lion.</div>", "n": 1, "i": 26, "a": "tefl-14-022", "x": "06ce11de"}, {"t": "learn", "h": "<div class=\"u\">Two important types are the noun phrase and the verb phrase.</div><div class=\"u\">أهم نوعين هما العبارة الاسمية والعبارة الفعلية.</div>", "n": 1, "i": 27, "a": "tefl-14-023", "x": "c0ea8bf3"}, {"t": "learn", "h": "<div class=\"u\">A noun phrase is built around one noun or pronoun, and it can work as a subject, an object, or the object of a preposition. It can be very simple or very complex.</div><div class=\"u\">العبارة الاسمية مبنية حوالين اسم أو ضمير واحد، وتقدر تشتغل كفاعل أو مفعول أو مفعول بحرف جر. ممكن تكون بسيطة جدًا أو معقدة جدًا.</div>", "n": 1, "i": 28, "a": "tefl-14-024", "x": "77aeb244"}, {"t": "learn", "h": "<div class=\"u\">Examples with the noun phrase in focus: A pile of books lay on the table. He was reading a book about the rise and fall of Napoleon.</div><div class=\"u\">أمثلة والعبارة الاسمية هي الأساس: A pile of books lay on the table. وHe was reading a book about the rise and fall of Napoleon.</div>", "n": 1, "i": 29, "a": "tefl-14-025", "x": "cf81a8ca"}, {"t": "learn", "h": "<div class=\"u\">A verb phrase is a verb of more than one word: one or more helping (auxiliary) verbs plus one main verb.</div><div class=\"u\">العبارة الفعلية فعل من أكتر من كلمة: فعل مساعد واحد أو أكتر زائد فعل رئيسي.</div>", "n": 1, "i": 30, "a": "tefl-14-026", "x": "8af3d755"}, {"t": "learn", "h": "<div class=\"u\">Examples: can see (can + see), would have sent (would + have + sent), may have been planning (may + have + been + planning).</div><div class=\"u\">أمثلة: can see (can زائد see)، وwould have sent (would زائد have زائد sent)، وmay have been planning (may زائد have زائد been زائد planning).</div>", "n": 1, "i": 31, "a": "tefl-14-027", "x": "33aa35d0"}, {"t": "learn", "h": "<div class=\"u\">The main verb carries the chief idea; the other verbs only help it. The main verb is always the last one, and its form can change: send becomes sent, plan becomes planning.</div><div class=\"u\">الفعل الرئيسي هو اللي بيحمل الفكرة الأساسية؛ والأفعال التانية بتساعده بس. الفعل الرئيسي دايمًا هو الأخير، وشكله ممكن يتغير: send بتبقى sent، وplan بتبقى planning.</div>", "n": 1, "i": 32, "a": "tefl-14-028", "x": "89295839"}, {"t": "learn", "h": "<div class=\"u\">We use phrases to make a clause.</div><div class=\"u\">بنستخدم العبارات عشان نعمل clause.</div>", "n": 1, "i": 33, "a": "tefl-14-029", "x": "dd541bc5"}, {"t": "section", "h": "Clauses | الـclauses", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">A clause is a larger word group with a bit more information. It has at least two phrases: a noun phrase as the subject, and a verb.</div><div class=\"u\">الـclause مجموعة كلمات أكبر فيها معلومات أكتر شوية. فيها على الأقل عبارتين: عبارة اسمية هي الفاعل، وفعل.</div>", "n": 1, "i": 35, "a": "tefl-14-030", "x": "d5ff5078"}, {"t": "learn", "h": "<div class=\"u\">A clause is like a mini-sentence: a set of words making a sense unit, but it might not end with a full stop.</div><div class=\"u\">الـclause زي جملة صغيرة: مجموعة كلمات بتكوّن وحدة معنى، بس ممكن ماتنتهيش بنقطة.</div>", "n": 1, "i": 36, "a": "tefl-14-031", "x": "32f875c4"}, {"t": "learn", "h": "<div class=\"u\">A sentence can have several clauses: She left (1) because it was late (2) and she was tired (3). Three clauses in one sentence.</div><div class=\"u\">الجملة ممكن يكون فيها clauses كتير: She left (1) because it was late (2) and she was tired (3). تلات clauses في جملة واحدة.</div>", "n": 1, "i": 37, "a": "tefl-14-032", "x": "3fafb820"}, {"t": "learn", "h": "<div class=\"u\">So a clause is a group of related words containing a subject and a verb. Example: The mighty lion roared. The noun phrase is the mighty lion; the verb is roared.</div><div class=\"u\">يبقى الـclause مجموعة كلمات مرتبطة فيها فاعل وفعل. مثال: The mighty lion roared. العبارة الاسمية هي the mighty lion؛ والفعل هو roared.</div>", "n": 1, "i": 38, "a": "tefl-14-033", "x": "2bdeb4bc"}, {"t": "learn", "h": "<div class=\"u\">A useful trick for finding clauses: count the main verbs. For each main verb, there is one clause.</div><div class=\"u\">حيلة مفيدة عشان تلاقي الـclauses: عدّ الأفعال الرئيسية. كل فعل رئيسي وراه clause واحدة.</div>", "n": 1, "i": 39, "a": "tefl-14-034", "x": "31073f86"}, {"t": "section", "h": "The subject | الفاعل", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">The subject of a sentence is the person, place, thing, or idea that is doing or being something.</div><div class=\"u\">فاعل الجملة هو الشخص أو المكان أو الحاجة أو الفكرة اللي بتعمل أو بتكون حاجة.</div>", "n": 1, "i": 41, "a": "tefl-14-035", "x": "2ee2e41e"}, {"t": "learn", "h": "<div class=\"u\">You can find the subject if you find the verb. In The computers in the Learning Centre must be replaced, the verb is must be replaced.</div><div class=\"u\">تقدر تلاقي الفاعل لو لقيت الفعل. في The computers in the Learning Centre must be replaced، الفعل هو must be replaced.</div>", "n": 1, "i": 42, "a": "tefl-14-036", "x": "6aaf0d31"}, {"t": "learn", "h": "<div class=\"u\">Now ask: what must be replaced? The computers. That is the subject.</div><div class=\"u\">دلوقتي اسأل: إيه اللي لازم يتبدّل؟ الكمبيوترات. ده هو الفاعل.</div>", "n": 1, "i": 43, "a": "tefl-14-037", "x": "635080fa"}, {"t": "learn", "h": "<div class=\"u\">A simple subject is the subject stripped of modifiers. Modifiers are any words that change or add to the meaning of another word.</div><div class=\"u\">الفاعل البسيط هو الفاعل من غير الواصفات. الواصفات (modifiers) أي كلمات بتغير أو تضيف لمعنى كلمة تانية.</div>", "n": 1, "i": 44, "a": "tefl-14-038", "x": "aa4cc9a3"}, {"t": "learn", "h": "<div class=\"u\">In The really important issue of the debate, stripped of all other considerations, is the morality of the nation, the simple subject is just issue.</div><div class=\"u\">في The really important issue of the debate, stripped of all other considerations, is the morality of the nation، الفاعل البسيط هو بس issue.</div>", "n": 1, "i": 45, "a": "tefl-14-039", "x": "e12e1a81"}, {"t": "learn", "h": "<div class=\"u\">Sometimes a simple subject is more than one word, even a whole clause: What he had already forgotten about computer repair could fill whole volumes.</div><div class=\"u\">ساعات الفاعل البسيط بيكون أكتر من كلمة، حتى clause كاملة: What he had already forgotten about computer repair could fill whole volumes.</div>", "n": 1, "i": 46, "a": "tefl-14-040", "x": "2f95141c"}, {"t": "learn", "h": "<div class=\"u\">Ask: what could fill whole volumes? Not computer repair, not he. The whole first clause is the simple subject.</div><div class=\"u\">اسأل: إيه اللي يقدر يملا مجلدات كاملة؟ مش computer repair ولا he. الـclause الأولى كلها هي الفاعل البسيط.</div>", "n": 1, "i": 47, "a": "tefl-14-041", "x": "9cf9cbf0"}, {"t": "section", "h": "The predicate | الخبر", "n": 1, "i": 48}, {"t": "learn", "h": "<div class=\"u\">The predicate is the completer of the sentence: the part that contains a verb and states something about the subject.</div><div class=\"u\">الخبر (predicate) هو مكمّل الجملة: الجزء اللي فيه الفعل وبيقول حاجة عن الفاعل.</div>", "n": 1, "i": 49, "a": "tefl-14-042", "x": "42ec2c7f"}, {"t": "learn", "h": "<div class=\"u\">The subject names the do-er or be-er of the sentence; the predicate does the rest of the work.</div><div class=\"u\">الفاعل بيسمّي اللي بيعمل أو اللي بيكون في الجملة؛ والخبر بيعمل باقي الشغل.</div>", "n": 1, "i": 50, "a": "tefl-14-043", "x": "872b15d0"}, {"t": "learn", "h": "<div class=\"u\">A simple predicate can be only a verb, a verb string, or a compound verb: The glacier melted. The glacier has been melting.</div><div class=\"u\">الخبر البسيط ممكن يكون فعل بس، أو سلسلة أفعال، أو فعل مركب: The glacier melted. أو The glacier has been melting.</div>", "n": 1, "i": 51, "a": "tefl-14-044", "x": "64357901"}, {"t": "learn", "h": "<div class=\"u\">Or all three actions together: The glacier melted, broke apart, and slipped into the sea.</div><div class=\"u\">أو تلات أفعال مع بعض: The glacier melted, broke apart, and slipped into the sea.</div>", "n": 1, "i": 52, "a": "tefl-14-045", "x": "a4bd3bee"}, {"t": "learn", "h": "<div class=\"u\">Splitting sentences: the part before the slash is the subject, after it the predicate. People in glasshouses / shouldn't throw stones.</div><div class=\"u\">تقسيم الجمل: اللي قبل الشرطة هو الفاعل، واللي بعدها هو الخبر. People in glasshouses / shouldn't throw stones.</div>", "n": 1, "i": 53, "a": "tefl-14-046", "x": "df4fb153"}, {"t": "learn", "h": "<div class=\"u\">More: Sebastián and Alejandro / went on vacation. I / love eating cocido madrileño.</div><div class=\"u\">كمان: Sebastián and Alejandro / went on vacation. وI / love eating cocido madrileño.</div>", "n": 1, "i": 54, "a": "tefl-14-047", "x": "788f95cd"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 55}, {"t": "learn", "h": "<div class=\"u\">Sentence: a set of words standing alone as a unit of sense, ending with a full stop, question mark, or exclamation mark. It needs a main subject and a main verb.</div><div class=\"u\">الجملة: مجموعة كلمات واقفة لوحدها كوحدة معنى، بتنتهي بنقطة أو علامة استفهام أو تعجب. محتاجة فاعل رئيسي وفعل رئيسي.</div>", "n": 1, "i": 56, "a": "tefl-14-048", "x": "cdfaf26d"}, {"t": "learn", "h": "<div class=\"u\">Morpheme: the smallest unit of language that carries meaning, like boy or the s in talks.</div><div class=\"u\">المورفيم: أصغر وحدة في اللغة ليها معنى، زي boy أو حرف s في talks.</div>", "n": 1, "i": 57, "a": "tefl-14-049", "x": "6ad9cd5a"}, {"t": "learn", "h": "<div class=\"u\">Grapheme: the smallest unit in writing that can change meaning: a letter or letter group for one sound, like ng or ea.</div><div class=\"u\">الجرافيم: أصغر وحدة في الكتابة ممكن تغير المعنى: حرف أو مجموعة حروف لصوت واحد، زي ng أو ea.</div>", "n": 1, "i": 58, "a": "tefl-14-050", "x": "9550f8bb"}, {"t": "learn", "h": "<div class=\"u\">Phoneme: a distinctive speech sound. Standard English has 44.</div><div class=\"u\">الفونيم: صوت كلامي مميّز. الإنجليزية القياسية فيها 44.</div>", "n": 1, "i": 59, "a": "tefl-14-051", "x": "12c2fde0"}, {"t": "learn", "h": "<div class=\"u\">Noun phrase: a word or group of words built around one noun or pronoun, working as subject or object.</div><div class=\"u\">العبارة الاسمية: كلمة أو مجموعة كلمات مبنية حوالين اسم أو ضمير واحد، بتشتغل كفاعل أو مفعول.</div>", "n": 1, "i": 60, "a": "tefl-14-052", "x": "d33c87ac"}, {"t": "learn", "h": "<div class=\"u\">Verb phrase: a verb of more than one word: auxiliary verbs plus one main verb, which always comes last.</div><div class=\"u\">العبارة الفعلية: فعل من أكتر من كلمة: أفعال مساعدة زائد فعل رئيسي واحد بييجي في الآخر دايمًا.</div>", "n": 1, "i": 61, "a": "tefl-14-053", "x": "e4a65091"}, {"t": "learn", "h": "<div class=\"u\">Auxiliary verb: a helping verb, like can, would, have, or be, that supports the main verb.</div><div class=\"u\">الفعل المساعد: فعل بيساعد الفعل الرئيسي، زي can وwould وhave وbe.</div>", "n": 1, "i": 62, "a": "tefl-14-054", "x": "81e847a6"}, {"t": "learn", "h": "<div class=\"u\">Clause: a group of related words with a subject and a verb, like a mini-sentence.</div><div class=\"u\">الـclause: مجموعة كلمات مرتبطة فيها فاعل وفعل، زي جملة صغيرة.</div>", "n": 1, "i": 63, "a": "tefl-14-055", "x": "e4c27852"}, {"t": "learn", "h": "<div class=\"u\">Subject: the person, place, thing, or idea doing or being something in the sentence.</div><div class=\"u\">الفاعل: الشخص أو المكان أو الحاجة أو الفكرة اللي بتعمل أو بتكون حاجة في الجملة.</div>", "n": 1, "i": 64, "a": "tefl-14-056", "x": "56ba3f60"}, {"t": "learn", "h": "<div class=\"u\">Simple subject: the subject alone, stripped of all its modifiers.</div><div class=\"u\">الفاعل البسيط: الفاعل لوحده، من غير أي واصفات.</div>", "n": 1, "i": 65, "a": "tefl-14-057", "x": "9bb48254"}, {"t": "learn", "h": "<div class=\"u\">Predicate: the part of the sentence with the verb that says something about the subject.</div><div class=\"u\">الخبر: جزء الجملة اللي فيه الفعل وبيقول حاجة عن الفاعل.</div>", "n": 1, "i": 66, "a": "tefl-14-058", "x": "e0450530"}, {"t": "learn", "h": "<div class=\"u\">Modifier: any word or group of words that changes or adds to the meaning of another word.</div><div class=\"u\">الواصف: أي كلمة أو مجموعة كلمات بتغير أو تضيف لمعنى كلمة تانية.</div>", "n": 1, "i": 67, "a": "tefl-14-059", "x": "cc1e4ed8"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 68}, {"t": "learn", "h": "<div class=\"u\">A sentence needs only a main subject and a main verb. It ends with a full stop, question mark, or exclamation mark, and there is no minimum length.</div><div class=\"u\">الجملة محتاجة بس فاعل رئيسي وفعل رئيسي. بتنتهي بنقطة أو استفهام أو تعجب، ومفيش حد أدنى لطولها.</div>", "n": 1, "i": 69, "a": "tefl-14-060", "x": "b25d0656"}, {"t": "learn", "h": "<div class=\"u\">The ladder of units: phoneme and grapheme are below meaning; the morpheme is the smallest meaningful unit.</div><div class=\"u\">سلّم الوحدات: الفونيم والجرافيم تحت المعنى؛ المورفيم أصغر وحدة ليها معنى.</div>", "n": 1, "i": 70, "a": "tefl-14-061", "x": "cf2754f6"}, {"t": "learn", "h": "<div class=\"u\">Morphemes make words, words make phrases, phrases make clauses, clauses make sentences.</div><div class=\"u\">المورفيمات بتعمل كلمات، الكلمات بتعمل عبارات، العبارات بتعمل clauses، والـclauses بتعمل جمل.</div>", "n": 1, "i": 71, "a": "tefl-14-062", "x": "4cabc38e"}, {"t": "learn", "h": "<div class=\"u\">Noun phrases are built around one noun or pronoun. Verb phrases are auxiliary verbs plus one main verb, which is always last: may have been planning.</div><div class=\"u\">العبارات الاسمية مبنية حوالين اسم أو ضمير واحد. العبارات الفعلية أفعال مساعدة زائد فعل رئيسي واحد بييجي في الآخر دايمًا: may have been planning.</div>", "n": 1, "i": 72, "a": "tefl-14-063", "x": "a126da2b"}, {"t": "learn", "h": "<div class=\"u\">Find the subject by finding the verb and asking who or what. The predicate is everything else: the verb and what it says about the subject.</div><div class=\"u\">لاقي الفاعل بإنك تلاقي الفعل وتسأل مين أو إيه. والخبر هو كل الباقي: الفعل واللي بيقوله عن الفاعل.</div>", "n": 1, "i": 73, "a": "tefl-14-064", "x": "e2fb516e"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 74}, {"t": "tf", "q": "A sentence is a set of words standing on their own as a unit of sense, ending with a full stop or equivalent.<br>الجملة مجموعة كلمات واقفة لوحدها كوحدة معنى، بتنتهي بنقطة أو ما يعادلها.", "ans": true, "why": "That is the definition. The equivalent is a question mark or exclamation mark. | ده التعريف. المعادل هو علامة الاستفهام أو التعجب.", "ex": ["Correct. | صح.", "Wrong. That is exactly the definition. | غلط: ده بالظبط التعريف."], "n": 1, "i": 75, "h": ""}, {"t": "tf", "q": "I eat is not a sentence.<br>I eat مش جملة.", "ans": false, "why": "It is a sentence: it has a main subject (I) and a main verb (eat). There is no minimum number of words. | هي جملة: فيها فاعل رئيسي (I) وفعل رئيسي (eat). مفيش حد أدنى لعدد الكلمات.", "ex": ["Wrong. It has a subject and a verb, so it is a sentence. | غلط: فيها فاعل وفعل، فهي جملة.", "Correct. | صح."], "n": 1, "i": 76, "h": ""}, {"t": "tf", "q": "You can break a morpheme down into smaller parts that still have meaning.<br>تقدر تكسّر المورفيم لأجزاء أصغر لسه ليها معنى.", "ans": false, "why": "No. The morpheme is the smallest unit with meaning. Below it you only find graphemes or phonemes. | لأ. المورفيم هو أصغر وحدة ليها معنى. تحته بتلاقي بس جرافيمات أو فونيمات.", "ex": ["Wrong. Smaller parts have no meaning. | غلط: الأجزاء الأصغر ملهاش معنى.", "Correct. | صح."], "n": 1, "i": 77, "h": ""}, {"t": "mc", "q": "The word singing has 7 letters. How many phonemes does it have?<br>كلمة singing فيها 7 حروف. فيها كام فونيم؟", "opts": ["5 | 5", "7 | 7", "4 | 4"], "ans": 0, "why": "s-i-ng-i-ng: five sounds. Letters and phonemes do not match one to one. | s-i-ng-i-ng: خمس أصوات. الحروف والفونيمات مش واحد لواحد.", "ex": ["Correct. | صح.", "No. ng is one sound, twice. | غلط: ng صوت واحد، مرتين.", "No. | غلط."], "n": 1, "i": 78, "h": ""}, {"t": "mc", "q": "In may have been planning, the main verb is:<br>في may have been planning، الفعل الرئيسي هو:", "opts": ["planning | planning", "may | may", "been | been"], "ans": 0, "why": "The main verb carries the chief idea and always comes last in the verb phrase. | الفعل الرئيسي بيحمل الفكرة الأساسية وبييجي دايمًا في آخر العبارة الفعلية.", "ex": ["Correct. | صح.", "No. May is an auxiliary. | غلط: may فعل مساعد.", "No. Been is part of the helping string. | غلط: been جزء من سلسلة المساعدة."], "n": 1, "i": 79, "h": ""}, {"t": "mc", "q": "In The computers in the Learning Centre must be replaced, the subject is:<br>في The computers in the Learning Centre must be replaced، الفاعل هو:", "opts": ["the computers | الكمبيوترات", "the Learning Centre | مركز التعلم", "must be replaced | لازم تتبدل"], "ans": 0, "why": "Find the verb (must be replaced) and ask what must be replaced: the computers. | لاقي الفعل (must be replaced) واسأل إيه اللي لازم يتبدل: الكمبيوترات.", "ex": ["Correct. | صح.", "No. That is part of a modifier. | غلط: ده جزء من واصف.", "No. That is the predicate's verb. | غلط: ده فعل الخبر."], "n": 1, "i": 80, "h": ""}, {"t": "tf", "q": "A clause is a group of related words containing a subject and a verb.<br>الـclause مجموعة كلمات مرتبطة فيها فاعل وفعل.", "ans": true, "why": "Yes. A clause is like a mini-sentence; count main verbs to count clauses. | أيوه. الـclause زي جملة صغيرة؛ عدّ الأفعال الرئيسية عشان تعدّ الـclauses.", "ex": ["Correct. | صح.", "Wrong. Subject plus verb is exactly a clause. | غلط: فاعل زائد فعل هي بالظبط الـclause."], "n": 1, "i": 81, "h": ""}, {"t": "mc", "q": "In The really important issue of the debate is the morality of the nation, the simple subject is:<br>في The really important issue of the debate is the morality of the nation، الفاعل البسيط هو:", "opts": ["issue | issue", "debate | debate", "morality | morality"], "ans": 0, "why": "Strip the modifiers (really important, of the debate) and the subject left is issue. | شيل الواصفات (really important وof the debate) والفاعل المتبقي هو issue.", "ex": ["Correct. | صح.", "No. Debate sits inside a modifier. | غلط: debate جوه واصف.", "No. That belongs to the predicate. | غلط: ده تابع للخبر."], "n": 1, "i": 82, "h": ""}, {"t": "mc", "q": "In People in glasshouses shouldn't throw stones, the predicate is:<br>في People in glasshouses shouldn't throw stones، الخبر هو:", "opts": ["shouldn't throw stones | shouldn't throw stones", "people in glasshouses | people in glasshouses", "stones | stones"], "ans": 0, "why": "The predicate contains the verb and says something about the subject. | الخبر فيه الفعل وبيقول حاجة عن الفاعل.", "ex": ["Correct. | صح.", "No. That is the subject. | غلط: ده الفاعل.", "No. Stones is part of the predicate, not all of it. | غلط: stones جزء من الخبر مش كله."], "n": 1, "i": 83, "h": ""}, {"t": "mc", "q": "Which of these is a morpheme with meaning, but NOT a word on its own?<br>أنهي واحدة مورفيم ليه معنى، بس مش كلمة لوحده؟", "opts": ["the ness in blindness | الـness في blindness", "hut | hut", "talk | talk"], "ans": 0, "why": "ness carries meaning (a state) but cannot stand alone. Hut and talk are words and morphemes. | ness ليها معنى (حالة) بس ماتقفش لوحدها. hut وtalk كلمات ومورفيمات مع بعض.", "ex": ["Correct. | صح.", "No. Hut is a word on its own. | غلط: hut كلمة لوحدها.", "No. Talk is a word on its own. | غلط: talk كلمة لوحدها."], "n": 1, "i": 84, "h": ""}, {"t": "recall", "q": "Put these units in order from smallest to largest: sentence, word, clause, morpheme, phrase.<br>رتّب الوحدات دي من الأصغر للأكبر: جملة، كلمة، clause، مورفيم، عبارة.", "a": "Morpheme, word, phrase, clause, sentence.<br>مورفيم، كلمة، عبارة، clause، جملة.", "n": 1, "i": 85, "h": ""}, {"t": "recall", "q": "Give the three verb phrases from the lesson and name the main verb in each.<br>اذكر العبارات الفعلية التلاتة من الدرس وسمّي الفعل الرئيسي في كل واحدة.", "a": "can see (see), would have sent (sent), may have been planning (planning).<br>can see (الرئيسي see)، وwould have sent (الرئيسي sent)، وmay have been planning (الرئيسي planning).", "n": 1, "i": 86, "h": ""}, {"t": "write", "q": "Explain the difference between a morpheme, a grapheme, and a phoneme (3-4 sentences).<br>اشرح الفرق بين المورفيم والجرافيم والفونيم (٣-٤ جمل).", "key": "tefl-14:1", "a": "A morpheme is the smallest unit of language that carries meaning, like boy or the ness in blindness. A grapheme is the smallest unit in writing that can change meaning: a letter or letter group standing for one sound, like ng. A phoneme is a distinctive speech sound, and English has 44 of them. So morphemes carry meaning, while graphemes and phonemes are below meaning: writing and sound.<br>المورفيم أصغر وحدة في اللغة ليها معنى، زي boy أو الـness في blindness. الجرافيم أصغر وحدة في الكتابة ممكن تغير المعنى: حرف أو مجموعة حروف بتمثل صوت واحد، زي ng. الفونيم صوت كلامي مميّز، والإنجليزية فيها 44 منه. يبقى المورفيمات ليها معنى، أما الجرافيمات والفونيمات تحت المعنى: كتابة وصوت.", "n": 1, "i": 87, "h": ""}, {"t": "write", "q": "Explain how to find the subject of a sentence, with an example (3-4 sentences).<br>اشرح إزاي تلاقي فاعل الجملة، مع مثال (٣-٤ جمل).", "key": "tefl-14:2", "a": "First find the verb. In The computers in the Learning Centre must be replaced, the verb is must be replaced. Then ask who or what does or receives it: what must be replaced? The computers. That is the subject. Strip the modifiers and you have the simple subject.<br>الأول لاقي الفعل. في The computers in the Learning Centre must be replaced، الفعل هو must be replaced. وبعدين اسأل مين أو إيه اللي بيعمل أو بيستقبل: إيه اللي لازم يتبدّل؟ الكمبيوترات. ده هو الفاعل. شيل الواصفات وهيبقى عندك الفاعل البسيط.", "n": 1, "i": 88, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the three sentence types: simple, compound, and complex, plus the unit's check questions.</div><div class=\"u\">الدرس الجاي: أنواع الجمل التلاتة: البسيطة والمركبة والمعقدة، مع أسئلة الوحدة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 89}];</script>
