<script>window.LESSON_ID="tefl-15";window.STEPS=[{"t": "section", "h": "Sentences are complete units | الجمل وحدات كاملة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Put a capital letter at the start of a clause and a full stop at the end, and you have a sentence. Sentences are the largest grammatical units.</div><div class=\"u\">حط حرف كبير في أول الـclause ونقطة في الآخر، وهيبقى عندك جملة. الجمل هي أكبر الوحدات النحوية.</div>", "n": 1, "i": 1, "a": "tefl-15-001", "x": "48780161"}, {"t": "learn", "h": "<div class=\"u\">Sentences feel complete in two ways: they can stand alone as informative units, and they include all the required grammatical elements.</div><div class=\"u\">الجمل بتحس إنها كاملة بطريقتين: بتقدر تقف لوحدها كوحدات معلوماتية، وبتضم كل العناصر النحوية المطلوبة.</div>", "n": 1, "i": 2, "a": "tefl-15-002", "x": "6a4b7023"}, {"t": "learn", "h": "<div class=\"u\">The mighty lion roared has a subject and a verb and stands alone as a meaningful unit. This is a simple sentence.</div><div class=\"u\">The mighty lion roared فيها فاعل وفعل وبتقف لوحدها كوحدة ليها معنى. دي جملة بسيطة.</div>", "n": 1, "i": 3, "a": "tefl-15-003", "x": "5786e01a"}, {"t": "section", "h": "Simple sentences | الجمل البسيطة", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">A simple sentence consists of one clause with a subject and a verb. It puts across one simple idea: a complete unit of meaning.</div><div class=\"u\">الجملة البسيطة بتتكون من clause واحدة فيها فاعل وفعل. بتوصّل فكرة واحدة بسيطة: وحدة معنى كاملة.</div>", "n": 1, "i": 5, "a": "tefl-15-004", "x": "93e3c1a7"}, {"t": "learn", "h": "<div class=\"u\">Examples: Carlos smiled. The dog barked. The boys are playing soccer. Will you help me?</div><div class=\"u\">أمثلة: Carlos smiled. وThe dog barked. وThe boys are playing soccer. وWill you help me?</div>", "n": 1, "i": 6, "a": "tefl-15-005", "x": "606784fb"}, {"t": "learn", "h": "<div class=\"u\">In Will you help me? the subject is you and the verb is will help.</div><div class=\"u\">في Will you help me? الفاعل هو you والفعل هو will help.</div>", "n": 1, "i": 7, "a": "tefl-15-006", "x": "fa2ba423"}, {"t": "learn", "h": "<div class=\"u\">Length does not matter. He phoned is as much a sentence as Atletico Madrid is one of the best teams in Europe.</div><div class=\"u\">الطول مش مهم. He phoned جملة زيها زي Atletico Madrid is one of the best teams in Europe.</div>", "n": 1, "i": 8, "a": "tefl-15-007", "x": "afd98bc0"}, {"t": "learn", "h": "<div class=\"u\">But look at this: Made in France. This is correct English, but it is not a sentence. It has no subject.</div><div class=\"u\">بس بص على دي: Made in France. دي إنجليزية صح، بس مش جملة. مفيش فاعل.</div>", "n": 1, "i": 9, "a": "tefl-15-008", "x": "653f27b0"}, {"t": "learn", "h": "<div class=\"u\">To make it a complete sentence, add a subject and a full verb: My fridge was made in France.</div><div class=\"u\">عشان تخليها جملة كاملة، ضيف فاعل وفعل كامل: My fridge was made in France.</div>", "n": 1, "i": 10, "a": "tefl-15-009", "x": "c399e737"}, {"t": "section", "h": "Compound sentences | الجمل المركبة", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">A compound sentence is two or more main clauses joined by a coordinating conjunction, also called a connective.</div><div class=\"u\">الجملة المركبة (compound) هي clause رئيسية اتنين أو أكتر موصولين بأداة ربط تنسيقية، اسمها كمان connective.</div>", "n": 1, "i": 12, "a": "tefl-15-010", "x": "5e187862"}, {"t": "learn", "h": "<div class=\"u\">The common connectives are but, and, or. They link pieces of information together.</div><div class=\"u\">أشهر أدوات الربط هي but وand وor. بتوصل قطع المعلومات ببعض.</div>", "n": 1, "i": 13, "a": "tefl-15-011", "x": "53a1f18e"}, {"t": "learn", "h": "<div class=\"u\">Take two simple sentences: I do not like eating strawberries. I love eating carrots. Join them: I do not like eating strawberries but I love eating carrots.</div><div class=\"u\">خد جملتين بسيطتين: I do not like eating strawberries. وI love eating carrots. وصّلهم: I do not like eating strawberries but I love eating carrots.</div>", "n": 1, "i": 14, "a": "tefl-15-012", "x": "2f13d29c"}, {"t": "learn", "h": "<div class=\"u\">More examples: The boys walked down the road and they met their friends at the bus stop. The postman came to the door so the dog barked loudly.</div><div class=\"u\">أمثلة كمان: The boys walked down the road and they met their friends at the bus stop. وThe postman came to the door so the dog barked loudly.</div>", "n": 1, "i": 15, "a": "tefl-15-013", "x": "b1d4a55c"}, {"t": "learn", "h": "<div class=\"u\">Compound sentences add variety to writing. The danger is getting carried away with long, rambling sentences.</div><div class=\"u\">الجمل المركبة بتضيف تنويع للكتابة. الخطر إنك تسهو وتكتب جمل طويلة ملخبطة.</div>", "n": 1, "i": 16, "a": "tefl-15-014", "x": "06c79c4c"}, {"t": "learn", "h": "<div class=\"u\">Like this one: We went the park and we met some friends and then we went into town which was not too far but I was quite tired when I got there so I sat down.</div><div class=\"u\">زي دي: We went the park and we met some friends and then we went into town which was not too far but I was quite tired when I got there so I sat down.</div>", "n": 1, "i": 17, "a": "tefl-15-015", "x": "297e711b"}, {"t": "learn", "h": "<div class=\"u\">Take care with connectives: two in a sentence is usually enough, and you do not need them in every sentence.</div><div class=\"u\">خد بالك مع أدوات الربط: اتنين في الجملة عادة كفاية، ومش لازم تستخدمهم في كل جملة.</div>", "n": 1, "i": 18, "a": "tefl-15-016", "x": "5d6b1f40"}, {"t": "section", "h": "Complex sentences | الجمل المعقدة", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">A complex sentence carries more detailed ideas. It has one main clause that makes sense alone, plus one or more subordinate clauses linked to it.</div><div class=\"u\">الجملة المعقدة (complex) بتوصّل أفكار أعمق. فيها clause رئيسية واحدة ليها معنى لوحدها، زائد clause تابعة واحدة أو أكتر مربوطة بيها.</div>", "n": 1, "i": 20, "a": "tefl-15-017", "x": "b5648f0f"}, {"t": "learn", "h": "<div class=\"u\">When the noisy vehicle passed, the mighty lion roared. The main clause is the mighty lion roared: subject, verb, makes sense alone.</div><div class=\"u\">When the noisy vehicle passed, the mighty lion roared. الـclause الرئيسية هي the mighty lion roared: فاعل وفعل ومعنى واقف لوحده.</div>", "n": 1, "i": 21, "a": "tefl-15-018", "x": "3b24b3d8"}, {"t": "learn", "h": "<div class=\"u\">The subordinate clause is when the noisy vehicle passed. It has a subject and a verb, but it does not make sense on its own. It needs a main clause.</div><div class=\"u\">الـclause التابعة هي when the noisy vehicle passed. فيها فاعل وفعل، بس ملهاش معنى لوحدها. محتاجة clause رئيسية.</div>", "n": 1, "i": 22, "a": "tefl-15-019", "x": "2e14416b"}, {"t": "learn", "h": "<div class=\"u\">We can add more subordinate clauses: When the vehicle passed, the mighty lion roared because it was annoyed. One main clause, two subordinate clauses.</div><div class=\"u\">نقدر نضيف clauses تابعة أكتر: When the vehicle passed, the mighty lion roared because it was annoyed. رئيسية واحدة وتابعتين.</div>", "n": 1, "i": 23, "a": "tefl-15-020", "x": "58c74747"}, {"t": "learn", "h": "<div class=\"u\">We can even split the main clause with a minor clause: When the vehicle passed, the mighty lion, which was annoyed, roared.</div><div class=\"u\">ونقدر حتى نقسّم الـclause الرئيسية بـclause تابعة في نصها: When the vehicle passed, the mighty lion, which was annoyed, roared.</div>", "n": 1, "i": 24, "a": "tefl-15-021", "x": "dc2eddc0"}, {"t": "learn", "h": "<div class=\"u\">Another example: The alarm was raised as soon as the fire was spotted. Cut the main idea out and it stands alone: The alarm was raised.</div><div class=\"u\">مثال تاني: The alarm was raised as soon as the fire was spotted. شيل الفكرة الرئيسية وهتقف لوحدها: The alarm was raised.</div>", "n": 1, "i": 25, "a": "tefl-15-022", "x": "f0f2042c"}, {"t": "learn", "h": "<div class=\"u\">What remains is as soon as the fire was spotted. It has a subject and a verb, but it cannot stand alone as a meaningful unit.</div><div class=\"u\">اللي بيفضل هو as soon as the fire was spotted. فيها فاعل وفعل، بس ماتقدرش تقف لوحدها كوحدة ليها معنى.</div>", "n": 1, "i": 26, "a": "tefl-15-023", "x": "1f899196"}, {"t": "learn", "h": "<div class=\"u\">Names to remember: the main clause is also called the independent clause. The subordinate clause is also called the dependent clause, because it depends on the main one.</div><div class=\"u\">أسماء تفتكرها: الـclause الرئيسية اسمها كمان independent يعني مستقلة. والتابعة اسمها dependent يعني معتمدة، لأنها معتمدة على الرئيسية.</div>", "n": 1, "i": 27, "a": "tefl-15-024", "x": "9a39e64d"}, {"t": "section", "h": "Unit 3 review questions | أسئلة مراجعة الوحدة التالتة", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">The unit's own check questions, quick fire. A sentence stands alone as a unit of sense and ends with a full stop or equivalent: True.</div><div class=\"u\">أسئلة الوحدة نفسها، بسرعة. الجملة بتقف لوحدها كوحدة معنى وبتنتهي بنقطة أو ما يعادلها: صح.</div>", "n": 1, "i": 29, "a": "tefl-15-025", "x": "63fb97cd"}, {"t": "learn", "h": "<div class=\"u\">I eat is not a sentence: False. It has a subject and a verb, and that is all a sentence needs.</div><div class=\"u\">I eat مش جملة: غلط. فيها فاعل وفعل، وده كل اللي الجملة محتاجاه.</div>", "n": 1, "i": 30, "a": "tefl-15-026", "x": "fe78f4cb"}, {"t": "learn", "h": "<div class=\"u\">You can break a morpheme into smaller meaningful parts: False. The morpheme is already the smallest meaningful unit.</div><div class=\"u\">تقدر تكسّر المورفيم لأجزاء أصغر ليها معنى: غلط. المورفيم أصلًا أصغر وحدة ليها معنى.</div>", "n": 1, "i": 31, "a": "tefl-15-027", "x": "15e02513"}, {"t": "learn", "h": "<div class=\"u\">A verb phrase is a verb of more than one word, with helping verbs and one main verb: True.</div><div class=\"u\">العبارة الفعلية فعل من أكتر من كلمة، فيه أفعال مساعدة وفعل رئيسي واحد: صح.</div>", "n": 1, "i": 32, "a": "tefl-15-028", "x": "0ee9b05c"}, {"t": "learn", "h": "<div class=\"u\">A clause is a group of related words containing a subject and a verb: True.</div><div class=\"u\">الـclause مجموعة كلمات مرتبطة فيها فاعل وفعل: صح.</div>", "n": 1, "i": 33, "a": "tefl-15-029", "x": "8e363bc3"}, {"t": "learn", "h": "<div class=\"u\">A simple sentence consists of one clause with a subject and a verb: True.</div><div class=\"u\">الجملة البسيطة بتتكون من clause واحدة فيها فاعل وفعل: صح.</div>", "n": 1, "i": 34, "a": "tefl-15-030", "x": "a150105f"}, {"t": "learn", "h": "<div class=\"u\">Manufactured in Germany is correct English and is a sentence: False. It is correct English on a label, but it has no subject, so it is not a sentence.</div><div class=\"u\">Manufactured in Germany إنجليزية صح وهي جملة: غلط. صح على الليبل، بس مفيش فاعل، فمش جملة.</div>", "n": 1, "i": 35, "a": "tefl-15-031", "x": "a816ebda"}, {"t": "learn", "h": "<div class=\"u\">A subordinate clause is also called an independent clause: False. The subordinate clause is the dependent clause; the main clause is the independent one.</div><div class=\"u\">الـclause التابعة اسمها independent: غلط. التابعة هي dependent؛ الرئيسية هي الـindependent.</div>", "n": 1, "i": 36, "a": "tefl-15-032", "x": "5595fbe7"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">Simple sentence: one clause with a subject and a verb, carrying one complete idea, like Carlos smiled.</div><div class=\"u\">الجملة البسيطة: clause واحدة فيها فاعل وفعل، بتوصّل فكرة واحدة كاملة، زي Carlos smiled.</div>", "n": 1, "i": 38, "a": "tefl-15-033", "x": "ceb6edca"}, {"t": "learn", "h": "<div class=\"u\">Compound sentence: two or more main clauses joined by a connective like but, and, or.</div><div class=\"u\">الجملة المركبة: clauses رئيسية اتنين أو أكتر موصولين بأداة ربط زي but وand وor.</div>", "n": 1, "i": 39, "a": "tefl-15-034", "x": "cfe13be8"}, {"t": "learn", "h": "<div class=\"u\">Complex sentence: one main clause plus one or more subordinate clauses.</div><div class=\"u\">الجملة المعقدة: clause رئيسية واحدة زائد clause تابعة واحدة أو أكتر.</div>", "n": 1, "i": 40, "a": "tefl-15-035", "x": "544adeb7"}, {"t": "learn", "h": "<div class=\"u\">Coordinating conjunction: a connective joining equal clauses, like but, and, or, so.</div><div class=\"u\">أداة الربط التنسيقية: رابط بيوصل clauses متساوية، زي but وand وor وso.</div>", "n": 1, "i": 41, "a": "tefl-15-036", "x": "96ae671f"}, {"t": "learn", "h": "<div class=\"u\">Subordinate clause: a clause with a subject and verb that cannot stand alone; it depends on the main clause.</div><div class=\"u\">الـclause التابعة: clause فيها فاعل وفعل بس ماتقدرش تقف لوحدها؛ معتمدة على الرئيسية.</div>", "n": 1, "i": 42, "a": "tefl-15-037", "x": "1de76b95"}, {"t": "learn", "h": "<div class=\"u\">Independent clause: another name for the main clause; it can stand alone as a sentence.</div><div class=\"u\">الـclause المستقلة: اسم تاني للـclause الرئيسية؛ بتقدر تقف لوحدها كجملة.</div>", "n": 1, "i": 43, "a": "tefl-15-038", "x": "14788472"}, {"t": "learn", "h": "<div class=\"u\">Dependent clause: another name for the subordinate clause; it depends on the main clause for meaning.</div><div class=\"u\">الـclause المعتمدة: اسم تاني للـclause التابعة؛ معتمدة على الرئيسية في المعنى.</div>", "n": 1, "i": 44, "a": "tefl-15-039", "x": "370cd075"}, {"t": "learn", "h": "<div class=\"u\">Connective: a word that links pieces of text together, like and, but, so.</div><div class=\"u\">الرابط: كلمة بتوصل أجزاء الكلام ببعض، زي and وbut وso.</div>", "n": 1, "i": 45, "a": "tefl-15-040", "x": "8e4d87e2"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">Simple sentence: one clause, subject plus verb, one idea. Length does not matter; He phoned is a full sentence.</div><div class=\"u\">الجملة البسيطة: clause واحدة، فاعل زائد فعل، فكرة واحدة. الطول مش مهم؛ He phoned جملة كاملة.</div>", "n": 1, "i": 47, "a": "tefl-15-041", "x": "7133febb"}, {"t": "learn", "h": "<div class=\"u\">A label like Made in France is correct English but not a sentence: no subject. Fix it: My fridge was made in France.</div><div class=\"u\">ليبل زي Made in France إنجليزية صح بس مش جملة: مفيش فاعل. صلّحها: My fridge was made in France.</div>", "n": 1, "i": 48, "a": "tefl-15-042", "x": "c52a6afe"}, {"t": "learn", "h": "<div class=\"u\">Compound sentence: main clauses joined by but, and, or. Two connectives per sentence is usually enough.</div><div class=\"u\">الجملة المركبة: clauses رئيسية موصولة بـbut وand وor. رابطين في الجملة عادة كفاية.</div>", "n": 1, "i": 49, "a": "tefl-15-043", "x": "3c3d467c"}, {"t": "learn", "h": "<div class=\"u\">Complex sentence: one main (independent) clause plus subordinate (dependent) clauses that cannot stand alone.</div><div class=\"u\">الجملة المعقدة: clause رئيسية (مستقلة) واحدة زائد clauses تابعة (معتمدة) ماتقدرش تقف لوحدها.</div>", "n": 1, "i": 50, "a": "tefl-15-044", "x": "7c786961"}, {"t": "learn", "h": "<div class=\"u\">Check any complex sentence: pull the main clause out and see if it stands alone; what is left is subordinate.</div><div class=\"u\">اختبر أي جملة معقدة: طلّع الـclause الرئيسية وشوف لو وقفت لوحدها؛ اللي فاضل هو التابع.</div>", "n": 1, "i": 51, "a": "tefl-15-045", "x": "dda39aee"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 52}, {"t": "mc", "q": "The boys are playing soccer. What type of sentence is this?<br>The boys are playing soccer. ده نوعها إيه من الجمل؟", "opts": ["simple | بسيطة", "compound | مركبة", "complex | معقدة"], "ans": 0, "why": "One clause, one subject (the boys), one verb (are playing), one idea. | clause واحدة، فاعل واحد (the boys)، فعل واحد (are playing)، فكرة واحدة.", "ex": ["Correct. | صح.", "No. There is only one clause. | غلط: فيها clause واحدة بس.", "No. There is no subordinate clause. | غلط: مفيش clause تابعة."], "n": 1, "i": 53, "h": ""}, {"t": "mc", "q": "Two or more main clauses joined by and, but, or or make a:<br>clauses رئيسية اتنين أو أكتر موصولين بـand أو but أو or بيعملوا:", "opts": ["compound sentence | جملة مركبة", "complex sentence | جملة معقدة", "simple sentence | جملة بسيطة"], "ans": 0, "why": "Main clauses plus a coordinating conjunction is the definition of a compound sentence. | clauses رئيسية زائد أداة ربط تنسيقية هو تعريف الجملة المركبة.", "ex": ["Correct. | صح.", "No. A complex sentence needs a subordinate clause. | غلط: المعقدة محتاجة clause تابعة.", "No. A simple sentence has one clause only. | غلط: البسيطة فيها clause واحدة بس."], "n": 1, "i": 54, "h": ""}, {"t": "mc", "q": "In When the noisy vehicle passed, the mighty lion roared, the subordinate clause is:<br>في When the noisy vehicle passed, the mighty lion roared، الـclause التابعة هي:", "opts": ["when the noisy vehicle passed | when the noisy vehicle passed", "the mighty lion roared | the mighty lion roared", "the noisy vehicle | the noisy vehicle"], "ans": 0, "why": "It has a subject and a verb but cannot stand alone; the mighty lion roared is the main clause. | فيها فاعل وفعل بس ماتقدرش تقف لوحدها؛ the mighty lion roared هي الرئيسية.", "ex": ["Correct. | صح.", "No. That is the main clause; it stands alone. | غلط: دي الرئيسية؛ بتقف لوحدها.", "No. That is just a noun phrase. | غلط: دي بس عبارة اسمية."], "n": 1, "i": 55, "h": ""}, {"t": "tf", "q": "A compound sentence has one main clause and one subordinate clause.<br>الجملة المركبة فيها clause رئيسية واحدة وclause تابعة واحدة.", "ans": false, "why": "That is a complex sentence. A compound sentence has two or more main clauses. | دي المعقدة. المركبة فيها clauses رئيسية اتنين أو أكتر.", "ex": ["Wrong. That describes a complex sentence. | غلط: ده وصف الجملة المعقدة.", "Correct. | صح."], "n": 1, "i": 56, "h": ""}, {"t": "tf", "q": "A subordinate clause can stand alone as a meaningful unit.<br>الـclause التابعة تقدر تقف لوحدها كوحدة ليها معنى.", "ans": false, "why": "No. It depends on the main clause; that is why it is also called the dependent clause. | لأ. معتمدة على الرئيسية؛ عشان كده اسمها كمان dependent.", "ex": ["Wrong. It needs the main clause to make sense. | غلط: محتاجة الرئيسية عشان يبقى ليها معنى.", "Correct. | صح."], "n": 1, "i": 57, "h": ""}, {"t": "mc", "q": "Made in France. Is this a sentence?<br>Made in France. هل دي جملة؟", "opts": ["No. Correct English, but no subject | لأ. إنجليزية صح بس مفيش فاعل", "Yes. It has a verb | أيوه. فيها فعل", "Yes. It is on products everywhere | أيوه. موجودة على المنتجات في كل حتة"], "ans": 0, "why": "A sentence needs a main subject and a main verb. Fix it: My fridge was made in France. | الجملة محتاجة فاعل رئيسي وفعل رئيسي. صلّحها: My fridge was made in France.", "ex": ["Correct. | صح.", "No. Made alone is not a full verb with a subject here. | غلط: made لوحدها مش فعل كامل ليه فاعل هنا.", "No. Being common does not make it a sentence. | غلط: الانتشار مش بيخليها جملة."], "n": 1, "i": 58, "h": ""}, {"t": "mc", "q": "In The alarm was raised as soon as the fire was spotted, the main clause is:<br>في The alarm was raised as soon as the fire was spotted، الـclause الرئيسية هي:", "opts": ["the alarm was raised | the alarm was raised", "as soon as the fire was spotted | as soon as the fire was spotted", "the fire was spotted | the fire was spotted"], "ans": 0, "why": "Pull it out and it stands alone with full meaning. The rest cannot. | طلّعها وهتقف لوحدها بمعنى كامل. الباقي لأ.", "ex": ["Correct. | صح.", "No. It cannot stand alone. | غلط: ماتقدرش تقف لوحدها.", "No. It depends on as soon as and on the main clause. | غلط: معتمدة على as soon as وعلى الرئيسية."], "n": 1, "i": 59, "h": ""}, {"t": "tf", "q": "Another name for the subordinate clause is the dependent clause.<br>اسم تاني للـclause التابعة هو الـclause المعتمدة (dependent).", "ans": true, "why": "Yes. And the main clause is the independent clause. | أيوه. والرئيسية اسمها المستقلة (independent).", "ex": ["Correct. | صح.", "Wrong. Subordinate and dependent are the same thing. | غلط: التابعة والمعتمدة حاجة واحدة."], "n": 1, "i": 60, "h": ""}, {"t": "mc", "q": "How many connectives per sentence are usually adequate?<br>كام رابط في الجملة عادة يكون كفاية؟", "opts": ["two | اتنين", "five | خمسة", "as many as possible | أكبر عدد ممكن"], "ans": 0, "why": "Two is usually adequate; more leads to long rambling sentences. | اتنين عادة كفاية؛ أكتر من كده بيودي لجمل طويلة ملخبطة.", "ex": ["Correct. | صح.", "No. That rambles. | غلط: ده بيلخبط.", "No. Restraint is better. | غلط: القليل أحسن."], "n": 1, "i": 61, "h": ""}, {"t": "tf", "q": "I do not like eating strawberries but I love eating carrots is a complex sentence.<br>I do not like eating strawberries but I love eating carrots جملة معقدة.", "ans": false, "why": "It is compound: two main clauses joined by but. No subordinate clause. | دي مركبة: clauses رئيسية اتنين موصولين بـbut. مفيش clause تابعة.", "ex": ["Wrong. Two main clauses with but is compound. | غلط: رئيسيتين مع but يعني مركبة.", "Correct. | صح."], "n": 1, "i": 62, "h": ""}, {"t": "recall", "q": "Name three coordinating conjunctions used in compound sentences.<br>اذكر ٣ أدوات ربط تنسيقية بتستخدم في الجمل المركبة.", "a": "Any 3 of: but, and, or, so.<br>أي ٣ من: but وand وor وso.", "n": 1, "i": 63, "h": ""}, {"t": "recall", "q": "In When the vehicle passed, the mighty lion roared because it was annoyed, name the main clause and the two subordinate clauses.<br>في When the vehicle passed, the mighty lion roared because it was annoyed، اذكر الـclause الرئيسية والتابعتين.", "a": "Main: the mighty lion roared. Subordinate: when the vehicle passed, and because it was annoyed.<br>الرئيسية: the mighty lion roared. التابعة: when the vehicle passed، وbecause it was annoyed.", "n": 1, "i": 64, "h": ""}, {"t": "write", "q": "Explain the difference between a compound and a complex sentence (3-4 sentences).<br>اشرح الفرق بين الجملة المركبة والجملة المعقدة (٣-٤ جمل).", "key": "tefl-15:1", "a": "A compound sentence joins two or more main clauses with a connective like but, and, or or; each clause could stand alone. A complex sentence has one main clause plus one or more subordinate clauses, and the subordinate clauses cannot stand alone. For example, I do not like strawberries but I love carrots is compound. When the vehicle passed, the lion roared is complex.<br>الجملة المركبة بتوصل clauses رئيسية اتنين أو أكتر برابط زي but وand وor؛ وكل clause فيهم تقدر تقف لوحدها. الجملة المعقدة فيها clause رئيسية واحدة زائد clause تابعة أو أكتر، والتابعة ماتقدرش تقف لوحدها. مثال، I do not like strawberries but I love carrots مركبة. When the vehicle passed, the lion roared معقدة.", "n": 1, "i": 65, "h": ""}, {"t": "write", "q": "Explain why Made in France is not a sentence, and fix it (2-3 sentences).<br>اشرح ليه Made in France مش جملة، وصلّحها (٢-٣ جمل).", "key": "tefl-15:2", "a": "Made in France is correct English, the kind you see on labels, but it has no subject. A sentence needs a main subject and a main verb. To fix it, add both: My fridge was made in France.<br>Made in France إنجليزية صح، من النوع اللي على الليبلات، بس مفيش فاعل. الجملة محتاجة فاعل رئيسي وفعل رئيسي. عشان تصلّحها، ضيف الاتنين: My fridge was made in France.", "n": 1, "i": 66, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 4, the English tense system, starting with the present tenses.</div><div class=\"u\">الدرس الجاي: الوحدة الرابعة، نظام الأزمنة في الإنجليزية، نبدأ بأزمنة المضارع.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 67}];</script>
