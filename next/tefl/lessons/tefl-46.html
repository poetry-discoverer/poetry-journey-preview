<h1>عالم تيفل ٤٦: أنشطة الكلام والمفردات</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤٦</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-46";window.STEPS=[{"t": "section", "h": "Strategies: introduction | الاستراتيجيات: مقدمة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">If your students are going to operate effectively, they need a wide variety of speaking strategies and activities.</div><div class=\"u\">عشان طلبتك يقدروا يشتغلوا بفاعلية، محتاجين تشكيلة واسعة من استراتيجيات وأنشطة الكلام.</div>", "n": 1, "i": 1, "a": "tefl-46-001", "x": "284d155a"}, {"t": "learn", "h": "<div class=\"u\">Your goal is to make them interesting, productive, enjoyable and fun, but not too much fun with young adults and adults.</div><div class=\"u\">هدفك تخليها ممتعة ومنتجة ومسلية، بس مش مسلية أوي مع الشباب والكبار.</div>", "n": 1, "i": 2, "a": "tefl-46-002", "x": "0370c779"}, {"t": "learn", "h": "<div class=\"u\">Help your students with speaking strategies they can use to expand their knowledge of the language and their confidence in using it.</div><div class=\"u\">ساعد طلبتك باستراتيجيات كلام يقدروا يستخدموها عشان يوسّعوا معرفتهم باللغة وثقتهم في استخدامها.</div>", "n": 1, "i": 3, "a": "tefl-46-003", "x": "c126e26b"}, {"t": "learn", "h": "<div class=\"u\">You are helping your students to learn how to speak, so that your students can use speaking to learn.</div><div class=\"u\">إنت بتساعد طلبتك يتعلّموا إزاي يتكلموا، عشان يقدروا يستخدموا الكلام عشان يتعلّموا.</div>", "n": 1, "i": 4, "a": "tefl-46-004", "x": "77038cfc"}, {"t": "section", "h": "Minimal responses | الردود الدنيا", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">Strategy one: minimal responses. Language learners who lack confidence often listen in silence while others do the talking.</div><div class=\"u\">الاستراتيجية الأولى: الردود الدنيا. المتعلمين اللي ناقصهم ثقة غالبًا بيسمعوا في صمت والتانيين بيتكلموا.</div>", "n": 1, "i": 6, "a": "tefl-46-005", "x": "9e83942b"}, {"t": "learn", "h": "<div class=\"u\">One way to encourage them to participate is to help them build a stock of minimal responses for different types of exchanges. These are especially useful for beginners.</div><div class=\"u\">طريقة تشجّعهم يشاركوا هي إنك تساعدهم يبنوا مخزون من الردود الدنيا لأنواع التبادلات المختلفة. ودي مفيدة بالذات للمبتدئين.</div>", "n": 1, "i": 7, "a": "tefl-46-006", "x": "bfc4be16"}, {"t": "learn", "h": "<div class=\"u\">Minimal responses are predictable phrases that show understanding, agreement, doubt and other reactions, like: Oh, I see. Is that so? That's good. Oh, sorry. I didn't catch that.</div><div class=\"u\">الردود الدنيا عبارات متوقعة بتظهر الفهم والموافقة والشك وردود فعل تانية، زي: آه فهمت. بجد؟ جميل. آسف. ماسمعتش.</div>", "n": 1, "i": 8, "a": "tefl-46-007", "x": "ff6bfd2c"}, {"t": "learn", "h": "<div class=\"u\">Having a stock of such responses lets a learner focus on what the other person is saying, without having to plan a response at the same time.</div><div class=\"u\">إن يبقى عندك مخزون من الردود دي بيخلّي المتعلم يركّز على اللي الشخص التاني بيقوله، من غير ما يضطر يخطّط لرد في نفس الوقت.</div>", "n": 1, "i": 9, "a": "tefl-46-008", "x": "f79a9d26"}, {"t": "section", "h": "Recognising scripts | التعرف على السكريبتات", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">Strategy two: recognising scripts. Many communication situations have a predictable set of spoken exchanges, a script.</div><div class=\"u\">الاستراتيجية التانية: التعرف على السكريبتات. مواقف تواصل كتير ليها مجموعة متوقعة من التبادلات المنطوقة، سكريبت.</div>", "n": 1, "i": 11, "a": "tefl-46-009", "x": "e8405e36"}, {"t": "learn", "h": "<div class=\"u\">Greetings, apologies, compliments, invitations and other functions influenced by social and cultural norms often follow scripts. For example: Can I help you? Yes, please.</div><div class=\"u\">التحيات والاعتذارات والمجاملات والدعوات والوظايف التانية المتأثرة بالأعراف الاجتماعية والثقافية غالبًا بتتبع سكريبتات. مثال: أقدر أساعدك؟ أيوه من فضلك.</div>", "n": 1, "i": 12, "a": "tefl-46-010", "x": "1ceff1c8"}, {"t": "learn", "h": "<div class=\"u\">Transactional exchanges like obtaining information and making a purchase follow scripts too, and you can often anticipate what comes after a speaker's turn.</div><div class=\"u\">التبادلات المعاملاتية زي الحصول على معلومات وعملية الشراء بتتبع سكريبتات كمان، وغالبًا تقدر تتوقع إيه اللي جاي بعد دور المتكلم.</div>", "n": 1, "i": 13, "a": "tefl-46-011", "x": "c1150b9e"}, {"t": "learn", "h": "<div class=\"u\">Make your students aware of the scripts for different situations, so they can predict what they will hear and what they will need to say in response.</div><div class=\"u\">خلّي طلبتك واعيين بالسكريبتات بتاعة المواقف المختلفة، عشان يتوقعوا اللي هيسمعوه واللي هيحتاجوا يقولوه في الرد.</div>", "n": 1, "i": 14, "a": "tefl-46-012", "x": "2307bb9b"}, {"t": "learn", "h": "<div class=\"u\">Through interactive activities, give them practice in managing and varying the language that different scripts contain.</div><div class=\"u\">من خلال أنشطة تفاعلية، ادّيهم تدريب على إدارة وتنويع اللغة اللي السكريبتات المختلفة بتحتويها.</div>", "n": 1, "i": 15, "a": "tefl-46-013", "x": "78d7d126"}, {"t": "section", "h": "Clarification phrases | عبارات التوضيح", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">Strategy three: clarification and comprehension responses. Learners are often too embarrassed or shy to say anything when they do not understand, or when a partner has not understood them.</div><div class=\"u\">الاستراتيجية التالتة: ردود التوضيح والفهم. المتعلمين غالبًا بيبقوا محرجين أو خجولين أوي يقولوا أي حاجة لما مابيفهموش، أو لما الشريك مافهمهمش.</div>", "n": 1, "i": 17, "a": "tefl-46-014", "x": "053d05d4"}, {"t": "learn", "h": "<div class=\"u\">Assure them that misunderstanding and the need for clarification can happen in any interaction, whatever the participants' language skill levels.</div><div class=\"u\">طمّنهم إن سوء الفهم والحاجة للتوضيح ممكن يحصلوا في أي تفاعل، مهما كانت مستويات اللغة بتاعة المشاركين.</div>", "n": 1, "i": 18, "a": "tefl-46-015", "x": "b6ffddc2"}, {"t": "learn", "h": "<div class=\"u\">Clarification check phrases: Do you mean...? Could you clarify that, please? Can you elaborate on that, please? Could you be more explicit, please?</div><div class=\"u\">عبارات التأكد بالتوضيح: تقصد...؟ ممكن توضّح ده من فضلك؟ ممكن تفصّل أكتر؟ ممكن تبقى أوضح؟</div>", "n": 1, "i": 19, "a": "tefl-46-016", "x": "6ef14b52"}, {"t": "learn", "h": "<div class=\"u\">Also: Could you explain what you mean by...? Could you give me an example, please?</div><div class=\"u\">وكمان: ممكن تشرح قصدك إيه بـ...؟ ممكن تديني مثال من فضلك؟</div>", "n": 1, "i": 20, "a": "tefl-46-017", "x": "0903023c"}, {"t": "learn", "h": "<div class=\"u\">Comprehension check phrases: Sorry, I don't understand. Sorry, I don't know what you mean. Sorry, I'm not sure I'm following you. Sorry, I've missed your point. Sorry, I don't see what you're getting at.</div><div class=\"u\">عبارات التأكد من الفهم: آسف مش فاهم. آسف مش عارف تقصد إيه. آسف مش متأكد إني ماشي معاك. آسف فاتتني نقطتك. آسف مش شايف إنت قاصد إيه.</div>", "n": 1, "i": 21, "a": "tefl-46-018", "x": "8528fef0"}, {"t": "learn", "h": "<div class=\"u\">Encourage students to use these phrases in class and respond positively when they do. This creates an authentic practice environment inside the classroom itself.</div><div class=\"u\">شجّع الطلبة يستخدموا العبارات دي في الفصل وردّ عليهم بإيجابية لما يعملوا كده. ده بيخلق بيئة تدريب حقيقية جوه الفصل نفسه.</div>", "n": 1, "i": 22, "a": "tefl-46-019", "x": "42a80069"}, {"t": "learn", "h": "<div class=\"u\">As they gain control of these strategies, students gain confidence in managing the communication situations they will meet outside the classroom.</div><div class=\"u\">ومع ما بيسيطروا على الاستراتيجيات دي، الطلبة بيكسبوا ثقة في إدارة مواقف التواصل اللي هيقابلوها برّه الفصل.</div>", "n": 1, "i": 23, "a": "tefl-46-020", "x": "4d48f388"}, {"t": "section", "h": "Activities: ground rules | الأنشطة: قواعد أساسية", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Now some activities. Your aim is to get them to talk.</div><div class=\"u\">دلوقتي شوية أنشطة. هدفك إنك تخلّيهم يتكلموا.</div>", "n": 1, "i": 25, "a": "tefl-46-021", "x": "9cd59d15"}, {"t": "learn", "h": "<div class=\"u\">The classroom is an artificial environment, and some students find it scary because they are constantly asked to say things in the target language, with little confidence and a fear of being laughed at.</div><div class=\"u\">الفصل بيئة صناعية، وبعض الطلبة بيلاقوها مخيفة لأنهم طول الوقت مطلوب منهم يقولوا حاجات باللغة المستهدفة، بثقة قليلة وخوف من السخرية.</div>", "n": 1, "i": 26, "a": "tefl-46-022", "x": "75622d23"}, {"t": "learn", "h": "<div class=\"u\">It is your job to make students happy, relaxed and willing to practise speaking.</div><div class=\"u\">شغلانتك إنك تخلي الطلبة مبسوطين ومرتاحين ومستعدين يتدربوا على الكلام.</div>", "n": 1, "i": 27, "a": "tefl-46-023", "x": "2e3d8282"}, {"t": "learn", "h": "<div class=\"u\">Remember: do not make tasks too complicated or difficult, prepare the students properly so they know what to do, and let them work in pairs or groups rather than performing in front of the class.</div><div class=\"u\">افتكر: ماتخليش المهام معقدة أو صعبة أوي، جهّز الطلبة كويس عشان يعرفوا يعملوا إيه، وسيّبهم يشتغلوا في أزواج أو مجموعات بدل الأداء قدام الفصل.</div>", "n": 1, "i": 28, "a": "tefl-46-024", "x": "5b201cdd"}, {"t": "section", "h": "Activities one to four | الأنشطة من واحد لأربعة", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Activity one: a little-known fact. Students share their name, age and one little-known fact about themselves, like: I have a pet snake.</div><div class=\"u\">النشاط الأول: حقيقة مش معروفة. الطلبة بيشاركوا اسمهم وسنهم وحقيقة واحدة مش معروفة عنهم، زي: عندي تعبان أليف.</div>", "n": 1, "i": 30, "a": "tefl-46-025", "x": "1ec95ecc"}, {"t": "learn", "h": "<div class=\"u\">That fact can become a regular conversation element in future interactions, giving the learner a reason to talk and respond.</div><div class=\"u\">الحقيقة دي ممكن تبقى عنصر محادثة ثابت في التفاعلات الجاية، بتدّي المتعلم سبب يتكلم ويرد.</div>", "n": 1, "i": 31, "a": "tefl-46-026", "x": "b0fc6f88"}, {"t": "learn", "h": "<div class=\"u\">For example: I got it for my birthday. It loves eating mice. It is three feet long. No, it doesn't bite.</div><div class=\"u\">مثال: جبتها في عيد ميلادي. بتحب تاكل الفيران. طولها تلاتة قدم. لأ، مابتعضش.</div>", "n": 1, "i": 32, "a": "tefl-46-027", "x": "ffbd9a4b"}, {"t": "learn", "h": "<div class=\"u\">Activity two: the hot seat. Put a chair with its back to the board. A volunteer sits there, you write a word on the board, and the students describe it to make the volunteer guess it.</div><div class=\"u\">النشاط التاني: المقعد السخن. حط كرسي ضهره للسبورة. متطوع يقعد عليه، تكتب كلمة على السبورة، والطلبة يوصفوها عشان المتطوع يخمّنها.</div>", "n": 1, "i": 33, "a": "tefl-46-028", "x": "02835808"}, {"t": "learn", "h": "<div class=\"u\">For beginners, tell them the word's category or theme, which is likely to be vocabulary they are presently studying.</div><div class=\"u\">للمبتدئين، قولهم فئة الكلمة أو موضوعها، اللي غالبًا بتبقى مفردات بيدرسوها حاليًا.</div>", "n": 1, "i": 34, "a": "tefl-46-029", "x": "d441105a"}, {"t": "learn", "h": "<div class=\"u\">Activity three: interviews. In twos, students get a short list of things to ask about, like favourite sports and favourite food. Each interviews their partner for a set time.</div><div class=\"u\">النشاط التالت: المقابلات. في أزواج، الطلبة بياخدوا قائمة قصيرة بحاجات يسألوا عنها، زي الرياضات والأكل المفضل. كل واحد بيعمل مقابلة مع شريكه لوقت محدد.</div>", "n": 1, "i": 35, "a": "tefl-46-030", "x": "5ba66e13"}, {"t": "learn", "h": "<div class=\"u\">When the group reconvenes, each person introduces their interviewee's favourites to the rest of the group.</div><div class=\"u\">ولما المجموعة تتجمع تاني، كل واحد بيقدّم مفضّلات اللي عمل معاه المقابلة لباقي المجموعة.</div>", "n": 1, "i": 36, "a": "tefl-46-031", "x": "c3cdb890"}, {"t": "learn", "h": "<div class=\"u\">Activity four: a few of my favourite things. Whatever the topic, students share their top three favourite things about it.</div><div class=\"u\">النشاط الرابع: شوية من حاجاتي المفضلة. مهما كان الموضوع، الطلبة بيشاركوا أعلى تلاتة حاجات مفضلة عنه.</div>", "n": 1, "i": 37, "a": "tefl-46-032", "x": "4840ea78"}, {"t": "learn", "h": "<div class=\"u\">If there is time, flip it: their three least favourite things. And ask them to explain why.</div><div class=\"u\">ولو في وقت، اقلبها: التلاتة الأقل تفضيلًا. واسألهم يفسّروا ليه.</div>", "n": 1, "i": 38, "a": "tefl-46-033", "x": "6f60a8f8"}, {"t": "section", "h": "Activities five to eight | الأنشطة من خمسة لتمانية", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">Activity five: describing a drawing or map. Student A describes a picture to partner B, who draws it without looking. B can ask questions to be clear about what to draw.</div><div class=\"u\">النشاط الخامس: وصف رسمة أو خريطة. الطالب أ بيوصف صورة لشريكه ب، اللي بيرسمها من غير ما يبص. ب يقدر يسأل أسئلة عشان يبقى واضح يرسم إيه.</div>", "n": 1, "i": 40, "a": "tefl-46-034", "x": "d4b0c4a6"}, {"t": "learn", "h": "<div class=\"u\">Then they reverse roles. It is interesting and challenging, and the students really enjoy it.</div><div class=\"u\">وبعدين يتبادلوا الأدوار. النشاط ممتع ومتحدي، والطلبة بيستمتعوا بيه فعلًا.</div>", "n": 1, "i": 41, "a": "tefl-46-035", "x": "4279f9d5"}, {"t": "learn", "h": "<div class=\"u\">Activity six: twenty questions. In groups, one student thinks of a well-known character and writes it on paper.</div><div class=\"u\">النشاط السادس: عشرين سؤال. في مجموعات، طالب يفكر في شخصية مشهورة ويكتبها على ورقة.</div>", "n": 1, "i": 42, "a": "tefl-46-036", "x": "c216d0f1"}, {"t": "learn", "h": "<div class=\"u\">The others guess by asking questions like: Is it a man? Is he a sportsman? Is he alive? Does he play basketball?</div><div class=\"u\">الباقي يخمّنوا بأسئلة زي: راجل؟ رياضي؟ عايش؟ بيلعب كرة سلة؟</div>", "n": 1, "i": 43, "a": "tefl-46-037", "x": "d03acd07"}, {"t": "learn", "h": "<div class=\"u\">Questions with or are not allowed, like: Is she a sportswoman or a politician? Those are two separate questions. The limit is twenty questions; once they get the idea, ten may be enough.</div><div class=\"u\">الأسئلة اللي فيها أو ممنوعة، زي: رياضية ولا سياسية؟ دي أسئلة منفصلة. الحد عشرين سؤال؛ وأول ما يفهموا الفكرة، عشرة ممكن تكفي.</div>", "n": 1, "i": 44, "a": "tefl-46-038", "x": "52608324"}, {"t": "learn", "h": "<div class=\"u\">Activity seven: time for a change. Students close their eyes while you change five things about yourself.</div><div class=\"u\">النشاط السابع: وقت التغيير. الطلبة يغمّضوا عينيهم وإنت بتغيّر خمس حاجات في نفسك.</div>", "n": 1, "i": 45, "a": "tefl-46-039", "x": "1aa4081f"}, {"t": "learn", "h": "<div class=\"u\">For example: take off one shoe, take off your watch, put on different glasses, put on your sweater, take off your ring.</div><div class=\"u\">مثال: تخلع جزمة، تشيل ساعتك، تلبس نضارة تانية، تلبس سويتر، تخلع خاتمك.</div>", "n": 1, "i": 46, "a": "tefl-46-040", "x": "9b504124"}, {"t": "learn", "h": "<div class=\"u\">Then they ask questions to figure out the changes: Did you take off a shoe? Did you put on a sweater? It is fun, and it makes students think instead of giving mechanical responses.</div><div class=\"u\">وبعدين يسألوا أسئلة عشان يكتشفوا التغييرات: خلعت جزمة؟ لبست سويتر؟ النشاط ممتع، وبيخلّي الطلبة يفكّروا بدل الردود الآلية.</div>", "n": 1, "i": 47, "a": "tefl-46-041", "x": "3a1fa84f"}, {"t": "learn", "h": "<div class=\"u\">Activity eight: find a classmate who. Students stand up, circulate around the room and ask questions to find classmates who can do different activities, like play football or do painting.</div><div class=\"u\">النشاط التامن: لاقي زميل اللي. الطلبة يقفوا ويلفّوا في الأوضة ويسألوا أسئلة عشان يلاقوا زمايل يقدروا يعملوا أنشطة مختلفة، زي لعب الكورة أو الرسم.</div>", "n": 1, "i": 48, "a": "tefl-46-042", "x": "e039a1b9"}, {"t": "learn", "h": "<div class=\"u\">Then they report their findings back to the class.</div><div class=\"u\">وبعدين يبلّغوا الفصل باللي لاقوه.</div>", "n": 1, "i": 49, "a": "tefl-46-043", "x": "a13ae04c"}, {"t": "section", "h": "Presenting vocabulary | تقديم المفردات", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">Unit two: vocabulary activities. Vocabulary is not one of the four skills as such, but it is an integral part of teaching all of them, and it fits well with this module on speaking.</div><div class=\"u\">الوحدة التانية: أنشطة المفردات. المفردات مش واحدة من المهارات الأربعة بالمعنى الدقيق، بس جزء لا يتجزأ من تعليمهم كلهم، وبتناسب الموديول ده عن الكلام.</div>", "n": 1, "i": 51, "a": "tefl-46-044", "x": "15789233"}, {"t": "learn", "h": "<div class=\"u\">Here are practical options for presenting new vocabulary items, best carried out in pairs or groups.</div><div class=\"u\">دي اختيارات عملية لتقديم مفردات جديدة، والأفضل تتعمل في أزواج أو مجموعات.</div>", "n": 1, "i": 52, "a": "tefl-46-045", "x": "2e7266c4"}, {"t": "learn", "h": "<div class=\"u\">Context: students see a text containing the vocabulary and deduce the meaning from the surrounding language.</div><div class=\"u\">السياق: الطلبة بيشوفوا نص فيه المفردات وبيستنتجوا المعنى من اللغة المحيطة.</div>", "n": 1, "i": 53, "a": "tefl-46-046", "x": "cd61ee2f"}, {"t": "learn", "h": "<div class=\"u\">Miming or gesturing: students guess the meaning from your or another student's miming and gesturing.</div><div class=\"u\">التمثيل الصامت أو الإيماءات: الطلبة بيخمّنوا المعنى من تمثيلك إنت أو طالب تاني.</div>", "n": 1, "i": 54, "a": "tefl-46-047", "x": "c15f3833"}, {"t": "learn", "h": "<div class=\"u\">Substitution drills: teach a dialogue or sentence structure first, then students substitute different content words.</div><div class=\"u\">تدريبات الاستبدال: علّم حوار أو تركيب جملة الأول، وبعدين الطلبة يستبدلوا كلمات محتوى مختلفة.</div>", "n": 1, "i": 55, "a": "tefl-46-048", "x": "9a500439"}, {"t": "learn", "h": "<div class=\"u\">These let students focus on structure while learning related vocabulary.</div><div class=\"u\">دي بتخلّي الطلبة يركّزوا على التركيب وهما بيتعلّموا مفردات مرتبطة.</div>", "n": 1, "i": 56, "a": "tefl-46-049", "x": "c064c108"}, {"t": "learn", "h": "<div class=\"u\">Antonyms and synonyms: students match items from a list of synonyms or antonyms to words in a text.</div><div class=\"u\">الأضداد والمرادفات: الطلبة بيطابقوا عناصر من قائمة مرادفات أو أضداد بكلمات في نص.</div>", "n": 1, "i": 57, "a": "tefl-46-050", "x": "583c5eb4"}, {"t": "learn", "h": "<div class=\"u\">Hangman: the classic game where students choose letters to spell out the vocabulary item in a limited number of rounds.</div><div class=\"u\">الرجل المشنوق: اللعبة الكلاسيكية اللي الطلبة بيختاروا فيها حروف عشان يهجّوا الكلمة في عدد محدود من المحاولات.</div>", "n": 1, "i": 58, "a": "tefl-46-051", "x": "996a07d0"}, {"t": "learn", "h": "<div class=\"u\">Odd-man-out: list four words. Students work out the relationship between them and explain why one word does not belong.</div><div class=\"u\">الغريب: اكتب أربع كلمات. الطلبة يطلّعوا العلاقة بينهم ويفسّروا ليه كلمة واحدة مش تابعة للمجموعة.</div>", "n": 1, "i": 59, "a": "tefl-46-052", "x": "2b8707f4"}, {"t": "learn", "h": "<div class=\"u\">Matching definitions: students literally match words to a list of definitions.</div><div class=\"u\">مطابقة التعريفات: الطلبة بيطابقوا الكلمات بقائمة تعريفات حرفيًا.</div>", "n": 1, "i": 60, "a": "tefl-46-053", "x": "ffdad293"}, {"t": "learn", "h": "<div class=\"u\">Gapped dictation: you read a text with some vocabulary missing, and students deduce the missing item from the context.</div><div class=\"u\">الإملاء المنقوص: إنت بتقرا نص ناقصه شوية مفردات، والطلبة بيستنتجوا الكلمة الناقصة من السياق.</div>", "n": 1, "i": 61, "a": "tefl-46-054", "x": "5374d1fc"}, {"t": "section", "h": "Dictionaries, records and pictures | القواميس والسجلات والصور", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Using dictionaries: for the alphabet and alphabetical order; checking pronunciation; positioning stress; distinguishing different uses of the same word.</div><div class=\"u\">استخدام القواميس: للأبجدية والترتيب الأبجدي؛ التأكد من النطق؛ تحديد النبر؛ التمييز بين استخدامات نفس الكلمة.</div>", "n": 1, "i": 63, "a": "tefl-46-055", "x": "d2bb6575"}, {"t": "learn", "h": "<div class=\"u\">Also: distinguishing meanings of words with the same spelling; checking the grammatical role; British versus American spelling or meaning; and checking formality.</div><div class=\"u\">وكمان: التمييز بين معاني الكلمات بنفس التهجية؛ التأكد من الدور القواعدي؛ التهجية أو المعنى البريطاني مقابل الأمريكي؛ والتأكد من الرسمية.</div>", "n": 1, "i": 64, "a": "tefl-46-056", "x": "64e20867"}, {"t": "learn", "h": "<div class=\"u\">Keeping a vocabulary record: students jot down new words, and you can use the record as a warmer exercise a few days later, to check the words and their usage have stuck.</div><div class=\"u\">الاحتفاظ بسجل مفردات: الطلبة بيدوّنوا الكلمات الجديدة، وتقدر تستخدم السجل كتمرين إحماء بعد كام يوم، عشان تتأكد إن الكلمات واستخدامها ثبتوا.</div>", "n": 1, "i": 65, "a": "tefl-46-057", "x": "693b0278"}, {"t": "learn", "h": "<div class=\"u\">A warmer is a short activity at the start of the lesson to get students engaged and into English mode immediately.</div><div class=\"u\">الإحماء نشاط قصير في أول الدرس عشان يشغّل الطلبة ويدخّلهم في المود الإنجليزي فورًا.</div>", "n": 1, "i": 66, "a": "tefl-46-058", "x": "4463ab97"}, {"t": "learn", "h": "<div class=\"u\">Try to make the warmer related to what they have been learning, not just an unrelated fun activity. We will return to warmers in lesson planning.</div><div class=\"u\">حاول تخلي الإحماء مرتبط باللي بيتعلّموه، مش مجرد نشاط ممتع ملوش علاقة. هنرجع للإحماءات في تخطيط الدروس.</div>", "n": 1, "i": 67, "a": "tefl-46-059", "x": "c4bf29ad"}, {"t": "learn", "h": "<div class=\"u\">Using drawings and pictures: very effective for teaching vocabulary.</div><div class=\"u\">استخدام الرسومات والصور: فعّال جدًا في تعليم المفردات.</div>", "n": 1, "i": 68, "a": "tefl-46-060", "x": "38c8e5c3"}, {"t": "learn", "h": "<div class=\"u\">Labelling: in pairs or small groups, students label the parts of a picture of a bicycle or the parts of the body.</div><div class=\"u\">التسمية: في أزواج أو مجموعات صغيرة، الطلبة بيسمّوا أجزاء صورة عجلة أو أجزاء الجسم.</div>", "n": 1, "i": 69, "a": "tefl-46-061", "x": "c8f1b2e1"}, {"t": "learn", "h": "<div class=\"u\">One student alone may not have all the vocabulary, but pairs or groups have a larger pool. Then pairs can combine with another pair or group to see if they have a complete list.</div><div class=\"u\">طالب لوحده ممكن ميبقاش معاه كل المفردات، بس الأزواج أو المجموعات عندها مخزون أكبر. وبعدين الأزواج تقدر تتحد مع زوج أو مجموعة تانية يشوفوا لو عندهم قائمة كاملة.</div>", "n": 1, "i": 70, "a": "tefl-46-062", "x": "77db83b0"}, {"t": "section", "h": "Really knowing a word | معرفة الكلمة بجد", "n": 1, "i": 71}, {"t": "learn", "h": "<div class=\"u\">Remember: learning a word means not only knowing its dictionary meaning, but also understanding its form, its different connotations and its correct use.</div><div class=\"u\">افتكر: تعلّم كلمة معناه مش بس معرفة معناها في القاموس، بس كمان فهم شكلها ودلالاتها المختلفة واستخدامها الصح.</div>", "n": 1, "i": 72, "a": "tefl-46-063", "x": "f31261b2"}, {"t": "learn", "h": "<div class=\"u\">Rather than simply giving students the meaning, make sure they actually understand it.</div><div class=\"u\">بدل ما تدّي الطلبة المعنى وبس، اتأكد إنهم فعلًا فاهمينه.</div>", "n": 1, "i": 73, "a": "tefl-46-064", "x": "93546794"}, {"t": "learn", "h": "<div class=\"u\">Help your learners develop effective vocabulary learning strategies, and use student-centred techniques like eliciting and concept checking.</div><div class=\"u\">ساعد متعلميك يطوّروا استراتيجيات تعلّم مفردات فعّالة، واستخدم تقنيات مركّزة على الطالب زي الاستنباط والتأكد من المفهوم.</div>", "n": 1, "i": 74, "a": "tefl-46-065", "x": "53806811"}, {"t": "learn", "h": "<div class=\"u\">These make vocabulary learning and teaching much more engaging.</div><div class=\"u\">دي بتخلي تعلّم وتعليم المفردات أشوق بكتير.</div>", "n": 1, "i": 75, "a": "tefl-46-066", "x": "bcd3a42b"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 76}, {"t": "learn", "h": "<div class=\"u\">minimal response: a short predictable phrase showing you are listening, like: I see.</div><div class=\"u\">الرد الدنيا: عبارة قصيرة متوقعة بتظهر إنك بتسمع، زي: فاهم.</div>", "n": 1, "i": 77, "a": "tefl-46-067", "x": "0448e895"}, {"t": "learn", "h": "<div class=\"u\">script: the predictable set of spoken exchanges in a common situation.</div><div class=\"u\">السكريبت: مجموعة التبادلات المنطوقة المتوقعة في موقف شائع.</div>", "n": 1, "i": 78, "a": "tefl-46-068", "x": "ce278bee"}, {"t": "learn", "h": "<div class=\"u\">clarification check: asking the speaker to explain more, like: do you mean...?</div><div class=\"u\">التأكد بالتوضيح: طلب من المتكلم يشرح أكتر، زي: تقصد...؟</div>", "n": 1, "i": 79, "a": "tefl-46-069", "x": "47b2a6a7"}, {"t": "learn", "h": "<div class=\"u\">comprehension check: saying you have not understood, like: sorry, I don't understand.</div><div class=\"u\">التأكد من الفهم: إنك تقول إنك مش فاهم، زي: آسف مش فاهم.</div>", "n": 1, "i": 80, "a": "tefl-46-070", "x": "404691eb"}, {"t": "learn", "h": "<div class=\"u\">substitution drill: swapping content words into a fixed structure.</div><div class=\"u\">تدريب الاستبدال: تبديل كلمات المحتوى في تركيب ثابت.</div>", "n": 1, "i": 81, "a": "tefl-46-071", "x": "0015431f"}, {"t": "learn", "h": "<div class=\"u\">antonym: a word with the opposite meaning.</div><div class=\"u\">الضد: كلمة بمعنى عكسي.</div>", "n": 1, "i": 82, "a": "tefl-46-072", "x": "b34947cb"}, {"t": "learn", "h": "<div class=\"u\">synonym: a word with a similar meaning.</div><div class=\"u\">المرادف: كلمة بمعنى مشابه.</div>", "n": 1, "i": 83, "a": "tefl-46-073", "x": "d94aac00"}, {"t": "learn", "h": "<div class=\"u\">odd-man-out: the one word in a group that does not belong.</div><div class=\"u\">الغريب: الكلمة الوحيدة في المجموعة اللي مش تابعة ليها.</div>", "n": 1, "i": 84, "a": "tefl-46-074", "x": "c8b26eff"}, {"t": "learn", "h": "<div class=\"u\">gapped dictation: a dictation with missing words to deduce from context.</div><div class=\"u\">الإملاء المنقوص: إملاء ناقصه كلمات بتتستنتج من السياق.</div>", "n": 1, "i": 85, "a": "tefl-46-075", "x": "ae0143d4"}, {"t": "learn", "h": "<div class=\"u\">warmer: a short activity at the start of a lesson to engage students.</div><div class=\"u\">الإحماء: نشاط قصير في أول الدرس عشان يشغّل الطلبة.</div>", "n": 1, "i": 86, "a": "tefl-46-076", "x": "bb2a9c11"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 87}, {"t": "learn", "h": "<div class=\"u\">Teach speaking strategies: minimal responses build participation, script awareness builds prediction, and clarification phrases build confidence to manage misunderstanding.</div><div class=\"u\">علّم استراتيجيات الكلام: الردود الدنيا بتبني المشاركة، والوعي بالسكريبتات بيبني التوقع، وعبارات التوضيح بتبني الثقة لإدارة سوء الفهم.</div>", "n": 1, "i": 88, "a": "tefl-46-077", "x": "c8642fcd"}, {"t": "learn", "h": "<div class=\"u\">Minimal responses let a learner focus on listening instead of planning what to say.</div><div class=\"u\">الردود الدنيا بتخلّي المتعلم يركّز على السماع بدل التخطيط لإيه اللي هيقوله.</div>", "n": 1, "i": 89, "a": "tefl-46-078", "x": "713014fb"}, {"t": "learn", "h": "<div class=\"u\">Keep activities simple, prepare students well, and use pairs and groups instead of performing in front of the class.</div><div class=\"u\">خلي الأنشطة بسيطة، جهّز الطلبة كويس، واستخدم الأزواج والمجموعات بدل الأداء قدام الفصل.</div>", "n": 1, "i": 90, "a": "tefl-46-079", "x": "c2d79ff2"}, {"t": "learn", "h": "<div class=\"u\">Tried and tested activities: a little-known fact, the hot seat, interviews, favourite things, describing a drawing, twenty questions, time for a change, and find a classmate who.</div><div class=\"u\">أنشطة مجربة ومضمونة: حقيقة مش معروفة، المقعد السخن، المقابلات، الحاجات المفضلة، وصف رسمة، عشرين سؤال، وقت التغيير، ولاقي زميل اللي.</div>", "n": 1, "i": 91, "a": "tefl-46-080", "x": "55fa2994"}, {"t": "learn", "h": "<div class=\"u\">Present vocabulary through context, miming, substitution drills, synonyms, games, dictionaries and records; and check students truly understand a word's form, connotations and use.</div><div class=\"u\">قدّم المفردات من خلال السياق والتمثيل وتدريبات الاستبدال والمرادفات والألعاب والقواميس والسجلات؛ واتأكد الطلبة فاهمين فعلًا شكل الكلمة ودلالاتها واستخدامها.</div>", "n": 1, "i": 92, "a": "tefl-46-081", "x": "a91a3e99"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 93}, {"t": "mc", "q": "Which is a minimal response?<br>أنهي رد دنيا؟", "opts": ["Oh, I see. | آه، فهمت.", "Could you elaborate on that, please? | ممكن تفصّل أكتر من فضلك؟", "What is the population of the UK? | إيه عدد سكان بريطانيا؟"], "ans": 0, "why": "Minimal responses are short predictable phrases showing understanding or agreement, like: Oh, I see. | الردود الدنيا عبارات قصيرة متوقعة بتظهر الفهم أو الموافقة، زي: آه فهمت.", "ex": ["Correct. | صح.", "No. That is a clarification check. | غلط: ده تأكد بالتوضيح.", "No. That is an information question. | غلط: ده سؤال معلومات."], "n": 1, "i": 94, "h": ""}, {"t": "tf", "q": "A stock of minimal responses lets a learner focus on listening without planning a response at the same time.<br>مخزون الردود الدنيا بيخلّي المتعلم يركّز على السماع من غير ما يخطّط لرد في نفس الوقت.", "ans": true, "why": "True. That is exactly why they help shy or beginner learners participate. | صح. وده بالظبط سبب إنهم بيساعدوا المتعلمين الخجولين أو المبتدئين يشاركوا.", "ex": ["Correct. | صح.", "Wrong. Freeing the mind from planning is their main benefit. | غلط: تحرير الدماغ من التخطيط هو فايدتهم الأساسية."], "n": 1, "i": 95, "h": ""}, {"t": "mc", "q": "In speaking strategy two, a script is:<br>في استراتيجية الكلام التانية، السكريبت هو:", "opts": ["a predictable set of spoken exchanges in a situation | مجموعة متوقعة من التبادلات المنطوقة في موقف", "a written essay students memorise | مقال مكتوب الطلبة بيحفظوه", "a list of grammar rules | قائمة قواعد نحوية"], "ans": 0, "why": "Greetings, apologies, invitations and transactions follow predictable scripts. | التحيات والاعتذارات والدعوات والمعاملات بتتبع سكريبتات متوقعة.", "ex": ["Correct. | صح.", "No. Scripts are spoken patterns, not essays. | غلط: السكريبتات أنماط منطوقة مش مقالات.", "No. Scripts are conversation patterns. | غلط: السكريبتات أنماط محادثة."], "n": 1, "i": 96, "h": ""}, {"t": "mc", "q": "Which is a clarification check?<br>أنهي تأكد بالتوضيح؟", "opts": ["Could you clarify that, please? | ممكن توضّح ده من فضلك؟", "Sorry, I don't understand. | آسف مش فاهم.", "Is that so? | بجد؟"], "ans": 0, "why": "Clarification checks ask the speaker to explain more; saying sorry, I don't understand is a comprehension check. | التأكد بالتوضيح بيطلب من المتكلم يشرح أكتر؛ قول آسف مش فاهم تأكد من الفهم.", "ex": ["Correct. | صح.", "No. That is a comprehension check. | غلط: ده تأكد من الفهم.", "No. That is a minimal response. | غلط: ده رد دنيا."], "n": 1, "i": 97, "h": ""}, {"t": "tf", "q": "Sorry, I'm not sure I'm following you is a clarification check.<br>آسف مش متأكد إني ماشي معاك ده تأكد بالتوضيح.", "ans": false, "why": "False. It is a comprehension check: the listener says they have not understood. | غلط. ده تأكد من الفهم: السامع بيقول إنه مافهمش.", "ex": ["Correct. It signals your own lack of understanding. | صح: ده بيعلّن عدم فهمك إنت.", "Wrong. Clarification checks ask the speaker to explain. | غلط: التأكد بالتوضيح بيطلب من المتكلم يشرح."], "n": 1, "i": 98, "h": ""}, {"t": "mc", "q": "In the hot seat activity, the volunteer must:<br>في نشاط المقعد السخن، المتطوع لازم:", "opts": ["guess a word on the board from the class's descriptions | يخمّن كلمة على السبورة من أوصاف الفصل", "describe a word for the class to guess | يوصف كلمة للفصل يخمّنوها", "answer twenty questions | يجاوب على عشرين سؤال"], "ans": 0, "why": "The volunteer sits with their back to the board and guesses the word the others describe. | المتطوع بيقعد ضهره للسبورة وبيخمّن الكلمة اللي الباقي بيوصفوها.", "ex": ["Correct. | صح.", "No. The class describes, the volunteer guesses. | غلط: الفصل بيوصف، المتطوع بيخمّن.", "No. That is a different activity. | غلط: ده نشاط تاني."], "n": 1, "i": 99, "h": ""}, {"t": "mc", "q": "In twenty questions, which is NOT allowed?<br>في عشرين سؤال، إيه الممنوع؟", "opts": ["questions with or, like: is she a sportswoman or a politician? | أسئلة فيها أو، زي: رياضية ولا سياسية؟", "yes-or-no questions | أسئلة أيوه أو لأ", "asking if the character is alive | السؤال لو الشخصية عايشة"], "ans": 0, "why": "Or-questions are really two questions in one, so they are not allowed. | أسئلة أو في الحقيقة سؤالين في واحد، فممنوعة.", "ex": ["Correct. | صح.", "No. Yes-or-no questions are exactly how the game works. | غلط: أسئلة أيوه أو لأ هي أساس اللعبة.", "No. That is a normal yes-or-no question. | غلط: ده سؤال أيوه أو لأ عادي."], "n": 1, "i": 100, "h": ""}, {"t": "mc", "q": "In odd-man-out, students must:<br>في نشاط الغريب، الطلبة لازم:", "opts": ["explain why one of four words does not belong | يفسّروا ليه كلمة من أربعة مش تابعة للمجموعة", "spell a word letter by letter | يهجّوا كلمة حرف بحرف", "match words to definitions | يطابقوا كلمات بتعريفات"], "ans": 0, "why": "Students analyse the relationship between four words and identify the one that does not fit. | الطلبة بيحلّلوا العلاقة بين أربع كلمات ويحدّدوا اللي مش مناسبة.", "ex": ["Correct. | صح.", "No. That is hangman. | غلط: دي لعبة الرجل المشنوق.", "No. That is matching definitions. | غلط: دي مطابقة التعريفات."], "n": 1, "i": 101, "h": ""}, {"t": "recall", "q": "Name the three speaking strategies from this module.<br>اذكر استراتيجيات الكلام التلاتة من الموديول ده.", "a": "1. Using minimal responses. 2. Recognising scripts. 3. Using clarification and comprehension responses.<br>١. استخدام الردود الدنيا. ٢. التعرف على السكريبتات. ٣. استخدام ردود التوضيح والفهم.", "n": 1, "i": 102, "h": ""}, {"t": "recall", "q": "Name five ways to present new vocabulary.<br>اذكر خمس طرق لتقديم مفردات جديدة.", "a": "Any five of: context, miming or gesturing, substitution drills, antonyms or synonyms, hangman, odd-man-out, matching definitions, gapped dictation, using dictionaries, keeping a vocabulary record, using drawings or pictures, labelling.<br>أي خمسة من: السياق، التمثيل الصامت أو الإيماءات، تدريبات الاستبدال، الأضداد أو المرادفات، الرجل المشنوق، الغريب، مطابقة التعريفات، الإملاء المنقوص، استخدام القواميس، الاحتفاظ بسجل مفردات، استخدام الرسومات أو الصور، التسمية.", "n": 1, "i": 103, "h": ""}, {"t": "write", "q": "Why should you encourage students to use clarification and comprehension phrases in class? (3-4 sentences)<br>ليه المفروض تشجّع الطلبة يستخدموا عبارات التوضيح والفهم في الفصل؟ (٣-٤ جمل).", "key": "tefl-46:1", "a": "Learners are often too embarrassed or shy to say they have not understood, so these phrases give them a safe way to speak up. Misunderstanding can happen in any interaction at any level, and students should know that. When the teacher responds positively, the classroom becomes an authentic practice environment. As students gain control of these strategies, they gain confidence for real communication outside the classroom.<br>المتعلمين غالبًا بيبقوا محرجين أو خجولين أوي يقولوا إنهم مافهموش، فالعبارات دي بتدّيهم طريقة آمنة يتكلموا. سوء الفهم ممكن يحصل في أي تفاعل في أي مستوى، والطلبة المفروض يعرفوا ده. ولما المدرس بيرد بإيجابية، الفصل بيبقى بيئة تدريب حقيقية. ومع ما الطلبة بيسيطروا على الاستراتيجيات دي، بيكسبوا ثقة للتواصل الحقيقي برّه الفصل.", "n": 1, "i": 104, "h": ""}, {"t": "write", "q": "Describe one speaking activity from this lesson and how it works. (3-4 sentences)<br>اوصف نشاط كلام واحد من الدرس ده وإزاي بيشتغل. (٣-٤ جمل).", "key": "tefl-46:2", "a": "In the hot seat, a chair is placed with its back to the board and a volunteer sits in it. The teacher writes a word on the board that the volunteer cannot see. The rest of the class describes the word to help the volunteer guess it, and beginners can be told the category or theme. It gets everyone talking and works best with vocabulary the class is currently studying.<br>في المقعد السخن، بيتحط كرسي ضهره للسبورة ومتطوع بيقعد عليه. المدرس بيكتب كلمة على السبورة المتطوع مش شايفها. باقي الفصل بيوصف الكلمة عشان يساعد المتطوع يخمّنها، والمبتدئين ممكن يتقالهم الفئة أو الموضوع. النشاط بيخلّي الكل يتكلم وبيشتغل أحسن مع المفردات اللي الفصل بيدرسها حاليًا.", "n": 1, "i": 105, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 10, the writing skill.</div><div class=\"u\">الدرس الجاي: الموديول العاشر، مهارة الكتابة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 106}];</script>
