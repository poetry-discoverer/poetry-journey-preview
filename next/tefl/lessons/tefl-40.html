<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤٠</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-40";window.STEPS=[{"t": "section", "h": "What it is + functions | يعني إيه + الوظايف", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Functional language is a way of categorising language according to its function, or purpose, as opposed to its grammar or phonology.</div><div class=\"u\">اللغة الوظيفية طريقة لتصنيف اللغة حسب وظيفتها، أو غرضها، بدل قواعدها أو صوتياتها.</div>", "n": 1, "i": 1, "a": "tefl-40-001", "x": "f6441908"}, {"t": "learn", "h": "<div class=\"u\">There is a reason for everything we say or write; otherwise why say or write it?</div><div class=\"u\">في سبب لكل حاجة بنقولها أو بنكتبها؛ وإلا ليه نقولها أو نكتبها أصلًا؟</div>", "n": 1, "i": 2, "a": "tefl-40-002", "x": "669ece9e"}, {"t": "learn", "h": "<div class=\"u\">As the writer Scrivener notes in his book Learning Teaching: people do not speak or write to each other to show off their ability to make grammatically correct sentences. Obviously not.</div><div class=\"u\">زي ما الكاتب سكريفنر بيلاحظ في كتابه تعليم التعلّم: الناس مابتتكلمش أو بتكتب لبعض عشان تتفاخر بقدرتها تعمل جمل صح قواعديًا. أكيد لأ.</div>", "n": 1, "i": 3, "a": "tefl-40-003", "x": "aedf8c83"}, {"t": "learn", "h": "<div class=\"u\">Instead, we use language to communicate messages and their meaning.</div><div class=\"u\">بدل كده، بنستخدم اللغة عشان نوصّل رسايل ومعناها.</div>", "n": 1, "i": 4, "a": "tefl-40-004", "x": "03d8581c"}, {"t": "learn", "h": "<div class=\"u\">Function describes the way we use language and its meaning in a certain context.</div><div class=\"u\">الوظيفة بتوصف الطريقة اللي بنستخدم بيها اللغة ومعناها في سياق معين.</div>", "n": 1, "i": 5, "a": "tefl-40-005", "x": "490c8ac0"}, {"t": "learn", "h": "<div class=\"u\">Some common functions of language are: agreeing and disagreeing, greeting, thanking, expressing preference, and inviting.</div><div class=\"u\">بعض الوظايف الشائعة للغة هي: الموافقة والاعتراض، التحية، الشكر، التعبير عن التفضيل، والدعوة.</div>", "n": 1, "i": 6, "a": "tefl-40-006", "x": "c9aa8ec0"}, {"t": "learn", "h": "<div class=\"u\">More common functions: requesting, clarifying, apologising, refusing, and advising.</div><div class=\"u\">وظايف شائعة تانية: الطلب، الاستيضاح، الاعتذار، الرفض، والنصيحة.</div>", "n": 1, "i": 7, "a": "tefl-40-007", "x": "af2da0f4"}, {"t": "section", "h": "Exponents | المنفّذات", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">The expressions we use to convey a function are called exponents.</div><div class=\"u\">التعبيرات اللي بنستخدمها عشان نوصّل وظيفة بتتسمى المنفّذات.</div>", "n": 1, "i": 9, "a": "tefl-40-008", "x": "f1793281"}, {"t": "learn", "h": "<div class=\"u\">For example, the sentence I would like to introduce you to my colleague, Matthew, is an exponent with the function of introducing people.</div><div class=\"u\">مثال، جملة حابب أعرّفك على زميلي ماثيو هي منفّذ وظيفته تعريف الناس ببعض.</div>", "n": 1, "i": 10, "a": "tefl-40-009", "x": "b0f66aed"}, {"t": "learn", "h": "<div class=\"u\">Match-up answers: Good afternoon everyone is greeting.</div><div class=\"u\">إجابات المطابقة: مساء الخير جماعة هي تحية.</div>", "n": 1, "i": 11, "a": "tefl-40-010", "x": "3cf04ad6"}, {"t": "learn", "h": "<div class=\"u\">Let's go to the park today is making a suggestion.</div><div class=\"u\">يلّا نروح الجنينة النهارده هي اقتراح.</div>", "n": 1, "i": 12, "a": "tefl-40-011", "x": "18c0ea94"}, {"t": "learn", "h": "<div class=\"u\">Would you mind passing me the salt? is requesting politely.</div><div class=\"u\">ممكن تناولّي الملح؟ هي طلب بأدب.</div>", "n": 1, "i": 13, "a": "tefl-40-012", "x": "b1cf883e"}, {"t": "learn", "h": "<div class=\"u\">And Sorry, what? is clarifying.</div><div class=\"u\">وسوري، إيه؟ هي استيضاح.</div>", "n": 1, "i": 14, "a": "tefl-40-013", "x": "e990b9b2"}, {"t": "section", "h": "Context changes function | السياق بيغيّر الوظيفة", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">Depending on the context, the function of an exponent can change.</div><div class=\"u\">حسب السياق، وظيفة المنفّذ ممكن تتغيّر.</div>", "n": 1, "i": 16, "a": "tefl-40-014", "x": "143d6750"}, {"t": "learn", "h": "<div class=\"u\">Can I help you? said in a friendly manner by a shop assistant has the function of offering assistance, and potentially selling you something.</div><div class=\"u\">أقدر أساعدك؟ متقالة بود من بائع محل وظيفتها عرض المساعدة، وممكن بيعك حاجة.</div>", "n": 1, "i": 17, "a": "tefl-40-015", "x": "5997437f"}, {"t": "learn", "h": "<div class=\"u\">The same expression said by a teacher who finds students playing noisily outside her classroom door has the function of intimidating them and signalling that they should leave.</div><div class=\"u\">نفس التعبير متقال من مدرسة لاقية طلبة بيلعبوا بدوشة برّه باب فصلها وظيفته تخويفهم وإشارة إنهم يمشوا.</div>", "n": 1, "i": 18, "a": "tefl-40-016", "x": "3b4eff33"}, {"t": "learn", "h": "<div class=\"u\">Stress and intonation are therefore important, because the function of the exponent may change while the words themselves remain the same.</div><div class=\"u\">النبر والتنغيم عشان كده مهمين، لأن وظيفة المنفّذ ممكن تتغيّر بينما الكلمات نفسها بتفضل زي ما هي.</div>", "n": 1, "i": 19, "a": "tefl-40-017", "x": "83399d7c"}, {"t": "section", "h": "Register: same function, new words | المستوى: نفس الوظيفة، كلمات تانية", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Similarly, an exponent may change while the function stays the same. Context indicates the appropriate exponent for the situation.</div><div class=\"u\">وبالمثل، المنفّذ ممكن يتغيّر بينما الوظيفة بتفضل زي ما هي. السياق بيحدد المنفّذ المناسب للموقف.</div>", "n": 1, "i": 21, "a": "tefl-40-018", "x": "41d64912"}, {"t": "learn", "h": "<div class=\"u\">While the function remains the same, the register, the level of formality, of the exponent may change.</div><div class=\"u\">بينما الوظيفة بتفضل ثابتة، المستوى، درجة الرسمية، بتاع المنفّذ ممكن يتغيّر.</div>", "n": 1, "i": 22, "a": "tefl-40-019", "x": "9a883a0b"}, {"t": "learn", "h": "<div class=\"u\">Look at these exponents for clarifying, from least to most formal: You what? Sorry, what? Sorry, I didn't quite catch that.</div><div class=\"u\">بص على المنفّذات دي للاستيضاح، من الأقل للأكتر رسمية: إيه؟ سوري، إيه؟ سوري، مافهمتش اللي قلته كويس.</div>", "n": 1, "i": 23, "a": "tefl-40-020", "x": "977e7493"}, {"t": "learn", "h": "<div class=\"u\">More formal: Pardon, I didn't hear what you just said. Would you mind saying that again? And: I'm terribly sorry but I didn't hear exactly what you said. Would you mind repeating?</div><div class=\"u\">الأكتر رسمية: عفوًا، ماسمعتش اللي قلته للتو. ممكن تعيد اللي قلته؟ و: أنا آسف جدًا بس ماسمعتش بالظبط اللي قلته. ممكن تعيد؟</div>", "n": 1, "i": 24, "a": "tefl-40-021", "x": "2e872c65"}, {"t": "learn", "h": "<div class=\"u\">Which one would you say to a friend? A colleague? Your partner's parents? A government official?</div><div class=\"u\">أنهي واحد فيهم هتقوله لصاحبك؟ لزميلك؟ لأهل شريكتك؟ لموظف حكومي؟</div>", "n": 1, "i": 25, "a": "tefl-40-022", "x": "a7edd691"}, {"t": "learn", "h": "<div class=\"u\">Now order these greetings from least to most formal: Hi! Good afternoon. Yo, what's up? Hello. How do you do? Hey.</div><div class=\"u\">دلوقتي رتّب التحيات دي من الأقل للأكتر رسمية: هاي! مساء الخير. يووو، عامل إيه؟ أهلاً. إزاي حضرتك؟ هيه.</div>", "n": 1, "i": 26, "a": "tefl-40-023", "x": "9c070067"}, {"t": "learn", "h": "<div class=\"u\">The correct order: Yo, what's up? Then Hey. Then Hi! Then Hello. Then Good afternoon. Then How do you do?</div><div class=\"u\">الترتيب الصح: يووو، عامل إيه؟ وبعدين هيه. وبعدين هاي! وبعدين أهلاً. وبعدين مساء الخير. وبعدين إزاي حضرتك؟</div>", "n": 1, "i": 27, "a": "tefl-40-024", "x": "910cab8e"}, {"t": "section", "h": "Appropriacy + culture | المناسبة + الثقافة", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Sometimes it is possible to say grammatically correct sentences which are inappropriate to the context.</div><div class=\"u\">ساعات ممكن تقول جمل صح قواعديًا بس مش مناسبة للسياق.</div>", "n": 1, "i": 29, "a": "tefl-40-025", "x": "6ca0952f"}, {"t": "learn", "h": "<div class=\"u\">This can be done on purpose for effect. But generally, when learners say unsuitable things, it is because they have not grasped the level of formality of the situation.</div><div class=\"u\">ده ممكن يتعمل بقصد للتأثير. بس عمومًا، لما المتعلمين يقولوا حاجات مش مناسبة، ده لأنهم مابيستوعبوش مستوى رسمية الموقف.</div>", "n": 1, "i": 30, "a": "tefl-40-026", "x": "f05a2ccd"}, {"t": "learn", "h": "<div class=\"u\">Example: a student who says pass me that book, would you? to their teacher would seem rude.</div><div class=\"u\">مثال: طالب قال لمدرسته ناولّيني الكتاب ده، ممكن؟ هيبان قليل الذوق.</div>", "n": 1, "i": 31, "a": "tefl-40-027", "x": "e7a2bfae"}, {"t": "learn", "h": "<div class=\"u\">It is grammatically correct but not right for the context. Would you mind passing me that book, please? would be more suitable.</div><div class=\"u\">صح قواعديًا بس مش مناسبة للسياق. ممكن تناولّيني الكتاب ده لو سمحت؟ هتبقى أنسب.</div>", "n": 1, "i": 32, "a": "tefl-40-028", "x": "f37429ef"}, {"t": "learn", "h": "<div class=\"u\">However, to a friend, the original words would not cause any offence.</div><div class=\"u\">بس لصاحبك، الكلمات الأصلية مابتزعلش حد.</div>", "n": 1, "i": 33, "a": "tefl-40-029", "x": "dfc38955"}, {"t": "learn", "h": "<div class=\"u\">So knowing grammar is not the only important thing. Students need to be familiar with the types of language appropriate in different situations.</div><div class=\"u\">فمعرفة القواعد مش الحاجة المهمة الوحيدة. الطلبة محتاجين يكونوا عارفين أنواع اللغة المناسبة في المواقف المختلفة.</div>", "n": 1, "i": 34, "a": "tefl-40-030", "x": "f9db5f2e"}, {"t": "learn", "h": "<div class=\"u\">We also need to help them become culturally aware and understand some of the unwritten rules of social conduct.</div><div class=\"u\">وكمان محتاجين نساعدهم يبقوا واعيين ثقافيًا ويفهموا بعض القواعد غير المكتوبة للسلوك الاجتماعي.</div>", "n": 1, "i": 35, "a": "tefl-40-031", "x": "b0df36c9"}, {"t": "learn", "h": "<div class=\"u\">For example, the limited use of imperatives between adults, like give me two apples and an orange.</div><div class=\"u\">مثال، الاستخدام المحدود لصيغ الأمر بين الكبار، زي هاتلي تفاحتين وبرتقالة.</div>", "n": 1, "i": 36, "a": "tefl-40-032", "x": "b427b014"}, {"t": "section", "h": "Function lessons + fixed exponents | دروس الوظايف + المنفّذات الثابتة", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">You can plan lessons based on functions, too. These often focus on one particular function, like making complaints, polite requests, or sympathising.</div><div class=\"u\">تقدر كمان تخطّط دروس مبنية على الوظايف. دي غالبًا بتركّز على وظيفة واحدة، زي تقديم الشكاوى، الطلبات المؤدبة، أو التعاطف.</div>", "n": 1, "i": 38, "a": "tefl-40-033", "x": "1c510a5a"}, {"t": "learn", "h": "<div class=\"u\">These can be practised using role-plays and other activities.</div><div class=\"u\">دي ممكن تتدرب بلعب الأدوار وأنشطة تانية.</div>", "n": 1, "i": 39, "a": "tefl-40-034", "x": "533581b5"}, {"t": "learn", "h": "<div class=\"u\">Certain exponents are fixed expressions, while others are slightly more flexible.</div><div class=\"u\">منفّذات معينة تعبيرات ثابتة، بينما غيرها أمرّن شوية.</div>", "n": 1, "i": 40, "a": "tefl-40-035", "x": "189e5277"}, {"t": "learn", "h": "<div class=\"u\">If you are telephoning a company and are asked to wait, the expression please hold the line is often used. It is fixed: we cannot change any element without losing meaning.</div><div class=\"u\">لو بتكلّم شركة في التليفون وطلبوا منك تستنى، تعبير فضلًا استنى على الخط بيتستخدم كتير. ده ثابت: مابنقدرش نغيّر أي عنصر فيه من غير ما نفقد المعنى.</div>", "n": 1, "i": 41, "a": "tefl-40-036", "x": "b8de5a01"}, {"t": "learn", "h": "<div class=\"u\">Others, like I would be very grateful if you could send me a copy of the meeting agenda, can be adapted to many situations by changing the verb send and the other details.</div><div class=\"u\">غيرها، زي هبقى ممنون جدًا لو تقدر تبعتلي نسخة من جدول الاجتماع، ممكن تتكيّف لمواقف كتير بتغيير فعل تبعت والتفاصيل التانية.</div>", "n": 1, "i": 42, "a": "tefl-40-037", "x": "9f239c65"}, {"t": "learn", "h": "<div class=\"u\">Learners often enjoy lessons focusing on functions, because they feel they are really getting to grips with the language.</div><div class=\"u\">المتعلمين في الغالب بيستمتعوا بالدروس المركّزة على الوظايف، لأنهم بيحسوا إنهم فعلًا بيمسكوا اللغة بجد.</div>", "n": 1, "i": 43, "a": "tefl-40-038", "x": "fd1a03ff"}, {"t": "learn", "h": "<div class=\"u\">Functional language is an important part of any communicative classroom, because it teaches students to think about context and register, not just grammar.</div><div class=\"u\">اللغة الوظيفية جزء مهم من أي فصل تواصلي، لأنها بتعلّم الطلبة يفكّروا في السياق والمستوى، مش بس القواعد.</div>", "n": 1, "i": 44, "a": "tefl-40-039", "x": "3c45bd5c"}, {"t": "learn", "h": "<div class=\"u\">Combined with the study of grammar, it gives that grammar more meaning and gives your students a more rounded learning experience.</div><div class=\"u\">متجمعة مع دراسة القواعد، بتدّي القواعد دي معنى أكتر وبتدّي طلبتك تجربة تعلم أكمل.</div>", "n": 1, "i": 45, "a": "tefl-40-040", "x": "532d9c5f"}, {"t": "section", "h": "The video lesson | درس الفيديو", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">The course also shows an authentic elementary video lesson on functional language for illness and giving advice, taught by a teacher called Jane.</div><div class=\"u\">الكورس بيعرض كمان درس فيديو حقيقي لمستوى ابتدائي عن اللغة الوظيفية للأمراض وتقديم النصيحة، بتدرّسه مدرسة اسمها جين.</div>", "n": 1, "i": 47, "a": "tefl-40-041", "x": "ae463f5a"}, {"t": "learn", "h": "<div class=\"u\">The target lexis: he's got a headache, a temperature, a broken leg, a cough, stomach ache, toothache.</div><div class=\"u\">المفردات المستهدفة: هو عنده صداع، سخونية، رجل مكسورة، كحة، مغص، وجع ضرس.</div>", "n": 1, "i": 48, "a": "tefl-40-042", "x": "c41b6679"}, {"t": "learn", "h": "<div class=\"u\">The target language for advice: you should go to the doctor, go to the dentist, go to bed, have a rest, go on holiday, go to hospital, take some tablets, take some medicine.</div><div class=\"u\">اللغة المستهدفة للنصيحة: المفروض تروح للدكتور، تروح لدكتور السنان، تنام، ترتاح، تروح مصيف، تروح المستشفى، تاخد حباية، تاخد دوا.</div>", "n": 1, "i": 49, "a": "tefl-40-043", "x": "884f365e"}, {"t": "learn", "h": "<div class=\"u\">How does Jane deal with the problems? Medicine versus tablets: she used realia, simply showing a strip of tablets and a bottle of medicine.</div><div class=\"u\">جين بتعالج المشاكل إزاي؟ الدوا مقابل الحباية: استخدمت حاجات حقيقية، ببساطة ورّت شريط حباية وزجاجة دوا.</div>", "n": 1, "i": 50, "a": "tefl-40-044", "x": "847a53b6"}, {"t": "learn", "h": "<div class=\"u\">He's got confusion with is: she highlighted the grammatical form using her fingers, and put a clear written record on the board: he's got equals he has got.</div><div class=\"u\">لخبطة هو عنده مع هو: وضّحت الشكل القواعدي بصوابعها، وحطّت سجل مكتوب واضح على السبورة: عنده يساوي هو عنده.</div>", "n": 1, "i": 51, "a": "tefl-40-045", "x": "c19caaeb"}, {"t": "learn", "h": "<div class=\"u\">Missing article, like he's got cough: she modelled and drilled the sentence, used her fingers to correct, and gave a clear written record on the board.</div><div class=\"u\">الأداة الناقصة، زي هو عنده كحة من غير أداة: مثّلت الجملة ودرّبتها، واستخدمت صوابعها للتصحيح، وادّت سجل مكتوب واضح على السبورة.</div>", "n": 1, "i": 52, "a": "tefl-40-046", "x": "13db43c6"}, {"t": "learn", "h": "<div class=\"u\">Sentence stress difficulty: she did a lot of choral, whole class, and individual drilling, elicited the stress placement from students, then marked the stress on the board.</div><div class=\"u\">صعوبة نبر الجملة: عملت تدريب جماعي كتير، الفصل كله، وتدريب فردي، استخرجت مكان النبر من الطلبة، وبعدين علّمت النبر على السبورة.</div>", "n": 1, "i": 53, "a": "tefl-40-047", "x": "2c56d543"}, {"t": "learn", "h": "<div class=\"u\">Difficult sounds like ache, which students might say wrong, and cough with its surprise sound: more choral and individual drilling, and copying her lips, teeth and tongue position.</div><div class=\"u\">الأصوات الصعبة زي آك، اللي الطلبة ممكن يقولوها غلط، وكف بصوتها المفاجئ: تدريب جماعي وفردي أكتر، وتقليد وضع شفايفها وسنانها ولسانها.</div>", "n": 1, "i": 54, "a": "tefl-40-048", "x": "3fed1cf4"}, {"t": "learn", "h": "<div class=\"u\">She also marked the phonemic symbols next to the difficult sounds.</div><div class=\"u\">وكمان علّمت الرموز الفونيمية جنب الأصوات الصعبة.</div>", "n": 1, "i": 55, "a": "tefl-40-049", "x": "514b3edc"}, {"t": "learn", "h": "<div class=\"u\">Missing contractions, like he got instead of he's got: finger highlighting, drilling, and a clear board record.</div><div class=\"u\">الاختصارات الناقصة، زي هو عنده من غير اختصار: توضيح بالصوابع، تدريب، وسجل واضح على السبورة.</div>", "n": 1, "i": 56, "a": "tefl-40-050", "x": "406e0617"}, {"t": "learn", "h": "<div class=\"u\">Long explanations: she graded her language and kept things simple, with short prompts like okay, question? listen, a kind doctor says it like this, and so, ask me.</div><div class=\"u\">الشروحات الطويلة: درّجت لغتها وخلّت الحاجات بسيطة، بمحفّزات قصيرة زي أوكي، سؤال؟ اسمع، دكتور لطيف بيقولها كده، وطب، اسألني.</div>", "n": 1, "i": 57, "a": "tefl-40-051", "x": "4a4be67d"}, {"t": "learn", "h": "<div class=\"u\">Her board work was planned before the lesson, clear and useful. Make sure yours is something students can read, understand, and benefit from days later.</div><div class=\"u\">شغل السبورة بتاعها كان متخطّط قبل الدرس، واضح ومفيد. اتأكد إن بتاعك حاجة الطلبة يقدروا يقروها ويفهموها ويستفادوا منها بعد أيام.</div>", "n": 1, "i": 58, "a": "tefl-40-052", "x": "2f323862"}, {"t": "learn", "h": "<div class=\"u\">Materials: the opposite of huge amounts. A small amount of material goes a long way; an elementary class needs lots of recapping and recycling, and enough time for practice.</div><div class=\"u\">المواد: عكس الكميات الضخمة. كمية صغيرة من المادة بتروح بعيد؛ الفصل الابتدائي محتاج مراجعة وتكرار كتير، ووقت كفاية للتدريب.</div>", "n": 1, "i": 59, "a": "tefl-40-053", "x": "7da1edfa"}, {"t": "learn", "h": "<div class=\"u\">And for pronunciation of new or difficult language: repetition. This level of students wants and needs lots of drilling.</div><div class=\"u\">ولنطق اللغة الجديدة أو الصعبة: التكرار. المستوى ده من الطلبة عايز ومحتاج تدريب متكرر كتير.</div>", "n": 1, "i": 60, "a": "tefl-40-054", "x": "09c938fc"}, {"t": "section", "h": "Unit questions | أسئلة الوحدة", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">Question one: what is the function of I get what you're saying, but...? Answer: disagreeing.</div><div class=\"u\">سؤال واحد: إيه وظيفة أنا فاهم اللي بتقوله، بس...؟ الإجابة: الاعتراض.</div>", "n": 1, "i": 62, "a": "tefl-40-055", "x": "a2a65ea7"}, {"t": "learn", "h": "<div class=\"u\">Question two: which is the most formal way of apologising? Answer: I do apologise.</div><div class=\"u\">سؤال اتنين: أنهي أكتر طريقة رسمية للاعتذار؟ الإجابة: أنا باعتذر بجد.</div>", "n": 1, "i": 63, "a": "tefl-40-056", "x": "22dbca25"}, {"t": "learn", "h": "<div class=\"u\">Question three: which exponent has the function of agreeing? Answer: True.</div><div class=\"u\">سؤال تلاتة: أنهي منفّذ وظيفته الموافقة؟ الإجابة: صح.</div>", "n": 1, "i": 64, "a": "tefl-40-057", "x": "1214b044"}, {"t": "learn", "h": "<div class=\"u\">Question four: what is the function of put it over there? Answer: giving instructions.</div><div class=\"u\">سؤال أربعة: إيه وظيفة حطّه هناك؟ الإجابة: إعطاء تعليمات.</div>", "n": 1, "i": 65, "a": "tefl-40-058", "x": "9a0746b6"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 66}, {"t": "learn", "h": "<div class=\"u\">functional language: language categorised by its purpose.</div><div class=\"u\">اللغة الوظيفية: لغة متصنّفة حسب غرضها.</div>", "n": 1, "i": 67, "a": "tefl-40-059", "x": "14f624dc"}, {"t": "learn", "h": "<div class=\"u\">function: the purpose of what we say, like greeting or refusing.</div><div class=\"u\">الوظيفة: غرض اللي بنقوله، زي التحية أو الرفض.</div>", "n": 1, "i": 68, "a": "tefl-40-060", "x": "ca73688e"}, {"t": "learn", "h": "<div class=\"u\">exponent: an expression used to convey a function.</div><div class=\"u\">المنفّذ: تعبير بيتستخدم لتوصيل وظيفة.</div>", "n": 1, "i": 69, "a": "tefl-40-061", "x": "7e270867"}, {"t": "learn", "h": "<div class=\"u\">register: the level of formality of language.</div><div class=\"u\">المستوى: درجة رسمية اللغة.</div>", "n": 1, "i": 70, "a": "tefl-40-062", "x": "9e968ca3"}, {"t": "learn", "h": "<div class=\"u\">realia: real objects brought into the classroom.</div><div class=\"u\">الحاجات الحقيقية: أشياء حقيقية بتتجاب للفصل.</div>", "n": 1, "i": 71, "a": "tefl-40-063", "x": "96196860"}, {"t": "learn", "h": "<div class=\"u\">choral drilling: the whole class repeating together.</div><div class=\"u\">التدريب الجماعي: الفصل كله بيكرّر مع بعض.</div>", "n": 1, "i": 72, "a": "tefl-40-064", "x": "1713345e"}, {"t": "learn", "h": "<div class=\"u\">contraction: a shortened form, like he's for he has.</div><div class=\"u\">الاختصار: شكل مقصّر، زي هو عنده بدل هو عنده بالكامل.</div>", "n": 1, "i": 73, "a": "tefl-40-065", "x": "a80075ff"}, {"t": "learn", "h": "<div class=\"u\">role-play: acting out a situation in class.</div><div class=\"u\">لعب الأدوار: تمثيل موقف في الفصل.</div>", "n": 1, "i": 74, "a": "tefl-40-066", "x": "8c2100be"}, {"t": "learn", "h": "<div class=\"u\">cultural awareness: understanding a culture's unwritten social rules.</div><div class=\"u\">الوعي الثقافي: فهم القواعد الاجتماعية غير المكتوبة لثقافة.</div>", "n": 1, "i": 75, "a": "tefl-40-067", "x": "84a26626"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 76}, {"t": "learn", "h": "<div class=\"u\">Functional language sorts language by purpose, not grammar. Functions include greeting, requesting, apologising, advising and more.</div><div class=\"u\">اللغة الوظيفية بترتّب اللغة حسب الغرض، مش القواعد. الوظايف بتشمل التحية والطلب والاعتذار والنصيحة وأكتر.</div>", "n": 1, "i": 77, "a": "tefl-40-068", "x": "d1b0fa52"}, {"t": "learn", "h": "<div class=\"u\">Exponents carry functions. The same words can change function with context, stress and intonation.</div><div class=\"u\">المنفّذات بتحمل الوظايف. نفس الكلمات ممكن تغيّر وظيفتها مع السياق والنبر والتنغيم.</div>", "n": 1, "i": 78, "a": "tefl-40-069", "x": "4d848801"}, {"t": "learn", "h": "<div class=\"u\">The same function can keep its meaning across registers, from you what? to a very formal apology.</div><div class=\"u\">نفس الوظيفة ممكن تحافظ على معناها عبر المستويات، من إيه؟ لاعتذار رسمي جدًا.</div>", "n": 1, "i": 79, "a": "tefl-40-070", "x": "93a354e2"}, {"t": "learn", "h": "<div class=\"u\">Correct grammar can still be rude. Teach appropriacy, register, and the unwritten cultural rules.</div><div class=\"u\">القواعد الصح لسه ممكن تبقى قلة ذوق. علّم المناسبة والمستوى والقواعد الثقافية غير المكتوبة.</div>", "n": 1, "i": 80, "a": "tefl-40-071", "x": "c202a4fb"}, {"t": "learn", "h": "<div class=\"u\">Function lessons work well with role-plays, few materials, graded language, planned boards, and lots of drilling.</div><div class=\"u\">دروس الوظايف بتنجح مع لعب الأدوار، ومواد قليلة، ولغة متدرجة، وسبورات متخططة، وتدريب كتير.</div>", "n": 1, "i": 81, "a": "tefl-40-072", "x": "d1aae759"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 82}, {"t": "mc", "q": "What is the function of I get what you're saying, but...?<br>إيه وظيفة أنا فاهم اللي بتقوله، بس...؟", "opts": ["disagreeing | الاعتراض", "refusing | الرفض", "apologising | الاعتذار"], "ans": 0, "why": "The but signals polite disagreement after acknowledging the other view. | ال بس بتشاور على اعتراض مؤدب بعد الاعتراف بوجهة النظر التانية.", "ex": ["Correct. | صح.", "No. Nothing is being refused. | غلط: مفيش حاجة بترفض.", "No. No apology here. | غلط: مفيش اعتذار هنا."], "n": 1, "i": 83, "h": ""}, {"t": "mc", "q": "Which is the most formal way of apologising?<br>أنهي أكتر طريقة رسمية للاعتذار؟", "opts": ["I do apologise | أنا باعتذر بجد", "Sorry | سوري", "My bad | غلطتي"], "ans": 0, "why": "I do apologise is the most formal register of the three. | أنا باعتذر بجد هي أرقى مستوى في التلاتة.", "ex": ["Correct. | صح.", "No. That is everyday informal. | غلط: دي يومية غير رسمية.", "No. That is very casual. | غلط: دي كاجوال أوي."], "n": 1, "i": 84, "h": ""}, {"t": "mc", "q": "Which exponent has the function of agreeing?<br>أنهي منفّذ وظيفته الموافقة؟", "opts": ["True | صح", "Surely not | أكيد لأ", "No way | مستحيل"], "ans": 0, "why": "True confirms the other person's point: agreement. | صح بتأكّد نقطة الشخص التاني: موافقة.", "ex": ["Correct. | صح.", "No. That expresses doubt. | غلط: دي بتعبّر عن شك.", "No. That is refusal or disbelief. | غلط: دي رفض أو عدم تصديق."], "n": 1, "i": 85, "h": ""}, {"t": "mc", "q": "What is the function of Put it over there?<br>إيه وظيفة حطّه هناك؟", "opts": ["giving instructions | إعطاء تعليمات", "complaining | الشكوى", "clarifying | الاستيضاح"], "ans": 0, "why": "It tells someone what to do: an instruction. | بتقول لحد يعمل إيه: تعليمات.", "ex": ["Correct. | صح.", "No. No complaint is expressed. | غلط: مفيش شكوى.", "No. Nothing is being clarified. | غلط: مفيش حاجة بتتستوضح."], "n": 1, "i": 86, "h": ""}, {"t": "mc", "q": "Sorry, what? has the function of:<br>سوري، إيه؟ وظيفتها:", "opts": ["clarifying | الاستيضاح", "greeting | التحية", "thanking | الشكر"], "ans": 0, "why": "The speaker is asking the other person to repeat or explain. | المتكلم بيطلب من الشخص التاني يعيد أو يوضّح.", "ex": ["Correct. | صح.", "No. It is not a greeting. | غلط: مش تحية.", "No. Nothing is being thanked. | غلط: مفيش شكر."], "n": 1, "i": 87, "h": ""}, {"t": "tf", "q": "The function of an exponent can change depending on the context, while the words stay the same.<br>وظيفة المنفّذ ممكن تتغيّر حسب السياق، بينما الكلمات بتفضل زي ما هي.", "ans": true, "why": "True. Can I help you? can offer assistance or signal noisy students to leave. | صح. أقدر أساعدك؟ ممكن تعرض مساعدة أو تطرد طلبة دوشة.", "ex": ["Correct. | صح.", "Wrong. Context changes function. | غلط: السياق بيغيّر الوظيفة."], "n": 1, "i": 88, "h": ""}, {"t": "mc", "q": "The correct greeting order from least to most formal is:<br>ترتيب التحيات الصح من الأقل للأكتر رسمية هو:", "opts": ["Yo, Hey, Hi, Hello, Good afternoon, How do you do | يووو، هيه، هاي، أهلاً، مساء الخير، إزاي حضرتك", "Hello, Hi, Hey, Yo, How do you do, Good afternoon | أهلاً، هاي، هيه، يووو، إزاي حضرتك، مساء الخير", "How do you do, Good afternoon, Hello, Hi, Hey, Yo | إزاي حضرتك، مساء الخير، أهلاً، هاي، هيه، يووو"], "ans": 0, "why": "Yo is the most casual; How do you do is the most formal. | يووو هي الأكتر كاجوال؛ إزاي حضرتك هي الأكتر رسمية.", "ex": ["Correct. | صح.", "No. That order is jumbled. | غلط: الترتيب ده مخلوط.", "No. That is most to least formal. | غلط: ده من الأكتر للأقل رسمية."], "n": 1, "i": 89, "h": ""}, {"t": "tf", "q": "Please hold the line is a fixed exponent that cannot be changed without losing meaning.<br>فضلًا استنى على الخط منفّذ ثابت مابيتغيّرش من غير ما يفقد معناه.", "ans": true, "why": "True. Other exponents, like I would be very grateful if you could send..., can be adapted. | صح. منفّذات تانية، زي هبقى ممنون لو تبعتلي...، ممكن تتكيّف.", "ex": ["Correct. | صح.", "Wrong. Changing its elements breaks the meaning. | غلط: تغيير عناصره بيكسّر المعنى."], "n": 1, "i": 90, "h": ""}, {"t": "recall", "q": "Name at least eight common functions of language.<br>اذكر على الأقل تمن وظايف شائعة للغة.", "a": "Agreeing, disagreeing, greeting, thanking, expressing preference, inviting, requesting, clarifying, apologising, refusing, advising.<br>الموافقة، الاعتراض، التحية، الشكر، التعبير عن التفضيل، الدعوة، الطلب، الاستيضاح، الاعتذار، الرفض، النصيحة.", "n": 1, "i": 91, "h": ""}, {"t": "recall", "q": "Give four techniques Jane used in the video lesson.<br>اذكر أربع تقنيات جين استخدمتها في درس الفيديو.", "a": "Realia for medicine versus tablets; finger highlighting for form; choral and individual drilling with stress marked on the board; phonemic symbols and copying mouth positions for difficult sounds; graded simple language; board work planned before the lesson; very few materials with lots of recycling.<br>حاجات حقيقية للدوا مقابل الحباية؛ توضيح بالصوابع للشكل؛ تدريب جماعي وفردي مع نبر متعلّم على السبورة؛ رموز فونيمية وتقليد أوضاع البؤ للأصوات الصعبة؛ لغة متدرجة بسيطة؛ شغل سبورة متخطط قبل الدرس؛ مواد قليلة أوي مع تكرار كتير.", "n": 1, "i": 92, "h": ""}, {"t": "write", "q": "Why is grammar alone not enough for learners? (3-4 sentences)<br>ليه القواعد لوحدها مش كفاية للمتعلمين؟ (٣-٤ جمل).", "key": "tefl-40:1", "a": "A sentence can be grammatically correct and still rude, like asking a teacher to pass me that book. Learners need to know which language fits which situation, and that means register. They also need cultural awareness: the unwritten rules, like the limited use of imperatives between adults. Functional language lessons teach exactly this, so grammar gains meaning and students gain a rounded experience.<br>الجملة ممكن تكون صح قواعديًا ولسه قليلة الذوق، زي طلب من المدرسة ناولّيني الكتاب ده. المتعلمين محتاجين يعرفوا أنهي لغة تناسب أنهي موقف، وده يعني المستوى. وكمان محتاجين وعي ثقافي: القواعد غير المكتوبة، زي الاستخدام المحدود لصيغ الأمر بين الكبار. دروس اللغة الوظيفية بتعلّم ده بالظبط، فالقواعد بتكسب معنى والطلبة بيكسبوا تجربة أكمل.", "n": 1, "i": 93, "h": ""}, {"t": "write", "q": "Explain how the same exponent can have different functions, with an example (3-4 sentences).<br>اشرح إزاي نفس المنفّذ ممكن يبقى ليه وظايف مختلفة، بمثال (٣-٤ جمل).", "key": "tefl-40:2", "a": "The words of an exponent stay the same, but the context decides its function. Can I help you? from a friendly shop assistant offers assistance and maybe a sale. The same words from a teacher finding noisy students at her door intimidate them and tell them to leave. Stress and intonation carry much of the difference. That is why teaching words without teaching context is only half the job.<br>كلمات المنفّذ بتفضل زي ما هي، بس السياق بيقرر وظيفتها. أقدر أساعدك؟ من بائع محل ودود بتعرض مساعدة وممكن بيع. نفس الكلمات من مدرسة لاقية طلبة دوشة عند بابها بتخوّفهم وبتقولهم يمشوا. النبر والتنغيم شايلين جزء كبير من الفرق. عشان كده تعليم الكلمات من غير تعليم السياق نص الشغلانة بس.", "n": 1, "i": 94, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 7 begins. Module 6 is complete!</div><div class=\"u\">الدرس الجاي: بداية الموديول السابع. الموديول السادس خلص!</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 95}];</script>
