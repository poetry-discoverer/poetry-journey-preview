<h1>عالم تيفل ٥٨: سرد القصص والتعلّم منها</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٥٨</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-58";window.STEPS=[{"t": "section", "h": "Why storytelling | ليه سرد القصص", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit three: storytelling. Storytelling and drama both lend themselves perfectly to the EFL classroom.</div><div class=\"u\">الوحدة التالتة: سرد القصص. سرد القصص والدراما الاتنين بيليقوا تمامًا على فصل الإنجليزي.</div>", "n": 1, "i": 1, "a": "tefl-58-001", "x": "f24eb291"}, {"t": "learn", "h": "<div class=\"u\">They allow us to play to children's natural affinity for imagination and play. In many ways, children learn through stories and drama.</div><div class=\"u\">بيسمحوا لينا نلعب على غريزة الأطفال الطبيعية للخيال واللعب. بطرق كتير، الأطفال بيتعلّموا من خلال القصص والدراما.</div>", "n": 1, "i": 2, "a": "tefl-58-002", "x": "70d88f97"}, {"t": "learn", "h": "<div class=\"u\">They can learn about themselves by becoming completely engrossed in a story, or by becoming a character, in a very familiar, fun and safe way.</div><div class=\"u\">يقدروا يتعلّموا عن نفسهم بإنهم يندمجوا تمامًا في قصة، أو يبقوا شخصية فيها، بطريقة مألوفة وممتعة وآمنة جدًا.</div>", "n": 1, "i": 3, "a": "tefl-58-003", "x": "42467564"}, {"t": "learn", "h": "<div class=\"u\">Imagine how much fun your children will have when your classroom, by the power of some blue paper and a lot of imagination, becomes an underwater world for the story of the little mermaid.</div><div class=\"u\">اتخيّل الأطفال هيبسطوا قد إيه لما فصلك، بقوة شوية ورق أزرق وخيال كتير، يبقى عالم تحت المية لقصة حورية البحر الصغيرة.</div>", "n": 1, "i": 4, "a": "tefl-58-004", "x": "d9feeac8"}, {"t": "learn", "h": "<div class=\"u\">Storytelling and drama are above all shared, communal classroom events which engage children's interest, attention and imagination, and develop their language skills in a holistic way.</div><div class=\"u\">سرد القصص والدراما قبل أي حاجة أحداث جماعية مشتركة في الفصل بتشرك اهتمام الأطفال وانتباههم وخيالهم، وبتطوّر مهاراتهم اللغوية بشكل متكامل.</div>", "n": 1, "i": 5, "a": "tefl-58-005", "x": "dd574703"}, {"t": "learn", "h": "<div class=\"u\">They also appeal to children with different intelligences, musical, movement and more, and different learning styles.</div><div class=\"u\">وبتجذب كمان الأطفال بذكاءات مختلفة، موسيقي وحركي وغيرهم، وأنماط تعلّم مختلفة.</div>", "n": 1, "i": 6, "a": "tefl-58-006", "x": "472516f8"}, {"t": "learn", "h": "<div class=\"u\">And they allow us to facilitate social skills and attitudes, such as active listening, collaborating, turn taking and respect for others, in a positive way.</div><div class=\"u\">وبتسمح لينا نسهّل مهارات ومواقف اجتماعية، زي الاستماع النشط والتعاون وتبادل الأدوار واحترام التانيين، بطريقة إيجابية.</div>", "n": 1, "i": 7, "a": "tefl-58-007", "x": "6fd10c62"}, {"t": "section", "h": "Learning through stories | التعلّم من القصص", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">Learning through stories. Most children start school familiar with stories in their own language, and quickly transfer this into a willingness to listen to and participate in stories in English.</div><div class=\"u\">التعلّم من خلال القصص. أغلب الأطفال بيبدأوا المدرسة متألفين مع القصص بلغتهم، وبسرعة بينقلوا ده لاستعداد يسمعوا ويشاركوا في قصص بالإنجليزي.</div>", "n": 1, "i": 9, "a": "tefl-58-008", "x": "340293d0"}, {"t": "learn", "h": "<div class=\"u\">Stories provide a natural, relevant and enjoyable context for exposure to language, and a chance to familiarise children with the sounds, rhythm and intonation of English.</div><div class=\"u\">القصص بتوّلي سياق طبيعي ومرتبط وممتع للتعرّض للغة، وفرصة تألّف الأطفال أصوات وإيقاع ونبرة الإنجليزي.</div>", "n": 1, "i": 10, "a": "tefl-58-009", "x": "367ca781"}, {"t": "learn", "h": "<div class=\"u\">The discovery and construction of meaning is supported through visuals, mime, gesture, voice and characterisation.</div><div class=\"u\">اكتشاف وبناء المعنى بيتدعّم بالصور والتمثيل الصامت والإيماءات والصوت وتقمص الشخصيات.</div>", "n": 1, "i": 11, "a": "tefl-58-010", "x": "e3329b68"}, {"t": "learn", "h": "<div class=\"u\">Children also develop learning strategies and thinking skills, such as predicting, hypothesising, guessing and inferring meaning.</div><div class=\"u\">الأطفال كمان بيطوّروا استراتيجيات تعلّم ومهارات تفكير، زي التوقّع وبناء الفرضيات والتخمين واستنتاج المعنى.</div>", "n": 1, "i": 12, "a": "tefl-58-011", "x": "53877c95"}, {"t": "learn", "h": "<div class=\"u\">Stories help young children develop concentration skills, and aspects of emotional intelligence, such as empathy and relating to other people.</div><div class=\"u\">القصص بتساعد الأطفال الصغيرين يطوّروا مهارات التركيز، وجوانب من الذكاء العاطفي، زي التعاطف والارتباط بالناس التانيين.</div>", "n": 1, "i": 13, "a": "tefl-58-012", "x": "8089c529"}, {"t": "learn", "h": "<div class=\"u\">Stories also provide a springboard for a wide range of activities which develop language, thinking skills and appreciation of other cultures.</div><div class=\"u\">القصص كمان بتوّلي نقطة انطلاق لمجموعة واسعة من الأنشطة اللي بتطوّر اللغة ومهارات التفكير وتقدير الثقافات التانية.</div>", "n": 1, "i": 14, "a": "tefl-58-013", "x": "1ff5ca14"}, {"t": "learn", "h": "<div class=\"u\">As children develop their ability to understand, retell, act out and create their own stories in English, this also has a positive effect on their motivation, confidence and self-esteem.</div><div class=\"u\">ومع ما الأطفال بيطوّروا قدرتهم يفهموا ويعيدوا حكاية ويمثّلوا ويخترعوا قصصهم بالإنجليزي، ده كمان بيأثّر إيجابيًا على دافعهم وثقتهم واحترامهم لذاتهم.</div>", "n": 1, "i": 15, "a": "tefl-58-014", "x": "6c10e00c"}, {"t": "section", "h": "Choosing stories | اختيار القصص", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">Choosing stories. Stories can be selected from graded readers, story websites on the internet, or picture books originally written for children whose first language is English.</div><div class=\"u\">اختيار القصص. القصص ممكن تتختار من الكتب المدرّجة، أو مواقع القصص على الإنترنت، أو كتب الصور المكتوبة أصلًا لأطفال لغتهم الأولى إنجليزي.</div>", "n": 1, "i": 17, "a": "tefl-58-015", "x": "fa8fa2b0"}, {"t": "learn", "h": "<div class=\"u\">If you are employed to teach children, it is advisable to buy a few second hand story books to take with you, as you never know what resources will be available once you arrive.</div><div class=\"u\">لو اتعيّنت تعلّم أطفال، المستحسن تشتري شوية كتب قصص مستعملة تاخدها معاك، لأنك عمري ما تعرف إيه الخامات اللي هتبقى متاحة لما توصل.</div>", "n": 1, "i": 18, "a": "tefl-58-016", "x": "dc3965a5"}, {"t": "learn", "h": "<div class=\"u\">Ensure the material is appropriate to the learners' needs. Review the content to check the subject matter is relevant to your lesson plan.</div><div class=\"u\">اتأكد إن المادة مناسبة لاحتياجات المتعلمين. راجِع المحتوى عشان تتشيك إن الموضوع مرتبط بخطة درسك.</div>", "n": 1, "i": 19, "a": "tefl-58-017", "x": "ccf11848"}, {"t": "learn", "h": "<div class=\"u\">Use interesting stories that appeal to the background of your students. Select stories with illustrations that capture attention.</div><div class=\"u\">استخدم قصص ممتعة بتجذب خلفية طلبتك. اختار قصص فيها رسوم بتمسك الانتباه.</div>", "n": 1, "i": 20, "a": "tefl-58-018", "x": "c671dd61"}, {"t": "learn", "h": "<div class=\"u\">Make any adjustments necessary to ensure a story's vocabulary and level is appropriate for the class or curriculum you are following.</div><div class=\"u\">اعمل أي تعديلات ضرورية عشان تتأكد إن مفردات القصة ومستواها مناسبين للفصل أو المنهج اللي ماشي عليه.</div>", "n": 1, "i": 21, "a": "tefl-58-019", "x": "0ce832ce"}, {"t": "learn", "h": "<div class=\"u\">Provide a variety of stories: literary classics, light-hearted funny stories, moving dramatic accounts and delightful fantasies all move imaginations and captivate attention.</div><div class=\"u\">وفّر تنويعة قصص: الكلاسيكيات الأدبية والقصص المضحكة الخفيفة والحكايات الدرامية المؤثرة والخيالات المبهجة كلها بتحرّك الخيال وبتسحر الانتباه.</div>", "n": 1, "i": 22, "a": "tefl-58-020", "x": "2332ca20"}, {"t": "learn", "h": "<div class=\"u\">Also think about: fables or stories with a moral, myths, legends, funny stories, rhyming stories, stories with flaps or pop-ups.</div><div class=\"u\">فكّر كمان في: الخرافات أو القصص اللي فيها عبرة، الأساطير، الحكايات الشعبية، القصص المضحكة، القصص المقوّفة، قصص اللسانيات أو البوب أب.</div>", "n": 1, "i": 23, "a": "tefl-58-021", "x": "bfa0bb4f"}, {"t": "learn", "h": "<div class=\"u\">And: biographical stories, stories which help children understand their own feelings, and stories from other cultures.</div><div class=\"u\">وكمان: القصص السيرية، القصص اللي بتساعد الأطفال يفهموا مشاعرهم، وقصص من ثقافات تانية.</div>", "n": 1, "i": 24, "a": "tefl-58-022", "x": "e6143138"}, {"t": "section", "h": "Telling stories | حكاية القصص", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">Telling stories. Do not let the flow of concentration be interrupted. That is why it is recommended to rehearse your storytelling.</div><div class=\"u\">حكاية القصص. ماتخليش تدفّق التركيز يتقطع. علشان كده المستحسن تتمرّن على سرد القصة.</div>", "n": 1, "i": 26, "a": "tefl-58-023", "x": "d4bbf341"}, {"t": "learn", "h": "<div class=\"u\">Rehearsing lets you discover points where a word or phrase can be enhanced with miming or actions, and moments to change your tone of voice or facial expression.</div><div class=\"u\">التمرين بيخلّيك تكتشف النقط اللي كلمة أو عبارة فيها ممكن تتقوّى بتمثيل صامت أو حركات، واللحظات اللي تغيّر فيها نبرة صوتك أو تعبير وشك.</div>", "n": 1, "i": 27, "a": "tefl-58-024", "x": "c66aa0bf"}, {"t": "learn", "h": "<div class=\"u\">A pause at just the right moment can create suspense or give a student the chance to pose a question. Critical pauses are invitations for engagement.</div><div class=\"u\">الوقفة في اللحظة المظبوطة ممكن تعمل تشويق أو تدّي طالب فرصة يسأل سؤال. الوقفات الحاسمة دعوات للمشاركة.</div>", "n": 1, "i": 28, "a": "tefl-58-025", "x": "9f4cc68c"}, {"t": "learn", "h": "<div class=\"u\">If you read a story from a book, make sure you are not hiding behind it, making it difficult for the class to hear you. Students must see your lips forming the words.</div><div class=\"u\">لو بتقرا قصة من كتاب، اتأكد إنك مش متخبّي وراه، فبيصعّب على الفصل يسمعوك. الطلبة لازم يشوفوا شفايفك وهي بتكوّن الكلمات.</div>", "n": 1, "i": 29, "a": "tefl-58-026", "x": "f3be06f4"}, {"t": "learn", "h": "<div class=\"u\">Hold the book with your face open and forward to the class. If the book has illustrations, stop from time to time and let the class enjoy associating pictures with words.</div><div class=\"u\">امسك الكتاب ووشك مفتوح وموجّه للفصل. لو الكتاب فيه رسوم، وقّف من وقت للتاني وخلّي الفصل يستمتعوا بربط الصور بالكلمات.</div>", "n": 1, "i": 30, "a": "tefl-58-027", "x": "53aa2070"}, {"t": "learn", "h": "<div class=\"u\">Consider the seating arrangement. A semi-circle of students on the floor at your feet creates an intimacy that captivates their attention, and makes it easier to hear you clearly.</div><div class=\"u\">فكّر في ترتيب القعدة. نص دايرة من الطلبة على الأرض عند رجليك بتعمل أُنس بيمسك انتباههم، وبيخلّيهم يسمعوك بوضوح أكتر.</div>", "n": 1, "i": 31, "a": "tefl-58-028", "x": "4627ad18"}, {"t": "learn", "h": "<div class=\"u\">When illustrations are shared, children at the back would have difficulty seeing them. In a semi-circle right in front of you, they will not feel left out.</div><div class=\"u\">لما الرسوم بتتشارك، الأطفال اللي في الضهر بيصعّب عليهم يشوفوها. في نص دايرة قدّامك على طول، مش هيحسّوا إنهم متسابين برّه.</div>", "n": 1, "i": 32, "a": "tefl-58-029", "x": "d48a36c0"}, {"t": "learn", "h": "<div class=\"u\">You may want to set the mood before you begin reading. A reading ritual of repeating a rhyme or song is perfectly appropriate right before story time.</div><div class=\"u\">ممكن تحب تجهّز الجو قبل ما تبدأ القراية. طقس قراية بتكرار قافية أو أغنية مناسب تمامًا قبل وقت القصة على طول.</div>", "n": 1, "i": 33, "a": "tefl-58-030", "x": "fcc333e8"}, {"t": "learn", "h": "<div class=\"u\">Do not get so wrapped up in the story that you forget your students. Frequent eye contact keeps students attentive, and it also helps maintain order in the classroom.</div><div class=\"u\">ماتندمجش في القصة لدرجة إنك تنسى طلبتك. التواصل البصري المتكرر بيخلّي الطلبة منتبهين، وكمان بيساعد يحافظ على النظام في الفصل.</div>", "n": 1, "i": 34, "a": "tefl-58-031", "x": "d9db06f7"}, {"t": "learn", "h": "<div class=\"u\">Respond to cues and body language that indicate a student has a question or is struggling to understand, or simply wants to comment. Encourage engagement and interaction.</div><div class=\"u\">رد على الإشارات ولغة الجسم اللي بتدلّ إن طالب عنده سؤال أو بيعاني يفهم، أو بس عايز يعلّق. شجّع المشاركة والتفاعل.</div>", "n": 1, "i": 35, "a": "tefl-58-032", "x": "289c47e1"}, {"t": "learn", "h": "<div class=\"u\">When the story is over, do not just say: the end, unceremoniously, and close the book.</div><div class=\"u\">لما القصة تخلّص، ماتقولش بس: النهاية، بشكل جاف، وتقفل الكتاب.</div>", "n": 1, "i": 36, "a": "tefl-58-033", "x": "1d15e6d4"}, {"t": "learn", "h": "<div class=\"u\">Give students the opportunity to respond or ask questions. They may have a similar experience to share, or want to explore feelings the story provoked.</div><div class=\"u\">ادّي الطلبة الفرصة يردّوا أو يسألوا أسئلة. ممكن يكون عندهم تجربة مشابهة يحكوها، أو عايزين يستكشفوا مشاعر القصة أثارتها.</div>", "n": 1, "i": 37, "a": "tefl-58-034", "x": "be59730f"}, {"t": "learn", "h": "<div class=\"u\">It is an excellent opportunity for everyone to exercise new vocabulary and reinforce conversational skills, while you prompt and promote further discussion.</div><div class=\"u\">دي فرصة ممتازة لكل حد يتمرّن على المفردات الجديدة ويعزّز مهارات المحادثة، وإنت بتوجّه وبتشجّع نقاش زيادة.</div>", "n": 1, "i": 38, "a": "tefl-58-035", "x": "e0503e6e"}, {"t": "section", "h": "Planning story lessons | تخطيط دروس القصص", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">Planning story-based lessons. Like other listening and reading activities, plan story lessons following the three stages: before, while and after.</div><div class=\"u\">تخطيط الدروس المبنية على القصص. زي أنشطة الاستماع والقراية التانية، خطّط دروس القصص باتباع المراحل التلاتة: قبل وأثناء وبعد.</div>", "n": 1, "i": 40, "a": "tefl-58-036", "x": "97e4092f"}, {"t": "learn", "h": "<div class=\"u\">Consider using extended stories over several lessons. It is easy to pick up a story where you left off the day before.</div><div class=\"u\">فكّر في استخدام قصص طويلة على كذا حصة. سهل تكمّل القصة من اللي وقّفت عنده إمبارح.</div>", "n": 1, "i": 41, "a": "tefl-58-037", "x": "c63f9bff"}, {"t": "learn", "h": "<div class=\"u\">This element creates suspense, motivating children not to miss a class, or they will not find out what happens next.</div><div class=\"u\">العنصر ده بيعمل تشويق، بيحفّز الأطفال ماتفوّتش حصة، وإلا مش هيعرفوا إيه اللي بيحصل بعد كده.</div>", "n": 1, "i": 42, "a": "tefl-58-038", "x": "b7ab3d47"}, {"t": "learn", "h": "<div class=\"u\">Create lesson plans centered on featured chapters, with activities that follow story time to reinforce learning about the events.</div><div class=\"u\">اعمل خطط دروس متمركزة على الفصول المعروضة، بأنشطة بتيجي بعد وقت القصة عشان تعزّز التعلّم عن الأحداث.</div>", "n": 1, "i": 43, "a": "tefl-58-039", "x": "52e48e36"}, {"t": "learn", "h": "<div class=\"u\">Ask open ended questions which allow students to predict, summarize and develop upon the narrative.</div><div class=\"u\">اسأل أسئلة مفتوحة بتسمح للطلبة يتوقّعوا ويلخّصوا ويطوّروا على الحكاية.</div>", "n": 1, "i": 44, "a": "tefl-58-040", "x": "b61d4505"}, {"t": "learn", "h": "<div class=\"u\">Another way to improvise storytelling is to re-tell the story: acting it out, designing a comic book version, or re-writing it as a theatrical play.</div><div class=\"u\">طريقة تانية للارتجال في سرد القصص هي إعادة حكاية القصة: تمثيلها، أو تصميم نسخة قصص مصوّرة، أو إعادة كتابتها كمسرحية.</div>", "n": 1, "i": 45, "a": "tefl-58-041", "x": "b612eeee"}, {"t": "learn", "h": "<div class=\"u\">The goal should be for students to use as much of the target language from the story as possible.</div><div class=\"u\">الهدف المفروض يبقى إن الطلبة يستخدموا أكبر قدر ممكن من اللغة المستهدفة بتاعة القصة.</div>", "n": 1, "i": 46, "a": "tefl-58-042", "x": "5b8ac2e5"}, {"t": "learn", "h": "<div class=\"u\">The storytelling cycle can be an effective lead-in to students producing the language through role-play or other forms of dramatization.</div><div class=\"u\">دايرة سرد القصص ممكن تبقى مدخل مؤثر لإنتاج الطلبة للغة من خلال لعب الأدوار أو أشكال تانية من التمثيل.</div>", "n": 1, "i": 47, "a": "tefl-58-043", "x": "02e462b2"}, {"t": "learn", "h": "<div class=\"u\">This is a top down approach to listening, as covered in modules seven and eight.</div><div class=\"u\">ده أسلوب استماع من فوق لتحت، زي ما اتغطّى في الوحدتين سبعة وتمنية.</div>", "n": 1, "i": 48, "a": "tefl-58-044", "x": "66eac911"}, {"t": "learn", "h": "<div class=\"u\">It is important for older children to be aware of how stories are created, and how they are structured.</div><div class=\"u\">مهم للأطفال الكبار يعرفوا القصص بتتخلق إزاي، وإزاي بتتبنى.</div>", "n": 1, "i": 49, "a": "tefl-58-045", "x": "ad498bd9"}, {"t": "learn", "h": "<div class=\"u\">Give students an opportunity to create their own stories based on what they have learned, as covered in modules nine and ten.</div><div class=\"u\">ادّي الطلبة فرصة يخترعوا قصصهم الخاصة مبنية على اللي اتعلّموه، زي ما اتغطّى في الوحدتين تسعة وعشرة.</div>", "n": 1, "i": 50, "a": "tefl-58-046", "x": "89bf0880"}, {"t": "learn", "h": "<div class=\"u\">And to enrich children's learning, it is often appropriate to integrate storytelling with drama, the next unit.</div><div class=\"u\">ولإغناء تعلّم الأطفال، غالبًا مناسب تدمج سرد القصص مع الدراما، الوحدة الجاية.</div>", "n": 1, "i": 51, "a": "tefl-58-047", "x": "dc05887b"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 52}, {"t": "learn", "h": "<div class=\"u\">storytelling: telling stories aloud to the class.</div><div class=\"u\">سرد القصص: حكاية القصص بصوت عالي للفصل.</div>", "n": 1, "i": 53, "a": "tefl-58-048", "x": "4650d515"}, {"t": "learn", "h": "<div class=\"u\">holistic: developing the whole child, not just one skill.</div><div class=\"u\">المتكامل: بيطوّر الطفل كله مش مهارة واحدة.</div>", "n": 1, "i": 54, "a": "tefl-58-049", "x": "a2b9617b"}, {"t": "learn", "h": "<div class=\"u\">graded readers: books written in levels for language learners.</div><div class=\"u\">الكتب المدرّجة: كتب مكتوبة بمستويات لمتعلمي اللغة.</div>", "n": 1, "i": 55, "a": "tefl-58-050", "x": "a3923583"}, {"t": "learn", "h": "<div class=\"u\">picture book: a book where illustrations carry the story.</div><div class=\"u\">كتاب الصور: كتاب الرسوم فيه بتحكي القصة.</div>", "n": 1, "i": 56, "a": "tefl-58-051", "x": "49fbe696"}, {"t": "learn", "h": "<div class=\"u\">suspense: the excited wait for what happens next.</div><div class=\"u\">التشويق: الانتظار المتحمّس للي هيحصل بعد كده.</div>", "n": 1, "i": 57, "a": "tefl-58-052", "x": "4c86747a"}, {"t": "learn", "h": "<div class=\"u\">semi-circle: a half-circle seating shape for story time.</div><div class=\"u\">نص الدايرة: شكل قعدة نص دائرية لوقت القصة.</div>", "n": 1, "i": 58, "a": "tefl-58-053", "x": "35b073de"}, {"t": "learn", "h": "<div class=\"u\">reading ritual: a repeated rhyme or song before the story.</div><div class=\"u\">طقس القراية: قافية أو أغنية متكررة قبل القصة.</div>", "n": 1, "i": 59, "a": "tefl-58-054", "x": "a4214bdc"}, {"t": "learn", "h": "<div class=\"u\">eye contact: looking at students to keep attention and order.</div><div class=\"u\">التواصل البصري: البصّة للطلبة للانتباه والنظام.</div>", "n": 1, "i": 60, "a": "tefl-58-055", "x": "4026b4ef"}, {"t": "learn", "h": "<div class=\"u\">open ended questions: questions with many possible answers.</div><div class=\"u\">الأسئلة المفتوحة: أسئلة ليها إجابات ممكنة كتير.</div>", "n": 1, "i": 61, "a": "tefl-58-056", "x": "c0b44a9c"}, {"t": "learn", "h": "<div class=\"u\">storytelling cycle: read, retell, act, create.</div><div class=\"u\">دايرة سرد القصص: اقرا وأعد الحكاية ومثّل واخترع.</div>", "n": 1, "i": 62, "a": "tefl-58-057", "x": "43d21f48"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 63}, {"t": "learn", "h": "<div class=\"u\">Storytelling and drama play to children's natural imagination, and teach them about themselves in a fun, safe way.</div><div class=\"u\">سرد القصص والدراما بيلعبوا على خيال الأطفال الطبيعي، وبيتعلّموهم عن نفسهم بطريقة ممتعة وآمنة.</div>", "n": 1, "i": 64, "a": "tefl-58-058", "x": "787601ea"}, {"t": "learn", "h": "<div class=\"u\">Stories give natural language exposure: sounds, rhythm, intonation, plus predicting, guessing and inferring.</div><div class=\"u\">القصص بتدّي تعرّض طبيعي للغة: أصوات وإيقاع ونبرة، زيادة التوقّع والتخمين والاستنتاج.</div>", "n": 1, "i": 65, "a": "tefl-58-059", "x": "34e8cd6b"}, {"t": "learn", "h": "<div class=\"u\">Choose stories from graded readers, websites and picture books; match needs, backgrounds, illustrations and level; vary the types.</div><div class=\"u\">اختار القصص من الكتب المدرّجة والمواقع وكتب الصور؛ طابِق الاحتياجات والخلفيات والرسوم والمستوى؛ نوّع الأنواع.</div>", "n": 1, "i": 66, "a": "tefl-58-060", "x": "24a8aaf0"}, {"t": "learn", "h": "<div class=\"u\">Rehearse the telling: mime, voice, pauses, visible face and lips, semi-circle seating, a starting ritual, eye contact, and discussion after the end.</div><div class=\"u\">تمرّن على الحكاية: تمثيل صامت وصوت ووقفات ووش وشفايف ظاهرين وقعدة نص دايرة وطقس بداية وتواصل بصري ونقاش بعد النهاية.</div>", "n": 1, "i": 67, "a": "tefl-58-061", "x": "d0e7971f"}, {"t": "learn", "h": "<div class=\"u\">Plan before, while, after; extend stories over lessons; retell by acting, comics or plays; older children create their own.</div><div class=\"u\">خطّط قبل وأثناء وبعد؛ مدّد القصص على حصص؛ أعد الحكاية بالتمثيل أو القصص المصوّرة أو المسرحيات؛ الأطفال الكبار بيخترعوا قصصهم.</div>", "n": 1, "i": 68, "a": "tefl-58-062", "x": "218d3521"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 69}, {"t": "mc", "q": "Why do stories work so well with children?<br>ليه القصص بتشتغل كويس أوي مع الأطفال؟", "opts": ["they play to children's natural love of imagination and play | لأنها بتلعب على حب الأطفال الطبيعي للخيال واللعب", "children are forced to sit still | عشان الأطفال بتتجبّر تقعد ساكنة", "stories need no preparation | عشان القصص مش محتاجة تحضير"], "ans": 0, "why": "Stories lend themselves to the classroom because they play to children's natural affinity for imagination and play. | القصص بتليق على الفصل لأنها بتلعب على غريزة الأطفال الطبيعية للخيال واللعب.", "ex": ["Correct. | صح.", "No. Stories engage, not force. | غلط: القصص بتشرك مش بتجبّر.", "No. Rehearsal is recommended. | غلط: التمرين مستحسن."], "n": 1, "i": 70, "h": ""}, {"t": "tf", "q": "You should rehearse your storytelling before class.<br>المفروض تتمرّن على سرد القصة قبل الحصة.", "ans": true, "why": "Correct. Rehearsal keeps the flow of concentration and lets you plan mime, actions, tone changes and pauses. | صح. التمرين بيحافظ على تدفّق التركيز وبيخلّيك تخطّط التمثيل الصامت والحركات وتغييرات النبرة والوقفات.", "ex": ["Correct. | صح.", "Wrong. Preparation protects the flow. | غلط: التحضير بيحمي التدفّق."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "A pause at the right moment in a story is:<br>الوقفة في اللحظة المظبوطة في القصة بتبقى:", "opts": ["an invitation for engagement and suspense | دعوة للمشاركة والتشويق", "a mistake to avoid | غلطة تتجنّبها", "a sign you forgot the story | علامة إنك نسيت القصة"], "ans": 0, "why": "A pause at just the right moment creates suspense and gives students the chance to pose a question; critical pauses are invitations for engagement. | الوقفة في اللحظة المظبوطة بتعمل تشويق وبتدّي الطلبة فرصة يسألوا؛ الوقفات الحاسمة دعوات للمشاركة.", "ex": ["Correct. | صح.", "No. Pauses are a tool. | غلط: الوقفات أداة.", "No. They are planned, not forgotten. | غلط: متخطّطة مش منسية."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "The best seating for story time is:<br>أحسن قعدة لوقت القصة هي:", "opts": ["a semi-circle on the floor in front of you | نص دايرة على الأرض قدّامك", "rows facing the back wall | صفوف وشها للحيطة الخلفية", "children behind their desks | الأطفال ورا مكاتبهم"], "ans": 0, "why": "A semi-circle at your feet creates intimacy, helps everyone hear, and lets everyone see the illustrations. | نص الدايرة عند رجليك بتعمل أُنس وبتخلّي الكل يسمع، وبتخلّي الكل يشوف الرسوم.", "ex": ["Correct. | صح.", "No. Backs cannot see pictures. | غلط: الضهور مابتشوفش الصور.", "No. Desks create distance. | غلط: المكاتب بتعمل مسافة."], "n": 1, "i": 73, "h": ""}, {"t": "tf", "q": "When the story ends, say the end and close the book quickly.<br>لما القصة تخلّص، قول النهاية واقفل الكتاب بسرعة.", "ans": false, "why": "False. Give students the chance to respond, ask questions, share experiences and explore feelings, using new vocabulary in discussion. | غلط. ادّي الطلبة فرصة يردّوا ويسألوا ويحكوا تجارب ويستكشفوا مشاعر، باستخدام مفردات جديدة في نقاش.", "ex": ["Correct. | صح.", "Wrong. The talk after is golden. | غلط: الكلام بعد القصة دهب."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "Extended stories over several lessons create:<br>القصص الممتدة على كذا حصة بتعمل:", "opts": ["suspense, so children do not want to miss a class | تشويق، فالأطفال مش عايزين يفوّتوا حصة", "confusion | لخبطة", "extra marking | تصحيح زيادة"], "ans": 0, "why": "Picking up where you left off creates suspense, motivating children not to miss the next part. | التكميل من اللي وقّفت عنده بيعمل تشويق، بيحفّز الأطفال ماتفوّتش الجزء الجاي.", "ex": ["Correct. | صح.", "No. Suspense is the point. | غلط: التشويق هو المقصود.", "No. It is about motivation. | غلط: الموضوع عن الدافع."], "n": 1, "i": 75, "h": ""}, {"t": "mc", "q": "Before travelling to teach children, you should:<br>قبل ما تسافر تعلّم أطفال، المفروض:", "opts": ["buy a few second hand story books to take with you | تشتري شوية كتب قصص مستعملة تاخدها معاك", "assume every school has books | تفترض إن كل مدرسة عندها كتب", "bring no materials at all | ماتجيبش خامات خالص"], "ans": 0, "why": "You never know what resources will be available once you arrive, so take a few second hand story books. | عمري ما تعرف إيه الخامات اللي هتبقى متاحة لما توصل، فخود شوية كتب قصص مستعملة.", "ex": ["Correct. | صح.", "No. Resources vary by school. | غلط: الخامات بتختلف من مدرسة لمدرسة.", "No. Stories are your toolkit. | غلط: القصص عدة شغلك."], "n": 1, "i": 76, "h": ""}, {"t": "tf", "q": "Retelling a story as a comic book or a play helps students use the target language.<br>إعادة حكاية القصة كقصة مصوّرة أو مسرحية بتساعد الطلبة يستخدموا اللغة المستهدفة.", "ans": true, "why": "Correct. Retelling through acting, comics or plays aims for students to use as much of the story's target language as possible. | صح. إعادة الحكاية بالتمثيل أو القصص المصوّرة أو المسرحيات هدفها إن الطلبة يستخدموا أكبر قدر من اللغة المستهدفة بتاعة القصة.", "ex": ["Correct. | صح.", "Wrong. Retelling drives production. | غلط: إعادة الحكاية بتدور الإنتاج."], "n": 1, "i": 77, "h": ""}, {"t": "recall", "q": "Name six types of stories to vary your reading.<br>اذكر ست أنواع قصص عشان تنوّع قرايتك.", "a": "Any six of: literary classics, funny stories, dramatic accounts, fantasies, fables or stories with a moral, myths, legends, rhyming stories, flap or pop-up stories, biographical stories, feelings stories, stories from other cultures.<br>أي ستة من: الكلاسيكيات، القصص المضحكة، الحكايات الدرامية، الخيالات، الخرافات أو قصص العبرة، الأساطير، الحكايات الشعبية، القصص المقوّفة، قصص اللسانيات والبوب أب، القصص السيرية، قصص المشاعر، قصص من ثقافات تانية.", "n": 1, "i": 78, "h": ""}, {"t": "recall", "q": "Name five techniques for telling a story well.<br>اذكر خمس تقنيات لحكاية قصة كويس.", "a": "Any five of: rehearse; use mime and actions at key words; change tone and facial expression; pause for suspense; do not hide behind the book; show your lips; use semi-circle floor seating; start with a rhyme or song ritual; keep frequent eye contact; respond to cues and body language; discuss after the end.<br>أي خمسة من: تمرّن؛ استخدم تمثيل صامت وحركات عند الكلمات المهمة؛ غيّر النبرة وتعبير الوش؛ وقّف للتشويق؛ ماتتخبّاش ورا الكتاب؛ ورّي شفايفك؛ استخدم قعدة نص دايرة على الأرض؛ ابدأ بطقس قافية أو أغنية؛ حافظ على تواصل بصري متكرر؛ رد على الإشارات ولغة الجسم؛ ناقش بعد النهاية.", "n": 1, "i": 79, "h": ""}, {"t": "write", "q": "How would you prepare to tell a story to a class of children? (3-4 sentences)<br>إزاي هتحضّر عشان تحكي قصة لفصل أطفال؟ (٣-٤ جمل).", "key": "tefl-58:1", "a": "First I would choose a story that fits my students' needs, background and level, with strong illustrations. Then I would rehearse it, marking places for mime, actions, changes of tone and suspense pauses. Before reading, I would start a small ritual, a rhyme or song, and seat the children in a semi-circle on the floor in front of me. While telling, I would keep my face open to the class and my eyes on the children, ready to answer their cues.<br>الأول هختار قصة مناسبة لاحتياجات وخلفية ومستوى طلبتي، فيها رسوم قوية. وبعدين هتمرّن عليها، وعلّم أماكن التمثيل الصامت والحركات وتغييرات النبرة ووقفات التشويق. قبل القراية، هبدأ بطقس صغير، قافية أو أغنية، وأقعّد الأطفال في نص دايرة على الأرض قدّامي. وأنا بحكي، هخلي وشي مفتوح للفصل وعيني على الأطفال، مستعد أرد على إشاراتهم.", "n": 1, "i": 80, "h": ""}, {"t": "write", "q": "What should happen after a story ends? (3-4 sentences)<br>إيه اللي المفروض يحصل بعد ما القصة تخلّص؟ (٣-٤ جمل).", "key": "tefl-58:2", "a": "Do not just say the end and close the book. Give students time to respond and ask questions, share similar experiences, or explore the feelings the story provoked. Use open ended questions so they predict, summarize and develop the narrative. Later, retell the story through acting, a comic book version or a play, so students use as much of the target language as possible.<br>ماتقولش بس النهاية وتقفل الكتاب. ادّي الطلبة وقت يردّوا ويسألوا أسئلة ويحكوا تجارب مشابهة أو يستكشفوا المشاعر اللي القصة أثارتها. استخدم أسئلة مفتوحة عشان يتوقّعوا ويلخّصوا ويطوّروا الحكاية. بعدين، أعد حكاية القصة بالتمثيل أو نسخة قصص مصوّرة أو مسرحية، عشان الطلبة يستخدموا أكبر قدر من اللغة المستهدفة.", "n": 1, "i": 81, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: drama in the classroom, and module reflection.</div><div class=\"u\">الدرس الجاي: الدراما في الفصل، وتأمّل الوحدة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 82}];</script>
