<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٥٥</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-55";window.STEPS=[{"t": "section", "h": "Module 12 overview | نظرة عامة على الوحدة ١٢", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Module twelve: Targeting Children. Teaching children can be the most challenging and most rewarding experience of teaching.</div><div class=\"u\">الوحدة ١٢: تعليم الأطفال. تعليم الأطفال ممكن يبقى أصعب وأكتر تجربة مُرضية في التدريس.</div>", "n": 1, "i": 1, "a": "tefl-55-001", "x": "9b8d3b49"}, {"t": "learn", "h": "<div class=\"u\">Once you become an experienced EFL teacher, you will be able to compare teaching different types of classes, for example adults versus children.</div><div class=\"u\">أول ما تبقى مدرس إنجليزي خبير، هتقدر تقارن بين تعليم أنواع فصول مختلفة، مثلًا الكبار في مقابل الأطفال.</div>", "n": 1, "i": 2, "a": "tefl-55-002", "x": "9824f3ad"}, {"t": "learn", "h": "<div class=\"u\">It is true to say that children's brains really are like sponges.</div><div class=\"u\">صحيح إن عقول الأطفال فعلًا زي الإسفنجة.</div>", "n": 1, "i": 3, "a": "tefl-55-003", "x": "82c588aa"}, {"t": "learn", "h": "<div class=\"u\">Adults may need to work very hard at remembering vocabulary, whereas children will surprise you: you need to do far less to help stimulate their memory reserves.</div><div class=\"u\">الكبار ممكن يحتاجوا يشتغلوا جامد عشان يفتكروا المفردات، بينما الأطفال هيفاجئوك: محتاج تعمل أقل بكتير عشان تحفّز مخازن الذاكرة بتاعتهم.</div>", "n": 1, "i": 4, "a": "tefl-55-004", "x": "118d218c"}, {"t": "learn", "h": "<div class=\"u\">If you can engage them in tasks and maintain control, you will be responsible for helping a child learn a second language.</div><div class=\"u\">لو قدرت تشركهم في أنشطة وتحافظ على التحكم، هتبقى إنت المسؤول عن مساعدة طفل يتعلّم لغة تانية.</div>", "n": 1, "i": 5, "a": "tefl-55-005", "x": "7afa6782"}, {"t": "learn", "h": "<div class=\"u\">As a result, this could be a life changing experience for them, in terms of future relationships perhaps and career possibilities.</div><div class=\"u\">ونتيجة لده، ده ممكن يبقى تجربة بتغيّر حياتهم، من ناحية علاقات المستقبل يمكن وإمكانيات الشغل.</div>", "n": 1, "i": 6, "a": "tefl-55-006", "x": "027f1588"}, {"t": "section", "h": "Managing behaviour | إدارة السلوك", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">Unit one: managing behaviour in the classroom. Set some ground rules. When you start teaching a class of children, it is essential to establish clear parameters for working together.</div><div class=\"u\">الوحدة الأولى: إدارة السلوك في الفصل. حطّط قواعد أساسية. لما بتبدأ تعلّم فصل أطفال، لازم تثبّت حدود واضحة للشغل مع بعض.</div>", "n": 1, "i": 8, "a": "tefl-55-007", "x": "891d1a42"}, {"t": "learn", "h": "<div class=\"u\">By this we mean actively creating a positive relationship with the children and setting up a framework for the way we are and the way we do things in our classroom, in which you and the children work side by side.</div><div class=\"u\">قصدنا بده إنك تنشئ علاقة إيجابية مع الأطفال وتحط إطار لطريقتنا وشغلنا في فصلنا، اللي إنت والأطفال بتشتغلوا فيه جنب بعض.</div>", "n": 1, "i": 9, "a": "tefl-55-008", "x": "08b133c8"}, {"t": "learn", "h": "<div class=\"u\">First and foremost, have a clear idea of how you would ideally like things to be in your classroom, then implement a consistent and fixed approach to achieve this.</div><div class=\"u\">أولًا وقبل كل حاجة، عندك فكرة واضحة إنت عايز الحاجات تبقى عاملة إزاي في فصلك، وبعدين نفّذ أسلوب ثابت ومتّسق عشان توصل لده.</div>", "n": 1, "i": 10, "a": "tefl-55-009", "x": "ab60fb52"}, {"t": "learn", "h": "<div class=\"u\">If you do not, it will not just happen by chance.</div><div class=\"u\">لو معملتش كده، ده مش هيحصل لوحده بالصدفة.</div>", "n": 1, "i": 11, "a": "tefl-55-010", "x": "2016d7b6"}, {"t": "learn", "h": "<div class=\"u\">The best moment to start establishing parameters is as soon as you meet a new class.</div><div class=\"u\">أحسن لحظة تبدأ فيها تثبّت الحدود هي أول ما بتقابل فصل جديد.</div>", "n": 1, "i": 12, "a": "tefl-55-011", "x": "46298987"}, {"t": "learn", "h": "<div class=\"u\">The early days are often called the honeymoon period, and they give you the perfect chance to implement your rules and expectations going forward.</div><div class=\"u\">الأيام الأولى بتتسمّى غالبًا فترة شهر العسل، وبتوّليك الفرصة المثالية تنفّذ قواعدك وتوقعاتك من بدري.</div>", "n": 1, "i": 13, "a": "tefl-55-012", "x": "625b62ef"}, {"t": "learn", "h": "<div class=\"u\">It is important to make the most of this time, as it is always much more difficult to change things later down the line.</div><div class=\"u\">مهم تستغل الوقت ده أحسن استغلال، لأن تغيير الحاجات بعدين دايمًا أصعب بكتير.</div>", "n": 1, "i": 14, "a": "tefl-55-013", "x": "cb643424"}, {"t": "learn", "h": "<div class=\"u\">If you appear a little strict on day one or two, that is not a bad thing. They will soon get to know you and discover that you are not an ogre and that you do in fact like them.</div><div class=\"u\">لو طلعت صارم شوية أول يوم أو يومين، ده مش حاجة وحشة. هما قريب هيتعرّفوا عليك ويكتشفوا إنك مش غول وإنك فعلًا بتحبهم.</div>", "n": 1, "i": 15, "a": "tefl-55-014", "x": "36855f67"}, {"t": "learn", "h": "<div class=\"u\">Why on earth would you be teaching children otherwise?!</div><div class=\"u\">وإلا ليه أصلًا بتعلّم أطفال؟!</div>", "n": 1, "i": 16, "a": "tefl-55-015", "x": "5848d84e"}, {"t": "learn", "h": "<div class=\"u\">During the first few weeks, the children will be getting to know you and will be willing to respect you, like you and do things your way.</div><div class=\"u\">في الأسابيع الأولى، الأطفال هيتعرّفوا عليك وهيبقوا مستعدين يحترموك ويحبوك ويعملوا الحاجات بطريقتك.</div>", "n": 1, "i": 17, "a": "tefl-55-016", "x": "9079bfb5"}, {"t": "learn", "h": "<div class=\"u\">Students will naturally test your limits to see how much they can get away with. Subconsciously or wilfully, they are trying to establish boundaries so they can model their behaviour accordingly.</div><div class=\"u\">الطلبة طبيعي هيختبروا حدودك عشان يشوفوا قد إيه يقدروا يفلتوا. من غير وعي أو بقصد، بيحاولوا يثبّتوا الحدود عشان يظبّطوا سلوكهم عليها.</div>", "n": 1, "i": 18, "a": "tefl-55-017", "x": "ef3699ba"}, {"t": "learn", "h": "<div class=\"u\">Bearing this in mind, it is essential to be prepared for this before going into the classroom.</div><div class=\"u\">وفي بالك ده، لازم تبقى مستعد لكده قبل ما تدخل الفصل.</div>", "n": 1, "i": 19, "a": "tefl-55-018", "x": "8612832e"}, {"t": "learn", "h": "<div class=\"u\">The actual rules of the classroom will vary from teacher to teacher, influenced by your upbringing, your own school experience and your own beliefs.</div><div class=\"u\">قواعد الفصل الفعلية بتختلف من مدرس لمدرس، وبتتأثر بتربيتك وتجربتك المدرسية ومعتقداتك.</div>", "n": 1, "i": 20, "a": "tefl-55-019", "x": "547bfe52"}, {"t": "learn", "h": "<div class=\"u\">Other factors will also affect the class: the age of your students, the number of children and the culture of that country.</div><div class=\"u\">عوامل تانية كمان بتأثّر على الفصل: سن طلبتك، وعدد الأطفال، وثقافة البلد.</div>", "n": 1, "i": 21, "a": "tefl-55-020", "x": "27192caa"}, {"t": "learn", "h": "<div class=\"u\">Therefore, as a basic guide for classroom management, it is useful to think about the Seven R's approach, which the next unit covers.</div><div class=\"u\">علشان كده، كدليل أساسي لإدارة الفصل، مفيد تفكّر في أسلوب الراءات السبعة، اللي الوحدة الجاية بتغطّيه.</div>", "n": 1, "i": 22, "a": "tefl-55-021", "x": "8df5d841"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">ground rules: the basic rules of how the class works together.</div><div class=\"u\">القواعد الأساسية: القواعد الأساسية لشغل الفصل مع بعض.</div>", "n": 1, "i": 24, "a": "tefl-55-022", "x": "08afb064"}, {"t": "learn", "h": "<div class=\"u\">parameters: the clear boundaries of how you work together.</div><div class=\"u\">الحدود: الحدود الواضحة لشغلكم مع بعض.</div>", "n": 1, "i": 25, "a": "tefl-55-023", "x": "76fe2759"}, {"t": "learn", "h": "<div class=\"u\">honeymoon period: the first days with a new class, best time to set rules.</div><div class=\"u\">فترة شهر العسل: الأيام الأولى مع فصل جديد، أحسن وقت تثبّت فيه القواعد.</div>", "n": 1, "i": 26, "a": "tefl-55-024", "x": "ba895f92"}, {"t": "learn", "h": "<div class=\"u\">testing limits: children pushing to see how much they can get away with.</div><div class=\"u\">اختبار الحدود: الأطفال بيدوسوا عشان يشوفوا قد إيه يقدروا يفلتوا.</div>", "n": 1, "i": 27, "a": "tefl-55-025", "x": "25b14181"}, {"t": "learn", "h": "<div class=\"u\">framework: the structure of the way we are and do things in class.</div><div class=\"u\">الإطار: هيكل طريقتنا وشغلنا في الفصل.</div>", "n": 1, "i": 28, "a": "tefl-55-026", "x": "75c51d12"}, {"t": "learn", "h": "<div class=\"u\">consistent approach: the same fixed response every time.</div><div class=\"u\">الأسلوب المتّسق: نفس الرد الثابت كل مرة.</div>", "n": 1, "i": 29, "a": "tefl-55-027", "x": "8c386012"}, {"t": "learn", "h": "<div class=\"u\">get away with: to do something wrong without punishment.</div><div class=\"u\">يفلت بـ: يعمل حاجة غلط من غير عقاب.</div>", "n": 1, "i": 30, "a": "tefl-55-028", "x": "1045d29a"}, {"t": "learn", "h": "<div class=\"u\">ogre: a scary monster; here, a teacher the children fear.</div><div class=\"u\">الغول: وحش مخيف؛ هنا، مدرس الأطفال بتخاف منه.</div>", "n": 1, "i": 31, "a": "tefl-55-029", "x": "3bb7414e"}, {"t": "learn", "h": "<div class=\"u\">upbringing: the way you were raised, which shapes your rules.</div><div class=\"u\">التربية: طريقة نشأتك، اللي بتشكّل قواعدك.</div>", "n": 1, "i": 32, "a": "tefl-55-030", "x": "a8de476e"}, {"t": "learn", "h": "<div class=\"u\">the Seven R's: relationships, rules, routines, rights, responsibilities, respect, rewards.</div><div class=\"u\">الراءات السبعة: العلاقات والقواعد والروتين والحقوق والمسؤوليات والاحترام والمكافآت.</div>", "n": 1, "i": 33, "a": "tefl-55-031", "x": "b9b06bbc"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">Teaching children is the most challenging and most rewarding teaching; children's brains are like sponges.</div><div class=\"u\">تعليم الأطفال أصعب وأجمل تدريس؛ عقول الأطفال زي الإسفنجة.</div>", "n": 1, "i": 35, "a": "tefl-55-032", "x": "ffebbfae"}, {"t": "learn", "h": "<div class=\"u\">Set clear parameters for working together from the first day; it never happens by chance.</div><div class=\"u\">ثبّت حدود واضحة للشغل مع بعض من أول يوم؛ ده أبدًا مابيحصلش بالصدفة.</div>", "n": 1, "i": 36, "a": "tefl-55-033", "x": "d909ec19"}, {"t": "learn", "h": "<div class=\"u\">Use the honeymoon period: being a little strict on day one or two is fine, because changing things later is much harder.</div><div class=\"u\">استغل فترة شهر العسل: الصرامة الخفيفة أول يوم أو يومين عادية، لأن التغيير بعدين أصعب بكتير.</div>", "n": 1, "i": 37, "a": "tefl-55-034", "x": "da1c8ab4"}, {"t": "learn", "h": "<div class=\"u\">Children will test your limits to establish boundaries, so be prepared before you enter the classroom.</div><div class=\"u\">الأطفال هيختبروا حدودك عشان يثبّتوا الحدود، فكن مستعد قبل ما تدخل الفصل.</div>", "n": 1, "i": 38, "a": "tefl-55-035", "x": "2aa4e2aa"}, {"t": "learn", "h": "<div class=\"u\">Rules vary with your upbringing, beliefs, the children's age, class size and the country's culture; the Seven R's guide it all.</div><div class=\"u\">القواعد بتختلف حسب تربيتك ومعتقداتك وسن الأطفال وعدد الفصل وثقافة البلد؛ الراءات السبعة بترشد الكل.</div>", "n": 1, "i": 39, "a": "tefl-55-036", "x": "f278b392"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 40}, {"t": "tf", "q": "It is better to meet a class, get a feel for it, and then decide on the rules.<br>الأحسن تقابل الفصل وتاخد إحساس بيه، وبعدين تقرر القواعد.", "ans": false, "why": "False. Have a clear idea of your ideal classroom first, and set the parameters as soon as you meet the class. | غلط. عندك فكرة واضحة عن فصلك المثالي الأول، وثبّت الحدود أول ما تقابل الفصل.", "ex": ["Correct. | صح.", "Wrong. Rules come first, on day one. | غلط: القواعد الأول، من يوم واحد."], "n": 1, "i": 41, "h": ""}, {"t": "mc", "q": "What is the honeymoon period?<br>إيه فترة شهر العسل؟", "opts": ["the first days with a new class, the best time to set rules | الأيام الأولى مع فصل جديد، أحسن وقت للقواعد", "a holiday for teachers | أجازة للمدرسين", "the last week of the course | آخر أسبوع في الكورس"], "ans": 0, "why": "The early days give the perfect chance to implement rules and expectations; changing things later is much harder. | الأيام الأولى بتدّي الفرصة المثالية لتنفيذ القواعد والتوقعات؛ التغيير بعدين أصعب بكتير.", "ex": ["Correct. | صح.", "No. It is a classroom phase. | غلط: دي مرحلة في الفصل.", "No. It is the start, not the end. | غلط: دي البداية مش النهاية."], "n": 1, "i": 42, "h": ""}, {"t": "tf", "q": "Appearing a little strict on day one or two is a bad thing.<br>إنك تبقى صارم شوية أول يوم أو يومين حاجة وحشة.", "ans": false, "why": "False. It is not a bad thing; children soon learn you are not an ogre and that you like them. | غلط. دي مش حاجة وحشة؛ الأطفال قريب بيعرفوا إنك مش غول وإنك بتحبهم.", "ex": ["Correct. | صح.", "Wrong. Early strictness helps. | غلط: الصرامة البدري بتساعد."], "n": 1, "i": 43, "h": ""}, {"t": "mc", "q": "Why do children test your limits?<br>ليه الأطفال بيختبروا حدودك؟", "opts": ["to establish boundaries and model their behaviour | عشان يثبّتوا الحدود ويظبّطوا سلوكهم", "because they hate the teacher | عشان بيكرهوا المدرس", "to avoid learning | عشان يهربوا من التعلّم"], "ans": 0, "why": "Subconsciously or wilfully, they test how much they can get away with, to establish boundaries and model their behaviour. | من غير وعي أو بقصد، بيختبروا قد إيه يقدروا يفلتوا، عشان يثبّتوا الحدود ويظبّطوا سلوكهم.", "ex": ["Correct. | صح.", "No. It is natural boundary testing. | غلط: ده اختبار حدود طبيعي.", "No. It is about boundaries, not avoidance. | غلط: الموضوع عن الحدود مش الهروب."], "n": 1, "i": 44, "h": ""}, {"t": "mc", "q": "What should you do before entering a new classroom?<br>المفروض تعمل إيه قبل ما تدخل فصل جديد؟", "opts": ["be prepared with clear parameters and a fixed approach | كن مستعد بحدود واضحة وأسلوب ثابت", "improvise everything | ارتجل كل حاجة", "let the children set the rules first | سيب الأطفال يحطوا القواعد الأول"], "ans": 0, "why": "Be prepared before going in: a clear idea of your ideal classroom and a consistent, fixed approach. | كن مستعد قبل ما تدخل: فكرة واضحة عن فصلك المثالي وأسلوب متّسق وثابت.", "ex": ["Correct. | صح.", "No. It will not happen by chance. | غلط: مش هيحصل بالصدفة.", "No. The teacher leads with clear rules. | غلط: المدرس بيقود بقواعد واضحة."], "n": 1, "i": 45, "h": ""}, {"t": "mc", "q": "Classroom rules are influenced by:<br>قواعد الفصل بتتأثر بـ:", "opts": ["your upbringing, beliefs, students' age, class size and culture | تربيتك ومعتقداتك وسن الطلبة وعدد الفصل والثقافة", "only the textbook | الكتاب بس", "only the school director | مدير المدرسة بس"], "ans": 0, "why": "Rules vary from teacher to teacher with upbringing, school experience and beliefs, plus the children's age, numbers and the country's culture. | القواعد بتختلف من مدرس لمدرس حسب التربية والتجربة والمعتقدات، زيادة سن الأطفال وعددهم وثقافة البلد.", "ex": ["Correct. | صح.", "No. Many factors shape the rules. | غلط: عوامل كتير بتشكّل القواعد.", "No. The teacher's own judgment matters. | غلط: رأي المدرس نفسه مهم."], "n": 1, "i": 46, "h": ""}, {"t": "tf", "q": "Adults need less help remembering vocabulary than children.<br>الكبار محتاجين مساعدة أقل في فاكر المفردات عن الأطفال.", "ans": false, "why": "False. Adults may need to work very hard at remembering; children are like sponges and need far less help. | غلط. الكبار ممكن يحتاجوا يشتغلوا جامد عشان يفتكروا؛ الأطفال زي الإسفنجة ومحتاجين مساعدة أقل بكتير.", "ex": ["Correct. | صح.", "Wrong. It is the other way round. | غلط: الموضوع معكوس."], "n": 1, "i": 47, "h": ""}, {"t": "mc", "q": "The Seven R's do NOT include:<br>الراءات السبعة مابتشملش:", "opts": ["results | النتائج", "relationships | العلاقات", "routines | الروتين"], "ans": 0, "why": "The seven are relationships, rules, routines, rights, responsibilities, respect and rewards. | السبعة هما العلاقات والقواعد والروتين والحقوق والمسؤوليات والاحترام والمكافآت.", "ex": ["Correct. | صح.", "No. Relationships is the first R. | غلط: العلاقات أول راء.", "No. Routines is one of the seven. | غلط: الروتين واحد من السبعة."], "n": 1, "i": 48, "h": ""}, {"t": "recall", "q": "List the Seven R's.<br>اذكر الراءات السبعة.", "a": "Relationships, rules, routines, rights, responsibilities, respect, rewards.<br>العلاقات والقواعد والروتين والحقوق والمسؤوليات والاحترام والمكافآت.", "n": 1, "i": 49, "h": ""}, {"t": "recall", "q": "Why is the honeymoon period important?<br>ليه فترة شهر العسل مهمة؟", "a": "It is the first days with a new class, when children are willing to respect you and do things your way. It gives the perfect chance to implement your rules and expectations, because changing things later is always much more difficult.<br>دي الأيام الأولى مع فصل جديد، لما الأطفال مستعدين يحترموك ويعملوا الحاجات بطريقتك. بتدّي الفرصة المثالية تنفّذ قواعدك وتوقعاتك، لأن التغيير بعدين دايمًا أصعب بكتير.", "n": 1, "i": 50, "h": ""}, {"t": "write", "q": "Explain how you would handle your first week with a new class of children. (3-4 sentences)<br>اشرح إزاي هتتعامل مع أول أسبوع ليك مع فصل أطفال جديد. (٣-٤ جمل).", "key": "tefl-55:1", "a": "I would start before the first lesson: a clear idea of my ideal classroom and a consistent, fixed approach. On day one I would establish the parameters, the way we are and the way we do things, and I would not worry about looking a little strict. I would expect the children to test my limits, and I would answer every test the same way, so the boundaries become clear. The honeymoon period only comes once, so I would use it fully.<br>أنا هبدأ قبل أول حصة: فكرة واضحة عن فصلي المثالي وأسلوب متّسق وثابت. أول يوم هثبّت الحدود، طريقتنا وشغلنا، ومش هقلق لو بيّن صارم شوية. هتوقّع إن الأطفال هيختبروا حدودي، وهرد على كل اختبار بنفس الطريقة، عشان الحدود تبقى واضحة. فترة شهر العسل بتيجي مرة واحدة بس، فهستغلّها للآخر.", "n": 1, "i": 51, "h": ""}, {"t": "write", "q": "Why is teaching children both challenging and rewarding? (3-4 sentences)<br>ليه تعليم الأطفال صعب ومُرضي في نفس الوقت؟ (٣-٤ جمل).", "key": "tefl-55:2", "a": "It is challenging because you must engage them in tasks and maintain control at the same time, and they will test your limits. It is rewarding because children's brains are like sponges: you need to do far less to stimulate their memory than with adults. You are responsible for helping a child learn a second language. That can be a life changing experience for their future relationships and career possibilities.<br>صعب لأنك لازم تشركهم في أنشطة وتحافظ على التحكم في نفس الوقت، وهما هيختبروا حدودك. ومُرضي لأن عقول الأطفال زي الإسفنجة: محتاج تعمل أقل بكتير عشان تحفّز ذاكرتهم مقارنة بالكبار. إنت المسؤول عن مساعدة طفل يتعلّم لغة تانية. وده ممكن يبقى تجربة بتغيّر حياتهم في علاقات المستقبل وإمكانيات الشغل.", "n": 1, "i": 52, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the Seven R's: relationships, rules and routines.</div><div class=\"u\">الدرس الجاي: الراءات السبعة: العلاقات والقواعد والروتين.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 53}];</script>
