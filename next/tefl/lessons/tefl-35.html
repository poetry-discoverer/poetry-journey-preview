<h1>عالم تيفل ٣٥: الوعي الصوتي</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٣٥</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-35";window.STEPS=[{"t": "section", "h": "The three concepts and the definition | المفاهيم التلاتة والتعريف", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">The next three units introduce three concepts of phonology: phonological awareness, phonemic awareness, and pronunciation.</div><div class=\"u\">الوحدات التلاتة الجاية بتقدّم تلاتة مفاهيم في الصوتيات: الوعي الصوتي، والوعي الفونيمي، والنطق.</div>", "n": 1, "i": 1, "a": "tefl-35-001", "x": "a78edb77"}, {"t": "learn", "h": "<div class=\"u\">You may not know some of these terms yet. But you will soon find out they are not difficult to grasp.</div><div class=\"u\">ممكن تكون لسه مابتعرفش بعض المصطلحات دي. بس هتكتشف قريب إنها مش صعبة خالص.</div>", "n": 1, "i": 2, "a": "tefl-35-002", "x": "2a8610df"}, {"t": "learn", "h": "<div class=\"u\">Lots of people, including some teachers, get confused with these terms.</div><div class=\"u\">ناس كتير، منهم مدرسين، بيتلخبطوا في المصطلحات دي.</div>", "n": 1, "i": 3, "a": "tefl-35-003", "x": "36f7310b"}, {"t": "learn", "h": "<div class=\"u\">Some teachers put all of this under the heading pronunciation, but this is wrong.</div><div class=\"u\">بعض المدرسين بيحطوا كله تحت عنوان النطق، بس ده غلط.</div>", "n": 1, "i": 4, "a": "tefl-35-004", "x": "d5bbf9f2"}, {"t": "learn", "h": "<div class=\"u\">So take your time with these units and try to grasp the differences between the three elements.</div><div class=\"u\">فخد وقتك مع الوحدات دي وحاول تستوعب الفروق بين العناصر التلاتة.</div>", "n": 1, "i": 5, "a": "tefl-35-005", "x": "ed915f24"}, {"t": "learn", "h": "<div class=\"u\">Our focus in this unit is phonological awareness.</div><div class=\"u\">تركيزنا في الوحدة دي هو الوعي الصوتي.</div>", "n": 1, "i": 6, "a": "tefl-35-006", "x": "020b9311"}, {"t": "learn", "h": "<div class=\"u\">In the early stages you focus on helping learners grasp the meaning of words. But at the same time, you need to help them become aware of the sounds of words.</div><div class=\"u\">في المراحل الأولى بتركّز على إنك تساعد المتعلمين يستوعبوا معنى الكلمات. بس في نفس الوقت، محتاج تساعدهم يبقوا واعيين بأصوات الكلمات.</div>", "n": 1, "i": 7, "a": "tefl-35-007", "x": "6b7276ee"}, {"t": "learn", "h": "<div class=\"u\">This helps them produce the right sounds for the words they hear and become familiar with them.</div><div class=\"u\">ده بيساعدهم يطلّعوا الأصوات الصح للكلمات اللي بيسمعوها ويتعودوا عليها.</div>", "n": 1, "i": 8, "a": "tefl-35-008", "x": "17850b85"}, {"t": "learn", "h": "<div class=\"u\">And this attention to sounds also prepares them well for later success with reading and writing.</div><div class=\"u\">والانتباه ده للأصوات كمان بيجهّزهم كويس لنجاح لاحق في القراية والكتابة.</div>", "n": 1, "i": 9, "a": "tefl-35-009", "x": "a60ee9f6"}, {"t": "learn", "h": "<div class=\"u\">Phonological awareness is the ability to focus on the sounds of the language. In essence, it means making students aware that words are made up of individual, different-sized sounds.</div><div class=\"u\">الوعي الصوتي هو القدرة على التركيز على أصوات اللغة. في جوهره، معناه إنك تخلّي الطلبة واعيين إن الكلمات متكوّنة من أصوات مفردة، مختلفة الحجم.</div>", "n": 1, "i": 10, "a": "tefl-35-010", "x": "bc672a6f"}, {"t": "learn", "h": "<div class=\"u\">You need to help them improve this ability bit by bit. It can be challenging for some younger learners, but it needs to be done.</div><div class=\"u\">محتاج تساعدهم يحسّنوا القدرة دي شوية بشوية. ممكن تكون صعبة على بعض الصغيرين، بس لازم تتعمل.</div>", "n": 1, "i": 11, "a": "tefl-35-011", "x": "0b148640"}, {"t": "section", "h": "The route: steps 1-4 | الخطة: خطوات ١-٤", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">So how do you promote phonological awareness? Here is a practical route. Stick to this order as best as you can.</div><div class=\"u\">طب تعزّز الوعي الصوتي إزاي؟ دي خطة عملية. امشي على الترتيب ده بأقصى ما تقدر.</div>", "n": 1, "i": 13, "a": "tefl-35-012", "x": "cfaf651a"}, {"t": "learn", "h": "<div class=\"u\">Step one: do lots and lots of listening games that focus your learners' attention on words.</div><div class=\"u\">أول خطوة: اعمل ألعاب استماع كتير أوي بتركّز انتباه المتعلمين على الكلمات.</div>", "n": 1, "i": 14, "a": "tefl-35-013", "x": "d27c8514"}, {"t": "learn", "h": "<div class=\"u\">Step two: move on to rhyming practice, like rhymes, songs, and poems, to draw their attention to the sounds at the end of words.</div><div class=\"u\">تاني خطوة: انقل لتدريب القافية، زي الأناشيد والأغاني والقصايد، عشان تلفت انتباههم للأصوات اللي في آخر الكلمات.</div>", "n": 1, "i": 15, "a": "tefl-35-014", "x": "3bf672c8"}, {"t": "learn", "h": "<div class=\"u\">Step three: focus on alliteration, like: a big, bad bug bit the little beetle. This draws their attention to the sounds at the beginning of words.</div><div class=\"u\">تالت خطوة: ركّز على الجناس، زي: خنفسة كبيرة شرسة عضّت الخنفسة الصغيرة. ده بيلفت انتباههم للأصوات اللي في أول الكلمات.</div>", "n": 1, "i": 16, "a": "tefl-35-015", "x": "4841dd93"}, {"t": "learn", "h": "<div class=\"u\">Look out for stories, rhymes, and songs that will help them with alliteration.</div><div class=\"u\">دوّر على حكايات وأناشيد وأغاني هتساعدهم في الجناس.</div>", "n": 1, "i": 17, "a": "tefl-35-016", "x": "1cb29ae8"}, {"t": "learn", "h": "<div class=\"u\">Step four: building on the rhyming and alliteration work, practise comparing and contrasting sounds at the beginning and end of words.</div><div class=\"u\">رابع خطوة: على أساس شغل القافية والجناس، تدرّب على مقارنة أصوات أول الكلمات وآخرها والتفريق بينهم.</div>", "n": 1, "i": 18, "a": "tefl-35-017", "x": "04b29e31"}, {"t": "section", "h": "The route: steps 5-7 | الخطة: خطوات ٥-٧", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">Step five: move on to sentence segmenting. Help learners be aware of, and count, the number of words in sentences.</div><div class=\"u\">خامس خطوة: انقل لتقطيع الجمل. ساعد المتعلمين يبقوا واعيين بعدد الكلمات في الجمل ويعدّوها.</div>", "n": 1, "i": 20, "a": "tefl-35-018", "x": "76e455e7"}, {"t": "learn", "h": "<div class=\"u\">Step six: focus on syllable segmenting and blending. Clap and count the syllables in words, then blend them back together into words.</div><div class=\"u\">سادس خطوة: ركّز على تقطيع المقاطع ودمجها. صفّق وعدّ المقاطع في الكلمات، وبعدين ادمجهم تاني لكلمة واحدة.</div>", "n": 1, "i": 21, "a": "tefl-35-019", "x": "adbb9d7b"}, {"t": "learn", "h": "<div class=\"u\">Remember: a syllable is a part of a word that is pronounced with one uninterrupted sound.</div><div class=\"u\">افتكر: المقطع الصوتي هو جزء من الكلمة بيتنطق بصوت واحد متواصل.</div>", "n": 1, "i": 22, "a": "tefl-35-020", "x": "7090da25"}, {"t": "learn", "h": "<div class=\"u\">Example: lion is li-on, two syllables. Clap and count: li-on, li-on, li-on, then blend back to lion. Help them with the pronunciation at the same time.</div><div class=\"u\">مثال: أسد هي لاي-أن، مقطعين. صفّق وعدّ: لاي-أن، لاي-أن، لاي-أن، وبعدين ادمجهم تاني لأسد. ساعدهم في النطق في نفس الوقت.</div>", "n": 1, "i": 23, "a": "tefl-35-021", "x": "781ad8cc"}, {"t": "learn", "h": "<div class=\"u\">Example: elephant is el-e-phant, three syllables. Clap and count, then blend back to elephant.</div><div class=\"u\">مثال: فيل هي إل-إي-فانت، تلات مقاطع. صفّق وعدّ، وبعدين ادمجهم تاني لفيل.</div>", "n": 1, "i": 24, "a": "tefl-35-022", "x": "5b55d492"}, {"t": "learn", "h": "<div class=\"u\">Step seven: move on to onset and rime, dividing one-syllable words by their initial consonant sound and all their other sounds.</div><div class=\"u\">سابع خطوة: انقل للبداية والقافية الداخلية، تقسيم الكلمات أحادية المقطع لصوتها الساكن الأول وكل أصواتها التانية.</div>", "n": 1, "i": 25, "a": "tefl-35-023", "x": "0d0659c4"}, {"t": "learn", "h": "<div class=\"u\">A syllable can normally be divided into two parts: the onset, which is the initial consonant or consonant blend, and the rime, which is the vowel and any final consonants.</div><div class=\"u\">المقطع الصوتي عادة يتقسم لجزئين: البداية، وهي الساكن الأول أو تجميعة السواكن، والقافية الداخلية، وهي المتحرك وأي سواكن أخيرة.</div>", "n": 1, "i": 26, "a": "tefl-35-024", "x": "df3fc507"}, {"t": "learn", "h": "<div class=\"u\">So in the word cat, c is the onset and at is the rime.</div><div class=\"u\">ففي كلمة قطة، الكاف هي البداية وات هي القافية الداخلية.</div>", "n": 1, "i": 27, "a": "tefl-35-025", "x": "59117da3"}, {"t": "learn", "h": "<div class=\"u\">Words which share the same rime will also rhyme, but the spelling will be constant with rime and does not vary as it does with rhyme.</div><div class=\"u\">الكلمات اللي بتتشارك نفس القافية الداخلية هتتقافى كمان، بس الهجاء بيبقى ثابت مع القافية الداخلية ومابيتغيّرش زي ما بيحصل مع القافية العادية.</div>", "n": 1, "i": 28, "a": "tefl-35-026", "x": "6a90ca02"}, {"t": "learn", "h": "<div class=\"u\">So after cat, you could use m-at, s-at, b-at, and so on.</div><div class=\"u\">فبعد قطة، ممكن تستخدم مات، سات، بات، وهكذا.</div>", "n": 1, "i": 29, "a": "tefl-35-027", "x": "aceac38a"}, {"t": "section", "h": "The route: steps 8-11 | الخطة: خطوات ٨-١١", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Step eight: focus on phoneme deletion and phoneme substitution of sounds in words. A phoneme is each meaningful sound in a language.</div><div class=\"u\">تامن خطوة: ركّز على حذف الفونيم واستبداله في الكلمات. الفونيم هو كل صوت ليه معنى في اللغة.</div>", "n": 1, "i": 31, "a": "tefl-35-028", "x": "8eb96020"}, {"t": "learn", "h": "<div class=\"u\">Deletion example: look at the word smile. Take away the /s/ sound. What have we got? That is right: mile. Smile without the /s/ sound is mile.</div><div class=\"u\">مثال الحذف: بص على كلمة ابتسام. شيل صوت الإس. فضل إيه؟ صح: ميل. ابتسام من غير صوت الإس بتبقى ميل.</div>", "n": 1, "i": 32, "a": "tefl-35-029", "x": "4bdbc9dd"}, {"t": "learn", "h": "<div class=\"u\">Substitution example: I saw a bug. Look at the word bug. What sound does it end with? That is right: /g/. Now change the /g/ sound to /n/. What is the new word? That is right: bun.</div><div class=\"u\">مثال الاستبدال: شفت خنفسة. بص على كلمة خنفسة. بتنتهي بأنهي صوت؟ صح: الجي. دلوقتي غيّر صوت الجي لإن. إيه الكلمة الجديدة؟ صح: كعكة.</div>", "n": 1, "i": 33, "a": "tefl-35-030", "x": "251b4ce7"}, {"t": "learn", "h": "<div class=\"u\">Step nine: focus on phoneme blending, blending individual sounds together.</div><div class=\"u\">تاسع خطوة: ركّز على دمج الفونيمات، دمج الأصوات المفردة مع بعض.</div>", "n": 1, "i": 34, "a": "tefl-35-031", "x": "83d1e657"}, {"t": "learn", "h": "<div class=\"u\">Learners listen to separately spoken phonemes, combine them to form a word, then write and read it: /b/, /i/, /g/ to make big.</div><div class=\"u\">المتعلمين بيسمعوا فونيمات متقالة منفصلة، بيدمجوها يكوّنوا كلمة، وبعدين يكتبوها ويقروها: بي، آي، جي عشان يعملوا كبير.</div>", "n": 1, "i": 35, "a": "tefl-35-032", "x": "2ce3e76b"}, {"t": "learn", "h": "<div class=\"u\">Step ten: focus on phoneme segmentation, breaking words down into individual phonemes.</div><div class=\"u\">عاشر خطوة: ركّز على تقطيع الفونيمات، تكسير الكلمات لفونيمات مفردة.</div>", "n": 1, "i": 36, "a": "tefl-35-033", "x": "d69afd26"}, {"t": "learn", "h": "<div class=\"u\">Learners break grab into /g/, /r/, /a/, /b/, saying each sound as they tap or count it, then write and read the word.</div><div class=\"u\">المتعلمين بيكسّروا يمسك لـ جي، أر، إيه، بي، بيقولوا كل صوت وهُما بيطقّقوا أو بيعدّوه، وبعدين يكتبوا الكلمة ويقروها.</div>", "n": 1, "i": 37, "a": "tefl-35-034", "x": "4f968ae1"}, {"t": "learn", "h": "<div class=\"u\">Step eleven: help them move to overall phoneme manipulation, replacing individual sounds in a word.</div><div class=\"u\">حداشر خطوة: ساعدهم ينتقلوا للتلاعب الكلي بالفونيمات، استبدال أصوات مفردة في الكلمة.</div>", "n": 1, "i": 38, "a": "tefl-35-035", "x": "c4b515ef"}, {"t": "learn", "h": "<div class=\"u\">Types of phoneme manipulation: blending phonemes to make words, and segmenting words into phonemes.</div><div class=\"u\">أنواع التلاعب بالفونيمات: دمج فونيمات عشان تعمل كلمات، وتقطيع كلمات لفونيمات.</div>", "n": 1, "i": 39, "a": "tefl-35-036", "x": "c2cb0d30"}, {"t": "learn", "h": "<div class=\"u\">Also: deleting phonemes from words, adding phonemes, or substituting one phoneme for another to make a new word.</div><div class=\"u\">وكمان: حذف فونيمات من الكلمات، إضافة فونيمات، أو استبدال فونيم بفونيم تاني عشان تعمل كلمة جديدة.</div>", "n": 1, "i": 40, "a": "tefl-35-037", "x": "171d0969"}, {"t": "section", "h": "Strategies: communication, not perfection | استراتيجيات: تواصل، مش كمال", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">Now the strategies. Here is what to do and what not to do.</div><div class=\"u\">دلوقتي الاستراتيجيات. إيه اللي تعمله وإيه اللي ماتعملوش.</div>", "n": 1, "i": 42, "a": "tefl-35-038", "x": "b938ef2e"}, {"t": "learn", "h": "<div class=\"u\">Strategy one: make phonological awareness an integral part of communication.</div><div class=\"u\">أول استراتيجية: خلّي الوعي الصوتي جزء أساسي من التواصل.</div>", "n": 1, "i": 43, "a": "tefl-35-039", "x": "c6bee5a4"}, {"t": "learn", "h": "<div class=\"u\">Learners do well with it as long as it is not run in isolation, and it stays an integral part of classroom communication.</div><div class=\"u\">المتعلمين بيبلوا بلاء كويس معاه طالما مش شغال لوحده، وفاضل جزء أساسي من تواصل الفصل.</div>", "n": 1, "i": 44, "a": "tefl-35-040", "x": "4f9bc1db"}, {"t": "learn", "h": "<div class=\"u\">Do not just suddenly bring up a word out of thin air and start to analyse it.</div><div class=\"u\">ماتجيبش فجأة كلمة من الفراغ وتبدأ تحلّلها.</div>", "n": 1, "i": 45, "a": "tefl-35-041", "x": "7e401698"}, {"t": "learn", "h": "<div class=\"u\">Strategy two: do not aim for perfection.</div><div class=\"u\">تاني استراتيجية: ماتهدفش للكمال.</div>", "n": 1, "i": 46, "a": "tefl-35-042", "x": "a6827488"}, {"t": "learn", "h": "<div class=\"u\">Your realistic goals are that learners develop intelligibility: the degree to which their speech can be understood in different language situations.</div><div class=\"u\">أهدافك الواقعية إن المتعلمين يطوّروا الوضوح: درجة إن كلامهم يتفهم في مواقف لغوية مختلفة.</div>", "n": 1, "i": 47, "a": "tefl-35-043", "x": "22502ee1"}, {"t": "learn", "h": "<div class=\"u\">Also: increase their communication ability, and increase their self-confidence in speaking the language and in listening and understanding it.</div><div class=\"u\">وكمان: زوّد قدرتهم على التواصل، وزوّد ثقتهم بنفسهم في تكلّم اللغة وفي سماعها وفهمها.</div>", "n": 1, "i": 48, "a": "tefl-35-044", "x": "2edc042d"}, {"t": "section", "h": "Strategies: plan, fun, routines, parents | استراتيجيات: خطة، مرح، روتين، أهل", "n": 1, "i": 49}, {"t": "learn", "h": "<div class=\"u\">Strategy three: plan the phonological awareness experiences. Do not just do them as they come up. You have a route to follow, so plan what you will do, when, and how.</div><div class=\"u\">تالت استراتيجية: خطّط لتجارب الوعي الصوتي. ماتعملهاش عشوائي كل ما تيجي. عندك خطة تمشي عليها، فخطّط هتعمل إيه، وإمتى، وإزاي.</div>", "n": 1, "i": 50, "a": "tefl-35-045", "x": "6f1e66b3"}, {"t": "learn", "h": "<div class=\"u\">The activities need to be fun. Always add a bit of fun to keep up their motivation and participation.</div><div class=\"u\">الأنشطة محتاجة تكون ممتعة. دايمًا ضيف شوية مرح عشان تحافظ على حماسهم ومشاركتهم.</div>", "n": 1, "i": 51, "a": "tefl-35-046", "x": "87681b67"}, {"t": "learn", "h": "<div class=\"u\">Fun is easy with younger learners. For alliteration, you could change a song they love, like Twinkle, Twinkle Little Star, into Binkle, Binkle, Bittle Bar.</div><div class=\"u\">المرح سهل مع الصغيرين. في الجناس، ممكن تغيّر أغنية بيحبوها، زي توينكل توينكل، لنسخة بحرف الباء كلها.</div>", "n": 1, "i": 52, "a": "tefl-35-047", "x": "63d30659"}, {"t": "learn", "h": "<div class=\"u\">They will find it funny, but they will be learning at the same time.</div><div class=\"u\">هيعتبروها مضحكة، بس هيكونوا بيتعلّموا في نفس الوقت.</div>", "n": 1, "i": 53, "a": "tefl-35-048", "x": "05d41a58"}, {"t": "learn", "h": "<div class=\"u\">Use activities they already know. There is no need to introduce a new activity; their focus may go to understanding the new activity instead of the phonological awareness.</div><div class=\"u\">استخدم أنشطة هُم عارفينها أصلًا. مفيش داعي تقدّم نشاط جديد؛ تركيزهم ممكن يروح لفهم النشاط الجديد بدل الوعي الصوتي.</div>", "n": 1, "i": 54, "a": "tefl-35-049", "x": "b6c63580"}, {"t": "learn", "h": "<div class=\"u\">So use familiar experiences: singing songs, rhyming games, chanting nursery rhymes, poems. Just adapt what is already there.</div><div class=\"u\">فاستخدم تجارب مألوفة: غناء أغاني، ألعاب قافية، ترديد أناشيد أطفال، قصايد. بس عدّل اللي موجود أصلًا.</div>", "n": 1, "i": 55, "a": "tefl-35-050", "x": "0e535801"}, {"t": "learn", "h": "<div class=\"u\">Do not just focus on games. Use familiar routines to practise and recycle: everyone whose name begins with the llll sound, bring your books to me.</div><div class=\"u\">ماتركّزش على الألعاب بس. استخدم الروتين المألوف للتدريب والتكرار: كل اللي اسمه بيبدأ بصوت الللل، هاتولي كتبكم.</div>", "n": 1, "i": 56, "a": "tefl-35-051", "x": "f0986b30"}, {"t": "learn", "h": "<div class=\"u\">Remember this: you must emphasise the sound, not the letter name.</div><div class=\"u\">افتكر ده: لازم تؤكّد على الصوت، مش اسم الحرف.</div>", "n": 1, "i": 57, "a": "tefl-35-052", "x": "6fb2221e"}, {"t": "learn", "h": "<div class=\"u\">Another routine: when they are lined up outside, say all those whose name begins with an ssss sound come in first, next those with a tttt sound.</div><div class=\"u\">روتين تاني: لما يكونوا واقفين في طابور برّه، قول كل اللي اسمه بيبدأ بصوت السسس يدخل الأول، وبعدين اللي بصوت التتت.</div>", "n": 1, "i": 58, "a": "tefl-35-053", "x": "11d4a4f4"}, {"t": "learn", "h": "<div class=\"u\">Each time you would vary the order. You could also do this when they leave your class.</div><div class=\"u\">كل مرة غيّر الترتيب. وتقدر تعملها كمان وهم خارجين من الفصل.</div>", "n": 1, "i": 59, "a": "tefl-35-054", "x": "09fc99c4"}, {"t": "learn", "h": "<div class=\"u\">Think how to involve parents and carers. In some countries they may not know a single word of English.</div><div class=\"u\">فكّر تشرك أولياء الأمور إزاي. في بلاد ممكن مابيعرفوش كلمة إنجليزي واحدة.</div>", "n": 1, "i": 60, "a": "tefl-35-055", "x": "c53e31f0"}, {"t": "learn", "h": "<div class=\"u\">Depending on the cost and effort you can put in, record the week's sounds onto CDs or memory sticks that children take home, so parents support the sound practice.</div><div class=\"u\">حسب التكلفة والمجهود اللي تقدر تبذله، سجّل أصوات الأسبوع على سي دي أو فلاشة ياخدوها البيت، فأولياء الأمور يساعدوا في تدريب الأصوات.</div>", "n": 1, "i": 61, "a": "tefl-35-056", "x": "bb8e7874"}, {"t": "learn", "h": "<div class=\"u\">This will not be too challenging for non-English speaking parents and carers.</div><div class=\"u\">ده مش هيبقى صعب أوي على أولياء الأمور اللي مابيتكلموش إنجليزي.</div>", "n": 1, "i": 62, "a": "tefl-35-057", "x": "2a30b6e0"}, {"t": "learn", "h": "<div class=\"u\">Generally, start with phonological awareness activities and then move on to phonemic awareness. But sometimes it will be right to interlink the two at the same time.</div><div class=\"u\">عمومًا، ابدأ بأنشطة الوعي الصوتي وبعدين انقل للوعي الفونيمي. بس ساعات هيبقى صح تربط الاتنين ببعض في نفس الوقت.</div>", "n": 1, "i": 63, "a": "tefl-35-058", "x": "3476dc4b"}, {"t": "section", "h": "Unit questions with answers | أسئلة الوحدة بإجاباتها", "n": 1, "i": 64}, {"t": "learn", "h": "<div class=\"u\">Question one: attention to the sounds of words prepares students well for later success with reading and writing. True.</div><div class=\"u\">سؤال واحد: الانتباه لأصوات الكلمات بيجهّز الطلبة كويس لنجاح لاحق في القراية والكتابة. صح.</div>", "n": 1, "i": 65, "a": "tefl-35-059", "x": "00b1501f"}, {"t": "learn", "h": "<div class=\"u\">Question two: phonological awareness is the ability to focus on the sounds of the language. True.</div><div class=\"u\">سؤال اتنين: الوعي الصوتي هو القدرة على التركيز على أصوات اللغة. صح.</div>", "n": 1, "i": 66, "a": "tefl-35-060", "x": "4b5bde05"}, {"t": "learn", "h": "<div class=\"u\">Question three: a syllable divides into the rime, which is the initial consonant, and the onset, which is the vowel and final consonants. False.</div><div class=\"u\">سؤال تلاتة: المقطع بيتقسم لقافية داخلية، وهي الساكن الأول، وبداية، وهي المتحرك والسواكن الأخيرة. غلط.</div>", "n": 1, "i": 67, "a": "tefl-35-061", "x": "90b3e5fb"}, {"t": "learn", "h": "<div class=\"u\">The statement swaps the two parts. The onset is the initial consonant or blend, and the rime is the vowel plus any final consonants.</div><div class=\"u\">الجملة قلبت الجزئين. البداية هي الساكن الأول أو تجميعته، والقافية الداخلية هي المتحرك زائد أي سواكن أخيرة.</div>", "n": 1, "i": 68, "a": "tefl-35-062", "x": "57dc271f"}, {"t": "learn", "h": "<div class=\"u\">Question four: when enhancing phonological awareness, aim for perfection. False. The realistic goals are intelligibility, communication ability, and self-confidence.</div><div class=\"u\">سؤال أربعة: لما تعزّز الوعي الصوتي، اهدف للكمال. غلط. الأهداف الواقعية هي الوضوح، وقدرة التواصل، والثقة بالنفس.</div>", "n": 1, "i": 69, "a": "tefl-35-063", "x": "e05f82cb"}, {"t": "learn", "h": "<div class=\"u\">Question five: when enhancing phonological awareness, try to introduce some new activity. False. Use familiar activities, so their focus stays on the sounds.</div><div class=\"u\">سؤال خمسة: لما تعزّز الوعي الصوتي، حاول تقدّم نشاط جديد. غلط. استخدم أنشطة مألوفة، عشان تركيزهم يفضل على الأصوات.</div>", "n": 1, "i": 70, "a": "tefl-35-064", "x": "936471c1"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 71}, {"t": "learn", "h": "<div class=\"u\">phonology: the study of the sounds of a language.</div><div class=\"u\">الصوتيات: دراسة أصوات اللغة.</div>", "n": 1, "i": 72, "a": "tefl-35-065", "x": "ee1ceacf"}, {"t": "learn", "h": "<div class=\"u\">phonological awareness: the ability to focus on the sounds of the language.</div><div class=\"u\">الوعي الصوتي: القدرة على التركيز على أصوات اللغة.</div>", "n": 1, "i": 73, "a": "tefl-35-066", "x": "0a0fdcaf"}, {"t": "learn", "h": "<div class=\"u\">phoneme: each meaningful sound in a language.</div><div class=\"u\">الفونيم: كل صوت ليه معنى في اللغة.</div>", "n": 1, "i": 74, "a": "tefl-35-067", "x": "4cb56cfd"}, {"t": "learn", "h": "<div class=\"u\">syllable: a part of a word pronounced with one uninterrupted sound.</div><div class=\"u\">المقطع الصوتي: جزء من الكلمة بيتنطق بصوت واحد متواصل.</div>", "n": 1, "i": 75, "a": "tefl-35-068", "x": "455d6355"}, {"t": "learn", "h": "<div class=\"u\">onset: the initial consonant or consonant blend of a syllable.</div><div class=\"u\">البداية: الساكن الأول أو تجميعة السواكن في المقطع.</div>", "n": 1, "i": 76, "a": "tefl-35-069", "x": "b3188b46"}, {"t": "learn", "h": "<div class=\"u\">rime: the vowel and any final consonants of a syllable.</div><div class=\"u\">القافية الداخلية: المتحرك وأي سواكن أخيرة في المقطع.</div>", "n": 1, "i": 77, "a": "tefl-35-070", "x": "07061201"}, {"t": "learn", "h": "<div class=\"u\">rhyme: words ending in the same sound.</div><div class=\"u\">القافية: كلمات بتنتهي بنفس الصوت.</div>", "n": 1, "i": 78, "a": "tefl-35-071", "x": "31b71cd6"}, {"t": "learn", "h": "<div class=\"u\">alliteration: repeating the same beginning sound in nearby words.</div><div class=\"u\">الجناس: تكرار نفس صوت البداية في كلمات متقاربة.</div>", "n": 1, "i": 79, "a": "tefl-35-072", "x": "ae185e07"}, {"t": "learn", "h": "<div class=\"u\">blending: joining separate sounds together to form a word.</div><div class=\"u\">الدمج: تجميع أصوات منفصلة مع بعض عشان تكوّن كلمة.</div>", "n": 1, "i": 80, "a": "tefl-35-073", "x": "43dcc9db"}, {"t": "learn", "h": "<div class=\"u\">segmenting: breaking a word or sentence into its parts.</div><div class=\"u\">التقطيع: تكسير الكلمة أو الجملة لأجزائها.</div>", "n": 1, "i": 81, "a": "tefl-35-074", "x": "3d3949b9"}, {"t": "learn", "h": "<div class=\"u\">phoneme deletion: removing a sound from a word.</div><div class=\"u\">حذف الفونيم: إزالة صوت من الكلمة.</div>", "n": 1, "i": 82, "a": "tefl-35-075", "x": "8aaffa55"}, {"t": "learn", "h": "<div class=\"u\">phoneme substitution: swapping one sound for another.</div><div class=\"u\">استبدال الفونيم: تبديل صوت بصوت تاني.</div>", "n": 1, "i": 83, "a": "tefl-35-076", "x": "69f67a65"}, {"t": "learn", "h": "<div class=\"u\">phoneme manipulation: blending, segmenting, deleting, adding or substituting phonemes.</div><div class=\"u\">التلاعب بالفونيمات: دمج أو تقطيع أو حذف أو إضافة أو استبدال الفونيمات.</div>", "n": 1, "i": 84, "a": "tefl-35-077", "x": "b85ceb7f"}, {"t": "learn", "h": "<div class=\"u\">intelligibility: how much of the learner's speech can be understood.</div><div class=\"u\">الوضوح: قد إيه من كلام المتعلم بيتفهم.</div>", "n": 1, "i": 85, "a": "tefl-35-078", "x": "2811af06"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 86}, {"t": "learn", "h": "<div class=\"u\">Phonological awareness is the ability to focus on the sounds of the language. It builds pronunciation now and reading and writing later.</div><div class=\"u\">الوعي الصوتي هو القدرة على التركيز على أصوات اللغة. بيبني النطق دلوقتي والقراية والكتابة بعدين.</div>", "n": 1, "i": 87, "a": "tefl-35-079", "x": "fb5867a4"}, {"t": "learn", "h": "<div class=\"u\">Follow the route: listening games, rhyming, alliteration, comparing sounds, sentence segmenting, syllables, onset and rime.</div><div class=\"u\">امشي على الخطة: ألعاب استماع، قافية، جناس، مقارنة أصوات، تقطيع جمل، مقاطع، بداية وقافية داخلية.</div>", "n": 1, "i": 88, "a": "tefl-35-080", "x": "f6aa5455"}, {"t": "learn", "h": "<div class=\"u\">Then phonemes: deletion, substitution, blending, segmentation, and full manipulation.</div><div class=\"u\">وبعدين الفونيمات: حذف، استبدال، دمج، تقطيع، وتلاعب كامل.</div>", "n": 1, "i": 89, "a": "tefl-35-081", "x": "1b597806"}, {"t": "learn", "h": "<div class=\"u\">Keep it inside real communication, and aim for intelligibility and confidence, not perfection.</div><div class=\"u\">خلّيه جوه تواصل حقيقي، واهدف للوضوح والثقة، مش الكمال.</div>", "n": 1, "i": 90, "a": "tefl-35-082", "x": "82c2f219"}, {"t": "learn", "h": "<div class=\"u\">Plan it, make it fun, use familiar activities and routines, and involve parents where you can.</div><div class=\"u\">خطّطه، وخلّيه ممتع، واستخدم أنشطة وروتين مألوف، واشرك أولياء الأمور لما تقدر.</div>", "n": 1, "i": 91, "a": "tefl-35-083", "x": "d4a3a4b1"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 92}, {"t": "tf", "q": "Attention to the sounds of words prepares students well for later success with reading and writing.<br>الانتباه لأصوات الكلمات بيجهّز الطلبة كويس لنجاح لاحق في القراية والكتابة.", "ans": true, "why": "True. Sound awareness supports both pronunciation now and literacy later. | صح. الوعي بالأصوات بيدعم النطق دلوقتي والقراية والكتابة بعدين.", "ex": ["Correct. | صح.", "Wrong. That is exactly its benefit. | غلط: دي بالظبط فايدته."], "n": 1, "i": 93, "h": ""}, {"t": "tf", "q": "Phonological awareness is the ability to focus on the sounds of the language.<br>الوعي الصوتي هو القدرة على التركيز على أصوات اللغة.", "ans": true, "why": "True. That is the definition. | صح. ده هو التعريف.", "ex": ["Correct. | صح.", "Wrong. It is exactly about sounds. | غلط: هو بالظبط عن الأصوات."], "n": 1, "i": 94, "h": ""}, {"t": "tf", "q": "A syllable divides into the rime, which is the initial consonant, and the onset, which is the vowel and final consonants.<br>المقطع بيتقسم لقافية داخلية، وهي الساكن الأول، وبداية، وهي المتحرك والسواكن الأخيرة.", "ans": false, "why": "False. The statement swaps them: the onset is the initial consonant or blend, the rime is the vowel plus final consonants. | غلط. الجملة قلبتهم: البداية هي الساكن الأول أو تجميعته، والقافية الداخلية هي المتحرك زائد السواكن الأخيرة.", "ex": ["Wrong. The two parts are swapped. | غلط: الجزئين مقلوبين.", "Correct. | صح."], "n": 1, "i": 95, "h": ""}, {"t": "tf", "q": "When enhancing students' phonological awareness, aim for perfection.<br>لما تعزّز الوعي الصوتي عند الطلبة، اهدف للكمال.", "ans": false, "why": "False. Aim for intelligibility, communication ability and self-confidence instead. | غلط. اهدف للوضوح وقدرة التواصل والثقة بالنفس بدل الكمال.", "ex": ["Wrong. Perfection is not the goal. | غلط: الكمال مش الهدف.", "Correct. | صح."], "n": 1, "i": 96, "h": ""}, {"t": "tf", "q": "When enhancing students' phonological awareness, try to introduce some new activity.<br>لما تعزّز الوعي الصوتي عند الطلبة، حاول تقدّم نشاط جديد.", "ans": false, "why": "False. Use familiar activities, or their attention goes to the activity instead of the sounds. | غلط. استخدم أنشطة مألوفة، وإلا انتباههم هيروح للنشاط بدل الأصوات.", "ex": ["Wrong. Familiar is better here. | غلط: المألوف أحسن هنا.", "Correct. | صح."], "n": 1, "i": 97, "h": ""}, {"t": "mc", "q": "In the word cat, the onset is:<br>في كلمة قطة، البداية هي:", "opts": ["c | الكاف", "at | ات", "the whole word | الكلمة كلها"], "ans": 0, "why": "The onset is the initial consonant; at is the rime. | البداية هي الساكن الأول؛ ات هي القافية الداخلية.", "ex": ["Correct. | صح.", "No. That is the rime. | غلط: دي القافية الداخلية.", "No. It divides into two parts. | غلط: بتتقسم لجزئين."], "n": 1, "i": 98, "h": ""}, {"t": "mc", "q": "Smile without the /s/ sound becomes:<br>ابتسام من غير صوت الإس بتبقى:", "opts": ["mile | ميل", "smile | ابتسام زي ما هي", "sim | سيم"], "ans": 0, "why": "This is phoneme deletion: remove /s/ and mile remains. | ده حذف فونيم: شيل الإس ويفضل ميل.", "ex": ["Correct. | صح.", "No. We deleted a sound. | غلط: إحنا حذفنا صوت.", "No. We removed /s/ from the start, not the end. | غلط: شلنا الإس من الأول، مش من الآخر."], "n": 1, "i": 99, "h": ""}, {"t": "mc", "q": "Change the /g/ in bug to /n/ and the new word is:<br>غيّر الجي في خنفسة لإن والكلمة الجديدة هي:", "opts": ["bun | كعكة", "bug | خنفسة", "gun | مسدس"], "ans": 0, "why": "This is phoneme substitution: swap /g/ for /n/ and bug becomes bun. | ده استبدال فونيم: بدّل الجي بإن وخنفسة بتبقى كعكة.", "ex": ["Correct. | صح.", "No. That is the original word. | غلط: دي الكلمة الأصلية.", "No. That keeps /g/ and changes the start instead. | غلط: دي سايبة الجي وبتغيّر البداية بدل الآخر."], "n": 1, "i": 100, "h": ""}, {"t": "recall", "q": "List the eleven steps of the phonological awareness route in order.<br>اذكر خطوات خطة الوعي الصوتي الحداشر بالترتيب.", "a": "Listening games; rhyming; alliteration; comparing beginning and end sounds; sentence segmenting; syllable segmenting and blending; onset and rime; phoneme deletion and substitution; phoneme blending; phoneme segmentation; overall phoneme manipulation.<br>ألعاب الاستماع؛ القافية؛ الجناس؛ مقارنة أصوات الأول والآخر؛ تقطيع الجمل؛ تقطيع ودمج المقاطع؛ البداية والقافية الداخلية؛ حذف واستبدال الفونيم؛ دمج الفونيمات؛ تقطيع الفونيمات؛ التلاعب الكلي بالفونيمات.", "n": 1, "i": 101, "h": ""}, {"t": "recall", "q": "What are the five types of phoneme manipulation?<br>إيه أنواع التلاعب بالفونيمات الخمسة؟", "a": "Blending phonemes to make words, segmenting words into phonemes, deleting phonemes, adding phonemes, and substituting one phoneme for another.<br>دمج الفونيمات عشان تعمل كلمات، تقطيع الكلمات لفونيمات، حذف الفونيمات، إضافة الفونيمات، واستبدال فونيم بفونيم تاني.", "n": 1, "i": 102, "h": ""}, {"t": "write", "q": "Why should phonological awareness not be taught in isolation? (3-4 sentences)<br>ليه الوعي الصوتي المفروض مايتعلّمش منعزل؟ (٣-٤ جمل).", "key": "tefl-35:1", "a": "Learners do well with phonological awareness only when it stays an integral part of classroom communication. A word pulled out of thin air and analysed has no meaning around it, so the sound work feels empty. Inside real communication, the sounds belong to words the students actually want to say. That is what keeps the practice useful and alive.<br>المتعلمين بيبلوا كويس في الوعي الصوتي بس لما يفضل جزء أساسي من تواصل الفصل. كلمة متسحوبة من الفراغ وبتتحلّل مفيش حواليها معنى، فشغل الأصوات بيحس فاضي. جوه التواصل الحقيقي، الأصوات بتاعة كلمات الطلبة فعلًا عايزين يقولوها. ده اللي بيخلّي التدريب مفيد وحي.", "n": 1, "i": 103, "h": ""}, {"t": "write", "q": "Why should you avoid aiming for perfection, and what should you aim for instead? (3-4 sentences)<br>ليه المفروض تتجنب الهدف للكمال، والمفروض تهدف لإيه بدل منه؟ (٣-٤ جمل).", "key": "tefl-35:2", "a": "Perfection is not a realistic goal for learners, and chasing it can crush their confidence. The realistic goals are intelligibility, so their speech can be understood in different situations. You also want to increase their communication ability. And you want them to grow self-confidence in speaking the language and in listening and understanding it.<br>الكمال مش هدف واقعي للمتعلمين، ومطاردته ممكن تسحق ثقتهم. الأهداف الواقعية هي الوضوح، عشان كلامهم يتفهم في مواقف مختلفة. وكمان عايز تزوّد قدرتهم على التواصل. وعايزهم يكبّروا ثقتهم بنفسهم في تكلّم اللغة وفي سماعها وفهمها.", "n": 1, "i": 104, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: phonemic awareness, the sounds and the letters.</div><div class=\"u\">الدرس الجاي: الوعي الفونيمي، الأصوات والحروف.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 105}];</script>
