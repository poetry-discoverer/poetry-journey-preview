<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٩</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-09";window.STEPS=[{"t": "section", "h": "What is feedback | يعني إيه فيدباك", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Unit 6: student feedback. The ability to give good, constructive feedback is essential for student motivation and performance.</div><div class=\"u\">أهلًا بيك في الوحدة السادسة: فيدباك الطلاب. القدرة على إعطاء فيدباك كويس وبنّاء أساسية لدافعية الطلاب وأدائهم.</div>", "n": 1, "i": 1, "a": "tefl-09-001", "x": "e239bf0f"}, {"t": "learn", "h": "<div class=\"u\">What is feedback? Information given to the learner about her performance of a learning task, usually with the objective of improving that performance.</div><div class=\"u\">يعني إيه فيدباك؟ معلومات بتتقال للمتعلم عن أدائه في مهمة تعلم، عادة بهدف تحسين الأداء ده.</div>", "n": 1, "i": 2, "a": "tefl-09-002", "x": "b3b980b7"}, {"t": "learn", "h": "<div class=\"u\">Feedback is generally verbal, but your body language can also give the student clues about her performance.</div><div class=\"u\">الفيدباك عمومًا لفظي، بس لغة جسمك كمان بتدّي الطالب إشارات عن أدائه.</div>", "n": 1, "i": 3, "a": "tefl-09-003", "x": "23b6b400"}, {"t": "learn", "h": "<div class=\"u\">The main purposes of feedback: to motivate learners when they are doing well, and to help them understand their problems and how to improve when they are not doing so well.</div><div class=\"u\">الأهداف الرئيسية للفيدباك: تحفيز المتعلمين لما بيعملوا كويس، ومساعدتهم يفهموا مشاكلهم وإزاي يتحسنوا لما مش بيعملوا كويس.</div>", "n": 1, "i": 4, "a": "tefl-09-004", "x": "5c265882"}, {"t": "learn", "h": "<div class=\"u\">Examples of feedback: saying Yes, right! to a learner who answered correctly. An arched eyebrow in response to a grammar mistake.</div><div class=\"u\">أمثلة على الفيدباك: تقول Yes, right! لطالب جاوب صح. حاجب مرفوع كرد على غلطة قواعد.</div>", "n": 1, "i": 5, "a": "tefl-09-005", "x": "ff583548"}, {"t": "learn", "h": "<div class=\"u\">More examples: comments written in the margin of an essay. Or saying Almost; do you want to try again? to a student whose answer is not complete or fully correct.</div><div class=\"u\">أمثلة كمان: تعليقات متكتوبة في هامش المقال. أو تقول Almost; do you want to try again? لطالب إجابته مش كاملة أو مش صح تمامًا.</div>", "n": 1, "i": 6, "a": "tefl-09-006", "x": "0fd166fb"}, {"t": "learn", "h": "<div class=\"u\">Feedback can focus on language, skills, the ideas in their work, behaviour, attitude towards learning, or progress.</div><div class=\"u\">الفيدباك ممكن يركز على اللغة، المهارات، الأفكار في الشغل، السلوك، الاتجاه ناحية التعلم، أو التقدم.</div>", "n": 1, "i": 7, "a": "tefl-09-007", "x": "476fe0c8"}, {"t": "learn", "h": "<div class=\"u\">Sometimes we give feedback to the whole class, sometimes to small groups, and sometimes to individual learners.</div><div class=\"u\">ساعات بنقدّم فيدباك للفصل كله، ساعات لمجموعات صغيرة، وساعات لمتعلمين أفراد.</div>", "n": 1, "i": 8, "a": "tefl-09-008", "x": "1be142fd"}, {"t": "section", "h": "The seven rules | القواعد السبعة", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">It is critical that your feedback is constructive, not destructive. Feedback is a way for students to learn more about themselves and the effect their behaviour has on others.</div><div class=\"u\">ضروري جدًا إن الفيدباك بتاعك يكون بنّاء مش هدّام. الفيدباك وسيلة الطلاب بيعرفوا بيها أكتر عن نفسهم وتأثير سلوكهم على الآخرين.</div>", "n": 1, "i": 10, "a": "tefl-09-009", "x": "89dc86f9"}, {"t": "learn", "h": "<div class=\"u\">Constructive feedback increases self-awareness, offers guidance, and encourages development.</div><div class=\"u\">الفيدباك البنّاء بيزوّد الوعي بالذات، بيقدّم توجيه، وبيشجّع التطور.</div>", "n": 1, "i": 11, "a": "tefl-09-010", "x": "ce4fe857"}, {"t": "learn", "h": "<div class=\"u\">Constructive does not mean only positive. Negative or critical feedback, given constructively and skilfully, can be very important and useful.</div><div class=\"u\">بنّاء مش معناه إيجابي بس. الفيدباك السلبي أو النقدي، لو اتقدّم بشكل بنّاء وبمهارة، ممكن يكون مهم ومفيد جدًا.</div>", "n": 1, "i": 12, "a": "tefl-09-011", "x": "cc082249"}, {"t": "learn", "h": "<div class=\"u\">Destructive feedback is negative feedback given in an unskilled way. It leaves the student feeling bad, with nothing to build on and no useful information to learn from.</div><div class=\"u\">الفيدباك الهدّام هو فيدباك سلبي اتقدّم بطريقة غير ماهرة. بيسيب الطالب حاسس بالوحشة، من غير أي حاجة يبني عليها ولا معلومة مفيدة يتعلم منها.</div>", "n": 1, "i": 13, "a": "tefl-09-012", "x": "c869ae29"}, {"t": "learn", "h": "<div class=\"u\">Rule 1: Start with the positive. Students need encouragement, to be told when they are doing something well.</div><div class=\"u\">القاعدة ١: ابدأ بالإيجابي. الطلاب محتاجين تشجيع، يتقال لهم لما بيعملوا حاجة كويسة.</div>", "n": 1, "i": 14, "a": "tefl-09-013", "x": "846b3b32"}, {"t": "learn", "h": "<div class=\"u\">When the positive is registered first, any negative is more likely to be listened to and acted upon. In a rush to criticise, we may overlook the things we liked.</div><div class=\"u\">لما الإيجابي يتسجل الأول، أي سلبي بعده فرصته أكبر إنه يتسمع ويتنفذ. في عجلة النقد، ممكن نفوت الحاجات اللي عجبتنا.</div>", "n": 1, "i": 15, "a": "tefl-09-014", "x": "54a852fe"}, {"t": "learn", "h": "<div class=\"u\">Rule 2: Be specific. You were brilliant or It was not so good may be pleasant or upsetting, but they are too general to be useful for learning.</div><div class=\"u\">القاعدة ٢: كن محدد. You were brilliant أو It was not so good ممكن تفرّح أو تزعّل، بس عامة أكتر من اللازم عشان تنفع في التعلم.</div>", "n": 1, "i": 16, "a": "tefl-09-015", "x": "0bc9bd04"}, {"t": "learn", "h": "<div class=\"u\">Pin-point what the student did: The way you introduced your point just at that moment was really helpful and enabled us to resolve that issue more quickly.</div><div class=\"u\">حدد بالظبط اللي الطالب عمله: طريقتك في تقديم نقطتك في اللحظة دي بالظبط كانت مفيدة فعلًا وخلّتنا نحل المشكلة دي أسرع.</div>", "n": 1, "i": 17, "a": "tefl-09-016", "x": "1b1fd544"}, {"t": "learn", "h": "<div class=\"u\">Rule 3: Refer to behaviour that can be changed. Feedback about something the student has no choice or control over is frustrating and even de-motivating.</div><div class=\"u\">القاعدة ٣: اتكلم عن سلوك ممكن يتغيّر. الفيدباك عن حاجة الطالب مالوش فيها اختيار أو سيطرة بيكون محبط وممكن يقلل الدافعية.</div>", "n": 1, "i": 18, "a": "tefl-09-017", "x": "042720b0"}, {"t": "learn", "h": "<div class=\"u\">Rule 4: Seek or offer alternatives. Ask the student what they could have done differently, or will do differently next time. Ideas coming from the student are always more powerful.</div><div class=\"u\">القاعدة ٤: اطلب أو اقترح بدائل. اسأل الطالب كان ممكن يعمل إيه مختلف، أو هيعمل إيه مختلف المرة الجاية. الأفكار اللي جاية من الطالب دايمًا أقوى.</div>", "n": 1, "i": 19, "a": "tefl-09-018", "x": "f628b71d"}, {"t": "learn", "h": "<div class=\"u\">If they are struggling to think of what they could have done differently, offer some suggestions.</div><div class=\"u\">لو بيجاهدوا يفكروا في إيه اللي كان ممكن يعملوه مختلف، اقترح عليهم شوية اقتراحات.</div>", "n": 1, "i": 20, "a": "tefl-09-019", "x": "744709b9"}, {"t": "learn", "h": "<div class=\"u\">Rule 5: Be descriptive rather than evaluative. Say: The way you kept calm, quiet and focussed during that situation helped everyone cope. Not just: you handled that situation well.</div><div class=\"u\">القاعدة ٥: كن واصف مش مقيّم. قول: طريقتك إنك فضلت هادي وساكت ومركز في الموقف ده ساعدت الكل يعدّي. مش بس: إنت تصرفت في الموقف كويس.</div>", "n": 1, "i": 21, "a": "tefl-09-020", "x": "6a573f0e"}, {"t": "learn", "h": "<div class=\"u\">Rule 6: Own the feedback. Begin with I think or I feel that. Take responsibility for your feedback instead of sounding like a universally agreed opinion.</div><div class=\"u\">القاعدة ٦: امتلك الفيدباك بتاعك. ابدأ بـI think أو I feel that. خد مسؤولية الفيدباك بدل ما تبان كأنه رأي متفق عليه من الكل.</div>", "n": 1, "i": 22, "a": "tefl-09-021", "x": "1ee74eba"}, {"t": "learn", "h": "<div class=\"u\">Rule 7: Leave the recipient with a choice. Feedback that demands change invites resistance. Skilled feedback offers information and leaves the student free to choose whether and how to act.</div><div class=\"u\">القاعدة ٧: سيب للمتلقي اختيار. الفيدباك اللي بيفرض التغيير بيدعو للمقاومة. الفيدباك الماهر بيقدّم معلومات وبيسيب الطالب حر يختار هيتصرف إزاي.</div>", "n": 1, "i": 23, "a": "tefl-09-022", "x": "0409c277"}, {"t": "section", "h": "Types of feedback | أنواع الفيدباك", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Types of feedback: to individual learners or to groups. Oral or written. Linked to formal or informal assessment, in the classroom or during individual meetings.</div><div class=\"u\">أنواع الفيدباك: لمتعلمين أفراد أو لمجموعات. شفوي أو مكتوب. مربوط بتقييم رسمي أو غير رسمي، في الفصل أو في مقابلات فردية.</div>", "n": 1, "i": 25, "a": "tefl-09-023", "x": "df1aad86"}, {"t": "learn", "h": "<div class=\"u\">You can write regular feedback as comments, grades, or marks on a learner's record sheet, and use it when you make your end-of-course assessment.</div><div class=\"u\">تقدر تكتب فيدباك منتظم كتعليقات أو درجات في ورقة سجل المتعلم، وتستخدمه لما تعمل تقييم نهاية الكورس.</div>", "n": 1, "i": 26, "a": "tefl-09-024", "x": "905cb1fe"}, {"t": "learn", "h": "<div class=\"u\">When learners give feedback to one another, this is called peer feedback.</div><div class=\"u\">لما المتعلمين بيقدّموا فيدباك لبعض، ده بيتسمى فيدباك الأقران.</div>", "n": 1, "i": 27, "a": "tefl-09-025", "x": "418659dc"}, {"t": "learn", "h": "<div class=\"u\">Peer feedback is useful for all learners. Those who give it reflect on their classmates' work. Those who receive it get information on how to improve.</div><div class=\"u\">فيدباك الأقران مفيد لكل المتعلمين. اللي بيقدّموه بيراجعوا شغل زمايلهم. واللي بيستلموه بياخدوا معلومات عن إزاي يتحسنوا.</div>", "n": 1, "i": 28, "a": "tefl-09-026", "x": "6f73c3e9"}, {"t": "learn", "h": "<div class=\"u\">A feedback observation sheet often guides them.</div><div class=\"u\">وغالبًا بتوجههم ورقة ملاحظة للفيدباك.</div>", "n": 1, "i": 29, "a": "tefl-09-027", "x": "2e109341"}, {"t": "learn", "h": "<div class=\"u\">Peer feedback can have a positive effect on classroom dynamics, and helps train learners in the skills they need to become autonomous.</div><div class=\"u\">فيدباك الأقران ممكن يأثر إيجابيًا على ديناميكية الفصل، وبيساعد يدريب المتعلمين على المهارات اللي محتاجينها عشان يبقوا مستقلين.</div>", "n": 1, "i": 30, "a": "tefl-09-028", "x": "96adec98"}, {"t": "learn", "h": "<div class=\"u\">Young learners are not able to give very detailed peer feedback, because they cannot yet think about their classmates' work very carefully.</div><div class=\"u\">المتعلمين الصغيرين مش قادرين يقدّموا فيدباك أقران مفصّل، لأنهم لسه مش قادرين يفكروا في شغل زمايلهم بعناية.</div>", "n": 1, "i": 31, "a": "tefl-09-029", "x": "f6a23644"}, {"t": "learn", "h": "<div class=\"u\">Learners can also give YOU feedback about lessons, activities, and materials: what they like, what does not interest them, and where they have problems with the language.</div><div class=\"u\">المتعلمين كمان يقدروا يدّوك إنت فيدباك عن الحصص والأنشطة والمواد: إيه اللي عاجبهم، إيه اللي مش مهتمين بيه، وفين بيلاقوا صعوبة في اللغة.</div>", "n": 1, "i": 32, "a": "tefl-09-030", "x": "7b18c662"}, {"t": "learn", "h": "<div class=\"u\">They can also make suggestions for materials and activities to use. Be open to this.</div><div class=\"u\">ويقدروا كمان يقترحوا مواد وأنشطة تتستخدم. كن متقبل لده.</div>", "n": 1, "i": 33, "a": "tefl-09-031", "x": "18b8d0a4"}, {"t": "section", "h": "Balanced feedback and examples | فيدباك متوازن وأمثلة", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">Feedback is not just writing well done at the end of homework. Written feedback is essential, and oral feedback can be equally constructive.</div><div class=\"u\">الفيدباك مش بس كتابة well done في آخر الواجب. الفيدباك المكتوب أساسي، والفيدباك الشفوي ممكن يكون بنّاء بنفس الدرجة.</div>", "n": 1, "i": 35, "a": "tefl-09-032", "x": "8720ed24"}, {"t": "learn", "h": "<div class=\"u\">Comment in varied ways on students' work, language skills, progress, and attitude: to show weaker areas with tools to improve, and to praise good work and keep motivation going.</div><div class=\"u\">علّق بطرق متنوعة على شغل الطلاب ومهاراتهم اللغوية وتقدمهم واتجاههم: عشان تبين المناطق الأضعف مع أدوات التحسين، وتمدح الشغل الكويس وتحافظ على الدافعية.</div>", "n": 1, "i": 36, "a": "tefl-09-033", "x": "b4318879"}, {"t": "learn", "h": "<div class=\"u\">Not giving feedback at all is like the teacher leaving the classroom for the duration of the activity. Learners expect the teacher to listen to them.</div><div class=\"u\">إنك ماتديش فيدباك خالص زي إن المدرس يسيب الفصل طول مدة النشاط. المتعلمين متوقعين إن المدرس يسمعهم.</div>", "n": 1, "i": 37, "a": "tefl-09-034", "x": "f2e85e94"}, {"t": "learn", "h": "<div class=\"u\">The vast majority will welcome feedback and error correction, if it is constructive and comes at an appropriate point in the lesson.</div><div class=\"u\">الأغلبية الساحقة بترحب بالفيدباك وتصحيح الأخطاء، لو كان بنّاء وفي اللحظة المناسبة من الحصة.</div>", "n": 1, "i": 38, "a": "tefl-09-035", "x": "89ed7253"}, {"t": "learn", "h": "<div class=\"u\">They expect written work to be corrected, so why not spoken language?</div><div class=\"u\">بيتوقعوا الشغل المكتوب يتصحح، فليه مش الكلام المنطوق؟</div>", "n": 1, "i": 39, "a": "tefl-09-036", "x": "d05d8c95"}, {"t": "learn", "h": "<div class=\"u\">Feedback should be balanced and useful: praise an achievement and identify one area of weakness with specific advice on how to get better, or praise current efforts compared to past errors.</div><div class=\"u\">الفيدباك لازم يكون متوازن ومفيد: امدح إنجاز وحدد نقطة ضعف واحدة مع نصيحة محددة للتحسين، أو امدح المجهود الحالي مقارنة بالأخطاء السابقة.</div>", "n": 1, "i": 40, "a": "tefl-09-037", "x": "cdbab12c"}, {"t": "learn", "h": "<div class=\"u\">Concentrate on one or two specific fields, to give the learner direction and avoid confusion. The six fields: language, content, progress, effort, behaviour, achievement.</div><div class=\"u\">ركز على مجال أو اتنين محددين، عشان تدّي المتعلم اتجاه وتتجنب اللخبطة. المجالات الستة: اللغة، المحتوى، التقدم، المجهود، السلوك، الإنجاز.</div>", "n": 1, "i": 41, "a": "tefl-09-038", "x": "a1b27b94"}, {"t": "learn", "h": "<div class=\"u\">Example, language focus. Oral: I am not sure all of you have fully understood today's grammar point, let's go over it again together on the board.</div><div class=\"u\">مثال على تركيز اللغة. شفوي: مش متأكد إن كلكم فهمتوا نقطة القواعد بتاعة النهاردة تمامًا، يلا نراجعها تاني مع بعض على البورد.</div>", "n": 1, "i": 42, "a": "tefl-09-039", "x": "c93e20e8"}, {"t": "learn", "h": "<div class=\"u\">Written, language focus: Well done, excellent use of prepositions in your work. Now just focus on using the past simple and past perfect correctly. Have another look at the last chapter.</div><div class=\"u\">مكتوب، تركيز اللغة: أحسنت، استخدام ممتاز لحروف الجر في شغلك. دلوقتي بس ركز على استخدام الماضي البسيط والماضي التام صح. بص تاني على آخر فصل في الكتاب.</div>", "n": 1, "i": 43, "a": "tefl-09-040", "x": "410ac348"}, {"t": "learn", "h": "<div class=\"u\">Example, achievement focus. Oral: You have understood that exercise really well, the pairwork was much better than last time.</div><div class=\"u\">مثال على تركيز الإنجاز. شفوي: إنت فاهم التمرين ده كويس جدًا، شغل الأزواج كان أحسن بكتير من المرة اللي فاتت.</div>", "n": 1, "i": 44, "a": "tefl-09-041", "x": "7246a3f1"}, {"t": "learn", "h": "<div class=\"u\">Written, achievement focus: 81%! Excellent, a whole grade higher than your last story. I can see you have really taken on board the comments I gave you last time.</div><div class=\"u\">مكتوب، تركيز الإنجاز: ٨١٪! ممتاز، درجة كاملة أعلى من قصتك اللي فاتت. شايف إنك فعلًا خدت بتعليقاتي من المرة اللي فاتت.</div>", "n": 1, "i": 45, "a": "tefl-09-042", "x": "4b0d1654"}, {"t": "section", "h": "Peer feedback in practice | فيدباك الأقران عمليًا", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">Peer feedback in practice: while one student gives a presentation, the others make notes on the successful aspects and on areas for improvement.</div><div class=\"u\">فيدباك الأقران عمليًا: بينما طالب بيقدّم عرض، الباقي بيسجلوا ملاحظات عن الجوانب الناجحة ومناطق التحسين.</div>", "n": 1, "i": 47, "a": "tefl-09-043", "x": "4ed8369f"}, {"t": "learn", "h": "<div class=\"u\">This engages students and actively involves them in a task where they would otherwise be passive listeners. It also helps them think about their own work.</div><div class=\"u\">ده بيشرّك الطلاب وبيدخّلهم بنشاط في مهمة كانوا هيبقوا فيها مستمعين سلبيين. وكمان بيساعدهم يفكروا في شغلهم هم.</div>", "n": 1, "i": 48, "a": "tefl-09-044", "x": "91fde224"}, {"t": "learn", "h": "<div class=\"u\">It allows them to feel more secure: they are not the only ones who ever make mistakes.</div><div class=\"u\">وبيخليهم يحسوا بأمان أكتر: مش هما بس اللي بيغلطوا.</div>", "n": 1, "i": 49, "a": "tefl-09-045", "x": "9ac2829a"}, {"t": "learn", "h": "<div class=\"u\">You need a relatively mature class for this. Watch for any feedback which is unhelpful rather than constructive.</div><div class=\"u\">محتاج فصل ناضج نسبيًا لده. وراقب أي فيدباك غير مفيد بدل ما يكون بنّاء.</div>", "n": 1, "i": 50, "a": "tefl-09-046", "x": "cb02b58b"}, {"t": "learn", "h": "<div class=\"u\">Remind students: this is a time to reflect on each other's learning and facilitate improvement, not just to criticise.</div><div class=\"u\">فتّكر الطلاب: ده وقت مراجعة تعلم بعض وتسهيل التحسين، مش بس نقد.</div>", "n": 1, "i": 51, "a": "tefl-09-047", "x": "d20e3ad9"}, {"t": "learn", "h": "<div class=\"u\">Shy students may find it hard to point out classmates' weaker areas. Prepare a handout asking for notes on certain areas, like structure or fluency, instead of general comments.</div><div class=\"u\">الطلاب الخجولين ممكن يلاقوا صعوبة في الإشارة لنقاط ضعف زمايلهم. جهز ورقة بتطلب ملاحظات على مناطق معينة، زي التنظيم أو الطلاقة، بدل التعليقات العامة.</div>", "n": 1, "i": 52, "a": "tefl-09-048", "x": "4bc4dc5f"}, {"t": "learn", "h": "<div class=\"u\">Tailor your feedback to the particular group and to the individuals in it. Remember: it should always be fair, focused, and constructive.</div><div class=\"u\">ظبط الفيدباك بتاعك على المجموعة المعينة والأفراد اللي فيها. وافتكر: لازم دايمًا يكون عادل ومركز وبنّاء.</div>", "n": 1, "i": 53, "a": "tefl-09-049", "x": "46abc64f"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 54}, {"t": "learn", "h": "<div class=\"u\">Key terms. Constructive feedback: feedback that helps the student build and improve.</div><div class=\"u\">مصطلحات الدرس. Constructive feedback: فيدباك بنّاء، فيدباك بيساعد الطالب يبني ويتحسن.</div>", "n": 1, "i": 55, "a": "tefl-09-050", "x": "dec88357"}, {"t": "learn", "h": "<div class=\"u\">Destructive feedback: negative feedback given badly, leaving nothing to build on.</div><div class=\"u\">Destructive feedback: فيدباك هدّام، فيدباك سلبي اتقدّم بطريقة وحشة سايب مفيش حاجة تتبني عليها.</div>", "n": 1, "i": 56, "a": "tefl-09-051", "x": "da757eab"}, {"t": "learn", "h": "<div class=\"u\">Peer feedback: learners giving feedback to one another. Autonomous learner: a learner who can manage their own learning.</div><div class=\"u\">Peer feedback: فيدباك الأقران، متعلمين بيقدّموا فيدباك لبعض. Autonomous learner: متعلم مستقل، متعلم قادر يدير تعلمه بنفسه.</div>", "n": 1, "i": 57, "a": "tefl-09-052", "x": "7488bd68"}, {"t": "learn", "h": "<div class=\"u\">Evaluative: judging something as good or bad. Descriptive: saying what you saw or heard and its effect. Praise: positive feedback for good work.</div><div class=\"u\">Evaluative: تقييمي، بتحكم على حاجة إنها كويسة أو وحشة. Descriptive: وصفي، بتقول اللي شفته أو سمعته وتأثيره. Praise: مديح، فيدباك إيجابي على شغل كويس.</div>", "n": 1, "i": 58, "a": "tefl-09-053", "x": "9cd3663c"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">Summary, part 1. Feedback is information about performance, meant to improve it. It motivates when things go well and guides when they do not.</div><div class=\"u\">الخلاصة، جزء ١. الفيدباك معلومات عن الأداء، هدفها تحسينه. بيحفّز لما الأمور تمشي كويس وبيوجّه لما لا.</div>", "n": 1, "i": 60, "a": "tefl-09-054", "x": "6e9b1afd"}, {"t": "learn", "h": "<div class=\"u\">Summary, part 2. Seven rules: start positive, be specific, target changeable behaviour, seek alternatives, describe do not judge, own it with I think, and leave a choice.</div><div class=\"u\">الخلاصة، جزء ٢. سبع قواعد: ابدأ بالإيجابي، كن محدد، استهدف سلوك قابل للتغيير، اطلب بدائل، اوصف ماتحكمش، امتلك الفيدباك بـI think، وسيب اختيار.</div>", "n": 1, "i": 61, "a": "tefl-09-055", "x": "3a179a3e"}, {"t": "learn", "h": "<div class=\"u\">Summary, part 3. Feedback can be oral or written, to individuals or groups. Peer feedback trains autonomy.</div><div class=\"u\">الخلاصة، جزء ٣. الفيدباك ممكن شفوي أو مكتوب، لأفراد أو مجموعات. فيدباك الأقران بيدرّب الاستقلالية.</div>", "n": 1, "i": 62, "a": "tefl-09-056", "x": "72bb814d"}, {"t": "learn", "h": "<div class=\"u\">Keep it balanced, on one or two fields, always fair, focused, and constructive.</div><div class=\"u\">خليه متوازن، على مجال أو اتنين، دايمًا عادل ومركز وبنّاء.</div>", "n": 1, "i": 63, "a": "tefl-09-057", "x": "1ce04763"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 64}, {"t": "mc", "q": "Feedback should always be:<br>الفيدباك لازم دايمًا يكون:", "opts": ["fair, focused and constructive | عادل ومركز وبنّاء", "focused, critical and peer given | مركز ونقدي ومن الأقران", "written, constructive and highlighting weaknesses | مكتوب وبنّاء وبيسلط الضوء على نقاط الضعف"], "ans": 0, "why": "Fair, focused, and constructive. Always. | عادل ومركز وبنّاء. دايمًا.", "ex": ["Correct. | صح.", "No. Critical and peer-given are not required. | غلط: النقد والأقران مش شرط.", "No. Feedback can be oral too. | غلط: الفيدباك ممكن يكون شفوي كمان."], "n": 1, "i": 65, "h": ""}, {"t": "tf", "q": "Peer feedback allows students to ridicule their classmates so that they feel better about their own work.<br>فيدباك الأقران بيسمح للطلاب يسخروا من زمايلهم عشان يحسوا أحسن عن شغلهم.", "ans": false, "why": "It is for reflecting on each other's learning, never ridicule. | هو لمراجعة تعلم بعض، أبدًا مش للسخرية.", "ex": ["Wrong. Ridicule is destructive, not feedback. | غلط: السخرية هدّامة مش فيدباك.", "Correct. | صح."], "n": 1, "i": 66, "h": ""}, {"t": "tf", "q": "Feedback should always be given at the end of the lesson.<br>الفيدباك لازم دايمًا يتقدّم في آخر الحصة.", "ans": false, "why": "It can come at any appropriate point: during tasks, in meetings, or in writing. | ممكن ييجي في أي لحظة مناسبة: أثناء المهام، في مقابلات، أو مكتوب.", "ex": ["Wrong. Timing is flexible. | غلط: التوقيت مرن.", "Correct. | صح."], "n": 1, "i": 67, "h": ""}, {"t": "tf", "q": "The sole purpose of feedback is to motivate learners.<br>الهدف الوحيد من الفيدباك هو تحفيز المتعلمين.", "ans": false, "why": "Motivation is one purpose; the other is helping learners understand problems and improve. | التحفيز هدف واحد؛ التاني مساعدة المتعلمين يفهموا مشاكلهم ويتحسنوا.", "ex": ["Wrong. There are two main purposes. | غلط: فيه هدفين رئيسيين.", "Correct. | صح."], "n": 1, "i": 68, "h": ""}, {"t": "tf", "q": "Constructive feedback does not mean only giving positive feedback.<br>الفيدباك البنّاء مش معناه إنك تدّي فيدباك إيجابي بس.", "ans": true, "why": "Skilful negative feedback can be very important and useful. | الفيدباك السلبي الماهر ممكن يكون مهم ومفيد جدًا.", "ex": ["Correct. | صح.", "Wrong. Skilled criticism is also constructive. | غلط: النقد الماهر كمان بنّاء."], "n": 1, "i": 69, "h": ""}, {"t": "tf", "q": "When offering feedback, it really helps students to hear first what they have done poorly.<br>لما تقدّم فيدباك، بيساعد الطلاب فعلًا إنهم يسمعوا الأول اللي عملوه غلط.", "ans": false, "why": "Start with the positive; the negative is then more likely to be heard. | ابدأ بالإيجابي؛ السلبي بعده فرصته أكبر يتسمع.", "ex": ["Wrong. Start with what they did well. | غلط: ابدأ باللي عملوه كويس.", "Correct. | صح."], "n": 1, "i": 70, "h": ""}, {"t": "tf", "q": "It is not helpful to give students feedback about something over which they have no choice or control.<br>مش مفيد إنك تدّي الطلاب فيدباك عن حاجة مالهمش فيها اختيار أو سيطرة.", "ans": true, "why": "It frustrates and de-motivates. Refer to behaviour that can change. | ده محبط وبيقلل الدافعية. اتكلم عن سلوك قابل للتغيير.", "ex": ["Correct. | صح.", "Wrong. Target only changeable behaviour. | غلط: استهدف بس السلوك القابل للتغيير."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "Well done, excellent use of prepositions; now focus on past simple and past perfect. This feedback focuses on:<br>أحسنت، استخدام ممتاز لحروف الجر؛ دلوقتي ركز على الماضي البسيط والتام. الفيدباك ده بيركز على:", "opts": ["language | اللغة", "progress | التقدم", "achievement | الإنجاز"], "ans": 0, "why": "Prepositions and tenses are language points. | حروف الجر والأزمنة نقاط لغوية.", "ex": ["Correct. | صح.", "No. Nothing is compared with earlier work. | غلط: مفيش مقارنة بشغل سابق.", "No. No result or grade is praised. | غلط: مفيش نتيجة أو درجة اتمدحت."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "81%! A whole grade higher than your last story. This feedback focuses on:<br>٨١٪! درجة كاملة أعلى من قصتك اللي فاتت. الفيدباك ده بيركز على:", "opts": ["behaviour | السلوك", "effort | المجهود", "achievement | الإنجاز"], "ans": 2, "why": "A higher grade is an achievement. | الدرجة الأعلى إنجاز.", "ex": ["No. It is about a result, not conduct. | غلط: ده عن نتيجة مش سلوك.", "No. The comment praises the result itself. | غلط: التعليق بيمدح النتيجة نفسها.", "Correct. | صح."], "n": 1, "i": 73, "h": ""}, {"t": "tf", "q": "Young learners can give very detailed peer feedback.<br>المتعلمين الصغيرين يقدروا يقدّموا فيدباك أقران مفصّل جدًا.", "ans": false, "why": "They cannot yet think carefully about classmates' work. | لسه مش قادرين يفكروا بعناية في شغل زمايلهم.", "ex": ["Wrong. Detailed peer feedback is too hard for young learners. | غلط: الفيدباك المفصل صعب على الصغيرين.", "Correct. | صح."], "n": 1, "i": 74, "h": ""}, {"t": "recall", "q": "List the seven rules of constructive feedback.<br>اذكر القواعد السبعة للفيدباك البنّاء.", "a": "Start with the positive. Be specific. Refer to behaviour that can be changed. Seek or offer alternatives. Be descriptive rather than evaluative. Own the feedback. Leave the recipient with a choice.<br>ابدأ بالإيجابي. كن محدد. اتكلم عن سلوك قابل للتغيير. اطلب أو اقترح بدائل. كن واصف مش مقيّم. امتلك الفيدباك. سيب للمتلقي اختيار.", "n": 1, "i": 75, "h": ""}, {"t": "recall", "q": "What are the six fields feedback can concentrate on?<br>إيه المجالات الستة اللي الفيدباك ممكن يركز عليها؟", "a": "Language, content, progress, effort, behaviour, achievement.<br>اللغة، المحتوى، التقدم، المجهود، السلوك، الإنجاز.", "n": 1, "i": 76, "h": ""}, {"t": "write", "q": "Explain the difference between constructive and destructive feedback (3-4 sentences).<br>اشرح الفرق بين الفيدباك البنّاء والهدّام (٣-٤ جمل).", "key": "tefl-09:1", "a": "Constructive feedback increases self-awareness, offers guidance, and encourages development. It can be positive or negative, as long as it is given skilfully. Destructive feedback is negative feedback given in an unskilled way. It leaves the student feeling bad, with nothing to build on and no useful information for learning.<br>الفيدباك البنّاء بيزوّد الوعي بالذات، بيقدّم توجيه، وبيشجّع التطور. ممكن يكون إيجابي أو سلبي، المهم يتقدّم بمهارة. الفيدباك الهدّام هو فيدباك سلبي اتقدّم بطريقة غير ماهرة. بيسيب الطالب حاسس بالوحشة، من غير حاجة يبني عليها ولا معلومة مفيدة للتعلم.", "n": 1, "i": 77, "h": ""}, {"t": "write", "q": "Explain why feedback should start with the positive and be specific (3-4 sentences).<br>اشرح ليه الفيدباك لازم يبدأ بالإيجابي ويكون محدد (٣-٤ جمل).", "key": "tefl-09:2", "a": "Students need encouragement, and hearing first what they did well opens their ears to anything negative after it. In a rush to criticise, teachers often overlook the things they liked. General comments like brilliant or not so good feel nice or hurt, but teach nothing. Specific comments show exactly what the student did, so they can repeat it or change it.<br>الطلاب محتاجين تشجيع، وإنهم يسمعوا الأول اللي عملوه كويس بيفتح ودنهم لأي سلبي بعده. في عجلة النقد، المدرسين غالبًا بيفوتوا الحاجات اللي عجبتهم. التعليقات العامة زي رائع أو مش كويس بتفرّح أو تزعّل، بس مبتعلمش حاجة. التعليقات المحددة بتبين بالظبط اللي الطالب عمله، فيقدر يكرره أو يغيّره.", "n": 1, "i": 78, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 2 begins. A new stage of the course, with new skills for your teaching toolkit.</div><div class=\"u\">الدرس الجاي: بداية الموديول التاني. مرحلة جديدة من الكورس، بمهارات جديدة لعدتك كمدرس.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 79}];</script>
