<h1>عالم تيفل ١: إيه المميز في الإنجليزي؟</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ١</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-01";window.STEPS=[{"t": "section", "h": "Welcome | أهلًا بيك في كورس TEFL", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome. This course teaches you how to teach English. This is Module 1, Unit 1: The TEFL World.</div><div class=\"u\">أهلًا بيك. الكورس ده بيعلّمك تدرّس الإنجليزي. ده الموديول الأولاني، الوحدة الأولى: عالم تيفل.</div>", "n": 1, "i": 1, "a": "tefl-01-001", "x": "48bcbae2"}, {"t": "learn", "h": "<div class=\"u\">As a teacher, you are in charge of the classroom. The success of a lesson mostly depends on you. You set up the room and the tasks, give instructions, correct students, and guide the group.</div><div class=\"u\">كمدرّس، إنت المسؤول عن الفصل. نجاح الدرس بيعتمد عليك في الغالب. إنت اللي بترتّب الفصل والأنشطة، وبتدّي التعليمات، وبتصحّح للطلاب، وبتوجّه المجموعة.</div>", "n": 1, "i": 2, "a": "tefl-01-002", "x": "75f2fe07"}, {"t": "learn", "h": "<div class=\"u\">One writer says your main job is to create the conditions in which learning can take place (Scrivener 2009).</div><div class=\"u\">فيه كاتب بيقول إن شغلتك الأساسية إنك تجهّز الظروف اللي التعلم يحصل فيها (سكريفنر 2009).</div>", "n": 1, "i": 3, "a": "tefl-01-003", "x": "233bff09"}, {"t": "learn", "h": "<div class=\"u\">If you ever learned a language in a classroom, you know it can be hard. If you never did, try it: it helps you see learning from the student's side.</div><div class=\"u\">لو اتعلّمت لغة في فصل قبل كده، فأنت عارف إن ده صعب. ولو لسه، جرّب: ده هيخليك تشوف التعلم من ناحية الطالب.</div>", "n": 1, "i": 4, "a": "tefl-01-004", "x": "78872e5b"}, {"t": "learn", "h": "<div class=\"u\">A student may fear mistakes, not understand the teacher, or not read what is on the board. A confident person can suddenly feel shy.</div><div class=\"u\">الطالب ممكن يخاف يغلط، أو ميفهمش المدرّس، أو ميعرفش يقرا اللي على السبورة. والشخص الواثق ممكن فجأة يحس بالخجل.</div>", "n": 1, "i": 5, "a": "tefl-01-005", "x": "032dd118"}, {"t": "learn", "h": "<div class=\"u\">Writers call this stress the affective filter (Krashen 1985). Stress like this hurts learning and language acquisition.</div><div class=\"u\">العلماء بيسمّوا الضغط ده الفلتر الوجداني (كراشن 1985). الضغط زي ده بيأذي التعلم واكتساب اللغة.</div>", "n": 1, "i": 6, "a": "tefl-01-006", "x": "e93afadc"}, {"t": "learn", "h": "<div class=\"u\">In this course, you move forward by passing a short test after each module. The test only asks about the key points in the module, because testing helps learning.</div><div class=\"u\">في الكورس ده، بتتقدّم لما تعدّي اختبار قصير بعد كل موديول. الاختبار بيسأل بس عن النقط المهمة في الموديول، لأن الاختبار بيساعد التعلم.</div>", "n": 1, "i": 7, "a": "tefl-01-007", "x": "8b030aaf"}, {"t": "section", "h": "Why learn about English? | ليه نعرف عن الإنجليزي؟", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">One day, a colleague may ask you: what is special about English? Many people will see you as the English expert. It is good to have an answer ready.</div><div class=\"u\">يوم من الأيام، ممكن زميل يسألك: إيه المميز في الإنجليزي؟ ناس كتير هتشوفك إنت خبير الإنجليزي. فكويس تبقى مجهّز إجابة.</div>", "n": 1, "i": 9, "a": "tefl-01-008", "x": "b7a0af80"}, {"t": "learn", "h": "<div class=\"u\">There is a bigger reason. Your students' first language will be different from English in grammar, words, and structure. You must know this to teach well.</div><div class=\"u\">فيه سبب أكبر. اللغة الأولى لطلابك هتختلف عن الإنجليزي في القواعد والكلمات والتركيب. لازم تعرف ده عشان تدرّس كويس.</div>", "n": 1, "i": 10, "a": "tefl-01-009", "x": "f09d4cd8"}, {"t": "section", "h": "What makes English special? | إيه المميز في الإنجليزي؟", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">1) English is fairly easy to learn. It is one of the simplest natural languages in the world. Easy is relative: it depends on the language you already know.</div><div class=\"u\">١) الإنجليزي سهل نسبيًا في التعلم. من أبسط اللغات الطبيعية في العالم. وسهل كلمة نسبية: بيعتمد على اللغة اللي إنت عارفها أصلًا.</div>", "n": 1, "i": 12, "a": "tefl-01-010", "x": "46c7b233"}, {"t": "learn", "h": "<div class=\"u\">But compared to very complex languages like Arabic, Cantonese, Mandarin, Korean, and Japanese, English is simple to learn, understand, and speak.</div><div class=\"u\">بس مقارنة بلغات معقدة جدًا زي العربي والكانتوني والماندرين والكوري والياباني، الإنجليزي بسيط في التعلم والفهم والكلام.</div>", "n": 1, "i": 13, "a": "tefl-01-011", "x": "a3c7428d"}, {"t": "learn", "h": "<div class=\"u\">2) English uses the Latin alphabet. This is the most common, simple, and short alphabet in the world. Only the Greek alphabet is shorter and simpler.</div><div class=\"u\">٢) الإنجليزي بيستخدم الحروف اللاتينية. دي أكتر حروف منتشرة وبسيطة وقصيرة في العالم. الحروف اليونانية بس هي الأقصر والأبسط.</div>", "n": 1, "i": 14, "a": "tefl-01-012", "x": "aeb18a6b"}, {"t": "learn", "h": "<div class=\"u\">In English, the Latin alphabet has its cleanest form: a true alphabet with only 26 basic letters.</div><div class=\"u\">وفي الإنجليزي، الحروف اللاتينية واخدة أنضف صورة ليها: ألفباء حقيقية فيها ٢٦ حرف أساسي بس.</div>", "n": 1, "i": 15, "a": "tefl-01-013", "x": "53044212"}, {"t": "learn", "h": "<div class=\"u\">3) English has simple inflection: the extra letters we add to nouns, verbs, and adjectives in different grammar forms, like cat/cats, eat/eats, big/bigger.</div><div class=\"u\">٣) التصريف في الإنجليزي بسيط: حروف زيادة بنضيفها للاسم والفعل والصفة في صورهم المختلفة، زي cat/cats وeat/eats وbig/bigger.</div>", "n": 1, "i": 16, "a": "tefl-01-014", "x": "8c1bb941"}, {"t": "learn", "h": "<div class=\"u\">English is weakly inflected compared to French or Russian. Nouns show only traces, like plurals and pronouns. Regular verbs have just four forms: look, looks, looked, looking.</div><div class=\"u\">الإنجليزي ضعيف التصريف قدام الفرنسي والروسي. الأسماء فيها آثار بس زي الجمع والضمائر. والأفعال المنتظمة ٤ صور: look وlooks وlooked وlooking.</div>", "n": 1, "i": 17, "a": "tefl-01-015", "x": "1301debb"}, {"t": "learn", "h": "<div class=\"u\">Even irregular verbs almost never change with the person. The only common change is third person singular in the present: I eat, you eat, she eats.</div><div class=\"u\">حتى الأفعال الشاذة مبتتغيرش تقريبًا مع الفاعل. التغيير الوحيد المشهور هو الغائب المفرد في المضارع: I eat وyou eat وshe eats.</div>", "n": 1, "i": 18, "a": "tefl-01-016", "x": "780dc1d0"}, {"t": "learn", "h": "<div class=\"u\">So English can show how words relate in a sentence with very little change in the words themselves. Other languages can do this too, but it is a strong feature of English.</div><div class=\"u\">يعني الإنجليزي بيقدر يوضّح علاقة الكلمات في الجملة بأقل تغيير في الكلمات نفسها. فيه لغات تانية بتعمل كده، بس دي ميزة قوية في الإنجليزي.</div>", "n": 1, "i": 19, "a": "tefl-01-017", "x": "d01ed933"}, {"t": "learn", "h": "<div class=\"u\">4) English is very open to words from other languages. From Spanish, for example: alligator comes from el lagarto, meaning the lizard.</div><div class=\"u\">٤) الإنجليزي منفتح جدًا على كلمات من لغات تانية. من الإسباني مثلًا: كلمة alligator جاية من el lagarto يعني السحلية.</div>", "n": 1, "i": 20, "a": "tefl-01-018", "x": "79078a36"}, {"t": "learn", "h": "<div class=\"u\">More examples: barbecue comes from barbacoa, a wooden frame for sleeping or for drying meat and fish. And cargo comes from the verb cargar, meaning to load.</div><div class=\"u\">أمثلة كمان: barbecue جاية من barbacoa، وهي هيكل خشبي للنوم أو لتجفيف اللحم والسمك. وcargo جاية من الفعل cargar يعني يحمّل.</div>", "n": 1, "i": 21, "a": "tefl-01-019", "x": "7995a07c"}, {"t": "learn", "h": "<div class=\"u\">This openness is amazing. English has taken words from Asian, European, African, Indian, Japanese, and Chinese languages.</div><div class=\"u\">الانفتاح ده مدهش. الإنجليزي خد كلمات من لغات آسيوية وأوروبية وأفريقية وهندية ويابانية وصينية.</div>", "n": 1, "i": 22, "a": "tefl-01-020", "x": "00d83e09"}, {"t": "learn", "h": "<div class=\"u\">It also keeps an open door to classical languages like Latin, Greek, and Sanskrit.</div><div class=\"u\">ولسه فاتح الباب للغات الكلاسيكية زي اللاتيني واليوناني والسنسكريت.</div>", "n": 1, "i": 23, "a": "tefl-01-021", "x": "4fbfa3c4"}, {"t": "learn", "h": "<div class=\"u\">5) English has a mostly fixed word order. Most sentences follow SVO: Subject first, then Verb, then Object. Example: I bought a new computer.</div><div class=\"u\">٥) ترتيب الكلام في الإنجليزي ثابت في الغالب. أغلب الجمل بتتبع SVO: الفاعل الأول، وبعدين الفعل، وبعدين المفعول. مثال: I bought a new computer.</div>", "n": 1, "i": 24, "a": "tefl-01-022", "x": "52e0f405"}, {"t": "learn", "h": "<div class=\"u\">More examples: She doesn't like dogs. Why did you do that? Other orders exist in English, but SVO is by far the most used, so it is easy for learners.</div><div class=\"u\">أمثلة كمان: She doesn't like dogs. وWhy did you do that? فيه ترتيبات تانية في الإنجليزي، بس SVO هو الأكثر استخدامًا بفرق كبير، وعشان كده سهل على المتعلمين.</div>", "n": 1, "i": 25, "a": "tefl-01-023", "x": "3f08ad94"}, {"t": "learn", "h": "<div class=\"u\">6) English has no marks on its letters. In some languages, a small mark over, under, or through a letter changes its sound. Spanish examples: exámenes, muñón, muñones, canción.</div><div class=\"u\">٦) الإنجليزي مفيهوش علامات على حروفه. في لغات، علامة صغيرة فوق الحرف أو تحته أو خلاله بتغيّر نطقه. أمثلة إسبانية: exámenes وmuñón وmuñones وcanción.</div>", "n": 1, "i": 26, "a": "tefl-01-024", "x": "003656c2"}, {"t": "learn", "h": "<div class=\"u\">The only exceptions in English are words imported from other languages, like rôle and naïve from French.</div><div class=\"u\">الاستثناء الوحيد في الإنجليزي هو الكلمات المأخوذة من لغات تانية، زي rôle وnaïve من الفرنسي.</div>", "n": 1, "i": 27, "a": "tefl-01-025", "x": "85a03e17"}, {"t": "learn", "h": "<div class=\"u\">7) Some English sounds are hard. Words like this, thin, clothes, thirteenth, and months need the tip of the tongue.</div><div class=\"u\">٧) فيه أصوات إنجليزية صعبة. كلمات زي this وthin وclothes وthirteenth وmonths محتاجة طرف اللسان.</div>", "n": 1, "i": 28, "a": "tefl-01-026", "x": "e85947cc"}, {"t": "learn", "h": "<div class=\"u\">Learners whose own languages never use the tongue tip will find these words very hard.</div><div class=\"u\">المتعلمين اللي لغتهم مبتستخدمش طرف اللسان هيلاقوا الكلمات دي صعبة جدًا.</div>", "n": 1, "i": 29, "a": "tefl-01-027", "x": "2e08445f"}, {"t": "learn", "h": "<div class=\"u\">8) Many languages have no continuous tense. So learners make mistakes like: I had a bath when the phone rang, instead of: I was having a bath when the phone rang.</div><div class=\"u\">٨) لغات كتير مفيهاش زمن مستمر. عشان كده المتعلمين بيغلطوا ويقولوا: I had a bath when the phone rang، بدل: I was having a bath when the phone rang.</div>", "n": 1, "i": 30, "a": "tefl-01-028", "x": "0828125b"}, {"t": "learn", "h": "<div class=\"u\">9) The articles a, an, and the cause huge difficulty for some students, especially when their own language has no articles at all.</div><div class=\"u\">٩) أدوات التنكير والتعريف a وan وthe بتعمل صعوبة كبيرة لطلاب كتير، خصوصًا لو لغتهم الأصلية مفيهاش أدوات أصلًا.</div>", "n": 1, "i": 31, "a": "tefl-01-029", "x": "b62ea836"}, {"t": "learn", "h": "<div class=\"u\">10) A phrasal verb is a verb plus a small word: an adverb like break down, a preposition like see to, or both, like look down on. They are a very big feature of English.</div><div class=\"u\">١٠) الفعل المركب هو فعل مع كلمة صغيرة: حال زي break down، أو حرف جر زي see to، أو الاتنين زي look down on. ودي ميزة كبيرة جدًا في الإنجليزي.</div>", "n": 1, "i": 32, "a": "tefl-01-030", "x": "c3b21b49"}, {"t": "learn", "h": "<div class=\"u\">These verbs can cause severe difficulty. To a beginner, sentences like I put it down to the weather or I made it up with my sister sound like nonsense.</div><div class=\"u\">الأفعال دي ممكن تعمل صعوبة شديدة. للمبتدئ، جمل زي I put it down to the weather أو I made it up with my sister بتبان كلام فاضي.</div>", "n": 1, "i": 33, "a": "tefl-01-031", "x": "0a6daae4"}, {"t": "learn", "h": "<div class=\"u\">And sadly for the learner, phrasal verbs are extremely common in everyday spoken English.</div><div class=\"u\">ولسوء حظ المتعلم، الأفعال المركبة منتشرة جدًا جدًا في الإنجليزي المحكي اليومي.</div>", "n": 1, "i": 34, "a": "tefl-01-032", "x": "42302af0"}, {"t": "learn", "h": "<div class=\"u\">11) English is not a tonal language. In tonal languages like Chinese and Vietnamese, pitch changes a word's meaning. The same word said high or low can mean different things.</div><div class=\"u\">١١) الإنجليزي مش لغة نغمية. في اللغات النغمية زي الصيني والفيتنامي، طبقة الصوت بتغيّر معنى الكلمة. نفس الكلمة بنغمة عالية أو واطية ممكن تبقى معاني مختلفة.</div>", "n": 1, "i": 35, "a": "tefl-01-033", "x": "595db8ce"}, {"t": "learn", "h": "<div class=\"u\">In English, pitch only adds emphasis or emotion. It never changes the meaning of a word. This is why speakers of tonal languages often keep a strong accent in English.</div><div class=\"u\">في الإنجليزي، طبقة الصوت بتضيف تأكيد أو إحساس بس. مبتغيّرش معنى الكلمة أبدًا. عشان كده أصحاب اللغات النغمية غالبًا بيفضل معاهم نطق بلكنة واضحة في الإنجليزي.</div>", "n": 1, "i": 36, "a": "tefl-01-034", "x": "814d0492"}, {"t": "learn", "h": "<div class=\"u\">12) The last feature is a big problem: English sound and spelling often do not match. A learner often cannot guess the spelling of a new spoken word, or the pronunciation of a new written word.</div><div class=\"u\">١٢) آخر ميزة مشكلة كبيرة: النطق والهجاء في الإنجليزي كتير مبيتطابقوش. المتعلم غالبًا ميعرفش يخمّن هجاء كلمة سمعها، ولا نطق كلمة قراها.</div>", "n": 1, "i": 37, "a": "tefl-01-035", "x": "f47341cc"}, {"t": "learn", "h": "<div class=\"u\">In fact, most English words do follow spelling patterns. The hard part is that the words that break the patterns are some of the most common words, so learners meet them first.</div><div class=\"u\">الحقيقة إن أغلب الكلمات الإنجليزية بتتبع قواعد هجاء. المشكلة إن الكلمات اللي بتكسر القواعد دي من أكتر الكلمات شيوعًا، فالمتعلم بيقابلها في الأول.</div>", "n": 1, "i": 38, "a": "tefl-01-036", "x": "728ebb6b"}, {"t": "learn", "h": "<div class=\"u\">Examples: words with ough, like thought, although, rough. Words with the same sound but different spellings: ate and eight, hear and here, their and there.</div><div class=\"u\">أمثلة: كلمات فيها ough زي thought وalthough وrough. وكلمات بنفس النطق وهجاء مختلف: ate وeight، وhear وhere، وtheir وthere.</div>", "n": 1, "i": 39, "a": "tefl-01-037", "x": "789e9815"}, {"t": "learn", "h": "<div class=\"u\">Words with silent letters: know, could, hour. And words that look the same but sound different: read now, read in the past.</div><div class=\"u\">كلمات فيها حروف صامتة: know وcould وhour. وكلمات شكلها واحد ونطقها مختلف: read في المضارع وread في الماضي.</div>", "n": 1, "i": 40, "a": "tefl-01-038", "x": "1b84ad00"}, {"t": "learn", "h": "<div class=\"u\">More same-look pairs: present a gift and present to give, close near and close to shut.</div><div class=\"u\">أزواج تانية نفس الشكل: present هدية وpresent يقدّم، وclose قريب وclose يقفل.</div>", "n": 1, "i": 41, "a": "tefl-01-039", "x": "f6bbd8ef"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 42}, {"t": "learn", "h": "<div class=\"u\">Key terms. Inflection: extra letters added to a word for grammar. SVO: subject, verb, object order. Phrasal verb: a verb plus a small word with a new meaning.</div><div class=\"u\">مصطلحات الدرس. Inflection: التصريف. SVO: ترتيب فاعل فعل مفعول. Phrasal verb: فعل مركب.</div>", "n": 1, "i": 43, "a": "tefl-01-040", "x": "5e1b2691"}, {"t": "learn", "h": "<div class=\"u\">More terms. Diacritics: small marks on letters. Tonal language: pitch changes meaning. Article: a, an, the.</div><div class=\"u\">مصطلحات كمان. Diacritics: علامات تشكيل الحروف. Tonal language: لغة نغمية. Article: أداة تنكير أو تعريف.</div>", "n": 1, "i": 44, "a": "tefl-01-041", "x": "3855ebd5"}, {"t": "learn", "h": "<div class=\"u\">Continuous tense: an ongoing action form. Affective filter: stress that blocks learning.</div><div class=\"u\">Continuous tense: الزمن المستمر. Affective filter: الفلتر الوجداني، ضغط بيمنع التعلم.</div>", "n": 1, "i": 45, "a": "tefl-01-042", "x": "65e08398"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">Summary. English is fairly easy, uses 26 Latin letters, has simple inflection, borrows words freely, and keeps a fixed SVO order. It has no letter marks and no tones.</div><div class=\"u\">الخلاصة. الإنجليزي سهل نسبيًا، بيستخدم ٢٦ حرف لاتيني، تصريفه بسيط، بياخد كلمات من كل اللغات، وترتيبه ثابت SVO. مفيهوش علامات على الحروف ولا نغمات.</div>", "n": 1, "i": 47, "a": "tefl-01-043", "x": "2f5fa8d1"}, {"t": "learn", "h": "<div class=\"u\">Its hard parts for learners are: some sounds like th, the continuous tense, articles, and phrasal verbs.</div><div class=\"u\">أجزاؤه الصعبة على المتعلمين: أصوات زي th، والزمن المستمر، والأدوات، والأفعال المركبة.</div>", "n": 1, "i": 48, "a": "tefl-01-044", "x": "ad1c403a"}, {"t": "learn", "h": "<div class=\"u\">And the biggest problem: spelling and sound often do not match. Next lesson: how Spanish and Chinese students meet English differently.</div><div class=\"u\">وأكبر مشكلة: الهجاء والنطق كتير مبيتطابقوش. الدرس الجاي: إزاي طلاب الإسباني والصيني بيقابلوا الإنجليزي بشكل مختلف.</div>", "n": 1, "i": 49, "a": "tefl-01-045", "x": "2a61a45f"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 50}, {"t": "mc", "q": "English uses which alphabet?<br>الإنجليزي بيستخدم أنهي حروف؟", "opts": ["Greek | يونانية", "Latin | لاتينية", "Arabic | عربية"], "ans": 1, "why": "English uses the Latin alphabet, 26 letters. | الإنجليزي بيستخدم الحروف اللاتينية، ٢٦ حرف.", "ex": ["No. Greek is shorter, but English does not use it. | غلط: اليونانية أقصر، بس الإنجليزي مش بيستخدمها.", "Correct. | صح.", "No. | غلط."], "n": 1, "i": 51, "h": ""}, {"t": "tf", "q": "English is a tonal language.<br>الإنجليزي لغة نغمية.", "ans": false, "why": "In English, pitch adds emotion only; it never changes a word's meaning. | في الإنجليزي، طبقة الصوت بتضيف إحساس بس، ومبتغيّرش معنى الكلمة.", "ex": ["Wrong. Pitch never changes meaning in English. | غلط: طبقة الصوت مبتغيّرش المعنى في الإنجليزي.", "Correct. | صح."], "n": 1, "i": 52, "h": ""}, {"t": "tf", "q": "Inflection means extra letters added to nouns, verbs, and adjectives in their different grammar forms.<br>التصريف يعني حروف زيادة بتتضاف للاسم والفعل والصفة في صورهم القواعدية المختلفة.", "ans": true, "why": "Like cat/cats and eat/eats. | زي cat/cats وeat/eats.", "ex": ["Correct. | صح.", "Wrong. That is exactly what inflection is. | غلط: ده بالظبط معنى التصريف."], "n": 1, "i": 53, "h": ""}, {"t": "tf", "q": "All languages have a continuous tense form.<br>كل اللغات فيها زمن مستمر.", "ans": false, "why": "Many languages have no continuous tense, so learners make mistakes here. | لغات كتير مفيهاش زمن مستمر، فالمتعلمين بيغلطوا هنا.", "ex": ["Wrong. Many languages lack it. | غلط: لغات كتير مفيهاش.", "Correct. | صح."], "n": 1, "i": 54, "h": ""}, {"t": "mc", "q": "\"I bought a new computer\" follows which order?<br>جملة I bought a new computer ماشية على أنهي ترتيب؟", "opts": ["SVO | فاعل فعل مفعول", "VSO | فعل فاعل مفعول", "OVS | مفعول فعل فاعل"], "ans": 0, "why": "Subject, then verb, then object. | فاعل، وبعدين فعل، وبعدين مفعول.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 1, "i": 55, "h": ""}, {"t": "tf", "q": "English is one of the simplest natural languages in the world.<br>الإنجليزي من أبسط اللغات الطبيعية في العالم.", "ans": true, "why": "Easy is relative, but simple is true, compared to very complex languages. | السهولة نسبية، بس البساطة حقيقة مقارنة بلغات معقدة جدًا.", "ex": ["Correct. | صح.", "Wrong. | غلط."], "n": 1, "i": 56, "h": ""}, {"t": "mc", "q": "\"Break down\" and \"look down on\" are:<br>Break down وlook down on دول إيه؟", "opts": ["Articles | أدوات", "Phrasal verbs | أفعال مركبة", "Diacritics | علامات تشكيل"], "ans": 1, "why": "A verb plus a small word with a new meaning. | فعل مع كلمة صغيرة بمعنى جديد.", "ex": ["No. | غلط.", "Correct. | صح.", "No. | غلط."], "n": 1, "i": 57, "h": ""}, {"t": "tf", "q": "Most English words that break spelling patterns are rare words.<br>أغلب الكلمات الإنجليزية اللي بتكسر قواعد الهجاء كلمات نادرة.", "ans": false, "why": "The pattern-breakers are some of the most common words, so learners meet them first. | اللي بيكسر القواعد من أكتر الكلمات شيوعًا، فالمتعلم بيقابلها أول حاجة.", "ex": ["Wrong. They are very common words. | غلط: دي كلمات شائعة جدًا.", "Correct. | صح."], "n": 1, "i": 58, "h": ""}, {"t": "recall", "q": "Name 4 things that make English special.<br>اذكر ٤ حاجات بتميّز الإنجليزي.", "a": "Any 4: fairly easy, Latin alphabet, simple inflection, open to other languages, fixed SVO order, no letter marks, hard th sounds, continuous tense, articles, phrasal verbs, not tonal, spelling-sound mismatch.<br>أي ٤: سهل نسبيًا، حروف لاتينية، تصريف بسيط، منفتح على اللغات التانية، ترتيب SVO ثابت، مفيهوش علامات على الحروف، أصوات th صعبة، زمن مستمر، أدوات، أفعال مركبة، مش نغمي، هجاء ونطق مش متطابقين.", "n": 1, "i": 59, "h": ""}, {"t": "recall", "q": "What is the problem between English sound and spelling?<br>إيه المشكلة بين النطق والهجاء في الإنجليزي؟", "a": "They often do not match, and the words that break the patterns are very common, so learners meet them first.<br>كتير مبيتطابقوش، والكلمات اللي بتكسر القواعد شائعة جدًا، فالمتعلم بيقابلها في الأول.", "n": 1, "i": 60, "h": ""}, {"t": "write", "q": "Explain why phrasal verbs are hard for beginners (3-4 sentences).<br>اشرح ليه الأفعال المركبة صعبة على المبتدئين (٣-٤ جمل).", "key": "tefl-01:1", "a": "A phrasal verb is a verb plus a small word, and together they have a new meaning. The meaning is not clear from the parts, so beginners cannot guess it. Sentences like I made it up with my sister sound like nonsense to them. And phrasal verbs are very common in spoken English.<br>الفعل المركب هو فعل مع كلمة صغيرة، ومع بعض بيدّوا معنى جديد. المعنى مش واضح من أجزائه، فالمبتدئ ميعرفش يخمّنه. جمل زي I made it up with my sister بتبان كلام فاضي ليه. والأفعال المركبة منتشرة جدًا في الإنجليزي المحكي.", "n": 1, "i": 61, "h": ""}, {"t": "write", "q": "Explain the affective filter in your own words (3-4 sentences).<br>اشرح الفلتر الوجداني بكلامك (٣-٤ جمل).", "key": "tefl-01:2", "a": "The affective filter is the stress a learner feels in a classroom, like fear of mistakes or not understanding. This stress hurts learning and language acquisition. A confident person can suddenly feel shy in a language class. The idea comes from Krashen (1985).<br>الفلتر الوجداني هو الضغط اللي المتعلم بيحس بيه في الفصل، زي الخوف من الغلط أو عدم الفهم. الضغط ده بيأذي التعلم واكتساب اللغة. والشخص الواثق ممكن فجأة يحس بالخجل في فصل اللغة. الفكرة جاية من كراشن (1985).", "n": 1, "i": 62, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: key differences between English and other languages. We will look at Spanish and Chinese students.</div><div class=\"u\">الدرس الجاي: الفروق المهمة بين الإنجليزي واللغات التانية. هنشوف طلاب الإسباني والصيني.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 63}];</script>
