<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٢٣</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-23";window.STEPS=[{"t": "section", "h": "Why motivation matters | ليه التحفيز مهم", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Motivation is so important that it deserves a whole unit. It matters in everything you say and do with your learners, not only in lesson planning.</div><div class=\"u\">التحفيز مهم لدرجة إنه يستاهل وحدة كاملة. مهم في كل حاجة بتقولها وبتعملها مع متعلميك، مش بس في تخطيط الدروس.</div>", "n": 1, "i": 1, "a": "tefl-23-001", "x": "4cccea38"}, {"t": "learn", "h": "<div class=\"u\">Deep theories of motivation exist, but they are unlikely to add much to your learning at this stage.</div><div class=\"u\">في نظريات عميقة عن التحفيز، بس مش متوقع إنها تضيف كتير لتعلمك في المرحلة دي.</div>", "n": 1, "i": 2, "a": "tefl-23-002", "x": "cf1c1032"}, {"t": "learn", "h": "<div class=\"u\">You know what motivation is: sometimes you are highly enthused and driven, and at other times you feel no drive at all. Your students are no different.</div><div class=\"u\">انت عارف يعني إيه تحفيز: ساعات بتكون متحمس جدًا ومندفع، وساعات مابتحسش بأي دافع خالص. طلبتك مش مختلفين عنك.</div>", "n": 1, "i": 3, "a": "tefl-23-003", "x": "7839c275"}, {"t": "learn", "h": "<div class=\"u\">When you are motivated, there is a kind of inspiration and eagerness to succeed in what you are doing, whatever it is.</div><div class=\"u\">لما تكون متحفّز، في نوع من الإلهام واللهفة إنك تنجح في اللي بتعمله، مهما كان.</div>", "n": 1, "i": 4, "a": "tefl-23-004", "x": "0b1e07d4"}, {"t": "learn", "h": "<div class=\"u\">The motivated learner is willing and eager to invest great effort and substantial time in language learning, and is driven to make progress and do better.</div><div class=\"u\">المتعلم المتحفّز مستعد ومتلهف إنه يستثمر مجهود كبير ووقت طويل في تعلم اللغة، ومندفع إنه يتقدّم ويبقى أحسن.</div>", "n": 1, "i": 5, "a": "tefl-23-005", "x": "265665c7"}, {"t": "learn", "h": "<div class=\"u\">Learner motivation makes learning, and teaching, immeasurably easier and more pleasant, not to mention more productive.</div><div class=\"u\">تحفيز المتعلم بيخلّي التعلم، والتدريس، أسهل وأمتع بشكل مابيتقاسش، وكمان أكتر إنتاجية.</div>", "n": 1, "i": 6, "a": "tefl-23-006", "x": "9cc4b4fb"}, {"t": "section", "h": "Two types of motivation | نوعين التحفيز", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">There are generally two types of learner motivation: intrinsic and extrinsic.</div><div class=\"u\">في نوعين عمومًا لتحفيز المتعلم: داخلي وخارجي.</div>", "n": 1, "i": 8, "a": "tefl-23-007", "x": "99270d93"}, {"t": "learn", "h": "<div class=\"u\">Intrinsic motivation is the urge to engage in a learning activity for its own sake, for the enjoyment it provides, or the feelings of accomplishment it evokes.</div><div class=\"u\">التحفيز الداخلي هو الرغبة إنك تدخل في نشاط تعليمي لذاته، عشان المتعة اللي بيديها، أو إحساس الإنجاز اللي بيوقّظه.</div>", "n": 1, "i": 9, "a": "tefl-23-008", "x": "914a4600"}, {"t": "learn", "h": "<div class=\"u\">This type of learner is driven by personal achievement.</div><div class=\"u\">النوع ده من المتعلمين مندفع بالإنجاز الشخصي.</div>", "n": 1, "i": 10, "a": "tefl-23-009", "x": "4f8aa6e9"}, {"t": "learn", "h": "<div class=\"u\">Extrinsic motivation comes from external incentives, reward and success: a qualification, a high proficiency score to enter an English-speaking university, or the desire for higher pay.</div><div class=\"u\">التحفيز الخارجي بييجي من حوافز خارجية، مكافأة ونجاح: مؤهل، درجة إتقان عالية عشان تدخل جامعة إنجليزية، أو الرغبة في مرتب أعلى.</div>", "n": 1, "i": 11, "a": "tefl-23-010", "x": "1fe72566"}, {"t": "learn", "h": "<div class=\"u\">Whether one type of motivated learner is more motivated than another is up for grabs; there is not enough conclusive research.</div><div class=\"u\">أنهي نوع أكتر تحفيزًا من التاني موضوع مفتوح؛ مفيش أبحاث حاسمة كفاية.</div>", "n": 1, "i": 12, "a": "tefl-23-011", "x": "341ae4bc"}, {"t": "learn", "h": "<div class=\"u\">What matters more: give thought to this when you meet your new class, particularly adults.</div><div class=\"u\">الأهم: فكّر في ده لما تقابل فصلك الجديد، خصوصًا الكبار.</div>", "n": 1, "i": 13, "a": "tefl-23-012", "x": "0deef334"}, {"t": "learn", "h": "<div class=\"u\">Ask them why they decided to take your course, and note the reasons.</div><div class=\"u\">اسألهم ليه قرّروا ياخدوا كورسك، وسجّل الأسباب.</div>", "n": 1, "i": 14, "a": "tefl-23-013", "x": "a8fd2ce1"}, {"t": "learn", "h": "<div class=\"u\">Being informed, you can empathise with them, foster the necessary attitudes, and directly encourage their drive, be it personal achievement or reward.</div><div class=\"u\">لما تبقى عارف، تقدر تتعاطف معاهم، وتزرع الاتجاهات المطلوبة، وتشجّع دافعهم مباشرة، سواء كان إنجاز شخصي أو مكافأة.</div>", "n": 1, "i": 15, "a": "tefl-23-014", "x": "efae2cbc"}, {"t": "learn", "h": "<div class=\"u\">You will contribute to their motivation and will be able to kick start any drop in it if there is a lapse.</div><div class=\"u\">هتساهم في تحفيزهم وهتقدر تعيد تشغيل أي هبوط فيه لو حصل فتور.</div>", "n": 1, "i": 16, "a": "tefl-23-015", "x": "86783376"}, {"t": "section", "h": "Key elements of motivation | عناصر التحفيز الأساسية", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">Key element one: you need to be motivated to motivate them. Do not expect motivated students if you are not.</div><div class=\"u\">العنصر الأساسي الأول: لازم تكون متحفّز عشان تحفّزهم. ماتتوقعش طلبة متحفّزين لو انت مش كده.</div>", "n": 1, "i": 18, "a": "tefl-23-016", "x": "45cec81d"}, {"t": "learn", "h": "<div class=\"u\">When you feel a temporary lacklustre feeling, you need to get out of it, or your students will quickly become deflated.</div><div class=\"u\">لما تحس بفتور مؤقت، لازم تخرج منه، وإلا طلبتك هيبهدلوا بسرعة.</div>", "n": 1, "i": 19, "a": "tefl-23-017", "x": "74a25e5d"}, {"t": "learn", "h": "<div class=\"u\">Key element two: everyone can be motivated in some way or another.</div><div class=\"u\">العنصر التاني: أي حد ممكن يتحفّز بطريقة أو بأخرى.</div>", "n": 1, "i": 20, "a": "tefl-23-018", "x": "f6229493"}, {"t": "learn", "h": "<div class=\"u\">An odd student may appear demotivated for many reasons: cultural considerations, finding the work too hard, or not being convinced by the communicative approach.</div><div class=\"u\">طالب غريب ممكن يبان غير متحفّز لأسباب كتير: اعتبارات ثقافية، الشغل صعب عليه، أو مش مقتنع بالمنهج التواصلي أصلًا.</div>", "n": 1, "i": 21, "a": "tefl-23-019", "x": "750d3e04"}, {"t": "learn", "h": "<div class=\"u\">So find out as much as possible about your students from day one: their likes and dislikes, and how they have previously been taught.</div><div class=\"u\">فاعرف أكبر قدر ممكن عن طلبتك من أول يوم: بيحبوا إيه وبيكرهوا إيه، واتعلموا إزاي قبل كده.</div>", "n": 1, "i": 22, "a": "tefl-23-020", "x": "ae383c51"}, {"t": "learn", "h": "<div class=\"u\">If you cannot identify the reason for a drop in drive, arrange a few minutes with the student after class, away from classmates. A little chat helps amazingly.</div><div class=\"u\">لو مش قادر تحدّد سبب هبوط الدافع، رتّب دقايق مع الطالب بعد الحصة، بعيد عن زمايله. الشكلمة الصغيرة بتساعد بشكل مدهش.</div>", "n": 1, "i": 23, "a": "tefl-23-021", "x": "08440c97"}, {"t": "learn", "h": "<div class=\"u\">Key element three: motivation should be multi-directional. You can also help motivate a colleague who is feeling down, and they will help you in the future.</div><div class=\"u\">العنصر التالت: التحفيز المفروض يبقى متعدد الاتجاهات. تقدر كمان تساعد تحفّز زميل حاسس بإحباط، وهو هيساعدك في المستقبل.</div>", "n": 1, "i": 24, "a": "tefl-23-022", "x": "1f8d4f11"}, {"t": "learn", "h": "<div class=\"u\">Key element four: motivation does not last. You need to keep at it all the time; it is strenuous but rewarding.</div><div class=\"u\">العنصر الرابع: التحفيز مابيدومش. لازم تفضل شغال عليه طول الوقت؛ مجهود مرهق بس مجزي.</div>", "n": 1, "i": 25, "a": "tefl-23-023", "x": "01f57135"}, {"t": "learn", "h": "<div class=\"u\">Remember: the whole person comes to school, students and teachers, with all their personal baggage, like worrying about a sick parent or an upset in a personal relationship.</div><div class=\"u\">افتكر: الشخص كله بييجي المدرسة، طلبة ومدرسين، بكل حمولته الشخصية، زي القلق على والد مريض أو انزعاج من مشكلة في علاقة شخصية.</div>", "n": 1, "i": 26, "a": "tefl-23-024", "x": "42a19886"}, {"t": "learn", "h": "<div class=\"u\">So the motivated person yesterday may not be the motivated person today. Help and show empathy wherever you can.</div><div class=\"u\">فالشخص المتحفّز إمبارح ممكن ميبقاش المتحفّز النهارده. ساعد وأبدي تعاطف في أي مكان تقدر.</div>", "n": 1, "i": 27, "a": "tefl-23-025", "x": "b33414ce"}, {"t": "section", "h": "Motivation and language learning | التحفيز وتعلم اللغة", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Research shows motivation is very strongly related to achievement in language learning.</div><div class=\"u\">الأبحاث بتوري إن التحفيز مرتبط بقوة جدًا بالتحصيل في تعلم اللغة.</div>", "n": 1, "i": 29, "a": "tefl-23-026", "x": "bac6b4d6"}, {"t": "learn", "h": "<div class=\"u\">You will be in a position to strongly influence your students' motivation to learn their new language.</div><div class=\"u\">انت هتكون في موقف يسمحلك تأثّر بقوة على تحفيز طلبتك لتعلم لغتهم الجديدة.</div>", "n": 1, "i": 30, "a": "tefl-23-027", "x": "29283bb9"}, {"t": "learn", "h": "<div class=\"u\">Ensure your lessons have clear objectives and goals, your activities are varied and personalised, and you give feedback and assess on an ongoing basis.</div><div class=\"u\">اتأكد إن دروسك ليها أهداف واضحة، وأنشطتك متنوعة ومخصصة للطلبة، وإنك بتدّي تغذية راجعة وبتقيّم باستمرار.</div>", "n": 1, "i": 31, "a": "tefl-23-028", "x": "2c2b7e57"}, {"t": "learn", "h": "<div class=\"u\">By doing so, you will foster, stimulate, or even rekindle your learners' motivation to learn.</div><div class=\"u\">بكده هتزرع أو تحفّز أو حتى تعيد إشعال دافع متعلميك للتعلم.</div>", "n": 1, "i": 32, "a": "tefl-23-029", "x": "89a98f04"}, {"t": "learn", "h": "<div class=\"u\">If you accomplish this, learning will happen regardless of whether the motivation is extrinsic or intrinsic.</div><div class=\"u\">لو عملت ده، التعلم هيحصل بغض النظر عن إذا كان التحفيز خارجي ولا داخلي.</div>", "n": 1, "i": 33, "a": "tefl-23-030", "x": "99e464d1"}, {"t": "section", "h": "Recognising a motivated learner | إزاي تعرف المتعلم المتحفّز", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">Research shows the motivated learner typically displays most or all of these characteristics.</div><div class=\"u\">الأبحاث بتوري إن المتعلم المتحفّز بيظهر عادة أغلب أو كل الصفات دي.</div>", "n": 1, "i": 35, "a": "tefl-23-031", "x": "7274d754"}, {"t": "learn", "h": "<div class=\"u\">One: the learner is willing to tackle tasks and challenges, and has confidence in her success.</div><div class=\"u\">واحد: المتعلم مستعد يواجه المهام والتحديات، وعنده ثقة في نجاحه.</div>", "n": 1, "i": 36, "a": "tefl-23-032", "x": "399c39f2"}, {"t": "learn", "h": "<div class=\"u\">Two: the learner finds it important to succeed in learning in order to maintain and promote her own positive self-image.</div><div class=\"u\">اتنين: المتعلم بيعتبر النجاح في التعلم مهم عشان يحافظ على صورته الذاتية الإيجابية ويعزّزها.</div>", "n": 1, "i": 37, "a": "tefl-23-033", "x": "9fa5bccc"}, {"t": "learn", "h": "<div class=\"u\">Three: the learner has a need to achieve, to overcome difficulties and succeed in what she sets out to do.</div><div class=\"u\">تلاتة: المتعلم عنده حاجة للإنجاز، إنه يتغلب على الصعوبات وينجح في اللي نوى يعمله.</div>", "n": 1, "i": 38, "a": "tefl-23-034", "x": "3575952e"}, {"t": "learn", "h": "<div class=\"u\">Four: the learner is ambitious, goes for demanding challenges, high proficiency, and top grades.</div><div class=\"u\">أربعة: المتعلم طموح، بيروح للتحديات الصعبة، والإتقان العالي، والدرجات النهائية.</div>", "n": 1, "i": 39, "a": "tefl-23-035", "x": "64371cb7"}, {"t": "learn", "h": "<div class=\"u\">Five: the learner is very aware of the goals of learning, or of specific learning activities, and directs her efforts towards achieving them.</div><div class=\"u\">خمسة: المتعلم واعي جدًا بأهداف التعلم، أو بأنشطة تعلم معينة، وبيوجّه مجهوده لتحقيقها.</div>", "n": 1, "i": 40, "a": "tefl-23-036", "x": "b8e9d5bc"}, {"t": "learn", "h": "<div class=\"u\">Six: the learner consistently invests a high level of effort in learning, and is not discouraged by setbacks or apparent lack of progress.</div><div class=\"u\">سته: المتعلم بيستثمر باستمرار مستوى مجهود عالي في التعلم، ومابيتحبطش من الانتكاسات أو غياب التقدم الظاهري.</div>", "n": 1, "i": 41, "a": "tefl-23-037", "x": "abaa45ad"}, {"t": "learn", "h": "<div class=\"u\">Seven: the learner is not bothered or frustrated by a temporary lack of understanding or confusion; she can live with these patiently, confident understanding will come later.</div><div class=\"u\">سبعة: المتعلم مابيتضايقش ومابيتحبطش من عدم الفهم المؤقت أو اللخبطة؛ بيقدر يستحملهم بصبر، وواثق إن الفهم هيجي بعدين.</div>", "n": 1, "i": 42, "a": "tefl-23-038", "x": "45f5545e"}, {"t": "section", "h": "Ten ways to drive motivation | عشر طرق لزيادة التحفيز", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Ten practical ways to influence motivation. One: make them aware of their own success, with a nod, a tick, a smile, explicit praise, or a comment in the learner's answer book.</div><div class=\"u\">عشر طرق عملية للتأثير على التحفيز. واحد: خلّيهم واعيين بنجاحهم، بإيماءة أو علامة صح أو ابتسامة أو مديح صريح أو تعليق في كراسة المتعلم.</div>", "n": 1, "i": 44, "a": "tefl-23-039", "x": "45fe2cee"}, {"t": "learn", "h": "<div class=\"u\">Two: set clear objectives and goals. Tell learners the objectives of the task, both language-learning and content.</div><div class=\"u\">اتنين: حط أهداف واضحة. قول للمتعلمين أهداف المهمة، أهداف تعلم اللغة والمحتوى.</div>", "n": 1, "i": 45, "a": "tefl-23-040", "x": "4f64014b"}, {"t": "learn", "h": "<div class=\"u\">Some learners, particularly adults, may get annoyed by too many fun activities; tell them the purpose of the game before you start, and they will accept the fun element more.</div><div class=\"u\">بعض المتعلمين، خصوصًا الكبار، ممكن يتضايقوا من الأنشطة الممتعة الكتير؛ قولهم هدف اللعبة قبل ما تبدأ، وهيتقبلوا عنصر المتعة أكتر.</div>", "n": 1, "i": 46, "a": "tefl-23-041", "x": "f377baa1"}, {"t": "learn", "h": "<div class=\"u\">Three: explain purpose and usefulness. If you explain that preposition errors are the most common mistake in student writing, learners will pay closer attention.</div><div class=\"u\">تلاتة: اشرح الهدف والفايدة. لو شرحت إن أخطاء حروف الجر أكتر غلطة شائعة في كتابة الطلبة، المتعلمين هيركّزوا أكتر.</div>", "n": 1, "i": 47, "a": "tefl-23-042", "x": "62c627c7"}, {"t": "learn", "h": "<div class=\"u\">Four: vary classroom topics and tasks. Very few single activity types interest everyone, so use a wide range over time.</div><div class=\"u\">أربعة: نوّع المواضيع والمهام. نادر جدًا نوع نشاط واحد يهم الكل، فاستخدم مدى واسع مع الوقت.</div>", "n": 1, "i": 48, "a": "tefl-23-043", "x": "a94907cd"}, {"t": "learn", "h": "<div class=\"u\">Example: listen to a dialogue about school routines, complete a worksheet, compare answers with a partner, then create an original dialogue on the same topic. Variety is a major key to success.</div><div class=\"u\">مثال: اسمعوا حوار عن الروتين المدرسي، اكملوا ورقة عمل، قارنوا الإجابات مع شريك، وبعدين اعملوا حوار أصلي عن نفس الموضوع. التنوع مفتاح أساسي للنجاح.</div>", "n": 1, "i": 49, "a": "tefl-23-044", "x": "3cec2553"}, {"t": "learn", "h": "<div class=\"u\">Five: generate tension and challenge. Game-like activities with rules, like an arbitrary time limit, add excitement to almost any goal-oriented task.</div><div class=\"u\">خمسة: ولّد توتر وتحدي. الأنشطة الشبيهة بالألعاب بقواعد، زي حد زمني اعتباطي، بتضيف إثارة لتقريبًا أي مهمة ليها هدف.</div>", "n": 1, "i": 50, "a": "tefl-23-045", "x": "c5b04669"}, {"t": "learn", "h": "<div class=\"u\">Six: create a fun atmosphere. Entertainment produces enjoyment, which adds motivation: jokes, stories, mimes, songs, dramatic presentations, movies, video clips, documentaries.</div><div class=\"u\">سته: اعمل جو ممتع. الترفيه بينتج متعة، وده بيزوّد التحفيز: نكات، حكايات، تمثيل صامت، أغاني، عروض درامية، أفلام، مقاطع فيديو، وثائقيات.</div>", "n": 1, "i": 51, "a": "tefl-23-046", "x": "4672c5e4"}, {"t": "learn", "h": "<div class=\"u\">But some students are inhibited and may find such activities intimidating at first; avoid running students up to the front of the class to perform spontaneously.</div><div class=\"u\">بس بعض الطلبة خجولين وممكن يلاقوا الأنشطة دي مرعبة في الأول؛ تجنّب إنك تطلّع الطلبة قدام الفصل يأدّوا بشكل فوري.</div>", "n": 1, "i": 52, "a": "tefl-23-047", "x": "8054a98a"}, {"t": "learn", "h": "<div class=\"u\">Seven: personalise learning. Students are more interested in tasks that relate to themselves: their opinions, tastes, experiences, and suggestions.</div><div class=\"u\">سبعة: خصّص التعلم. الطلبة أكتر اهتمامًا بالمهام اللي ليها علاقة بيهم: آرائهم وأذواقهم وتجاربهم واقتراحاتهم.</div>", "n": 1, "i": 53, "a": "tefl-23-048", "x": "ea3ed305"}, {"t": "learn", "h": "<div class=\"u\">Example: a boys-only class mad on football needed no motivation when lessons were built around football.</div><div class=\"u\">مثال: فصل ولاد بس مهوسين بالكورة مكانش محتاج تحفيز لما الدروس اتبنت حوالين الكورة.</div>", "n": 1, "i": 54, "a": "tefl-23-049", "x": "debd543d"}, {"t": "learn", "h": "<div class=\"u\">For example: what are the 3 questions you would ask David Beckham if you met him? Or: draw your own football strip and explain the colours and the badge.</div><div class=\"u\">مثال: إيه التلات أسئلة اللي هتسألها لديفيد بيكهام لو قابلته؟ أو: ارسم تشيرت الكورة بتاعك واشرح الألوان والشعار.</div>", "n": 1, "i": 55, "a": "tefl-23-050", "x": "a3194367"}, {"t": "learn", "h": "<div class=\"u\">Eight: create open-ended exercises. A cue with many possible responses is more stimulating than one with a single right answer. For example: If I won 100,000 euros, I would...</div><div class=\"u\">تمانية: اعمل تمارين مفتوحة النهاية. المثير اللي ليه ردود ممكنة كتير أحسن من اللي ليه إجابة صح واحدة. مثال: لو كسبت ١٠٠,٠٠٠ يورو، كنت ه...</div>", "n": 1, "i": 56, "a": "tefl-23-051", "x": "e85a820d"}, {"t": "learn", "h": "<div class=\"u\">Nine: give students a sense of autonomy: let them pick debate topics from a list, or choose partners for an activity or game.</div><div class=\"u\">تسعة: ادّي الطلبة إحساس بالاستقلالية: سيبهم يختاروا مواضيع المناظرة من قايمة، أو يختاروا شركاء النشاط أو اللعبة.</div>", "n": 1, "i": 57, "a": "tefl-23-052", "x": "f9cf5225"}, {"t": "learn", "h": "<div class=\"u\">Ten: assess students. Regular, formal assessment is a very powerful motivator: learners who know they will be tested next week study more carefully.</div><div class=\"u\">عشرة: قيّم الطلبة. التقييم المنتظم الرسمي محفّز قوي جدًا: المتعلمين اللي عارفين إن عندهم اختبار الأسبوع الجاي بيذاكروا بعناية أكتر.</div>", "n": 1, "i": 58, "a": "tefl-23-053", "x": "8a4e0d56"}, {"t": "learn", "h": "<div class=\"u\">But assessment must not carry too much stress, must not be overused, and must not be given without purpose.</div><div class=\"u\">بس التقييم مالمفروضش يحمل توتر زيادة، ولا يتستخدم بإفراط، ولا يتعطى من غير هدف.</div>", "n": 1, "i": 59, "a": "tefl-23-054", "x": "c3fab164"}, {"t": "section", "h": "Unit 4 questions | أسئلة الوحدة ٤", "n": 1, "i": 60}, {"t": "learn", "h": "<div class=\"u\">Unit 4 questions. Question 1: Extrinsic motivation is the urge to engage in a learning activity for its own sake, for the enjoyment or accomplishment it evokes. True or false?</div><div class=\"u\">أسئلة الوحدة الرابعة. سؤال ١: التحفيز الخارجي هو الرغبة في الدخول في نشاط تعليمي لذاته، عشان المتعة أو الإنجاز. صح ولا غلط؟</div>", "n": 1, "i": 61, "a": "tefl-23-055", "x": "dbfa4433"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: false.</div><div class=\"u\">الإجابة الصح: غلط.</div>", "n": 1, "i": 62, "a": "tefl-23-056", "x": "2aada92c"}, {"t": "learn", "h": "<div class=\"u\">That definition describes intrinsic motivation; extrinsic comes from external incentives like qualifications or pay.</div><div class=\"u\">التعريف ده بيوصف التحفيز الداخلي؛ الخارجي بييجي من حوافز خارجية زي المؤهلات أو المرتب.</div>", "n": 1, "i": 63, "a": "tefl-23-057", "x": "36159aff"}, {"t": "learn", "h": "<div class=\"u\">Question 2: You do not need to be motivated to motivate your learners. True or false? Correct answer: false.</div><div class=\"u\">سؤال ٢: مش لازم تكون متحفّز عشان تحفّز متعلميك. صح ولا غلط؟ الإجابة الصح: غلط.</div>", "n": 1, "i": 64, "a": "tefl-23-058", "x": "07e713f7"}, {"t": "learn", "h": "<div class=\"u\">Question 3: The motivated person yesterday may not be the motivated person today. True or false? Correct answer: true.</div><div class=\"u\">سؤال ٣: الشخص المتحفّز إمبارح ممكن ميبقاش المتحفّز النهارده. صح ولا غلط؟ الإجابة الصح: صح.</div>", "n": 1, "i": 65, "a": "tefl-23-059", "x": "ec1041c9"}, {"t": "learn", "h": "<div class=\"u\">Question 4: Motivation is very strongly related to achievement in language learning. True or false? Correct answer: true.</div><div class=\"u\">سؤال ٤: التحفيز مرتبط بقوة جدًا بالتحصيل في تعلم اللغة. صح ولا غلط؟ الإجابة الصح: صح.</div>", "n": 1, "i": 66, "a": "tefl-23-060", "x": "32ab3f97"}, {"t": "learn", "h": "<div class=\"u\">Question 5: A motivated learner is discouraged by setbacks or apparent lack of progress. True or false? Correct answer: false.</div><div class=\"u\">سؤال ٥: المتعلم المتحفّز بيتحبط من الانتكاسات أو غياب التقدم الظاهري. صح ولا غلط؟ الإجابة الصح: غلط.</div>", "n": 1, "i": 67, "a": "tefl-23-061", "x": "59e6c0ca"}, {"t": "learn", "h": "<div class=\"u\">Question 6: Students are more likely to be interested in tasks that relate to themselves or their interests. True or false? Correct answer: true.</div><div class=\"u\">سؤال ٦: الطلبة أكتر احتمالًا يهتموا بمهام ليها علاقة بيهم أو باهتماماتهم. صح ولا غلط؟ الإجابة الصح: صح.</div>", "n": 1, "i": 68, "a": "tefl-23-062", "x": "c5e48891"}, {"t": "learn", "h": "<div class=\"u\">Question 7: Regular and formal assessment is not a very powerful motivator. True or false? Correct answer: false.</div><div class=\"u\">سؤال ٧: التقييم المنتظم الرسمي مش محفّز قوي جدًا. صح ولا غلط؟ الإجابة الصح: غلط.</div>", "n": 1, "i": 69, "a": "tefl-23-063", "x": "c0089725"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 70}, {"t": "learn", "h": "<div class=\"u\">Intrinsic motivation: the urge to learn for its own sake, enjoyment, or a feeling of accomplishment.</div><div class=\"u\">التحفيز الداخلي: الرغبة في التعلم لذاته، أو المتعة، أو إحساس الإنجاز.</div>", "n": 1, "i": 71, "a": "tefl-23-064", "x": "51019441"}, {"t": "learn", "h": "<div class=\"u\">Extrinsic motivation: drive from external rewards like a qualification, a proficiency score, or higher pay.</div><div class=\"u\">التحفيز الخارجي: دافع من مكافآت خارجية زي مؤهل أو درجة إتقان أو مرتب أعلى.</div>", "n": 1, "i": 72, "a": "tefl-23-065", "x": "15c80daf"}, {"t": "learn", "h": "<div class=\"u\">Multi-directional motivation: motivation flowing between teachers, learners, and colleagues, not only from teacher to class.</div><div class=\"u\">التحفيز متعدد الاتجاهات: تحفيز بيتحرك بين المدرسين والمتعلمين والزمايل، مش بس من المدرس للفصل.</div>", "n": 1, "i": 73, "a": "tefl-23-066", "x": "b2e7fe13"}, {"t": "learn", "h": "<div class=\"u\">Open-ended exercise: a task with many possible responses, not one right answer.</div><div class=\"u\">تمرين مفتوح النهاية: مهمة ليها ردود ممكنة كتير، مش إجابة صح واحدة.</div>", "n": 1, "i": 74, "a": "tefl-23-067", "x": "c32a42d4"}, {"t": "learn", "h": "<div class=\"u\">Personalised learning: tasks built from students' own opinions, tastes, and experiences.</div><div class=\"u\">التعلم المخصص: مهام مبنية من آراء وأذواق وتجارب الطلبة نفسهم.</div>", "n": 1, "i": 75, "a": "tefl-23-068", "x": "48bf8529"}, {"t": "learn", "h": "<div class=\"u\">Learner autonomy: letting students choose, for example debate topics or partners.</div><div class=\"u\">استقلالية المتعلم: إنك تسيب الطلبة يختاروا، مثال مواضيع المناظرة أو الشركاء.</div>", "n": 1, "i": 76, "a": "tefl-23-069", "x": "5a35ab02"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 77}, {"t": "learn", "h": "<div class=\"u\">Motivation makes learning and teaching easier, pleasanter, and more productive; it is strongly tied to achievement.</div><div class=\"u\">التحفيز بيخلّي التعلم والتدريس أسهل وأمتع وأكتر إنتاجية؛ ومرتبط بقوة بالتحصيل.</div>", "n": 1, "i": 78, "a": "tefl-23-070", "x": "58ee1775"}, {"t": "learn", "h": "<div class=\"u\">Two types: intrinsic (for its own sake) and extrinsic (external rewards). Learn why each student joined, and teach to that drive.</div><div class=\"u\">نوعين: داخلي (لذاته) وخارجي (مكافآت خارجية). اعرف ليه كل طالب دخل، ودرّس على الدافع ده.</div>", "n": 1, "i": 79, "a": "tefl-23-071", "x": "7cbc1baa"}, {"t": "learn", "h": "<div class=\"u\">Be motivated yourself, believe everyone can be motivated, keep motivation multi-directional, and remember it does not last.</div><div class=\"u\">كن متحفّز بنفسك، آمن إن أي حد ممكن يتحفّز، خلّي التحفيز متعدد الاتجاهات، وافتكر إنه مابيدومش.</div>", "n": 1, "i": 80, "a": "tefl-23-072", "x": "1bfaa347"}, {"t": "learn", "h": "<div class=\"u\">A motivated learner tackles challenges, is not discouraged by setbacks, and stays patient through confusion.</div><div class=\"u\">المتعلم المتحفّز بيواجه التحديات، ومابيتحبطش من الانتكاسات، وبيستحمل اللخبطة بصبر.</div>", "n": 1, "i": 81, "a": "tefl-23-073", "x": "0f360ba8"}, {"t": "learn", "h": "<div class=\"u\">Ten practical levers: show success, clear goals, explain purpose, variety, tension and challenge, fun, personalisation, open-ended tasks, autonomy, assessment.</div><div class=\"u\">عشر رافعات عملية: ورّي النجاح، أهداف واضحة، اشرح الغرض، تنويع، توتر وتحدي، متعة، تخصيص، مهام مفتوحة، استقلالية، تقييم.</div>", "n": 1, "i": 82, "a": "tefl-23-074", "x": "9f7fdcb5"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 83}, {"t": "mc", "q": "A learner who studies for the enjoyment of the activity itself is driven by:<br>المتعلم اللي بيذاكر عشان متعة النشاط نفسه مندفع بـ:", "opts": ["intrinsic motivation | تحفيز داخلي", "extrinsic motivation | تحفيز خارجي", "a qualification | مؤهل"], "ans": 0, "why": "For its own sake, enjoyment, or accomplishment = intrinsic. External incentives = extrinsic. | لذاته أو المتعة أو الإنجاز = داخلي. الحوافز الخارجية = خارجي.", "ex": ["Correct. | صح.", "No. External rewards are extrinsic. | غلط: المكافآت الخارجية خارجي.", "No. A qualification is an external incentive. | غلط: المؤهل حافز خارجي."], "n": 1, "i": 84, "h": ""}, {"t": "mc", "q": "Which is an example of extrinsic motivation?<br>أنهي دي مثال على التحفيز الخارجي؟", "opts": ["wanting a high proficiency score to enter an English-speaking university | عايز درجة إتقان عالية عشان تدخل جامعة إنجليزية", "enjoying the learning activity itself | الاستمتاع بنشاط التعلم نفسه", "the feeling of accomplishment | إحساس الإنجاز"], "ans": 0, "why": "University entry, qualifications, and higher pay are external incentives. | دخول الجامعة والمؤهلات والمرتب الأعلى حوافز خارجية.", "ex": ["Correct. | صح.", "No. Enjoyment for its own sake is intrinsic. | غلط: المتعة لذاتها داخلي.", "No. Feelings of accomplishment are intrinsic. | غلط: إحساس الإنجاز داخلي."], "n": 1, "i": 85, "h": ""}, {"t": "tf", "q": "The motivated person yesterday may not be the motivated person today.<br>الشخص المتحفّز إمبارح ممكن ميبقاش المتحفّز النهارده.", "ans": true, "why": "True. The whole person comes to school with personal baggage; motivation does not last. | صح. الشخص كله بييجي المدرسة بحمولته الشخصية؛ التحفيز مابيدومش.", "ex": ["Correct. | صح.", "Wrong. Motivation fluctuates with personal circumstances. | غلط: التحفيز بيتقلب مع الظروف الشخصية."], "n": 1, "i": 86, "h": ""}, {"t": "tf", "q": "Regular and formal assessment is not a powerful motivator.<br>التقييم المنتظم الرسمي مش محفّز قوي.", "ans": false, "why": "False. It is a very powerful motivator, provided it is not overused or given without purpose. | غلط. هو محفّز قوي جدًا، بشرط ميتستخدمش بإفراط أو من غير هدف.", "ex": ["Wrong. Assessment strongly motivates careful study. | غلط: التقييم بيحفّز المذاكرة بعناية بقوة.", "Correct. | صح."], "n": 1, "i": 87, "h": ""}, {"t": "mc", "q": "Which is NOT one of the motivated learner's characteristics?<br>أنهي دي مش من صفات المتعلم المتحفّز؟", "opts": ["discouraged by setbacks or apparent lack of progress | بيتحبط من الانتكاسات أو غياب التقدم الظاهري", "confident in success when tackling challenges | واثق في النجاح عند مواجهة التحديات", "patient with temporary confusion | صبور مع اللخبطة المؤقتة"], "ans": 0, "why": "A motivated learner consistently invests high effort and is not discouraged by setbacks. | المتعلم المتحفّز بيستثمر مجهود عالي باستمرار ومابيتحبطش من الانتكاسات.", "ex": ["Correct. | صح.", "No. Confidence in success is characteristic one. | غلط: الثقة في النجاح هي الصفة الأولى.", "No. Patience with confusion is characteristic seven. | غلط: الصبر مع اللخبطة هو الصفة السابعة."], "n": 1, "i": 88, "h": ""}, {"t": "mc", "q": "Why tell adult learners the purpose of a guessing game before starting?<br>ليه تقول للمتعلمين الكبار هدف لعبة التخمين قبل ما تبدأ؟", "opts": ["so they accept the fun element instead of getting annoyed | عشان يتقبلوا عنصر المتعة بدل ما يتضايقوا", "because adults cannot play games | لأن الكبار مابيقدروش يلعبوا", "to skip the instructions | عشان نتخطى التعليمات"], "ans": 0, "why": "Adults may get annoyed by too many fun activities; knowing the objective makes them more accepting. | الكبار ممكن يتضايقوا من الأنشطة الممتعة الكتير؛ معرفة الهدف بتخلّيهم أكتر تقبلًا.", "ex": ["Correct. | صح.", "No. Adults can play; they need the purpose. | غلط: الكبار يقدروا يلعبوا؛ محتاجين الهدف.", "No. Instructions still matter. | غلط: التعليمات لسه مهمة."], "n": 1, "i": 89, "h": ""}, {"t": "tf", "q": "You need to be motivated yourself before you can motivate your learners.<br>لازم تكون متحفّز بنفسك قبل ما تقدر تحفّز متعلميك.", "ans": true, "why": "True. If you cannot overcome a lacklustre feeling, your students will quickly become deflated. | صح. لو ماعرفتش تتغلب على الفتور، طلبتك هيبهدلوا بسرعة.", "ex": ["Correct. | صح.", "Wrong. Your motivation is the first key element. | غلط: تحفيزك هو أول عنصر أساسي."], "n": 1, "i": 90, "h": ""}, {"t": "mc", "q": "Which activity creates open-ended responses?<br>أنهي نشاط بينتج ردود مفتوحة النهاية؟", "opts": ["If I won 100,000 euros, I would... | لو كسبت ١٠٠,٠٠٠ يورو، كنت ه...", "a gap-fill with one correct answer | ملء فراغات بإجابة صح واحدة", "matching sentence halves | توصيل أنصاف الجمل"], "ans": 0, "why": "A cue with many possible responses is more stimulating than one with a single right answer. | المثير اللي ليه ردود كتير أكتر تحفيزًا من اللي ليه إجابة صح واحدة.", "ex": ["Correct. | صح.", "No. A single right answer makes it closed. | غلط: الإجابة الصح الواحدة بتخلّيه مغلق.", "No. Matching has fixed answers. | غلط: التوصيل ليه إجابات ثابتة."], "n": 1, "i": 91, "h": ""}, {"t": "mc", "q": "What should you avoid with inhibited students during fun activities?<br>إيه اللي المفروض تتجنبه مع الطلبة الخجولين أثناء الأنشطة الممتعة؟", "opts": ["running them up to the front to perform spontaneously | إنك تطلّعهم قدام الفصل يأدّوا بشكل فوري", "using video clips | استخدام مقاطع الفيديو", "telling jokes | قول النكات"], "ans": 0, "why": "Some students find spontaneous front-of-class performance intimidating. | بعض الطلبة بيخافوا من الأداء الفوري قدام الفصل.", "ex": ["Correct. | صح.", "No. Recorded entertainment is safe to use. | غلط: الترفيه المسجل استخدامه أمن.", "No. Jokes are teacher-produced fun, fine to use. | غلط: النكات ترفيه من المدرس، استخدامها عادي."], "n": 1, "i": 92, "h": ""}, {"t": "mc", "q": "If a student's motivation drops and you cannot find the reason, you should:<br>لو تحفيز طالب هبط ومش قادر تلاقي السبب، المفروض:", "opts": ["chat with him privately for a few minutes after class | تتكلم معاه على انفراد دقايق بعد الحصة", "ignore it; motivation fixes itself | تتجاهله؛ التحفيز بيصلّح نفسه", "announce it to the whole class | تعلنه قدام الفصل كله"], "ans": 0, "why": "A short private chat, away from classmates, is amazingly helpful for tracing the reason. | الكلام الخاص القصير، بعيد عن الزمايل، مفيد بشكل مدهش في تتبع السبب.", "ex": ["Correct. | صح.", "No. Motivation does not last; it needs active work. | غلط: التحفيز مابيدومش؛ محتاج شغل نشط.", "No. Privacy matters; away from classmates. | غلط: الخصوصية مهمة؛ بعيد عن الزمايل."], "n": 1, "i": 93, "h": ""}, {"t": "recall", "q": "Name five of the ten practical ways to influence motivation.<br>اذكر خمسة من الطرق العشرة العملية للتأثير على التحفيز.", "a": "Make them aware of success; set clear objectives; explain purpose and usefulness; vary topics and tasks; generate tension and challenge; fun atmosphere; personalise; open-ended exercises; autonomy; assess students.<br>خلّيهم واعيين بالنجاح؛ أهداف واضحة؛ اشرح الغرض والفايدة؛ نوّع المواضيع والمهام؛ ولّد توتر وتحدي؛ جو ممتع؛ خصّص؛ تمارين مفتوحة؛ استقلالية؛ قيّم الطلبة.", "n": 1, "i": 94, "h": ""}, {"t": "recall", "q": "What are the two types of motivation, with one example of each?<br>إيه نوعين التحفيز، مع مثال لكل واحد؟", "a": "Intrinsic: learning for its own sake, like enjoying the activity. Extrinsic: external reward, like a qualification or higher pay.<br>داخلي: التعلم لذاته، زي الاستمتاع بالنشاط. خارجي: مكافأة خارجية، زي مؤهل أو مرتب أعلى.", "n": 1, "i": 95, "h": ""}, {"t": "write", "q": "Explain why motivation does not last and what a teacher should do about it (3-4 sentences).<br>اشرح ليه التحفيز مابيدومش وإيه اللي المدرس المفروض يعمله (٣-٤ جمل).", "key": "tefl-23:1", "a": "The whole person comes to school with personal baggage, so yesterday's motivated learner can be flat today. Motivation is therefore not a one-time achievement but continuous work. The teacher must keep at it all the time, digging into reserves when students or colleagues feel down. Motivating others is strenuous, but it is also rewarding, and empathy is the tool that keeps it alive.<br>الشخص كله بييجي المدرسة بحمولته الشخصية، فالمتعلم المتحفّز إمبارح ممكن يبقى فاضي النهارده. فالتحفيز مش إنجاز بيحصل مرة واحدة لكنه شغل مستمر. المدرس لازم يفضل شغال عليه طول الوقت، بيستدعي مخزونه لما الطلبة أو الزمايل يحسوا بإحباط. تحفيز الآخرين مجهود مرهق، بس كمان مجزي، والتعاطف هو الأداة اللي بتخلّيه عايش.", "n": 1, "i": 96, "h": ""}, {"t": "write", "q": "Describe how personalising learning motivates students, with an example (3-4 sentences).<br>اشرح إزاي تخصيص التعلم بيحفّز الطلبة، بمثال (٣-٤ جمل).", "key": "tefl-23:2", "a": "Students are more interested in tasks that relate to themselves and their lives. Using their own opinions, tastes, and experiences as material connects the language to what they already care about. A boys-only class obsessed with football needed no motivation when lessons asked what three questions they would ask David Beckham, or asked them to design a football strip and explain its colours. The topic carried the motivation, so the teacher could focus on the language.<br>الطلبة أكتر اهتمامًا بالمهام اللي ليها علاقة بيهم وبحياتهم. استخدام آرائهم وأذواقهم وتجاربهم كمادة بيربط اللغة باللي مهتمين بيه أصلًا. فصل ولاد بس مهوسين بالكورة مكانش محتاج تحفيز لما الدروس سألتهم إيه التلات أسئلة اللي هيسألوها لديفيد بيكهام، أو طلبت منهم يصمّموا تشيرت كورة ويشرحوا ألوانه. الموضوع حمل التحفيز، فالمدرس قدر يركّز على اللغة.", "n": 1, "i": 97, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Module 3 is complete. Next lesson: Module 4, Lesson Planning Plus, starting with lesson aims.</div><div class=\"u\">الموديول التالت خلص. الدرس الجاي: الموديول الرابع، تخطيط الدروس بلس، هنبدأ بأهداف الدرس.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 98}];</script>
