<script>window.LESSON_ID="tefl-17";window.STEPS=[{"t": "section", "h": "Why keep the full table | ليه تحتفظ بالجدول الكامل", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">You already have a good grasp of tenses. Now go deeper with the FULL tense table, and always keep it by your side.</div><div class=\"u\">إنت عندك أصلًا فهم كويس للأزمنة. دلوقتي تعمّق أكتر بجدول الأزمنة الكامل، وخلّيه جنبك دايمًا.</div>", "n": 1, "i": 1, "a": "tefl-17-001", "x": "72df1040"}, {"t": "learn", "h": "<div class=\"u\">Why keep it? Sometimes a student asks a question and your mind goes blank for a moment. It happens to everyone.</div><div class=\"u\">ليه تخليه جنبك؟ أحيانًا طالب يسألك سؤال ودماغك بتيجي عليك لحظة. بيحصل لكل الناس.</div>", "n": 1, "i": 2, "a": "tefl-17-002", "x": "19fda8a8"}, {"t": "learn", "h": "<div class=\"u\">The table covers the 3 main verb structures for each tense. Positive: You like Edinburgh. Question: Do you like Edinburgh? Negative: You do not like Edinburgh.</div><div class=\"u\">الجدول بيغطي التراكيب التلاتة الأساسية لكل زمن. المثبت: You like Edinburgh. السؤال: Do you like Edinburgh? المنفي: You do not like Edinburgh.</div>", "n": 1, "i": 3, "a": "tefl-17-003", "x": "f2c106d9"}, {"t": "learn", "h": "<div class=\"u\">An advanced student may ask: what is the difference between the two future continuous forms, will be and going to? The table keeps you right.</div><div class=\"u\">طالب متقدم ممكن يسألك: إيه الفرق بين صيغتي المستقبل المستمر will be وgoing to؟ الجدول هيظبطك.</div>", "n": 1, "i": 4, "a": "tefl-17-004", "x": "a4f5cb6f"}, {"t": "learn", "h": "<div class=\"u\">For the record: there is little difference between those two forms. You can also copy a table page for one tense and hand it to your class.</div><div class=\"u\">للعلم: الفرق بين الصيغتين دول بسيط جدًا. وتقدر كمان تاخد صفحة الجدول لزمن واحد وتديهال لكلاسك.</div>", "n": 1, "i": 5, "a": "tefl-17-005", "x": "7eac3b5d"}, {"t": "learn", "h": "<div class=\"u\">The twelve tenses: three simple, three perfect, and six continuous, also called progressive.</div><div class=\"u\">الأزمنة الاتناشر: تلاتة بسيطة، وتلاتة تامة، وستة مستمرة، واسمها كمان progressive.</div>", "n": 1, "i": 6, "a": "tefl-17-006", "x": "dabb7740"}, {"t": "learn", "h": "<div class=\"u\">Simple tenses show whether an action happens, happened, or will happen. Perfect tenses relate it to a time point. Continuous tenses show it in progress.</div><div class=\"u\">البسيطة بتوضح لو الفعل بيحصل أو حصل أو هيحصل. التامة بتربطه بنقطة زمنية. المستمرة بتوضحه وهو شغال.</div>", "n": 1, "i": 7, "a": "tefl-17-007", "x": "c3bd8805"}, {"t": "section", "h": "The simple tenses 1-3 | الأزمنة البسيطة ١-٣", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">Tense 1, present simple: verb stem, adding -s for he, she, it. I like, you like, he likes, we like, they like.</div><div class=\"u\">الزمن الأول، المضارع البسيط: جذع الفعل، وبنضيف s لـhe وshe وit. I like وyou like وhe likes وwe like وthey like.</div>", "n": 1, "i": 9, "a": "tefl-17-008", "x": "078695b2"}, {"t": "learn", "h": "<div class=\"u\">Positive: You like Edinburgh. Question: Do you like Edinburgh? Negative: You do not like Edinburgh.</div><div class=\"u\">المثبت: You like Edinburgh. السؤال: Do you like Edinburgh? المنفي: You do not like Edinburgh.</div>", "n": 1, "i": 10, "a": "tefl-17-009", "x": "10d15d69"}, {"t": "learn", "h": "<div class=\"u\">Tense 2, past simple: verb stem plus -ed, or just -d if the stem ends in e: requested, liked.</div><div class=\"u\">الزمن التاني، الماضي البسيط: جذع الفعل زائد ed، أو d بس لو الجذع بينتهي بـe: requested وliked.</div>", "n": 1, "i": 11, "a": "tefl-17-010", "x": "a8416c5d"}, {"t": "learn", "h": "<div class=\"u\">Positive: You played tennis. Question: Did you play tennis? Negative: You did not play tennis.</div><div class=\"u\">المثبت: You played tennis. السؤال: Did you play tennis? المنفي: You did not play tennis.</div>", "n": 1, "i": 12, "a": "tefl-17-011", "x": "8fd6792c"}, {"t": "learn", "h": "<div class=\"u\">Irregular verbs have their own past forms: become became, blow blew, catch caught. These just have to be learned.</div><div class=\"u\">الأفعال الشاذة ليها صيغ ماضي خاصة: become بقت became، وblow بقت blew، وcatch بقت caught. دي لازم تتحفظ زي ما هي.</div>", "n": 1, "i": 13, "a": "tefl-17-012", "x": "6eb18e50"}, {"t": "learn", "h": "<div class=\"u\">The verb be has its own past: was and were. Positive: I was annoyed. Question: Were you annoyed? Negative: I was not annoyed.</div><div class=\"u\">الفعل be ليه ماضي خاص: was وwere. المثبت: I was annoyed. السؤال: Were you annoyed? المنفي: I was not annoyed.</div>", "n": 1, "i": 14, "a": "tefl-17-013", "x": "6d5f7277"}, {"t": "learn", "h": "<div class=\"u\">Tense 3, future simple, form 1: will or shall plus the verb stem. We often contract: I will becomes I'll, we shall not becomes we shan't.</div><div class=\"u\">الزمن التالت، المستقبل البسيط، الصيغة الأولى: will أو shall زائد جذع الفعل. وبنختصر كتير: I will تبقى I'll، وwe shall not تبقى we shan't.</div>", "n": 1, "i": 15, "a": "tefl-17-014", "x": "45b1629a"}, {"t": "learn", "h": "<div class=\"u\">Shall is much more common in British English than in American English.</div><div class=\"u\">shall منتشرة أكتر بكتير في الإنجليزية البريطانية عن الأمريكية.</div>", "n": 1, "i": 16, "a": "tefl-17-015", "x": "c08afd13"}, {"t": "learn", "h": "<div class=\"u\">Positive: You will see her on Sunday. Question: Will you see her on Sunday? Negative: You will not see her on Sunday.</div><div class=\"u\">المثبت: You will see her on Sunday. السؤال: Will you see her on Sunday? المنفي: You will not see her on Sunday.</div>", "n": 1, "i": 17, "a": "tefl-17-016", "x": "d7b9b286"}, {"t": "learn", "h": "<div class=\"u\">Form 2, the going to future: be + going to + verb stem. I am going to object. You are going to object.</div><div class=\"u\">الصيغة التانية، مستقبل going to: be زائد going to زائد جذع الفعل. I am going to object. وYou are going to object.</div>", "n": 1, "i": 18, "a": "tefl-17-017", "x": "b81727db"}, {"t": "learn", "h": "<div class=\"u\">Positive: You are going to see the show tonight. Question: Are you going to see the show tonight? Negative: You are not going to see the show tonight.</div><div class=\"u\">المثبت: You are going to see the show tonight. السؤال: Are you going to see the show tonight? المنفي: You are not going to see the show tonight.</div>", "n": 1, "i": 19, "a": "tefl-17-018", "x": "dcb8ea6f"}, {"t": "section", "h": "The perfect tenses 4-6 | الأزمنة التامة ٤-٦", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Tense 4, present perfect: have or has plus the past participle. I have washed the dishes. He has washed the dishes.</div><div class=\"u\">الزمن الرابع، المضارع التام: have أو has زائد التصريف التالت. I have washed the dishes. وHe has washed the dishes.</div>", "n": 1, "i": 21, "a": "tefl-17-019", "x": "22449f8d"}, {"t": "learn", "h": "<div class=\"u\">We often contract have: I have becomes I've. Positive: You have visited the Prado Museum before. Question: Have you visited? Negative: You have not visited.</div><div class=\"u\">بنختصر have كتير: I have تبقى I've. المثبت: You have visited the Prado Museum before. السؤال: Have you visited? المنفي: You have not visited.</div>", "n": 1, "i": 22, "a": "tefl-17-020", "x": "1ca782d9"}, {"t": "learn", "h": "<div class=\"u\">Tense 5, past perfect: had plus the past participle, for every subject. I had failed again! They had failed again!</div><div class=\"u\">الزمن الخامس، الماضي التام: had زائد التصريف التالت، مع كل الفاعلين. I had failed again! وThey had failed again!</div>", "n": 1, "i": 23, "a": "tefl-17-021", "x": "6d0a4b2e"}, {"t": "learn", "h": "<div class=\"u\">Contraction: had not becomes hadn't. Positive: You had studied Spanish before you went to Madrid. Question: Had you studied? Negative: You had not studied.</div><div class=\"u\">الاختصار: had not بتبقى hadn't. المثبت: You had studied Spanish before you went to Madrid. السؤال: Had you studied? المنفي: You had not studied.</div>", "n": 1, "i": 24, "a": "tefl-17-022", "x": "0be1b520"}, {"t": "learn", "h": "<div class=\"u\">Tense 6, future perfect: will have plus the past participle. I will have finished my work by 7pm.</div><div class=\"u\">الزمن السادس، المستقبل التام: will have زائد التصريف التالت. I will have finished my work by 7pm.</div>", "n": 1, "i": 25, "a": "tefl-17-023", "x": "ed557359"}, {"t": "learn", "h": "<div class=\"u\">Positive: Dad will have cooked dinner by the time we get back. Question: Will Dad have cooked dinner? Negative: Dad will not have cooked dinner.</div><div class=\"u\">المثبت: Dad will have cooked dinner by the time we get back. السؤال: Will Dad have cooked dinner? المنفي: Dad will not have cooked dinner.</div>", "n": 1, "i": 26, "a": "tefl-17-024", "x": "d6ed8ea8"}, {"t": "learn", "h": "<div class=\"u\">The going to version also works: Dad is going to have cooked dinner. Either form can usually be used.</div><div class=\"u\">وفي نسخة بـgoing to كمان: Dad is going to have cooked dinner. والصيغتين عادة بينفعوا.</div>", "n": 1, "i": 27, "a": "tefl-17-025", "x": "3cd7d442"}, {"t": "section", "h": "The continuous tenses 7-9 | الأزمنة المستمرة ٧-٩", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Tense 7, present continuous: am/is/are plus the present participle, the verb-ing form. I am drinking Coke. She is drinking Coke.</div><div class=\"u\">الزمن السابع، المضارع المستمر: am/is/are زائد التصريف المستمر، يعني الفعل-ing. I am drinking Coke. وShe is drinking Coke.</div>", "n": 1, "i": 29, "a": "tefl-17-026", "x": "01e67fcf"}, {"t": "learn", "h": "<div class=\"u\">Positive: You are watching TV. Question: Are you watching TV? Negative: You are not watching TV.</div><div class=\"u\">المثبت: You are watching TV. السؤال: Are you watching TV? المنفي: You are not watching TV.</div>", "n": 1, "i": 30, "a": "tefl-17-027", "x": "12cc84ca"}, {"t": "learn", "h": "<div class=\"u\">Tense 8, past continuous: was or were plus the present participle. I was drinking Coke. They were drinking Coke.</div><div class=\"u\">الزمن التامن، الماضي المستمر: was أو were زائد التصريف المستمر. I was drinking Coke. وThey were drinking Coke.</div>", "n": 1, "i": 31, "a": "tefl-17-028", "x": "6a5e3bda"}, {"t": "learn", "h": "<div class=\"u\">Positive: You were sleeping when she phoned. Question: Were you sleeping when she phoned? Negative: You were not sleeping when she phoned.</div><div class=\"u\">المثبت: You were sleeping when she phoned. السؤال: Were you sleeping when she phoned? المنفي: You were not sleeping when she phoned.</div>", "n": 1, "i": 32, "a": "tefl-17-029", "x": "171faf37"}, {"t": "learn", "h": "<div class=\"u\">Tense 9, future continuous, form 1: will be plus the present participle. I will be dining late.</div><div class=\"u\">الزمن التاسع، المستقبل المستمر، الصيغة الأولى: will be زائد التصريف المستمر. I will be dining late.</div>", "n": 1, "i": 33, "a": "tefl-17-030", "x": "ed910c1e"}, {"t": "learn", "h": "<div class=\"u\">Positive: You will be cooking dinner when they arrive. Question: Will you be cooking dinner when they arrive? Negative: You will not be cooking dinner.</div><div class=\"u\">المثبت: You will be cooking dinner when they arrive. السؤال: Will you be cooking dinner when they arrive? المنفي: You will not be cooking dinner.</div>", "n": 1, "i": 34, "a": "tefl-17-031", "x": "71113132"}, {"t": "learn", "h": "<div class=\"u\">Form 2: am/is/are + going to be + present participle. I am going to be jogging to work.</div><div class=\"u\">الصيغة التانية: am/is/are زائد going to be زائد التصريف المستمر. I am going to be jogging to work.</div>", "n": 1, "i": 35, "a": "tefl-17-032", "x": "e2e73adf"}, {"t": "learn", "h": "<div class=\"u\">Remember: you can use will be or be going to for the future continuous. There is not much difference.</div><div class=\"u\">افتكر: تقدر تستخدم will be أو be going to للمستقبل المستمر. الفرق بينهم بسيط جدًا.</div>", "n": 1, "i": 36, "a": "tefl-17-033", "x": "84a0ac08"}, {"t": "section", "h": "The perfect continuous tenses 10-12 | التامة المستمرة ١٠-١٢", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">Tense 10, present perfect continuous: have/has been plus the present participle. I have been serving customers for nine hours.</div><div class=\"u\">الزمن العاشر، المضارع التام المستمر: have/has been زائد التصريف المستمر. I have been serving customers for nine hours.</div>", "n": 1, "i": 38, "a": "tefl-17-034", "x": "f6e5b414"}, {"t": "learn", "h": "<div class=\"u\">Positive: You have been standing here for two hours. Question: Have you been standing here for two hours? Negative: You have not been standing here.</div><div class=\"u\">المثبت: You have been standing here for two hours. السؤال: Have you been standing here for two hours? المنفي: You have not been standing here.</div>", "n": 1, "i": 39, "a": "tefl-17-035", "x": "69129f51"}, {"t": "learn", "h": "<div class=\"u\">Tense 11, past perfect continuous: had been plus the present participle. I had been waiting for four hours.</div><div class=\"u\">الزمن الحداشر، الماضي التام المستمر: had been زائد التصريف المستمر. I had been waiting for four hours.</div>", "n": 1, "i": 40, "a": "tefl-17-036", "x": "81761f56"}, {"t": "learn", "h": "<div class=\"u\">Positive: You had been sitting there for more than two hours when she finally arrived. Question: Had you been sitting there? Negative: You had not been sitting there.</div><div class=\"u\">المثبت: You had been sitting there for more than two hours when she finally arrived. السؤال: Had you been sitting there? المنفي: You had not been sitting there.</div>", "n": 1, "i": 41, "a": "tefl-17-037", "x": "6ef1fbe5"}, {"t": "learn", "h": "<div class=\"u\">Tense 12, future perfect continuous: will have been plus the present participle. I will have been studying for three hours.</div><div class=\"u\">الزمن الاتناشر، المستقبل التام المستمر: will have been زائد التصريف المستمر. I will have been studying for three hours.</div>", "n": 1, "i": 42, "a": "tefl-17-038", "x": "7d020a02"}, {"t": "learn", "h": "<div class=\"u\">Positive: You will have been waiting here for two hours. Question: Will you have been waiting here? Negative: You will not have been waiting here.</div><div class=\"u\">المثبت: You will have been waiting here for two hours. السؤال: Will you have been waiting here? المنفي: You will not have been waiting here.</div>", "n": 1, "i": 43, "a": "tefl-17-039", "x": "93b5db25"}, {"t": "learn", "h": "<div class=\"u\">Another form exists: am/is/are + going to have been + present participle, but it is used much less. Either form works with little or no difference.</div><div class=\"u\">في صيغة تانية: am/is/are زائد going to have been زائد التصريف المستمر، بس استخدامها أقل بكتير. والصيغتين بينفعوا بفرق بسيط أو معدوم.</div>", "n": 1, "i": 44, "a": "tefl-17-040", "x": "1bf9c211"}, {"t": "section", "h": "Unit 4 questions answered | أسئلة الوحدة الرابعة متجاوبة", "n": 1, "i": 45}, {"t": "learn", "h": "<div class=\"u\">The unit's own questions, answered. A finished past action with a specific time takes the past simple.</div><div class=\"u\">أسئلة الوحدة نفسها، متجاوبة. الفعل الماضي اللي خلص في وقت محدد بياخد الماضي البسيط.</div>", "n": 1, "i": 46, "a": "tefl-17-041", "x": "8b660d67"}, {"t": "learn", "h": "<div class=\"u\">Can we use non-action verbs like know, like, be in a continuous tense? No.</div><div class=\"u\">نقدر نستخدم أفعال الحالة زي know وlike وbe في زمن مستمر؟ لأ.</div>", "n": 1, "i": 47, "a": "tefl-17-042", "x": "702b7c10"}, {"t": "learn", "h": "<div class=\"u\">The past perfect continuous is formed with had + been + verb-ing.</div><div class=\"u\">الماضي التام المستمر بيتكوّن من had زائد been زائد الفعل-ing.</div>", "n": 1, "i": 48, "a": "tefl-17-043", "x": "d1b5b13f"}, {"t": "learn", "h": "<div class=\"u\">For future plans without a specific time, we use going to plus the infinitive.</div><div class=\"u\">للخطط المستقبلية من غير وقت محدد، بنستخدم going to زائد المصدر.</div>", "n": 1, "i": 49, "a": "tefl-17-044", "x": "de931c5e"}, {"t": "learn", "h": "<div class=\"u\">You scored goals is past simple: True. Are you going to watch the game tonight is future simple (the going to form): True.</div><div class=\"u\">You scored goals ماضي بسيط: صح. Are you going to watch the game tonight مستقبل بسيط (بصيغة going to): صح.</div>", "n": 1, "i": 50, "a": "tefl-17-045", "x": "272e8e5d"}, {"t": "learn", "h": "<div class=\"u\">You had not eaten paella before you went to Spain is past perfect, not present perfect: the present perfect claim is False.</div><div class=\"u\">You had not eaten paella before you went to Spain ماضي تام مش مضارع تام: فالادعاء إنها مضارع تام غلط.</div>", "n": 1, "i": 51, "a": "tefl-17-046", "x": "bfb7dd37"}, {"t": "learn", "h": "<div class=\"u\">The match will have finished by the time we get back is future perfect: True.</div><div class=\"u\">The match will have finished by the time we get back مستقبل تام: صح.</div>", "n": 1, "i": 52, "a": "tefl-17-047", "x": "f6adcf82"}, {"t": "learn", "h": "<div class=\"u\">You were not driving when she phoned is past continuous, not present continuous: the claim is False.</div><div class=\"u\">You were not driving when she phoned ماضي مستمر مش مضارع مستمر: فالادعاء غلط.</div>", "n": 1, "i": 53, "a": "tefl-17-048", "x": "7046c7db"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 54}, {"t": "learn", "h": "<div class=\"u\">Verb stem: the base form of the verb with no endings, like play, request, close.</div><div class=\"u\">جذع الفعل (verb stem): الصيغة الأساسية من غير أي إضافات، زي play وrequest وclose.</div>", "n": 1, "i": 55, "a": "tefl-17-049", "x": "6b3daeb4"}, {"t": "learn", "h": "<div class=\"u\">Third person singular: he, she, it. In the present simple the verb takes -s: he likes.</div><div class=\"u\">الغائب المفرد (third person singular): he وshe وit. في المضارع البسيط الفعل بياخد s: he likes.</div>", "n": 1, "i": 56, "a": "tefl-17-050", "x": "cbe93882"}, {"t": "learn", "h": "<div class=\"u\">Regular verb: forms its past with -ed, like requested, played.</div><div class=\"u\">الفعل المنتظم: بيكوّن ماضيه بـed، زي requested وplayed.</div>", "n": 1, "i": 57, "a": "tefl-17-051", "x": "1b367447"}, {"t": "learn", "h": "<div class=\"u\">Irregular verb: has its own past form to memorize, like catch caught.</div><div class=\"u\">الفعل الشاذ: ليه صيغة ماضي خاصة بتتحفظ، زي catch caught.</div>", "n": 1, "i": 58, "a": "tefl-17-052", "x": "aa4343c1"}, {"t": "learn", "h": "<div class=\"u\">Contraction: a shortened form, like I'll, I've, hadn't, shan't.</div><div class=\"u\">الاختصار (contraction): صيغة مختصرة، زي I'll وI've وhadn't وshan't.</div>", "n": 1, "i": 59, "a": "tefl-17-053", "x": "ca4e7ef2"}, {"t": "learn", "h": "<div class=\"u\">Progressive: another name for the continuous tenses.</div><div class=\"u\">progressive: اسم تاني للأزمنة المستمرة.</div>", "n": 1, "i": 60, "a": "tefl-17-054", "x": "b58b1538"}, {"t": "learn", "h": "<div class=\"u\">Shall: like will for the future, much more common in British English.</div><div class=\"u\">shall: زي will للمستقبل، منتشرة أكتر بكتير في البريطانية.</div>", "n": 1, "i": 61, "a": "tefl-17-055", "x": "56ff43ae"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Twelve tenses: three simple, three perfect, six continuous. Simple says if it happens; continuous says it is in progress; perfect links two times.</div><div class=\"u\">اتناشر زمن: تلاتة بسيطة، تلاتة تامة، ستة مستمرة. البسيط بيقول لو بيحصل؛ المستمر بيقول شغال؛ التام بيربط وقتين.</div>", "n": 1, "i": 63, "a": "tefl-17-056", "x": "e0156323"}, {"t": "learn", "h": "<div class=\"u\">Build each tense from the same bricks: verb stem or past form, have plus past participle, be plus verb-ing, will, and had.</div><div class=\"u\">ابني أي زمن من نفس الطوب: جذع الفعل أو صيغة الماضي، have زائد التصريف التالت، be زائد الفعل-ing، will، وhad.</div>", "n": 1, "i": 64, "a": "tefl-17-057", "x": "42292a0a"}, {"t": "learn", "h": "<div class=\"u\">For every tense, learn the three structures: positive, question, negative. The table gives all three.</div><div class=\"u\">لكل زمن، احفظ التراكيب التلاتة: مثبت وسؤال ومنفي. الجدول بيديك التلاتة.</div>", "n": 1, "i": 65, "a": "tefl-17-058", "x": "a267e71f"}, {"t": "learn", "h": "<div class=\"u\">Will be and be going to both make the future continuous, with little difference. The same goes for the going to versions of the perfect forms.</div><div class=\"u\">will be وbe going to بيعملوا المستقبل المستمر بفرق بسيط. ونفس الكلام لنسخ going to من الصيغ التامة.</div>", "n": 1, "i": 66, "a": "tefl-17-059", "x": "bd27a6b2"}, {"t": "learn", "h": "<div class=\"u\">Keep the full table by your side, and copy single-tense pages for your class when you teach one tense.</div><div class=\"u\">خلّي الجدول الكامل جنبك، وانسخ صفحات الأزمنة المنفردة لكلاسك لما تدرّس زمن واحد.</div>", "n": 1, "i": 67, "a": "tefl-17-060", "x": "fcf46319"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 68}, {"t": "mc", "q": "In the present simple, what changes for he, she, it?<br>في المضارع البسيط، إيه اللي بيتغير مع he وshe وit؟", "opts": ["the verb adds -s | الفعل بياخد s", "the verb adds -ed | الفعل بياخد ed", "nothing changes | مفيش تغيير"], "ans": 0, "why": "I like, you like, but he likes. Third person singular takes -s. | I like وyou like، لكن he likes. الغائب المفرد بياخد s.", "ex": ["Correct. | صح.", "No. -ed is the past simple ending. | غلط: ed إضافة الماضي البسيط.", "No. He like is wrong English. | غلط: he like إنجليزية غلط."], "n": 1, "i": 69, "h": ""}, {"t": "mc", "q": "Catch in the past simple is:<br>catch في الماضي البسيط هي:", "opts": ["caught | caught", "catched | catched", "catch | catch"], "ans": 0, "why": "Catch is irregular: catch, caught. Irregular forms just have to be learned. | catch فعل شاذ: catch وcaught. الصيغ الشاذة بتتحفظ زي ما هي.", "ex": ["Correct. | صح.", "No. Catched is not a word; catch is irregular. | غلط: catched مش كلمة؛ catch شاذ.", "No. That is the stem, not the past. | غلط: ده الجذع مش الماضي."], "n": 1, "i": 70, "h": ""}, {"t": "mc", "q": "How is the future simple (form 1) built?<br>المستقبل البسيط (الصيغة الأولى) بيتكوّن إزاي؟", "opts": ["will or shall + verb stem | will أو shall + جذع الفعل", "be + going to + verb stem | be + going to + جذع الفعل", "will + be + verb-ing | will + be + الفعل-ing"], "ans": 0, "why": "Form 1 is will or shall plus the stem: You will see her on Sunday. | الصيغة الأولى will أو shall زائد الجذع: You will see her on Sunday.", "ex": ["Correct. | صح.", "No. That is form 2, the going to future. | غلط: دي الصيغة التانية، مستقبل going to.", "No. That is the future continuous. | غلط: ده المستقبل المستمر."], "n": 1, "i": 71, "h": ""}, {"t": "tf", "q": "Are you going to watch the game tonight? is in the future simple tense.<br>Are you going to watch the game tonight? في زمن المستقبل البسيط.", "ans": true, "why": "True. The going to future is form 2 of the future simple. | صح. مستقبل going to هو الصيغة التانية من المستقبل البسيط.", "ex": ["Correct. | صح.", "Wrong. Going to + stem is the future simple, form 2. | غلط: going to زائد الجذع هو المستقبل البسيط صيغة ٢."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "Dad will have cooked dinner by the time we get back. The tense is:<br>Dad will have cooked dinner by the time we get back. الزمن هو:", "opts": ["future perfect | المستقبل التام", "future continuous | المستقبل المستمر", "present perfect | المضارع التام"], "ans": 0, "why": "Will have + past participle: finished before a future point. | will have زائد التصريف التالت: هيكون خلص قبل نقطة مستقبلية.", "ex": ["Correct. | صح.", "No. That would be will be cooking. | غلط: ده هيبقى will be cooking.", "No. Present perfect is have/has + past participle, tied to now. | غلط: المضارع التام have/has زائد التصريف التالت، مربوط بدلوقتي."], "n": 1, "i": 73, "h": ""}, {"t": "mc", "q": "You had not eaten paella before you went to Spain. Which tense is had not eaten?<br>You had not eaten paella before you went to Spain. زمن had not eaten إيه؟", "opts": ["past perfect | الماضي التام", "present perfect | المضارع التام", "past simple | الماضي البسيط"], "ans": 0, "why": "Had + past participle is the past perfect: an earlier past inside a past story. | had زائد التصريف التالت هو الماضي التام: ماضي أقدم جوه حكاية ماضية.", "ex": ["Correct. | صح.", "No. The present perfect uses have/has, not had. | غلط: المضارع التام بيستخدم have/has مش had.", "No. The past simple would be did not eat. | غلط: الماضي البسيط هيبقى did not eat."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "I had been waiting for four hours. Which tense?<br>I had been waiting for four hours. أنهي زمن؟", "opts": ["past perfect continuous | الماضي التام المستمر", "present perfect continuous | المضارع التام المستمر", "past continuous | الماضي المستمر"], "ans": 0, "why": "Had been + verb-ing: an action in progress up to another past moment. | had been زائد الفعل-ing: فعل كان شغال لحد لحظة ماضية تانية.", "ex": ["Correct. | صح.", "No. That uses have/has been, tied to now. | غلط: ده بيستخدم have/has been، مربوط بدلوقتي.", "No. The past continuous is just was/were + verb-ing. | غلط: الماضي المستمر بس was/were زائد الفعل-ing."], "n": 1, "i": 75, "h": ""}, {"t": "tf", "q": "You were not driving when she phoned is in the present continuous tense.<br>You were not driving when she phoned في زمن المضارع المستمر.", "ans": false, "why": "Were is past, so it is the past continuous. The present continuous would be you are not driving. | were ماضي، فده ماضي مستمر. المضارع المستمر هيبقى you are not driving.", "ex": ["Wrong. Were makes it past continuous. | غلط: were بتخليه ماضي مستمر.", "Correct. | صح."], "n": 1, "i": 76, "h": ""}, {"t": "mc", "q": "I will have been studying for three hours. The form is:<br>I will have been studying for three hours. التكوين هو:", "opts": ["will + have + been + verb-ing | will + have + been + الفعل-ing", "will + have + past participle | will + have + التصريف التالت", "will + be + verb-ing | will + be + الفعل-ing"], "ans": 0, "why": "Future perfect continuous: will have been plus the present participle. | المستقبل التام المستمر: will have been زائد التصريف المستمر.", "ex": ["Correct. | صح.", "No. That is the future perfect simple. | غلط: ده المستقبل التام البسيط.", "No. That is the future continuous. | غلط: ده المستقبل المستمر."], "n": 1, "i": 77, "h": ""}, {"t": "tf", "q": "For the future continuous, will be and be going to mean roughly the same.<br>للمستقبل المستمر، will be وbe going to معناهم تقريبًا واحد.", "ans": true, "why": "True. There is little difference between the two forms. | صح. الفرق بين الصيغتين بسيط جدًا.", "ex": ["Correct. | صح.", "Wrong. Both forms work with little difference. | غلط: الصيغتين بينفعوا بفرق بسيط."], "n": 1, "i": 78, "h": ""}, {"t": "mc", "q": "Which list is the three structures the table gives for every tense?<br>أنهي قائمة فيها التراكيب التلاتة اللي الجدول بيديها لكل زمن؟", "opts": ["positive, question, negative | مثبت، سؤال، منفي", "past, present, future | ماضي، مضارع، مستقبل", "simple, perfect, continuous | بسيط، تام، مستمر"], "ans": 0, "why": "For each tense the table shows the positive, the question, and the negative forms. | لكل زمن الجدول بيوضح المثبت والسؤال والمنفي.", "ex": ["Correct. | صح.", "No. Those are the times, not the structures. | غلط: دول الأوقات مش التراكيب.", "No. Those are the aspects, not the structures. | غلط: دول الجوانب مش التراكيب."], "n": 1, "i": 79, "h": ""}, {"t": "recall", "q": "Name the twelve tenses in their three families.<br>اذكر الأزمنة الاتناشر في عائلاتهم التلاتة.", "a": "Simple: present, past, future. Perfect: present, past, future. Continuous: present, past, future, present perfect, past perfect, future perfect.<br>البسيطة: مضارع وماضي ومستقبل. التامة: مضارع وماضي ومستقبل. المستمرة: مضارع وماضي ومستقبل، ومضارع تام وماضي تام ومستقبل تام.", "n": 1, "i": 80, "h": ""}, {"t": "recall", "q": "Give the positive, question, and negative of the past simple with play.<br>اديني المثبت والسؤال والمنفي للماضي البسيط مع play.", "a": "Positive: You played tennis. Question: Did you play tennis? Negative: You did not play tennis.<br>المثبت: You played tennis. السؤال: Did you play tennis? المنفي: You did not play tennis.", "n": 1, "i": 81, "h": ""}, {"t": "write", "q": "Explain the two forms of the future continuous, with one example each (3-4 sentences).<br>اشرح صيغتي المستقبل المستمر، بمثال لكل واحدة (٣-٤ جمل).", "key": "tefl-17:1", "a": "Form 1 is will be plus the present participle: You will be cooking dinner when they arrive. Form 2 is be plus going to be plus the present participle: You are going to be sleeping when she gets home. Both describe an action in progress at a future time. There is little difference between them, so either form works.<br>الصيغة الأولى will be زائد التصريف المستمر: You will be cooking dinner when they arrive. الصيغة التانية be زائد going to be زائد التصريف المستمر: You are going to be sleeping when she gets home. الاتنين بيوصفوا فعل هيكون شغال في وقت مستقبلي. الفرق بينهم بسيط، فأي صيغة تنفع.", "n": 1, "i": 82, "h": ""}, {"t": "write", "q": "Why is the full tense table useful for a teacher? Give three reasons (3-4 sentences).<br>ليه جدول الأزمنة الكامل مفيد للمدرس؟ اذكر تلات أسباب (٣-٤ جمل).", "key": "tefl-17:2", "a": "First, when a student asks an unexpected question and your mind goes blank, the table keeps you right. Second, it gives the positive, question, and negative for every tense, so you can teach the forms one after another. Third, you can copy a single-tense page and hand it to your class, which saves you making your own table.<br>أولًا، لما طالب يسألك سؤال مش متوقع ودماغك تيجي عليك، الجدول هيظبطك. ثانيًا، بيديك المثبت والسؤال والمنفي لكل زمن، فتقدر تدرّس الصيغ واحدة ورا التانية. ثالثًا، تقدر تنسخ صفحة زمن واحد وتديها لكلاسك، وده بيوفّر عليك تعمل جدولك بنفسك.", "n": 1, "i": 83, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 5, how to actually teach grammar: prescriptive vs descriptive, and presenting grammar at every level.</div><div class=\"u\">الدرس الجاي: الوحدة الخامسة، إزاي تدرّس القواعد فعلًا: الوصفي ضد الواقعي، وتقديم القواعد لكل المستويات.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 84}];</script>
