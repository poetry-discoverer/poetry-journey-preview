<h1>عالم تيفل ٤: ليه فيه طلاب بتتعلم أسرع؟</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-04";window.STEPS=[{"t": "section", "h": "Why do some learn faster? | ليه فيه ناس بتتعلم أسرع؟", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Unit 2, part 2. Why do some L2 learners learn faster and better than others?</div><div class=\"u\">أهلًا بيك في الوحدة التانية، الجزء التاني. ليه بعض متعلمي الـL2 بيتعلموا أسرع وأحسن من غيرهم؟</div>", "n": 1, "i": 1, "a": "tefl-04-001", "x": "6291c959"}, {"t": "learn", "h": "<div class=\"u\">Here are the important points to remember and reflect on regularly when you are on the job. They are not in any specific order.</div><div class=\"u\">دي النقط المهمة اللي تفتكرها وتفكر فيها بانتظام وإنت شغال. مش مترتبة بترتيب معين.</div>", "n": 1, "i": 2, "a": "tefl-04-002", "x": "deb155fb"}, {"t": "learn", "h": "<div class=\"u\">1) Degree of intellect. Some learners are just brighter than others.</div><div class=\"u\">١) درجة الذكاء. فيه متعلمين ببساطة أذكى من غيرهم.</div>", "n": 1, "i": 3, "a": "tefl-04-003", "x": "3deb5cc3"}, {"t": "learn", "h": "<div class=\"u\">2) Learning style. If the teaching does not match the student's preferred learning style, like lots of visuals, audio, or discussions and exercises, learning may very well be curtailed.</div><div class=\"u\">٢) أسلوب التعلم. لو التدريس مش ماشي مع أسلوب التعلم المفضل للطالب، زي صور كتير أو صوتيات أو مناقشات وتمارين كتير، التعلم غالبًا هيتقلّص.</div>", "n": 1, "i": 4, "a": "tefl-04-004", "x": "3646cd0f"}, {"t": "learn", "h": "<div class=\"u\">We will explore learning styles in depth in Module 7.</div><div class=\"u\">هنتكلم عن أساليب التعلم بالتفصيل في الموديول السابع.</div>", "n": 1, "i": 5, "a": "tefl-04-005", "x": "c470753e"}, {"t": "learn", "h": "<div class=\"u\">3) Motivation. It can be intrinsic, learning for its own sake, or extrinsic, for a goal or reward like getting a new job.</div><div class=\"u\">٣) الدافع. ممكن يكون داخلي، التعلم لذاته، أو خارجي، عشان هدف أو مكافأة زي وظيفة جديدة.</div>", "n": 1, "i": 6, "a": "tefl-04-006", "x": "e40b5e8f"}, {"t": "learn", "h": "<div class=\"u\">Every student has a different degree of motivation, and keeping students motivated all the time is a challenge.</div><div class=\"u\">كل طالب عنده درجة دافع مختلفة، وإنك تخلي الطلاب متحمسين طول الوقت تحدي.</div>", "n": 1, "i": 7, "a": "tefl-04-007", "x": "06e46b5b"}, {"t": "learn", "h": "<div class=\"u\">Remember this: the whole person comes to school. Students have ups and downs and personal baggage: a sick parent or child, or a broken relationship.</div><div class=\"u\">افتكر ده: الإنسان كله بييجي المدرسة. الطلاب عندهم صعود ونزول وهموم شخصية: قلق على أب أو طفل مريض، أو علاقة شخصية اتكسرت.</div>", "n": 1, "i": 8, "a": "tefl-04-008", "x": "09167e93"}, {"t": "learn", "h": "<div class=\"u\">So the motivated person yesterday may not be motivated today. Help and show empathy wherever you can.</div><div class=\"u\">فالشخص المتحمس إمبارح ممكن ميبقاش متحمس النهارده. ساعد وأظهر التعاطف في أي مكان تقدر.</div>", "n": 1, "i": 9, "a": "tefl-04-009", "x": "a7895709"}, {"t": "learn", "h": "<div class=\"u\">The same applies to you. You may feel down because of a personal issue, or too many social events the night before. Make a supreme effort not to let this happen.</div><div class=\"u\">ونفس الكلام عليك إنت. ممكن تبقى مكتئب بسبب مشكلة شخصية، أو سهرات كتير الليلة اللي فاتت. ابذل مجهود خارق إن ده ميأثرش عليك.</div>", "n": 1, "i": 10, "a": "tefl-04-010", "x": "f7096bdf"}, {"t": "learn", "h": "<div class=\"u\">Your learners need you to be constant: positive, welcoming, and full of life all the time. We explore motivation in Module 3.</div><div class=\"u\">طلابك محتاجينك ثابت: إيجابي ومرحّب ومليان حيوية طول الوقت. بنتكلم عن الدافع في الموديول التالت.</div>", "n": 1, "i": 11, "a": "tefl-04-011", "x": "151d4f86"}, {"t": "learn", "h": "<div class=\"u\">4) Language proficiency in L1. A learner who is proficient in her first language, its grammar, structure, and mood, and who understands all this, has a great head start on others.</div><div class=\"u\">٤) الكفاءة في اللغة الأولى. المتعلمة اللي متمكنة من لغتها الأولى، قواعدها وتركيبها وأسلوبها، وفاهمة ده كله، عندها بداية متقدمة كبيرة عن غيرها.</div>", "n": 1, "i": 12, "a": "tefl-04-012", "x": "82429232"}, {"t": "section", "h": "Harder influences | مؤثرات أصعب", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">5) Prior learning. Learners bring expectations about teacher relationships and behaviour from their home countries, especially if they had extensive schooling there.</div><div class=\"u\">٥) التعلم السابق. المتعلمين بيجيبوا معاهم توقعات عن علاقة المدرس وسلوكه من بلادهم، خصوصًا لو اتعلموا هناك سنين كتير.</div>", "n": 1, "i": 14, "a": "tefl-04-013", "x": "4cc0909b"}, {"t": "learn", "h": "<div class=\"u\">Learners from more traditional systems may expect you to be formal and authoritarian.</div><div class=\"u\">المتعلمين من أنظمة تقليدية أكتر ممكن يتوقعوا منك تبقى رسمي وصارم.</div>", "n": 1, "i": 15, "a": "tefl-04-014", "x": "4c363455"}, {"t": "learn", "h": "<div class=\"u\">They may be displeased, puzzled, or offended by an informal style, like using first names or letting learners move freely. This affects their learning.</div><div class=\"u\">وممكن يتضايقوا أو يتلخبطوا أو يتجرحوا من الأسلوب غير الرسمي، زي استخدام الأسماء الأولى أو السماح للطلاب يتحركوا بحرية. ده بيأثر على تعلمهم.</div>", "n": 1, "i": 16, "a": "tefl-04-015", "x": "d7e2aba9"}, {"t": "learn", "h": "<div class=\"u\">So find out how they learned before and how they prefer to learn now. They may welcome a change, or they may want the same old way. Simply put: you need to ask them.</div><div class=\"u\">فاعرف هما اتعلموا إزاي قبل كده وبيفضلوا يتعلموا إزاي دلوقتي. ممكن يرحبوا بالتغيير، وممكن يعوزوا نفس الطريقة القديمة. ببساطة: لازم تسألهم.</div>", "n": 1, "i": 17, "a": "tefl-04-016", "x": "689bff8b"}, {"t": "learn", "h": "<div class=\"u\">6) Pattern of classroom activity. Some learners want a clearly ordered pattern of activities, and maybe extensive correction of grammar and pronunciation during all activities, not at irregular points.</div><div class=\"u\">٦) نمط نشاط الفصل. بعض المتعلمين عايزين نمط أنشطة مرتب وواضح، ويمكن تصحيح مكثف للقواعد والنطق أثناء كل الأنشطة، مش في نقاط غير منتظمة.</div>", "n": 1, "i": 18, "a": "tefl-04-017", "x": "8c2f63df"}, {"t": "learn", "h": "<div class=\"u\">If you do not match these ideals, some learners may think you are lazy or badly prepared.</div><div class=\"u\">لو ممشيتش على المثاليات دي، بعض المتعلمين ممكن يفتكروك كسلان أو مش محضّر كويس.</div>", "n": 1, "i": 19, "a": "tefl-04-018", "x": "e4fe2fd1"}, {"t": "learn", "h": "<div class=\"u\">7) Your behaviour. You also bring your own expectations about teacher behaviour and about society.</div><div class=\"u\">٧) سلوكك إنت. إنت برضه بيجيب معاك توقعاتك عن سلوك المدرس وعن المجتمع.</div>", "n": 1, "i": 20, "a": "tefl-04-019", "x": "1c5b210d"}, {"t": "learn", "h": "<div class=\"u\">For example, if you come from a culture of self-reliance, comfortable with expressing opinions, and interested in personal advancement, you will likely teach toward these goals.</div><div class=\"u\">مثلًا، لو جاي من ثقافة الاعتماد على النفس، ومريح في التعبير عن رأيك، ومهتم بالتقدم الشخصي، غالبًا هتدرّس ناحية الأهداف دي.</div>", "n": 1, "i": 21, "a": "tefl-04-020", "x": "cac52f59"}, {"t": "learn", "h": "<div class=\"u\">You may unconsciously assume your students share these goals. The potential for conflicting expectations is clear.</div><div class=\"u\">وممكن بدون وعي تفترض إن طلابك شايفين نفس الأهداف. وواضح قد إيه ده ممكن يعمل تضارب في التوقعات.</div>", "n": 1, "i": 22, "a": "tefl-04-021", "x": "ca6061ad"}, {"t": "learn", "h": "<div class=\"u\">8) Gender. Find out whether learners have experienced mixed educational groupings, and whether they expect male and female teachers to behave differently.</div><div class=\"u\">٨) النوع الاجتماعي. اعرف إذا كان المتعلمين جرّبوا مجموعات تعليمية مختلطة، وهل بيتوقعوا من المدرس والمدرسة سلوك مختلف.</div>", "n": 1, "i": 23, "a": "tefl-04-022", "x": "d3262ade"}, {"t": "learn", "h": "<div class=\"u\">Also, how might activities like role plays or dialogue practice affect learners differently because of their cultural constraints? Ignoring this can affect learning.</div><div class=\"u\">وكمان، إزاي أنشطة زي لعب الأدوار أو تدريب الحوار ممكن تأثر على المتعلمين بشكل مختلف بسبب قيودهم الثقافية؟ تجاهل ده ممكن يأثر على التعلم.</div>", "n": 1, "i": 24, "a": "tefl-04-023", "x": "1059a970"}, {"t": "learn", "h": "<div class=\"u\">9) Female participation. When you encourage women students to speak up and take an active role, you may meet reluctance from both men and women.</div><div class=\"u\">٩) مشاركة البنات. لما تشجع الطالبات يتكلموا وياخدوا دور نشط، ممكن تقابل تردد من الرجالة والستات.</div>", "n": 1, "i": 25, "a": "tefl-04-024", "x": "67fd5739"}, {"t": "learn", "h": "<div class=\"u\">In some cultures, women's social roles have not promoted active participation in mixed-sex settings. Reflect on this point continuously.</div><div class=\"u\">في بعض الثقافات، الأدوار الاجتماعية للستات مابتشجعش المشاركة النشطة في الأماكن المختلطة. فكّر في النقطة دي باستمرار.</div>", "n": 1, "i": 26, "a": "tefl-04-025", "x": "209b93ed"}, {"t": "learn", "h": "<div class=\"u\">10) Appropriate topics. Cultural expectations about what is appropriate to talk about affect which topics students are willing to pursue, and their motivation.</div><div class=\"u\">١٠) المواضيع المناسبة. التوقعات الثقافية عن إيه اللي ينفع يتقال بتأثر على المواضيع اللي الطلاب مستعدين يتكلموا فيها، وعلى دافعهم.</div>", "n": 1, "i": 27, "a": "tefl-04-026", "x": "69026a09"}, {"t": "learn", "h": "<div class=\"u\">Cultural and personal sensitivity is vital in knowing if, when, and how to introduce difficult topics.</div><div class=\"u\">الحساسية الثقافية والشخصية أساسية في معرفة لو وإمتى وإزاي تقدّم المواضيع الصعبة.</div>", "n": 1, "i": 28, "a": "tefl-04-027", "x": "1828be08"}, {"t": "learn", "h": "<div class=\"u\">11) Participation. Expressing ideas and asking questions in class is hard for students not used to active participation.</div><div class=\"u\">١١) المشاركة. التعبير عن الأفكار وطرح الأسئلة في الفصل صعب على الطلاب اللي مش متعودين على المشاركة النشطة.</div>", "n": 1, "i": 29, "a": "tefl-04-028", "x": "9c632ca6"}, {"t": "learn", "h": "<div class=\"u\">Also, their own view of their participation may not match yours.</div><div class=\"u\">وكمان، نظرتهم لمشاركتهم ممكن متطابقش نظرتك.</div>", "n": 1, "i": 30, "a": "tefl-04-029", "x": "3877d8a8"}, {"t": "section", "h": "Communication styles | أساليب التواصل", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">12) Communication styles. These are patterns of expression and rules of interaction that reflect a culture's norms and values.</div><div class=\"u\">١٢) أساليب التواصل. دي أنماط التعبير وقواعد التفاعل اللي بتعكس معايير وقيم الثقافة.</div>", "n": 1, "i": 32, "a": "tefl-04-030", "x": "1f202e1d"}, {"t": "learn", "h": "<div class=\"u\">Not understanding them can lead to confusion, anxiety, and conflict, and less learning. Let's look at two pairs of styles.</div><div class=\"u\">عدم فهمها ممكن يؤدي للخبطة وقلق وصراع، وتعلم أقل. تعالوا نشوف زوجين من الأساليب.</div>", "n": 1, "i": 33, "a": "tefl-04-031", "x": "4d911909"}, {"t": "learn", "h": "<div class=\"u\">Direct style: straightforward talking, no beating about the bush, straight and to the point. Directness means honesty and respect for the other person, and avoiding ambiguity.</div><div class=\"u\">الأسلوب المباشر: كلام صريح على طول، من غير لف ودوران، مباشرة وفي الموضوع. المباشرة معناها صدق واحترام للشخص التاني، وتجنّب الغموض.</div>", "n": 1, "i": 34, "a": "tefl-04-032", "x": "d163e3be"}, {"t": "learn", "h": "<div class=\"u\">Indirect style: meaning is conveyed by subtle means, stories, and implication, not getting to the point.</div><div class=\"u\">الأسلوب غير المباشر: المعنى بيتوصّل بطرق ناعمة وقصص وتلميح، مش بالوصول للنقطة.</div>", "n": 1, "i": 35, "a": "tefl-04-033", "x": "34661aa0"}, {"t": "learn", "h": "<div class=\"u\">Indirectness means politeness and respect for the other person, with frequent use of implication.</div><div class=\"u\">عدم المباشرة معناها أدب واحترام للشخص التاني، مع استخدام التلميح كتير.</div>", "n": 1, "i": 36, "a": "tefl-04-034", "x": "f9faa865"}, {"t": "learn", "h": "<div class=\"u\">Idea-focused style: ideas and the person are separate. Open disagreement is acceptable. Disagreeing with someone's ideas is not seen as a personal attack.</div><div class=\"u\">الأسلوب المركّز على الفكرة: الأفكار والشخص حاجتين منفصلتين. الاختلاف المفتوح مقبول. الاختلاف مع أفكار حد مش بيتشاف كهجوم شخصي.</div>", "n": 1, "i": 37, "a": "tefl-04-035", "x": "588bdec8"}, {"t": "learn", "h": "<div class=\"u\">Person-focused style: ideas and the person are not separate. Feelings are important. Disagreement is handled very carefully, because disagreement is seen as an attack on the person.</div><div class=\"u\">الأسلوب المركّز على الشخص: الأفكار والشخص مش منفصلين. المشاعر مهمة. الاختلاف بيتحطط بحذر شديد، لأن الاختلاف بيتشاف كهجوم على الشخص.</div>", "n": 1, "i": 38, "a": "tefl-04-036", "x": "a826882d"}, {"t": "learn", "h": "<div class=\"u\">So here are two conflicting ways of looking at communication, a potential boiling pot. Learning will be affected, and your critical task is to find a balance.</div><div class=\"u\">فدي طريقتين متضاربتين في النظر للتواصل، ودي قدرة ممكن تغلي. التعلم هيتأثر، ومهمتك الحرجة إنك تلاقي توازن.</div>", "n": 1, "i": 39, "a": "tefl-04-037", "x": "0fbf3874"}, {"t": "learn", "h": "<div class=\"u\">It is not your role to change people's cultural ways. It is your role to find a solution.</div><div class=\"u\">مش دورك إنك تغيّر الطرق الثقافية للناس. دورك إنك تلاقي حل.</div>", "n": 1, "i": 40, "a": "tefl-04-038", "x": "2460a7f4"}, {"t": "section", "h": "Learning strategies | استراتيجيات التعلم", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">Now, effective L2 learning strategies. These are the conscious steps and behaviours learners use.</div><div class=\"u\">دلوقتي، استراتيجيات تعلم الـL2 الفعالة. دي الخطوات والسلوكيات الواعية اللي المتعلمين بيستخدموها.</div>", "n": 1, "i": 42, "a": "tefl-04-039", "x": "83d7abdd"}, {"t": "learn", "h": "<div class=\"u\">They improve acquiring, storing, retaining, recalling, and using new information.</div><div class=\"u\">بتحسّن اكتساب وتخزين والاحتفاظ واسترجاع واستخدام المعلومات الجديدة.</div>", "n": 1, "i": 43, "a": "tefl-04-040", "x": "b229b365"}, {"t": "learn", "h": "<div class=\"u\">Research shows the most successful learners use strategies that fit the material, the task, and their own goals, needs, and stage of learning.</div><div class=\"u\">الأبحاث بتوري إن أنجح المتعلمين بيستخدموا استراتيجيات مناسبة للمادة وللمهمة ولأهدافهم واحتياجاتهم ومرحلتهم في التعلم.</div>", "n": 1, "i": 44, "a": "tefl-04-041", "x": "4a856ee4"}, {"t": "learn", "h": "<div class=\"u\">Strategies can be assessed through diaries, think-aloud procedures, observations, and surveys.</div><div class=\"u\">والاستراتيجيات ممكن تتقيّم من خلال اليوميات والتفكير بصوت عالي والملاحظة والاستبيانات.</div>", "n": 1, "i": 45, "a": "tefl-04-042", "x": "17a76250"}, {"t": "learn", "h": "<div class=\"u\">More proficient learners use a wider range of strategies, in a greater number of situations, than less proficient learners.</div><div class=\"u\">المتعلمين الأكفأ بيستخدموا مدى أوسع من الاستراتيجيات، في مواقف أكتر، من المتعلمين الأقل كفاءة.</div>", "n": 1, "i": 46, "a": "tefl-04-043", "x": "7d5eb0e6"}, {"t": "learn", "h": "<div class=\"u\">Proficient learners choose strategies that work well together, tailored to the task. They can easily explain the strategies they use and why.</div><div class=\"u\">المتعلمين الأكفأ بيختاروا استراتيجيات شغالة مع بعض كويس، ومفصّلة على المهمة. وبيقدروا بسهولة يشرحوا الاستراتيجيات اللي بيستخدموها وليه.</div>", "n": 1, "i": 47, "a": "tefl-04-044", "x": "f741a1f2"}, {"t": "learn", "h": "<div class=\"u\">They use cognitive strategies, like translating and analysing, and other strategies, like planning and organising.</div><div class=\"u\">بيستخدموا استراتيجيات معرفية، زي الترجمة والتحليل، واستراتيجيات تانية، زي التخطيط والتنظيم.</div>", "n": 1, "i": 48, "a": "tefl-04-045", "x": "13f34ff3"}, {"t": "learn", "h": "<div class=\"u\">Combining strategies often has more impact than relying on a single one.</div><div class=\"u\">دمج الاستراتيجيات غالبًا تأثيره أكبر من الاعتماد على واحدة بس.</div>", "n": 1, "i": 49, "a": "tefl-04-046", "x": "2a6addb6"}, {"t": "learn", "h": "<div class=\"u\">Each skill has its strategies. L2 writing benefits from planning, self-monitoring, deduction, and substitution.</div><div class=\"u\">كل مهارة ليها استراتيجياتها. الكتابة في الـL2 بتستفيد من التخطيط ومراقبة الذات والاستنتاج والاستبدال.</div>", "n": 1, "i": 50, "a": "tefl-04-047", "x": "70ff9c71"}, {"t": "learn", "h": "<div class=\"u\">L2 speaking demands risk-taking, paraphrasing, circumlocution, self-monitoring, and self-evaluation.</div><div class=\"u\">الكلام في الـL2 بيطلب المخاطرة وإعادة الصياغة والدوران حول المعنى ومراقبة الذات وتقييم الذات.</div>", "n": 1, "i": 51, "a": "tefl-04-048", "x": "5fc7b0a1"}, {"t": "learn", "h": "<div class=\"u\">L2 listening gains from elaboration, inference, selective attention, and self-monitoring.</div><div class=\"u\">الاستماع في الـL2 بيستفيد من التوسع والاستدلال والانتباه الانتقائي ومراقبة الذات.</div>", "n": 1, "i": 52, "a": "tefl-04-049", "x": "71e8465c"}, {"t": "learn", "h": "<div class=\"u\">L2 reading uses strategies like reading aloud, guessing, deduction, and summarising.</div><div class=\"u\">القراءة في الـL2 بتستخدم استراتيجيات زي القراءة بصوت عالي والتخمين والاستنتاج والتلخيص.</div>", "n": 1, "i": 53, "a": "tefl-04-050", "x": "200682af"}, {"t": "learn", "h": "<div class=\"u\">Remember to introduce your learners to some of these strategies if they are not already using them.</div><div class=\"u\">افتكر إنك تعرّف طلابك على شوية من الاستراتيجيات دي لو مش بيستخدموها أصلًا.</div>", "n": 1, "i": 54, "a": "tefl-04-051", "x": "6635fdf8"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 55}, {"t": "learn", "h": "<div class=\"u\">Key terms. Intellect: natural brightness. Learning style: the way a student prefers to learn.</div><div class=\"u\">مصطلحات الدرس. Intellect: الذكاء الطبيعي. Learning style: أسلوب التعلم المفضل للطالب.</div>", "n": 1, "i": 56, "a": "tefl-04-052", "x": "41b20c14"}, {"t": "learn", "h": "<div class=\"u\">Intrinsic motivation: learning for its own sake. Extrinsic motivation: learning for a goal or reward.</div><div class=\"u\">Intrinsic motivation: دافع داخلي، التعلم لذاته. Extrinsic motivation: دافع خارجي، التعلم لهدف أو مكافأة.</div>", "n": 1, "i": 57, "a": "tefl-04-053", "x": "80c5f394"}, {"t": "learn", "h": "<div class=\"u\">Direct style: straight to the point. Indirect style: meaning through stories and implication.</div><div class=\"u\">Direct style: مباشر وفي الموضوع. Indirect style: غير مباشر، بالقصص والتلميح.</div>", "n": 1, "i": 58, "a": "tefl-04-054", "x": "36992aa2"}, {"t": "learn", "h": "<div class=\"u\">Idea-focused: ideas and person are separate. Person-focused: disagreement feels like a personal attack.</div><div class=\"u\">Idea-focused: مركّز على الفكرة منفصلة عن الشخص. Person-focused: مركّز على الشخص، الاختلاف بيحس كهجوم شخصي.</div>", "n": 1, "i": 59, "a": "tefl-04-055", "x": "c07c8721"}, {"t": "learn", "h": "<div class=\"u\">Cognitive strategies: thinking strategies like translating and analysing. Paraphrasing: saying the same idea in other words.</div><div class=\"u\">Cognitive strategies: استراتيجيات معرفية زي الترجمة والتحليل. Paraphrasing: إعادة صياغة نفس الفكرة بكلام تاني.</div>", "n": 1, "i": 60, "a": "tefl-04-056", "x": "b4fdca10"}, {"t": "learn", "h": "<div class=\"u\">Circumlocution: talking around a word you don't know. Inference: working out meaning from clues.</div><div class=\"u\">Circumlocution: الدوران حول كلمة مش عارفها. Inference: استدلال المعنى من الإشارات.</div>", "n": 1, "i": 61, "a": "tefl-04-057", "x": "252a166b"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Summary. 12 influences on L2 learning, part 1: intellect, learning style, motivation, L1 proficiency, prior learning, and classroom activity pattern.</div><div class=\"u\">الخلاصة. ١٢ مؤثر على تعلم الـL2، جزء ١: الذكاء، أسلوب التعلم، الدافع، الكفاءة في الـL1، التعلم السابق، ونمط نشاط الفصل.</div>", "n": 1, "i": 63, "a": "tefl-04-058", "x": "5f53b801"}, {"t": "learn", "h": "<div class=\"u\">Part 2: your own behaviour, gender, female participation, appropriate topics, participation, and communication styles.</div><div class=\"u\">جزء ٢: سلوكك إنت، النوع الاجتماعي، مشاركة البنات، المواضيع المناسبة، المشاركة، وأساليب التواصل.</div>", "n": 1, "i": 64, "a": "tefl-04-059", "x": "79b16cd9"}, {"t": "learn", "h": "<div class=\"u\">Remember: the whole person comes to school, students and you. Show empathy, and stay positive and constant for your learners.</div><div class=\"u\">افتكر: الإنسان كله بييجي المدرسة، الطلاب وإنت. أظهر التعاطف، وفضل إيجابي وثابت عشان طلابك.</div>", "n": 1, "i": 65, "a": "tefl-04-060", "x": "344b5756"}, {"t": "learn", "h": "<div class=\"u\">Good learners use fitting strategies, combine them, and use special ones per skill: writing, speaking, listening, reading. Teach your students these strategies.</div><div class=\"u\">المتعلمين الكويسين بيستخدموا استراتيجيات مناسبة، وبيدمجوها، وبيستخدموا استراتيجيات خاصة لكل مهارة: كتابة وكلام واستماع وقراءة. علّم طلابك الاستراتيجيات دي.</div>", "n": 1, "i": 66, "a": "tefl-04-061", "x": "278bc79b"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 67}, {"t": "tf", "q": "If the teaching does not match the student's preferred learning style, learning may be curtailed.<br>لو التدريس مش ماشي مع أسلوب التعلم المفضل للطالب، التعلم ممكن يتقلّص.", "ans": true, "why": "Matching the learning style matters a lot. | مطابقة أسلوب التعلم مهمة جدًا.", "ex": ["Correct. | صح.", "Wrong. Mismatched style can shrink learning. | غلط: عدم المطابقة ممكن يقلّص التعلم."], "n": 1, "i": 68, "h": ""}, {"t": "tf", "q": "A learner who is proficient in her L1 does not have a great start on others.<br>المتعلمة المتمكنة من لغتها الأولى ماعندهاش بداية متقدمة عن غيرها.", "ans": false, "why": "She has a great head start: she understands grammar and structure already. | عندها بداية متقدمة كبيرة: فاهمة القواعد والتركيب أصلًا.", "ex": ["Wrong. L1 proficiency is a great head start. | غلط: الكفاءة في الـL1 بداية متقدمة كبيرة.", "Correct. | صح."], "n": 1, "i": 69, "h": ""}, {"t": "tf", "q": "Communication styles are the same in all cultures.<br>أساليب التواصل واحدة في كل الثقافات.", "ans": false, "why": "They reflect each culture's own norms and values. | بتعكس معايير وقيم كل ثقافة لوحدها.", "ex": ["Wrong. Styles differ between cultures. | غلط: الأساليب بتختلف بين الثقافات.", "Correct. | صح."], "n": 1, "i": 70, "h": ""}, {"t": "mc", "q": "Intrinsic motivation means learning:<br>الدافع الداخلي معناه التعلم:", "opts": ["for its own sake | لذاته", "for a reward | عشان مكافأة", "for a new job | عشان وظيفة جديدة"], "ans": 0, "why": "Intrinsic = for its own sake; a goal or reward is extrinsic. | داخلي = لذاته؛ الهدف أو المكافأة دافع خارجي.", "ex": ["Correct. | صح.", "No. That is extrinsic. | غلط: ده خارجي.", "No. That is extrinsic. | غلط: ده خارجي."], "n": 1, "i": 71, "h": ""}, {"t": "tf", "q": "The motivated student yesterday may not be motivated today.<br>الطالب المتحمس إمبارح ممكن ميبقاش متحمس النهارده.", "ans": true, "why": "The whole person comes to school, with ups and downs and personal baggage. | الإنسان كله بييجي المدرسة، بصعوده ونزوله وهمومه الشخصية.", "ex": ["Correct. | صح.", "Wrong. Motivation changes with life. | غلط: الدافع بيتغير مع الحياة."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "In an indirect communication style, meaning is conveyed by:<br>في أسلوب التواصل غير المباشر، المعنى بيتوصّل عن طريق:", "opts": ["stories and implication | القصص والتلميح", "going straight to the point | الوصول للنقطة على طول", "avoiding ambiguity | تجنّب الغموض"], "ans": 0, "why": "Indirect style uses subtle means, not the direct point. | الأسلوب غير المباشر بيستخدم طرق ناعمة، مش النقطة المباشرة.", "ex": ["Correct. | صح.", "No. That is the direct style. | غلط: ده الأسلوب المباشر.", "No. That is the direct style. | غلط: ده الأسلوب المباشر."], "n": 1, "i": 73, "h": ""}, {"t": "tf", "q": "In an idea-focused culture, disagreeing with someone's idea is seen as a personal attack.<br>في الثقافة المركّزة على الفكرة، الاختلاف مع فكرة حد بيتشاف كهجوم شخصي.", "ans": false, "why": "Idea-focused separates ideas from the person. Person-focused takes disagreement personally. | المركّز على الفكرة بيفصل الأفكار عن الشخص. المركّز على الشخص بياخد الاختلاف بشكل شخصي.", "ex": ["Wrong. That is the person-focused style. | غلط: ده الأسلوب المركّز على الشخص.", "Correct. | صح."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "Which strategy especially helps L2 speaking?<br>أنهي استراتيجية بتساعد الكلام في الـL2 بالذات؟", "opts": ["risk-taking | المخاطرة", "reading aloud | القراءة بصوت عالي", "summarising | التلخيص"], "ans": 0, "why": "Speaking demands risk-taking, paraphrasing, and circumlocution. | الكلام بيطلب المخاطرة وإعادة الصياغة والدوران حول المعنى.", "ex": ["Correct. | صح.", "No. That helps reading. | غلط: دي بتساعد القراءة.", "No. That helps reading and writing. | غلط: دي بتساعد القراءة والكتابة."], "n": 1, "i": 75, "h": ""}, {"t": "tf", "q": "Combining several strategies often works better than relying on one.<br>دمج عدة استراتيجيات غالبًا بيشتغل أحسن من الاعتماد على واحدة.", "ans": true, "why": "Combinations of strategies have more impact. | دمج الاستراتيجيات تأثيره أكبر.", "ex": ["Correct. | صح.", "Wrong. Combinations have more impact. | غلط: الدمج تأثيره أكبر."], "n": 1, "i": 76, "h": ""}, {"t": "mc", "q": "Learners from traditional school systems may be offended if the teacher:<br>المتعلمين من الأنظمة المدرسية التقليدية ممكن يتجرحوا لو المدرس:", "opts": ["uses first names and an informal style | بيستخدم الأسماء الأولى وأسلوب غير رسمي", "corrects their grammar | بيصحح قواعدهم", "gives homework | بيدّي واجب"], "ans": 0, "why": "They often expect a formal, authoritarian teacher. | غالبًا بيتوقعوا مدرس رسمي وصارم.", "ex": ["Correct. | صح.", "No. Many of them want extensive correction. | غلط: كتير منهم عايزين تصحيح مكثف.", "No. | غلط."], "n": 1, "i": 77, "h": ""}, {"t": "recall", "q": "Name 4 influences on L2 learning.<br>اذكر ٤ مؤثرات على تعلم الـL2.", "a": "Any 4: intellect, learning style, motivation, L1 proficiency, prior learning, classroom pattern, teacher behaviour, gender, female participation, appropriate topics, participation, communication styles.<br>أي ٤: الذكاء، أسلوب التعلم، الدافع، الكفاءة في الـL1، التعلم السابق، نمط الفصل، سلوك المدرس، النوع الاجتماعي، مشاركة البنات، المواضيع المناسبة، المشاركة، أساليب التواصل.", "n": 1, "i": 78, "h": ""}, {"t": "recall", "q": "Name 3 strategies that good L2 learners use.<br>اذكر ٣ استراتيجيات بيستخدمها متعلمي الـL2 الكويسين.", "a": "Any 3: planning, self-monitoring, deduction, substitution, risk-taking, paraphrasing, circumlocution, self-evaluation, elaboration, inference, selective attention, reading aloud, guessing, summarising.<br>أي ٣: التخطيط، مراقبة الذات، الاستنتاج، الاستبدال، المخاطرة، إعادة الصياغة، الدوران حول المعنى، تقييم الذات، التوسع، الاستدلال، الانتباه الانتقائي، القراءة بصوت عالي، التخمين، التلخيص.", "n": 1, "i": 79, "h": ""}, {"t": "write", "q": "Explain the whole person comes to school, and what it means for you as a teacher (3-4 sentences).<br>اشرح جملة الإنسان كله بييجي المدرسة، وإيه معناها ليك كمدرس (٣-٤ جمل).", "key": "tefl-04:1", "a": "Students bring their whole lives to class: their health worries, family problems, and broken relationships. So motivation changes from day to day, and yesterday's motivated student may be flat today. The same is true for the teacher, who must make a big effort to stay constant. Learners need a teacher who is positive, welcoming, and full of life all the time, with empathy for their hard days.<br>الطلاب بيجيبوا حياتهم كلها للفصل: قلق الصحة ومشاكل العيلة والعلاقات المكسورة. فالدافع بيتغير من يوم ليوم، والطالب المتحمس إمبارح ممكن يبقى فاضي النهارده. ونفس الشيء على المدرس، اللي لازم يبذل مجهود كبير يفضل ثابت. الطلاب محتاجين مدرس إيجابي ومرحّب ومليان حيوية طول الوقت، ومتعاطف مع أيامهم الصعبة.", "n": 1, "i": 80, "h": ""}, {"t": "write", "q": "Compare direct and indirect communication styles (3-4 sentences).<br>قارن أسلوبي التواصل المباشر وغير المباشر (٣-٤ جمل).", "key": "tefl-04:2", "a": "A direct style talks straight and gets to the point, and sees directness as honesty and respect. An indirect style uses stories, subtle means, and implication, and sees indirectness as politeness and respect. Each side can misunderstand the other: direct can feel rude, indirect can feel unclear. The teacher must notice both styles in class and find a balance.<br>الأسلوب المباشر بيتكلم صراحة وبيوصل للنقطة، وشايف المباشرة صدق واحترام. الأسلوب غير المباشر بيستخدم القصص والطرق الناعمة والتلميح، وشايف عدم المباشرة أدب واحترام. كل جانب ممكن يفهم التاني غلط: المباشر ممكن يبان قاسي، وغير المباشر ممكن يبان مش واضح. المدرس لازم يلاحظ الأسلوبين في الفصل ويلاقي توازن.", "n": 1, "i": 81, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: what makes a competent and effective teacher? The habits and skills of good teaching.</div><div class=\"u\">الدرس الجاي: إيه اللي بيخلي المدرس كفء وفعال؟ عادات ومهارات التدريس الكويس.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 82}];</script>
