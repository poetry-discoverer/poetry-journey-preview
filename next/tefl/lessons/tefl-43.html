<h1>عالم تيفل ٤٣: مهارة القراءة</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤٣</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-43";window.STEPS=[{"t": "section", "h": "Module 8 welcome + reading is complex | ترحيب الموديول التامن + القراءة معقدة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Module 8. Reading, like listening, is a receptive skill, because it involves responding to a text instead of producing one.</div><div class=\"u\">أهلاً بيك في الموديول التامن. القراءة، زي الاستماع، مهارة استقبالية، لأنها بتتضمن الرد على نص بدل إنتاج نص.</div>", "n": 1, "i": 1, "a": "tefl-43-001", "x": "4b32db5e"}, {"t": "learn", "h": "<div class=\"u\">This module covers the key concepts of reading skills, and you will watch a video of an authentic reading skills lesson, which helps your lesson planning thought process.</div><div class=\"u\">الموديول ده بيغطي المفاهيم الأساسية لمهارات القراءة، وهتتفرج على فيديو لدرس قراءة حقيقي، وده بيساعد طريقة تفكيرك في تخطيط الدروس.</div>", "n": 1, "i": 2, "a": "tefl-43-002", "x": "a4a682ff"}, {"t": "learn", "h": "<div class=\"u\">Reading is actually much more complicated than it seems at first glance.</div><div class=\"u\">القراءة في الحقيقة أعقد بكتير مما بتبان من أول نظرة.</div>", "n": 1, "i": 3, "a": "tefl-43-003", "x": "4a0cbd10"}, {"t": "learn", "h": "<div class=\"u\">When we read in our own language, we do not realise all the skills we are using. In a foreign language, several things come into play that we take for granted.</div><div class=\"u\">لما بنقرأ بلغتنا، مابنحسش بكل المهارات اللي بنستخدمها. في اللغة الأجنبية، في حاجات كتير بتدخل في اللعبة إحنا بنعتبرها مسلّمات.</div>", "n": 1, "i": 4, "a": "tefl-43-004", "x": "0dd065a9"}, {"t": "learn", "h": "<div class=\"u\">You need to understand the individual letters, the words, the sentences, the connections between sentences, and the type of text.</div><div class=\"u\">محتاج تفهم الحروف الفردية، والكلمات، والجمل، والروابط بين الجمل، ونوع النص.</div>", "n": 1, "i": 5, "a": "tefl-43-005", "x": "bcf57b89"}, {"t": "learn", "h": "<div class=\"u\">You also need to bring your previous knowledge of the world to make sense of the discourse.</div><div class=\"u\">ومحتاج كمان تجيب معرفتك السابقة عن العالم عشان تفهم الخطاب.</div>", "n": 1, "i": 6, "a": "tefl-43-006", "x": "17908cfa"}, {"t": "learn", "h": "<div class=\"u\">There are many types of text, from letters to articles to stories, and the genre, with other factors, determines how we read it.</div><div class=\"u\">في أنواع نصوص كتير، من الخطابات للمقالات للقصص، والنوع الأدبي، مع عوامل تانية، بيحدد بنقراه إزاي.</div>", "n": 1, "i": 7, "a": "tefl-43-007", "x": "7a030a99"}, {"t": "learn", "h": "<div class=\"u\">We might skim for the overall gist, read for detail, or even read parts to predict what the whole is about.</div><div class=\"u\">ممكن نقرأ سريعًا للفكرة العامة، أو نقرأ للتفاصيل، أو حتى نقرأ أجزاء عشان نتوقع الموضوع كله.</div>", "n": 1, "i": 8, "a": "tefl-43-008", "x": "07918a25"}, {"t": "learn", "h": "<div class=\"u\">These are the skills we help learners develop so they become active readers.</div><div class=\"u\">دي المهارات اللي بنساعد المتعلمين ينمّوها عشان يبقوا قراء نشيطين.</div>", "n": 1, "i": 9, "a": "tefl-43-009", "x": "c4e37978"}, {"t": "section", "h": "Skimming | القراءة السريعة للفكرة", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">Skimming: we skim a text when we want a general impression of what it is about. You read quickly, running your eyes over the words to understand the overall meaning.</div><div class=\"u\">القراءة السريعة للفكرة: بنعملها لما بنكون عايزين انطباع عام عن موضوع النص. بتقرأ بسرعة، عينيك بتجري على الكلمات عشان تفهم المعنى العام.</div>", "n": 1, "i": 11, "a": "tefl-43-010", "x": "70c1efc4"}, {"t": "learn", "h": "<div class=\"u\">For instance, we often skim the first couple of pages of a book before deciding to buy it.</div><div class=\"u\">مثلًا، غالبًا بنقرأ أول صفحتين من كتاب قراءة سريعة قبل ما نقرر نشتريه.</div>", "n": 1, "i": 12, "a": "tefl-43-011", "x": "0915ca3b"}, {"t": "learn", "h": "<div class=\"u\">With EFL students this is a great skill to practise, because it gets them to see the broader structure and meaning of a text without stopping at words they do not know.</div><div class=\"u\">مع طلبة الإنجليزية دي مهارة ممتازة للتدريب، لأنها بتخليهم يشوفوا التركيب الأوسع ومعنى النص من غير ما يقفوا عند كلمات مابيعرفوهاش.</div>", "n": 1, "i": 13, "a": "tefl-43-012", "x": "2a421c07"}, {"t": "learn", "h": "<div class=\"u\">It also avoids the typical complaint that reading in a foreign language is boring because it is so slow when you think you must look up every single word in a dictionary!</div><div class=\"u\">وكمان بتتجنب الشكوى المعتادة إن القراءة بلغة أجنبية مملة لأنها بطيئة أوي لما تفتكر إنك لازم تدور على كل كلمة في القاموس!</div>", "n": 1, "i": 14, "a": "tefl-43-013", "x": "3d48c8d1"}, {"t": "section", "h": "Scanning | المسح القراءي", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">Scanning is a similar speed-reading technique, but slightly different: you scan a text to find specific pieces of information quickly.</div><div class=\"u\">المسح القراءي تقنية قراءة سريعة مشابهة، بس مختلفة شوية: بتمسح النص عشان تلاقي معلومات محددة بسرعة.</div>", "n": 1, "i": 16, "a": "tefl-43-014", "x": "0367b7ac"}, {"t": "learn", "h": "<div class=\"u\">You might be looking for a phone number, a name or opening times, so you do not read the whole text, just parts of it until you find what you need.</div><div class=\"u\">ممكن تكون بتدور على رقم تليفون، أو اسم، أو مواعيد فتح، فمش بتقرأ النص كله، بس أجزاء منه لحد ما تلاقي اللي محتاجه.</div>", "n": 1, "i": 17, "a": "tefl-43-015", "x": "c152ee14"}, {"t": "learn", "h": "<div class=\"u\">A typical scanning question could be: what time does the last bus leave? Or: where is Lucy going on holiday?</div><div class=\"u\">سؤال مسح نموذجي ممكن يكون: آخر أتوبيس بيتحرك الساعة كام؟ أو: لوسي رايحة فين في الأجازة؟</div>", "n": 1, "i": 18, "a": "tefl-43-016", "x": "42dbb0fb"}, {"t": "section", "h": "Reading for detail | القراءة للتفاصيل", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">Reading for detail is when we really focus on each individual word.</div><div class=\"u\">القراءة للتفاصيل هي لما بنركّز فعلًا على كل كلمة لوحدها.</div>", "n": 1, "i": 20, "a": "tefl-43-017", "x": "ccde3030"}, {"t": "learn", "h": "<div class=\"u\">This allows you to work out how each word in a sentence fits together to deduce meaning, and it can be used to learn new vocabulary or understand aspects of grammar.</div><div class=\"u\">ده بيخليك تعرف إزاي كل كلمة في الجملة بتركب مع التانية عشان تستنتج المعنى، وممكن يتستخدم لتعلم مفردات جديدة أو فهم جوانب من القواعد.</div>", "n": 1, "i": 21, "a": "tefl-43-018", "x": "e004caf6"}, {"t": "learn", "h": "<div class=\"u\">Most students are familiar with this method, but in real life we do not usually read like this except on certain occasions, like understanding a complex set of instructions.</div><div class=\"u\">معظم الطلبة عارفين الطريقة دي، بس في الحياة الحقيقية عادة مابنقراش كده إلا في مناسبات معينة، زي فهم مجموعة تعليمات معقدة.</div>", "n": 1, "i": 22, "a": "tefl-43-019", "x": "6595ee7b"}, {"t": "learn", "h": "<div class=\"u\">So make sure learners are aware of different approaches to reading, so that when they meet real-world texts where they do not understand every word, they still have strategies to cope.</div><div class=\"u\">فاتأكد إن المتعلمين واعيين بطرق القراءة المختلفة، عشان لما يقابلوا نصوص حقيقية مش فاهمين كل كلمة فيها، يفضل عندهم استراتيجيات يتعاملوا بيها.</div>", "n": 1, "i": 23, "a": "tefl-43-020", "x": "1a43f34b"}, {"t": "section", "h": "Deducing from context | الاستنتاج من السياق", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Deducing meaning from context: when some words are unknown, it is not always useful to go straight to a dictionary for a definition or translation.</div><div class=\"u\">استنتاج المعنى من السياق: لما تكون في كلمات مش معروفة، مش دايمًا مفيد تروح للقاموس على طول تجيب تعريف أو ترجمة.</div>", "n": 1, "i": 25, "a": "tefl-43-021", "x": "2bec4e31"}, {"t": "learn", "h": "<div class=\"u\">Instead, encourage students to work out the meaning of a word from its context, looking at all the words around it to make an educated guess.</div><div class=\"u\">بدل كده، شجّع الطلبة يستنتجوا معنى الكلمة من سياقها، يبصوا على كل الكلمات اللي حواليها عشان يعملوا تخمين مبني على علم.</div>", "n": 1, "i": 26, "a": "tefl-43-022", "x": "30572689"}, {"t": "section", "h": "Predicting | التوقع", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">Predicting: there is a lot of information we can get from a text even before we read it.</div><div class=\"u\">التوقع: في معلومات كتير نقدر ناخدها من النص حتى قبل ما نقراه.</div>", "n": 1, "i": 28, "a": "tefl-43-023", "x": "fe74c88c"}, {"t": "learn", "h": "<div class=\"u\">Help students tap into this skill by encouraging them to look at the other visual information on the page first: pictures or photographs, a title or subheading, even the author's name.</div><div class=\"u\">ساعد الطلبة يستخدموا المهارة دي بتشجيعهم يبصوا على المعلومات البصرية في الصفحة الأول: الصور، العنوان أو العنوان الفرعي، وحتى اسم الكاتب.</div>", "n": 1, "i": 29, "a": "tefl-43-024", "x": "5baa7fcf"}, {"t": "learn", "h": "<div class=\"u\">All of these can help us predict the genre of a text (letter, newspaper article, novel extract), possible content, and even grammatical structures which may be used.</div><div class=\"u\">كل الحاجات دي بتساعدنا نتوقع نوع النص الأدبي (خطاب، مقال جرنال، مقتطف رواية)، والمحتوى المحتمل، وحتى التراكيب اللغوية اللي ممكن تتستخدم.</div>", "n": 1, "i": 30, "a": "tefl-43-025", "x": "227d492e"}, {"t": "learn", "h": "<div class=\"u\">Reading a letter of application, readers might expect modal verbs like could and would for polite requests, or fixed expressions like: enclosed is a copy of my Curriculum Vitae.</div><div class=\"u\">في خطاب تقديم لوظيفة، القراء ممكن يتوقعوا أفعال ناقصة زي could و would للطلبات المؤدبة، أو تعبيرات ثابتة زي: مرفق نسخة من السيرة الذاتية.</div>", "n": 1, "i": 31, "a": "tefl-43-026", "x": "c1640fd4"}, {"t": "learn", "h": "<div class=\"u\">When students predict correctly, they feel satisfied and reassured that even without understanding every word, they can comprehend more than they thought.</div><div class=\"u\">لما الطلبة بيتوقعوا صح، بيحسوا بالرضا والاطمئنان إن حتى من غير فهم كل كلمة، بيقدروا يفهموا أكتر مما كانوا فاكرين.</div>", "n": 1, "i": 32, "a": "tefl-43-027", "x": "bbc15b01"}, {"t": "section", "h": "Inferring | الاستنتاج", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">Inferring is a slightly more subtle skill: understanding the meaning behind the words to deduce attitudes, opinions and so on.</div><div class=\"u\">الاستنتاج مهارة أدق شوية: فهم المعنى اللي ورا الكلمات عشان نستنتج المواقف والآراء وكده.</div>", "n": 1, "i": 34, "a": "tefl-43-028", "x": "3916464c"}, {"t": "learn", "h": "<div class=\"u\">For this, students need to recognise register (formal or informal) and style, and identify words and structures that tell us how the writer is referring to something.</div><div class=\"u\">عشان كده، الطلبة محتاجين يعرفوا المستوى (رسمي أو غير رسمي) والأسلوب، ويحددوا الكلمات والتراكيب اللي بتقولنا الكاتب بيشاور على الحاجة إزاي.</div>", "n": 1, "i": 35, "a": "tefl-43-029", "x": "f532309c"}, {"t": "learn", "h": "<div class=\"u\">This skill is often practised at higher levels, because it takes a certain amount of knowledge of English.</div><div class=\"u\">المهارة دي غالبًا بتتدرب في المستويات الأعلى، لأنها محتاجة قدر معين من المعرفة بالإنجليزية.</div>", "n": 1, "i": 36, "a": "tefl-43-030", "x": "3ff257fe"}, {"t": "learn", "h": "<div class=\"u\">However, even at lower levels you can grade a task so that lower level students can infer meaning too.</div><div class=\"u\">بس حتى في المستويات الأقل تقدر تدرّج المهمة عشان طلبة المستوى الأقل يستنتجوا المعنى هما كمان.</div>", "n": 1, "i": 37, "a": "tefl-43-031", "x": "bb94d030"}, {"t": "learn", "h": "<div class=\"u\">Noticing an unknown word's position in a sentence, and recognising whether it is a verb, noun or adjective, will help to deduce meaning.</div><div class=\"u\">ملاحظة مكان الكلمة المش معروفة في الجملة، ومعرفة إذا كانت فعل أو اسم أو صفة، بيساعد في استنتاج المعنى.</div>", "n": 1, "i": 38, "a": "tefl-43-032", "x": "c322c6ae"}, {"t": "section", "h": "A top down lesson plan | مخطط درس من فوق لتحت", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">As with listening, introduce the task rather than just launching in and asking students to read and answer the questions.</div><div class=\"u\">وزي الاستماع، قدّم المهمة بدل ما تغوص على طول وتطلب من الطلبة يقرأوا ويجاوبوا على الأسئلة.</div>", "n": 1, "i": 40, "a": "tefl-43-033", "x": "86b95212"}, {"t": "learn", "h": "<div class=\"u\">Here is a top down approach reading lesson plan. The lesson first looks at the text from a general, wider perspective, then gradually focuses on more detail.</div><div class=\"u\">ده مخطط درس قراءة بمنهج من فوق لتحت. الدرس بيبص على النص من منظور عام وأوسع الأول، وبعدين بيركّز تدريجيًا على التفاصيل.</div>", "n": 1, "i": 41, "a": "tefl-43-034", "x": "968df966"}, {"t": "learn", "h": "<div class=\"u\">The suggested order: first, lead-in, spark interest in the topic by discussing the main themes.</div><div class=\"u\">الترتيب المقترح: أول حاجة، المقدمة، ولّع الاهتمام بالموضوع بمناقشة المحاور الرئيسية.</div>", "n": 1, "i": 42, "a": "tefl-43-035", "x": "7f4e0a68"}, {"t": "learn", "h": "<div class=\"u\">Second, use photographs in the text to make predictions. Third, pre-teach the necessary vocabulary.</div><div class=\"u\">تاني حاجة، استخدم الصور اللي في النص للتوقعات. تالت حاجة، علّم المفردات الضرورية مسبقًا.</div>", "n": 1, "i": 43, "a": "tefl-43-036", "x": "881e0512"}, {"t": "learn", "h": "<div class=\"u\">Fourth, give students time to read through the questions and predict answers. Fifth, skim the text to decide on general content and choose a suitable title out of three options.</div><div class=\"u\">رابع حاجة، ادّي الطلبة وقت يقرأوا الأسئلة ويتوقعوا الإجابات. خامس حاجة، قراءة سريعة للنص لتحديد المحتوى العام واختيار عنوان مناسب من تلات اختيارات.</div>", "n": 1, "i": 44, "a": "tefl-43-037", "x": "572120e8"}, {"t": "learn", "h": "<div class=\"u\">Sixth, scan for specific pieces of information. Seventh, a task focusing on more detailed meaning: true/false questions.</div><div class=\"u\">سادس حاجة، مسح لقطع معلومات محددة. سابع حاجة، مهمة بتركّز على معنى أدق: أسئلة صح/غلط.</div>", "n": 1, "i": 45, "a": "tefl-43-038", "x": "beb2c583"}, {"t": "learn", "h": "<div class=\"u\">Eighth, a vocabulary task: guessing meanings of unknown words from context, then checking in a dictionary.</div><div class=\"u\">تامن حاجة، مهمة مفردات: تخمين معاني الكلمات المش معروفة من السياق، وبعدين التأكد في القاموس.</div>", "n": 1, "i": 46, "a": "tefl-43-039", "x": "60635235"}, {"t": "learn", "h": "<div class=\"u\">Ninth, a task focusing on meaning: complete the table with information from the text. Tenth, a follow-on task: writing.</div><div class=\"u\">تاسع حاجة، مهمة بتركّز على المعنى: إكمال الجدول بمعلومات من النص. عاشر حاجة، مهمة متابعة: كتابة.</div>", "n": 1, "i": 47, "a": "tefl-43-040", "x": "9cbe910f"}, {"t": "section", "h": "Intensive vs extensive reading | القراءة المكثفة ضد الممتدة", "n": 1, "i": 48}, {"t": "learn", "h": "<div class=\"u\">The reading we do in class is generally known as intensive reading: short texts with different tasks to understand the discourse and develop skills, usually with a language focus.</div><div class=\"u\">القراءة اللي بنعملها في الفصل بتتعرف عمومًا بالقراءة المكثفة: نصوص قصيرة بمهام مختلفة لفهم الخطاب وتنمية مهارات، عادة بتركيز لغوي.</div>", "n": 1, "i": 49, "a": "tefl-43-041", "x": "ebdbe3e9"}, {"t": "learn", "h": "<div class=\"u\">Yet extensive reading outside the classroom should be encouraged too: reading longer texts such as novels, stories or newspapers for pleasure.</div><div class=\"u\">بس القراءة الممتدة برا الفصل لازم تتشجّع كمان: قراءة نصوص أطول زي الروايات والقصص والجرايد للمتعة.</div>", "n": 1, "i": 50, "a": "tefl-43-042", "x": "150f4f3d"}, {"t": "learn", "h": "<div class=\"u\">Extensive reading can really impact language learning, as students are exposed to such a range of language often without even realising it.</div><div class=\"u\">القراءة الممتدة ممكن فعلًا تأثر في تعلم اللغة، لأن الطلبة بيتعرضوا لتشكيلة لغة كبيرة من غير ما يحسوا غالبًا.</div>", "n": 1, "i": 51, "a": "tefl-43-043", "x": "289c4da2"}, {"t": "learn", "h": "<div class=\"u\">They develop reading skills without noticing: they may skim parts of a novel as their attention drifts, or read a chapter in detail.</div><div class=\"u\">بينمّوا مهارات قراءة من غير ما يلاحظوا: ممكن يقرأوا أجزاء من رواية بسرعة وانتباههم بيسرح، أو يقرأوا فصل بالتفصيل.</div>", "n": 1, "i": 52, "a": "tefl-43-044", "x": "1dab7f0f"}, {"t": "learn", "h": "<div class=\"u\">They can also predict what happens next, or go back to scan for information they missed.</div><div class=\"u\">ويقدروا كمان يتوقعوا اللي هيحصل، أو يرجعوا يمسحوا على معلومة فاتتهم.</div>", "n": 1, "i": 53, "a": "tefl-43-045", "x": "caa6d7a1"}, {"t": "learn", "h": "<div class=\"u\">According to Scrivener, all of this increases their overall linguistic confidence, which then influences and improves their skills in other language areas too.</div><div class=\"u\">على حسب سكريفنر، كل ده بيزوّد ثقتهم اللغوية العامة، اللي بدورها بتأثر وبتحسّن مهاراتهم في مجالات اللغة التانية كمان.</div>", "n": 1, "i": 54, "a": "tefl-43-046", "x": "7d77cf02"}, {"t": "learn", "h": "<div class=\"u\">Graded readers can be a great way to start reading extensively if students are overwhelmed by the prospect of picking up an English novel.</div><div class=\"u\">القراءات المتدرجة ممكن تبقى طريقة ممتازة لبدء القراءة الممتدة لو الطلبة متوترين من فكرة مسك رواية إنجليزية.</div>", "n": 1, "i": 55, "a": "tefl-43-047", "x": "67667b60"}, {"t": "learn", "h": "<div class=\"u\">These are specially designed for EFL learners, adapted to different levels, with footnotes and glossaries, and often little exercises along the way.</div><div class=\"u\">دي مصممة خصيصًا لمتعلمي الإنجليزية، متكيّفة لمستويات مختلفة، فيها حواشي وقواميس، وغالبًا تمارين صغيرة على الطريق.</div>", "n": 1, "i": 56, "a": "tefl-43-048", "x": "5943bece"}, {"t": "learn", "h": "<div class=\"u\">Encourage your students to read for pleasure as much as possible, because when we enjoy something, we tend to learn a lot more!</div><div class=\"u\">شجّع طلبتك يقرأوا للمتعة بقدر الإمكان، لأن لما بنستمتع بحاجة، بنميل نتعلم أكتر بكتير!</div>", "n": 1, "i": 57, "a": "tefl-43-049", "x": "6d9a5326"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 58}, {"t": "learn", "h": "<div class=\"u\">skimming: reading quickly to get the general impression of a text.</div><div class=\"u\">القراءة السريعة للفكرة: قراءة بسرعة عشان انطباع عام عن النص.</div>", "n": 1, "i": 59, "a": "tefl-43-050", "x": "a6264fea"}, {"t": "learn", "h": "<div class=\"u\">scanning: reading quickly to find specific information.</div><div class=\"u\">المسح القراءي: قراءة بسرعة عشان معلومات محددة.</div>", "n": 1, "i": 60, "a": "tefl-43-051", "x": "92f70427"}, {"t": "learn", "h": "<div class=\"u\">reading for detail: focusing on every word to deduce full meaning.</div><div class=\"u\">القراءة للتفاصيل: التركيز على كل كلمة لاستنتاج المعنى الكامل.</div>", "n": 1, "i": 61, "a": "tefl-43-052", "x": "f841c4fa"}, {"t": "learn", "h": "<div class=\"u\">deducing meaning from context: guessing a word's meaning from the words around it.</div><div class=\"u\">استنتاج المعنى من السياق: تخمين معنى الكلمة من الكلمات اللي حواليها.</div>", "n": 1, "i": 62, "a": "tefl-43-053", "x": "ca51cbd2"}, {"t": "learn", "h": "<div class=\"u\">predicting: using pictures, titles and clues to guess content before reading.</div><div class=\"u\">التوقع: استخدام الصور والعناوين والإشارات لتخمين المحتوى قبل القراءة.</div>", "n": 1, "i": 63, "a": "tefl-43-054", "x": "40159644"}, {"t": "learn", "h": "<div class=\"u\">inferring: understanding the meaning behind the words, like attitudes and opinions.</div><div class=\"u\">الاستنتاج: فهم المعنى اللي ورا الكلمات، زي المواقف والآراء.</div>", "n": 1, "i": 64, "a": "tefl-43-055", "x": "326351f0"}, {"t": "learn", "h": "<div class=\"u\">register: the level of formality of a text.</div><div class=\"u\">المستوى: درجة رسمية النص.</div>", "n": 1, "i": 65, "a": "tefl-43-056", "x": "0271f891"}, {"t": "learn", "h": "<div class=\"u\">intensive reading: short texts with tasks, usually in class.</div><div class=\"u\">القراءة المكثفة: نصوص قصيرة بمهام، عادة في الفصل.</div>", "n": 1, "i": 66, "a": "tefl-43-057", "x": "109ba780"}, {"t": "learn", "h": "<div class=\"u\">extensive reading: longer texts read for pleasure outside class.</div><div class=\"u\">القراءة الممتدة: نصوص أطول بتتقرا للمتعة برا الفصل.</div>", "n": 1, "i": 67, "a": "tefl-43-058", "x": "58b53daf"}, {"t": "learn", "h": "<div class=\"u\">graded reader: a book adapted for EFL learners at different levels.</div><div class=\"u\">القراءة المتدرجة: كتاب متكيّف لمتعلمي الإنجليزية على مستويات مختلفة.</div>", "n": 1, "i": 68, "a": "tefl-43-059", "x": "db1a65e9"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 69}, {"t": "learn", "h": "<div class=\"u\">Reading is a receptive skill, but a complex one: letters, words, sentences, connections, text type and world knowledge all come into play.</div><div class=\"u\">القراءة مهارة استقبالية، بس معقدة: الحروف والكلمات والجمل والروابط ونوع النص ومعرفة العالم كلها بتدخل في اللعبة.</div>", "n": 1, "i": 70, "a": "tefl-43-060", "x": "c1deab59"}, {"t": "learn", "h": "<div class=\"u\">Skim for the general impression, scan for specific information, and read for detail only when you need every word.</div><div class=\"u\">اقرا بسرعة للانطباع العام، امسح لمعلومات محددة، واقرا للتفاصيل بس لما تكون محتاج كل كلمة.</div>", "n": 1, "i": 71, "a": "tefl-43-061", "x": "0dadbd1a"}, {"t": "learn", "h": "<div class=\"u\">Use context to deduce unknown words, predict from pictures and titles, and infer attitudes from register and style.</div><div class=\"u\">استخدم السياق لاستنتاج الكلمات المش معروفة، وتوقع من الصور والعناوين، واستنتج المواقف من المستوى والأسلوب.</div>", "n": 1, "i": 72, "a": "tefl-43-062", "x": "b63a5567"}, {"t": "learn", "h": "<div class=\"u\">A top down reading lesson moves from general to detail: lead-in, predict, pre-teach key vocabulary, skim, scan, detail tasks, vocabulary work, then a follow-on task.</div><div class=\"u\">درس القراءة من فوق لتحت بيتحرك من العام للتفاصيل: مقدمة، توقع، مفردات أساسية، قراءة سريعة، مسح، مهام تفاصيل، شغل مفردات، وبعدين مهمة متابعة.</div>", "n": 1, "i": 73, "a": "tefl-43-063", "x": "d261308b"}, {"t": "learn", "h": "<div class=\"u\">Encourage extensive reading for pleasure with graded readers; it builds linguistic confidence that improves all language areas.</div><div class=\"u\">شجّع القراءة الممتدة للمتعة بالقراءات المتدرجة؛ بتبني ثقة لغوية بتحسّن كل مجالات اللغة.</div>", "n": 1, "i": 74, "a": "tefl-43-064", "x": "fb4d294f"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 75}, {"t": "mc", "q": "Skimming a text means:<br>القراءة السريعة للنص يعني:", "opts": ["reading quickly for a general impression | قراءة بسرعة لانطباع عام", "reading every word carefully | قراءة كل كلمة بعناية", "looking for a phone number | البحث عن رقم تليفون"], "ans": 0, "why": "Skimming gives the overall meaning, like skimming the first pages of a book before buying it. | القراءة السريعة بتدّي المعنى العام، زي قراءة أول صفحات كتاب قبل شرائه.", "ex": ["Correct. | صح.", "No. That is reading for detail. | غلط: دي القراءة للتفاصيل.", "No. That is scanning. | غلط: ده المسح القراءي."], "n": 1, "i": 76, "h": ""}, {"t": "mc", "q": "Which is a typical scanning question?<br>أنهي سؤال مسح قراءي نموذجي؟", "opts": ["What time does the last bus leave? | آخر أتوبيس بيتحرك الساعة كام؟", "What is the writer's attitude? | إيه موقف الكاتب؟", "What is the main idea of the text? | إيه الفكرة الرئيسية للنص؟"], "ans": 0, "why": "Scanning finds a specific piece of information fast. | المسح بيلاقي معلومة محددة بسرعة.", "ex": ["Correct. | صح.", "No. Attitudes are found by inferring. | غلط: المواقف بتتلاقى بالاستنتاج.", "No. The main idea is skimming. | غلط: الفكرة الرئيسية قراءة سريعة."], "n": 1, "i": 77, "h": ""}, {"t": "tf", "q": "In real life we usually read by focusing on every individual word.<br>في الحياة الحقيقية عادة بنقرأ بالتركيز على كل كلمة لوحدها.", "ans": false, "why": "False. Reading for detail happens only on certain occasions, like understanding complex instructions. | غلط. القراءة للتفاصيل بتحصل في مناسبات معينة بس، زي فهم تعليمات معقدة.", "ex": ["Correct. Real life mostly uses skimming and scanning. | صح: الحياة الحقيقية بتستخدم القراءة السريعة والمسح غالبًا.", "Wrong. Detail reading is the exception, not the rule. | غلط: القراءة للتفاصيل استثناء، مش القاعدة."], "n": 1, "i": 78, "h": ""}, {"t": "tf", "q": "When students meet an unknown word, they should always go straight to the dictionary.<br>لما الطلبة يقابلوا كلمة مش معروفة، لازم دايمًا يروحوا للقاموس على طول.", "ans": false, "why": "False. Encourage them to work out the meaning from context first, making an educated guess. | غلط. شجّعهم يستنتجوا المعنى من السياق الأول، بتخمين مبني على علم.", "ex": ["Correct. Context first, dictionary later. | صح: السياق الأول، القاموس بعدين.", "Wrong. Context clues come before the dictionary. | غلط: إشارات السياق بتيجي قبل القاموس."], "n": 1, "i": 79, "h": ""}, {"t": "mc", "q": "Which of these helps students predict a text before reading it?<br>أنهي من دول بيساعد الطلبة يتوقعوا النص قبل قراءته؟", "opts": ["the photographs, title and author's name | الصور والعنوان واسم الكاتب", "the number of pages | عدد الصفحات", "the price of the book | سعر الكتاب"], "ans": 0, "why": "Visual information like pictures, titles, subheadings and even the author's name helps prediction. | المعلومات البصرية زي الصور والعناوين وحتى اسم الكاتب بتساعد التوقع.", "ex": ["Correct. | صح.", "No. Page count gives no content clues. | غلط: عدد الصفحات مابيدّيش إشارات محتوى.", "No. Price is irrelevant to prediction. | غلط: السعر ملوش علاقة بالتوقع."], "n": 1, "i": 80, "h": ""}, {"t": "tf", "q": "Inferring is often practised at higher levels, but tasks can be graded for lower levels too.<br>الاستنتاج غالبًا بيتدرب في المستويات الأعلى، بس المهام ممكن تتدرّج للمستويات الأقل كمان.", "ans": true, "why": "True. Inferring needs more language knowledge, but graded tasks make it accessible to lower levels. | صح. الاستنتاج محتاج معرفة لغوية أكتر، بس المهام المتدرجة بتخليه متاح للمستويات الأقل.", "ex": ["Correct. | صح.", "Wrong. Both halves of the statement are true. | غلط: نصفي الجملة صح."], "n": 1, "i": 81, "h": ""}, {"t": "mc", "q": "In the top down reading lesson plan, the first stage is:<br>في مخطط درس القراءة من فوق لتحت، أول مرحلة هي:", "opts": ["a lead-in discussing the main themes | مقدمة بتناقش المحاور الرئيسية", "scanning for specific information | مسح لمعلومات محددة", "completing a table from the text | إكمال جدول من النص"], "ans": 0, "why": "The lesson starts with a lead-in to spark interest, then prediction, then reading tasks from general to detailed. | الدرس بيبدأ بمقدمة تولّع الاهتمام، وبعدين توقع، وبعدين مهام قراءة من العام للتفصيلي.", "ex": ["Correct. | صح.", "No. Scanning comes after skimming. | غلط: المسح بييجي بعد القراءة السريعة.", "No. The table task comes near the end. | غلط: مهمة الجدول بتيجي قريب من الآخر."], "n": 1, "i": 82, "h": ""}, {"t": "tf", "q": "Extensive reading means using short texts with tasks in class.<br>القراءة الممتدة يعني استخدام نصوص قصيرة بمهام في الفصل.", "ans": false, "why": "False. That is intensive reading. Extensive reading is longer texts like novels, read for pleasure outside class. | غلط. دي القراءة المكثفة. الممتدة هي نصوص أطول زي الروايات، بتتقرا للمتعة برا الفصل.", "ex": ["Correct. That is intensive reading. | صح: دي القراءة المكثفة.", "Wrong. Extensive reading happens outside class, for pleasure. | غلط: القراءة الممتدة بتحصل برا الفصل، للمتعة."], "n": 1, "i": 83, "h": ""}, {"t": "recall", "q": "Name the six reading skills/concepts from this unit.<br>اذكر مهارات ومفاهيم القراءة الستة من الوحدة دي.", "a": "Skimming, scanning, reading for detail, deducing meaning from context, predicting, inferring.<br>القراءة السريعة للفكرة، المسح القراءي، القراءة للتفاصيل، استنتاج المعنى من السياق، التوقع، الاستنتاج.", "n": 1, "i": 84, "h": ""}, {"t": "recall", "q": "Give four features of graded readers.<br>اذكر أربع مميزات للقراءات المتدرجة.", "a": "They are designed for EFL learners; adapted to different levels; have footnotes and glossaries; often include little exercises along the way.<br>مصممة لمتعلمي الإنجليزية؛ متكيّفة لمستويات مختلفة؛ فيها حواشي وقواميس؛ غالبًا فيها تمارين صغيرة على الطريق.", "n": 1, "i": 85, "h": ""}, {"t": "write", "q": "Why is skimming a useful skill for EFL students? (3-4 sentences)<br>ليه القراءة السريعة مهارة مفيدة لطلبة الإنجليزية؟ (٣-٤ جمل).", "key": "tefl-43:1", "a": "Skimming gets students to see the broader structure and meaning of a text without stopping at words they do not know. It also avoids the typical complaint that reading in a foreign language is boring because it is so slow. Instead of looking up every single word in a dictionary, students run their eyes over the text for the overall meaning. This builds confidence and makes them active readers.<br>القراءة السريعة بتخلي الطلبة يشوفوا التركيب الأوسع ومعنى النص من غير ما يقفوا عند كلمات مابيعرفوهاش. وكمان بتتجنب الشكوى المعتادة إن القراءة بلغة أجنبية مملة لأنها بطيئة أوي. بدل البحث عن كل كلمة في القاموس، الطلبة بيجروا بعينهم على النص للمعنى العام. ده بيبني الثقة وبيخليهم قراء نشيطين.", "n": 1, "i": 86, "h": ""}, {"t": "write", "q": "Explain how predicting works before reading a text (3-4 sentences).<br>اشرح إزاي التوقع بيشتغل قبل قراءة النص (٣-٤ جمل).", "key": "tefl-43:2", "a": "Students look at the visual information on the page first: pictures, the title or subheading, even the author's name. These help them predict the genre of the text and its possible content, and even grammatical structures that may appear. For example, a letter of application suggests modal verbs like could and would and fixed expressions. When predictions come true, students feel reassured that they can comprehend more than they thought.<br>الطلبة بيبصوا على المعلومات البصرية في الصفحة الأول: الصور، العنوان أو العنوان الفرعي، حتى اسم الكاتب. دي بتساعدهم يتوقعوا نوع النص الأدبي ومحتواه المحتمل، وحتى تراكيب لغوية ممكن تظهر. مثلًا، خطاب تقديم لوظيفة بيوحي بأفعال ناقصة زي could و would وتعبيرات ثابتة. لما التوقعات بتطلع صح، الطلبة بيطمنوا إنهم يقدروا يفهموا أكتر مما كانوا فاكرين.", "n": 1, "i": 87, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 2, Celia's real reading lesson about Lenny Henry, with eight planning questions and their suggested solutions.</div><div class=\"u\">الدرس الجاي: الوحدة التانية، درس قراءة حقيقي لسيليا عن ليني هنري، بتمن أسئلة تخطيط وحلولها المقترحة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 88}];</script>
