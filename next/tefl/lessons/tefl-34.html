<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٣٤</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-34";window.STEPS=[{"t": "section", "h": "What is lexis? | يعني إيه مفردات لغوية؟", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Grammar and skills are key areas in English teaching, but we must not forget the building blocks: words and their meanings.</div><div class=\"u\">القواعد والمهارات مجالات أساسية في تدريس الإنجليزي، بس لازم ماننساش اللبنات الأساسية: الكلمات ومعانيها.</div>", "n": 1, "i": 1, "a": "tefl-34-001", "x": "20503ec4"}, {"t": "learn", "h": "<div class=\"u\">It is easy to connect an object with its word, like fountain. But a student will not remember a word after hearing it once.</div><div class=\"u\">سهل تربط الحاجة بكلمتها، زي نافورة. بس الطالب مش هيفتكر الكلمة بعد ما يسمعها مرة واحدة.</div>", "n": 1, "i": 2, "a": "tefl-34-002", "x": "eb66a5fd"}, {"t": "learn", "h": "<div class=\"u\">They also will not know all its meanings, its pronunciation, or the different contexts it can be used in.</div><div class=\"u\">وكمان مش هيعرفوا كل معانيها، ولا نطقها، ولا السياقات المختلفة اللي ممكن تتستخدم فيها.</div>", "n": 1, "i": 3, "a": "tefl-34-003", "x": "4a798b3a"}, {"t": "learn", "h": "<div class=\"u\">Learners need to meet vocabulary and expressions again and again to fully understand their correct use.</div><div class=\"u\">المتعلمين محتاجين يقابلوا المفردات والتعبيرات مرة ورا مرة عشان يفهموا استخدامها الصح كويس.</div>", "n": 1, "i": 4, "a": "tefl-34-004", "x": "5bf35640"}, {"t": "learn", "h": "<div class=\"u\">The word vocabulary can be limiting, because it usually refers to single units of the language, that is, words only.</div><div class=\"u\">كلمة مفردات ممكن تكون محدودة، لأنها غالبًا بتشير لوحدات مفردة من اللغة، يعني كلمات بس.</div>", "n": 1, "i": 5, "a": "tefl-34-005", "x": "e76fc155"}, {"t": "learn", "h": "<div class=\"u\">But sometimes a combination of words works as one single item in its meaning.</div><div class=\"u\">بس ساعات مجموعة كلمات بتشتغل كعنصر واحد في المعنى بتاعها.</div>", "n": 1, "i": 6, "a": "tefl-34-006", "x": "fada62c4"}, {"t": "learn", "h": "<div class=\"u\">So what is lexis? It is just words, single or grouped together, which have a specific meaning.</div><div class=\"u\">طب إيه هي المفردات اللغوية؟ هي ببساطة كلمات، مفردة أو متجمعين مع بعض، ليهم معنى محدد.</div>", "n": 1, "i": 7, "a": "tefl-34-007", "x": "910d18cc"}, {"t": "learn", "h": "<div class=\"u\">Examples: house, find out, to have your head in the clouds.</div><div class=\"u\">أمثلة: بيت، يكتشف، يكون سرحان في الأحلام.</div>", "n": 1, "i": 8, "a": "tefl-34-008", "x": "6215361e"}, {"t": "learn", "h": "<div class=\"u\">To use a lexical item well, students must meet it many times and in many different contexts. Only then does it really sink in.</div><div class=\"u\">عشان يستخدموا عنصر لغوي كويس، الطلبة لازم يقابلوه مرات كتير وفي سياقات مختلفة. ساعتها بس بيرسخ فعلًا.</div>", "n": 1, "i": 9, "a": "tefl-34-009", "x": "34d73da4"}, {"t": "learn", "h": "<div class=\"u\">When we talk about meaning, it gets more complicated, because there are different types of meaning.</div><div class=\"u\">لما نتكلم عن المعنى، الموضوع بيبقى أعقد، لأن في أنواع مختلفة من المعنى.</div>", "n": 1, "i": 10, "a": "tefl-34-010", "x": "244c2730"}, {"t": "learn", "h": "<div class=\"u\">The first types: denotative meaning, figurative meaning, compounds, prefixes and suffixes, and collocations.</div><div class=\"u\">أول الأنواع: المعنى الحرفي، المعنى المجازي، الكلمات المركبة، البوادئ واللواحق، والمتلازمات.</div>", "n": 1, "i": 11, "a": "tefl-34-011", "x": "78d8398a"}, {"t": "learn", "h": "<div class=\"u\">And the rest: fixed expressions, idioms, homophones, homonyms, and false friends.</div><div class=\"u\">والباقي: التعبيرات الثابتة، التعابير الاصطلاحية، المتجانسات الصوتية، المشترك اللفظي، والأصدقاء الكدابين.</div>", "n": 1, "i": 12, "a": "tefl-34-012", "x": "1b61044d"}, {"t": "section", "h": "Denotative meaning and compounds | المعنى الحرفي والكلمات المركبة", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">Denotative meaning is the direct meaning of a word. It denotes the thing itself.</div><div class=\"u\">المعنى الحرفي هو المعنى المباشر للكلمة. بيدل على الحاجة نفسها.</div>", "n": 1, "i": 14, "a": "tefl-34-013", "x": "62556087"}, {"t": "learn", "h": "<div class=\"u\">A fountain denotes a man-made structure that shoots out water.</div><div class=\"u\">النافورة بتدل على منشأة من صنع الإنسان بتطلّع مية.</div>", "n": 1, "i": 15, "a": "tefl-34-014", "x": "e89e3231"}, {"t": "learn", "h": "<div class=\"u\">But many words have several denotative meanings. A fountain is also a spring or source of water, or even the head of a stream.</div><div class=\"u\">بس كلمات كتير ليها كذا معنى حرفي. النافورة كمان معناها ينبوع أو مصدر مية، أو حتى منبع النهر.</div>", "n": 1, "i": 16, "a": "tefl-34-015", "x": "bd0f0359"}, {"t": "learn", "h": "<div class=\"u\">Compounds are nouns made up of two or more separate words, like drinking fountain.</div><div class=\"u\">الكلمات المركبة هي أسماء متكوّنة من كلمتين أو أكتر منفصلين، زي نافورة شرب.</div>", "n": 1, "i": 17, "a": "tefl-34-016", "x": "1d89220c"}, {"t": "learn", "h": "<div class=\"u\">The two words exist separately, but together they have one particular meaning: a structure that gives a jet of water you can drink without a cup.</div><div class=\"u\">الكلمتين موجودين لوحدهم، بس مع بعض ليهم معنى واحد محدد: منشأة بتطلّع دفقة مية تقدر تشربها من غير كوباية.</div>", "n": 1, "i": 18, "a": "tefl-34-017", "x": "4f90fde4"}, {"t": "learn", "h": "<div class=\"u\">Compound nouns get their special meaning from being together, even though each word alone has its own distinct meaning.</div><div class=\"u\">الأسماء المركبة بتاخد معناها الخاص من وجودها مع بعض، مع إن كل كلمة لوحدها ليها معنى مختلف.</div>", "n": 1, "i": 19, "a": "tefl-34-018", "x": "c940d9ca"}, {"t": "learn", "h": "<div class=\"u\">Example: phone and book each have their own meaning. Together, phonebook means a directory with an alphabetical list of people and their telephone numbers.</div><div class=\"u\">مثال: تليفون وكتاب كل واحدة ليها معناها. مع بعض، دليل التليفون معناه كتيّب فيه قايمة أبجدية بالناس وأرقام تليفوناتهم.</div>", "n": 1, "i": 20, "a": "tefl-34-019", "x": "b86af27f"}, {"t": "learn", "h": "<div class=\"u\">Practice: match these words to make compound nouns. First group: door, book, jelly, after, eye, side, bath. Second group: bell, shop, room, burn, witness, math, fish.</div><div class=\"u\">تمرين: طابق الكلمات دي عشان تكوّن أسماء مركبة. المجموعة الأولى: باب، كتاب، جيلي، بعد، عين، جنب، حمام. المجموعة التانية: جرس، محل، أوضة، حرق، شاهد، رياضيات، سمك.</div>", "n": 1, "i": 21, "a": "tefl-34-020", "x": "b8ac80c5"}, {"t": "learn", "h": "<div class=\"u\">Answers: doorbell, bookshop, bathroom, sideburn, eyewitness, aftermath, jellyfish.</div><div class=\"u\">الإجابات: جرس الباب، مكتبة، حمام، سوالف، شاهد عيان، العواقب، قنديل البحر.</div>", "n": 1, "i": 22, "a": "tefl-34-021", "x": "c7e3050f"}, {"t": "section", "h": "Figurative meaning and idioms | المعنى المجازي والتعابير", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">Figurative meaning is any meaning that is not literal. It is imaginative, but it still has its origins in the original word.</div><div class=\"u\">المعنى المجازي هو أي معنى مش حرفي. معناه تخيّلي، بس لسه أصله جاي من الكلمة الأصلية.</div>", "n": 1, "i": 24, "a": "tefl-34-022", "x": "ee021c2d"}, {"t": "learn", "h": "<div class=\"u\">Example: fountain of youth. The words come together to talk about something non-literal: a fabled spring that can restore health and youth.</div><div class=\"u\">مثال: نافورة الشباب. الكلمات بتتجمع عشان تتكلم عن حاجة مش حرفية: ينبوع أسطوري يقدر يرجّع الصحة والشباب.</div>", "n": 1, "i": 25, "a": "tefl-34-023", "x": "79cef4d1"}, {"t": "learn", "h": "<div class=\"u\">You would not use it literally. You would not say: turn left on Bridge Street, then pass the fountain of youth until you reach the post office.</div><div class=\"u\">مش هتستخدمها حرفي. مش هتقول: لف شمال في شارع الجسر، وبعدين عدّي نافورة الشباب لحد ما توصل لمكتب البريد.</div>", "n": 1, "i": 26, "a": "tefl-34-024", "x": "f7d3c0a6"}, {"t": "learn", "h": "<div class=\"u\">Fixed expressions are expressions that cannot be changed, like to have mixed feelings or it is up to you.</div><div class=\"u\">التعبيرات الثابتة هي تعبيرات ماتتغيرش، زي تكون مشاعرك مختلطة أو القرار قرارك.</div>", "n": 1, "i": 27, "a": "tefl-34-025", "x": "5579c6b8"}, {"t": "learn", "h": "<div class=\"u\">Idioms are a kind of fixed expression whose meaning cannot be known from the combination of the individual words.</div><div class=\"u\">التعابير الاصطلاحية نوع من التعبيرات الثابتة معناها مابيتعرفش من تجميع الكلمات المفردة.</div>", "n": 1, "i": 28, "a": "tefl-34-026", "x": "68a56f70"}, {"t": "learn", "h": "<div class=\"u\">On the ball does not mean you are standing on top of a ball. It means you are alert and capable.</div><div class=\"u\">على الكورة مش معناها إنك واقف فوق كورة. معناها إنك منتبه وقادر.</div>", "n": 1, "i": 29, "a": "tefl-34-027", "x": "2f0e34e1"}, {"t": "learn", "h": "<div class=\"u\">If you say she is a fountain of knowledge, it does not mean she is a structure spouting knowledge instead of water. It means she is a very knowledgeable person.</div><div class=\"u\">لو قلت إنها نافورة معرفة، ده مش معناه إنها منشأة بتطلّع معرفة بدل المية. معناه إنها شخص عارف كتير أوي.</div>", "n": 1, "i": 30, "a": "tefl-34-028", "x": "bc802529"}, {"t": "section", "h": "Prefixes and suffixes | البوادئ واللواحق", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">With many words, we can add a few letters at the beginning, a prefix, or at the end, a suffix, to change the meaning or the part of speech.</div><div class=\"u\">في كلمات كتير نقدر نضيف شوية حروف في الأول، بادئة، أو في الآخر، لاحقة، عشان نغيّر المعنى أو نوع الكلمة.</div>", "n": 1, "i": 32, "a": "tefl-34-029", "x": "a3f2bb00"}, {"t": "learn", "h": "<div class=\"u\">Common prefixes include mis-, dis-, un-, ir-, il-, im-, in-, ex-, and many more.</div><div class=\"u\">البوادئ الشائعة منها ميس وديس وأن وإير وإل وإم وإن وإكس، وكتير غيرهم.</div>", "n": 1, "i": 33, "a": "tefl-34-030", "x": "88d94ab4"}, {"t": "learn", "h": "<div class=\"u\">Prefixes can alter meaning, and they often actually give a word the opposite meaning, like safe and unsafe.</div><div class=\"u\">البوادئ بتغيّر المعنى، وفي الغالب بتدّي الكلمة المعنى العكسي، زي آمن ومش آمن.</div>", "n": 1, "i": 34, "a": "tefl-34-031", "x": "2e375a0f"}, {"t": "learn", "h": "<div class=\"u\">Practice: which prefix does each word take? The words: sane, responsible, patient, resolved, understand, legal, respectful. The prefixes: mis, un, ir, il, im, in, dis.</div><div class=\"u\">تمرين: كل كلمة بتاخد أنهي بادئة؟ الكلمات: عاقل، مسؤول، صبور، محلول، يفهم، قانوني، محترم. البوادئ: ميس وأن وإير وإل وإم وإن وديس.</div>", "n": 1, "i": 35, "a": "tefl-34-032", "x": "12af8c3a"}, {"t": "learn", "h": "<div class=\"u\">Answers: misunderstand, unresolved, irresponsible, illegal, impatient, insane, disrespectful.</div><div class=\"u\">الإجابات: يسيء الفهم، غير محلول، غير مسؤول، غير قانوني، غير صبور، مجنون، قليل الاحترام.</div>", "n": 1, "i": 36, "a": "tefl-34-033", "x": "2ec0aaca"}, {"t": "learn", "h": "<div class=\"u\">Common suffixes include -ate, -able, -ible, -ism, -ity, -ness, -ship, and more.</div><div class=\"u\">اللواحق الشائعة منها أيت وأبل وإبل وإزم وإتي ونيس وشيب، وغيرهم.</div>", "n": 1, "i": 37, "a": "tefl-34-034", "x": "4d8d65cf"}, {"t": "learn", "h": "<div class=\"u\">Suffixes often change the part of speech, and therefore they change the function of the lexis.</div><div class=\"u\">اللواحق في الغالب بتغيّر نوع الكلمة، وبالتالي بتغيّر وظيفة المفردة.</div>", "n": 1, "i": 38, "a": "tefl-34-035", "x": "e945465d"}, {"t": "learn", "h": "<div class=\"u\">If read is a verb, we can add -er to make reader, a noun, or -able to make readable, an adjective.</div><div class=\"u\">لو يقرا فعل، نقدر نضيف إيه أر عشان نعمل قارئ، اسم، أو أبل عشان نعمل قابل للقراية، صفة.</div>", "n": 1, "i": 39, "a": "tefl-34-036", "x": "f2432e64"}, {"t": "learn", "h": "<div class=\"u\">Practice answers: presentable is an adjective. Refusal is a noun. Friendship is a noun.</div><div class=\"u\">إجابات التمرين: لائق صفة. الرفض اسم. الصداقة اسم.</div>", "n": 1, "i": 40, "a": "tefl-34-037", "x": "186cbcff"}, {"t": "section", "h": "Collocations | المتلازمات اللفظية", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">Collocations are words which occur together regularly and sound right together to a native speaker.</div><div class=\"u\">المتلازمات اللفظية هي كلمات بتيجي مع بعض بانتظام وصوتها بيبقى مظبوط مع بعض لأهل اللغة.</div>", "n": 1, "i": 42, "a": "tefl-34-038", "x": "11bdd3f0"}, {"t": "learn", "h": "<div class=\"u\">They can be strong or weak, depending on how often we hear them together in the language.</div><div class=\"u\">ممكن تكون قوية أو ضعيفة، حسب قد إيه بنسمعها مع بعض في اللغة.</div>", "n": 1, "i": 43, "a": "tefl-34-039", "x": "019214e6"}, {"t": "learn", "h": "<div class=\"u\">Strong collocations occur very often: break someone's heart, drive safely, fast food.</div><div class=\"u\">المتلازمات القوية بتتكرر كتير أوي: تكسر قلب حد، تسوق بأمان، أكل سريع.</div>", "n": 1, "i": 44, "a": "tefl-34-040", "x": "182507f1"}, {"t": "learn", "h": "<div class=\"u\">It would sound wrong to say crack a heart, drive well, or quick food, even though technically the meaning would be more or less the same.</div><div class=\"u\">هيبقى صوتها غلط لو قلت تشرّخ قلب، تسوق كويس، أو أكل سريع بلفظ تاني، مع إن المعنى نظريًا هيبقى تقريبًا نفسه.</div>", "n": 1, "i": 45, "a": "tefl-34-041", "x": "fa3cb52a"}, {"t": "learn", "h": "<div class=\"u\">Weak collocations occur less often but still go together naturally, like prices dropped or dabble in politics.</div><div class=\"u\">المتلازمات الضعيفة بتتكرر أقل بس لسه بتتجمع طبيعي، زي الأسعار نزلت أو يخوض غمار السياسة.</div>", "n": 1, "i": 46, "a": "tefl-34-042", "x": "db31d020"}, {"t": "section", "h": "Homophones and homonyms | المتجانسات الصوتية والمشترك اللفظي", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">A homophone is a word that is pronounced the same way as another word but is spelt differently and has a different meaning.</div><div class=\"u\">المتجانس الصوتي هو كلمة بتتنطق زي كلمة تانية بالظبط بس بتتكتب مختلف وليها معنى مختلف.</div>", "n": 1, "i": 48, "a": "tefl-34-043", "x": "e7518f91"}, {"t": "learn", "h": "<div class=\"u\">There are many homophones in English, and they can be quite confusing for language learners.</div><div class=\"u\">في متجانسات صوتية كتير في الإنجليزي، وممكن تلخبط المتعلمين جدًا.</div>", "n": 1, "i": 49, "a": "tefl-34-044", "x": "befee1e4"}, {"t": "learn", "h": "<div class=\"u\">Common ones include your and you're, see and sea, their, there and they're, for and four.</div><div class=\"u\">الشائع منها: بتاعك وإنتَ، يشوف والبحر، بتاعهم وهناك وهُما، عشان وأربعة.</div>", "n": 1, "i": 50, "a": "tefl-34-045", "x": "a0d05bed"}, {"t": "learn", "h": "<div class=\"u\">Students can make spelling mistakes which can change the entire meaning of the sentence, so you may need to use your imagination when marking their written work!</div><div class=\"u\">الطلبة ممكن يعملوا أخطاء إملائية تغيّر معنى الجملة كلها، فممكن تحتاج تستخدم خيالك وإنت بتصحّح شغلهم المكتوب!</div>", "n": 1, "i": 51, "a": "tefl-34-046", "x": "cf5d5a8e"}, {"t": "learn", "h": "<div class=\"u\">Homonyms have the same pronunciation and the same spelling, but different meanings depending on their context.</div><div class=\"u\">المشترك اللفظي ليه نفس النطق ونفس الهجاء، بس معانيه مختلفة حسب السياق.</div>", "n": 1, "i": 52, "a": "tefl-34-047", "x": "8895d04c"}, {"t": "learn", "h": "<div class=\"u\">Example: there is a bear in the woods refers to the animal. But I bear the brunt of the work means to have the worst of it.</div><div class=\"u\">مثال: في دب في الغابة بتقصد الحيوان. بس أنا شايل العبء الأكبر من الشغل معناها إني واخد أسوأ جزء منه.</div>", "n": 1, "i": 53, "a": "tefl-34-048", "x": "78d3d2b8"}, {"t": "section", "h": "False friends | الأصدقاء الكدابين", "n": 1, "i": 54}, {"t": "learn", "h": "<div class=\"u\">False friends are especially important in language learning. They are words which look alike in the student's native language but have very different meanings.</div><div class=\"u\">الأصدقاء الكدابين مهمين جدًا في تعلم اللغة. هُم كلمات شبه بعض في لغة الطالب الأم بس معانيهم مختلفة جدًا.</div>", "n": 1, "i": 55, "a": "tefl-34-049", "x": "0b7cfaff"}, {"t": "learn", "h": "<div class=\"u\">Some can be harmless. For example, the French word achèvement does not mean achievement; it means completion.</div><div class=\"u\">بعضهم ممكن يكون بريء. مثال، الكلمة الفرنسية أشيفمان مش معناها إنجاز؛ معناها اكتمال.</div>", "n": 1, "i": 56, "a": "tefl-34-050", "x": "ea6371dc"}, {"t": "learn", "h": "<div class=\"u\">But others may be quite amusing or even impolite, so you do need to watch out.</div><div class=\"u\">بس غيرهم ممكن يكونوا مضحكين أو حتى وقحين، فلازم تاخد بالك فعلًا.</div>", "n": 1, "i": 57, "a": "tefl-34-051", "x": "ee50b11b"}, {"t": "learn", "h": "<div class=\"u\">Never translate preservative into Italian as preservativo, for example, because it actually means condom.</div><div class=\"u\">أبدًا ماتترجم مادة حافظة للإيطالي بريزيرفاتيفو مثلًا، لأنها فعلًا معناها واقي ذكري.</div>", "n": 1, "i": 58, "a": "tefl-34-052", "x": "5b3774ee"}, {"t": "learn", "h": "<div class=\"u\">If you have a class who all share the same mother tongue, you could even plan a fun lesson around avoiding common false friends from and into that language.</div><div class=\"u\">لو عندك فصل كله بيتكلم نفس اللغة الأم، ممكن حتى تجهّز درس ممتع عن تجنّب الأصدقاء الكدابين الشائعين من وإلى اللغة دي.</div>", "n": 1, "i": 59, "a": "tefl-34-053", "x": "0b24ddb0"}, {"t": "learn", "h": "<div class=\"u\">With a class of mixed mother tongues it is not so simple, but you can still draw their attention to false friends as they crop up.</div><div class=\"u\">مع فصل لغاته الأم مختلطة الموضوع مش بنفس البساطة، بس لسه تقدر تلفت انتباههم للأصدقاء الكدابين كل ما يظهروا.</div>", "n": 1, "i": 60, "a": "tefl-34-054", "x": "3dbcf01a"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">lexis: words, single or grouped, that have a specific meaning.</div><div class=\"u\">المفردات اللغوية: كلمات، مفردة أو متجمعة، ليها معنى محدد.</div>", "n": 1, "i": 62, "a": "tefl-34-055", "x": "2891bd70"}, {"t": "learn", "h": "<div class=\"u\">lexical item: one unit of lexis, a word or a word group.</div><div class=\"u\">العنصر اللغوي: وحدة واحدة من المفردات، كلمة أو مجموعة كلمات.</div>", "n": 1, "i": 63, "a": "tefl-34-056", "x": "d5c17395"}, {"t": "learn", "h": "<div class=\"u\">denotative meaning: the direct, literal meaning of a word.</div><div class=\"u\">المعنى الحرفي: المعنى المباشر الأساسي للكلمة.</div>", "n": 1, "i": 64, "a": "tefl-34-057", "x": "49aaa807"}, {"t": "learn", "h": "<div class=\"u\">figurative meaning: a non-literal, imaginative meaning.</div><div class=\"u\">المعنى المجازي: معنى مش حرفي، تخيّلي.</div>", "n": 1, "i": 65, "a": "tefl-34-058", "x": "06f9b67d"}, {"t": "learn", "h": "<div class=\"u\">compound noun: a noun made of two or more separate words.</div><div class=\"u\">الاسم المركب: اسم متكوّن من كلمتين أو أكتر منفصلين.</div>", "n": 1, "i": 66, "a": "tefl-34-059", "x": "47d0e140"}, {"t": "learn", "h": "<div class=\"u\">prefix: letters added to the start of a word.</div><div class=\"u\">البادئة: حروف بتتضاف في أول الكلمة.</div>", "n": 1, "i": 67, "a": "tefl-34-060", "x": "1987eb29"}, {"t": "learn", "h": "<div class=\"u\">suffix: letters added to the end of a word.</div><div class=\"u\">اللاحقة: حروف بتتضاف في آخر الكلمة.</div>", "n": 1, "i": 68, "a": "tefl-34-061", "x": "d13aa0ac"}, {"t": "learn", "h": "<div class=\"u\">part of speech: the word class, like noun, verb, adjective.</div><div class=\"u\">نوع الكلمة: فئة الكلمة، زي اسم أو فعل أو صفة.</div>", "n": 1, "i": 69, "a": "tefl-34-062", "x": "091df2e5"}, {"t": "learn", "h": "<div class=\"u\">collocation: words that regularly and naturally go together.</div><div class=\"u\">المتلازمة اللفظية: كلمات بتتجمع بانتظام وطبيعي.</div>", "n": 1, "i": 70, "a": "tefl-34-063", "x": "c81b01a7"}, {"t": "learn", "h": "<div class=\"u\">fixed expression: an expression that cannot be changed.</div><div class=\"u\">التعبير الثابت: تعبير مابيتغيّرش.</div>", "n": 1, "i": 71, "a": "tefl-34-064", "x": "7ebe6d11"}, {"t": "learn", "h": "<div class=\"u\">idiom: a fixed expression whose meaning is not clear from its words.</div><div class=\"u\">التعبير الاصطلاحي: تعبير ثابت معناه مش واضح من كلماته.</div>", "n": 1, "i": 72, "a": "tefl-34-065", "x": "8ea3b9e2"}, {"t": "learn", "h": "<div class=\"u\">homophone: same pronunciation, different spelling and meaning.</div><div class=\"u\">المتجانس الصوتي: نفس النطق، هجاء ومعنى مختلفين.</div>", "n": 1, "i": 73, "a": "tefl-34-066", "x": "15cd6b12"}, {"t": "learn", "h": "<div class=\"u\">homonym: same pronunciation and spelling, different meaning.</div><div class=\"u\">المشترك اللفظي: نفس النطق والهجاء، معنى مختلف.</div>", "n": 1, "i": 74, "a": "tefl-34-067", "x": "0ae143f4"}, {"t": "learn", "h": "<div class=\"u\">false friends: words that look alike in two languages but mean different things.</div><div class=\"u\">الأصدقاء الكدابين: كلمات شبه بعض في لغتين بس معانيهم مختلفة.</div>", "n": 1, "i": 75, "a": "tefl-34-068", "x": "31c90fdb"}, {"t": "learn", "h": "<div class=\"u\">mother tongue, L1: a person's native language.</div><div class=\"u\">اللغة الأم: اللغة الأصلية بتاعة الشخص.</div>", "n": 1, "i": 76, "a": "tefl-34-069", "x": "56c3bbdc"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 77}, {"t": "learn", "h": "<div class=\"u\">Lexis means words, single or grouped, with a specific meaning. Students need to meet each item many times in many contexts.</div><div class=\"u\">المفردات اللغوية يعني كلمات، مفردة أو متجمعة، ليها معنى محدد. الطلبة محتاجين يقابلوا كل عنصر مرات كتير في سياقات كتير.</div>", "n": 1, "i": 78, "a": "tefl-34-070", "x": "569e3c38"}, {"t": "learn", "h": "<div class=\"u\">Denotative meaning is literal; figurative meaning is imaginative but rooted in the original word.</div><div class=\"u\">المعنى الحرفي هو الأصلي؛ المعنى المجازي تخيّلي بس متجذّر في الكلمة الأصلية.</div>", "n": 1, "i": 79, "a": "tefl-34-071", "x": "5e78d491"}, {"t": "learn", "h": "<div class=\"u\">Compounds, prefixes and suffixes build new meanings and change parts of speech.</div><div class=\"u\">الكلمات المركبة والبوادئ واللواحق بتبني معاني جديدة وبتغيّر أنواع الكلمات.</div>", "n": 1, "i": 80, "a": "tefl-34-072", "x": "b5b002c1"}, {"t": "learn", "h": "<div class=\"u\">Collocations are words that sound right together; strong ones cannot be swapped without sounding wrong.</div><div class=\"u\">المتلازمات كلمات صوتها مظبوط مع بعض؛ القوية منها ماتتبدّلش من غير ما الصوت يبقى غلط.</div>", "n": 1, "i": 81, "a": "tefl-34-073", "x": "6232be73"}, {"t": "learn", "h": "<div class=\"u\">Watch homophones, homonyms and false friends: they confuse learners, and false friends can even embarrass.</div><div class=\"u\">خد بالك من المتجانسات الصوتية والمشترك اللفظي والأصدقاء الكدابين: بيلخبطوا المتعلمين، والأصدقاء الكدابين ممكن حتى يحرجوا.</div>", "n": 1, "i": 82, "a": "tefl-34-074", "x": "91bb16ef"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 83}, {"t": "mc", "q": "What is lexis?<br>إيه هي المفردات اللغوية؟", "opts": ["words, single or grouped, with a specific meaning | كلمات، مفردة أو متجمعة، ليها معنى محدد", "only single words | كلمات مفردة بس", "only grammar rules | قواعد بس"], "ans": 0, "why": "Lexis covers single words and word groups that work as one item. | المفردات بتشمل الكلمات المفردة ومجموعات الكلمات اللي بتشتغل كعنصر واحد.", "ex": ["Correct. | صح.", "No. Groups of words count too. | غلط: مجموعات الكلمات كمان بتتعدّ.", "No. Lexis is about words and meaning. | غلط: المفردات عن الكلمات والمعنى."], "n": 1, "i": 84, "h": ""}, {"t": "mc", "q": "Drinking fountain is an example of:<br>نافورة شرب مثال على:", "opts": ["a compound noun | اسم مركب", "an idiom | تعبير اصطلاحي", "a false friend | صديق كداب"], "ans": 0, "why": "Two separate words join to make one noun with its own particular meaning. | كلمتين منفصلين بيتجمعوا عشان يعملوا اسم واحد ليه معنى محدد.", "ex": ["Correct. | صح.", "No. Its meaning is clear from the words. | غلط: معناه واضح من الكلمات.", "No. A false friend tricks you across languages. | غلط: الصديق الكداب بيخدعك بين اللغات."], "n": 1, "i": 85, "h": ""}, {"t": "tf", "q": "Fountain of youth uses the word fountain in its literal meaning.<br>نافورة الشباب بتستخدم كلمة نافورة بمعناها الحرفي.", "ans": false, "why": "False. It is figurative: a fabled spring that restores health and youth. | غلط. ده مجازي: ينبوع أسطوري بيرجّع الصحة والشباب.", "ex": ["Wrong. It is imaginative, not literal. | غلط: ده تخيّلي، مش حرفي.", "Correct. | صح."], "n": 1, "i": 86, "h": ""}, {"t": "mc", "q": "What happens when we add un- to safe?<br>إيه اللي بيحصل لما نضيف أن على آمن؟", "opts": ["we get the opposite meaning | بناخد المعنى العكسي", "we change it to a noun | بنحوّلها لاسم", "nothing changes | مفيش حاجة بتتغيّر"], "ans": 0, "why": "Prefixes often give a word the opposite meaning: safe becomes unsafe. | البوادئ في الغالب بتدّي الكلمة المعنى العكسي: آمن بتبقى مش آمن.", "ex": ["Correct. | صح.", "No. Safe stays an adjective. | غلط: آمن بتفضل صفة.", "No. The meaning flips. | غلط: المعنى بينعكس."], "n": 1, "i": 87, "h": ""}, {"t": "mc", "q": "Refusal, with the suffix -al, is what part of speech?<br>الرفض، باللاحقة أل، أنهي نوع كلمة؟", "opts": ["noun | اسم", "verb | فعل", "adjective | صفة"], "ans": 0, "why": "The suffix -al here turns the verb refuse into the noun refusal. | اللاحقة أل هنا بتحوّل الفعل يرفض لاسم: الرفض.", "ex": ["Correct. | صح.", "No. Refuse is the verb. | غلط: يرفض هو الفعل.", "No. That would be refuseable in form, not refusal. | غلط: الصفة كانت هتتبنى بشكل تاني."], "n": 1, "i": 88, "h": ""}, {"t": "mc", "q": "Break someone's heart is an example of:<br>تكسر قلب حد مثال على:", "opts": ["a strong collocation | متلازمة لفظية قوية", "a homophone | متجانس صوتي", "a compound noun | اسم مركب"], "ans": 0, "why": "The words occur together very often; crack a heart sounds wrong. | الكلمات بتتجمع كتير أوي؛ تشرّخ قلب صوتها غلط.", "ex": ["Correct. | صح.", "No. That is about pronunciation. | غلط: ده عن النطق.", "No. It is a verb phrase, not a joined noun. | غلط: دي عبارة فعلية، مش اسم ملزوق."], "n": 1, "i": 89, "h": ""}, {"t": "tf", "q": "Your and you're are homonyms.<br>بتاعك وإنتَ مشترك لفظي.", "ans": false, "why": "False. They sound the same but are spelt differently, so they are homophones. Homonyms share spelling too. | غلط. نطقهم واحد بس هجائهم مختلف، فهُم متجانسات صوتية. المشترك اللفظي بيتشارك الهجاء كمان.", "ex": ["Wrong. Different spelling makes them homophones. | غلط: الهجاء المختلف بيخليهم متجانسات صوتية.", "Correct. | صح."], "n": 1, "i": 90, "h": ""}, {"t": "mc", "q": "An Egyptian student uses an Arabic-looking English word with the wrong meaning. This is:<br>طالب مصري استخدم كلمة إنجليزي شبه كلمة عربي بس بمعنى غلط. ده:", "opts": ["a false friend | صديق كداب", "a homonym | مشترك لفظي", "a weak collocation | متلازمة ضعيفة"], "ans": 0, "why": "False friends look alike across languages but mean different things. | الأصدقاء الكدابين شبه بعض بين اللغات بس معانيهم مختلفة.", "ex": ["Correct. | صح.", "No. Homonyms are inside one language. | غلط: المشترك اللفظي جوه لغة واحدة.", "No. Collocations are about words that go together. | غلط: المتلازمات عن الكلمات اللي بتتجمع."], "n": 1, "i": 91, "h": ""}, {"t": "recall", "q": "Name at least six of the types of meaning we consider for words.<br>اذكر على الأقل ست أنواع من أنواع المعنى اللي بنراعيها للكلمات.", "a": "Denotative meaning, figurative meaning, compounds, prefixes and suffixes, collocations, fixed expressions, idioms, homophones, homonyms, false friends.<br>المعنى الحرفي، المعنى المجازي، الكلمات المركبة، البوادئ واللواحق، المتلازمات، التعبيرات الثابتة، التعابير الاصطلاحية، المتجانسات الصوتية، المشترك اللفظي، الأصدقاء الكدابين.", "n": 1, "i": 92, "h": ""}, {"t": "recall", "q": "Give the seven compound nouns from the matching exercise.<br>اذكر الأسماء المركبة السبعة من تمرين المطابقة.", "a": "Doorbell, bookshop, bathroom, sideburn, eyewitness, aftermath, jellyfish.<br>جرس الباب، مكتبة، حمام، سوالف، شاهد عيان، العواقب، قنديل البحر.", "n": 1, "i": 93, "h": ""}, {"t": "write", "q": "Why is one meeting with a new word not enough for a student? (3-4 sentences)<br>ليه مقابلة واحدة لكلمة جديدة مش كفاية للطالب؟ (٣-٤ جمل).", "key": "tefl-34:1", "a": "Hearing a word once does not make it stick. A student also needs its different meanings, its pronunciation, and the contexts where it belongs. Meeting the item many times in many different contexts is what makes it sink in. Only then can the student really understand its usage and use it well.<br>سماع الكلمة مرة واحدة مابيخلّيهاش ترسخ. الطالب كمان محتاج معانيها المختلفة، ونطقها، والسياقات اللي بتليق فيها. مقابلة العنصر مرات كتير في سياقات مختلفة هي اللي بتخلّيه يرسخ. ساعتها بس الطالب يقدر يفهم استخدامه فعلًا ويستخدمه كويس.", "n": 1, "i": 94, "h": ""}, {"t": "write", "q": "Explain the difference between homophones and homonyms, with one example of each (3-4 sentences).<br>اشرح الفرق بين المتجانسات الصوتية والمشترك اللفظي، مع مثال لكل واحد (٣-٤ جمل).", "key": "tefl-34:2", "a": "Homophones sound the same but are spelt differently and have different meanings, like see and sea. Homonyms sound the same and are spelt the same, but their meanings change with context, like bear the animal and to bear the brunt of the work. Both confuse learners, but homophones mostly hurt spelling in writing, while homonyms need context to be understood. A teacher should point out both kinds as they appear.<br>المتجانسات الصوتية نطقها واحد بس هجائها مختلف ومعانيها مختلفة، زي يشوف والبحر. المشترك اللفظي نطقه واحد وهجائه واحد، بس معانيه بتتغيّر مع السياق، زي الدب الحيوان ويشيل العبء الأكبر من الشغل. الاتنين بيلخبطوا المتعلمين، بس المتجانسات الصوتية بتأذي الإملاء في الكتابة، بينما المشترك اللفظي محتاج سياق عشان يتفهم. المدرس المفروض ينوّه على النوعين كل ما يظهروا.", "n": 1, "i": 95, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: phonological awareness, the sounds of the language.</div><div class=\"u\">الدرس الجاي: الوعي الصوتي، أصوات اللغة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 96}];</script>
