<script>window.LESSON_ID="tefl-39";window.STEPS=[{"t": "section", "h": "Intonation: what and why | التنغيم: إيه وليه", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Intonation is another important part of pronunciation. It is the movement of the level of the voice: the tune of a sentence or a group of words.</div><div class=\"u\">التنغيم جزء مهم تاني من النطق. هو حركة مستوى الصوت: لحن الجملة أو مجموعة الكلمات.</div>", "n": 1, "i": 1, "a": "tefl-39-001", "x": "86ae6e5e"}, {"t": "learn", "h": "<div class=\"u\">We use intonation to express emotions and attitudes, and to emphasise or make less important particular things we are saying.</div><div class=\"u\">بنستخدم التنغيم عشان نعبّر عن المشاعر والمواقف، وعشان نؤكّد أو نقلّل أهمية حاجات معينة بنقولها.</div>", "n": 1, "i": 2, "a": "tefl-39-002", "x": "624b092d"}, {"t": "learn", "h": "<div class=\"u\">We also use intonation to signal the function of what we are saying: to show we are starting or stopping speaking, or whether we are asking a question or making a statement.</div><div class=\"u\">وبنستخدم التنغيم كمان عشان نوضّح وظيفة اللي بنقوله: نبين إننا بنبدأ أو بننهي الكلام، أو إذا كنا بنسأل سؤال ولا بنقول خبر.</div>", "n": 1, "i": 3, "a": "tefl-39-003", "x": "d367ad7b"}, {"t": "section", "h": "Intonation practice | تمرين التنغيم", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">Practice: say School's just finished with these meanings: as a statement of fact, with surprise, with happiness, as a question, and to emphasise just.</div><div class=\"u\">تمرين: قول المدرسة خلصت للتو بالمعاني دي: كخبر، بدهشة، بفرح، كسؤال، وللتأكيد على للتو.</div>", "n": 1, "i": 5, "a": "tefl-39-004", "x": "7813c651"}, {"t": "learn", "h": "<div class=\"u\">You should hear the level of your voice rising and falling in different patterns.</div><div class=\"u\">المفروض تسمع مستوى صوتك بيطلع وينزل في أنماط مختلفة.</div>", "n": 1, "i": 6, "a": "tefl-39-005", "x": "a7c5a24b"}, {"t": "learn", "h": "<div class=\"u\">Another example: think of all the ways to say she didn't marry him because of his money.</div><div class=\"u\">مثال تاني: فكّر في كل الطرق اللي تقول بيها هي ماتجوزتهوش عشان فلوسه.</div>", "n": 1, "i": 7, "a": "tefl-39-006", "x": "d4ead134"}, {"t": "learn", "h": "<div class=\"u\">As a plain statement. Then: but his second wife did. Then as a strong denial. Then: but that is what first got her interested.</div><div class=\"u\">كخبر عادي. وبعدين: بس مراته التانية عملت. وبعدين كنفي قوي. وبعدين: بس ده اللي جذب اهتمامها أول حاجة.</div>", "n": 1, "i": 8, "a": "tefl-39-007", "x": "33bc9a1f"}, {"t": "learn", "h": "<div class=\"u\">Then: he does not have any. Then: that was not the main reason but maybe a factor. Then: she married him for love. And finally as a question: did she?</div><div class=\"u\">وبعدين: هو ماعندوش أصلًا. وبعدين: ده مكانش السبب الرئيسي بس ممكن عامل. وبعدين: هي اتجوزته حب. وأخيرًا كسؤال: صحيح ماتجوزتوش عشان فلوسه؟</div>", "n": 1, "i": 9, "a": "tefl-39-008", "x": "e5298a3c"}, {"t": "learn", "h": "<div class=\"u\">Think about how your voice rises and falls when you express uncertainty, indignation, or exasperation. You may say the word more loudly, in a higher pitch, or drag it out, saying it more slowly.</div><div class=\"u\">فكّر إزاي صوتك بيطلع وينزل لما بتعبّر عن عدم اليقين أو الاستنكار أو الضيق. ممكن تقول الكلمة أعلى، أو بنبرة أحادّ، أو تسحبها وتقولها أبطأ.</div>", "n": 1, "i": 10, "a": "tefl-39-009", "x": "f43275e7"}, {"t": "learn", "h": "<div class=\"u\">Pausing at different parts of the sentence can also change meaning dramatically, in both spoken and written English.</div><div class=\"u\">الوقفة في أجزاء مختلفة من الجملة كمان ممكن تغيّر المعنى بشكل كبير، في الإنجليزي المنطوق والمكتوب.</div>", "n": 1, "i": 11, "a": "tefl-39-010", "x": "7540d6b9"}, {"t": "learn", "h": "<div class=\"u\">Compare: the people who left suddenly started running. Versus: the people who left, suddenly started running. Versus: the people who left suddenly, started running.</div><div class=\"u\">قارن: الناس اللي سابت فجأة بدأت تجري. مقابل: الناس اللي سابت، فجأة بدأت تجري. مقابل: الناس اللي سابت فجأة، بدأت تجري.</div>", "n": 1, "i": 12, "a": "tefl-39-011", "x": "af258655"}, {"t": "learn", "h": "<div class=\"u\">And: I like Italian art and opera. Versus: I like Italian art, and opera. Versus: I like, Italian art and opera.</div><div class=\"u\">و: بحب الفن الإيطالي والأوبرا. مقابل: بحب الفن الإيطالي، والأوبرا. مقابل: بحب، الفن الإيطالي والأوبرا.</div>", "n": 1, "i": 13, "a": "tefl-39-012", "x": "de748ba8"}, {"t": "learn", "h": "<div class=\"u\">And: my sister who lives in Hong Kong has a penthouse. Versus: my sister, who lives in Hong Kong, has a penthouse. Versus: my sister who lives in Hong Kong, has a penthouse.</div><div class=\"u\">و: أختي اللي عايشة في هونج كونج عندها بنتهاوس. مقابل: أختي، اللي عايشة في هونج كونج، عندها بنتهاوس. مقابل: أختي اللي عايشة في هونج كونج، عندها بنتهاوس.</div>", "n": 1, "i": 14, "a": "tefl-39-013", "x": "f0236bdf"}, {"t": "section", "h": "Match-up + teaching tips | المطابقة + نصايح التدريس", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">Match-up answers: strong anger or denial is I DID NOT say you stole my hat, with the stress on did not.</div><div class=\"u\">إجابات المطابقة: الغضب القوي أو النفي هو أنا ما قلتش إنك سرقت قبعتي، بنبر على ما قلتش.</div>", "n": 1, "i": 16, "a": "tefl-39-014", "x": "a8c28405"}, {"t": "learn", "h": "<div class=\"u\">Hostility is HOW do you know Sarah, with the stress on how.</div><div class=\"u\">العدائية هي عارف سارة إزاي، بنبر على إزاي.</div>", "n": 1, "i": 17, "a": "tefl-39-015", "x": "af8545e5"}, {"t": "learn", "h": "<div class=\"u\">Confusion is What HAVE you done, with the stress on have.</div><div class=\"u\">الحيرة هي عملت إيه بالظبط، بنبر على عملت.</div>", "n": 1, "i": 18, "a": "tefl-39-016", "x": "f4713b91"}, {"t": "learn", "h": "<div class=\"u\">Different intonation patterns can show many different meanings. However, there is no short and simple way of describing how the patterns relate to meanings.</div><div class=\"u\">أنماط التنغيم المختلفة ممكن توضّح معاني كتير مختلفة. بس مفيش طريقة قصيرة وبسيطة توصف إزاي الأنماط مرتبطة بالمعاني.</div>", "n": 1, "i": 19, "a": "tefl-39-017", "x": "70c65036"}, {"t": "learn", "h": "<div class=\"u\">Intonation patterns can be demonstrated with arrows on the board or hand gestures to show the musical pattern.</div><div class=\"u\">أنماط التنغيم ممكن تتوضّح بأسهم على السبورة أو إشارات إيد تعرض النمط الموسيقي.</div>", "n": 1, "i": 20, "a": "tefl-39-018", "x": "745680a1"}, {"t": "learn", "h": "<div class=\"u\">Wherever possible, speak in a normal manner without a distorted intonation pattern. This gives students a better model to follow.</div><div class=\"u\">قد ما تقدر، اتكلم بشكل طبيعي من غير نمط تنغيم مشوّه. ده بيدّي الطلبة نموذج أحسن يتبعوه.</div>", "n": 1, "i": 21, "a": "tefl-39-019", "x": "d0f042e2"}, {"t": "section", "h": "Rhythm | الإيقاع", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">Sentence stress is what gives English its rhythm or beat.</div><div class=\"u\">نبر الجملة هو اللي بيدّي الإنجليزي إيقاعه أو ضربته.</div>", "n": 1, "i": 23, "a": "tefl-39-020", "x": "1daec707"}, {"t": "learn", "h": "<div class=\"u\">Look at this sentence: will you CLOSE the DOOR because he's GONE to WORK? The four key content words, close, door, gone, work, are stressed.</div><div class=\"u\">بص على الجملة دي: ممكن تقفل الباب لأنه راح الشغل؟ كلمات المحتوى الأربعة الأساسية، تقفل، الباب، راح، الشغل، منبّرة.</div>", "n": 1, "i": 24, "a": "tefl-39-021", "x": "6e5c63a3"}, {"t": "learn", "h": "<div class=\"u\">Why is this important? Because it adds music to the language. It is the rhythm of English. It changes the speed at which we speak, and listen.</div><div class=\"u\">ليه ده مهم؟ لأنه بيضيف موسيقى للغة. ده إيقاع الإنجليزي. بيغيّر السرعة اللي بنتكلم بيها، ونسمع.</div>", "n": 1, "i": 25, "a": "tefl-39-022", "x": "963ba2ed"}, {"t": "learn", "h": "<div class=\"u\">The time between each stressed word is the same. There is one syllable between close and door, and three syllables between door and gone. But the time is the same.</div><div class=\"u\">الوقت بين كل كلمتين منبّرتين واحد. في مقطع واحد بين تقفل والباب، وتلات مقاطع بين الباب وراح. بس الوقت واحد.</div>", "n": 1, "i": 26, "a": "tefl-39-023", "x": "04f01817"}, {"t": "learn", "h": "<div class=\"u\">We keep a constant beat on the stressed words. So we say the more slowly, and because I've more quickly.</div><div class=\"u\">بنحافظ على ضربة ثابتة على الكلمات المنبّرة. فبنقول ال أبطأ، و لأنه هو أسرع.</div>", "n": 1, "i": 27, "a": "tefl-39-024", "x": "26e91933"}, {"t": "learn", "h": "<div class=\"u\">We change the speed of the small structure words so that the rhythm of the key content words stays the same.</div><div class=\"u\">بنغيّر سرعة كلمات التركيب الصغيرة عشان إيقاع كلمات المحتوى الأساسية يفضل واحد.</div>", "n": 1, "i": 28, "a": "tefl-39-025", "x": "4b319334"}, {"t": "section", "h": "Natural speech | الكلام الطبيعي", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Students need to hear natural, fast, relaxed pronunciation as we speak it every day, not a carefully over-articulated one-word-by-one-word phrasing.</div><div class=\"u\">الطلبة محتاجين يسمعوا النطق الطبيعي السريع المرتاح زي ما بنتكلم بيه كل يوم، مش صياغة متكلفة كلمة كلمة.</div>", "n": 1, "i": 30, "a": "tefl-39-026", "x": "f3c82ebc"}, {"t": "learn", "h": "<div class=\"u\">Speaking too slowly and too emphatically is a common characteristic of the inexperienced teacher.</div><div class=\"u\">الكلام البطيء أوي والمؤكد أوي صفة شائعة في المدرس قليل الخبرة.</div>", "n": 1, "i": 31, "a": "tefl-39-027", "x": "7f77a5ef"}, {"t": "learn", "h": "<div class=\"u\">Speaking unnaturally has a detrimental effect: your learners will imitate your style and speak unnaturally too. And they will not recognise natural rapid speech when they hear it.</div><div class=\"u\">الكلام غير الطبيعي ليه تأثير ضار: المتعلمين هيقلّدوا أسلوبك ويتكلموا بشكل غير طبيعي هُم كمان. ومش هيتعرّفوا أو يفهموا الكلام السريع الطبيعي لما يسمعوه.</div>", "n": 1, "i": 32, "a": "tefl-39-028", "x": "b2f9bc4b"}, {"t": "learn", "h": "<div class=\"u\">This does not mean you should not slow down a bit to help students get basic ideas. But speak naturally most of the time, and teach them what natural speech sounds like.</div><div class=\"u\">ده مش معناه إنك ماتبطّئش شوية عشان تساعد الطلبة يمسكوا الأفكار الأساسية. بس اتكلم طبيعي معظم الوقت، وعلّمهم الكلام الطبيعي بيبقى عامل إزاي.</div>", "n": 1, "i": 33, "a": "tefl-39-029", "x": "9c76cbd5"}, {"t": "learn", "h": "<div class=\"u\">There is some evidence that if students do not speak naturally, they will not recognise normal speech when they hear it.</div><div class=\"u\">في شوية أدلة إن لو الطلبة مابيتكلموش طبيعي، مش هيتعرّفوا على الكلام العادي لما يسمعوه.</div>", "n": 1, "i": 34, "a": "tefl-39-030", "x": "8c8ca66e"}, {"t": "learn", "h": "<div class=\"u\">Examples: How much is it? sounds something like How muh chi zit? And Don't eat apples! sounds something like Don tea tapples!</div><div class=\"u\">أمثلة: بكام ده؟ صوتها زي بكامد؟ تقريبًا. وماتكلش تفاح! صوتها زي ماتكلتفاح! تقريبًا.</div>", "n": 1, "i": 35, "a": "tefl-39-031", "x": "3af2da33"}, {"t": "learn", "h": "<div class=\"u\">If you habitually over-enunciate, your students will listen for How much is it? and will not understand when they hear the normal How muh chi zit?</div><div class=\"u\">لو عادتك اللفظ المبالغ فيه، طلبتك هيدوّروا على بكام ده؟ ومش هيفهموا لما يسمعوا بكامد؟ الطبيعية.</div>", "n": 1, "i": 36, "a": "tefl-39-032", "x": "8391dccd"}, {"t": "learn", "h": "<div class=\"u\">You need to instruct your students in these differences: how to pronounce them and how to listen for them.</div><div class=\"u\">محتاج تعلّم طلبتك الفروق دي: إزاي ينطقوها وإزاي يسمعوها.</div>", "n": 1, "i": 37, "a": "tefl-39-033", "x": "53d43e9b"}, {"t": "section", "h": "Linking + unit questions | الربط + أسئلة الوحدة", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">The idea of the end of one word connecting to the beginning of the next word is called linking.</div><div class=\"u\">فكرة إن آخر الكلمة بيتوصّل بأول الكلمة اللي بعدها بتتسمى الربط.</div>", "n": 1, "i": 39, "a": "tefl-39-034", "x": "f968008a"}, {"t": "learn", "h": "<div class=\"u\">Linking is a naturally occurring phenomenon in the speech of every native speaker of English. It is not the result of sloppy or defective speech.</div><div class=\"u\">الربط ظاهرة طبيعية في كلام كل متحدث أصلي للإنجليزي. مش نتيجة كلام مهمل أو معيوب.</div>", "n": 1, "i": 40, "a": "tefl-39-035", "x": "5f39f05d"}, {"t": "learn", "h": "<div class=\"u\">One major feature of linking: when a word ending in a consonant sound comes before a word beginning with a vowel sound, as in don't eat apples.</div><div class=\"u\">ميزة رئيسية في الربط: لما كلمة بتنتهي بصوت ساكن تيجي قبل كلمة بتبدأ بصوت متحرك، زي في ماتكلش تفاح.</div>", "n": 1, "i": 41, "a": "tefl-39-036", "x": "90443bfc"}, {"t": "learn", "h": "<div class=\"u\">The consonant at the end of don't runs into the vowel at the beginning of eat, and the consonant at the end of eat runs into the vowel at the beginning of apples. So it sounds like don tea tapples.</div><div class=\"u\">الساكن في آخر مات راح داخل في المتحرك في أول كُل، والساكن في آخر كُل راح داخل في المتحرك في أول تفاح. فصوتها بيبقى ماتكلتفاح.</div>", "n": 1, "i": 42, "a": "tefl-39-037", "x": "578242f1"}, {"t": "learn", "h": "<div class=\"u\">Many learners of English tend to separate out the words into distinct units, so their speech sounds staccato.</div><div class=\"u\">متعلمين إنجليزي كتير بيميلوا يفصلوا الكلمات لوحدات منفصلة، فكلامهم بيطلع متقطع.</div>", "n": 1, "i": 43, "a": "tefl-39-038", "x": "df9a3c10"}, {"t": "learn", "h": "<div class=\"u\">There are other structural features that cause linking, for example linking between a word that ends in a vowel sound and a second word that begins with a vowel sound.</div><div class=\"u\">في ميزات تركيبية تانية بتسبب الربط، مثال الربط بين كلمة بتنتهي بصوت متحرك وكلمة تانية بتبدأ بصوت متحرك.</div>", "n": 1, "i": 44, "a": "tefl-39-039", "x": "1455397e"}, {"t": "learn", "h": "<div class=\"u\">Encourage your students at least to attempt these linking features, because they are so common in normal speech. This raises their awareness of them and makes listening easier.</div><div class=\"u\">شجّع طلبتك على الأقل يحاولوا يقارّبوا ميزات الربط دي، لأنها منتشرة أوي في الكلام العادي. ده بيرفع وعيهم بيها وبيخلّي الاستماع أسهل.</div>", "n": 1, "i": 45, "a": "tefl-39-040", "x": "6738dc9a"}, {"t": "learn", "h": "<div class=\"u\">You have now finished all the phonology input in the three units. Well done!</div><div class=\"u\">إنت كده خلّصت كل مدخلات الصوتيات في الوحدات التلاتة. برافو!</div>", "n": 1, "i": 46, "a": "tefl-39-041", "x": "63f406c1"}, {"t": "section", "h": "Unit 4 questions | أسئلة الوحدة ٤", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">Question one: students will do well in pronunciation if the pronunciation episode is not run in isolation and becomes an integral part of communication in class. True.</div><div class=\"u\">سؤال واحد: الطلبة هيبلوا كويس في النطق لو فقرة النطق مش منعزلة وبقت جزء أساسي من التواصل في الفصل. صح.</div>", "n": 1, "i": 48, "a": "tefl-39-042", "x": "40e2794a"}, {"t": "learn", "h": "<div class=\"u\">Question two: a phonemic chart provides a set of symbols, each representing an individual sound of the language, irrespective of how it appears in the standard written script. True.</div><div class=\"u\">سؤال اتنين: خريطة الفونيمات بتوفر مجموعة رموز، كل واحد بيمثل صوت مفرد من اللغة، بغض النظر عن شكله في الكتابة العادية. صح.</div>", "n": 1, "i": 49, "a": "tefl-39-043", "x": "244cdb32"}, {"t": "learn", "h": "<div class=\"u\">Question three: a diphthong is a vowel sound composed of one vowel. False. It is composed of a sequence of two vowels.</div><div class=\"u\">سؤال تلاتة: المتحرك المزدوج هو صوت متحرك متكوّن من متحرك واحد. غلط. هو متكوّن من تسلسل متحركين.</div>", "n": 1, "i": 50, "a": "tefl-39-044", "x": "5c61acfc"}, {"t": "learn", "h": "<div class=\"u\">Question four: one word has only one stress. True.</div><div class=\"u\">سؤال أربعة: الكلمة الواحدة ليها نبر واحد بس. صح.</div>", "n": 1, "i": 51, "a": "tefl-39-045", "x": "1e6371ba"}, {"t": "learn", "h": "<div class=\"u\">Question five: we use intonation to express emotions and attitudes, and to emphasise or make less important particular things we are saying. True.</div><div class=\"u\">سؤال خمسة: بنستخدم التنغيم عشان نعبّر عن المشاعر والمواقف، وعشان نؤكّد أو نقلّل أهمية حاجات معينة بنقولها. صح.</div>", "n": 1, "i": 52, "a": "tefl-39-046", "x": "3df69c89"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 53}, {"t": "learn", "h": "<div class=\"u\">intonation: the movement of the level of the voice, the tune.</div><div class=\"u\">التنغيم: حركة مستوى الصوت، اللحن.</div>", "n": 1, "i": 54, "a": "tefl-39-047", "x": "eb48e02b"}, {"t": "learn", "h": "<div class=\"u\">rhythm: the beat created by sentence stress.</div><div class=\"u\">الإيقاع: الضربة اللي بينشئها نبر الجملة.</div>", "n": 1, "i": 55, "a": "tefl-39-048", "x": "d884defc"}, {"t": "learn", "h": "<div class=\"u\">linking: connecting the end of one word to the beginning of the next.</div><div class=\"u\">الربط: توصيل آخر الكلمة بأول الكلمة اللي بعدها.</div>", "n": 1, "i": 56, "a": "tefl-39-049", "x": "12341508"}, {"t": "learn", "h": "<div class=\"u\">pitch: how high or low the voice is.</div><div class=\"u\">النبرة: قد إيه الصوت عالي أو واطي.</div>", "n": 1, "i": 57, "a": "tefl-39-050", "x": "051f66ef"}, {"t": "learn", "h": "<div class=\"u\">pause: a short stop inside or between sentences.</div><div class=\"u\">الوقفة: وقف قصير جوه الجملة أو بين الجمل.</div>", "n": 1, "i": 58, "a": "tefl-39-051", "x": "b17685b3"}, {"t": "learn", "h": "<div class=\"u\">staccato: speech with words separated into distinct units.</div><div class=\"u\">متقطع: كلام كلماته منفصلة لوحدات متقطعة.</div>", "n": 1, "i": 59, "a": "tefl-39-052", "x": "cf968b85"}, {"t": "learn", "h": "<div class=\"u\">natural speech: fast, relaxed, everyday pronunciation.</div><div class=\"u\">الكلام الطبيعي: نطق سريع ومرتاح بتاع كل يوم.</div>", "n": 1, "i": 60, "a": "tefl-39-053", "x": "312a85a6"}, {"t": "learn", "h": "<div class=\"u\">over-articulation: pronouncing too carefully, word by word.</div><div class=\"u\">اللفظ المبالغ فيه: نطق متكلف أوي، كلمة كلمة.</div>", "n": 1, "i": 61, "a": "tefl-39-054", "x": "2477c020"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Intonation is the tune of the sentence: it carries emotions, attitudes, emphasis, and the question-or-statement signal.</div><div class=\"u\">التنغيم هو لحن الجملة: بيحمل المشاعر والمواقف والتأكيد وإشارة سؤال-ولا-خبر.</div>", "n": 1, "i": 63, "a": "tefl-39-055", "x": "95eb4f4a"}, {"t": "learn", "h": "<div class=\"u\">Where you pause can change the meaning completely, in speech and in writing.</div><div class=\"u\">فين بتقف ممكن يغيّر المعنى بالكامل، في الكلام والكتابة.</div>", "n": 1, "i": 64, "a": "tefl-39-056", "x": "79ea1395"}, {"t": "learn", "h": "<div class=\"u\">Sentence stress gives English its beat: the time between stressed words stays constant.</div><div class=\"u\">نبر الجملة بيدّي الإنجليزي ضربته: الوقت بين الكلمات المنبّرة بيفضل ثابت.</div>", "n": 1, "i": 65, "a": "tefl-39-057", "x": "ca66b364"}, {"t": "learn", "h": "<div class=\"u\">Linking joins words together: consonant to vowel, as in don tea tapples. It is natural, not sloppy.</div><div class=\"u\">الربط بيلزق الكلمات في بعض: ساكن في متحرك، زي ماتكلتفاح. ده طبيعي، مش مهمل.</div>", "n": 1, "i": 66, "a": "tefl-39-058", "x": "cc37037f"}, {"t": "learn", "h": "<div class=\"u\">Speak naturally most of the time; students who only hear slow over-articulated English will not understand real speech.</div><div class=\"u\">اتكلم طبيعي معظم الوقت؛ الطلبة اللي بيسمعوا بس إنجليزي بطيء متكلف مش هيفهموا الكلام الحقيقي.</div>", "n": 1, "i": 67, "a": "tefl-39-059", "x": "8b1f3aff"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 68}, {"t": "mc", "q": "Intonation is:<br>التنغيم هو:", "opts": ["the movement of the level of the voice, the tune | حركة مستوى الصوت، اللحن", "the spelling of sounds | هجاء الأصوات", "the speed of reading | سرعة القراية"], "ans": 0, "why": "Intonation is the rising and falling tune of a sentence or group of words. | التنغيم هو لحن الجملة أو مجموعة الكلمات الطالع النازل.", "ex": ["Correct. | صح.", "No. That belongs to writing. | غلط: ده بتاع الكتابة.", "No. That is pacing, not tune. | غلط: دي السرعة، مش اللحن."], "n": 1, "i": 69, "h": ""}, {"t": "tf", "q": "We use intonation to express emotions and attitudes, and to emphasise or make less important particular things we are saying.<br>بنستخدم التنغيم عشان نعبّر عن المشاعر والمواقف، وعشان نؤكّد أو نقلّل أهمية حاجات معينة بنقولها.", "ans": true, "why": "True. It also signals function: question versus statement, starting or stopping. | صح. وكمان بيوضّح الوظيفة: سؤال مقابل خبر، بداية أو نهاية كلام.", "ex": ["Correct. | صح.", "Wrong. Those are exactly its uses. | غلط: دول بالظبط استخداماته."], "n": 1, "i": 70, "h": ""}, {"t": "tf", "q": "A diphthong is a vowel sound that is composed of one vowel.<br>المتحرك المزدوج هو صوت متحرك متكوّن من متحرك واحد.", "ans": false, "why": "False. It is composed of a sequence of two vowels gliding together. | غلط. هو متكوّن من تسلسل متحركين بينزلقوا مع بعض.", "ex": ["Wrong. Two vowels, one syllable. | غلط: متحركين، مقطع واحد.", "Correct. | صح."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "What gives English its rhythm or beat?<br>إيه اللي بيدّي الإنجليزي إيقاعه أو ضربته؟", "opts": ["sentence stress | نبر الجملة", "spelling | الهجاء", "vocabulary size | حجم المفردات"], "ans": 0, "why": "The constant beat on stressed content words creates the rhythm. | الضربة الثابتة على كلمات المحتوى المنبّرة بتنشئ الإيقاع.", "ex": ["Correct. | صح.", "No. Rhythm is spoken, not written. | غلط: الإيقاع منطوق، مش مكتوب.", "No. Words alone do not make the beat. | غلط: الكلمات لوحدها مابتعملش الضربة."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "Don't eat apples in natural speech sounds like don tea tapples because of:<br>ماتكلش تفاح في الكلام الطبيعي صوتها زي ماتكلتفاح بسبب:", "opts": ["linking: consonants running into following vowels | الربط: السواكن بتدخل في المتحركات اللي بعدها", "sloppy defective speech | كلام مهمل معيوب", "a spelling mistake | غلطة إملائية"], "ans": 0, "why": "The final consonant of each word runs into the next word's opening vowel. It is natural, not sloppy. | الساكن الأخير في كل كلمة بيدخل في المتحرك اللي فاتح الكلمة اللي بعدها. ده طبيعي، مش مهمل.", "ex": ["Correct. | صح.", "No. Linking is natural for every native speaker. | غلط: الربط طبيعي عند كل أهل اللغة.", "No. This is about speech, not writing. | غلط: ده عن الكلام، مش الكتابة."], "n": 1, "i": 73, "h": ""}, {"t": "tf", "q": "Speaking slowly and over-articulating every word gives students the best model for listening.<br>الكلام البطيء ولفظ كل كلمة بمبالغة بيدّي الطلبة أحسن نموذج للاستماع.", "ans": false, "why": "False. They will imitate the unnatural style and fail to recognise natural rapid speech. | غلط. هيقلّدوا الأسلوب غير الطبيعي ومش هيتعرّفوا على الكلام السريع الطبيعي.", "ex": ["Wrong. Speak naturally most of the time. | غلط: اتكلم طبيعي معظم الوقت.", "Correct. | صح."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "Between the stressed words CLOSE and DOOR there is one syllable, and between DOOR and GONE there are three. The time between them is:<br>بين المنبّرتين تقفل والباب في مقطع واحد، وبين الباب وراح في تلات مقاطع. الوقت بينهم:", "opts": ["the same | واحد", "three times longer | أطول تلات مرات", "half as long | نص الطول"], "ans": 0, "why": "English keeps a constant beat: we speed up the small structure words to keep the time equal. | الإنجليزي بيحافظ على ضربة ثابتة: بنسرّع كلمات التركيب الصغيرة عشان الوقت يفضل متساوي.", "ex": ["Correct. | صح.", "No. The beat stays constant. | غلط: الضربة بتفضل ثابتة.", "No. Time does not shrink either. | غلط: الوقت كمان مابيقلش."], "n": 1, "i": 75, "h": ""}, {"t": "tf", "q": "A phonemic chart's symbols represent individual sounds, irrespective of how words appear in standard written script.<br>رموز خريطة الفونيمات بتمثل أصوات مفردة، بغض النظر عن شكل الكلمات في الكتابة العادية.", "ans": true, "why": "True. The chart maps sounds, not spellings. | صح. الخريطة بترسم الأصوات، مش الهجاء.", "ex": ["Correct. | صح.", "Wrong. Sounds, not spellings. | غلط: أصوات، مش هجاء."], "n": 1, "i": 76, "h": ""}, {"t": "recall", "q": "What are the three main uses of intonation?<br>إيه الاستخدامات الرئيسية التلاتة للتنغيم؟", "a": "Expressing emotions and attitudes, emphasising or downplaying particular things, and signalling function: question or statement, starting or stopping.<br>التعبير عن المشاعر والمواقف، التأكيد أو تقليل أهمية حاجات معينة، وتوضيح الوظيفة: سؤال ولا خبر، بداية ولا نهاية كلام.", "n": 1, "i": 77, "h": ""}, {"t": "recall", "q": "Give the two harmful effects of speaking unnaturally to learners.<br>اذكر التأثيرين الضارين للكلام غير الطبيعي مع المتعلمين.", "a": "They will imitate your unnatural style, and they will not recognise natural rapid speech when they hear it.<br>هيقلّدوا أسلوبك غير الطبيعي، ومش هيتعرّفوا على الكلام السريع الطبيعي لما يسمعوه.", "n": 1, "i": 78, "h": ""}, {"t": "write", "q": "Why should teachers avoid over-articulated speech? (3-4 sentences)<br>ليه المدرسين المفروض يتجنبوا الكلام المبالغ في لفظه؟ (٣-٤ جمل).", "key": "tefl-39:1", "a": "Students imitate the teacher's model, so an over-articulated teacher produces over-articulated speakers. Worse, students trained on slow, separated words listen for How much is it? and cannot understand the natural How muh chi zit? Slowing down a little for basics is fine, but most speech should be natural. Natural speech must itself be taught: how to pronounce it and how to listen for it.<br>الطلبة بيقلّدوا نموذج المدرس، فالمدرس المبالغ في لفظه بيطلّع متكلمين مبالغين. والأسوأ، الطلبة المتدربين على كلمات بطيئة منفصلة بيدوّروا على بكام ده؟ ومابيعرفوش يفهموا بكامد؟ الطبيعية. التبطيء شوية للأساسيات تمام، بس معظم الكلام المفروض يكون طبيعي. الكلام الطبيعي نفسه لازم يتعلّم: إزاي ينطقوه وإزاي يسمعوه.", "n": 1, "i": 79, "h": ""}, {"t": "write", "q": "Explain linking, with the don't eat apples example (3-4 sentences).<br>اشرح الربط، بمثال ماتكلش تفاح (٣-٤ جمل).", "key": "tefl-39:2", "a": "Linking is the end of one word connecting to the beginning of the next. When a word ends in a consonant and the next begins with a vowel, the consonant runs into the vowel: don't eat apples becomes don tea tapples. This happens in the speech of every native speaker; it is natural, not sloppy. Learners who separate every word sound staccato, so they should practise linking to speak and to listen better.<br>الربط هو آخر الكلمة بيتوصّل بأول الكلمة اللي بعدها. لما كلمة بتنتهي بساكن واللي بعدها بتبدأ بمتحرك، الساكن بيدخل في المتحرك: ماتكلش تفاح بتبقى ماتكلتفاح. ده بيحصل في كلام كل متحدث أصلي؛ طبيعي، مش مهمل. المتعلمين اللي بيفصلوا كل كلمة صوتهم بيطلع متقطع، فالمفروض يتدربوا على الربط عشان يتكلموا ويسمعوا أحسن.", "n": 1, "i": 80, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: functional language, the expressions we use for certain purposes.</div><div class=\"u\">الدرس الجاي: اللغة الوظيفية، التعبيرات اللي بنستخدمها لأغراض معينة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 81}];</script>
