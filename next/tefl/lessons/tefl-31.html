<h1>عالم تيفل ٣١: المنهج التواصلي</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٣١</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-31";window.STEPS=[{"t": "section", "h": "How teaching changed | إزاي التدريس اتغيّر", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Over the last thirty years or so, attitudes to language learning have changed dramatically.</div><div class=\"u\">على مدى التلاتين سنة اللي فاتوا أو نحوها، نظرة الناس لتعلم اللغة اتغيّرت بشكل كبير.</div>", "n": 1, "i": 1, "a": "tefl-31-001", "x": "231c36df"}, {"t": "learn", "h": "<div class=\"u\">In the past, the focus was on grammatical accuracy and the minimisation of errors.</div><div class=\"u\">في الماضي، التركيز كان على الدقة النحوية وتقليل الأخطاء لأقصى حد.</div>", "n": 1, "i": 2, "a": "tefl-31-002", "x": "344b78f7"}, {"t": "learn", "h": "<div class=\"u\">Lessons were largely about learning grammar mechanically, through repetition of a rule.</div><div class=\"u\">الدروس كانت في معظمها عن تعلم القواعد ميكانيكيًا، بتكرار القاعدة.</div>", "n": 1, "i": 3, "a": "tefl-31-003", "x": "5c861b71"}, {"t": "learn", "h": "<div class=\"u\">Drilling was used repeatedly by most teachers, and practice of the target language was very controlled.</div><div class=\"u\">التدريب المتكرر كان بيتستخدم باستمرار من معظم المدرسين، والتمرين على اللغة المستهدفة كان مسيطر عليه جدًا.</div>", "n": 1, "i": 4, "a": "tefl-31-004", "x": "8a741e58"}, {"t": "learn", "h": "<div class=\"u\">Learners were expected to memorise dialogues, to reduce mistakes as much as possible.</div><div class=\"u\">المتعلمين كان متوقع منهم يحفظوا حوارات، عشان يقلّلوا الأخطاء لأقصى حد ممكن.</div>", "n": 1, "i": 5, "a": "tefl-31-005", "x": "9c1e9388"}, {"t": "learn", "h": "<div class=\"u\">So students often understood the building blocks of a language very well, but could not put them together themselves in real time.</div><div class=\"u\">فالطلبة غالبًا كانوا فاهمين مكونات اللغة كويس جدًا، بس مش قادرين يركّبوها بنفسهم في الوقت الحقيقي.</div>", "n": 1, "i": 6, "a": "tefl-31-006", "x": "fd020cd9"}, {"t": "learn", "h": "<div class=\"u\">But today's society needs people who can communicate effectively in English, for work or travel. This has altered how we think about teaching.</div><div class=\"u\">بس مجتمع النهاردة محتاج ناس تقدر تتواصل بفعالية بالإنجليزية، للشغل أو السفر. ده غيّر طريقة تفكيرنا في التدريس.</div>", "n": 1, "i": 7, "a": "tefl-31-007", "x": "3ac63ce3"}, {"t": "learn", "h": "<div class=\"u\">The roles of teacher and student have almost reversed. Learners are now active participants, and can increasingly shape their own learning.</div><div class=\"u\">أدوار المدرس والطالب اتعكست تقريبًا. المتعلمين بقوا مشاركين نشيطين، وبيزيد قدرتهم على تشكيل تعلمهم بنفسهم.</div>", "n": 1, "i": 8, "a": "tefl-31-008", "x": "d5557621"}, {"t": "learn", "h": "<div class=\"u\">The teacher has become a facilitator for learning, rather than a regulator.</div><div class=\"u\">المدرس بقى ميسّر للتعلم، مش متحكّم فيه.</div>", "n": 1, "i": 9, "a": "tefl-31-009", "x": "aee58a2a"}, {"t": "learn", "h": "<div class=\"u\">All this led to new approaches. One of the most popular modern methods is Communicative Language Teaching, CLT, the communicative approach.</div><div class=\"u\">كل ده ودّى لمناهج جديدة. واحدة من أشهر الطرق الحديثة هي التدريس التواصلي، CLT، المنهج التواصلي.</div>", "n": 1, "i": 10, "a": "tefl-31-010", "x": "75e52c19"}, {"t": "learn", "h": "<div class=\"u\">This module looks at what CLT actually is, the tasks of the communicative classroom, and error correction that does not discourage communication.</div><div class=\"u\">الموديول ده بيبص على إيه هو الـCLT فعلًا، ومهام الفصل التواصلي، وتصحيح الأخطاء اللي مابيحبطش التواصل.</div>", "n": 1, "i": 11, "a": "tefl-31-011", "x": "4e9a056b"}, {"t": "section", "h": "What CLT looks like | شكل المنهج التواصلي", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">The communicative approach emerged during the seventies and eighties, as teaching moved away from audio-lingual methods, basically drilling grammar.</div><div class=\"u\">المنهج التواصلي ظهر في السبعينات والتمانينات، لما التدريس بدأ يبعد عن المناهج السمعية الشفهية، يعني تدريب القواعد.</div>", "n": 1, "i": 13, "a": "tefl-31-012", "x": "3a970a78"}, {"t": "learn", "h": "<div class=\"u\">The focus moved to more meaningful and authentic language.</div><div class=\"u\">التركيز اتحوّل للغة أجدّى معنى وأكثر أصالة.</div>", "n": 1, "i": 14, "a": "tefl-31-013", "x": "e35425fe"}, {"t": "learn", "h": "<div class=\"u\">Most EFL teachers today like to think their classes are communicative in the widest sense.</div><div class=\"u\">معظم مدرسي الإنجليزية النهاردة بيحبوا يفتكروا إن فصولهم تواصلية بأوسع معنى للكلمة.</div>", "n": 1, "i": 15, "a": "tefl-31-014", "x": "1002ae82"}, {"t": "learn", "h": "<div class=\"u\">Their lessons contain activities where learners communicate, and where tasks are completed through interaction with other learners.</div><div class=\"u\">دروسهم فيها أنشطة المتعلمين فيها بيتواصلوا، والمهام فيها بتتكمّل بالتفاعل مع متعلمين تانيين.</div>", "n": 1, "i": 16, "a": "tefl-31-015", "x": "a46434af"}, {"t": "learn", "h": "<div class=\"u\">So there is extensive use of pair work, group work, and mingling activities.</div><div class=\"u\">ففي استخدام مكثّف لشغل الأزواج وشغل المجموعات وأنشطة الاختلاط.</div>", "n": 1, "i": 17, "a": "tefl-31-016", "x": "17eb62ca"}, {"t": "learn", "h": "<div class=\"u\">The emphasis is on completing the task successfully through communication, rather than on the accurate use of grammatical form.</div><div class=\"u\">التركيز على إتمام المهمة بنجاح عن طريق التواصل، مش على الاستخدام الدقيق للشكل النحوي.</div>", "n": 1, "i": 18, "a": "tefl-31-017", "x": "e39da0f3"}, {"t": "learn", "h": "<div class=\"u\">During these activities the teacher facilitates, then monitors, usually without interrupting.</div><div class=\"u\">أثناء الأنشطة دي المدرس بيسهّل، وبعدين بيراقب، غالبًا من غير ما يقاطع.</div>", "n": 1, "i": 19, "a": "tefl-31-018", "x": "497beb6a"}, {"t": "learn", "h": "<div class=\"u\">Then the teacher gives feedback on the success of the communication, and maybe also on the learners' linguistic performance.</div><div class=\"u\">وبعدين المدرس بيدّي ملاحظات على نجاح التواصل، وممكن كمان على الأداء اللغوي للمتعلمين.</div>", "n": 1, "i": 20, "a": "tefl-31-019", "x": "45855568"}, {"t": "learn", "h": "<div class=\"u\">Lesson organisation is changing too: Presentation Practice Production is giving way to Task-based Learning and Test Teach Test.</div><div class=\"u\">تنظيم الدرس كمان بيتغيّر: عرض-تمرين-إنتاج بيدّي مكان أكتر فأكتر للتعلم بالمهام واختبار-تعليم-اختبار.</div>", "n": 1, "i": 21, "a": "tefl-31-020", "x": "c3ab7285"}, {"t": "learn", "h": "<div class=\"u\">Even grammar teaching can change. Instead of presenting the verb be with a rule, use basic introductions, requests, and questions.</div><div class=\"u\">حتى تدريس القواعد ممكن يتغيّر. بدل ما تعرض فعل الكينونة بقاعدة، استخدم تعارف وطلبات وأسئلة أساسية.</div>", "n": 1, "i": 22, "a": "tefl-31-021", "x": "eb031158"}, {"t": "learn", "h": "<div class=\"u\">I am English. Are you French? Learners begin speaking English right from the start.</div><div class=\"u\">I am English. Are you French? المتعلمين بيبدأوا يتكلموا إنجليزية من أول لحظة.</div>", "n": 1, "i": 23, "a": "tefl-31-022", "x": "bfdca560"}, {"t": "section", "h": "The CLT checklist | قايمة المنهج التواصلي", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">The unit's checklist, adapted from Richards, solved. Which statements characterise CLT?</div><div class=\"u\">قايمة الوحدة، مقتبسة من ريتشاردز، محلولة. أنهي عبارات بتوصف الـCLT؟</div>", "n": 1, "i": 25, "a": "tefl-31-023", "x": "b7fa56f4"}, {"t": "learn", "h": "<div class=\"u\">Correct one: people learn a language best when using it to do things, rather than studying how language works and practising rules.</div><div class=\"u\">صح واحد: الناس بتتعلم اللغة أحسن لما تستخدمها تعمل حاجات، مش لما تدرس إزاي اللغة بتشتغل وتتمرن على القواعد.</div>", "n": 1, "i": 26, "a": "tefl-31-024", "x": "27321138"}, {"t": "learn", "h": "<div class=\"u\">Correct two: people learn a language through communicating in it.</div><div class=\"u\">صح اتنين: الناس بتتعلم اللغة عن طريق التواصل بيها.</div>", "n": 1, "i": 27, "a": "tefl-31-025", "x": "b83b2f92"}, {"t": "learn", "h": "<div class=\"u\">Correct three: classroom activities should be meaningful and involve real communication.</div><div class=\"u\">صح تلاتة: أنشطة الفصل المفروض تكون جدّا معنى وفيها تواصل حقيقي.</div>", "n": 1, "i": 28, "a": "tefl-31-026", "x": "ede4dff5"}, {"t": "learn", "h": "<div class=\"u\">Correct four: both accuracy and fluency are goals in CLT.</div><div class=\"u\">صح أربعة: الدقة والطلاقة الاتنين أهداف في الـCLT.</div>", "n": 1, "i": 29, "a": "tefl-31-027", "x": "04c50507"}, {"t": "learn", "h": "<div class=\"u\">Wrong one: grammar is not important. No, grammar still matters; it is just not the only goal.</div><div class=\"u\">غلط واحد: القواعد مش مهمة. لأ، القواعد لسه مهمة؛ هي بس مش الهدف الوحيد.</div>", "n": 1, "i": 30, "a": "tefl-31-028", "x": "c3fa61a2"}, {"t": "learn", "h": "<div class=\"u\">Wrong two: errors are not important when speaking. No, errors matter, but they do not block communication practice.</div><div class=\"u\">غلط اتنين: الأخطاء مش مهمة في الكلام. لأ، الأخطاء مهمة، بس مابتمنعش ممارسة التواصل.</div>", "n": 1, "i": 31, "a": "tefl-31-029", "x": "5c8ad7dd"}, {"t": "learn", "h": "<div class=\"u\">Wrong three: CLT is only concerned with teaching speaking. No, it covers all skills in authentic contexts.</div><div class=\"u\">غلط تلاتة: الـCLT مهتم بتعليم الكلام بس. لأ، هو بيغطّي كل المهارات في سياقات أصلية.</div>", "n": 1, "i": 32, "a": "tefl-31-030", "x": "a5b8cf00"}, {"t": "learn", "h": "<div class=\"u\">Wrong four: dialogues should not be used. No, dialogues can be used; memorising them mechanically is what faded away.</div><div class=\"u\">غلط أربعة: الحوارات المفروض ماتتستخدمش. لأ، الحوارات ممكن تتستخدم؛ اللي اختفى هو حفظها ميكانيكي.</div>", "n": 1, "i": 33, "a": "tefl-31-031", "x": "c63dabf4"}, {"t": "section", "h": "Competence and strong vs weak | الكفاءة والقوي والضعيف", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">The idea behind CLT is maximising communicative competence.</div><div class=\"u\">الفكرة ورا الـCLT هي تعظيم الكفاءة التواصلية.</div>", "n": 1, "i": 35, "a": "tefl-31-032", "x": "e9b1e6f7"}, {"t": "learn", "h": "<div class=\"u\">That means knowing how to maintain communication despite limitations, and producing appropriate language for a range of purposes.</div><div class=\"u\">ده يعني معرفة إزاي تحافظ على التواصل رغم القصور، وإنتاج لغة مناسبة لمجموعة أغراض.</div>", "n": 1, "i": 36, "a": "tefl-31-033", "x": "457ff058"}, {"t": "learn", "h": "<div class=\"u\">This is done by minimising Teacher Talking Time, and making the lesson learner-centred.</div><div class=\"u\">ده بيتعمل عن طريق تقليل وقت كلام المدرس، وجعل الدرس مركّز على المتعلم.</div>", "n": 1, "i": 37, "a": "tefl-31-034", "x": "e2461114"}, {"t": "learn", "h": "<div class=\"u\">Interaction is generally student to student. The teacher steps back, acting as a resource and a facilitator, not the one who inputs all the language.</div><div class=\"u\">التفاعل غالبًا طالب لطالب. المدرس بيتراجع، بيتصرف كمصدر وميسّر، مش اللي بيدخّل كل اللغة.</div>", "n": 1, "i": 38, "a": "tefl-31-035", "x": "93c2ea66"}, {"t": "learn", "h": "<div class=\"u\">But there is a danger of going too far: being so obsessed with reducing teacher talk that the lesson seems to have no direction.</div><div class=\"u\">بس في خطر المبالغة: الهوس بتقليل كلام المدرس لدرجة إن الدرس يبان من غير اتجاه.</div>", "n": 1, "i": 39, "a": "tefl-31-036", "x": "69e18d0a"}, {"t": "learn", "h": "<div class=\"u\">It becomes just a series of speaking activities.</div><div class=\"u\">بيتحوّل لمجرد سلسلة أنشطة كلام.</div>", "n": 1, "i": 40, "a": "tefl-31-037", "x": "81074e74"}, {"t": "learn", "h": "<div class=\"u\">Scrivener distinguishes between strong CLT and weak CLT.</div><div class=\"u\">سكريفنر بيفرّق بين الـCLT القوي والـCLT الضعيف.</div>", "n": 1, "i": 41, "a": "tefl-31-038", "x": "b29df667"}, {"t": "learn", "h": "<div class=\"u\">Strong CLT: explicit teaching is very limited, and students learn by doing communication tasks.</div><div class=\"u\">الـCLT القوي: التعليم المباشر محدود جدًا، والطلبة بيتعلموا بعمل مهام التواصل.</div>", "n": 1, "i": 42, "a": "tefl-31-039", "x": "cff560f9"}, {"t": "learn", "h": "<div class=\"u\">Weak CLT: a variety of teaching and activities, but with a bias towards speaking and listening.</div><div class=\"u\">الـCLT الضعيف: تنويع من التعليم والأنشطة، بس بميل للكلام والاستماع.</div>", "n": 1, "i": 43, "a": "tefl-31-040", "x": "31f78aa4"}, {"t": "learn", "h": "<div class=\"u\">Perhaps the weaker approach is more balanced: structural input, but still communication in authentic contexts.</div><div class=\"u\">يمكن المنهج الأضعف هو الأكثر توازن: مدخلات تركيبية، بس لسه تواصل في سياقات أصلية.</div>", "n": 1, "i": 44, "a": "tefl-31-041", "x": "f3ec1b2e"}, {"t": "learn", "h": "<div class=\"u\">Otherwise you may hear students complain: why do I have to talk to my fellow students all the time? I can do this in the pub.</div><div class=\"u\">وإلا ممكن تسمع الطلبة بيشتكوا: ليه لازم أتكلم مع زمايلي طول الوقت؟ أقدر أعمل ده في القهوة.</div>", "n": 1, "i": 45, "a": "tefl-31-042", "x": "4c5eaf7e"}, {"t": "section", "h": "Fluency vs accuracy | الطلاقة والدقة", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">The unit's sorting task, solved. Tasks which focus on fluency: aim to achieve communication.</div><div class=\"u\">تمرين الفرز في الوحدة، محلول. المهام اللي بتركّز على الطلاقة: بتهدف لتحقيق التواصل.</div>", "n": 1, "i": 47, "a": "tefl-31-043", "x": "3c4bf329"}, {"t": "learn", "h": "<div class=\"u\">Also fluency: they reflect natural language use, and try to link language to context.</div><div class=\"u\">وكمان طلاقة: بتعكس الاستخدام الطبيعي للغة، وبتحاول تربط اللغة بالسياق.</div>", "n": 1, "i": 48, "a": "tefl-31-044", "x": "c05b66db"}, {"t": "learn", "h": "<div class=\"u\">Tasks which focus on accuracy: they reflect classroom language use.</div><div class=\"u\">المهام اللي بتركّز على الدقة: بتعكس استخدام اللغة داخل الفصل.</div>", "n": 1, "i": 49, "a": "tefl-31-045", "x": "95ddefd5"}, {"t": "learn", "h": "<div class=\"u\">Also accuracy: they practise language out of context, and aim to form correct language.</div><div class=\"u\">وكمان دقة: بتتمرن على اللغة من غير سياق، وبتهدف لتكوين لغة صحيحة.</div>", "n": 1, "i": 50, "a": "tefl-31-046", "x": "4443fd86"}, {"t": "learn", "h": "<div class=\"u\">Many course books you will use are based, at least to some extent, on the communicative approach.</div><div class=\"u\">كتب مقررة كتير هتستخدمها مبنية، على الأقل لحد ما، على المنهج التواصلي.</div>", "n": 1, "i": 51, "a": "tefl-31-047", "x": "44851ca7"}, {"t": "learn", "h": "<div class=\"u\">More often than not, they contain authentic material rather than contrived texts and dialogues.</div><div class=\"u\">في الغالب، فيها مادة أصلية مش نصوص وحوارات مصطنعة.</div>", "n": 1, "i": 52, "a": "tefl-31-048", "x": "9ebfaac5"}, {"t": "learn", "h": "<div class=\"u\">In the unit's course book extract, the tourist role-play is the CLT task.</div><div class=\"u\">في مقتطف الكتاب المقرر في الوحدة، لعبة أدوار السائح هي مهمة الـCLT.</div>", "n": 1, "i": 53, "a": "tefl-31-049", "x": "67b9b768"}, {"t": "learn", "h": "<div class=\"u\">The mini-grammar exercise, completing sentences with the right form, is not a CLT task.</div><div class=\"u\">تمرين القواعد الصغير، إكمال الجمل بالشكل الصح، مش مهمة CLT.</div>", "n": 1, "i": 54, "a": "tefl-31-050", "x": "bf1a2720"}, {"t": "section", "h": "Unit 1 questions | أسئلة الوحدة ١", "n": 1, "i": 55}, {"t": "learn", "h": "<div class=\"u\">Question one: the CLT approach aims to do what? Answer: link language to context.</div><div class=\"u\">سؤال واحد: منهج الـCLT بيهدف لإيه؟ الإجابة: ربط اللغة بالسياق.</div>", "n": 1, "i": 56, "a": "tefl-31-051", "x": "d8ec2019"}, {"t": "learn", "h": "<div class=\"u\">Reflecting classroom language use and forming correct language are accuracy goals, not the CLT aim.</div><div class=\"u\">عكس استخدام لغة الفصل وتكوين لغة صحيحة دول أهداف دقة، مش هدف الـCLT.</div>", "n": 1, "i": 57, "a": "tefl-31-052", "x": "1bfc8c12"}, {"t": "learn", "h": "<div class=\"u\">Question two: which statement characterises CLT? Answer: people learn a language through communicating in it.</div><div class=\"u\">سؤال اتنين: أنهي عبارة بتوصف الـCLT؟ الإجابة: الناس بتتعلم اللغة عن طريق التواصل بيها.</div>", "n": 1, "i": 58, "a": "tefl-31-053", "x": "0030f0f4"}, {"t": "learn", "h": "<div class=\"u\">Grammar is not important, and CLT is only about speaking: both wrong.</div><div class=\"u\">القواعد مش مهمة، والـCLT عن الكلام بس: الاتنين غلط.</div>", "n": 1, "i": 59, "a": "tefl-31-054", "x": "809f2425"}, {"t": "learn", "h": "<div class=\"u\">Question three: CLT focuses on completing the task through communication, rather than accurate grammatical form. True or false? True.</div><div class=\"u\">سؤال تلاتة: الـCLT بيركّز على إتمام المهمة بالتواصل، مش على الشكل النحوي الدقيق. صح ولا غلط؟ صح.</div>", "n": 1, "i": 60, "a": "tefl-31-055", "x": "bda6eb12"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">communicative approach, CLT: teaching focused on real communication.</div><div class=\"u\">المنهج التواصلي: تدريس مركّز على التواصل الحقيقي.</div>", "n": 1, "i": 62, "a": "tefl-31-056", "x": "3e970f95"}, {"t": "learn", "h": "<div class=\"u\">communicative competence: keeping communication going despite limitations.</div><div class=\"u\">الكفاءة التواصلية: الحفاظ على التواصل رغم القصور.</div>", "n": 1, "i": 63, "a": "tefl-31-057", "x": "80d6827a"}, {"t": "learn", "h": "<div class=\"u\">audio-lingual method: the old method based on drilling grammar.</div><div class=\"u\">المنهج السمعي الشفهي: الطريقة القديمة المبنية على تدريب القواعد.</div>", "n": 1, "i": 64, "a": "tefl-31-058", "x": "43a12006"}, {"t": "learn", "h": "<div class=\"u\">facilitator: a teacher who enables learning instead of controlling it.</div><div class=\"u\">الميسّر: مدرس بيمكّن التعلم بدل ما يتحكّم فيه.</div>", "n": 1, "i": 65, "a": "tefl-31-059", "x": "ed5584b3"}, {"t": "learn", "h": "<div class=\"u\">teacher talking time, TTT: how much the teacher talks in a lesson.</div><div class=\"u\">وقت كلام المدرس: قد إيه المدرس بيتكلم في الدرس.</div>", "n": 1, "i": 66, "a": "tefl-31-060", "x": "4d85fb7b"}, {"t": "learn", "h": "<div class=\"u\">fluency: speaking smoothly and naturally, focusing on meaning.</div><div class=\"u\">الطلاقة: الكلام السلس والطبيعي، بتركيز على المعنى.</div>", "n": 1, "i": 67, "a": "tefl-31-061", "x": "927525d1"}, {"t": "learn", "h": "<div class=\"u\">accuracy: producing correct language forms.</div><div class=\"u\">الدقة: إنتاج أشكال لغوية صحيحة.</div>", "n": 1, "i": 68, "a": "tefl-31-062", "x": "f76f192e"}, {"t": "learn", "h": "<div class=\"u\">task-based learning: learning organised around completing tasks.</div><div class=\"u\">التعلم بالمهام: تعلم متنظم حوالين إتمام مهام.</div>", "n": 1, "i": 69, "a": "tefl-31-063", "x": "3a7283ec"}, {"t": "learn", "h": "<div class=\"u\">presentation practice production: the older lesson shape: present, practise, produce.</div><div class=\"u\">عرض-تمرين-إنتاج: شكل الدرس الأقدم: اعرض، اتمرن، أنتج.</div>", "n": 1, "i": 70, "a": "tefl-31-064", "x": "e9a5edc8"}, {"t": "learn", "h": "<div class=\"u\">role-play: an activity where learners act out a situation.</div><div class=\"u\">لعبة الأدوار: نشاط المتعلمين فيه بيمثّلوا موقف.</div>", "n": 1, "i": 71, "a": "tefl-31-065", "x": "e6319ef5"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 72}, {"t": "learn", "h": "<div class=\"u\">Teaching moved from accuracy, drilling, and memorised dialogues to communication and active learners.</div><div class=\"u\">التدريس اتحرّك من الدقة والتدريب المتكرر والحوارات المحفوظة للتواصل والمتعلمين النشيطين.</div>", "n": 1, "i": 73, "a": "tefl-31-066", "x": "6ad9a18f"}, {"t": "learn", "h": "<div class=\"u\">The teacher is now a facilitator, not a regulator.</div><div class=\"u\">المدرس بقى ميسّر، مش متحكّم.</div>", "n": 1, "i": 74, "a": "tefl-31-067", "x": "edda08aa"}, {"t": "learn", "h": "<div class=\"u\">CLT maximises communicative competence, through learner-centred lessons and minimal teacher talking time.</div><div class=\"u\">الـCLT بيعظّم الكفاءة التواصلية، بدروس مركّزة على المتعلم وأقل وقت كلام للمدرس.</div>", "n": 1, "i": 75, "a": "tefl-31-068", "x": "1e00e4a7"}, {"t": "learn", "h": "<div class=\"u\">Both accuracy and fluency are goals; strong CLT teaches by doing, weak CLT keeps some structural input.</div><div class=\"u\">الدقة والطلاقة الاتنين أهداف؛ الـCLT القوي بيعلّم بالممارسة، والضعيف بيحتفظ بشوية مدخلات تركيبية.</div>", "n": 1, "i": 76, "a": "tefl-31-069", "x": "0192e0a5"}, {"t": "learn", "h": "<div class=\"u\">Fluency tasks aim at communication and context; accuracy tasks aim at correct form.</div><div class=\"u\">مهام الطلاقة بتهدف للتواصل والسياق؛ مهام الدقة بتهدف للشكل الصحيح.</div>", "n": 1, "i": 77, "a": "tefl-31-070", "x": "dec602a5"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 78}, {"t": "mc", "q": "The communicative approach aims to:<br>المنهج التواصلي بيهدف لـ:", "opts": ["link language to context | ربط اللغة بالسياق", "reflect classroom language use | عكس استخدام لغة الفصل", "form correct language | تكوين لغة صحيحة"], "ans": 0, "why": "Linking language to context is the CLT aim; the other two are accuracy-task features. | ربط اللغة بالسياق هو هدف الـCLT؛ الاتنين التانيين سمات مهام الدقة.", "ex": ["Correct. | صح.", "No. That is an accuracy-task feature. | غلط: دي سمة مهمة دقة.", "No. That is an accuracy-task feature. | غلط: دي سمة مهمة دقة."], "n": 1, "i": 79, "h": ""}, {"t": "mc", "q": "Which statement characterises CLT?<br>أنهي عبارة بتوصف الـCLT؟", "opts": ["people learn a language through communicating in it | الناس بتتعلم اللغة عن طريق التواصل بيها", "grammar is not important | القواعد مش مهمة", "CLT is only concerned with speaking | الـCLT مهتم بالكلام بس"], "ans": 0, "why": "Communication is the heart of CLT; grammar still matters and all skills are covered. | التواصل هو قلب الـCLT؛ القواعد لسه مهمة وكل المهارات متغطية.", "ex": ["Correct. | صح.", "No. Grammar still matters in CLT. | غلط: القواعد لسه مهمة في الـCLT.", "No. CLT covers all skills. | غلط: الـCLT بيغطّي كل المهارات."], "n": 1, "i": 80, "h": ""}, {"t": "tf", "q": "CLT focuses on completing the task through communication, rather than on accurate grammatical form.<br>الـCLT بيركّز على إتمام المهمة بالتواصل، مش على الشكل النحوي الدقيق.", "ans": true, "why": "True. Task success through communication comes first in communicative activities. | صح. نجاح المهمة عن طريق التواصل بييجي الأول في الأنشطة التواصلية.", "ex": ["Correct. | صح.", "Wrong. Communication is the emphasis. | غلط: التواصل هو التركيز."], "n": 1, "i": 81, "h": ""}, {"t": "mc", "q": "The audio-lingual method was basically:<br>المنهج السمعي الشفهي كان في الأساس:", "opts": ["drilling grammar | تدريب القواعد", "role-plays | ألعاب أدوار", "free conversation | محادثة حرة"], "ans": 0, "why": "CLT emerged as teaching moved away from audio-lingual drilling. | الـCLT ظهر لما التدريس ابتعد عن التدريب السمعي الشفهي.", "ex": ["Correct. | صح.", "No. Role-plays belong to communicative lessons. | غلط: ألعاب الأدوار بتاعت الدروس التواصلية.", "No. Free conversation came later. | غلط: المحادثة الحرة جت بعدين."], "n": 1, "i": 82, "h": ""}, {"t": "tf", "q": "In CLT, grammar is not important.<br>في الـCLT، القواعد مش مهمة.", "ans": false, "why": "False. Both accuracy and fluency are goals in CLT. | غلط. الدقة والطلاقة الاتنين أهداف في الـCLT.", "ex": ["Wrong. Accuracy is still a goal. | غلط: الدقة لسه هدف.", "Correct. | صح."], "n": 1, "i": 83, "h": ""}, {"t": "mc", "q": "Weak CLT means:<br>الـCLT الضعيف يعني:", "opts": ["a variety of teaching with a bias towards speaking and listening | تنويع تعليم بميل للكلام والاستماع", "no explicit teaching at all | مفيش تعليم مباشر خالص", "only mechanical drilling | تدريب ميكانيكي بس"], "ans": 0, "why": "Strong CLT limits explicit teaching; weak CLT mixes input with communication, and is more balanced. | الـCLT القوي بيحدّد التعليم المباشر؛ الضعيف بيدمج المدخلات مع التواصل، وهو الأكثر توازن.", "ex": ["Correct. | صح.", "No. That is strong CLT. | غلط: ده الـCLT القوي.", "No. Drilling is the old method. | غلط: التدريب المتكرر هو الطريقة القديمة."], "n": 1, "i": 84, "h": ""}, {"t": "mc", "q": "Which of these is a fluency-focused task?<br>أنهي واحدة من دول مهمة بتركّز على الطلاقة؟", "opts": ["one that aims to achieve communication | واحدة بتهدف لتحقيق التواصل", "one that aims to form correct language | واحدة بتهدف لتكوين لغة صحيحة", "one that practises language out of context | واحدة بتتمرن على اللغة من غير سياق"], "ans": 0, "why": "Fluency tasks aim at communication and natural, contextual language use. | مهام الطلاقة بتهدف للتواصل والاستخدام الطبيعي والمسياقي للغة.", "ex": ["Correct. | صح.", "No. Correct form is an accuracy aim. | غلط: الشكل الصحيح هدف دقة.", "No. Out of context is an accuracy feature. | غلط: من غير سياق دي سمة دقة."], "n": 1, "i": 85, "h": ""}, {"t": "tf", "q": "In the communicative classroom the teacher is a facilitator rather than a regulator.<br>في الفصل التواصلي المدرس ميسّر مش متحكّم.", "ans": true, "why": "True. Learners are active participants; the teacher facilitates and monitors. | صح. المتعلمين مشاركين نشيطين؛ المدرس بيسهّل ويراقب.", "ex": ["Correct. | صح.", "Wrong. The teacher steps back to a facilitator role. | غلط: المدرس بيتراجع لدور الميسّر."], "n": 1, "i": 86, "h": ""}, {"t": "recall", "q": "How has language teaching changed over the last thirty years?<br>تدريس اللغة اتغيّر إزاي على مدى التلاتين سنة اللي فاتت؟", "a": "From grammar accuracy, drilling, controlled practice, and memorised dialogues, to communication, active learners, and the teacher as facilitator.<br>من الدقة النحوية والتدريب المتكرر والتمرين المسيطر عليه والحوارات المحفوظة، للتواصل والمتعلمين النشيطين والمدرس كميسّر.", "n": 1, "i": 87, "h": ""}, {"t": "recall", "q": "What is communicative competence?<br>إيه هي الكفاءة التواصلية؟", "a": "Knowing how to maintain communication despite limitations, and producing appropriate language for a range of purposes.<br>معرفة إزاي تحافظ على التواصل رغم القصور، وإنتاج لغة مناسبة لمجموعة أغراض.", "n": 1, "i": 88, "h": ""}, {"t": "write", "q": "Compare strong CLT and weak CLT (3-4 sentences).<br>قارن بين الـCLT القوي والضعيف (٣-٤ جمل).", "key": "tefl-31:1", "a": "In strong CLT, explicit teaching is very limited and students learn by doing communication tasks. In weak CLT there is a variety of teaching and activities, with a bias towards speaking and listening. Weak CLT is more balanced, because it keeps structural input while still stressing communication in authentic contexts. Strong CLT risks lessons that feel like an undirected series of speaking activities.<br>في الـCLT القوي، التعليم المباشر محدود جدًا والطلبة بيتعلموا بعمل مهام تواصل. في الـCLT الضعيف في تنويع من التعليم والأنشطة، بميل للكلام والاستماع. الـCLT الضعيف أكثر توازن، لأنه بيحتفظ بمدخلات تركيبية وفي نفس الوقت بيركّز على التواصل في سياقات أصلية. الـCLT القوي بيخاطر بدروس بتحس إنها سلسلة أنشطة كلام من غير اتجاه.", "n": 1, "i": 89, "h": ""}, {"t": "write", "q": "Why is minimising teacher talking time not enough on its own? (3-4 sentences)<br>ليه تقليل وقت كلام المدرس لوحده مش كفاية؟ (٣-٤ جمل).", "key": "tefl-31:2", "a": "Reducing teacher talk makes room for learners, but it says nothing about what fills that room. A lesson can have almost no teacher talking and still have no direction, just one speaking activity after another. Learners then complain that they could chat with classmates anywhere. The point is not less teacher talk, but better learning: purposeful tasks, real communication, and input when it is needed.<br>تقليل كلام المدرس بيفسح مكان للمتعلمين، بس مابيقولش إيه اللي هيملى المكان ده. درس ممكن يبقى فيه كلام مدرس شبه معدوم وفي نفس الوقت مالوش اتجاه، بس نشاط كلام ورا نشاط كلام. المتعلمين ساعتها بيشتكوا إنهم يقدروا يتكلموا مع زمايلهم في أي حتة. المقصود مش كلام مدرس أقل، بس تعلم أحسن: مهام ليها هدف، وتواصل حقيقي، ومدخلات لما يلزم.", "n": 1, "i": 90, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: communicative activities, gap-fills, spot the difference, and problem-based discussions that make students actually talk.</div><div class=\"u\">الدرس الجاي: الأنشطة التواصلية، ملء الفراغات ولعبة الفروق والمناقشات المبنية على مشاكل اللي بتخلّي الطلبة يتكلموا بجد.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 91}];</script>
