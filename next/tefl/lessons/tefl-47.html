<h1>عالم تيفل ٤٧: مهارة الكتابة</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤٧</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-47";window.STEPS=[{"t": "section", "h": "Module 10 welcome | ترحيب الموديول العاشر", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Module 10. Writing is the last of the four skills we look at in detail.</div><div class=\"u\">أهلاً بيك في الموديول العاشر. الكتابة آخر مهارة من المهارات الأربعة اللي هنتكلم عنها بالتفصيل.</div>", "n": 1, "i": 1, "a": "tefl-47-001", "x": "24ff520c"}, {"t": "learn", "h": "<div class=\"u\">Like speaking, writing is a productive, or active, skill because it requires students to create language themselves in written form.</div><div class=\"u\">زي الكلام، الكتابة مهارة إنتاجية، أو نشطة، لأنها بتطلب من الطلبة يخلقوا اللغة بأنفسهم في شكل مكتوب.</div>", "n": 1, "i": 2, "a": "tefl-47-002", "x": "f0d67068"}, {"t": "learn", "h": "<div class=\"u\">Today, written communication, especially in the workplace but also for social purposes, is incredibly important.</div><div class=\"u\">النهارده، التواصل المكتوب، بالذات في شغلنا بس كمان لأغراض اجتماعية، مهم بشكل لا يصدّق.</div>", "n": 1, "i": 3, "a": "tefl-47-003", "x": "c1c41612"}, {"t": "learn", "h": "<div class=\"u\">There are many text types: e-mails, shopping lists, essays, stories, text messages, reports, letters, minutes of meetings, postcards and diaries.</div><div class=\"u\">في أنواع نصوص كتير: الإيميلات، قوائم المشتريات، المقالات، القصص، الرسايل النصية، التقارير، الخطابات، محاضر الاجتماعات، البوستكاردات واليوميات.</div>", "n": 1, "i": 4, "a": "tefl-47-004", "x": "08b4e2e8"}, {"t": "learn", "h": "<div class=\"u\">Because there is a range of reasons why we write, there are several different styles of writing we use to communicate our message appropriately.</div><div class=\"u\">عشان في أسباب متنوعة للكتابة، في أساليب كتابة مختلفة بنستخدمها عشان نوصّل رسالتنا بشكل مناسب.</div>", "n": 1, "i": 5, "a": "tefl-47-005", "x": "da5eb307"}, {"t": "section", "h": "Why writing is hard to teach | ليه الكتابة صعبة في التعليم", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Writing is often considered difficult to teach; after all, teachers often do not know how to improve their own writing. Yet it remains an important skill.</div><div class=\"u\">الكتابة غالبًا بتتعتبر صعبة في التعليم؛ في الآخر المدرسين نفسهم كتير مابيعرفوش يحسّنوا كتابتهم. ومع ذلك بتفضل مهارة مهمة.</div>", "n": 1, "i": 7, "a": "tefl-47-006", "x": "7c7e42a1"}, {"t": "learn", "h": "<div class=\"u\">Some students need it for academic purposes, for business, or just to communicate with friends and colleagues in English.</div><div class=\"u\">بعض الطلبة محتاجاها لأغراض أكاديمية، أو للشغل، أو بس عشان يتواصلوا مع أصحابهم وزمايلهم بالإنجليزي.</div>", "n": 1, "i": 8, "a": "tefl-47-007", "x": "4c6d5388"}, {"t": "learn", "h": "<div class=\"u\">Although writing is sometimes thought of as an individual activity, there are ways to incorporate activities that improve writing ability into your lesson.</div><div class=\"u\">بالرغم إن الكتابة أحيانًا بتتشاف كنشاط فردي، في طرق تدمج بيها أنشطة بتحسّن القدرة على الكتابة في درسك.</div>", "n": 1, "i": 9, "a": "tefl-47-008", "x": "2da32c88"}, {"t": "learn", "h": "<div class=\"u\">Writing requires quite different mental processes from speaking: we have time to prepare, organise material, take our time and check for errors or inaccuracies.</div><div class=\"u\">الكتابة بتحتاج عمليات ذهنية مختلفة تمامًا عن الكلام: عندنا وقت نحضّر وننظّم المادة وناخد وقتنا ونراجع الأخطاء وعدم الدقة.</div>", "n": 1, "i": 10, "a": "tefl-47-009", "x": "1798ff68"}, {"t": "learn", "h": "<div class=\"u\">But there are challenges too. To write successfully we need to think about the purpose of our writing and who we are writing for or to.</div><div class=\"u\">بس في تحديات كمان. عشان نكتب بنجاح محتاجين نفكر في هدف كتابتنا ومين اللي بنكتبله.</div>", "n": 1, "i": 11, "a": "tefl-47-010", "x": "122d3a85"}, {"t": "learn", "h": "<div class=\"u\">This affects not only the content but also the register, style and structure. It is not just about producing grammatically correct sentences.</div><div class=\"u\">وده بيأثر مش بس في المحتوى بس كمان في المستوى والأسلوب والهيكل. الموضوع مش بس إنتاج جمل صح قواعديًا.</div>", "n": 1, "i": 12, "a": "tefl-47-011", "x": "02d41bab"}, {"t": "section", "h": "Four questions, four elements | أربع أسئلة، أربع عناصر", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">When you write a letter, you ask yourself questions, and each question matches an element of writing.</div><div class=\"u\">لما بتكتب خطاب، بتسأل نفسك أسئلة، وكل سؤال بيطابق عنصر من عناصر الكتابة.</div>", "n": 1, "i": 14, "a": "tefl-47-012", "x": "d9a2c061"}, {"t": "learn", "h": "<div class=\"u\">Why am I writing? That is the purpose.</div><div class=\"u\">ليه بكتب؟ ده الهدف.</div>", "n": 1, "i": 15, "a": "tefl-47-013", "x": "52e6a49b"}, {"t": "learn", "h": "<div class=\"u\">Who am I writing to? That is the register: how formal or informal to be.</div><div class=\"u\">لمين بكتب؟ ده المستوى: هبقى رسمي قد إيه أو غير رسمي.</div>", "n": 1, "i": 16, "a": "tefl-47-014", "x": "946f17e4"}, {"t": "learn", "h": "<div class=\"u\">What do I need to say? That is the content.</div><div class=\"u\">إيه اللي محتاج أقوله؟ ده المحتوى.</div>", "n": 1, "i": 17, "a": "tefl-47-015", "x": "3dbec978"}, {"t": "learn", "h": "<div class=\"u\">What will I talk about first, second, last? That is the structure.</div><div class=\"u\">هتكلم عن إيه الأول وتاني وفي الآخر؟ ده الهيكل.</div>", "n": 1, "i": 18, "a": "tefl-47-016", "x": "a40008a1"}, {"t": "section", "h": "Writing task types | أنواع مهام الكتابة", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">Different task types work on some or all of these elements, depending on how controlled the practice is.</div><div class=\"u\">أنواع مهام مختلفة بتشتغل على بعض أو كل العناصر دي، على حسب قد إيه التدريب موجّه.</div>", "n": 1, "i": 20, "a": "tefl-47-017", "x": "fe5605d9"}, {"t": "learn", "h": "<div class=\"u\">Copying: young learners in particular, or students who use a different alphabet from the Roman one, often need to copy characters or words to learn how to form them.</div><div class=\"u\">النسخ: الصغيرين بالذات، أو الطلبة اللي بيستخدموا أبجدية مختلفة عن اللاتينية، غالبًا محتاجين ينسخوا حروف أو كلمات عشان يتعلّموا يكوّنوها.</div>", "n": 1, "i": 21, "a": "tefl-47-018", "x": "7566d338"}, {"t": "learn", "h": "<div class=\"u\">Controlled exercises: learners write single words or phrases in response to questions. There is little room for error because the task is so focused.</div><div class=\"u\">التمارين الموجّهة: المتعلمين بيكتبوا كلمات أو عبارات مفردة ردًا على أسئلة. مفيش مساحة كبيرة للغلط لأن المهمة مركّزة جدًا.</div>", "n": 1, "i": 22, "a": "tefl-47-019", "x": "935c0369"}, {"t": "learn", "h": "<div class=\"u\">Guided writing: using samples or models of longer texts to demonstrate appropriate language and structures for the task.</div><div class=\"u\">الكتابة الموجّهة: استخدام عينات أو نماذج لنصوص أطول عشان توضّح اللغة والتراكيب المناسبة للمهمة.</div>", "n": 1, "i": 23, "a": "tefl-47-020", "x": "c822fb97"}, {"t": "learn", "h": "<div class=\"u\">Process writing: students choose what they want to write, but you guide them through the process.</div><div class=\"u\">كتابة العملية: الطلبة بيختاروا اللي عايزين يكتبوه، بس إنت بترشدهم خلال العملية.</div>", "n": 1, "i": 24, "a": "tefl-47-021", "x": "6d82729d"}, {"t": "learn", "h": "<div class=\"u\">Unguided writing: students write without too much assistance.</div><div class=\"u\">الكتابة الحرة: الطلبة بيكتبوا من غير مساعدة كتير.</div>", "n": 1, "i": 25, "a": "tefl-47-022", "x": "d0f79778"}, {"t": "section", "h": "Writing inside the lesson | الكتابة جوه الدرس", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">Although you may prefer to set writing tasks for homework, you can usefully incorporate writing into the lesson.</div><div class=\"u\">بالرغم إنك ممكن تفضّل تسيب مهام الكتابة واجب، تقدر تدمج الكتابة في الدرس بشكل مفيد.</div>", "n": 1, "i": 27, "a": "tefl-47-023", "x": "32610ad5"}, {"t": "learn", "h": "<div class=\"u\">For example: analysing sample answers, discussing ideas, and helping students decide how to organise their work.</div><div class=\"u\">مثال: تحليل إجابات نموذجية، ومناقشة أفكار، ومساعدة الطلبة يقرروا ينظّموا شغلهم إزاي.</div>", "n": 1, "i": 28, "a": "tefl-47-024", "x": "dcb708bf"}, {"t": "section", "h": "Before writing | قبل الكتابة", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Before writing: both creative and real-life writing can develop different skills and challenge students to use language they might not otherwise practise.</div><div class=\"u\">قبل الكتابة: الكتابة الإبداعية والواقعية الاتنين ممكن ينمّوا مهارات مختلفة ويتحدّوا الطلبة يستخدموا لغة ممكن ميتدربوش عليها غير كده.</div>", "n": 1, "i": 30, "a": "tefl-47-025", "x": "af1eb969"}, {"t": "learn", "h": "<div class=\"u\">As with any skills lesson, lead in appropriately: read a text like an article introducing the topic or a short story, or do a listening or speaking activity to spark interest.</div><div class=\"u\">وزي أي درس مهارات، اعمل مقدمة مناسبة: اقرا نص زي مقال بيقدّم الموضوع أو قصة قصيرة، أو اعمل نشاط سماع أو كلام يولّد الاهتمام.</div>", "n": 1, "i": 31, "a": "tefl-47-026", "x": "e2b85d39"}, {"t": "learn", "h": "<div class=\"u\">Then look at sample or model answers and analyse the good and bad points of each and the key elements: fixed expressions, a particular structure, appropriate register.</div><div class=\"u\">وبعدين بص على إجابات عينة أو نموذجية وحلّل النقط الكويسة والوحشة في كل واحدة والعناصر الأساسية: تعبيرات ثابتة، تركيب معين، مستوى مناسب.</div>", "n": 1, "i": 32, "a": "tefl-47-027", "x": "802dc403"}, {"t": "learn", "h": "<div class=\"u\">Then get a discussion going about ideas for writing or things to include. Do not just leave learners facing a difficult task without any inspiration.</div><div class=\"u\">وبعدين شغّل نقاش عن أفكار للكتابة أو حاجات تتضمن. ماتسيبش المتعلمين وشهم لمهمة صعبة من غير أي إلهام.</div>", "n": 1, "i": 33, "a": "tefl-47-028", "x": "bf48cecf"}, {"t": "section", "h": "During writing: planning | أثناء الكتابة: التخطيط", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">During writing comes a stage that is often missed out but is essential for any good piece of writing: planning.</div><div class=\"u\">أثناء الكتابة بييجي مرحلة غالبًا بتتخطّى بس أساسية لأي قطعة كتابة كويسة: التخطيط.</div>", "n": 1, "i": 35, "a": "tefl-47-029", "x": "109d7e4f"}, {"t": "learn", "h": "<div class=\"u\">Encourage your students to think about the four points: purpose, register, content and structure.</div><div class=\"u\">شجّع طلبتك يفكّروا في النقط الأربعة: الهدف والمستوى والمحتوى والهيكل.</div>", "n": 1, "i": 36, "a": "tefl-47-030", "x": "7def5cda"}, {"t": "learn", "h": "<div class=\"u\">Many English proficiency exams give a large percentage of marks to writing that is appropriate and clearly structured.</div><div class=\"u\">امتحانات كتير لقياس الكفاءة في الإنجليزية بتدّي نسبة كبيرة من الدرجات للكتابة المناسبة والمهيكلة بوضوح.</div>", "n": 1, "i": 37, "a": "tefl-47-031", "x": "71f38a0c"}, {"t": "learn", "h": "<div class=\"u\">This means that even if learners struggle with accuracy, they can still gain high marks if the other elements are done well.</div><div class=\"u\">وده معناه إنه حتى لو المتعلمين بيتعبوا مع الدقة، لسه ممكن ياخدوا درجات عالية لو العناصر التانية متعمولة كويس.</div>", "n": 1, "i": 38, "a": "tefl-47-032", "x": "9d621f07"}, {"t": "learn", "h": "<div class=\"u\">Start with the general outline, then ask students to think about exactly what they want to say in each paragraph and how they are going to say it.</div><div class=\"u\">ابدأ بالمخطط العام، وبعدين اطلب من الطلبة يفكّروا بالظبط عايزين يقولوا إيه في كل فقرة وإزاي هيقولوه.</div>", "n": 1, "i": 39, "a": "tefl-47-033", "x": "bd92bf17"}, {"t": "learn", "h": "<div class=\"u\">Brainstorming relevant vocabulary and expressions at the beginning can help too.</div><div class=\"u\">العصف الذهني للمفردات والتعبيرات المرتبطة في البداية ممكن يساعد كمان.</div>", "n": 1, "i": 40, "a": "tefl-47-034", "x": "8ae3ea9e"}, {"t": "section", "h": "After writing | بعد الكتابة", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">After writing: surprisingly, many students do not check their work once they have written it. This is a big mistake.</div><div class=\"u\">بعد الكتابة: بشكل مفاجئ، طلبة كتير مابيراجعوش شغلهم بعد ما يكتبوه. دي غلطة كبيرة.</div>", "n": 1, "i": 42, "a": "tefl-47-035", "x": "4e3a67fc"}, {"t": "learn", "h": "<div class=\"u\">Even mother-tongue speakers sometimes make mistakes, because they may change an idea half way through a sentence and not go back to adapt everything else.</div><div class=\"u\">حتى أصحاب اللغة الأم أحيانًا بيغلطوا، لأنهم ممكن يغيّروا فكرة في نص الجملة وميرجعوش يعدّلوا الباقي.</div>", "n": 1, "i": 43, "a": "tefl-47-036", "x": "c1880728"}, {"t": "learn", "h": "<div class=\"u\">During exams or timed exercises there is no time for a complete re-draft, but encourage students to re-draft the other writing tasks you set.</div><div class=\"u\">في الامتحانات أو التمارين الموقوتة مفيش وقت لإعادة صياغة كاملة، بس شجّع الطلبة يعيدوا صياغة مهام الكتابة التانية.</div>", "n": 1, "i": 44, "a": "tefl-47-037", "x": "9e9f307f"}, {"t": "learn", "h": "<div class=\"u\">It makes them more aware of how to improve their own writing.</div><div class=\"u\">ده بيخلّيهم أوعى بإزاي يحسّنوا كتابتهم.</div>", "n": 1, "i": 45, "a": "tefl-47-038", "x": "99bbf406"}, {"t": "learn", "h": "<div class=\"u\">Do not just get them to re-draft the language. Make sure they think about the task as a whole.</div><div class=\"u\">وماتخلّيهمش يعيدوا صياغة اللغة وبس. اتأكد إنهم بيفكّروا في المهمة كلها.</div>", "n": 1, "i": 46, "a": "tefl-47-039", "x": "841c9655"}, {"t": "learn", "h": "<div class=\"u\">They should ask: have I really answered the question? Is it too formal or informal for the audience and purpose? Does it follow a clear and logical structure?</div><div class=\"u\">المفروض يسألوا: هل أنا فعلًا جاوبت على السؤال؟ هل ده رسمي أو غير رسمي أوي للجمهور والهدف؟ هل بيتبع هيكل واضح ومنطقي؟</div>", "n": 1, "i": 47, "a": "tefl-47-040", "x": "9db5f514"}, {"t": "learn", "h": "<div class=\"u\">After that comes proofreading: checking for errors. This is essential even for timed writing, so students must leave themselves enough time to check their work.</div><div class=\"u\">وبعد كده بييجي التدقيق: المراجعة على الأخطاء. وده أساسي حتى في الكتابة الموقوتة، فالطلبة لازم يسيبوا لنفسهم وقت كفاية يراجعوا شغلهم.</div>", "n": 1, "i": 48, "a": "tefl-47-041", "x": "1b5d4144"}, {"t": "section", "h": "Proofreading techniques | تقنيات التدقيق", "n": 1, "i": 49}, {"t": "learn", "h": "<div class=\"u\">It can be difficult to see mistakes when looking at the text as a whole, because there is too much to take in.</div><div class=\"u\">ممكن يبقى صعب تشوف الغلطات وإنت باصص على النص كله، لأن في حاجات كتير تستوعبها.</div>", "n": 1, "i": 50, "a": "tefl-47-042", "x": "b84bee93"}, {"t": "learn", "h": "<div class=\"u\">Instead, get students to read through what they have written several times, each time focusing on a different element.</div><div class=\"u\">بدل كده، خلّي الطلبة يقرأوا اللي كتبوه كذا مرة، كل مرة بتركيز على عنصر مختلف.</div>", "n": 1, "i": 51, "a": "tefl-47-043", "x": "9396f61f"}, {"t": "learn", "h": "<div class=\"u\">For instance: once for verb-noun agreement (have they written she go instead of she goes?), another time for prepositions, a third for correct word order.</div><div class=\"u\">مثال: مرة لتطابق الفعل مع الاسم (كتبوا هي تروح من غير إس؟)، ومرة لحروف الجر، وتالتة لترتيب الكلمات الصح.</div>", "n": 1, "i": 52, "a": "tefl-47-044", "x": "6aaadc37"}, {"t": "learn", "h": "<div class=\"u\">This lets the student focus and be more successful at spotting mistakes.</div><div class=\"u\">ده بيخلّي الطالب يركّز وينجح أكتر في اكتشاف الغلطات.</div>", "n": 1, "i": 53, "a": "tefl-47-045", "x": "fcd735a6"}, {"t": "learn", "h": "<div class=\"u\">If there is time, reading each line backwards is another good technique: you really concentrate on every word.</div><div class=\"u\">ولو في وقت، قراية كل سطر بالعكس تقنية كويسة تانية: بتركّز فعلًا على كل كلمة.</div>", "n": 1, "i": 54, "a": "tefl-47-046", "x": "d35b2e6f"}, {"t": "section", "h": "Marking writing | تصحيح الكتابة", "n": 1, "i": 55}, {"t": "learn", "h": "<div class=\"u\">When marking your students' work, do not mark it only in terms of accuracy. It is too easy to focus on language and forget the other elements.</div><div class=\"u\">لما بتصحّح شغل طلبتك، ماتصحّحوش على أساس الدقة وبس. سهل أوي تركّز على اللغة وتنسى العناصر التانية.</div>", "n": 1, "i": 56, "a": "tefl-47-047", "x": "d59e80b0"}, {"t": "learn", "h": "<div class=\"u\">Also award marks for how well they have answered the question, whether the text develops clearly with an identifiable structure, and how appropriate the register is.</div><div class=\"u\">كمان امنح درجات لقد إيه جاوبوا على السؤال كويس، ولو النص بيتطور بوضوح بهيكل واضح، وقد إيه المستوى مناسب.</div>", "n": 1, "i": 57, "a": "tefl-47-048", "x": "34ccfb4e"}, {"t": "learn", "h": "<div class=\"u\">You are asking your students to think about all of these things, so it is only fair you do too.</div><div class=\"u\">إنت بتطلب من طلبتك يفكّروا في كل الحاجات دي، فمن العدل إنك إنت كمان تعمل كده.</div>", "n": 1, "i": 58, "a": "tefl-47-049", "x": "9d56ab95"}, {"t": "learn", "h": "<div class=\"u\">And give learners the opportunity to self-correct and improve their writing with error correction techniques, like a correction code, as we saw in Module 5.</div><div class=\"u\">وادّي المتعلمين الفرصة يصحّحوا لنفسهم ويحسّنوا كتابتهم بتقنيات تصحيح الأخطاء، زي كود التصحيح، زي ما شفنا في الموديول الخامس.</div>", "n": 1, "i": 59, "a": "tefl-47-050", "x": "98f58ce6"}, {"t": "section", "h": "Scripts, listeners and tone | الحروف والسامعين والنبرة", "n": 1, "i": 60}, {"t": "learn", "h": "<div class=\"u\">Unit two starts with questions about teaching writing. An Arabic speaker wrote: writing in another language is often stressful. What problems would this student have with English?</div><div class=\"u\">الوحدة التانية بتبدأ بأسئلة عن تعليم الكتابة. متحدث عربي كتب: الكتابة بلغة تانية مجهدة أحيانًا. إيه المشاكل اللي الطالب ده هيقابلها مع الإنجليزي؟</div>", "n": 1, "i": 61, "a": "tefl-47-051", "x": "36f054bf"}, {"t": "learn", "h": "<div class=\"u\">This speaker writes from right to left, so they would have problems with the basic script of English.</div><div class=\"u\">المتحدث ده بيكتب من اليمين للشمال، فهيقابل مشاكل مع الحروف الأساسية بتاعة الإنجليزي.</div>", "n": 1, "i": 62, "a": "tefl-47-052", "x": "21bf164a"}, {"t": "learn", "h": "<div class=\"u\">Letter formation is completely different, so help with handwriting is likely needed at any level.</div><div class=\"u\">تكوين الحروف مختلف تمامًا، فالمساعدة في الخط غالبًا مطلوبة في أي مستوى.</div>", "n": 1, "i": 63, "a": "tefl-47-053", "x": "63b2f2d2"}, {"t": "learn", "h": "<div class=\"u\">Second question: in speaking, the listener is usually present. How does this affect speaking and writing?</div><div class=\"u\">السؤال التاني: في الكلام، السامع عادة موجود. ده بيأثر إزاي على الكلام والكتابة؟</div>", "n": 1, "i": 64, "a": "tefl-47-054", "x": "50263f59"}, {"t": "learn", "h": "<div class=\"u\">When speaking, you can stop, restart and pause if the addressee has not understood. If you were explaining how to use a DVD player, you would usually have to repeat something.</div><div class=\"u\">في الكلام، تقدر توقف وتعيد وتعمل وقفة لو السامع مافهمش. لو بتشرح إزاي تشغّل مشغل دي في دي، غالبًا هتحتاج تعيد حاجة.</div>", "n": 1, "i": 65, "a": "tefl-47-055", "x": "83ae0525"}, {"t": "learn", "h": "<div class=\"u\">In writing, the addressee is not present, so the information needs to be clear, logical and concise. Tone can also be misinterpreted in a text message, email or letter.</div><div class=\"u\">في الكتابة، المخاطَب مش موجود، فالمعلومة محتاجة تبقى واضحة ومنطقية ومختصرة. وكمان النبرة ممكن تتفسر غلط في رسالة نصية أو إيميل أو خطاب.</div>", "n": 1, "i": 66, "a": "tefl-47-056", "x": "f57403ea"}, {"t": "learn", "h": "<div class=\"u\">That is why writing in a second language can be stressful: accuracy and tone matter a lot.</div><div class=\"u\">عشان كده الكتابة بلغة تانية ممكن تبقى مجهدة: الدقة والنبرة مهمين جدًا.</div>", "n": 1, "i": 67, "a": "tefl-47-057", "x": "c846c428"}, {"t": "section", "h": "The writing lesson stages | مراحل درس الكتابة", "n": 1, "i": 68}, {"t": "learn", "h": "<div class=\"u\">Think of the last time you wrote an essay or a formal email. The writing process has a number of stages, and here is their correct order from the authentic lesson with the teacher Melissa.</div><div class=\"u\">افتكر آخر مرة كتبت فيها مقال أو إيميل رسمي. عملية الكتابة ليها مراحل، ودي الترتيب الصح من الدرس الحقيقي مع المدرسة ميليسا.</div>", "n": 1, "i": 69, "a": "tefl-47-058", "x": "4ff1b6e5"}, {"t": "learn", "h": "<div class=\"u\">One: having a reason, being motivated to write. This activates students' existing knowledge on the topic and generates interest.</div><div class=\"u\">واحد: وجود سبب، دافع للكتابة. ده بينشّط معرفة الطلبة الموجودة عن الموضوع وبيولّد الاهتمام.</div>", "n": 1, "i": 70, "a": "tefl-47-059", "x": "a1f57a92"}, {"t": "learn", "h": "<div class=\"u\">Two: brainstorming ideas, to practise pre-writing strategies and generate even more ideas and vocabulary on the topic.</div><div class=\"u\">اتنين: العصف الذهني للأفكار، عشان يتدربوا على استراتيجيات ما قبل الكتابة ويولّدوا أفكار ومفردات أكتر عن الموضوع.</div>", "n": 1, "i": 71, "a": "tefl-47-060", "x": "9bcec025"}, {"t": "learn", "h": "<div class=\"u\">Three: making notes. Four: planning and outlining, to encourage students to note down ideas, as Melissa did with the mind map.</div><div class=\"u\">تلاتة: تدوين الملاحظات. أربعة: التخطيط ووضع المخطط، عشان يشجّع الطلبة يدوّنوا أفكارهم، زي ما ميليسا عملت بالخريطة الذهنية.</div>", "n": 1, "i": 72, "a": "tefl-47-061", "x": "d6a670d3"}, {"t": "learn", "h": "<div class=\"u\">Five: making the first draft, in a safe and supported environment: the classroom.</div><div class=\"u\">خمسة: كتابة المسودة الأولى، في بيئة آمنة ومدعومة: الفصل.</div>", "n": 1, "i": 73, "a": "tefl-47-062", "x": "0ad422e8"}, {"t": "learn", "h": "<div class=\"u\">Six: revising and redrafting. Seven: editing for the final draft.</div><div class=\"u\">ستة: المراجعة وإعادة الصياغة. سبعة: التحرير للمسودة النهائية.</div>", "n": 1, "i": 74, "a": "tefl-47-063", "x": "7c96c3a0"}, {"t": "learn", "h": "<div class=\"u\">Notice that in Melissa's lesson the students only got as far as the first draft. The actual writing was set as homework. The process matters as much as the product.</div><div class=\"u\">لاحظ إن في درس ميليسا الطلبة وصلوا بس لحد المسودة الأولى. الكتابة الفعلية اتسابت واجب. العملية مهمة قد المنتج.</div>", "n": 1, "i": 75, "a": "tefl-47-064", "x": "f5942004"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 76}, {"t": "learn", "h": "<div class=\"u\">purpose: the reason why you are writing.</div><div class=\"u\">الهدف: السبب اللي بيكتب عشانه.</div>", "n": 1, "i": 77, "a": "tefl-47-065", "x": "05d266d6"}, {"t": "learn", "h": "<div class=\"u\">register: how formal or informal the writing should be.</div><div class=\"u\">المستوى: قد إيه الكتابة المفروض تبقى رسمية أو غير رسمية.</div>", "n": 1, "i": 78, "a": "tefl-47-066", "x": "63e06e8d"}, {"t": "learn", "h": "<div class=\"u\">content: what you need to say.</div><div class=\"u\">المحتوى: إيه اللي محتاج تقوله.</div>", "n": 1, "i": 79, "a": "tefl-47-067", "x": "d383d757"}, {"t": "learn", "h": "<div class=\"u\">structure: the order of ideas, first to last.</div><div class=\"u\">الهيكل: ترتيب الأفكار، من الأول للآخر.</div>", "n": 1, "i": 80, "a": "tefl-47-068", "x": "1fae2900"}, {"t": "learn", "h": "<div class=\"u\">guided writing: writing with models of longer texts to follow.</div><div class=\"u\">الكتابة الموجّهة: الكتابة مع نماذج نصوص أطول تتبعها.</div>", "n": 1, "i": 81, "a": "tefl-47-069", "x": "559e205b"}, {"t": "learn", "h": "<div class=\"u\">process writing: students choose the topic, the teacher guides the steps.</div><div class=\"u\">كتابة العملية: الطلبة بيختاروا الموضوع، والمدرس بيرشد الخطوات.</div>", "n": 1, "i": 82, "a": "tefl-47-070", "x": "62ba3818"}, {"t": "learn", "h": "<div class=\"u\">unguided writing: writing without much assistance.</div><div class=\"u\">الكتابة الحرة: الكتابة من غير مساعدة كتير.</div>", "n": 1, "i": 83, "a": "tefl-47-071", "x": "c57d5264"}, {"t": "learn", "h": "<div class=\"u\">re-draft: writing a new, improved version of a text.</div><div class=\"u\">إعادة الصياغة: كتابة نسخة جديدة محسّنة من النص.</div>", "n": 1, "i": 84, "a": "tefl-47-072", "x": "319e801c"}, {"t": "learn", "h": "<div class=\"u\">proofreading: checking a text for errors.</div><div class=\"u\">التدقيق: مراجعة النص على الأخطاء.</div>", "n": 1, "i": 85, "a": "tefl-47-073", "x": "ab11d6b8"}, {"t": "learn", "h": "<div class=\"u\">correction code: symbols a teacher uses to show error types for self-correction.</div><div class=\"u\">كود التصحيح: رموز المدرس بيستخدمها يوضّح نوع الغلطة للتصحيح الذاتي.</div>", "n": 1, "i": 86, "a": "tefl-47-074", "x": "2ee98961"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 87}, {"t": "learn", "h": "<div class=\"u\">Writing is a productive skill, and today's written communication makes it essential; different reasons for writing produce different text types and styles.</div><div class=\"u\">الكتابة مهارة إنتاجية، والتواصل المكتوب النهارده بيخليها أساسية؛ أسباب الكتابة المختلفة بتنتج أنواع نصوص وأساليب مختلفة.</div>", "n": 1, "i": 88, "a": "tefl-47-075", "x": "7475d562"}, {"t": "learn", "h": "<div class=\"u\">Before writing, answer four questions: why (purpose), to whom (register), what (content) and in what order (structure).</div><div class=\"u\">قبل الكتابة، جاوب على أربع أسئلة: ليه (الهدف)، لمين (المستوى)، إيه (المحتوى) وبأنهي ترتيب (الهيكل).</div>", "n": 1, "i": 89, "a": "tefl-47-076", "x": "1a0e3834"}, {"t": "learn", "h": "<div class=\"u\">Task types run from copying and controlled exercises through guided and process writing to unguided writing.</div><div class=\"u\">أنواع المهام بتمشي من النسخ والتمارين الموجّهة للكتابة الموجّهة وكتابة العملية لحد الكتابة الحرة.</div>", "n": 1, "i": 90, "a": "tefl-47-077", "x": "62e18da3"}, {"t": "learn", "h": "<div class=\"u\">Lead in with texts and discussion, plan before drafting, re-draft with the whole task in mind, and proofread element by element.</div><div class=\"u\">اعمل مقدمة بنصوص ونقاش، خطط قبل الصياغة، أعد الصياغة والمهمة كلها في دماغك، ودقّق عنصر بعنصر.</div>", "n": 1, "i": 91, "a": "tefl-47-078", "x": "485cf1fd"}, {"t": "learn", "h": "<div class=\"u\">Mark more than accuracy: reward answering the question, clear structure and appropriate register, and use a correction code so students self-correct.</div><div class=\"u\">صحّح أكتر من الدقة: كافئ الإجابة على السؤال والهيكل الواضح والمستوى المناسب، واستخدم كود تصحيح عشان الطلبة يصحّحوا لنفسهم.</div>", "n": 1, "i": 92, "a": "tefl-47-079", "x": "8d846ba0"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 93}, {"t": "mc", "q": "Who am I writing to? Which element does this question match?<br>لمين بكتب؟ السؤال ده بيطابق أنهي عنصر؟", "opts": ["register | المستوى", "content | المحتوى", "structure | الهيكل"], "ans": 0, "why": "The audience decides the register: how formal or informal the writing should be. | الجمهور بيحدد المستوى: قد إيه الكتابة المفروض تبقى رسمية أو غير رسمية.", "ex": ["Correct. | صح.", "No. Content is what you need to say. | غلط: المحتوى هو اللي محتاج تقوله.", "No. Structure is the order of ideas. | غلط: الهيكل هو ترتيب الأفكار."], "n": 1, "i": 94, "h": ""}, {"t": "mc", "q": "What will I talk about first, second, last? This question is about:<br>هتكلم عن إيه الأول وتاني وفي الآخر؟ السؤال ده عن:", "opts": ["structure | الهيكل", "purpose | الهدف", "register | المستوى"], "ans": 0, "why": "Ordering ideas is the structure of the text. | ترتيب الأفكار هو هيكل النص.", "ex": ["Correct. | صح.", "No. Purpose is why you are writing. | غلط: الهدف هو ليه بتكتب.", "No. Register is the level of formality. | غلط: المستوى هو درجة الرسمية."], "n": 1, "i": 95, "h": ""}, {"t": "mc", "q": "In which task type do students choose what to write while the teacher guides the process?<br>في أنهي نوع مهمة الطلبة بيختاروا إيه اللي يكتبوه والمدرس بيرشد العملية؟", "opts": ["process writing | كتابة العملية", "copying | النسخ", "unguided writing | الكتابة الحرة"], "ans": 0, "why": "Process writing means student choice plus teacher guidance through the process. | كتابة العملية معناها اختيار الطالب زائد إرشاد المدرس خلال العملية.", "ex": ["Correct. | صح.", "No. Copying is reproducing characters or words. | غلط: النسخ هو تكرار حروف أو كلمات.", "No. Unguided writing has little assistance. | غلط: الكتابة الحرة مساعدتها قليلة."], "n": 1, "i": 96, "h": ""}, {"t": "tf", "q": "Copying is only useful for advanced learners.<br>النسخ مفيد بس للمتعلمين المتقدمين.", "ans": false, "why": "False. Copying helps young learners and students with a different alphabet learn to form characters and words. | غلط. النسخ بيساعد الصغيرين والطلبة اللي أبجديتهم مختلفة يتعلّموا تكوين الحروف والكلمات.", "ex": ["Correct. | صح.", "Wrong. Beginners benefit most from copying. | غلط: المبتدئين أكتر مستفيدين من النسخ."], "n": 1, "i": 97, "h": ""}, {"t": "mc", "q": "What is the first stage of the writing lesson?<br>إيه أول مرحلة في درس الكتابة؟", "opts": ["having a reason, being motivated to write | وجود سبب ودافع للكتابة", "making the first draft | كتابة المسودة الأولى", "editing for the final draft | التحرير للمسودة النهائية"], "ans": 0, "why": "Motivation comes first: it activates existing knowledge and generates interest. | الدافع بييجي الأول: بينشّط المعرفة الموجودة وبيولّد الاهتمام.", "ex": ["Correct. | صح.", "No. The first draft comes after notes and planning. | غلط: المسودة الأولى بتيجي بعد الملاحظات والتخطيط.", "No. Editing is the last stage. | غلط: التحرير آخر مرحلة."], "n": 1, "i": 98, "h": ""}, {"t": "tf", "q": "In Melissa's lesson, the students finished the final draft in class.<br>في درس ميليسا، الطلبة خلّصوا المسودة النهائية في الفصل.", "ans": false, "why": "False. They only got as far as the first draft; the actual writing was set as homework. | غلط. وصلوا بس لحد المسودة الأولى؛ الكتابة الفعلية اتسابت واجب.", "ex": ["Correct. | صح.", "Wrong. Only the first draft happened in class. | غلط: بس المسودة الأولى حصلت في الفصل."], "n": 1, "i": 99, "h": ""}, {"t": "mc", "q": "Which is a good proofreading technique?<br>أنهي تقنية تدقيق كويسة؟", "opts": ["reading several times, each time focusing on one element | القراية كذا مرة، كل مرة بتركيز على عنصر واحد", "reading the whole text once, quickly | قراية النص كله مرة واحدة بسرعة", "never re-reading your work | عدم إعادة قراية شغلك أبدًا"], "ans": 0, "why": "Focusing on one element per pass, like agreement, prepositions or word order, spots more mistakes. Reading lines backwards also works. | التركيز على عنصر واحد في كل مرة، زي التطابق أو حروف الجر أو ترتيب الكلمات، بيكتشف غلطات أكتر. قراية الأسطر بالعكس كمان بتنجح.", "ex": ["Correct. | صح.", "No. One quick read takes in too much to spot errors. | غلط: القراية السريعة مرة واحدة بتستوعب كتير أوي عشان تكتشف الغلطات.", "No. Checking work is essential. | غلط: مراجعة الشغل أساسية."], "n": 1, "i": 100, "h": ""}, {"t": "tf", "q": "When marking writing, teachers should focus only on accuracy.<br>عند تصحيح الكتابة، المدرسين المفروض يركّزوا على الدقة بس.", "ans": false, "why": "False. Also mark how well the question was answered, the clarity of structure and the appropriacy of register. | غلط. كمان صحّح قد إيه السؤال اتجاوب عليه، ووضوح الهيكل، ومناسبة المستوى.", "ex": ["Correct. | صح.", "Wrong. Structure and register earn marks too. | غلط: الهيكل والمستوى كمان ليهم درجات."], "n": 1, "i": 101, "h": ""}, {"t": "recall", "q": "Name the five writing task types from most to least controlled.<br>اذكر أنواع مهام الكتابة الخمسة من الأكثر توجيهًا للأقل.", "a": "Copying; controlled exercises; guided writing; process writing; unguided writing.<br>النسخ؛ التمارين الموجّهة؛ الكتابة الموجّهة؛ كتابة العملية؛ الكتابة الحرة.", "n": 1, "i": 102, "h": ""}, {"t": "recall", "q": "Name the four elements of writing and the question that matches each.<br>اذكر عناصر الكتابة الأربعة والسؤال اللي بيطابق كل واحد.", "a": "Purpose: why am I writing? Register: who am I writing to? Content: what do I need to say? Structure: what will I talk about first, second, last?<br>الهدف: ليه بكتب؟ المستوى: لمين بكتب؟ المحتوى: إيه اللي محتاج أقوله؟ الهيكل: هتكلم عن إيه الأول وتاني وفي الآخر؟", "n": 1, "i": 103, "h": ""}, {"t": "write", "q": "Why can writing in a second language be stressful? (3-4 sentences)<br>ليه الكتابة بلغة تانية ممكن تبقى مجهدة؟ (٣-٤ جمل).", "key": "tefl-47:1", "a": "In writing, the addressee is not present, so you cannot stop, restart or repeat the way you can when speaking. The information has to be clear, logical and concise the first time. Tone can also be misinterpreted in a text message, email or letter. Accuracy and tone matter a lot, and for learners with a different script, even the handwriting itself is a challenge.<br>في الكتابة، المخاطَب مش موجود، فمش بتقدر توقف أو تعيد أو تكرر زي الكلام. المعلومة لازم تبقى واضحة ومنطقية ومختصرة من أول مرة. والنبرة كمان ممكن تتفسر غلط في رسالة نصية أو إيميل أو خطاب. الدقة والنبرة مهمين جدًا، وللمتعلمين اللي حروفهم مختلفة، حتى الخط نفسه تحدي.", "n": 1, "i": 104, "h": ""}, {"t": "write", "q": "Describe the seven stages of the writing lesson in order. (4-5 sentences)<br>اوصف مراحل درس الكتابة السبعة بالترتيب. (٤-٥ جمل).", "key": "tefl-47:2", "a": "First, students need a reason and motivation to write, which activates their existing knowledge. Second, they brainstorm ideas and vocabulary. Third and fourth, they make notes and plan an outline, for example with a mind map. Fifth, they write the first draft in the safe, supported classroom. Finally, they revise and redraft, and then edit for the final draft.<br>أول حاجة، الطلبة محتاجين سبب ودافع للكتابة، وده بينشّط معرفتهم الموجودة. تاني حاجة، بيعملوا عصف ذهني للأفكار والمفردات. تالت ورابع حاجة، بيدوّنوا ملاحظات ويخططوا مخطط، مثلاً بخريطة ذهنية. خامس حاجة، بيكتبوا المسودة الأولى في الفصل الآمن والمدعوم. وفي الآخر، بيراجعوا ويعيدوا الصياغة، وبعدين يحرّروا للمسودة النهائية.", "n": 1, "i": 105, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: strategies and fifteen practical activities for teaching writing.</div><div class=\"u\">الدرس الجاي: استراتيجيات وخمستاشر نشاط عملي لتعليم الكتابة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 106}];</script>
