<script>window.LESSON_ID="tefl-56";window.STEPS=[{"t": "section", "h": "The Seven R's | الراءات السبعة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit two: the Seven R's. The seven R's are Relationships, Rules, Routines, Rights, Responsibilities, Respect and Rewards.</div><div class=\"u\">الوحدة التانية: الراءات السبعة. الراءات السبعة هما العلاقات والقواعد والروتين والحقوق والمسؤوليات والاحترام والمكافآت.</div>", "n": 1, "i": 1, "a": "tefl-56-001", "x": "aa648e6d"}, {"t": "learn", "h": "<div class=\"u\">If you consider this combination before teaching your class, you will without doubt create a dynamic and positive learning environment. Your students will never forget you!</div><div class=\"u\">لو فكّرت في التوليفة دي قبل ما تعلّم فصلك، هتعمل من غير شك بيئة تعلّم حية وإيجابية. طلبتك عمري ما هينسوك!</div>", "n": 1, "i": 2, "a": "tefl-56-002", "x": "2a75e54e"}, {"t": "section", "h": "Relationships | العلاقات", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\">R one: Relationships. The relationships you establish with the class as a whole, and with the individuals in it, lie at the heart of a healthy working environment.</div><div class=\"u\">راء واحد: العلاقات. العلاقات اللي بتبنيها مع الفصل كله، ومع الأفراد اللي فيه، هما قلب بيئة الشغل الصحية.</div>", "n": 1, "i": 4, "a": "tefl-56-003", "x": "568c5f15"}, {"t": "learn", "h": "<div class=\"u\">They are also at the heart of managing children positively.</div><div class=\"u\">وهما كمان قلب إدارة الأطفال بإيجابية.</div>", "n": 1, "i": 5, "a": "tefl-56-004", "x": "8e884b98"}, {"t": "learn", "h": "<div class=\"u\">On asking children over the years: what makes a good teacher? The answers included: knowing that the teacher likes me. Being funny. Strict but never gets angry.</div><div class=\"u\">من سؤال الأطفال على مدار سنين: إيه اللي بيخلّي المدرس كويس؟ الإجابات شملت: إني عارف إن المدرس بيحبني. إنه بيضحّك. صارم بس عمري ما بيعصّب.</div>", "n": 1, "i": 6, "a": "tefl-56-005", "x": "ef2b6fc0"}, {"t": "learn", "h": "<div class=\"u\">More answers: does not make me feel stupid if I make a mistake. Kind, patient, helpful.</div><div class=\"u\">إجابات زيادة: مابيحسّسنيش إني غبي لو غلطت. حنين وصبور وبييساعد.</div>", "n": 1, "i": 7, "a": "tefl-56-006", "x": "92abca99"}, {"t": "learn", "h": "<div class=\"u\">Tip: learn the children's names as soon as you can and always use them.</div><div class=\"u\">نصيحة: اتعلّم أسماء الأطفال بأسرع ما تقدر واستخدمها دايمًا.</div>", "n": 1, "i": 8, "a": "tefl-56-007", "x": "4c2bd955"}, {"t": "learn", "h": "<div class=\"u\">This may sound easy. However, teaching in China, for example, you could have a class of forty children, all with difficult to pronounce names.</div><div class=\"u\">ده ممكن يبان سهل. بس لكن لو بتعلّم في الصين مثلًا، ممكن يبقى عندك فصل فيه أربعين طفل، كلهم أسماء صعبة النطق.</div>", "n": 1, "i": 9, "a": "tefl-56-008", "x": "ec1753c1"}, {"t": "learn", "h": "<div class=\"u\">One suggestion: get each child to write their name in English on a large piece of paper and stick it to their desk on the first day.</div><div class=\"u\">اقتراح: خلّي كل طفل يكتب اسمه بالإنجليزي على ورقة كبيرة ويلزقها على المكتب أول يوم.</div>", "n": 1, "i": 10, "a": "tefl-56-009", "x": "1e5c1750"}, {"t": "learn", "h": "<div class=\"u\">You could also make small badges and ask the kids to wear them for the first week.</div><div class=\"u\">تقدر كمان تعمل بطاقات صغيرة وتطلب من الأطفال يلبسوها أول أسبوع.</div>", "n": 1, "i": 11, "a": "tefl-56-010", "x": "104d6719"}, {"t": "learn", "h": "<div class=\"u\">Tip: avoid having favourites, or at least make sure that this does not show.</div><div class=\"u\">نصيحة: اتجنّب إن يبقى عندك مفضّلين، أو على الأقل اتأكد إن ده مابيظهرش.</div>", "n": 1, "i": 12, "a": "tefl-56-011", "x": "3752afb6"}, {"t": "learn", "h": "<div class=\"u\">Tip: listen to what the children have to say. If a child wants to tell you something at an inappropriate moment, postpone till later, but do not then forget.</div><div class=\"u\">نصيحة: اسمع اللي الأطفال عايزين يقولوه. لو طفل عايز يقلّك حاجة في لحظة مش مناسبة، أجّلها لبعدين، بس متنساش بعد كده.</div>", "n": 1, "i": 13, "a": "tefl-56-012", "x": "3d7a6dcd"}, {"t": "learn", "h": "<div class=\"u\">Forgetting gives the message that you are not really interested.</div><div class=\"u\">النسيان بيدّي رسالة إنك مش مهتم فعلًا.</div>", "n": 1, "i": 14, "a": "tefl-56-013", "x": "6509204b"}, {"t": "learn", "h": "<div class=\"u\">Tip: challenge the children appropriately and encourage them to believe that they can succeed. Be patient if you need to explain or give instructions more than once.</div><div class=\"u\">نصيحة: تحدّى الأطفال بشكل مناسب وشجّعهم يصدّقوا إنهم يقدروا ينجحوا. اصبر لو احتجت تشرح أو تدّي تعليمات أكتر من مرة.</div>", "n": 1, "i": 15, "a": "tefl-56-014", "x": "9c131d8b"}, {"t": "learn", "h": "<div class=\"u\">Tip: create time for personalised moments in which you convey that you know and care about each child as an individual: at the start or end of lessons, or while children are working individually.</div><div class=\"u\">نصيحة: اعمل وقت للحظات شخصية بتوصّل فيها إنك عارف كل طفل كفرد وبتهتم بيه: في أول أو آخر الحصص، أو والأطفال شغالين لوحدهم.</div>", "n": 1, "i": 16, "a": "tefl-56-015", "x": "0cf27c30"}, {"t": "learn", "h": "<div class=\"u\">Tip: model the behaviour you would like the children to adopt. Be polite and courteous, use please and thank you, smile and greet them whether in or out of the classroom.</div><div class=\"u\">نصيحة: اعمل موديل للسلوك اللي عايز الأطفال يتبنّوه. خلّيك مؤدب ومحترم، استخدم لو سمحت وشكرًا، ابتسم وسلّم عليهم جوه الفصل وبرّه.</div>", "n": 1, "i": 17, "a": "tefl-56-016", "x": "3cfc9cb0"}, {"t": "learn", "h": "<div class=\"u\">Tip: use praise appropriately to provide feedback and encourage participation and effort. Use humour and show a sense of fun.</div><div class=\"u\">نصيحة: استخدم المديح بشكل مناسب عشان تدّي تغذية راجعة وتشجّع المشاركة والمجهود. استخدم الفكاهة وبيّن روح المرح.</div>", "n": 1, "i": 18, "a": "tefl-56-017", "x": "713ba713"}, {"t": "learn", "h": "<div class=\"u\">Tip: be fair and firm about enforcing rules and acceptable classroom behaviour. Keep calm at all times if possible; try not to raise your voice or shout.</div><div class=\"u\">نصيحة: خلّيك عادل وحازم في تطبيق القواعد والسلوك المقبول. فضّل هادي طول الوقت لو أمكن؛ حاول ماتعلّيش صوتك ولا تصرخ.</div>", "n": 1, "i": 19, "a": "tefl-56-018", "x": "a99c07fc"}, {"t": "learn", "h": "<div class=\"u\">Tip: if you tell a child off, make it clear it is their behaviour that you do not like, not them. Be consistent: if you say that you or the class will do something, make sure it happens.</div><div class=\"u\">نصيحة: لو زعّلت لطفل، وضّح إن سلوكه هو اللي مش عاجبك، مش هو. خلّيك متّسق: لو قلت إنك أو الفصل هتعملوا حاجة، اتأكد إنها بتحصل.</div>", "n": 1, "i": 20, "a": "tefl-56-019", "x": "4b6fdceb"}, {"t": "learn", "h": "<div class=\"u\">Tip: mark and return work promptly. Be constructive in your comments and respond to children's intended meanings, rather than just language accuracy or spelling.</div><div class=\"u\">نصيحة: صحّح الشغل وارجّعه بسرعة. خلّي تعليقاتك بنّاءة ورد على المعنى اللي الطفل قصده، مش بس الدقة اللغوية أو الإملا.</div>", "n": 1, "i": 21, "a": "tefl-56-020", "x": "bff5bdff"}, {"t": "learn", "h": "<div class=\"u\">As you develop relationships, get into the habit of monitoring yourself and how things are going.</div><div class=\"u\">وإنت بتطوّر العلاقات، اعتاد إنك تراقب نفسك وشغلك ماشي إزاي.</div>", "n": 1, "i": 22, "a": "tefl-56-021", "x": "6339fe73"}, {"t": "learn", "h": "<div class=\"u\">Through reflection and analysis of your own behaviour, you will identify what makes your relationships work better.</div><div class=\"u\">بالتأمّل وتحليل سلوكك إنت، هتحدّد إيه اللي بيخلّي علاقاتك تشتغل أحسن.</div>", "n": 1, "i": 23, "a": "tefl-56-022", "x": "c7de51ff"}, {"t": "section", "h": "Rules | القواعد", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">R two: Rules. As discussed in module one, there are different approaches to establishing rules, like asking the learners which rules they think would be useful.</div><div class=\"u\">راء اتنين: القواعد. زي ما اتكلمنا في الوحدة الأولى، في طرق مختلفة لتثبيت القواعد، زي إنك تسأل المتعلمين هما شايفين قواعد إيه مفيدة.</div>", "n": 1, "i": 25, "a": "tefl-56-023", "x": "0bcbf471"}, {"t": "learn", "h": "<div class=\"u\">With teaching children, however, they often like to know the ground rules from the start. Providing clear boundaries helps children to feel secure.</div><div class=\"u\">مع تعليم الأطفال بقى، هما غالبًا بيحبوا يعرفوا القواعد الأساسية من البداية. توفير حدود واضحة بيساعد الأطفال يحسوا بالأمان.</div>", "n": 1, "i": 26, "a": "tefl-56-024", "x": "4fccb2a7"}, {"t": "learn", "h": "<div class=\"u\">So with a new class especially, this area needs to be a little more prescriptive.</div><div class=\"u\">فمع فصل جديد تحديدًا، المجال ده محتاج يبقى أوضح وأصرم شوية.</div>", "n": 1, "i": 27, "a": "tefl-56-025", "x": "3721acc2"}, {"t": "learn", "h": "<div class=\"u\">Rules may either be imposed by the institution or instigated by you. It is usually best to have as few rules as possible and to make sure the rules themselves are clear to everybody.</div><div class=\"u\">القواعد ممكن تكون مفروضة من المؤسسة أو مقترحة منك إنت. الأحسن عادة إن يبقى عندك أقل عدد ممكن من القواعد وتتأكد إن القواعد نفسها واضحة لكل حد.</div>", "n": 1, "i": 28, "a": "tefl-56-026", "x": "9b5f6ef9"}, {"t": "learn", "h": "<div class=\"u\">For example: we must put up our hands if we want to speak, as well as the reasons for the rules: if everyone is talking at the same time, we will not be able to hear what anybody is saying.</div><div class=\"u\">مثلًا: لازم نرفع إيدينا لو عايزين نتكلم، وكمان أسباب القواعد: لو كل حد بيتكلم في نفس الوقت، مش هنقدر نسمع أي حد بيقول إيه.</div>", "n": 1, "i": 29, "a": "tefl-56-027", "x": "187a9ab8"}, {"t": "learn", "h": "<div class=\"u\">It is important that any rules you establish are perceived as fair by the children and that you can actually enforce them.</div><div class=\"u\">مهم إن أي قواعد بتثبّتها الأطفال يحسّوها عادلة، وإنك تقدر فعلًا تنفّذها.</div>", "n": 1, "i": 30, "a": "tefl-56-028", "x": "b99409ab"}, {"t": "learn", "h": "<div class=\"u\">For example, a rule that works for adults, we must always speak English in class, may seem unfair to children if they desperately need to say something.</div><div class=\"u\">مثلًا، قاعدة بتشتغل مع الكبار، لازم دايمًا نتكلم إنجليزي في الفصل، ممكن تبان ظالمة للأطفال لو عندهم حاجة مستعجلة أوي يقولوها.</div>", "n": 1, "i": 31, "a": "tefl-56-029", "x": "33e20de8"}, {"t": "learn", "h": "<div class=\"u\">It may also be impossible for you to enforce. You do not want to set yourself up for a fall and lose control.</div><div class=\"u\">وممكن كمان تبقى مستحيلة التنفيذ. مش عايز توقّع نفسك وتخسر التحكم.</div>", "n": 1, "i": 32, "a": "tefl-56-030", "x": "312943bf"}, {"t": "learn", "h": "<div class=\"u\">In this case, a communication rule formulated differently might be more effective: we must ask if we need to speak Spanish, may I speak Spanish, please?</div><div class=\"u\">في الحالة دي، قاعدة تواصل متصاغة بشكل مختلف ممكن تبقى أنجع: لازم نستأذن لو محتاجين نتكلم إسباني، ممكن أتكلم إسباني لو سمحت؟</div>", "n": 1, "i": 33, "a": "tefl-56-031", "x": "6460996f"}, {"t": "learn", "h": "<div class=\"u\">This version will establish English as the main language of the classroom, and will also encourage the children to think twice before signalling that they need their mother tongue.</div><div class=\"u\">النسخة دي هتثبّت الإنجليزي كلغة الفصل الرئيسية، وكمان هتشجّع الأطفال يفكّروا مرتين قبل ما يدوّا إشارة إنهم محتاجين لغتهم الأم.</div>", "n": 1, "i": 34, "a": "tefl-56-032", "x": "49c1bba8"}, {"t": "learn", "h": "<div class=\"u\">The most effective rules are those expressed using inclusive language, our rules for our classroom, and for which the children feel ownership.</div><div class=\"u\">أنجح القواعد هي اللي متصاغة بلغة جامعة، قواعدنا لفصلنا، واللي الأطفال حاسين إنها بتاعتهم.</div>", "n": 1, "i": 35, "a": "tefl-56-033", "x": "11928880"}, {"t": "learn", "h": "<div class=\"u\">It also helps when rules are expressed positively rather than negatively, to highlight desired behaviour.</div><div class=\"u\">وكمان بيساعد لما القواعد تتصاغ بالإيجاب مش بالسلب، عشان تظهّر السلوك المطلوب.</div>", "n": 1, "i": 36, "a": "tefl-56-034", "x": "5527d0e1"}, {"t": "learn", "h": "<div class=\"u\">For example, we must not shout in our classroom makes children immediately think of shouting. Expressed positively, we must talk quietly in our classroom, the same rule is more likely to work.</div><div class=\"u\">مثلًا، ممنوع نصرخ في فصلنا بيخلّي الأطفال يفكّروا في الصريخ فورًا. متصاغة بالإيجاب، لازم نتكلم بهدوء في فصلنا، نفس القاعدة غالبًا هتشتغل أكتر.</div>", "n": 1, "i": 37, "a": "tefl-56-035", "x": "3f2df1f0"}, {"t": "section", "h": "Routines | الروتين", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">R three: Routines. Routines are established patterns of behaviour in which everyone knows what is expected of them and what they should do.</div><div class=\"u\">راء تلاتة: الروتين. الروتين أنماط سلوك متثبّتة كل حد فيها عارف المطلوب منه إيه والمفروض يعمل إيه.</div>", "n": 1, "i": 39, "a": "tefl-56-036", "x": "6dac7ed2"}, {"t": "learn", "h": "<div class=\"u\">The introduction of classroom routines is instrumental in setting up working parameters which function effectively.</div><div class=\"u\">إدخال روتين الفصل أساسي في تثبيت حدود شغل بتشتغل بكفاءة.</div>", "n": 1, "i": 40, "a": "tefl-56-037", "x": "fc5a97f8"}, {"t": "learn", "h": "<div class=\"u\">It is vital that routines are established during the honeymoon period, before patterns of behaviour are set.</div><div class=\"u\">ضروري إن الروتين يتثبّت في فترة شهر العسل، قبل ما أنماط السلوك تتثبّت.</div>", "n": 1, "i": 41, "a": "tefl-56-038", "x": "e7cf9ba0"}, {"t": "learn", "h": "<div class=\"u\">To introduce routines successfully, have a clear plan of the areas they will cover.</div><div class=\"u\">عشان تدخّل الروتين بنجاح، عندك خطة واضحة للمجالات اللي هيغطّيها.</div>", "n": 1, "i": 42, "a": "tefl-56-039", "x": "18faaabd"}, {"t": "learn", "h": "<div class=\"u\">For example, routines for: greeting the children, taking the register, starting lessons, getting into pairs or groups.</div><div class=\"u\">مثلًا، روتين لـ: تحية الأطفال، تسجيل الحضور، بدء الحصص، التقسيم لثنائيات أو مجموعات.</div>", "n": 1, "i": 43, "a": "tefl-56-040", "x": "1322d039"}, {"t": "learn", "h": "<div class=\"u\">Also: moving from one part of the classroom to another, doing activities involving movement or stories, getting the children's attention, starting and stopping activities.</div><div class=\"u\">وكمان: التحرك من جزء لجزء في الفصل، عمل أنشطة فيها حركة أو قصص، جذب انتباه الأطفال، بدء وإنهاء الأنشطة.</div>", "n": 1, "i": 44, "a": "tefl-56-041", "x": "1ae49e01"}, {"t": "learn", "h": "<div class=\"u\">Also: giving out and collecting in materials, looking at and correcting children's work, collecting in and returning homework, going to the toilet, tidying up, ending lessons.</div><div class=\"u\">وكمان: توزيع وتجميع الخامات، مراجعة وتصحيح شغل الأطفال، تجميع وإرجاع الواجب، الذهاب للحمّام، الترتيب، إنهاء الحصص.</div>", "n": 1, "i": 45, "a": "tefl-56-042", "x": "292c4190"}, {"t": "learn", "h": "<div class=\"u\">Familiar routines help make children feel secure and confident in the classroom. They promote co-operation, as when we all help tidy up together.</div><div class=\"u\">الروتين المألوف بيساعد الأطفال يحسوا بالأمان والثقة في الفصل. بيعزّز التعاون، زي لما كلنا بنساعد في الترتيب مع بعض.</div>", "n": 1, "i": 46, "a": "tefl-56-043", "x": "b3af2d3c"}, {"t": "learn", "h": "<div class=\"u\">They also foster a sense of community and belonging: we all know and share the way we work and do things together in the classroom.</div><div class=\"u\">وكمان بيعزّزوا إحساس المجتمع والانتماء: كلنا عارفين ومشاركين في طريقة شغلنا وعملنا مع بعض في الفصل.</div>", "n": 1, "i": 47, "a": "tefl-56-044", "x": "26ae826b"}, {"t": "learn", "h": "<div class=\"u\">As children become familiar with routines and what is expected at different stages, they begin to act more independently.</div><div class=\"u\">ومع ما الأطفال بيتألفوا مع الروتين والمطلوب في المراحل المختلفة، بيبدأوا يتصرّفوا باستقلالية أكتر.</div>", "n": 1, "i": 48, "a": "tefl-56-045", "x": "153672ea"}, {"t": "learn", "h": "<div class=\"u\">This helps you manage your classes positively. It also helps save your energy and your voice, highly important if you teach full time.</div><div class=\"u\">ده بيساعدك تدير فصولك بإيجابية. وبيساعد كمان توفّر طاقتك وصوتك، مهم جدًا لو بتدرّس بدوام كامل.</div>", "n": 1, "i": 49, "a": "tefl-56-046", "x": "38a1a358"}, {"t": "learn", "h": "<div class=\"u\">Once routines are established, children will only need a prompt to know what to do.</div><div class=\"u\">أول ما الروتين يتثبّت، الأطفال هيحتاجوا بس تلميح عشان يعرفوا يعملوا إيه.</div>", "n": 1, "i": 50, "a": "tefl-56-047", "x": "1ce63c7e"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 51}, {"t": "learn", "h": "<div class=\"u\">relationships: the bond with the class and each child in it.</div><div class=\"u\">العلاقات: الرباط مع الفصل وكل طفل فيه.</div>", "n": 1, "i": 52, "a": "tefl-56-048", "x": "7aa9b334"}, {"t": "learn", "h": "<div class=\"u\">favourites: children you like more; never let it show.</div><div class=\"u\">المفضّلين: أطفال بتحبهم أكتر؛ أبدًا ماتخليش ده يبان.</div>", "n": 1, "i": 53, "a": "tefl-56-049", "x": "f1267b02"}, {"t": "learn", "h": "<div class=\"u\">personalised moments: short one-to-one moments showing you care.</div><div class=\"u\">اللحظات الشخصية: لحظات فردية قصيرة بتورّي اهتمامك.</div>", "n": 1, "i": 54, "a": "tefl-56-050", "x": "ddc46feb"}, {"t": "learn", "h": "<div class=\"u\">tell off: to scold a child; criticise the behaviour, not the child.</div><div class=\"u\">التزعيق: تعاتب طفل؛ اعتب السلوك مش الطفل.</div>", "n": 1, "i": 55, "a": "tefl-56-051", "x": "43672afe"}, {"t": "learn", "h": "<div class=\"u\">prescriptive: telling exactly what the rules are.</div><div class=\"u\">الإلزامي: بيقلّك القواعد بالظبط إيه.</div>", "n": 1, "i": 56, "a": "tefl-56-052", "x": "05917edf"}, {"t": "learn", "h": "<div class=\"u\">enforce: to actually make a rule happen.</div><div class=\"u\">التنفيذ: إنك تخلّي القاعدة تحصل فعلًا.</div>", "n": 1, "i": 57, "a": "tefl-56-053", "x": "5a5a184a"}, {"t": "learn", "h": "<div class=\"u\">inclusive language: our rules for our classroom.</div><div class=\"u\">اللغة الجامعة: قواعدنا لفصلنا.</div>", "n": 1, "i": 58, "a": "tefl-56-054", "x": "27469211"}, {"t": "learn", "h": "<div class=\"u\">positive phrasing: we must talk quietly, not we must not shout.</div><div class=\"u\">الصياغة الإيجابية: لازم نتكلم بهدوء، مش ممنوع نصرخ.</div>", "n": 1, "i": 59, "a": "tefl-56-055", "x": "dde36852"}, {"t": "learn", "h": "<div class=\"u\">routines: established patterns where everyone knows what to do.</div><div class=\"u\">الروتين: أنماط متثبّتة كل حد فيها عارف يعمل إيه.</div>", "n": 1, "i": 60, "a": "tefl-56-056", "x": "7d752964"}, {"t": "learn", "h": "<div class=\"u\">prompt: a small hint that starts a routine.</div><div class=\"u\">التلميح: إشارة صغيرة بتبدّل الروتين.</div>", "n": 1, "i": 61, "a": "tefl-56-057", "x": "6c33a444"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">The Seven R's: relationships, rules, routines, rights, responsibilities, respect and rewards.</div><div class=\"u\">الراءات السبعة: العلاقات والقواعد والروتين والحقوق والمسؤوليات والاحترام والمكافآت.</div>", "n": 1, "i": 63, "a": "tefl-56-058", "x": "59a2a235"}, {"t": "learn", "h": "<div class=\"u\">Relationships come first: learn names fast, avoid favourites, listen, challenge, personalise, model good behaviour, praise, stay calm, be consistent, mark work promptly.</div><div class=\"u\">العلاقات الأول: اتعلّم الأسماء بسرعة، اتجنّب المفضّلين، اسمع، تحدّى، خصّص، اعمل موديل، امسح بالمديح، فضّل هادي، خلّيك متّسق، صحّح الشغل بسرعة.</div>", "n": 1, "i": 64, "a": "tefl-56-059", "x": "87bc2603"}, {"t": "learn", "h": "<div class=\"u\">Children say a good teacher likes them, is funny, strict but never angry, never makes them feel stupid, kind, patient, helpful.</div><div class=\"u\">الأطفال بيقولوا المدرس الكويس بيحبهم، بيضحّك، صارم بس عمري ما بيعصّب، أبدًا مابيحسّسهم إنهم أغبيا، حنين وصبور وبييساعد.</div>", "n": 1, "i": 65, "a": "tefl-56-060", "x": "7daa3fc3"}, {"t": "learn", "h": "<div class=\"u\">Rules should be few, clear, fair, enforceable, inclusive and positive: we must talk quietly, not we must not shout.</div><div class=\"u\">القواعد المفروض تبقى قليلة وواضحة وعادلة وقابلة للتنفيذ وجامعة وإيجابية: لازم نتكلم بهدوء، مش ممنوع نصرخ.</div>", "n": 1, "i": 66, "a": "tefl-56-061", "x": "aad0e06d"}, {"t": "learn", "h": "<div class=\"u\">Routines are patterns where everyone knows what to do; establish them in the honeymoon period and they save your energy and voice.</div><div class=\"u\">الروتين أنماط كل حد فيها عارف يعمل إيه؛ ثبّته في فترة شهر العسل وهيوفّر طاقتك وصوتك.</div>", "n": 1, "i": 67, "a": "tefl-56-062", "x": "160f09e8"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 68}, {"t": "mc", "q": "According to children, a good teacher is:<br>حسب الأطفال، المدرس الكويس بيبقى:", "opts": ["strict but never gets angry | صارم بس عمري ما بيعصّب", "always serious | جاد دايمًا", "never strict | عمري ما صارم"], "ans": 0, "why": "Children said: strict but never gets angry, funny, likes me, never makes me feel stupid, kind, patient, helpful. | الأطفال قالوا: صارم بس عمري ما بيعصّب، بيضحّك، بيحبني، مابيحسّسنيش إني غبي، حنين وصبور وبييساعد.", "ex": ["Correct. | صح.", "No. They want a sense of fun. | غلط: هما عايزين روح مرح.", "No. They value firm fairness. | غلط: هما بيقدّروا الحزم العادل."], "n": 1, "i": 69, "h": ""}, {"t": "tf", "q": "It is fine to have favourites, as long as you hide it completely or avoid having them.<br>عادي يبقى عندك مفضّلين، طالما بتخبّي ده تمامًا أو بتتجنّبه.", "ans": true, "why": "Correct. Avoid having favourites, or at least make sure it does not show. | صح. اتجنّب المفضّلين، أو على الأقل اتأكد إن ده مابيظهرش.", "ex": ["Correct. | صح.", "Wrong. Favouritism must not show. | غلط: التفضيل مابيفرقش يبان."], "n": 1, "i": 70, "h": ""}, {"t": "mc", "q": "A child wants to tell you something at an inappropriate moment. You should:<br>طفل عايز يقلّك حاجة في لحظة مش مناسبة. المفروض:", "opts": ["postpone it, but remember to come back to it | أجّلها، بس افتكر ترجعلها", "ignore it forever | تجاهلها للأبد", "stop the lesson immediately | وقّف الدرس فورًا"], "ans": 0, "why": "Postpone till later but do not forget, or the child learns you are not really interested. | أجّل لبعدين بس متنساش، وإلا الطفل هيتعلّم إنك مش مهتم فعلًا.", "ex": ["Correct. | صح.", "No. Forgetting sends a bad message. | غلط: النسيان بيبعث رسالة وحشة.", "No. The lesson keeps its flow. | غلط: الدرس بيحافظ على تدفّقه."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "If you tell a child off, make clear that you dislike:<br>لو زعّلت لطفل، وضّح إنك مش عاجبك:", "opts": ["their behaviour, not them | سلوكهم، مش هما", "their family | عيلتهم", "their friends | أصحابهم"], "ans": 0, "why": "Make it clear it is their behaviour you do not like, not them. | وضّح إن سلوكهم هو اللي مش عاجبك، مش هما.", "ex": ["Correct. | صح.", "No. Keep it about behaviour. | غلط: خلّيه عن السلوك.", "No. Others are not involved. | غلط: التانيين مش طرف."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "The best rule phrasing is:<br>أحسن صياغة لقاعدة هي:", "opts": ["We must talk quietly in our classroom | لازم نتكلم بهدوء في فصلنا", "We must not shout in our classroom | ممنوع نصرخ في فصلنا", "No shouting ever | ممنوع صريخ أبدًا"], "ans": 0, "why": "Positive phrasing highlights desired behaviour; we must not shout makes children think of shouting. | الصياغة الإيجابية بتظهّر السلوك المطلوب؛ ممنوع نصرخ بيخلّي الأطفال يفكّروا في الصريخ.", "ex": ["Correct. | صح.", "No. Negative phrasing points at the bad behaviour. | غلط: الصياغة السلبية بتشاور على السلوك الوحش.", "No. It sounds harsh and negative. | غلط: بتبان قاسية وسلبية."], "n": 1, "i": 73, "h": ""}, {"t": "tf", "q": "We must always speak English in class is a perfect first rule for children.<br>لازم دايمًا نتكلم إنجليزي في الفصل قاعدة أولى مثالية للأطفال.", "ans": false, "why": "False. It can seem unfair and may be impossible to enforce. Better: we must ask if we need to speak our mother tongue. | غلط. ممكن تبان ظالمة وممكن تبقى مستحيلة التنفيذ. الأحسن: لازم نستأذن لو محتاجين نتكلم لغتنا الأم.", "ex": ["Correct. | صح.", "Wrong. Rules must be fair and enforceable. | غلط: القواعد لازم تبقى عادلة وقابلة للتنفيذ."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "When should routines be established?<br>امتى المفروض الروتين يتثبّت؟", "opts": ["during the honeymoon period | في فترة شهر العسل", "after the first exam | بعد أول امتحان", "at the end of the term | في آخر الترم"], "ans": 0, "why": "It is vital routines are established during the honeymoon period, before patterns of behaviour are set. | ضروري الروتين يتثبّت في فترة شهر العسل، قبل ما أنماط السلوك تتثبّت.", "ex": ["Correct. | صح.", "No. By then patterns are set. | غلط: ساعتها الأنماط بتكون اتثبّتت.", "No. Far too late. | غلط: متأخر جدًا."], "n": 1, "i": 75, "h": ""}, {"t": "mc", "q": "Once routines are established, children need:<br>أول ما الروتين يتثبّت، الأطفال بيحتاجوا:", "opts": ["only a prompt to know what to do | بس تلميح عشان يعرفوا يعملوا إيه", "full instructions every time | تعليمات كاملة كل مرة", "no teacher at all | مفيش مدرس خالص"], "ans": 0, "why": "Established routines mean children only need a prompt, which saves your energy and your voice. | الروتين المتثبّت معناه إن الأطفال بيحتاجوا بس تلميح، وده بيوفّر طاقتك وصوتك.", "ex": ["Correct. | صح.", "No. That is the whole point of routines. | غلط: ده هو هدف الروتين.", "No. The teacher still leads. | غلط: المدرس لسه بيقود."], "n": 1, "i": 76, "h": ""}, {"t": "recall", "q": "Name six relationship tips from this lesson.<br>اذكر ست نصايح للعلاقات من الدرس ده.", "a": "Any six of: learn names fast and use them; avoid favourites; listen and come back to postponed chats; challenge appropriately and believe they can succeed; be patient repeating instructions; create personalised moments; model polite behaviour; use praise and humour; be fair and firm; stay calm; criticise behaviour not the child; be consistent; mark and return work promptly; monitor yourself.<br>أي ستة من: اتعلّم الأسماء بسرعة واستخدمها؛ اتجنّب المفضّلين؛ اسمع وارجع للحوارات المؤجلة؛ تحدّى بشكل مناسب وصدّق إنهم ينجحوا؛ اصبر في التكرار؛ اعمل لحظات شخصية؛ اعمل موديل للأدب؛ استخدم المديح والفكاهة؛ خلّيك عادل وحازم؛ فضّل هادي؛ اعتب السلوك مش الطفل؛ خلّيك متّسق؛ صحّح الشغل بسرعة؛ راقب نفسك.", "n": 1, "i": 77, "h": ""}, {"t": "recall", "q": "Name six areas that can have routines.<br>اذكر ست مجالات ممكن يبقى ليها روتين.", "a": "Any six of: greeting the children, taking the register, starting lessons, getting into pairs or groups, moving around the classroom, movement or story activities, getting attention, starting and stopping activities, giving out and collecting materials, correcting work, homework, going to the toilet, tidying up, ending lessons.<br>أي ستة من: تحية الأطفال، تسجيل الحضور، بدء الحصص، التقسيم لثنائيات أو مجموعات، التحرك في الفصل، أنشطة الحركة أو القصص، جذب الانتباه، بدء وإنهاء الأنشطة، توزيع وتجميع الخامات، تصحيح الشغل، الواجب، الذهاب للحمّام، الترتيب، إنهاء الحصص.", "n": 1, "i": 78, "h": ""}, {"t": "write", "q": "How would you build a good relationship with a new class of children? (3-4 sentences)<br>إزاي هتبني علاقة كويسة مع فصل أطفال جديد؟ (٣-٤ جمل).", "key": "tefl-56:1", "a": "I would learn every child's name in the first week, using desk name cards, and use the names always. I would listen to what children tell me, postponing when the moment is wrong but always coming back later. I would model the behaviour I want: polite, smiling, using please and thank you, calm at all times. And I would create personalised moments at the start and end of lessons, so each child feels known and cared about as an individual.<br>أنا هتعلّم اسم كل طفل في الأسبوع الأول، ببطاقات الأسماء على المكاتب، وهستخدم الأسماء دايمًا. هسمع اللي الأطفال بيقلّو لي، وأجّل لما اللحظة تبقى غلط بس دايمًا هارجع بعدين. هعمل موديل للسلوك اللي عايزه: مؤدب وبشوش وباستخدم لو سمحت وشكرًا، وهادي طول الوقت. وهعمل لحظات شخصية في أول وآخر الحصص، عشان كل طفل يحس إنه متعارف ومهتم بيه كفرد.", "n": 1, "i": 79, "h": ""}, {"t": "write", "q": "Design two classroom rules for children and explain why they work. (3-4 sentences)<br>صمّم قاعدتين لفصل أطفال واشرح ليه بيشتغلوا. (٣-٤ جمل).", "key": "tefl-56:2", "a": "Rule one: we must put up our hands if we want to speak, because if everyone talks at once, nobody can hear. Rule two: we must ask if we need to speak our mother tongue, which keeps English the main language while staying fair and enforceable. Both are few, clear and reasonable for children. Both are phrased positively and inclusively: our rules for our classroom, so the children feel ownership.<br>قاعدة واحد: لازم نرفع إيدينا لو عايزين نتكلم، لأن لو كل حد اتكلم مرة واحدة، محدش هيسمع حاجة. قاعدة اتنين: لازم نستأذن لو محتاجين نتكلم لغتنا الأم، ودي بتحافظ على الإنجليزي كلغة رئيسية وبتفضل عادلة وقابلة للتنفيذ. الاتنين قليلة وواضحة ومنطقية للأطفال. والاتنين متصاغين بالإيجاب وبشكل جامع: قواعدنا لفصلنا، فالأطفال بيحسوا إنها بتاعتهم.", "n": 1, "i": 80, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: rights, responsibilities, respect and rewards.</div><div class=\"u\">الدرس الجاي: الحقوق والمسؤوليات والاحترام والمكافآت.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 81}];</script>
