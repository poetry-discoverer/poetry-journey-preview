<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٥٣</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-53";window.STEPS=[{"t": "section", "h": "What modals are | إيه هي الأفعال الناقصة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit six: modal verbs. Modals are complex and very challenging to present, and they are complex and challenging for students to learn, both conceptually and formally.</div><div class=\"u\">الوحدة السادسة: الأفعال الناقصة. الأفعال الناقصة معقدة وصعبة جدًا في العرض، ومعقدة وصعبة على الطلبة في التعلّم، في الفكرة وفي الشكل.</div>", "n": 1, "i": 1, "a": "tefl-53-001", "x": "21d29015"}, {"t": "learn", "h": "<div class=\"u\">They are a set of auxiliary verbs, often called modal auxiliary verbs.</div><div class=\"u\">هما مجموعة من الأفعال المساعدة، بيتسمّوا غالبًا الأفعال المساعدة الناقصة.</div>", "n": 1, "i": 2, "a": "tefl-53-002", "x": "a05f6926"}, {"t": "learn", "h": "<div class=\"u\">Modal verbs let the speaker express feelings about the probability of an event, the ability of a person to carry out an action, or the level of an obligation.</div><div class=\"u\">الأفعال الناقصة بتخلّي المتكلم يعبّر عن مشاعره عن احتمالية حدث، أو قدرة شخص ينفّذ فعل، أو مستوى الالتزام.</div>", "n": 1, "i": 3, "a": "tefl-53-003", "x": "220250d7"}, {"t": "learn", "h": "<div class=\"u\">But modals seldom express the actuality of it happening.</div><div class=\"u\">بس الأفعال الناقصة نادرًا بتعبّر عن وقوع الفعل فعلًا.</div>", "n": 1, "i": 4, "a": "tefl-53-004", "x": "27c5b475"}, {"t": "learn", "h": "<div class=\"u\">Other uses of modals are to express attitude, politeness or advice; modals are also used for making requests or giving permission.</div><div class=\"u\">استخدامات تانية للأفعال الناقصة: التعبير عن الموقف أو الأدب أو النصيحة؛ وبتتستخدم كمان في الطلبات أو إعطاء الإذن.</div>", "n": 1, "i": 5, "a": "tefl-53-005", "x": "a61fb1e7"}, {"t": "learn", "h": "<div class=\"u\">The verbs in this category, although there are different views, are: can, could, may, might, will, would, must, shall, should, ought to.</div><div class=\"u\">الأفعال اللي في الفئة دي، مع إن في آراء مختلفة، هما: كان وكود وماي ومايت وويل ووود ومست وشال وشود وأوت تو.</div>", "n": 1, "i": 6, "a": "tefl-53-006", "x": "a83c4379"}, {"t": "learn", "h": "<div class=\"u\">Examples: can you speak French? He could speak it well if he studied more. May I come in? It might rain tomorrow. He will speak German once he feels confident.</div><div class=\"u\">أمثلة: بتعرف تتكلم فرنساوي؟ هو ممكن يتكلمه كويس لو ذاكر أكتر. ممكن أدخل؟ ممكن ينزل مطر بكرة. هو هيتكلم ألماني أول ما يحس بالثقة.</div>", "n": 1, "i": 7, "a": "tefl-53-007", "x": "fdb5a492"}, {"t": "section", "h": "Key points 1 to 6 | النقاط الأساسية ١ لـ ٦", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">Ten key points about modals. Point one: modals do not change their form at any time. Must remains must however you use it. There is no musted or musting.</div><div class=\"u\">عشر نقاط أساسية عن الأفعال الناقصة. نقطة واحد: الأفعال الناقصة مابتغيّرش شكلها أبدًا. المست بتفضل مست مهما استخدمتها. مفيش ماستد ولا ماستنج.</div>", "n": 1, "i": 9, "a": "tefl-53-008", "x": "ad41eea2"}, {"t": "learn", "h": "<div class=\"u\">They have no infinitive and no past or present participle. Just plain and simple must, can, should, at all times.</div><div class=\"u\">ملهاش مصدر ولا تصريف ماضي أو حاضر. بس مست وكان وشود بسيطة كده، في كل الأوقات.</div>", "n": 1, "i": 10, "a": "tefl-53-009", "x": "fecf5ef8"}, {"t": "learn", "h": "<div class=\"u\">Point two: a modal verb is always the first word in the verb phrase. After a modal verb, we put the base form of the verb, the verb stem, without to.</div><div class=\"u\">نقطة اتنين: الفعل الناقص دايمًا أول كلمة في مجموعة الفعل. بعد الفعل الناقص، بنحط الفعل الأساسي، من غير تو.</div>", "n": 1, "i": 11, "a": "tefl-53-010", "x": "6267f45c"}, {"t": "learn", "h": "<div class=\"u\">It will be windy. You should look after your money. You could go on Saturday.</div><div class=\"u\">الجو هيبقى فيه رياح. إنت المفروض تحافظ على فلوسك. إنت ممكن تروح يوم السبت.</div>", "n": 1, "i": 12, "a": "tefl-53-011", "x": "caf2065e"}, {"t": "learn", "h": "<div class=\"u\">Point three: like the other auxiliary verbs, be, have and do, modal verbs are important in negatives, questions and tags.</div><div class=\"u\">نقطة تلاتة: زي الأفعال المساعدة التانية، بي وهاف ودو، الأفعال الناقصة مهمة في النفي والأسئلة والأسئلة المذيّلة.</div>", "n": 1, "i": 13, "a": "tefl-53-012", "x": "f12fab47"}, {"t": "learn", "h": "<div class=\"u\">A modal can have not after it, and it comes before the subject in questions.</div><div class=\"u\">الفعل الناقص ممكن ييجي بعده نوت، وبييجي قبل الفاعل في الأسئلة.</div>", "n": 1, "i": 14, "a": "tefl-53-013", "x": "752e5bcc"}, {"t": "learn", "h": "<div class=\"u\">Positive: your room should be tidier. Negative: your room should not be untidy. Question: how should I organise my room? Question tag: you should tidy it each Saturday, should you not?</div><div class=\"u\">مثبت: أوضتك المفروض تبقى أنضف. منفي: أوضتك المفروض ماتبقاش متبهدلة. سؤال: أظبّط أوضتي إزاي؟ سؤال مذيّل: إنت المفروض تظبّطها كل يوم سبت، مش كده؟</div>", "n": 1, "i": 15, "a": "tefl-53-014", "x": "385dcd2b"}, {"t": "learn", "h": "<div class=\"u\">We do not use do with a modal. We never ask: how do I should organise my work?</div><div class=\"u\">مابنستخدمش الدو مع الفعل الناقص. أبدًا مابنسألش: هو أنا دو أشود أظبّط شغلي؟</div>", "n": 1, "i": 16, "a": "tefl-53-015", "x": "57642b49"}, {"t": "learn", "h": "<div class=\"u\">Point four: modal verbs do not take s in the third person. She should be here by now. He must try again. No s.</div><div class=\"u\">نقطة أربعة: الأفعال الناقصة مابتاخدش إس مع الغائب. هي المفروض تبقى هنا دلوقتي. هو لازم يحاول تاني. من غير إس.</div>", "n": 1, "i": 17, "a": "tefl-53-016", "x": "2bd5cc36"}, {"t": "learn", "h": "<div class=\"u\">Point five: will and would have the written short forms: I will call her now. I would not do that.</div><div class=\"u\">نقطة خمسة: الويل والوود ليهم صيغ مختصرة مكتوبة: أنا هكلمها دلوقتي. أنا مكنتش هعمل كده.</div>", "n": 1, "i": 18, "a": "tefl-53-017", "x": "a7b2c54c"}, {"t": "learn", "h": "<div class=\"u\">Point six: many modal verbs cannot be used in the past tenses or the future tenses. She musted travel there last year is wrong. She will can travel with us is wrong.</div><div class=\"u\">نقطة ستة: أفعال ناقصة كتير مابتقدرش تتستخدم في الأزمنة الماضية أو المستقبلية. هي ماستد تسافر السنة اللي فاتت غلط. هي ويل كان تسافر معانا غلط.</div>", "n": 1, "i": 19, "a": "tefl-53-018", "x": "ca0012d4"}, {"t": "section", "h": "Key points 7 to 10 | النقاط الأساسية ٧ لـ ١٠", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Point seven: we can stress a modal to put emphasis on its meaning. You really must be quiet, meaning it is very necessary.</div><div class=\"u\">نقطة سبعة: نقدر ننبّر على الفعل الناقص عشان نؤكّد معناه. إنت فعلًا لازم تسكت، يعني ده ضروري جدًا.</div>", "n": 1, "i": 21, "a": "tefl-53-019", "x": "64f5f341"}, {"t": "learn", "h": "<div class=\"u\">Point eight: a modal verb does not usually have a tense. It can refer to the present or the future.</div><div class=\"u\">نقطة تمنية: الفعل الناقص عادة ملوش زمن. ممكن يشاور على الحاضر أو المستقبل.</div>", "n": 1, "i": 22, "a": "tefl-53-020", "x": "76671437"}, {"t": "learn", "h": "<div class=\"u\">We must act now. The instructions might be in my desk. We must act soon. The instructions might arrive tomorrow.</div><div class=\"u\">لازم نتحرك دلوقتي. التعليمات ممكن تبقى في مكتبي. لازم نتحرك قريب. التعليمات ممكن توصل بكرة.</div>", "n": 1, "i": 23, "a": "tefl-53-021", "x": "ede457c0"}, {"t": "learn", "h": "<div class=\"u\">For the past we use had to or was able to, or a modal verb plus have: we had to know then. The instructions might have arrived yesterday.</div><div class=\"u\">للماضي بنستخدم الهاد تو أو الووز إيبل تو، أو فعل ناقص زائد هاف: كان لازم نعرف ساعتها. التعليمات ممكن تكون وصلت إمبارح.</div>", "n": 1, "i": 24, "a": "tefl-53-022", "x": "20c5f847"}, {"t": "learn", "h": "<div class=\"u\">In some contexts, could, would, should and might are past forms of can, will, shall and may: I cannot remember the password, present. I could not remember the password, past.</div><div class=\"u\">في بعض السياقات، الكود والوود والشود والمايت هما الماضي بتاع الكان والويل والشال والماي: أنا مش فاكر الباسورد، حاضر. أنا مكنتش فاكر الباسورد، ماضي.</div>", "n": 1, "i": 25, "a": "tefl-53-023", "x": "44f732c5"}, {"t": "learn", "h": "<div class=\"u\">Point nine: a modal verb can go with the perfect, the continuous or the passive. Perfect: I may have told you this before. Continuous: they may be waiting at the station.</div><div class=\"u\">نقطة تسعة: الفعل الناقص ممكن ييجي مع التام أو المستمر أو المبني للمجهول. التام: ممكن أكون قلتلك ده قبل كده. المستمر: ممكن يكونوا مستنيين في المحطة.</div>", "n": 1, "i": 26, "a": "tefl-53-024", "x": "3dcad0a9"}, {"t": "learn", "h": "<div class=\"u\">Passive: we may be shown the figures later.</div><div class=\"u\">المبني للمجهول: ممكن يتعرض علينا الأرقام بعدين.</div>", "n": 1, "i": 27, "a": "tefl-53-025", "x": "2f66a757"}, {"t": "learn", "h": "<div class=\"u\">Perfect plus continuous: you must have been sleeping. Perfect plus passive: the castle must have been destroyed.</div><div class=\"u\">تام زائد مستمر: إنت أكيد كنت نايم. تام زائد مبني للمجهول: القلعة أكيد كانت اتدمرت.</div>", "n": 1, "i": 28, "a": "tefl-53-026", "x": "f645d78c"}, {"t": "learn", "h": "<div class=\"u\">Point ten: we cannot use two modals together. You will must come soon is wrong.</div><div class=\"u\">نقطة عشرة: مابنقدرش نستخدم فعلين ناقصين مع بعض. إنت ويل مست تيجي قريب غلط.</div>", "n": 1, "i": 29, "a": "tefl-53-027", "x": "e3cf0566"}, {"t": "section", "h": "Common uses of each modal | استخدامات كل فعل ناقص", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Common uses of each modal. The tricky bit with modals is that there are nuances in meaning, so even one native user may choose a different modal from another native speaker.</div><div class=\"u\">الاستخدامات الشائعة لكل فعل ناقص. الجزء الصعب في الأفعال الناقصة إن فيها فروق معنى دقيقة، فحتى متحدث أصلي ممكن يختار فعل ناقص مختلف عن متحدث أصلي تاني.</div>", "n": 1, "i": 31, "a": "tefl-53-028", "x": "875f8f44"}, {"t": "learn", "h": "<div class=\"u\">Can: ability, I can speak four languages. Possibility, you can make it if you try. Inability, we cannot do that.</div><div class=\"u\">الكان: القدرة، أنا بتكلم أربع لغات. الإمكانية، تقدر توصلها لو حاولت. عدم القدرة، مابنقدرش نعمل كده.</div>", "n": 1, "i": 32, "a": "tefl-53-029", "x": "fd8d680e"}, {"t": "learn", "h": "<div class=\"u\">Can: asking for permission, can I sit down? Requests, can you give me a hand? Opportunity, we can try that when we arrive.</div><div class=\"u\">الكان: طلب الإذن، ممكن أقعد؟ الطلبات، ممكن تدّيني يد لو سمحت؟ الفرصة، نقدر نجرب ده لما نوصل.</div>", "n": 1, "i": 33, "a": "tefl-53-030", "x": "8a5d9725"}, {"t": "learn", "h": "<div class=\"u\">Could: asking for permission, could I open the window? Requests, could you repeat that? Suggestion, we could try to repair it ourselves.</div><div class=\"u\">الكود: طلب الإذن، ممكن أفتح الشباك؟ الطلبات، ممكن تعيد اللي قلته؟ الاقتراح، نقدر نحاول نصلّحه بأنفسنا.</div>", "n": 1, "i": 34, "a": "tefl-53-031", "x": "dda5ad71"}, {"t": "learn", "h": "<div class=\"u\">Could: future possibility, the bad winter could affect next spring's crop.</div><div class=\"u\">الكود: إمكانية مستقبلية، الشتا الوحش ممكن يأثّر على محصول الربيع الجاي.</div>", "n": 1, "i": 35, "a": "tefl-53-032", "x": "6f7cf766"}, {"t": "learn", "h": "<div class=\"u\">Could also: ability in the past, he had done it before so he could do it again. Suggestion, we could get the bus or phone a taxi.</div><div class=\"u\">الكود كمان: القدرة في الماضي، هو عملها قبل كده فكان يقدر يعملها تاني. الاقتراح، ممكن ناخد الأتوبيس أو نطلب تاكسي.</div>", "n": 1, "i": 36, "a": "tefl-53-033", "x": "14010c14"}, {"t": "learn", "h": "<div class=\"u\">Could conditional: we could go if I did not have to attend that meeting.</div><div class=\"u\">الكود الشرطية: كنا نقدر نروح لو مكانش لازم أحضر الاجتماع ده.</div>", "n": 1, "i": 37, "a": "tefl-53-034", "x": "d63acb87"}, {"t": "learn", "h": "<div class=\"u\">May: asking for permission, may I sit down? Giving permission, you may play with the tablet once you have finished.</div><div class=\"u\">الماي: طلب الإذن، ممكن أقعد؟ إعطاء الإذن، ممكن تلعب بالتابلت لما تخلّص.</div>", "n": 1, "i": 38, "a": "tefl-53-035", "x": "78ad6710"}, {"t": "learn", "h": "<div class=\"u\">May: future possibility, the rain forests may soon disappear. Present possibility, she may be in the supermarket.</div><div class=\"u\">الماي: إمكانية مستقبلية، الغابات المطيرة ممكن تختفي قريب. إمكانية حاضرة، هي ممكن تبقى في السوبر ماركت.</div>", "n": 1, "i": 39, "a": "tefl-53-036", "x": "23c9c3b7"}, {"t": "learn", "h": "<div class=\"u\">Might: present possibility, your keys might be in your coat pocket. Future possibility, they might give us a lift. Suggestion, you might drop in on Uncle Bill.</div><div class=\"u\">المايت: إمكانية حاضرة، مفاتيحك ممكن تبقى في جيب الجاكيت. إمكانية مستقبلية، هما ممكن يوصّلونا. الاقتراح، ممكن تعدّي على عمّك بيل.</div>", "n": 1, "i": 40, "a": "tefl-53-037", "x": "dfa395a0"}, {"t": "learn", "h": "<div class=\"u\">Might: request, might I open the window? Conditional, if I had tried harder, I might have succeeded.</div><div class=\"u\">المايت: الطلب، ممكن أفتح الشباك؟ الشرطية، لو كنت حاولت أكتر، كنت ممكن أنجح.</div>", "n": 1, "i": 41, "a": "tefl-53-038", "x": "6ee9ab00"}, {"t": "learn", "h": "<div class=\"u\">Must: necessity or obligation, we must leave now. Prohibition, Lucy, you must not touch that.</div><div class=\"u\">المست: الضرورة أو الالتزام، لازم نمشي دلوقتي. المنع، لوسي، ممنوع تلمسي ده.</div>", "n": 1, "i": 42, "a": "tefl-53-039", "x": "cd506830"}, {"t": "learn", "h": "<div class=\"u\">Must: certainty, this must be Uncle Bill's house. Recommendation, you must do more training before you compete.</div><div class=\"u\">المست: اليقين، ده أكيد بيت عمّك بيل. التوصية، لازم تتمرّن أكتر قبل ما تنافس.</div>", "n": 1, "i": 43, "a": "tefl-53-040", "x": "55907b48"}, {"t": "learn", "h": "<div class=\"u\">Ought to: doing what is right, we ought to own up to that. Recommendation, you ought to stop smoking. Deserving, Lisa ought to win. Probability, the exchange rate ought to drop.</div><div class=\"u\">الأوت تو: عمل الصح، المفروض نعترف بده. التوصية، المفروض تبطّل تدخين. الاستحقاق، ليزا المفروض تكسب. الاحتمالية، سعر الصرف المفروض ينزل.</div>", "n": 1, "i": 44, "a": "tefl-53-041", "x": "e8709866"}, {"t": "learn", "h": "<div class=\"u\">Ought to: advice for, you ought to try it. Advice against, you ought not try it, and notice the to is dropped in the negative.</div><div class=\"u\">الأوت تو: نصيحة بـ، المفروض تجربه. نصيحة ضد، المفروض متجربهوش، ولاحظ إن التو بتتشال في النفي.</div>", "n": 1, "i": 45, "a": "tefl-53-042", "x": "7e5b2219"}, {"t": "learn", "h": "<div class=\"u\">Shall: offer, shall I help you with that? Suggestion, shall we meet the same time next week? Asking what to do, shall I do that or will you?</div><div class=\"u\">الشال: العرض، أساعدك في ده؟ الاقتراح، نتقابل نفس المعاد الأسبوع الجاي؟ السؤال عن المطلوب، أعملها أنا ولا إنت؟</div>", "n": 1, "i": 46, "a": "tefl-53-043", "x": "34711ad9"}, {"t": "learn", "h": "<div class=\"u\">Shall: promise, I shall never forget the first time we met. Belief it will happen, we shall overcome. Inevitability, I am afraid we shall lose our jobs.</div><div class=\"u\">الشال: الوعد، عمري ما هنسى أول مرة اتقابلنا. الاعتقاد إنه هيحصل، هنغلب. الحتمية، للأسف هنخسر شغلنا.</div>", "n": 1, "i": 47, "a": "tefl-53-044", "x": "56fd7fe5"}, {"t": "learn", "h": "<div class=\"u\">Shall is much more common in British English than American English.</div><div class=\"u\">الشال منتشر أكتر بكتير في الإنجليزي البريطاني عن الأمريكاني.</div>", "n": 1, "i": 48, "a": "tefl-53-045", "x": "1675827f"}, {"t": "learn", "h": "<div class=\"u\">Should: doing what is right, we should resolve this now. Recommending action, I think we should action this now. Uncertain prediction, profits should rise next quarter.</div><div class=\"u\">الشود: عمل الصح، المفروض نحل ده دلوقتي. توصية بفعل، أنا شايف المفروض ننفّذ ده دلوقتي. توقع غير مؤكد، الأرباح المفروض تزيد الربع الجاي.</div>", "n": 1, "i": 49, "a": "tefl-53-046", "x": "272e2451"}, {"t": "learn", "h": "<div class=\"u\">Should: advice, you should strive for a better balance. Obligation, I really should be studying right now. Expectation, they should already be in the hotel.</div><div class=\"u\">الشود: النصيحة، المفروض تسعى لتوازن أحسن. الالتزام، أنا فعلًا المفروض أكون بذاكر دلوقتي. التوقع، هما المفروض يكونوا وصلوا الأوتيل.</div>", "n": 1, "i": 50, "a": "tefl-53-047", "x": "72e1ed16"}, {"t": "learn", "h": "<div class=\"u\">Will: instant decisions, I will phone her right now. Offer, I will do that for you if you like. Promise, I promise that I will phone as soon as I arrive.</div><div class=\"u\">الويل: القرارات الفورية، هكلمها حالًا. العرض، هعملهولك لو تحب. الوعد، وعدت إني هتصل أول ما أوصل.</div>", "n": 1, "i": 51, "a": "tefl-53-048", "x": "d4670d1e"}, {"t": "learn", "h": "<div class=\"u\">Will: certain prediction, profits will increase next year. Less certain prediction, he thinks the office will be closed due to the snow.</div><div class=\"u\">الويل: توقع مؤكد، الأرباح هتزيد السنة الجاية. توقع أقل تأكدًا، هو فاكر إن المكتب هيبقى مقفول بسبب التلج.</div>", "n": 1, "i": 52, "a": "tefl-53-049", "x": "aa31134f"}, {"t": "learn", "h": "<div class=\"u\">Would: asking for permission, would you mind if I brought my wife along? Requests, would you pass the milk, please? Arrangements, would eight in the evening suit you?</div><div class=\"u\">الوود: طلب الإذن، عندك مانع لو جبت مراتي معايا؟ الطلبات، ممكن تناولني اللبن لو سمحت؟ الترتيبات، الساعة تمنية بالليل تناسبك؟</div>", "n": 1, "i": 53, "a": "tefl-53-050", "x": "480a869e"}, {"t": "learn", "h": "<div class=\"u\">Would: invitation, would you like to join us? Preferences, would you prefer red or white?</div><div class=\"u\">الوود: الدعوة، تحب تنضم لينا؟ التفضيلات، بتفضّل الأحمر ولا الأبيض؟</div>", "n": 1, "i": 54, "a": "tefl-53-051", "x": "cfdeac19"}, {"t": "learn", "h": "<div class=\"u\">Would also: conditional, if he were more ambitious, he would be the CEO by now. Repetition in the past, when he first got the car, he would wash it every Saturday.</div><div class=\"u\">الوود كمان: الشرطية، لو كان طموح أكتر، كان هيبقى المدير التنفيذي دلوقتي. التكرار في الماضي، أول ما جاب العربية، كان بيفضل يغسلها كل يوم سبت.</div>", "n": 1, "i": 55, "a": "tefl-53-052", "x": "b22307a8"}, {"t": "section", "h": "Teaching modals | تعليم الأفعال الناقصة", "n": 1, "i": 56}, {"t": "learn", "h": "<div class=\"u\">Teaching modals. We have already said this is very challenging. One of the best ways is to use visual representations of the modals.</div><div class=\"u\">تعليم الأفعال الناقصة. قلنا قبل كده إن ده صعب جدًا. واحدة من أحسن الطرق هي استخدام رسوم تمثيلية للأفعال الناقصة.</div>", "n": 1, "i": 57, "a": "tefl-53-053", "x": "d5dc5c00"}, {"t": "learn", "h": "<div class=\"u\">With visual scales it is easier to show the degrees of probability and prediction.</div><div class=\"u\">بالمقاييس البصرية أسهل نظهر درجات الاحتمالية والتوقع.</div>", "n": 1, "i": 58, "a": "tefl-53-054", "x": "e9b6b69b"}, {"t": "learn", "h": "<div class=\"u\">We have found this to be the best way to demonstrate modals and to keep the learners' attention when teaching this difficult topic.</div><div class=\"u\">لقينا إن دي أحسن طريقة نوضّح بيها الأفعال الناقصة ونحافظ على انتباه المتعلمين في الموضوع الصعب ده.</div>", "n": 1, "i": 59, "a": "tefl-53-055", "x": "f39659ee"}, {"t": "learn", "h": "<div class=\"u\">Example context showing the least probability: Alejandro says, somebody is at the door. Cristina says, it could be Mum.</div><div class=\"u\">مثال سياق بيظهر أقل احتمالية: أليخاندرو بيقول، في حد على الباب. كريستينا بتقول، ممكن تبقى ماما.</div>", "n": 1, "i": 60, "a": "tefl-53-056", "x": "3a28f1d7"}, {"t": "learn", "h": "<div class=\"u\">The course then shows a range of probability expressed through different modals, and the past forms of those modals.</div><div class=\"u\">الكورس بعدين بيظهر مدى من الاحتمالية معبّر عنه بأفعال ناقصة مختلفة، والأشكال الماضية بتاعتها.</div>", "n": 1, "i": 61, "a": "tefl-53-057", "x": "83307f97"}, {"t": "learn", "h": "<div class=\"u\">It also shows a set of modals for degrees of prediction, and a visual scale for giving advice, where a general suggestion escalates into urgency.</div><div class=\"u\">وبيظهر كمان مجموعة أفعال ناقصة لدرجات التوقع، ومقياس بصري لتقديم النصيحة، اللي فيه الاقتراح العام بيتصاعد لحد الاستعجال.</div>", "n": 1, "i": 62, "a": "tefl-53-058", "x": "885d274b"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 63}, {"t": "learn", "h": "<div class=\"u\">modal verb: an auxiliary verb expressing probability, ability, obligation, attitude or politeness.</div><div class=\"u\">الفعل الناقص: فعل مساعد بيعبّر عن الاحتمالية أو القدرة أو الالتزام أو الموقف أو الأدب.</div>", "n": 1, "i": 64, "a": "tefl-53-059", "x": "2752b3d2"}, {"t": "learn", "h": "<div class=\"u\">auxiliary verb: a helping verb, like be, have, do and the modals.</div><div class=\"u\">الفعل المساعد: فعل بيساعد، زي بي وهاف ودو والأفعال الناقصة.</div>", "n": 1, "i": 65, "a": "tefl-53-060", "x": "bb51773f"}, {"t": "learn", "h": "<div class=\"u\">verb stem: the base form of the verb, without to, used after a modal.</div><div class=\"u\">جذع الفعل: الصيغة الأساسية للفعل، من غير تو، بتتستخدم بعد الفعل الناقص.</div>", "n": 1, "i": 66, "a": "tefl-53-061", "x": "4a7fcc61"}, {"t": "learn", "h": "<div class=\"u\">question tag: a short question at the end, like should you not.</div><div class=\"u\">السؤال المذيّل: سؤال قصير في الآخر، زي مش كده.</div>", "n": 1, "i": 67, "a": "tefl-53-062", "x": "e5d0acd1"}, {"t": "learn", "h": "<div class=\"u\">probability: how likely something is to happen.</div><div class=\"u\">الاحتمالية: مدى احتمال حاجة تحصل.</div>", "n": 1, "i": 68, "a": "tefl-53-063", "x": "31797277"}, {"t": "learn", "h": "<div class=\"u\">obligation: something you must do.</div><div class=\"u\">الالتزام: حاجة لازم تعملها.</div>", "n": 1, "i": 69, "a": "tefl-53-064", "x": "d28c1864"}, {"t": "learn", "h": "<div class=\"u\">prohibition: something you must not do.</div><div class=\"u\">المنع: حاجة ممنوع تعملها.</div>", "n": 1, "i": 70, "a": "tefl-53-065", "x": "788f5cc6"}, {"t": "learn", "h": "<div class=\"u\">nuance: a small difference in meaning between near-synonyms.</div><div class=\"u\">الفروق الدقيقة: اختلاف صغير في المعنى بين كلمات متقاربة.</div>", "n": 1, "i": 71, "a": "tefl-53-066", "x": "312d194b"}, {"t": "learn", "h": "<div class=\"u\">visual scale: a picture that shows degrees, used to teach modals.</div><div class=\"u\">المقياس البصري: رسمة بتظهر الدرجات، بتتستخدم في تعليم الأفعال الناقصة.</div>", "n": 1, "i": 72, "a": "tefl-53-067", "x": "2bbbfab7"}, {"t": "learn", "h": "<div class=\"u\">perfect infinitive: modal plus have plus past participle, for the past.</div><div class=\"u\">المصدر التام: فعل ناقص زائد هاف زائد التصريف التالت، للماضي.</div>", "n": 1, "i": 73, "a": "tefl-53-068", "x": "1f2be2aa"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 74}, {"t": "learn", "h": "<div class=\"u\">Modals are auxiliary verbs expressing probability, ability, obligation, attitude, politeness, requests and permission.</div><div class=\"u\">الأفعال الناقصة أفعال مساعدة بتعبّر عن الاحتمالية والقدرة والالتزام والموقف والأدب والطلبات والإذن.</div>", "n": 1, "i": 75, "a": "tefl-53-069", "x": "c85491a6"}, {"t": "learn", "h": "<div class=\"u\">The ten modals: can, could, may, might, will, would, must, shall, should, ought to.</div><div class=\"u\">الأفعال العشرة: كان وكود وماي ومايت وويل ووود ومست وشال وشود وأوت تو.</div>", "n": 1, "i": 76, "a": "tefl-53-070", "x": "50261389"}, {"t": "learn", "h": "<div class=\"u\">Modals never change form, come first in the verb phrase, take the verb stem after them, and take not for negatives.</div><div class=\"u\">الأفعال الناقصة أبدًا مابتغيّر شكلها، بتيجي أول مجموعة الفعل، بييجي بعدها جذع الفعل، وبتاخد نوت للنفي.</div>", "n": 1, "i": 77, "a": "tefl-53-071", "x": "a1041e91"}, {"t": "learn", "h": "<div class=\"u\">They need no do in questions, take no third-person s, and never pair together.</div><div class=\"u\">مش محتاجة دو في الأسئلة، مابتاخدش إس مع الغائب، وأبدًا مابتتجمع اتنين مع بعض.</div>", "n": 1, "i": 78, "a": "tefl-53-072", "x": "c2d1c9ec"}, {"t": "learn", "h": "<div class=\"u\">Modals usually carry no tense: present or future directly, past with had to or modal plus have.</div><div class=\"u\">الأفعال الناقصة عادة من غير زمن: حاضر أو مستقبل مباشرة، وماضي بالهاد تو أو فعل ناقص زائد هاف.</div>", "n": 1, "i": 79, "a": "tefl-53-073", "x": "e2d44036"}, {"t": "learn", "h": "<div class=\"u\">Teach modals with visual scales that show degrees of probability, prediction and advice, from least likely to certain, from suggestion to urgency.</div><div class=\"u\">علّم الأفعال الناقصة بمقاييس بصرية بتظهر درجات الاحتمالية والتوقع والنصيحة، من الأقل احتمالًا للمؤكد، ومن الاقتراح للاستعجال.</div>", "n": 1, "i": 80, "a": "tefl-53-074", "x": "7fcdc753"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 81}, {"t": "mc", "q": "Which of these is correct?<br>أنهي واحدة في دول صح؟", "opts": ["She should be here by now. | هي المفروض تبقى هنا دلوقتي.", "She shoulds be here by now. | هي المفروضات تبقى هنا دلوقتي.", "She should to be here now. | هي المفروض لـ تبقى هنا دلوقتي."], "ans": 0, "why": "Modals take no third-person s and no to after them. | الأفعال الناقصة مابتاخدش إس مع الغائب ولا تو بعدها.", "ex": ["Correct. | صح.", "No. Modals never take s. | غلط: الأفعال الناقصة أبدًا مابتاخدش إس.", "No. The verb stem has no to. | غلط: جذع الفعل من غير تو."], "n": 1, "i": 82, "h": ""}, {"t": "tf", "q": "We can say: you will must come soon.<br>نقدر نقول: إنت ويل مست تيجي قريب.", "ans": false, "why": "False. We cannot use two modals together. | غلط. مابنقدرش نستخدم فعلين ناقصين مع بعض.", "ex": ["Correct. | صح.", "Wrong. Only one modal at a time. | غلط: فعل ناقص واحد بس في المرة."], "n": 1, "i": 83, "h": ""}, {"t": "mc", "q": "May I come in? The modal here expresses:<br>ممكن أدخل؟ الفعل الناقص هنا بيعبّر عن إيه؟", "opts": ["asking for permission | طلب الإذن", "certainty | اليقين", "prohibition | المنع"], "ans": 0, "why": "May is used to ask for permission politely. | الماي بتتستخدم لطلب الإذن بأدب.", "ex": ["Correct. | صح.", "No. That would be must. | غلط: ده هيبقى مست.", "No. That would be must not. | غلط: ده هيبقى مست نوت."], "n": 1, "i": 84, "h": ""}, {"t": "mc", "q": "This must be Uncle Bill's house! Must here expresses:<br>ده أكيد بيت عمّك بيل! المست هنا بتعبّر عن إيه؟", "opts": ["certainty | اليقين", "ability | القدرة", "suggestion | الاقتراح"], "ans": 0, "why": "Must can express certainty: the speaker is sure. | المست ممكن تعبّر عن اليقين: المتكلم متأكد.", "ex": ["Correct. | صح.", "No. Ability uses can. | غلط: القدرة بتستخدم كان.", "No. Suggestion uses could or might. | غلط: الاقتراح بيستخدم كود أو مايت."], "n": 1, "i": 85, "h": ""}, {"t": "tf", "q": "There is a past form: musted.<br>في صيغة ماضي: ماستد.", "ans": false, "why": "False. Modals never change their form. For the past we say had to. | غلط. الأفعال الناقصة أبدًا مابتغيّر شكلها. للماضي بنقول هاد تو.", "ex": ["Correct. | صح.", "Wrong. Must stays must at all times. | غلط: المست بتفضل مست في كل الأوقات."], "n": 1, "i": 86, "h": ""}, {"t": "mc", "q": "How do we make a question with a modal?<br>نعمل سؤال بفعل ناقص إزاي؟", "opts": ["put the modal before the subject | نحط الفعل الناقص قبل الفاعل", "use do with the modal | نستخدم دو مع الفعل الناقص", "add s to the modal | نضيف إس للفعل الناقص"], "ans": 0, "why": "The modal comes before the subject in questions; we never use do. | الفعل الناقص بييجي قبل الفاعل في الأسئلة؛ وأبدًا مابنستخدمش دو.", "ex": ["Correct. | صح.", "No. Do is never used with a modal. | غلط: الدو أبدًا مابتتستخدمش مع الفعل الناقص.", "No. Modals take no s. | غلط: الأفعال الناقصة مابتاخدش إس."], "n": 1, "i": 87, "h": ""}, {"t": "mc", "q": "The instructions might have arrived yesterday. This uses:<br>التعليمات ممكن تكون وصلت إمبارح. ده بيستخدم إيه؟", "opts": ["a modal plus have for the past | فعل ناقص زائد هاف للماضي", "two modals together | فعلين ناقصين مع بعض", "a past form of might | صيغة ماضي للمايت"], "ans": 0, "why": "For past meaning, use a modal plus have plus past participle. | للمعنى الماضي، استخدم فعل ناقص زائد هاف زائد التصريف التالت.", "ex": ["Correct. | صح.", "No. Two modals cannot combine. | غلط: فعلين ناقصين مابيتجمعوش.", "No. Might has no past form here. | غلط: المايت ملهاش صيغة ماضي هنا."], "n": 1, "i": 88, "h": ""}, {"t": "mc", "q": "The best way to teach modals is:<br>أحسن طريقة لتعليم الأفعال الناقصة هي:", "opts": ["visual scales showing degrees of probability | مقاييس بصرية بتظهر درجات الاحتمالية", "long word lists to memorise | قوائم كلمات طويلة للحفظ", "ignoring them until advanced levels | تجاهلها لحد المستويات المتقدمة"], "ans": 0, "why": "Visual representations make degrees of probability and prediction easy to see and keep attention. | الرسوم التمثيلية بتخلّي درجات الاحتمالية والتوقع سهلة المنظر وبتحافظ على الانتباه.", "ex": ["Correct. | صح.", "No. Lists hide the degrees of meaning. | غلط: القوائم بتخبّي درجات المعنى.", "No. Modals appear in everyday speech early. | غلط: الأفعال الناقصة بتظهر في الكلام اليومي بدري."], "n": 1, "i": 89, "h": ""}, {"t": "recall", "q": "List the ten modal verbs.<br>اذكر الأفعال الناقصة العشرة.", "a": "Can, could, may, might, will, would, must, shall, should, ought to.<br>كان وكود وماي ومايت وويل ووود ومست وشال وشود وأوت تو.", "n": 1, "i": 90, "h": ""}, {"t": "recall", "q": "Name five of the ten key points about modal verbs.<br>اذكر خمسة من النقاط الأساسية العشرة عن الأفعال الناقصة.", "a": "Any five of: they never change form; they come first in the verb phrase with the verb stem after; they work in negatives, questions and tags without do; no third-person s; will and would have short forms; many have no past or future form; they can be stressed for emphasis; they usually carry no tense; they combine with perfect, continuous and passive; two modals cannot combine.<br>أي خمسة من: أبدًا مابتغيّر شكلها؛ بتيجي أول مجموعة الفعل وبعدها جذع الفعل؛ بتشتغل في النفي والأسئلة والأسئلة المذيّلة من غير دو؛ مفيش إس مع الغائب؛ الويل والوود ليهم صيغ مختصرة؛ كتير منها ملهاش ماضي أو مستقبل؛ ممكن تتنبّر للتأكيد؛ عادة من غير زمن؛ بتتجمع مع التام والمستمر والمبني للمجهول؛ فعلين ناقصين مابيتجمعوش.", "n": 1, "i": 91, "h": ""}, {"t": "write", "q": "Explain four key points about the form of modal verbs. (3-4 sentences)<br>اشرح أربع نقاط أساسية عن شكل الأفعال الناقصة. (٣-٤ جمل).", "key": "tefl-53:1", "a": "Modals never change their form: there is no musted or musting. A modal is always the first word in the verb phrase, followed by the verb stem without to. Modals work in negatives, questions and tags without do: should you not? They take no s in the third person, and we can never put two modals together.<br>الأفعال الناقصة أبدًا مابتغيّر شكلها: مفيش ماستد ولا ماستنج. الفعل الناقص دايمًا أول كلمة في مجموعة الفعل، وبعده جذع الفعل من غير تو. الأفعال الناقصة بتشتغل في النفي والأسئلة والأسئلة المذيّلة من غير دو: مش كده؟ مابتاخدش إس مع الغائب، وأبدًا مابنحطش فعلين ناقصين مع بعض.", "n": 1, "i": 92, "h": ""}, {"t": "write", "q": "How would you teach the difference between must, should and could? (3-4 sentences)<br>إزاي هتعلّم الفرق بين المست والشود والكود؟ (٣-٤ جمل).", "key": "tefl-53:2", "a": "I would use a visual scale, because degrees are easier to see than to explain. I would put the three modals on the scale: could at the weak end, should in the middle, must at the strong end. Then I would anchor them in one context, like the door example: somebody is at the door, it could be Mum, it should be Mum, it must be Mum. Students see the same situation with three different strengths, and the degrees become clear.<br>أنا هستخدم مقياس بصري، لأن الدرجات أسهل تتشاف عن ما تتشرح. هحط الأفعال التلاتة على المقياس: الكود في الطرف الضعيف، الشود في النص، المست في الطرف القوي. وبعدين هثبّتهم في سياق واحد، زي مثال الباب: في حد على الباب، ممكن تبقى ماما، المفروض تبقى ماما، أكيد ماما. الطلبة بيشوفوا نفس الموقف بتلات قوى مختلفة، والدرجات بتبقى واضحة.", "n": 1, "i": 93, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the Barcelona DVD grammar lesson and concept questions.</div><div class=\"u\">الدرس الجاي: درس قواعد برشلونة وأسئلة التحقق من الفهم.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 94}];</script>
