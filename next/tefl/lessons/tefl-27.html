<h1>عالم تيفل ٢٧: اختيار مهام التقييم</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٢٧</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-27";window.STEPS=[{"t": "section", "h": "Formal assessment | التقييم الرسمي", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Assessment is a necessary part of any course. It helps you understand your students' strengths and weaknesses, their progress, and even their receptiveness to learning.</div><div class=\"u\">التقييم جزء لازم من أي كورس. بيساعدك تفهم نقاط قوة وضعف طلبتك، وتقدمهم، وحتى تقبّلهم للتعلم.</div>", "n": 1, "i": 1, "a": "tefl-27-001", "x": "3b94ede4"}, {"t": "learn", "h": "<div class=\"u\">Four types of formal assessment. One: the proficiency test, which assesses overall language ability.</div><div class=\"u\">أربع أنواع من التقييم الرسمي. واحد: اختبار الكفاءة، اللي بيقيّم القدرة اللغوية العامة.</div>", "n": 1, "i": 2, "a": "tefl-27-002", "x": "9de8ef14"}, {"t": "learn", "h": "<div class=\"u\">Two: the progress test, which assesses how well students have understood a unit or section of a course.</div><div class=\"u\">اتنين: اختبار التقدم، اللي بيقيّم مدى فهم الطلبة لوحدة أو جزء من كورس.</div>", "n": 1, "i": 3, "a": "tefl-27-003", "x": "a510c18b"}, {"t": "learn", "h": "<div class=\"u\">Three: the end-of-course test, which assesses learning at the end of the programme.</div><div class=\"u\">تلاتة: اختبار نهاية الكورس، اللي بيقيّم التعلم في نهاية البرنامج.</div>", "n": 1, "i": 4, "a": "tefl-27-004", "x": "f95178dd"}, {"t": "learn", "h": "<div class=\"u\">Four: external examinations, such as IELTS and Cambridge ESOL exams, a form of proficiency test which gives students a certificate of language ability.</div><div class=\"u\">أربعة: الامتحانات الخارجية، زي IELTS وامتحانات كامبريدج ESOL، شكل من اختبار الكفاءة بيدّي الطلبة شهادة قدرة لغوية.</div>", "n": 1, "i": 5, "a": "tefl-27-005", "x": "ebabcf80"}, {"t": "learn", "h": "<div class=\"u\">Formal assessments need a variety of tasks so that all four language skills are covered, and because each kind of activity has its own pros and cons.</div><div class=\"u\">التقييمات الرسمية محتاجة تنوع في المهام عشان المهارات الأربعة كلها تتغطى، ولأن كل نوع نشاط ليه مميزاته وعيوبه.</div>", "n": 1, "i": 6, "a": "tefl-27-006", "x": "c8ce193d"}, {"t": "learn", "h": "<div class=\"u\">There is also the need to assess both passive and active language knowledge: understanding, and being able to produce.</div><div class=\"u\">وكمان في حاجة لتقييم المعرفة اللغوية السلبية والنشطة مع بعض: الفهم، والقدرة على الإنتاج.</div>", "n": 1, "i": 7, "a": "tefl-27-007", "x": "b48b8439"}, {"t": "section", "h": "Marking and task types | التصحيح وأنواع المهام", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">A good test should be fair, appropriate, and not too difficult to mark.</div><div class=\"u\">الاختبار الكويس المفروض يبقى عادل ومناسب ومش صعب في التصحيح.</div>", "n": 1, "i": 9, "a": "tefl-27-008", "x": "7905285f"}, {"t": "learn", "h": "<div class=\"u\">Single-focus tasks such as True/False/Don't know and matching exercises are easy to mark, because the answers are either correct or incorrect.</div><div class=\"u\">المهام أحادية التركيز زي صح/غلط/مش عارف وتمارين التوصيل سهلة التصحيح، لأن الإجابات يا صح يا غلط.</div>", "n": 1, "i": 10, "a": "tefl-27-009", "x": "52e96cb8"}, {"t": "learn", "h": "<div class=\"u\">Extended activities such as interviews or writing tasks are best for assessing productive skills, but are slightly trickier to mark because they are subjective.</div><div class=\"u\">الأنشطة الممتدة زي المقابلات أو مهام الكتابة أحسن حاجة لتقييم مهارات الإنتاج، بس أصعب شوية في التصحيح لأنها ذاتية.</div>", "n": 1, "i": 11, "a": "tefl-27-010", "x": "6a7bb2b1"}, {"t": "learn", "h": "<div class=\"u\">The unit's matching task, solved. Task 1: complete the sentence so it means exactly the same, like my brother lent me a pen becomes I borrowed a pen from my brother.</div><div class=\"u\">تمرين التوصيل في الوحدة، محلول. مهمة ١: كمّل الجملة بحيث تفضل بنفس المعنى بالظبط، زي my brother lent me a pen تبقى I borrowed a pen from my brother.</div>", "n": 1, "i": 12, "a": "tefl-27-011", "x": "2796b986"}, {"t": "learn", "h": "<div class=\"u\">That is a sentence transformation, testing knowledge of grammatical structures and relationships between language.</div><div class=\"u\">ده تحويل جمل، بيختبر معرفة التراكيب النحوية والعلاقات بين اللغة.</div>", "n": 1, "i": 13, "a": "tefl-27-012", "x": "57df9cfb"}, {"t": "learn", "h": "<div class=\"u\">Task 2: to want go Do the you park to? becomes Do you want to go to the park? That is re-ordering jumbled sentences, testing grammatical knowledge, cohesion and collocation.</div><div class=\"u\">مهمة ٢: to want go Do the you park to? تبقى Do you want to go to the park? ده ترتيب جمل مخلوطة، بيختبر المعرفة النحوية والترابط والتلازم اللفظي.</div>", "n": 1, "i": 14, "a": "tefl-27-013", "x": "fc72048e"}, {"t": "learn", "h": "<div class=\"u\">Task 3: read the novel extract and write a synopsis for a young audience. That is summary writing, testing reading comprehension, writing ability and a range of language knowledge.</div><div class=\"u\">مهمة ٣: اقرا مقطع الرواية واكتب ملخص لجمهور صغير. ده كتابة ملخص، بيختبر فهم القراية والقدرة على الكتابة ومدى من المعرفة اللغوية.</div>", "n": 1, "i": 15, "a": "tefl-27-014", "x": "f54759ab"}, {"t": "learn", "h": "<div class=\"u\">Task 4: a text with blanked-out words, completed with one word in each space, with or without a word bank. That is a cloze test, testing grammar, lexis, and reading comprehension.</div><div class=\"u\">مهمة ٤: نص بكلمات ممسوحة، بيتكمل بكلمة واحدة في كل فراغ، بقايمة كلمات أو من غيرها. ده اختبار كلوز، بيختبر القواعد والمفردات وفهم القراية.</div>", "n": 1, "i": 16, "a": "tefl-27-015", "x": "1fc200a4"}, {"t": "section", "h": "Informal assessment | التقييم غير الرسمي", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">However, assessment need not always be a test or formal examination. Informal assessment is equally as important.</div><div class=\"u\">بس التقييم مش لازم دايمًا يبقى اختبار أو امتحان رسمي. التقييم غير الرسمي مهم بنفس الدرجة.</div>", "n": 1, "i": 18, "a": "tefl-27-016", "x": "4e6f054a"}, {"t": "learn", "h": "<div class=\"u\">It can come in the form of homework tasks or class activities.</div><div class=\"u\">ممكن يجي في شكل مهام واجب أو أنشطة فصل.</div>", "n": 1, "i": 19, "a": "tefl-27-017", "x": "379dbfa0"}, {"t": "learn", "h": "<div class=\"u\">Formal assessment does not always reflect students' true abilities; perhaps they are nervous or misread instructions.</div><div class=\"u\">التقييم الرسمي مش دايمًا بيعكس قدرات الطلبة الحقيقية؛ ممكن يكونوا متوترين أو قرأوا التعليمات غلط.</div>", "n": 1, "i": 20, "a": "tefl-27-018", "x": "0d7a98fe"}, {"t": "learn", "h": "<div class=\"u\">Informal assessments can often provide a better overview of students' all-round skills.</div><div class=\"u\">التقييمات غير الرسمية غالبًا بتدّي صورة أشمل أفضل لمهارات الطلبة الكلية.</div>", "n": 1, "i": 21, "a": "tefl-27-019", "x": "18c5e0ef"}, {"t": "learn", "h": "<div class=\"u\">They also help you understand how successful your teaching has been, and plan future lessons with the students' constant development in mind.</div><div class=\"u\">وكمان بتساعدك تفهم مدى نجاح تدريسك، وتخطط دروس المستقبل وانت حاطط تطور الطلبة المستمر في دماغك.</div>", "n": 1, "i": 22, "a": "tefl-27-020", "x": "e6ed8dd5"}, {"t": "learn", "h": "<div class=\"u\">Informal assessment can be any activity done in class or at home where you keep a note of marks or progress, but without giving students an actual grade.</div><div class=\"u\">التقييم غير الرسمي ممكن يكون أي نشاط في الفصل أو البيت بتسجّل فيه ملاحظات عن الدرجات أو التقدم، بس من غير ما تدّي الطلبة تقدير فعلي.</div>", "n": 1, "i": 23, "a": "tefl-27-021", "x": "ff2d7cba"}, {"t": "learn", "h": "<div class=\"u\">You could ask students to build a portfolio, which provides continuous assessment and allows them to evaluate their own work.</div><div class=\"u\">ممكن تطلب من الطلبة يعملوا ملف إنجاز، اللي بيوفّر تقييم مستمر وبيسمح لهم يقيّموا شغلهم بنفسهم.</div>", "n": 1, "i": 24, "a": "tefl-27-022", "x": "4abf822a"}, {"t": "learn", "h": "<div class=\"u\">This lets you track ongoing progress regularly, so you can adapt your teaching according to their needs.</div><div class=\"u\">ده بيخلّيك تتتبع التقدم المستمر بانتظام، فتقدر تعدّل تدريسك حسب احتياجاتهم.</div>", "n": 1, "i": 25, "a": "tefl-27-023", "x": "fc073f9c"}, {"t": "learn", "h": "<div class=\"u\">Both performance-based assessment and portfolio assessment measure progress and ensure objectives are met, monitored by teacher observation and student self-assessment.</div><div class=\"u\">التقييم بالأداء وتقييم ملف الإنجاز بيقيسوا التقدم وبيضمنوا تحقق الأهداف، وبيتم متابعتهم بملاحظة المدرس والتقييم الذاتي للطالب.</div>", "n": 1, "i": 26, "a": "tefl-27-024", "x": "33b1c42b"}, {"t": "section", "h": "Portfolio pros and cons | مميزات وعيوب ملف الإنجاز", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">Portfolio assessment, advantages. One: easy to integrate into a course.</div><div class=\"u\">تقييم ملف الإنجاز، المميزات. واحد: سهل يتدمج في كورس.</div>", "n": 1, "i": 28, "a": "tefl-27-025", "x": "8579dc9f"}, {"t": "learn", "h": "<div class=\"u\">Two: encourages reflective learning.</div><div class=\"u\">اتنين: بيشجّع التعلم التأملي.</div>", "n": 1, "i": 29, "a": "tefl-27-026", "x": "48c82157"}, {"t": "learn", "h": "<div class=\"u\">Three: provides various samples of a student's work, giving an overall impression of ability.</div><div class=\"u\">تلاتة: بيوفّر عينات متنوعة من شغل الطالب، بتدّي انطباع عام عن قدرته.</div>", "n": 1, "i": 30, "a": "tefl-27-027", "x": "2a6cb7c7"}, {"t": "learn", "h": "<div class=\"u\">Four: students with different learning styles can be evaluated fairly.</div><div class=\"u\">أربعة: الطلبة بأنماط تعلم مختلفة يقدروا يتقيّموا بعدل.</div>", "n": 1, "i": 31, "a": "tefl-27-028", "x": "faefec3d"}, {"t": "learn", "h": "<div class=\"u\">Disadvantages. One: no way of checking if the student's work is all their own.</div><div class=\"u\">العيوب. واحد: مفيش طريقة تتأكد إن شغل الطالب كله من شغله هو.</div>", "n": 1, "i": 32, "a": "tefl-27-029", "x": "23f08838"}, {"t": "learn", "h": "<div class=\"u\">Two: difficult to convert the range of activities undertaken into an overall grade.</div><div class=\"u\">اتنين: صعب تحوّل مدى الأنشطة المتعملة لتقدير عام واحد.</div>", "n": 1, "i": 33, "a": "tefl-27-030", "x": "3a9b94d2"}, {"t": "learn", "h": "<div class=\"u\">Three: time consuming to evaluate.</div><div class=\"u\">تلاتة: بياخد وقت طويل في التقييم.</div>", "n": 1, "i": 34, "a": "tefl-27-031", "x": "225a0c83"}, {"t": "learn", "h": "<div class=\"u\">All forms of assessment, formal or informal, subjective or objective, have their own advantages and disadvantages.</div><div class=\"u\">كل أشكال التقييم، رسمي أو غير رسمي، ذاتي أو موضوعي، ليها مميزاتها وعيوبها.</div>", "n": 1, "i": 35, "a": "tefl-27-032", "x": "838fd188"}, {"t": "learn", "h": "<div class=\"u\">That is why, when choosing assessment tasks for your students, it is probably best to incorporate a mixture.</div><div class=\"u\">عشان كده، لما تختار مهام تقييم لطلبتك، الأفضل غالبًا إنك تدمج خليط.</div>", "n": 1, "i": 36, "a": "tefl-27-033", "x": "7b48aecc"}, {"t": "section", "h": "Unit 4 questions | أسئلة الوحدة ٤", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">Unit 4 questions. Question 1: a proficiency test is an example of what? Options: formal assessment, informal assessment. Correct answer: formal assessment.</div><div class=\"u\">أسئلة الوحدة الرابعة. سؤال ١: اختبار الكفاءة مثال على إيه؟ الاختيارات: تقييم رسمي، تقييم غير رسمي. الإجابة الصح: تقييم رسمي.</div>", "n": 1, "i": 38, "a": "tefl-27-034", "x": "9bed5d4d"}, {"t": "learn", "h": "<div class=\"u\">Question 2: a progress test assesses which of the following? Options: overall language ability, how well a student has understood a unit or module, overall learning at the end of the course.</div><div class=\"u\">سؤال ٢: اختبار التقدم بيقيّم أنهي من دول؟ الاختيارات: القدرة اللغوية العامة، مدى فهم الطالب لوحدة أو موديول، التعلم العام في نهاية الكورس.</div>", "n": 1, "i": 39, "a": "tefl-27-035", "x": "68445b79"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: how well a student has understood a unit or module.</div><div class=\"u\">الإجابة الصح: مدى فهم الطالب لوحدة أو موديول.</div>", "n": 1, "i": 40, "a": "tefl-27-036", "x": "f6480a2b"}, {"t": "learn", "h": "<div class=\"u\">Question 3: which is an example of a subjective assessment task? Options: cloze test, true/false, interview, sentence transformation. Correct answer: interview.</div><div class=\"u\">سؤال ٣: أنهي دي مثال على مهمة تقييم ذاتية؟ الاختيارات: اختبار كلوز، صح/غلط، مقابلة، تحويل جمل. الإجابة الصح: المقابلة.</div>", "n": 1, "i": 41, "a": "tefl-27-037", "x": "f5b00b87"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 42}, {"t": "learn", "h": "<div class=\"u\">Proficiency test: measures overall language ability, like IELTS.</div><div class=\"u\">اختبار الكفاءة: بيقيس القدرة اللغوية العامة، زي IELTS.</div>", "n": 1, "i": 43, "a": "tefl-27-038", "x": "a51e0d8a"}, {"t": "learn", "h": "<div class=\"u\">Progress test: measures how well students understood a unit or section of a course.</div><div class=\"u\">اختبار التقدم: بيقيس مدى فهم الطلبة لوحدة أو جزء من كورس.</div>", "n": 1, "i": 44, "a": "tefl-27-039", "x": "bb3c4391"}, {"t": "learn", "h": "<div class=\"u\">End-of-course test: measures learning at the end of the programme.</div><div class=\"u\">اختبار نهاية الكورس: بيقيس التعلم في نهاية البرنامج.</div>", "n": 1, "i": 45, "a": "tefl-27-040", "x": "3196095d"}, {"t": "learn", "h": "<div class=\"u\">Objective task: one right answer, easy to mark, like true/false or matching.</div><div class=\"u\">مهمة موضوعية: إجابة صح واحدة، سهلة التصحيح، زي صح/غلط أو التوصيل.</div>", "n": 1, "i": 46, "a": "tefl-27-041", "x": "c76893d8"}, {"t": "learn", "h": "<div class=\"u\">Subjective task: judged answers, trickier to mark, like interviews or writing.</div><div class=\"u\">مهمة ذاتية: إجابات بتتقيّم بالحكم، أصعب في التصحيح، زي المقابلات أو الكتابة.</div>", "n": 1, "i": 47, "a": "tefl-27-042", "x": "b1dc8e83"}, {"t": "learn", "h": "<div class=\"u\">Cloze test: a text with blanked-out words to complete.</div><div class=\"u\">اختبار كلوز: نص بكلمات ممسوحة بتتكمل.</div>", "n": 1, "i": 48, "a": "tefl-27-043", "x": "ae937039"}, {"t": "learn", "h": "<div class=\"u\">Sentence transformation: rewriting a sentence to keep the same meaning with a new form.</div><div class=\"u\">تحويل الجمل: إعادة كتابة جملة بنفس المعنى بصيغة جديدة.</div>", "n": 1, "i": 49, "a": "tefl-27-044", "x": "c6a9a7bc"}, {"t": "learn", "h": "<div class=\"u\">Portfolio: a collected folder of a student's work for continuous assessment.</div><div class=\"u\">ملف الإنجاز: مجموعة شغل الطالب المحفوظة للتقييم المستمر.</div>", "n": 1, "i": 50, "a": "tefl-27-045", "x": "2dd81599"}, {"t": "learn", "h": "<div class=\"u\">Reflective learning: thinking about your own work to improve it.</div><div class=\"u\">التعلم التأملي: التفكير في شغلك بنفسك عشان تحسّنه.</div>", "n": 1, "i": 51, "a": "tefl-27-046", "x": "e5b4f0d5"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 52}, {"t": "learn", "h": "<div class=\"u\">Four formal types: proficiency, progress, end-of-course, and external exams like IELTS; good tests are fair, appropriate, and markable.</div><div class=\"u\">أربع أنواع رسمية: الكفاءة، التقدم، نهاية الكورس، والامتحانات الخارجية زي IELTS؛ الاختبار الكويس عادل ومناسب وسهل التصحيح.</div>", "n": 1, "i": 53, "a": "tefl-27-047", "x": "006ef64e"}, {"t": "learn", "h": "<div class=\"u\">Objective tasks are easy to mark; subjective extended tasks best assess productive skills.</div><div class=\"u\">المهام الموضوعية سهلة التصحيح؛ المهام الذاتية الممتدة أحسن حاجة لتقييم مهارات الإنتاج.</div>", "n": 1, "i": 54, "a": "tefl-27-048", "x": "36730ec6"}, {"t": "learn", "h": "<div class=\"u\">Informal assessment, homework, class activities, portfolios, often shows true ability better than formal tests.</div><div class=\"u\">التقييم غير الرسمي، واجب وأنشطة فصل وملفات إنجاز، غالبًا بيوضح القدرة الحقيقية أحسن من الاختبارات الرسمية.</div>", "n": 1, "i": 55, "a": "tefl-27-049", "x": "1d147403"}, {"t": "learn", "h": "<div class=\"u\">Portfolios encourage reflection and fairness across learning styles, but are slow to evaluate and hard to grade.</div><div class=\"u\">ملفات الإنجاز بتشجّع التأمل والعدالة عبر أنماط التعلم، بس بطيئة التقييم وصعبة التقدير.</div>", "n": 1, "i": 56, "a": "tefl-27-050", "x": "68d1cad3"}, {"t": "learn", "h": "<div class=\"u\">Best practice: incorporate a mixture of formal and informal, objective and subjective.</div><div class=\"u\">أحسن ممارسة: ادمج خليط من الرسمي وغير الرسمي، الموضوعي والذاتي.</div>", "n": 1, "i": 57, "a": "tefl-27-051", "x": "0a395118"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 58}, {"t": "mc", "q": "A proficiency test is an example of:<br>اختبار الكفاءة مثال على:", "opts": ["formal assessment | تقييم رسمي", "informal assessment | تقييم غير رسمي", "portfolio assessment | تقييم ملف إنجاز"], "ans": 0, "why": "Proficiency tests are formal; they assess overall language ability. | اختبارات الكفاءة رسمية؛ بتقيّم القدرة اللغوية العامة.", "ex": ["Correct. | صح.", "No. It is formal, like IELTS. | غلط: هو رسمي، زي IELTS.", "No. Portfolios are informal continuous assessment. | غلط: ملف الإنجاز تقييم مستمر غير رسمي."], "n": 1, "i": 59, "h": ""}, {"t": "mc", "q": "A progress test assesses:<br>اختبار التقدم بيقيّم:", "opts": ["how well a student has understood a unit or module | مدى فهم الطالب لوحدة أو موديول", "overall language ability | القدرة اللغوية العامة", "overall learning at the end of the course | التعلم العام في نهاية الكورس"], "ans": 0, "why": "Progress = unit/section; proficiency = overall ability; end-of-course = end of programme. | التقدم = وحدة/جزء؛ الكفاءة = القدرة العامة؛ نهاية الكورس = نهاية البرنامج.", "ex": ["Correct. | صح.", "No. Overall ability is the proficiency test. | غلط: القدرة العامة هي اختبار الكفاءة.", "No. End of course is the end-of-course test. | غلط: نهاية الكورس هي اختبار نهاية الكورس."], "n": 1, "i": 60, "h": ""}, {"t": "mc", "q": "Which is a subjective assessment task?<br>أنهي دي مهمة تقييم ذاتية؟", "opts": ["an interview | مقابلة", "a cloze test | اختبار كلوز", "sentence transformation | تحويل جمل"], "ans": 0, "why": "Interviews and writing are extended, subjective tasks. Cloze and transformations are objective. | المقابلات والكتابة مهام ممتدة ذاتية. كلوز والتحويل موضوعية.", "ex": ["Correct. | صح.", "No. A cloze test has right or wrong answers. | غلط: اختبار كلوز إجاباته صح أو غلط.", "No. Transformations are objectively marked. | غلط: التحويلات بتتصحّح موضوعي."], "n": 1, "i": 61, "h": ""}, {"t": "tf", "q": "Single-focus tasks like true/false are hard to mark.<br>المهام أحادية التركيز زي صح/غلط صعبة التصحيح.", "ans": false, "why": "False. Answers are either correct or incorrect, so they are easy to mark. | غلط. الإجابات يا صح يا غلط، فهي سهلة التصحيح.", "ex": ["Wrong. Single-focus tasks are the easy ones to mark. | غلط: المهام أحادية التركيز هي السهلة في التصحيح.", "Correct. | صح."], "n": 1, "i": 62, "h": ""}, {"t": "mc", "q": "Read a novel extract and write a synopsis is which task type?<br>اقرا مقطع رواية واكتب ملخص ده أنهي نوع مهمة؟", "opts": ["summary writing | كتابة ملخص", "cloze test | اختبار كلوز", "sentence transformation | تحويل جمل"], "ans": 0, "why": "It tests reading comprehension, writing ability, and a range of language knowledge. | بيختبر فهم القراية والقدرة على الكتابة ومدى من المعرفة اللغوية.", "ex": ["Correct. | صح.", "No. A cloze fills blanked-out words. | غلط: كلوز بيملي كلمات ممسوحة.", "No. Transformation rewrites one sentence with the same meaning. | غلط: التحويل بيعيد كتابة جملة واحدة بنفس المعنى."], "n": 1, "i": 63, "h": ""}, {"t": "mc", "q": "Which is a DISADVANTAGE of portfolio assessment?<br>أنهي دي عيب في تقييم ملف الإنجاز؟", "opts": ["no way to check the work is all the student's own | مفيش طريقة تتأكد إن الشغل كله بتاع الطالب", "encourages reflective learning | بيشجّع التعلم التأملي", "fair for different learning styles | عادل لأنماط التعلم المختلفة"], "ans": 0, "why": "The other two are advantages; ownership, grading difficulty, and time are the disadvantages. | الاتنين التانيين مميزات؛ الملكية وصعوبة التقدير والوقت هما العيوب.", "ex": ["Correct. | صح.", "No. Reflective learning is an advantage. | غلط: التعلم التأملي ميزة.", "No. Fairness across styles is an advantage. | غلط: العدالة عبر الأنماط ميزة."], "n": 1, "i": 64, "h": ""}, {"t": "tf", "q": "Formal assessment always reflects students' true language abilities.<br>التقييم الرسمي دايمًا بيعكس قدرات الطلبة اللغوية الحقيقية.", "ans": false, "why": "False. Nerves or misread instructions can distort formal results; informal assessment often gives a better all-round picture. | غلط. التوتر أو قراية التعليمات غلط ممكن يشوّهوا النتايج الرسمية؛ التقييم غير الرسمي غالبًا بيدّي صورة أشمل أحسن.", "ex": ["Wrong. Formal tests can be distorted by nerves. | غلط: الاختبارات الرسمية ممكن تتشوّه بالتوتر.", "Correct. | صح."], "n": 1, "i": 65, "h": ""}, {"t": "mc", "q": "IELTS is best described as:<br>IELTS يتوصف أحسن وصف إنه:", "opts": ["an external examination giving a certificate of language ability | امتحان خارجي بيدّي شهادة قدرة لغوية", "a progress test | اختبار تقدم", "an informal class activity | نشاط فصل غير رسمي"], "ans": 0, "why": "IELTS and Cambridge ESOL are external exams, a form of proficiency test with a certificate. | IELTS وكامبريدج ESOL امتحانات خارجية، شكل من اختبار الكفاءة بشهادة.", "ex": ["Correct. | صح.", "No. Progress tests are internal unit checks. | غلط: اختبارات التقدم تحققات وحدات داخلية.", "No. It is formal and external. | غلط: هو رسمي وخارجي."], "n": 1, "i": 66, "h": ""}, {"t": "recall", "q": "Name the four types of formal assessment.<br>اذكر الأربع أنواع من التقييم الرسمي.", "a": "Proficiency test, progress test, end-of-course test, and external examinations like IELTS.<br>اختبار الكفاءة، اختبار التقدم، اختبار نهاية الكورس، والامتحانات الخارجية زي IELTS.", "n": 1, "i": 67, "h": ""}, {"t": "recall", "q": "Give three advantages of portfolio assessment.<br>اذكر تلات مميزات لتقييم ملف الإنجاز.", "a": "Easy to integrate into a course, encourages reflective learning, provides various work samples, and fair for different learning styles.<br>سهل الدمج في كورس، بيشجّع التعلم التأملي، بيوفّر عينات شغل متنوعة، وعادل لأنماط التعلم المختلفة.", "n": 1, "i": 68, "h": ""}, {"t": "write", "q": "Explain why a good course mixes formal and informal assessment (3-4 sentences).<br>اشرح ليه الكورس الكويس بيدمج التقييم الرسمي وغير الرسمي (٣-٤ جمل).", "key": "tefl-27:1", "a": "Every form of assessment has its own advantages and disadvantages, so no single form can carry a whole course. Formal tests can be distorted by nerves or misread instructions, while informal activities often show a student's true all-round ability better. Formal assessment still gives structure, comparability, and certificates. Mixing both, objective and subjective, gives the fairest picture and keeps students developing without constant exam pressure.<br>كل شكل تقييم ليه مميزاته وعيوبه، فمفيش شكل واحد يقدر يشيل كورس كامل. الاختبارات الرسمية ممكن تتشوّه بالتوتر أو قراية التعليمات غلط، بينما الأنشطة غير الرسمية غالبًا بتوضح قدرة الطالب الحقيقية الشاملة أحسن. التقييم الرسمي لسه بيدّي هيكل وقابلية مقارنة وشهادات. دمج الاتنين، الموضوعي والذاتي، بيدّي أعدل صورة وبيخلّي الطلبة بيتطوروا من غير ضغط امتحانات مستمر.", "n": 1, "i": 69, "h": ""}, {"t": "write", "q": "Compare objective and subjective tasks, with one example of each (3-4 sentences).<br>قارن بين المهام الموضوعية والذاتية، بمثال لكل واحدة (٣-٤ جمل).", "key": "tefl-27:2", "a": "Objective tasks have answers that are simply correct or incorrect, so they are easy and quick to mark; a cloze test is a good example, checking grammar, lexis, and reading at once. Subjective tasks, like an interview, are extended performances where the marker judges quality. They are the best tools for assessing productive skills like speaking and writing. The trade-off is that they are trickier and slower to mark fairly, which is why a good test design uses both.<br>المهام الموضوعية إجاباتها ببساطة صح أو غلط، فهي سهلة وسريعة التصحيح؛ اختبار كلوز مثال كويس، بيتحقق من القواعد والمفردات والقراية مرة واحدة. المهام الذاتية، زي المقابلة، أداءات ممتدة المصحّح بيحكم فيها على الجودة. هي أحسن أدوات لتقييم مهارات الإنتاج زي الكلام والكتابة. المقايضة إنها أصعب وأبطأ في التصحيح العادل، وعشان كده تصميم الاختبار الكويس بيستخدم الاتنين.", "n": 1, "i": 70, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 5, course books and reference materials, choosing the books that carry your lessons.</div><div class=\"u\">الدرس الجاي: الوحدة الخامسة، الكتب المقررة والمواد المرجعية، اختيار الكتب اللي بتحمل دروسك.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 71}];</script>
