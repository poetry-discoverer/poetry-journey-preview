<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٥٧</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-57";window.STEPS=[{"t": "section", "h": "Rights and responsibilities | الحقوق والمسؤوليات", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">R four and five: Rights and Responsibilities. They are often two sides of the same coin.</div><div class=\"u\">راء أربعة وخمسة: الحقوق والمسؤوليات. هما غالبًا وشين لعملة واحدة.</div>", "n": 1, "i": 1, "a": "tefl-57-001", "x": "7ef221d2"}, {"t": "learn", "h": "<div class=\"u\">If you have the right to join in the lesson, you also have the responsibility to remember to bring your books.</div><div class=\"u\">لو عندك الحق تشارك في الدرس، يبقى عندك كمان المسؤولية تفتكر تجيب كتبك.</div>", "n": 1, "i": 2, "a": "tefl-57-002", "x": "18d8686c"}, {"t": "learn", "h": "<div class=\"u\">If you have the right to speak in the classroom and have others listen to you, you also have the responsibility to listen to others when they do the same.</div><div class=\"u\">لو عندك الحق تتكلم في الفصل والتانيين يسمعوك، يبقى عندك كمان المسؤولية تسمع التانيين لما هما يعملوا نفس الحاجة.</div>", "n": 1, "i": 3, "a": "tefl-57-003", "x": "f5105a59"}, {"t": "learn", "h": "<div class=\"u\">If you have the right to use the classroom scissors, crayons and glue, you also have the responsibility to share them with others when they need to use them as well.</div><div class=\"u\">لو عندك الحق تستخدم مقص الفصل والألوان والصمغ، يبقى عندك كمان المسؤولية تشاركهم مع التانيين لما يحتاجوهم كمان.</div>", "n": 1, "i": 4, "a": "tefl-57-004", "x": "65005291"}, {"t": "learn", "h": "<div class=\"u\">If you have the right to have a turn in games, you also have the responsibility to respect the turns of others when they play.</div><div class=\"u\">لو عندك الحق يبقى ليك دور في الألعاب، يبقى عندك كمان المسؤولية تحترم أدوار التانيين لما هما يلعبوا.</div>", "n": 1, "i": 5, "a": "tefl-57-005", "x": "2a0be86f"}, {"t": "learn", "h": "<div class=\"u\">If you have the right to see the pictures when the teacher tells a story, you also have the responsibility not to block the view of others.</div><div class=\"u\">لو عندك الحق تشوف الصور لما المدرس يحكي قصة، يبقى عندك كمان المسؤولية ماتحجبش الرؤية عن التانيين.</div>", "n": 1, "i": 6, "a": "tefl-57-006", "x": "d52debc7"}, {"t": "learn", "h": "<div class=\"u\">If you have the right not to be mocked or laughed at, you also have the responsibility not to mock or laugh at others.</div><div class=\"u\">لو عندك الحق محدش يهزأ بيك أو يضحك عليك، يبقى عندك كمان المسؤولية ماتهزأش ولا تضحك على التانيين.</div>", "n": 1, "i": 7, "a": "tefl-57-007", "x": "bc60cac4"}, {"t": "learn", "h": "<div class=\"u\">It is unlikely to be appropriate to talk about rights and responsibilities explicitly with children, but it is important to model through your own behaviour the way you value these.</div><div class=\"u\">مش محتمل يبقى مناسب تتكلم عن الحقوق والمسؤوليات بشكل مباشر مع الأطفال، بس مهم تعمل موديل بسلوكك إنت لطريقة تقديرك ليهم.</div>", "n": 1, "i": 8, "a": "tefl-57-008", "x": "fecd601b"}, {"t": "learn", "h": "<div class=\"u\">For example, if a child constantly forgets their book, the teacher may need to issue frequent reminders and reprimands.</div><div class=\"u\">مثلًا، لو طفل بيفضل ينسى كتابه، المدرس ممكن يحتاج يدّي تذكيرات وعتاب متكرر.</div>", "n": 1, "i": 9, "a": "tefl-57-009", "x": "9651e5b0"}, {"t": "learn", "h": "<div class=\"u\">Reinforcement through positive interaction will help encourage the child to be a more responsible student. The desire for praise and approval can be a strong motivator.</div><div class=\"u\">التعزيز بالتفاعل الإيجابي هيساعد يشجّع الطفل يبقى طالب أمسؤول. الرغبة في المديح والرضا ممكن تبقى محفّز قوي.</div>", "n": 1, "i": 10, "a": "tefl-57-010", "x": "8f320303"}, {"t": "learn", "h": "<div class=\"u\">Show that you value a student's actions by offering praise and specifically identifying what they have done so well.</div><div class=\"u\">ورّي إنك مقدّر أفعال الطالب بإنك تدّي مديح وتحدّد بالظبط إيه اللي عمله كويس أوي.</div>", "n": 1, "i": 11, "a": "tefl-57-011", "x": "7f82c967"}, {"t": "learn", "h": "<div class=\"u\">If a forgetful student shows up with their book, comment on it: well done for remembering your book today, Juan!</div><div class=\"u\">لو طالب نسّاي ظهر بكتابه، علّق على ده: برافو إنك افتكرت كتابك النهارده يا خوان!</div>", "n": 1, "i": 12, "a": "tefl-57-012", "x": "750121df"}, {"t": "learn", "h": "<div class=\"u\">A quiet word of praise is much more likely to reinforce the behaviour than saying nothing, which may leave the child wondering why he bothered, or whether you even noticed or cared.</div><div class=\"u\">كلمة مديح هادية غالبًا هتعزّز السلوك أكتر بكتير من السكوت، اللي ممكن يسيّب الطفل يتساءل ليه عنّى نفسه أصلًا، أو إنت لاحظت أو اهتميت ولا لأ.</div>", "n": 1, "i": 13, "a": "tefl-57-013", "x": "6fc59dcb"}, {"t": "learn", "h": "<div class=\"u\">Similarly with rights, show through your behaviour that you value them and are willing to protect them.</div><div class=\"u\">ونفس الكلام مع الحقوق، ورّي بسلوكك إنك مقدّرها ومستعد تحميها.</div>", "n": 1, "i": 14, "a": "tefl-57-014", "x": "d8387d18"}, {"t": "learn", "h": "<div class=\"u\">If a child mocks or laughs at another child in the class, you need to make it clear that this behaviour is completely unacceptable.</div><div class=\"u\">لو طفل هزأ أو ضحك على طفل تاني في الفصل، لازم توضّح إن السلوك ده مرفوض تمامًا.</div>", "n": 1, "i": 15, "a": "tefl-57-015", "x": "9227d2f9"}, {"t": "learn", "h": "<div class=\"u\">It may also be worth discussing the reasons explicitly, possibly in a private moment after the class.</div><div class=\"u\">ممكن كمان يستاهل تتكلم عن الأسباب بشكل مباشر، يمكن في لحظة خاصة بعد الحصة.</div>", "n": 1, "i": 16, "a": "tefl-57-016", "x": "5f07ef1a"}, {"t": "learn", "h": "<div class=\"u\">Invite the child to consider the situation from the other child's point of view: how would they feel if the same happened to them?</div><div class=\"u\">ادعُ الطفل يفكّر في الموقف من وجهة نظر الطفل التاني: كان هيبقى حاسس بإيه لو نفس الحاجة حصلتله؟</div>", "n": 1, "i": 17, "a": "tefl-57-017", "x": "2d86b984"}, {"t": "learn", "h": "<div class=\"u\">Encouraging children to reflect on their behaviour and see things from someone else's point of view means they will be more likely to act towards others responsibly.</div><div class=\"u\">تشجيع الأطفال يتأمّلوا سلوكهم ويشوفوا الحاجات من وجهة نظر حد تاني معناه إنهم غالبًا هيتصرّفوا مع التانيين بمسؤولية أكتر.</div>", "n": 1, "i": 18, "a": "tefl-57-018", "x": "b6b05887"}, {"t": "section", "h": "Respect | الاحترام", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">R six: Respect. Respect is the glue which underpins and holds together all the other R's.</div><div class=\"u\">راء ستة: الاحترام. الاحترام هو الغراء اللي بيدعّم ويمسّك كل الراءات التانية مع بعض.</div>", "n": 1, "i": 20, "a": "tefl-57-019", "x": "0f554242"}, {"t": "learn", "h": "<div class=\"u\">Respect cannot be taught explicitly, but it can be modelled in all your behaviour.</div><div class=\"u\">الاحترام مابيتعلّمش بشكل مباشر، بس ممكن يتمثّل في كل سلوكك.</div>", "n": 1, "i": 21, "a": "tefl-57-020", "x": "0317641b"}, {"t": "learn", "h": "<div class=\"u\">Model it by: using the children's names, being polite, respecting personal space, valuing diversity.</div><div class=\"u\">مثّله بـ: استخدام أسماء الأطفال، الأدب، احترام المساحة الشخصية، تقدير التنوّع.</div>", "n": 1, "i": 22, "a": "tefl-57-021", "x": "d318a1af"}, {"t": "learn", "h": "<div class=\"u\">Also: recognizing that children contribute and participate in different ways, and understanding that they have feelings and off days, just like you.</div><div class=\"u\">وكمان: الاعتراف إن الأطفال بيساهموا وبيشاركوا بطرق مختلفة، وفهم إن عندهم مشاعر وأيام وحشة، زيك بالظبط.</div>", "n": 1, "i": 23, "a": "tefl-57-022", "x": "ea8941af"}, {"t": "learn", "h": "<div class=\"u\">The most important thing about fostering an atmosphere of mutual respect is to remember that respect works two ways.</div><div class=\"u\">أهم حاجة في تعزيز جو الاحترام المتبادل هي إنك تفتكر إن الاحترام بيشتغل في الاتجاهين.</div>", "n": 1, "i": 24, "a": "tefl-57-023", "x": "89a604a9"}, {"t": "learn", "h": "<div class=\"u\">If the children feel that you respect and treat them like individuals rather than a class to control, they will also respect and respond to you as individuals.</div><div class=\"u\">لو الأطفال حسّوا إنك بتحترمهم وبتعاملهم كأفراد مش كفصل عايز يتتحكم فيه، هما كمان هيحترموك ويردّوا عليك كأفراد.</div>", "n": 1, "i": 25, "a": "tefl-57-024", "x": "00f999d9"}, {"t": "learn", "h": "<div class=\"u\">Otherwise they respond with a collective group mentality, which is always much harder to manage positively.</div><div class=\"u\">وإلا هيردّوا بعقلية المجموعة الواحدة، ودي دايمًا أصعب بكتير في الإدارة الإيجابية.</div>", "n": 1, "i": 26, "a": "tefl-57-025", "x": "7ae4a862"}, {"t": "section", "h": "Rewards | المكافآت", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">R seven: Rewards. It is usually best not to use any system of extrinsic rewards to raise motivation or ensure good behaviour, at least at the outset.</div><div class=\"u\">راء سبعة: المكافآت. الأحسن عادة ماتستخدمش أي نظام مكافآت خارجية عشان ترفع الدافع أو تضمن السلوك الكويس، على الأقل في البداية.</div>", "n": 1, "i": 28, "a": "tefl-57-026", "x": "7fbda747"}, {"t": "learn", "h": "<div class=\"u\">This gives a positive message that you expect everything to go well, and it also means you do not have to spend a fortune on chocolate and sweets.</div><div class=\"u\">ده بيدّي رسالة إيجابية إنك متوقّع كل حاجة تمشي كويس، وكمان معناه إنك مش لازم تصرف ثروة على الشوكولاتة والحلويات.</div>", "n": 1, "i": 29, "a": "tefl-57-027", "x": "1b584cc7"}, {"t": "learn", "h": "<div class=\"u\">However, there may be times with some classes when introducing a reward system can reinforce appropriate behaviour and add a motivational, competitive feel-good factor to things already going well.</div><div class=\"u\">بس لكن، ممكن تيجي أوقات مع بعض الفصول لما نظام مكافآت يقدر يعزّز السلوك المناسب ويضيف عامل تنافسي محفّز كويس لحاجات أصلًا ماشية كويس.</div>", "n": 1, "i": 30, "a": "tefl-57-028", "x": "b3aee8d7"}, {"t": "learn", "h": "<div class=\"u\">Reward systems can be devised in all kinds of enjoyable ways: stars, stickers, points, smiley faces, raffle tickets or marbles in a jar.</div><div class=\"u\">أنظمة المكافآت ممكن تتصمّم بطرق ممتعة كتير: نجوم، لزق، نقاط، وشوش مبسوطة، تذاكر يانصيب، أو كرات زجاج في برطمان.</div>", "n": 1, "i": 31, "a": "tefl-57-029", "x": "9f3e24a9"}, {"t": "learn", "h": "<div class=\"u\">If used effectively, they can help promote collaboration, appropriate behaviour and individual as well as class effort.</div><div class=\"u\">لو اتستخدمت بفاعلية، ممكن تساعد تعزّز التعاون والسلوك المناسب ومجهود الفرد والفصل.</div>", "n": 1, "i": 32, "a": "tefl-57-030", "x": "276ada2a"}, {"t": "learn", "h": "<div class=\"u\">If used without care, they may have the opposite effect: a divisive atmosphere of winners and losers.</div><div class=\"u\">لو اتستخدمت من غير حرص، ممكن يبقى ليها التأثير العكسي: جو مفرّق فيه كسبانين وخسرانين.</div>", "n": 1, "i": 33, "a": "tefl-57-031", "x": "395e133f"}, {"t": "learn", "h": "<div class=\"u\">Some children become obsessed by collecting stars or points, while others adopt a strategy of opting out, which harms their motivation, effort and behaviour.</div><div class=\"u\">بعض الأطفال بيتوسوسوا بتجميع النجوم أو النقاط، بينما تانيين بياخدوا استراتيجية الانسحاب، وده بيضرّ دافعهم ومجهودهم وسلوكهم.</div>", "n": 1, "i": 34, "a": "tefl-57-032", "x": "8e48940a"}, {"t": "learn", "h": "<div class=\"u\">The reward systems that generally work most effectively involve each child working cooperatively for a prize won by the whole class.</div><div class=\"u\">أنظمة المكافآت اللي بتشتغل أنجح عادة بتخلّي كل طفل يشتغل بتعاون لجايزة بيكسبها الفصل كله.</div>", "n": 1, "i": 35, "a": "tefl-57-033", "x": "49941569"}, {"t": "learn", "h": "<div class=\"u\">For example, with marbles in a jar: individual children, pairs or groups may be awarded marbles for working well or making an effort to speak English.</div><div class=\"u\">مثلًا، الكرات الزجاج في البرطمان: أطفال أفراد أو ثنائيات أو مجموعات ممكن ياخدوا كرات لشغل كويس أو مجهود يتكلموا إنجليزي.</div>", "n": 1, "i": 36, "a": "tefl-57-034", "x": "a0656eab"}, {"t": "learn", "h": "<div class=\"u\">Marbles can also be awarded for helping others or completing work carefully.</div><div class=\"u\">الكرات ممكن كمان تتدّى على مساعدة التانيين أو إتمام الشغل بعناية.</div>", "n": 1, "i": 37, "a": "tefl-57-035", "x": "e191bc0f"}, {"t": "learn", "h": "<div class=\"u\">As soon as the jar is filled, the whole class gets a reward: watching a favourite video, having a quiz, playing a favourite game, or whatever you and the children choose.</div><div class=\"u\">أول ما البرطمان يتملى، الفصل كله بياخد مكافأة: التفرّج على فيديو محبوب، مسابقة، لعبة محبوبة، أو أي حاجة إنت والأطفال تختاروها.</div>", "n": 1, "i": 38, "a": "tefl-57-036", "x": "49da52d8"}, {"t": "learn", "h": "<div class=\"u\">The jar should not be too big, so the reward is attainable over a reasonably short period, for example a week or, maximum, two.</div><div class=\"u\">البرطمان المفروض مايبقاش كبير أوي، عشان المكافأة تقدر توصلها في فترة قصيرة منطقيًا، مثلًا أسبوع أو، كحد أقصى، اتنين.</div>", "n": 1, "i": 39, "a": "tefl-57-037", "x": "45186d3c"}, {"t": "learn", "h": "<div class=\"u\">If it takes a whole term to fill the jar, a long time in the life of a child, they are likely to lose interest and enthusiasm.</div><div class=\"u\">لو بياخد ترم كامل يتملى البرطمان، وده وقت طويل في حياة طفل، غالبًا هيفقدوا الاهتمام والحماس.</div>", "n": 1, "i": 40, "a": "tefl-57-038", "x": "e9ab7c63"}, {"t": "learn", "h": "<div class=\"u\">Give the reward instantly, as an ongoing part of your teaching, so the association between the reward and its reason stays fresh.</div><div class=\"u\">ادّي المكافأة فورًا، كجزء مستمر من تدريسك، عشان الربط بين المكافأة وسببها يفضل طازج.</div>", "n": 1, "i": 41, "a": "tefl-57-039", "x": "7ebff5e3"}, {"t": "learn", "h": "<div class=\"u\">For example: great work, Daniel and Antonio. I only heard English in the game. Two marbles in the jar for you!</div><div class=\"u\">مثلًا: شغل عظيم يا دانيال وأنطونيو. أنا سمعت إنجليزي بس في اللعبة. كرتين في البرطمان ليكم!</div>", "n": 1, "i": 42, "a": "tefl-57-040", "x": "a30919cc"}, {"t": "learn", "h": "<div class=\"u\">Individuals collecting rewards for the whole class creates positive peer pressure to make an effort, work well and behave appropriately.</div><div class=\"u\">الأفراد اللي بيجمّعوا مكافآت لصالح الفصل كله بيعملوا ضغط أقران إيجابي عشان المجهود والشغل الكويس والسلوك المناسب.</div>", "n": 1, "i": 43, "a": "tefl-57-041", "x": "12b4c321"}, {"t": "learn", "h": "<div class=\"u\">You can also make it fun by challenging the class: can you fill the jar by Friday? I do not think so. Show me I am wrong!</div><div class=\"u\">تقدر كمان تخلّيها ممتعة بإنك تتحدّى الفصل: تقدروا تملّوا البرطمان لحد الجمعة؟ أنا مافتكرش. ورّوني إني غلطان!</div>", "n": 1, "i": 44, "a": "tefl-57-042", "x": "a8234627"}, {"t": "learn", "h": "<div class=\"u\">Vary the system you use for accumulating rewards regularly, or it will lose its associations of pleasant expectation, surprise and fun.</div><div class=\"u\">نوّع النظام اللي بتستخدمه لتجميع المكافآت بانتظام، وإلا هيفقد ارتباطه بالتوقّع الحلو والمفاجأة والمرح.</div>", "n": 1, "i": 45, "a": "tefl-57-043", "x": "89db155c"}, {"t": "learn", "h": "<div class=\"u\">Always use reward systems positively, as rewards, never negatively or punitively, for example by taking or threatening to take marbles back out of the jar once awarded.</div><div class=\"u\">دايمًا استخدم أنظمة المكافآت بالإيجاب، كمكافآت، أبدًا بالسلب أو كعقاب، مثلًا بإنك تسحب أو تهدّد بسحب كرات من البرطمان بعد ما اتدّت.</div>", "n": 1, "i": 46, "a": "tefl-57-044", "x": "f6bb05ed"}, {"t": "learn", "h": "<div class=\"u\">To sum up, the seven R's provide an integrated framework for managing children positively and creating a happy working environment where teaching and learning take place effectively and harmoniously.</div><div class=\"u\">للتلخيص، الراءات السبعة بتوّلي إطار متكامل لإدارة الأطفال بإيجابية وخلق بيئة شغل سعيدة التدريس والتعلّم فيها بيحصل بفاعلية وانسجام.</div>", "n": 1, "i": 47, "a": "tefl-57-045", "x": "e165ffb3"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 48}, {"t": "learn", "h": "<div class=\"u\">rights: what every child is entitled to in class.</div><div class=\"u\">الحقوق: اللي كل طفل ليه الحق فيه في الفصل.</div>", "n": 1, "i": 49, "a": "tefl-57-046", "x": "685a5261"}, {"t": "learn", "h": "<div class=\"u\">responsibilities: what every child owes back to the class.</div><div class=\"u\">المسؤوليات: اللي كل طفل عليه يرجّعه للفصل.</div>", "n": 1, "i": 50, "a": "tefl-57-047", "x": "0579da15"}, {"t": "learn", "h": "<div class=\"u\">two sides of the same coin: rights and responsibilities always come together.</div><div class=\"u\">وشين لعملة واحدة: الحقوق والمسؤوليات دايمًا بييجوا مع بعض.</div>", "n": 1, "i": 51, "a": "tefl-57-048", "x": "300e6bd4"}, {"t": "learn", "h": "<div class=\"u\">reprimand: a formal scolding.</div><div class=\"u\">العتاب: تزعيق رسمي.</div>", "n": 1, "i": 52, "a": "tefl-57-049", "x": "ebe24bbe"}, {"t": "learn", "h": "<div class=\"u\">mock: to laugh at someone cruelly.</div><div class=\"u\">الهزار الموجع: تضحك على حد بقسوة.</div>", "n": 1, "i": 53, "a": "tefl-57-050", "x": "465cb6b5"}, {"t": "learn", "h": "<div class=\"u\">respect: the glue holding all the other R's together.</div><div class=\"u\">الاحترام: الغراء اللي ماسّك كل الراءات التانية.</div>", "n": 1, "i": 54, "a": "tefl-57-051", "x": "6a2d9f1f"}, {"t": "learn", "h": "<div class=\"u\">extrinsic rewards: outside prizes like stickers or sweets.</div><div class=\"u\">المكافآت الخارجية: جوايز برّانية زي اللزق أو الحلويات.</div>", "n": 1, "i": 55, "a": "tefl-57-052", "x": "0ccd8472"}, {"t": "learn", "h": "<div class=\"u\">marbles in a jar: a whole-class cooperative reward system.</div><div class=\"u\">الكرات في البرطمان: نظام مكافآت تعاوني للفصل كله.</div>", "n": 1, "i": 56, "a": "tefl-57-053", "x": "6a7d4384"}, {"t": "learn", "h": "<div class=\"u\">peer pressure: the influence of classmates on each other.</div><div class=\"u\">ضغط الأقران: تأثير زمايل الفصل على بعض.</div>", "n": 1, "i": 57, "a": "tefl-57-054", "x": "ea8977be"}, {"t": "learn", "h": "<div class=\"u\">punitive: done as a punishment.</div><div class=\"u\">العقابي: متعمل كعقاب.</div>", "n": 1, "i": 58, "a": "tefl-57-055", "x": "54b1cc79"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">Rights and responsibilities are two sides of the same coin: every right a child has comes with a matching duty to others.</div><div class=\"u\">الحقوق والمسؤوليات وشين لعملة واحدة: كل حق لطفل بييجي معاه واجب مطابق تجاه التانيين.</div>", "n": 1, "i": 60, "a": "tefl-57-056", "x": "817328f4"}, {"t": "learn", "h": "<div class=\"u\">Model them rather than lecture: praise responsible acts specifically, and treat mockery as completely unacceptable, discussing it privately.</div><div class=\"u\">مثّلهم بدل المحاضرة: امسح بالمديح الأفعال المسؤولة بتحديد، واعتبر الهزار الموجع مرفوض تمامًا، واتكلم فيه على انفراد.</div>", "n": 1, "i": 61, "a": "tefl-57-057", "x": "5d0bc068"}, {"t": "learn", "h": "<div class=\"u\">Respect is the glue: model it, remember it works two ways, and treat children as individuals.</div><div class=\"u\">الاحترام هو الغراء: مثّله، افتكر إنه بيشتغل في الاتجاهين، وعامل الأطفال كأفراد.</div>", "n": 1, "i": 62, "a": "tefl-57-058", "x": "213492c4"}, {"t": "learn", "h": "<div class=\"u\">Avoid extrinsic rewards at first; if you use them, make them cooperative, whole-class prizes like marbles in a jar.</div><div class=\"u\">اتجنّب المكافآت الخارجية في الأول؛ لو استخدمتها، خلّيها جوايز تعاونية للفصل كله زي الكرات في البرطمان.</div>", "n": 1, "i": 63, "a": "tefl-57-059", "x": "f66d4e74"}, {"t": "learn", "h": "<div class=\"u\">Keep the jar small, reward instantly, vary the system, and never take awarded marbles back.</div><div class=\"u\">خلّي البرطمان صغير، كافئ فورًا، نوّع النظام، وأبدًا ماتسحبش الكرات اللي اتدّت.</div>", "n": 1, "i": 64, "a": "tefl-57-060", "x": "caeeec1a"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 65}, {"t": "mc", "q": "A child has the right to join the lesson. The matching responsibility is:<br>طفل عنده الحق يشارك في الدرس. المسؤولية المطابقة هي:", "opts": ["remembering to bring their books | يفتكر يجيب كتبه", "sitting at the front | يقعد قدام", "being the best student | يبقى أحسن طالب"], "ans": 0, "why": "The right to join in comes with the responsibility to remember to bring your books. | الحق في المشاركة بييجي معاه مسؤولية إنك تفتكر تجيب كتبك.", "ex": ["Correct. | صح.", "No. Seating is not the match. | غلط: القعدة مش هي المطابقة.", "No. Effort matters, not rank. | غلط: المجهود مهم مش الترتيب."], "n": 1, "i": 66, "h": ""}, {"t": "tf", "q": "If a child mocks another child, you should make clear this is completely unacceptable.<br>لو طفل هزأ بطفل تاني، لازم توضّح إن ده مرفوض تمامًا.", "ans": true, "why": "Correct. Make it clear the behaviour is completely unacceptable, and discuss the reasons privately, asking how they would feel in the other's place. | صح. وضّح إن السلوك مرفوض تمامًا، واتكلم عن الأسباب على انفراد، واسأله كان هيبقى حاسس بإيه لو مكان التاني.", "ex": ["Correct. | صح.", "Wrong. Mockery must never pass. | غلط: الهزار الموجع مابيعدّيش أبدًا."], "n": 1, "i": 67, "h": ""}, {"t": "mc", "q": "A forgetful child finally brings their book. You should:<br>طفل نسّاي أخيرًا جاب كتابه. المفروض:", "opts": ["praise him specifically for remembering | امسح عليه بالمديح محدّد إنه افتكر", "say nothing | ماتقولش حاجة", "punish him for the other days | عاقبه على الأيام التانية"], "ans": 0, "why": "A quiet word of praise, well done for remembering your book, reinforces the behaviour; silence may leave him wondering why he bothered. | كلمة مديح هادية، برافو إنك افتكرت كتابك، بتعزّز السلوك؛ السكوت ممكن يسيّبه يتساءل ليه عنّى نفسه.", "ex": ["Correct. | صح.", "No. Praise locks the behaviour in. | غلط: المديح بيثبّت السلوك.", "No. That destroys the progress. | غلط: ده بيدمّر التقدم."], "n": 1, "i": 68, "h": ""}, {"t": "mc", "q": "Respect is described as:<br>الاحترام اتوصف بإنه:", "opts": ["the glue holding all the other R's together | الغراء اللي ماسّك كل الراءات التانية", "a rule to memorize | قاعدة للحفظ", "a reward system | نظام مكافآت"], "ans": 0, "why": "Respect is the glue which underpins and holds together all the other R's. | الاحترام هو الغراء اللي بيدعّم ويمسّك كل الراءات التانية مع بعض.", "ex": ["Correct. | صح.", "No. Respect is modelled, not memorised. | غلط: الاحترام بيتمثّل مش بيتحفظ.", "No. Rewards are a separate R. | غلط: المكافآت راء لوحدها."], "n": 1, "i": 69, "h": ""}, {"t": "tf", "q": "Respect only needs to flow from the children to the teacher.<br>الاحترام محتاج يمشي بس من الأطفال للمدرس.", "ans": false, "why": "False. Respect works two ways: respected children respond as individuals; disrespected children respond with a hard-to-manage group mentality. | غلط. الاحترام بيشتغل في الاتجاهين: الأطفال المحترمين بيردّوا كأفراد؛ غير المحترمين بيردّوا بعقلية مجموعة صعبة الإدارة.", "ex": ["Correct. | صح.", "Wrong. It works two ways. | غلط: بيشتغل في الاتجاهين."], "n": 1, "i": 70, "h": ""}, {"t": "mc", "q": "When should you start an extrinsic reward system?<br>امتى المفروض تبدأ نظام مكافآت خارجية؟", "opts": ["not at the outset; later, to boost things already going well | مش في البداية؛ بعدين، لتعزيز حاجات أصلًا ماشية كويس", "on day one with chocolates | أول يوم بالشوكولاتة", "never, rewards are banned | أبدًا، المكافآت ممنوعة"], "ans": 0, "why": "Best not to use extrinsic rewards at the outset; later, a system can reinforce behaviour and add a feel-good factor. | الأحسن ماتستخدمش مكافآت خارجية في البداية؛ بعدين، النظام يقدر يعزّز السلوك ويضيف عامل كويس.", "ex": ["Correct. | صح.", "No. That sets a sweets-for-work pattern. | غلط: ده بيعمل نمط حلويات مقابل شغل.", "No. They can help later. | غلط: ممكن تساعد بعدين."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "The most effective reward systems are won by:<br>أنجح أنظمة المكافآت بتتكسب بواسطة:", "opts": ["the whole class cooperatively | الفصل كله بتعاون", "one star student | طالب نجم واحد", "the teacher | المدرس"], "ans": 0, "why": "Systems like marbles in a jar involve each child working cooperatively for a prize won by the whole class, creating positive peer pressure. | أنظمة زي الكرات في البرطمان بتخلّي كل طفل يشتغل بتعاون لجايزة للفصل كله، بتعمل ضغط أقران إيجابي.", "ex": ["Correct. | صح.", "No. That creates winners and losers. | غلط: ده بيعمل كسبانين وخسرانين.", "No. The children earn it. | غلط: الأطفال هما اللي بيكسبوها."], "n": 1, "i": 72, "h": ""}, {"t": "tf", "q": "It is fine to take marbles back out of the jar as a punishment.<br>عادي تسحب كرات من البرطمان كعقاب.", "ans": false, "why": "False. Always use reward systems positively, never negatively or punitively; awarded marbles stay in the jar. | غلط. دايمًا استخدم أنظمة المكافآت بالإيجاب، أبدًا بالسلب أو كعقاب؛ الكرات اللي اتدّت بتفضل في البرطمان.", "ex": ["Correct. | صح.", "Wrong. Rewards are never clawed back. | غلط: المكافآت أبدًا مابتتسحبش."], "n": 1, "i": 73, "h": ""}, {"t": "recall", "q": "Give four rights with their matching responsibilities.<br>ادّي أربع حقوق مع مسؤولياتهم المطابقة.", "a": "Any four of: join the lesson - bring your books; speak and be heard - listen to others; use the scissors, crayons and glue - share them; have a turn in games - respect others' turns; see the story pictures - do not block others' view; not be mocked - do not mock others.<br>أي أربعة من: يشارك في الدرس - يجيب كتبه؛ يتكلم ويتسمع - يسمع التانيين؛ يستخدم المقص والألوان والصمغ - يشاركهم؛ يبقى ليه دور في الألعاب - يحترم أدوار التانيين؛ يشوف صور القصة - مايحجبش الرؤية؛ محدش يهزأ بيه - مايهزأش بالتانيين.", "n": 1, "i": 74, "h": ""}, {"t": "recall", "q": "Name four rules for a good reward system.<br>اذكر أربع قواعد لنظام مكافآت كويس.", "a": "Cooperative whole-class prize; jar small enough to fill in a week or two; reward given instantly with the reason named; vary the system regularly; never take awarded rewards back; do not start it at the outset.<br>جايزة تعاونية للفصل كله؛ برطمان صغير كفاية يتملى في أسبوع أو اتنين؛ المكافأة بتتدّى فورًا مع ذكر السبب؛ نوّع النظام بانتظام؛ أبدًا ماتسحبش المكافآت اللي اتدّت؛ ماتبدأوش من البداية.", "n": 1, "i": 75, "h": ""}, {"t": "write", "q": "Explain how rights and responsibilities work together in a children's class. (3-4 sentences)<br>اشرح إزاي الحقوق والمسؤوليات بيشتغلوا مع بعض في فصل أطفال. (٣-٤ جمل).", "key": "tefl-57:1", "a": "Rights and responsibilities are two sides of the same coin: every right carries a matching duty. A child who has the right to speak and be heard has the responsibility to listen to others. A child who may use the class materials must share them. We rarely lecture children about this; instead, we model it, praise responsible acts specifically, and protect rights firmly when they are threatened.<br>الحقوق والمسؤوليات وشين لعملة واحدة: كل حق شايل واجب مطابق. الطفل اللي ليه الحق يتكلم ويتسمع عليه مسؤولية يسمع التانيين. الطفل اللي ممكن يستخدم خامات الفصل لازم يشاركها. نادرًا بنحاضر الأطفال في ده؛ بدل كده، بنمثّله، وبنمسح بالمديح الأفعال المسؤولة بتحديد، وبنحمي الحقوق بحزم لما بتتهدد.", "n": 1, "i": 76, "h": ""}, {"t": "write", "q": "Design a reward system for a class of children. (3-4 sentences)<br>صمّم نظام مكافآت لفصل أطفال. (٣-٤ جمل).", "key": "tefl-57:2", "a": "I would use marbles in a small jar, awarded to individuals, pairs or groups for working well, speaking English, helping others or careful work. When the jar is full, the whole class wins a reward we choose together, like a favourite game. I would give marbles instantly, naming the reason each time, and never take any back. I would also change the system every few weeks so it keeps its surprise and fun.<br>أنا هستخدم كرات زجاج في برطمان صغير، بتتدّى لأفراد أو ثنائيات أو مجموعات على الشغل الكويس أو الكلام الإنجليزي أو مساعدة التانيين أو الشغل المتقن. لما البرطمان يتملى، الفصل كله بيكسب مكافأة بنختارها مع بعض، زي لعبة محبوبة. هدّي الكرات فورًا، وأسمّي السبب كل مرة، وأبدًا ما هسحب أي واحدة. وكمان هغيّر النظام كل شوية أسابيع عشان يفضل محتفظ بالمفاجأة والمرح.", "n": 1, "i": 77, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: storytelling and learning through stories.</div><div class=\"u\">الدرس الجاي: سرد القصص والتعلّم من خلال القصص.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 78}];</script>
