<h1>عالم تيفل ٣٢: الأنشطة التواصلية</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٣٢</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-32";window.STEPS=[{"t": "section", "h": "What makes an activity communicative | إيه اللي بيخلّي النشاط تواصلي", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Communicative activities are not just speaking tasks which give oral practice.</div><div class=\"u\">الأنشطة التواصلية مش بس مهام كلام بتدّي تمرين شفهي.</div>", "n": 1, "i": 1, "a": "tefl-32-001", "x": "6189b2da"}, {"t": "learn", "h": "<div class=\"u\">For real communication we need interaction and an exchange of information. Otherwise the speech is meaningless.</div><div class=\"u\">عشان يبقى في تواصل حقيقي محتاجين تفاعل وتبادل معلومات. غير كده الكلام مالوش معنى.</div>", "n": 1, "i": 2, "a": "tefl-32-002", "x": "7d77e8e6"}, {"t": "learn", "h": "<div class=\"u\">Example: the only time you would describe a picture to someone already looking at it is in a classroom. That is not authentic.</div><div class=\"u\">مثال: المرة الوحيدة اللي ممكن توصف فيها صورة لشخص باصص عليها خلاص هي في الفصل. ده مش أصلي.</div>", "n": 1, "i": 3, "a": "tefl-32-003", "x": "301070b9"}, {"t": "learn", "h": "<div class=\"u\">The communicative approach is about reflecting real-life situations, ones learners may face if they genuinely need to converse in English.</div><div class=\"u\">المنهج التواصلي عن عكس مواقف الحياة الحقيقية، اللي المتعلمين ممكن يقابلوها لو احتاجوا فعلًا يتكلموا إنجليزية.</div>", "n": 1, "i": 4, "a": "tefl-32-004", "x": "88efa4a9"}, {"t": "learn", "h": "<div class=\"u\">The unit's check, solved. The communicative task is: describing a picture while another student draws what they hear.</div><div class=\"u\">تمرين الوحدة، محلول. المهمة التواصلية هي: وصف صورة وطالب تاني بيرسم اللي بيسمعه.</div>", "n": 1, "i": 5, "a": "tefl-32-005", "x": "ce42f7ad"}, {"t": "learn", "h": "<div class=\"u\">A prepared speech and a scripted role-play are not communicative activities.</div><div class=\"u\">الخطاب المحضّر ولعبة الأدوار المكتوبة مسبقًا مش أنشطة تواصلية.</div>", "n": 1, "i": 6, "a": "tefl-32-006", "x": "0e1c67de"}, {"t": "learn", "h": "<div class=\"u\">Why? Because in the drawing task, information is changing hands. In the others, it is not.</div><div class=\"u\">ليه؟ لأن في مهمة الرسم، المعلومات بتنتقل من إيد لإيد. في التانيين، لأ.</div>", "n": 1, "i": 7, "a": "tefl-32-007", "x": "045291c9"}, {"t": "learn", "h": "<div class=\"u\">The students interact for a specific purpose, one that could reflect reality, like describing something over the phone.</div><div class=\"u\">الطلبة بيتفاعلوا لهدف محدد، هدف ممكن يعكس الواقع، زي وصف حاجة في التليفون.</div>", "n": 1, "i": 8, "a": "tefl-32-008", "x": "1965bcb7"}, {"t": "learn", "h": "<div class=\"u\">Communicative activities must include some kind of information exchange.</div><div class=\"u\">الأنشطة التواصلية لازم يكون فيها نوع من تبادل المعلومات.</div>", "n": 1, "i": 9, "a": "tefl-32-009", "x": "bcbd4e95"}, {"t": "learn", "h": "<div class=\"u\">And they must either reflect a real-life situation, or reflect language that could be exploited in a real-life situation.</div><div class=\"u\">ولازم يا إما تعكس موقف من الحياة الحقيقية، يا تعكس لغة ممكن تتستغل في موقف حقيقي.</div>", "n": 1, "i": 10, "a": "tefl-32-010", "x": "b2f67d78"}, {"t": "learn", "h": "<div class=\"u\">Common types: a variety of gap-fill tasks, spot the difference, problem-based discussions, board games, and instruction giving.</div><div class=\"u\">أنواع شائعة: تشكيلة مهام ملء فراغات، ولعبة اكتشاف الفروق، ومناقشات مبنية على مشاكل، وألعاب طاولة، وإعطاء تعليمات.</div>", "n": 1, "i": 11, "a": "tefl-32-011", "x": "29dd9164"}, {"t": "section", "h": "Gap-fills | ملء الفراغات", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">Some gap-fill tasks are non-communicative, like completing sentences with the correct form of the verb in brackets.</div><div class=\"u\">بعض مهام ملء الفراغات غير تواصلية، زي إكمال جمل بالشكل الصح للفعل اللي بين قوسين.</div>", "n": 1, "i": 13, "a": "tefl-32-012", "x": "83f3f3b3"}, {"t": "learn", "h": "<div class=\"u\">Example: If the photos ___ good, I will send them to you. (be). That is accuracy work, not communication.</div><div class=\"u\">مثال: If the photos ___ good, I will send them to you. (be). ده شغل دقة، مش تواصل.</div>", "n": 1, "i": 14, "a": "tefl-32-013", "x": "a4c3fa16"}, {"t": "learn", "h": "<div class=\"u\">But many gap-fills can promote effective communication.</div><div class=\"u\">بس ملء فراغات كتير ممكن يعزّز تواصل فعّال.</div>", "n": 1, "i": 15, "a": "tefl-32-014", "x": "bc729c3d"}, {"t": "learn", "h": "<div class=\"u\">A good one: put students in pairs and give them the same text, but with different information missing from each copy.</div><div class=\"u\">واحدة كويسة: حط الطلبة في أزواج وادّيهم نفس النص، بس بمعلومات مختلفة ناقصة من كل نسخة.</div>", "n": 1, "i": 16, "a": "tefl-32-015", "x": "1efe56cc"}, {"t": "learn", "h": "<div class=\"u\">They must ask questions to get the missing information from their partner, and complete their text.</div><div class=\"u\">لازم يسألوا أسئلة عشان ياخدوا المعلومات الناقصة من زميلهم، ويكمّلوا نصهم.</div>", "n": 1, "i": 17, "a": "tefl-32-016", "x": "c72c268a"}, {"t": "learn", "h": "<div class=\"u\">There are many variations: split crosswords, pictures with different items missing from each, even timetables or schedules with different blank spaces.</div><div class=\"u\">في أشكال كتير: كروسورد مقسوم، صور بعناصر مختلفة ناقصة من كل واحدة، حتى جداول مواعيد بفراغات مختلفة.</div>", "n": 1, "i": 18, "a": "tefl-32-017", "x": "b25bd533"}, {"t": "learn", "h": "<div class=\"u\">You may have to monitor your students, though, to make sure they do not cheat by peeking.</div><div class=\"u\">ممكن تحتاج تراقب طلبتك، عشان تتأكد إنهم مابيغشّوش بالتلصص.</div>", "n": 1, "i": 19, "a": "tefl-32-018", "x": "7d224f00"}, {"t": "section", "h": "Spot the difference | لعبة الفروق", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">A great task for practising detailed descriptions is the picture difference task.</div><div class=\"u\">مهمة عظيمة للتمرين على الأوصاف التفصيلية هي مهمة صورة الفروق.</div>", "n": 1, "i": 21, "a": "tefl-32-019", "x": "9a7dd4b1"}, {"t": "learn", "h": "<div class=\"u\">It is done by communication, not looking, of course.</div><div class=\"u\">بتتعمل بالتواصل، مش بالبص، طبعًا.</div>", "n": 1, "i": 22, "a": "tefl-32-020", "x": "2237d77d"}, {"t": "learn", "h": "<div class=\"u\">Pairs are given the same image with a few slight differences, or big ones, depending on the level of your class.</div><div class=\"u\">الأزواج بتاخد نفس الصورة بفروق بسيطة شوية، أو كبيرة، حسب مستوى فصلك.</div>", "n": 1, "i": 23, "a": "tefl-32-021", "x": "e8dbe093"}, {"t": "learn", "h": "<div class=\"u\">They have to find the differences, by describing their picture to each other.</div><div class=\"u\">لازم يلاقوا الفروق، عن طريق وصف صورهم لبعض.</div>", "n": 1, "i": 24, "a": "tefl-32-022", "x": "2a681845"}, {"t": "learn", "h": "<div class=\"u\">Imagine you are a student: how would you describe your image to your partner, without showing it?</div><div class=\"u\">تخيّل إنك طالب: هتوصف صورتك لزميلك إزاي، من غير ما توريهاله؟</div>", "n": 1, "i": 25, "a": "tefl-32-023", "x": "0494e265"}, {"t": "section", "h": "Problem-based discussions | المناقشات المبنية على مشاكل", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">Problem-based discussions can be anything from desert island scenarios to ranking the importance of certain statements or ideas.</div><div class=\"u\">المناقشات المبنية على مشاكل ممكن تكون أي حاجة من سيناريوهات الجزيرة المهجورة لترتيب أهمية عبارات أو أفكار معينة.</div>", "n": 1, "i": 27, "a": "tefl-32-024", "x": "544019a4"}, {"t": "learn", "h": "<div class=\"u\">In these discussions the teacher acts as a facilitator: introducing the problem and the language needed to work on it.</div><div class=\"u\">في المناقشات دي المدرس بيتصرف كميسّر: بيقدّم المشكلة واللغة المطلوبة للشغل عليها.</div>", "n": 1, "i": 28, "a": "tefl-32-025", "x": "d5dd79ee"}, {"t": "learn", "h": "<div class=\"u\">Then students go into small or larger groups. You go around observing and supporting, occasionally joining a group to stimulate discussion.</div><div class=\"u\">وبعدين الطلبة بيروحوا في مجموعات صغيرة أو كبيرة. إنت بتلف بتراقب وتدعم، وساعات بتنضم لمجموعة تنشّط النقاش.</div>", "n": 1, "i": 29, "a": "tefl-32-026", "x": "368860d1"}, {"t": "learn", "h": "<div class=\"u\">It is important not to dictate. You want students to address the problem for themselves.</div><div class=\"u\">المهم ماتفرضش رأيك. إنت عايز الطلبة يعالجوا المشكلة بنفسهم.</div>", "n": 1, "i": 30, "a": "tefl-32-027", "x": "b15d809d"}, {"t": "learn", "h": "<div class=\"u\">This task is great for practising presenting personal opinions, agreeing and disagreeing politely, and compromising.</div><div class=\"u\">المهمة دي عظيمة للتمرين على تقديم الآراء الشخصية، والموافقة والرفض بأدب، والوصول لتسوية.</div>", "n": 1, "i": 31, "a": "tefl-32-028", "x": "537d8dd4"}, {"t": "learn", "h": "<div class=\"u\">The unit's ordering task, solved. Step one: introduce the problem using a handout, warmer exercise, or list on the board.</div><div class=\"u\">تمرين الترتيب في الوحدة، محلول. خطوة واحد: قدّم المشكلة بورقة أو تمرين تسخين أو قايمة على السبورة.</div>", "n": 1, "i": 32, "a": "tefl-32-029", "x": "5e6197d1"}, {"t": "learn", "h": "<div class=\"u\">Step two: get students into small groups of about four to discuss the problem.</div><div class=\"u\">خطوة اتنين: قسّم الطلبة لمجموعات صغيرة حوالي أربعة يناقشوا المشكلة.</div>", "n": 1, "i": 33, "a": "tefl-32-030", "x": "9df0e1e3"}, {"t": "learn", "h": "<div class=\"u\">Step three: tell them they only have fifteen minutes, and must come to a compromise or agreement within that time.</div><div class=\"u\">خطوة تلاتة: قولهم إن معاهم ربع ساعة بس، ولازم يوصلوا لتسوية أو اتفاق في الوقت ده.</div>", "n": 1, "i": 34, "a": "tefl-32-031", "x": "222a1292"}, {"t": "learn", "h": "<div class=\"u\">Step four: move around the class, monitoring and stimulating the discussion if necessary.</div><div class=\"u\">خطوة أربعة: لف في الفصل، بتراقب وبتنشّط النقاش لو لزم.</div>", "n": 1, "i": 35, "a": "tefl-32-032", "x": "8dec2130"}, {"t": "learn", "h": "<div class=\"u\">Step five: ask a couple of students for their input. What do they think could be a solution?</div><div class=\"u\">خطوة خمسة: اسأل طالبين تلاتة عن رأيهم. إيه ممكن تكون الحلول من وجهة نظرهم؟</div>", "n": 1, "i": 36, "a": "tefl-32-033", "x": "f33ae937"}, {"t": "learn", "h": "<div class=\"u\">Step six: split the groups in half, and pair each half with a half from another group, to form new groups.</div><div class=\"u\">خطوة ستة: قسّم المجموعات نصين، وجاوز كل نص مع نص من مجموعة تانية، عشان تعمل مجموعات جديدة.</div>", "n": 1, "i": 37, "a": "tefl-32-034", "x": "5e4df8cd"}, {"t": "learn", "h": "<div class=\"u\">Step seven: again, ask students to discuss and come to an agreement. Give them ten minutes this time.</div><div class=\"u\">خطوة سبعة: تاني، اطلب من الطلبة يناقشوا ويوصلوا لاتفاق. ادّيهم عشر دقايق المرة دي.</div>", "n": 1, "i": 38, "a": "tefl-32-035", "x": "468edb61"}, {"t": "learn", "h": "<div class=\"u\">Step eight: the whole group feeds back. Did the groups come to different conclusions the second time around?</div><div class=\"u\">خطوة تمانية: المجموعة كلها بتلخّص نتايجها. هل المجموعات وصلت لاستنتاجات مختلفة المرة التانية؟</div>", "n": 1, "i": 39, "a": "tefl-32-036", "x": "38ba4ece"}, {"t": "section", "h": "Board games | ألعاب الطاولة", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">Board games are great in the EFL classroom, because they practise language in a really fun way.</div><div class=\"u\">ألعاب الطاولة عظيمة في فصل الإنجليزية، لأنها بتتمرن على اللغة بطريقة ممتعة جدًا.</div>", "n": 1, "i": 41, "a": "tefl-32-037", "x": "84d9f6da"}, {"t": "learn", "h": "<div class=\"u\">There are lots of ready-made board games for English teaching. Or you can create your own, using a template or your imagination.</div><div class=\"u\">في ألعاب طاولة جاهزة كتير لتدريس الإنجليزية. أو تقدر تعمل بتاعتك، بقالب أو بخيالك.</div>", "n": 1, "i": 42, "a": "tefl-32-038", "x": "e32e8dbe"}, {"t": "learn", "h": "<div class=\"u\">Introducing a competitive element always gets students talking.</div><div class=\"u\">إدخال عنصر المنافسة دايمًا بيخلّي الطلبة يتكلموا.</div>", "n": 1, "i": 43, "a": "tefl-32-039", "x": "da569ae1"}, {"t": "learn", "h": "<div class=\"u\">To make the game as communicative as possible, use cards which get students to respond to questions, but also to ask someone else in the class.</div><div class=\"u\">عشان تخلّي اللعبة تواصلية لأقصى حد، استخدم كروت بتخلّي الطلبة يردّوا على أسئلة، وكمان يسألوا حد تاني في الفصل.</div>", "n": 1, "i": 44, "a": "tefl-32-040", "x": "9eade7dd"}, {"t": "learn", "h": "<div class=\"u\">There are websites with printable and editable games, ready to adapt for your class.</div><div class=\"u\">في مواقع فيها ألعاب قابلة للطباعة والتعديل، جاهزة تتكيّف لفصلك.</div>", "n": 1, "i": 45, "a": "tefl-32-041", "x": "63a6a994"}, {"t": "section", "h": "Unit 2 questions | أسئلة الوحدة ٢", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">Question one: which is a communicative activity? Answer: the information gap-fill, like a split crossword. The verb-tense gap-fill is not.</div><div class=\"u\">سؤال واحد: أنهي واحدة نشاط تواصلي؟ الإجابة: ملء فراغات المعلومات، زي الكروسورد المقسوم. ملء فراغات الأزمنة لأ.</div>", "n": 1, "i": 47, "a": "tefl-32-042", "x": "ce8c149a"}, {"t": "learn", "h": "<div class=\"u\">Question two: which is NOT a communicative activity? Answer: describing a picture to the teacher. No information changes hands.</div><div class=\"u\">سؤال اتنين: أنهي واحدة مش نشاط تواصلي؟ الإجابة: وصف صورة للمدرس. مفيش معلومات بتنتقل.</div>", "n": 1, "i": 48, "a": "tefl-32-043", "x": "c0873b1a"}, {"t": "learn", "h": "<div class=\"u\">Spot the difference and board games are both communicative.</div><div class=\"u\">لعبة الفروق وألعاب الطاولة الاتنين تواصليين.</div>", "n": 1, "i": 49, "a": "tefl-32-044", "x": "1f710ee6"}, {"t": "learn", "h": "<div class=\"u\">Question three: communicative activities focus on exchanging information. True or false? True.</div><div class=\"u\">سؤال تلاتة: الأنشطة التواصلية بتركّز على تبادل المعلومات. صح ولا غلط؟ صح.</div>", "n": 1, "i": 50, "a": "tefl-32-045", "x": "505db92c"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 51}, {"t": "learn", "h": "<div class=\"u\">communicative activity: a task with a real information exchange.</div><div class=\"u\">نشاط تواصلي: مهمة فيها تبادل معلومات حقيقي.</div>", "n": 1, "i": 52, "a": "tefl-32-046", "x": "3ea077d5"}, {"t": "learn", "h": "<div class=\"u\">split crossword: a crossword where each partner has half the answers.</div><div class=\"u\">الكروسورد المقسوم: كلمات متقاطعة كل طرف معاه نص الإجابات.</div>", "n": 1, "i": 53, "a": "tefl-32-047", "x": "6319bf65"}, {"t": "learn", "h": "<div class=\"u\">spot the difference: a picture task finding differences by talking.</div><div class=\"u\">لعبة اكتشاف الفروق: مهمة صور بتلاكي الفروق بالكلام.</div>", "n": 1, "i": 54, "a": "tefl-32-048", "x": "76940341"}, {"t": "learn", "h": "<div class=\"u\">problem-based discussion: a group discussion solving a scenario.</div><div class=\"u\">المناقشة المبنية على مشكلة: نقاش جماعي بيحل سيناريو.</div>", "n": 1, "i": 55, "a": "tefl-32-049", "x": "911f1850"}, {"t": "learn", "h": "<div class=\"u\">board game: a game board used for language practice.</div><div class=\"u\">لعبة طاولة: لوحة لعبة بتتستخدم للتمرين على اللغة.</div>", "n": 1, "i": 56, "a": "tefl-32-050", "x": "bfc543c9"}, {"t": "learn", "h": "<div class=\"u\">instruction giving: a task where learners explain how to do something.</div><div class=\"u\">إعطاء التعليمات: مهمة المتعلمين فيها بيشرحوا إزاي يعملوا حاجة.</div>", "n": 1, "i": 57, "a": "tefl-32-051", "x": "23fcf1d0"}, {"t": "learn", "h": "<div class=\"u\">compromise: reaching agreement by each side giving a little.</div><div class=\"u\">التسوية: الوصول لاتفاق بإن كل طرف يتنازل شوية.</div>", "n": 1, "i": 58, "a": "tefl-32-052", "x": "1605fde2"}, {"t": "learn", "h": "<div class=\"u\">feedback: the teacher's comments after a task.</div><div class=\"u\">التغذية الراجعة: تعليقات المدرس بعد المهمة.</div>", "n": 1, "i": 59, "a": "tefl-32-053", "x": "d68ae011"}, {"t": "learn", "h": "<div class=\"u\">monitoring: the teacher watching and supporting during activities.</div><div class=\"u\">المراقبة: المدرس بيتفرج ويدعم أثناء الأنشطة.</div>", "n": 1, "i": 60, "a": "tefl-32-054", "x": "7f3fa117"}, {"t": "learn", "h": "<div class=\"u\">mingle: an activity where learners move and talk to many partners.</div><div class=\"u\">نشاط اختلاط: نشاط المتعلمين فيه بيتحركوا ويتكلموا مع شركا كتير.</div>", "n": 1, "i": 61, "a": "tefl-32-055", "x": "e1126211"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">A communicative activity needs interaction and an information exchange, not just speaking.</div><div class=\"u\">النشاط التواصلي محتاج تفاعل وتبادل معلومات، مش بس كلام.</div>", "n": 1, "i": 63, "a": "tefl-32-056", "x": "18de227f"}, {"t": "learn", "h": "<div class=\"u\">Describing a picture to someone who can see it is classroom-only; describing it to someone who cannot is communication.</div><div class=\"u\">وصف صورة لشخص شايفها حاجة فصول بس؛ وصفها لشخص مش شايفها ده تواصل.</div>", "n": 1, "i": 64, "a": "tefl-32-057", "x": "1f0a197f"}, {"t": "learn", "h": "<div class=\"u\">Information gap-fills: same text, different missing pieces, questions to complete it.</div><div class=\"u\">ملء فراغات المعلومات: نفس النص، قطع مختلفة ناقصة، أسئلة عشان تكمّله.</div>", "n": 1, "i": 65, "a": "tefl-32-058", "x": "9ac42c16"}, {"t": "learn", "h": "<div class=\"u\">Spot the difference, problem-based discussions, and board games all make students talk with a purpose.</div><div class=\"u\">لعبة الفروق والمناقشات المبنية على مشاكل وألعاب الطاولة كلها بتخلّي الطلبة يتكلموا بهدف.</div>", "n": 1, "i": 66, "a": "tefl-32-059", "x": "782f9eb9"}, {"t": "learn", "h": "<div class=\"u\">In discussions, the teacher facilitates and monitors, but never dictates the solution.</div><div class=\"u\">في المناقشات، المدرس بيسهّل ويراقب، بس عمره ما بيفرض الحل.</div>", "n": 1, "i": 67, "a": "tefl-32-060", "x": "b7904d37"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 68}, {"t": "mc", "q": "Which of these is a communicative activity?<br>أنهي واحدة من دول نشاط تواصلي؟", "opts": ["an information gap-fill like a split crossword | ملء فراغات معلومات زي الكروسورد المقسوم", "a verb-tense gap-fill | ملء فراغات أزمنة", "reading a scripted dialogue aloud | قراية حوار مكتوب بصوت عالي"], "ans": 0, "why": "A split crossword makes partners exchange missing information. | الكروسورد المقسوم بيخلّي الشريكين يتبادلوا معلومات ناقصة.", "ex": ["Correct. | صح.", "No. Verb forms are accuracy work. | غلط: الأزمنة شغل دقة.", "No. A scripted dialogue has no information gap. | غلط: الحوار المكتوب مفيهوش فجوة معلومات."], "n": 1, "i": 69, "h": ""}, {"t": "mc", "q": "Which is NOT a communicative activity?<br>أنهي واحدة مش نشاط تواصلي؟", "opts": ["describing a picture to the teacher | وصف صورة للمدرس", "spot the difference picture task | مهمة صورة الفروق", "a board game | لعبة طاولة"], "ans": 0, "why": "The teacher can see the picture, so no information changes hands. | المدرس شايف الصورة، فمفيش معلومات بتنتقل.", "ex": ["Correct. | صح.", "No. Spot the difference exchanges information. | غلط: لعبة الفروق بتبادل معلومات.", "No. Board games can be very communicative. | غلط: ألعاب الطاولة ممكن تكون تواصلية جدًا."], "n": 1, "i": 70, "h": ""}, {"t": "tf", "q": "Communicative activities focus on exchanging information.<br>الأنشطة التواصلية بتركّز على تبادل المعلومات.", "ans": true, "why": "True. Without information exchange, speech is meaningless. | صح. من غير تبادل معلومات، الكلام مالوش معنى.", "ex": ["Correct. | صح.", "Wrong. Information exchange is the core. | غلط: تبادل المعلومات هو الجوهر."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "The key ingredient that makes an activity communicative is:<br>المكوّن الأساسي اللي بيخلّي النشاط تواصلي هو:", "opts": ["information changing hands | المعلومات بتنتقل من إيد لإيد", "perfect grammar | قواعد مثالية", "teacher control | سيطرة المدرس"], "ans": 0, "why": "Interaction with a purpose, where information moves, is what counts. | التفاعل بهدف، حيث المعلومات بتتحرك، هو اللي مهم.", "ex": ["Correct. | صح.", "No. Accuracy is a separate goal. | غلط: الدقة هدف منفصل.", "No. The teacher facilitates. | غلط: المدرس بيسهّل."], "n": 1, "i": 72, "h": ""}, {"t": "tf", "q": "In a communicative gap-fill, both partners have the same missing information.<br>في ملء الفراغات التواصلي، الشريكين معاهم نفس المعلومات الناقصة.", "ans": false, "why": "False. Each partner has different missing information, so they must ask questions. | غلط. كل طرف معاه معلومات ناقصة مختلفة، فلازم يسألوا أسئلة.", "ex": ["Wrong. Different gaps create the need to talk. | غلط: الفراغات المختلفة هي اللي بتخلّق الحاجة للكلام.", "Correct. | صح."], "n": 1, "i": 73, "h": ""}, {"t": "mc", "q": "In a problem-based discussion, the teacher should:<br>في المناقشة المبنية على مشكلة، المدرس المفروض:", "opts": ["facilitate and monitor without dictating | يسهّل ويراقب من غير ما يفرض", "dictate the correct solution | يفرض الحل الصح", "grade every sentence | يصحّح كل جملة"], "ans": 0, "why": "Students must address the problem for themselves; the teacher stimulates but does not dictate. | الطلبة لازم يعالجوا المشكلة بنفسهم؛ المدرس بينشّط بس مابيفرضش.", "ex": ["Correct. | صح.", "No. Dictating kills the task. | غلط: الفرض بيموّت المهمة.", "No. The focus is discussion, not grading. | غلط: التركيز على النقاش مش التصحيح."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "In the discussion procedure, what happens right after the small groups form?<br>في إجراءات المناقشة، إيه اللي بيحصل بعد ما المجموعات الصغيرة بتتكون على طول؟", "opts": ["they get a 15-minute limit to reach agreement | بياخدوا ربع ساعة يوصلوا لاتفاق", "the groups split in half | المجموعات بتتقسم نصين", "the whole class feeds back | الفصل كله بيلخّص"], "ans": 0, "why": "Introduce, group, time-limit, monitor, take input, remix, discuss again, feedback. | قدّم، جمّع، حدّد الوقت، راقب، خد آراء، خلّط، ناقش تاني، لخّص.", "ex": ["Correct. | صح.", "No. Splitting comes later. | غلط: التقسيم بييجي بعدين.", "No. Feedback is the last step. | غلط: التلخيص آخر خطوة."], "n": 1, "i": 75, "h": ""}, {"t": "tf", "q": "Board games become more communicative when cards make students ask each other questions.<br>ألعاب الطاولة بتبقى أكثر تواصلية لما الكروت تخلّي الطلبة يسألوا بعض أسئلة.", "ans": true, "why": "True. Responding plus asking others keeps information moving. | صح. الرد وسؤال الآخرين بيخلّي المعلومات بتتحرك.", "ex": ["Correct. | صح.", "Wrong. Asking others raises the communication. | غلط: سؤال الآخرين بيرفع التواصل."], "n": 1, "i": 76, "h": ""}, {"t": "recall", "q": "Name five types of communicative activities.<br>اذكر خمس أنواع من الأنشطة التواصلية.", "a": "Information gap-fill tasks, spot the difference, problem-based discussions, board games, and instruction giving.<br>مهام ملء فراغات المعلومات، ولعبة اكتشاف الفروق، والمناقشات المبنية على مشاكل، وألعاب الطاولة، وإعطاء التعليمات.", "n": 1, "i": 77, "h": ""}, {"t": "recall", "q": "Why is describing a picture to someone who can see it NOT communicative?<br>ليه وصف صورة لشخص شايفها مش تواصلي؟", "a": "Because no information changes hands. It only ever happens in a classroom, so it is not authentic.<br>لأن مفيش معلومات بتنتقل. ده بيحصل بس في الفصول، فهو مش أصلي.", "n": 1, "i": 78, "h": ""}, {"t": "write", "q": "Explain the information gap principle (3-4 sentences).<br>اشرح مبدأ فجوة المعلومات (٣-٤ جمل).", "key": "tefl-32:1", "a": "An information gap means each learner holds information the other does not. To complete a task, they must ask questions and share what they have. This creates a real reason to talk, like describing something over the phone. Without a gap, speech is just display; with a gap, it becomes communication with a purpose.<br>فجوة المعلومات يعني كل متعلم معاه معلومات التاني ماعندهاش. عشان يكمّلوا مهمة، لازم يسألوا أسئلة ويشاركوا اللي معاهم. ده بيخلّق سبب حقيقي للكلام، زي وصف حاجة في التليفون. من غير فجوة، الكلام مجرد عرض؛ مع فجوة، بيبقى تواصل بهدف.", "n": 1, "i": 79, "h": ""}, {"t": "write", "q": "Describe how to run a problem-based discussion (3-4 sentences).<br>اوصف إزاي تدير مناقشة مبنية على مشكلة (٣-٤ جمل).", "key": "tefl-32:2", "a": "Introduce the problem with a handout or a warmer, and give the language students need. Put them in small groups with a clear time limit to reach an agreement, while you monitor and stimulate without dictating. Then take a couple of opinions, remix the groups, and let them discuss again with less time. Finish with whole-class feedback comparing the conclusions.<br>قدّم المشكلة بورقة أو تمرين تسخين، وادّي الطلبة اللغة اللي محتاجينها. حطهم في مجموعات صغيرة مع حد زمني واضح يوصلوا لاتفاق، وإنت بتراقب وبتنشّط من غير ما تفرض. وبعدين خد رايين تلاتة، وخلّط المجموعات، وسيبهم يناقشوا تاني بوقت أقل. اختم بتلخيص من الفصل كله بمقارنة الاستنتاجات.", "n": 1, "i": 80, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: error correction, what to correct, when to correct, and how to do it without discouraging anyone.</div><div class=\"u\">الدرس الجاي: تصحيح الأخطاء، إيه اللي تصحّحه، وإمتى تصحّحه، وإزاي تعمل ده من غير ما تحبط حد.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 81}];</script>
