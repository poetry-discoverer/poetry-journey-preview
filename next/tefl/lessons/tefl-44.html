<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤٤</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-44";window.STEPS=[{"t": "section", "h": "About the DVD lesson | عن درس الفيديو", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit 2 is built around a video of an authentic intermediate level reading lesson, using a top down approach.</div><div class=\"u\">الوحدة التانية مبنية حوالين فيديو لدرس قراءة حقيقي لمستوى متوسط، بمنهج من فوق لتحت.</div>", "n": 1, "i": 1, "a": "tefl-44-001", "x": "dde398c9"}, {"t": "learn", "h": "<div class=\"u\">The lesson first looks at the text from a general, wider perspective, then gradually focuses on more detail. The lesson plan is included too.</div><div class=\"u\">الدرس بيبص على النص من منظور عام وأوسع الأول، وبعدين بيركّز تدريجيًا على تفاصيل أكتر. ومخطط الدرس موجود كمان.</div>", "n": 1, "i": 2, "a": "tefl-44-002", "x": "a1003297"}, {"t": "learn", "h": "<div class=\"u\">When you first start teaching, many questions arise when you are planning. This unit collects the typical ones new teachers ask.</div><div class=\"u\">لما بتبدأ تدرّس أول مرة، أسئلة كتير بتظهر أثناء التخطيط. الوحدة دي بتجمع الأسئلة النموذجية اللي المدرسين الجداد بيسألوها.</div>", "n": 1, "i": 3, "a": "tefl-44-003", "x": "32e2753c"}, {"t": "learn", "h": "<div class=\"u\">In the video, Celia's language comes from a text about the comedian Lenny Henry's likes and dislikes.</div><div class=\"u\">في الفيديو، لغة سيليا جاية من نص عن حاجات الممثل الكوميدي ليني هنري اللي بيحبها واللي مابيحبش.</div>", "n": 1, "i": 4, "a": "tefl-44-004", "x": "bb7d7683"}, {"t": "learn", "h": "<div class=\"u\">In a lesson where the language comes from a text, the text provides the context.</div><div class=\"u\">في الدرس اللي اللغة جاية من نص، النص بيوفر السياق.</div>", "n": 1, "i": 5, "a": "tefl-44-005", "x": "2804d31e"}, {"t": "learn", "h": "<div class=\"u\">But students still need to have processed the text and understood the meaning before moving on to working with the language.</div><div class=\"u\">بس الطلبة لسه محتاجين يكونوا عالجوا النص وفهموا المعنى قبل ما ينتقلوا للشغل على اللغة.</div>", "n": 1, "i": 6, "a": "tefl-44-006", "x": "bc2a5981"}, {"t": "learn", "h": "<div class=\"u\">The suggested way to use the unit: read the questions Celia asked herself, look at the lesson plan, watch the video noticing solutions, then read the suggested solutions.</div><div class=\"u\">الطريقة المقترحة لاستخدام الوحدة: اقرأ الأسئلة اللي سيليا سألتها لنفسها، بص على مخطط الدرس، اتفرج على الفيديو ولاحظ الحلول، وبعدين اقرأ الحلول المقترحة.</div>", "n": 1, "i": 7, "a": "tefl-44-007", "x": "a572b9ce"}, {"t": "section", "h": "The eight planning questions | أسئلة التخطيط التمانية", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">Question 1: the text is about Lenny Henry, and some students do not know him because they missed the previous lesson, where a film about him was shown. What should I do?</div><div class=\"u\">السؤال الأول: النص عن ليني هنري، وبعض الطلبة مابيعرفوهوش لأنهم فاتهم الدرس اللي فات اللي اتعرض فيه فيلم عنه. أعمل إيه؟</div>", "n": 1, "i": 9, "a": "tefl-44-008", "x": "d4c00e34"}, {"t": "learn", "h": "<div class=\"u\">Question 2: do I need to spend a long time pre-teaching language before the students read the text?</div><div class=\"u\">السؤال التاني: هل محتاج أقضي وقت طويل في التعليم المسبق للغة قبل ما الطلبة يقرأوا النص؟</div>", "n": 1, "i": 10, "a": "tefl-44-009", "x": "65e2ce10"}, {"t": "learn", "h": "<div class=\"u\">Question 3: the students have to understand the text and process it. How many tasks should I have before focusing on the language?</div><div class=\"u\">السؤال التالت: الطلبة لازم يفهموا النص ويعالجوه. قد إيه مهمة المفروض أعمل قبل ما أركّز على اللغة؟</div>", "n": 1, "i": 11, "a": "tefl-44-010", "x": "541a556d"}, {"t": "learn", "h": "<div class=\"u\">Question 4: I have a scanning task, but my students often end up reading for detail, and then we get hung up on difficult language. What can I do?</div><div class=\"u\">السؤال الرابع: عندي مهمة مسح، بس طلبتي غالبًا بينتهي بيهم الحال بيقرأوا للتفاصيل، وبعدين بنتعلّق على لغة صعبة. أعمل إيه؟</div>", "n": 1, "i": 12, "a": "tefl-44-011", "x": "8b4e8404"}, {"t": "learn", "h": "<div class=\"u\">Question 5: timing is going to be my problem. I only have one hour with this class. How can I save time at different stages of the lesson?</div><div class=\"u\">السؤال الخامس: التوقيت هيبقى مشكلتي. معايا ساعة واحدة بس مع الفصل ده. إزاي أوفر وقت في مراحل الدرس المختلفة؟</div>", "n": 1, "i": 13, "a": "tefl-44-012", "x": "560c9e8f"}, {"t": "learn", "h": "<div class=\"u\">Question 6: do I need to concept check all the lexis in the lesson when the language has already been presented clearly?</div><div class=\"u\">السؤال السادس: هل محتاج أتأكد من فهم المفاهيم لكل المفردات في الدرس لما اللغة اتقدّمت أصلًا بوضوح؟</div>", "n": 1, "i": 14, "a": "tefl-44-013", "x": "fcb98b5b"}, {"t": "learn", "h": "<div class=\"u\">Question 7: I do not feel confident about dealing with grammatical form, and there seems to be a lot to cover. What can I do?</div><div class=\"u\">السؤال السابع: مش حاسس بثقة في التعامل مع التركيب القواعدي، وواضح إن في حاجات كتير لازم تتغطى. أعمل إيه؟</div>", "n": 1, "i": 15, "a": "tefl-44-014", "x": "84454436"}, {"t": "learn", "h": "<div class=\"u\">Question 8: do I need to link the language to the text?</div><div class=\"u\">السؤال التامن: هل محتاج أربط اللغة بالنص؟</div>", "n": 1, "i": 16, "a": "tefl-44-015", "x": "e3b4596f"}, {"t": "section", "h": "Solutions 1-3 | حلول ١-٣", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">Solution 1: for your lead-in, show a picture of Lenny Henry and ask the students who were there to tell those who were not about him.</div><div class=\"u\">حل ١: في المقدمة، وري صورة ليني هنري واطلب من الطلبة اللي كانوا موجودين يحكوا للي مكانوش عنه.</div>", "n": 1, "i": 18, "a": "tefl-44-016", "x": "a520977b"}, {"t": "learn", "h": "<div class=\"u\">Ask them basic questions about what they remember: who is he? Where is he from? Where is his family from? What does he do?</div><div class=\"u\">اسألهم أسئلة أساسية عن اللي فاكرينه: مين ده؟ من فين؟ عيلته من فين؟ بيشتغل إيه؟</div>", "n": 1, "i": 19, "a": "tefl-44-017", "x": "cdff2098"}, {"t": "learn", "h": "<div class=\"u\">Solution 2: no. Only pre-teach the absolutely key vocabulary that would stop students understanding the general message of the text.</div><div class=\"u\">حل ٢: لأ. علّم مسبقًا بس المفردات الأساسية تمامًا اللي هتمنع فهم الرسالة العامة للنص.</div>", "n": 1, "i": 20, "a": "tefl-44-018", "x": "ce147481"}, {"t": "learn", "h": "<div class=\"u\">You might find you do not need to teach anything, or that you can just tell them what a few items mean during the lead-in stage.</div><div class=\"u\">ممكن تلاقي إنك مش محتاج تعلّم أي حاجة، أو إنك تقدر بس تقولهم معنى كام عنصر أثناء المقدمة.</div>", "n": 1, "i": 21, "a": "tefl-44-019", "x": "65a491ae"}, {"t": "learn", "h": "<div class=\"u\">A common problem is that pre-teaching takes up most of the lesson, so your main aims are not achieved. Also, if you pre-teach everything, your lesson becomes too teacher centred.</div><div class=\"u\">مشكلة شائعة إن التعليم المسبق بياخد معظم الدرس، فأهدافك الرئيسية مابتتحققش. وكمان، لو علّمت كل حاجة مسبقًا، درسك بيبقى متمركز حوالين المدرس أوي.</div>", "n": 1, "i": 22, "a": "tefl-44-020", "x": "6a8f3a55"}, {"t": "section", "h": "Solution 4 | حل ٤", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">Solution 3: there is no set number, but you should not need more than two tasks before focusing on the language.</div><div class=\"u\">حل ٣: مفيش رقم محدد، بس المفروض ماتحتاجش أكتر من مهمتين قبل التركيز على اللغة.</div>", "n": 1, "i": 24, "a": "tefl-44-021", "x": "2e3d9b14"}, {"t": "learn", "h": "<div class=\"u\">In Celia's lesson, the first task has students scan the text for information about his likes and dislikes.</div><div class=\"u\">في درس سيليا، المهمة الأولى بتخلي الطلبة يمسحوا النص على معلومات عن حاجاته المفضلة والمكروهة.</div>", "n": 1, "i": 25, "a": "tefl-44-022", "x": "fbc0bf54"}, {"t": "learn", "h": "<div class=\"u\">The second task is also scanning, this time to take out the target language to be analysed in the next stage.</div><div class=\"u\">المهمة التانية مسح برضه، بس المرة دي عشان يطلّعوا اللغة المستهدفة اللي هتتحلل في المرحلة الجاية.</div>", "n": 1, "i": 26, "a": "tefl-44-023", "x": "74b64112"}, {"t": "learn", "h": "<div class=\"u\">Solution 4: set a time limit that only gives students time to scan the text, and make sure the task itself only requires scanning.</div><div class=\"u\">حل ٤: حط حد زمني بيدّي الطلبة وقت يمسحوا النص بس، واتأكد إن المهمة نفسها مابتطلبش غير المسح.</div>", "n": 1, "i": 27, "a": "tefl-44-024", "x": "effc2e67"}, {"t": "learn", "h": "<div class=\"u\">Tell them they do not need to understand all the vocabulary to do the task, and that you will look at the vocabulary at another stage if they still want to.</div><div class=\"u\">قولهم إنهم مش محتاجين يفهموا كل المفردات عشان يعملوا المهمة، وإنك هتبصوا على المفردات في مرحلة تانية لو لسه عايزين.</div>", "n": 1, "i": 28, "a": "tefl-44-025", "x": "a2a763a5"}, {"t": "section", "h": "Solutions 5-8 | حلول ٥-٨", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Solution 5, saving time: do not spend too long on the lead-in, and give clear instructions.</div><div class=\"u\">حل ٥، توفير الوقت: متقضيش وقت طويل في المقدمة، وادّي تعليمات واضحة.</div>", "n": 1, "i": 30, "a": "tefl-44-026", "x": "d9548c84"}, {"t": "learn", "h": "<div class=\"u\">Also have the language analysis on the board and on a handout, so students do not waste time copying from the board.</div><div class=\"u\">وكمان خلّي تحليل اللغة على السبورة وعلى ورقة توزع، عشان الطلبة ماتضيّعش وقت في النسخ من السبورة.</div>", "n": 1, "i": 31, "a": "tefl-44-027", "x": "7626057b"}, {"t": "learn", "h": "<div class=\"u\">Solution 6: no. In Celia's lesson the cline (scale) was clear enough to not need concept checking. Visuals that are clear usually do not need to be concept checked.</div><div class=\"u\">حل ٦: لأ. في درس سيليا التدرّج كان واضح كفاية إنه مش محتاج تأكيد مفاهيم. المرئيات الواضحة عادة مابتحتاجش تأكيد مفاهيم.</div>", "n": 1, "i": 32, "a": "tefl-44-028", "x": "cc4f01ed"}, {"t": "learn", "h": "<div class=\"u\">Solution 7: read up on your target language and plan carefully. Being a bit nervous is natural; as long as you understand the main structure of the grammar, you will be fine.</div><div class=\"u\">حل ٧: اقرا كويس عن لغتك المستهدفة وخطط بعناية. إنك تبقى متوتر شوية طبيعي؛ طالما فاهم التركيب الرئيسي للقواعد، هتبقى كويس.</div>", "n": 1, "i": 33, "a": "tefl-44-029", "x": "01a0ce65"}, {"t": "learn", "h": "<div class=\"u\">The main aim of any lesson is that students can use the language effectively, so the focus is never solely on grammar; it will also be on skills, meaning and pronunciation.</div><div class=\"u\">الهدف الرئيسي لأي درس إن الطلبة يقدروا يستخدموا اللغة بفاعلية، فالتركيز أبدًا مابيبقى على القواعد بس؛ هيبقى كمان على المهارات والمعنى والنطق.</div>", "n": 1, "i": 34, "a": "tefl-44-030", "x": "9776652c"}, {"t": "learn", "h": "<div class=\"u\">Pre-prepare exactly what you are going to do, and maybe a handout for students.</div><div class=\"u\">جهّز مسبقًا بالظبط اللي هتعمله، وممكن ورقة توزيع للطلبة.</div>", "n": 1, "i": 35, "a": "tefl-44-031", "x": "272a0ad1"}, {"t": "learn", "h": "<div class=\"u\">Also think about whether you are trying to do too much; if not, find the most efficient way, as in Celia's lesson.</div><div class=\"u\">وفكّر كمان إذا كنت بتحاول تعمل حاجات كتير أوي؛ لو لأ، لاقي أكتر طريقة فعالة، زي درس سيليا.</div>", "n": 1, "i": 36, "a": "tefl-44-032", "x": "42412549"}, {"t": "learn", "h": "<div class=\"u\">Solution 8: yes! This is very important and often is not done enough. The text you choose is the context for the language and helps your students understand it, so exploit it and use it to help them.</div><div class=\"u\">حل ٨: أيوه! دي مهمة جدًا وغالبًا مابتتعملش كفاية. النص اللي بتختاره هو سياق اللغة وبيساعد طلبتك يفهموها، فاستغله واستخدمه عشان تساعدهم.</div>", "n": 1, "i": 37, "a": "tefl-44-033", "x": "eb3b0968"}, {"t": "section", "h": "Reading strategies | استراتيجيات القراءة", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">Now the effective strategies for developing students' reading skills. The goal: interesting, productive, enjoyable and fun, but not too much fun with young adults and adults.</div><div class=\"u\">دلوقتي الاستراتيجيات الفعالة لتنمية مهارات القراءة عند الطلبة. الهدف: ممتعة ومنتجة ومسلية وفيها مرح، بس مش مرح زيادة عن اللزوم مع الشباب والكبار.</div>", "n": 1, "i": 39, "a": "tefl-44-034", "x": "9bc29758"}, {"t": "learn", "h": "<div class=\"u\">Strategy one: guessing word meanings by using context clues. Strategy two: using word formation clues.</div><div class=\"u\">الاستراتيجية الأولى: تخمين معاني الكلمات باستخدام إشارات السياق. التانية: استخدام إشارات تكوين الكلمة.</div>", "n": 1, "i": 40, "a": "tefl-44-035", "x": "8b010857"}, {"t": "learn", "h": "<div class=\"u\">Strategy three: considering syntax and sentence structure by noting the grammatical functions of unknown words. Strategy four: analysing reference words.</div><div class=\"u\">التالتة: مراعاة التركيب النحوي وبنية الجملة بملاحظة الوظايف القواعدية للكلمات المش معروفة. الرابعة: تحليل كلمات الإحالة.</div>", "n": 1, "i": 41, "a": "tefl-44-036", "x": "a13569fe"}, {"t": "learn", "h": "<div class=\"u\">Strategy five: predicting text content. Strategy six: reading for specific pieces of information. Strategy seven: learning to use the dictionary effectively.</div><div class=\"u\">الخامسة: توقع محتوى النص. السادسة: القراءة لمعلومات محددة. السابعة: تعلم استخدام القاموس بفاعلية.</div>", "n": 1, "i": 42, "a": "tefl-44-037", "x": "743e0433"}, {"t": "learn", "h": "<div class=\"u\">There are also many integrative activities you can use. Use your imagination!</div><div class=\"u\">في كمان أنشطة تكاملية كتير تقدر تستخدمها. استخدم خيالك!</div>", "n": 1, "i": 43, "a": "tefl-44-038", "x": "b345a797"}, {"t": "section", "h": "Integrative activities 1 | أنشطة تكاملية ١", "n": 1, "i": 44}, {"t": "learn", "h": "<div class=\"u\">Integrative activity ideas: matching or contrasting, like matching or contrasting the characteristics of two individuals in the story.</div><div class=\"u\">أفكار أنشطة تكاملية: المطابقة أو المقارنة، زي مطابقة أو مقارنة صفات شخصيتين في القصة.</div>", "n": 1, "i": 45, "a": "tefl-44-039", "x": "b99d3796"}, {"t": "learn", "h": "<div class=\"u\">Timelines: these help students understand the way a text is structured, with tense changes, linking words and flashbacks.</div><div class=\"u\">الخطوط الزمنية: بتساعد الطلبة يفهموا إزاي النص مترتب، بتغييرات الأزمنة وكلمات الربط والاسترجاعات.</div>", "n": 1, "i": 46, "a": "tefl-44-040", "x": "b62d6ff9"}, {"t": "learn", "h": "<div class=\"u\">Character study: make it more interesting by getting students to complete, say, a doctor's report or a police report on the character.</div><div class=\"u\">دراسة الشخصية: خلّيها أمتع بإنك تخلي الطلبة يكملوا مثلًا تقرير دكتور أو محضر شرطة عن الشخصية.</div>", "n": 1, "i": 47, "a": "tefl-44-041", "x": "5cb66a2f"}, {"t": "learn", "h": "<div class=\"u\">Students reacting to texts by writing summaries, and writing new endings.</div><div class=\"u\">الطلبة بيتفاعلوا مع النصوص بكتابة ملخصات، وكتابة نهايات جديدة.</div>", "n": 1, "i": 48, "a": "tefl-44-042", "x": "916a7796"}, {"t": "learn", "h": "<div class=\"u\">Re-enacting the text, and dramatising interviews based on the text.</div><div class=\"u\">إعادة تمثيل النص، وتمثيل مقابلات مبنية على النص.</div>", "n": 1, "i": 49, "a": "tefl-44-043", "x": "678de1ce"}, {"t": "learn", "h": "<div class=\"u\">Carefully listening for key words or phrases from the text which appear in authentic video or audio tapes.</div><div class=\"u\">الاستماع بعناية لكلمات أو عبارات مفتاحية من النص بتظهر في فيديوهات أو تسجيلات أصلية.</div>", "n": 1, "i": 50, "a": "tefl-44-044", "x": "e1ced003"}, {"t": "learn", "h": "<div class=\"u\">Creating role-play situations or simulations of cultural experiences based on the text.</div><div class=\"u\">خلق مواقف لعب أدوار أو محاكاة لتجارب ثقافية مبنية على النص.</div>", "n": 1, "i": 51, "a": "tefl-44-045", "x": "a650fb47"}, {"t": "section", "h": "Integrative activities 2 | أنشطة تكاملية ٢", "n": 1, "i": 52}, {"t": "learn", "h": "<div class=\"u\">True/false questions, factual questions and why questions as a basis for discussing the text, not for testing it.</div><div class=\"u\">أسئلة صح/غلط وأسئلة واقعية وأسئلة ليه كأساس لمناقشة النص، مش لاختباره.</div>", "n": 1, "i": 53, "a": "tefl-44-046", "x": "c25bc0a3"}, {"t": "learn", "h": "<div class=\"u\">Gap filling: the gaps might all be factual words from the passage; alternatively, they might be linking words that hold the sentences together; they could also be grammatical items.</div><div class=\"u\">ملء الفراغات: الفراغات ممكن تكون كلها كلمات واقعية من القطعة؛ أو ممكن تكون كلمات ربط بتمسك الجمل ببعض؛ وممكن كمان تكون عناصر قواعدية.</div>", "n": 1, "i": 54, "a": "tefl-44-047", "x": "c6b1357e"}, {"t": "learn", "h": "<div class=\"u\">Distinguishing fact from opinion, and drawing conclusions.</div><div class=\"u\">التمييز بين الحقيقة والرأي، واستخلاص النتايج.</div>", "n": 1, "i": 55, "a": "tefl-44-048", "x": "ed1a287c"}, {"t": "learn", "h": "<div class=\"u\">Relating what they have read to their experiences or to other texts.</div><div class=\"u\">ربط اللي قرأوه بخبراتهم أو بنصوص تانية.</div>", "n": 1, "i": 56, "a": "tefl-44-049", "x": "cfa40840"}, {"t": "learn", "h": "<div class=\"u\">Noting contradictions and inconsistencies, perhaps in what characters say and do.</div><div class=\"u\">ملاحظة التناقضات وعدم الاتساق، ممكن في اللي الشخصيات بتقوله وبتعمله.</div>", "n": 1, "i": 57, "a": "tefl-44-050", "x": "153065e9"}, {"t": "section", "h": "Fun activities 1 | أنشطة مرح ١", "n": 1, "i": 58}, {"t": "learn", "h": "<div class=\"u\">Now some tried and tested reading activities. Choose participative, interesting, fun passages and topics; adapt them for younger or older learners.</div><div class=\"u\">دلوقتي شوية أنشطة قراءة متجربة ومضمونة. اختار قطع ومواضيع تشاركية وممتعة؛ وكيّفها للصغيرين أو الكبار.</div>", "n": 1, "i": 59, "a": "tefl-44-051", "x": "cd439455"}, {"t": "learn", "h": "<div class=\"u\">Activity one, distraction: bring a learner from each group to the front, and have them all try to finish reading the extract at the same time.</div><div class=\"u\">النشاط الأول، التشتيت: نادِ متعلم من كل مجموعة لقدام الفصل، وخلّيهم كلهم يحاولوا يخلّصوا قراءة المقتطف في نفس الوقت.</div>", "n": 1, "i": 60, "a": "tefl-44-052", "x": "bbdc3242"}, {"t": "learn", "h": "<div class=\"u\">Meanwhile you try to distract them with silly comments, sound effects or funny faces, without touching them.</div><div class=\"u\">وفي نفس الوقت حاول تشتّتهم بتعليقات هبلة أو مؤثرات صوتية أو وشوش مضحكة، من غير ما تلمسهم.</div>", "n": 1, "i": 61, "a": "tefl-44-053", "x": "f63e2d48"}, {"t": "learn", "h": "<div class=\"u\">Award points for the first to finish, or the one who kept a straight face longest.</div><div class=\"u\">احسب نقاط لأول واحد يخلّص، أو اللي يفضل ماشي بوجه جد أطول فترة.</div>", "n": 1, "i": 62, "a": "tefl-44-054", "x": "b480d9bd"}, {"t": "learn", "h": "<div class=\"u\">Activity two, DVD control buttons: draw a DVD-style control panel on the board with play, pause, slow motion and fast, but not rewind.</div><div class=\"u\">النشاط التاني، أزرار الدي في دي: ارسم لوحة تحكم زي الدي في دي على السبورة فيها تشغيل وإيقاف مؤقت وحركة بطيئة وسريع، بس من غير رجوع.</div>", "n": 1, "i": 63, "a": "tefl-44-055", "x": "d118eb80"}, {"t": "learn", "h": "<div class=\"u\">The class reads the extract aloud together; when you hit a button, they must adapt their reading style: start, stop, slow down, speed up.</div><div class=\"u\">الفصل بيقرأ المقتطف بصوت عالي مع بعض؛ لما تدوس زرار، لازم يظبطوا أسلوب قراءتهم: يبدأوا، يقفوا، يبطّئوا، يسرّعوا.</div>", "n": 1, "i": 64, "a": "tefl-44-056", "x": "809bde43"}, {"t": "learn", "h": "<div class=\"u\">Develop it further with happy and sad face buttons, or musical notes meaning they sing instead of read. Be creative; the possibilities are endless.</div><div class=\"u\">طوّرها أكتر بأزرار وشوش مبسوطة وزعلانة، أو نوتات موسيقية معناها إنهم يغنّوا بدل ما يقرأوا. ابتكر؛ الإمكانيات مالهاش حد.</div>", "n": 1, "i": 65, "a": "tefl-44-057", "x": "74ed714b"}, {"t": "section", "h": "Fun activities 2 | أنشطة مرح ٢", "n": 1, "i": 66}, {"t": "learn", "h": "<div class=\"u\">Activity three, one student one word: put learners into teams. Go around the room having them read the story one person, one word.</div><div class=\"u\">النشاط التالت، طالب واحد كلمة واحدة: حط المتعلمين في فرق. لف على الفصل وهم بيقرأوا القصة كل واحد كلمة.</div>", "n": 1, "i": 67, "a": "tefl-44-058", "x": "a282f631"}, {"t": "learn", "h": "<div class=\"u\">When a learner says the wrong word or delays more than three seconds, give the other team a point. Encourage them to be alert and keep a good fast pace.</div><div class=\"u\">لما متعلم يقول كلمة غلط أو يتأخر أكتر من تلات ثواني، احسب نقطة للفريق التاني. شجّعهم يبقوا مركّزين ويحافظوا على إيقاع سريع.</div>", "n": 1, "i": 68, "a": "tefl-44-059", "x": "461357c0"}, {"t": "learn", "h": "<div class=\"u\">Activity four, read to me circle: learners stand in a circle with their books, in designated pairs, reading to each other at the same time.</div><div class=\"u\">النشاط الرابع، دايرة اقرالي: المتعلمين بيقفوا في دايرة بكتبهم، في أزواج محددة، بيقرأوا لبعض في نفس الوقت.</div>", "n": 1, "i": 69, "a": "tefl-44-060", "x": "0d4c7d25"}, {"t": "learn", "h": "<div class=\"u\">When you shout switch, they turn to the person on their other side and read to them instead.</div><div class=\"u\">لما تصرخ بدّل، يلفوا للشخص اللي على جنبهم التاني ويقرأوله بدل كده.</div>", "n": 1, "i": 70, "a": "tefl-44-061", "x": "9d3c89e3"}, {"t": "learn", "h": "<div class=\"u\">Activity five, walk and read: learners stand up, hold the book close to their faces, and read while walking around, in a direction or randomly. Tell them to hop and skip to mix it up.</div><div class=\"u\">النشاط الخامس، امشي واقرا: المتعلمين بيقفوا، ماسكين الكتاب قريب من وشوشهم، وبيقرأوا وهما ماشيين، في اتجاه أو عشوائي. قولهم ينطّوا عشان تبقى أمتع.</div>", "n": 1, "i": 71, "a": "tefl-44-062", "x": "797db303"}, {"t": "learn", "h": "<div class=\"u\">Activity six, upside down reading: in pairs, learners hold their book upside down and race to read through the extract. After each round, switch partners and go again.</div><div class=\"u\">النشاط السادس، القراءة بالمقلوب: في أزواج، المتعلمين بيمسكوا كتبهم بالمقلوب ويتسابقوا يقرأوا المقتطف. بعد كل جولة، بدّلوا الشركاء والعبوا تاني.</div>", "n": 1, "i": 72, "a": "tefl-44-063", "x": "d1bb88a7"}, {"t": "learn", "h": "<div class=\"u\">Activity seven, banned words: ban words with a particular grammatical value, like on, over, under, before, or words starting with a letter, or past participles.</div><div class=\"u\">النشاط السابع، الكلمات الممنوعة: امنع كلمات بقيمة قواعدية معينة، زي on و over و under و before، أو كلمات بتبدأ بحرف معين، أو أسماء المفعول.</div>", "n": 1, "i": 73, "a": "tefl-44-064", "x": "74838b2c"}, {"t": "learn", "h": "<div class=\"u\">Read the text, and when a banned word emerges, learners must replace it with a sound or a different word.</div><div class=\"u\">اقرا النص، ولما كلمة ممنوعة تظهر، المتعلمين لازم يستبدلوها بصوت أو كلمة مختلفة.</div>", "n": 1, "i": 74, "a": "tefl-44-065", "x": "3128e12f"}, {"t": "learn", "h": "<div class=\"u\">Activity eight, reading bingo: learners choose ten random words from the extract and write them down. Read sentences from the text in random order; they cross off words as they hear them.</div><div class=\"u\">النشاط التامن، بينجو القراءة: المتعلمين بيختاروا عشر كلمات عشوائية من المقتطف ويكتبوها. اقرا جمل من النص بترتيب عشوائي؛ بيشطبوا الكلمات لما يسمعوها.</div>", "n": 1, "i": 75, "a": "tefl-44-066", "x": "67eaa595"}, {"t": "learn", "h": "<div class=\"u\">The first learner to cross off all their words wins and becomes the reader.</div><div class=\"u\">أول متعلم يشطب كل كلماته بيكسب وبيبقى هو القارئ.</div>", "n": 1, "i": 76, "a": "tefl-44-067", "x": "9f393024"}, {"t": "learn", "h": "<div class=\"u\">Note: many speaking, writing and listening activities also work for intensive reading, like identifying mistakes and reordering sentences.</div><div class=\"u\">خد بالك: أنشطة كتير من الكلام والكتابة والاستماع بتنفع كمان للقراءة المكثفة، زي تحديد الأخطاء وإعادة ترتيب الجمل.</div>", "n": 1, "i": 77, "a": "tefl-44-068", "x": "9ab53f48"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 78}, {"t": "learn", "h": "<div class=\"u\">lead-in: the opening stage that introduces the topic and sparks interest.</div><div class=\"u\">المقدمة: مرحلة البداية اللي بتقدّم الموضوع وبتولّع الاهتمام.</div>", "n": 1, "i": 79, "a": "tefl-44-069", "x": "40860a34"}, {"t": "learn", "h": "<div class=\"u\">pre-teach: to teach key vocabulary before the main task.</div><div class=\"u\">التعليم المسبق: تعليم مفردات أساسية قبل المهمة الرئيسية.</div>", "n": 1, "i": 80, "a": "tefl-44-070", "x": "d7d161f0"}, {"t": "learn", "h": "<div class=\"u\">teacher-centred: a lesson where the teacher does most of the work and talking.</div><div class=\"u\">متمركز حوالين المدرس: درس المدرس فيه بيعمل معظم الشغل والكلام.</div>", "n": 1, "i": 81, "a": "tefl-44-071", "x": "899159fe"}, {"t": "learn", "h": "<div class=\"u\">concept check: questions that confirm students understood the meaning of new language.</div><div class=\"u\">تأكيد المفاهيم: أسئلة بتتأكد إن الطلبة فهموا معنى اللغة الجديدة.</div>", "n": 1, "i": 82, "a": "tefl-44-072", "x": "e23a7549"}, {"t": "learn", "h": "<div class=\"u\">cline: a visual scale showing degrees, like from love to hate.</div><div class=\"u\">التدرّج: مقياس بصري بيبيّن الدرجات، زي من الحب للكره.</div>", "n": 1, "i": 83, "a": "tefl-44-073", "x": "9b06b3ca"}, {"t": "learn", "h": "<div class=\"u\">reference words: words like he, it, this that refer to something else in the text.</div><div class=\"u\">كلمات الإحالة: كلمات زي هو وده ودي بتشاور على حاجة تانية في النص.</div>", "n": 1, "i": 84, "a": "tefl-44-074", "x": "6608e018"}, {"t": "learn", "h": "<div class=\"u\">word formation: how words are built, like happy becoming unhappy.</div><div class=\"u\">تكوين الكلمة: إزاي الكلمات بتتبني، زي ما السعيد يبقى مش سعيد.</div>", "n": 1, "i": 85, "a": "tefl-44-075", "x": "b619b2c6"}, {"t": "learn", "h": "<div class=\"u\">gap filling: an exercise with missing words to complete.</div><div class=\"u\">ملء الفراغات: تمرين فيه كلمات ناقصة بتتكمل.</div>", "n": 1, "i": 86, "a": "tefl-44-076", "x": "cb9992b2"}, {"t": "learn", "h": "<div class=\"u\">target language: the language the lesson aims to teach.</div><div class=\"u\">اللغة المستهدفة: اللغة اللي الدرس بيهدف يعلّمها.</div>", "n": 1, "i": 87, "a": "tefl-44-077", "x": "d02f1de5"}, {"t": "learn", "h": "<div class=\"u\">follow-on task: an activity that comes after the main work, like writing.</div><div class=\"u\">مهمة المتابعة: نشاط بييجي بعد الشغل الرئيسي، زي الكتابة.</div>", "n": 1, "i": 88, "a": "tefl-44-078", "x": "cbbed651"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 89}, {"t": "learn", "h": "<div class=\"u\">A text-based lesson must let students process the text first; the text provides the context for the language work that follows.</div><div class=\"u\">الدرس المبني على نص لازم يسيب الطلبة يعالجوا النص الأول؛ النص بيوفر سياق شغل اللغة اللي بعده.</div>", "n": 1, "i": 90, "a": "tefl-44-079", "x": "dde83f85"}, {"t": "learn", "h": "<div class=\"u\">Pre-teach only the key vocabulary that blocks the general message, keep pre-reading tasks to two at most, and use time limits so scanning stays scanning.</div><div class=\"u\">علّم مسبقًا بس المفردات الأساسية اللي بتمنع الرسالة العامة، خلّي مهام ما قبل القراءة اتنين بكتير، واستخدم حدود زمنية عشان المسح يفضل مسح.</div>", "n": 1, "i": 91, "a": "tefl-44-080", "x": "f513847c"}, {"t": "learn", "h": "<div class=\"u\">Save time with a short lead-in, clear instructions and handouts; skip concept checking when visuals are already clear; prepare grammar carefully.</div><div class=\"u\">وفّر وقت بمقدمة قصيرة وتعليمات واضحة وأوراق توزيع؛ سيب تأكيد المفاهيم لما المرئيات واضحة أصلًا؛ وجهّز القواعد بعناية.</div>", "n": 1, "i": 92, "a": "tefl-44-081", "x": "5dee07ce"}, {"t": "learn", "h": "<div class=\"u\">Always link the language back to the text; it is the context that helps students understand.</div><div class=\"u\">دايمًا اربط اللغة بالنص تاني؛ هو السياق اللي بيساعد الطلبة يفهموا.</div>", "n": 1, "i": 93, "a": "tefl-44-082", "x": "1d67a8ae"}, {"t": "learn", "h": "<div class=\"u\">Build reading with strategies like context clues and reference words, integrative tasks like timelines and gap filling, and fun games like DVD buttons and reading bingo.</div><div class=\"u\">ابني القراءة باستراتيجيات زي إشارات السياق وكلمات الإحالة، ومهام تكاملية زي الخطوط الزمنية وملء الفراغات، وألعاب مرح زي أزرار الدي في دي وبينجو القراءة.</div>", "n": 1, "i": 94, "a": "tefl-44-083", "x": "05d95ef2"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 95}, {"t": "tf", "q": "You should spend a long time pre-teaching language before students read the text.<br>لازم تقضي وقت طويل في التعليم المسبق للغة قبل ما الطلبة يقرأوا النص.", "ans": false, "why": "False. Only pre-teach the absolutely key vocabulary that blocks the general message; pre-teaching everything makes the lesson too teacher centred. | غلط. علّم مسبقًا بس المفردات الأساسية اللي بتمنع الرسالة العامة؛ تعليم كل حاجة بيخلي الدرس متمركز حوالين المدرس أوي.", "ex": ["Correct. Key vocabulary only. | صح: المفردات الأساسية بس.", "Wrong. Long pre-teaching eats the lesson's main aims. | غلط: التعليم المسبق الطويل بياكل أهداف الدرس الرئيسية."], "n": 1, "i": 96, "h": ""}, {"t": "mc", "q": "How many tasks should there be before focusing on the language?<br>قد إيه مهمة المفروض تيجي قبل التركيز على اللغة؟", "opts": ["no set number, but not more than two | مفيش رقم محدد، بس مش أكتر من اتنين", "exactly five | خمسة بالظبط", "as many as possible | بقدر الإمكان"], "ans": 0, "why": "There is no set number, but you should not need more than two, as in Celia's two scanning tasks. | مفيش رقم محدد، بس المفروض ماتحتاجش أكتر من اتنين، زي مهمتي المسح عند سيليا.", "ex": ["Correct. | صح.", "No. Five is far too many. | غلط: خمسة كتير أوي.", "No. Too many tasks delay the language work. | غلط: مهام كتير بتأخّر شغل اللغة."], "n": 1, "i": 97, "h": ""}, {"t": "tf", "q": "To stop students reading for detail during a scanning task, set a time limit and make the task require scanning only.<br>عشان تمنع الطلبة يقرأوا للتفاصيل أثناء مهمة المسح، حط حد زمني وخلّي المهمة بتطلب مسح بس.", "ans": true, "why": "True. Also tell them they do not need to understand all the vocabulary to do the task. | صح. وكمان قولهم إنهم مش محتاجين يفهموا كل المفردات عشان يعملوا المهمة.", "ex": ["Correct. | صح.", "Wrong. Time limits plus a scan-only task fix the problem. | غلط: الحد الزمني + مهمة مسح بس بيحلوا المشكلة."], "n": 1, "i": 98, "h": ""}, {"t": "mc", "q": "Which is one of the suggested ways to save time in a one-hour lesson?<br>أنهي من دول طريقة مقترحة لتوفير الوقت في درس ساعة واحدة؟", "opts": ["put the language analysis on a handout | حط تحليل اللغة على ورقة توزيع", "make students copy everything from the board | خلّي الطلبة ينسخوا كل حاجة من السبورة", "spend half the lesson on the lead-in | اقضي نص الدرس في المقدمة"], "ans": 0, "why": "A handout (plus the board) stops students wasting time copying. | ورقة التوزيع (مع السبورة) بتمنع ضياع الوقت في النسخ.", "ex": ["Correct. | صح.", "No. Copying wastes time. | غلط: النسخ بيضيّع وقت.", "No. The lead-in should be short. | غلط: المقدمة المفروض تبقى قصيرة."], "n": 1, "i": 99, "h": ""}, {"t": "tf", "q": "You must concept check all the lexis in a lesson, even when it has been presented clearly.<br>لازم تتأكد من فهم المفاهيم لكل المفردات في الدرس، حتى لو اتقدّمت بوضوح.", "ans": false, "why": "False. Clear visuals, like Celia's cline, usually do not need concept checking. | غلط. المرئيات الواضحة، زي تدرّج سيليا، عادة مابتحتاجش تأكيد مفاهيم.", "ex": ["Correct. Clear visuals do not need it. | صح: المرئيات الواضحة مابتحتاجوش.", "Wrong. Only check when clarity is missing. | غلط: اتأكد بس لما الوضوح ناقص."], "n": 1, "i": 100, "h": ""}, {"t": "mc", "q": "Should the language be linked to the text?<br>هل اللغة لازم تتربط بالنص؟", "opts": ["yes, the text is the context and should be exploited | أيوه، النص هو السياق ولازم يتستغل", "no, the text and language should stay separate | لأ، النص واللغة يفضلوا منفصلين", "only if there is time left | بس لو في وقت فاضل"], "ans": 0, "why": "Yes! Very important and often not done enough. The text is the context for the language. | أيوه! مهمة جدًا وغالبًا مابتتعملش كفاية. النص هو سياق اللغة.", "ex": ["Correct. | صح.", "No. Separating them loses the context. | غلط: فصلهم بيضيّع السياق.", "No. It is essential, not optional. | غلط: دي أساسية، مش اختيارية."], "n": 1, "i": 101, "h": ""}, {"t": "mc", "q": "Which of these is one of the unit's reading strategies?<br>أنهي من دول واحدة من استراتيجيات القراءة في الوحدة؟", "opts": ["analysing reference words | تحليل كلمات الإحالة", "memorising the whole dictionary | حفظ القاموس كله", "translating every sentence into Arabic | ترجمة كل جملة للعربي"], "ans": 0, "why": "The strategies include context clues, word formation, syntax, reference words, predicting, reading for specific information and dictionary use. | الاستراتيجيات بتشمل إشارات السياق، تكوين الكلمة، التركيب النحوي، كلمات الإحالة، التوقع، القراءة لمعلومات محددة واستخدام القاموس.", "ex": ["Correct. | صح.", "No. Nobody memorises a dictionary. | غلط: محدش بيحفظ قاموس.", "No. Full translation is not a strategy here. | غلط: الترجمة الكاملة مش استراتيجية هنا."], "n": 1, "i": 102, "h": ""}, {"t": "tf", "q": "In gap filling, the gaps can be factual words, linking words or grammatical items.<br>في ملء الفراغات، الفراغات ممكن تكون كلمات واقعية أو كلمات ربط أو عناصر قواعدية.", "ans": true, "why": "True. All three gap types are listed for this integrative activity. | صح. الأنواع التلاتة مذكورين للنشاط التكاملي ده.", "ex": ["Correct. | صح.", "Wrong. All three types are valid. | غلط: التلاتة أنواع صح."], "n": 1, "i": 103, "h": ""}, {"t": "recall", "q": "Name four of the seven reading strategies from this lesson.<br>اذكر أربع من استراتيجيات القراءة السبعة في الدرس ده.", "a": "Guessing word meanings with context clues; word formation clues; considering syntax by noting grammatical functions; analysing reference words; predicting content; reading for specific information; using the dictionary effectively.<br>تخمين المعاني بإشارات السياق؛ إشارات تكوين الكلمة؛ مراعاة التركيب النحوي بالوظايف القواعدية؛ تحليل كلمات الإحالة؛ توقع المحتوى؛ القراءة لمعلومات محددة؛ استخدام القاموس بفاعلية.", "n": 1, "i": 104, "h": ""}, {"t": "recall", "q": "Name at least five of the fun reading activities.<br>اذكر على الأقل خمسة من أنشطة القراءة الممتعة.", "a": "Distraction; DVD control buttons; one student one word; read to me circle; walk and read; upside down reading; banned words; reading bingo.<br>التشتيت؛ أزرار الدي في دي؛ طالب واحد كلمة واحدة؛ دايرة اقرالي؛ امشي واقرا؛ القراءة بالمقلوب؛ الكلمات الممنوعة؛ بينجو القراءة.", "n": 1, "i": 105, "h": ""}, {"t": "write", "q": "How should you handle students who do not know the topic of the text? (3-4 sentences)<br>إزاي تتعامل مع طلبة مابيعرفوش موضوع النص؟ (٣-٤ جمل).", "key": "tefl-44:1", "a": "Use the lead-in to build the missing context. In Celia's case, show a picture of Lenny Henry and ask the students who were present at the previous lesson to tell the others about him. Ask basic questions about what they remember: who is he, where is he from, where is his family from, what does he do. This way the students themselves supply the background, and everyone is ready for the text.<br>استخدم المقدمة عشان تبني السياق الناقص. في حالة سيليا، وري صورة ليني هنري واطلب من الطلبة اللي كانوا موجودين في الدرس اللي فات يحكوا للتانيين عنه. اسأل أسئلة أساسية عن اللي فاكرينه: مين ده، من فين، عيلته من فين، بيشتغل إيه. كده الطلبة نفسهم بيوفّروا الخلفية، وكلهم جاهزين للنص.", "n": 1, "i": 106, "h": ""}, {"t": "write", "q": "Why is pre-teaching everything a common mistake? (3-4 sentences)<br>ليه التعليم المسبق لكل حاجة غلطة شائعة؟ (٣-٤ جمل).", "key": "tefl-44:2", "a": "Pre-teaching everything takes up most of the lesson, so the main aims are not achieved. It also makes the lesson too teacher centred, with the teacher doing the work instead of the students. Only the absolutely key vocabulary, the items that would stop students understanding the general message, should be pre-taught. Often a few meanings during the lead-in are enough, or none at all.<br>التعليم المسبق لكل حاجة بياخد معظم الدرس، فالأهداف الرئيسية مابتتحققش. وكمان بيخلي الدرس متمركز حوالين المدرس أوي، والمدرس هو اللي بيعمل الشغل بدل الطلبة. بس المفردات الأساسية تمامًا، العناصر اللي هتمنع فهم الرسالة العامة، هي اللي المفروض تتعلّم مسبقًا. غالبًا كام معنى أثناء المقدمة بيكفوا، أو ولا حاجة خالص.", "n": 1, "i": 107, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 9 begins, the speaking skill. Module 8 is complete!</div><div class=\"u\">الدرس الجاي: بداية الموديول التاسع، مهارة الكلام. الموديول التامن خلص!</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 108}];</script>
