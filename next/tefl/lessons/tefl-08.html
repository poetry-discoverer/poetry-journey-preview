<script>window.LESSON_ID="tefl-08";window.STEPS=[{"t": "section", "h": "Why icebreakers matter | ليه ألعاب كسر الجليد مهمة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Unit 5: icebreakers. It is really important to make sure the class feel comfortable with each other and with you right from the beginning.</div><div class=\"u\">أهلًا بيك في الوحدة الخامسة: ألعاب كسر الجليد. مهم جدًا إنك تتأكد إن الفصل حاسس بالراحة مع بعض ومعاك من أول لحظة.</div>", "n": 1, "i": 1, "a": "tefl-08-001", "x": "ecce09e6"}, {"t": "learn", "h": "<div class=\"u\">Students must be able to interact with each other naturally. If they cannot, any form of communication activity becomes very difficult indeed.</div><div class=\"u\">الطلاب لازم يقدروا يتفاعلوا مع بعض بشكل طبيعي. لو مش قادرين، أي نشاط تواصل بيبقى صعب جدًا فعلًا.</div>", "n": 1, "i": 2, "a": "tefl-08-002", "x": "16e9b19e"}, {"t": "learn", "h": "<div class=\"u\">For shy students, and for adult learners who have not been in a classroom for a long time, the first lesson can be particularly intimidating.</div><div class=\"u\">للطلاب الخجولين، وللكبار اللي معدوش في فصل من زمان، أول حصة ممكن تكون مخيفة بشكل خاص.</div>", "n": 1, "i": 3, "a": "tefl-08-003", "x": "a0c488a8"}, {"t": "learn", "h": "<div class=\"u\">And being nervous can obstruct learning.</div><div class=\"u\">والتوتر ممكن يعطّل التعلم.</div>", "n": 1, "i": 4, "a": "tefl-08-004", "x": "e904e908"}, {"t": "learn", "h": "<div class=\"u\">Your job as a teacher is to make them feel at ease. Allow students time to interact on a personal level, so you can get the best out of them academically.</div><div class=\"u\">شغلتك كمدرس إنك تخليهم يحسوا بالارتياح. ادي الطلاب وقت يتفاعلوا على المستوى الشخصي، عشان تطلّع منهم أحسن ما عندهم أكاديميًا.</div>", "n": 1, "i": 5, "a": "tefl-08-005", "x": "7d2645fe"}, {"t": "learn", "h": "<div class=\"u\">In this way you build a rapport with the class, so students get the most out of every lesson.</div><div class=\"u\">بالطريقة دي بتبني ألفة مع الفصل، فالطلاب بيستفيدوا أقصى استفادة من كل حصة.</div>", "n": 1, "i": 6, "a": "tefl-08-006", "x": "8e738a16"}, {"t": "learn", "h": "<div class=\"u\">Icebreakers are not only for the first day of a new course. You can also use them as warmers at the beginning of a lesson, or if you substitute another teacher.</div><div class=\"u\">ألعاب كسر الجليد مش بس لأول يوم في كورس جديد. تقدر كمان تستخدمها كتمهيد في بداية الحصة، أو لو بتحل محل مدرس تاني.</div>", "n": 1, "i": 7, "a": "tefl-08-007", "x": "884a34ff"}, {"t": "learn", "h": "<div class=\"u\">Think about the type of task you are going to teach, and try to use a variety of icebreakers to introduce the topic.</div><div class=\"u\">فكر في نوع المهمة اللي هتدرّسها، وحاول تستخدم تشكيلة من ألعاب كسر الجليد عشان تقدّم الموضوع.</div>", "n": 1, "i": 8, "a": "tefl-08-008", "x": "7f372f62"}, {"t": "section", "h": "Introduce your partner | قدّم زميلك", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">Icebreaker 1: Introduce Your Partner. A classic, great for the first day of a new course, and particularly appropriate for adult learners.</div><div class=\"u\">لعبة كسر الجليد ١: قدّم زميلك. لعبة كلاسيكية، ممتازة لأول يوم في كورس جديد، ومناسبة بشكل خاص للمتعلمين الكبار.</div>", "n": 1, "i": 10, "a": "tefl-08-009", "x": "a07d895f"}, {"t": "learn", "h": "<div class=\"u\">Students work in pairs and get to know their partner, then present the information to the rest of the class.</div><div class=\"u\">الطلاب بيشتغلوا في أزواج ويتعرفوا على زميلهم، وبعدين يقدموا المعلومات لباقي الفصل.</div>", "n": 1, "i": 11, "a": "tefl-08-010", "x": "e82b25ce"}, {"t": "learn", "h": "<div class=\"u\">The questions: Where are you from? Who is your best friend? Are you married? Do you have children?</div><div class=\"u\">الأسئلة: إنت منين؟ مين أعز صاحب ليك؟ إنت متجوز؟ عندك أولاد؟</div>", "n": 1, "i": 12, "a": "tefl-08-011", "x": "5e6e97b4"}, {"t": "learn", "h": "<div class=\"u\">More questions: Why are you on this course? What is your favourite type of food? What do you love and hate about learning?</div><div class=\"u\">أسئلة كمان: ليه إنت في الكورس ده؟ إيه أكلك المفضل؟ إيه اللي بتحبه وبتكرهه في التعلم؟</div>", "n": 1, "i": 13, "a": "tefl-08-012", "x": "86ab8dd0"}, {"t": "learn", "h": "<div class=\"u\">The good thing: students ask slightly more interesting questions, like Who is your best friend, instead of mundane ones like Where do you live or When is your birthday.</div><div class=\"u\">الحاجة الحلوة: الطلاب بيسألوا أسئلة أشوق شوية، زي مين أعز صاحب ليك، بدل الأسئلة المملة زي ساكن فين أو عيد ميلادك امتى.</div>", "n": 1, "i": 14, "a": "tefl-08-013", "x": "0f7f0a4b"}, {"t": "learn", "h": "<div class=\"u\">Encourage students to ask for more information, and even leave a space for them to invent a couple of their own questions.</div><div class=\"u\">شجّع الطلاب إنهم يسألوا عن معلومات أكتر، وسيب لهم حتى مساحة يخترعوا سؤالين من عندهم.</div>", "n": 1, "i": 15, "a": "tefl-08-014", "x": "d7cbfa8b"}, {"t": "learn", "h": "<div class=\"u\">For children, adapt it: they draw a humorous picture of their partner, and you put it on the classroom wall to help everyone remember each other's names.</div><div class=\"u\">للأطفال، ظبطها: بيرسموا رسمة مضحكة لزميلهم، وإنت تعلّقها على حيطة الفصل عشان تساعد الكل يفتكر أسماء بعض.</div>", "n": 1, "i": 16, "a": "tefl-08-015", "x": "92388f7f"}, {"t": "learn", "h": "<div class=\"u\">By introducing a partner instead of themselves, students practise the ever-important third person verb forms: I live, but he lives, with an s.</div><div class=\"u\">لما الطالب بيقدّم زميله بدل نفسه، بيتمرن على صيغ الغائب المهمة جدًا: I live بس he lives، بحرف الـs.</div>", "n": 1, "i": 17, "a": "tefl-08-016", "x": "a10a7309"}, {"t": "learn", "h": "<div class=\"u\">Having to memorise the information to present it makes students really interact with their partner, not just go through the motions and immediately forget the answers.</div><div class=\"u\">إنهم مضطرين يحفظوا المعلومات عشان يقدموها، ده بيخلي الطلاب يتفاعلوا مع زميلهم فعلًا، مش بيمثلوا التفاعل وبعدين ينسوا الإجابات فورًا.</div>", "n": 1, "i": 18, "a": "tefl-08-017", "x": "7a3f07b6"}, {"t": "learn", "h": "<div class=\"u\">This version suits pre-intermediate level and above, but the questions can be adapted to suit any class.</div><div class=\"u\">النسخة دي بتناسب مستوى ما قبل المتوسط وطالع، بس الأسئلة تتظبط على أي فصل.</div>", "n": 1, "i": 19, "a": "tefl-08-018", "x": "16245960"}, {"t": "section", "h": "Teacher Tic Tac Toe | إكس أو بتاع المدرس", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Icebreaker 2: Teacher Tic Tac Toe. The teacher draws a noughts and crosses board and writes a word or a number in each square.</div><div class=\"u\">لعبة كسر الجليد ٢: إكس أو بتاع المدرس. المدرس بيرسم لوحة إكس أو وبيكتب كلمة أو رقم في كل مربع.</div>", "n": 1, "i": 21, "a": "tefl-08-019", "x": "0c537b4c"}, {"t": "learn", "h": "<div class=\"u\">The information in each square is an answer to a question. For example, write 3 in one square as the answer to: How many brothers do you have?</div><div class=\"u\">المعلومة في كل مربع هي إجابة سؤال. مثال: اكتب ٣ في مربع كإجابة على سؤال: عندك كام أخ؟</div>", "n": 1, "i": 22, "a": "tefl-08-020", "x": "f49a9888"}, {"t": "learn", "h": "<div class=\"u\">Students work in two teams. They choose a square and try to guess the question it answers. The team that gets three in a row wins.</div><div class=\"u\">الطلاب بيشتغلوا في فريقين. بيختاروا مربع ويحاولوا يخمنوا السؤال اللي بيجاوب عليه. الفريق اللي يجيب تلاتة على خط واحد يكسب.</div>", "n": 1, "i": 23, "a": "tefl-08-021", "x": "4de72102"}, {"t": "learn", "h": "<div class=\"u\">This is great for the first day when the students already know each other but you are teaching them for the first time. They relax and get to know you in a fun way.</div><div class=\"u\">دي ممتازة لأول يوم لما الطلاب عارفين بعض بس إنت أول مرة تدرّسلهم. بيرتاحوا ويتعرفوا عليك بطريقة ممتعة.</div>", "n": 1, "i": 24, "a": "tefl-08-022", "x": "a0241ff3"}, {"t": "learn", "h": "<div class=\"u\">All the information should answer questions about you, so make it as personal as you like, and appropriate for the level.</div><div class=\"u\">كل المعلومات لازم تكون إجابات عن أسئلة عنك إنت، فخليها شخصية قد ما تحب، ومناسبة للمستوى.</div>", "n": 1, "i": 25, "a": "tefl-08-023", "x": "86441fd4"}, {"t": "learn", "h": "<div class=\"u\">For higher levels, throw in some trick answers. One teacher always wrote gin in a square. Everyone assumed the question was: What is your favourite drink?</div><div class=\"u\">للمستويات العليا، حط إجابات خداعة. مدرس كان دايمًا يكتب كلمة gin في مربع. الكل كان بيفتكر إن السؤال: إيه مشروبك المفضل؟</div>", "n": 1, "i": 26, "a": "tefl-08-024", "x": "09479694"}, {"t": "learn", "h": "<div class=\"u\">The real question was: What was the name of your first pet?</div><div class=\"u\">السؤال الحقيقي كان: إيه كان اسم أول حيوان أليف ربيته؟</div>", "n": 1, "i": 27, "a": "tefl-08-025", "x": "a4644f45"}, {"t": "learn", "h": "<div class=\"u\">Besides being fun and creating friendly rivalry, this game practises word order in questions.</div><div class=\"u\">بالإضافة إنها ممتعة وبتعمل تنافس ودي، اللعبة دي بتتمرن على ترتيب الكلمات في الأسئلة.</div>", "n": 1, "i": 28, "a": "tefl-08-026", "x": "8bef894a"}, {"t": "learn", "h": "<div class=\"u\">For higher levels, only give the point if the team asks a correct, grammatically correct, question.</div><div class=\"u\">للمستويات العليا، ماتديش النقطة إلا لو الفريق سأل سؤال صحيح وسليم قواعديًا.</div>", "n": 1, "i": 29, "a": "tefl-08-027", "x": "52ce09bc"}, {"t": "section", "h": "Find someone who | لاقي حد اللي", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Icebreaker 3: Find Someone Who. Perfect as a warmer for a conversation lesson, or as an icebreaker for higher levels.</div><div class=\"u\">لعبة كسر الجليد ٣: لاقي حد اللي... مثالية كتمهيد لحصة محادثة، أو كلعبة كسر جليد للمستويات العليا.</div>", "n": 1, "i": 31, "a": "tefl-08-028", "x": "9fc32668"}, {"t": "learn", "h": "<div class=\"u\">The aim: find one person who has done each item on the handout, and get some more information about each.</div><div class=\"u\">الهدف: لاقي شخص واحد عمل كل حاجة في ورقة النشاط، واطلع بمعلومات أكتر عن كل واحدة.</div>", "n": 1, "i": 32, "a": "tefl-08-029", "x": "786ba0a6"}, {"t": "learn", "h": "<div class=\"u\">It gets students talking to as many people in the room as possible.</div><div class=\"u\">دي بتخلي الطلاب يتكلموا مع أكبر عدد ممكن من الناس في الأوضة.</div>", "n": 1, "i": 33, "a": "tefl-08-030", "x": "314ec119"}, {"t": "learn", "h": "<div class=\"u\">The questions can fit a particular theme, or be left random for use on the first day.</div><div class=\"u\">الأسئلة ممكن تبقى على موضوع معين، أو تسيبها عشوائية للاستخدام في أول يوم.</div>", "n": 1, "i": 34, "a": "tefl-08-031", "x": "37918119"}, {"t": "learn", "h": "<div class=\"u\">Add competition: the first person to finish wins. Students launch themselves into the task with no time to feel nervous.</div><div class=\"u\">ضيف عنصر المنافسة: أول واحد يخلص يكسب. الطلاب بيندفعوا في المهمة من غير ما يكون عندهم وقت يتوترروا.</div>", "n": 1, "i": 35, "a": "tefl-08-032", "x": "9ec3883d"}, {"t": "learn", "h": "<div class=\"u\">Students also practise question formation, by transforming the statements on the worksheet into appropriate questions.</div><div class=\"u\">الطلاب كمان بيتمرنوا على تكوين الأسئلة، عن طريق تحويل الجمل الخبرية في الورقة لأسئلة مناسبة.</div>", "n": 1, "i": 36, "a": "tefl-08-033", "x": "8ef49372"}, {"t": "learn", "h": "<div class=\"u\">Five example items: has lived abroad, has done an extreme sport, speaks another language, walks to class, was born in August.</div><div class=\"u\">خمس جمل مثال: عاش في الخارج، عمل رياضة خطيرة، بيتكلم لغة تانية، بيمشي للفصل، اتولد في أغسطس.</div>", "n": 1, "i": 37, "a": "tefl-08-034", "x": "8229fff0"}, {"t": "learn", "h": "<div class=\"u\">The follow-ups: for lived abroad, find out where and for how long. For an extreme sport, find out which sport and if they do it often.</div><div class=\"u\">الأسئلة التكميلية: للي عاش في الخارج، اعرف فين ولمدة قد إيه. للرياضة الخطيرة، اعرف أنهي رياضة وهل بيعملها كتير.</div>", "n": 1, "i": 38, "a": "tefl-08-035", "x": "6066991e"}, {"t": "learn", "h": "<div class=\"u\">More follow-ups: for another language, which languages and for how long. For walks to class, how long it takes. For born in August, the exact day and the star sign.</div><div class=\"u\">أسئلة تكميلية كمان: للغة التانية، أنهي لغات ومن قد إيه. للي بيمشي للفصل، بياخد وقت قد إيه. للي اتولد في أغسطس، اليوم بالظبط والبرج.</div>", "n": 1, "i": 39, "a": "tefl-08-036", "x": "bf692753"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">Key terms. Icebreaker: an activity that breaks the ice and helps people relax together. Warmer: a short activity at the start of a lesson to wake everyone up.</div><div class=\"u\">مصطلحات الدرس. Icebreaker: لعبة كسر جليد، نشاط بيكسر الجليد وبيخلي الناس ترتاح مع بعض. Warmer: تمهيد، نشاط قصير في أول الحصة بيصحّي الكل.</div>", "n": 1, "i": 41, "a": "tefl-08-037", "x": "ac45bcf1"}, {"t": "learn", "h": "<div class=\"u\">Intimidating: making you feel nervous or scared. At ease: relaxed and comfortable. Mingle: to move around and talk to many people.</div><div class=\"u\">Intimidating: مخيف، بيخليك متوتر أو خايف. At ease: مرتاح ومستريح. Mingle: يختلط، تتحرك وتتكلم مع ناس كتير.</div>", "n": 1, "i": 42, "a": "tefl-08-038", "x": "fe134f6a"}, {"t": "learn", "h": "<div class=\"u\">Follow-up question: a question that asks for more detail after the first answer. Third person: he, she, it, with verbs ending in s, like he lives.</div><div class=\"u\">Follow-up question: سؤال تكميلي، سؤال بيطلب تفاصيل أكتر بعد أول إجابة. Third person: الغائب، he وshe وit، مع أفعال بتنتهي بـs، زي he lives.</div>", "n": 1, "i": 43, "a": "tefl-08-039", "x": "f12aaec6"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 44}, {"t": "learn", "h": "<div class=\"u\">Summary, part 1. Icebreakers make the class feel comfortable, build rapport, and encourage interaction. Nerves obstruct learning, so ease them early.</div><div class=\"u\">الخلاصة، جزء ١. ألعاب كسر الجليد بتخلي الفصل مرتاح، بتبني ألفة، وبتشجّع التفاعل. التوتر بيعطّل التعلم، فعالجه بدري.</div>", "n": 1, "i": 45, "a": "tefl-08-040", "x": "7c217e55"}, {"t": "learn", "h": "<div class=\"u\">Summary, part 2. Introduce Your Partner: pairs interview each other, then present. Teacher Tic Tac Toe: teams guess the question behind each answer about you.</div><div class=\"u\">الخلاصة، جزء ٢. قدّم زميلك: أزواج بيعملوا مقابلة وبعدين يقدموا. إكس أو بتاع المدرس: الفرق بتخمن السؤال ورا كل إجابة عنك.</div>", "n": 1, "i": 46, "a": "tefl-08-041", "x": "7f0d02a9"}, {"t": "learn", "h": "<div class=\"u\">Summary, part 3. Find Someone Who: mingle, find one person per item, and ask follow-ups. Use icebreakers on day one, as warmers, and on substitute days.</div><div class=\"u\">الخلاصة، جزء ٣. لاقي حد اللي: اختلط بالناس، لاقي شخص لكل جملة، واسأل أسئلة تكميلية. استخدم كسر الجليد أول يوم، وكتمهيد، ولما تحل محل مدرس.</div>", "n": 1, "i": 47, "a": "tefl-08-042", "x": "e23afbaf"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 48}, {"t": "mc", "q": "Which of these is NOT a use of icebreakers?<br>أنهي واحدة في دول مش من استخدامات ألعاب كسر الجليد؟", "opts": ["making the students feel at ease | تخلي الطلاب يحسوا بالارتياح", "building a rapport with the class | بناء ألفة مع الفصل", "encouraging interaction | تشجيع التفاعل", "allowing you to relax and let the students take charge | تخليك تستريح وتسيب الطلاب تمسك المسؤولية"], "ans": 3, "why": "Icebreakers are about the students, not about relaxing the teacher. | كسر الجليد عشان الطلاب، مش عشان راحة المدرس.", "ex": ["No. That is a real use. | غلط: ده استخدام حقيقي.", "No. That is a real use. | غلط: ده استخدام حقيقي.", "No. That is a real use. | غلط: ده استخدام حقيقي.", "Correct. | صح."], "n": 1, "i": 49, "h": ""}, {"t": "mc", "q": "In the Introduce Your Partner icebreaker, what grammar point do students practise?<br>في لعبة قدّم زميلك، الطلاب بيتمرنوا على أنهي نقطة قواعد؟", "opts": ["question formation | تكوين الأسئلة", "third person verb forms | صيغ فعل الغائب"], "ans": 1, "why": "They present their partner: he lives, she works, with the third person s. | بيقدموا زميلهم: he lives وshe works، بالـs بتاع الغائب.", "ex": ["No. That belongs to Find Someone Who. | غلط: دي بتاعة لاقي حد اللي.", "Correct. | صح."], "n": 1, "i": 50, "h": ""}, {"t": "mc", "q": "The best follow-up to: Find someone who has been to China, is:<br>أحسن سؤال تكميلي بعد: لاقي حد سافر الصين، هو:", "opts": ["find out if they like travelling | اعرف هل بيحبوا السفر", "find out when they went and who with | اعرف امتى سافروا ومع مين", "find out if they have been on another holiday this year | اعرف هل راحوا أجازة تانية السنة دي", "find out if they speak an Asian language | اعرف هل بيتكلموا لغة آسيوية"], "ans": 1, "why": "The follow-up digs into the same item: when, and who with. | السؤال التكميلي بيحفر في نفس النقطة: امتى، ومع مين.", "ex": ["No. That leaves the item behind. | غلط: ده بيسيب النقطة.", "Correct. | صح.", "No. That changes the topic. | غلط: ده بيغير الموضوع.", "No. That changes the topic. | غلط: ده بيغير الموضوع."], "n": 1, "i": 51, "h": ""}, {"t": "tf", "q": "The Teacher Tic Tac Toe game should include answers to questions about the teacher.<br>لعبة إكس أو بتاع المدرس لازم يكون فيها إجابات أسئلة عن المدرس.", "ans": true, "why": "It is how new students get to know you. | دي طريقة تعريف الطلاب الجداد بيك.", "ex": ["Correct. | صح.", "Wrong. The answers are all about the teacher. | غلط: الإجابات كلها عن المدرس."], "n": 1, "i": 52, "h": ""}, {"t": "tf", "q": "Being nervous can obstruct learning.<br>التوتر ممكن يعطّل التعلم.", "ans": true, "why": "That is why easing nerves in lesson one matters. | عشان كده تهدية التوتر في أول حصة مهمة.", "ex": ["Correct. | صح.", "Wrong. Nerves really do block learning. | غلط: التوتر فعلًا بيعطل التعلم."], "n": 1, "i": 53, "h": ""}, {"t": "tf", "q": "Icebreakers are only useful on the first day of a new course.<br>ألعاب كسر الجليد مفيدة بس في أول يوم في كورس جديد.", "ans": false, "why": "Also as warmers at the start of lessons, and when you substitute another teacher. | وكمان كتمهيد في أول الحصص، ولما تحل محل مدرس تاني.", "ex": ["Wrong. They also work as warmers and on substitute days. | غلط: بتنفع كمان كتمهيد وفي أيام الحلول محل مدرس.", "Correct. | صح."], "n": 1, "i": 54, "h": ""}, {"t": "mc", "q": "In Teacher Tic Tac Toe, a team wins by:<br>في إكس أو بتاع المدرس، الفريق يكسب لما:", "opts": ["guessing three questions in a row on the board | يخمن تلاتة أسئلة على خط واحد في اللوحة", "answering the most questions | يجاوب على أكتر أسئلة", "finishing first | يخلص الأول"], "ans": 0, "why": "Three in a row, like noughts and crosses. | تلاتة على خط واحد، زي إكس أو بالظبط.", "ex": ["Correct. | صح.", "No. It is about three in a row. | غلط: الموضوع تلاتة على خط واحد.", "No. Speed is not the win condition here. | غلط: السرعة مش شرط الكسب هنا."], "n": 1, "i": 55, "h": ""}, {"t": "tf", "q": "In Find Someone Who, students transform the statements on the worksheet into questions.<br>في لاقي حد اللي، الطلاب بيحولوا الجمل الخبرية في الورقة لأسئلة.", "ans": true, "why": "That is how they practise question formation. | كده بيتمرنوا على تكوين الأسئلة.", "ex": ["Correct. | صح.", "Wrong. Turning statements into questions is the practice. | غلط: تحويل الجمل لأسئلة هو التمرين."], "n": 1, "i": 56, "h": ""}, {"t": "mc", "q": "For children, Introduce Your Partner can be adapted by:<br>للأطفال، لعبة قدّم زميلك ممكن تتظبط عن طريق إنهم:", "opts": ["drawing a humorous picture of their partner for the classroom wall | يرسموا رسمة مضحكة لزميلهم تتعلق على حيطة الفصل", "writing a long essay about their partner | يكتبوا مقال طويل عن زميلهم", "skipping the presentation | يلغوا التقديم"], "ans": 0, "why": "The drawings on the wall help everyone remember each other's names. | الرسومات على الحيطة بتساعد الكل يفتكر أسماء بعض.", "ex": ["Correct. | صح.", "No. An essay does not fit children. | غلط: المقال مش مناسب للأطفال.", "No. The presentation is the point. | غلط: التقديم هو الهدف."], "n": 1, "i": 57, "h": ""}, {"t": "tf", "q": "For higher levels in Tic Tac Toe, you can give the point only for a grammatically correct question.<br>للمستويات العليا في إكس أو، تقدر ماتديش النقطة إلا لسؤال سليم قواعديًا.", "ans": true, "why": "That raises the challenge and practises word order. | ده بيزود التحدي وبيتمرن على ترتيب الكلمات.", "ex": ["Correct. | صح.", "Wrong. That is exactly the higher-level option. | غلط: دي بالظبط نسخة المستويات العليا."], "n": 1, "i": 58, "h": ""}, {"t": "recall", "q": "Name the three icebreakers from this unit, and when each one works best.<br>اذكر ألعاب كسر الجليد التلاتة في الوحدة دي، وإمتى كل واحدة بتناسب أكتر.", "a": "Introduce Your Partner: day one of a new course, especially adults. Teacher Tic Tac Toe: day one when students know each other but you are new. Find Someone Who: a warmer for conversation lessons or higher levels.<br>قدّم زميلك: أول يوم كورس جديد، خصوصًا للكبار. إكس أو بتاع المدرس: أول يوم لما الطلاب عارفين بعض وإنت جديد عليهم. لاقي حد اللي: تمهيد لحصص المحادثة أو المستويات العليا.", "n": 1, "i": 59, "h": ""}, {"t": "recall", "q": "Give four of the Introduce Your Partner questions.<br>اذكر ٤ من أسئلة لعبة قدّم زميلك.", "a": "Any 4: Where are you from? Who is your best friend? Are you married? Do you have children? Why are you on this course? What is your favourite type of food? What do you love and hate about learning?<br>أي ٤: إنت منين؟ مين أعز صاحب ليك؟ متجوز؟ عندك أولاد؟ ليه في الكورس ده؟ أكلك المفضل إيه؟ بتحب وبتكره إيه في التعلم؟", "n": 1, "i": 60, "h": ""}, {"t": "write", "q": "Explain why icebreakers matter especially for shy students and adults returning to class (3-4 sentences).<br>اشرح ليه ألعاب كسر الجليد مهمة خصوصًا للطلاب الخجولين والكبار الراجعين للفصل (٣-٤ جمل).", "key": "tefl-08:1", "a": "Shy students, and adults who have not been in a classroom for a long time, can find the first lesson intimidating. Nervousness obstructs learning, so a teacher must ease it early. Icebreakers let students interact on a personal level and feel comfortable with each other and with you. Once the class is relaxed, communication activities work and students get the most out of every lesson.<br>الطلاب الخجولين، والكبار اللي معدوش في فصل من زمان، ممكن أول حصة تخوفهم. التوتر بيعطّل التعلم، فالمدرس لازم يهديه بدري. ألعاب كسر الجليد بتخلي الطلاب يتفاعلوا على المستوى الشخصي ويحسوا بالراحة مع بعض ومعاك. لما الفصل يرتاح، أنشطة التواصل بتشتغل والطلاب بيستفيدوا أقصى استفادة من كل حصة.", "n": 1, "i": 61, "h": ""}, {"t": "write", "q": "Explain how Teacher Tic Tac Toe works (3-4 sentences).<br>اشرح إزاي لعبة إكس أو بتاع المدرس بتشتغل (٣-٤ جمل).", "key": "tefl-08:2", "a": "The teacher draws a noughts and crosses board and writes a word or number in each square. Each square is an answer to a question about the teacher, like the number of brothers or the name of a first pet. Students play in two teams: they choose a square and guess the question it answers. The first team to get three in a row wins, and higher levels can be required to ask grammatically correct questions.<br>المدرس بيرسم لوحة إكس أو وبيكتب كلمة أو رقم في كل مربع. كل مربع هو إجابة سؤال عن المدرس، زي عدد الإخوة أو اسم أول حيوان أليف. الطلاب بيلعبوا في فريقين: بيختاروا مربع ويخمنوا السؤال اللي بيجاوب عليه. أول فريق يجيب تلاتة على خط واحد يكسب، والمستويات العليا ممكن يتشترط عليهم سؤال سليم قواعديًا.", "n": 1, "i": 62, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: student feedback. How to hear what your students really think, and use it to grow as a teacher.</div><div class=\"u\">الدرس الجاي: تقييم الطلاب. إزاي تسمع اللي طلابك بيفكروا فيه فعلًا، وتستخدمه عشان تكبر كمدرس.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 63}];</script>
