<h1>عالم تيفل ٥٢: الكلام المباشر والمنقول</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٥٢</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-52";window.STEPS=[{"t": "section", "h": "Direct and reported speech | الكلام المباشر والمنقول", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit five: direct and reported, or indirect, speech. The exact words that someone says are called direct speech.</div><div class=\"u\">الوحدة الخامسة: الكلام المباشر والمنقول، أو غير المباشر. الكلام اللي حد قاله بالظبط بنسمّيه الكلام المباشر.</div>", "n": 1, "i": 1, "a": "tefl-52-001", "x": "50e4c57f"}, {"t": "learn", "h": "<div class=\"u\">Quotation marks, also called inverted commas, are used to highlight direct speech. Dad said: it is time to go. I want to be an astronaut, Lucy said. Where are you going?</div><div class=\"u\">علامات التنصيص، اللي بتتسمّى كمان الفواصل المقلوبة، بتستخدم عشان تظهّر الكلام المباشر. بابا قال: دي ساعة المشي. أنا عايز أبقى رائد فضاء، لوسي قالت. إنت رايح فين؟</div>", "n": 1, "i": 2, "a": "tefl-52-002", "x": "77c49124"}, {"t": "learn", "h": "<div class=\"u\">Reported speech, also called indirect speech, is when you report what someone says or tells you without using their exact words.</div><div class=\"u\">الكلام المنقول، اللي بنسمّيه كمان غير المباشر، هو لما تنقل اللي حد قاله من غير ما تستخدم كلامه بالظبط.</div>", "n": 1, "i": 3, "a": "tefl-52-003", "x": "b3870bde"}, {"t": "learn", "h": "<div class=\"u\">We often want to tell someone what another person has said to us. In most cases, we do not report the exact words we hear. Instead, we make some changes so that it sounds more natural.</div><div class=\"u\">كتير بنحب نقول لحد اللي حد تاني قالهولنا. في أغلب الحالات، مابننقلش الكلام زي ما سمعناه بالظبط. بدل كده، بنعمل شوية تغييرات عشان يطلع طبيعي أكتر.</div>", "n": 1, "i": 4, "a": "tefl-52-004", "x": "d7eea03f"}, {"t": "learn", "h": "<div class=\"u\">Examples. John said he was ready. Dad said it was dinner time. James said he could not find his keys.</div><div class=\"u\">أمثلة. جون قال إنه كان جاهز. بابا قال إنها ساعة العشا. جيمس قال إنه مش لاقي مفاتيحه.</div>", "n": 1, "i": 5, "a": "tefl-52-005", "x": "a1459b36"}, {"t": "learn", "h": "<div class=\"u\">Ben said Bill was annoying him. Lucy said she had not had time to do it. Fred told me he was going to tell me a secret.</div><div class=\"u\">بن قال إن بيل كان بيضايقه. لوسي قالت إنها مكانش عندها وقت تعملها. فريد قالي إنه كان هيقلّي سر.</div>", "n": 1, "i": 6, "a": "tefl-52-006", "x": "5ca2768c"}, {"t": "section", "h": "Reporting verbs: say, tell and others | أفعال النقل", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">There are several differences between direct and reported speech. We do not use quotation marks in reported speech.</div><div class=\"u\">في شوية فروق بين الكلام المباشر والمنقول. مابنستخدمش علامات التنصيص في الكلام المنقول.</div>", "n": 1, "i": 8, "a": "tefl-52-007", "x": "0e52425f"}, {"t": "learn", "h": "<div class=\"u\">We introduce what someone says with a reporting verb, like said or told. We often change the tense of the verb. We change the pronouns and determiners: me becomes her, this becomes that.</div><div class=\"u\">بنقدّم اللي حد قاله بفعل نقل، زي قال أو قال لـ. كتير بنغيّر زمن الفعل. وبنغيّر الضمائر وأدوات التحديد: ليّ بتبقى لها، ده بتبقى دا.</div>", "n": 1, "i": 9, "a": "tefl-52-008", "x": "d559a952"}, {"t": "learn", "h": "<div class=\"u\">Note that in indirect speech people often leave out the conjunction that: John said he was ready.</div><div class=\"u\">لاحظ إن في الكلام غير المباشر الناس كتير بتسيب حرف الربط إن: جون قال إنه جاهز، أو بس: جون قال هو جاهز.</div>", "n": 1, "i": 10, "a": "tefl-52-009", "x": "735d50fe"}, {"t": "learn", "h": "<div class=\"u\">The most common reporting verbs are say and tell. Say is never followed by an indirect object, like her, us, them or my brother: John said he was ready, never John said me he was ready.</div><div class=\"u\">أشهر أفعال النقل هما سيي وتل. السيي أبدًا مابيتبعهاش مفعول غير مباشر، زي لها أو لنا أو لأخويا: جون قال إنه كان جاهز، أبدًا مش جون قال لي إنه كان جاهز.</div>", "n": 1, "i": 11, "a": "tefl-52-010", "x": "d431b6c9"}, {"t": "learn", "h": "<div class=\"u\">We follow say with a that clause, or a clause beginning with a question word: Marie did not say who was there.</div><div class=\"u\">بنتبع السيي بجملة فيها ذات، أو جملة بتبدأ بأداة استفهام: ماري ماقالتش مين كان هناك.</div>", "n": 1, "i": 12, "a": "tefl-52-011", "x": "b6cf06cc"}, {"t": "learn", "h": "<div class=\"u\">We must use an indirect object after tell: John told me he was ready. Never just John told he was ready.</div><div class=\"u\">لازم نستخدم مفعول غير مباشر بعد التل: جون قال لي إنه كان جاهز. أبدًا مش جون قال إنه كان جاهز لوحده.</div>", "n": 1, "i": 13, "a": "tefl-52-012", "x": "da51c055"}, {"t": "learn", "h": "<div class=\"u\">The tell plus indirect object structure is followed by different clause types: John told me that he was ready. My friend told me a secret. My boss told me to stay.</div><div class=\"u\">تركيبة التل زائد المفعول غير المباشر بيتبعها أنواع جمل مختلفة: جون قال لي إنه كان جاهز. صاحبي قالي سر. مديري قالي أفضل.</div>", "n": 1, "i": 14, "a": "tefl-52-013", "x": "4781c7fe"}, {"t": "learn", "h": "<div class=\"u\">The interviewer told me where to sit. Marie told me where she was going.</div><div class=\"u\">اللي بيعمل المقابلة قالي أقعد فين. ماري قالتلي هي رايحة فين.</div>", "n": 1, "i": 15, "a": "tefl-52-014", "x": "413529e2"}, {"t": "learn", "h": "<div class=\"u\">We also use other reporting verbs, depending on context, function, attitude, opinion and interpretation, and to avoid repetition in a longer piece.</div><div class=\"u\">بنستخدم كمان أفعال نقل تانية، حسب السياق والوظيفة والموقف والرأي والتفسير، وعشان نتجنّب التكرار في قطعة طويلة.</div>", "n": 1, "i": 16, "a": "tefl-52-015", "x": "bb3cef89"}, {"t": "learn", "h": "<div class=\"u\">He asked if we had seen the accident. She added that it would be the best course. She explained why the deduction had been made. He replied that it was not down to him.</div><div class=\"u\">هو سأل لو كنا شفنا الحادثة. هي ضافت إن دي هتبقى أحسن خطة. هي شرحت ليه الخصم اتعمل. هو ردّ إن ده مش شغله.</div>", "n": 1, "i": 17, "a": "tefl-52-016", "x": "5c726b4f"}, {"t": "learn", "h": "<div class=\"u\">She mentioned that it could be a solution. He claimed that he had never been in Madrid. He alleged that it was his brother who had been there.</div><div class=\"u\">هي ذكرت إن ده ممكن يبقى حل. هو ادّعى إنه أبدًا ماراحش مدريد. هو زعم إن أخوه هو اللي كان هناك.</div>", "n": 1, "i": 18, "a": "tefl-52-017", "x": "7cfa2b8a"}, {"t": "learn", "h": "<div class=\"u\">The customer complained that the goods were faulty. Our lawyer warned us the contract might be invalid.</div><div class=\"u\">الزبون اشتكى إن البضاعة فيها عيب. المحامي بتاعنا حذّرنا إن العقد ممكن يبقى باطل.</div>", "n": 1, "i": 19, "a": "tefl-52-018", "x": "6c452652"}, {"t": "section", "h": "When the tense stays the same | لما الزمن مابيتغيّرش", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">Sometimes we do not change the tense in reported speech. First: when we report a statement that is still true.</div><div class=\"u\">أحيانًا مابنغيّرش الزمن في الكلام المنقول. أولًا: لما بننقل تصريح لسه صح.</div>", "n": 1, "i": 21, "a": "tefl-52-019", "x": "fd452362"}, {"t": "learn", "h": "<div class=\"u\">John said: my foot hurts, becomes John said his foot hurts. Marie said she lives in Miami. He added that Madrid is a wonderful place to visit.</div><div class=\"u\">جون قال: رجلي بتوجعني، بتبقى جون قال إن رجله بتوجعه. ماري قالت إنها عايشة في ميامي. هو ضاف إن مدريد مكان حلو للزيارة.</div>", "n": 1, "i": 22, "a": "tefl-52-020", "x": "04c37056"}, {"t": "learn", "h": "<div class=\"u\">Second: when we wish to convey exactly what a person said, perhaps where the exact words are very important, in a legal case, or for dramatic effect.</div><div class=\"u\">تانيًا: لما بنحب نوصّل بالظبط اللي الشخص قاله، يمكن لما الكلام بالظبط مهم جدًا، في قضية قانونية، أو للتأثير الدرامي.</div>", "n": 1, "i": 23, "a": "tefl-52-021", "x": "0414a367"}, {"t": "learn", "h": "<div class=\"u\">He said: watch your back. He told me: pull up your socks or you will be fired. Then she claimed: you have been cheating customers for years.</div><div class=\"u\">هو قال: خلي بالك من ضهرك. هو قالي: شد حيلك ولا هتتفصل. وبعدين هي قالت: إنت بتغش الزباين من سنين.</div>", "n": 1, "i": 24, "a": "tefl-52-022", "x": "a87212a9"}, {"t": "section", "h": "Reported questions | الأسئلة المنقولة", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">Reported questions. The verb ask is usually used to report questions. Mike asked where his wallet was. Mum asked if we had finished our dinner.</div><div class=\"u\">الأسئلة المنقولة. الفعل أسك هو اللي عادة بنستخدمه لنقل الأسئلة. مايك سأل محفظته فين. ماما سألت لو خلّصنا أكلنا.</div>", "n": 1, "i": 26, "a": "tefl-52-023", "x": "7913ead7"}, {"t": "learn", "h": "<div class=\"u\">Once we report the question, it is no longer a question, so we change the grammar to a normal positive sentence: the subject comes before the verb or helping verb.</div><div class=\"u\">أول ما ننقل السؤال، مابقاش سؤال، فبنغيّر القواعد لجملة عادية مثبتة: الفاعل بييجي قبل الفعل أو الفعل المساعد.</div>", "n": 1, "i": 27, "a": "tefl-52-024", "x": "0a344099"}, {"t": "learn", "h": "<div class=\"u\">Remember: the subject comes after the helping verb when you ask a question: have you finished? But in reported speech: she asked if we had finished.</div><div class=\"u\">افتكر: الفاعل بييجي بعد الفعل المساعد لما بتسأل سؤال: هل إنت خلّصت؟ بس في الكلام المنقول: هي سألت لو إحنا خلّصنا.</div>", "n": 1, "i": 28, "a": "tefl-52-025", "x": "4a1a30d0"}, {"t": "learn", "h": "<div class=\"u\">Examples. Where are they heading? I asked where they were heading. Can Lucy count to ten? I asked if Lucy could count to ten.</div><div class=\"u\">أمثلة. هما رايحين فين؟ أنا سألت هما رايحين فين. لوسي تعرف تعد لعشرة؟ أنا سألت لو لوسي تعرف تعد لعشرة.</div>", "n": 1, "i": 29, "a": "tefl-52-026", "x": "8c8f47c9"}, {"t": "learn", "h": "<div class=\"u\">Did your teacher give the drawing back? I asked if the teacher had given the drawing back. Has she gone to town? I asked if she had gone to town.</div><div class=\"u\">المدرس رجّعلك الرسمة؟ أنا سألت لو المدرس رجّع الرسمة. هي راحت البلد؟ أنا سألت لو هي راحت البلد.</div>", "n": 1, "i": 30, "a": "tefl-52-027", "x": "09a50d4c"}, {"t": "learn", "h": "<div class=\"u\">When we report questions with a yes or no answer, we use if after the reporting verb. Sometimes we use whether instead: I asked whether she had gone to town.</div><div class=\"u\">لما بننقل أسئلة إجابتها أيوه أو لأ، بنستخدم إف بعد فعل النقل. أحيانًا بنستخدم ويذر بدلها: أنا سألت لو هي راحت البلد.</div>", "n": 1, "i": 31, "a": "tefl-52-028", "x": "a8e855ec"}, {"t": "learn", "h": "<div class=\"u\">The reported question structure is much the same as reported statements. The tense changes are the same, and we keep the question word.</div><div class=\"u\">تركيبة السؤال المنقول زي تركيبة التصريحات المنقولة بالظبط تقريبًا. تغييرات الزمن هي هي، وبنحتفظ بأداة الاستفهام.</div>", "n": 1, "i": 32, "a": "tefl-52-029", "x": "993eb639"}, {"t": "section", "h": "Reported requests and commands | الطلبات والأوامر المنقولة", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">Reported requests. When someone requests you to do something, often a polite request, we use this form: ask, plus the person, plus to, plus the infinitive.</div><div class=\"u\">الطلبات المنقولة. لما حد يطلب منك تعمل حاجة، غالبًا طلب مؤدب، بنستخدم الصيغة دي: أسك، زائد الشخص، زائد تو، زائد الفعل في المصدر.</div>", "n": 1, "i": 34, "a": "tefl-52-030", "x": "5d5af36a"}, {"t": "learn", "h": "<div class=\"u\">Please help me with this, becomes he asked me to help. Could you give me a hand? He asked me to help. Would you mind giving me a hand? He asked me to help.</div><div class=\"u\">ساعدني في ده لو سمحت، بتبقى هو طلب مني أساعده. ممكن تدّيني يد؟ هو طلب مني أساعده. عندك مانع تدّيني يد؟ هو طلب مني أساعده.</div>", "n": 1, "i": 35, "a": "tefl-52-031", "x": "1e8d41e8"}, {"t": "learn", "h": "<div class=\"u\">Could you pass the magazine, please? She asked me to pass the magazine. Please do not shout. She asked me not to shout: insert not in a negative request.</div><div class=\"u\">ممكن تناولني المجلة لو سمحت؟ هي طلبت مني أناولها المجلة. متصوّتش لو سمحت. هي طلبت مني متصوّتش: بنحط النفي في الطلب المنفي.</div>", "n": 1, "i": 36, "a": "tefl-52-032", "x": "83b2f949"}, {"t": "learn", "h": "<div class=\"u\">Reported commands and orders. When someone gives an order or a command and instructs you very directly, we use verbs like tell, order and warn.</div><div class=\"u\">الأوامر المنقولة. لما حد يدّي أمر وبيوجّهك مباشرة جدًا، بنستخدم أفعال زي تل وأوردر ووورن.</div>", "n": 1, "i": 37, "a": "tefl-52-033", "x": "2b97608f"}, {"t": "learn", "h": "<div class=\"u\">The construction is like reported requests: to plus verb, or not to plus verb. The teacher shouted: be quiet! The teacher ordered us to be quiet.</div><div class=\"u\">التركيبة زي الطلبات المنقولة: تو زائد الفعل، أو نوت تو زائد الفعل. المدرس صرخ: اهدأوا! المدرس أمرنا نهدى.</div>", "n": 1, "i": 38, "a": "tefl-52-034", "x": "c6d5597c"}, {"t": "learn", "h": "<div class=\"u\">Go into your groups, children, said Mr Brown. Mr Brown told us to go into our groups. Carlos told Alejandro: do not be late ever again. Carlos warned Alejandro not to be late again.</div><div class=\"u\">ادخلوا مجموعاتكم يا ولاد، قال مستر براون. مستر براون قالنا ندخل مجموعاتنا. كارلوس قال لأليخاندرو: متتأخرش تاني أبدًا. كارلوس حذّر أليخاندرو إنه ميتأخرش تاني.</div>", "n": 1, "i": 39, "a": "tefl-52-035", "x": "7d03d7a8"}, {"t": "section", "h": "Tense changes | تغييرات الزمن", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">Typical tense changes. A few of these are not set in stone; some depend on when we heard the direct speech and when we report it. But here is a solid guide.</div><div class=\"u\">تغييرات الزمن المعتادة. شوية فيهم مش محفوظين؛ بعضها بيعتمد على امتى سمعنا الكلام المباشر وامتى بننقله. بس دي قاعدة ثابتة مفيدة.</div>", "n": 1, "i": 41, "a": "tefl-52-036", "x": "c29c796a"}, {"t": "learn", "h": "<div class=\"u\">Present simple becomes past simple: I adore Brad Pitt, she said she adored Brad Pitt.</div><div class=\"u\">المضارع البسيط بيبقى ماضي بسيط: أنا بعشق براد بيت، هي قالت إنها بتعشق براد بيت.</div>", "n": 1, "i": 42, "a": "tefl-52-037", "x": "b5aee982"}, {"t": "learn", "h": "<div class=\"u\">Present continuous becomes past continuous: I am living in Barcelona, she said she was living in Barcelona.</div><div class=\"u\">المضارع المستمر بيبقى ماضي مستمر: أنا عايش في برشلونة، هي قالت إنها عايشة في برشلونة.</div>", "n": 1, "i": 43, "a": "tefl-52-038", "x": "11579c71"}, {"t": "learn", "h": "<div class=\"u\">Past simple can stay the same or become past perfect: I broke my computer, he said he broke his computer, or he said he had broken his computer.</div><div class=\"u\">الماضي البسيط ممكن يفضل زي ما هو أو يبقى ماضي تام: أنا كسرت الكمبيوتر، هو قال إنه كسر الكمبيوتر، أو قال إنه كان كسر الكمبيوتر.</div>", "n": 1, "i": 44, "a": "tefl-52-039", "x": "3d24acbc"}, {"t": "learn", "h": "<div class=\"u\">Past continuous becomes past perfect continuous: I was eating a burger, he said he had been eating a burger.</div><div class=\"u\">الماضي المستمر بيبقى ماضي تام مستمر: أنا كنت باكل برجر، هو قال إنه كان بياكل برجر.</div>", "n": 1, "i": 45, "a": "tefl-52-040", "x": "1a7fb07e"}, {"t": "learn", "h": "<div class=\"u\">Present perfect becomes past perfect: I have not seen the movie, she said she had not seen the movie.</div><div class=\"u\">المضارع التام بيبقى ماضي تام: أنا ماشفتش الفيلم، هي قالت إنها ماشافتش الفيلم.</div>", "n": 1, "i": 46, "a": "tefl-52-041", "x": "2d58f3e6"}, {"t": "learn", "h": "<div class=\"u\">Past perfect does not change: I had scored 200 goals, he said he had scored 200 goals.</div><div class=\"u\">الماضي التام مابيتغيّرش: أنا كنت سجلت ٢٠٠ جون، هو قال إنه كان سجّل ٢٠٠ جون.</div>", "n": 1, "i": 47, "a": "tefl-52-042", "x": "627a9d1b"}, {"t": "learn", "h": "<div class=\"u\">Auxiliary verbs in the present change to the past: we are busy and cannot come, she said they were busy and could not come. I am coming, he said he was coming.</div><div class=\"u\">الأفعال المساعدة في المضارع بتتحوّل للماضي: إحنا مشغولين ومش هنقدر نيجي، هي قالت إنهم كانوا مشغولين ومش هيقدروا ييجوا. أنا جاي، هو قال إنه كان جاي.</div>", "n": 1, "i": 48, "a": "tefl-52-043", "x": "b10adf8f"}, {"t": "learn", "h": "<div class=\"u\">Auxiliary verbs in the past change to the past perfect: I was searching for Juan, he said he had been searching for Juan.</div><div class=\"u\">الأفعال المساعدة في الماضي بتتحوّل للماضي التام: أنا كنت بدور على خوان، هو قال إنه كان بيدور على خوان.</div>", "n": 1, "i": 49, "a": "tefl-52-044", "x": "1c9af9bd"}, {"t": "learn", "h": "<div class=\"u\">Future forms change from present to past: I will see you on Saturday, he said he would see me on Saturday. I am going to win tomorrow, he said he was going to win the next day.</div><div class=\"u\">أشكال المستقبل بتتحوّل من مضارع لماضي: هشوفك يوم السبت، هو قال إنه هيشوفني يوم السبت. أنا هكسب بكرة، هو قال إنه كان هيكسب اليوم التالي.</div>", "n": 1, "i": 50, "a": "tefl-52-045", "x": "9ef645b0"}, {"t": "learn", "h": "<div class=\"u\">The modal verbs can, may and must often change: I can hear them, she said she could hear them. We may enter the competition, she said they might enter.</div><div class=\"u\">الأفعال الناقصة كان وماي ومست غالبًا بتتغيّر: أنا سامعهم، هي قالت إنها سامعاهم. ممكن ندخل المسابقة، هي قالت إنهم ممكن يدخلوا.</div>", "n": 1, "i": 51, "a": "tefl-52-046", "x": "ed36d286"}, {"t": "learn", "h": "<div class=\"u\">I must stop, she said she had to stop.</div><div class=\"u\">لازم أوقف، هي قالت إنها لازم توقف.</div>", "n": 1, "i": 52, "a": "tefl-52-047", "x": "5bc2cb32"}, {"t": "section", "h": "No-change forms, pronouns and time words | اللي مابيتغيّرش والضمائر وكلمات الوقت", "n": 1, "i": 53}, {"t": "learn", "h": "<div class=\"u\">Some forms do not need to change. Verbs already in the past perfect stay the same: I had eaten earlier, he said he had eaten earlier.</div><div class=\"u\">بعض الأشكال مش محتاجة تتغيّر. الأفعال اللي أصلًا في الماضي التام بتفضل زي ما هي: أنا كنت أكلت بدري، هو قال إنه كان أكل بدري.</div>", "n": 1, "i": 54, "a": "tefl-52-048", "x": "0080bc0b"}, {"t": "learn", "h": "<div class=\"u\">And these modal forms stay the same: could, might, ought, should, would.</div><div class=\"u\">والأشكال الناقصة دي بتفضل زي ما هي: كود ومايت وأوت وشود ووود.</div>", "n": 1, "i": 55, "a": "tefl-52-049", "x": "cda7a265"}, {"t": "learn", "h": "<div class=\"u\">You could win the prize, she said I could win the prize. You might be successful, she said I might be successful. You ought to win, she said we ought to win.</div><div class=\"u\">إنت ممكن تكسب الجايزة، هي قالت إني ممكن أكسب الجايزة. إنت ممكن تنجح، هي قالت إني ممكن أنجح. إنت المفروض تكسب، هي قالت إننا المفروض نكسب.</div>", "n": 1, "i": 56, "a": "tefl-52-050", "x": "e4def1b4"}, {"t": "learn", "h": "<div class=\"u\">You should eat more, she said I should eat more. I would enjoy that, he said he would enjoy that.</div><div class=\"u\">إنت المفروض تاكل أكتر، هي قالت إني المفروض آكل أكتر. أنا هستمتع بده، هو قال إنه هيستمتع بده.</div>", "n": 1, "i": 57, "a": "tefl-52-051", "x": "efaf5114"}, {"t": "learn", "h": "<div class=\"u\">Pronouns and possessive adjectives also change: I becomes he or she, me becomes him or her, my becomes his or her, we becomes they.</div><div class=\"u\">الضمائر وصفات الملكية كمان بتتغيّر: آي بتبقى هي أو شي، مي بتبقى هيم أو هير، ماي بتبقى هيز أو هير، وي بتبقى ذيي.</div>", "n": 1, "i": 58, "a": "tefl-52-052", "x": "52ff8815"}, {"t": "learn", "h": "<div class=\"u\">We also often use names instead of pronouns when we report, to make sure there is no confusion about whom we are talking about: she said that she could not stand Rosa.</div><div class=\"u\">كمان كتير بنستخدم الأسماء بدل الضمائر لما بننقل، عشان نتأكد إن مفيش لخبطة في مين بنتكلم عنه: هي قالت إنها مش طايقه روزا.</div>", "n": 1, "i": 59, "a": "tefl-52-053", "x": "92deb2a3"}, {"t": "learn", "h": "<div class=\"u\">Time expressions change too. Now becomes then or at that time. Today becomes that day. Yesterday becomes the day before. Last night becomes the night before.</div><div class=\"u\">تعبيرات الوقت كمان بتتغيّر. دلوقتي بتبقى ساعتها. النهارده بتبقى اليوم ده. إمبارح بتبقى اليوم اللي قبله. إمبارح بالليل بتبقى الليلة اللي قبلها.</div>", "n": 1, "i": 60, "a": "tefl-52-054", "x": "01f0ac37"}, {"t": "learn", "h": "<div class=\"u\">Last week becomes the week before or the previous week. Tomorrow becomes the next day. This week becomes that week. This month becomes that month.</div><div class=\"u\">الأسبوع اللي فات بتبقى الأسبوع اللي قبله. بكرة بتبقى اليوم التالي. الأسبوع ده بتبقى الأسبوع ده. الشهر ده بتبقى الشهر ده.</div>", "n": 1, "i": 61, "a": "tefl-52-055", "x": "309e57fd"}, {"t": "learn", "h": "<div class=\"u\">Here becomes there. This becomes that. These becomes those. Bring becomes take. Come becomes go.</div><div class=\"u\">هنا بتبقى هناك. ده بتبقى دا. دول بتبقى دول بتوع هناك. هات بتبقى ودّي. تعالى بتبقى روح.</div>", "n": 1, "i": 62, "a": "tefl-52-056", "x": "27739ab0"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 63}, {"t": "learn", "h": "<div class=\"u\">direct speech: the exact words someone says, in quotation marks.</div><div class=\"u\">الكلام المباشر: كلام الشخص بالظبط، بين علامتي تنصيص.</div>", "n": 1, "i": 64, "a": "tefl-52-057", "x": "c71995f9"}, {"t": "learn", "h": "<div class=\"u\">reported speech: telling what someone said without their exact words.</div><div class=\"u\">الكلام المنقول: نقل اللي حد قاله من غير كلامه بالظبط.</div>", "n": 1, "i": 65, "a": "tefl-52-058", "x": "bcf30137"}, {"t": "learn", "h": "<div class=\"u\">reporting verb: the verb that introduces reported speech, like say or tell.</div><div class=\"u\">فعل النقل: الفعل اللي بيقدّم الكلام المنقول، زي سيي أو تل.</div>", "n": 1, "i": 66, "a": "tefl-52-059", "x": "e0eb9713"}, {"t": "learn", "h": "<div class=\"u\">indirect object: the person spoken to, required after tell.</div><div class=\"u\">المفعول غير المباشر: الشخص المتكلّم معاه، لازم ييجي بعد التل.</div>", "n": 1, "i": 67, "a": "tefl-52-060", "x": "ad053000"}, {"t": "learn", "h": "<div class=\"u\">that clause: a clause starting with that, often dropped in reporting.</div><div class=\"u\">جملة الذات: جملة بتبدأ بـ ذات، وكتير بتتشال في النقل.</div>", "n": 1, "i": 68, "a": "tefl-52-061", "x": "6a6f8213"}, {"t": "learn", "h": "<div class=\"u\">reported question: a question turned into a normal sentence, with if or whether for yes/no.</div><div class=\"u\">السؤال المنقول: سؤال بيتحوّل لجملة عادية، مع إف أو ويذر للأيوه/لأ.</div>", "n": 1, "i": 69, "a": "tefl-52-062", "x": "b4b1e082"}, {"t": "learn", "h": "<div class=\"u\">reported request: ask plus person plus to plus infinitive.</div><div class=\"u\">الطلب المنقول: أسك زائد الشخص زائد تو زائد المصدر.</div>", "n": 1, "i": 70, "a": "tefl-52-063", "x": "d3bb8aea"}, {"t": "learn", "h": "<div class=\"u\">reported command: tell, order or warn plus person plus to plus verb.</div><div class=\"u\">الأمر المنقول: تل أو أوردر أو وورن زائد الشخص زائد تو زائد الفعل.</div>", "n": 1, "i": 71, "a": "tefl-52-064", "x": "f544c22d"}, {"t": "learn", "h": "<div class=\"u\">backshift: moving tenses one step into the past when reporting.</div><div class=\"u\">الرجوع بالزمن: تحريك الأزمنة خطوة للماضي وقت النقل.</div>", "n": 1, "i": 72, "a": "tefl-52-065", "x": "ac996bcd"}, {"t": "learn", "h": "<div class=\"u\">time expression changes: now becomes then, today becomes that day, and so on.</div><div class=\"u\">تغييرات تعبيرات الوقت: دلوقتي بتبقى ساعتها، النهارده بتبقى اليوم ده، وهكذا.</div>", "n": 1, "i": 73, "a": "tefl-52-066", "x": "a9116b8e"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 74}, {"t": "learn", "h": "<div class=\"u\">Direct speech keeps the exact words in quotation marks; reported speech retells them with changes.</div><div class=\"u\">الكلام المباشر بيحتفظ بالكلام بالظبط بين علامتي تنصيص؛ الكلام المنقول بيعيد حكايته بتغييرات.</div>", "n": 1, "i": 75, "a": "tefl-52-067", "x": "ff00db6d"}, {"t": "learn", "h": "<div class=\"u\">Say takes no indirect object; tell must have one. Other reporting verbs carry attitude and avoid repetition.</div><div class=\"u\">السيي مابتاخدش مفعول غير مباشر؛ التل لازم تاخد واحد. أفعال النقل التانية بتحمل الموقف وبتجنّب التكرار.</div>", "n": 1, "i": 76, "a": "tefl-52-068", "x": "53d7d540"}, {"t": "learn", "h": "<div class=\"u\">Keep the tense when the statement is still true, or when the exact words matter legally or dramatically.</div><div class=\"u\">سيب الزمن زي ما هو لما التصريح لسه صح، أو لما الكلام بالظبط مهم قانونيًا أو دراميًا.</div>", "n": 1, "i": 77, "a": "tefl-52-069", "x": "206eb9c0"}, {"t": "learn", "h": "<div class=\"u\">Reported questions become normal sentences, with if or whether for yes or no questions; requests use ask plus to; commands use tell, order or warn plus to.</div><div class=\"u\">الأسئلة المنقولة بتبقى جمل عادية، مع إف أو ويذر لأسئلة الأيوه أو لأ؛ الطلبات بتستخدم أسك زائد تو؛ الأوامر بتستخدم تل أو أوردر أو وورن زائد تو.</div>", "n": 1, "i": 78, "a": "tefl-52-070", "x": "b0d3e1a0"}, {"t": "learn", "h": "<div class=\"u\">Tenses usually move one step back; can, may and must change; could, might, ought, should, would and past perfect stay the same; pronouns and time expressions shift too.</div><div class=\"u\">الأزمنة عادة بترجع خطوة؛ كان وماي ومست بتتغيّر؛ كود ومايت وأوت وشود ووود والماضي التام بيفضلوا زي ما هما؛ الضمائر وتعبيرات الوقت بتتغيّر كمان.</div>", "n": 1, "i": 79, "a": "tefl-52-071", "x": "4ca38a0e"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 80}, {"t": "mc", "q": "Which sentence is correct?<br>أنهي جملة صح؟", "opts": ["John said he was ready. | جون قال إنه كان جاهز.", "John said me he was ready. | جون قالي إنه كان جاهز.", "John said to he was ready. | جون قال لـ إنه كان جاهز."], "ans": 0, "why": "Say is never followed by an indirect object. We say: John said he was ready. | السيي أبدًا مابيتبعهاش مفعول غير مباشر. بنقول: جون قال إنه كان جاهز.", "ex": ["Correct. | صح.", "No. Say never takes me, her or them after it. | غلط: السيي أبدًا مابتاخدش مي أو هير أو ذيم بعدها.", "No. That is not a real pattern. | غلط: دي مش تركيبة موجودة."], "n": 1, "i": 81, "h": ""}, {"t": "mc", "q": "After tell we must use:<br>بعد التل لازم نستخدم إيه؟", "opts": ["an indirect object: John told me | مفعول غير مباشر: جون قال لي", "nothing: John told he was ready | ولا حاجة: جون قال إنه كان جاهز", "quotation marks | علامات تنصيص"], "ans": 0, "why": "Tell must be followed by an indirect object: John told me he was ready. | التل لازم يتبعها مفعول غير مباشر: جون قال لي إنه كان جاهز.", "ex": ["Correct. | صح.", "No. Tell needs a person after it. | غلط: التل محتاجة شخص بعدها.", "No. Reported speech drops quotation marks. | غلط: الكلام المنقول بيشيل علامات التنصيص."], "n": 1, "i": 82, "h": ""}, {"t": "mc", "q": "Mum asked: have you finished your dinner? The reported version is:<br>ماما سألت: خلّصتوا أكل؟ النسخة المنقولة هي:", "opts": ["Mum asked if we had finished our dinner. | ماما سألت لو كنا خلّصنا أكلنا.", "Mum asked had we finished our dinner. | ماما سألت هل كنا خلّصنا أكلنا.", "Mum asked that we finished dinner. | ماما سألت إننا خلّصنا الأكل."], "ans": 0, "why": "Yes/no questions use if, and the word order becomes a normal sentence: we had finished. | أسئلة الأيوه/لأ بتاخد إف، وترتيب الكلمات بيبقى جملة عادية: إحنا كنا خلّصنا.", "ex": ["Correct. | صح.", "No. A reported question is no longer in question order. | غلط: السؤال المنقول مابقاش بترتيب السؤال.", "No. Yes/no questions take if or whether, not that. | غلط: أسئلة الأيوه/لأ بتاخد إف أو ويذر مش ذات."], "n": 1, "i": 83, "h": ""}, {"t": "tf", "q": "Please do not shout becomes: she asked me not to shout.<br>متصوّتش لو سمحت بتبقى: هي طلبت مني متصوّتش.", "ans": true, "why": "Correct. Negative requests insert not before the infinitive: she asked me not to shout. | صح. الطلبات المنفية بتحط النفي قبل المصدر: هي طلبت مني متصوّتش.", "ex": ["Correct. | صح.", "Wrong. Not goes before the infinitive. | غلط: النفي بييجي قبل المصدر."], "n": 1, "i": 84, "h": ""}, {"t": "mc", "q": "I will see you on Saturday, said Tom. Reported:<br>هشوفك يوم السبت، قال توم. المنقول:", "opts": ["Tom said he would see me on Saturday. | توم قال إنه هيشوفني يوم السبت.", "Tom said he will see me on Saturday. | توم قال إنه هيشوفني يوم السبت.", "Tom said he sees me on Saturday. | توم قال إنه بيشوفني يوم السبت."], "ans": 0, "why": "Future forms move to the past: will becomes would. | أشكال المستقبل بترجع للماضي: الويل بتبقى وود.", "ex": ["Correct. | صح.", "No. Will backshifts to would. | غلط: الويل بترجع وود.", "No. That is not the pattern. | غلط: دي مش القاعدة."], "n": 1, "i": 85, "h": ""}, {"t": "mc", "q": "Which modal verb does NOT change in reported speech?<br>أنهي فعل ناقص مابيتغيّرش في الكلام المنقول؟", "opts": ["could | كود", "can | كان", "must | مست"], "ans": 0, "why": "Could, might, ought, should and would stay the same. Can, may and must change. | الكود والمايت والأوت والشود والوود بيفضلوا زي ما هما. الكان والماي والمست بيتغيّروا.", "ex": ["Correct. | صح.", "No. Can becomes could. | غلط: الكان بتبقى كود.", "No. Must becomes had to. | غلط: المست بتبقى هاد تو."], "n": 1, "i": 86, "h": ""}, {"t": "tf", "q": "When a statement is still true, we must change its tense in reported speech.<br>لما التصريح لسه صح، لازم نغيّر زمنه في الكلام المنقول.", "ans": false, "why": "False. When the statement is still true, we can keep the tense: John said his foot hurts. | غلط. لما التصريح لسه صح، نقدر نسيب الزمن: جون قال إن رجله بتوجعه.", "ex": ["Correct. | صح.", "Wrong. Still-true statements can keep their tense. | غلط: التصريحات اللي لسه صح ممكن تحتفظ بزمنها."], "n": 1, "i": 87, "h": ""}, {"t": "mc", "q": "I am living in Barcelona, she said. Reported:<br>أنا عايشة في برشلونة، قالت. المنقول:", "opts": ["she said she was living in Barcelona | هي قالت إنها كانت عايشة في برشلونة", "she said she is living in Barcelona | هي قالت إنها عايشة في برشلونة", "she said she lived in Barcelona | هي قالت إنها عاشت في برشلونة"], "ans": 0, "why": "Present continuous backshifts to past continuous. | المضارع المستمر بيرجع ماضي مستمر.", "ex": ["Correct. | صح.", "No. The tense moves one step back. | غلط: الزمن بيرجع خطوة.", "No. Continuous stays continuous. | غلط: المستمر بيفضل مستمر."], "n": 1, "i": 88, "h": ""}, {"t": "recall", "q": "Name four things that change when direct speech becomes reported speech.<br>اذكر أربع حاجات بتتغيّر لما الكلام المباشر بيبقى منقول.", "a": "Quotation marks disappear; a reporting verb is added; verb tenses usually move back; pronouns, determiners and time expressions change.<br>علامات التنصيص بتتشال؛ فعل نقل بيتضاف؛ أزمنة الأفعال عادة بترجع؛ الضمائر وأدوات التحديد وتعبيرات الوقت بتتغيّر.", "n": 1, "i": 89, "h": ""}, {"t": "recall", "q": "Give the tense backshift for four tense forms.<br>ادّي الرجوع بالزمن لأربع أزمنة.", "a": "Present simple to past simple; present continuous to past continuous; present perfect to past perfect; past simple stays or becomes past perfect; past perfect stays the same.<br>المضارع البسيط لماضي بسيط؛ المضارع المستمر لماضي مستمر؛ المضارع التام لماضي تام؛ الماضي البسيط بيفضل أو يبقى ماضي تام؛ الماضي التام بيفضل زي ما هو.", "n": 1, "i": 90, "h": ""}, {"t": "write", "q": "Explain the difference between say and tell, with examples. (3-4 sentences)<br>اشرح الفرق بين السيي والتل، بأمثلة. (٣-٤ جمل).", "key": "tefl-52:1", "a": "Say is never followed by an indirect object: John said he was ready, never John said me. Tell must be followed by an indirect object: John told me he was ready. Both can be followed by a that clause, and that is often dropped. Tell also works with noun phrases and infinitives: my boss told me to stay.<br>السيي أبدًا مابيتبعهاش مفعول غير مباشر: جون قال إنه كان جاهز، أبدًا مش جون قالي. التل لازم يتبعها مفعول غير مباشر: جون قال لي إنه كان جاهز. الاتنين ممكن يتبعهم جملة ذات، والذات كتير بتتشال. التل كمان بتشتغل مع الأسماء والمصادر: مديري قالي أفضل.", "n": 1, "i": 91, "h": ""}, {"t": "write", "q": "How do you report a yes/no question? Give one example. (3-4 sentences)<br>إزاي بتنقل سؤال أيوه/لأ؟ ادّي مثال واحد. (٣-٤ جمل).", "key": "tefl-52:2", "a": "To report a yes/no question, use ask plus if or whether, and change the word order to a normal positive sentence. The subject comes before the verb or helping verb. Has she gone to town? becomes I asked if she had gone to town. The tense moves back one step, just like in reported statements.<br>عشان تنقل سؤال أيوه/لأ، استخدم أسك زائد إف أو ويذر، وغيّر ترتيب الكلمات لجملة عادية مثبتة. الفاعل بييجي قبل الفعل أو الفعل المساعد. هل هي راحت البلد؟ بتبقى أنا سألت لو هي راحت البلد. الزمن بيرجع خطوة، زي التصريحات المنقولة بالظبط.", "n": 1, "i": 92, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: modal verbs.</div><div class=\"u\">الدرس الجاي: الأفعال الناقصة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 93}];</script>
