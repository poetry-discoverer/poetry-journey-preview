<h1>عالم تيفل ٢٨: الكتب المقررة والمواد المرجعية</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٢٨</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-28";window.STEPS=[{"t": "section", "h": "Choosing a course book | اختيار الكتاب المقرر", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">If the school has not already assigned a course book, you have to choose one. There are a number of factors to consider.</div><div class=\"u\">لو المدرسة لسه معيّناش كتاب مقرر، لازم تختار واحد. في عوامل كتير لازم تبص عليها.</div>", "n": 1, "i": 1, "a": "tefl-28-001", "x": "c137d15a"}, {"t": "learn", "h": "<div class=\"u\">The basics are obvious: the age group and the level of your students.</div><div class=\"u\">الأساسيات واضحة: الفئة العمرية ومستوى طلبتك.</div>", "n": 1, "i": 2, "a": "tefl-28-002", "x": "78fd161f"}, {"t": "learn", "h": "<div class=\"u\">But it is also important to think about why this class is studying English. Is it for work? Or as a hobby?</div><div class=\"u\">بس المهم كمان تفكر ليه الفصل ده بيدرس إنجليزية. عشان الشغل؟ ولا كهواية؟</div>", "n": 1, "i": 3, "a": "tefl-28-003", "x": "c2dd247a"}, {"t": "learn", "h": "<div class=\"u\">Are they children sent by their parents for extra lessons? And is that because they struggle with English, or because they want to get ahead?</div><div class=\"u\">هما عيال بعتهم أهلهم لدروس زيادة؟ وده عشان بيتعبوا في الإنجليزية، ولا عشان عايزين يتقدموا؟</div>", "n": 1, "i": 4, "a": "tefl-28-004", "x": "7db3d5f6"}, {"t": "learn", "h": "<div class=\"u\">Or are they planning to travel or move to an English-speaking country?</div><div class=\"u\">ولا بيخططوا يسافروا أو ينتقلوا لبلد بتتكلم إنجليزية؟</div>", "n": 1, "i": 5, "a": "tefl-28-005", "x": "ce9b99d8"}, {"t": "learn", "h": "<div class=\"u\">All of this changes which book you choose. It is not a one-size-fits-all thing.</div><div class=\"u\">كل ده بيغيّر الكتاب اللي بتختاره. الموضوع مش مقاس واحد يناسب الكل.</div>", "n": 1, "i": 6, "a": "tefl-28-006", "x": "63a0c0fb"}, {"t": "learn", "h": "<div class=\"u\">Another factor: will your students take a test at the end of the course?</div><div class=\"u\">عامل تاني: طلبتك هياخدوا اختبار في نهاية الكورس؟</div>", "n": 1, "i": 7, "a": "tefl-28-007", "x": "cdd021fb"}, {"t": "learn", "h": "<div class=\"u\">A book that prepares students for IELTS is very different from a book for the FCE exam.</div><div class=\"u\">الكتاب اللي بيجهّز لـIELTS مختلف جدًا عن كتاب امتحان FCE.</div>", "n": 1, "i": 8, "a": "tefl-28-008", "x": "a1a22a89"}, {"t": "learn", "h": "<div class=\"u\">Or maybe there is just an internal test, to see if students can move up to the next level. And are all the students taking it, or only a few?</div><div class=\"u\">ولا ممكن يكون في بس اختبار داخلي، عشان نشوف الطلبة يقدروا يطلعوا للمستوى اللي بعده ولا لأ. وكلهم داخلين الاختبار ولا عدد قليل؟</div>", "n": 1, "i": 9, "a": "tefl-28-009", "x": "72d73502"}, {"t": "learn", "h": "<div class=\"u\">If the course aims at a particular exam, a general English book is usually not enough.</div><div class=\"u\">لو الكورس مستهدف امتحان معين، كتاب الإنجليزية العام غالبًا مش كفاية.</div>", "n": 1, "i": 10, "a": "tefl-28-010", "x": "2de64591"}, {"t": "learn", "h": "<div class=\"u\">You need material that brings students up to the right level, and also trains them in the techniques of that particular test.</div><div class=\"u\">محتاج مادة توصّل الطلبة للمستوى المظبوط، وكمان تدرّبهم على تقنيات الاختبار ده بالذات.</div>", "n": 1, "i": 11, "a": "tefl-28-011", "x": "183f71d7"}, {"t": "section", "h": "The matching task, solved | تمرين التوصيل محلول", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">The unit's matching task, solved. Ten children aged five to eight: The children's English Ladder 2, from Cambridge University Press.</div><div class=\"u\">تمرين التوصيل في الوحدة، محلول. عشر عيال من خمس لتمان سنين: The children's English Ladder 2 من كامبريدج.</div>", "n": 1, "i": 13, "a": "tefl-28-012", "x": "71701222"}, {"t": "learn", "h": "<div class=\"u\">Workers from a financial services company who want English for work: Business Basics, from Oxford University Press.</div><div class=\"u\">موظفين من شركة خدمات مالية عايزين إنجليزية للشغل: Business Basics من أوكسفورد.</div>", "n": 1, "i": 14, "a": "tefl-28-013", "x": "1cbf3c75"}, {"t": "learn", "h": "<div class=\"u\">Five pensioners going on a coach trip around the USA in three months: Basic Survival, from Macmillan. They need travel survival English.</div><div class=\"u\">خمسة متقاعدين رايحين رحلة أوتوبيس حوالين أمريكا بعد تلات شهور: Basic Survival من ماكميلان. محتاجين إنجليزية نجاة للسفر.</div>", "n": 1, "i": 15, "a": "tefl-28-014", "x": "ea5aec62"}, {"t": "learn", "h": "<div class=\"u\">Students hoping to go to university in England, who need a certificate of language proficiency: IELTS Masterclass, from Oxford University Press.</div><div class=\"u\">طلبة ناويين يدخلوا جامعة في إنجلترا ومحتاجين شهادة كفاءة لغوية: IELTS Masterclass من أوكسفورد.</div>", "n": 1, "i": 16, "a": "tefl-28-015", "x": "88ac154e"}, {"t": "learn", "h": "<div class=\"u\">Notice the pattern: match the book to the learners' age, goal, and deadline, not the other way round.</div><div class=\"u\">لاحظ النمط: طابِق الكتاب مع سن المتعلمين وهدفهم وميعادهم، مش العكس.</div>", "n": 1, "i": 17, "a": "tefl-28-016", "x": "03213f33"}, {"t": "section", "h": "Grammar books and teacher's books | كتب القواعد وكتب المدرس", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">Even after choosing a course book, it is good to consult other reference materials. Maybe you are unsure about a language point, or about the best way to teach it.</div><div class=\"u\">حتى بعد ما تختار الكتاب المقرر، كويس ترجع لمواد مرجعية تانية. يمكن مش متأكد من نقطة لغوية، أو من أحسن طريقة تدرّسها.</div>", "n": 1, "i": 19, "a": "tefl-28-017", "x": "8b67e69d"}, {"t": "learn", "h": "<div class=\"u\">Grammar books. Many new EFL teachers feel unsure about grammar. They know instinctively if a sentence is correct, but not why.</div><div class=\"u\">كتب القواعد. مدرسين كتير جداد في تدريس الإنجليزية بيحسوا بعدم ثقة في القواعد. بيعرفوا بالحدس لو الجملة صح، بس مش عارفين ليه.</div>", "n": 1, "i": 20, "a": "tefl-28-018", "x": "5c3267c0"}, {"t": "learn", "h": "<div class=\"u\">They may also be hesitant to teach all the nitty gritty rules and exceptions.</div><div class=\"u\">وممكن يترددوا يدرّسوا كل القواعد والاستثناءات الدقيقة.</div>", "n": 1, "i": 21, "a": "tefl-28-019", "x": "a69bf129"}, {"t": "learn", "h": "<div class=\"u\">A good start is a grammar book for non-native speakers, like Murphy's Grammar in Use. The grammar there is much simpler.</div><div class=\"u\">بداية كويسة كتاب قواعد لغير الناطقين بالإنجليزية، زي Grammar in Use لميرفي. القواعد فيه أبسط بكتير.</div>", "n": 1, "i": 22, "a": "tefl-28-020", "x": "6682cdab"}, {"t": "learn", "h": "<div class=\"u\">It also shows you what students at each level really need to know.</div><div class=\"u\">وكمان بيوضحلك الطلبة في كل مستوى محتاجين يعرفوا إيه بالظبط.</div>", "n": 1, "i": 23, "a": "tefl-28-021", "x": "d11240a8"}, {"t": "learn", "h": "<div class=\"u\">Example: with a pre-intermediate group, teach the present continuous simply. Do not add its use for future arrangements. That would only confuse them.</div><div class=\"u\">مثال: مع مجموعة قبل المتوسط، درّس المضارع المستمر ببساطة. ماتزودش استخدامه للترتيبات المستقبلية. ده هيلخبطهم وبس.</div>", "n": 1, "i": 24, "a": "tefl-28-022", "x": "a400837a"}, {"t": "learn", "h": "<div class=\"u\">These simple books ease you into deeper grammar knowledge without overwhelming you.</div><div class=\"u\">الكتب البسيطة دي بتوصّلك لمعرفة قواعد أعمق من غير ما تغرقك.</div>", "n": 1, "i": 25, "a": "tefl-28-023", "x": "8bef119b"}, {"t": "learn", "h": "<div class=\"u\">Later, when you teach higher levels, use grammar books written for EFL teachers. They explain the nuances advanced students need.</div><div class=\"u\">بعدين، لما تدرّس مستويات أعلى، استخدم كتب قواعد مكتوبة لمدرسي الإنجليزية. بتشرح التفاصيل الدقيقة اللي طلبة المستويات المتقدمة محتاجينها.</div>", "n": 1, "i": 26, "a": "tefl-28-024", "x": "02749aea"}, {"t": "learn", "h": "<div class=\"u\">One example is Martin Parrott's Grammar for English Language Teachers.</div><div class=\"u\">مثال: Grammar for English Language Teachers لمارتن باروت.</div>", "n": 1, "i": 27, "a": "tefl-28-025", "x": "af791803"}, {"t": "learn", "h": "<div class=\"u\">If you are a visual learner, try newer grammar books with interactive online activities, or ones with exercises that put you in your students' shoes.</div><div class=\"u\">لو بتتعلم بصريًا، جرّب كتب القواعد الأحدث اللي معاها أنشطة تفاعلية أونلاين، أو اللي فيها تمارين بتحطك مكان طلبتك.</div>", "n": 1, "i": 28, "a": "tefl-28-026", "x": "c58e7cd5"}, {"t": "learn", "h": "<div class=\"u\">Teacher's books. Every course book has one, but some are better than others. They suggest the best way to use the material.</div><div class=\"u\">كتب المدرس. كل كتاب مقرر ليه واحد، بس بعضها أحسن من بعض. بتقترح أحسن طريقة لاستخدام المادة.</div>", "n": 1, "i": 29, "a": "tefl-28-027", "x": "f98ce084"}, {"t": "learn", "h": "<div class=\"u\">Some give a detailed, step-by-step guide. Others only give correct answers and ideas for extension activities.</div><div class=\"u\">بعضها بيدّي دليل مفصّل خطوة بخطوة. وبعضها بيدّي بس الإجابات الصح وأفكار لأنشطة إضافية.</div>", "n": 1, "i": 30, "a": "tefl-28-028", "x": "463d2197"}, {"t": "learn", "h": "<div class=\"u\">Your confidence in planning lessons on your own affects which course book and teacher's book you choose.</div><div class=\"u\">ثقتك في التخطيط للدروس لوحدك بتأثر على أنهي كتاب مقرر وكتاب مدرس بتختارهم.</div>", "n": 1, "i": 31, "a": "tefl-28-029", "x": "9de40f81"}, {"t": "learn", "h": "<div class=\"u\">Many newer teacher's books add supplementary worksheets, end-of-unit tests, progress tests, and extra photocopiable activities.</div><div class=\"u\">كتب مدرس كتير أحدث بتزوّد أوراق عمل إضافية، واختبارات نهاية وحدة، واختبارات تقدم، وأنشطة زيادة قابلة للتصوير.</div>", "n": 1, "i": 32, "a": "tefl-28-030", "x": "4735ea2b"}, {"t": "learn", "h": "<div class=\"u\">Some even explain the answers and what to do if students struggle with an exercise. For most teachers, they are a valuable resource.</div><div class=\"u\">بعضها حتى بيشرح الإجابات وإيه اللي تعمله لو الطلبة اتعبوا مع تمرين. لمعظم المدرسين، ده مصدر قيّم.</div>", "n": 1, "i": 33, "a": "tefl-28-031", "x": "99126c0d"}, {"t": "section", "h": "EFL articles | مقالات تدريس الإنجليزية", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">EFL articles. Articles in EFL magazines can shed light on learners' difficulties with the language.</div><div class=\"u\">مقالات تدريس الإنجليزية. المقالات في مجلات تدريس الإنجليزية ممكن تسلّط الضوء على صعوبات المتعلمين مع اللغة.</div>", "n": 1, "i": 35, "a": "tefl-28-032", "x": "9e6f9265"}, {"t": "learn", "h": "<div class=\"u\">Often the cause is interference from the students' mother tongue. Many learners do not understand why they cannot just translate their own language into English.</div><div class=\"u\">في الغالب السبب هو تداخل اللغة الأم بتاعة الطلبة. متعلمين كتير مش فاهمين ليه مينفعش بس يترجموا لغتهم للإنجليزية.</div>", "n": 1, "i": 36, "a": "tefl-28-033", "x": "2cd787d1"}, {"t": "learn", "h": "<div class=\"u\">It does not work like that. Languages developed over thousands of years, and tenses or vocabulary do not always match from one language to another.</div><div class=\"u\">الدنيا مابتمشيش كده. اللغات اتطورت على مدى آلاف السنين، والأزمنة والمفردات مش دايمًا بتتطابق من لغة للتانية.</div>", "n": 1, "i": 37, "a": "tefl-28-034", "x": "f1196ae2"}, {"t": "learn", "h": "<div class=\"u\">Teaching abroad, where all students share one mother tongue, makes their difficulties easier to spot.</div><div class=\"u\">التدريس بره، حيث كل الطلبة بيتكلموا نفس اللغة الأم، بيخلّي صعوباتهم أسهل في الملاحظة.</div>", "n": 1, "i": 38, "a": "tefl-28-035", "x": "b0e87a65"}, {"t": "learn", "h": "<div class=\"u\">In a mixed class, for example Mexicans and Chinese together, each group may have different problems. You may need to read up on how to get the best from each.</div><div class=\"u\">في فصل مختلط، مثلًا مكسيكيين وصينيين مع بعض، كل مجموعة ممكن يبقى عندها مشاكل مختلفة. ممكن تحتاج تقرا عن إزاي تجيب أحسن نتيجة من كل مجموعة.</div>", "n": 1, "i": 39, "a": "tefl-28-036", "x": "0d21f8b0"}, {"t": "learn", "h": "<div class=\"u\">Keeping up with new research into EFL teaching also livens up your lessons and keeps students engaged.</div><div class=\"u\">متابعة الأبحاث الجديدة في تدريس الإنجليزية كمان بتحيّي دروسك وتخلّي الطلبة متفاعلين.</div>", "n": 1, "i": 40, "a": "tefl-28-037", "x": "da102289"}, {"t": "learn", "h": "<div class=\"u\">You might try a new planning method, or a more informal way to present a grammar point, or just pick up new ideas.</div><div class=\"u\">ممكن تجرب طريقة تخطيط جديدة، أو طريقة أقل رسمية لعرض نقطة قواعد، أو بس تاخد أفكار جديدة.</div>", "n": 1, "i": 41, "a": "tefl-28-038", "x": "d35eb827"}, {"t": "learn", "h": "<div class=\"u\">Popular magazines: English Teaching Professional, Modern English Teacher, and the Asian EFL Journal.</div><div class=\"u\">مجلات مشهورة: English Teaching Professional وModern English Teacher وAsian EFL Journal.</div>", "n": 1, "i": 42, "a": "tefl-28-039", "x": "821d3c9e"}, {"t": "section", "h": "Dictionaries | القواميس", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Bilingual dictionaries translate words between English and another language. They are useful for a quick check of an unknown word.</div><div class=\"u\">القواميس ثنائية اللغة بتحوّل الكلمات بين الإنجليزية ولغة تانية. مفيدة للتحقق السريع من كلمة مش معروفة.</div>", "n": 1, "i": 44, "a": "tefl-28-040", "x": "cbde5f12"}, {"t": "learn", "h": "<div class=\"u\">But they can lead to mistranslation, because many words have several meanings, and a small dictionary does not list them all.</div><div class=\"u\">بس ممكن تودّي لترجمة غلط، لأن كلمات كتير ليها معاني كتير، والقاموس الصغير مش بيعدّدها كلها.</div>", "n": 1, "i": 45, "a": "tefl-28-041", "x": "12e25125"}, {"t": "learn", "h": "<div class=\"u\">Example: a student looks up bow, as in bow and arrow, and finds the translation for taking a bow on a stage. Wrong meaning.</div><div class=\"u\">مثال: طالب بيدوّر على bow زي القوس والسهم، بيلاقي ترجمة الانحناءة على المسرح. معنى غلط.</div>", "n": 1, "i": 46, "a": "tefl-28-042", "x": "0a7b2de0"}, {"t": "learn", "h": "<div class=\"u\">They also tell you little about the word itself, like an irregular past form, or how to use it in a sentence.</div><div class=\"u\">وكمان بتقولك حاجات قليلة عن الكلمة نفسها، زي لو ليها تصريف ماضي شاذ، أو إزاي تستخدمها في جملة.</div>", "n": 1, "i": 47, "a": "tefl-28-043", "x": "73bbedce"}, {"t": "learn", "h": "<div class=\"u\">So it is usually best to refer students to a monolingual English dictionary, what most of us call a normal dictionary.</div><div class=\"u\">عشان كده الأحسن غالبًا توجّه الطلبة لقاموس إنجليزية أحادي اللغة، اللي معظمنا بيسمّيه القاموس العادي.</div>", "n": 1, "i": 48, "a": "tefl-28-044", "x": "94f46454"}, {"t": "learn", "h": "<div class=\"u\">Words, meanings, and examples are all in English, so students really learn how to use each word properly.</div><div class=\"u\">الكلمات والمعاني والأمثلة كلها بالإنجليزية، فالطلبة بجد بيتعلموا إزاي يستخدموا كل كلمة صح.</div>", "n": 1, "i": 49, "a": "tefl-28-045", "x": "76199d15"}, {"t": "learn", "h": "<div class=\"u\">It is also a great reference for you, to give clear definitions and useful examples.</div><div class=\"u\">وهو كمان مرجع عظيم ليك، عشان تقدّم تعريفات واضحة وأمثلة مفيدة.</div>", "n": 1, "i": 50, "a": "tefl-28-046", "x": "836a8d26"}, {"t": "learn", "h": "<div class=\"u\">Learner dictionaries are similar, but even more valuable. Their definitions match different levels.</div><div class=\"u\">قواميس المتعلم شبهها، بس أقيّم كمان. تعريفاتها مناسبة لمستويات مختلفة.</div>", "n": 1, "i": 51, "a": "tefl-28-047", "x": "b331ba6a"}, {"t": "learn", "h": "<div class=\"u\">They add collocations, whether a word is formal or informal, and notes that warn about common mistakes.</div><div class=\"u\">بتزوّد التلازمات اللفظية، وإذا كانت الكلمة رسمية ولا غير رسمية، وملاحظات بتحذّر من أخطاء شائعة.</div>", "n": 1, "i": 52, "a": "tefl-28-048", "x": "0119d779"}, {"t": "learn", "h": "<div class=\"u\">Some also give synonyms, words with the same meaning, and antonyms, words with the opposite meaning, just like a thesaurus.</div><div class=\"u\">بعضها كمان بيدّي مرادفات، كلمات بنفس المعنى، وأضداد، كلمات بالمعنى العكسي، زي قاموس المرادفات بالظبط.</div>", "n": 1, "i": 53, "a": "tefl-28-049", "x": "8db7994d"}, {"t": "learn", "h": "<div class=\"u\">Thesauruses are especially useful with advanced students, to expand their vocabulary.</div><div class=\"u\">قواميس المرادفات مفيدة خصوصًا مع الطلبة المتقدمين، عشان توسّع مفرداتهم.</div>", "n": 1, "i": 54, "a": "tefl-28-050", "x": "1aeb212b"}, {"t": "learn", "h": "<div class=\"u\">Sometimes synonyms explain a new word better than a definition. Take furthermore, which is very hard to define simply.</div><div class=\"u\">ساعات المرادفات بتشرح كلمة جديدة أحسن من التعريف. خد furthermore، صعبة جدًا تتعرّف ببساطة.</div>", "n": 1, "i": 55, "a": "tefl-28-051", "x": "e0f4a324"}, {"t": "learn", "h": "<div class=\"u\">A standard dictionary says: an adverb used to introduce a fresh consideration in an argument. Clear? Not really.</div><div class=\"u\">قاموس عادي بيقول: حال بيقدّم اعتبار جديد في حجة. واضح؟ مش قوي.</div>", "n": 1, "i": 56, "a": "tefl-28-052", "x": "d9447afa"}, {"t": "learn", "h": "<div class=\"u\">It is easier to list synonyms like additionally and moreover.</div><div class=\"u\">الأسهل تعدّد مرادفات زي additionally وmoreover.</div>", "n": 1, "i": 57, "a": "tefl-28-053", "x": "142db5f5"}, {"t": "learn", "h": "<div class=\"u\">But one of the best approaches is example sentences in context: English is an international language. Furthermore, it is now essential for a successful career.</div><div class=\"u\">بس من أحسن الطرق جمل الأمثلة في سياق: English is an international language. Furthermore, it is now essential for a successful career.</div>", "n": 1, "i": 58, "a": "tefl-28-054", "x": "f60bf8ef"}, {"t": "learn", "h": "<div class=\"u\">The unit's synonym matching, solved. However matches yet and although.</div><div class=\"u\">تمرين توصيل المرادفات في الوحدة، محلول. however بتتوصّل بـyet وalthough.</div>", "n": 1, "i": 59, "a": "tefl-28-055", "x": "fd0fca34"}, {"t": "learn", "h": "<div class=\"u\">Consider matches bear in mind and think about.</div><div class=\"u\">consider بتتوصّل بـbear in mind وthink about.</div>", "n": 1, "i": 60, "a": "tefl-28-056", "x": "31ae92a5"}, {"t": "learn", "h": "<div class=\"u\">Picture matches image and depiction. Declare matches announce and proclaim.</div><div class=\"u\">picture بتتوصّل بـimage وdepiction. وdeclare بتتوصّل بـannounce وproclaim.</div>", "n": 1, "i": 61, "a": "tefl-28-057", "x": "b37361c1"}, {"t": "section", "h": "Phonemic charts and colleagues | الخرايط الصوتية والزملا", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Phonemic charts. A phonemic chart shows the different sounds of English, using the phonetic alphabet. It is very useful for correct pronunciation.</div><div class=\"u\">الخرايط الصوتية. الخريطة الصوتية بتوضح أصوات الإنجليزية المختلفة، بالأبجدية الصوتية. مفيدة جدًا للنطق الصحيح.</div>", "n": 1, "i": 63, "a": "tefl-28-058", "x": "1792bbbb"}, {"t": "learn", "h": "<div class=\"u\">Many words are spelt differently but sound the same, like meet and meat. Here ee and ea both match the sound i:.</div><div class=\"u\">كلمات كتير بتتكتب مختلف بس بتتنطق نفس النطق، زي meet وmeat. هنا ee وea الاتنين بيطابقوا صوت i:.</div>", "n": 1, "i": 64, "a": "tefl-28-059", "x": "f42f8bd7"}, {"t": "learn", "h": "<div class=\"u\">But in other words ea is pronounced differently, like the sound in earn.</div><div class=\"u\">بس في كلمات تانية ea بتتنطق مختلف، زي الصوت في earn.</div>", "n": 1, "i": 65, "a": "tefl-28-060", "x": "4afe7ae9"}, {"t": "learn", "h": "<div class=\"u\">And many words with similar spellings sound completely different, like though and enough.</div><div class=\"u\">وكلمات كتير بإملاء متشابه بتتنطق مختلف تمامًا، زي though وenough.</div>", "n": 1, "i": 66, "a": "tefl-28-061", "x": "2a3b0a82"}, {"t": "learn", "h": "<div class=\"u\">The British Council has an interactive chart: click a symbol and hear its sound.</div><div class=\"u\">المجلس الثقافي البريطاني عنده خريطة تفاعلية: دوس على الرمز واسمع صوته.</div>", "n": 1, "i": 67, "a": "tefl-28-062", "x": "92ef87a7"}, {"t": "learn", "h": "<div class=\"u\">The New English File course book series has one that turns each symbol into a picture, which is great for young learners.</div><div class=\"u\">سلسلة كتب New English File عندها واحدة بتحوّل كل رمز لصورة، وده عظيم للمتعلمين الصغيرين.</div>", "n": 1, "i": 68, "a": "tefl-28-063", "x": "45505a30"}, {"t": "learn", "h": "<div class=\"u\">Colleagues. Do not forget more experienced EFL teachers. They are often the best reference material of all.</div><div class=\"u\">الزملا. ماتنساش مدرسي الإنجليزية الأكثر خبرة. هما في الغالب أحسن مادة مرجعية على الإطلاق.</div>", "n": 1, "i": 69, "a": "tefl-28-064", "x": "0cc15538"}, {"t": "learn", "h": "<div class=\"u\">Chances are they have taught the same level or language point before, and can give good advice.</div><div class=\"u\">غالبًا درّسوا نفس المستوى أو النقطة اللغوية قبل كده، ويقدروا يدّوك نصيحة كويسة.</div>", "n": 1, "i": 70, "a": "tefl-28-065", "x": "4cb62847"}, {"t": "learn", "h": "<div class=\"u\">They may warn you about difficulties they met, and suggest ways to overcome them.</div><div class=\"u\">ممكن يحذّروك من صعوبات قابلوها، ويقترحوا طرق تتغلّب عليها.</div>", "n": 1, "i": 71, "a": "tefl-28-066", "x": "1e7dbaf3"}, {"t": "learn", "h": "<div class=\"u\">Every teacher has their own methods, so do not worry if their advice does not suit you. But any guidance makes you consider your own planning more carefully.</div><div class=\"u\">كل مدرس ليه طرقه، فماتقلقش لو نصيحتهم مابتناسبكش. بس أي توجيه بيخلّيك تراجع تخطيطك بعناية أكتر.</div>", "n": 1, "i": 72, "a": "tefl-28-067", "x": "9d81cf17"}, {"t": "section", "h": "Unit 5 questions | أسئلة الوحدة ٥", "n": 1, "i": 73}, {"t": "learn", "h": "<div class=\"u\">Question one: to develop your own understanding of language, which reference do you use? Answer: Grammar for English Language Teachers by Martin Parrott.</div><div class=\"u\">سؤال واحد: عشان تطوّر فهمك الخاص للغة، تستخدم أنهي مرجع؟ الإجابة: Grammar for English Language Teachers لمارتن باروت.</div>", "n": 1, "i": 74, "a": "tefl-28-068", "x": "2b877b3c"}, {"t": "learn", "h": "<div class=\"u\">That is a grammar book for teachers. Not a journal article, and not a pocket dictionary.</div><div class=\"u\">ده كتاب قواعد للمدرسين. مش مقال مجلة، ومش قاموس جيب.</div>", "n": 1, "i": 75, "a": "tefl-28-069", "x": "e97449ab"}, {"t": "learn", "h": "<div class=\"u\">Question two: which is NOT correct about a bilingual dictionary? Answer: finding explanations of English words. Explanations are what monolingual dictionaries give.</div><div class=\"u\">سؤال اتنين: إيه اللي مش صح عن القاموس ثنائي اللغة؟ الإجابة: إيجاد شروحات للكلمات الإنجليزية. الشروحات دي بتاعت القواميس أحادية اللغة.</div>", "n": 1, "i": 76, "a": "tefl-28-070", "x": "26414bbf"}, {"t": "learn", "h": "<div class=\"u\">A bilingual dictionary can check how English words are said in the students' mother tongue. That part is correct.</div><div class=\"u\">القاموس ثنائي اللغة يقدر يتحقق الكلمات الإنجليزية بتتقال إزاي بلغة الطلبة الأم. الجزء ده صح.</div>", "n": 1, "i": 77, "a": "tefl-28-071", "x": "f15276b7"}, {"t": "learn", "h": "<div class=\"u\">Question three: course books should always prepare students for a particular exam, true or false? False.</div><div class=\"u\">سؤال تلاتة: الكتب المقررة المفروض دايمًا تجهّز الطلبة لامتحان معين، صح ولا غلط؟ غلط.</div>", "n": 1, "i": 78, "a": "tefl-28-072", "x": "05732c64"}, {"t": "learn", "h": "<div class=\"u\">Many courses have no exam; the book is matched to the learners' goals, whatever they are.</div><div class=\"u\">كورسات كتير مالهاش امتحان؛ الكتاب بيتطابق مع أهداف المتعلمين، مهما كانت.</div>", "n": 1, "i": 79, "a": "tefl-28-073", "x": "d0d48fb9"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 80}, {"t": "learn", "h": "<div class=\"u\">course book: the main book a class follows through a course.</div><div class=\"u\">الكتاب المقرر: الكتاب الأساسي اللي الفصل ماشي عليه طول الكورس.</div>", "n": 1, "i": 81, "a": "tefl-28-074", "x": "d6222f1d"}, {"t": "learn", "h": "<div class=\"u\">reference material: extra sources a teacher consults for help.</div><div class=\"u\">مادة مرجعية: مصادر إضافية المدرس بيرجع لها للمساعدة.</div>", "n": 1, "i": 82, "a": "tefl-28-075", "x": "18e8bc4b"}, {"t": "learn", "h": "<div class=\"u\">bilingual dictionary: translates words between two languages.</div><div class=\"u\">قاموس ثنائي اللغة: بيترجم الكلمات بين لغتين.</div>", "n": 1, "i": 83, "a": "tefl-28-076", "x": "a09112af"}, {"t": "learn", "h": "<div class=\"u\">monolingual dictionary: defines English words in English.</div><div class=\"u\">قاموس أحادي اللغة: بيشرح الكلمات الإنجليزية بالإنجليزية.</div>", "n": 1, "i": 84, "a": "tefl-28-077", "x": "fe3c9272"}, {"t": "learn", "h": "<div class=\"u\">learner dictionary: a monolingual dictionary with level-appropriate definitions.</div><div class=\"u\">قاموس المتعلم: قاموس أحادي اللغة بتعريفات مناسبة للمستوى.</div>", "n": 1, "i": 85, "a": "tefl-28-078", "x": "a6a608f9"}, {"t": "learn", "h": "<div class=\"u\">thesaurus: a book of synonyms and antonyms.</div><div class=\"u\">قاموس المرادفات: كتاب المرادفات والأضداد.</div>", "n": 1, "i": 86, "a": "tefl-28-079", "x": "5f06cc37"}, {"t": "learn", "h": "<div class=\"u\">synonym: a word with the same meaning as another.</div><div class=\"u\">مرادف: كلمة بنفس معنى كلمة تانية.</div>", "n": 1, "i": 87, "a": "tefl-28-080", "x": "e3653b20"}, {"t": "learn", "h": "<div class=\"u\">antonym: a word with the opposite meaning.</div><div class=\"u\">ضد: كلمة بالمعنى العكسي.</div>", "n": 1, "i": 88, "a": "tefl-28-081", "x": "ec84decc"}, {"t": "learn", "h": "<div class=\"u\">phonemic chart: a chart of English sounds in the phonetic alphabet.</div><div class=\"u\">الخريطة الصوتية: خريطة أصوات الإنجليزية بالأبجدية الصوتية.</div>", "n": 1, "i": 89, "a": "tefl-28-082", "x": "403d4ae7"}, {"t": "learn", "h": "<div class=\"u\">interference: mother tongue habits affecting the new language.</div><div class=\"u\">التداخل اللغوي: عادات اللغة الأم بتأثر على اللغة الجديدة.</div>", "n": 1, "i": 90, "a": "tefl-28-083", "x": "22cfe324"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 91}, {"t": "learn", "h": "<div class=\"u\">Choose a course book by your learners: age, level, why they study English, and whether they face an exam.</div><div class=\"u\">اختار الكتاب المقرر على حسب متعلميك: السن، المستوى، ليه بيدرسوا إنجليزية، وإذا كان قدامهم امتحان.</div>", "n": 1, "i": 92, "a": "tefl-28-084", "x": "ede29159"}, {"t": "learn", "h": "<div class=\"u\">Exam courses need special books that teach both the level and the test techniques.</div><div class=\"u\">كورسات الامتحانات محتاجة كتب خاصة بتعلّم المستوى وتقنيات الاختبار مع بعض.</div>", "n": 1, "i": 93, "a": "tefl-28-085", "x": "3ea42176"}, {"t": "learn", "h": "<div class=\"u\">Reference helpers: grammar books, teacher's books, EFL articles, dictionaries, phonemic charts, and colleagues.</div><div class=\"u\">المساعدات المرجعية: كتب القواعد، كتب المدرس، مقالات تدريس الإنجليزية، القواميس، الخرايط الصوتية، والزملا.</div>", "n": 1, "i": 94, "a": "tefl-28-086", "x": "4b0e5784"}, {"t": "learn", "h": "<div class=\"u\">Bilingual dictionaries are quick but risky; learner dictionaries teach real usage; thesauruses expand vocabulary.</div><div class=\"u\">القواميس ثنائية اللغة سريعة بس خطرة؛ قواميس المتعلم بتعلّم الاستخدام الحقيقي؛ قواميس المرادفات بتوسّع المفردات.</div>", "n": 1, "i": 95, "a": "tefl-28-087", "x": "db90c411"}, {"t": "learn", "h": "<div class=\"u\">Phonemic charts fix pronunciation, and experienced colleagues are often the best resource of all.</div><div class=\"u\">الخرايط الصوتية بتلّح النطق، والزملا أصحاب الخبرة غالبًا أحسن مصدر على الإطلاق.</div>", "n": 1, "i": 96, "a": "tefl-28-088", "x": "18a96f90"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 97}, {"t": "mc", "q": "Five pensioners going on a coach trip around the USA should use:<br>خمسة متقاعدين رايحين رحلة أوتوبيس حوالين أمريكا المفروض يستخدموا:", "opts": ["Basic Survival | Basic Survival", "IELTS Masterclass | IELTS Masterclass", "Business Basics | Business Basics"], "ans": 0, "why": "They need travel survival English, not business or exam English. | محتاجين إنجليزية نجاة للسفر، مش إنجليزية بيزنس أو امتحانات.", "ex": ["Correct. | صح.", "No. IELTS Masterclass is for university-entry proficiency. | غلط: IELTS Masterclass لكفاءة دخول الجامعة.", "No. Business Basics is for workers. | غلط: Business Basics للموظفين."], "n": 1, "i": 98, "h": ""}, {"t": "mc", "q": "Students hoping to study at a university in England need:<br>الطلبة الناويين يدرسوا في جامعة في إنجلترا محتاجين:", "opts": ["IELTS Masterclass | IELTS Masterclass", "The children's English Ladder 2 | The children's English Ladder 2", "Basic Survival | Basic Survival"], "ans": 0, "why": "They need a certificate of language proficiency, so an exam book. | محتاجين شهادة كفاءة لغوية، فمحتاجين كتاب امتحان.", "ex": ["Correct. | صح.", "No. That book is for children aged five to eight. | غلط: الكتاب ده لعيال من خمس لتمان سنين.", "No. That book is for travellers. | غلط: الكتاب ده للمسافرين."], "n": 1, "i": 99, "h": ""}, {"t": "tf", "q": "A general English course book is enough to prepare students for a specific exam like IELTS.<br>كتاب الإنجليزية العام كفاية عشان يجهّز الطلبة لامتحان معين زي IELTS.", "ans": false, "why": "False. Exam courses need material that builds the level AND trains the test techniques. | غلط. كورسات الامتحانات محتاجة مادة بتبني المستوى وبتدرّب تقنيات الاختبار.", "ex": ["Wrong. General books do not train exam techniques. | غلط: الكتب العامة مابتدربش تقنيات الامتحان.", "Correct. | صح."], "n": 1, "i": 100, "h": ""}, {"t": "mc", "q": "The best first grammar book for a new teacher is:<br>أحسن أول كتاب قواعد لمدرس جديد هو:", "opts": ["a simplified book for non-native speakers, like Murphy's Grammar in Use | كتاب مبسّط لغير الناطقين، زي Grammar in Use لميرفي", "an advanced grammar book for EFL teachers | كتاب قواعد متقدم لمدرسي الإنجليزية", "a thesaurus | قاموس مرادفات"], "ans": 0, "why": "It is simplified and shows what students need at each level. | هو مبسّط وبيوضح الطلبة محتاجين إيه في كل مستوى.", "ex": ["Correct. | صح.", "No. That comes later, for higher levels. | غلط: ده بييجي بعدين، للمستويات الأعلى.", "No. A thesaurus lists synonyms. | غلط: قاموس المرادفات بيعدّد مرادفات."], "n": 1, "i": 101, "h": ""}, {"t": "mc", "q": "A big disadvantage of bilingual dictionaries is:<br>عيب كبير في القواميس ثنائية اللغة هو:", "opts": ["they can cause mistranslation because not all meanings are listed | ممكن تسبب ترجمة غلط لأن مش كل المعاني مذكورة", "they have no translations | مفيش فيها ترجمات", "they only work online | بتشتغل أونلاين بس"], "ans": 0, "why": "Words like bow have several meanings; a small dictionary may give the wrong one. | كلمات زي bow ليها معاني كتير؛ القاموس الصغير ممكن يدّي الغلط.", "ex": ["Correct. | صح.", "No. Translation is exactly what they do. | غلط: الترجمة هي بالظبط اللي بتعمله.", "No. They exist in print too. | غلط: هي موجودة مطبوعة كمان."], "n": 1, "i": 102, "h": ""}, {"t": "mc", "q": "Learner dictionaries are especially valuable because they:<br>قواميس المتعلم قيّمة خصوصًا لأنها:", "opts": ["give level-appropriate definitions, collocations, and warnings about common mistakes | بتدّي تعريفات مناسبة للمستوى، تلازمات لفظية، وتحذيرات من أخطاء شائعة", "translate every word into the mother tongue | بتحوّل كل كلمة للغة الأم", "list only synonyms | بتعدّد مرادفات بس"], "ans": 0, "why": "They are monolingual dictionaries designed for learners at each level. | هي قواميس أحادية اللغة متصممة للمتعلمين في كل مستوى.", "ex": ["Correct. | صح.", "No. That is a bilingual dictionary. | غلط: ده القاموس ثنائي اللغة.", "No. That is a thesaurus. | غلط: ده قاموس المرادفات."], "n": 1, "i": 103, "h": ""}, {"t": "mc", "q": "The two synonyms of however are:<br>مرادفا however هما:", "opts": ["yet and although | yet وalthough", "announce and proclaim | announce وproclaim", "image and depiction | image وdepiction"], "ans": 0, "why": "From the unit's matching task: consider = bear in mind, think about; picture = image, depiction; declare = announce, proclaim. | من تمرين توصيل الوحدة: consider = bear in mind, think about؛ picture = image, depiction؛ declare = announce, proclaim.", "ex": ["Correct. | صح.", "No. Those are synonyms of declare. | غلط: دول مرادفات declare.", "No. Those are synonyms of picture. | غلط: دول مرادفات picture."], "n": 1, "i": 104, "h": ""}, {"t": "tf", "q": "Experienced colleagues can be the best reference material a teacher has.<br>الزملا أصحاب الخبرة ممكن يكونوا أحسن مادة مرجعية عند المدرس.", "ans": true, "why": "True. They have likely taught the same level before and can warn you about difficulties. | صح. غالبًا درّسوا نفس المستوى قبل كده ويقدروا يحذّروك من الصعوبات.", "ex": ["Correct. | صح.", "Wrong. The unit calls them often the best source of reference. | غلط: الوحدة بتسمّيهم غالبًا أحسن مصدر مرجعي."], "n": 1, "i": 105, "h": ""}, {"t": "recall", "q": "Name four factors to consider when choosing a course book.<br>اذكر أربع عوامل تبص عليها وانت بتختار كتاب مقرر.", "a": "The students' age group, their level, why they are studying English, and whether they will take an exam at the end.<br>الفئة العمرية للطلبة، مستواهم، ليه بيدرسوا إنجليزية، وإذا كان هياخدوا امتحان في الآخر.", "n": 1, "i": 106, "h": ""}, {"t": "recall", "q": "Name the reference materials the unit lists.<br>اذكر المواد المرجعية اللي الوحدة عدّدتها.", "a": "Grammar books, teacher's books, articles in EFL magazines, dictionaries, phonemic charts, and colleagues.<br>كتب القواعد، كتب المدرس، مقالات مجلات تدريس الإنجليزية، القواميس، الخرايط الصوتية، والزملا.", "n": 1, "i": 107, "h": ""}, {"t": "write", "q": "Explain why choosing a course book is not one-size-fits-all (3-4 sentences).<br>اشرح ليه اختيار الكتاب المقرر مش مقاس واحد يناسب الكل (٣-٤ جمل).", "key": "tefl-28:1", "a": "Classes study English for very different reasons: work, travel, school support, or university entry. Each goal needs different content, like business vocabulary or survival English for tourists. Some groups also face a specific exam, which needs its own techniques and practice. So the book must match the learners' age, level, goal, and deadline.<br>الفصول بتدرس إنجليزية لأسباب مختلفة جدًا: شغل، سفر، دعم مدارس، أو دخول جامعة. كل هدف محتاج محتوى مختلف، زي مفردات البيزنس أو إنجليزية النجاة للسواح. بعض المجموعات كمان قدامها امتحان معين، محتاج تقنياته وتمرينه الخاص. فالكتاب لازم يطابق سن المتعلمين ومستواهم وهدفهم وميعادهم.", "n": 1, "i": 108, "h": ""}, {"t": "write", "q": "Compare bilingual and learner dictionaries in two or three sentences.<br>قارن بين القاموس ثنائي اللغة وقاموس المتعلم في جملتين تلاتة.", "key": "tefl-28:2", "a": "A bilingual dictionary is fast: it translates a word into the mother tongue, but it can mistranslate because not every meaning is listed, as with bow. A learner dictionary defines words in simple English, matched to the student's level. It also adds collocations, formality notes, and warnings about common mistakes, so it teaches real usage, not just a translation.<br>القاموس ثنائي اللغة سريع: بيترجم الكلمة للغة الأم، بس ممكن يترجم غلط لأن مش كل المعاني مذكورة، زي bow. قاموس المتعلم بيشرح الكلمات بإنجليزية بسيطة، مناسبة لمستوى الطالب. وكمان بيزوّد تلازمات لفظية وملاحظات رسمية وتحذيرات من أخطاء شائعة، فبيعلّم الاستخدام الحقيقي، مش بس ترجمة.", "n": 1, "i": 109, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: supplementary tasks and teaching aids, the extra materials and tools that support your course book.</div><div class=\"u\">الدرس الجاي: المهام الإضافية والوسايل التعليمية، المواد والأدوات الزيادة اللي بتدعم كتابك المقرر.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 110}];</script>
