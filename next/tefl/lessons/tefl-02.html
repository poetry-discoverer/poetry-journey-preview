<script>window.LESSON_ID="tefl-02";window.STEPS=[{"t": "section", "h": "Why this matters | ليه ده مهم؟", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome back. In this lesson, we compare English with the languages your students already know. This is Module 1, Unit 1, part 2.</div><div class=\"u\">أهلًا بيك تاني. في الدرس ده، هنقارن الإنجليزي باللغات اللي طلابك بيعرفوها. ده الموديول الأولاني، الوحدة الأولى، الجزء التاني.</div>", "n": 1, "i": 1, "a": "tefl-02-001", "x": "fec64407"}, {"t": "learn", "h": "<div class=\"u\">Your students' first language will be different from English in structure, grammar, and vocabulary. Never assume their language works like English; that mistake causes confusion in your classroom.</div><div class=\"u\">اللغة الأولى لطلابك هتختلف عن الإنجليزي في التركيب والقواعد والكلمات. متفترضش أبدًا إن لغتهم شغالة زي الإنجليزي؛ الغلطة دي بتعمل لخبطة في فصلك.</div>", "n": 1, "i": 2, "a": "tefl-02-002", "x": "6f14e93b"}, {"t": "learn", "h": "<div class=\"u\">This is an awareness session. You don't need to memorize it all unless you will teach Spanish or Chinese students.</div><div class=\"u\">دي جلسة وعي بس. مش لازم تحفظها كلها إلا لو هتدرّس لطلاب إسباني أو صيني.</div>", "n": 1, "i": 3, "a": "tefl-02-003", "x": "f3c1300c"}, {"t": "learn", "h": "<div class=\"u\">The key point: all languages are different. Learn a little about your students' language to pick the right teaching strategy.</div><div class=\"u\">الفكرة الأساسية: كل اللغات مختلفة. اتعلّم شوية عن لغة طلابك عشان تختار طريقة التدريس الصح.</div>", "n": 1, "i": 4, "a": "tefl-02-004", "x": "6ca08289"}, {"t": "learn", "h": "<div class=\"u\">You don't need to speak or write your students' language. But knowing the key differences between their language and English helps you so much.</div><div class=\"u\">مش لازم تتكلم أو تكتب لغة طلابك. بس معرفة الفروق المهمة بين لغتهم والإنجليزي بيساعدك جدًا.</div>", "n": 1, "i": 5, "a": "tefl-02-005", "x": "860b9ede"}, {"t": "learn", "h": "<div class=\"u\">Imagine you teach Spanish or Chinese students. What differences do you keep in mind from day 1?</div><div class=\"u\">تخيّل إنك بتدرّس لطلاب إسباني أو صيني. إيه الفروق اللي لازم تبقى في بالك من أول يوم؟</div>", "n": 1, "i": 6, "a": "tefl-02-006", "x": "1f7e102f"}, {"t": "learn", "h": "<div class=\"u\">Remember: these are general observations from TEFL experience. Individual students can be different.</div><div class=\"u\">افتكر: دي ملاحظات عامة من خبرة تدريس TEFL. وكل طالب ممكن يكون مختلف.</div>", "n": 1, "i": 7, "a": "tefl-02-007", "x": "a228028e"}, {"t": "section", "h": "Spanish students 1 | طلاب الإسباني (١-٤)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">1) Gender and articles. In Spanish, every noun has a gender, masculine or feminine. In English we just use a, an, and the.</div><div class=\"u\">١) النوع والأدوات. في الإسباني، كل اسم ليه نوع، مذكر أو مؤنث. في الإنجليزي بنستخدم a وan وthe وبس.</div>", "n": 1, "i": 9, "a": "tefl-02-008", "x": "0b9ff302"}, {"t": "learn", "h": "<div class=\"u\">Examples: a boy is un niño, a girl is una niña, the boy is el niño, the girl is la niña. And Spanish has no word like it for things.</div><div class=\"u\">أمثلة: a boy يعني un niño، وa girl يعني una niña، وthe boy يعني el niño، وthe girl يعني la niña. والإسباني مفيهوش كلمة زي it للحاجات.</div>", "n": 1, "i": 10, "a": "tefl-02-009", "x": "3664ea49"}, {"t": "learn", "h": "<div class=\"u\">Spanish also adds the where English uses nothing: Cars are a hassle is Los coches son una molestia, and Mr. Smith is here is El Sr. Smith está aquí.</div><div class=\"u\">الإسباني كمان بيضيف ال في حالات الإنجليزي مبيستخدمش فيها أدوات: Cars are a hassle بتبقى Los coches son una molestia، وMr. Smith is here بتبقى El Sr. Smith está aquí.</div>", "n": 1, "i": 11, "a": "tefl-02-010", "x": "a715ee66"}, {"t": "learn", "h": "<div class=\"u\">2) Sound and spelling. In Spanish, words are spelled as they sound, and they sound as they are spelled. In English, there is little match between sound and spelling.</div><div class=\"u\">٢) النطق والهجاء. في الإسباني، الكلمات بتتكتب زي ما بتتنطق، وبتتنطق زي ما بتتكتب. في الإنجليزي، مفيش تطابق يذكر بين النطق والهجاء.</div>", "n": 1, "i": 12, "a": "tefl-02-011", "x": "f32dc2ac"}, {"t": "learn", "h": "<div class=\"u\">3) Vowel sounds. Spanish has fewer vowel sounds than English, and vowel length is not important there. In English there are many vowel sounds, and length changes the word.</div><div class=\"u\">٣) أصوات الحروف المتحركة. الإسباني فيه أصوات متحركة أقل من الإنجليزي، وطول الصوت مش مهم هناك. في الإنجليزي أصوات متحركة كتير، وطول الصوت بيغيّر الكلمة.</div>", "n": 1, "i": 13, "a": "tefl-02-012", "x": "eb4109e8"}, {"t": "learn", "h": "<div class=\"u\">So Spanish learners first cannot hear the difference, and then cannot say it. Word pairs like ship and sheep, fool and full, cat and cut, beat and bit get confused.</div><div class=\"u\">عشان كده الطالب الإسباني في الأول مش بيسمع الفرق، وبعدها مبيعرفش ينطقه. أزواج زي ship وsheep، وfool وfull، وcat وcut، وbeat وbit بتتلخبط عليه.</div>", "n": 1, "i": 14, "a": "tefl-02-013", "x": "6ede1f55"}, {"t": "learn", "h": "<div class=\"u\">4) Consonant sounds. Spanish speakers often mix up v and b. They also confuse the first sounds of yacht, jeep, and cheap. And some find final sounds hard, like thing and think.</div><div class=\"u\">٤) الأصوات الساكنة. الإسبان بيلخبطوا بين v وb. وبيلخبطوا كمان في أول كلمات yacht وjeep وcheap. وبعضهم بيلاقي الأصوات الأخيرة صعبة، زي thing وthink.</div>", "n": 1, "i": 15, "a": "tefl-02-014", "x": "687ac4f4"}, {"t": "section", "h": "Spanish students 2 | طلاب الإسباني (٥-٨)", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">5) The s sound. Spanish words do not start with an s sound before another consonant. So learners add an e sound: I come from Espain, or I went to eschool in Barcelona.</div><div class=\"u\">٥) صوت s. الكلمات الإسبانية مبتبدأش بصوت s قبل ساكن تاني. فالمتعلمين بيضيفوا صوت e: يقولوا I come from Espain، أو I went to eschool in Barcelona.</div>", "n": 1, "i": 17, "a": "tefl-02-015", "x": "6184a6bc"}, {"t": "learn", "h": "<div class=\"u\">6) Consonant clusters. These are groups of consonants with no vowel between them, like split. English has many more of them than Spanish.</div><div class=\"u\">٦) التجمعات الساكنة. دي مجموعات صوامت مفيش بينها صوت متحرك، زي split. الإنجليزي فيه منها أكتر بكتير من الإسباني.</div>", "n": 1, "i": 18, "a": "tefl-02-016", "x": "6f21a070"}, {"t": "learn", "h": "<div class=\"u\">Facing a cluster, learners may add a vowel or a syllable, like ad-vance-ed. Or they swallow a sound, so next becomes nes.</div><div class=\"u\">قدام التجمع الساكن، المتعلم ممكن يضيف صوت متحرك أو مقطع زيادة، زي ad-vance-ed. أو يبلع صوت، فـnext تبقى nes.</div>", "n": 1, "i": 19, "a": "tefl-02-017", "x": "572fc383"}, {"t": "learn", "h": "<div class=\"u\">Remember: a syllable is a part of a word said with one uninterrupted sound.</div><div class=\"u\">افتكر: المقطع هو جزء من الكلمة بيتقال بصوت واحد متواصل.</div>", "n": 1, "i": 20, "a": "tefl-02-018", "x": "097e3926"}, {"t": "learn", "h": "<div class=\"u\">7) Rhythm. Spanish is a syllable-timed language: every syllable gets equal time.</div><div class=\"u\">٧) الإيقاع. الإسباني لغة مقطعية الإيقاع: كل مقطع بياخد نفس الوقت.</div>", "n": 1, "i": 21, "a": "tefl-02-019", "x": "6f9bf321"}, {"t": "learn", "h": "<div class=\"u\">English is a stress-timed language: the stressed beats come at regular times, and the small syllables get squashed between them.</div><div class=\"u\">الإنجليزي لغة نَبْرية الإيقاع: النبرات بتيجي في أوقات منتظمة، والمقاطع الصغيرة بتتداس بينهم.</div>", "n": 1, "i": 22, "a": "tefl-02-020", "x": "ba512fc1"}, {"t": "learn", "h": "<div class=\"u\">So Spanish learners can sound flat and robotic in English, and native listeners miss the important words.</div><div class=\"u\">عشان كده الطالب الإسباني ممكن صوته يطلع مسطح وآلي في الإنجليزي، والمستمع الأصلي مش بيلقط الكلمات المهمة.</div>", "n": 1, "i": 23, "a": "tefl-02-021", "x": "e1a10ed9"}, {"t": "learn", "h": "<div class=\"u\">Example: The Beatles were bigger than Elvis. In English you stress BEAT, BIG, and EL. In Spanish style, every syllable takes equal time.</div><div class=\"u\">مثال: The Beatles were bigger than Elvis. في الإنجليزي بتنبّر على BEAT وBIG وEL. بالطريقة الإسبانية، كل مقطع بياخد نفس الوقت.</div>", "n": 1, "i": 24, "a": "tefl-02-022", "x": "ab43655a"}, {"t": "learn", "h": "<div class=\"u\">Fixing this flat intonation is very important, especially in formal situations where clarity matters.</div><div class=\"u\">تصليح النبرة المسطحة دي مهم جدًا، خصوصًا في المواقف الرسمية اللي الوضوح فيها أساسي.</div>", "n": 1, "i": 25, "a": "tefl-02-023", "x": "cbcd30b6"}, {"t": "learn", "h": "<div class=\"u\">8) Dropped pronouns. In Spanish, speakers often drop the subject pronoun, because the verb ending shows who they mean.</div><div class=\"u\">٨) الضمائر المحذوفة. في الإسباني، المتكلمين بيحذفوا ضمير الفاعل كتير، لأن تصريف الفعل بيبيّن مين المقصود.</div>", "n": 1, "i": 26, "a": "tefl-02-024", "x": "95b2240a"}, {"t": "learn", "h": "<div class=\"u\">This moves into their English. You may hear: Came with me to the train station, meaning He or She came with me. Or: Is Carlos here? Yes. Is here.</div><div class=\"u\">وده بينتقل لإنجليزيهم. ممكن تسمع: Came with me to the train station، وقصده He أو She came with me. أو: Is Carlos here? Yes. Is here.</div>", "n": 1, "i": 27, "a": "tefl-02-025", "x": "fa59c2be"}, {"t": "section", "h": "Spanish students 3 | طلاب الإسباني (٩-١٢)", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">9) Word order. Everyday English keeps one order: subject, verb, object. Spanish allows more variations for the same meaning.</div><div class=\"u\">٩) ترتيب الكلام. الإنجليزي اليومي بيحافظ على ترتيب واحد: فاعل، فعل، مفعول. الإسباني بيسمح بترتيبات أكتر لنفس المعنى.</div>", "n": 1, "i": 29, "a": "tefl-02-026", "x": "4a01e04c"}, {"t": "learn", "h": "<div class=\"u\">Three Spanish ways to say Carlos wrote the letter. One: Carlos escribió la carta, subject verb object, very common, same as English.</div><div class=\"u\">٣ طرق إسبانية لجملة Carlos wrote the letter. واحدة: Carlos escribió la carta، فاعل فعل مفعول، شائعة جدًا وزي الإنجليزي.</div>", "n": 1, "i": 30, "a": "tefl-02-027", "x": "78797142"}, {"t": "learn", "h": "<div class=\"u\">Two: Escribió Carlos la carta, verb subject object, common in Spanish but not everyday English.</div><div class=\"u\">اتنين: Escribió Carlos la carta، فعل فاعل مفعول، شائعة في الإسباني بس مش في الإنجليزي اليومي.</div>", "n": 1, "i": 31, "a": "tefl-02-028", "x": "3b8819ab"}, {"t": "learn", "h": "<div class=\"u\">Three: La carta la escribió Carlos, less common, but used. So word-order mistakes in English are easy to make.</div><div class=\"u\">تلاتة: La carta la escribió Carlos، أقل شيوعًا بس بتتستخدم. فواضح إن غلطات ترتيب الكلام في الإنجليزي سهلة الحدوث.</div>", "n": 1, "i": 32, "a": "tefl-02-029", "x": "ef9feb79"}, {"t": "learn", "h": "<div class=\"u\">10) Prepositions. English has many prepositions, more than many languages. Most of them have several meanings, and many are one short syllable, so they are hard to hear in fast speech.</div><div class=\"u\">١٠) حروف الجر. الإنجليزي فيه حروف جر كتير، أكتر من لغات كتير. أغلبها ليه معاني متعددة، وكتير منها مقطع واحد قصير، فصعب يتسمع في الكلام السريع.</div>", "n": 1, "i": 33, "a": "tefl-02-030", "x": "1c5e641c"}, {"t": "learn", "h": "<div class=\"u\">Learners cannot rely on their first language here. The Spanish word por can be by, for, during, or through in English. You can see the room for error.</div><div class=\"u\">المتعلم ميعرفش يعتمد على لغته هنا. كلمة por الإسبانية ممكن تبقى by أو for أو during أو through في الإنجليزي. شايف قد إيه فيه مجال للغلط.</div>", "n": 1, "i": 34, "a": "tefl-02-031", "x": "66e95f9a"}, {"t": "learn", "h": "<div class=\"u\">11) Adjectives. In English, the adjective usually comes before the noun. In Spanish it usually comes after the noun, though some come before.</div><div class=\"u\">١١) الصفات. في الإنجليزي، الصفة بتيجي قبل الاسم في الغالب. في الإسباني بتيجي بعد الاسم في الغالب، مع إن فيه صفات بتيجي قبله.</div>", "n": 1, "i": 35, "a": "tefl-02-032", "x": "ced7cec0"}, {"t": "learn", "h": "<div class=\"u\">Spanish adjectives also have gender and plural forms.</div><div class=\"u\">وصفات الإسباني كمان ليها مذكر ومؤنث وجمع.</div>", "n": 1, "i": 36, "a": "tefl-02-033", "x": "ef6b5d49"}, {"t": "learn", "h": "<div class=\"u\">12) Possession. English has two ways: the possessive apostrophe, like the boy's book, and the of construction.</div><div class=\"u\">١٢) الملكية. الإنجليزي فيه طريقتين: الفاصلة الملكية، زي the boy's book، وتركيب of.</div>", "n": 1, "i": 37, "a": "tefl-02-034", "x": "f37b380b"}, {"t": "learn", "h": "<div class=\"u\">Spanish uses only the of construction. The possessive apostrophe is hard even for native English writers, so imagine Spanish learners.</div><div class=\"u\">الإسباني بيستخدم تركيب of بس. الفاصلة الملكية صعبة حتى على الكتّاب الإنجليز الأصليين، فتخيّل طلاب الإسباني.</div>", "n": 1, "i": 38, "a": "tefl-02-035", "x": "7423f6e9"}, {"t": "section", "h": "Chinese students | طلاب الصيني", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">Now Chinese students. 1) Different writing systems. Chinese uses a logographic system: symbols stand for words and ideas. English uses an alphabetic system: letters stand for sounds.</div><div class=\"u\">دلوقتي طلاب الصيني. ١) أنظمة كتابة مختلفة. الصيني بيستخدم نظام رمزي: الرموز بتعبّر عن كلمات وأفكار. الإنجليزي بيستخدم نظام ألفبائي: الحروف بتعبّر عن أصوات.</div>", "n": 1, "i": 40, "a": "tefl-02-036", "x": "8f2a4721"}, {"t": "learn", "h": "<div class=\"u\">Some Chinese learners know pinyin, a way of writing Mandarin with Latin letters. But pinyin is phonetic, and its sound-to-letter match differs from English in many places.</div><div class=\"u\">بعض المتعلمين الصينيين عارفين pinyin، وهي طريقة لكتابة الماندرين بالحروف اللاتينية. بس pinyin نظام صوتي، وتطابق الصوت بالحرف فيه مختلف عن الإنجليزي في حاجات كتير.</div>", "n": 1, "i": 41, "a": "tefl-02-037", "x": "f146c871"}, {"t": "learn", "h": "<div class=\"u\">2) No cognates. Cognates are words in two languages that share a history, so they look and mean alike. Spanish learners have many of them as a big advantage. Chinese learners do not.</div><div class=\"u\">٢) مفيش كلمات شقيقة. الكلمات الشقيقة هي كلمات في لغتين ليها أصل واحد، فشكلها ومعناها متقارب. طلاب الإسباني عندهم منها كتير ودي ميزة كبيرة. طلاب الصيني لأ.</div>", "n": 1, "i": 42, "a": "tefl-02-038", "x": "e0454aa7"}, {"t": "learn", "h": "<div class=\"u\">Also, the Chinese vocabulary has very few words borrowed from English.</div><div class=\"u\">وكمان، قاموس الصيني فيه كلمات قليلة جدًا مأخوذة من الإنجليزي.</div>", "n": 1, "i": 43, "a": "tefl-02-039", "x": "2ce1b753"}, {"t": "learn", "h": "<div class=\"u\">3) Rhythm again. Mandarin is syllable-timed, like Spanish, and English is stress-timed. So Chinese learners have the same flat-speech difficulty as Spanish learners.</div><div class=\"u\">٣) الإيقاع تاني. الماندرين مقطعية الإيقاع زي الإسباني، والإنجليزي نَبْري. فطلاب الصيني عندهم نفس مشكلة الكلام المسطح اللي عند طلاب الإسباني.</div>", "n": 1, "i": 44, "a": "tefl-02-040", "x": "59c23a43"}, {"t": "learn", "h": "<div class=\"u\">4) An uninflected language. English shows meaning with helping verbs and verb changes: is, are, were, and eat, eats, ate, eaten.</div><div class=\"u\">٤) لغة غير مصرّفة. الإنجليزي بيوضّح المعنى بأفعال مساعدة وتغييرات في الفعل: is وare وwere، وeat وeats وate وeaten.</div>", "n": 1, "i": 45, "a": "tefl-02-041", "x": "f9748661"}, {"t": "learn", "h": "<div class=\"u\">Chinese words do not change. Meaning comes from word order, context, and adverbials.</div><div class=\"u\">كلمات الصيني مبتتغيرش. المعنى بييجي من ترتيب الكلام والسياق والظروف.</div>", "n": 1, "i": 46, "a": "tefl-02-042", "x": "66a20ba3"}, {"t": "learn", "h": "<div class=\"u\">5) Final consonants. Mandarin allows only three consonant sounds at the end of a syllable.</div><div class=\"u\">٥) الصوامت الأخيرة. الماندرين بيسمح ب٣ أصوات ساكنة بس في آخر المقطع.</div>", "n": 1, "i": 47, "a": "tefl-02-043", "x": "e1b4af91"}, {"t": "learn", "h": "<div class=\"u\">So English words ending in any other sound are very hard for Chinese learners, and the final consonant is often dropped.</div><div class=\"u\">فالكلمات الإنجليزية اللي بتنتهي بأي صوت تاني صعبة جدًا على المتعلم الصيني، والساكن الأخير غالبًا بيتحذف.</div>", "n": 1, "i": 48, "a": "tefl-02-044", "x": "7a6fbb66"}, {"t": "learn", "h": "<div class=\"u\">6) Other common difficulties. Chinese learners may confuse l and r, so rake becomes lake and rice becomes lice.</div><div class=\"u\">٦) صعوبات تانية شائعة. المتعلم الصيني ممكن يلخبط بين l وr، فـrake تبقى lake وrice تبقى lice.</div>", "n": 1, "i": 49, "a": "tefl-02-045", "x": "eca0fe29"}, {"t": "learn", "h": "<div class=\"u\">New sounds are hard, like v, so very becomes wery. And they may say every syllable too clearly, because Chinese words have one syllable each.</div><div class=\"u\">الأصوات الجديدة صعبة، زي v، فـvery تبقى wery. وممكن ينطقوا كل مقطع بوضوح زيادة، لأن كلمات الصيني كل واحدة مقطع واحد.</div>", "n": 1, "i": 50, "a": "tefl-02-046", "x": "f516b6c7"}, {"t": "learn", "h": "<div class=\"u\">They also place time and place phrases at the end of the sentence, which Chinese never does. They may confuse he and she, because both sound the same in Chinese.</div><div class=\"u\">وبيحطوا ظروف الزمان والمكان في آخر الجملة، وده الصيني مبيعملوش أبدًا. وممكن يلخبطوا بين he وshe، لأنهم بنفس النطق في الصيني.</div>", "n": 1, "i": 51, "a": "tefl-02-047", "x": "33595a32"}, {"t": "learn", "h": "<div class=\"u\">And they may drop the verb to be before an adjective, saying He sad, and drop articles, because Chinese has none.</div><div class=\"u\">وممكن يحذفوا فعل الكينونة قبل الصفة، فيقولوا He sad، ويحذفوا الأدوات، لأن الصيني مفيهوش أدوات.</div>", "n": 1, "i": 52, "a": "tefl-02-048", "x": "3c7b1415"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 53}, {"t": "learn", "h": "<div class=\"u\">Key terms. Syllable: a part of a word said with one uninterrupted sound. Consonant cluster: consonants together with no vowel between them.</div><div class=\"u\">مصطلحات الدرس. Syllable: مقطع، جزء من الكلمة بيتقال بصوت واحد متواصل. Consonant cluster: تجمع ساكن، صوامت ورا بعض من غير صوت متحرك بينهم.</div>", "n": 1, "i": 54, "a": "tefl-02-049", "x": "39b25d1f"}, {"t": "learn", "h": "<div class=\"u\">Syllable-timed language: every syllable gets equal time. Stress-timed language: stressed beats come at regular times.</div><div class=\"u\">Syllable-timed language: لغة مقطعية الإيقاع، كل مقطع بياخد نفس الوقت. Stress-timed language: لغة نَبْرية، النبرات بتيجي في أوقات منتظمة.</div>", "n": 1, "i": 55, "a": "tefl-02-050", "x": "19667430"}, {"t": "learn", "h": "<div class=\"u\">Cognates: words in two languages with a shared history. Logographic system: symbols stand for words. Pinyin: Mandarin written in Latin letters.</div><div class=\"u\">Cognates: كلمات شقيقة ليها أصل واحد في لغتين. Logographic system: نظام رمزي، الرموز بتعبّر عن كلمات. Pinyin: الماندرين مكتوبة بالحروف اللاتينية.</div>", "n": 1, "i": 56, "a": "tefl-02-051", "x": "be3c176d"}, {"t": "learn", "h": "<div class=\"u\">Uninflected language: words do not change form; meaning comes from order and context. Adverbials: words or phrases of time, place, and manner.</div><div class=\"u\">Uninflected language: لغة غير مصرّفة، كلماتها مبتتغيرش والمعنى من الترتيب والسياق. Adverbials: ظروف زمان ومكان وطريقة.</div>", "n": 1, "i": 57, "a": "tefl-02-052", "x": "6dbdbcba"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 58}, {"t": "learn", "h": "<div class=\"u\">Summary for Spanish learners, part 1. Gender and extra articles, v and b confusion, an added e before s, consonant clusters, and flat rhythm.</div><div class=\"u\">خلاصة طلاب الإسباني، جزء ١. النوع والأدوات الزيادة، لخبطة v وb، e زيادة قبل s، التجمعات الساكنة، والإيقاع المسطح.</div>", "n": 1, "i": 59, "a": "tefl-02-053", "x": "e29f9c6f"}, {"t": "learn", "h": "<div class=\"u\">Part 2. Dropped pronouns, flexible word order, tricky prepositions like por, adjectives after nouns, and no possessive apostrophe.</div><div class=\"u\">جزء ٢. الضمائر المحذوفة، ترتيب كلام مرن، حروف جر صعبة زي por، صفة بعد الاسم، ومفيش فاصلة ملكية.</div>", "n": 1, "i": 60, "a": "tefl-02-054", "x": "b33eec1f"}, {"t": "learn", "h": "<div class=\"u\">Summary for Chinese learners, part 1. A totally different writing system, no cognates, flat rhythm, and a language with no word changes.</div><div class=\"u\">خلاصة طلاب الصيني، جزء ١. نظام كتابة مختلف تمامًا، مفيش كلمات شقيقة، إيقاع مسطح، ولغة كلماتها مبتتغيرش.</div>", "n": 1, "i": 61, "a": "tefl-02-055", "x": "cabd3fcb"}, {"t": "learn", "h": "<div class=\"u\">Part 2. Dropped final consonants, l and r and v problems, he and she confusion, and missing to be and articles.</div><div class=\"u\">جزء ٢. صوامت أخيرة بتتحذف، مشاكل l وr وv، لخبطة he وshe، وفعل الكينونة والأدوات الناقصة.</div>", "n": 1, "i": 62, "a": "tefl-02-056", "x": "74cdf0be"}, {"t": "learn", "h": "<div class=\"u\">The big idea: every language is different. Learn about your students' first language from day 1.</div><div class=\"u\">الفكرة الكبيرة: كل لغة مختلفة. اتعلّم عن اللغة الأولى لطلابك من أول يوم.</div>", "n": 1, "i": 63, "a": "tefl-02-057", "x": "e15d0713"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 64}, {"t": "mc", "q": "In Spanish, every noun has:<br>في الإسباني، كل اسم ليه:", "opts": ["A gender | نوع (مذكر/مؤنث)", "A tone | نغمة", "An apostrophe | فاصلة ملكية"], "ans": 0, "why": "All Spanish nouns are masculine or feminine. | كل الأسماء الإسبانية مذكرة أو مؤنثة.", "ex": ["Correct. | صح.", "No. Spanish is not tonal. | غلط: الإسباني مش نغمي.", "No. Spanish has no possessive apostrophe. | غلط: الإسباني مفيهوش فاصلة ملكية."], "n": 1, "i": 65, "h": ""}, {"t": "tf", "q": "Spanish words are usually spelled exactly as they sound.<br>الكلمات الإسبانية بتتكتب زي ما بتتنطق بالظبط.", "ans": true, "why": "Sound and spelling match in Spanish; in English they often do not. | النطق والهجاء متطابقين في الإسباني؛ في الإنجليزي كتير لأ.", "ex": ["Correct. | صح.", "Wrong. Spanish spelling matches sound. | غلط: الهجاء الإسباني مطابق للنطق."], "n": 1, "i": 66, "h": ""}, {"t": "tf", "q": "A Spanish learner may say Espain because Spanish words do not start with an s sound before another consonant.<br>الطالب الإسباني ممكن يقول Espain لأن الكلمات الإسبانية مبتبدأش بصوت s قبل ساكن تاني.", "ans": true, "why": "They add an e sound at the start: Espain, eschool. | بيضيفوا صوت e في الأول: Espain وeschool.", "ex": ["Correct. | صح.", "Wrong. That is exactly what happens. | غلط: ده بالظبط اللي بيحصل."], "n": 1, "i": 67, "h": ""}, {"t": "mc", "q": "English is a ___-timed language.<br>الإنجليزي لغة ___ الإيقاع.", "opts": ["stress | نَبْرية", "syllable | مقطعية", "tone | نغمية"], "ans": 0, "why": "English stresses come at regular times; Spanish and Chinese give each syllable equal time. | نبرات الإنجليزي منتظمة؛ الإسباني والصيني بيدّوا كل مقطع نفس الوقت.", "ex": ["Correct. | صح.", "No. That is Spanish and Chinese. | غلط: دي الإسباني والصيني.", "No. | غلط."], "n": 1, "i": 68, "h": ""}, {"t": "tf", "q": "A Spanish learner may say Is here instead of He is here, because Spanish often drops subject pronouns.<br>الطالب الإسباني ممكن يقول Is here بدل He is here، لأن الإسباني بيحذف ضمير الفاعل كتير.", "ans": true, "why": "The Spanish verb ending shows who, so the pronoun is dropped, and this moves into English. | تصريف الفعل الإسباني بيبيّن مين، فالضمير بيتحذف، وده بينتقل للإنجليزي.", "ex": ["Correct. | صح.", "Wrong. Spanish drops subject pronouns. | غلط: الإسباني بيحذف ضمير الفاعل."], "n": 1, "i": 69, "h": ""}, {"t": "mc", "q": "In Spanish, the adjective usually comes:<br>في الإسباني، الصفة بتيجي في الغالب:", "opts": ["after the noun | بعد الاسم", "before the noun | قبل الاسم", "inside the noun | جوه الاسم"], "ans": 0, "why": "English: adjective before noun. Spanish: usually after, with gender and plural forms. | الإنجليزي: الصفة قبل الاسم. الإسباني: بعده في الغالب، وليها مذكر ومؤنث وجمع.", "ex": ["Correct. | صح.", "No. That is English. | غلط: ده الإنجليزي.", "No. | غلط."], "n": 1, "i": 70, "h": ""}, {"t": "tf", "q": "Spanish uses the possessive apostrophe just like English.<br>الإسباني بيستخدم الفاصلة الملكية زي الإنجليزي بالظبط.", "ans": false, "why": "Spanish only uses the of construction. | الإسباني بيستخدم تركيب of بس.", "ex": ["Wrong. Only the of construction exists in Spanish. | غلط: الإسباني فيه تركيب of بس.", "Correct. | صح."], "n": 1, "i": 71, "h": ""}, {"t": "tf", "q": "Chinese learners can lean on many cognates to guess English words.<br>طلاب الصيني يقدروا يعتمدوا على كلمات شقيقة كتير عشان يخمّنوا كلمات الإنجليزي.", "ans": false, "why": "Chinese and English share almost no cognates; Spanish and English share many. | الصيني والإنجليزي مفيهومش كلمات شقيقة تقريبًا؛ الإسباني والإنجليزي فيهم كتير.", "ex": ["Wrong. Chinese has almost no cognates with English. | غلط: الصيني مفيهوش كلمات شقيقة مع الإنجليزي تقريبًا.", "Correct. | صح."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "How many consonant sounds can end a syllable in Mandarin?<br>كام صوت ساكن يقدر ييجي في آخر المقطع في الماندرين؟", "opts": ["3 | ٣", "10 | ١٠", "26 | ٢٦"], "ans": 0, "why": "Only three, so Chinese learners often drop other final consonants in English. | ٣ بس، عشان كده المتعلم الصيني غالبًا بيحذف الصوامت الأخيرة التانية في الإنجليزي.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 1, "i": 73, "h": ""}, {"t": "tf", "q": "Chinese learners may confuse he and she because both sound the same in Chinese.<br>طلاب الصيني ممكن يلخبطوا بين he وshe لأنهم بنفس النطق في الصيني.", "ans": true, "why": "Same pronunciation in Chinese, so the difference is new to them. | نفس النطق في الصيني، فالفرق جديد عليهم.", "ex": ["Correct. | صح.", "Wrong. They sound identical in Chinese. | غلط: نطقهم واحد في الصيني."], "n": 1, "i": 74, "h": ""}, {"t": "recall", "q": "Name 4 problems Spanish learners have with English.<br>اذكر ٤ مشاكل بتقابل طلاب الإسباني في الإنجليزي.", "a": "Any 4: gender and extra articles, v and b confusion, added e before s, consonant clusters, flat syllable-timed rhythm, dropped pronouns, flexible word order, prepositions like por, adjectives after nouns, no possessive apostrophe.<br>أي ٤: النوع والأدوات الزيادة، لخبطة v وb، e زيادة قبل s، التجمعات الساكنة، الإيقاع المقطعي المسطح، الضمائر المحذوفة، ترتيب كلام مرن، حروف جر زي por، صفة بعد الاسم، مفيش فاصلة ملكية.", "n": 1, "i": 75, "h": ""}, {"t": "recall", "q": "Name 3 problems Chinese learners have with English.<br>اذكر ٣ مشاكل بتقابل طلاب الصيني في الإنجليزي.", "a": "Any 3: logographic writing, no cognates, syllable-timed rhythm, uninflected language, dropped final consonants, l and r and v problems, he and she confusion, missing to be, missing articles.<br>أي ٣: الكتابة الرمزية، مفيش كلمات شقيقة، إيقاع مقطعي، لغة غير مصرّفة، صوامت أخيرة بتتحذف، مشاكل l وr وv، لخبطة he وshe، فعل الكينونة الناقص، الأدوات الناقصة.", "n": 1, "i": 76, "h": ""}, {"t": "write", "q": "Explain syllable-timed and stress-timed languages and the problem this causes (3-4 sentences).<br>اشرح اللغات المقطعية والنَبْرية الإيقاع والمشكلة اللي بتعملها (٣-٤ جمل).", "key": "tefl-02:1", "a": "In a syllable-timed language like Spanish or Chinese, every syllable gets equal time. English is stress-timed: stressed beats come at regular times and small syllables get squashed between them. So these learners can sound flat and robotic in English, and listeners miss the important words. Fixing this matters a lot in formal situations.<br>في اللغة المقطعية زي الإسباني والصيني، كل مقطع بياخد نفس الوقت. الإنجليزي نَبْري: النبرات بتيجي في أوقات منتظمة والمقاطع الصغيرة بتتداس بينهم. فالمتعلمين دول ممكن صوتهم يطلع مسطح وآلي في الإنجليزي، والمستمع مش بيلقط الكلمات المهمة. وتصليح ده مهم جدًا في المواقف الرسمية.", "n": 1, "i": 77, "h": ""}, {"t": "write", "q": "Why do Chinese learners often drop final consonants and articles in English? (3-4 sentences)<br>ليه طلاب الصيني غالبًا بيحذفوا الصوامت الأخيرة والأدوات في الإنجليزي؟ (٣-٤ جمل)", "key": "tefl-02:2", "a": "Mandarin allows only three consonant sounds at the end of a syllable, so other final sounds are new and hard, and learners drop them. Also, Chinese has no articles like a, an, and the, so learners simply leave them out. Both habits come from the shape of their first language, not from carelessness.<br>الماندرين بيسمح ب٣ أصوات ساكنة بس في آخر المقطع، فالأصوات الأخيرة التانية جديدة وصعبة، والمتعلم بيحذفها. وكمان الصيني مفيهوش أدوات زي a وan وthe، فالمتعلم بيسيبها خالص. العادتين دول جايين من شكل لغتهم الأولى، مش من إهمال.", "n": 1, "i": 78, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: L1 and L2. How does a baby learn its first language, and how is that different from learning a foreign language?</div><div class=\"u\">الدرس الجاي: L1 وL2. إزاي الطفل بيتعلم لغته الأولى؟ وإيه الفرق عن تعلم لغة أجنبية؟</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 79}];</script>
