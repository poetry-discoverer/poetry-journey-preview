<h1>عالم تيفل ٥٠: حروف الجر والتعبيرات الاصطلاحية</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٥٠</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-50";window.STEPS=[{"t": "section", "h": "What prepositions are | إيه هي حروف الجر", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Unit two: prepositions. Learning phrasal verbs is the trickiest challenge for learners; prepositions come a close second.</div><div class=\"u\">الوحدة التانية: حروف الجر. تعلّم الأفعال المركبة هو أصعب تحدي للمتعلمين؛ حروف الجر بتيجي وراه مباشرة.</div>", "n": 1, "i": 1, "a": "tefl-50-001", "x": "967fbf3a"}, {"t": "learn", "h": "<div class=\"u\">Many phrasal verbs are built with prepositions, so we can see the link.</div><div class=\"u\">أفعال مركبة كتير متبنية بحروف جر، فنشوف إن في رابط.</div>", "n": 1, "i": 2, "a": "tefl-50-002", "x": "419d0b51"}, {"t": "learn", "h": "<div class=\"u\">The thing about prepositions is that they have few specific characteristics learners can hang on to. It is very difficult to make a solid list of guidelines showing their common features.</div><div class=\"u\">حكاية حروف الجر إنها مالهاش خصائص محددة كتير المتعلمين يتمسّكوا فيها. صعب جدًا تعمل قائمة إرشادات ثابتة بتوضّح سماتها المشتركة.</div>", "n": 1, "i": 3, "a": "tefl-50-003", "x": "494e7e07"}, {"t": "learn", "h": "<div class=\"u\">Many prepositions are very small words but so important in a sentence. The problem is they are used in so many different ways in so many different situations.</div><div class=\"u\">حروف جر كتير كلمات صغيرة جدًا بس مهمة أوي في الجملة. المشكلة إنها بتتستخدم بطرق مختلفة كتير في مواقف مختلفة كتير.</div>", "n": 1, "i": 4, "a": "tefl-50-004", "x": "6c5ee988"}, {"t": "learn", "h": "<div class=\"u\">Prepositions relate a noun or pronoun to another word in the sentence: the book is on the table. Here on is the preposition.</div><div class=\"u\">حروف الجر بتربط اسم أو ضمير بكلمة تانية في الجملة: الكتاب على الترابيزة. هنا على هي حرف الجر.</div>", "n": 1, "i": 5, "a": "tefl-50-005", "x": "6004dd74"}, {"t": "learn", "h": "<div class=\"u\">They join parts of sentences like a bridge and give information such as location and time: I found my book on the table would not make full sense without on.</div><div class=\"u\">بتجمع أجزاء الجمل زي الكوبري وبتدّي معلومات زي المكان والوقت: أنا لقيت كتابي على الترابيزة مابتبقاش مفهومة بالكامل من غير على.</div>", "n": 1, "i": 6, "a": "tefl-50-006", "x": "c403f210"}, {"t": "learn", "h": "<div class=\"u\">The preposition plus its object and any modifiers is called a prepositional phrase: on the table.</div><div class=\"u\">حرف الجر زائد المفعول بتاعه وأي واصفات بتتسمى عبارة جر: على الترابيزة.</div>", "n": 1, "i": 7, "a": "tefl-50-007", "x": "fb76d287"}, {"t": "section", "h": "Features of prepositions | خصائص حروف الجر", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">Common everyday prepositions include: about, above, across, after, against, along, among, around, as, at, before, behind, below, beneath, beside, between.</div><div class=\"u\">حروف الجر اليومية الشائعة بتشمل: عن، فوق، عبر، بعد، ضد، على طول، وسط، حوالين، كـ، في، قبل، ورا، تحت، جنب، بين.</div>", "n": 1, "i": 9, "a": "tefl-50-008", "x": "7a2d5639"}, {"t": "learn", "h": "<div class=\"u\">Also: but, by, despite, during, except, for, from, in, inside, into, like, near, of, off, on, over, past, round, since.</div><div class=\"u\">وكمان: لكن، بواسطة، رغم، أثناء، ما عدا، لـ، من، جوه، لجوه، زي، قريب من، بتاع، بعيد، على، فوق، بعد، حوالين، منذ.</div>", "n": 1, "i": 10, "a": "tefl-50-009", "x": "13879815"}, {"t": "learn", "h": "<div class=\"u\">And: through, throughout, till, to, towards, under, underneath, until, up, upon, with, within, without.</div><div class=\"u\">وكمان: خلال، طوال، لحد، لـ، ناحية، تحت، لحد، لفوق، على، مع، جوه، من غير.</div>", "n": 1, "i": 11, "a": "tefl-50-010", "x": "d9089fdf"}, {"t": "learn", "h": "<div class=\"u\">Feature one: prepositions usually come before a noun. The noun need not come immediately after; determiners or adjectives can sit in between.</div><div class=\"u\">الخاصية الأولى: حروف الجر عادة بتيجي قبل الاسم. مش لازم الاسم ييجي بعدها على طول؛ أدوات التعريف أو الصفات ممكن تقعد في النص.</div>", "n": 1, "i": 12, "a": "tefl-50-011", "x": "3428bb35"}, {"t": "learn", "h": "<div class=\"u\">For example: after the match, on big ships, under the old system.</div><div class=\"u\">مثال: بعد الماتش، على سفن كبيرة، تحت النظام القديم.</div>", "n": 1, "i": 13, "a": "tefl-50-012", "x": "06324845"}, {"t": "learn", "h": "<div class=\"u\">But some sentences strand the preposition after the noun. These are called stranded prepositions: this is what I was talking about. Where does haggis come from? It's a problem I just have to live with.</div><div class=\"u\">بس بعض الجمل بتسيّب حرف الجر بعد الاسم. دي بتتسمى حروف الجر المعلّقة: ده اللي كنت بتكلم عنه. الهاجيس بييجي منين؟ دي مشكلة لازم أعيش معاها.</div>", "n": 1, "i": 14, "a": "tefl-50-013", "x": "aedb7295"}, {"t": "learn", "h": "<div class=\"u\">Feature two: complex prepositions, those with more than one word, also come before the noun: according to the BBC, on behalf of the company.</div><div class=\"u\">الخاصية التانية: حروف الجر المركبة، اللي فيها أكتر من كلمة، كمان بتيجي قبل الاسم: وفقًا للبي بي سي، نيابة عن الشركة.</div>", "n": 1, "i": 15, "a": "tefl-50-014", "x": "a551ddf9"}, {"t": "learn", "h": "<div class=\"u\">One-word prepositions are called simple prepositions.</div><div class=\"u\">حروف الجر اللي من كلمة واحدة بتتسمى حروف جر بسيطة.</div>", "n": 1, "i": 16, "a": "tefl-50-015", "x": "02d0dfd5"}, {"t": "learn", "h": "<div class=\"u\">Feature three: prepositions do not change their form. They take no inflections: in the box, in the boxes, in her purse. Unlike happy, happier, happiest, or like, likes.</div><div class=\"u\">الخاصية التالتة: حروف الجر مابتغيّرش شكلها. مابتاخدش تصريفات: في العلبة، في العلب، في شنطتها. عكس سعيد، أسعد، الأسعد، أو يحب، يحب هو.</div>", "n": 1, "i": 17, "a": "tefl-50-016", "x": "ec26c345"}, {"t": "section", "h": "Categories and teaching | التصنيفات والتعليم", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">Prepositions are hard to categorise concisely. Take on: it seems fair that on describes being on top of a surface: on the table, on the wall, on her arm.</div><div class=\"u\">حروف الجر صعب تتصنّف بإيجاز. خد الأون: باين منطقي إنها بتوصّف حاجة فوق سطح: على الترابيزة، على الحيطة، على دراعها.</div>", "n": 1, "i": 19, "a": "tefl-50-017", "x": "0d54e730"}, {"t": "learn", "h": "<div class=\"u\">But look: we saw Taylor Swift on TV. I heard Brad Pitt on the radio. I saw David Beckham on the plane. No surface anywhere. This is the danger of categories: exceptions pile up.</div><div class=\"u\">بس بص: شفنا تايلور سويفت على التلفزيون. سمعت براد بيت على الراديو. شفت ديفيد بيكهام على الطيارة. مفيش سطح في أي حتة. ده خطر التصنيفات: الاستثناءات بتتراكم.</div>", "n": 1, "i": 20, "a": "tefl-50-018", "x": "6517e16a"}, {"t": "learn", "h": "<div class=\"u\">Still, teachers often build topics around common categories. Category one: position or location.</div><div class=\"u\">ومع ذلك، المدرسين غالبًا بيبنوا مواضيع حوالين تصنيفات شائعة. التصنيف الأول: المكان أو الموقع.</div>", "n": 1, "i": 21, "a": "tefl-50-019", "x": "c85ec34b"}, {"t": "learn", "h": "<div class=\"u\">For example: her bag was under the chair; Lisa is in the garden; the picture is on the wall; the school is near the cinema.</div><div class=\"u\">مثال: شنطتها كانت تحت الكرسي؛ ليزا في الجنينة؛ الصورة على الحيطة؛ المدرسة جنب السينما.</div>", "n": 1, "i": 22, "a": "tefl-50-020", "x": "6051604f"}, {"t": "learn", "h": "<div class=\"u\">Category two: time and date: their parents arrived on Sunday; the course starts at 9 am; I haven't seen him since last week; my birthday is on 24th December.</div><div class=\"u\">التصنيف التاني: الوقت والتاريخ: أهلها وصلوا يوم الحد؛ الكورس بيبدأ الساعة ٩ الصبح؛ ماشفتهوش من الأسبوع اللي فات؛ عيد ميلادي ٢٤ ديسمبر.</div>", "n": 1, "i": 23, "a": "tefl-50-021", "x": "3b3b91e3"}, {"t": "learn", "h": "<div class=\"u\">Category three: the way an action is done: we arrived by boat; they stared at each other without speaking.</div><div class=\"u\">التصنيف التالت: طريقة عمل الحدث: وصلنا بالمركب؛ بصّوا لبعض من غير كلام.</div>", "n": 1, "i": 24, "a": "tefl-50-022", "x": "0de33929"}, {"t": "learn", "h": "<div class=\"u\">Category four: direction: he went to the match; she dived into the pool; they walked up the hill.</div><div class=\"u\">التصنيف الرابع: الاتجاه: هو راح الماتش؛ هي غطست في البسين؛ هما طلعوا التل.</div>", "n": 1, "i": 25, "a": "tefl-50-023", "x": "2696e23e"}, {"t": "learn", "h": "<div class=\"u\">Category five: linking with adjectives: Françoise is good at spelling; France is famous for wine; Rosa is proud of her achievements.</div><div class=\"u\">التصنيف الخامس: الربط مع الصفات: فرانسواز كويسة في الإملاء؛ فرنسا مشهورة بالنبيذ؛ روزا فخورة بإنجازاتها.</div>", "n": 1, "i": 26, "a": "tefl-50-024", "x": "91bba5eb"}, {"t": "learn", "h": "<div class=\"u\">Teaching advice: build prepositions into a topic you are covering, so learning is less random.</div><div class=\"u\">نصيحة التعليم: ابني حروف الجر جوه موضوع بتغطّيه، عشان التعلّم يبقى أقل عشوائية.</div>", "n": 1, "i": 27, "a": "tefl-50-025", "x": "92800b9d"}, {"t": "learn", "h": "<div class=\"u\">Categories one to four give you something to build on; the adjective links in category five will just have to be learned as they come up.</div><div class=\"u\">التصنيفات من واحد لأربعة بتدّيك حاجة تبني عليها؛ روابط الصفات في التصنيف الخامس لازم تتتحفظ كل ما تيجي.</div>", "n": 1, "i": 28, "a": "tefl-50-026", "x": "d7fe8aef"}, {"t": "section", "h": "What idioms are | إيه هي الاصطلاحات", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Unit three: idioms. Idioms are a series of fixed lexical items with their own figurative meaning, different from their literal elements.</div><div class=\"u\">الوحدة التالتة: التعبيرات الاصطلاحية. هي سلسلة من عناصر معجمية ثابتة ليها معنى مجازي خاص، مختلف عن عناصرها الحرفية.</div>", "n": 1, "i": 30, "a": "tefl-50-027", "x": "4a23a2ae"}, {"t": "learn", "h": "<div class=\"u\">Literal language is when we say what we mean: I'm leaving early tomorrow. I have lots to do. No ambiguity, no hidden meaning.</div><div class=\"u\">اللغة الحرفية هي لما بنقول اللي نقصده: أنا هسافر بدري بكرة. عندي شغل كتير. مفيش غموض، مفيش معنى مخفي.</div>", "n": 1, "i": 31, "a": "tefl-50-028", "x": "c83b0aef"}, {"t": "learn", "h": "<div class=\"u\">Figurative language is different: the words do not mean what they say; they imply something else.</div><div class=\"u\">اللغة المجازية مختلفة: الكلمات مش معناها اللي بتقوله؛ بتلمّح لحاجة تانية.</div>", "n": 1, "i": 32, "a": "tefl-50-029", "x": "b211fa73"}, {"t": "learn", "h": "<div class=\"u\">Grandmother says: my granddaughter Valeria is the apple of my eye. She is not saying Valeria is fruit in her eye. The implied meaning: my granddaughter is wonderful; I love her more than anything.</div><div class=\"u\">الجدة بتقول: حفيدتي فاليريا نور عيني. مش بتقول إن فاليريا فاكهة في عينها. المعنى الملمّح: حفيدتي رائعة؛ بحبها أكتر من أي حاجة.</div>", "n": 1, "i": 33, "a": "tefl-50-030", "x": "8e44fa72"}, {"t": "learn", "h": "<div class=\"u\">He's gone up in the world means he entered a higher social circle, and depending on how it is said, there could be envy in it, or an implication he left his old friends for fancier company.</div><div class=\"u\">هو اترقى في الدنيا معناها دخل دايرة اجتماعية أعلى، وعلى حسب النبرة، ممكن يبقى فيها حسد، أو تلميح إنه ساب أصحابه القدامى لصحبة أشيك.</div>", "n": 1, "i": 34, "a": "tefl-50-031", "x": "4a3eb5bc"}, {"t": "learn", "h": "<div class=\"u\">Some inexperienced teachers think idioms are special to English. Not true: all languages have their own idioms.</div><div class=\"u\">بعض المدرسين قليلي الخبرة فاكرين التعبيرات الاصطلاحية حاجة خاصة بالإنجليزي. مش صح: كل اللغات عندها اصطلاحاتها.</div>", "n": 1, "i": 35, "a": "tefl-50-032", "x": "f951cf96"}, {"t": "learn", "h": "<div class=\"u\">But the form of idioms in the learner's language will bear little resemblance to English ones, even with a similar meaning.</div><div class=\"u\">بس شكل الاصطلاحات في لغة المتعلم مش هيبقى شبه الإنجليزي، حتى لو المعنى قريب.</div>", "n": 1, "i": 36, "a": "tefl-50-033", "x": "6eba66cd"}, {"t": "learn", "h": "<div class=\"u\">Example: to make a mistake. English: to put your foot in it. French: to put your finger in your eye. Same meaning, totally different picture.</div><div class=\"u\">مثال: يعمل غلطة. الإنجليزي: يحط رجله فيها. الفرنسي: يحط صوابعه في عينه. نفس المعنى، صورة مختلفة تمامًا.</div>", "n": 1, "i": 37, "a": "tefl-50-034", "x": "e4917427"}, {"t": "learn", "h": "<div class=\"u\">Many students struggle with idioms like: I'm at a loose end. She's at the end of her tether. He did a runner. You're flogging a dead horse.</div><div class=\"u\">طلبة كتير بيتعبوا مع اصطلاحات زي: أنا فاضي ومش عارف أعمل إيه. هي خلاص خلصت أعصابها. هو هرب. إنت بتضرب في حاجة ميتة.</div>", "n": 1, "i": 38, "a": "tefl-50-035", "x": "b234254d"}, {"t": "section", "h": "Teaching idioms, part one | تعليم الاصطلاحات، جزء أول", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\">Teaching idioms, step one: ensure they know what idioms are and how they are used, mostly in spoken language, everyday informal conversation, novels and popular journalism.</div><div class=\"u\">تعليم الاصطلاحات، خطوة واحد: اتأكد إنهم عارفين إيه هي الاصطلاحات وإزاي بتتستخدم، غالبًا في اللغة المنطوقة والمحادثة اليومية غير الرسمية والروايات والصحافة الشعبية.</div>", "n": 1, "i": 40, "a": "tefl-50-036", "x": "81220d21"}, {"t": "learn", "h": "<div class=\"u\">Inexperienced teachers say idioms are not used in formal writing or speaking. Not true.</div><div class=\"u\">المدرسين قليلي الخبرة بيقولوا الاصطلاحات مابتتستخدمش في الكتابة أو الكلام الرسمي. مش صح.</div>", "n": 1, "i": 41, "a": "tefl-50-037", "x": "cf7310ae"}, {"t": "learn", "h": "<div class=\"u\">It's hoped our findings will open the door to further research works in an academic piece; open the door for us in the Far East works in a business report.</div><div class=\"u\">يُؤمل إن نتايجنا هتفتح الباب لأبحاث أكتر شغالة في قطعة أكاديمية؛ هيفتحلنا الباب في الشرق الأقصى شغالة في تقرير أعمال.</div>", "n": 1, "i": 42, "a": "tefl-50-038", "x": "b4795ad7"}, {"t": "learn", "h": "<div class=\"u\">At the first stage, do not even use the term idiom.</div><div class=\"u\">في المرحلة الأولى، متستخدمش حتى مصطلح اصطلاح.</div>", "n": 1, "i": 43, "a": "tefl-50-039", "x": "b250f52f"}, {"t": "learn", "h": "<div class=\"u\">Ask them what people say in their language about a friend who says the wrong thing at the wrong time, then introduce: she put her foot in it.</div><div class=\"u\">اسألهم الناس بتقول إيه بلغتهم عن صاحب بيقول الحاجة الغلط في الوقت الغلط، وبعدين قدّم: هي حطّت رجلها فيها.</div>", "n": 1, "i": 44, "a": "tefl-50-040", "x": "8417c389"}, {"t": "learn", "h": "<div class=\"u\">Do not get hung up on derivations. For he's as daft as a brush, even the Oxford English Dictionary is still seeking real evidence of its origin.</div><div class=\"u\">ماتعلقش في أصول التعبيرات. في هو مجنون زي الفرشة، حتى قاموس أكسفورد لسه بيدوّر على دليل حقيقي لأصلها.</div>", "n": 1, "i": 45, "a": "tefl-50-041", "x": "8565ecc1"}, {"t": "learn", "h": "<div class=\"u\">Step two: always introduce idioms in context. Random introduction does not work; asking them to learn five random idioms from a dictionary is silly and ineffective.</div><div class=\"u\">خطوة اتنين: دايمًا قدّم الاصطلاحات في سياق. التقديم العشوائي مابينفعش؛ إنك تطلب منهم يحفظوا خمس اصطلاحات عشوائية من القاموس ده ساذج وعديم الجدوى.</div>", "n": 1, "i": 46, "a": "tefl-50-042", "x": "85c23f08"}, {"t": "learn", "h": "<div class=\"u\">Learners need meaningful language in context so they can draw the meaning from their memory bank later, helped by the memory of the context it was learned in.</div><div class=\"u\">المتعلمين محتاجين لغة ذات معنى في سياق عشان يقدروا يسحبوا المعنى من بنك ذاكرتهم بعدين، مستعينين بذكري السياق اللي اتعلّم فيه.</div>", "n": 1, "i": 47, "a": "tefl-50-043", "x": "7f5301e0"}, {"t": "section", "h": "Teaching idioms, part two | تعليم الاصطلاحات، جزء تاني", "n": 1, "i": 48}, {"t": "learn", "h": "<div class=\"u\">Step three: action-centred dictionary work can help. Instead of just looking an idiom up, ask students to guess how it may have come about from its words.</div><div class=\"u\">خطوة تلاتة: شغل القاموس المركّز على الفعل ممكن يساعد. بدل مجرد البحث عن الاصطلاح، اسأل الطلبة يخمّنوا جاء منين من كلماته.</div>", "n": 1, "i": 49, "a": "tefl-50-044", "x": "b4d52da5"}, {"t": "learn", "h": "<div class=\"u\">Why is it brush and not mop or spider in he's as daft as a brush? What are the definitions of brush? Is there a clue? This is far more conducive to learning than automaton dictionary searching.</div><div class=\"u\">ليه فرشة مش ممسحة أو عنكبوت في هو مجنون زي الفرشة؟ إيه تعريفات كلمة فرشة؟ في قرينة؟ ده أجدى بكتير للتعلّم من البحث الآلي في القاموس.</div>", "n": 1, "i": 50, "a": "tefl-50-045", "x": "a361d0a5"}, {"t": "learn", "h": "<div class=\"u\">Step four: group everyday idioms with the topic. Covering time, animals or body parts? That is an excellent opportunity.</div><div class=\"u\">خطوة أربعة: جمّع الاصطلاحات اليومية مع الموضوع. بتغطّي الوقت أو الحيوانات أو أجزاء الجسم؟ دي فرصة ممتازة.</div>", "n": 1, "i": 51, "a": "tefl-50-046", "x": "fff20433"}, {"t": "learn", "h": "<div class=\"u\">Introduce one or two everyday idioms at a time, practised and used during the topic.</div><div class=\"u\">قدّم اصطلاح أو اتنين يوميين في المرة، بيتدربوا عليهم ويستخدموهم أثناء الموضوع.</div>", "n": 1, "i": 52, "a": "tefl-50-047", "x": "39df8203"}, {"t": "learn", "h": "<div class=\"u\">If the animals topic includes dogs: my friend was as sick as a dog after eating cheese.</div><div class=\"u\">لو موضوع الحيوانات فيه كلاب: صاحبي كان تعبان جدًا بعد ما أكل جبنة.</div>", "n": 1, "i": 53, "a": "tefl-50-048", "x": "99a8da32"}, {"t": "learn", "h": "<div class=\"u\">If the topic is fruit: the apple of my eye, I went bananas, don't upset the apple cart, he's a bad apple, she's got a plum job.</div><div class=\"u\">لو الموضوع فاكهة: نور عيني، أنا اتجنّنت، متقلبش عربية التفاح، هو تفاحة فاسدة، هي عندها وظيفة ذهب.</div>", "n": 1, "i": 54, "a": "tefl-50-049", "x": "49d59b62"}, {"t": "learn", "h": "<div class=\"u\">Step five: the goal is to get them to use idioms. Knowing the meaning is only part of the journey; they need to practise usage.</div><div class=\"u\">خطوة خمسة: الهدف إنك تخلّيهم يستخدموا الاصطلاحات. معرفة المعنى بس جزء من الرحلة؛ محتاجين يتدربوا على الاستخدام.</div>", "n": 1, "i": 55, "a": "tefl-50-050", "x": "09e15aa0"}, {"t": "learn", "h": "<div class=\"u\">Get pairs writing short conversations with the idioms included, practise them, and act them out in front of the class.</div><div class=\"u\">خلّي الأزواج يكتبوا محادثات قصيرة فيها الاصطلاحات، يتدربوا عليها، ويمثّلوها قدام الفصل.</div>", "n": 1, "i": 56, "a": "tefl-50-051", "x": "f5ca1919"}, {"t": "learn", "h": "<div class=\"u\">Then recycle: follow up later with gap-fills, crosswords and conversational activities, because language needs to be used again and again to be fully embedded.</div><div class=\"u\">وبعدين دوّر: تابع بعدين بملء فراغات وكلمات متقاطعة وأنشطة محادثة، لأن اللغة محتاجة تتستخدم مرارًا وتكرارًا عشان تثبت بالكامل.</div>", "n": 1, "i": 57, "a": "tefl-50-052", "x": "d1647ff6"}, {"t": "learn", "h": "<div class=\"u\">Step six: use authentic materials. Show idioms in materials they enjoy: sport or music magazines, videos and songs, to prove these are current expressions used by real people.</div><div class=\"u\">خطوة ستة: استخدم مواد أصلية. ورّيهم الاصطلاحات في مواد بيستمتعوا بيها: مجلات رياضة أو مزيكا، فيديوهات وأغاني، عشان تثبت إن دي تعبيرات حالية بيستخدمها ناس حقيقيين.</div>", "n": 1, "i": 58, "a": "tefl-50-053", "x": "ce4378e1"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">preposition: a word relating a noun to another word, like on.</div><div class=\"u\">حرف الجر: كلمة بتربط اسم بكلمة تانية، زي على.</div>", "n": 1, "i": 60, "a": "tefl-50-054", "x": "84fc999f"}, {"t": "learn", "h": "<div class=\"u\">prepositional phrase: preposition plus its object, like on the table.</div><div class=\"u\">عبارة الجر: حرف جر زائد مفعوله، زي على الترابيزة.</div>", "n": 1, "i": 61, "a": "tefl-50-055", "x": "08d3f669"}, {"t": "learn", "h": "<div class=\"u\">stranded preposition: a preposition left after its noun, like: what I was talking about.</div><div class=\"u\">حرف الجر المعلّق: حرف جر متسيّب بعد اسمه، زي: اللي كنت بتكلم عنه.</div>", "n": 1, "i": 62, "a": "tefl-50-056", "x": "a587e910"}, {"t": "learn", "h": "<div class=\"u\">complex preposition: a multi-word preposition, like on behalf of.</div><div class=\"u\">حرف الجر المركب: حرف جر من كذا كلمة، زي نيابة عن.</div>", "n": 1, "i": 63, "a": "tefl-50-057", "x": "f955c636"}, {"t": "learn", "h": "<div class=\"u\">inflection: a change in a word's form for grammar, like likes.</div><div class=\"u\">التصريف: تغيّر في شكل الكلمة للقواعد، زي يحب هو.</div>", "n": 1, "i": 64, "a": "tefl-50-058", "x": "5ed65cd0"}, {"t": "learn", "h": "<div class=\"u\">idiom: a fixed phrase with a figurative meaning, like the apple of my eye.</div><div class=\"u\">الاصطلاح: عبارة ثابتة بمعنى مجازي، زي نور عيني.</div>", "n": 1, "i": 65, "a": "tefl-50-059", "x": "c9e07e20"}, {"t": "learn", "h": "<div class=\"u\">literal: words mean exactly what they say.</div><div class=\"u\">حرفي: الكلمات معناها بالظبط اللي بتقوله.</div>", "n": 1, "i": 66, "a": "tefl-50-060", "x": "536740ce"}, {"t": "learn", "h": "<div class=\"u\">figurative: words imply a different meaning.</div><div class=\"u\">مجازي: الكلمات بتلمّح لمعنى مختلف.</div>", "n": 1, "i": 67, "a": "tefl-50-061", "x": "1fc4e4c9"}, {"t": "learn", "h": "<div class=\"u\">derivation: the origin or source of an expression.</div><div class=\"u\">الأصل: منبع أو مصدر التعبير.</div>", "n": 1, "i": 68, "a": "tefl-50-062", "x": "09ec545e"}, {"t": "learn", "h": "<div class=\"u\">recycling: reusing language again and again so it sticks.</div><div class=\"u\">إعادة التدوير: إعادة استخدام اللغة مرارًا عشان تثبت.</div>", "n": 1, "i": 69, "a": "tefl-50-063", "x": "62169a05"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 70}, {"t": "learn", "h": "<div class=\"u\">Prepositions come second only to phrasal verbs in difficulty: tiny words, many uses, few reliable rules.</div><div class=\"u\">حروف الجر بتيجي بعد الأفعال المركبة مباشرة في الصعوبة: كلمات صغيرة، استخدامات كتير، قواعد مضمونة قليلة.</div>", "n": 1, "i": 71, "a": "tefl-50-064", "x": "5828be6e"}, {"t": "learn", "h": "<div class=\"u\">They usually precede the noun, complex ones too, never change form, but can be stranded after the noun.</div><div class=\"u\">عادة بتسبق الاسم، المركبة كمان، مابتغيّرش شكلها أبدًا، بس ممكن تتعلّق بعد الاسم.</div>", "n": 1, "i": 72, "a": "tefl-50-065", "x": "662ef7b3"}, {"t": "learn", "h": "<div class=\"u\">Teach them inside topics: location, time, manner, direction; adjective links are learned as they come.</div><div class=\"u\">علّمهم جوه مواضيع: مكان، وقت، طريقة، اتجاه؛ روابط الصفات بتتتحفظ كل ما تيجي.</div>", "n": 1, "i": 73, "a": "tefl-50-066", "x": "54959ff7"}, {"t": "learn", "h": "<div class=\"u\">Idioms are fixed phrases with figurative meanings; all languages have them, but the pictures never match across languages.</div><div class=\"u\">الاصطلاحات عبارات ثابتة بمعاني مجازية؛ كل اللغات عندها منهم، بس الصور أبدًا مابتتطابق بين اللغات.</div>", "n": 1, "i": 74, "a": "tefl-50-067", "x": "5a3a7ef5"}, {"t": "learn", "h": "<div class=\"u\">Teach idioms in context, grouped with topics, practised in conversations, recycled later, and proven with authentic materials.</div><div class=\"u\">علّم الاصطلاحات في سياق، مجمّعة مع المواضيع، متدرب عليها في محادثات، مدوّرة بعدين، ومثبتة بمواد أصلية.</div>", "n": 1, "i": 75, "a": "tefl-50-068", "x": "55a3f71f"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 76}, {"t": "mc", "q": "A preposition relates:<br>حرف الجر بيربط:", "opts": ["a noun or pronoun to another word in the sentence | اسم أو ضمير بكلمة تانية في الجملة", "two verbs together | فعلين ببعض", "only adjectives | الصفات بس"], "ans": 0, "why": "Example: the book is on the table; on links book to table. | مثال: الكتاب على الترابيزة؛ على بترابط الكتاب بالترابيزة.", "ex": ["Correct. | صح.", "No. It centres on nouns. | غلط: بيتمركز حوالين الأسماء.", "No. It works with nouns and pronouns. | غلط: بيشتغل مع الأسماء والضماير."], "n": 1, "i": 77, "h": ""}, {"t": "mc", "q": "This is what I was talking about. What is about here?<br>ده اللي كنت بتكلم عنه. إيه هي عن هنا؟", "opts": ["a stranded preposition | حرف جر معلّق", "a complex preposition | حرف جر مركب", "an adjective | صفة"], "ans": 0, "why": "The preposition comes after its noun phrase in this construction, so it is stranded. | حرف الجر بييجي بعد الاسم في التركيبة دي، فهو معلّق.", "ex": ["Correct. | صح.", "No. It is a single word. | غلط: كلمة واحدة.", "No. It is a preposition. | غلط: ده حرف جر."], "n": 1, "i": 78, "h": ""}, {"t": "tf", "q": "Prepositions change their form like verbs do.<br>حروف الجر بتغيّر شكلها زي الأفعال.", "ans": false, "why": "False. In stays in: in the box, in the boxes, in her purse. They take no inflections. | غلط. الـ في بتفضل في: في العلبة، في العلب، في شنطتها. مابتاخدش تصريفات.", "ex": ["Correct. | صح.", "Wrong. Their form never changes. | غلط: شكلهم أبدًا مابيتغيّر."], "n": 1, "i": 79, "h": ""}, {"t": "mc", "q": "We saw Taylor Swift on TV. What does this show?<br>شفنا تايلور سويفت على التلفزيون. ده بيوضّح إيه؟", "opts": ["preposition categories have many exceptions | تصنيفات حروف الجر ليها استثناءات كتير", "on always means on a surface | على دايمًا معناها على سطح", "TV is a table | التلفزيون ترابيزة"], "ans": 0, "why": "On TV, on the radio and on the plane have nothing to do with surfaces, so categories leak. | على التلفزيون والراديو والطيارة مالهمش علاقة بالأسطح، فالتصنيفات بتسّرب.", "ex": ["Correct. | صح.", "No. This example breaks that rule. | غلط: المثال ده بيكسر القاعدة دي.", "No. That misses the point. | غلط: ده مش المقصود."], "n": 1, "i": 80, "h": ""}, {"t": "mc", "q": "The apple of my eye is an example of:<br>نور عيني مثال على:", "opts": ["an idiom: figurative language | اصطلاح: لغة مجازية", "literal language | لغة حرفية", "a prepositional error | خطأ جر"], "ans": 0, "why": "The words do not mean what they say; they imply: I love her more than anything. | الكلمات مش معناها اللي بتقوله؛ بتلمّح: بحبها أكتر من أي حاجة.", "ex": ["Correct. | صح.", "No. It is not about fruit in an eye. | غلط: مش عن فاكهة في عين.", "No. It is correct usage. | غلط: ده استخدام صح."], "n": 1, "i": 81, "h": ""}, {"t": "tf", "q": "Idioms are never used in formal or academic writing.<br>الاصطلاحات أبدًا مابتتستخدمش في الكتابة الرسمية أو الأكاديمية.", "ans": false, "why": "False. Open the door to further research works in academic and business contexts. | غلط. يفتح الباب لأبحاث أكتر بيشتغل في السياقات الأكاديمية والأعمال.", "ex": ["Correct. | صح.", "Wrong. Many idioms appear in formal contexts. | غلط: اصطلاحات كتير بتظهر في سياقات رسمية."], "n": 1, "i": 82, "h": ""}, {"t": "mc", "q": "What is the best way to introduce idioms?<br>إيه أحسن طريقة لتقديم الاصطلاحات؟", "opts": ["in context, grouped with a topic | في سياق، مجمّعة مع موضوع", "five random idioms from a dictionary to memorise | خمس اصطلاحات عشوائية من القاموس للحفظ", "by explaining their derivations first | بشرح أصولها الأول"], "ans": 0, "why": "Context lets learners draw the meaning from memory later; random lists do not stick. | السياق بيخلّي المتعلمين يسحبوا المعنى من الذاكرة بعدين؛ القوائم العشوائية مابتثبتش.", "ex": ["Correct. | صح.", "No. Random learning fails. | غلط: التعلّم العشوائي بيفشل.", "No. Even Oxford cannot always trace origins. | غلط: حتى أكسفورد مش دايمًا بيلاقي الأصول."], "n": 1, "i": 83, "h": ""}, {"t": "mc", "q": "After students learn an idiom's meaning, the next goal is:<br>بعد ما الطلبة يتعلّموا معنى الاصطلاح، الهدف الجاي هو:", "opts": ["getting them to use it, then recycling it | خلّيهم يستخدموه، وبعدين دوّره", "moving to a new topic immediately | الانتقال لموضوع جديد فورًا", "testing them with a written exam | اختبارهم بامتحان مكتوب"], "ans": 0, "why": "Usage practice in conversations, then recycling through gap-fills and crosswords, embeds the idiom. | تدريب الاستخدام في محادثات، وبعدين التدوير بملء فراغات وكلمات متقاطعة، بيثبّت الاصطلاح.", "ex": ["Correct. | صح.", "No. Without use, it fades. | غلط: من غير استخدام، بيختفي.", "No. Practice comes before testing. | غلط: التدريب قبل الاختبار."], "n": 1, "i": 84, "h": ""}, {"t": "recall", "q": "Name the three main features of prepositions.<br>اذكر خصائص حروف الجر التلاتة الرئيسية.", "a": "1. They usually come before a noun, though they can be stranded after it. 2. Complex prepositions also come before the noun. 3. They never change their form: no inflections.<br>١. عادة بتيجي قبل الاسم، بس ممكن تتعلّق بعده. ٢. حروف الجر المركبة كمان بتيجي قبل الاسم. ٣. أبدًا مابتغيّر شكلها: مفيش تصريفات.", "n": 1, "i": 85, "h": ""}, {"t": "recall", "q": "Name the six steps for teaching idioms.<br>اذكر الخطوات الستة لتعليم الاصطلاحات.", "a": "1. Ensure they know what idioms are. 2. Always introduce them in context. 3. Use action-centred dictionary work. 4. Group everyday idioms with the topic. 5. Get students using them, then recycle. 6. Use authentic materials.<br>١. اتأكد إنهم عارفين إيه هي الاصطلاحات. ٢. دايمًا قدّمهم في سياق. ٣. استخدم شغل قاموس مركّز على الفعل. ٤. جمّع الاصطلاحات اليومية مع الموضوع. ٥. خلّي الطلبة يستخدموهم، وبعدين دوّر. ٦. استخدم مواد أصلية.", "n": 1, "i": 86, "h": ""}, {"t": "write", "q": "Why are prepositions hard to categorise? Use the example of on. (3-4 sentences)<br>ليه حروف الجر صعب تتصنّف؟ استخدم مثال الأون. (٣-٤ جمل).", "key": "tefl-50:1", "a": "At first, on seems to describe something on top of a surface: on the table, on the wall, on her arm. But then we see Taylor Swift on TV, hear Brad Pitt on the radio and see David Beckham on the plane, with no surface involved. This shows the danger of categories: the exceptions pile up. That is why teachers build prepositions into topics instead of relying on rules.<br>في الأول، الأون باين إنها بتوصّف حاجة فوق سطح: على الترابيزة، على الحيطة، على دراعها. بس بعدين بنشوف تايلور سويفت على التلفزيون، وبنسمع براد بيت على الراديو، وبنشوف ديفيد بيكهام على الطيارة، من غير أي سطح. ده بيوضّح خطر التصنيفات: الاستثناءات بتتراكم. عشان كده المدرسين بيبنوا حروف الجر جوه مواضيع بدل الاعتماد على القواعد.", "n": 1, "i": 87, "h": ""}, {"t": "write", "q": "How would you teach idioms during a topic about fruit? (3-4 sentences)<br>إزاي هتعلّم الاصطلاحات أثناء موضوع عن الفاكهة؟ (٣-٤ جمل).", "key": "tefl-50:2", "a": "I would introduce one or two fruit idioms in context, such as the apple of my eye, I went bananas or don't upset the apple cart, depending on the students' level and age. I would present them inside simple conversations or texts, not as a list. Then pairs would write short conversations using the idioms and act them out. Later, I would recycle them with gap-fills and crosswords, and show them in authentic materials like songs and magazines.<br>أنا هقدّم اصطلاح أو اتنين عن الفاكهة في سياق، زي نور عيني، أو أنا اتجنّنت، أو متقلبش عربية التفاح، على حسب مستوى الطلبة وسنهم. هقدّمهم جوه محادثات أو نصوص بسيطة، مش كقائمة. وبعدين الأزواج هيكتبوا محادثات قصيرة بالاصطلاحات ويمثّلوها. وبعدين هدوّرهم بملء فراغات وكلمات متقاطعة، وهورّيهم في مواد أصلية زي الأغاني والمجلات.", "n": 1, "i": 88, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the four conditional forms.</div><div class=\"u\">الدرس الجاي: الأشكال الشرطية الأربعة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 89}];</script>
