<h1>عالم تيفل ٣٣: تصحيح الأخطاء</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٣٣</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>
<a class="pdf-link" href="../pdf/tefl-33.pdf" target="_blank" rel="noopener">📄 حمّل PDF الدرس</a>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-33";window.STEPS=[{"t": "section", "h": "Errors are not the enemy | الأخطاء مش عدو", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">It is easy to think that because your students make errors, they have not understood, or even that you are a bad teacher.</div><div class=\"u\">من السهل تفتكر إن طالما طلبتك بتعمل أخطاء، يبقى مافهموش، أو حتى إنك مدرس وحش.</div>", "n": 1, "i": 1, "a": "tefl-33-001", "x": "e44aae38"}, {"t": "learn", "h": "<div class=\"u\">But this is not necessarily the case at all.</div><div class=\"u\">بس ده مش لازم يكون صح خالص.</div>", "n": 1, "i": 2, "a": "tefl-33-002", "x": "0e37afa3"}, {"t": "learn", "h": "<div class=\"u\">Error can actually often be a good thing. It shows students are willing to experiment with the language, finding out what works and what does not.</div><div class=\"u\">الخطأ ممكن في الغالب يكون حاجة كويسة. بيوضح إن الطلبة مستعدين يجرّبوا اللغة، بيكتشفوا إيه اللي بينفع وإيه اللي لأ.</div>", "n": 1, "i": 3, "a": "tefl-33-003", "x": "3dfdcf56"}, {"t": "learn", "h": "<div class=\"u\">In communicative classrooms, students must be allowed to communicate without worrying about every tiny detail of speaking accurately.</div><div class=\"u\">في الفصول التواصلية، لازم الطلبة يتسابوا يتواصلوا من غير ما يقلقوا من كل تفصيلة صغيرة في الدقة.</div>", "n": 1, "i": 4, "a": "tefl-33-004", "x": "7f003832"}, {"t": "learn", "h": "<div class=\"u\">That does not mean we let all their errors go unnoticed. After all, how would they improve then?</div><div class=\"u\">ده مش معناه إننا نسيب كل أخطائهم تعدي من غير ملاحظة. في الآخر، هيتحسّنوا إزاي كده؟</div>", "n": 1, "i": 5, "a": "tefl-33-005", "x": "68a70d1f"}, {"t": "learn", "h": "<div class=\"u\">But there are techniques to correct errors without destroying learner confidence.</div><div class=\"u\">بس في تقنيات لتصحيح الأخطاء من غير ما ندمّر ثقة المتعلم.</div>", "n": 1, "i": 6, "a": "tefl-33-006", "x": "30bddf76"}, {"t": "learn", "h": "<div class=\"u\">Errors can be spoken or written, and they come in many types.</div><div class=\"u\">الأخطاء ممكن تكون منطوقة أو مكتوبة، وليها أنواع كتير.</div>", "n": 1, "i": 7, "a": "tefl-33-007", "x": "c057a52b"}, {"t": "learn", "h": "<div class=\"u\">They may be about incorrect grammar: tenses, word order, verb-noun agreement. Or lexis. Or even pronunciation.</div><div class=\"u\">ممكن تكون عن قواعد غلط: أزمنة، ترتيب كلمات، توافق الفعل مع الفاعل. أو مفردات. أو حتى نطق.</div>", "n": 1, "i": 8, "a": "tefl-33-008", "x": "b82246a8"}, {"t": "learn", "h": "<div class=\"u\">Sometimes the language itself is correct, but inappropriate for the situation.</div><div class=\"u\">وساعات اللغة نفسها تكون صح، بس غير مناسبة للموقف.</div>", "n": 1, "i": 9, "a": "tefl-33-009", "x": "b12c0b0d"}, {"t": "learn", "h": "<div class=\"u\">The unit's matching task, solved. I'm going to study in Manchester: a pronunciation error, incorrect word stress.</div><div class=\"u\">تمرين التوصيل في الوحدة، محلول. I'm going to study in Manchester: خطأ نطق، نبر الكلمة غلط.</div>", "n": 1, "i": 10, "a": "tefl-33-010", "x": "5f7add98"}, {"t": "learn", "h": "<div class=\"u\">I've been knowing her for three years: a grammar error, incorrect tense.</div><div class=\"u\">I've been knowing her for three years: خطأ قواعد، زمن غلط.</div>", "n": 1, "i": 11, "a": "tefl-33-011", "x": "adf8b8ce"}, {"t": "learn", "h": "<div class=\"u\">Can you do me a pleasure? A lexis error, an incorrect word, and potentially vulgar. It should be favour.</div><div class=\"u\">Can you do me a pleasure؟ خطأ مفردات، كلمة غلط، وممكن تبقى فاضحة. المفروض favour.</div>", "n": 1, "i": 12, "a": "tefl-33-012", "x": "82418d7f"}, {"t": "section", "h": "Errors vs mistakes | الأخطاء والزلات", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">It is important to distinguish between errors and mistakes, or slip ups.</div><div class=\"u\">المهم تفرّق بين الأخطاء والزلات.</div>", "n": 1, "i": 14, "a": "tefl-33-013", "x": "a1963def"}, {"t": "learn", "h": "<div class=\"u\">An error is when the student does not know the correct form.</div><div class=\"u\">الخطأ هو لما الطالب مابيعرفش الشكل الصح.</div>", "n": 1, "i": 15, "a": "tefl-33-014", "x": "fa823f81"}, {"t": "learn", "h": "<div class=\"u\">A mistake is something said incorrectly by accident, even though the student knows it.</div><div class=\"u\">الزلة هي حاجة اتقالت غلط بالصدفة، مع إن الطالب عارف الصح.</div>", "n": 1, "i": 16, "a": "tefl-33-015", "x": "21d039b6"}, {"t": "learn", "h": "<div class=\"u\">If you correct every tiny mistake, your students will probably become very hesitant when speaking.</div><div class=\"u\">لو صحّحت كل زلة صغيرة، طلبتك غالبًا هيترددوا جدًا في الكلام.</div>", "n": 1, "i": 17, "a": "tefl-33-016", "x": "caa7670b"}, {"t": "learn", "h": "<div class=\"u\">They will always look to you for confirmation, and that is not something you want to encourage.</div><div class=\"u\">هيفضلوا باصصين ليك عشان التأكيد، وده مش حاجة عايز تشجّعها.</div>", "n": 1, "i": 18, "a": "tefl-33-017", "x": "73f31d26"}, {"t": "learn", "h": "<div class=\"u\">It is a balancing act, though. Repeated mistakes can turn into errors.</div><div class=\"u\">بس دي لعبة توازن. الزلات المتكررة ممكن تتحوّل لأخطاء.</div>", "n": 1, "i": 19, "a": "tefl-33-018", "x": "8ae3c549"}, {"t": "learn", "h": "<div class=\"u\">So still keep an eye on slips that crop up time and again.</div><div class=\"u\">فخلّي عينك على الزلات اللي بتظهر كل شوية.</div>", "n": 1, "i": 20, "a": "tefl-33-019", "x": "df132786"}, {"t": "learn", "h": "<div class=\"u\">A lot of research exists on correcting students, and it all focuses on three main areas: what to correct, when to correct, and how to correct.</div><div class=\"u\">في أبحاث كتير عن تصحيح الطلبة، وكلها بتركّز على تلات محاور: إيه اللي نصحّحه، وإمتى نصحّحه، وإزاي نصحّحه.</div>", "n": 1, "i": 21, "a": "tefl-33-020", "x": "2431c435"}, {"t": "section", "h": "What to correct | إيه اللي نصحّحه", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">When deciding what to correct, think about your lesson aims.</div><div class=\"u\">لما بتقرر إيه اللي تصحّحه، فكّر في أهداف درسك.</div>", "n": 1, "i": 23, "a": "tefl-33-021", "x": "c3221d84"}, {"t": "learn", "h": "<div class=\"u\">Is the objective to work on a particular grammar point, or is it a skills lesson?</div><div class=\"u\">الهدف شغل على نقطة قواعد معينة، ولا درس مهارات؟</div>", "n": 1, "i": 24, "a": "tefl-33-022", "x": "1dac45ef"}, {"t": "learn", "h": "<div class=\"u\">If it is a grammar point lesson, then yes, correcting is constructive, because you are working on accuracy.</div><div class=\"u\">لو درس نقطة قواعد، أيوه، التصحيح مفيد، لأنك شغال على الدقة.</div>", "n": 1, "i": 25, "a": "tefl-33-023", "x": "73c64983"}, {"t": "learn", "h": "<div class=\"u\">But if a student makes a few errors while speaking, it is not always necessary to correct every one.</div><div class=\"u\">بس لو طالب عمل شوية أخطاء وهو بيتكلم، مش دايمًا لازم تصحّح كل واحدة.</div>", "n": 1, "i": 26, "a": "tefl-33-024", "x": "ec67d0e1"}, {"t": "learn", "h": "<div class=\"u\">Instead, focus on errors related to the target language you are studying that lesson.</div><div class=\"u\">بدل كده، ركّز على الأخطاء المرتبطة باللغة المستهدفة بتاعة الدرس ده.</div>", "n": 1, "i": 27, "a": "tefl-33-025", "x": "73726bd3"}, {"t": "learn", "h": "<div class=\"u\">Lower level students naturally make several errors. Do not overwhelm them, especially with things they have not even studied yet.</div><div class=\"u\">طلبة المستويات الأقل طبيعي يعملوا أخطاء كتير. ماتضغطش عليهم، خصوصًا بحاجات لسه مادرسوها أصلًا.</div>", "n": 1, "i": 28, "a": "tefl-33-026", "x": "80091c00"}, {"t": "learn", "h": "<div class=\"u\">Otherwise your correction is not particularly constructive.</div><div class=\"u\">غير كده تصحيحك مش مفيد قوي.</div>", "n": 1, "i": 29, "a": "tefl-33-027", "x": "e2ea6e24"}, {"t": "learn", "h": "<div class=\"u\">For skills lessons, developing reading, writing, listening, and speaking, correction may not always be necessary.</div><div class=\"u\">في دروس المهارات، تنمية القراية والكتابة والاستماع والكلام، التصحيح ممكن ميبقاش لازم دايمًا.</div>", "n": 1, "i": 30, "a": "tefl-33-028", "x": "06670c2c"}, {"t": "learn", "h": "<div class=\"u\">If the aim is fluency, jumping in to correct all errors can really hinder it, and obstruct your main goal of fluid spoken language.</div><div class=\"u\">لو الهدف طلاقة، القفز لتصحيح كل الأخطاء ممكن يعطّلها جدًا، ويعوق هدفك الأساسي: كلام منطوق سليس.</div>", "n": 1, "i": 31, "a": "tefl-33-029", "x": "571c13c4"}, {"t": "learn", "h": "<div class=\"u\">Sometimes students just need to shake off their fear of speaking a foreign language.</div><div class=\"u\">ساعات الطلبة محتاجين بس يتخلّصوا من خوفهم من الكلام بلغة أجنبية.</div>", "n": 1, "i": 32, "a": "tefl-33-030", "x": "bf66362a"}, {"t": "learn", "h": "<div class=\"u\">Try saying: okay, for this exercise just speak as naturally as possible. Do not worry about mistakes. Today the aim is fluency.</div><div class=\"u\">جرّب تقول: تمام، في التمرين ده عايزك تتكلم طبيعي بس. ماتقلقش من الأخطاء. النهاردة الهدف طلاقة.</div>", "n": 1, "i": 33, "a": "tefl-33-031", "x": "324968d6"}, {"t": "learn", "h": "<div class=\"u\">A lot of learners respond really well to this. Others may be sceptical.</div><div class=\"u\">متعلمين كتير بيردّوا على ده كويس جدًا. غيرهم ممكن يشكّكوا.</div>", "n": 1, "i": 34, "a": "tefl-33-032", "x": "99ef3467"}, {"t": "learn", "h": "<div class=\"u\">The important thing: let them know these exercises are useful, and that there is a reason you are not correcting them.</div><div class=\"u\">المهم: خلّيهم يعرفوا إن التمارين دي مفيدة، وإن في سبب إنك مش بتصحّحهم.</div>", "n": 1, "i": 35, "a": "tefl-33-033", "x": "37a024ee"}, {"t": "learn", "h": "<div class=\"u\">Their language was not perfect; they still need to improve. You are just choosing the right moment.</div><div class=\"u\">لغتهم مكانتش مثالية؛ لسه محتاجين يتحسّنوا. إنت بس بتختار اللحظة المناسبة.</div>", "n": 1, "i": 36, "a": "tefl-33-034", "x": "ef93ad80"}, {"t": "section", "h": "When to correct | إمتى نصحّح", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">For fluency exercises, interrupting students while they are speaking is really inappropriate.</div><div class=\"u\">في تمارين الطلاقة، مقاطعة الطلبة وهما بيتكلموا حاجة غير مناسبة جدًا.</div>", "n": 1, "i": 38, "a": "tefl-33-035", "x": "1e1b3978"}, {"t": "learn", "h": "<div class=\"u\">There are discreet ways to correct during conversation classes, which we will see next.</div><div class=\"u\">في طرق هادية للتصحيح أثناء دروس المحادثة، هنشوفها بعدين.</div>", "n": 1, "i": 39, "a": "tefl-33-036", "x": "c664f15e"}, {"t": "learn", "h": "<div class=\"u\">For speaking tasks, you can decide to correct at the end of the task, later in the lesson, or not at all.</div><div class=\"u\">في مهام الكلام، تقدر تقرر تصحّح في آخر المهمة، أو بعدين في الدرس، أو خالص.</div>", "n": 1, "i": 40, "a": "tefl-33-037", "x": "da53a652"}, {"t": "learn", "h": "<div class=\"u\">If you correct later, use your listening skills to note down errors you overhear, to discuss later or to plan future tasks.</div><div class=\"u\">لو هتصحّح بعدين، استخدم مهارات استماعك وسجّل الأخطاء اللي بتسمعها، عشان تناقشها بعدين أو تخطط مهام مستقبلية.</div>", "n": 1, "i": 41, "a": "tefl-33-038", "x": "a47c35be"}, {"t": "learn", "h": "<div class=\"u\">With delayed correction, you may want to make it anonymous, so students do not feel embarrassed in front of their classmates.</div><div class=\"u\">مع التصحيح المؤجل، ممكن تخلّيه مجهول، عشان الطلبة مايحسّوش بإحراج قدام زمايلهم.</div>", "n": 1, "i": 42, "a": "tefl-33-039", "x": "c06477a3"}, {"t": "learn", "h": "<div class=\"u\">Being singled out directly is never pleasant.</div><div class=\"u\">إن حد يتفرّد بالتصحيح قدام الكل حاجة مابتبقاش لطيفة أبدًا.</div>", "n": 1, "i": 43, "a": "tefl-33-040", "x": "2af5de0c"}, {"t": "learn", "h": "<div class=\"u\">Besides, all students benefit from generalised error correction. Just because it was not them this time does not mean they never make that error.</div><div class=\"u\">وكمان، كل الطلبة بتستفيد من التصحيح العام. مش لأن هم مش المعنيين المرة دي يعني عمرهم ما بيعملوا الخطأ ده.</div>", "n": 1, "i": 44, "a": "tefl-33-041", "x": "3807a697"}, {"t": "learn", "h": "<div class=\"u\">For accuracy activities, you may correct afterwards, or possibly on the spot.</div><div class=\"u\">في أنشطة الدقة، ممكن تصحّح بعدين، أو في نفس اللحظة.</div>", "n": 1, "i": 45, "a": "tefl-33-042", "x": "7efba90a"}, {"t": "learn", "h": "<div class=\"u\">Immediate correction is trickier. Be careful not to jump on the student, or slow the pace of the lesson too much.</div><div class=\"u\">التصحيح الفوري أصعب. خد بالك ماتنقزش على الطالب، ولا تبطّئ إيقاع الدرس أوي.</div>", "n": 1, "i": 46, "a": "tefl-33-043", "x": "e2020a8f"}, {"t": "learn", "h": "<div class=\"u\">This requires you to be an active listener.</div><div class=\"u\">ده محتاج إنك تبقى مستمع نشيط.</div>", "n": 1, "i": 47, "a": "tefl-33-044", "x": "af301fc0"}, {"t": "learn", "h": "<div class=\"u\">Barnett suggests that correcting this way can give learners an experience of partaking in meaningful dialogue, which informs and motivates them.</div><div class=\"u\">بارنيت بيقترح إن التصحيح بالطريقة دي يقدر يدّي المتعلمين تجربة مشاركة في حوار جدّا معنى، بيعلّمهم ويحفّزهم.</div>", "n": 1, "i": 48, "a": "tefl-33-045", "x": "0f35c39b"}, {"t": "learn", "h": "<div class=\"u\">So once you have decided whether to correct, and when, here are the ways to do it.</div><div class=\"u\">فبعد ما قررت هل تصحّح، وإمتى، دي الطرق اللي تعمل بيها.</div>", "n": 1, "i": 49, "a": "tefl-33-046", "x": "b0ef7bf8"}, {"t": "section", "h": "How: self-correction | إزاي: التصحيح الذاتي", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">Rather than saying outright what the problem is, there are plenty of ways to encourage student self-correction.</div><div class=\"u\">بدل ما تقول المشكلة مباشرة، في طرق كتير تشجّع بيها التصحيح الذاتي للطالب.</div>", "n": 1, "i": 51, "a": "tefl-33-047", "x": "759c225b"}, {"t": "learn", "h": "<div class=\"u\">Simply through facial expressions: raised eyebrows, a frown, a look of surprise, to show something is not quite right.</div><div class=\"u\">ببساطة بتعبيرات الوش: حواجب مترفوعة، عبوس، نظرة استغراب، عشان توضح إن في حاجة مش مظبوطة.</div>", "n": 1, "i": 52, "a": "tefl-33-048", "x": "e02b85c0"}, {"t": "learn", "h": "<div class=\"u\">If they need more prompting, repeat the sentence up to the error: you were waiting for a...?</div><div class=\"u\">لو محتاجين تلميح أكتر، عيد الجملة لحد الخطأ: you were waiting for a...؟</div>", "n": 1, "i": 53, "a": "tefl-33-049", "x": "834e506c"}, {"t": "learn", "h": "<div class=\"u\">Or ask a more direct question: tense? pronunciation?</div><div class=\"u\">أو اسأل سؤال مباشر أكتر: الزمن؟ النطق؟</div>", "n": 1, "i": 54, "a": "tefl-33-050", "x": "56802c44"}, {"t": "learn", "h": "<div class=\"u\">Another method: repeat the sentence but place stress on the problem word. Last week you GO to the cinema?</div><div class=\"u\">طريقة تانية: عيد الجملة بس حط نبر على الكلمة المشكلة. Last week you GO to the cinema؟</div>", "n": 1, "i": 55, "a": "tefl-33-051", "x": "ab4b3790"}, {"t": "learn", "h": "<div class=\"u\">You can even say directly: there is an error in that sentence.</div><div class=\"u\">وتقدر حتى تقول مباشرة: في خطأ في الجملة دي.</div>", "n": 1, "i": 56, "a": "tefl-33-052", "x": "a82fbe6b"}, {"t": "learn", "h": "<div class=\"u\">Finger correction is also useful. Hold up one hand and point to each finger with the other, one finger per word of the phrase.</div><div class=\"u\">تصحيح الأصابع كمان مفيد. ارفع إيد وأشّر على كل صوابع بالتانية، صباع لكل كلمة في العبارة.</div>", "n": 1, "i": 57, "a": "tefl-33-053", "x": "f7f1966d"}, {"t": "learn", "h": "<div class=\"u\">Then hold on to the problem finger, or skip a finger to show a missing word.</div><div class=\"u\">وبعدين وقّف عند الصباع المشكلة، أو عدّي صباع عشان توضح كلمة ناقصة.</div>", "n": 1, "i": 58, "a": "tefl-33-054", "x": "b1861b91"}, {"t": "learn", "h": "<div class=\"u\">If the student cannot self-correct, use reformulating, also called recasting.</div><div class=\"u\">لو الطالب مش قادر يصحّح نفسه، استخدم إعادة الصياغة، اللي اسمها كمان إعادة الصياغة الضمنية.</div>", "n": 1, "i": 59, "a": "tefl-33-055", "x": "35196717"}, {"t": "learn", "h": "<div class=\"u\">Repeat the sentence correctly, without drawing attention to it. I go to the cinema becomes: ah, you went to the cinema, that is nice.</div><div class=\"u\">عيد الجملة صح، من غير ما تجذب الانتباه ليها. I go to the cinema بتبقى: آه، you went to the cinema، حلو.</div>", "n": 1, "i": 60, "a": "tefl-33-056", "x": "09dd12da"}, {"t": "learn", "h": "<div class=\"u\">Use this when you do not want to interrupt the flow of conversation, or discourage the student from continuing.</div><div class=\"u\">استخدم ده لما مابتبقاش عايز تقاطع تدفق المحادثة، أو تحبط الطالب عن الاستمرار.</div>", "n": 1, "i": 61, "a": "tefl-33-057", "x": "da3c48cf"}, {"t": "learn", "h": "<div class=\"u\">To make it clearer an error was made, recast more obviously: so you mean you do not agree with Sara, you disagree with her.</div><div class=\"u\">عشان توضح أكتر إن في خطأ، أعد الصياغة بشكل أوضح: يعني إنت قصدك you do not agree with Sara، يعني you disagree with her.</div>", "n": 1, "i": 62, "a": "tefl-33-058", "x": "8872f074"}, {"t": "learn", "h": "<div class=\"u\">Even with on-the-spot correction, note any problems to review afterwards.</div><div class=\"u\">حتى مع التصحيح الفوري، سجّل أي مشاكل عشان تراجعها بعدين.</div>", "n": 1, "i": 63, "a": "tefl-33-059", "x": "70a12d73"}, {"t": "learn", "h": "<div class=\"u\">Students may repeat the same mistake because they never really absorbed the correction. Self-correction is remembered better.</div><div class=\"u\">الطلبة ممكن يعيدوا نفس الغلط لأنهم ماستوعبوش التصحيح فعلًا. التصحيح الذاتي بيتفتكر أحسن.</div>", "n": 1, "i": 64, "a": "tefl-33-060", "x": "81718b26"}, {"t": "learn", "h": "<div class=\"u\">But you can drill corrections even when you gave them. Later, go back: do you remember when you said I'm not agree? What did I say instead?</div><div class=\"u\">بس تقدر تدرّب التصحيحات حتى لو إنت اللي قلتها. بعدين، ارجع: فاكر لما قلت I'm not agree؟ أنا قلت إيه بدلها؟</div>", "n": 1, "i": 65, "a": "tefl-33-061", "x": "808c7b12"}, {"t": "learn", "h": "<div class=\"u\">Then build it back up with questions: who do you not agree with? What is the opposite of agree? We can add a prefix.</div><div class=\"u\">وبعدين ابنيها تاني بأسئلة: مين اللي مش موافق عليه؟ إيه عكس agree؟ نقدر نزوّد بادئة.</div>", "n": 1, "i": 66, "a": "tefl-33-062", "x": "8849ac7b"}, {"t": "section", "h": "How: delayed and written | إزاي: المؤجل والمكتوب", "n": 1, "i": 67}, {"t": "learn", "h": "<div class=\"u\">With delayed correction, methods like finger correction and one-word questions still work, but you must reintroduce the problem sentence.</div><div class=\"u\">مع التصحيح المؤجل، طرق زي تصحيح الأصابع وأسئلة الكلمة الواحدة لسه شغالة، بس لازم تعيد تقديم الجملة المشكلة.</div>", "n": 1, "i": 68, "a": "tefl-33-063", "x": "c04d50db"}, {"t": "learn", "h": "<div class=\"u\">Unless several students said very similar incorrect sentences, change the exact phrases, to make them more anonymous.</div><div class=\"u\">إلا لو طلبة كتير قالوا جمل غلط متشابهة جدًا، غيّر الصياغات بالظبط، عشان تبقى أكتر خفاءً للهوية.</div>", "n": 1, "i": 69, "a": "tefl-33-064", "x": "29254077"}, {"t": "learn", "h": "<div class=\"u\">Write the sentence on the board and ask the class to identify the problem, before eliciting the correction.</div><div class=\"u\">اكتب الجملة على السبورة واطلب من الفصل يحدّدوا المشكلة، قبل ما تستخرج التصحيح.</div>", "n": 1, "i": 70, "a": "tefl-33-065", "x": "03f708e5"}, {"t": "learn", "h": "<div class=\"u\">Diagrams can help here: a line showing past, present, and future, with an x on last weekend, showing why we need the past form.</div><div class=\"u\">الرسوم ممكن تساعد هنا: خط بيوضح الماضي والحاضر والمستقبل، بعلامة x على آخر الأسبوع، بيوضح ليه محتاجين صيغة الماضي.</div>", "n": 1, "i": 71, "a": "tefl-33-066", "x": "a7f19e7a"}, {"t": "learn", "h": "<div class=\"u\">If students have just learnt a grammar rule, sometimes repeating the rule and modelling an example sentence is enough.</div><div class=\"u\">لو الطلبة لسه متعلمين قاعدة قواعد، ساعات تكرار القاعدة مع جملة نموذجية بيكفي.</div>", "n": 1, "i": 72, "a": "tefl-33-067", "x": "d9007eb2"}, {"t": "learn", "h": "<div class=\"u\">For pronunciation errors, indicate which syllable should be stressed.</div><div class=\"u\">لأخطاء النطق، وضّح أنهي مقطع المفروض يتنبّر.</div>", "n": 1, "i": 73, "a": "tefl-33-068", "x": "a6422b3b"}, {"t": "learn", "h": "<div class=\"u\">It is hard to get students to self-correct pronunciation, because you automatically correct when you say the word.</div><div class=\"u\">صعب تخلّي الطلبة يصحّحوا النطق بنفسهم، لأنك تلقائي بتصحّح وإنت بتقول الكلمة.</div>", "n": 1, "i": 74, "a": "tefl-33-069", "x": "e3a2e44b"}, {"t": "learn", "h": "<div class=\"u\">But if your class knows the phonemic chart, point to the sound they used and the correct one, or draw the symbol on the board.</div><div class=\"u\">بس لو فصلك عارف الخريطة الصوتية، أشّر على الصوت اللي استخدموه والصوت الصح، أو ارسم الرمز على السبورة.</div>", "n": 1, "i": 75, "a": "tefl-33-070", "x": "a88b1d51"}, {"t": "learn", "h": "<div class=\"u\">Errors in writing have to be corrected afterwards. But do not be tempted to give them everything on a plate.</div><div class=\"u\">أخطاء الكتابة لازم تتصحّح بعدين. بس ماتغريكش فكرة إنك تدّيهم كل حاجة جاهزة.</div>", "n": 1, "i": 76, "a": "tefl-33-071", "x": "d3159730"}, {"t": "learn", "h": "<div class=\"u\">The unit's correction code, solved. The symbol like an upside-down V means a word is missing. WO means word order.</div><div class=\"u\">كود التصحيح في الوحدة، محلول. الرمز اللي شبه حرف V مقلوب يعني كلمة ناقصة. WO يعني ترتيب كلمات.</div>", "n": 1, "i": 77, "a": "tefl-33-072", "x": "a6189570"}, {"t": "learn", "h": "<div class=\"u\">Also: ag means agreement, sp means spelling, p means punctuation, and v means vocabulary.</div><div class=\"u\">وكمان: ag يعني توافق، وsp يعني إملاء، وp يعني ترقيم، وv يعني مفردات.</div>", "n": 1, "i": 78, "a": "tefl-33-073", "x": "ed45ca57"}, {"t": "learn", "h": "<div class=\"u\">Use a correction code like this, and make a key at the beginning of the course for your students to refer to.</div><div class=\"u\">استخدم كود تصحيح زي ده، واعمل دليل رموز في بداية الكورس يرجع ليه طلبتك.</div>", "n": 1, "i": 79, "a": "tefl-33-074", "x": "a9e12fe0"}, {"t": "learn", "h": "<div class=\"u\">It motivates them to discover and correct their own errors, and it saves you time when marking.</div><div class=\"u\">بيحفّزهم يكتشفوا ويصحّحوا أخطائهم بنفسهم، وبيوفّرلك وقت في التصحيح.</div>", "n": 1, "i": 80, "a": "tefl-33-075", "x": "5afcc353"}, {"t": "section", "h": "Before you jump in + questions | قبل ما تصحّح + الأسئلة", "n": 1, "i": 81}, {"t": "learn", "h": "<div class=\"u\">Before you jump in to correct, think about four things.</div><div class=\"u\">قبل ما تنقز تصحّح، فكّر في أربع حاجات.</div>", "n": 1, "i": 82, "a": "tefl-33-076", "x": "c3f41d93"}, {"t": "learn", "h": "<div class=\"u\">One: is it appropriate to correct this error at all?</div><div class=\"u\">واحد: هل من المناسب أصلًا تصحّح الخطأ ده؟</div>", "n": 1, "i": 83, "a": "tefl-33-077", "x": "e75a4d74"}, {"t": "learn", "h": "<div class=\"u\">Two: is now the right time?</div><div class=\"u\">اتنين: هل الوقت الحالي هو الوقت المناسب؟</div>", "n": 1, "i": 84, "a": "tefl-33-078", "x": "075d408a"}, {"t": "learn", "h": "<div class=\"u\">Three: can they self-correct with a bit of prompting?</div><div class=\"u\">تلاتة: يقدروا يصحّحوا نفسهم بشوية تلميح؟</div>", "n": 1, "i": 85, "a": "tefl-33-079", "x": "8d458e1e"}, {"t": "learn", "h": "<div class=\"u\">Four: how can I correct without knocking their confidence?</div><div class=\"u\">أربعة: أصحّح إزاي من غير ما أكسر ثقتهم؟</div>", "n": 1, "i": 86, "a": "tefl-33-080", "x": "2a7f41fb"}, {"t": "learn", "h": "<div class=\"u\">Question one: I know her since I was at school. What type of error? Answer: grammar, incorrect tense.</div><div class=\"u\">سؤال واحد: I know her since I was at school. أنهي نوع خطأ؟ الإجابة: قواعد، زمن غلط.</div>", "n": 1, "i": 87, "a": "tefl-33-081", "x": "13ca9884"}, {"t": "learn", "h": "<div class=\"u\">The student used the present tense instead of the present perfect, for something that started in the past and still continues.</div><div class=\"u\">الطالب استخدم المضارع بدل المضارع التام، لحاجة بدأت في الماضي ولسه مستمرة.</div>", "n": 1, "i": 88, "a": "tefl-33-082", "x": "f7ebd6a6"}, {"t": "learn", "h": "<div class=\"u\">Question two: a pre-intermediate group studying likes and dislikes says I like go to the cinema. Correct it? Yes.</div><div class=\"u\">سؤال اتنين: مجموعة قبل المتوسط بتدرس الهوايات قالت I like go to the cinema. تصحّحها؟ أيوه.</div>", "n": 1, "i": 89, "a": "tefl-33-083", "x": "116b0dd8"}, {"t": "learn", "h": "<div class=\"u\">The error relates directly to the target language of that lesson, so correction is constructive.</div><div class=\"u\">الخطأ مرتبط مباشرة باللغة المستهدفة بتاعة الدرس، فالتصحيح مفيد.</div>", "n": 1, "i": 90, "a": "tefl-33-084", "x": "b4f8fbe9"}, {"t": "learn", "h": "<div class=\"u\">Question three: the symbol like a small roof, written on written homework, means what? Answer: a missing word.</div><div class=\"u\">سؤال تلاتة: الرمز اللي شبه سقف صغير، مكتوب على الواجب المكتوب، يعني إيه؟ الإجابة: كلمة ناقصة.</div>", "n": 1, "i": 91, "a": "tefl-33-085", "x": "e0015c96"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 92}, {"t": "learn", "h": "<div class=\"u\">error: a wrong form the student does not know yet.</div><div class=\"u\">خطأ: شكل غلط الطالب لسه مابيعرفوش.</div>", "n": 1, "i": 93, "a": "tefl-33-086", "x": "53d5e3c6"}, {"t": "learn", "h": "<div class=\"u\">mistake, slip: an accidental wrong use of a known form.</div><div class=\"u\">زلة: استخدام غلط بالصدفة لشكل معروف.</div>", "n": 1, "i": 94, "a": "tefl-33-087", "x": "d97dbbb8"}, {"t": "learn", "h": "<div class=\"u\">self-correction: the student fixing their own error.</div><div class=\"u\">التصحيح الذاتي: الطالب بيصلّح خطأه بنفسه.</div>", "n": 1, "i": 95, "a": "tefl-33-088", "x": "4ae66b73"}, {"t": "learn", "h": "<div class=\"u\">recast: repeating the sentence correctly without pointing at the error.</div><div class=\"u\">إعادة الصياغة الضمنية: تكرار الجملة صح من غير الإشارة للخطأ.</div>", "n": 1, "i": 96, "a": "tefl-33-089", "x": "b24bee42"}, {"t": "learn", "h": "<div class=\"u\">finger correction: using fingers to show each word of a phrase.</div><div class=\"u\">تصحيح الأصابع: استخدام الصوابع لعرض كل كلمة في العبارة.</div>", "n": 1, "i": 97, "a": "tefl-33-090", "x": "8179b516"}, {"t": "learn", "h": "<div class=\"u\">delayed correction: correcting after the activity ends.</div><div class=\"u\">التصحيح المؤجل: التصحيح بعد ما النشاط يخلص.</div>", "n": 1, "i": 98, "a": "tefl-33-091", "x": "be4713e4"}, {"t": "learn", "h": "<div class=\"u\">on-the-spot correction: correcting immediately as it happens.</div><div class=\"u\">التصحيح الفوري: التصحيح في نفس اللحظة.</div>", "n": 1, "i": 99, "a": "tefl-33-092", "x": "5cffe71a"}, {"t": "learn", "h": "<div class=\"u\">correction code: symbols marking error types in writing.</div><div class=\"u\">كود التصحيح: رموز بتحدد أنواع الأخطاء في الكتابة.</div>", "n": 1, "i": 100, "a": "tefl-33-093", "x": "55268240"}, {"t": "learn", "h": "<div class=\"u\">word stress: the syllable that gets the emphasis in a word.</div><div class=\"u\">نبر الكلمة: المقطع اللي بياخد التشديد في الكلمة.</div>", "n": 1, "i": 101, "a": "tefl-33-094", "x": "7977e63b"}, {"t": "learn", "h": "<div class=\"u\">target language: the language point of the lesson.</div><div class=\"u\">اللغة المستهدفة: النقطة اللغوية بتاعة الدرس.</div>", "n": 1, "i": 102, "a": "tefl-33-095", "x": "c63d8def"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 103}, {"t": "learn", "h": "<div class=\"u\">Errors show experimentation, not failure. Correct them without destroying confidence.</div><div class=\"u\">الأخطاء بتوضح تجريب، مش فشل. صحّحها من غير ما تدمّر الثقة.</div>", "n": 1, "i": 104, "a": "tefl-33-096", "x": "93e5c8f3"}, {"t": "learn", "h": "<div class=\"u\">An error is unknown form; a mistake is a slip. Watch slips that repeat.</div><div class=\"u\">الخطأ هو شكل مش معروف؛ الزلة غلطة صدفة. راقب الزلات المتكررة.</div>", "n": 1, "i": 105, "a": "tefl-33-097", "x": "dc20084c"}, {"t": "learn", "h": "<div class=\"u\">Correct what matches the lesson aim: the target language in grammar lessons, little or nothing in fluency lessons.</div><div class=\"u\">صحّح اللي يناسب هدف الدرس: اللغة المستهدفة في دروس القواعد، القليل أو لاشيء في دروس الطلاقة.</div>", "n": 1, "i": 106, "a": "tefl-33-098", "x": "c622867e"}, {"t": "learn", "h": "<div class=\"u\">When: at the end, later, or not at all for speaking; anonymous and generalised when delayed.</div><div class=\"u\">إمتى: في الآخر أو بعدين أو خالص في الكلام؛ مجهول ومعمّم لما يتأجل.</div>", "n": 1, "i": 107, "a": "tefl-33-099", "x": "de576316"}, {"t": "learn", "h": "<div class=\"u\">How: prompt self-correction first, recast when needed, use codes in writing, and always protect confidence.</div><div class=\"u\">إزاي: شجّع التصحيح الذاتي الأول، أعد الصياغة عند الحاجة، استخدم رموز في الكتابة، ودايمًا احمي الثقة.</div>", "n": 1, "i": 108, "a": "tefl-33-100", "x": "cd1382bd"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 109}, {"t": "mc", "q": "I know her since I was at school is what type of error?<br>I know her since I was at school أنهي نوع خطأ؟", "opts": ["grammar, incorrect tense | قواعد، زمن غلط", "pronunciation | نطق", "noun-verb agreement | توافق الفعل والفاعل"], "ans": 0, "why": "It needs the present perfect, not the present, for something starting in the past and continuing. | محتاجة المضارع التام، مش المضارع، لحاجة بدأت في الماضي ومستمرة.", "ex": ["Correct. | صح.", "No. The sounds are fine. | غلط: الأصوات سليمة.", "No. The verb agrees with the subject. | غلط: الفعل متوافق مع الفاعل."], "n": 1, "i": 110, "h": ""}, {"t": "mc", "q": "Can you do me a pleasure? is what type of error?<br>Can you do me a pleasure؟ أنهي نوع خطأ؟", "opts": ["lexis, incorrect word | مفردات، كلمة غلط", "pronunciation, word stress | نطق، نبر الكلمة", "grammar, word order | قواعد، ترتيب كلمات"], "ans": 0, "why": "The word should be favour; pleasure is the wrong word and potentially vulgar. | الكلمة المفروض favour؛ pleasure كلمة غلط وممكن تبقى فاضحة.", "ex": ["Correct. | صح.", "No. It is a vocabulary problem. | غلط: دي مشكلة مفردات.", "No. The order is fine. | غلط: الترتيب سليم."], "n": 1, "i": 111, "h": ""}, {"t": "tf", "q": "An error is when the student knows the correct form but says it wrong by accident.<br>الخطأ هو لما الطالب عارف الشكل الصح بس بيقوله غلط بالصدفة.", "ans": false, "why": "False. That is a mistake. An error means the student does not know the correct form. | غلط. دي زلة. الخطأ يعني الطالب مابيعرفش الشكل الصح.", "ex": ["Wrong. Knowing it but slipping is a mistake. | غلط: معرفته مع الزلل دي زلة.", "Correct. | صح."], "n": 1, "i": 112, "h": ""}, {"t": "mc", "q": "In a fluency-focused skills lesson, when students make errors, the teacher should usually:<br>في درس مهارات مركّز على الطلاقة، لما الطلبة يعملوا أخطاء، المدرس غالبًا المفروض:", "opts": ["correct later, or not at all | يصحّح بعدين، أو خالص", "interrupt and correct every error immediately | يقاطع ويصحّح كل خطأ فورًا", "stop the activity | يوقف النشاط"], "ans": 0, "why": "Interrupting obstructs the main goal of fluid spoken language. | المقاطعة بتعوق الهدف الأساسي: الكلام السليس.", "ex": ["Correct. | صح.", "No. That hinders fluency. | غلط: ده بيعطّل الطلاقة.", "No. Let them keep speaking. | غلط: سيبهم يكملوا كلام."], "n": 1, "i": 113, "h": ""}, {"t": "mc", "q": "The symbol like a small roof on written homework means:<br>الرمز اللي شبه سقف صغير على الواجب المكتوب يعني:", "opts": ["a missing word | كلمة ناقصة", "an agreement error | خطأ توافق", "punctuation | ترقيم"], "ans": 0, "why": "In the correction code, that mark shows a word is missing. | في كود التصحيح، العلامة دي بتوضح إن في كلمة ناقصة.", "ex": ["Correct. | صح.", "No. Agreement is marked ag. | غلط: التوافق بيتعلّم بـag.", "No. Punctuation is marked p. | غلط: الترقيم بيتعلّم بـp."], "n": 1, "i": 114, "h": ""}, {"t": "mc", "q": "In finger correction, skipping a finger shows:<br>في تصحيح الأصابع، تخطّي صباع بيوضح:", "opts": ["a missing word | كلمة ناقصة", "a wrong tense | زمن غلط", "bad spelling | إملاء غلط"], "ans": 0, "why": "Each finger is a word; skipping one marks the gap where a word is missing. | كل صباع كلمة؛ تخطي واحد بيحدد الفجوة اللي فيها كلمة ناقصة.", "ex": ["Correct. | صح.", "No. Holding a finger marks the problem word. | غلط: الوقوف عند صباع بيحدد الكلمة المشكلة.", "No. Spelling is a writing issue. | غلط: الإملاء مشكلة كتابة."], "n": 1, "i": 115, "h": ""}, {"t": "tf", "q": "Recasting means repeating the student's sentence correctly without directly pointing out the error.<br>إعادة الصياغة الضمنية يعني تكرار جملة الطالب صح من غير ما نشاور على الخطأ مباشرة.", "ans": true, "why": "True. It keeps the conversation flowing and does not discourage the speaker. | صح. بتحافظ على تدفق المحادثة ومابتحبطش المتحدث.", "ex": ["Correct. | صح.", "Wrong. That is exactly what a recast is. | غلط: ده بالظبط تعريف إعادة الصياغة."], "n": 1, "i": 116, "h": ""}, {"t": "mc", "q": "The best first move for learner confidence is:<br>أحسن أول خطوة لثقة المتعلم هي:", "opts": ["prompt the student to self-correct | لمّح للطالب يصحّح نفسه", "correct publicly by name | صحّح بالاسم قدام الكل", "ignore all errors forever | تجاهل كل الأخطاء للأبد"], "ans": 0, "why": "Self-correction is remembered better and protects confidence. | التصحيح الذاتي بيتفتكر أحسن وبيحمي الثقة.", "ex": ["Correct. | صح.", "No. Being singled out is never pleasant. | غلط: التفرّد بالتصحيح مش لطيف أبدًا.", "No. They would never improve. | غلط: عمرهم ما هيتحسّنوا كده."], "n": 1, "i": 117, "h": ""}, {"t": "recall", "q": "Name the three main areas of error correction research.<br>اذكر المحاور التلاتة الرئيسية لأبحاث تصحيح الأخطاء.", "a": "What to correct, when to correct, and how to correct.<br>إيه اللي نصحّحه، وإمتى نصحّحه، وإزاي نصحّحه.", "n": 1, "i": 118, "h": ""}, {"t": "recall", "q": "Give the four questions to ask yourself before correcting.<br>اذكر الأربع أسئلة اللي تسألها لنفسك قبل ما تصحّح.", "a": "Is it appropriate? Is now the right time? Can they self-correct with prompting? How can I correct without knocking their confidence?<br>هل مناسب؟ هل الوقت مناسب؟ يقدروا يصحّحوا نفسهم بتلميح؟ أصحّح إزاي من غير ما أكسر ثقتهم؟", "n": 1, "i": 119, "h": ""}, {"t": "write", "q": "Why should delayed correction be anonymous? (3-4 sentences)<br>ليه التصحيح المؤجل المفروض يكون مجهول؟ (٣-٤ جمل).", "key": "tefl-33:1", "a": "Being singled out in front of classmates is never pleasant, and it can embarrass a student into silence. Anonymous correction keeps the focus on the language, not the person. Changing the exact phrases also lets you merge similar errors from several students into one example. And everyone benefits anyway: generalised correction reaches students who make the same error but were not caught this time.<br>إن حد يتفرّد بالتصحيح قدام زمايله حاجة مش لطيفة أبدًا، وممكن تحرج الطالب لدرجة السكوت. التصحيح المجهول بيخلّي التركيز على اللغة، مش على الشخص. وتغيير الصياغات بالظبط بيخلّيك تدمج أخطاء متشابهة من طلبة كتير في مثال واحد. والكل بيستفيد على أي حال: التصحيح المعمّم بيوصل لطلبة بيعملوا نفس الخطأ بس مااتمسكوش المرة دي.", "n": 1, "i": 120, "h": ""}, {"t": "write", "q": "Explain the difference between an error and a mistake, and its effect on correction (3-4 sentences).<br>اشرح الفرق بين الخطأ والزلة، وتأثيره على التصحيح (٣-٤ جمل).", "key": "tefl-33:2", "a": "An error means the student does not know the correct form yet, so it needs teaching. A mistake is a slip: the student knows the form but said it wrong by accident. Correcting every slip makes learners hesitant and dependent on your confirmation. But watch repeated slips, because a mistake repeated often enough can harden into an error.<br>الخطأ يعني الطالب لسه مابيعرفش الشكل الصح، فده محتاج تعليم. الزلة غلطة صدفة: الطالب عارف الشكل بس قاله غلط. تصحيح كل زلة بيخلّي المتعلمين مترددين ومعتمدين على تأكيدك. بس راقب الزلات المتكررة، لأن الزلة المتعادة كفاية ممكن تتصلّب وتتحوّل لخطأ.", "n": 1, "i": 121, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 6 begins, with new units and new questions.</div><div class=\"u\">الدرس الجاي: بداية الموديول السادس، بوحدات وأسئلة جديدة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 122}];</script>
