<h1>عالم تيفل ٣٠: مواد من عمل المدرس</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٣٠</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-30";window.STEPS=[{"t": "section", "h": "Why make your own | ليه تعمل موادك بنفسك", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">This unit focuses on two situations. One: you teach with minimal resources, and no ready-made supplementary materials are available.</div><div class=\"u\">الوحدة دي بتركّز على موقفين. واحد: بتدرّس بموارد قليلة جدًا، ومفيش مواد إضافية جاهزة متوفرة.</div>", "n": 1, "i": 1, "a": "tefl-30-001", "x": "88f718db"}, {"t": "learn", "h": "<div class=\"u\">Two: your coursebook, if you have one, lacks the types of materials you want.</div><div class=\"u\">اتنين: الكتاب المقرر بتاعك، لو عندك واحد، ناقصه أنواع المواد اللي عايزها.</div>", "n": 1, "i": 2, "a": "tefl-30-002", "x": "b2595d8b"}, {"t": "learn", "h": "<div class=\"u\">In these situations, you must resolve this yourself and make them.</div><div class=\"u\">في المواقف دي، لازم تحل المشكلة بنفسك وتعملها.</div>", "n": 1, "i": 3, "a": "tefl-30-003", "x": "b37390b7"}, {"t": "learn", "h": "<div class=\"u\">Your supplementary materials are worksheets and other materials you make, to use in addition to the classroom text, if there is one.</div><div class=\"u\">موادك الإضافية هي أوراق عمل ومواد تانية بتعملها، بتتستخدم زيادة على النص المقرر، لو في واحد.</div>", "n": 1, "i": 4, "a": "tefl-30-004", "x": "4dc7c6db"}, {"t": "learn", "h": "<div class=\"u\">They include skills development materials, grammar, vocabulary and phonology practice materials, and collections of communicative activities.</div><div class=\"u\">بتشمل مواد تنمية مهارات، ومواد تمرين قواعد ومفردات وصوتيات، ومجموعات أنشطة تواصلية.</div>", "n": 1, "i": 5, "a": "tefl-30-005", "x": "302f6838"}, {"t": "learn", "h": "<div class=\"u\">Supplementary materials may also come from authentic sources, like newspaper and magazine articles, pictures, and videos.</div><div class=\"u\">المواد الإضافية ممكن كمان تيجي من مصادر أصلية، زي مقالات الجرايد والمجلات، والصور، والفيديوهات.</div>", "n": 1, "i": 6, "a": "tefl-30-006", "x": "7d56d807"}, {"t": "learn", "h": "<div class=\"u\">You can use your materials to overcome the lack of materials when teaching with minimal resources.</div><div class=\"u\">تقدر تستخدم موادك عشان تتغلّب على نقص المواد لما بتدرّس بموارد قليلة.</div>", "n": 1, "i": 7, "a": "tefl-30-007", "x": "cfd759b5"}, {"t": "learn", "h": "<div class=\"u\">Also: to replace unsuitable material in the classroom text, and to fill gaps in it.</div><div class=\"u\">وكمان: عشان تحل محل المادة غير المناسبة في النص المقرر، وتملي الفجوات فيه.</div>", "n": 1, "i": 8, "a": "tefl-30-008", "x": "c83c2a0a"}, {"t": "learn", "h": "<div class=\"u\">Also: to provide material appropriate for your learners' particular needs and interests.</div><div class=\"u\">وكمان: عشان توفّر مادة مناسبة لاحتياجات متعلميك الخاصة واهتماماتهم.</div>", "n": 1, "i": 9, "a": "tefl-30-009", "x": "568c0068"}, {"t": "learn", "h": "<div class=\"u\">Also: to give learners extra language or skills practice, and to add variety to your teaching.</div><div class=\"u\">وكمان: عشان تدّي المتعلمين تمرين لغة أو مهارات زيادة، وتزوّد تنويع لتدريسك.</div>", "n": 1, "i": 10, "a": "tefl-30-010", "x": "8a6d004c"}, {"t": "learn", "h": "<div class=\"u\">Making your own materials may seem daunting at first, but it is not, if you know what to do.</div><div class=\"u\">عمل موادك بنفسك ممكن يبان مخيف في الأول، بس هو مش كده، لو عارف بتعمل إيه.</div>", "n": 1, "i": 11, "a": "tefl-30-011", "x": "8bdbd9d7"}, {"t": "learn", "h": "<div class=\"u\">Teacher-made materials can be very effective, when they are relevant and personalised, answering learners' needs in a way no other materials can.</div><div class=\"u\">مواد المدرس ممكن تكون فعّالة جدًا، لما تكون مناسبة وشخصية، بتجاوب على احتياجات المتعلمين بطريقة مفيش مواد تانية تقدر عليها.</div>", "n": 1, "i": 12, "a": "tefl-30-012", "x": "ac8870f1"}, {"t": "section", "h": "The four benefits | المميزات الأربعة", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">Benefit one: making materials fit the context. Commercial materials for the global EFL market face criticisms.</div><div class=\"u\">الميزة الأولى: إنك تخلّي المواد تناسب السياق. المواد التجارية لسوق الإنجليزية العالمي عليها انتقادات.</div>", "n": 1, "i": 14, "a": "tefl-30-013", "x": "1c5ac7b8"}, {"t": "learn", "h": "<div class=\"u\">They are too generic, including those for young learners. They are not geared to specific groups of learners.</div><div class=\"u\">هي عامة أوي، حتى اللي لصغار المتعلمين. مش متوجهة لمجموعات متعلمين محددة.</div>", "n": 1, "i": 15, "a": "tefl-30-014", "x": "25a3d927"}, {"t": "learn", "h": "<div class=\"u\">They are not geared to any specific educational or cultural context.</div><div class=\"u\">ومش متوجهة لأي سياق تعليمي أو ثقافي محدد.</div>", "n": 1, "i": 16, "a": "tefl-30-015", "x": "e9abd54c"}, {"t": "learn", "h": "<div class=\"u\">They contain functions and speech based on situations most foreign language learners will never be in.</div><div class=\"u\">فيها وظايف وكلام مبني على مواقف معظم متعلمي اللغة الأجنبية عمرهم ما هيكونوا فيها.</div>", "n": 1, "i": 17, "a": "tefl-30-016", "x": "880e5431"}, {"t": "learn", "h": "<div class=\"u\">And they are Anglo-centric in construction and production, so they do not reflect any local varieties of English.</div><div class=\"u\">وهي بريطانية-أمريكية المركز في تصميمها وإنتاجها، فمابتعكسش أي نوعات محلية من الإنجليزية.</div>", "n": 1, "i": 18, "a": "tefl-30-017", "x": "dcf7de06"}, {"t": "learn", "h": "<div class=\"u\">So many teachers find it much better to make their own materials, fitting their own educational and cultural context.</div><div class=\"u\">عشان كده مدرسين كتير بيلاقوا إنه أحسن بكتير يعملوا موادهم بنفسهم، مناسبة لسياقهم التعليمي والثقافي.</div>", "n": 1, "i": 19, "a": "tefl-30-018", "x": "1179f35f"}, {"t": "learn", "h": "<div class=\"u\">Benefit two: making them fit the individual learners. Generic materials cannot address every unique learner, but you can.</div><div class=\"u\">الميزة التانية: إنك تخلّيها تناسب المتعلمين الأفراد. المواد العامة مابتقدرش تخاطب كل متعلم فريد، بس إنت تقدر.</div>", "n": 1, "i": 20, "a": "tefl-30-019", "x": "4ed7cd30"}, {"t": "learn", "h": "<div class=\"u\">Create or adapt materials to individual needs and learning styles.</div><div class=\"u\">اعمل أو كيّف مواد على الاحتياجات الفردية وأنماط التعلم.</div>", "n": 1, "i": 21, "a": "tefl-30-020", "x": "6936dbff"}, {"t": "learn", "h": "<div class=\"u\">Take into account the learners' first language, culture, and personal experiences.</div><div class=\"u\">خد في الاعتبار لغة المتعلمين الأم وثقافتهم وتجاربهم الشخصية.</div>", "n": 1, "i": 22, "a": "tefl-30-021", "x": "67b0ae4d"}, {"t": "learn", "h": "<div class=\"u\">Aim at the right level for particular learners, so materials present an appropriate challenge and degree of success.</div><div class=\"u\">صوّب على المستوى المناسب لمتعلمين معينين، عشان المواد تقدّم تحدي مناسب ودرجة نجاح مناسبة.</div>", "n": 1, "i": 23, "a": "tefl-30-022", "x": "950a3013"}, {"t": "learn", "h": "<div class=\"u\">And change the often-repetitive model of the coursebook, to add variety and meet developing needs.</div><div class=\"u\">وغيّر النموذج المتكرر غالبًا في الكتاب المقرر، عشان تزوّد تنويع وتلبّي الاحتياجات المتطورة.</div>", "n": 1, "i": 24, "a": "tefl-30-023", "x": "0fd5977d"}, {"t": "learn", "h": "<div class=\"u\">Benefit three: making them fit today's events. Commercial materials cannot keep up to date with local and international events.</div><div class=\"u\">الميزة التالتة: إنك تخلّيها مناسبة لأحداث النهاردة. المواد التجارية مابتقدرش تواكب الأحداث المحلية والدولية.</div>", "n": 1, "i": 25, "a": "tefl-30-024", "x": "1fee34d7"}, {"t": "learn", "h": "<div class=\"u\">World and country changes happen rapidly. Only teachers on the ground can make materials relevant to today's world.</div><div class=\"u\">التغييرات في العالم والبلد بتحصل بسرعة. بس المدرسين على أرض الواقع هما اللي يقدروا يخلّوا المواد مناسبة لعالم النهاردة.</div>", "n": 1, "i": 26, "a": "tefl-30-025", "x": "047c3f39"}, {"t": "learn", "h": "<div class=\"u\">Benefit four: lack of finance. Many schools have no budget for modern resources.</div><div class=\"u\">الميزة الرابعة: نقص التمويل. مدارس كتير ماعندهاش ميزانية لموارد حديثة.</div>", "n": 1, "i": 27, "a": "tefl-30-026", "x": "4618e98b"}, {"t": "learn", "h": "<div class=\"u\">Instead of moaning, most teachers step up and design their own materials. The school and the learners appreciate it.</div><div class=\"u\">بدل الشكوى، معظم المدرسين بيتقدموا وبيعملوا موادهم بنفسهم. المدرسة والمتعلمين بيقدّروا ده.</div>", "n": 1, "i": 28, "a": "tefl-30-027", "x": "bb3dcc09"}, {"t": "section", "h": "Guidelines 1-5 | الإرشادات ١-٥", "n": 1, "i": 29}, {"t": "learn", "h": "<div class=\"u\">Remember the Cheshire Cat in Alice in Wonderland. If you do not care where you want to get to, it does not matter which way you go.</div><div class=\"u\">فاكر القط تشيشاير في أليس في بلاد العجايب. لو مابتهمكش توصل فين، يبقى ماتهمكش تاخد أنهي طريق.</div>", "n": 1, "i": 30, "a": "tefl-30-028", "x": "e44cabd3"}, {"t": "learn", "h": "<div class=\"u\">If you have little experience designing materials, you need a route to follow, or you and your learners may miss learning opportunities.</div><div class=\"u\">لو خبرتك قليلة في تصميم المواد، لازم طريق تمشي عليه، وإلا إنت ومتعلميك ممكن تفوّتوا فرص تعلم.</div>", "n": 1, "i": 31, "a": "tefl-30-029", "x": "49ee58a4"}, {"t": "learn", "h": "<div class=\"u\">Guideline one: meet your learners' needs. Language skills, cultural and educational context, experiences, learning preferences, and interests.</div><div class=\"u\">إرشاد واحد: لبّي احتياجات متعلميك. المهارات اللغوية، والسياق الثقافي والتعليمي، والتجارب، وتفضيلات التعلم، والاهتمامات.</div>", "n": 1, "i": 32, "a": "tefl-30-030", "x": "b82debf2"}, {"t": "learn", "h": "<div class=\"u\">Be aware of culture-specific learning processes. In some countries parents and institutions want less fun and more work.</div><div class=\"u\">خد بالك من عمليات التعلم الخاصة بكل ثقافة. في بلاد معينة الأهالي والمؤسسات عايزين مرح أقل وشغل أكتر.</div>", "n": 1, "i": 33, "a": "tefl-30-031", "x": "6e32adce"}, {"t": "learn", "h": "<div class=\"u\">Some places emphasise rote learning, like lists of vocabulary to memorise, even out of context.</div><div class=\"u\">بعض الأماكن بتركّز على التعلم بالحفظ، زي قوايم مفردات تتحفظ، حتى من غير سياق.</div>", "n": 1, "i": 34, "a": "tefl-30-032", "x": "f441afed"}, {"t": "learn", "h": "<div class=\"u\">Always link materials with what learners already know, or the objective will need a lot of extra input.</div><div class=\"u\">دايمًا اربط المواد باللي المتعلمين عارفينه خلاص، وإلا الهدف هيحتاج مدخلات زيادة كتير.</div>", "n": 1, "i": 35, "a": "tefl-30-033", "x": "54d934e7"}, {"t": "learn", "h": "<div class=\"u\">If something must be included but is not linked to their knowledge, clarify the inclusion before they start.</div><div class=\"u\">لو في حاجة لازم تتضمّن بس مش مربوطة بمعرفتهم، وضّح الربط قبل ما يبدأوا.</div>", "n": 1, "i": 36, "a": "tefl-30-034", "x": "fd4fab37"}, {"t": "learn", "h": "<div class=\"u\">Guideline two: fit your materials with the goals and objectives of the syllabus and curriculum, if these are in place. Know the complete syllabus well.</div><div class=\"u\">إرشاد اتنين: طابِق موادك مع أهداف المنهج والمقرر، لو دول موجودين. اعرف المنهج الكامل كويس.</div>", "n": 1, "i": 37, "a": "tefl-30-035", "x": "1005877a"}, {"t": "learn", "h": "<div class=\"u\">Guideline three: consider your skill base. Designing from scratch needs experience, creativity, artistic skills, and an understanding of materials design.</div><div class=\"u\">إرشاد تلاتة: بص على مهاراتك. التصميم من الصفر محتاج خبرة وإبداع ومهارات فنية وفهم لتصميم المواد.</div>", "n": 1, "i": 38, "a": "tefl-30-036", "x": "cadee342"}, {"t": "learn", "h": "<div class=\"u\">When in place, ask others for help where you need it. Do not hold back. And many internet sites can guide you in drawing.</div><div class=\"u\">ولما تكون في الشغل، اطلب مساعدة غيرك لما تحتاجها. ماتستحيش. ومواقع إنترنت كتير تقدر ترشدك في الرسم.</div>", "n": 1, "i": 39, "a": "tefl-30-037", "x": "9cfd8a6b"}, {"t": "learn", "h": "<div class=\"u\">Guideline four: search for resources. Do not plan materials you have no resources to build well.</div><div class=\"u\">إرشاد أربعة: دوّر على الموارد. ماتخططش لمواد ماعندكش الموارد تعملها كويس.</div>", "n": 1, "i": 40, "a": "tefl-30-038", "x": "6533fe2d"}, {"t": "learn", "h": "<div class=\"u\">Some say you need computers, internet, a colour photocopier, a laminator, a CD player. Teachers have survived for years in the heart of Africa without any of these.</div><div class=\"u\">بعضهم بيقول إنك محتاج كمبيوترات وإنترنت وماكينة تصوير ألوان ولمينيتور ومشغل CD. مدرسين عاشوا كويس سنين في قلب أفريقيا من غير ولا واحدة من دول.</div>", "n": 1, "i": 41, "a": "tefl-30-039", "x": "beb042e7"}, {"t": "learn", "h": "<div class=\"u\">They made friends inside and outside school, and soon had access to some tools. You will never get if you do not ask.</div><div class=\"u\">عملوا صحاب جوه وبره المدرسة، وسرعان ما وصلوا لبعض الأدوات. عمرك ما هتوصل لو ماسألتش.</div>", "n": 1, "i": 42, "a": "tefl-30-040", "x": "7b57ef35"}, {"t": "learn", "h": "<div class=\"u\">Schools are busy, and other teachers may plan to use the same resource. Plan with the administration and book these well in advance.</div><div class=\"u\">المدارس أماكن مشغولة، ومدرسين تانيين ممكن يخططوا يستخدموا نفس المورد. خطط مع الإدارة واحجز دول قبلها بوقت كويس.</div>", "n": 1, "i": 43, "a": "tefl-30-041", "x": "7d561409"}, {"t": "learn", "h": "<div class=\"u\">Guideline five: consider copyright. Yes, you must, for your sake and your school's sake.</div><div class=\"u\">إرشاد خمسة: خد بالك من حقوق النشر. أيوه، لازم، لصالحك ولصالح مدرستك.</div>", "n": 1, "i": 44, "a": "tefl-30-042", "x": "39a91da9"}, {"t": "learn", "h": "<div class=\"u\">If material used in class then appears in the school brochure or website, that could cause a problem for the school.</div><div class=\"u\">لو مادة اتستخدمت في الفصل وبعدين ظهرت في بروشور المدرسة أو موقعها، ده ممكن يسبب مشكلة للمدرسة.</div>", "n": 1, "i": 45, "a": "tefl-30-043", "x": "2ca79de7"}, {"t": "learn", "h": "<div class=\"u\">If the creator says free classroom use, fine. If they say ask permission, follow up and seek it. If they say no, steer clear.</div><div class=\"u\">لو صاحب العمل قال استخدام مجاني في الفصل، تمام. لو قال اطلب إذن، كمّل واطلبه. لو قال لأ، ابعد عنه.</div>", "n": 1, "i": 46, "a": "tefl-30-044", "x": "26b09480"}, {"t": "learn", "h": "<div class=\"u\">An idea cannot be copyrighted. You may see something that sparks your interest and make your own material based on that idea.</div><div class=\"u\">الفكرة مابتتعملهاش حقوق نشر. ممكن تشوف حاجة تلهمك وتعمل مادتك بنفسك مبنية على الفكرة.</div>", "n": 1, "i": 47, "a": "tefl-30-045", "x": "a2768c2d"}, {"t": "learn", "h": "<div class=\"u\">But lifting photos and text exactly as originally produced is generally not allowed. Some sites offer copyright-free images at a price.</div><div class=\"u\">بس نسخ الصور والنصوص زي ما اتنتجت بالظبط عمومًا مش مسموح. بعض المواقع بتوفر صور من غير حقوق بفلوس.</div>", "n": 1, "i": 48, "a": "tefl-30-046", "x": "a5196413"}, {"t": "section", "h": "Guidelines 6-10 | الإرشادات ٦-١٠", "n": 1, "i": 49}, {"t": "learn", "h": "<div class=\"u\">Guideline six: work out your time. Experienced teachers share one fact: it always takes longer than you think.</div><div class=\"u\">إرشاد ستة: احسب وقتك. المدرسين الخبرة بيشاركوا حقيقة واحدة: دايمًا بياخد وقت أطول مما بتتخيل.</div>", "n": 1, "i": 50, "a": "tefl-30-047", "x": "43ac983a"}, {"t": "learn", "h": "<div class=\"u\">Guideline seven: stimulate interaction within cultural rules. Give your materials a communicative purpose.</div><div class=\"u\">إرشاد سبعة: خلّي موادك بتحفّز التفاعل جوه القواعد الثقافية. ادّي موادك هدف تواصلي.</div>", "n": 1, "i": 51, "a": "tefl-30-048", "x": "db4cc0bb"}, {"t": "learn", "h": "<div class=\"u\">Interaction should match the types they will meet in the outside world. A simple information gap worksheet can do the job.</div><div class=\"u\">التفاعل المفروض يناسب الأنواع اللي هيقابلوها في العالم الحقيقي. ورقة فجوة معلومات بسيطة تقدر تعمل المطلوب.</div>", "n": 1, "i": 52, "a": "tefl-30-049", "x": "847673b2"}, {"t": "learn", "h": "<div class=\"u\">Spoken communication is not just words. Consider turn-taking, me then you then me, and personal space, called proxemics.</div><div class=\"u\">التواصل المنطوق مش بس كلمات. خد في الاعتبار تبادل الأدوار، أنا وبعدين إنت وبعدين أنا، والمسافة الشخصية، اللي اسمها بروكزيمكس.</div>", "n": 1, "i": 53, "a": "tefl-30-050", "x": "db131a51"}, {"t": "learn", "h": "<div class=\"u\">Guideline eight: stretch your learners. Materials must stretch their knowledge, understanding, and application skills.</div><div class=\"u\">إرشاد تمانية: مدّ متعلميك. المواد لازم تمدّ معرفتهم وفهمهم ومهارات التطبيق.</div>", "n": 1, "i": 54, "a": "tefl-30-051", "x": "ca5a4d7b"}, {"t": "learn", "h": "<div class=\"u\">Build on what they know, and add new items like new vocabulary or a new structure.</div><div class=\"u\">ابني على اللي عارفينه، وزوّد عناصر جديدة زي مفردات أو تركيب جديد.</div>", "n": 1, "i": 55, "a": "tefl-30-052", "x": "c1f08a4c"}, {"t": "learn", "h": "<div class=\"u\">This stretches them to generate new language, by guessing, predicting, hypothesising, and noticing links.</div><div class=\"u\">ده بيمدّهم يولّدوا لغة جديدة، بالتخمين والتوقع ووضع الفروض وملاحظة الروابط.</div>", "n": 1, "i": 56, "a": "tefl-30-053", "x": "54e6624f"}, {"t": "learn", "h": "<div class=\"u\">Guideline nine: develop their how-to-learn skills. Teach learning strategies for communication difficulties.</div><div class=\"u\">إرشاد تسعة: طوّر مهارات إزاي يتعلموا. علّمهم استراتيجيات تعلم لصعوبات التواصل.</div>", "n": 1, "i": 57, "a": "tefl-30-054", "x": "37df876f"}, {"t": "learn", "h": "<div class=\"u\">Examples: re-wording, saying it in a different way, and good body language like facial expressions and nodding.</div><div class=\"u\">أمثلة: إعادة الصياغة، قولها بطريقة تانية، ولغة جسم كويسة زي تعبيرات الوش والإيماء بالراس.</div>", "n": 1, "i": 58, "a": "tefl-30-055", "x": "ec88b138"}, {"t": "learn", "h": "<div class=\"u\">Through time, young learners can also be taught to self-evaluate their work.</div><div class=\"u\">ومع الوقت، صغار المتعلمين يقدروا يتعلموا يقيّموا شغلهم بنفسهم.</div>", "n": 1, "i": 59, "a": "tefl-30-056", "x": "69ba777f"}, {"t": "learn", "h": "<div class=\"u\">Guideline ten: focus on form too. Communicative classrooms often emphasise expression and neglect language form.</div><div class=\"u\">إرشاد عشرة: ركّز على الشكل كمان. الفصول التواصلية غالبًا بتركّز على التعبير وبتهمل شكل اللغة.</div>", "n": 1, "i": 60, "a": "tefl-30-057", "x": "8db85bd5"}, {"t": "learn", "h": "<div class=\"u\">Inexperienced teachers may be unsure of grammar themselves, but you owe your learners help in noticing and understanding forms.</div><div class=\"u\">المدرسين قليلي الخبرة ممكن يكونوا مش متأكدين من القواعد نفسها، بس عليك تساعد متعلميك يلاحظوا ويفهموا الأشكال.</div>", "n": 1, "i": 61, "a": "tefl-30-058", "x": "90670bcb"}, {"t": "learn", "h": "<div class=\"u\">Include exercises where learners analyse the language and test their own hypotheses about how English works, depending on their level.</div><div class=\"u\">ضمّن تمارين المتعلمين فيها بيحلّلوا اللغة وبيختبروا فروضهم عن إزاي الإنجليزية بتشتغل، على حسب مستواهم.</div>", "n": 1, "i": 62, "a": "tefl-30-059", "x": "7ef1a29c"}, {"t": "section", "h": "Guidelines 11-15 | الإرشادات ١١-١٥", "n": 1, "i": 63}, {"t": "learn", "h": "<div class=\"u\">Guideline eleven: integrate all the language skills. Many materials focus on speaking and writing, but listening and reading matter too.</div><div class=\"u\">إرشاد حداشر: دمّج كل المهارات اللغوية. مواد كتير بتركّز على الكلام والكتابة، بس الاستماع والقراية مهمين كمان.</div>", "n": 1, "i": 64, "a": "tefl-30-060", "x": "d973a736"}, {"t": "learn", "h": "<div class=\"u\">In real communication, your listeners will listen as well as speak. Do not fall into the speaking and writing trap.</div><div class=\"u\">في التواصل الحقيقي، اللي بيسمعوك هيسمعوا مش بس هيتكلموا. ماتقعش في فخ الكلام والكتابة.</div>", "n": 1, "i": 65, "a": "tefl-30-061", "x": "c857d690"}, {"t": "learn", "h": "<div class=\"u\">Guideline twelve: ensure authenticity. Authentic materials are unscripted, and not made for language learning purposes.</div><div class=\"u\">إرشاد اتناشر: خلّي المواد أصلية. المواد الأصلية غير مكتوبة مسبقًا، ومش معمولة لأغراض تعلم اللغة.</div>", "n": 1, "i": 66, "a": "tefl-30-062", "x": "e62fa8b6"}, {"t": "learn", "h": "<div class=\"u\">This covers written texts like newspapers and letters, and also spoken and visual texts. Recordings and videos should be real, not performed.</div><div class=\"u\">ده بيشمل النصوص المكتوبة زي الجرايد والخطابات، وكمان النصوص المنطوقة والمرئية. التسجيلات والفيديوهات المفروض تكون حقيقية، مش تمثيل.</div>", "n": 1, "i": 67, "a": "tefl-30-063", "x": "edd05ee6"}, {"t": "learn", "h": "<div class=\"u\">If you record your own, use people saying and doing things in normal situations, unaffected by the microphone or camera.</div><div class=\"u\">لو بتسجّل بنفسك، سجّل ناس بتقول وبتعمل حاجات في مواقف عادية، مش متأثرة بالمايك أو الكاميرا.</div>", "n": 1, "i": 68, "a": "tefl-30-064", "x": "6c8915a7"}, {"t": "learn", "h": "<div class=\"u\">Guideline thirteen: link your materials. Keep coherence and steady progression towards the language goal.</div><div class=\"u\">إرشاد تلتاشر: اربط موادك ببعض. حافظ على الترابط وتقدم ثابت ناحية هدف اللغة.</div>", "n": 1, "i": 69, "a": "tefl-30-065", "x": "ed082f5a"}, {"t": "learn", "h": "<div class=\"u\">Lose sight of your objectives, and you end up with a pile of unconnected materials that confuse your learners.</div><div class=\"u\">لو ضيّعت أهدافك من عينيك، هتخلّص بكوم مواد غير مترابطة بتلخبط متعلميك.</div>", "n": 1, "i": 70, "a": "tefl-30-066", "x": "6048f237"}, {"t": "learn", "h": "<div class=\"u\">Guideline fourteen: impress. Make materials look as good as you can, with a consistent layout.</div><div class=\"u\">إرشاد أربعتاشر: اترك انطباع. خلّي موادك شكلها أحسن ما يكون، بتنسيق ثابت.</div>", "n": 1, "i": 71, "a": "tefl-30-067", "x": "dc095715"}, {"t": "learn", "h": "<div class=\"u\">Avoid anxiety and confusion. In gap activities, leave enough room to write the answer.</div><div class=\"u\">تجنّب القلق واللخبطة. في أنشطة الفجوات، سيب مساحة كفاية لكتابة الإجابة.</div>", "n": 1, "i": 72, "a": "tefl-30-068", "x": "e23d022a"}, {"t": "learn", "h": "<div class=\"u\">Make clear whether the hatched lines show the number of letters, and whether to write or print the answer.</div><div class=\"u\">وضّح إذا كانت الخطوط المخططة بتوري عدد الحروف، وإذا كان المطلوب يكتبوا ولا يطبعوا الإجابة.</div>", "n": 1, "i": 73, "a": "tefl-30-069", "x": "ef1c7125"}, {"t": "learn", "h": "<div class=\"u\">If you will use the materials often, laminate them where possible, so they stay fresh with reuse.</div><div class=\"u\">لو هتستخدم المواد كتير، لمّنها لو أمكن، عشان تفضل نضيفة مع إعادة الاستخدام.</div>", "n": 1, "i": 74, "a": "tefl-30-070", "x": "14bc4069"}, {"t": "learn", "h": "<div class=\"u\">Guideline fifteen: ensure clear instructions. Weak or unclear instructions force a restart, which is unfair and frustrating.</div><div class=\"u\">إرشاد خمستاشر: خلّي التعليمات واضحة. التعليمات الضعيفة أو غير الواضحة بتضطرك تعيد من الأول، وده ظلم ومُحبط.</div>", "n": 1, "i": 75, "a": "tefl-30-071", "x": "4d284cc3"}, {"t": "learn", "h": "<div class=\"u\">Keep instruction language appropriate to their level, in simple words. There are no prizes for complex words.</div><div class=\"u\">خلّي لغة التعليمات مناسبة لمستواهم، بكلمات بسيطة. مفيش جوايز على الكلمات المعقدة.</div>", "n": 1, "i": 76, "a": "tefl-30-072", "x": "d066c56a"}, {"t": "learn", "h": "<div class=\"u\">Designing your own materials, and later reflecting on how well they worked, is one of the most rewarding experiences in teaching.</div><div class=\"u\">تصميم موادك بنفسك، وبعدين مراجعة إزاي اشتغلت كويس، من أكتر التجارب المُرضية في التدريس.</div>", "n": 1, "i": 77, "a": "tefl-30-073", "x": "307165b7"}, {"t": "section", "h": "Worksheets | أوراق العمل", "n": 1, "i": 78}, {"t": "learn", "h": "<div class=\"u\">Four effective forms of teacher-made materials: worksheets, workcards, flashcards, and your own realia.</div><div class=\"u\">أربع أشكال فعّالة من مواد المدرس: أوراق العمل، بطاقات العمل، البطاقات التعليمية، ورياليا بتاعتك.</div>", "n": 1, "i": 79, "a": "tefl-30-074", "x": "3a78c41d"}, {"t": "learn", "h": "<div class=\"u\">They can be used for oral practice in pairs or groups, or for listening, reading, and writing practice, together or alone.</div><div class=\"u\">تتستخدم للتمرين الشفهي في أزواج أو مجموعات، أو لتمرين الاستماع والقراية والكتابة، مع بعض أو لوحدهم.</div>", "n": 1, "i": 80, "a": "tefl-30-075", "x": "25715159"}, {"t": "learn", "h": "<div class=\"u\">Many worksheets on the internet are boring to look at: just a list of questions with spaces. Add a picture or some colouring.</div><div class=\"u\">أوراق عمل كتير على الإنترنت شكلها ممل: بس قايمة أسئلة بمساحات فاضية. زوّد صورة أو شوية تلوين.</div>", "n": 1, "i": 81, "a": "tefl-30-076", "x": "ae42102c"}, {"t": "learn", "h": "<div class=\"u\">A worksheet is typically an A4 page or two of tasks, given to individuals, pairs, or groups.</div><div class=\"u\">ورقة العمل غالبًا صفحة A4 أو اتنين فيها مهام، بتتدّى لأفراد أو أزواج أو مجموعات.</div>", "n": 1, "i": 82, "a": "tefl-30-077", "x": "40187501"}, {"t": "learn", "h": "<div class=\"u\">Learners write their answers on the worksheet. You circulate during completion, then check answers with the whole class.</div><div class=\"u\">المتعلمين بيكتبوا إجاباتهم على الورقة. إنت بتلف أثناء الشغل، وبعدين بتراجع الإجابات مع الفصل كله.</div>", "n": 1, "i": 83, "a": "tefl-30-078", "x": "b4d63983"}, {"t": "learn", "h": "<div class=\"u\">Sometimes worksheets are thrown away, sometimes kept, sometimes taken in to study progress, like handwriting, or added to portfolios.</div><div class=\"u\">ساعات أوراق العمل بتترمي، ساعات بتتحتفظ بيها، ساعات بتتاخد لدراسة التقدم، زي الخط، أو تتضاف لملفات الإنجاز.</div>", "n": 1, "i": 84, "a": "tefl-30-079", "x": "6493cb63"}, {"t": "learn", "h": "<div class=\"u\">An information gap is a typical worksheet activity, where learners work out the missing and different information each one has.</div><div class=\"u\">فجوة المعلومات نشاط ورقة عمل نموذجي، حيث المتعلمين بيطلّعوا المعلومات الناقصة والمختلفة اللي كل واحد فيهم عنده.</div>", "n": 1, "i": 85, "a": "tefl-30-080", "x": "cc398cfc"}, {"t": "learn", "h": "<div class=\"u\">Example one: Where is our butterfly? Fill the space with one word: behind, above, below, or beside.</div><div class=\"u\">مثال واحد: فين الفراشة بتاعتنا؟ املا الفراغ بكلمة واحدة: behind أو above أو below أو beside.</div>", "n": 1, "i": 86, "a": "tefl-30-081", "x": "db01c1ca"}, {"t": "learn", "h": "<div class=\"u\">Example two: a word game, scaffolded from easy to not so easy. Make small words from the letters of one big word.</div><div class=\"u\">مثال اتنين: لعبة كلمات، مدعومة تدريجيًا من السهل للأصعب شوية. اعمل كلمات صغيرة من حروف كلمة كبيرة.</div>", "n": 1, "i": 87, "a": "tefl-30-082", "x": "863142b0"}, {"t": "learn", "h": "<div class=\"u\">The clues: it eats mice, cat. Water comes from this, tap. You can get this from the doctor, pill. Make a noise with your hands, clap.</div><div class=\"u\">التلميحات: بتاكل فاران، cat. المية بتيجي من ده، tap. تقدر تاخد ده من الدكتور، pill. اعمل صوت بإيديك، clap.</div>", "n": 1, "i": 88, "a": "tefl-30-083", "x": "4ecd4451"}, {"t": "learn", "h": "<div class=\"u\">More clues: not early, late. A fruit, pear. The cost of something, price. Part of a flower, petal.</div><div class=\"u\">تلميحات زيادة: مش بدري، late. فاكهة، pear. تمن حاجة، price. جزء من وردة، petal.</div>", "n": 1, "i": 89, "a": "tefl-30-084", "x": "ee1ef302"}, {"t": "learn", "h": "<div class=\"u\">Example three: The Gruffalo. Learners order eight sentences from the storybook dialogue between the mouse and the fox.</div><div class=\"u\">مثال تلاتة: The Gruffalo. المتعلمين بيرتّبوا تمان جمل من حوار القصة بين الفار والثعلب.</div>", "n": 1, "i": 90, "a": "tefl-30-085", "x": "9a099d39"}, {"t": "section", "h": "Workcards | بطاقات العمل", "n": 1, "i": 91}, {"t": "learn", "h": "<div class=\"u\">Workcards are small laminated cards, about the size of an index card, made for all kinds of short tasks.</div><div class=\"u\">بطاقات العمل كروت صغيرة ملمّنة، في حجم كارت الفهرسة، معمولة لكل أنواع المهام القصيرة.</div>", "n": 1, "i": 92, "a": "tefl-30-086", "x": "a7c3ba57"}, {"t": "learn", "h": "<div class=\"u\">Laminate them for repeated use with different learners. No laminator? Keep them in plastic files.</div><div class=\"u\">لمّنها عشان تتعاد مع متعلمين مختلفين. مفيش لمينيتور؟ خزّنها في ملفات بلاستيك.</div>", "n": 1, "i": 93, "a": "tefl-30-087", "x": "50109354"}, {"t": "learn", "h": "<div class=\"u\">Learners complete the activity on a separate blank sheet or in their notebooks, not on the workcard.</div><div class=\"u\">المتعلمين بيكمّلوا النشاط على ورقة فاضية منفصلة أو في كراساتهم، مش على البطاقة.</div>", "n": 1, "i": 94, "a": "tefl-30-088", "x": "509f1cae"}, {"t": "learn", "h": "<div class=\"u\">They suit short tasks, individual, pair, or group. Different learners can work with different cards at the same time.</div><div class=\"u\">بتناسب المهام القصيرة، فردي أو أزواج أو مجموعات. متعلمين مختلفين يقدروا يشتغلوا ببطاقات مختلفة في نفس الوقت.</div>", "n": 1, "i": 95, "a": "tefl-30-089", "x": "00d42b74"}, {"t": "learn", "h": "<div class=\"u\">You can colour them and add little pictures. Then the cards are handed back to you.</div><div class=\"u\">تقدر تلوّنها وتزوّد صور صغيرة. وبعدين البطاقات بترجعلك.</div>", "n": 1, "i": 96, "a": "tefl-30-090", "x": "7d2c1eec"}, {"t": "learn", "h": "<div class=\"u\">They are excellent for recycling activities, when some learners need more practice with a specific element.</div><div class=\"u\">هي ممتازة لأنشطة الإعادة، لما بعض المتعلمين محتاجين تمرين زيادة على عنصر معين.</div>", "n": 1, "i": 97, "a": "tefl-30-091", "x": "5ec7377c"}, {"t": "learn", "h": "<div class=\"u\">Also for more able learners who finished early, and for a class break with quizzes, small puzzles, and riddles.</div><div class=\"u\">وكمان للمتعلمين الأقدر اللي خلّصوا بدري، ولراحة للفصل بأسئلة وألغاز صغيرة وفوازير.</div>", "n": 1, "i": 98, "a": "tefl-30-092", "x": "47e5e363"}, {"t": "learn", "h": "<div class=\"u\">One caution: do not use examples of animals or things that do not exist in their culture. Adjust difficulty to the level.</div><div class=\"u\">تحذير واحد: ماتستخدمش أمثلة حيوانات أو حاجات مش موجودة في ثقافتهم. عدّل الصعوبة حسب المستوى.</div>", "n": 1, "i": 99, "a": "tefl-30-093", "x": "ea86fe94"}, {"t": "learn", "h": "<div class=\"u\">Practical idea one, stamps: put different postage stamps on a card. Pairs identify the countries, with a word bank if needed.</div><div class=\"u\">فكرة عملية واحد، الطوابع: حط طوابع بريد مختلفة على كارت. الأزواج بيحدّدوا البلاد، مع بنك كلمات لو لزم.</div>", "n": 1, "i": 100, "a": "tefl-30-094", "x": "2987679f"}, {"t": "learn", "h": "<div class=\"u\">Higher students can add the capital city and the language spoken.</div><div class=\"u\">الطلبة الأعلى يقدروا يزوّدوا العاصمة واللغة المتكلمة.</div>", "n": 1, "i": 101, "a": "tefl-30-095", "x": "f7810629"}, {"t": "learn", "h": "<div class=\"u\">Idea two, read and draw: write a description of a place, person, or unusual animal like an armadillo. Students draw it, compare, then see a real photo.</div><div class=\"u\">فكرة اتنين، اقرا وارسم: اكتب وصف لمكان أو شخص أو حيوان غريب زي الأرماديلو. الطلبة بيرسموه، بيقارنوا، وبعدين يشوفوا صورة حقيقية.</div>", "n": 1, "i": 102, "a": "tefl-30-096", "x": "03c6ae15"}, {"t": "learn", "h": "<div class=\"u\">It is not a drawing task. It is a reading and comprehension activity.</div><div class=\"u\">دي مش مهمة رسم. دي نشاط قراية وفهم.</div>", "n": 1, "i": 103, "a": "tefl-30-097", "x": "632dd66e"}, {"t": "learn", "h": "<div class=\"u\">Idea three, things in common: give three or four words, and students write what they share. Dog, cat, bear: animals.</div><div class=\"u\">فكرة تلاتة، حاجات مشتركة: ادّي تلاتة أو أربع كلمات، والطلبة يكتبوا اللي بينهم مشترك. dog, cat, bear: حيوانات.</div>", "n": 1, "i": 104, "a": "tefl-30-098", "x": "41df5836"}, {"t": "learn", "h": "<div class=\"u\">Harder: pint, silver, width. No other English words rhyme with these.</div><div class=\"u\">أصعب: pint, silver, width. مفيش كلمات إنجليزية تانية بتسجّي مع دول.</div>", "n": 1, "i": 105, "a": "tefl-30-099", "x": "bc4e089c"}, {"t": "learn", "h": "<div class=\"u\">Idea four, matching: two lists, countries and capitals. Students match each country with its capital city.</div><div class=\"u\">فكرة أربعة، توصيل: قايمتين، بلاد وعواصم. الطلبة بيوصّلوا كل بلد بعاصمتها.</div>", "n": 1, "i": 106, "a": "tefl-30-100", "x": "590bfa6d"}, {"t": "learn", "h": "<div class=\"u\">Idea five, same sound: two lists of words that sound the same but mean different things, like right and write. Also works with opposites and rhymes.</div><div class=\"u\">فكرة خمسة، نفس الصوت: قايمتين كلمات بتتنطق نفس النطق بس معناها مختلف، زي right وwrite. بتشتغل كمان مع الأضداد والقوافي.</div>", "n": 1, "i": 107, "a": "tefl-30-101", "x": "d6ca093e"}, {"t": "section", "h": "Flashcards and realia | البطاقات والرياليا", "n": 1, "i": 108}, {"t": "learn", "h": "<div class=\"u\">Your flashcards: a laminated picture of, say, a house, with the word house below it or on the back.</div><div class=\"u\">بطاقاتك التعليمية: صورة ملمّنة لبيت مثلًا، وكلمة house تحتها أو على ضهرها.</div>", "n": 1, "i": 109, "a": "tefl-30-102", "x": "dcd91062"}, {"t": "learn", "h": "<div class=\"u\">Make them A4 size for the class, or smaller versions so each pair has their own.</div><div class=\"u\">اعملها بمقاس A4 للفصل، أو نسخ أصغر عشان كل زوج يبقى معاه نسخته.</div>", "n": 1, "i": 110, "a": "tefl-30-103", "x": "43a71410"}, {"t": "learn", "h": "<div class=\"u\">Gradually, through time, you can miss out the picture and just show the word.</div><div class=\"u\">بالتدريج، مع الوقت، تقدر تشيل الصورة وتعرض الكلمة بس.</div>", "n": 1, "i": 111, "a": "tefl-30-104", "x": "70e2270b"}, {"t": "learn", "h": "<div class=\"u\">Intersperse showing the word with writing it on the board, so they see that spoken words can be written down.</div><div class=\"u\">نوّع بين عرض الكلمة وكتابتها على السبورة، عشان يشوفوا إن الكلمات المنطوقة ممكن تتكتب.</div>", "n": 1, "i": 112, "a": "tefl-30-105", "x": "be8d06db"}, {"t": "learn", "h": "<div class=\"u\">Colour your flashcards from the start: nouns in pink, adjectives in blue, verbs in green. You would typically start with nouns.</div><div class=\"u\">لوّن بطاقاتك من الأول: الأسماء بالوردي، والصفات بالأزرق، والأفعال بالأخضر. غالبًا بتبدأ بالأسماء.</div>", "n": 1, "i": 113, "a": "tefl-30-106", "x": "9e496cb2"}, {"t": "learn", "h": "<div class=\"u\">Do not use metalanguage. Just call it a thing or an animal. Later, point out that this adjective card is not pink like the noun cards.</div><div class=\"u\">ماتستخدمش مصطلحات لغوية. سمّيها حاجة أو حيوان وبس. بعدين، وضّح إن كارت الصفة ده مش وردي زي كروت الأسماء.</div>", "n": 1, "i": 114, "a": "tefl-30-107", "x": "a91363a7"}, {"t": "learn", "h": "<div class=\"u\">Always follow a showing activity with another activity to consolidate, like pairs reading words to their partners.</div><div class=\"u\">دايمًا اتبع نشاط العرض بنشاط تاني للتثبيت، زي أزواج بيقرأوا الكلمات لبعض.</div>", "n": 1, "i": 115, "a": "tefl-30-108", "x": "dde011c2"}, {"t": "learn", "h": "<div class=\"u\">Become familiar with the supplementary materials in your school. At the start, draw up a needs analysis checklist for what to add. Plan ahead.</div><div class=\"u\">اعرف المواد الإضافية الموجودة في مدرستك. في الأول، اعمل قايمة تحليل احتياجات للي هتزوّده. خطط قبلها.</div>", "n": 1, "i": 116, "a": "tefl-30-109", "x": "5148ec7c"}, {"t": "learn", "h": "<div class=\"u\">Your realia: use your own things, not just stuff from the classroom cupboard. Three glasses and a jug of water from your apartment can do a lot.</div><div class=\"u\">رياليا بتاعتك: استخدم حاجاتك إنت، مش بس اللي في دولاب الفصل. تلات كبايات وإبريق مية من شقتك يقدروا يعملوا كتير.</div>", "n": 1, "i": 117, "a": "tefl-30-110", "x": "f829b7c7"}, {"t": "learn", "h": "<div class=\"u\">Vocabulary: degrees like full, half-full, empty, half-empty.</div><div class=\"u\">مفردات: درجات زي full وhalf-full وempty وhalf-empty.</div>", "n": 1, "i": 118, "a": "tefl-30-111", "x": "4de42674"}, {"t": "learn", "h": "<div class=\"u\">Comparatives and superlatives: big, bigger, biggest amounts of water.</div><div class=\"u\">مقارنات وتفضيل: big, bigger, biggest كميات مية.</div>", "n": 1, "i": 119, "a": "tefl-30-112", "x": "c236cd0d"}, {"t": "learn", "h": "<div class=\"u\">Colours: add a hidden drop or two of cake colouring in the bottom of each glass before class, and let it dry.</div><div class=\"u\">الألوان: حط نقطة أو اتنين مخفية من لون الأكل في قاع كل كباية قبل الفصل، وخليها تنشف.</div>", "n": 1, "i": 120, "a": "tefl-30-113", "x": "a864b31e"}, {"t": "learn", "h": "<div class=\"u\">As you pour the water, blue, red, and green appear as if by magic. They will think you are a magician.</div><div class=\"u\">ولما تصب المية، الأزرق والأحمر والأخضر هيظهروا كأنه سحر. هيفتكروك ساحر.</div>", "n": 1, "i": 121, "a": "tefl-30-114", "x": "6ff23a7d"}, {"t": "learn", "h": "<div class=\"u\">The same glasses can also teach the concept of weight and its vocabulary.</div><div class=\"u\">نفس الكبايات تقدر كمان تعلّم مفهوم الوزن ومفرداته.</div>", "n": 1, "i": 122, "a": "tefl-30-115", "x": "bcc02574"}, {"t": "section", "h": "Unit 8 questions | أسئلة الوحدة ٨", "n": 1, "i": 123}, {"t": "learn", "h": "<div class=\"u\">Question one: global EFL coursebooks are too specific, true or false? False. They are too generic.</div><div class=\"u\">سؤال واحد: الكتب المقررة العالمية محددة أوي، صح ولا غلط؟ غلط. هي عامة أوي.</div>", "n": 1, "i": 124, "a": "tefl-30-116", "x": "70532f6a"}, {"t": "learn", "h": "<div class=\"u\">Question two: commercially made materials reflect local varieties of English. False. They are Anglo-centric.</div><div class=\"u\">سؤال اتنين: المواد التجارية بتعكس نوعات محلية من الإنجليزية. غلط. هي بريطانية-أمريكية المركز.</div>", "n": 1, "i": 125, "a": "tefl-30-117", "x": "88512178"}, {"t": "learn", "h": "<div class=\"u\">Question three: commercially produced materials cannot keep up to date with local and international events. True.</div><div class=\"u\">سؤال تلاتة: المواد التجارية مابتقدرش تواكب الأحداث المحلية والدولية. صح.</div>", "n": 1, "i": 126, "a": "tefl-30-118", "x": "208630f2"}, {"t": "learn", "h": "<div class=\"u\">Question four: your self-made materials need not fit the syllabus and curriculum. False. They must fit, if these are in place.</div><div class=\"u\">سؤال أربعة: موادك مش لازم تناسب المنهج والمقرر. غلط. لازم تناسبهم، لو دول موجودين.</div>", "n": 1, "i": 127, "a": "tefl-30-119", "x": "3d25582d"}, {"t": "learn", "h": "<div class=\"u\">Question five: re-wording is an example of a learning strategy. True.</div><div class=\"u\">سؤال خمسة: إعادة الصياغة مثال على استراتيجية تعلم. صح.</div>", "n": 1, "i": 128, "a": "tefl-30-120", "x": "a9676b4f"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 129}, {"t": "learn", "h": "<div class=\"u\">self-made materials: materials the teacher designs themselves.</div><div class=\"u\">مواد من عمل المدرس: مواد المدرس بيصمّمها بنفسه.</div>", "n": 1, "i": 130, "a": "tefl-30-121", "x": "f443b350"}, {"t": "learn", "h": "<div class=\"u\">information gap: an activity where learners hold different missing information.</div><div class=\"u\">فجوة المعلومات: نشاط كل متعلم فيه عنده معلومات ناقصة مختلفة.</div>", "n": 1, "i": 131, "a": "tefl-30-122", "x": "6bde27cd"}, {"t": "learn", "h": "<div class=\"u\">workcard: a small laminated card for short tasks.</div><div class=\"u\">بطاقة عمل: كارت صغير ملمّن لمهام قصيرة.</div>", "n": 1, "i": 132, "a": "tefl-30-123", "x": "b85f6c7b"}, {"t": "learn", "h": "<div class=\"u\">scaffolding: supporting learning step by step, from easy to hard.</div><div class=\"u\">الدعم التدريجي: دعم التعلم خطوة بخطوة، من السهل للصعب.</div>", "n": 1, "i": 133, "a": "tefl-30-124", "x": "24f0fd98"}, {"t": "learn", "h": "<div class=\"u\">rote learning: memorising by repetition, often without context.</div><div class=\"u\">التعلم بالحفظ: الحفظ بالتكرار، غالبًا من غير سياق.</div>", "n": 1, "i": 134, "a": "tefl-30-125", "x": "ee9fcce3"}, {"t": "learn", "h": "<div class=\"u\">proxemics: the use of personal space in communication.</div><div class=\"u\">البروكزيمكس: استخدام المسافة الشخصية في التواصل.</div>", "n": 1, "i": 135, "a": "tefl-30-126", "x": "9e4644d6"}, {"t": "learn", "h": "<div class=\"u\">turn-taking: taking turns in conversation, me then you.</div><div class=\"u\">تبادل الأدوار: تبادل الأدوار في الكلام، أنا وبعدين إنت.</div>", "n": 1, "i": 136, "a": "tefl-30-127", "x": "aa3f5abc"}, {"t": "learn", "h": "<div class=\"u\">learning strategy: a technique that helps you learn, like re-wording.</div><div class=\"u\">استراتيجية تعلم: تقنية بتساعدك تتعلم، زي إعادة الصياغة.</div>", "n": 1, "i": 137, "a": "tefl-30-128", "x": "41df1ccf"}, {"t": "learn", "h": "<div class=\"u\">authentic material: real material not made for language learning.</div><div class=\"u\">مادة أصلية: مادة حقيقية مش معمولة لتعلم اللغة.</div>", "n": 1, "i": 138, "a": "tefl-30-129", "x": "b91693ee"}, {"t": "learn", "h": "<div class=\"u\">needs analysis: finding out what learners need, at the start of a course.</div><div class=\"u\">تحليل الاحتياجات: معرفة المتعلمين محتاجين إيه، في بداية الكورس.</div>", "n": 1, "i": 139, "a": "tefl-30-130", "x": "16910405"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 140}, {"t": "learn", "h": "<div class=\"u\">Make your own materials when resources are minimal, or when the coursebook lacks what your learners need.</div><div class=\"u\">اعمل موادك بنفسك لما الموارد تكون قليلة، أو لما الكتاب المقرر ينقصه اللي متعلميك محتاجينه.</div>", "n": 1, "i": 141, "a": "tefl-30-131", "x": "f5187153"}, {"t": "learn", "h": "<div class=\"u\">The four benefits: fit your context, fit individual learners, fit today's events, and beat the lack of finance.</div><div class=\"u\">المميزات الأربعة: ناسب سياقك، ناسب المتعلمين الأفراد، ناسب أحداث النهاردة، واتغلّب على نقص التمويل.</div>", "n": 1, "i": 142, "a": "tefl-30-132", "x": "4892630a"}, {"t": "learn", "h": "<div class=\"u\">Follow the fifteen guidelines: needs, syllabus, skills, resources, copyright, time, interaction, and stretch.</div><div class=\"u\">امشي على الإرشادات الخمستاشر: الاحتياجات، المنهج، المهارات، الموارد، حقوق النشر، الوقت، التفاعل، والتمديد.</div>", "n": 1, "i": 143, "a": "tefl-30-133", "x": "e2085c33"}, {"t": "learn", "h": "<div class=\"u\">Also: learning strategies, form, all skills, authenticity, linking, good looks, and clear instructions.</div><div class=\"u\">وكمان: استراتيجيات التعلم، الشكل، كل المهارات، الأصالة، الربط، الشكل الخارجي الحلو، والتعليمات الواضحة.</div>", "n": 1, "i": 144, "a": "tefl-30-134", "x": "d34db5ca"}, {"t": "learn", "h": "<div class=\"u\">Four effective forms: worksheets, workcards, flashcards, and your own realia.</div><div class=\"u\">أربع أشكال فعّالة: أوراق العمل، بطاقات العمل، البطاقات التعليمية، ورياليا بتاعتك.</div>", "n": 1, "i": 145, "a": "tefl-30-135", "x": "d8d0456d"}, {"t": "learn", "h": "<div class=\"u\">With three glasses, a jug of water, and hidden food colouring, you can teach degrees, comparatives, colours, and weight, like a magician.</div><div class=\"u\">بتلات كبايات وإبريق مية ولون أكل مخفي، تقدر تعلّم الدرجات والمقارنات والألوان والوزن، كأنك ساحر.</div>", "n": 1, "i": 146, "a": "tefl-30-136", "x": "36557731"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 147}, {"t": "tf", "q": "Coursebooks made for the global EFL market are too specific.<br>الكتب المقررة المعمولة لسوق الإنجليزية العالمي محددة أوي.", "ans": false, "why": "False. They are too generic, not geared to specific groups or contexts. | غلط. هي عامة أوي، مش متوجهة لمجموعات أو سياقات محددة.", "ex": ["Wrong. The criticism is that they are too generic. | غلط: الانتقاد إنها عامة أوي.", "Correct. | صح."], "n": 1, "i": 148, "h": ""}, {"t": "tf", "q": "Commercially made materials reflect local varieties of English.<br>المواد التجارية بتعكس نوعات محلية من الإنجليزية.", "ans": false, "why": "False. They are Anglo-centric and do not reflect local varieties. | غلط. هي بريطانية-أمريكية المركز ومابتعكسش نوعات محلية.", "ex": ["Wrong. They are Anglo-centric. | غلط: هي بريطانية-أمريكية المركز.", "Correct. | صح."], "n": 1, "i": 149, "h": ""}, {"t": "tf", "q": "Commercial materials cannot keep up to date with local and international events.<br>المواد التجارية مابتقدرش تواكب الأحداث المحلية والدولية.", "ans": true, "why": "True. Only teachers on the ground can make materials relevant to today's world. | صح. بس المدرسين على أرض الواقع يقدروا يخلّوا المواد مناسبة لعالم النهاردة.", "ex": ["Correct. | صح.", "Wrong. Events move faster than publishers. | غلط: الأحداث أسرع من الناشرين."], "n": 1, "i": 150, "h": ""}, {"t": "tf", "q": "Your self-made materials need not fit the syllabus and curriculum.<br>موادك من عملك مش لازم تناسب المنهج والمقرر.", "ans": false, "why": "False. If a syllabus and curriculum are in place, your materials must fit their goals and objectives. | غلط. لو في منهج ومقرر، موادك لازم تناسب أهدافهم.", "ex": ["Wrong. They must fit the syllabus goals. | غلط: لازم تناسب أهداف المنهج.", "Correct. | صح."], "n": 1, "i": 151, "h": ""}, {"t": "mc", "q": "Re-wording, saying something in a different way, is an example of:<br>إعادة الصياغة، قول حاجة بطريقة تانية، مثال على:", "opts": ["a learning strategy | استراتيجية تعلم", "proxemics | بروكزيمكس", "an information gap | فجوة معلومات"], "ans": 0, "why": "Re-wording and body language are learning strategies for communication difficulties. | إعادة الصياغة ولغة الجسم استراتيجيات تعلم لصعوبات التواصل.", "ex": ["Correct. | صح.", "No. Proxemics is personal space. | غلط: البروكزيمكس مسافة شخصية.", "No. An information gap is an activity type. | غلط: فجوة المعلومات نوع نشاط."], "n": 1, "i": 152, "h": ""}, {"t": "mc", "q": "Which statement about copyright is correct?<br>أنهي عبارة عن حقوق النشر صح؟", "opts": ["an idea cannot be copyrighted; base your own material on it | الفكرة مالهاش حقوق نشر؛ ابني مادتك عليها", "any photo online is free to print | أي صورة أونلاين مجانية للطباعة", "copyright does not concern teachers | حقوق النشر ماتخصش المدرسين"], "ans": 0, "why": "Ideas are free; lifting photos and text as produced is not allowed. | الأفكار حرة؛ نسخ الصور والنصوص زي ما اتنتجت مش مسموح.", "ex": ["Correct. | صح.", "No. Photos are usually protected. | غلط: الصور غالبًا محمية.", "No. Teachers must consider copyright. | غلط: المدرسين لازم يهتموا بحقوق النشر."], "n": 1, "i": 153, "h": ""}, {"t": "mc", "q": "With workcards, learners write their answers:<br>مع بطاقات العمل، المتعلمين بيكتبوا إجاباتهم:", "opts": ["on a separate sheet or in their notebooks | على ورقة منفصلة أو في كراساتهم", "on the workcard itself | على البطاقة نفسها", "only on the board | على السبورة بس"], "ans": 0, "why": "The card is reused, so answers go on separate paper, and the cards are handed back. | البطاقة بتتعاد، فالإجابات على ورق منفصل، والبطاقات بترجع.", "ex": ["Correct. | صح.", "No. The card stays clean for reuse. | غلط: البطاقة بتفضل نضيفة لإعادة الاستخدام.", "No. Notebooks or blank sheets are the norm. | غلط: الكراسات أو الورق الفاضي هو الأصل."], "n": 1, "i": 154, "h": ""}, {"t": "mc", "q": "In the magic jug activity, the colours appear because of hidden:<br>في نشاط الإبريق السحري، الألوان بتظهر بسبب:", "opts": ["drops of cake colouring in the glasses | نقط لون أكل في الكبايات", "salt in the water | ملح في المية", "ice cubes | مكعبات تلج"], "ans": 0, "why": "A hidden drop of icing colouring dries at the bottom of each glass, then colours the poured water. | نقطة لون مخفية بتنشف في قاع كل كباية، وبعدين بتلوّن المية المصبوبة.", "ex": ["Correct. | صح.", "No. It is food colouring. | غلط: هو لون أكل.", "No. It is food colouring. | غلط: هو لون أكل."], "n": 1, "i": 155, "h": ""}, {"t": "recall", "q": "Name the four benefits of designing your own materials.<br>اذكر المميزات الأربعة لتصميم موادك بنفسك.", "a": "They fit your context, they fit individual learners, they fit today's events, and they solve the lack of finance.<br>بتناسب سياقك، وبتناسب المتعلمين الأفراد، وبتناسب أحداث النهاردة، وبتحل مشكلة نقص التمويل.", "n": 1, "i": 156, "h": ""}, {"t": "recall", "q": "Name the four effective forms of teacher-made materials.<br>اذكر الأربع أشكال الفعّالة من مواد المدرس.", "a": "Worksheets, workcards, flashcards, and your own realia.<br>أوراق العمل، بطاقات العمل، البطاقات التعليمية، ورياليا بتاعتك.", "n": 1, "i": 157, "h": ""}, {"t": "write", "q": "Explain why your self-made materials must link with each other (3-4 sentences).<br>اشرح ليه موادك من عملك لازم تكون مترابطة مع بعض (٣-٤ جمل).", "key": "tefl-30:1", "a": "Language learning needs steady progression towards a goal. If you lose sight of your objectives, you end up with a pile of unconnected materials. That confuses learners, because each piece feels random instead of building on the last. Keeping coherence means every worksheet and card links to the one before, moving the class step by step towards the language goal.<br>تعلم اللغة محتاج تقدم ثابت ناحية هدف. لو ضيّعت أهدافك من عينيك، هتخلّص بكوم مواد غير مترابطة. ده بيلخبط المتعلمين، لأن كل قطعة بتحس عشوائية بدل ما تبني على اللي قبلها. الحفاظ على الترابط يعني كل ورقة عمل وكارت بيرتبط باللي قبله، بيحرّك الفصل خطوة بخطوة ناحية هدف اللغة.", "n": 1, "i": 158, "h": ""}, {"t": "write", "q": "Explain how colour-coded flashcards help learners (3-4 sentences).<br>اشرح إزاي البطاقات الملوّنة بتساعد المتعلمين (٣-٤ جمل).", "key": "tefl-30:2", "a": "Colouring flashcards by word type, nouns in pink, adjectives in blue, verbs in green, gives learners a silent system. You do not need grammar words: a noun card is just a thing or animal. Later, you simply point out that a new card is not pink like the others. Through time, the colours themselves teach categories and differences, so learners absorb word classes before they ever hear their names.<br>تلوين البطاقات حسب نوع الكلمة، الأسماء بالوردي والصفات بالأزرق والأفعال بالأخضر، بيدّي المتعلمين نظام صامت. مش محتاج كلمات قواعد: كارت الاسم بيتسمّى حاجة أو حيوان وبس. بعدين، بس بتوضّح إن الكارت الجديد مش وردي زي الباقي. مع الوقت، الألوان نفسها بتعلّم الفئات والفروق، فالمتعلمين بيمتصوا أنواع الكلمات قبل ما يسمعوا أسماءها أصلًا.", "n": 1, "i": 159, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 5 begins, a new stage of the course after lesson planning.</div><div class=\"u\">الدرس الجاي: بداية الموديول الخامس، مرحلة جديدة من الكورس بعد تخطيط الدروس.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 160}];</script>
