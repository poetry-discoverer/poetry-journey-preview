<script>window.LESSON_ID="tefl-29";window.STEPS=[{"t": "section", "h": "Supplementary materials | المواد الإضافية", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Supplementary materials can be anything from extra worksheets to DVDs. Basically, anything you use in addition to the course book.</div><div class=\"u\">المواد الإضافية ممكن تكون أي حاجة من أوراق عمل زيادة لحد أقراص DVD. يعني أي حاجة بتستخدمها زيادة على الكتاب المقرر.</div>", "n": 1, "i": 1, "a": "tefl-29-001", "x": "87759efc"}, {"t": "learn", "h": "<div class=\"u\">Some course books come with supplementary materials in the teacher's book, one for each lesson.</div><div class=\"u\">بعض الكتب المقررة بتيجي معاها مواد إضافية في كتاب المدرس، مادة لكل درس.</div>", "n": 1, "i": 2, "a": "tefl-29-002", "x": "4b65ed57"}, {"t": "learn", "h": "<div class=\"u\">But you may also want to use other sources, to add a bit of variety.</div><div class=\"u\">بس ممكن كمان تستخدم مصادر تانية، عشان تزوّد شوية تنويع.</div>", "n": 1, "i": 3, "a": "tefl-29-003", "x": "d427a5b5"}, {"t": "learn", "h": "<div class=\"u\">It is all too easy to follow the course book exactly. But that can be unimaginative, and may not always suit your students' needs.</div><div class=\"u\">من السهل جدًا تمشي ورا الكتاب المقرر بالظبط. بس ده ممكن يبقى خالي من الخيال، ومش دايمًا بيناسب احتياجات طلبتك.</div>", "n": 1, "i": 4, "a": "tefl-29-004", "x": "aa97587f"}, {"t": "learn", "h": "<div class=\"u\">You may also have a mixed ability class. Slightly different activities on the same language, theme, or skill give the right material to different students.</div><div class=\"u\">وممكن يكون عندك فصل بمستويات مختلفة. أنشطة مختلفة شوية على نفس اللغة أو الموضوع أو المهارة بتدّي المادة المناسبة لطلبة مختلفين.</div>", "n": 1, "i": 5, "a": "tefl-29-005", "x": "ae0afdc3"}, {"t": "learn", "h": "<div class=\"u\">They are also useful as back-ups for students who finish the assigned tasks faster than the others.</div><div class=\"u\">وهي كمان مفيدة كاحتياطي للطلبة اللي بيخلّصوا المهام المطلوبة أسرع من الباقي.</div>", "n": 1, "i": 6, "a": "tefl-29-006", "x": "82df684e"}, {"t": "section", "h": "Pros and cons | مميزات وعيوب", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">The unit's sorting task, solved. Advantages, first two: they add variety to the course, and give students extra practice.</div><div class=\"u\">تمرين الفرز في الوحدة، محلول. المميزات، أول اتنين: بتزوّد تنويع للكورس، وبتدّي الطلبة تمرين زيادة.</div>", "n": 1, "i": 8, "a": "tefl-29-007", "x": "39f6f58c"}, {"t": "learn", "h": "<div class=\"u\">More advantages: they substitute unsuitable material in the course book.</div><div class=\"u\">مميزات زيادة: بتحل محل المادة غير المناسبة في الكتاب المقرر.</div>", "n": 1, "i": 9, "a": "tefl-29-008", "x": "108b6888"}, {"t": "learn", "h": "<div class=\"u\">Two more advantages: they add missing material to the course book, and they provide material adapted to students' needs, interests, and level.</div><div class=\"u\">ميزتين كمان: بتزوّد المادة الناقصة في الكتاب المقرر، وبتوفر مادة متكيفة مع احتياجات الطلبة واهتماماتهم ومستواهم.</div>", "n": 1, "i": 10, "a": "tefl-29-009", "x": "dd0c1916"}, {"t": "learn", "h": "<div class=\"u\">Now the disadvantages. The material may not be at the correct level, and it may not fit the course book syllabus.</div><div class=\"u\">دلوقتي العيوب. المادة ممكن ماتكونش على المستوى المظبوط، وممكن ماتناسبش منهج الكتاب المقرر.</div>", "n": 1, "i": 11, "a": "tefl-29-010", "x": "db4e7397"}, {"t": "learn", "h": "<div class=\"u\">More disadvantages: suitable material is sometimes difficult to find, it is unsuitable if the correct equipment is unavailable, and preparation time could be quite long.</div><div class=\"u\">عيوب زيادة: المادة المناسبة ساعات صعبة تتلاقي، ومابتنفعش لو الأجهزة المطلوبة مش متوفرة، ووقت التحضير ممكن يطول جدًا.</div>", "n": 1, "i": 12, "a": "tefl-29-011", "x": "25dce3ba"}, {"t": "section", "h": "Finding and choosing | إيجاد واختيار المواد", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">All of these count as supplementary materials: DVDs, games, graded readers, language practice books, skills practice books, songs, teacher's books, video clips, and web resources.</div><div class=\"u\">كل دول بيتحسبوا مواد إضافية: أقراص DVD، ألعاب، قرايات مدرجة، كتب تمرين لغة، كتب تمرين مهارات، أغاني، كتب المدرس، مقاطع فيديو، وموارد الويب.</div>", "n": 1, "i": 14, "a": "tefl-29-012", "x": "b6c74bc6"}, {"t": "learn", "h": "<div class=\"u\">A graded reader is literature rewritten with limited vocabulary, matched to the learner's level.</div><div class=\"u\">القراية المدرجة هي أدب متعاد كتابته بمفردات محدودة، مناسبة لمستوى المتعلم.</div>", "n": 1, "i": 15, "a": "tefl-29-013", "x": "f172a0d3"}, {"t": "learn", "h": "<div class=\"u\">Most schools already have lots of supplementary materials, usually language or skills practice books. Look at them before the course starts.</div><div class=\"u\">معظم المدارس عندها مواد إضافية كتير جاهزة، غالبًا كتب تمرين لغة أو مهارات. بص عليها قبل ما الكورس يبدأ.</div>", "n": 1, "i": 16, "a": "tefl-29-014", "x": "48bbd696"}, {"t": "learn", "h": "<div class=\"u\">Often you trawl the web for hours for material that was sitting on the shelf next to you.</div><div class=\"u\">كتير بتدوّر على الويب ساعات على مادة كانت قاعدة على الرف جنبك.</div>", "n": 1, "i": 17, "a": "tefl-29-015", "x": "9e1dab2f"}, {"t": "learn", "h": "<div class=\"u\">Still, the Internet has transformed the availability of resources for EFL teachers. Some websites need a subscription to download, but many are free.</div><div class=\"u\">ومع ذلك، الإنترنت غيّر توفر الموارد لمدرسي الإنجليزية. بعض المواقع محتاجة اشتراك عشان التحميل، بس كتير منها مجاني.</div>", "n": 1, "i": 18, "a": "tefl-29-016", "x": "d71e1fd4"}, {"t": "learn", "h": "<div class=\"u\">You do not always need special EFL material. Authentic resources like video clips or newspaper articles add a realistic element to your teaching.</div><div class=\"u\">مش لازم دايمًا مادة مخصصة لتدريس الإنجليزية. الموارد الأصلية زي مقاطع الفيديو أو مقالات الجرايد بتزوّد عنصر واقعي لتدريسك.</div>", "n": 1, "i": 19, "a": "tefl-29-017", "x": "262b58d1"}, {"t": "learn", "h": "<div class=\"u\">Choosing materials: some activities look great but are inappropriate for your class, because of the content or the level.</div><div class=\"u\">اختيار المواد: بعض الأنشطة شكلها عظيم بس غير مناسبة لفصلك، بسبب المحتوى أو المستوى.</div>", "n": 1, "i": 20, "a": "tefl-29-018", "x": "4a656c59"}, {"t": "learn", "h": "<div class=\"u\">You can adapt material, but do not force it. If it will not fulfil your lesson objectives and complement your plan, it is probably not worth it.</div><div class=\"u\">تقدر تكيّف المادة، بس ماتجبرهاش. لو مش هتحقق أهداف درسك وتكمّل خطتك، غالبًا ماتستاهلش.</div>", "n": 1, "i": 21, "a": "tefl-29-019", "x": "9a28db14"}, {"t": "learn", "h": "<div class=\"u\">Some activities and authentic resources come with no instructions. Make sure you are comfortable incorporating them into your lesson in a suitable way.</div><div class=\"u\">بعض الأنشطة والموارد الأصلية بتيجي من غير تعليمات. اتأكد إنك مرتاح لدمجها في درسك بطريقة مناسبة.</div>", "n": 1, "i": 22, "a": "tefl-29-020", "x": "0b28695a"}, {"t": "learn", "h": "<div class=\"u\">Others may need language or a topic your learners have not studied yet. Be aware of anything you need to pre-teach.</div><div class=\"u\">وغيرها ممكن يحتاج لغة أو موضوع متعلميك مادرسوش لسه. خد بالك من أي حاجة محتاجة تتدرّس قبلها.</div>", "n": 1, "i": 23, "a": "tefl-29-021", "x": "ac4460f3"}, {"t": "learn", "h": "<div class=\"u\">Incorporate a variety of extra material to make lessons fun. But do not get carried away trying to find a video to introduce every lesson.</div><div class=\"u\">دمّج تنويع من المواد الزيادة عشان تخلّي الدروس ممتعة. بس ماتندمجش في محاولة تلاقي فيديو يقدّم كل درس.</div>", "n": 1, "i": 24, "a": "tefl-29-022", "x": "598230b3"}, {"t": "section", "h": "Unit 6 questions | أسئلة الوحدة ٦", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">Question one: which are supplementary materials? Tick graded readers, games, and videos or DVDs. Dictionaries are not; they are reference materials.</div><div class=\"u\">سؤال واحد: إيه المواد الإضافية؟ علّم على القرايات المدرجة والألعاب والفيديوهات أو أقراص DVD. القواميس لأ؛ دي مواد مرجعية.</div>", "n": 1, "i": 26, "a": "tefl-29-023", "x": "93e16ee1"}, {"t": "learn", "h": "<div class=\"u\">Question two: which is NOT an advantage of graded readers? Answer: students might choose books that are not challenging. That is a disadvantage.</div><div class=\"u\">سؤال اتنين: إيه اللي مش ميزة في القرايات المدرجة؟ الإجابة: الطلبة ممكن يختاروا كتب مش بتتحداهم. ده عيب.</div>", "n": 1, "i": 27, "a": "tefl-29-024", "x": "6b60cd4a"}, {"t": "learn", "h": "<div class=\"u\">The real advantages: they encourage reading for pleasure, give extra grammar practice, and let learners choose their own reading material.</div><div class=\"u\">المميزات الحقيقية: بتشجّع القراية للمتعة، وبتدّي تمرين قواعد زيادة، وبتخلّي المتعلمين يختاروا مادة قرايتهم بنفسهم.</div>", "n": 1, "i": 28, "a": "tefl-29-025", "x": "202537fb"}, {"t": "learn", "h": "<div class=\"u\">Question three: why use a song in a lesson? Answer: all of the above. It changes the mood or pace, adds variety, and can practise a particular grammatical function.</div><div class=\"u\">سؤال تلاتة: ليه تستخدم أغنية في الدرس؟ الإجابة: كل اللي فوق. بتغيّر المود أو إيقاع الدرس، وبتزوّد تنويع، وممكن تدرّب وظيفة نحوية معينة.</div>", "n": 1, "i": 29, "a": "tefl-29-026", "x": "780bee5d"}, {"t": "section", "h": "Teaching aids overview | نظرة عامة على الوسايل", "n": 1, "i": 30}, {"t": "learn", "h": "<div class=\"u\">Teaching aids are the equipment and tools we use in the classroom.</div><div class=\"u\">الوسايل التعليمية هي الأجهزة والأدوات اللي بنستخدمها في الفصل.</div>", "n": 1, "i": 31, "a": "tefl-29-027", "x": "fe1d3f14"}, {"t": "learn", "h": "<div class=\"u\">They can illustrate a point, reinforce a skill, relieve anxiety or boredom, or help learners memorise information.</div><div class=\"u\">تقدر توضّح نقطة، أو تثبّت مهارة، أو تخفّف التوتر أو الملل، أو تساعد المتعلمين يحفظوا المعلومات.</div>", "n": 1, "i": 32, "a": "tefl-29-028", "x": "e21a5def"}, {"t": "learn", "h": "<div class=\"u\">The list is long: CD players, DVD players, puppets, interactive whiteboards, boards, and computers.</div><div class=\"u\">القايمة طويلة: مشغلات CD، مشغلات DVD، دمى، سبورات ذكية تفاعلية، سبورات، وكمبيوترات.</div>", "n": 1, "i": 33, "a": "tefl-29-029", "x": "e25e80b1"}, {"t": "learn", "h": "<div class=\"u\">Also: visual aids like flashcards, games, real-life materials like menus, and language laboratories.</div><div class=\"u\">وكمان: وسايل بصرية زي البطاقات، وألعاب، ومواد حقيقية زي المنيوهات، ومعامل لغة.</div>", "n": 1, "i": 34, "a": "tefl-29-030", "x": "18e4c9d9"}, {"t": "learn", "h": "<div class=\"u\">In a language laboratory students can listen and record themselves speaking.</div><div class=\"u\">في معمل اللغة الطلبة يقدروا يسمعوا ويسجّلوا نفسهم وهما بيتكلموا.</div>", "n": 1, "i": 35, "a": "tefl-29-031", "x": "27820fad"}, {"t": "learn", "h": "<div class=\"u\">There are many ways to use each aid. You must think about which ones fulfil your specific objectives and suit your students.</div><div class=\"u\">في طرق كتير لاستخدام كل وسيلة. لازم تفكر أنهي واحدة بتحقق أهدافك المحددة وتناسب طلبتك.</div>", "n": 1, "i": 36, "a": "tefl-29-032", "x": "9854e36e"}, {"t": "learn", "h": "<div class=\"u\">Example: puppets are a fantastic resource for teaching children, but may seem patronising to an adult class of business English learners.</div><div class=\"u\">مثال: الدمى مورد رائع لتعليم العيال، بس ممكن تبان استعلائية على فصل كبار بيدرسوا إنجليزية بيزنس.</div>", "n": 1, "i": 37, "a": "tefl-29-033", "x": "fc2bf041"}, {"t": "learn", "h": "<div class=\"u\">Prepare any aids in advance, and always check that equipment works before the lesson.</div><div class=\"u\">جهّز أي وسايل قبل الوقت، ودايمًا اتأكد إن الأجهزة شغالة قبل الدرس.</div>", "n": 1, "i": 38, "a": "tefl-29-034", "x": "33d53438"}, {"t": "learn", "h": "<div class=\"u\">There is nothing worse than planning a listening lesson, only to find that the CD player is faulty.</div><div class=\"u\">مفيش أسوأ من إنك تخطط درس استماع، وتلاقي مشغل الـCD بايظ.</div>", "n": 1, "i": 39, "a": "tefl-29-035", "x": "150ef828"}, {"t": "section", "h": "Board and overhead projector | السبورة والبروجيكتور", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">The board is an essential part of any classroom. On it you write grammatical structures, explanations, and elicited vocabulary, where all students can see easily.</div><div class=\"u\">السبورة جزء أساسي من أي فصل. عليها بتكتب التراكيب النحوية والشروحات والمفردات المستخرجة من الطلبة، حيث كل الطلبة يقدروا يشوفوا بسهولة.</div>", "n": 1, "i": 41, "a": "tefl-29-036", "x": "9995b55b"}, {"t": "learn", "h": "<div class=\"u\">You can also build ideas into diagrams as they crop up, and use the board for team competitions.</div><div class=\"u\">وتقدر كمان تبني الأفكار في رسوم توضيحية أول بأول، وتستخدم السبورة لمسابقات الفرايق.</div>", "n": 1, "i": 42, "a": "tefl-29-037", "x": "99b54c13"}, {"t": "learn", "h": "<div class=\"u\">Most students secretly love being given the chance to write on the board, even adults.</div><div class=\"u\">معظم الطلبة في السر بيحبوا ياخدوا فرصة يكتبوا على السبورة، حتى الكبار.</div>", "n": 1, "i": 43, "a": "tefl-29-038", "x": "dd111e67"}, {"t": "learn", "h": "<div class=\"u\">Use different colours to highlight rules or parts of speech.</div><div class=\"u\">استخدم ألوان مختلفة عشان تظلّل القواعد أو أجزاء الكلام.</div>", "n": 1, "i": 44, "a": "tefl-29-039", "x": "5248e76c"}, {"t": "learn", "h": "<div class=\"u\">It can also help to divide the board into sections: one for grammar rules and model sentences, one for vocabulary.</div><div class=\"u\">وممكن يساعد إنك تقسّم السبورة لأجزاء: جزء لقواعد النحو والجمل النموذجية، وجزء للمفردات.</div>", "n": 1, "i": 45, "a": "tefl-29-040", "x": "e1cd49f6"}, {"t": "learn", "h": "<div class=\"u\">The overhead projector can show a worksheet to the whole class, instead of holding up a book and pointing at sections.</div><div class=\"u\">البروجيكتور الشفاف يقدر يعرض ورقة العمل لكل الفصل، بدل ما ترفع كتاب وتشاور على الأجزاء.</div>", "n": 1, "i": 46, "a": "tefl-29-041", "x": "07b6f0b1"}, {"t": "learn", "h": "<div class=\"u\">Prepare a completed handout with the correct answers, and going through homework becomes quick.</div><div class=\"u\">جهّز ورقة مكتملة بالإجابات الصح، ومراجعة الواجب بتبقى سريعة.</div>", "n": 1, "i": 47, "a": "tefl-29-042", "x": "1d56a6d7"}, {"t": "learn", "h": "<div class=\"u\">You can cover sections of the sheet and uncover them gradually as the lesson progresses, so students focus on one exercise at a time.</div><div class=\"u\">تقدر تغطّي أجزاء من الورقة وتكشفها بالتدريج مع تقدم الدرس، عشان الطلبة يركّزوا على تمرين واحد في كل مرة.</div>", "n": 1, "i": 48, "a": "tefl-29-043", "x": "cd8e225b"}, {"t": "learn", "h": "<div class=\"u\">It is also a great resource for groups to present their work to the class.</div><div class=\"u\">وهو كمان مورد عظيم لما الفرايق تعرض شغلها على الفصل.</div>", "n": 1, "i": 49, "a": "tefl-29-044", "x": "fcd0c711"}, {"t": "section", "h": "Tech aids | الوسايل التقنية", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">CD players are essential for listening exercises, where students listen to a dialogue and complete comprehension tasks.</div><div class=\"u\">مشغلات CD أساسية لتمارين الاستماع، حيث الطلبة بيسمعوا حوار وبيكمّلوا مهام فهم.</div>", "n": 1, "i": 51, "a": "tefl-29-045", "x": "06e21b4f"}, {"t": "learn", "h": "<div class=\"u\">They can also model pronunciation, or simply offer listening for pleasure as a Friday afternoon activity.</div><div class=\"u\">وتقدر كمان تقدّم نموذج للنطق، أو بس استماع للمتعة كنشطة أخر الأسبوع.</div>", "n": 1, "i": 52, "a": "tefl-29-046", "x": "254dcb42"}, {"t": "learn", "h": "<div class=\"u\">DVD players add a visual element, which really helps learners with visual memories.</div><div class=\"u\">مشغلات DVD بتزوّد عنصر بصري، وده بيساعد جدًا المتعلمين أصحاب الذاكرة البصرية.</div>", "n": 1, "i": 53, "a": "tefl-29-047", "x": "a77ce699"}, {"t": "learn", "h": "<div class=\"u\">DVD activities: pause and predict what happens next, watch without sound and guess what is being said, or play a recording of the students themselves in action.</div><div class=\"u\">أنشطة DVD: وقّف وتوقّع إيه اللي هيحصل، اتفرج من غير صوت وخمّن إيه اللي بيتقال، أو شغّل تسجيل للطلبة نفسهم وهما بيمثلوا.</div>", "n": 1, "i": 54, "a": "tefl-29-048", "x": "810cf64a"}, {"t": "learn", "h": "<div class=\"u\">Computers give access to the web and its resources. There are millions of interactive EFL exercises, and students can click the correct answers themselves.</div><div class=\"u\">الكمبيوترات بتدّي وصول للويب وموارده. في ملايين من تمارين الإنجليزية التفاعلية، والطلبة يقدروا يدوسوا على الإجابات الصح بنفسهم.</div>", "n": 1, "i": 55, "a": "tefl-29-049", "x": "ae97cdf0"}, {"t": "learn", "h": "<div class=\"u\">Students can also join English language forums, and find an English-speaking penfriend to e-mail or chat with.</div><div class=\"u\">الطلبة يقدروا كمان يدخلوا منتديات إنجليزية، ويلاقوا صديق بالمراسلة بيتكلم إنجليزية يبعتلوا إيميلات أو يتكلموا معاه.</div>", "n": 1, "i": 56, "a": "tefl-29-050", "x": "aa5ee781"}, {"t": "learn", "h": "<div class=\"u\">You can set projects too, at home or on class computers. And no Internet is needed for simple tasks like typing a group story or making a poster.</div><div class=\"u\">وتقدر تكلّف مشاريع كمان، في البيت أو على كمبيوترات الفصل. ومش محتاج إنترنت لمهام بسيطة زي كتابة قصة جماعية أو عمل بوستر.</div>", "n": 1, "i": 57, "a": "tefl-29-051", "x": "9dc406d2"}, {"t": "learn", "h": "<div class=\"u\">A language laboratory or self-access area has books, computers, and CDs for students to use by themselves.</div><div class=\"u\">معمل اللغة أو منطقة الوصول الذاتي فيها كتب وكمبيوترات وأقراص للطلبة يستخدموها لوحدهم.</div>", "n": 1, "i": 58, "a": "tefl-29-052", "x": "4ce2a940"}, {"t": "learn", "h": "<div class=\"u\">This encourages autonomous learning, letting learners choose the activities they want to do.</div><div class=\"u\">ده بيشجّع التعلم الذاتي، بيخلّي المتعلمين يختاروا الأنشطة اللي عايزينها.</div>", "n": 1, "i": 59, "a": "tefl-29-053", "x": "bd5b080f"}, {"t": "learn", "h": "<div class=\"u\">Its listening and recording equipment lets students practise speaking and pronunciation, then listen back and assess their own performance.</div><div class=\"u\">أجهزة الاستماع والتسجيل فيه بتخلّي الطلبة يتمرنوا على الكلام والنطق، وبعدين يسمعوا نفسهم ويقيّموا أداءهم.</div>", "n": 1, "i": 60, "a": "tefl-29-054", "x": "452e0eca"}, {"t": "learn", "h": "<div class=\"u\">You can also have them record speaking tasks from class or homework, so you can monitor them and give individual feedback.</div><div class=\"u\">وتقدر كمان تخلّيهم يسجّلوا مهام كلام من الفصل أو الواجب، عشان تراقبهم وتدّي ملاحظات فردية.</div>", "n": 1, "i": 61, "a": "tefl-29-055", "x": "da20f643"}, {"t": "section", "h": "Flashcards, realia, puppets | البطاقات والرياليا والدمى", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Flashcards present vocabulary with a matching image, so students remember it better.</div><div class=\"u\">البطاقات التعليمية بتقدّم المفردات مع صورة مطابقة، فالطلبة بيفتكروها أحسن.</div>", "n": 1, "i": 63, "a": "tefl-29-056", "x": "4108e1ae"}, {"t": "learn", "h": "<div class=\"u\">They are also useful for drilling pronunciation, or even grammatical structures.</div><div class=\"u\">وهي كمان مفيدة للتدريب المتكرر على النطق، أو حتى التراكيب النحوية.</div>", "n": 1, "i": 64, "a": "tefl-29-057", "x": "1e03a9e0"}, {"t": "learn", "h": "<div class=\"u\">The idea is to flash them up quickly, to get a quick response.</div><div class=\"u\">الفكرة إنها بتتعرض بسرعة، عشان تجيب رد سريع.</div>", "n": 1, "i": 65, "a": "tefl-29-058", "x": "d5b3a689"}, {"t": "learn", "h": "<div class=\"u\">For new vocabulary, show the word with the picture. Then erase the word and show only the picture, or put the word on the back, to test what students know.</div><div class=\"u\">للمفردات الجديدة، اعرض الكلمة مع الصورة. وبعدين امسح الكلمة واعرض الصورة بس، أو حط الكلمة على الضهر، عشان تختبر اللي الطلبة عارفينه.</div>", "n": 1, "i": 66, "a": "tefl-29-059", "x": "02c9dc72"}, {"t": "learn", "h": "<div class=\"u\">Real-life materials, or realia: when teaching abroad, take authentic material from home.</div><div class=\"u\">المواد الحقيقية، أو الرياليا: لما تدرّس بره، خد معاك مواد أصلية من بلدك.</div>", "n": 1, "i": 67, "a": "tefl-29-060", "x": "2f6cf01c"}, {"t": "learn", "h": "<div class=\"u\">For example: newspaper articles, menus, maps, tourist information about your home town, even bus or train timetables.</div><div class=\"u\">مثال: مقالات جرايد، منيوهات، خرايط، معلومات سياحية عن بلدك، حتى مواعيد الأتوبيس أو القطر.</div>", "n": 1, "i": 68, "a": "tefl-29-061", "x": "07993979"}, {"t": "learn", "h": "<div class=\"u\">Realia make the learning experience much more authentic and memorable.</div><div class=\"u\">الرياليا بتخلّي تجربة التعلم أصلية أكتر بكتير وتفتكر.</div>", "n": 1, "i": 69, "a": "tefl-29-062", "x": "0f2fd5a9"}, {"t": "learn", "h": "<div class=\"u\">Teaching food vocabulary? Take in different fruits and vegetables, to stimulate all the students' senses and add fun.</div><div class=\"u\">بتدرّس مفردات الأكل؟ هات فواكه وخضار مختلف، عشان تنشّط كل حواس الطلبة وتزوّد مرح.</div>", "n": 1, "i": 70, "a": "tefl-29-063", "x": "60c23ec8"}, {"t": "learn", "h": "<div class=\"u\">Realia can even be used to tell a story, as part of a game, or to form a dialogue.</div><div class=\"u\">الرياليا ممكن حتى تتستخدم في حكاية قصة، أو كجزء من لعبة، أو لتكوين حوار.</div>", "n": 1, "i": 71, "a": "tefl-29-064", "x": "8078ad57"}, {"t": "learn", "h": "<div class=\"u\">The unit's matching task, solved. Animal vocabulary: stuffed animals, pictures of endangered species, and zoo games.</div><div class=\"u\">تمرين التوصيل في الوحدة، محلول. مفردات الحيوانات: حيوانات محشوة، وصور حيوانات مهددة بالانقراض، وألعاب حديقة حيوان.</div>", "n": 1, "i": 72, "a": "tefl-29-065", "x": "3045fd13"}, {"t": "learn", "h": "<div class=\"u\">Island survival game: rope and a tin opener. An all-about-English lesson: a picture of the Queen, teabags, and a Union Jack flag.</div><div class=\"u\">لعبة النجاة على جزيرة: حبل وفاتحة علب. درس كله عن إنجلترا: صورة الملكة، أكياس شاي، وعلم بريطانيا.</div>", "n": 1, "i": 73, "a": "tefl-29-066", "x": "a2ba29de"}, {"t": "learn", "h": "<div class=\"u\">Directions: a map of London and a tube map.</div><div class=\"u\">الاتجاهات: خريطة لندن وخريطة المترو.</div>", "n": 1, "i": 74, "a": "tefl-29-067", "x": "0d2c9b3d"}, {"t": "learn", "h": "<div class=\"u\">Puppets give a concrete visual aid that helps students understand and remember what you are teaching.</div><div class=\"u\">الدمى بتدّي وسيلة بصرية ملموسة بتساعد الطلبة يفهموا ويفتكروا اللي بتدرّسه.</div>", "n": 1, "i": 75, "a": "tefl-29-068", "x": "570d20fb"}, {"t": "learn", "h": "<div class=\"u\">They are great for presenting dialogues to young learners, arousing interest and encouraging involvement, because they engage the learner on many levels.</div><div class=\"u\">هي عظيمة لعرض الحوارات على المتعلمين الصغيرين، بتثير الاهتمام وبتشجّع المشاركة، لأنها بتخاطب المتعلم على مستويات كتير.</div>", "n": 1, "i": 76, "a": "tefl-29-069", "x": "ab4cd85e"}, {"t": "learn", "h": "<div class=\"u\">Denise Özdeniz suggests puppets let children see another native English speaker in class, so they naturally copy the dialogues you and the puppet model.</div><div class=\"u\">دينيز أوزدينيز بتقترح إن الدمى بتخلّي العيال يشوفوا متحدث أصلي تاني للإنجليزية في الفصل، فبيقلّدوا الحوارات اللي إنت والدمية بتقدّموها طبيعي.</div>", "n": 1, "i": 77, "a": "tefl-29-070", "x": "54f422e8"}, {"t": "learn", "h": "<div class=\"u\">You can buy or make puppets easily, and students can make their own as a speaking task.</div><div class=\"u\">تقدر تشتري أو تعمل دمى بسهولة، والطلبة يقدروا يعملوا دماهم بنفسهم كمهمة كلام.</div>", "n": 1, "i": 78, "a": "tefl-29-071", "x": "b0dbcd44"}, {"t": "learn", "h": "<div class=\"u\">This is great for shy students or ones embarrassed to speak English: the puppet gives them a safe space to talk.</div><div class=\"u\">ده عظيم للطلبة الخجولين أو اللي بيستحيوا يتكلموا إنجليزية: الدمية بتدّيهم مساحة أمان يتكلموا فيها.</div>", "n": 1, "i": 79, "a": "tefl-29-072", "x": "e1968d63"}, {"t": "learn", "h": "<div class=\"u\">The puppet is also a mid-way point between students and teacher, so they feel less anxiety when practising dialogues with it.</div><div class=\"u\">الدمية كمان نقطة نص بين الطلبة والمدرس، فبيحسوا بقلق أقل وهما بيتمرنوا على الحوارات معاها.</div>", "n": 1, "i": 80, "a": "tefl-29-073", "x": "55a38f12"}, {"t": "learn", "h": "<div class=\"u\">Search online for ways to make simple puppets for the EFL classroom, and you may see fantastic results.</div><div class=\"u\">دوّر أونلاين على طرق عمل دمى بسيطة لفصل الإنجليزية، وممكن تشوف نتايج رائعة.</div>", "n": 1, "i": 81, "a": "tefl-29-074", "x": "85b77a3c"}, {"t": "section", "h": "You are an aid + Unit 7 questions | إنت كمان وسيلة + أسئلة الوحدة ٧", "n": 1, "i": 82}, {"t": "learn", "h": "<div class=\"u\">These are just some examples of teaching aids. Some are modern, others are old favourites, and all have their own pros and cons.</div><div class=\"u\">دي بس أمثلة من الوسايل التعليمية. بعضها حديث وبعضها كلاسيكيات محبوبة، وكلها ليها مميزاتها وعيوبها.</div>", "n": 1, "i": 83, "a": "tefl-29-075", "x": "aa970908"}, {"t": "learn", "h": "<div class=\"u\">Experiment to see which work best for different lessons and students.</div><div class=\"u\">جرّب عشان تشوف أنهي وسايل بتشتغل أحسن مع دروس وطلبة مختلفين.</div>", "n": 1, "i": 84, "a": "tefl-29-076", "x": "9da2c653"}, {"t": "learn", "h": "<div class=\"u\">But remember: you are an aid too. Facial expressions, gestures, body language, acting, and mime can all bring different elements to your lessons.</div><div class=\"u\">بس فاكر: إنت كمان وسيلة. تعبيرات الوش والإشارات ولغة الجسم والتمثيل والإيماء كلها بتجيب عناصر مختلفة لدروسك.</div>", "n": 1, "i": 85, "a": "tefl-29-077", "x": "34f39016"}, {"t": "learn", "h": "<div class=\"u\">They help you elicit, clarify, and create context.</div><div class=\"u\">بتساعدك تستخرج المعلومات من الطلبة، وتوضّح، وتعمل سياق.</div>", "n": 1, "i": 86, "a": "tefl-29-078", "x": "a63df9f3"}, {"t": "learn", "h": "<div class=\"u\">Question one: I collect all types of menus and maps whenever I go home, to use in class. The missing word is realia.</div><div class=\"u\">سؤال واحد: بجمع كل أنواع المنيوهات والخرايط كل ما أروح بلدي، عشان أستخدمها في الفصل. الكلمة الناقصة هي الرياليا.</div>", "n": 1, "i": 87, "a": "tefl-29-079", "x": "b2673b2d"}, {"t": "learn", "h": "<div class=\"u\">Question two: which is INCORRECT about the overhead projector? Answer: practising dialogues. It uncovers worksheet sections slowly and presents students' work.</div><div class=\"u\">سؤال اتنين: إيه الغلط عن البروجيكتور الشفاف؟ الإجابة: التمرن على الحوارات. هو بيكشف أجزاء ورقة العمل بالتدريج وبيقدّم شغل الطلبة.</div>", "n": 1, "i": 88, "a": "tefl-29-080", "x": "cced9ecc"}, {"t": "learn", "h": "<div class=\"u\">Question three: which is NOT a teaching aid? Answer: the course book. Puppets, the DVD player, and even the teacher are all teaching aids.</div><div class=\"u\">سؤال تلاتة: إيه اللي مش وسيلة تعليمية؟ الإجابة: الكتاب المقرر. الدمى ومشغل الـDVD وحتى المدرس كلهم وسايل تعليمية.</div>", "n": 1, "i": 89, "a": "tefl-29-081", "x": "c2247fe0"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 90}, {"t": "learn", "h": "<div class=\"u\">supplementary material: extra material used in addition to the course book.</div><div class=\"u\">مادة إضافية: مادة زيادة بتتستخدم فوق الكتاب المقرر.</div>", "n": 1, "i": 91, "a": "tefl-29-082", "x": "d61a5c64"}, {"t": "learn", "h": "<div class=\"u\">graded reader: literature rewritten with limited vocabulary by level.</div><div class=\"u\">القراية المدرجة: أدب متعاد كتابته بمفردات محدودة حسب المستوى.</div>", "n": 1, "i": 92, "a": "tefl-29-083", "x": "ad0365bf"}, {"t": "learn", "h": "<div class=\"u\">teaching aid: equipment or tools used in the classroom.</div><div class=\"u\">وسيلة تعليمية: أجهزة أو أدوات بتتستخدم في الفصل.</div>", "n": 1, "i": 93, "a": "tefl-29-084", "x": "c67f539e"}, {"t": "learn", "h": "<div class=\"u\">flashcard: a card with a word or picture for quick drilling.</div><div class=\"u\">بطاقة تعليمية: كارت عليه كلمة أو صورة للتدريب السريع.</div>", "n": 1, "i": 94, "a": "tefl-29-085", "x": "59f9720e"}, {"t": "learn", "h": "<div class=\"u\">realia: real-life objects brought into class, like menus and maps.</div><div class=\"u\">الرياليا: أشياء من الحياة الحقيقية بتتجاب للفصل، زي المنيوهات والخرايط.</div>", "n": 1, "i": 95, "a": "tefl-29-086", "x": "2bfeba06"}, {"t": "learn", "h": "<div class=\"u\">puppet: a doll used to model dialogues in class.</div><div class=\"u\">دمية: عروسة بتتستخدم لعرض الحوارات في الفصل.</div>", "n": 1, "i": 96, "a": "tefl-29-087", "x": "7bd4006e"}, {"t": "learn", "h": "<div class=\"u\">overhead projector: projects a worksheet onto a screen for the class.</div><div class=\"u\">البروجيكتور الشفاف: بيعرض ورقة العمل على الشاشة للفصل.</div>", "n": 1, "i": 97, "a": "tefl-29-088", "x": "fcd1f381"}, {"t": "learn", "h": "<div class=\"u\">language laboratory: a room with listening and recording equipment.</div><div class=\"u\">معمل اللغة: أوضة فيها أجهزة استماع وتسجيل.</div>", "n": 1, "i": 98, "a": "tefl-29-089", "x": "608dfb62"}, {"t": "learn", "h": "<div class=\"u\">autonomous learning: learners studying independently, by choice.</div><div class=\"u\">التعلم الذاتي: المتعلمين بيدرسوا لوحدهم، باختيارهم.</div>", "n": 1, "i": 99, "a": "tefl-29-090", "x": "6ea74337"}, {"t": "learn", "h": "<div class=\"u\">drilling: quick repeated practice of a language point.</div><div class=\"u\">التدريب المتكرر: تمرين سريع متعاد على نقطة لغوية.</div>", "n": 1, "i": 100, "a": "tefl-29-091", "x": "0ca014f0"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 101}, {"t": "learn", "h": "<div class=\"u\">Supplementary materials are anything used in addition to the course book, from worksheets to DVDs, games, songs, and graded readers.</div><div class=\"u\">المواد الإضافية هي أي حاجة بتتستخدم فوق الكتاب المقرر، من أوراق العمل لأقراص DVD والألعاب والأغاني والقرايات المدرجة.</div>", "n": 1, "i": 102, "a": "tefl-29-092", "x": "cb60169d"}, {"t": "learn", "h": "<div class=\"u\">They add variety and fit mixed abilities, but watch the level, the syllabus fit, the equipment, and your preparation time.</div><div class=\"u\">بتزوّد تنويع وبتناسب المستويات المختلطة، بس خد بالك من المستوى وملاءمة المنهج والأجهزة ووقت تحضيرك.</div>", "n": 1, "i": 103, "a": "tefl-29-093", "x": "aa297c03"}, {"t": "learn", "h": "<div class=\"u\">Check the school shelf before searching the web, and make sure any material serves your lesson objectives.</div><div class=\"u\">بص على رف المدرسة قبل ما تدوّر على الويب، واتأكد إن أي مادة بتحقق أهداف درسك.</div>", "n": 1, "i": 104, "a": "tefl-29-094", "x": "76173d3f"}, {"t": "learn", "h": "<div class=\"u\">Teaching aids are the tools of the classroom: board, projectors, players, computers, flashcards, realia, puppets, and language labs.</div><div class=\"u\">الوسايل التعليمية هي أدوات الفصل: السبورة، البروجيكتورات، المشغلات، الكمبيوترات، البطاقات، الرياليا، الدمى، ومعامل اللغة.</div>", "n": 1, "i": 105, "a": "tefl-29-095", "x": "f1f98d6d"}, {"t": "learn", "h": "<div class=\"u\">Choose aids that fit your objectives and your students, check the equipment works, and remember that you are an aid too.</div><div class=\"u\">اختار وسايل تناسب أهدافك وطلبتك، واتأكد إن الأجهزة شغالة، وفاكر إن إنت كمان وسيلة.</div>", "n": 1, "i": 106, "a": "tefl-29-096", "x": "619b3e28"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 107}, {"t": "mc", "q": "Which of these is NOT a supplementary material?<br>أنهي واحدة من دول مش مادة إضافية؟", "opts": ["a dictionary | قاموس", "a graded reader | قراية مدرجة", "a song | أغنية"], "ans": 0, "why": "Dictionaries are reference materials, not supplementary task materials. | القواميس مواد مرجعية، مش مواد مهام إضافية.", "ex": ["Correct. | صح.", "No. Graded readers are supplementary. | غلط: القرايات المدرجة إضافية.", "No. Songs are supplementary. | غلط: الأغاني إضافية."], "n": 1, "i": 108, "h": ""}, {"t": "tf", "q": "Supplementary materials always fit the course book syllabus.<br>المواد الإضافية دايمًا بتناسب منهج الكتاب المقرر.", "ans": false, "why": "False. They may not fit the syllabus, or may not be at the correct level. | غلط. ممكن ماتناسبش المنهج، أو ماتكونش على المستوى المظبوط.", "ex": ["Wrong. Fitting the syllabus is not guaranteed. | غلط: ملاءمة المنهج مش مضمونة.", "Correct. | صح."], "n": 1, "i": 109, "h": ""}, {"t": "mc", "q": "Which is NOT an advantage of graded readers?<br>إيه اللي مش ميزة في القرايات المدرجة؟", "opts": ["students might choose books that are not challenging | الطلبة ممكن يختاروا كتب مش بتتحداهم", "they encourage reading for pleasure | بتشجّع القراية للمتعة", "they give extra grammar practice | بتدّي تمرين قواعد زيادة"], "ans": 0, "why": "Choosing unchallenging books is a disadvantage, not an advantage. | اختيار كتب سهلة أوي ده عيب، مش ميزة.", "ex": ["Correct. | صح.", "No. Reading for pleasure is an advantage. | غلط: القراية للمتعة ميزة.", "No. Extra grammar practice is an advantage. | غلط: تمرين القواعد الزيادة ميزة."], "n": 1, "i": 110, "h": ""}, {"t": "mc", "q": "Why would you use a song in a lesson?<br>ليه تستخدم أغنية في الدرس؟", "opts": ["all of the above | كل اللي فوق", "to change the mood or pace | عشان تغيّر المود أو الإيقاع", "to practise a grammatical function | عشان تتمرن على وظيفة نحوية"], "ans": 0, "why": "All three are valid reasons, and variety too. | التلاتة أسباب صحيحة، والتنويع كمان.", "ex": ["Correct. | صح.", "That is true, but it is only one of the reasons. | ده صح، بس ده سبب واحد بس.", "That is true, but it is only one of the reasons. | ده صح، بس ده سبب واحد بس."], "n": 1, "i": 111, "h": ""}, {"t": "mc", "q": "Menus and maps a teacher collects to use in class are called:<br>المنيوهات والخرايط اللي المدرس بيجمعها عشان يستخدمها في الفصل بتتسمى:", "opts": ["realia | رياليا", "puppets | دمى", "flashcards | بطاقات تعليمية"], "ans": 0, "why": "Realia are real-life objects brought into the classroom. | الرياليا أشياء من الحياة الحقيقية بتتجاب للفصل.", "ex": ["Correct. | صح.", "No. Puppets are dolls for dialogues. | غلط: الدمى عرايس للحوارات.", "No. Flashcards are cards with words or pictures. | غلط: البطاقات كروت عليها كلمات أو صور."], "n": 1, "i": 112, "h": ""}, {"t": "mc", "q": "Which use of the overhead projector is INCORRECT?<br>أنهي استخدام للبروجيكتور الشفاف غلط؟", "opts": ["practising dialogues | التمرن على الحوارات", "uncovering sections of a worksheet slowly | كشف أجزاء ورقة العمل بالتدريج", "presenting students' work | عرض شغل الطلبة"], "ans": 0, "why": "Dialogue practice is not what an overhead projector does. | التمرن على الحوارات مش من شغل البروجيكتور الشفاف.", "ex": ["Correct. | صح.", "No. Covering and uncovering sections is a classic use. | غلط: تغطية وكشف الأجزاء استخدام كلاسيكي.", "No. Groups can present their work on it. | غلط: الفرايق تقدر تعرض شغلها عليه."], "n": 1, "i": 113, "h": ""}, {"t": "tf", "q": "Puppets are perfect for an adult class of business English learners.<br>الدمى مثالية لفصل كبار بيدرسوا إنجليزية بيزنس.", "ans": false, "why": "False. Puppets are fantastic for children but can seem patronising to adults. | غلط. الدمى رائعة للعيال بس ممكن تبان استعلائية على الكبار.", "ex": ["Wrong. Adults may find puppets patronising. | غلط: الكبار ممكن يحسوا إن الدمى استعلائية.", "Correct. | صح."], "n": 1, "i": 114, "h": ""}, {"t": "mc", "q": "Which of these is NOT a teaching aid?<br>أنهي واحدة من دول مش وسيلة تعليمية؟", "opts": ["the course book | الكتاب المقرر", "puppets | الدمى", "the teacher | المدرس"], "ans": 0, "why": "Puppets, DVD players, and even the teacher are teaching aids. The course book is the main material. | الدمى ومشغلات DVD وحتى المدرس وسايل تعليمية. الكتاب المقرر هو المادة الأساسية.", "ex": ["Correct. | صح.", "No. Puppets are a teaching aid. | غلط: الدمى وسيلة تعليمية.", "No. The unit says you are an aid too. | غلط: الوحدة بتقول إنت كمان وسيلة."], "n": 1, "i": 115, "h": ""}, {"t": "recall", "q": "Give three advantages and three disadvantages of supplementary materials.<br>اذكر تلات مميزات وتلات عيوب للمواد الإضافية.", "a": "Advantages: variety, extra practice, material adapted to needs. Disadvantages: wrong level, may not fit the syllabus, long preparation time.<br>المميزات: تنويع، تمرين زيادة، مادة متكيفة مع الاحتياجات. العيوب: مستوى غلط، ممكن ماتناسبش المنهج، وقت تحضير طويل.", "n": 1, "i": 116, "h": ""}, {"t": "recall", "q": "Name five teaching aids.<br>اذكر خمس وسايل تعليمية.", "a": "The board, the overhead projector, CD or DVD players, computers, flashcards, realia, puppets, the language laboratory, and even the teacher.<br>السبورة، البروجيكتور الشفاف، مشغلات CD أو DVD، الكمبيوترات، البطاقات التعليمية، الرياليا، الدمى، معمل اللغة، وحتى المدرس.", "n": 1, "i": 117, "h": ""}, {"t": "write", "q": "Explain why supplementary materials matter for a mixed ability class (3-4 sentences).<br>اشرح ليه المواد الإضافية مهمة لفصل بمستويات مختلفة (٣-٤ جمل).", "key": "tefl-29:1", "a": "In a mixed ability class one course book exercise rarely fits everyone. Supplementary materials let you give slightly different activities on the same language, theme, or skill, so each student works at the right level. They also act as back-ups for fast finishers, who would otherwise sit bored. Used this way, they keep every student busy, challenged, and included.<br>في فصل بمستويات مختلفة نادرًا تمرين واحد من الكتاب المقرر بيناسب الكل. المواد الإضافية بتخلّيك تدّي أنشطة مختلفة شوية على نفس اللغة أو الموضوع أو المهارة، فكل طالب يشتغل على المستوى المناسب. وبتشتغل كمان كاحتياطي للي بيخلّصوا بسرعة، اللي كانوا هيقعدوا زهقانين. بالطريقة دي، بتخلّي كل طالب مشغول ومتحدّى ومدمج.", "n": 1, "i": 118, "h": ""}, {"t": "write", "q": "Compare realia and flashcards as visual aids (3-4 sentences).<br>قارن بين الرياليا والبطاقات التعليمية كوسايل بصرية (٣-٤ جمل).", "key": "tefl-29:2", "a": "Flashcards are teacher-made cards pairing a word with a picture, flashed quickly for drilling vocabulary, pronunciation, or grammar. Realia are real objects from life, like menus, maps, or fruit, which make the lesson authentic and memorable. Flashcards are cheap, fast, and testable: erase the word and keep the picture to quiz the class. Realia engage all the senses and suit stories, games, and dialogues, but take effort to collect.<br>البطاقات التعليمية كروت من عمل المدرس بتجمع كلمة مع صورة، بتتعرض بسرعة للتدريب على المفردات أو النطق أو القواعد. الرياليا أشياء حقيقية من الحياة، زي المنيوهات والخرايط أو الفاكهة، بتخلّي الدرس أصلي ويتفتكر. البطاقات رخيصة وسريعة وقابلة للاختبار: امسح الكلمة وسيب الصورة عشان تختبر الفصل. الرياليا بتخاطب كل الحواس وبتناسب الحكايات والألعاب والحوارات، بس محتاجة مجهود في التجميع.", "n": 1, "i": 119, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: making your own materials, the last unit of Module 4, where you become the course writer.</div><div class=\"u\">الدرس الجاي: عمل موادك بنفسك، آخر وحدة في الموديول الرابع، لما تبقى إنت كاتب المنهج.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 120}];</script>
