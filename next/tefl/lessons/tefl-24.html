<h1>عالم تيفل ٢٤: أهداف الدرس</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٢٤</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-24";window.STEPS=[{"t": "section", "h": "Module 4 overview | نظرة عامة على الموديول ٤", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Module 4, Lesson Planning Plus. You know the different approaches to lesson planning; now it is time to actually create your plan.</div><div class=\"u\">أهلًا بيك في الموديول الرابع، تخطيط الدروس بلس. انت بقيت عارف الطرق المختلفة لتخطيط الدروس؛ دلوقتي جه وقت إنك تعمل خطتك فعلًا.</div>", "n": 1, "i": 1, "a": "tefl-24-001", "x": "d6d68e91"}, {"t": "learn", "h": "<div class=\"u\">There are a number of factors to consider when planning, and a variety of materials, resources and aids you can use to make the best lesson possible.</div><div class=\"u\">في كذا عامل لازم تفكّر فيه أثناء التخطيط، وتنوع من الخامات والموارد والوسائل تقدر تستخدمها عشان تعمل أحسن درس ممكن لطلبتك.</div>", "n": 1, "i": 2, "a": "tefl-24-002", "x": "84f3876f"}, {"t": "learn", "h": "<div class=\"u\">This module covers: lesson aims, components of a lesson plan, planning an individual lesson, and choosing assessment tasks.</div><div class=\"u\">الموديول ده بيغطي: أهداف الدرس، مكونات خطة الدرس، تخطيط درس فردي، واختيار مهام التقييم.</div>", "n": 1, "i": 3, "a": "tefl-24-003", "x": "31cd0821"}, {"t": "learn", "h": "<div class=\"u\">It also covers: course books, reference materials, supplementary resources, and teaching aids.</div><div class=\"u\">وبيغطي كمان: الكتب المقررة، والمواد المرجعية، والموارد التكميلية، والوسائل التعليمية.</div>", "n": 1, "i": 4, "a": "tefl-24-004", "x": "603e5512"}, {"t": "learn", "h": "<div class=\"u\">Much of what is covered corresponds to part of the Teacher Knowledge Test, the TKT, a qualification teachers can take to show their knowledge of language and EFL teaching.</div><div class=\"u\">جزء كبير من اللي بيتغطى بيقابل جزء من اختبار معرفة المدرس، الـTKT، وهو مؤهل المدرسين بياخدوه عشان يثبتوا معرفتهم باللغة وتدريس الإنجليزية.</div>", "n": 1, "i": 5, "a": "tefl-24-005", "x": "c21f5129"}, {"t": "section", "h": "What lesson aims are | يعني إيه أهداف الدرس", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">Every lesson must have some sort of purpose or end goal, otherwise what is the point?</div><div class=\"u\">كل درس لازم يكون ليه غرض أو هدف نهائي من نوع ما، وإلا يبقى الموضوع ليه أصلًا؟</div>", "n": 1, "i": 7, "a": "tefl-24-006", "x": "ab43a95c"}, {"t": "learn", "h": "<div class=\"u\">This does not mean every lesson's final aim is learners understanding a particular grammar point.</div><div class=\"u\">ده مش معناه إن الهدف النهائي لكل درس هو إن المتعلمين يفهموا نقطة قواعد معينة.</div>", "n": 1, "i": 8, "a": "tefl-24-007", "x": "f58ba092"}, {"t": "learn", "h": "<div class=\"u\">The goal could be anything from developing listening skills to practising language for a real-life situation like booking a hotel.</div><div class=\"u\">الهدف ممكن يكون أي حاجة من تطوير مهارات الاستماع لحد التمرّن على لغة لموقف من الحياة الحقيقية زي حجز فندق.</div>", "n": 1, "i": 9, "a": "tefl-24-008", "x": "1eca10b2"}, {"t": "learn", "h": "<div class=\"u\">Identifying the aim of every lesson may seem quite formal, but it really helps you concentrate on delivering a successful lesson.</div><div class=\"u\">تحديد هدف كل درس ممكن يبان رسمي شوية، بس فعلًا بيساعدك تركّز على تقديم درس ناجح.</div>", "n": 1, "i": 10, "a": "tefl-24-009", "x": "ed1b7796"}, {"t": "learn", "h": "<div class=\"u\">It also naturally leads you to the materials which will best fulfill this aim.</div><div class=\"u\">وكمان بيوصّلك بشكل طبيعي للخامات اللي هتحقق الهدف ده أحسن تحقيق.</div>", "n": 1, "i": 11, "a": "tefl-24-010", "x": "ffece88e"}, {"t": "learn", "h": "<div class=\"u\">However, aims are not all necessarily direct learning objectives.</div><div class=\"u\">بس الأهداف مش كلها بالضرورة أهداف تعلم مباشرة.</div>", "n": 1, "i": 12, "a": "tefl-24-011", "x": "aeb76391"}, {"t": "learn", "h": "<div class=\"u\">They could be aims for yourself: for example, limiting your Teacher Talk Time as much as possible, or aims focused on a particular student to make sure they keep up.</div><div class=\"u\">ممكن تكون أهداف ليك انت: مثال، تقليل وقت كلام المدرس قد الإمكان، أو أهداف مركزة على طالب معين عشان تتأكد إنه ماشي مع الفصل.</div>", "n": 1, "i": 13, "a": "tefl-24-012", "x": "4532ca6b"}, {"t": "learn", "h": "<div class=\"u\">As well as overall aims, you will also have a number of secondary or personal goals.</div><div class=\"u\">جنب الأهداف العامة، هيبقى عندك كمان عدد من الأهداف الثانوية أو الشخصية.</div>", "n": 1, "i": 14, "a": "tefl-24-013", "x": "e15ab99b"}, {"t": "section", "h": "The TKT aims table | جدول أهداف TKT", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">The Teacher Knowledge Test course divides aims into three types: main aim, subsidiary aims, and personal aims.</div><div class=\"u\">كورس اختبار معرفة المدرس بيقسّم الأهداف لتلاتة: الهدف الرئيسي، والأهداف الفرعية، والأهداف الشخصية.</div>", "n": 1, "i": 16, "a": "tefl-24-014", "x": "7676f386"}, {"t": "learn", "h": "<div class=\"u\">Example main aim: to practise making polite requests in the context of making holiday arrangements.</div><div class=\"u\">مثال هدف رئيسي: التمرّن على عمل طلبات مهذبة في سياق ترتيبات الأجازات.</div>", "n": 1, "i": 17, "a": "tefl-24-015", "x": "995838ce"}, {"t": "learn", "h": "<div class=\"u\">Example sentence: Could you give me some information about hotels?</div><div class=\"u\">جملة مثال: Could you give me some information about hotels?</div>", "n": 1, "i": 18, "a": "tefl-24-016", "x": "de173d0f"}, {"t": "learn", "h": "<div class=\"u\">Subsidiary aims for grammar: to revise modal auxiliary verbs. Functional example: Could/Would you...?</div><div class=\"u\">أهداف فرعية للقواعد: مراجعة الأفعال الناقصة. المثال الوظيفي: Could/Would you...?</div>", "n": 1, "i": 19, "a": "tefl-24-017", "x": "22ec9685"}, {"t": "learn", "h": "<div class=\"u\">Subsidiary aims for vocabulary: to consolidate lexis for travel and accommodation.</div><div class=\"u\">أهداف فرعية للمفردات: تثبيت مفردات السفر والإقامة.</div>", "n": 1, "i": 20, "a": "tefl-24-018", "x": "ed5d2c6f"}, {"t": "learn", "h": "<div class=\"u\">Subsidiary aims for phonology: to focus on intonation. For speaking: to give controlled practice.</div><div class=\"u\">أهداف فرعية للصوتيات: التركيز على النبر. وللكلام: إعطاء تمرين مضبوط.</div>", "n": 1, "i": 21, "a": "tefl-24-019", "x": "c2b4e3d1"}, {"t": "learn", "h": "<div class=\"u\">Personal aims: to improve my organisation of the whiteboard. To give clearer examples.</div><div class=\"u\">أهداف شخصية: أحسّن تنظيمي للسبورة. أدّي أمثلة أوضح.</div>", "n": 1, "i": 22, "a": "tefl-24-020", "x": "c768c666"}, {"t": "section", "h": "Aims versus procedures | الأهداف مقابل الإجراءات", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">In order to fulfill your lesson objectives, you have to work out a procedure to do so.</div><div class=\"u\">عشان تحقق أهداف درسك، لازم تحط إجراء يحققها.</div>", "n": 1, "i": 24, "a": "tefl-24-021", "x": "d35982e2"}, {"t": "learn", "h": "<div class=\"u\">For example, if your aim is to consolidate vocabulary for travel, the procedure could be: give students a crossword of travel and transport vocabulary.</div><div class=\"u\">مثال: لو هدفك تثبيت مفردات السفر، الإجراء ممكن يكون: ادّي الطلبة كلمات متقاطعة بمفردات السفر والمواصلات.</div>", "n": 1, "i": 25, "a": "tefl-24-022", "x": "5d2b2cbf"}, {"t": "learn", "h": "<div class=\"u\">The aim is the why; the procedure is the how.</div><div class=\"u\">الهدف هو الليه؛ الإجراء هو الإزاي.</div>", "n": 1, "i": 26, "a": "tefl-24-023", "x": "29c840b7"}, {"t": "learn", "h": "<div class=\"u\">The unit's sorting task, solved. One: listen to a dialogue of a conversation at a hotel reception. That is a procedure.</div><div class=\"u\">تمرين التصنيف في الوحدة، محلول. واحد: اسمعوا حوار محادثة في استقبال فندق. ده إجراء.</div>", "n": 1, "i": 27, "a": "tefl-24-024", "x": "1d476f46"}, {"t": "learn", "h": "<div class=\"u\">Two: to become familiar with expressions used when booking accommodation. That is an aim.</div><div class=\"u\">اتنين: إنهم يتعودوا على التعابير المستخدمة في حجز الإقامة. ده هدف.</div>", "n": 1, "i": 28, "a": "tefl-24-025", "x": "48132ea4"}, {"t": "learn", "h": "<div class=\"u\">Three: to give students the opportunity to produce the language learned. That is an aim.</div><div class=\"u\">تلاتة: إنك تدّي الطلبة فرصة ينتجوا اللغة اللي اتعلموها. ده هدف.</div>", "n": 1, "i": 29, "a": "tefl-24-026", "x": "1aa14b30"}, {"t": "learn", "h": "<div class=\"u\">Four: students prepare and present a hotel reception role-play. That is a procedure.</div><div class=\"u\">أربعة: الطلبة بيجهّزوا ويقدّموا لعب أدوار استقبال فندق. ده إجراء.</div>", "n": 1, "i": 30, "a": "tefl-24-027", "x": "537bc0b1"}, {"t": "section", "h": "Stage aims matching | توصيل أهداف المراحل", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">Every stage of a lesson also has its own aim. The unit asks you to match seven teacher instructions with their stage aims.</div><div class=\"u\">كل مرحلة في الدرس كمان ليها هدفها الخاص. الوحدة بتطلب منك توصّل سبع تعليمات للمدرس بأهداف مراحلها.</div>", "n": 1, "i": 32, "a": "tefl-24-028", "x": "c709879a"}, {"t": "learn", "h": "<div class=\"u\">Instruction one: what words can you think of which are connected with the weather? Make a list with your partner. Aim: to encourage learners to recycle known vocabulary items.</div><div class=\"u\">التعليمة الأولى: إيه الكلمات اللي تفتكروها مرتبطة بالطقس؟ اعملوا قايمة مع شريككم. الهدف: تشجيع المتعلمين يعيدوا تدوير مفردات يعرفوها.</div>", "n": 1, "i": 33, "a": "tefl-24-029", "x": "081380a5"}, {"t": "learn", "h": "<div class=\"u\">Instruction two: look at the first line of the dialogue. Will the man's voice go up or down? Aim: to develop learners' awareness of intonation patterns.</div><div class=\"u\">التعليمة التانية: بصوا على أول سطر في الحوار. صوت الراجل هيطلع ولا هينزل؟ الهدف: تطوير وعي المتعلمين بأنماط النبر.</div>", "n": 1, "i": 34, "a": "tefl-24-030", "x": "2d229c09"}, {"t": "learn", "h": "<div class=\"u\">Instruction three: you are going to hear three conversations, then tell me what the people are talking about. Aim: to give learners practice in listening for gist.</div><div class=\"u\">التعليمة التالتة: هتسمعوا تلات محادثات، وبعدين قولولي الناس بتتكلم عن إيه. الهدف: تدريب المتعلمين على الاستماع للفكرة العامة.</div>", "n": 1, "i": 35, "a": "tefl-24-031", "x": "ffe918f9"}, {"t": "learn", "h": "<div class=\"u\">Instruction four: I will play the conversation again. Put the pictures into the correct order. Aim: to develop learners' skill in listening for detail.</div><div class=\"u\">التعليمة الرابعة: هشغّل المحادثة تاني. رتّبوا الصور بالترتيب الصح. الهدف: تطوير مهارة المتعلمين في الاستماع للتفاصيل.</div>", "n": 1, "i": 36, "a": "tefl-24-032", "x": "bd1e07c7"}, {"t": "learn", "h": "<div class=\"u\">Instruction five: practise the dialogue with your partner, using the prompts on the board. Aim: to give learners less controlled oral practice.</div><div class=\"u\">التعليمة الخامسة: تمرّنوا على الحوار مع شريككم، باستخدام المساعدات على السبورة. الهدف: إعطاء المتعلمين تمرين شفوي أقل ضبطًا.</div>", "n": 1, "i": 37, "a": "tefl-24-033", "x": "a45e45a7"}, {"t": "learn", "h": "<div class=\"u\">Instruction six: get together with another pair, listen to their dialogue, and note features of connected speech they could improve. Aim: to provide an opportunity for peer assessment.</div><div class=\"u\">التعليمة الساتة: اجتمعوا مع زوج تاني، اسمعوا حوارهم، وسجّلوا سمات الكلام المتصل اللي يقدروا يحسّنوها. الهدف: توفير فرصة لتقييم الزمايل.</div>", "n": 1, "i": 38, "a": "tefl-24-034", "x": "468a87a2"}, {"t": "learn", "h": "<div class=\"u\">Instruction seven: practise your dialogue again and make any changes you think will improve it. Aim: to provide an opportunity for self-correction.</div><div class=\"u\">التعليمة السابعة: تمرّنوا على حواركم تاني واعملوا أي تعديلات شايفين إنها هتحسّنه. الهدف: توفير فرصة للتصحيح الذاتي.</div>", "n": 1, "i": 39, "a": "tefl-24-035", "x": "6765cde4"}, {"t": "section", "h": "Unit 1 questions | أسئلة الوحدة ١", "n": 1, "i": 40}, {"t": "learn", "h": "<div class=\"u\">Unit 1 questions. Question 1: which of the following is an example of a personal aim? Options: introduce food vocabulary, reduce teacher talking time, practise past simple formation.</div><div class=\"u\">أسئلة الوحدة الأولى. سؤال ١: أنهي دي مثال على هدف شخصي؟ الاختيارات: تقديم مفردات أكل، تقليل وقت كلام المدرس، التمرّن على تكوين الماضي البسيط.</div>", "n": 1, "i": 41, "a": "tefl-24-036", "x": "266eb8a2"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: to reduce teacher talking time. The other two are learning aims.</div><div class=\"u\">الإجابة الصح: تقليل وقت كلام المدرس. الاتنين التانيين أهداف تعلم.</div>", "n": 1, "i": 42, "a": "tefl-24-037", "x": "b596654e"}, {"t": "learn", "h": "<div class=\"u\">Question 2: which of the following is a procedure? Options: gap-fill activity in pairs, to give students controlled practice of the target language.</div><div class=\"u\">سؤال ٢: أنهي دي إجراء؟ الاختيارات: نشاط ملء فراغات في أزواج، إعطاء الطلبة تمرين مضبوط على اللغة المستهدفة.</div>", "n": 1, "i": 43, "a": "tefl-24-038", "x": "b7c297da"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: gap-fill activity in pairs. Giving controlled practice is an aim.</div><div class=\"u\">الإجابة الصح: نشاط ملء الفراغات في أزواج. إعطاء تمرين مضبوط ده هدف.</div>", "n": 1, "i": 44, "a": "tefl-24-039", "x": "a8c24337"}, {"t": "learn", "h": "<div class=\"u\">Question 3: which of the below checks learners' reading comprehension? Options: brainstorm transport vocabulary, role-play the dialogue in pairs, ask concept questions about the text.</div><div class=\"u\">سؤال ٣: أنهي دي بتتحقق من فهم القراية عند المتعلمين؟ الاختيارات: عصف ذهني لمفردات المواصلات، لعب أدوار الحوار في أزواج، أسئلة مفهوم عن النص.</div>", "n": 1, "i": 45, "a": "tefl-24-040", "x": "483b923f"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: ask concept questions about the text.</div><div class=\"u\">الإجابة الصح: أسئلة المفهوم عن النص.</div>", "n": 1, "i": 46, "a": "tefl-24-041", "x": "51758c48"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">Main aim: the primary purpose of the lesson, what learners practise or learn.</div><div class=\"u\">الهدف الرئيسي: الغرض الأساسي من الدرس، إيه اللي المتعلمين بيتمرّنوا عليه أو بيتعلموه.</div>", "n": 1, "i": 48, "a": "tefl-24-042", "x": "0d7c6d4e"}, {"t": "learn", "h": "<div class=\"u\">Subsidiary aim: a secondary learning aim supporting the main aim, like grammar, vocabulary, phonology, or speaking work.</div><div class=\"u\">الهدف الفرعي: هدف تعلم ثانوي بيدعم الهدف الرئيسي، زي شغل القواعد أو المفردات أو الصوتيات أو الكلام.</div>", "n": 1, "i": 49, "a": "tefl-24-043", "x": "16dbcbfe"}, {"t": "learn", "h": "<div class=\"u\">Personal aim: an aim for the teacher's own development, like reducing teacher talking time.</div><div class=\"u\">الهدف الشخصي: هدف لتطوير المدرس نفسه، زي تقليل وقت كلام المدرس.</div>", "n": 1, "i": 50, "a": "tefl-24-044", "x": "98d5784e"}, {"t": "learn", "h": "<div class=\"u\">Procedure: the practical steps and activities that fulfill the aims.</div><div class=\"u\">الإجراء: الخطوات والأنشطة العملية اللي بتحقق الأهداف.</div>", "n": 1, "i": 51, "a": "tefl-24-045", "x": "f28e5c5f"}, {"t": "learn", "h": "<div class=\"u\">Stage aim: the purpose of one individual stage within the lesson.</div><div class=\"u\">هدف المرحلة: غرض مرحلة واحدة فردية جوه الدرس.</div>", "n": 1, "i": 52, "a": "tefl-24-046", "x": "77b88623"}, {"t": "learn", "h": "<div class=\"u\">Listening for gist: listening to understand the general idea, not the details.</div><div class=\"u\">الاستماع للفكرة العامة: تسمع عشان تفهم الفكرة العامة، مش التفاصيل.</div>", "n": 1, "i": 53, "a": "tefl-24-047", "x": "1c337964"}, {"t": "learn", "h": "<div class=\"u\">Listening for detail: listening to catch specific information.</div><div class=\"u\">الاستماع للتفاصيل: تسمع عشان تلتقط معلومات محددة.</div>", "n": 1, "i": 54, "a": "tefl-24-048", "x": "2206c591"}, {"t": "learn", "h": "<div class=\"u\">Peer assessment: learners evaluating each other's work.</div><div class=\"u\">تقييم الزمايل: المتعلمين بيقيّموا شغل بعض.</div>", "n": 1, "i": 55, "a": "tefl-24-049", "x": "93521494"}, {"t": "learn", "h": "<div class=\"u\">Self-correction: learners finding and fixing their own errors.</div><div class=\"u\">التصحيح الذاتي: المتعلمين بيلاقوا وبيصلّحوا أخطاءهم بنفسهم.</div>", "n": 1, "i": 56, "a": "tefl-24-050", "x": "67de35cc"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 57}, {"t": "learn", "h": "<div class=\"u\">Every lesson needs an aim: a purpose or end goal, from grammar points to real-life skills like booking a hotel.</div><div class=\"u\">كل درس محتاج هدف: غرض أو غاية نهائية، من نقاط القواعد لمهارات الحياة الحقيقية زي حجز فندق.</div>", "n": 1, "i": 58, "a": "tefl-24-051", "x": "60e04f8e"}, {"t": "learn", "h": "<div class=\"u\">Aims come in three types: main, subsidiary, and personal; personal aims develop the teacher, not the learners.</div><div class=\"u\">الأهداف تلات أنواع: رئيسي وفرعي وشخصي؛ الأهداف الشخصية بتطوّر المدرس مش المتعلمين.</div>", "n": 1, "i": 59, "a": "tefl-24-052", "x": "477938c4"}, {"t": "learn", "h": "<div class=\"u\">Aims are the why, procedures are the how: name the aim, then choose activities that fulfill it.</div><div class=\"u\">الأهداف هي الليه، والإجراءات هي الإزاي: حدّد الهدف، وبعدين اختار أنشطة بتحققه.</div>", "n": 1, "i": 60, "a": "tefl-24-053", "x": "5f3d2057"}, {"t": "learn", "h": "<div class=\"u\">Every stage inside the lesson has its own aim too, from recycling vocabulary to peer assessment.</div><div class=\"u\">كل مرحلة جوه الدرس ليها هدفها الخاص كمان، من إعادة تدوير المفردات لتقييم الزمايل.</div>", "n": 1, "i": 61, "a": "tefl-24-054", "x": "015d38e7"}, {"t": "learn", "h": "<div class=\"u\">Much of this module matches part of the Teacher Knowledge Test, the TKT.</div><div class=\"u\">جزء كبير من الموديول ده بيقابل جزء من اختبار معرفة المدرس، الـTKT.</div>", "n": 1, "i": 62, "a": "tefl-24-055", "x": "6f37b00b"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 63}, {"t": "mc", "q": "Which is an example of a personal aim?<br>أنهي دي مثال على هدف شخصي؟", "opts": ["to reduce teacher talking time | تقليل وقت كلام المدرس", "to introduce new food vocabulary | تقديم مفردات أكل جديدة", "to practise the past simple | التمرّن على الماضي البسيط"], "ans": 0, "why": "Personal aims develop the teacher; the other two are learner aims. | الأهداف الشخصية بتطوّر المدرس؛ الاتنين التانيين أهداف للمتعلمين.", "ex": ["Correct. | صح.", "No. That is a learning aim for students. | غلط: ده هدف تعلم للطلبة.", "No. Practising a tense is a learner aim. | غلط: التمرّن على زمن هدف متعلمين."], "n": 1, "i": 64, "h": ""}, {"t": "mc", "q": "Which is a procedure?<br>أنهي دي إجراء؟", "opts": ["a gap-fill activity in pairs | نشاط ملء فراغات في أزواج", "to give students controlled practice | إعطاء الطلبة تمرين مضبوط", "to consolidate travel lexis | تثبيت مفردات السفر"], "ans": 0, "why": "A procedure is the activity you run; to + verb phrases are aims. | الإجراء هو النشاط اللي بتعمله؛ صيغ to زائد الفعل أهداف.", "ex": ["Correct. | صح.", "No. Giving controlled practice is an aim. | غلط: إعطاء تمرين مضبوط هدف.", "No. Consolidating lexis is an aim. | غلط: تثبيت المفردات هدف."], "n": 1, "i": 65, "h": ""}, {"t": "mc", "q": "Which checks learners' reading comprehension?<br>أنهي دي بتتحقق من فهم القراية؟", "opts": ["asking concept questions about the text | أسئلة مفهوم عن النص", "brainstorming transport vocabulary | عصف ذهني لمفردات المواصلات", "role-playing the dialogue in pairs | لعب أدوار الحوار في أزواج"], "ans": 0, "why": "Concept questions about the text reveal understanding; the others do not check reading. | أسئلة المفهوم عن النص بتكشف الفهم؛ الباقي مابيتحققش من القراية.", "ex": ["Correct. | صح.", "No. Brainstorming recycles vocabulary. | غلط: العصف الذهني بيعيد تدوير المفردات.", "No. Role-play practises speaking. | غلط: لعب الأدوار بيتمرّن على الكلام."], "n": 1, "i": 66, "h": ""}, {"t": "mc", "q": "Hear three conversations, then say what the people are talking about. The stage aim is:<br>اسمعوا تلات محادثات وبعدين قولوا الناس بتتكلم عن إيه. هدف المرحلة هو:", "opts": ["listening for gist | الاستماع للفكرة العامة", "listening for detail | الاستماع للتفاصيل", "peer assessment | تقييم الزمايل"], "ans": 0, "why": "What are they talking about asks for the general idea, which is gist. | بتتكلم عن إيه سؤال عن الفكرة العامة، يعني gist.", "ex": ["Correct. | صح.", "No. Detail listening catches specific information, like ordering pictures. | غلط: الاستماع للتفاصيل بيلتقط معلومات محددة، زي ترتيب الصور.", "No. Peer assessment means learners evaluate each other. | غلط: تقييم الزمايل يعني المتعلمين بيقيّموا بعض."], "n": 1, "i": 67, "h": ""}, {"t": "mc", "q": "Put the pictures into the correct order while listening again. The stage aim is:<br>رتّبوا الصور بالترتيب الصح أثناء الاستماع تاني. هدف المرحلة هو:", "opts": ["listening for detail | الاستماع للتفاصيل", "listening for gist | الاستماع للفكرة العامة", "self-correction | التصحيح الذاتي"], "ans": 0, "why": "Ordering pictures from a second listen targets specific information. | ترتيب الصور من سماع تاني بيستهدف معلومات محددة.", "ex": ["Correct. | صح.", "No. Gist is the general idea from the first listen. | غلط: الـgist هو الفكرة العامة من أول سماع.", "No. Self-correction is fixing your own work. | غلط: التصحيح الذاتي هو تصليح شغلك بنفسك."], "n": 1, "i": 68, "h": ""}, {"t": "tf", "q": "Lesson aims are always direct learning objectives for the students.<br>أهداف الدرس دايمًا أهداف تعلم مباشرة للطلبة.", "ans": false, "why": "False. Aims can also be for the teacher, like limiting teacher talking time, or focused on one student keeping up. | غلط. الأهداف ممكن تكون للمدرس كمان، زي تقليل وقت كلام المدرس، أو مركزة على طالب واحد عشان يفضل ماشي مع الفصل.", "ex": ["Wrong. Teacher-focused personal aims exist too. | غلط: في أهداف شخصية مركزة على المدرس كمان.", "Correct. | صح."], "n": 1, "i": 69, "h": ""}, {"t": "mc", "q": "In the TKT example, what is the main aim?<br>في مثال TKT، إيه الهدف الرئيسي؟", "opts": ["to practise making polite requests for holiday arrangements | التمرّن على عمل طلبات مهذبة لترتيبات الأجازات", "to revise modal auxiliary verbs | مراجعة الأفعال الناقصة", "to improve whiteboard organisation | تحسين تنظيم السبورة"], "ans": 0, "why": "Revising modals is a subsidiary aim; the whiteboard aim is personal. | مراجعة الأفعال الناقصة هدف فرعي؛ هدف السبورة شخصي.", "ex": ["Correct. | صح.", "No. That is a subsidiary grammar aim. | غلط: ده هدف فرعي للقواعد.", "No. That is a personal aim. | غلط: ده هدف شخصي."], "n": 1, "i": 70, "h": ""}, {"t": "mc", "q": "Pairs listen to another pair's dialogue and note connected speech to improve. The stage aim is:<br>أزواج بيسمعوا حوار زوج تاني وبيسجّلوا كلام متصل يتحسّن. هدف المرحلة هو:", "opts": ["peer assessment | تقييم الزمايل", "self-correction | التصحيح الذاتي", "recycling vocabulary | إعادة تدوير المفردات"], "ans": 0, "why": "Learners are evaluating another pair's work, which is peer assessment. | المتعلمين بيقيّموا شغل زوج تاني، وده تقييم زمايل.", "ex": ["Correct. | صح.", "No. Self-correction is fixing your own dialogue. | غلط: التصحيح الذاتي هو تصليح حوارك انت.", "No. Recycling vocabulary is reusing known words. | غلط: إعادة التدوير هي استخدام كلمات معروفة تاني."], "n": 1, "i": 71, "h": ""}, {"t": "tf", "q": "Identifying the aim of every lesson naturally leads you to the best materials for it.<br>تحديد هدف كل درس بيوصّلك طبيعي لأحسن خامات ليه.", "ans": true, "why": "True. That is one of the two benefits named: focus on delivery plus the right materials. | صح. دي واحدة من الفايدتين المذكورتين: التركيز على التقديم زائد الخامات الصح.", "ex": ["Correct. | صح.", "Wrong. The unit names this as a benefit of identifying aims. | غلط: الوحدة بتذكر ده كفايدة لتحديد الأهداف."], "n": 1, "i": 72, "h": ""}, {"t": "recall", "q": "Name the three types of aims in the TKT table, with one example of each.<br>اذكر أنواع الأهداف التلاتة في جدول TKT، مع مثال لكل واحد.", "a": "Main aim: practise polite requests for holiday arrangements. Subsidiary aim: revise modal auxiliary verbs. Personal aim: improve whiteboard organisation.<br>الهدف الرئيسي: التمرّن على الطلبات المهذبة لترتيبات الأجازات. الهدف الفرعي: مراجعة الأفعال الناقصة. الهدف الشخصي: تحسين تنظيم السبورة.", "n": 1, "i": 73, "h": ""}, {"t": "recall", "q": "What is the difference between an aim and a procedure? Give one example of each.<br>إيه الفرق بين الهدف والإجراء؟ ادي مثال لكل واحد.", "a": "An aim is the why, like consolidating travel vocabulary; a procedure is the how, like giving students a travel crossword.<br>الهدف هو الليه، زي تثبيت مفردات السفر؛ الإجراء هو الإزاي، زي إنك تدّي الطلبة كلمات متقاطعة عن السفر.", "n": 1, "i": 74, "h": ""}, {"t": "write", "q": "Explain why every lesson needs an aim, and give two examples of possible aims (3-4 sentences).<br>اشرح ليه كل درس محتاج هدف، وادي مثالين لأهداف ممكنة (٣-٤ جمل).", "key": "tefl-24:1", "a": "Without a purpose or end goal, a lesson has no direction, so every lesson needs an aim. Naming the aim helps the teacher concentrate on delivering a successful lesson. It also leads naturally to the materials that will fulfill it best. Aims can be learning goals like developing listening skills, or real-life goals like practising language for booking a hotel, or even personal goals like reducing teacher talking time.<br>من غير غرض أو غاية نهائية، الدرس مالوش اتجاه، فكل درس محتاج هدف. تسمية الهدف بتساعد المدرس يركّز على تقديم درس ناجح. وكمان بتوصّل طبيعي للخامات اللي هتحققه أحسن. الأهداف ممكن تكون أهداف تعلم زي تطوير مهارات الاستماع، أو أهداف حياة حقيقية زي التمرّن على لغة حجز فندق، أو حتى أهداف شخصية زي تقليل وقت كلام المدرس.", "n": 1, "i": 75, "h": ""}, {"t": "write", "q": "Describe how stage aims work inside one lesson, with two examples (3-4 sentences).<br>اشرح إزاي أهداف المراحل بتشتغل جوه درس واحد، بمثالين (٣-٤ جمل).", "key": "tefl-24:2", "a": "Each stage of a lesson has its own small aim that serves the lesson's main aim. For example, asking students to list weather words with a partner aims to recycle known vocabulary. Playing three conversations and asking what people are talking about aims at listening for gist. Replaying the conversation to order pictures then shifts to listening for detail. Knowing each stage's aim keeps the whole lesson coherent.<br>كل مرحلة في الدرس ليها هدفها الصغير الخاص اللي بيخدم الهدف الرئيسي للدرس. مثال، سؤال الطلبة يعملوا قايمة كلمات طقس مع شريك هدفها إعادة تدوير مفردات معروفة. تشغيل تلات محادثات وسؤال الناس بتتكلم عن إيه بيستهدف الاستماع للفكرة العامة. إعادة تشغيل المحادثة عشان ترتيب الصور بينقل للاستماع للتفاصيل. معرفة هدف كل مرحلة بتخلّي الدرس كله مترابط.", "n": 1, "i": 76, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 2, the components of a lesson plan, what goes inside the plan itself.</div><div class=\"u\">الدرس الجاي: الوحدة التانية، مكونات خطة الدرس، إيه اللي بيدخل جوه الخطة نفسها.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 77}];</script>
