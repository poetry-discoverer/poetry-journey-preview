<script>window.LESSON_ID="tefl-12";window.STEPS=[{"t": "section", "h": "Pre-intermediate: modal verbs | قبل المتوسط: الأفعال الناقصة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">At pre-intermediate level we often introduce modal verbs of permission and obligation, like can, must, and may.</div><div class=\"u\">في المستوى قبل المتوسط بنقدّم غالبًا الأفعال الناقصة بتاعة الإذن والوجوب، زي can وmust وmay.</div>", "n": 1, "i": 1, "a": "tefl-12-001", "x": "99cc01f2"}, {"t": "learn", "h": "<div class=\"u\">A modal verb is always followed by another verb, and it tells us the function of that main verb. You can run is very different in meaning from You must run.</div><div class=\"u\">الفعل الناقص بييجي وراه دايمًا فعل تاني، وبيقولنا وظيفة الفعل الأساسي. You can run مختلفة تمامًا في المعنى عن You must run.</div>", "n": 1, "i": 2, "a": "tefl-12-002", "x": "ebaec156"}, {"t": "learn", "h": "<div class=\"u\">Many pre-intermediate students have heard these verbs before but are not sure of their meaning, especially the negatives.</div><div class=\"u\">طلاب كتير قبل المتوسط سمعوا الأفعال دي قبل كده بس مش متأكدين من معناها، خصوصًا صيغ النفي.</div>", "n": 1, "i": 3, "a": "tefl-12-003", "x": "a89bf0ba"}, {"t": "learn", "h": "<div class=\"u\">That is because the negatives are not always the exact opposite. Must not is not the opposite of must in the way you might expect, and don't have to is different again.</div><div class=\"u\">لأن النفي مش دايمًا العكس بالظبط. must not مش عكس must زي ما ممكن تتوقع، وdon't have to مختلفة كمان.</div>", "n": 1, "i": 4, "a": "tefl-12-004", "x": "3b2d4569"}, {"t": "learn", "h": "<div class=\"u\">A good lesson idea: write the title School Rules on the board and elicit as many rules as possible from the students.</div><div class=\"u\">فكرة درس كويسة: اكتب عنوان School Rules على السبورة واستخرج من الطلاب أكبر عدد من القواعد.</div>", "n": 1, "i": 5, "a": "tefl-12-005", "x": "5b026b8b"}, {"t": "learn", "h": "<div class=\"u\">For example: You must switch off mobile phones in class, and You have to wear a school uniform.</div><div class=\"u\">مثال: You must switch off mobile phones in class، وYou have to wear a school uniform.</div>", "n": 1, "i": 6, "a": "tefl-12-006", "x": "05293291"}, {"t": "learn", "h": "<div class=\"u\">Go back through the rules and highlight all the modals. If any are missing, elicit them hangman-style: write the first letter and dashes, like m_ _ _.</div><div class=\"u\">ارجع للقواعد وعلّم على كل الأفعال الناقصة. لو فيه ناقص، استخرجه بطريقة الرجل المشنوق: اكتب أول حرف وشرطات، زي m_ _ _.</div>", "n": 1, "i": 7, "a": "tefl-12-007", "x": "63539cac"}, {"t": "learn", "h": "<div class=\"u\">Then students match each modal, positive and negative, with a definition: must and have to mean it is obligatory; may and can mean it is possible; should means it is advisable.</div><div class=\"u\">بعدين الطلاب بيوصلوا كل فعل ناقص، مثبت ومنفي، بتعريفه: must وhave to يعني واجب؛ may وcan يعني ممكن؛ should يعني مستحسن.</div>", "n": 1, "i": 8, "a": "tefl-12-008", "x": "93fab396"}, {"t": "learn", "h": "<div class=\"u\">And the negatives: must not and cannot mean it is forbidden; don't have to means it is not necessary; shouldn't means it is inadvisable.</div><div class=\"u\">والنفي: must not وcannot يعني ممنوع؛ don't have to يعني مش ضروري؛ shouldn't يعني غير مستحسن.</div>", "n": 1, "i": 9, "a": "tefl-12-009", "x": "ad3e8fe3"}, {"t": "learn", "h": "<div class=\"u\">Highlight the key point: should and shouldn't are exact opposites. But have to means obligation, while don't have to means possible but not necessary, NOT forbidden.</div><div class=\"u\">وضّح النقطة المهمة: should وshouldn't عكس بعض بالظبط. لكن have to يعني وجوب، وdon't have to يعني مسموح بس مش ضروري، مش ممنوع.</div>", "n": 1, "i": 10, "a": "tefl-12-010", "x": "529212ed"}, {"t": "learn", "h": "<div class=\"u\">Finally, students imagine their ideal school and write their own rules using the modals, then combine ideas from each group into one agreed set.</div><div class=\"u\">في الآخر، الطلاب بيتخيلوا مدرستهم المثالية ويكتبوا قواعدهم باستخدام الأفعال الناقصة، وبعدين يجمعوا أفكار كل مجموعة في مجموعة واحدة متفق عليها.</div>", "n": 1, "i": 11, "a": "tefl-12-011", "x": "700c70f8"}, {"t": "section", "h": "Intermediate: relative clauses | المتوسط: جمل الصلة", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">At intermediate level, a key topic is relative clauses. They give additional information about something without starting a new sentence.</div><div class=\"u\">في المستوى المتوسط، موضوع مهم هو جمل الصلة. بتديني معلومات إضافية عن حاجة من غير ما نبدأ جملة جديدة.</div>", "n": 1, "i": 13, "a": "tefl-12-012", "x": "10bf8b06"}, {"t": "learn", "h": "<div class=\"u\">Without them, speech sounds heavy. Look: Mark is talking to a girl. Do you know the girl? Two short sentences, and the word girl is repeated.</div><div class=\"u\">من غيرها، الكلام بيبقى تقيل. بص: Mark is talking to a girl. Do you know the girl? جملتين قصيرين وكلمة girl متكررة.</div>", "n": 1, "i": 14, "a": "tefl-12-013", "x": "9ddc8027"}, {"t": "learn", "h": "<div class=\"u\">With the relative pronoun who, we join them: Do you know the girl who Mark is talking to? Natural, and no repetition.</div><div class=\"u\">بضمير الصلة who، بنوصلهم: Do you know the girl who Mark is talking to? طبيعي ومن غير تكرار.</div>", "n": 1, "i": 15, "a": "tefl-12-014", "x": "6729dba0"}, {"t": "learn", "h": "<div class=\"u\">There are five relative pronouns: who, which, whom, that, whose. And three relative adverbs: where, when, why.</div><div class=\"u\">فيه ٥ ضمائر صلة: who وwhich وwhom وthat وwhose. و٣ ظروف صلة: where وwhen وwhy.</div>", "n": 1, "i": 16, "a": "tefl-12-015", "x": "97766ca4"}, {"t": "learn", "h": "<div class=\"u\">At intermediate level, focus on who, which, that, where, and when. Whom, whose, and why can wait for higher levels.</div><div class=\"u\">في المتوسط، ركز على who وwhich وthat وwhere وwhen. أما whom وwhose وwhy ممكن تستنى للمستويات الأعلى.</div>", "n": 1, "i": 17, "a": "tefl-12-016", "x": "e6b752de"}, {"t": "learn", "h": "<div class=\"u\">A typical exercise: students link two sentences with the right pronoun. That is the girl. I invited her to the cinema. Answer: who or that.</div><div class=\"u\">تدريب نموذجي: الطلاب بيوصلوا جملتين بالضمير الصح. That is the girl. I invited her to the cinema. الإجابة: who أو that.</div>", "n": 1, "i": 18, "a": "tefl-12-017", "x": "c4ed60ea"}, {"t": "learn", "h": "<div class=\"u\">Another: A dog is an animal. It is related to the wolf. Answer: which or that. And: That is the house. My grandparents used to live there. Answer: where.</div><div class=\"u\">واحد تاني: A dog is an animal. It is related to the wolf. الإجابة: which أو that. وكمان: That is the house. My grandparents used to live there. الإجابة: where.</div>", "n": 1, "i": 19, "a": "tefl-12-018", "x": "17aa6ec1"}, {"t": "learn", "h": "<div class=\"u\">In defining relative clauses, that can replace who or which informally. The boy who we met yesterday is very nice. We can say: The boy that we met yesterday.</div><div class=\"u\">في جمل الصلة المحددة، that ممكن تحل محل who أو which بشكل غير رسمي. The boy who we met yesterday is very nice. نقدر نقول: The boy that we met yesterday.</div>", "n": 1, "i": 20, "a": "tefl-12-019", "x": "b86c320b"}, {"t": "learn", "h": "<div class=\"u\">But not here: The boy, who we met yesterday, is very nice. The commas make it non-defining: we already know which boy, so the clause just adds extra information. No that here.</div><div class=\"u\">لكن مش هنا: The boy, who we met yesterday, is very nice. الفواصل بتخليها غير محددة: إحنا عارفين أصلًا أنهي ولد، فالجملة بس بتضيف معلومة زيادة. مفيش that هنا.</div>", "n": 1, "i": 21, "a": "tefl-12-020", "x": "b58283eb"}, {"t": "learn", "h": "<div class=\"u\">Practice: Mrs Smith, who is very nosy, lives next door. Can we use that? No, non-defining. The shoes which I bought yesterday are not comfortable. Yes, we can.</div><div class=\"u\">تدريب: Mrs Smith, who is very nosy, lives next door. نقدر نستخدم that? لأ، غير محددة. The shoes which I bought yesterday are not comfortable. أيوه نقدر.</div>", "n": 1, "i": 22, "a": "tefl-12-021", "x": "f2dbea51"}, {"t": "learn", "h": "<div class=\"u\">More: The church, which we visited on holiday, is very old. Can we use that? No. He is the man whose car was stolen. No, whose cannot become that.</div><div class=\"u\">كمان: The church, which we visited on holiday, is very old. نقدر نستخدم that? لأ. He is the man whose car was stolen. لأ، whose ماتتحولش that.</div>", "n": 1, "i": 23, "a": "tefl-12-022", "x": "e76101c8"}, {"t": "learn", "h": "<div class=\"u\">Last one: Did you see the bird which landed on the roof? Yes, that works here.</div><div class=\"u\">أخر واحد: Did you see the bird which landed on the roof? أيوه، that شغالة هنا.</div>", "n": 1, "i": 24, "a": "tefl-12-023", "x": "aef606c1"}, {"t": "section", "h": "Upper-intermediate: gerund or infinitive | فوق المتوسط: مصدر bـ-ing أو to", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">At upper-intermediate level, students write and speak comfortably but still make small mistakes, especially with verb patterns.</div><div class=\"u\">في المستوى فوق المتوسط، الطلاب بيكتبوا ويتكلموا براحة بس لسه بيعملوا أخطاء صغيرة، خصوصًا في أنماط الأفعال.</div>", "n": 1, "i": 26, "a": "tefl-12-024", "x": "e86f130c"}, {"t": "learn", "h": "<div class=\"u\">An important feature of any upper-intermediate course is the difference between gerunds and infinitives.</div><div class=\"u\">ميزة مهمة في أي كورس فوق متوسط هي الفرق بين المصدر بـ-ing والمصدر بـto.</div>", "n": 1, "i": 27, "a": "tefl-12-025", "x": "c629dd05"}, {"t": "learn", "h": "<div class=\"u\">When a sentence has more than one verb, the first verb decides the form of the second.</div><div class=\"u\">لما الجملة فيها أكتر من فعل، الفعل الأول هو اللي بيحدد شكل التاني.</div>", "n": 1, "i": 28, "a": "tefl-12-026", "x": "4b250c4d"}, {"t": "learn", "h": "<div class=\"u\">Native speakers do this automatically. You would feel instinctively that I enjoy listen music is wrong. Enjoy is always followed by the gerund: I enjoy listening to music.</div><div class=\"u\">المتحدثين الأصليين بيعملوا ده تلقائيًا. انت هتحس فطريًا إن I enjoy listen music غلط. enjoy دايمًا بييجي وراها المصدر بـ-ing: I enjoy listening to music.</div>", "n": 1, "i": 29, "a": "tefl-12-027", "x": "37e1b4ed"}, {"t": "learn", "h": "<div class=\"u\">Likewise, I've decided going to university sounds wrong. Decide takes the infinitive with to: I've decided to go to university.</div><div class=\"u\">نفس الشيء، I've decided going to university بتبان غلط. decide بياخد المصدر بـto: I've decided to go to university.</div>", "n": 1, "i": 30, "a": "tefl-12-028", "x": "92bde5f7"}, {"t": "learn", "h": "<div class=\"u\">A good way to introduce this: give students sentences and let them use their instinct to tick the correct form.</div><div class=\"u\">طريقة كويسة لتقديم ده: ادّي الطلاب جمل وخليهم يستخدموا إحساسهم ويختاروا الشكل الصح.</div>", "n": 1, "i": 31, "a": "tefl-12-029", "x": "00939180"}, {"t": "learn", "h": "<div class=\"u\">At this level they have seen a lot of English, and it feels good to know their subconscious has absorbed it.</div><div class=\"u\">في المستوى ده شافوا إنجليزية كتير، وهيفرحوا إن عقلهم الباطن امتص المعلومة.</div>", "n": 1, "i": 32, "a": "tefl-12-030", "x": "219371a2"}, {"t": "learn", "h": "<div class=\"u\">Try it: I play dance music when I'm sad and want ___ better. Answer: to feel. I can't stand ___. Answer: queuing. I can't ___ tonight, I have to study. Answer: come out.</div><div class=\"u\">جرب: I play dance music when I'm sad and want ___ better. الإجابة: to feel. I can't stand ___. الإجابة: queuing. I can't ___ tonight, I have to study. الإجابة: come out.</div>", "n": 1, "i": 33, "a": "tefl-12-031", "x": "29606c6c"}, {"t": "learn", "h": "<div class=\"u\">So: some verbs take the gerund, some take the infinitive with to, and some take the infinitive without to.</div><div class=\"u\">يبقى: بعض الأفعال بتاخد المصدر بـ-ing، وبعضها المصدر بـto، وبعضها المصدر من غير to.</div>", "n": 1, "i": 34, "a": "tefl-12-032", "x": "8d107294"}, {"t": "learn", "h": "<div class=\"u\">There are no set rules for which verb takes which, except one: modal verbs are always followed by the infinitive without to. For the rest: memorise and practise, practise, practise.</div><div class=\"u\">مفيش قواعد ثابتة تحدد مين ياخد إيه، مع قاعدة واحدة: الأفعال الناقصة دايمًا بييجي وراها المصدر من غير to. الباقي: احفظ وتدرّب وتدرّب وتدرّب.</div>", "n": 1, "i": 35, "a": "tefl-12-033", "x": "ecf615aa"}, {"t": "section", "h": "Advanced: active and passive | المتقدم: المبني للمعلوم والمجهول", "n": 1, "i": 36}, {"t": "learn", "h": "<div class=\"u\">At advanced level, one example topic is active and passive sentences.</div><div class=\"u\">في المستوى المتقدم، مثال على المواضيع هو الجمل المبنية للمعلوم والمبنية للمجهول.</div>", "n": 1, "i": 37, "a": "tefl-12-034", "x": "dd997a14"}, {"t": "learn", "h": "<div class=\"u\">An active sentence follows the usual formula: subject plus verb plus object. He built the stadium in 1998.</div><div class=\"u\">الجملة المبنية للمعلوم بتتبع الصيغة العادية: فاعل زائد فعل زائد مفعول. He built the stadium in 1998.</div>", "n": 1, "i": 38, "a": "tefl-12-035", "x": "ae773e7e"}, {"t": "learn", "h": "<div class=\"u\">A passive sentence inverts this order and puts the object first: The stadium was built by him in 1998.</div><div class=\"u\">الجملة المبنية للمجهول بتقلب الترتيب وتحط المفعول في الأول: The stadium was built by him in 1998.</div>", "n": 1, "i": 39, "a": "tefl-12-036", "x": "393fa1a0"}, {"t": "learn", "h": "<div class=\"u\">We use the passive to emphasise the object rather than the subject, or when the subject is unknown or unimportant.</div><div class=\"u\">بنستخدم المبني للمجهول عشان نركز على المفعول مش الفاعل، أو لما الفاعل يكون مجهول أو مش مهم.</div>", "n": 1, "i": 40, "a": "tefl-12-037", "x": "abab4e67"}, {"t": "learn", "h": "<div class=\"u\">In a passive sentence, the doer is called the agent, and mentioning the agent is optional: The stadium was built in 1998 works fine without by him.</div><div class=\"u\">في الجملة المبنية للمجهول، الفاعل الحقيقي اسمه agent يعني العامل، وذكره اختياري: The stadium was built in 1998 شغالة من غير by him.</div>", "n": 1, "i": 41, "a": "tefl-12-038", "x": "d7205d78"}, {"t": "learn", "h": "<div class=\"u\">To form the passive: use the verb be in the same tense as the active verb, plus the past participle.</div><div class=\"u\">عشان تعمل المبني للمجهول: استخدم فعل be في نفس زمن الفعل الأصلي، زائد التصريف التالت.</div>", "n": 1, "i": 42, "a": "tefl-12-039", "x": "42a50f2d"}, {"t": "learn", "h": "<div class=\"u\">In our example, built is past simple of build. So be changes to the past simple was: The stadium was built.</div><div class=\"u\">في مثالنا، built هي الماضي البسيط من build. فـbe بتتغير للماضي البسيط was: The stadium was built.</div>", "n": 1, "i": 43, "a": "tefl-12-040", "x": "e1a6e5a7"}, {"t": "learn", "h": "<div class=\"u\">To practise, give students active sentences to rewrite in the passive. Example: Somebody has stolen my wallet becomes My wallet has been stolen.</div><div class=\"u\">للتدريب، ادّي الطلاب جمل مبنية للمعلوم يعيدوا كتابتها مبنية للمجهول. مثال: Somebody has stolen my wallet بتبقى My wallet has been stolen.</div>", "n": 1, "i": 44, "a": "tefl-12-041", "x": "c24bf945"}, {"t": "section", "h": "Mixed practice: the Reuters text | تدريب مختلط: نص رويترز", "n": 1, "i": 45}, {"t": "learn", "h": "<div class=\"u\">Students may form passives well in a controlled exercise, but still mix active and passive in their free writing.</div><div class=\"u\">الطلاب ممكن يعملوا المبني للمجهول كويس في تدريب محكوم، بس لسه يلخبطوا بين المعلوم والمجهول في كتابتهم الحرة.</div>", "n": 1, "i": 46, "a": "tefl-12-042", "x": "00149126"}, {"t": "learn", "h": "<div class=\"u\">A useful technique: take a text with active and passive sentences, erase all the verb forms, and students fill the gaps with the correct active or passive form.</div><div class=\"u\">تقنية مفيدة: خد نص فيه جمل معلوم ومجهول، امسح كل صيغ الأفعال، والطلاب يملوا الفراغات بالصيغة الصح، معلوم أو مجهول.</div>", "n": 1, "i": 47, "a": "tefl-12-043", "x": "d804fc43"}, {"t": "learn", "h": "<div class=\"u\">Here is a full example text about the Reuters news agency. Martin Webb ___ for Reuters for ten years. The verb is work, and the answer is has worked.</div><div class=\"u\">دي نص كامل مثال عن وكالة رويترز للأخبار. Martin Webb ___ for Reuters for ten years. الفعل work، والإجابة has worked.</div>", "n": 1, "i": 48, "a": "tefl-12-044", "x": "b143aa08"}, {"t": "learn", "h": "<div class=\"u\">He says: Reuters is one of the world's biggest news agencies. It ___ news and stock market prices to media and financial institutions. Supply becomes supplies.</div><div class=\"u\">بيقول: رويترز واحدة من أكبر وكالات الأنباء في العالم. هي ___ الأخبار وأسعار البورصة للمؤسسات الإعلامية والمالية. supply بتبقى supplies.</div>", "n": 1, "i": 49, "a": "tefl-12-045", "x": "c7c51a52"}, {"t": "learn", "h": "<div class=\"u\">It ___ by Paul Reuter in 1849, with pigeons. Start becomes was started: passive, because the agency receives the action.</div><div class=\"u\">هي ___ على إيد Paul Reuter سنة 1849، بالحمام الزاجل. start بتبقى was started: مبني للمجهول، لأن الوكالة مستقبلة للفعل.</div>", "n": 1, "i": 50, "a": "tefl-12-046", "x": "671f1179"}, {"t": "learn", "h": "<div class=\"u\">Reuter ___ born in 1816 in Germany. Be becomes was. During the 1840s he ___ as a bank clerk in Berlin. Employ becomes was employed.</div><div class=\"u\">Reuter اتولد سنة 1816 في ألمانيا. be بتبقى was. في الأربعينات هو ___ كموظف بنك في برلين. employ بتبقى was employed.</div>", "n": 1, "i": 51, "a": "tefl-12-047", "x": "7c447e49"}, {"t": "learn", "h": "<div class=\"u\">German bankers ___ to know the prices on the Paris stock exchange. Need becomes needed. But the French telegraph only reached Belgium.</div><div class=\"u\">البنكيين الألمان ___ يعرفوا أسعار بورصة باريس. need بتبقى needed. بس التلغراف الفرنسي كان بيوصل بلجيكا بس.</div>", "n": 1, "i": 52, "a": "tefl-12-048", "x": "11641b6f"}, {"t": "learn", "h": "<div class=\"u\">From there, the information ___ to Germany by train. Send becomes was sent. The journey ___ nine hours. Take becomes took.</div><div class=\"u\">ومن هناك، المعلومات ___ لألمانيا بالقطار. send بتبقى was sent. الرحلة ___ تسع ساعات. take بتبقى took.</div>", "n": 1, "i": 53, "a": "tefl-12-049", "x": "b6e4e297"}, {"t": "learn", "h": "<div class=\"u\">The same information ___ by Paul Reuter's pigeons in only two hours. Carry becomes was carried.</div><div class=\"u\">نفس المعلومات ___ بحمام Paul Reuter في ساعتين بس. carry بتبقى was carried.</div>", "n": 1, "i": 54, "a": "tefl-12-050", "x": "3c0c119c"}, {"t": "learn", "h": "<div class=\"u\">Reuters ___ a lot since those days. Change becomes has changed. Over the past fifty years, we ___ offices in many countries. Open becomes have opened.</div><div class=\"u\">رويترز ___ كتير من الأيام دي. change بتبقى has changed. في الخمسين سنة اللي فاتت، إحنا ___ مكاتب في دول كتير. open بتبقى have opened.</div>", "n": 1, "i": 55, "a": "tefl-12-051", "x": "afc6edf5"}, {"t": "learn", "h": "<div class=\"u\">And we ___ still ___. Expand becomes are still expanding. Now, news and prices ___ all over the world within seconds. Send becomes are sent.</div><div class=\"u\">وإحنا ___ لسه ___. expand بتبقى are still expanding. دلوقتي، الأخبار والأسعار ___ لكل أنحاء العالم في ثواني. send بتبقى are sent.</div>", "n": 1, "i": 56, "a": "tefl-12-052", "x": "a3093d27"}, {"t": "learn", "h": "<div class=\"u\">The important thing to remember: it is not just what grammar you teach, but how you teach it appropriately at each level.</div><div class=\"u\">المهم تفتكره: مش بس أنهي قواعد بتدرّسها، لكن إزاي بتدرّسها بشكل مناسب لكل مستوى.</div>", "n": 1, "i": 57, "a": "tefl-12-053", "x": "c79ab15a"}, {"t": "section", "h": "Unit 1 review questions | أسئلة مراجعة الوحدة الأولى", "n": 1, "i": 58}, {"t": "learn", "h": "<div class=\"u\">Let us review the unit's own check questions. First: which would you NOT teach at elementary level? Verb be, present continuous, like plus -ing, or relative clauses?</div><div class=\"u\">خلينا نراجع أسئلة الوحدة نفسها. أولًا: إيه اللي مينفعش تدرّسه في المستوى الابتدائي؟ فعل be، المضارع المستمر، like مع -ing، ولا جمل الصلة؟</div>", "n": 1, "i": 59, "a": "tefl-12-054", "x": "514f5eb7"}, {"t": "learn", "h": "<div class=\"u\">Answer: relative clauses. Those come at intermediate level. The other three are all elementary topics.</div><div class=\"u\">الإجابة: جمل الصلة. دي بتتدرّس في المستوى المتوسط. التلاتة التانيين كلهم مواضيع ابتدائية.</div>", "n": 1, "i": 60, "a": "tefl-12-055", "x": "53c9c846"}, {"t": "learn", "h": "<div class=\"u\">Second: can you replace which with that in The flowers, which I love, are daffodils? Answer: No. The commas make it non-defining.</div><div class=\"u\">تاني: تقدر تستبدل which بـthat في The flowers, which I love, are daffodils? الإجابة: لأ. الفواصل بتخليها غير محددة.</div>", "n": 1, "i": 61, "a": "tefl-12-056", "x": "d2834ea3"}, {"t": "learn", "h": "<div class=\"u\">Third: make the passive. Active: Charlotte thinks someone was following her. Passive: Charlotte thinks she ___. Answer: was being followed.</div><div class=\"u\">تالت: اعمل المبني للمجهول. المعلوم: Charlotte thinks someone was following her. المجهول: Charlotte thinks she ___. الإجابة: was being followed.</div>", "n": 1, "i": 62, "a": "tefl-12-057", "x": "14fd891a"}, {"t": "learn", "h": "<div class=\"u\">Fourth: do have to and don't have to mean exactly the opposite? Answer: False. Have to means obligatory; don't have to means permitted but not necessary, NOT forbidden.</div><div class=\"u\">رابع: هل have to وdon't have to عكس بعض بالظبط؟ الإجابة: غلط. have to يعني واجب؛ don't have to يعني مسموح بس مش ضروري، مش ممنوع.</div>", "n": 1, "i": 63, "a": "tefl-12-058", "x": "bddc4a68"}, {"t": "learn", "h": "<div class=\"u\">Fifth: false beginners picked up some English informally and inconsistently. True or false? Answer: True.</div><div class=\"u\">خامس: المبتدئين الزائفين التقطوا شوية إنجليزية بشكل غير رسمي وغير منتظم. صح ولا غلط؟ الإجابة: صح.</div>", "n": 1, "i": 64, "a": "tefl-12-059", "x": "1ecd7ea2"}, {"t": "learn", "h": "<div class=\"u\">Sixth: an absolute beginner has no knowledge of English. True or false? Answer: True.</div><div class=\"u\">سادس: المبتدئ الكامل ميعرفش أي إنجليزية. صح ولا غلط؟ الإجابة: صح.</div>", "n": 1, "i": 65, "a": "tefl-12-060", "x": "6a4d76d4"}, {"t": "learn", "h": "<div class=\"u\">Seventh: with absolute beginners, it is best to write a lot on the board and have students copy while you explain. True or false? Answer: False. One thing at a time.</div><div class=\"u\">سابع: مع المبتدئين الكمل، الأفضل تكتب كتير على السبورة والطلاب ينقلوا وانت بتشرح. صح ولا غلط؟ الإجابة: غلط. حاجة واحدة في كل مرة.</div>", "n": 1, "i": 66, "a": "tefl-12-061", "x": "c08cb06b"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 67}, {"t": "learn", "h": "<div class=\"u\">Modal verb: a verb like can, must, or may that comes before another verb and shows its function, like permission or obligation.</div><div class=\"u\">الفعل الناقص: فعل زي can أو must أو may بييجي قبل فعل تاني وبيبين وظيفته، زي الإذن أو الوجوب.</div>", "n": 1, "i": 68, "a": "tefl-12-062", "x": "e98dda3a"}, {"t": "learn", "h": "<div class=\"u\">Obligation: something you must do. It is obligatory means you have no choice.</div><div class=\"u\">الوجوب: حاجة لازم تعملها. واجب يعني مفيش اختيار.</div>", "n": 1, "i": 69, "a": "tefl-12-063", "x": "397dc479"}, {"t": "learn", "h": "<div class=\"u\">Relative clause: a part of a sentence that adds information about a noun without starting a new sentence.</div><div class=\"u\">جملة الصلة: جزء من الجملة بيضيف معلومات عن اسم من غير ما نبدأ جملة جديدة.</div>", "n": 1, "i": 70, "a": "tefl-12-064", "x": "5c8cb1d9"}, {"t": "learn", "h": "<div class=\"u\">Defining relative clause: tells us exactly which person or thing we mean. No commas, and that can replace who or which.</div><div class=\"u\">جملة الصلة المحددة: بتحدد بالظبط مين أو إيه اللي بنقصده. من غير فواصل، وthat تقدر تحل محل who أو which.</div>", "n": 1, "i": 71, "a": "tefl-12-065", "x": "47fb6d8f"}, {"t": "learn", "h": "<div class=\"u\">Non-defining relative clause: adds extra information about someone we already know. It has commas, and that is not allowed.</div><div class=\"u\">جملة الصلة غير المحددة: بتضيف معلومة زيادة عن شخص عارفينه أصلًا. ليها فواصل، وthat مش مسموحة.</div>", "n": 1, "i": 72, "a": "tefl-12-066", "x": "2897f241"}, {"t": "learn", "h": "<div class=\"u\">Gerund: the -ing form of a verb used like a noun, after verbs like enjoy: I enjoy swimming.</div><div class=\"u\">المصدر بـ-ing: شكل الفعل بـ-ing مستخدم كاسم، بعد أفعال زي enjoy: I enjoy swimming.</div>", "n": 1, "i": 73, "a": "tefl-12-067", "x": "af00786b"}, {"t": "learn", "h": "<div class=\"u\">Infinitive: the base form of the verb, with to (to go) or without to (after modals: must go).</div><div class=\"u\">المصدر: الشكل الأساسي للفعل، بـto زي to go أو من غير to بعد الأفعال الناقصة زي must go.</div>", "n": 1, "i": 74, "a": "tefl-12-068", "x": "a473706a"}, {"t": "learn", "h": "<div class=\"u\">Passive voice: the object becomes the subject: He built it becomes It was built. Made with be plus past participle.</div><div class=\"u\">المبني للمجهول: المفعول بييجي في الأول: He built it بتبقى It was built. بتتعمل بـbe زائد التصريف التالت.</div>", "n": 1, "i": 75, "a": "tefl-12-069", "x": "fd371a46"}, {"t": "learn", "h": "<div class=\"u\">Agent: the doer of the action in a passive sentence. Mentioning it with by is optional.</div><div class=\"u\">العامل: اللي عمل الفعل في الجملة المبنية للمجهول. ذكره بـby اختياري.</div>", "n": 1, "i": 76, "a": "tefl-12-070", "x": "5df9ac01"}, {"t": "learn", "h": "<div class=\"u\">Past participle: the third form of the verb, like built, stolen, or carried.</div><div class=\"u\">التصريف التالت: الشكل التالت من الفعل، زي built وstolen وcarried.</div>", "n": 1, "i": 77, "a": "tefl-12-071", "x": "2ba737a3"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 78}, {"t": "learn", "h": "<div class=\"u\">Pre-intermediate: teach modals of permission and obligation with a School Rules lesson, and warn that negatives are not always opposites: don't have to means not necessary, not forbidden.</div><div class=\"u\">قبل المتوسط: درّس أفعال الإذن والوجوب بدرس قواعد المدرسة، وحذّر إن النفي مش دايمًا العكس: don't have to يعني مش ضروري، مش ممنوع.</div>", "n": 1, "i": 79, "a": "tefl-12-072", "x": "0da8a81b"}, {"t": "learn", "h": "<div class=\"u\">Intermediate: relative clauses join sentences without repetition. Focus on who, which, that, where, when. In defining clauses that can replace who or which; with commas it cannot.</div><div class=\"u\">المتوسط: جمل الصلة بتوصل الجمل من غير تكرار. ركز على who وwhich وthat وwhere وwhen. في المحددة that تحل محل who أو which؛ مع الفواصل لأ.</div>", "n": 1, "i": 80, "a": "tefl-12-073", "x": "98af8e74"}, {"t": "learn", "h": "<div class=\"u\">Upper-intermediate: the first verb decides the form of the second. Enjoy plus gerund, decide plus to-infinitive, modals plus bare infinitive. No full rules, so practise a lot.</div><div class=\"u\">فوق المتوسط: الفعل الأول بيحدد شكل التاني. enjoy مع المصدر بـ-ing، وdecide مع المصدر بـto، والأفعال الناقصة مع المصدر المجرد. مفيش قواعد كاملة، فتدرّب كتير.</div>", "n": 1, "i": 81, "a": "tefl-12-074", "x": "cb41a81d"}, {"t": "learn", "h": "<div class=\"u\">Advanced: passive sentences put the object first, use be in the same tense plus the past participle, and the agent is optional.</div><div class=\"u\">المتقدم: الجمل المبنية للمجهول بتحط المفعول الأول، وبتستخدم be في نفس الزمن زائد التصريف التالت، والعامل اختياري.</div>", "n": 1, "i": 82, "a": "tefl-12-075", "x": "05104005"}, {"t": "learn", "h": "<div class=\"u\">Mixed practice: erase verb forms from a real text and let students choose active or passive, like the Reuters gap-fill text.</div><div class=\"u\">تدريب مختلط: امسح صيغ الأفعال من نص حقيقي وخلّي الطلاب يختاروا معلوم أو مجهول، زي نص رويترز بملء الفراغات.</div>", "n": 1, "i": 83, "a": "tefl-12-076", "x": "8f376acd"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 84}, {"t": "mc", "q": "Which of these would you NOT teach at elementary level?<br>أنهي واحدة في دول مينفعش تتدرّس في المستوى الابتدائي؟", "opts": ["relative clauses | جمل الصلة", "verb be | فعل be", "present continuous | المضارع المستمر", "like plus -ing | like مع -ing"], "ans": 0, "why": "Relative clauses are an intermediate topic; the rest are elementary. | جمل الصلة موضوع متوسط؛ الباقي ابتدائي.", "ex": ["Correct. | صح.", "No. Be is elementary. | غلط: be ابتدائي.", "No. That is elementary. | غلط: ده ابتدائي.", "No. That is elementary. | غلط: ده ابتدائي."], "n": 1, "i": 85, "h": ""}, {"t": "tf", "q": "In The flowers, which I love, are daffodils, we can replace which with that.<br>في The flowers, which I love, are daffodils، نقدر نستبدل which بـthat.", "ans": false, "why": "The commas make it non-defining, and that is not allowed there. | الفواصل بتخليها غير محددة، وthat مش مسموحة هناك.", "ex": ["Wrong. It is non-defining, so no that. | غلط: غير محددة، فمفيش that.", "Correct. | صح."], "n": 1, "i": 86, "h": ""}, {"t": "mc", "q": "Active: Charlotte thinks someone was following her. Passive: Charlotte thinks she ___.<br>معلوم: Charlotte thinks someone was following her. مجهول: Charlotte thinks she ___.", "opts": ["was being followed | was being followed", "is following | is following", "had been being followed | had been being followed"], "ans": 0, "why": "The active verb is past continuous, so be takes past continuous: was being followed. | الفعل الأصلي ماضي مستمر، فـbe بتاخد الماضي المستمر: was being followed.", "ex": ["Correct. | صح.", "No. That is active, not passive. | غلط: ده معلوم مش مجهول.", "No. The tense does not match. | غلط: الزمن مش مطابق."], "n": 1, "i": 87, "h": ""}, {"t": "tf", "q": "Have to and don't have to mean exactly the opposite.<br>have to وdon't have to معناهم العكس بالظبط.", "ans": false, "why": "Have to means obligatory; don't have to means permitted but not necessary, NOT forbidden. | have to يعني واجب؛ don't have to يعني مسموح بس مش ضروري، مش ممنوع.", "ex": ["Wrong. Don't have to is not a ban. | غلط: don't have to مش منع.", "Correct. | صح."], "n": 1, "i": 88, "h": ""}, {"t": "mc", "q": "Enjoy is followed by:<br>enjoy بييجي وراها:", "opts": ["the gerund: enjoy listening | المصدر بـ-ing: enjoy listening", "the infinitive with to: enjoy to listen | المصدر بـto: enjoy to listen", "the infinitive without to: enjoy listen | المصدر المجرد: enjoy listen"], "ans": 0, "why": "Enjoy always takes the -ing form. | enjoy دايمًا بتاخد شكل الـ-ing.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 1, "i": 89, "h": ""}, {"t": "mc", "q": "Modal verbs like can and must are always followed by:<br>الأفعال الناقصة زي can وmust دايمًا بييجي وراها:", "opts": ["the infinitive without to | المصدر من غير to", "the gerund | المصدر بـ-ing", "the past participle | التصريف التالت"], "ans": 0, "why": "This is the one firm rule: modals take the bare infinitive, like must go. | دي القاعدة الثابتة الوحيدة: الأفعال الناقصة بتاخد المصدر المجرد، زي must go.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 1, "i": 90, "h": ""}, {"t": "mc", "q": "In a passive sentence, the doer of the action is called:<br>في الجملة المبنية للمجهول، اللي عمل الفعل اسمه:", "opts": ["the agent | العامل (agent)", "the object | المفعول", "the complement | المكمّل"], "ans": 0, "why": "The doer is the agent, and mentioning it with by is optional. | اللي عمل الفعل هو العامل، وذكره بـby اختياري.", "ex": ["Correct. | صح.", "No. The object moves to the front. | غلط: المفعول هو اللي بييجي قدام.", "No. | غلط."], "n": 1, "i": 91, "h": ""}, {"t": "tf", "q": "The boy who we met yesterday is very nice: here, that can replace who.<br>في The boy who we met yesterday is very nice: هنا that تقدر تحل محل who.", "ans": true, "why": "No commas, so it is defining, and that works as an informal substitute. | مفيش فواصل، فهي محددة، وthat شغالة كبديل غير رسمي.", "ex": ["Correct. | صح.", "Wrong. This one is defining, so that is fine. | غلط: دي محددة، فـthat تمام."], "n": 1, "i": 92, "h": ""}, {"t": "mc", "q": "I can't stand ___. Choose the correct form.<br>I can't stand ___. اختار الشكل الصح.", "opts": ["queuing | queuing", "to queue | to queue", "queue | queue"], "ans": 0, "why": "Can't stand takes the gerund. | can't stand بتاخد المصدر بـ-ing.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 1, "i": 93, "h": ""}, {"t": "tf", "q": "With absolute beginners, it is best to write a lot on the board while you keep explaining.<br>مع المبتدئين الكمل، الأفضل تكتب كتير على السبورة وانت بتكمّل شرح.", "ans": false, "why": "Beginners cannot multi-task in English. Break tasks down: one thing at a time. | المبتدئين ميقدروش يعملوا حاجتين بالإنجليزية. قسّم المهام: حاجة واحدة في كل مرة.", "ex": ["Wrong. One thing at a time. | غلط: حاجة واحدة في كل مرة.", "Correct. | صح."], "n": 1, "i": 94, "h": ""}, {"t": "recall", "q": "Name the five relative pronouns and the three relative adverbs.<br>اذكر ضمائر الصلة الخمسة وظروف الصلة التلاتة.", "a": "Pronouns: who, which, whom, that, whose. Adverbs: where, when, why.<br>الضمائر: who وwhich وwhom وthat وwhose. الظروف: where وwhen وwhy.", "n": 1, "i": 95, "h": ""}, {"t": "recall", "q": "Match four modals to their meanings (positive or negative).<br>وصّل ٤ أفعال ناقصة بمعانيها (مثبتة أو منفية).", "a": "Any 4: must/have to = obligatory; may/can = possible; should = advisable; must not = forbidden; don't have to = not necessary; shouldn't = inadvisable.<br>أي ٤: must/have to = واجب؛ may/can = ممكن؛ should = مستحسن؛ must not = ممنوع؛ don't have to = مش ضروري؛ shouldn't = غير مستحسن.", "n": 1, "i": 96, "h": ""}, {"t": "write", "q": "Explain the difference between defining and non-defining relative clauses (3-4 sentences).<br>اشرح الفرق بين جمل الصلة المحددة وغير المحددة (٣-٤ جمل).", "key": "tefl-12:1", "a": "A defining relative clause tells us exactly which person or thing we mean, so it has no commas. In defining clauses, that can replace who or which informally. A non-defining clause adds extra information about someone we already know, and it is written between commas. In non-defining clauses, that cannot be used.<br>جملة الصلة المحددة بتحدد بالظبط مين أو إيه اللي بنقصده، فملهاش فواصل. في المحددة، that تقدر تحل محل who أو which بشكل غير رسمي. غير المحددة بتضيف معلومة زيادة عن شخص عارفينه أصلًا، وبتتكتب بين فاصلين. وفي غير المحددة، that مينفعش تتستخدم.", "n": 1, "i": 97, "h": ""}, {"t": "write", "q": "Explain how to form a passive sentence, with an example (3-4 sentences).<br>اشرح إزاي تعمل جملة مبنية للمجهول، مع مثال (٣-٤ جمل).", "key": "tefl-12:2", "a": "Start from the active sentence: He built the stadium in 1998. Move the object to the front: The stadium. Then use the verb be in the same tense as the active verb, here past simple, so was. Add the past participle: The stadium was built in 1998. The agent with by is optional.<br>ابدأ من الجملة المبنية للمعلوم: He built the stadium in 1998. حط المفعول في الأول: The stadium. وبعدين استخدم فعل be في نفس زمن الفعل الأصلي، هنا الماضي البسيط، يعني was. ضيف التصريف التالت: The stadium was built in 1998. والعامل مع by اختياري.", "n": 1, "i": 98, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the key grammatical terms every TEFL teacher needs, from parts of speech to sentence types.</div><div class=\"u\">الدرس الجاي: المصطلحات النحوية الأساسية اللي كل مدرس تيفل محتاجها، من أقسام الكلام لأنواع الجمل.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 99}];</script>
