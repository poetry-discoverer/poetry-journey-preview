<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٢٦</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-26";window.STEPS=[{"t": "section", "h": "The planning process | عملية التخطيط", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">When planning a lesson, we should think about a number of things. After deciding on the lesson objectives, we must consider how to accomplish them.</div><div class=\"u\">أثناء تخطيط الدرس، المفروض نفكّر في كذا حاجة. بعد ما نقرّر أهداف الدرس، لازم نفكّر هنحققها إزاي.</div>", "n": 1, "i": 1, "a": "tefl-26-001", "x": "cbcdbdc6"}, {"t": "learn", "h": "<div class=\"u\">Depending on the type of lesson aim, the structure of your plan will change dramatically.</div><div class=\"u\">على حسب نوع هدف الدرس، هيكل خطتك هيتغير بشكل كبير.</div>", "n": 1, "i": 2, "a": "tefl-26-002", "x": "6191c64c"}, {"t": "learn", "h": "<div class=\"u\">Perhaps you will choose the PPP approach to present the past simple, or, for a listening skills lesson, you may prefer the TTT method.</div><div class=\"u\">ممكن تختار طريقة PPP عشان تقدّم الماضي البسيط، أو لدرس مهارات استماع، ممكن تفضّل طريقة TTT.</div>", "n": 1, "i": 3, "a": "tefl-26-003", "x": "bb5aaba1"}, {"t": "learn", "h": "<div class=\"u\">Once the format is chosen, the individual components need putting together.</div><div class=\"u\">لما الشكل يتختار، المكونات الفردية محتاجة تتركّب.</div>", "n": 1, "i": 4, "a": "tefl-26-004", "x": "34aad3d6"}, {"t": "learn", "h": "<div class=\"u\">Ask: what are the desired learning outcomes? Are students already a bit familiar with the topic? Is there anything I want to work on personally?</div><div class=\"u\">اسأل: إيه نواتج التعلم المطلوبة؟ الطلبة عارفين شوية عن الموضوع أصلًا؟ في حاجة عايز أشتغل عليها شخصيًا؟</div>", "n": 1, "i": 5, "a": "tefl-26-005", "x": "14b017f5"}, {"t": "learn", "h": "<div class=\"u\">Then you can plan each individual procedure as a step-by-step guide leading you through the lesson.</div><div class=\"u\">وبعدين تقدر تخطط كل إجراء فردي كدليل خطوة بخطوة بيقودك خلال الدرس.</div>", "n": 1, "i": 6, "a": "tefl-26-006", "x": "a6272953"}, {"t": "learn", "h": "<div class=\"u\">Analysing the aims of each stage ensures the activities suit the learners' level and work to fulfill the main objective.</div><div class=\"u\">تحليل أهداف كل مرحلة بيضمن إن الأنشطة مناسبة لمستوى المتعلمين وبتشتغل على تحقيق الهدف الرئيسي.</div>", "n": 1, "i": 7, "a": "tefl-26-007", "x": "61844575"}, {"t": "learn", "h": "<div class=\"u\">You also need to check whether the stages follow a logical order and flow well into one another.</div><div class=\"u\">وكمان محتاج تتأكد إن المراحل ماشية بترتيب منطقي وبيتدفّقوا في بعض كويس.</div>", "n": 1, "i": 8, "a": "tefl-26-008", "x": "f62c4196"}, {"t": "learn", "h": "<div class=\"u\">Anticipating potential problems at each stage, with back-ups prepared, will help reduce any anxiety you feel as a new teacher.</div><div class=\"u\">توقع المشاكل المحتملة في كل مرحلة، مع خطط بديلة جاهزة، هيساعد يقلل أي قلق حاسس بيه كمدرس جديد.</div>", "n": 1, "i": 9, "a": "tefl-26-009", "x": "ef1b212d"}, {"t": "learn", "h": "<div class=\"u\">Timing matters too: your lesson may run over or be too short. Think about these possibilities ahead of time, and what to do in each case, and you will not be caught off-guard.</div><div class=\"u\">التوقيت مهم كمان: درسك ممكن يعدّي المعاد أو يبقى قصير أوي. فكّر في الاحتمالات دي قبل الوقت، وهتعمل إيه في كل حالة، ومش هتتفاجئ.</div>", "n": 1, "i": 10, "a": "tefl-26-010", "x": "506469bc"}, {"t": "section", "h": "Formal plans and the real world | الخطط الرسمية والواقع", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">Formal lesson planning like this is usually a requirement for teacher training courses, to help you understand how to prepare and to analyse how well you have grasped the key concepts.</div><div class=\"u\">التخطيط الرسمي للدروس ده عادة مطلب في كورسات تدريب المدرسين، عشان يساعدك تفهم إزاي تجهّز وتحلّل مدى استيعابك للمفاهيم الأساسية.</div>", "n": 1, "i": 12, "a": "tefl-26-011", "x": "17507b15"}, {"t": "learn", "h": "<div class=\"u\">However, in the real world you may not always do such detailed written preparation.</div><div class=\"u\">بس في العالم الحقيقي ممكن ماتعملش دايمًا التحضير المكتوب المفصّل ده.</div>", "n": 1, "i": 13, "a": "tefl-26-012", "x": "5d6cc84f"}, {"t": "learn", "h": "<div class=\"u\">You may even see some teachers write their plan as a numbered list on a scrap of paper.</div><div class=\"u\">ممكن حتى تشوف مدرسين بيكتبوا خطتهم كقايمة مرقمة على ورقة صغيرة.</div>", "n": 1, "i": 14, "a": "tefl-26-013", "x": "dfd9884c"}, {"t": "learn", "h": "<div class=\"u\">This does not mean they have not thought about the elements above; it may just come as second nature to them to include the necessary factors.</div><div class=\"u\">ده مش معناه إنهم مافكّروش في العناصر اللي فوق؛ ممكن بس بقت طبيعة تانية ليهم إنهم يدخّلوا العوامل اللازمة.</div>", "n": 1, "i": 15, "a": "tefl-26-014", "x": "f71330cd"}, {"t": "section", "h": "Model plan: comparatives | خطة نموذجية: المقارنات", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">Compare the procedure sections of two different lesson plans. The first teaches comparatives.</div><div class=\"u\">قارن بين أقسام الإجراءات في خطتي درس مختلفتين. الأولى بتعلّم المقارنات.</div>", "n": 1, "i": 17, "a": "tefl-26-015", "x": "99bcd77b"}, {"t": "learn", "h": "<div class=\"u\">Comparatives plan, stage one, 10 minutes: give students pictures of two towns and ask them to describe the contrasts. Aim: to introduce the target language.</div><div class=\"u\">خطة المقارنات، مرحلة واحد، ١٠ دقايق: ادّي الطلبة صور لمدينتين واطلب منهم يوصفوا الاختلافات. الهدف: تقديم اللغة المستهدفة.</div>", "n": 1, "i": 18, "a": "tefl-26-016", "x": "77dc2644"}, {"t": "learn", "h": "<div class=\"u\">Stage two, 10 minutes: read an article describing the differences between the two. Aim: to give students a context for the target language in use.</div><div class=\"u\">مرحلة اتنين، ١٠ دقايق: اقرا مقال بيوصف الاختلافات بين الاتنين. الهدف: إعطاء الطلبة سياق للغة المستهدفة أثناء الاستخدام.</div>", "n": 1, "i": 19, "a": "tefl-26-017", "x": "b84cc3f7"}, {"t": "learn", "h": "<div class=\"u\">Stage three, 5 minutes: elicit forms from the text used for comparison. Aim: to ensure students understand the meaning of the target language.</div><div class=\"u\">مرحلة تلاتة، ٥ دقايق: استخرج من النص الصيغ المستخدمة في المقارنة. الهدف: التأكد إن الطلبة فاهمين معنى اللغة المستهدفة.</div>", "n": 1, "i": 20, "a": "tefl-26-018", "x": "68b4b397"}, {"t": "learn", "h": "<div class=\"u\">Stage four, 7 minutes: students work out rules for using comparatives. Aim: to check students' understanding of the target language.</div><div class=\"u\">مرحلة أربعة، ٧ دقايق: الطلبة بيستنتجوا قواعد استخدام المقارنات. الهدف: التحقق من فهم الطلبة للغة المستهدفة.</div>", "n": 1, "i": 21, "a": "tefl-26-019", "x": "3373ef31"}, {"t": "learn", "h": "<div class=\"u\">Stage five, 10 minutes: gap-fill exercise using the correct form of comparative adjectives. Aim: to give students controlled practice of the target language.</div><div class=\"u\">مرحلة خمسة، ١٠ دقايق: تدريب ملء فراغات بصيغة صفات المقارنة الصح. الهدف: إعطاء الطلبة تمرين مضبوط على اللغة المستهدفة.</div>", "n": 1, "i": 22, "a": "tefl-26-020", "x": "b2179f1c"}, {"t": "learn", "h": "<div class=\"u\">Stage six, 15 minutes: speaking activity contrasting new pictures, in pairs. Aim: to encourage freer use of the target language.</div><div class=\"u\">مرحلة ستة، ١٥ دقيقة: نشاط كلام بيقارن صور جديدة، في أزواج. الهدف: تشجيع الاستخدام الحر للغة المستهدفة.</div>", "n": 1, "i": 23, "a": "tefl-26-021", "x": "125c2989"}, {"t": "section", "h": "Model plan: a reading lesson | خطة نموذجية: درس قراية", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">The second plan is a reading lesson.</div><div class=\"u\">الخطة التانية درس قراية.</div>", "n": 1, "i": 25, "a": "tefl-26-022", "x": "f3bebf4e"}, {"t": "learn", "h": "<div class=\"u\">Reading plan, stage one, 10 minutes: ask students some lead-in questions about the topic. Aim: to introduce and generate interest in the topic.</div><div class=\"u\">خطة القراية، مرحلة واحد، ١٠ دقايق: اسأل الطلبة أسئلة تمهيدية عن الموضوع. الهدف: تقديم الموضوع وتوليد اهتمام بيه.</div>", "n": 1, "i": 26, "a": "tefl-26-023", "x": "6d994848"}, {"t": "learn", "h": "<div class=\"u\">Stage two, 7 minutes: pre-teach essential vocabulary. Aim: to focus on useful language in preparation for the task.</div><div class=\"u\">مرحلة اتنين، ٧ دقايق: علّم المفردات الأساسية مسبقًا. الهدف: التركيز على اللغة المفيدة تجهيزًا للمهمة.</div>", "n": 1, "i": 27, "a": "tefl-26-024", "x": "518a5f9d"}, {"t": "learn", "h": "<div class=\"u\">Stage three, 5 minutes: students read quickly for gist and feedback answers to general questions, like what is the text about?</div><div class=\"u\">مرحلة تلاتة، ٥ دقايق: الطلبة بيقرأوا بسرعة للفكرة العامة وبيراجعوا إجابات أسئلة عامة، زي النص عن إيه؟</div>", "n": 1, "i": 28, "a": "tefl-26-025", "x": "3b2d569a"}, {"t": "learn", "h": "<div class=\"u\">Aim: to develop the ability to skim and scan for essential information.</div><div class=\"u\">الهدف: تطوير القدرة على القراية السريعة والبحث عن المعلومات الأساسية.</div>", "n": 1, "i": 29, "a": "tefl-26-026", "x": "ad269d3d"}, {"t": "learn", "h": "<div class=\"u\">Stage four, 7 minutes: students match headings to the paragraphs. Aim: to develop understanding of how the text fits together as a whole.</div><div class=\"u\">مرحلة أربعة، ٧ دقايق: الطلبة بيوصّلوا العناوين بالفقرات. الهدف: تطوير فهم إزاي النص متركّب ككل.</div>", "n": 1, "i": 30, "a": "tefl-26-027", "x": "866493cf"}, {"t": "learn", "h": "<div class=\"u\">Stage five, 10 minutes: true/false detailed comprehension activity, checked with a partner. Aim: to encourage students to read for detail.</div><div class=\"u\">مرحلة خمسة، ١٠ دقايق: نشاط فهم تفصيلي صح/غلط، بيتراجع مع شريك. الهدف: تشجيع الطلبة على القراية للتفاصيل.</div>", "n": 1, "i": 31, "a": "tefl-26-028", "x": "efc72b62"}, {"t": "learn", "h": "<div class=\"u\">Stage six, 15 minutes: split students into As and Bs, give each a different follow-up text to read, then they summarise it orally to their partner.</div><div class=\"u\">مرحلة ستة، ١٥ دقيقة: قسّم الطلبة لـA وB، ادّي كل واحد نص متابعة مختلف يقراه، وبعدين يلخّصوه شفوي لشريكهم.</div>", "n": 1, "i": 32, "a": "tefl-26-029", "x": "f69d4681"}, {"t": "learn", "h": "<div class=\"u\">Aim: freer practice consolidating information they have read in spoken form.</div><div class=\"u\">الهدف: تمرين حر على تثبيت المعلومات المقروءة في شكل منطوق.</div>", "n": 1, "i": 33, "a": "tefl-26-030", "x": "05c5b8f4"}, {"t": "section", "h": "What students asked for | اللي الطلبة طلبوه", "n": 1, "i": 34}, {"t": "learn", "h": "<div class=\"u\">Many students asked for more about lesson planning. Their key points:</div><div class=\"u\">طلبة كتير طلبوا المزيد عن تخطيط الدروس. نقاطهم الأساسية:</div>", "n": 1, "i": 35, "a": "tefl-26-031", "x": "76ba1eb4"}, {"t": "learn", "h": "<div class=\"u\">They feel that lesson planning is the most important teacher skill of all. They are right, of course.</div><div class=\"u\">حاسين إن تخطيط الدروس هو أهم مهارة للمدرس على الإطلاق. وهما صح طبعًا.</div>", "n": 1, "i": 36, "a": "tefl-26-032", "x": "aac7749e"}, {"t": "learn", "h": "<div class=\"u\">They need a lesson planning route they can follow from start to finish, for every single lesson.</div><div class=\"u\">محتاجين مسار تخطيط يمشوا عليه من البداية للنهاية، لكل درس.</div>", "n": 1, "i": 37, "a": "tefl-26-033", "x": "aa485a76"}, {"t": "learn", "h": "<div class=\"u\">They would like a lesson-planning template they can use for every single lesson plan during their TEFL career.</div><div class=\"u\">عايزين قالب تخطيط يستخدموه لكل خطة درس طول مشوارهم في تدريس الإنجليزية.</div>", "n": 1, "i": 38, "a": "tefl-26-034", "x": "b519b549"}, {"t": "learn", "h": "<div class=\"u\">This is a big ask, as they say. But it is our role to help our students whenever we can.</div><div class=\"u\">ده طلب كبير، زي ما بيقولوا. بس دورنا إننا نساعد طلبتنا أي وقت نقدر.</div>", "n": 1, "i": 39, "a": "tefl-26-035", "x": "cfe2c41c"}, {"t": "learn", "h": "<div class=\"u\">Remember this: you have learned enough so far to ensure you can plan a good lesson. You decide!</div><div class=\"u\">افتكر ده: انت اتعلمت كفاية لحد دلوقتي إنك تضمن إنك تقدر تخطط درس كويس. القرار قرارك!</div>", "n": 1, "i": 40, "a": "tefl-26-036", "x": "2c4a2b64"}, {"t": "section", "h": "Unit 3 questions | أسئلة الوحدة ٣", "n": 1, "i": 41}, {"t": "learn", "h": "<div class=\"u\">Unit 3 questions. Question 1: which of these stages should come first?</div><div class=\"u\">أسئلة الوحدة التالتة. سؤال ١: أنهي مرحلة من دول المفروض تيجي الأول؟</div>", "n": 1, "i": 42, "a": "tefl-26-037", "x": "9bf28993"}, {"t": "learn", "h": "<div class=\"u\">Options: role-play the dialogue, drill pronunciation, listen to a waitress-customer conversation, elicit restaurant vocabulary.</div><div class=\"u\">الاختيارات: لعب أدوار الحوار، تدريب النطق، استماع لمحادثة ويتريس وزبون، استخراج مفردات المطعم.</div>", "n": 1, "i": 43, "a": "tefl-26-038", "x": "9b2ed704"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: listen to a conversation between a waitress and a customer. Listening comes before eliciting, drilling, and role-play.</div><div class=\"u\">الإجابة الصح: الاستماع لمحادثة بين ويتريس وزبون. الاستماع بييجي قبل الاستخراج والتدريب ولعب الأدوار.</div>", "n": 1, "i": 44, "a": "tefl-26-039", "x": "5a4b092c"}, {"t": "learn", "h": "<div class=\"u\">Question 2: stages so far are students listen to a radio interview, then listen again and answer 4 multiple-choice questions. Best next step?</div><div class=\"u\">سؤال ٢: المراحل لحد دلوقتي: الطلبة سمعوا مقابلة إذاعية، وبعدين سمعوها تاني وجاوبوا ٤ أسئلة اختيارات. أحسن خطوة جاية؟</div>", "n": 1, "i": 45, "a": "tefl-26-040", "x": "bf985326"}, {"t": "learn", "h": "<div class=\"u\">Options: class discussion about the topic, elicit vocabulary, students check answers in pairs before feeding back.</div><div class=\"u\">الاختيارات: نقاش جماعي عن الموضوع، استخراج مفردات، الطلبة يراجعوا الإجابات في أزواج قبل العرض.</div>", "n": 1, "i": 46, "a": "tefl-26-041", "x": "8c740a7d"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: students check answers in pairs before feeding back.</div><div class=\"u\">الإجابة الصح: الطلبة يراجعوا الإجابات في أزواج قبل العرض.</div>", "n": 1, "i": 47, "a": "tefl-26-042", "x": "21650e89"}, {"t": "learn", "h": "<div class=\"u\">Question 3: which of the following is NOT an example of a procedure? Options: students work in pairs to complete a task, teacher photocopies and cuts up the statements, feedback answers.</div><div class=\"u\">سؤال ٣: أنهي دي مش مثال على إجراء؟ الاختيارات: الطلبة يشتغلوا في أزواج لإكمال مهمة، المدرس يطبّع ويقص العبارات، مراجعة الإجابات.</div>", "n": 1, "i": 48, "a": "tefl-26-043", "x": "1865f72a"}, {"t": "learn", "h": "<div class=\"u\">Correct answer: teacher photocopies and cuts up the statements. That is preparation before the lesson, not a procedure inside it.</div><div class=\"u\">الإجابة الصح: المدرس يطبّع ويقص العبارات. ده تحضير قبل الدرس، مش إجراء جواه.</div>", "n": 1, "i": 49, "a": "tefl-26-044", "x": "6ae0eb8a"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">Learning outcome: what learners should be able to do by the end of the lesson.</div><div class=\"u\">ناتج التعلم: إيه اللي المتعلمين المفروض يقدروا يعملوه بنهاية الدرس.</div>", "n": 1, "i": 51, "a": "tefl-26-045", "x": "1191ee33"}, {"t": "learn", "h": "<div class=\"u\">Logical flow: stages following an order where each one builds on the one before.</div><div class=\"u\">التدفق المنطقي: مراحل ماشية بترتيب كل واحدة بتبني على اللي قبلها.</div>", "n": 1, "i": 52, "a": "tefl-26-046", "x": "aea0ec50"}, {"t": "learn", "h": "<div class=\"u\">Back-up: a prepared alternative in case a stage fails or runs short.</div><div class=\"u\">الخطة البديلة: بديل مجهز في حالة مرحلة فشلت أو خلصت بدري.</div>", "n": 1, "i": 53, "a": "tefl-26-047", "x": "5dd660b8"}, {"t": "learn", "h": "<div class=\"u\">Lead-in: an opening stage that introduces the topic and generates interest.</div><div class=\"u\">التمهيد (lead-in): مرحلة افتتاحية بتقدّم الموضوع وبتولّد اهتمام.</div>", "n": 1, "i": 54, "a": "tefl-26-048", "x": "935806eb"}, {"t": "learn", "h": "<div class=\"u\">Skim: reading quickly for the general idea.</div><div class=\"u\">القراية السريعة للفكرة (skim): تقرا بسرعة عشان الفكرة العامة.</div>", "n": 1, "i": 55, "a": "tefl-26-049", "x": "6dee125a"}, {"t": "learn", "h": "<div class=\"u\">Scan: reading quickly to find specific information.</div><div class=\"u\">البحث السريع (scan): تقرا بسرعة عشان تلاقي معلومة محددة.</div>", "n": 1, "i": 56, "a": "tefl-26-050", "x": "764bbbf2"}, {"t": "learn", "h": "<div class=\"u\">Comparative: the form used to compare two things, like bigger or more interesting.</div><div class=\"u\">المقارنة: الصيغة المستخدمة للمقارنة بين حاجتين، زي أكبر أو أمتع.</div>", "n": 1, "i": 57, "a": "tefl-26-051", "x": "34c83de5"}, {"t": "learn", "h": "<div class=\"u\">Template: a reusable plan skeleton you fill in for every lesson.</div><div class=\"u\">القالب: هيكل خطة بيتعاد استخدامه بتملاه لكل درس.</div>", "n": 1, "i": 58, "a": "tefl-26-052", "x": "462cf95b"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">Decide the objectives, then choose the format: PPP for a grammar point, TTT for listening skills; the aim drives the structure.</div><div class=\"u\">قرّر الأهداف، وبعدين اختار الشكل: PPP لنقطة قواعد، TTT لمهارات الاستماع؛ الهدف بيسوّق الهيكل.</div>", "n": 1, "i": 60, "a": "tefl-26-053", "x": "205bcc49"}, {"t": "learn", "h": "<div class=\"u\">Check the components: outcomes, familiarity, personal goals; then plan each procedure and analyse every stage aim for level and flow.</div><div class=\"u\">راجع المكونات: النواتج، الألفة، الأهداف الشخصية؛ وبعدين خطط كل إجراء وحلّل هدف كل مرحلة من ناحية المستوى والتدفق.</div>", "n": 1, "i": 61, "a": "tefl-26-054", "x": "dd4cd78c"}, {"t": "learn", "h": "<div class=\"u\">Anticipate problems, prepare back-ups, and plan timing so the lesson never catches you off-guard.</div><div class=\"u\">توقّع المشاكل، جهّز خطط بديلة، وخطط التوقيت عشان الدرس ميفاجئكش أبدًا.</div>", "n": 1, "i": 62, "a": "tefl-26-055", "x": "965d9b86"}, {"t": "learn", "h": "<div class=\"u\">Formal written plans are for training; experienced teachers compress them into second nature, but the thinking stays.</div><div class=\"u\">الخطط المكتوبة الرسمية للتدريب؛ المدرسين الخبرة بيختصروها لطبيعة تانية، بس التفكير بيفضل.</div>", "n": 1, "i": 63, "a": "tefl-26-056", "x": "f6695eff"}, {"t": "learn", "h": "<div class=\"u\">Two model procedures: a comparatives lesson (pictures, article, elicit, rules, gap-fill, free speaking) and a reading lesson (lead-in, vocabulary, gist, headings, detail, jigsaw summary).</div><div class=\"u\">نموذجين إجراءات: درس مقارنات (صور، مقال، استخراج، قواعد، ملء فراغات، كلام حر) ودرس قراية (تمهيد، مفردات، فكرة عامة، عناوين، تفاصيل، تلخيص متبادل).</div>", "n": 1, "i": 64, "a": "tefl-26-057", "x": "ec0df54e"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 65}, {"t": "mc", "q": "Which stage should come FIRST in a restaurant dialogue lesson?<br>أنهي مرحلة المفروض تيجي الأول في درس حوار مطعم؟", "opts": ["listen to a conversation between a waitress and a customer | الاستماع لمحادثة بين ويتريس وزبون", "role-play the dialogue | لعب أدوار الحوار", "drill pronunciation | تدريب النطق"], "ans": 0, "why": "The model conversation comes first; eliciting, drilling and role-play build on it. | المحادثة النموذجية بتيجي الأول؛ الاستخراج والتدريب ولعب الأدوار بيبنوا عليها.", "ex": ["Correct. | صح.", "No. Role-play is a late, free stage. | غلط: لعب الأدوار مرحلة متأخرة حرة.", "No. Drilling follows the model. | غلط: التدريب بييجي بعد النموذج."], "n": 1, "i": 66, "h": ""}, {"t": "mc", "q": "After two listens and 4 multiple-choice questions, the best next step is:<br>بعد سماعين و٤ أسئلة اختيارات، أحسن خطوة جاية هي:", "opts": ["students check answers in pairs before feeding back | الطلبة يراجعوا الإجابات في أزواج قبل العرض", "a class discussion about the topic | نقاش جماعي عن الموضوع", "elicit vocabulary | استخراج مفردات"], "ans": 0, "why": "Pair checking comes right after individual answering, before open class feedback. | مراجعة الأزواج بتيجي بعد الإجابة الفردية على طول، قبل العرض الجماعي.", "ex": ["Correct. | صح.", "No. Discussion comes after feedback is settled. | غلط: النقاش بييجي بعد ما المراجعة تتثبت.", "No. Vocabulary is pre-taught before listening. | غلط: المفردات بتتعلّم قبل الاستماع."], "n": 1, "i": 67, "h": ""}, {"t": "mc", "q": "Which is NOT a lesson procedure?<br>أنهي دي مش إجراء درس؟", "opts": ["the teacher photocopies and cuts up the statements | المدرس يطبّع ويقص العبارات", "students work in pairs to complete a task | الطلبة يشتغلوا في أزواج لإكمال مهمة", "feedback answers | مراجعة الإجابات"], "ans": 0, "why": "Photocopying is preparation before the lesson, not a stage inside it. | الطباعة تحضير قبل الدرس، مش مرحلة جواه.", "ex": ["Correct. | صح.", "No. Pair task work is a procedure. | غلط: شغل الأزواج إجراء.", "No. Feedback is a procedure stage. | غلط: المراجعة مرحلة إجراء."], "n": 1, "i": 68, "h": ""}, {"t": "mc", "q": "In the comparatives plan, students work out the rules for using comparatives to:<br>في خطة المقارنات، الطلبة بيستنتجوا قواعد استخدام المقارنات عشان:", "opts": ["check their understanding of the target language | التحقق من فهمهم للغة المستهدفة", "give them controlled practice | إعطائهم تمرين مضبوط", "introduce the target language | تقديم اللغة المستهدفة"], "ans": 0, "why": "Working out rules checks understanding; the gap-fill after it gives the controlled practice. | استنتاج القواعد بيتحقق من الفهم؛ ملء الفراغات بعده بيدّي التمرين المضبوط.", "ex": ["Correct. | صح.", "No. Controlled practice is the gap-fill stage. | غلط: التمرين المضبوط هو مرحلة ملء الفراغات.", "No. Introduction is the pictures stage. | غلط: التقديم هو مرحلة الصور."], "n": 1, "i": 69, "h": ""}, {"t": "mc", "q": "In the reading plan, matching headings to paragraphs develops:<br>في خطة القراية، توصيل العناوين بالفقرات بيطوّر:", "opts": ["understanding of how the text fits together as a whole | فهم إزاي النص متركّب ككل", "listening for gist | الاستماع للفكرة العامة", "controlled writing practice | تمرين كتابة مضبوط"], "ans": 0, "why": "Headings-to-paragraphs shows the text's overall structure. | توصيل العناوين بالفقرات بيوضح هيكل النص العام.", "ex": ["Correct. | صح.", "No. Gist is the quick first read. | غلط: الفكرة العامة هي القراية الأولى السريعة.", "No. It is a reading stage, not writing. | غلط: دي مرحلة قراية مش كتابة."], "n": 1, "i": 70, "h": ""}, {"t": "tf", "q": "A numbered list on a scrap of paper means the teacher did not think about planning elements.<br>قايمة مرقمة على ورقة صغيرة معناها إن المدرس مافكّرش في عناصر التخطيط.", "ans": false, "why": "False. Experienced teachers may incorporate the necessary factors as second nature. | غلط. مدرسين الخبرة ممكن يدخّلوا العوامل اللازمة كطبيعة تانية.", "ex": ["Wrong. The thinking can be second nature even when the paper is thin. | غلط: التفكير ممكن يبقى طبيعة تانية حتى لو الورقة خفيفة.", "Correct. | صح."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "Anticipating problems and preparing back-ups mainly helps to:<br>توقع المشاكل وتجهيز خطط بديلة بيساعد أساسًا على:", "opts": ["reduce a new teacher's anxiety | تقليل قلق المدرس الجديد", "make the lesson longer | تطويل الدرس", "avoid planning stage aims | تجنب تخطيط أهداف المراحل"], "ans": 0, "why": "Back-ups calm the teacher; they do not replace stage aims or stretch the lesson. | الخطط البديلة بتهدّي المدرس؛ مابتستبدلش أهداف المراحل ولا بتطوّل الدرس.", "ex": ["Correct. | صح.", "No. Back-ups manage time, not extend it. | غلط: البدائل بتدير الوقت مش بتمدّه.", "No. Stage aims are still planned. | غلط: أهداف المراحل لسه بتتخطط."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "For a listening skills lesson, the unit suggests which planning approach?<br>لدرس مهارات استماع، الوحدة بتقترح أنهي طريقة تخطيط؟", "opts": ["TTT | TTT", "PPP | PPP", "TBL | TBL"], "ans": 0, "why": "The example pairs PPP with presenting the past simple, and TTT with a listening skills lesson. | المثال بيربط PPP بتقديم الماضي البسيط، وTTT بدرس مهارات الاستماع.", "ex": ["Correct. | صح.", "No. PPP is the past simple example. | غلط: PPP هو مثال الماضي البسيط.", "No. TBL is not the example given here. | غلط: TBL مش المثال المذكور هنا."], "n": 1, "i": 73, "h": ""}, {"t": "recall", "q": "List the six stages of the comparatives lesson plan in order.<br>اذكر مراحل خطة درس المقارنات الستة بالترتيب.", "a": "Pictures of two towns, read the article, elicit comparison forms, work out rules, gap-fill, free speaking with new pictures.<br>صور المدينتين، قراية المقال، استخراج صيغ المقارنة، استنتاج القواعد، ملء فراغات، كلام حر بصور جديدة.", "n": 1, "i": 74, "h": ""}, {"t": "recall", "q": "List the six stages of the reading lesson plan in order.<br>اذكر مراحل خطة درس القراية الستة بالترتيب.", "a": "Lead-in questions, pre-teach vocabulary, read for gist, match headings to paragraphs, true/false detail check, As and Bs oral summaries.<br>أسئلة تمهيدية، تعليم مفردات مسبق، قراية للفكرة العامة، توصيل العناوين بالفقرات، تحقق تفصيلي صح/غلط، تلخيصات شفوية بين A وB.", "n": 1, "i": 75, "h": ""}, {"t": "write", "q": "Explain why the aim type changes the whole structure of a plan, with examples (3-4 sentences).<br>اشرح ليه نوع الهدف بيغيّر هيكل الخطة كله، بأمثلة (٣-٤ جمل).", "key": "tefl-26:1", "a": "The aim decides what success looks like, so it decides the route. To present the past simple, a teacher might choose PPP: present in context, practise in a controlled way, then produce freely. For a listening skills lesson, TTT fits better: diagnose with a first listen-task, teach what is missing, then test again. A reading lesson needs yet another shape: lead-in, vocabulary, gist, then detail. Same teacher, same care, different architecture, because the objective leads.<br>الهدف بيحدّد شكل النجاح، فبيحدّد الطريق. عشان تقدّم الماضي البسيط، مدرس ممكن يختار PPP: قدّم في سياق، تمرّن بشكل مضبوط، وبعدين أنتج بحرية. لدرس مهارات استماع، TTT أنسب: شخّص بمهمة سماع أولى، علّم الناقص، وبعدين اختبر تاني. درس القراية محتاج شكل تالت خالص: تمهيد، مفردات، فكرة عامة، وبعدين تفاصيل. نفس المدرس، نفس الاهتمام، بس عمارة مختلفة، لأن الهدف هو القائد.", "n": 1, "i": 76, "h": ""}, {"t": "write", "q": "Why do experienced teachers plan on scraps of paper, and why do trainees write formal plans (3-4 sentences)?<br>ليه مدرسين الخبرة بيخططوا على ورق صغير، وليه المتدربين بيكتبوا خطط رسمية (٣-٤ جمل)؟", "key": "tefl-26:2", "a": "Formal written plans are a training requirement: they force the new teacher to prepare thoroughly and let trainers analyse how well the key concepts are grasped. Experienced teachers have internalised those same elements, the aims, the stages, the timing, the problems, so incorporating them comes as second nature. A numbered list on a scrap of paper can hold the same thinking in compressed form. The paper got thinner because the planning got deeper.<br>الخطط المكتوبة الرسمية مطلب تدريبي: بتجبر المدرس الجديد يجهّز بعمق وبتخلّي المدربين يحلّلوا مدى استيعاب المفاهيم الأساسية. مدرسين الخبرة استبطنوا نفس العناصر، الأهداف والمراحل والتوقيت والمشاكل، فإدخالها بقى طبيعة تانية. قايمة مرقمة على ورقة صغيرة ممكن تحمل نفس التفكير بشكل مضغوط. الورقة خفّت لأن التخطيط عمق.", "n": 1, "i": 77, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 4, choosing assessment tasks, tests and other ways to measure learning.</div><div class=\"u\">الدرس الجاي: الوحدة الرابعة، اختيار مهام التقييم، الاختبارات وطرق تانية لقياس التعلم.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 78}];</script>
