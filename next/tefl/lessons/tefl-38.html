<script>window.LESSON_ID="tefl-38";window.STEPS=[{"t": "section", "h": "Word stress | نبر الكلمة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Word stress is where we say part of a word with greater energy: more length and sound on its vowel sound.</div><div class=\"u\">نبر الكلمة هو إننا بنقول جزء من الكلمة بطاقة أكبر: طول وصوت أكتر على صوت المتحرك بتاعه.</div>", "n": 1, "i": 1, "a": "tefl-38-001", "x": "7a98361a"}, {"t": "learn", "h": "<div class=\"u\">Compare the stress in the vowel sounds of the stressed syllables and the other syllables in: pencil, photography, volunteer.</div><div class=\"u\">قارن النبر في أصوات المتحرك للمقاطع المنبّرة والمقاطع التانية في: قلم، تصوير، متطوع.</div>", "n": 1, "i": 2, "a": "tefl-38-002", "x": "6e0b7932"}, {"t": "learn", "h": "<div class=\"u\">Like English, there are many languages that give especially strong stress to one syllable in a word.</div><div class=\"u\">زي الإنجليزي، في لغات كتير بتدّي نبر قوي أوي لمقطع واحد في الكلمة.</div>", "n": 1, "i": 3, "a": "tefl-38-003", "x": "ca1b0fa2"}, {"t": "learn", "h": "<div class=\"u\">Other languages give equal length to all the syllables.</div><div class=\"u\">لغات تانية بتدّي طول متساوي لكل المقاطع.</div>", "n": 1, "i": 4, "a": "tefl-38-004", "x": "9057ca7a"}, {"t": "section", "h": "Sentence stress | نبر الجملة", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">Stress can also influence how sentences, and incomplete sentences, are pronounced.</div><div class=\"u\">النبر كمان بيأثر في إزاي الجمل، والجمل الناقصة، بتتنطق.</div>", "n": 1, "i": 6, "a": "tefl-38-005", "x": "e6b7bf1e"}, {"t": "learn", "h": "<div class=\"u\">We say different parts of the sentence with more or less stress: slower and louder, or quicker and more softly. This is called sentence stress.</div><div class=\"u\">بنقول أجزاء مختلفة من الجملة بنبر أكتر أو أقل: أبطأ وأعلى، أو أسرع وأهدى. ده بيتسمى نبر الجملة.</div>", "n": 1, "i": 7, "a": "tefl-38-006", "x": "ab48d316"}, {"t": "learn", "h": "<div class=\"u\">Generally, one word in the sentence will have a main stress. This is the word the speaker thinks is most important to the meaning.</div><div class=\"u\">عمومًا، كلمة واحدة في الجملة هيبقى ليها النبر الرئيسي. دي الكلمة اللي المتكلم شايفها أهم حاجة في المعنى.</div>", "n": 1, "i": 8, "a": "tefl-38-007", "x": "b9eb3e30"}, {"t": "learn", "h": "<div class=\"u\">Other words can have secondary stress. This is not as strong as main stress and falls on words less important to the meaning.</div><div class=\"u\">كلمات تانية ممكن يبقى ليها نبر ثانوي. ده مش بنفس قوة الرئيسي وبيقع على كلمات أقل أهمية في المعنى.</div>", "n": 1, "i": 9, "a": "tefl-38-008", "x": "cf0321cc"}, {"t": "learn", "h": "<div class=\"u\">Other words in the sentence are unstressed.</div><div class=\"u\">كلمات تانية في الجملة بتبقى غير منبّرة.</div>", "n": 1, "i": 10, "a": "tefl-38-009", "x": "eed5309e"}, {"t": "learn", "h": "<div class=\"u\">Example: in the spoken sentence she came home late last night, the main stress falls on late.</div><div class=\"u\">مثال: في الجملة المنطوقة هي رجعت البيت متأخر مبارح بالليل، النبر الرئيسي بيقع على متأخر.</div>", "n": 1, "i": 11, "a": "tefl-38-010", "x": "7c984c42"}, {"t": "learn", "h": "<div class=\"u\">The words with secondary stress would probably be came, home, last, night. The unstressed word is she.</div><div class=\"u\">الكلمات اللي ليها نبر ثانوي هتبقى غالبًا رجعت، بيت، مبارح، ليل. والكلمة غير المنبّرة هي هي.</div>", "n": 1, "i": 12, "a": "tefl-38-011", "x": "05d8b966"}, {"t": "learn", "h": "<div class=\"u\">But remember: it is possible to stress any word in a sentence if the speaker thinks it is important.</div><div class=\"u\">بس افتكر: ممكن تنبّر أي كلمة في الجملة لو المتكلم شايفها مهمة.</div>", "n": 1, "i": 13, "a": "tefl-38-012", "x": "a733111e"}, {"t": "section", "h": "Showing stress + stress pairs | إظهار النبر + أزواج النبر", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">Whether you focus on word stress or sentence stress, give the class guidance about the position of the stress in one of two ways.</div><div class=\"u\">سواء بتركّز على نبر الكلمة أو نبر الجملة، ادّي الفصل إرشاد عن مكان النبر بواحدة من طريقتين.</div>", "n": 1, "i": 15, "a": "tefl-38-013", "x": "ca549eb6"}, {"t": "learn", "h": "<div class=\"u\">Either write the word or sentence on the board and show the stress by using a symbol.</div><div class=\"u\">يا اكتب الكلمة أو الجملة على السبورة ووضّح النبر برمز.</div>", "n": 1, "i": 16, "a": "tefl-38-014", "x": "99ba6262"}, {"t": "learn", "h": "<div class=\"u\">Or use a hand to make a gesture, perhaps a chopping movement, to demonstrate where to place the stress when you say the word.</div><div class=\"u\">يا استخدم إيدك تعمل إشارة، ممكن حركة تقطيع، عشان توضّح فين النبر وإنت بتقول الكلمة.</div>", "n": 1, "i": 17, "a": "tefl-38-015", "x": "9a3d6d9e"}, {"t": "learn", "h": "<div class=\"u\">Many two-syllable words in English are spelt the same, but their meaning changes depending on the stress.</div><div class=\"u\">كلمات كتير ثنائية المقطع في الإنجليزي متكتبة نفس الشكل، بس معناها بيتغيّر حسب النبر.</div>", "n": 1, "i": 18, "a": "tefl-38-016", "x": "7567823f"}, {"t": "learn", "h": "<div class=\"u\">Example one: you will progress a lot with your English, the verb, versus you will make a lot of progress, the noun.</div><div class=\"u\">مثال واحد: هتتقدّم كتير في إنجليزيتك، الفعل، مقابل هتعمل تقدّم كتير، الاسم.</div>", "n": 1, "i": 19, "a": "tefl-38-017", "x": "60370631"}, {"t": "learn", "h": "<div class=\"u\">Example two: he rejected the plan, the verb, versus this bowl was a reject, so I bought it at half price, the noun.</div><div class=\"u\">مثال اتنين: هو رفض الخطة، الفعل، مقابل الطبق ده كان مرفوض، فاشتريته بنص التمن، الاسم.</div>", "n": 1, "i": 20, "a": "tefl-38-018", "x": "305ff1a3"}, {"t": "learn", "h": "<div class=\"u\">Example three: everyone was present at the meeting, the adjective, versus I will present my ideas to the company tomorrow, the verb.</div><div class=\"u\">مثال تلاتة: الكل كان موجود في الاجتماع، الصفة، مقابل هقدّم أفكاري للشركة بكرة، الفعل.</div>", "n": 1, "i": 21, "a": "tefl-38-019", "x": "a34c7ee3"}, {"t": "section", "h": "Word stress rules | قواعد نبر الكلمة", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">Now the key word stress rules. We stick to the simple rules, as many rules are full of exceptions.</div><div class=\"u\">دلوقتي قواعد نبر الكلمة الأساسية. بنلزم القواعد البسيطة، لأن قواعد كتير مليانة استثناءات.</div>", "n": 1, "i": 23, "a": "tefl-38-020", "x": "bdd459a5"}, {"t": "learn", "h": "<div class=\"u\">Rule one: one word has only one stress. One word cannot have two stresses.</div><div class=\"u\">قاعدة واحد: الكلمة الواحدة ليها نبر واحد بس. الكلمة الواحدة ماتقدرش يبقى ليها نبرين.</div>", "n": 1, "i": 24, "a": "tefl-38-021", "x": "76fe2187"}, {"t": "learn", "h": "<div class=\"u\">If you hear two stresses, you hear two words. Two stresses cannot be one word.</div><div class=\"u\">لو سمعت نبرين، يبقى إنت سامع كلمتين. نبرين مابيكونوش كلمة واحدة.</div>", "n": 1, "i": 25, "a": "tefl-38-022", "x": "fad06fbe"}, {"t": "learn", "h": "<div class=\"u\">It is true there can be a secondary stress in some words. But a secondary stress is much smaller than the main stress, and is only used in long words.</div><div class=\"u\">صحيح ممكن يكون في نبر ثانوي في بعض الكلمات. بس النبر الثانوي أصغر بكتير من الرئيسي، وبيستخدم بس في الكلمات الطويلة.</div>", "n": 1, "i": 26, "a": "tefl-38-023", "x": "6379ddc6"}, {"t": "learn", "h": "<div class=\"u\">Rule two: we can only stress vowels, not consonants.</div><div class=\"u\">قاعدة اتنين: نقدر ننبّر المتحركات بس، مش السواكن.</div>", "n": 1, "i": 27, "a": "tefl-38-024", "x": "88b4a21c"}, {"t": "section", "h": "Sentence stress rules | قواعد نبر الجملة", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Here are some key sentence stress rules.</div><div class=\"u\">دي شوية قواعد أساسية لنبر الجملة.</div>", "n": 1, "i": 29, "a": "tefl-38-025", "x": "b78213a3"}, {"t": "learn", "h": "<div class=\"u\">Rule one: content words are stressed. Content words carry meaning.</div><div class=\"u\">قاعدة واحد: كلمات المحتوى بتتنبّر. كلمات المحتوى بتحمل المعنى.</div>", "n": 1, "i": 30, "a": "tefl-38-026", "x": "c4f2b651"}, {"t": "learn", "h": "<div class=\"u\">Content words: main verbs, nouns, adjectives, adverbs, and negative auxiliaries like don't, can't, aren't.</div><div class=\"u\">كلمات المحتوى: الأفعال الرئيسية، الأسماء، الصفات، الأحوال، والأفعال المساعدة المنفية زي مش ومابيقدرش ومابيبقوش.</div>", "n": 1, "i": 31, "a": "tefl-38-027", "x": "224737e6"}, {"t": "learn", "h": "<div class=\"u\">Rule two: structure words are unstressed. Structure words are used for correct grammar.</div><div class=\"u\">قاعدة اتنين: كلمات التركيب مابتتنبّرش. كلمات التركيب بتستخدم للقواعد الصح.</div>", "n": 1, "i": 32, "a": "tefl-38-028", "x": "18f01a75"}, {"t": "learn", "h": "<div class=\"u\">Structure words: pronouns, prepositions, articles, conjunctions, and auxiliary or helping verbs like do, be, can, have, must.</div><div class=\"u\">كلمات التركيب: الضماير، حروف الجر، أدوات التعريف، حروف العطف، والأفعال المساعدة زي يعمل ويكون ويقدر وعنده ولازم.</div>", "n": 1, "i": 33, "a": "tefl-38-029", "x": "fd5273a2"}, {"t": "learn", "h": "<div class=\"u\">Rule three: the time between stressed words is always the same.</div><div class=\"u\">قاعدة تلاتة: الوقت بين الكلمات المنبّرة دايمًا واحد.</div>", "n": 1, "i": 34, "a": "tefl-38-030", "x": "86efbb64"}, {"t": "learn", "h": "<div class=\"u\">There is the odd exception to sentence stress rules, but far fewer than word stress exceptions.</div><div class=\"u\">في استثناء شاذ لقواعد نبر الجملة، بس أقل بكتير من استثناءات نبر الكلمة.</div>", "n": 1, "i": 35, "a": "tefl-38-031", "x": "67b29ff4"}, {"t": "learn", "h": "<div class=\"u\">We said structure words are unstressed. But look at the structure word she, which the speaker stresses for emphasis while confirming information: Lisa didn't do that, did she? Yes, she did.</div><div class=\"u\">قولنا كلمات التركيب مابتتنبّرش. بس بص على كلمة التركيب هي، اللي المتكلم بينبّرها للتأكيد وهو بيأكّد معلومة: ليزا ماعملتش كده، صح؟ لأ، هي عملت.</div>", "n": 1, "i": 36, "a": "tefl-38-032", "x": "7199f468"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 37}, {"t": "learn", "h": "<div class=\"u\">word stress: saying part of a word with greater energy.</div><div class=\"u\">نبر الكلمة: قول جزء من الكلمة بطاقة أكبر.</div>", "n": 1, "i": 38, "a": "tefl-38-033", "x": "a8550191"}, {"t": "learn", "h": "<div class=\"u\">sentence stress: saying parts of a sentence with more or less stress.</div><div class=\"u\">نبر الجملة: قول أجزاء من الجملة بنبر أكتر أو أقل.</div>", "n": 1, "i": 39, "a": "tefl-38-034", "x": "3b6d499e"}, {"t": "learn", "h": "<div class=\"u\">main stress: the strongest stress, on the most important word.</div><div class=\"u\">النبر الرئيسي: أقوى نبر، على الكلمة الأهم.</div>", "n": 1, "i": 40, "a": "tefl-38-035", "x": "e9473b38"}, {"t": "learn", "h": "<div class=\"u\">secondary stress: a smaller stress on less important words.</div><div class=\"u\">النبر الثانوي: نبر أصغر على كلمات أقل أهمية.</div>", "n": 1, "i": 41, "a": "tefl-38-036", "x": "8360dac2"}, {"t": "learn", "h": "<div class=\"u\">unstressed: said without stress.</div><div class=\"u\">غير منبّر: متقال من غير نبر.</div>", "n": 1, "i": 42, "a": "tefl-38-037", "x": "349ad260"}, {"t": "learn", "h": "<div class=\"u\">content words: words that carry meaning.</div><div class=\"u\">كلمات المحتوى: كلمات بتحمل المعنى.</div>", "n": 1, "i": 43, "a": "tefl-38-038", "x": "df0b372d"}, {"t": "learn", "h": "<div class=\"u\">structure words: words used for correct grammar.</div><div class=\"u\">كلمات التركيب: كلمات بتستخدم للقواعد الصح.</div>", "n": 1, "i": 44, "a": "tefl-38-039", "x": "c8404a3a"}, {"t": "learn", "h": "<div class=\"u\">auxiliary verb: a helping verb like do, be, can, have, must.</div><div class=\"u\">الفعل المساعد: فعل بيساعد زي يعمل ويكون ويقدر وعنده ولازم.</div>", "n": 1, "i": 45, "a": "tefl-38-040", "x": "cd57984c"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 46}, {"t": "learn", "h": "<div class=\"u\">Word stress gives one syllable more energy: more length and sound on its vowel.</div><div class=\"u\">نبر الكلمة بيدّي مقطع واحد طاقة أكتر: طول وصوت أكتر على متحركه.</div>", "n": 1, "i": 47, "a": "tefl-38-041", "x": "af621f28"}, {"t": "learn", "h": "<div class=\"u\">Sentence stress gives the most important word the main stress; others get secondary stress or none.</div><div class=\"u\">نبر الجملة بيدّي الكلمة الأهم النبر الرئيسي؛ والتانية بتاخد نبر ثانوي أو لاشيء.</div>", "n": 1, "i": 48, "a": "tefl-38-042", "x": "7d0fd7ac"}, {"t": "learn", "h": "<div class=\"u\">Same spelling can change meaning with stress: progress, reject, present.</div><div class=\"u\">نفس الهجاء ممكن يغيّر المعنى مع النبر: تقدّم، مرفوض، حاضر.</div>", "n": 1, "i": 49, "a": "tefl-38-043", "x": "efaf235d"}, {"t": "learn", "h": "<div class=\"u\">One word, one stress, and only on vowels. Content words stressed, structure words unstressed.</div><div class=\"u\">كلمة واحدة، نبر واحد، وعلى المتحركات بس. كلمات المحتوى منبّرة، وكلمات التركيب لأ.</div>", "n": 1, "i": 50, "a": "tefl-38-044", "x": "29797e5b"}, {"t": "learn", "h": "<div class=\"u\">The time between stressed words stays the same, and any word can be stressed for emphasis.</div><div class=\"u\">الوقت بين الكلمات المنبّرة بيفضل واحد، وأي كلمة ممكن تتنبّر للتأكيد.</div>", "n": 1, "i": 51, "a": "tefl-38-045", "x": "368cd40e"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 52}, {"t": "tf", "q": "One word has only one stress.<br>الكلمة الواحدة ليها نبر واحد بس.", "ans": true, "why": "True. If you hear two stresses, you hear two words. | صح. لو سمعت نبرين، يبقى إنت سامع كلمتين.", "ex": ["Correct. | صح.", "Wrong. Two stresses means two words. | غلط: نبرين يعني كلمتين."], "n": 1, "i": 53, "h": ""}, {"t": "tf", "q": "We can stress consonants as well as vowels.<br>نقدر ننبّر السواكن زي المتحركات.", "ans": false, "why": "False. We can only stress vowels, not consonants. | غلط. نقدر ننبّر المتحركات بس، مش السواكن.", "ex": ["Wrong. Only vowels take stress. | غلط: المتحركات بس بتتنبّر.", "Correct. | صح."], "n": 1, "i": 54, "h": ""}, {"t": "mc", "q": "In she came home late last night, the main stress usually falls on:<br>في هي رجعت البيت متأخر مبارح بالليل، النبر الرئيسي غالبًا بيقع على:", "opts": ["late | متأخر", "she | هي", "came | رجعت"], "ans": 0, "why": "Late is the word most important to the meaning; she is unstressed, came has secondary stress. | متأخر هي الكلمة الأهم في المعنى؛ هي غير منبّرة، ورجعت ليها نبر ثانوي.", "ex": ["Correct. | صح.", "No. She is the unstressed word. | غلط: هي هي الكلمة غير المنبّرة.", "No. Came has secondary stress. | غلط: رجعت ليها نبر ثانوي."], "n": 1, "i": 55, "h": ""}, {"t": "mc", "q": "Content words include:<br>كلمات المحتوى بتشمل:", "opts": ["nouns, main verbs, adjectives, adverbs | أسماء، أفعال رئيسية، صفات، أحوال", "pronouns and articles | ضماير وأدوات تعريف", "prepositions and conjunctions | حروف جر وعطف"], "ans": 0, "why": "Content words carry meaning; the other two groups are structure words. | كلمات المحتوى بتحمل المعنى؛ المجموعتين التانيين كلمات تركيب.", "ex": ["Correct. | صح.", "No. Those are structure words. | غلط: دول كلمات تركيب.", "No. Those are structure words too. | غلط: دول كمان كلمات تركيب."], "n": 1, "i": 56, "h": ""}, {"t": "mc", "q": "Structure words are normally:<br>كلمات التركيب عادة:", "opts": ["unstressed | غير منبّرة", "main-stressed | منبّرة نبر رئيسي", "said louder | متقالة أعلى"], "ans": 0, "why": "Structure words serve grammar and stay unstressed, unless emphasised on purpose. | كلمات التركيب بتخدم القواعد وبتفضل غير منبّرة، إلا لو متأكّدة قصدًا.", "ex": ["Correct. | صح.", "No. That belongs to the key content word. | غلط: ده لكلمة المحتوى الأساسية.", "No. They are usually quicker and softer. | غلط: عادة أسرع وأهدى."], "n": 1, "i": 57, "h": ""}, {"t": "tf", "q": "The time between stressed words in a sentence is always the same.<br>الوقت بين الكلمات المنبّرة في الجملة دايمًا واحد.", "ans": true, "why": "True. English keeps a constant beat on the stressed words. | صح. الإنجليزي بيحافظ على إيقاع ثابت على الكلمات المنبّرة.", "ex": ["Correct. | صح.", "Wrong. The beat stays constant. | غلط: الإيقاع بيفضل ثابت."], "n": 1, "i": 58, "h": ""}, {"t": "mc", "q": "PROgress with the stress on the first syllable is:<br>تقدّم بنبر على المقطع الأول هي:", "opts": ["a noun | اسم", "a verb | فعل", "an adjective | صفة"], "ans": 0, "why": "Stress on the first syllable gives the noun: you will make a lot of progress. | النبر على المقطع الأول بيدّي الاسم: هتعمل تقدّم كتير.", "ex": ["Correct. | صح.", "No. The verb stresses the second syllable. | غلط: الفعل بينبّر المقطع التاني.", "No. This pair is noun versus verb. | غلط: الزوج ده اسم مقابل فعل."], "n": 1, "i": 59, "h": ""}, {"t": "tf", "q": "It is impossible to stress a structure word in a sentence.<br>مستحيل تنبّر كلمة تركيب في الجملة.", "ans": false, "why": "False. You can stress any word for emphasis: yes, she did. | غلط. تقدر تنبّر أي كلمة للتأكيد: لأ، هي عملت.", "ex": ["Wrong. Emphasis can stress any word. | غلط: التأكيد ممكن ينبّر أي كلمة.", "Correct. | صح."], "n": 1, "i": 60, "h": ""}, {"t": "recall", "q": "Name the two key word stress rules.<br>اذكر قاعدتي نبر الكلمة الأساسيتين.", "a": "One word has only one stress, and we can only stress vowels, not consonants.<br>الكلمة الواحدة ليها نبر واحد بس، ونقدر ننبّر المتحركات بس، مش السواكن.", "n": 1, "i": 61, "h": ""}, {"t": "recall", "q": "Which word classes are content words, and which are structure words?<br>أنهي فئات كلمات هي كلمات محتوى، وأنهي هي كلمات تركيب؟", "a": "Content words: main verbs, nouns, adjectives, adverbs and negative auxiliaries. Structure words: pronouns, prepositions, articles, conjunctions and auxiliary verbs.<br>كلمات المحتوى: الأفعال الرئيسية، الأسماء، الصفات، الأحوال والمساعدات المنفية. كلمات التركيب: الضماير، حروف الجر، أدوات التعريف، حروف العطف والأفعال المساعدة.", "n": 1, "i": 62, "h": ""}, {"t": "write", "q": "Why does word stress matter for learners? (3-4 sentences)<br>ليه نبر الكلمة مهم للمتعلمين؟ (٣-٤ جمل).", "key": "tefl-38:1", "a": "English gives one syllable of a word much more energy than the rest, and listeners expect it. If a learner stresses the wrong syllable, the word can become hard to recognise. With same-spelling pairs like progress and reject, the wrong stress can even change the meaning, from noun to verb. So teaching stress is teaching the word itself, not decoration on top of it.<br>الإنجليزي بيدّي مقطع واحد من الكلمة طاقة أكبر بكتير من الباقي، والسامعين متوقعين كده. لو المتعلم نبّر المقطع الغلط، الكلمة ممكن تبقى صعبة تتعرف. ومع الأزواج بنفس الهجاء زي تقدّم ومرفوض، النبر الغلط ممكن حتى يغيّر المعنى، من اسم لفعل. فتعليم النبر هو تعليم الكلمة نفسها، مش زينة فوقيها.", "n": 1, "i": 63, "h": ""}, {"t": "write", "q": "Explain the difference between content words and structure words in sentence stress (3-4 sentences).<br>اشرح الفرق بين كلمات المحتوى وكلمات التركيب في نبر الجملة (٣-٤ جمل).", "key": "tefl-38:2", "a": "Content words carry the meaning: main verbs, nouns, adjectives, adverbs and negative auxiliaries, and they take the stress. Structure words serve the grammar: pronouns, prepositions, articles, conjunctions and auxiliary verbs, and they stay unstressed, said quicker and more softly. The time between the stressed words stays constant, so the structure words get squeezed. That squeeze is the music of an English sentence.<br>كلمات المحتوى بتحمل المعنى: الأفعال الرئيسية، الأسماء، الصفات، الأحوال والمساعدات المنفية، وهي اللي بتاخد النبر. كلمات التركيب بتخدم القواعد: الضماير، حروف الجر، أدوات التعريف، حروف العطف والأفعال المساعدة، وبتفضل غير منبّرة، بتتقال أسرع وأهدى. الوقت بين الكلمات المنبّرة بيفضل ثابت، فكلمات التركيب بتتعصر. العصر ده هو موسيقى الجملة الإنجليزية.", "n": 1, "i": 64, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: intonation, rhythm, and linking.</div><div class=\"u\">الدرس الجاي: التنغيم والإيقاع والربط.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 65}];</script>
