<h1>عالم تيفل ٣٦: الوعي الفونيمي</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٣٦</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>
<a class="pdf-link" href="../pdf/tefl-36.pdf" target="_blank" rel="noopener">📄 حمّل PDF الدرس</a>

<script>window.LESSON_ID="tefl-36";window.STEPS=[{"t": "section", "h": "What it is and decoding | يعني إيه وفك التشفير", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Phonemic awareness relates to the correspondences between letters or groups of letters and the sounds they represent.</div><div class=\"u\">الوعي الفونيمي بيتعلّق بالتطابق بين الحروف أو مجموعات الحروف والأصوات اللي بيمثلوها.</div>", "n": 1, "i": 1, "a": "tefl-36-001", "x": "65527544"}, {"t": "learn", "h": "<div class=\"u\">If learners do not first become phonologically aware, later instruction in phonemic awareness and decoding will not make sense.</div><div class=\"u\">لو المتعلمين مابقوش واعيين صوتيًا الأول، التعليم اللاحق في الوعي الفونيمي وفك التشفير مش هيبقى ليه معنى.</div>", "n": 1, "i": 2, "a": "tefl-36-002", "x": "726112cb"}, {"t": "learn", "h": "<div class=\"u\">Learners with phonemic awareness can break up words into their different sounds. They can also join sounds together to make words.</div><div class=\"u\">المتعلمين أصحاب الوعي الفونيمي يقدروا يكسّروا الكلمات لأصواتها المختلفة. ويقدروا كمان يجمعوا الأصوات مع بعض عشان يعملوا كلمات.</div>", "n": 1, "i": 3, "a": "tefl-36-003", "x": "5e5f7fea"}, {"t": "learn", "h": "<div class=\"u\">It helps beginning readers see the links between spoken and written words.</div><div class=\"u\">بيساعد القرّاء المبتدئين يشوفوا الروابط بين الكلمات المنطوقة والمكتوبة.</div>", "n": 1, "i": 4, "a": "tefl-36-004", "x": "ca859261"}, {"t": "learn", "h": "<div class=\"u\">Once they grasp this, they can recognise familiar words quickly and can have a go at figuring out new words.</div><div class=\"u\">أول ما يستوعبوا ده، يقدروا يتعرّفوا على الكلمات المألوفة بسرعة ويجرّبوا يطلّعوا كلمات جديدة.</div>", "n": 1, "i": 5, "a": "tefl-36-005", "x": "de47fb78"}, {"t": "learn", "h": "<div class=\"u\">Research shows that progress in learning to read depends on how much phonological and phonemic awareness learners have.</div><div class=\"u\">الأبحاث بتوضح إن التقدم في تعلم القراية بيعتمد على قد إيه عند المتعلمين وعي صوتي وفونيمي.</div>", "n": 1, "i": 6, "a": "tefl-36-006", "x": "0ea34ebd"}, {"t": "learn", "h": "<div class=\"u\">Remember this: phonemic awareness aims to help learners see the correspondence between letters and sounds.</div><div class=\"u\">افتكر ده: الوعي الفونيمي بيهدف يساعد المتعلمين يشوفوا التطابق بين الحروف والأصوات.</div>", "n": 1, "i": 7, "a": "tefl-36-007", "x": "a5b2a1b6"}, {"t": "learn", "h": "<div class=\"u\">When they see a letter, or sometimes a group of letters, they learn that these symbols represent speech sounds heard in words.</div><div class=\"u\">لما يشوفوا حرف، أو ساعات مجموعة حروف، بيتعلّموا إن الرموز دي بتمثل أصوات كلام متسموعة في كلمات.</div>", "n": 1, "i": 8, "a": "tefl-36-008", "x": "e39db912"}, {"t": "learn", "h": "<div class=\"u\">When learners break up a word into sounds, this is called decoding.</div><div class=\"u\">لما المتعلمين يكسّروا كلمة لأصوات، ده بيتسمى فك التشفير.</div>", "n": 1, "i": 9, "a": "tefl-36-009", "x": "f141adc5"}, {"t": "learn", "h": "<div class=\"u\">The end goal is for the learner to join the individual sounds in a word and then utter the word as a whole.</div><div class=\"u\">الهدف النهائي إن المتعلم يجمع الأصوات المفردة في الكلمة وبعدين ينطق الكلمة كوحدة كاملة.</div>", "n": 1, "i": 10, "a": "tefl-36-010", "x": "9f6ed56c"}, {"t": "learn", "h": "<div class=\"u\">Inexperienced teachers get confused between phonemic awareness and pronunciation, and often use the word pronunciation as a label for all aspects of sound production in the classroom. This is wrong.</div><div class=\"u\">المدرسين قليلي الخبرة بيتلخبطوا بين الوعي الفونيمي والنطق، وفي الغالب بيستخدموا كلمة نطق كعنوان لكل جوانب إنتاج الصوت في الفصل. ده غلط.</div>", "n": 1, "i": 11, "a": "tefl-36-011", "x": "093ff170"}, {"t": "learn", "h": "<div class=\"u\">Phonemic awareness is the teaching of sounds as part of decoding letters in words to decipher the individual sounds.</div><div class=\"u\">الوعي الفونيمي هو تعليم الأصوات كجزء من فك تشفير حروف الكلمات عشان نطلّع الأصوات المفردة.</div>", "n": 1, "i": 12, "a": "tefl-36-012", "x": "b0cb0f95"}, {"t": "learn", "h": "<div class=\"u\">Pronunciation is different. It refers to how a person articulates specific sounds.</div><div class=\"u\">النطق حاجة مختلفة. بيشير لإزاي الشخص بيلفظ أصوات معينة.</div>", "n": 1, "i": 13, "a": "tefl-36-013", "x": "a8ac975a"}, {"t": "section", "h": "Why English decoding is tricky | ليه فك التشفير في الإنجليزي صعب", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">Decoding, the deciphering of individual words, is of great importance.</div><div class=\"u\">فك التشفير، تفكيك الكلمات المفردة، حاجة مهمة جدًا.</div>", "n": 1, "i": 15, "a": "tefl-36-014", "x": "72ecc345"}, {"t": "learn", "h": "<div class=\"u\">In English, decoding can be tricky because of the exceptions between sound and symbol correspondence.</div><div class=\"u\">في الإنجليزي، فك التشفير ممكن يبقى صعب بسبب الاستثناءات في التطابق بين الصوت والرمز.</div>", "n": 1, "i": 16, "a": "tefl-36-015", "x": "8b5f5d5d"}, {"t": "learn", "h": "<div class=\"u\">English differs from other languages like Spanish, which has a straight one-to-one sound and letter correspondence.</div><div class=\"u\">الإنجليزي بيختلف عن لغات زي الإسباني، اللي فيها تطابق مباشر واحد لواحد بين الصوت والحرف.</div>", "n": 1, "i": 17, "a": "tefl-36-016", "x": "7b6e6dff"}, {"t": "learn", "h": "<div class=\"u\">Learners of English can find this very tricky, as there may be no indication of how the letter symbol should be pronounced.</div><div class=\"u\">متعلمين الإنجليزي ممكن يلاقوا ده صعب أوي، لأن ممكن ميكونش في أي إشارة لإزاي رمز الحرف المفروض يتنطق.</div>", "n": 1, "i": 18, "a": "tefl-36-017", "x": "d6015f6f"}, {"t": "learn", "h": "<div class=\"u\">For example, the letter c can be a hard sound, /k/, as in can, cake, cage.</div><div class=\"u\">مثال، حرف السي ممكن يبقى صوت خشن، كاف، زي في يقدر، كيك، قفص.</div>", "n": 1, "i": 19, "a": "tefl-36-018", "x": "b485c0ce"}, {"t": "learn", "h": "<div class=\"u\">Or it can be a soft sound, /s/, as in cent, circle, city.</div><div class=\"u\">أو يبقى صوت ناعم، سين، زي في سنت، دايرة، مدينة.</div>", "n": 1, "i": 20, "a": "tefl-36-019", "x": "3dc91db3"}, {"t": "section", "h": "Key points 1-3 | النقاط الأساسية ١-٣", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">Here are the key points to remember when enhancing phonemic awareness.</div><div class=\"u\">دي النقاط الأساسية اللي تفتكرها وإنت بتعزّز الوعي الفونيمي.</div>", "n": 1, "i": 22, "a": "tefl-36-020", "x": "abed57ed"}, {"t": "learn", "h": "<div class=\"u\">Point one: the end goal is the understanding of meaning, not phonemic awareness.</div><div class=\"u\">نقطة واحد: الهدف النهائي هو فهم المعنى، مش الوعي الفونيمي.</div>", "n": 1, "i": 23, "a": "tefl-36-021", "x": "dff03632"}, {"t": "learn", "h": "<div class=\"u\">Phonemic awareness instruction is a key objective to meet on the way to the goal of reading comprehension. It is not an end goal in itself.</div><div class=\"u\">تعليم الوعي الفونيمي هدف مهم في الطريق لهدف فهم المقروء. مش هدف نهائي في حد ذاته.</div>", "n": 1, "i": 24, "a": "tefl-36-022", "x": "7d719c71"}, {"t": "learn", "h": "<div class=\"u\">Point two: in some schools, a full phonemic awareness approach early in the programme may be the norm.</div><div class=\"u\">نقطة اتنين: في بعض المدارس، منهج الوعي الفونيمي الكامل بدري في البرنامج ممكن يكون هو المتبع.</div>", "n": 1, "i": 25, "a": "tefl-36-023", "x": "34c80d98"}, {"t": "learn", "h": "<div class=\"u\">If school leaders have set this down, there is not much you can do about it, at least until you have been there some time.</div><div class=\"u\">لو قيادات المدرسة قررت ده، مفيش كتير تقدر تعمله، على الأقل لحد ما تقعد شوية.</div>", "n": 1, "i": 26, "a": "tefl-36-024", "x": "33906b47"}, {"t": "learn", "h": "<div class=\"u\">But if this approach is followed just because that is the way it has always been done, there may be some room for manoeuvre.</div><div class=\"u\">بس لو المنهج متبع بس لأن ده اللي متعمل دايمًا، ساعتها ممكن يكون في مجال للمناورة.</div>", "n": 1, "i": 27, "a": "tefl-36-025", "x": "f460ecf6"}, {"t": "learn", "h": "<div class=\"u\">The problem with a full phonemic awareness approach is that it is unlikely to work well in the early stages of learning.</div><div class=\"u\">مشكلة منهج الوعي الفونيمي الكامل إنه غالبًا مش هيشتغل كويس في المراحل الأولى من التعلم.</div>", "n": 1, "i": 28, "a": "tefl-36-026", "x": "52cc8b28"}, {"t": "learn", "h": "<div class=\"u\">At that stage learners have limited word meanings in English and lack oral proficiency.</div><div class=\"u\">في المرحلة دي المتعلمين عندهم معاني كلمات محدودة في الإنجليزي وبينقصهم الإتقان الشفهي.</div>", "n": 1, "i": 29, "a": "tefl-36-027", "x": "c4d2b94a"}, {"t": "learn", "h": "<div class=\"u\">Unlike native-English learners, they do not know lots of chunks and phrases already picked up from songs, stories, rhymes, and chat from parents, carers, and siblings.</div><div class=\"u\">على عكس متعلمين الإنجليزي أهل اللغة، هُم مابيعرفوش كتل وتعبيرات كتير متلموعة أصلًا من أغاني وحكايات وأناشيد ودردشة الأهل والإخوات.</div>", "n": 1, "i": 30, "a": "tefl-36-028", "x": "66af10e1"}, {"t": "learn", "h": "<div class=\"u\">It will be wise to remember this.</div><div class=\"u\">هيبقى حكمة إنك تفتكر ده.</div>", "n": 1, "i": 31, "a": "tefl-36-029", "x": "1d71eeea"}, {"t": "learn", "h": "<div class=\"u\">Point three: some teachers often overemphasise the role of phonemic awareness.</div><div class=\"u\">نقطة تلاتة: بعض المدرسين في الغالب بيبالغوا في دور الوعي الفونيمي.</div>", "n": 1, "i": 32, "a": "tefl-36-030", "x": "ead79c61"}, {"t": "learn", "h": "<div class=\"u\">Perhaps because they and the learners enjoy it. Or perhaps it is a comfort zone the teacher stays in too long.</div><div class=\"u\">يمكن لأنه هُم والمتعلمين بيستمتعوا بيه. أو يمكن لأنه منطقة راحة للمدرس بيفضل فيها أكتر من اللازم.</div>", "n": 1, "i": 33, "a": "tefl-36-031", "x": "c244051a"}, {"t": "learn", "h": "<div class=\"u\">The problem is that when phonemic awareness gets more emphasis than meaning and comprehension, learners may lose sight that they are reading words.</div><div class=\"u\">المشكلة إن لما الوعي الفونيمي ياخد تأكيد أكتر من المعنى والفهم، المتعلمين ممكن ينسوا إنهم بيقروا كلمات.</div>", "n": 1, "i": 34, "a": "tefl-36-032", "x": "afa26844"}, {"t": "learn", "h": "<div class=\"u\">Decoding is very important, but it must not replace meaning and comprehension. Phonics teaching should enhance comprehension; it should not usurp the main goal of comprehension.</div><div class=\"u\">فك التشفير مهم جدًا، بس مينفعش ياخد مكان المعنى والفهم. تعليم الفونكس المفروض يعزّز الفهم؛ مينفعش يغتصب الهدف الأساسي: الفهم.</div>", "n": 1, "i": 35, "a": "tefl-36-033", "x": "cb889c12"}, {"t": "section", "h": "Key points 4-6 | النقاط الأساسية ٤-٦", "n": 1, "i": 36}, {"t": "learn", "h": "<div class=\"u\">Point four: never ask learners to decode a word where they do not know its meaning. Focus on words they already know.</div><div class=\"u\">نقطة أربعة: أبدًا ماتطلب من المتعلمين يفكّوا تشفير كلمة مابيعرفوش معناها. ركّز على كلمات هُم عارفينها أصلًا.</div>", "n": 1, "i": 37, "a": "tefl-36-034", "x": "e15cc2a6"}, {"t": "learn", "h": "<div class=\"u\">Point five: phonemic awareness instruction should be tackled briskly and relevantly.</div><div class=\"u\">نقطة خمسة: تعليم الوعي الفونيمي المفروض يتعمل بنشاط وارتباط بالسياق.</div>", "n": 1, "i": 38, "a": "tefl-36-035", "x": "164a9177"}, {"t": "learn", "h": "<div class=\"u\">It should always take place in activities which are relevant and have a purpose.</div><div class=\"u\">لازم دايمًا يحصل في أنشطة مناسبة وليها هدف.</div>", "n": 1, "i": 39, "a": "tefl-36-036", "x": "718f0ac1"}, {"t": "learn", "h": "<div class=\"u\">Learners should not be involved in phonics instruction that isolates letters and sounds from meaningful use in text.</div><div class=\"u\">المتعلمين المفروض مابيدخلوش في تعليم فونكس بيعزل الحروف والأصوات عن الاستخدام المعنوي في النص.</div>", "n": 1, "i": 40, "a": "tefl-36-037", "x": "3294f565"}, {"t": "learn", "h": "<div class=\"u\">Point six: it should emphasise chunks and patterns in words that learners will recognise when reading other words with similar chunks and patterns.</div><div class=\"u\">نقطة ستة: المفروض يؤكّد على الكتل والأنماط في الكلمات اللي المتعلمين هيتعرّفوا عليها لما يقروا كلمات تانية بكتل وأنماط مشابهة.</div>", "n": 1, "i": 41, "a": "tefl-36-038", "x": "672572e4"}, {"t": "section", "h": "Activities 1-4 | الأنشطة ١-٤", "n": 1, "i": 42}, {"t": "learn", "h": "<div class=\"u\">Now the activities. Here is a mix of phonological and phonemic awareness activities, because you will often interlink the two.</div><div class=\"u\">دلوقتي الأنشطة. دي خليطة من أنشطة الوعي الصوتي والفونيمي، لأنك غالبًا هتربط الاتنين ببعض كتير.</div>", "n": 1, "i": 43, "a": "tefl-36-039", "x": "49ee87e3"}, {"t": "learn", "h": "<div class=\"u\">A variety of activities and lots of practice are the keys to success. Explore what is best for the need, and remember, make it fun.</div><div class=\"u\">تنوّع الأنشطة والتدريب الكتير هُم مفاتيح النجاح. استكشف الأنسب للاحتياج، وافتكر، خلّيه ممتع.</div>", "n": 1, "i": 44, "a": "tefl-36-040", "x": "851812be"}, {"t": "learn", "h": "<div class=\"u\">Activity one, listen and imitate: learners listen to a model, you or a recording, and repeat or imitate it.</div><div class=\"u\">نشاط واحد، اسمع وقلّد: المتعلمين بيسمعوا نموذج، إنت أو تسجيل، وبيكرّروا أو بيقلّدوه.</div>", "n": 1, "i": 45, "a": "tefl-36-041", "x": "744cf889"}, {"t": "learn", "h": "<div class=\"u\">For example, break a word into its syllable parts and notice the change in mouth and lip movements.</div><div class=\"u\">مثال، كسّر كلمة لمقاطعها ولاحظ التغيّر في حركة البؤ والشفايف.</div>", "n": 1, "i": 46, "a": "tefl-36-042", "x": "a31ac866"}, {"t": "learn", "h": "<div class=\"u\">Activity two, minimal pairs: check if learners can distinguish between minimal pairs. A minimal pair is a pair of words that differ in only one phoneme.</div><div class=\"u\">نشاط اتنين، الأزواج الطفيفة: اتأكد إن المتعلمين بيفرّقوا بين الأزواج الطفيفة. الزوج الطفيف هو زوج كلمات بيختلفوا في فونيم واحد بس.</div>", "n": 1, "i": 47, "a": "tefl-36-043", "x": "44f92c20"}, {"t": "learn", "h": "<div class=\"u\">Common minimal pairs: ship and sheep, pin and pen, buy and boy, hut and hat.</div><div class=\"u\">أزواج طفيفة شائعة: مركب وخروف، دبوس وقلم، يشتري وولد، كوخ وقبعة.</div>", "n": 1, "i": 48, "a": "tefl-36-044", "x": "ab290408"}, {"t": "learn", "h": "<div class=\"u\">Activity three, contextualised minimal pairs: establish a context, like a blacksmith shoeing a horse, and present key vocabulary.</div><div class=\"u\">نشاط تلاتة، الأزواج الطفيفة في سياق: جهّز سياق، زي حداد بيركّب حدوة لحصان، وقدّم المفردات الأساسية.</div>", "n": 1, "i": 49, "a": "tefl-36-045", "x": "505c7dea"}, {"t": "learn", "h": "<div class=\"u\">Learners respond to a sentence stem with the right meaningful response. Stem: the blacksmith hits, or heats, the horseshoe. Cued response: with the hammer, or in the fire.</div><div class=\"u\">المتعلمين بيردّوا على بداية جملة بالرد المعنوي الصح. البداية: الحداد يضرب، أو يسخّن، الحدوة. الرد الموجّه: بالمطرقة، أو في النار.</div>", "n": 1, "i": 50, "a": "tefl-36-046", "x": "2ce5c6e1"}, {"t": "learn", "h": "<div class=\"u\">Activity four, visual aids: for sound formation, use a sketch of the mouth or a colour wall chart, and describe the pronunciation of a sound in terms of lips, tongue, teeth, and so on.</div><div class=\"u\">نشاط أربعة، الوسايل البصرية: لتكوين الصوت، استخدم رسمة للبؤ أو لوحة حيطة ملونة، واوصف نطق الصوت من حيث الشفايف واللسان والسنان وهكذا.</div>", "n": 1, "i": 51, "a": "tefl-36-047", "x": "13f9030b"}, {"t": "section", "h": "Activities 5-8 | الأنشطة ٥-٨", "n": 1, "i": 52}, {"t": "learn", "h": "<div class=\"u\">Activity five, tongue twisters: a technique from speech correction for native speakers. A famous example: she sells seashells by the seashore.</div><div class=\"u\">نشاط خمسة، كاسرات اللسان: تقنية من تصحيح الكلام لأهل اللغة. مثال مشهور: هي بتبيع صدف على شط البحر.</div>", "n": 1, "i": 53, "a": "tefl-36-048", "x": "fba18ff1"}, {"t": "learn", "h": "<div class=\"u\">You could make up your own twisters. Rhymes and jingles are also effective, as are chants.</div><div class=\"u\">تقدر تعمل كاسرات بتاعتك بنفسك. الأناشيد والأغاني القصيرة كمان فعّالة، وزيها الترديدات.</div>", "n": 1, "i": 54, "a": "tefl-36-049", "x": "34d225a8"}, {"t": "learn", "h": "<div class=\"u\">Activity six, drilling: imitation drills with repetition of sounds, words, and sentences, and varied repetition, with varied speed, volume, and mood.</div><div class=\"u\">نشاط ستة، التدريب المتكرر: تدريبات تقليد بتكرار أصوات وكلمات وجمل، وتكرار متنوّع، بسرعة وعلو صوت ومزاج متنوّعين.</div>", "n": 1, "i": 55, "a": "tefl-36-050", "x": "3379192a"}, {"t": "learn", "h": "<div class=\"u\">Activity seven, linking: link the sound to a word they already know.</div><div class=\"u\">نشاط سبعة، الربط: اربط الصوت بكلمة هُم عارفينها أصلًا.</div>", "n": 1, "i": 56, "a": "tefl-36-051", "x": "89c30be4"}, {"t": "learn", "h": "<div class=\"u\">For example, they may find the sound in cheese easy, but difficult in the middle of purchase. Reminding them of cheese helps them form it correctly in purchase.</div><div class=\"u\">مثال، ممكن يلاقوا الصوت في جبنة سهل، بس صعب في نص شراء. تذكيرهم بجبنة بيساعدهم يطلّعوه صح في شراء.</div>", "n": 1, "i": 57, "a": "tefl-36-052", "x": "fef9d7e3"}, {"t": "learn", "h": "<div class=\"u\">Activity eight, same or different: read a short list of three words to the learners.</div><div class=\"u\">نشاط تمانية، نفسها ولا مختلفة: اقرا للمتعلمين قايمة صغيرة من تلات كلمات.</div>", "n": 1, "i": 58, "a": "tefl-36-053", "x": "38cf7316"}, {"t": "learn", "h": "<div class=\"u\">They say same if all the words are the same, and different if there is a different word. They do not see the list.</div><div class=\"u\">بيقولوا نفسها لو الكلمات كلها واحدة، ومختلفة لو في كلمة مختلفة. هُم مش شايفين القايمة.</div>", "n": 1, "i": 59, "a": "tefl-36-054", "x": "89e5967d"}, {"t": "learn", "h": "<div class=\"u\">Examples: sit, sat, seat. Or: ship, sheep, ship.</div><div class=\"u\">أمثلة: يقعد، جلس، مقعد. أو: مركب، خروف، مركب.</div>", "n": 1, "i": 60, "a": "tefl-36-055", "x": "2278fa87"}, {"t": "section", "h": "Activities 9-11 + questions | الأنشطة ٩-١١ + الأسئلة", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">Activity nine, stop me: like the previous one, but learners stop you when you use a different sound: ship, ship, ship, ship, ship, sheep.</div><div class=\"u\">نشاط تسعة، وقّفني: زي اللي فات، بس المتعلمين بيوقّفوك لما تستخدم صوت مختلف: مركب، مركب، مركب، مركب، مركب، خروف.</div>", "n": 1, "i": 62, "a": "tefl-36-056", "x": "37d9bb0a"}, {"t": "learn", "h": "<div class=\"u\">Activity ten, listen: place minimal pairs in sentences so learners listen carefully and decide which word is being used. Both words must make sense in the context.</div><div class=\"u\">نشاط عشرة، اسمع: حط الأزواج الطفيفة في جمل عشان المتعلمين يسمعوا بتركيز ويقرّروا أنهي كلمة متستخدمة. لازم الكلمتين يبقى ليهم معنى في السياق.</div>", "n": 1, "i": 63, "a": "tefl-36-057", "x": "cd2618f8"}, {"t": "learn", "h": "<div class=\"u\">Examples: come here and have a look at this lock, or rock. If you sit up straight you will not slip, or sleep. He came to ask me about his cut, or cat.</div><div class=\"u\">أمثلة: تعالى هنا بص على القفل ده، أو الصخرة. لو قعدت معدّل مش هتنزلق، أو تنام. جه يسألني عن الجرح بتاعه، أو القطة.</div>", "n": 1, "i": 64, "a": "tefl-36-058", "x": "f67ea8ca"}, {"t": "learn", "h": "<div class=\"u\">Activity eleven, pictures: pictures can be very effective with learners of all ages.</div><div class=\"u\">نشاط حداشر، الصور: الصور ممكن تكون فعّالة جدًا مع المتعلمين من كل الأعمار.</div>", "n": 1, "i": 65, "a": "tefl-36-059", "x": "24be39ab"}, {"t": "learn", "h": "<div class=\"u\">Learners have pairs of pictures in front of them, like ship and sheep. When you say a word or read a sentence, they point to the right picture.</div><div class=\"u\">المتعلمين قدامهم أزواج صور، زي مركب وخروف. لما تقول كلمة أو تقرا جملة، بيشاوروا على الصورة الصح.</div>", "n": 1, "i": 66, "a": "tefl-36-060", "x": "ca1656d0"}, {"t": "learn", "h": "<div class=\"u\">Question one: phonemic awareness relates to the correspondences between letters or groups of letters and the sounds they represent. True.</div><div class=\"u\">سؤال واحد: الوعي الفونيمي بيتعلّق بالتطابق بين الحروف أو مجموعات الحروف والأصوات اللي بيمثلوها. صح.</div>", "n": 1, "i": 67, "a": "tefl-36-061", "x": "927e2fcd"}, {"t": "learn", "h": "<div class=\"u\">Question two: decoding is breaking up a word into letters. False. Decoding breaks a word into sounds.</div><div class=\"u\">سؤال اتنين: فك التشفير هو تكسير الكلمة لحروف. غلط. فك التشفير بيكسّر الكلمة لأصوات.</div>", "n": 1, "i": 68, "a": "tefl-36-062", "x": "fef76987"}, {"t": "learn", "h": "<div class=\"u\">Question three: punctuation refers to how a person articulates specific sounds. False. That is pronunciation, not punctuation.</div><div class=\"u\">سؤال تلاتة: الترقيم بيشير لإزاي الشخص بيلفظ أصوات معينة. غلط. ده النطق، مش الترقيم.</div>", "n": 1, "i": 69, "a": "tefl-36-063", "x": "c31ca1af"}, {"t": "learn", "h": "<div class=\"u\">Question four: a full phonemic awareness approach is unlikely to work well in the early stages. True.</div><div class=\"u\">سؤال أربعة: منهج الوعي الفونيمي الكامل غالبًا مش هيشتغل كويس في المراحل الأولى. صح.</div>", "n": 1, "i": 70, "a": "tefl-36-064", "x": "90df5c62"}, {"t": "learn", "h": "<div class=\"u\">At that stage learners have limited word meanings in English and lack oral proficiency.</div><div class=\"u\">في المرحلة دي المتعلمين عندهم معاني كلمات محدودة وبينقصهم الإتقان الشفهي.</div>", "n": 1, "i": 71, "a": "tefl-36-065", "x": "5ceefc40"}, {"t": "learn", "h": "<div class=\"u\">Question five: ask learners to decode a word where they do not know its meaning. False. Focus on words they already know.</div><div class=\"u\">سؤال خمسة: اطلب من المتعلمين يفكّوا تشفير كلمة مابيعرفوش معناها. غلط. ركّز على كلمات هُم عارفينها أصلًا.</div>", "n": 1, "i": 72, "a": "tefl-36-066", "x": "9fb25b2d"}, {"t": "learn", "h": "<div class=\"u\">Question six: a minimal pair is a pair of words that differ in only one phoneme. True.</div><div class=\"u\">سؤال ستة: الزوج الطفيف هو زوج كلمات بيختلفوا في فونيم واحد بس. صح.</div>", "n": 1, "i": 73, "a": "tefl-36-067", "x": "9d70edcb"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 74}, {"t": "learn", "h": "<div class=\"u\">phonemic awareness: seeing the correspondence between letters and the sounds they represent.</div><div class=\"u\">الوعي الفونيمي: رؤية التطابق بين الحروف والأصوات اللي بتمثلها.</div>", "n": 1, "i": 75, "a": "tefl-36-068", "x": "f7ba5f8b"}, {"t": "learn", "h": "<div class=\"u\">decoding: breaking up a word into its sounds.</div><div class=\"u\">فك التشفير: تكسير الكلمة لأصواتها.</div>", "n": 1, "i": 76, "a": "tefl-36-069", "x": "c524a71d"}, {"t": "learn", "h": "<div class=\"u\">phonics: teaching letters and sounds for reading.</div><div class=\"u\">الفونكس: تعليم الحروف والأصوات للقراية.</div>", "n": 1, "i": 77, "a": "tefl-36-070", "x": "5d7771ae"}, {"t": "learn", "h": "<div class=\"u\">minimal pair: two words that differ in only one phoneme.</div><div class=\"u\">الزوج الطفيف: كلمتين بيختلفوا في فونيم واحد بس.</div>", "n": 1, "i": 78, "a": "tefl-36-071", "x": "ec57712a"}, {"t": "learn", "h": "<div class=\"u\">contextualised minimal pairs: minimal pairs placed inside a meaningful context.</div><div class=\"u\">الأزواج الطفيفة في سياق: أزواج طفيفة محطوطة جوه سياق معنوي.</div>", "n": 1, "i": 79, "a": "tefl-36-072", "x": "743bf20e"}, {"t": "learn", "h": "<div class=\"u\">tongue twister: a sentence hard to say fast, for sound practice.</div><div class=\"u\">كاسر اللسان: جملة صعبة تتقال بسرعة، للتدريب على الأصوات.</div>", "n": 1, "i": 80, "a": "tefl-36-073", "x": "c2fbcac6"}, {"t": "learn", "h": "<div class=\"u\">drilling: repeated practice of sounds, words, or sentences.</div><div class=\"u\">التدريب المتكرر: تكرار تدريب الأصوات أو الكلمات أو الجمل.</div>", "n": 1, "i": 81, "a": "tefl-36-074", "x": "e3d58477"}, {"t": "learn", "h": "<div class=\"u\">listen and imitate: hear a model and repeat it.</div><div class=\"u\">اسمع وقلّد: اسمع نموذج وكرّره.</div>", "n": 1, "i": 82, "a": "tefl-36-075", "x": "60cb3e4f"}, {"t": "learn", "h": "<div class=\"u\">reading comprehension: understanding the meaning of what you read.</div><div class=\"u\">فهم المقروء: فهم معنى اللي بتقراه.</div>", "n": 1, "i": 83, "a": "tefl-36-076", "x": "9714ddcf"}, {"t": "learn", "h": "<div class=\"u\">oral proficiency: the ability to speak a language well.</div><div class=\"u\">الإتقان الشفهي: القدرة على تكلّم اللغة كويس.</div>", "n": 1, "i": 84, "a": "tefl-36-077", "x": "3db278a8"}, {"t": "learn", "h": "<div class=\"u\">chunk: a group of words learnt as one piece.</div><div class=\"u\">الكتلة: مجموعة كلمات متعلمة كقطعة واحدة.</div>", "n": 1, "i": 85, "a": "tefl-36-078", "x": "2d7c938b"}, {"t": "learn", "h": "<div class=\"u\">sound-symbol correspondence: the match between a letter and its sound.</div><div class=\"u\">تطابق الصوت والرمز: التطابق بين الحرف وصوته.</div>", "n": 1, "i": 86, "a": "tefl-36-079", "x": "d8acc906"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 87}, {"t": "learn", "h": "<div class=\"u\">Phonemic awareness links letters to sounds. It comes after phonological awareness and leads to reading.</div><div class=\"u\">الوعي الفونيمي بيربط الحروف بالأصوات. بييجي بعد الوعي الصوتي وبيوصّل للقراية.</div>", "n": 1, "i": 88, "a": "tefl-36-080", "x": "d26787b9"}, {"t": "learn", "h": "<div class=\"u\">Decoding breaks words into sounds; the goal is joining the sounds back and uttering the whole word.</div><div class=\"u\">فك التشفير بيكسّر الكلمات لأصوات؛ الهدف تجميع الأصوات تاني ونطق الكلمة كاملة.</div>", "n": 1, "i": 89, "a": "tefl-36-081", "x": "054655ee"}, {"t": "learn", "h": "<div class=\"u\">English decoding is tricky because sound-letter correspondence has exceptions, like the two sounds of c.</div><div class=\"u\">فك التشفير في الإنجليزي صعب لأن تطابق الصوت والحرف فيه استثناءات، زي صوتي السي.</div>", "n": 1, "i": 90, "a": "tefl-36-082", "x": "b405e20b"}, {"t": "learn", "h": "<div class=\"u\">Meaning and comprehension are the end goal; phonics enhances comprehension and must never replace it. Decode only words learners know.</div><div class=\"u\">المعنى والفهم هُم الهدف النهائي؛ الفونكس بيعزّز الفهم ومينفعش ياخد مكانه أبدًا. فك تشفير كلمات المتعلمين عارفينها بس.</div>", "n": 1, "i": 91, "a": "tefl-36-083", "x": "133fe11a"}, {"t": "learn", "h": "<div class=\"u\">Use varied activities: imitation, minimal pairs, visual aids, tongue twisters, drills, linking, listening games and pictures.</div><div class=\"u\">استخدم أنشطة متنوعة: تقليد، أزواج طفيفة، وسايل بصرية، كاسرات لسان، تدريبات، ربط، ألعاب استماع وصور.</div>", "n": 1, "i": 92, "a": "tefl-36-084", "x": "fdf0e13e"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 93}, {"t": "tf", "q": "Phonemic awareness relates to the correspondences between letters or groups of letters and the sounds they represent.<br>الوعي الفونيمي بيتعلّق بالتطابق بين الحروف أو مجموعات الحروف والأصوات اللي بيمثلوها.", "ans": true, "why": "True. That is the definition. | صح. ده هو التعريف.", "ex": ["Correct. | صح.", "Wrong. It is exactly about letters and sounds. | غلط: هو بالظبط عن الحروف والأصوات."], "n": 1, "i": 94, "h": ""}, {"t": "tf", "q": "Decoding is breaking up a word into letters.<br>فك التشفير هو تكسير الكلمة لحروف.", "ans": false, "why": "False. Decoding breaks a word into sounds, not letters. | غلط. فك التشفير بيكسّر الكلمة لأصوات، مش حروف.", "ex": ["Wrong. It is about sounds. | غلط: هو عن الأصوات.", "Correct. | صح."], "n": 1, "i": 95, "h": ""}, {"t": "tf", "q": "Punctuation refers to how a person articulates specific sounds.<br>الترقيم بيشير لإزاي الشخص بيلفظ أصوات معينة.", "ans": false, "why": "False. That is pronunciation. Punctuation is marks in writing. | غلط. ده النطق. الترقيم علامات في الكتابة.", "ex": ["Wrong. The word should be pronunciation. | غلط: الكلمة المفروض النطق.", "Correct. | صح."], "n": 1, "i": 96, "h": ""}, {"t": "tf", "q": "A full phonemic awareness approach is unlikely to work well in the early stages, where learners have limited word meanings and lack oral proficiency.<br>منهج الوعي الفونيمي الكامل غالبًا مش هيشتغل كويس في المراحل الأولى، لما المتعلمين يكون عندهم معاني محدودة وبينقصهم الإتقان الشفهي.", "ans": true, "why": "True. Unlike native learners, they lack the chunks and phrases picked up from songs, stories and chat. | صح. على عكس أهل اللغة، بينقصهم الكتل والتعبيرات المتلموعة من الأغاني والحكايات والدردشة.", "ex": ["Correct. | صح.", "Wrong. That is exactly the problem. | غلط: دي بالظبط المشكلة."], "n": 1, "i": 97, "h": ""}, {"t": "tf", "q": "Ask learners to decode a word where they do not know its meaning.<br>اطلب من المتعلمين يفكّوا تشفير كلمة مابيعرفوش معناها.", "ans": false, "why": "False. Focus on words they already know. | غلط. ركّز على كلمات هُم عارفينها أصلًا.", "ex": ["Wrong. Unknown meanings are off limits. | غلط: المعاني المجهولة ممنوعة هنا.", "Correct. | صح."], "n": 1, "i": 98, "h": ""}, {"t": "tf", "q": "A minimal pair is a pair of words that differ in only one phoneme.<br>الزوج الطفيف هو زوج كلمات بيختلفوا في فونيم واحد بس.", "ans": true, "why": "True. Ship and sheep differ only in the vowel sound. | صح. مركب وخروف بيختلفوا بس في صوت المتحرك.", "ex": ["Correct. | صح.", "Wrong. One phoneme is exactly the difference. | غلط: فونيم واحد هو بالظبط الفرق."], "n": 1, "i": 99, "h": ""}, {"t": "mc", "q": "The letter c in city is an example of:<br>حرف السي في مدينة مثال على:", "opts": ["a soft sound, /s/ | صوت ناعم، سين", "a hard sound, /k/ | صوت خشن، كاف", "a silent letter | حرف ساكت"], "ans": 0, "why": "C is soft, /s/, in cent, circle, city, and hard, /k/, in can, cake, cage. | السي ناعمة، سين، في سنت ودايرة ومدينة، وخشنة، كاف، في يقدر وكيك وقفص.", "ex": ["Correct. | صح.", "No. That is c in can. | غلط: دي السي في يقدر.", "No. It is pronounced. | غلط: بيتنطق."], "n": 1, "i": 100, "h": ""}, {"t": "mc", "q": "The end goal of phonemic awareness instruction is:<br>الهدف النهائي من تعليم الوعي الفونيمي هو:", "opts": ["understanding meaning and reading comprehension | فهم المعنى وفهم المقروء", "perfect pronunciation | نطق مثالي", "fast drilling | تدريب متكرر سريع"], "ans": 0, "why": "Phonemic awareness is a step on the way to comprehension, not an end in itself. | الوعي الفونيمي خطوة في الطريق للفهم، مش هدف في حد ذاته.", "ex": ["Correct. | صح.", "No. Pronunciation is a different thing. | غلط: النطق حاجة مختلفة.", "No. Drills are just a tool. | غلط: التدريبات مجرد وسيلة."], "n": 1, "i": 101, "h": ""}, {"t": "recall", "q": "What are the six key points to remember when enhancing phonemic awareness?<br>إيه النقاط الأساسية الستة اللي تفتكرها لما تعزّز الوعي الفونيمي؟", "a": "Meaning and comprehension are the end goal; a full early phonemic approach rarely works for learners with limited English; do not overemphasise decoding over comprehension; never decode words with unknown meanings; keep instruction brisk, relevant and purposeful; emphasise chunks and patterns that repeat in other words.<br>المعنى والفهم هُم الهدف النهائي؛ المنهج الفونيمي الكامل البدري نادرًا ما ينفع لمتعلمين إنجليزيتهم محدودة؛ ماتبالغش في فك التشفير على حساب الفهم؛ أبدًا ماتفك تشفير كلمات بمعاني مجهولة؛ خلّي التعليم نشيط ومناسب وهادف؛ أكّد على الكتل والأنماط المتكررة في كلمات تانية.", "n": 1, "i": 102, "h": ""}, {"t": "recall", "q": "Name at least six of the phonological and phonemic awareness activities.<br>اذكر على الأقل ستة من أنشطة الوعي الصوتي والفونيمي.", "a": "Listen and imitate; minimal pairs; contextualised minimal pairs; visual aids; tongue twisters; drilling; linking; same or different; stop me; listen; pictures.<br>اسمع وقلّد؛ الأزواج الطفيفة؛ الأزواج الطفيفة في سياق؛ الوسايل البصرية؛ كاسرات اللسان؛ التدريب المتكرر؛ الربط؛ نفسها ولا مختلفة؛ وقّفني؛ اسمع؛ الصور.", "n": 1, "i": 103, "h": ""}, {"t": "write", "q": "Why must phonics teaching never replace meaning and comprehension? (3-4 sentences)<br>ليه تعليم الفونكس مينفعش أبدًا ياخد مكان المعنى والفهم؟ (٣-٤ جمل).", "key": "tefl-36:1", "a": "The end goal of all this work is reading comprehension, not decoding for its own sake. When phonemic awareness gets more emphasis than meaning, learners may lose sight that they are reading words at all. Decoding matters, but only as a bridge to understanding. Phonics should enhance comprehension, not usurp it.<br>الهدف النهائي من كل الشغل ده هو فهم المقروء، مش فك التشفير لذاته. لما الوعي الفونيمي ياخد تأكيد أكتر من المعنى، المتعلمين ممكن ينسوا إنهم بيقروا كلمات أصلًا. فك التشفير مهم، بس بس كجسر للفهم. الفونكس المفروض يعزّز الفهم، مش يغتصبه.", "n": 1, "i": 104, "h": ""}, {"t": "write", "q": "Why is English decoding trickier than Spanish decoding? (3-4 sentences)<br>ليه فك التشفير في الإنجليزي أصعب من الإسباني؟ (٣-٤ جمل).", "key": "tefl-36:2", "a": "Spanish has a straight one-to-one correspondence between sounds and letters, so a letter usually tells you its sound. English has many exceptions, so the letter symbol often gives no indication of its pronunciation. The letter c, for example, is hard, /k/, in can and soft, /s/, in city. That is why English learners need much more guided practice with sound-symbol links.<br>الإسباني فيه تطابق مباشر واحد لواحد بين الأصوات والحروف، فالحرف عادة بيقولك صوته. الإنجليزي فيه استثناءات كتير، فرمز الحرف في الغالب مابيدّيش أي إشارة لنطقه. حرف السي مثلًا خشن، كاف، في يقدر وناعم، سين، في مدينة. عشان كده متعلمين الإنجليزي محتاجين تدريب موجّه أكتر بكتير على روابط الصوت والرمز.", "n": 1, "i": 105, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: pronunciation, how we actually say the sounds.</div><div class=\"u\">الدرس الجاي: النطق، إزاي فعلًا بنقول الأصوات.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 106}];</script>
