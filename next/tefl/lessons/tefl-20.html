<script>window.LESSON_ID="tefl-20";window.STEPS=[{"t": "section", "h": "Why plan lessons | ليه نخطط للدروس", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">A lesson plan is a step-by-step guide detailing exactly what you will do throughout the lesson. It keeps the lesson coherent and achieving its final objectives.</div><div class=\"u\">خطة الدرس هي دليل خطوة بخطوة بتوضّح بالظبط هتعمل إيه طول الدرس. بتضمن إن الدرس مترابط وبيوصل لأهدافه النهائية.</div>", "n": 1, "i": 1, "a": "tefl-20-001", "x": "323c85cd"}, {"t": "learn", "h": "<div class=\"u\">That is not its only purpose. Your lesson plan also needs to motivate your students to learn. Motivation is so important that Unit 4 of this module is all about it.</div><div class=\"u\">ومش ده بس هدفها. خطة درسك كمان لازم تحفّز طلبتك على التعلم. التحفيز مهم لدرجة إن الوحدة الرابعة من الموديول ده كلها عنه.</div>", "n": 1, "i": 2, "a": "tefl-20-002", "x": "62571fbf"}, {"t": "learn", "h": "<div class=\"u\">For most schools, lesson planning is a formal requirement, but there is no single universal method of EFL lesson planning.</div><div class=\"u\">لأغلب المدارس، التخطيط للدرس مطلب رسمي، بس مفيش طريقة واحدة عالمية للتخطيط لدروس الإنجليزية.</div>", "n": 1, "i": 3, "a": "tefl-20-003", "x": "ab37c2f0"}, {"t": "learn", "h": "<div class=\"u\">Ideally your school has a general procedure. Then, if you are absent, another teacher can understand exactly what you intended and carry it out with as little confusion as possible.</div><div class=\"u\">المفروض مدرستك يكون عندها إجراء عام. ساعتها، لو غبت لأي سبب، مدرس تاني يقدر يفهم بالظبط إيه اللي كنت ناوي عليه وينفّذه بأقل لخبطة ممكنة.</div>", "n": 1, "i": 4, "a": "tefl-20-004", "x": "cee70708"}, {"t": "learn", "h": "<div class=\"u\">The important thing is that your plan is thoughtful and detailed, both to achieve your lesson aims and for the smooth-running of the class.</div><div class=\"u\">المهم إن خطتك تبقى متفكّر فيها ومفصّلة، عشان توصل لأهداف الدرس وعشان الفصل يمشي بسلاسة.</div>", "n": 1, "i": 5, "a": "tefl-20-005", "x": "a7454c51"}, {"t": "learn", "h": "<div class=\"u\">When planning, think about a variety of factors: the overall objective, learning outcomes, the logical development of stages, and time management.</div><div class=\"u\">وإنت بتخطط، فكّر في عوامل مختلفة: الهدف العام، ونواتج التعلم، والتطور المنطقي للمراحل، وإدارة الوقت.</div>", "n": 1, "i": 6, "a": "tefl-20-006", "x": "897fb966"}, {"t": "learn", "h": "<div class=\"u\">How you plan depends largely on the skill you are focusing on that day: language, pronunciation, reading, and so on. There are recognised procedures for each.</div><div class=\"u\">طريقة تخطيطك بتعتمد بشكل أساسي على المهارة اللي مركز عليها النهارده: لغة، نطق، قراءة، وهكذا. وفيه إجراءات معروفة لكل واحدة.</div>", "n": 1, "i": 7, "a": "tefl-20-007", "x": "ee4d75f7"}, {"t": "learn", "h": "<div class=\"u\">This module looks at the three most common lesson planning procedures: Presentation Practice Production (PPP), Test Teach Test (TTT), and Task-based Learning.</div><div class=\"u\">الموديول ده بيشرح أشهر تلات إجراءات للتخطيط: التقديم والتمرين والإنتاج (PPP)، والاختبار والتدريس والاختبار (TTT)، والتعلم بالمهام.</div>", "n": 1, "i": 8, "a": "tefl-20-008", "x": "1a72dbe7"}, {"t": "section", "h": "The PPP concept | فكرة PPP", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">The PPP approach is perhaps the most well-known style of EFL lesson planning. It plays a major part in the CELTA qualification and employers often ask for it.</div><div class=\"u\">طريقة PPP يمكن أشهر أسلوب لتخطيط دروس الإنجليزية. جزء أساسي من شهادة CELTA وأصحاب العمل بيطلبوها كتير.</div>", "n": 1, "i": 10, "a": "tefl-20-009", "x": "8a73d83e"}, {"t": "learn", "h": "<div class=\"u\">It is seen as a communicative approach to teaching.</div><div class=\"u\">بتتعتبر منهج تواصلي في التدريس.</div>", "n": 1, "i": 11, "a": "tefl-20-010", "x": "b2d15802"}, {"t": "learn", "h": "<div class=\"u\">The general concept: a language point is presented to the class in context, through a dialogue, a text, or a situation build.</div><div class=\"u\">الفكرة العامة: نقطة اللغة بتتقدّم للكلاس في سياق، من خلال حوار أو نص أو بناء موقف.</div>", "n": 1, "i": 12, "a": "tefl-20-011", "x": "5f38f6d9"}, {"t": "learn", "h": "<div class=\"u\">Students then complete a controlled practice stage, repeating the target language in a specific exercise, like a gap-fill.</div><div class=\"u\">وبعدين الطلبة بيعدّوا مرحلة تمرين مضبوط، بيكرّروا فيها اللغة المستهدفة في تدريب محدد، زي ملء فراغات.</div>", "n": 1, "i": 13, "a": "tefl-20-012", "x": "43b8801d"}, {"t": "learn", "h": "<div class=\"u\">Finally comes freer practice: students produce the language themselves, plus any other language they learned before, through a communication task like a role play.</div><div class=\"u\">وفي الآخر التمرين الحر: الطلبة بينتجوا اللغة بأنفسهم، زائد أي لغة تعلموها قبل كده، من خلال مهمة تواصل زي لعب الأدوار.</div>", "n": 1, "i": 14, "a": "tefl-20-013", "x": "29fec190"}, {"t": "section", "h": "Presentation | التقديم", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">The presentation stage is crucial: it naturally affects everything that follows.</div><div class=\"u\">مرحلة التقديم حاسمة: بتأثر طبيعي على كل اللي بعدها.</div>", "n": 1, "i": 16, "a": "tefl-20-014", "x": "915558db"}, {"t": "learn", "h": "<div class=\"u\">Present the target language logically and in context. When students recognise the language in context, they grasp its function better and instinctively begin to use it appropriately.</div><div class=\"u\">قدّم اللغة المستهدفة بشكل منطقي وفي سياق. لما الطلبة يتعرفوا على اللغة في سياق، بيفهموا وظيفتها أحسن وبيبدأوا يستخدموها صح بالفطرة.</div>", "n": 1, "i": 17, "a": "tefl-20-015", "x": "249e16cf"}, {"t": "learn", "h": "<div class=\"u\">When the concept is understood, present the target language through a specific model, so they understand the fundamentals.</div><div class=\"u\">لما المفهوم يتفهم، قدّم اللغة المستهدفة من خلال نموذج محدد، عشان يفهموا الأساسيات.</div>", "n": 1, "i": 18, "a": "tefl-20-016", "x": "3c132c48"}, {"t": "learn", "h": "<div class=\"u\">Example: teaching the second conditional. Start with a video clip from the series What Would You Do If...?, a lively way to introduce a difficult concept and provoke debate.</div><div class=\"u\">مثال: تدريس الشرطية التانية (second conditional). ابدأ بمقطع فيديو من سلسلة What Would You Do If...?، طريقة حيوية تقدّم بيها مفهوم صعب وتفتح نقاش.</div>", "n": 1, "i": 19, "a": "tefl-20-017", "x": "52430e64"}, {"t": "learn", "h": "<div class=\"u\">For instance: what would you do if you saw a waiter drop some food then put it back on the plate?</div><div class=\"u\">مثال: هتعمل إيه لو شفت جرسون وقع منه أكل ورجّعه تاني على الطبق؟</div>", "n": 1, "i": 20, "a": "tefl-20-018", "x": "c68011b0"}, {"t": "learn", "h": "<div class=\"u\">Then ask students what they would do in that situation.</div><div class=\"u\">وبعدين اسأل الطلبة هيعملوا إيه في الموقف ده.</div>", "n": 1, "i": 21, "a": "tefl-20-019", "x": "16bba7c7"}, {"t": "learn", "h": "<div class=\"u\">Provide one or two clear model sentences on the board highlighting the target language.</div><div class=\"u\">اكتب نموذج جملة أو اتنين واضحين على السبورة بيوضحوا اللغة المستهدفة.</div>", "n": 1, "i": 22, "a": "tefl-20-020", "x": "93b67338"}, {"t": "learn", "h": "<div class=\"u\">The example model sentence: If I saw a waiter drop some food then put it back on the plate, I would report him to the manager.</div><div class=\"u\">نموذج الجملة في المثال: If I saw a waiter drop some food then put it back on the plate, I would report him to the manager.</div>", "n": 1, "i": 23, "a": "tefl-20-021", "x": "32ab147b"}, {"t": "learn", "h": "<div class=\"u\">Drill the model sentences.</div><div class=\"u\">درّب نماذج الجمل.</div>", "n": 1, "i": 24, "a": "tefl-20-022", "x": "0fff9dd0"}, {"t": "learn", "h": "<div class=\"u\">Highlight the form: If + past simple, then would + infinitive.</div><div class=\"u\">وضّح الشكل: If زائد ماضي بسيط، وبعدين would زائد مصدر.</div>", "n": 1, "i": 25, "a": "tefl-20-023", "x": "27347566"}, {"t": "learn", "h": "<div class=\"u\">Summarise the rule: we use the second conditional to talk about improbable or hypothetical situations in the present or future.</div><div class=\"u\">لخّص القاعدة: بنستخدم الشرطية التانية عشان نتكلم عن مواقف مستبعدة أو افتراضية في المضارع أو المستقبل.</div>", "n": 1, "i": 26, "a": "tefl-20-024", "x": "d59d4ade"}, {"t": "learn", "h": "<div class=\"u\">The site's ordering task, solved: build context, model sentence, drill the model sentence, highlight the written form, summarise the rule.</div><div class=\"u\">تدريب الترتيب بتاع الموقع، محلول: ابني السياق، نموذج الجملة، درّب نموذج الجملة، وضّح الشكل المكتوب، لخّص القاعدة.</div>", "n": 1, "i": 27, "a": "tefl-20-025", "x": "443eed2c"}, {"t": "section", "h": "Controlled practice | التمرين المضبوط", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">Practice, or controlled practice, is the important middle stage towards effective language production.</div><div class=\"u\">التمرين، أو التمرين المضبوط، هو المرحلة الوسطانية المهمة ناحية الإنتاج اللغوي الفعّال.</div>", "n": 1, "i": 29, "a": "tefl-20-026", "x": "45e5e1df"}, {"t": "learn", "h": "<div class=\"u\">Most exercises you do in class make up this stage, from gap-fills to matching sentence halves. You will often do them as a natural part of the lesson.</div><div class=\"u\">أغلب التمارين اللي بتعملها في الفصل بتكوّن المرحلة دي، من ملء الفراغات لتوصيل أنصاف الجمل. وكتير هتعملهم كجزء طبيعي من درسك.</div>", "n": 1, "i": 30, "a": "tefl-20-027", "x": "3496cb7d"}, {"t": "learn", "h": "<div class=\"u\">But beware: the practice stage can take over and become a series of ill-thought-out tasks just to get students through the lesson.</div><div class=\"u\">بس خد بالك: مرحلة التمرين ممكن تستحوذ وتبقى سلسلة مهام مش متفكّر فيها بس عشان تعدّي بيها الطلبة الدرس.</div>", "n": 1, "i": 31, "a": "tefl-20-028", "x": "4352d094"}, {"t": "learn", "h": "<div class=\"u\">However tempting that is, remember: practice is one of three equal steps that make the lesson as a whole.</div><div class=\"u\">مهما كان ده مغري، افتكر: التمرين واحدة من تلات خطوات متساوية بتكوّن الدرس كله.</div>", "n": 1, "i": 32, "a": "tefl-20-029", "x": "c6eaf107"}, {"t": "learn", "h": "<div class=\"u\">This stage is about ensuring students understood the presented language and can practise using it accurately.</div><div class=\"u\">المرحلة دي هدفها التأكد إن الطلبة فهموا اللغة المتقدمة ويقدروا يتمرنوا على استخدامها بدقة.</div>", "n": 1, "i": 33, "a": "tefl-20-030", "x": "8bfe19a2"}, {"t": "learn", "h": "<div class=\"u\">Exposure through a variety of tasks is important, and so is checking correct usage through reporting back.</div><div class=\"u\">التعرض للغة من خلال مهام متنوعة مهم، وكمان التحقق من الاستخدام الصح من خلال المراجعة الجماعية (reporting back).</div>", "n": 1, "i": 34, "a": "tefl-20-031", "x": "b3b69638"}, {"t": "learn", "h": "<div class=\"u\">Typical activity: complete the sentences with the correct verb form to make second conditional sentences.</div><div class=\"u\">نشاط نموذجي: كمّل الجمل بصيغة الفعل الصح عشان تعمل جمل شرطية تانية.</div>", "n": 1, "i": 35, "a": "tefl-20-032", "x": "8897d871"}, {"t": "learn", "h": "<div class=\"u\">What would you do if you ___ the lottery? The answer is won, the past simple. Not would win, and not will win.</div><div class=\"u\">What would you do if you ___ the lottery? الإجابة won، الماضي البسيط. مش would win ومش will win.</div>", "n": 1, "i": 36, "a": "tefl-20-033", "x": "fa77a066"}, {"t": "learn", "h": "<div class=\"u\">The bathroom ___ bigger if we painted it white. The answer is would look. The if-clause already carries the past simple, painted.</div><div class=\"u\">The bathroom ___ bigger if we painted it white. الإجابة would look. جملة الشرط أصلًا شايلة الماضي البسيط painted.</div>", "n": 1, "i": 37, "a": "tefl-20-034", "x": "5399bac7"}, {"t": "section", "h": "Production | الإنتاج", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">Many students give accurate responses in controlled practice, but original production of the language is often much more difficult.</div><div class=\"u\">طلبة كتير بيدوا إجابات دقيقة في التمرين المضبوط، بس الإنتاج الأصلي للغة غالبًا أصعب بكتير.</div>", "n": 1, "i": 39, "a": "tefl-20-035", "x": "65b5a572"}, {"t": "learn", "h": "<div class=\"u\">Production is the step where students go from passive learners to active users.</div><div class=\"u\">الإنتاج هي الخطوة اللي الطلبة بيتحولوا فيها من متعلمين سلبيين لمستخدمين نشطين.</div>", "n": 1, "i": 40, "a": "tefl-20-036", "x": "4ce1bca1"}, {"t": "learn", "h": "<div class=\"u\">If the presentation and practice sections are not well thought-out, it will be evident when students come to produce the language themselves.</div><div class=\"u\">لو التقديم والتمرين مش متفكّر فيهم كويس، ده هيبان لما الطلبة يجوا ينتجوا اللغة بأنفسهم.</div>", "n": 1, "i": 41, "a": "tefl-20-037", "x": "80842d22"}, {"t": "learn", "h": "<div class=\"u\">Do not tell the students what to say at this stage. The production needs to be free, so students become independent language users.</div><div class=\"u\">ماتقولش للطلبة يقولوا إيه في المرحلة دي. الإنتاج لازم يبقى حر، عشان الطلبة يبقوا مستخدمين مستقلين للغة.</div>", "n": 1, "i": 42, "a": "tefl-20-038", "x": "73a7b781"}, {"t": "learn", "h": "<div class=\"u\">Free production activities: role-plays, debates, quizzes and games, descriptions, writing.</div><div class=\"u\">أنشطة الإنتاج الحر: لعب أدوار، مناظرات، كويزات وألعاب، أوصاف، كتابة.</div>", "n": 1, "i": 43, "a": "tefl-20-039", "x": "3567896b"}, {"t": "learn", "h": "<div class=\"u\">Example: small groups discuss what would you buy if you won the lottery, giving reasons for their choices or ranking their hypothetical purchases.</div><div class=\"u\">مثال: مجموعات صغيرة تناقش هتشتري إيه لو كسبت اليانصيب، مع ذكر أسباب اختياراتهم أو ترتيب مشترياتهم الافتراضية.</div>", "n": 1, "i": 44, "a": "tefl-20-040", "x": "25980045"}, {"t": "learn", "h": "<div class=\"u\">Or groups could act out their own version of the video clip shown in the presentation stage.</div><div class=\"u\">أو المجموعات ممكن تمثّل نسختها الخاصة من مقطع الفيديو اللي اتعرض في مرحلة التقديم.</div>", "n": 1, "i": 45, "a": "tefl-20-041", "x": "3e80c777"}, {"t": "learn", "h": "<div class=\"u\">Give students the time they need. Some may be daunted by playing an active role, and thinking in another language always takes a bit longer.</div><div class=\"u\">ادّي الطلبة الوقت اللي محتاجينه. بعضهم ممكن يتوتر من فكرة الدور النشط، والتفكير بلغة تانية دايمًا بياخد وقت أطول شوية.</div>", "n": 1, "i": 46, "a": "tefl-20-042", "x": "bca4dfbe"}, {"t": "section", "h": "The traditional plan structure | هيكل الخطة التقليدية", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">The traditional lesson plan structure has eleven stages, from building context to consolidation.</div><div class=\"u\">الهيكل التقليدي لخطة الدرس فيه ١١ مرحلة، من بناء السياق لحد الترسيخ.</div>", "n": 1, "i": 48, "a": "tefl-20-043", "x": "9706b8c2"}, {"t": "learn", "h": "<div class=\"u\">This example aims to get students to notice how the past continuous interrupted by the past simple creates a dramatic story, for pre-intermediate to intermediate classes.</div><div class=\"u\">المثال ده هدفه إن الطلبة يلاحظوا إزاي الماضي المستمر اللي بيقطعه الماضي البسيط بيعمل قصة درامية، لمستوى pre-intermediate لحد intermediate.</div>", "n": 1, "i": 49, "a": "tefl-20-044", "x": "93e09744"}, {"t": "learn", "h": "<div class=\"u\">Stage 1, build context: ask students to talk about the most frightening experience of their life.</div><div class=\"u\">مرحلة ١، بناء السياق: اطلب من الطلبة يتكلموا عن أكتر تجربة مخيفة في حياتهم.</div>", "n": 1, "i": 50, "a": "tefl-20-045", "x": "98b7cf4e"}, {"t": "learn", "h": "<div class=\"u\">Stage 2, model sentence: the teacher says, I was crossing the road when I was hit by a car!</div><div class=\"u\">مرحلة ٢، نموذج الجملة: المدرس يقول: I was crossing the road when I was hit by a car!</div>", "n": 1, "i": 51, "a": "tefl-20-046", "x": "43a9f7f0"}, {"t": "learn", "h": "<div class=\"u\">Stage 3, highlight meaning: the teacher shows a past diary entry of the date it happened, fictional, hopefully.</div><div class=\"u\">مرحلة ٣، توضيح المعنى: المدرس بيريهم تسجيلة قديمة في أجندته بتاريخ الحادثة، خيالية طبعًا، يارب.</div>", "n": 1, "i": 52, "a": "tefl-20-047", "x": "519ee19b"}, {"t": "learn", "h": "<div class=\"u\">Stage 4, highlight spoken form: the teacher says the sentence naturally, with linking sounds and intonation.</div><div class=\"u\">مرحلة ٤، توضيح الشكل المنطوق: المدرس بيقول الجملة طبيعي، بالربط الصوتي والنبر.</div>", "n": 1, "i": 53, "a": "tefl-20-048", "x": "b56d09e3"}, {"t": "learn", "h": "<div class=\"u\">Stage 5, check understanding: What was I doing just before being hit? Answer: crossing the road. This highlights what was in progress just before the interruption.</div><div class=\"u\">مرحلة ٥، التحقق من الفهم: What was I doing just before being hit? الإجابة: crossing the road. ده بيوضح إيه اللي كان شغال قبل المقاطعة.</div>", "n": 1, "i": 54, "a": "tefl-20-049", "x": "a2fb344d"}, {"t": "learn", "h": "<div class=\"u\">Stage 6, highlight written form: the teacher writes on the board, I was crossing the road when I was hit by a car!</div><div class=\"u\">مرحلة ٦، توضيح الشكل المكتوب: المدرس بيكتب على السبورة: I was crossing the road when I was hit by a car!</div>", "n": 1, "i": 55, "a": "tefl-20-050", "x": "27ba4b0e"}, {"t": "learn", "h": "<div class=\"u\">Stage 7, summarise the rule: this sentence starts with the past continuous, I was crossing, interrupted by the past simple, when I was hit.</div><div class=\"u\">مرحلة ٧، تلخيص القاعدة: الجملة دي بتبدأ بالماضي المستمر I was crossing، بيقطعه الماضي البسيط when I was hit.</div>", "n": 1, "i": 56, "a": "tefl-20-051", "x": "e8cfb950"}, {"t": "learn", "h": "<div class=\"u\">Stage 8, restricted practice: hand out cut-up parts of sentences with past continuous and past simple actions to match up. Monitor to see who needs further help.</div><div class=\"u\">مرحلة ٨، تمرين مقيد: وزّع أجزاء جمل مقصوصة فيها أفعال ماضي مستمر وماضي بسيط يوصلوها ببعض. راقب عشان تعرف مين محتاج مساعدة زيادة.</div>", "n": 1, "i": 57, "a": "tefl-20-052", "x": "0ea33070"}, {"t": "learn", "h": "<div class=\"u\">Stage 9, report back: students with correct answers feedback to the rest of the class.</div><div class=\"u\">مرحلة ٩، المراجعة الجماعية: الطلبة اللي معاهم إجابات صح بيعرضوها على باقي الكلاس.</div>", "n": 1, "i": 58, "a": "tefl-20-053", "x": "7ca9e9e6"}, {"t": "learn", "h": "<div class=\"u\">Stage 10, freer practice: in groups, students get pictures, a train, a wet floor, a horse, an aeroplane, a puddle, and create a dramatic story using the target language.</div><div class=\"u\">مرحلة ١٠، تمرين حر: في مجموعات، الطلبة بياخدوا صور، قطار، أرضية مبلولة، حصان، طيارة، بركة مية، ويعملوا قصة درامية باللغة المستهدفة.</div>", "n": 1, "i": 59, "a": "tefl-20-054", "x": "7db372c9"}, {"t": "learn", "h": "<div class=\"u\">The teacher monitors and takes notes for further work. Students then perform or tell their story to the whole class.</div><div class=\"u\">المدرس بيراقب وبياخد ملاحظات للشغل الجاي. وبعدين الطلبة بيمثّلوا أو يحكوا قصتهم للكلاس كله.</div>", "n": 1, "i": 60, "a": "tefl-20-055", "x": "6e9d1b73"}, {"t": "learn", "h": "<div class=\"u\">Stage 11, consolidation and error correction: highlight common errors with these tenses on the board to clarify meaning and use, never singling out individual students.</div><div class=\"u\">مرحلة ١١، الترسيخ وتصحيح الأخطاء: وضّح الأخطاء الشائعة في الزمنين دول على السبورة عشان توضّح المعنى والاستخدام، من غير ما تحدّد طالب بعينه أبدًا.</div>", "n": 1, "i": 61, "a": "tefl-20-056", "x": "bac97eba"}, {"t": "section", "h": "A full example: used to | مثال كامل: used to", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">A full example plan: the aim is expressing past habits with used to + infinitive. Same traditional order, from building context to consolidation.</div><div class=\"u\">خطة كاملة كمثال: الهدف التعبير عن عادات ماضية بـused to زائد المصدر. نفس الترتيب التقليدي، من بناء السياق لحد الترسيخ.</div>", "n": 1, "i": 63, "a": "tefl-20-057", "x": "6c328e25"}, {"t": "learn", "h": "<div class=\"u\">Build context: the class talks about things they enjoyed doing when they were children.</div><div class=\"u\">بناء السياق: الكلاس بيتكلم عن حاجات كانوا بيستمتعوا بيها وهم أطفال.</div>", "n": 1, "i": 64, "a": "tefl-20-058", "x": "eb93fb67"}, {"t": "learn", "h": "<div class=\"u\">Model sentence: the teacher says, Sarah used to play tennis.</div><div class=\"u\">نموذج الجملة: المدرس يقول: Sarah used to play tennis.</div>", "n": 1, "i": 65, "a": "tefl-20-059", "x": "6f55c159"}, {"t": "learn", "h": "<div class=\"u\">Highlight meaning: the teacher draws a timeline on the board, showing a period in the past with several crosses within it.</div><div class=\"u\">توضيح المعنى: المدرس بيرسم خط زمني على السبورة، بيوضح فترة في الماضي فيها كذا علامة X.</div>", "n": 1, "i": 66, "a": "tefl-20-060", "x": "ff28cfc3"}, {"t": "learn", "h": "<div class=\"u\">Highlight spoken form: the teacher repeats the model sentence with natural linking, stress, and intonation. The class repeats.</div><div class=\"u\">توضيح الشكل المنطوق: المدرس بيعيد نموذج الجملة بالربط والشدة والنبر الطبيعي. والكلاس بيعيد.</div>", "n": 1, "i": 67, "a": "tefl-20-061", "x": "e5d37850"}, {"t": "learn", "h": "<div class=\"u\">Check understanding: Did she play tennis in the past? Yes. Does she play tennis now? No.</div><div class=\"u\">التحقق من الفهم: Did she play tennis in the past? أيوه. Does she play tennis now? لأ.</div>", "n": 1, "i": 68, "a": "tefl-20-062", "x": "82ab1c58"}, {"t": "learn", "h": "<div class=\"u\">Highlight written form: the teacher writes the sentence on the board, draws a box around used to, then writes infinitive over the word play.</div><div class=\"u\">توضيح الشكل المكتوب: المدرس بيكتب الجملة على السبورة، وبيحط مربع حوالين used to، وبيكتب infinitive فوق كلمة play.</div>", "n": 1, "i": 69, "a": "tefl-20-063", "x": "67e3b09a"}, {"t": "learn", "h": "<div class=\"u\">Summarise the rule: used to + infinitive talks about things we regularly did in the past but do not do now.</div><div class=\"u\">تلخيص القاعدة: used to زائد المصدر بيتكلم عن حاجات كنا بنعملها بانتظام في الماضي ومابنعدش نعملها.</div>", "n": 1, "i": 70, "a": "tefl-20-064", "x": "2c5cbf4c"}, {"t": "learn", "h": "<div class=\"u\">Restricted practice: students choose an activity they enjoyed as children and walk around the class asking if anybody else used to do the same thing.</div><div class=\"u\">تمرين مقيد: الطلبة بيختاروا نشاط كانوا بيحبوه وهم أطفال ويمشوا في الفصل يسألوا لو حد تاني كان بيعمل نفس الحاجة.</div>", "n": 1, "i": 71, "a": "tefl-20-065", "x": "7a07d4e1"}, {"t": "learn", "h": "<div class=\"u\">Report back: the teacher asks some individuals how many people shared their interest, and corrects some errors if necessary.</div><div class=\"u\">المراجعة الجماعية: المدرس بيسأل أفراد كام شخص كان بيشاركهم نفس الاهتمام، وبيصحّح شوية أخطاء لو لزم.</div>", "n": 1, "i": 72, "a": "tefl-20-066", "x": "8dd53f14"}, {"t": "learn", "h": "<div class=\"u\">Freer practice: students discuss their memories of their first school in small groups.</div><div class=\"u\">تمرين حر: الطلبة بيتناقشوا في ذكرياتهم عن أول مدرسة ليهم في مجموعات صغيرة.</div>", "n": 1, "i": 73, "a": "tefl-20-067", "x": "c0d76878"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 74}, {"t": "learn", "h": "<div class=\"u\">Lesson plan: a step-by-step guide to what you will do in the lesson, keeping it coherent and motivating.</div><div class=\"u\">خطة الدرس: دليل خطوة بخطوة لإيه اللي هتعمله في الدرس، بتخليه مترابط ومحفّز.</div>", "n": 1, "i": 75, "a": "tefl-20-068", "x": "bbfe9367"}, {"t": "learn", "h": "<div class=\"u\">Learning outcomes: what learners should be able to do by the end of the lesson.</div><div class=\"u\">نواتج التعلم: إيه اللي المتعلمين المفروض يقدروا يعملوه بنهاية الدرس.</div>", "n": 1, "i": 76, "a": "tefl-20-069", "x": "196036df"}, {"t": "learn", "h": "<div class=\"u\">PPP: Presentation, Practice, Production. Present in context, controlled practice, then free production.</div><div class=\"u\">PPP: تقديم، تمرين، إنتاج. قدّم في سياق، تمرين مضبوط، وبعدين إنتاج حر.</div>", "n": 1, "i": 77, "a": "tefl-20-070", "x": "2f00ce90"}, {"t": "learn", "h": "<div class=\"u\">Model sentence: a clear example sentence showing the target language.</div><div class=\"u\">نموذج الجملة: جملة مثال واضحة بتوضح اللغة المستهدفة.</div>", "n": 1, "i": 78, "a": "tefl-20-071", "x": "d97494d0"}, {"t": "learn", "h": "<div class=\"u\">Controlled practice: exercises like gap-fills where students repeat the target language accurately.</div><div class=\"u\">التمرين المضبوط: تمارين زي ملء الفراغات الطلبة بيكرّروا فيها اللغة المستهدفة بدقة.</div>", "n": 1, "i": 79, "a": "tefl-20-072", "x": "e7f3f2a0"}, {"t": "learn", "h": "<div class=\"u\">Production: the free stage where students use the language independently, like role-plays and debates.</div><div class=\"u\">الإنتاج: المرحلة الحرة اللي الطلبة بيستخدموا فيها اللغة باستقلال، زي لعب الأدوار والمناظرات.</div>", "n": 1, "i": 80, "a": "tefl-20-073", "x": "1a57b3a3"}, {"t": "learn", "h": "<div class=\"u\">Report back: students share their answers or results with the whole class after a task.</div><div class=\"u\">المراجعة الجماعية (report back): الطلبة بيعرضوا إجاباتهم أو نتايجهم على الكلاس كله بعد مهمة.</div>", "n": 1, "i": 81, "a": "tefl-20-074", "x": "c37d0eec"}, {"t": "learn", "h": "<div class=\"u\">Consolidation: the final stage that fixes the learning, often with error correction on the board.</div><div class=\"u\">الترسيخ: المرحلة الأخيرة اللي بتثبّت التعلم، غالبًا بتصحيح أخطاء على السبورة.</div>", "n": 1, "i": 82, "a": "tefl-20-075", "x": "a0dfc67e"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 83}, {"t": "learn", "h": "<div class=\"u\">A lesson plan is a step-by-step guide: it keeps the lesson coherent, achieves objectives, and motivates learners. Think about objective, outcomes, stage development, and time.</div><div class=\"u\">خطة الدرس دليل خطوة بخطوة: بتخلي الدرس مترابط، وبيحقق الأهداف، وبتحفّز المتعلمين. فكّر في الهدف والنواتج وتطور المراحل والوقت.</div>", "n": 1, "i": 84, "a": "tefl-20-076", "x": "c876a8f9"}, {"t": "learn", "h": "<div class=\"u\">The three common planning procedures are PPP, TTT, and Task-based Learning. PPP is the most famous and is central to CELTA.</div><div class=\"u\">إجراءات التخطيط التلاتة الشائعة هي PPP وTTT والتعلم بالمهام. PPP هي الأشهر ومحورية في CELTA.</div>", "n": 1, "i": 85, "a": "tefl-20-077", "x": "9ad03857"}, {"t": "learn", "h": "<div class=\"u\">PPP: present the language in context with a model, practise it in controlled exercises, then let students produce it freely.</div><div class=\"u\">PPP: قدّم اللغة في سياق بنموذج، تمرّن عليها بتمارين مضبوطة، وبعدين سيب الطلبة ينتجوها بحرية.</div>", "n": 1, "i": 86, "a": "tefl-20-078", "x": "baa1f142"}, {"t": "learn", "h": "<div class=\"u\">The traditional plan runs: context, model sentence, meaning, spoken form, check understanding, written form, rule, restricted practice, report back, freer practice, consolidation.</div><div class=\"u\">الخطة التقليدية بتمشي: سياق، نموذج جملة، معنى، شكل منطوق، تحقق من الفهم، شكل مكتوب، قاعدة، تمرين مقيد، مراجعة جماعية، تمرين حر، ترسيخ.</div>", "n": 1, "i": 87, "a": "tefl-20-079", "x": "fb958c0a"}, {"t": "learn", "h": "<div class=\"u\">In production, never script the students. Give them time: thinking in another language takes longer.</div><div class=\"u\">في الإنتاج، ماتكتبش للطلبة كلامهم أبدًا. اديهم وقت: التفكير بلغة تانية بياخد وقت أطول.</div>", "n": 1, "i": 88, "a": "tefl-20-080", "x": "c3b242df"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 89}, {"t": "mc", "q": "Which is the correct PPP order?<br>أنهي هو ترتيب PPP الصح؟", "opts": ["presentation, practice, production | تقديم، تمرين، إنتاج", "practice, presentation, production | تمرين، تقديم، إنتاج", "production, practice, presentation | إنتاج، تمرين، تقديم"], "ans": 0, "why": "Present the language in context first, then controlled practice, then free production. | الأول قدّم اللغة في سياق، وبعدين تمرين مضبوط، وبعدين إنتاج حر.", "ex": ["Correct. | صح.", "No. Practice comes after presentation. | غلط: التمرين بييجي بعد التقديم.", "No. Production is the final stage. | غلط: الإنتاج هو المرحلة الأخيرة."], "n": 1, "i": 90, "h": ""}, {"t": "mc", "q": "What would you do if you ___ the lottery?<br>What would you do if you ___ the lottery?", "opts": ["won | won", "would win | would win", "will win | will win"], "ans": 0, "why": "Second conditional: if + past simple, then would + infinitive. | الشرطية التانية: if زائد ماضي بسيط، وبعدين would زائد مصدر.", "ex": ["Correct. | صح.", "No. The if-clause takes the past simple, not would. | غلط: جملة الشرط بتاخد ماضي بسيط مش would.", "No. Will does not fit the second conditional. | غلط: will مابتنفعش في الشرطية التانية."], "n": 1, "i": 91, "h": ""}, {"t": "mc", "q": "The bathroom ___ bigger if we painted it white.<br>The bathroom ___ bigger if we painted it white.", "opts": ["would look | would look", "looked | looked", "will look | will look"], "ans": 0, "why": "The if-clause has the past simple (painted), so the main clause takes would + infinitive. | جملة الشرط فيها الماضي البسيط (painted)، فالجملة الرئيسية بتاخد would زائد مصدر.", "ex": ["Correct. | صح.", "No. Painted already carries the past; the main clause needs would look. | غلط: painted أصلًا شايلة الماضي؛ الرئيسية محتاجة would look.", "No. Will breaks the second conditional pattern. | غلط: will بتكسّر نمط الشرطية التانية."], "n": 1, "i": 92, "h": ""}, {"t": "tf", "q": "In the production stage, the teacher should tell students what to say.<br>في مرحلة الإنتاج، المدرس المفروض يقول للطلبة يقولوا إيه.", "ans": false, "why": "False. Production must be free, so students become independent language users. | غلط. الإنتاج لازم يبقى حر، عشان الطلبة يبقوا مستخدمين مستقلين للغة.", "ex": ["Wrong. Scripting kills free production. | غلط: كتابة الكلام بتموّت الإنتاج الحر.", "Correct. | صح."], "n": 1, "i": 93, "h": ""}, {"t": "mc", "q": "In the traditional lesson plan structure, what comes right after the model sentence?<br>في هيكل خطة الدرس التقليدية، إيه اللي بييجي بعد نموذج الجملة على طول؟", "opts": ["highlight meaning | توضيح المعنى", "freer practice | تمرين حر", "summarise the rule | تلخيص القاعدة"], "ans": 0, "why": "The order runs: context, model sentence, highlight meaning, spoken form, check understanding, written form, rule. | الترتيب: سياق، نموذج جملة، توضيح المعنى، شكل منطوق، تحقق من الفهم، شكل مكتوب، قاعدة.", "ex": ["Correct. | صح.", "No. Freer practice is near the end. | غلط: التمرين الحر في الآخر.", "No. The rule comes after the written form. | غلط: القاعدة بتيجي بعد الشكل المكتوب."], "n": 1, "i": 94, "h": ""}, {"t": "mc", "q": "In the used to lesson, how does the teacher check understanding?<br>في درس used to، المدرس بيتحقق من الفهم إزاي؟", "opts": ["Did she play tennis in the past? Does she play now? | Did she play tennis in the past? Does she play now?", "Translate used to into Arabic | ترجموا used to للعربي", "Write ten sentences with used to | اكتبوا عشر جمل بـused to"], "ans": 0, "why": "Two concept questions establish past habit, not present: Yes then, No now. | سؤالين مفهوم بيثبتوا عادة ماضية مش حاضرة: أيوه زمان، لأ دلوقتي.", "ex": ["Correct. | صح.", "No. Checking is done with concept questions, not translation. | غلط: التحقق بيتم بأسئلة المفهوم مش الترجمة.", "No. Writing sentences is practice, not the understanding check. | غلط: كتابة الجمل تمرين مش تحقق من الفهم."], "n": 1, "i": 95, "h": ""}, {"t": "tf", "q": "In consolidation and error correction, the teacher singles out the students who made errors.<br>في الترسيخ وتصحيح الأخطاء، المدرس بيحدّد الطلبة اللي غلطوا بالاسم.", "ans": false, "why": "False. Highlight common errors on the board, never singling out individual students. | غلط. وضّح الأخطاء الشائعة على السبورة، من غير ما تحدّد أفراد أبدًا.", "ex": ["Wrong. Never single out individuals. | غلط: ممنوع تحدّد أفراد أبدًا.", "Correct. | صح."], "n": 1, "i": 96, "h": ""}, {"t": "mc", "q": "Which of these is a free production activity?<br>أنهي دي من أنشطة الإنتاج الحر؟", "opts": ["a role play | لعب أدوار", "a gap-fill exercise | تدريب ملء فراغات", "drilling the model sentence | تدريب نموذج الجملة"], "ans": 0, "why": "Role-plays, debates, quizzes, descriptions, and writing are free production. Gap-fills and drills are controlled. | لعب الأدوار والمناظرات والكويزات والأوصاف والكتابة إنتاج حر. ملء الفراغات والتدريب مضبوطين.", "ex": ["Correct. | صح.", "No. Gap-fills are controlled practice. | غلط: ملء الفراغات تمرين مضبوط.", "No. Drilling belongs to presentation and practice. | غلط: التدريب تبع التقديم والتمرين."], "n": 1, "i": 97, "h": ""}, {"t": "tf", "q": "The practice stage is meant to be a series of tasks that fills the lesson time.<br>مرحلة التمرين المفروض تبقى سلسلة مهام بتملي وقت الدرس.", "ans": false, "why": "False. Practice is one of three equal steps, focused on accurate use of the target language, not filler. | غلط. التمرين واحدة من تلات خطوات متساوية، مركزة على الاستخدام الدقيق للغة المستهدفة، مش حشو.", "ex": ["Wrong. It is an equal third of the lesson, not filler. | غلط: هي تلت الدرس بالتساوي مش حشو.", "Correct. | صح."], "n": 1, "i": 98, "h": ""}, {"t": "mc", "q": "Why should a school have a general lesson planning procedure?<br>ليه المدرسة المفروض يكون عندها إجراء عام لتخطيط الدروس؟", "opts": ["so another teacher can run your class if you are absent | عشان مدرس تاني يقدر يمسك فصلك لو غبت", "because PPP is a legal requirement | لأن PPP مطلب قانوني", "so students can skip homework | عشان الطلبة ماعندهاش واجب"], "ans": 0, "why": "If you are absent, another teacher can understand your plan and carry it out with little confusion. | لو غبت، مدرس تاني يقدر يفهم خطتك وينفّذها بأقل لخبطة.", "ex": ["Correct. | صح.", "No. Planning is a school requirement, not a law about PPP. | غلط: التخطيط مطلب مدرسي مش قانون عن PPP.", "No. Homework is not the reason. | غلط: الواجب مش هو السبب."], "n": 1, "i": 99, "h": ""}, {"t": "mc", "q": "We use the second conditional to talk about:<br>بنستخدم الشرطية التانية عشان نتكلم عن:", "opts": ["improbable or hypothetical present/future situations | مواقف مستبعدة أو افتراضية في المضارع أو المستقبل", "past habits | عادات ماضية", "fixed future arrangements | مواعيد مستقبلية ثابتة"], "ans": 0, "why": "That is the rule summary from the presentation stage. Used to covers past habits. | ده تلخيص القاعدة من مرحلة التقديم. used to بتغطي العادات الماضية.", "ex": ["Correct. | صح.", "No. Past habits use used to + infinitive. | غلط: العادات الماضية بتستخدم used to زائد المصدر.", "No. Fixed arrangements use the present continuous. | غلط: المواعيد الثابتة بتستخدم المضارع المستمر."], "n": 1, "i": 100, "h": ""}, {"t": "recall", "q": "List the 11 stages of the traditional lesson plan in order.<br>اذكر مراحل خطة الدرس التقليدية الـ١١ بالترتيب.", "a": "Build context, model sentence, highlight meaning, highlight spoken form, check understanding, highlight written form, summarise rule, restricted practice, report back, freer practice, consolidation and error correction.<br>بناء السياق، نموذج الجملة، توضيح المعنى، توضيح الشكل المنطوق، التحقق من الفهم، توضيح الشكل المكتوب، تلخيص القاعدة، تمرين مقيد، مراجعة جماعية، تمرين حر، ترسيخ وتصحيح أخطاء.", "n": 1, "i": 101, "h": ""}, {"t": "recall", "q": "What are the three most common EFL lesson planning procedures?<br>إيه أشهر تلات إجراءات لتخطيط دروس الإنجليزية؟", "a": "Presentation Practice Production (PPP), Test Teach Test (TTT), and Task-based Learning.<br>التقديم والتمرين والإنتاج (PPP)، والاختبار والتدريس والاختبار (TTT)، والتعلم بالمهام.", "n": 1, "i": 102, "h": ""}, {"t": "write", "q": "Explain the three PPP stages, with one example activity for each (4-5 sentences).<br>اشرح مراحل PPP التلاتة، بمثال نشاط واحد لكل مرحلة (٤-٥ جمل).", "key": "tefl-20:1", "a": "In presentation, the teacher shows the target language in context, for example with a video clip about the second conditional, then gives a model sentence and highlights the form. In controlled practice, students repeat the language accurately in set exercises, like completing second conditional gap-fills. In production, students use the language freely, for example discussing in groups what they would buy if they won the lottery. Each stage is an equal third of the lesson, and weak early stages show up when students try to produce.<br>في التقديم، المدرس بيعرض اللغة المستهدفة في سياق، مثال بمقطع فيديو عن الشرطية التانية، وبعدين بيدي نموذج جملة وبيوضّح الشكل. في التمرين المضبوط، الطلبة بيكرّروا اللغة بدقة في تمارين محددة، زي ملء فراغات الشرطية التانية. في الإنتاج، الطلبة بيستخدموا اللغة بحرية، مثال بيتناقشوا في مجموعات هايشتروا إيه لو كسبوا اليانصيب. كل مرحلة تلت الدرس بالتساوي، والمراحل الأولى الضعيفة بتبان لما الطلبة يحاولوا ينتجوا.", "n": 1, "i": 103, "h": ""}, {"t": "write", "q": "Why must production be free, and what should the teacher do during it (3-4 sentences)?<br>ليه الإنتاج لازم يبقى حر، وإيه اللي المدرس المفروض يعمله أثناءه (٣-٤ جمل)؟", "key": "tefl-20:2", "a": "Production is where passive learners become active, independent users of the language, so the teacher must not script what they say. Free tasks like role-plays, debates, and group discussions let students combine the target language with everything they learned before. The teacher should give them enough time, because thinking in another language takes longer, and some students find an active role daunting. The teacher monitors, takes notes, and corrects common errors later, never singling anyone out.<br>الإنتاج هو المكان اللي المتعلمين السلبيين بيتحولوا فيه لمستخدمين نشطين مستقلين للغة، فالمدرس ممنوع يكتب لهم كلامهم. المهام الحرة زي لعب الأدوار والمناظرات ومناقشات المجموعات بتخلي الطلبة يدمجوا اللغة المستهدفة مع كل اللي تعلموه قبل كده. المدرس لازم يديهم وقت كفاية، لأن التفكير بلغة تانية بياخد وقت أطول، وبعض الطلبة بيتوتروا من الدور النشط. المدرس بيراقب وبياخد ملاحظات وبيصحّح الأخطاء الشائعة بعدين، من غير ما يحدّد حد أبدًا.", "n": 1, "i": 104, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Unit 2, the Test Teach Test approach, where the lesson starts with a diagnostic test.</div><div class=\"u\">الدرس الجاي: الوحدة التانية، طريقة اختبار-تدريس-اختبار، اللي الدرس فيها بيبدأ باختبار تشخيصي.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 105}];</script>
