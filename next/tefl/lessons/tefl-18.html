<script>window.LESSON_ID="tefl-18";window.STEPS=[{"t": "section", "h": "The unit's three areas | مجالات الوحدة التلاتة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">You now know the grammar you need. But how do you teach it? This unit shows you how, so you can handle it from Day 1 and get it right first time.</div><div class=\"u\">إنت دلوقتي عارف القواعد اللي محتاجها. بس تدرّسها إزاي؟ الوحدة دي بتوريك، عشان تقدر تمسكها من أول يوم وتظبطها من أول مرة.</div>", "n": 1, "i": 1, "a": "tefl-18-001", "x": "0b3d42eb"}, {"t": "learn", "h": "<div class=\"u\">We cover three key areas: prescriptive versus descriptive grammar, different modes of presenting grammar, and teaching grammar to different levels.</div><div class=\"u\">هنغطي تلات حاجات أساسية: القواعد الوصفية ضد الواقعية، وطرق تقديم القواعد المختلفة، وتدريس القواعد لمستويات مختلفة.</div>", "n": 1, "i": 2, "a": "tefl-18-002", "x": "71c6b520"}, {"t": "learn", "h": "<div class=\"u\">Take your time with this unit and absorb it, and you will probably never need to check any grammar teaching book or site again.</div><div class=\"u\">خد وقتك في الوحدة دي واستوعبها، وغالبًا مش هتحتاج ترجع لأي كتاب أو موقع عن تدريس القواعد تاني.</div>", "n": 1, "i": 3, "a": "tefl-18-003", "x": "ba695c3c"}, {"t": "section", "h": "Prescriptive grammar | القواعد الوصفية", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">Grammar means the rules and conventions by which words are ordered and changed to form a sentence. It can be prescriptive or descriptive.</div><div class=\"u\">القواعد يعني القوانين والأعراف اللي بترتّب وتغيّر الكلمات عشان تكوّن جملة. وممكن تكون وصفية (prescriptive) أو واقعية (descriptive).</div>", "n": 1, "i": 5, "a": "tefl-18-004", "x": "4ec6a54b"}, {"t": "learn", "h": "<div class=\"u\">Prescriptive grammar sets rules you should follow to write correct or good English.</div><div class=\"u\">القواعد الوصفية بتحط قوانين المفروض تتبعها عشان تكتب إنجليزية صح أو كويسة.</div>", "n": 1, "i": 6, "a": "tefl-18-005", "x": "c92dbec4"}, {"t": "learn", "h": "<div class=\"u\">Sometimes these rules come from observing how educated speakers actually use the language. Other times they come from what someone was taught at school many years ago.</div><div class=\"u\">أحيانًا القوانين دي جاية من ملاحظة إزاي المتكلمين المتعلمين بيستخدموا اللغة فعلًا. وأحيانًا جاية من اللي حد اتعلمه في المدرسة من سنين كتير.</div>", "n": 1, "i": 7, "a": "tefl-18-006", "x": "be59b2af"}, {"t": "learn", "h": "<div class=\"u\">Example: My teacher always said you should never start a sentence with And or But. Oh, really?</div><div class=\"u\">مثال: مدرستي كانت بتقول دايمًا ممنوع تبدأ جملة بـAnd أو But. بجد يعني؟</div>", "n": 1, "i": 8, "a": "tefl-18-007", "x": "a874f95d"}, {"t": "learn", "h": "<div class=\"u\">Prescriptive rules make a value judgment: they say an utterance is correct or not correct.</div><div class=\"u\">القوانين الوصفية بتدي حكم قيمة: بتقول الكلام ده صح أو مش صح.</div>", "n": 1, "i": 9, "a": "tefl-18-008", "x": "f3876264"}, {"t": "section", "h": "Descriptive grammar | القواعد الواقعية", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">Descriptive grammar seeks to describe how language is actually used in the real world. It accepts the patterns speakers really use and tries to account for them.</div><div class=\"u\">القواعد الواقعية بتحاول توصف إزاي اللغة بتتستخدم فعلًا في الحقيقة. بتقبل الأنماط اللي المتكلمين بيستخدموها فعلًا وبتحاول تفسّرها.</div>", "n": 1, "i": 11, "a": "tefl-18-009", "x": "d8ec7313"}, {"t": "learn", "h": "<div class=\"u\">Descriptive rules allow different varieties of a language. They do not ignore a construction just because some prescriptive grammarian dislikes it.</div><div class=\"u\">القوانين الواقعية بتسمح بتنوعات اللغة المختلفة. مابتتجاهلش تركيبة بس عشان نحوي وصفي مش عاجباه.</div>", "n": 1, "i": 12, "a": "tefl-18-010", "x": "ec10cbe9"}, {"t": "learn", "h": "<div class=\"u\">Descriptive rules also change, because language itself is always changing.</div><div class=\"u\">القوانين الواقعية بتتغير كمان، لأن اللغة نفسها بتتغير على طول.</div>", "n": 1, "i": 13, "a": "tefl-18-011", "x": "a6a4043c"}, {"t": "learn", "h": "<div class=\"u\">Example 1: Let's start at the very beginning. Prescriptive rules call this wrong: the beginning is already a start point, so very adds nothing.</div><div class=\"u\">مثال ١: Let's start at the very beginning. الوصفية بتقول غلط: البداية أصلًا نقطة بدء، فـvery مش بتضيف حاجة.</div>", "n": 1, "i": 14, "a": "tefl-18-012", "x": "19833994"}, {"t": "learn", "h": "<div class=\"u\">Descriptive rules note this phrase is common in spoken English. So we align with the descriptive side and keep very in.</div><div class=\"u\">الواقعية بتلاحظ إن التعبير ده شائع في الكلام المنطوق. فبنميل للجانب الواقعي وبنخلي very.</div>", "n": 1, "i": 15, "a": "tefl-18-013", "x": "ff0976cd"}, {"t": "learn", "h": "<div class=\"u\">Example 2: That's very true, absolutely true. Prescriptive says nothing can be more true than true. Descriptive says native speakers say it, so we use it.</div><div class=\"u\">مثال ٢: That's very true, absolutely true. الوصفية بتقول مفيش حاجة أصدق من true. الواقعية بتقول أصحاب اللغة بيقولوها، فهنستخدمها.</div>", "n": 1, "i": 16, "a": "tefl-18-014", "x": "6ce931ad"}, {"t": "learn", "h": "<div class=\"u\">Example 3: Who do you want to speak to? Descriptive says fine. Prescriptive says never end a sentence with a preposition, so make it: To whom do you want to speak?</div><div class=\"u\">مثال ٣: Who do you want to speak to? الواقعية بتقول تمام. الوصفية بتقول ممنوع تنهي جملة بحرف جر، فخليها: To whom do you want to speak?</div>", "n": 1, "i": 17, "a": "tefl-18-015", "x": "6bb0e403"}, {"t": "learn", "h": "<div class=\"u\">To us, the prescriptive version seems cumbersome and out-dated, but you decide which is best.</div><div class=\"u\">بالنسبالنا النسخة الوصفية تقيلة وقديمة، بس إنت قرر أنهي أحسن.</div>", "n": 1, "i": 18, "a": "tefl-18-016", "x": "fdfd813d"}, {"t": "learn", "h": "<div class=\"u\">Example 4: never start a sentence with And or But. Compare two versions of the same thought.</div><div class=\"u\">مثال ٤: ممنوع تبدأ جملة بـAnd أو But. قارن نسختين لنفس الفكرة.</div>", "n": 1, "i": 19, "a": "tefl-18-017", "x": "5dd3d9dd"}, {"t": "learn", "h": "<div class=\"u\">Version one joins with but: It's a pretty smart plan but do you think those changes go far enough?</div><div class=\"u\">النسخة الأولى بتوصل بـbut: It's a pretty smart plan but do you think those changes go far enough?</div>", "n": 1, "i": 20, "a": "tefl-18-018", "x": "5d44e0dd"}, {"t": "learn", "h": "<div class=\"u\">Version two starts a new sentence: It's a pretty smart plan. But do you think those changes go far enough?</div><div class=\"u\">النسخة التانية بتبدأ جملة جديدة: It's a pretty smart plan. But do you think those changes go far enough?</div>", "n": 1, "i": 21, "a": "tefl-18-019", "x": "9c28d3c7"}, {"t": "learn", "h": "<div class=\"u\">The first fits the prescriptive rule. The second fits the descriptive approach, and it creates a more forceful, emphatic effect. Starting with But gives the thought more weight.</div><div class=\"u\">الأولى ماشية مع القاعدة الوصفية. التانية ماشية مع المنهج الواقعي، وبتدي تأثير أقوى وأكتر تأكيدًا. البداية بـBut بتدي الفكرة وزن أكبر.</div>", "n": 1, "i": 22, "a": "tefl-18-020", "x": "6bfe82d8"}, {"t": "section", "h": "Why prescriptive rules still matter | ليه القوانين الوصفية لسه مهمة", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">Do not think prescriptive rules are unimportant. Following most of them means using the standard form of the language, so the greatest number of people understand you.</div><div class=\"u\">ماتفتكرش إن القوانين الوصفية مش مهمة. اتباع أغلبها معناه إنك بتستخدم الصيغة القياسية للغة، فأكبر عدد من الناس يفهموك.</div>", "n": 1, "i": 24, "a": "tefl-18-021", "x": "029783f5"}, {"t": "learn", "h": "<div class=\"u\">Most prescriptive rules are critical for foreign language learners. Learning English would not work without guidelines.</div><div class=\"u\">أغلب القوانين الوصفية ضرورية لمتعلمي اللغة الأجنبية. تعلم الإنجليزية ماهينفعش من غير إرشادات.</div>", "n": 1, "i": 25, "a": "tefl-18-022", "x": "5b915b4b"}, {"t": "learn", "h": "<div class=\"u\">They also let a speaker of a non-standard dialect learn the standard dialect and use it in the right social situations, if they wish.</div><div class=\"u\">وكمان بتخلي متكلم اللهجة غير القياسية يتعلم اللهجة القياسية ويستخدمها في المواقف الاجتماعية المناسبة، لو حابب.</div>", "n": 1, "i": 26, "a": "tefl-18-023", "x": "717f8d8c"}, {"t": "learn", "h": "<div class=\"u\">Unfortunately, non-standard dialects are still frowned upon by many groups, and can hold a person back in society and business.</div><div class=\"u\">للأسف، اللهجات غير القياسية لسه متنظرلها باستعلاء من مجموعات كتير، وممكن تعطّل الشخص في المجتمع والشغل.</div>", "n": 1, "i": 27, "a": "tefl-18-024", "x": "e9b44b3b"}, {"t": "learn", "h": "<div class=\"u\">Common prescriptive rules that prevent confusion: the subject must agree with the verb, so never He go to school. Capitalise the first letter of a sentence.</div><div class=\"u\">قوانين وصفية شائعة بتمنع اللخبطة: الفاعل لازم يوافق الفعل، فممنوع He go to school. وابدأ الجملة بحرف كبير.</div>", "n": 1, "i": 28, "a": "tefl-18-025", "x": "7d07aa94"}, {"t": "learn", "h": "<div class=\"u\">More rules: use subject pronouns after the verb be: It was I who phoned you, not It was me who phoned you.</div><div class=\"u\">قوانين كمان: استخدم ضمائر الفاعل بعد الفعل be: It was I who phoned you، مش It was me who phoned you.</div>", "n": 1, "i": 29, "a": "tefl-18-026", "x": "e360777a"}, {"t": "learn", "h": "<div class=\"u\">Use the before rivers and geographical areas, but not before lakes or continents: the Amazon, the Far East; but Lake Superior, Europe.</div><div class=\"u\">واستخدم the قبل الأنهار والمناطق الجغرافية، لكن مش قبل البحيرات أو القارات: the Amazon وthe Far East؛ لكن Lake Superior وEurope.</div>", "n": 1, "i": 30, "a": "tefl-18-027", "x": "327e31bb"}, {"t": "learn", "h": "<div class=\"u\">The teaching takeaway: make learners familiar with some prescriptive rules, while alerting them to informal descriptive alternatives.</div><div class=\"u\">الخلاصة للتدريس: خلّي المتعلمين متعودين على شوية قوانين وصفية، وفي نفس الوقت نبّههم للبدائل الواقعية الأقل رسمية.</div>", "n": 1, "i": 31, "a": "tefl-18-028", "x": "5aceb3cb"}, {"t": "learn", "h": "<div class=\"u\">Both types have supporters and detractors, so both have strengths and weaknesses. You need to decide how you will approach the teaching of grammar.</div><div class=\"u\">النوعين ليهم مؤيدين ومعارضين، فالاتنين ليهم نقاط قوة وضعف. وإنت محتاج تقرر هتتعامل إزاي مع تدريس القواعد.</div>", "n": 1, "i": 32, "a": "tefl-18-029", "x": "4c315ab8"}, {"t": "section", "h": "Presenting visually and with timelines | التقديم البصري والخطوط الزمنية", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">Knowing the rules is essential, but how you teach them paves the way to success. First mode: present material visually.</div><div class=\"u\">معرفة القوانين ضرورية، بس طريقة تدريسها هي اللي بتوصّل للنجاح. أول طريقة: قدّم المادة بصريًا.</div>", "n": 1, "i": 34, "a": "tefl-18-030", "x": "d6bae85c"}, {"t": "learn", "h": "<div class=\"u\">Use board drawings, illustrations, pictures, objects, or props to show how a structure is formed, what it means, and how it is used.</div><div class=\"u\">استخدم رسومات السبورة والتوضيحات والصور والأشياء والمجسمات عشان توضح التركيبة بتتكوّن إزاي، ومعناها إيه، وبتتستخدم إزاي.</div>", "n": 1, "i": 35, "a": "tefl-18-031", "x": "b9752ae2"}, {"t": "learn", "h": "<div class=\"u\">Example: show pictures and ask, What differences do you notice? This can practise must/must have, as in He must have fallen.</div><div class=\"u\">مثال: اعرض صور واسأل: لاحظت اختلافات إيه في الصور؟ ده ممكن يتمرن على must/must have زي He must have fallen.</div>", "n": 1, "i": 36, "a": "tefl-18-032", "x": "472295dc"}, {"t": "learn", "h": "<div class=\"u\">The same idea practises could/could have, as in He could have been hit by a car.</div><div class=\"u\">ونفس الفكرة بتتمرن على could/could have، زي He could have been hit by a car.</div>", "n": 1, "i": 37, "a": "tefl-18-033", "x": "30c76f43"}, {"t": "learn", "h": "<div class=\"u\">Second mode: use timelines. A timeline is a simple diagram you draw on the board showing the relationship between a verb form and its time reference.</div><div class=\"u\">تاني طريقة: استخدم الخطوط الزمنية (timelines). الخط الزمني رسم بسيط بترسمه على السبورة بيوضح العلاقة بين صيغة الفعل ووقته.</div>", "n": 1, "i": 38, "a": "tefl-18-034", "x": "c490100b"}, {"t": "learn", "h": "<div class=\"u\">There is no set format for a timeline. Just explain it first. Use an X or any symbol to mark the event.</div><div class=\"u\">مفيش شكل ثابت للخط الزمني. بس اشرحه الأول. استخدم X أو أي رمز يعلّم الحدث.</div>", "n": 1, "i": 39, "a": "tefl-18-035", "x": "2b70dcf5"}, {"t": "learn", "h": "<div class=\"u\">Example: a timeline for the past simple: Yesterday, I walked to school, with an X on the past point.</div><div class=\"u\">مثال: خط زمني للماضي البسيط: Yesterday, I walked to school، مع علامة X على نقطة الماضي.</div>", "n": 1, "i": 40, "a": "tefl-18-036", "x": "134e6bd9"}, {"t": "learn", "h": "<div class=\"u\">For the future continuous, use a squiggly line to show the event continuing: Next year he is climbing Kilimanjaro.</div><div class=\"u\">وللمستقبل المستمر، استخدم خط متعرج يوضح إن الحدث مستمر: Next year he is climbing Kilimanjaro.</div>", "n": 1, "i": 41, "a": "tefl-18-037", "x": "26d0f71f"}, {"t": "learn", "h": "<div class=\"u\">The My Timeline exercise: students draw a timeline of important events in their lives, from the past till now.</div><div class=\"u\">تدريب My Timeline: الطلبة بيرسموا خط زمني لأحداث مهمة في حياتهم، من الماضي لحد دلوقتي.</div>", "n": 1, "i": 42, "a": "tefl-18-038", "x": "b28209b6"}, {"t": "learn", "h": "<div class=\"u\">Young students can ask parents for dates: when they were born, first walked, first talked, first went to school.</div><div class=\"u\">الصغيرين يقدروا يسألوا أهاليهم عن التواريخ: اتولدوا إمتى، أول ما مشوا، أول ما اتكلموا، أول ما راحوا المدرسة.</div>", "n": 1, "i": 43, "a": "tefl-18-039", "x": "1dbe7a0b"}, {"t": "learn", "h": "<div class=\"u\">Add a fun one: when the student did something silly. Reading these out later creates a lot of fun.</div><div class=\"u\">ضيف واحدة للضحك: إمتى الطالب عمل حاجة هبلة. قرايتهم قدام بعض بعدين بتعمل فرفشة كبيرة.</div>", "n": 1, "i": 44, "a": "tefl-18-040", "x": "838e0f81"}, {"t": "learn", "h": "<div class=\"u\">Then change the format: student A interviews student B and draws B's timeline. They swap roles, then read each other's timelines to the class.</div><div class=\"u\">بعدين غيّر الشكل: الطالب A يقابل الطالب B ويرسم الخط الزمني بتاعه. يبدلوا الأدوار، وبعدين كل واحد يقرا خط التاني قدام الكلاس.</div>", "n": 1, "i": 45, "a": "tefl-18-041", "x": "afbd8842"}, {"t": "learn", "h": "<div class=\"u\">You can also plot historical events of their country, or world events like space exploration, the Olympic Games, or medicine. Keep away from serious political events like attempted coups.</div><div class=\"u\">وتقدر كمان ترسم أحداث تاريخية لبلدهم، أو أحداث عالمية زي استكشاف الفضاء أو الأولمبياد أو الطب. ابعد عن الأحداث السياسية الثقيلة زي الانقلابات.</div>", "n": 1, "i": 46, "a": "tefl-18-042", "x": "e13d0382"}, {"t": "learn", "h": "<div class=\"u\">Or give a short written text: students read it for comprehension, then build a timeline from its important facts. Later, extend My Timeline to future events.</div><div class=\"u\">أو اديهم نص مكتوب قصير: يقرأوه للفهم، وبعدين يبنوا خط زمني من حقائقه المهمة. وبعدين وسّع My Timeline لأحداث مستقبلية.</div>", "n": 1, "i": 47, "a": "tefl-18-043", "x": "3318b529"}, {"t": "learn", "h": "<div class=\"u\">Key point: integrate the grammar work into the key skills, speaking, listening, reading, and writing, as much as possible.</div><div class=\"u\">النقطة الأساسية: ادمج شغل القواعد في المهارات الأساسية، الكلام والاستماع والقراءة والكتابة، بأكبر قدر ممكن.</div>", "n": 1, "i": 48, "a": "tefl-18-044", "x": "1ecec0c1"}, {"t": "section", "h": "Situations and demonstration | المواقف والعرض العملي", "n": 1, "i": 49}, {"t": "learn", "h": "<div class=\"u\">Third mode: present through situations. Imagine teaching going to. Draw a face on the board with a name: Maria. Add a thought bubble above her.</div><div class=\"u\">تالت طريقة: قدّم من خلال المواقف. تخيل بتدرّس going to. ارسم وش على السبورة وتحته اسم: Maria. وفوقها فقاعة تفكير.</div>", "n": 1, "i": 50, "a": "tefl-18-045", "x": "ba921966"}, {"t": "learn", "h": "<div class=\"u\">Say: This is Maria and she is thinking about something nice. I wonder what it is. Draw an aeroplane: Ah, she is thinking of her holiday next week. She is going to fly. Class repeats.</div><div class=\"u\">قول: دي Maria وبتفكر في حاجة حلوة. عايز أعرف إيه هي. ارسم طيارة: آه، بتفكر في أجازتها الأسبوع الجاي. She is going to fly. والكلاس يعيد.</div>", "n": 1, "i": 51, "a": "tefl-18-046", "x": "7ff8068d"}, {"t": "learn", "h": "<div class=\"u\">Draw or show a picture of the Sagrada Familia in Barcelona. Elicit until you get: She is going to visit the Sagrada Familia. Class repeats.</div><div class=\"u\">ارسم أو اعرض صورة كنيسة Sagrada Familia في برشلونة. استخرج منهم لحد ما يقولوا: She is going to visit the Sagrada Familia. والكلاس يعيد.</div>", "n": 1, "i": 52, "a": "tefl-18-047", "x": "e9fbf2ed"}, {"t": "learn", "h": "<div class=\"u\">Draw a camera: She is going to take pictures. Elicit more: What other things is she going to do? Drill each correct response with the whole class and individuals, and write it on the board.</div><div class=\"u\">ارسم كاميرا: She is going to take pictures. استخرج أكتر: هتعمل إيه كمان؟ درّب كل إجابة صح مع الكلاس كله وأفراد، واكتبها على السبورة.</div>", "n": 1, "i": 53, "a": "tefl-18-048", "x": "cc8e972b"}, {"t": "learn", "h": "<div class=\"u\">Then check understanding with concept questions at random: What is Maria going to do next week? Where is she going to visit?</div><div class=\"u\">بعدين اتأكد من الفهم بأسئلة المفهوم (concept questions) بشكل عشوائي: Maria هتعمل إيه الأسبوع الجاي؟ هتزور فين؟</div>", "n": 1, "i": 54, "a": "tefl-18-049", "x": "9d14c17f"}, {"t": "learn", "h": "<div class=\"u\">Recap the structure avoiding metalanguage, words about language like noun and verb.</div><div class=\"u\">راجع التركيبة من غير metalanguage (كلام عن اللغة زي noun وverb).</div>", "n": 1, "i": 55, "a": "tefl-18-050", "x": "60032115"}, {"t": "learn", "h": "<div class=\"u\">Then move to practice: a gap-fill exercise, then production through pair conversation and a writing activity.</div><div class=\"u\">وبعدين انتقل للتمرين: تدريب ملء فراغات، وبعدين إنتاج من خلال محادثة في أزواج ونشاط كتابة.</div>", "n": 1, "i": 56, "a": "tefl-18-051", "x": "67e23e7f"}, {"t": "learn", "h": "<div class=\"u\">Several examples through one situation help the class build a clear idea of what the structure means and how it is used.</div><div class=\"u\">أمثلة كتير من موقف واحد بتساعد الكلاس يبني فكرة واضحة عن معنى التركيبة واستخدامها.</div>", "n": 1, "i": 57, "a": "tefl-18-052", "x": "4ba4bbf0"}, {"t": "learn", "h": "<div class=\"u\">Later, just present the situation and let the students give the examples. This verifies understanding and gets the class involved.</div><div class=\"u\">وبعدين، اعرض الموقف بس وسيب الطلبة هما اللي يجيبوا الأمثلة. ده بيتحقق من الفهم وبيشرك الكلاس.</div>", "n": 1, "i": 58, "a": "tefl-18-053", "x": "55566fbe"}, {"t": "learn", "h": "<div class=\"u\">Fourth mode: demonstration. Show the meaning physically, acting it out in front of the class.</div><div class=\"u\">رابع طريقة: العرض العملي (demonstration). وضّح المعنى بجسمك، ومثّله قدام الكلاس.</div>", "n": 1, "i": 59, "a": "tefl-18-054", "x": "950ca43a"}, {"t": "learn", "h": "<div class=\"u\">Tell them you are going to open the door, or going to give a prize in a few minutes to whoever is best behaved.</div><div class=\"u\">قولهم إنك going to open the door، أو going to give a prize في شوية لأحسن واحد مؤدب.</div>", "n": 1, "i": 60, "a": "tefl-18-055", "x": "d32a5a6e"}, {"t": "learn", "h": "<div class=\"u\">Or: going to open the window because it is too hot, and going to close the window because it is too cold.</div><div class=\"u\">أو: going to open the window لأن الجو حر، وgoing to close the window لأن الجو برد.</div>", "n": 1, "i": 61, "a": "tefl-18-056", "x": "1af5c7a6"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">Prescriptive grammar: rules for correct English, making value judgments about utterances.</div><div class=\"u\">القواعد الوصفية (prescriptive): قوانين للإنجليزية الصح، بتدي أحكام قيمة على الكلام.</div>", "n": 1, "i": 63, "a": "tefl-18-057", "x": "f5f1fa25"}, {"t": "learn", "h": "<div class=\"u\">Descriptive grammar: describes how language is actually used, accepting real patterns and varieties.</div><div class=\"u\">القواعد الواقعية (descriptive): بتوصف إزاي اللغة بتتستخدم فعلًا، وبتقبل الأنماط والتنوعات الحقيقية.</div>", "n": 1, "i": 64, "a": "tefl-18-058", "x": "d5c07361"}, {"t": "learn", "h": "<div class=\"u\">Timeline: a simple board diagram linking a verb form to its time reference.</div><div class=\"u\">الخط الزمني (timeline): رسم بسيط على السبورة بيربط صيغة الفعل بوقته.</div>", "n": 1, "i": 65, "a": "tefl-18-059", "x": "addb7494"}, {"t": "learn", "h": "<div class=\"u\">Metalanguage: language about language, words like noun, verb, adjective.</div><div class=\"u\">الميتالغة (metalanguage): كلام عن اللغة، كلمات زي noun وverb وadjective.</div>", "n": 1, "i": 66, "a": "tefl-18-060", "x": "c2518239"}, {"t": "learn", "h": "<div class=\"u\">Elicit: to draw the answer out of students instead of giving it to them.</div><div class=\"u\">الاستخراج (elicit): إنك تطلّع الإجابة من الطلبة بدل ما تديهالهم.</div>", "n": 1, "i": 67, "a": "tefl-18-061", "x": "fde3c709"}, {"t": "learn", "h": "<div class=\"u\">Concept questions: questions that check students understood the concept, asked at random.</div><div class=\"u\">أسئلة المفهوم (concept questions): أسئلة بتتأكد إن الطلبة فهموا المفهوم، بتتسأل عشوائي.</div>", "n": 1, "i": 68, "a": "tefl-18-062", "x": "cb148d13"}, {"t": "learn", "h": "<div class=\"u\">Gap-fill: an exercise where students complete missing words in a text.</div><div class=\"u\">ملء الفراغات (gap-fill): تدريب الطلبة بيكمّلوا فيه الكلمات الناقصة في نص.</div>", "n": 1, "i": 69, "a": "tefl-18-063", "x": "dcb29f2c"}, {"t": "learn", "h": "<div class=\"u\">Props and realia: real objects brought to class to show meaning.</div><div class=\"u\">المجسمات (props/realia): أشياء حقيقية بتتجاب للكلاس عشان توضح المعنى.</div>", "n": 1, "i": 70, "a": "tefl-18-064", "x": "0364d9f2"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 71}, {"t": "learn", "h": "<div class=\"u\">Prescriptive grammar sets rules for correct English; descriptive grammar describes real usage and accepts varieties. Both have strengths and weaknesses.</div><div class=\"u\">القواعد الوصفية بتحط قوانين للإنجليزية الصح؛ الواقعية بتوصف الاستخدام الحقيقي وبتقبل التنوعات. الاتنين ليهم نقاط قوة وضعف.</div>", "n": 1, "i": 72, "a": "tefl-18-065", "x": "8bc5906e"}, {"t": "learn", "h": "<div class=\"u\">Keep prescriptive basics that prevent confusion: subject-verb agreement, capital letters, pronouns after be, the with rivers but not lakes.</div><div class=\"u\">احتفظ بالأساسيات الوصفية اللي بتمنع اللخبطة: موافقة الفاعل للفعل، الحروف الكبيرة، الضمائر بعد be، وthe مع الأنهار مش البحيرات.</div>", "n": 1, "i": 73, "a": "tefl-18-066", "x": "b7f6eafa"}, {"t": "learn", "h": "<div class=\"u\">Present grammar four ways: visually with pictures and props, with timelines, through situations like Maria's holiday, and through physical demonstration.</div><div class=\"u\">قدّم القواعد بأربع طرق: بصريًا بالصور والمجسمات، بالخطوط الزمنية، من خلال مواقف زي أجازة Maria، وبالعرض العملي الجسدي.</div>", "n": 1, "i": 74, "a": "tefl-18-067", "x": "d3746260"}, {"t": "learn", "h": "<div class=\"u\">Timelines have no set format: explain them first, mark events with symbols, and link grammar to the four skills.</div><div class=\"u\">الخطوط الزمنية ملهاش شكل ثابت: اشرحها الأول، علّم الأحداث برموز، واربط القواعد بالمهارات الأربعة.</div>", "n": 1, "i": 75, "a": "tefl-18-068", "x": "c12a97fa"}, {"t": "learn", "h": "<div class=\"u\">In a situation presentation: elicit, drill, check with concept questions, avoid metalanguage, then practise with gap-fills and pair production.</div><div class=\"u\">في تقديم الموقف: استخرج، درّب، اتأكد بأسئلة المفهوم، ابعد عن الميتالغة، وبعدين تمرّن بملء فراغات وإنتاج في أزواج.</div>", "n": 1, "i": 76, "a": "tefl-18-069", "x": "33ff692c"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 77}, {"t": "tf", "q": "Descriptive grammar seeks to describe how language is actually used in the real world.<br>القواعد الواقعية بتحاول توصف إزاي اللغة بتتستخدم فعلًا في الحقيقة.", "ans": true, "why": "True. It accepts the patterns speakers actually use. | صح. بتقبل الأنماط اللي المتكلمين بيستخدموها فعلًا.", "ex": ["Correct. | صح.", "Wrong. Describing real usage is exactly its job. | غلط: وصف الاستخدام الحقيقي هو شغلها بالظبط."], "n": 1, "i": 78, "h": ""}, {"t": "mc", "q": "Never start a sentence with And or But is an example of:<br>ممنوع تبدأ جملة بـAnd أو But مثال على:", "opts": ["a prescriptive rule | قاعدة وصفية (prescriptive)", "a descriptive rule | قاعدة واقعية (descriptive)", "a timeline | خط زمني"], "ans": 0, "why": "It judges correctness, based on what someone was taught at school. | بتحكم على الصحة، مبنية على اللي حد اتعلمه في المدرسة.", "ex": ["Correct. | صح.", "No. A descriptive rule would report what people actually do. | غلط: القاعدة الواقعية بتسجل اللي الناس بتعمله فعلًا.", "No. A timeline is a teaching diagram. | غلط: الخط الزمني رسم تعليمي."], "n": 1, "i": 79, "h": ""}, {"t": "tf", "q": "Prescriptive rules are not important.<br>القوانين الوصفية مش مهمة.", "ans": false, "why": "False. They give a standard form everyone understands, and foreign learners need guidelines. | غلط. بتدي صيغة قياسية الكل بيفهمها، ومتعلمي اللغة محتاجين إرشادات.", "ex": ["Wrong. They matter for standard communication and for learners. | غلط: مهمة للتواصل القياسي وللمتعلمين.", "Correct. | صح."], "n": 1, "i": 80, "h": ""}, {"t": "mc", "q": "Who do you want to speak to? A prescriptive grammarian would prefer:<br>Who do you want to speak to? النحوي الوصفي هيفضّل:", "opts": ["To whom do you want to speak? | To whom do you want to speak?", "Who you want to speak to? | Who you want to speak to?", "The sentence is fine as it is | الجملة تمام زي ما هي"], "ans": 0, "why": "The prescriptive view: never end a sentence with a preposition. | النظرة الوصفية: ممنوع تنهي جملة بحرف جر.", "ex": ["Correct. | صح.", "No. That keeps the final preposition. | غلط: دي سايبة حرف الجر في الآخر.", "No. That is the descriptive position. | غلط: ده موقف الواقعية."], "n": 1, "i": 81, "h": ""}, {"t": "tf", "q": "Timelines are simple diagrams that help learners see relationships between verb forms and their time reference.<br>الخطوط الزمنية رسومات بسيطة بتساعد المتعلمين يشوفوا العلاقة بين صيغ الأفعال وأوقاتها.", "ans": true, "why": "True. They are a visual representation of the passage of time. | صح. هي تمثيل بصري لمرور الوقت.", "ex": ["Correct. | صح.", "Wrong. Linking verb forms to time is exactly what timelines do. | غلط: ربط صيغ الأفعال بالوقت هو بالظبط شغل الخطوط الزمنية."], "n": 1, "i": 82, "h": ""}, {"t": "tf", "q": "There is a set format for making a timeline.<br>فيه شكل ثابت لعمل الخط الزمني.", "ans": false, "why": "False. There is no set format; just explain it first and mark events with any symbol. | غلط. مفيش شكل ثابت؛ بس اشرحه الأول وعلّم الأحداث بأي رمز.", "ex": ["Wrong. Any clear format works. | غلط: أي شكل واضح بينفع.", "Correct. | صح."], "n": 1, "i": 83, "h": ""}, {"t": "mc", "q": "In the Maria situation, what do you draw first on the board?<br>في موقف Maria، بترسم إيه الأول على السبورة؟", "opts": ["a face with a name and a thought bubble | وش مع اسم وفقاعة تفكير", "an aeroplane | طيارة", "a timeline | خط زمني"], "ans": 0, "why": "First Maria's face with her name and a thought bubble; then the aeroplane reveals what she is thinking about. | الأول وش Maria مع اسمها وفقاعة تفكير؛ وبعدين الطيارة بتوضح بتفكر في إيه.", "ex": ["Correct. | صح.", "No. The aeroplane comes after the face. | غلط: الطيارة بتيجي بعد الوش.", "No. Timelines are a different presentation mode. | غلط: الخط الزمني طريقة تانية."], "n": 1, "i": 84, "h": ""}, {"t": "mc", "q": "Eliciting means:<br>الاستخراج (eliciting) معناه:", "opts": ["drawing answers out of the students | تطلّع الإجابات من الطلبة", "giving students the answers | تدي الطلبة الإجابات", "drawing pictures on the board | ترسم صور على السبورة"], "ans": 0, "why": "You pull the response from the class instead of handing it to them. | بتطلّع الإجابة من الكلاس بدل ما تديهالهم.", "ex": ["Correct. | صح.", "No. That is the opposite of eliciting. | غلط: ده عكس الاستخراج.", "No. Drawing is just one visual aid. | غلط: الرسم مجرد وسيلة بصرية."], "n": 1, "i": 85, "h": ""}, {"t": "tf", "q": "In the My Timeline exercise, students draw a timeline of important events in their lives.<br>في تدريب My Timeline، الطلبة بيرسموا خط زمني لأحداث مهمة في حياتهم.", "ans": true, "why": "True. They can also interview a partner and draw their timeline instead. | صح. ويقدروا كمان يقابلوا زميل ويرسموا الخط الزمني بتاعه.", "ex": ["Correct. | صح.", "Wrong. Personal life events are exactly the content. | غلط: الأحداث الشخصية هي بالظبط المحتوى."], "n": 1, "i": 86, "h": ""}, {"t": "mc", "q": "Which is a prescriptive rule that prevents confusion?<br>أنهي دي قاعدة وصفية بتمنع اللخبطة؟", "opts": ["the subject must agree with the verb | الفاعل لازم يوافق الفعل", "never use the word very | ممنوع تستخدم كلمة very", "always end sentences with a preposition | دايمًا انهي الجمل بحرف جر"], "ans": 0, "why": "We must not say He go to school. Agreement keeps English clear. | ممنوع نقول He go to school. الموافقة بتخلي الإنجليزية واضحة.", "ex": ["Correct. | صح.", "No. Very true is common spoken English. | غلط: very true كلام منطوق شائع.", "No. Ending with a preposition is accepted by descriptive grammar, not prescribed. | غلط: الإنهاء بحرف جر حاجة الواقعية بتقبلها، مش قاعدة وصفية."], "n": 1, "i": 87, "h": ""}, {"t": "mc", "q": "Which article rule is prescriptive-standard?<br>أنهي قاعدة أداة تعريف وصفية-قياسية؟", "opts": ["the Amazon, but Lake Superior | the Amazon، لكن Lake Superior", "the Lake Superior | the Lake Superior", "the Europe | the Europe"], "ans": 0, "why": "Use the before rivers and geographical areas, but not before lakes or continents. | استخدم the قبل الأنهار والمناطق الجغرافية، لكن مش قبل البحيرات أو القارات.", "ex": ["Correct. | صح.", "No. Lakes take no the. | غلط: البحيرات مابتاخدش the.", "No. Continents take no the. | غلط: القارات مابتاخدش the."], "n": 1, "i": 88, "h": ""}, {"t": "recall", "q": "Give the four modes of presenting grammar from this unit.<br>اذكر الطرق الأربعة لتقديم القواعد من الوحدة دي.", "a": "Visually (pictures, props), with timelines, through situations (Maria), and through physical demonstration.<br>بصريًا (صور ومجسمات)، بالخطوط الزمنية، من خلال المواقف (Maria)، وبالعرض العملي الجسدي.", "n": 1, "i": 89, "h": ""}, {"t": "recall", "q": "Give two example sentences where descriptive grammar accepts what prescriptive grammar rejects.<br>اذكر مثالين جمل الواقعية بتقبلهم والوصفية بترفضهم.", "a": "Any 2 of: Let's start at the very beginning; That's very true; Who do you want to speak to?; starting a sentence with But.<br>أي ٢ من: Let's start at the very beginning؛ That's very true؛ Who do you want to speak to?؛ والبداية بـBut.", "n": 1, "i": 90, "h": ""}, {"t": "write", "q": "Explain the difference between prescriptive and descriptive grammar, with one example (3-4 sentences).<br>اشرح الفرق بين القواعد الوصفية والواقعية، بمثال واحد (٣-٤ جمل).", "key": "tefl-18:1", "a": "Prescriptive grammar sets rules for correct English and makes value judgments about utterances. Descriptive grammar describes how people actually use the language and accepts real patterns. For example, prescriptive rules say never end a sentence with a preposition, so Who do you want to speak to? is wrong. Descriptive rules accept it, because native speakers say it every day.<br>القواعد الوصفية بتحط قوانين للإنجليزية الصح وبتدي أحكام قيمة على الكلام. الواقعية بتوصف إزاي الناس بتستخدم اللغة فعلًا وبتقبل الأنماط الحقيقية. مثال، الوصفية بتقول ممنوع تنهي جملة بحرف جر، فـWho do you want to speak to? غلط. الواقعية بتقبلها، لأن أصحاب اللغة بيقولوها كل يوم.", "n": 1, "i": 91, "h": ""}, {"t": "write", "q": "Describe how you would teach going to using the Maria situation (4-5 sentences).<br>اوصف إزاي هتدرّس going to بموقف Maria (٤-٥ جمل).", "key": "tefl-18:2", "a": "I would draw Maria's face on the board with a thought bubble, then draw an aeroplane so the class discovers she is going to fly on her holiday. I would elicit more plans with pictures, like the Sagrada Familia and a camera, drilling each sentence: She is going to take pictures. Then I would check understanding with concept questions, avoiding metalanguage. Finally, the class would practise with a gap-fill and produce the structure in pair conversations and a short writing task.<br>هرسم وش Maria على السبورة مع فقاعة تفكير، وبعدين أرسم طيارة عشان الكلاس يكتشف إنها هتسافر في أجازتها. هستخرج خطط أكتر بصور، زي Sagrada Familia وكاميرا، وأدرّب كل جملة: She is going to take pictures. بعدين هتأكد من الفهم بأسئلة المفهوم، من غير ميتالغة. وفي الآخر، الكلاس هيتمرن بملء فراغات وينتج التركيبة في محادثات أزواج ونشاط كتابة قصير.", "n": 1, "i": 92, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: teaching grammar to every age group, from young learners to adults, plus the unit's questions.</div><div class=\"u\">الدرس الجاي: تدريس القواعد لكل الفئات العمرية، من الصغيرين للكبار، زائد أسئلة الوحدة.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 93}];</script>
