<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٥٤</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-54";window.STEPS=[{"t": "section", "h": "The lesson and its aims | الدرس وأهدافه", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">An authentic grammar lesson. You are going to watch a pre-intermediate level lesson, taught by Catherine.</div><div class=\"u\">درس قواعد حقيقي. هتتفرّج على درس مستوى قبل متوسط، بتقدّمه كاثرين.</div>", "n": 1, "i": 1, "a": "tefl-54-001", "x": "f36db5c1"}, {"t": "learn", "h": "<div class=\"u\">The aims of the lesson are for students to talk about things they should or should not have done in a past situation.</div><div class=\"u\">هدف الدرس إن الطلبة يتكلموا عن حاجات المفروض كانوا عملوها أو ماعملوهاش في موقف ماضي.</div>", "n": 1, "i": 2, "a": "tefl-54-002", "x": "ea5113a4"}, {"t": "learn", "h": "<div class=\"u\">The focus of the lesson is grammatical, so it also looks at the meaning, grammatical form and pronunciation of the target language: would have and could have.</div><div class=\"u\">تركيز الدرس قواعدي، فكمان بيبص على المعنى والشكل القواعدي والنطق بتاع اللغة المستهدفة: الوود هاف والكود هاف.</div>", "n": 1, "i": 3, "a": "tefl-54-003", "x": "cbbe3916"}, {"t": "learn", "h": "<div class=\"u\">Look at the lesson materials that accompany the lesson and print them off to refer to whilst watching.</div><div class=\"u\">بص على مواد الدرس المرافقة واطبعها عشان ترجعلها وإنت بتتفرّج.</div>", "n": 1, "i": 4, "a": "tefl-54-004", "x": "d46606a0"}, {"t": "learn", "h": "<div class=\"u\">This lesson is included because it demonstrates many useful techniques in how to teach grammar.</div><div class=\"u\">الدرس ده موجود لأنه بيعرّض تقنيات مفيدة كتير في تعليم القواعد.</div>", "n": 1, "i": 5, "a": "tefl-54-005", "x": "05f42dfb"}, {"t": "learn", "h": "<div class=\"u\">Three questions to answer as you watch. One: how did Catherine check that students understood the target language? Two: did she explain the grammatical form, or did she elicit it from them?</div><div class=\"u\">تلات أسئلة تجاوب عليهم وإنت بتتفرّج. واحد: كاثرين اتأكدت إزاي إن الطلبة فهموا اللغة المستهدفة؟ اتنين: هي شرحت الشكل القواعدي، ولا استخرجته منهم؟</div>", "n": 1, "i": 6, "a": "tefl-54-006", "x": "3c3c28e4"}, {"t": "learn", "h": "<div class=\"u\">Three: did her students know the grammar terminology?</div><div class=\"u\">تلاتة: طلبتها كانوا عارفين المصطلحات القواعدية؟</div>", "n": 1, "i": 7, "a": "tefl-54-007", "x": "28e5b006"}, {"t": "section", "h": "Home Alone in Barcelona | لوحده في برشلونة", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">The lesson text: Home Alone in Barcelona. Last weekend my dad was in Barcelona. Alan and I were there for the weekend with him, and then we left him in our house alone for four days.</div><div class=\"u\">نص الدرس: لوحده في برشلونة. الأسبوع اللي فات بابا كان في برشلونة. أنا وآلان كنا هناك معاه في الأجازة، وبعدين سبناه في بيتنا لوحده أربع أيام.</div>", "n": 1, "i": 9, "a": "tefl-54-008", "x": "b540147b"}, {"t": "learn", "h": "<div class=\"u\">He is 70 years old and that was the first time he had been alone in a foreign country, so he was excited but a little nervous too because he does not speak Spanish.</div><div class=\"u\">عنده ٧٠ سنة ودي كانت أول مرة يبقى لوحده في بلد أجنبية، فكان مبسوط بس متوتر شوية كمان لأنه مابيتكلمش إسباني.</div>", "n": 1, "i": 10, "a": "tefl-54-009", "x": "d46788eb"}, {"t": "learn", "h": "<div class=\"u\">We told him what he should and what he should not do before we left, but we were also a bit nervous because we had invited him to visit and felt responsible.</div><div class=\"u\">قولناله يعمل إيه ومايعملش إيه قبل ما نسافر، بس كنا متوترين شوية كمان لأن إحنا اللي دعيناه يزورنا وحاسسين بالمسؤولية.</div>", "n": 1, "i": 11, "a": "tefl-54-010", "x": "2f453c21"}, {"t": "learn", "h": "<div class=\"u\">Anyway, on his first day alone he went into the centre of Barcelona and some girls who try to sell flowers outside the churches stole his wallet!</div><div class=\"u\">المهم، في أول يوم لوحده راح نص برشلونة وشوية بنات بيحاولوا يبيعوا ورد قدام الكنائس سرقوا محفظته!</div>", "n": 1, "i": 12, "a": "tefl-54-011", "x": "f7d70650"}, {"t": "learn", "h": "<div class=\"u\">I could not believe it because I had warned him not to take his wallet into the centre. Men! He did not lose much money but he lost all his travel passes and two credit cards.</div><div class=\"u\">مقدرتش أصدّق لأني كنت حذّرته ماياخدش محفظته لنص البلد. رجالة! هو ماخسرش فلوس كتير بس خسر كل كروت المواصلات وكارتين بنك.</div>", "n": 1, "i": 13, "a": "tefl-54-012", "x": "b6ceeab8"}, {"t": "section", "h": "The practice activities | أنشطة التدريب", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">Activity one: more than one answer is possible; tick the ones that can be correct. What did I say to him when he phoned me?</div><div class=\"u\">نشاط واحد: ممكن أكتر من إجابة تكون صح؛ علّم على اللي ممكن تكون صح. أنا قلتله إيه لما كلّمني؟</div>", "n": 1, "i": 15, "a": "tefl-54-013", "x": "c5ef042a"}, {"t": "learn", "h": "<div class=\"u\">You should not have taken your wallet with you. You could have carried just a little money in your pocket.</div><div class=\"u\">مكانش المفروض تاخد محفظتك معاك. كنت ممكن تحمل شوية فلوس بس في جيبك.</div>", "n": 1, "i": 16, "a": "tefl-54-014", "x": "68057600"}, {"t": "learn", "h": "<div class=\"u\">Or: they would have taken your mobile if they had seen it.</div><div class=\"u\">أو: كانوا هيدوخوا موبايلك لو كانوا شافوه.</div>", "n": 1, "i": 17, "a": "tefl-54-015", "x": "69b69de3"}, {"t": "learn", "h": "<div class=\"u\">My dad then asked me: what would you have done when the girls asked for money? What can I not have done when the girls asked for money?</div><div class=\"u\">بابا بعدين سألني: إنت كنت هتعمل إيه لما البنات طلبوا فلوس؟ إيه اللي مستحيل أكون عملته لما البنات طلبوا فلوس؟</div>", "n": 1, "i": 18, "a": "tefl-54-016", "x": "30e953ee"}, {"t": "learn", "h": "<div class=\"u\">Or: what could I have done when the girls asked for money?</div><div class=\"u\">أو: إيه اللي كنت ممكن أعمله لما البنات طلبوا فلوس؟</div>", "n": 1, "i": 19, "a": "tefl-54-017", "x": "735fdfbf"}, {"t": "learn", "h": "<div class=\"u\">I told him: I would not have given them anything. I must have ignored them. I might have told someone in the church.</div><div class=\"u\">أنا قلتله: مكنتش هدّيهم أي حاجة. أكيد كنت هتجاهلهم. كنت ممكن أقول لحد في الكنيسة.</div>", "n": 1, "i": 20, "a": "tefl-54-018", "x": "cc111e63"}, {"t": "learn", "h": "<div class=\"u\">Activity two: complete the gaps with a phrase from the box and the best form of the verb. The box: should not have, would have, could have, could not have, should have, would not.</div><div class=\"u\">نشاط اتنين: كمّل الفراغات بعبارة من الصندوق وأحسن صيغة للفعل. الصندوق: مكانش المفروض، كان هيبقى، كان ممكن، مستحيل يكون، المفروض كان، مكانش هيبقى.</div>", "n": 1, "i": 21, "a": "tefl-54-019", "x": "341328d4"}, {"t": "learn", "h": "<div class=\"u\">Example: oh no, I have lost my homework! I knew I should not have done it on the train. Now Catherine will not believe I did it!</div><div class=\"u\">مثال: لأ، أنا ضيّعت الواجب! أنا كنت عارف إني مكانش المفروض أعمله في القطر. دلوقتي كاثرين مش هتصدّق إني عملته!</div>", "n": 1, "i": 22, "a": "tefl-54-020", "x": "1f8fd35f"}, {"t": "learn", "h": "<div class=\"u\">Gap two: watch where you are going! Phew! That was close! We could have crashed into that car.</div><div class=\"u\">فراغ اتنين: خلي بالك إنت ماشي فين! هوف! دي كانت قريبة! كنا ممكن نخبط في العربية دي.</div>", "n": 1, "i": 23, "a": "tefl-54-021", "x": "b9bee38b"}, {"t": "learn", "h": "<div class=\"u\">Gap three: the cleaning lady did not clean my flat very well. I should have done it myself and saved money.</div><div class=\"u\">فراغ تلاتة: بتاعة النضافة مانضّفتش شقتي كويس. المفروض كنت أعملها بنفسي وأوفّر فلوس.</div>", "n": 1, "i": 24, "a": "tefl-54-022", "x": "db0ff3d8"}, {"t": "learn", "h": "<div class=\"u\">Gap four: why did you not tell your friend the truth? I am sure she would have believed you. Gap five: I did my best to catch the train but I could not have run any faster.</div><div class=\"u\">فراغ أربعة: ليه ماقلتش الحقيقة لصاحبتك؟ أنا متأكد إنها كانت هتصدّقك. فراغ خمسة: أنا عملت كل أقدر عليه عشان ألحق القطر بس مستحيل كنت أقدر أجري أسرع من كده.</div>", "n": 1, "i": 25, "a": "tefl-54-023", "x": "48eab0ae"}, {"t": "learn", "h": "<div class=\"u\">Gap six: I had to remind Alan to buy me a ring when he asked me to marry him! I would not have got one if I had not asked!</div><div class=\"u\">فراغ ستة: أنا اضطرّيت أفكّر آلان يشتري لي دبلة لما طلب يتجوزني! مكنتش هاخد واحدة لو ماكانتش طلبت!</div>", "n": 1, "i": 26, "a": "tefl-54-024", "x": "63abaf1f"}, {"t": "section", "h": "Answers and teaching tips | الإجابات ونصايح التعليم", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">The answers to the three questions. One: how did Catherine check that students understood the target language? She asked them concept questions using three model sentences.</div><div class=\"u\">إجابات الأسئلة التلاتة. واحد: كاثرين اتأكدت إزاي إن الطلبة فهموا اللغة المستهدفة؟ هي سألتهم أسئلة تحقق من الفهم باستخدام تلات جمل نموذجية.</div>", "n": 1, "i": 28, "a": "tefl-54-025", "x": "fcb7161e"}, {"t": "learn", "h": "<div class=\"u\">The practice activities also help the teacher see how the students are coping and what needs to be revised at the end of the lesson or in another lesson.</div><div class=\"u\">أنشطة التدريب كمان بتساعد المدرس يشوف الطلبة ماشيين إزاي وإيه اللي محتاج يتراجع في آخر الدرس أو في درس تاني.</div>", "n": 1, "i": 29, "a": "tefl-54-026", "x": "ab23f483"}, {"t": "learn", "h": "<div class=\"u\">Two: did she explain the grammatical form or elicit it? She elicited the form from the students and highlighted it on the board after they had discussed it in pairs.</div><div class=\"u\">اتنين: هي شرحت الشكل القواعدي ولا استخرجته؟ هي استخرجته من الطلبة وظهّرته على السبورة بعد ما ناقشوه في ثنائيات.</div>", "n": 1, "i": 30, "a": "tefl-54-027", "x": "1a0c11ab"}, {"t": "learn", "h": "<div class=\"u\">This is much more effective than just explaining it.</div><div class=\"u\">ده أجدى بكتير من مجرد الشرح.</div>", "n": 1, "i": 31, "a": "tefl-54-028", "x": "3460b715"}, {"t": "learn", "h": "<div class=\"u\">Three: did her students know the grammar terminology? Yes, they did.</div><div class=\"u\">تلاتة: طلبتها كانوا عارفين المصطلحات القواعدية؟ أيوه، كانوا عارفينها.</div>", "n": 1, "i": 32, "a": "tefl-54-029", "x": "e46b5486"}, {"t": "learn", "h": "<div class=\"u\">It is part of good practice to always familiarise yourself with the terminology before the lesson, so you can use it correctly and confidently. This will also help you deal with any questions from students.</div><div class=\"u\">من الممارسات الكويسة إنك دايمًا تتأقلم مع المصطلحات قبل الدرس، عشان تستخدمها صح وبثقة. ده كمان هيساعدك تتعامل مع أي أسئلة من الطلبة.</div>", "n": 1, "i": 33, "a": "tefl-54-030", "x": "86c5e425"}, {"t": "learn", "h": "<div class=\"u\">Another tip: if a student asks an unrelated question whilst teaching, it is a good idea to note it down but tell the student that you want to continue with the focus of this lesson.</div><div class=\"u\">نصيحة تانية: لو طالب سأل سؤال مش مرتبط وإنت بتدرّس، فكرة كويسة تدوّنه بس تقول للطالب إنك عايز تكمّل في تركيز الدرس ده.</div>", "n": 1, "i": 34, "a": "tefl-54-031", "x": "aac314c0"}, {"t": "learn", "h": "<div class=\"u\">You should then go back to the student at the end of class, or the next day once you have had the chance to look it up, if it is a particularly tricky grammatical question.</div><div class=\"u\">وبعدين المفروض ترجع للطالب في آخر الحصة، أو اليوم التالي بعد ما تكون لقيت فرصة تدوّر على الإجابة، لو كان سؤال قواعدي شائك.</div>", "n": 1, "i": 35, "a": "tefl-54-032", "x": "3161b880"}, {"t": "section", "h": "Concept check questions | أسئلة التحقق من الفهم", "n": 1, "i": 36}, {"t": "learn", "h": "<div class=\"u\">Unit seven: further lesson evaluation. Look at the questions Catherine asked, based on this target language: they would have taken your mobile if they had seen it.</div><div class=\"u\">الوحدة السابعة: تقييم درس إضافي. بص على الأسئلة اللي كاثرين سألتها، مبنية على اللغة المستهدفة دي: كانوا هيدوخوا موبايلك لو كانوا شافوه.</div>", "n": 1, "i": 37, "a": "tefl-54-033", "x": "7d71eab8"}, {"t": "learn", "h": "<div class=\"u\">Her concept questions: did they see his mobile? Did they take his mobile? Was my dad lucky they did not see his mobile? Can I change this situation?</div><div class=\"u\">أسئلة التحقق بتاعتها: هما شافوا الموبايل بتاعه؟ هما خدوا الموبايل بتاعه؟ بابا كان محظوظ إنهم ماشافوش الموبايل؟ أقدر أغيّر الموقف ده؟</div>", "n": 1, "i": 38, "a": "tefl-54-034", "x": "089630a2"}, {"t": "learn", "h": "<div class=\"u\">These are examples of good concept check questions, used to check that students have understood the target language.</div><div class=\"u\">دي أمثلة لأسئلة تحقق من الفهم كويسة، بتتستخدم عشان تتأكد إن الطلبة فهموا اللغة المستهدفة.</div>", "n": 1, "i": 39, "a": "tefl-54-035", "x": "29918b58"}, {"t": "learn", "h": "<div class=\"u\">Concept questions should: A, be short and simple. B, avoid using the target language. C, not use language that is more difficult than the target language.</div><div class=\"u\">أسئلة التحقق المفروض: أ، تبقى قصيرة وبسيطة. ب، تتجنّب استخدام اللغة المستهدفة. ج، ماتستخدمش لغة أصعب من اللغة المستهدفة.</div>", "n": 1, "i": 40, "a": "tefl-54-036", "x": "52e80e36"}, {"t": "learn", "h": "<div class=\"u\">D, not check nouns that could be better checked by using pictures, drawing or props. E, be specific and unambiguous.</div><div class=\"u\">د، ماتختبرش أسماء ممكن تتختبر أحسن بالصور أو الرسم أو الأدوات. هـ، تبقى محددة وواضحة من غير غموض.</div>", "n": 1, "i": 41, "a": "tefl-54-037", "x": "bd8610b3"}, {"t": "learn", "h": "<div class=\"u\">F, check the concept of the target language and not other information that is obvious or irrelevant.</div><div class=\"u\">و، تختبر مفهوم اللغة المستهدفة مش معلومات تانية واضحة أو مش مرتبطة.</div>", "n": 1, "i": 42, "a": "tefl-54-038", "x": "e5e994bf"}, {"t": "section", "h": "Judging concept questions | تقييم أسئلة التحقق", "n": 1, "i": 43}, {"t": "learn", "h": "<div class=\"u\">Now judge some concept questions. Target language: I have lived here for three years. Concept question: did I take up residence in my present abode three years prior to this date?</div><div class=\"u\">دلوقتي قيّم شوية أسئلة تحقق. اللغة المستهدفة: أنا عايش هنا من تلات سنين. سؤال التحقق: هل أنا اتخذت سكن في مسكني الحالي قبل تلات سنين من التاريخ ده؟</div>", "n": 1, "i": 44, "a": "tefl-54-039", "x": "9e899fa4"}, {"t": "learn", "h": "<div class=\"u\">Not a good concept question. It uses language far more difficult than the target language, which breaks rule C.</div><div class=\"u\">ده مش سؤال تحقق كويس. بيستخدم لغة أصعب بكتير من اللغة المستهدفة، وده بيكسر القاعدة ج.</div>", "n": 1, "i": 45, "a": "tefl-54-040", "x": "fb35dc9b"}, {"t": "learn", "h": "<div class=\"u\">Target language: a chest of drawers. Concept questions: is it made of wood? Is there one in your house?</div><div class=\"u\">اللغة المستهدفة: تسريحة بأدراج. أسئلة التحقق: معمولة من خشب؟ في واحدة في بيتك؟</div>", "n": 1, "i": 46, "a": "tefl-54-041", "x": "1c29fc52"}, {"t": "learn", "h": "<div class=\"u\">Not a good concept question. A noun like this is better checked with a picture, drawing or a prop, which breaks rule D.</div><div class=\"u\">دي مش أسئلة تحقق كويسة. اسم زي ده الأحسن يتختبر بصورة أو رسمة أو أداة، وده بيكسر القاعدة د.</div>", "n": 1, "i": 47, "a": "tefl-54-042", "x": "3e0a53a5"}, {"t": "learn", "h": "<div class=\"u\">Target language: he managed to open the window. Concept question: did he manage to open the door?</div><div class=\"u\">اللغة المستهدفة: هو قدر يفتح الشباك. سؤال التحقق: هو قدر يفتح الباب؟</div>", "n": 1, "i": 48, "a": "tefl-54-043", "x": "ee8878a7"}, {"t": "learn", "h": "<div class=\"u\">Not a good concept question. It reuses the target language, managed to, which breaks rule B, and it checks something irrelevant, the door, which breaks rule F.</div><div class=\"u\">ده مش سؤال تحقق كويس. بيعيد استخدام اللغة المستهدفة، قدر يعمل، وده بيكسر القاعدة ب، وبيختبر حاجة مش مرتبطة، الباب، وده بيكسر القاعدة و.</div>", "n": 1, "i": 49, "a": "tefl-54-044", "x": "b96ad71c"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\">target language: the grammar or words the lesson teaches.</div><div class=\"u\">اللغة المستهدفة: القواعد أو الكلمات اللي الدرس بيعلّمها.</div>", "n": 1, "i": 51, "a": "tefl-54-045", "x": "e487888f"}, {"t": "learn", "h": "<div class=\"u\">concept question: a short simple question that checks understanding.</div><div class=\"u\">سؤال التحقق: سؤال قصير وبسيط بيختبر الفهم.</div>", "n": 1, "i": 52, "a": "tefl-54-046", "x": "abae4a69"}, {"t": "learn", "h": "<div class=\"u\">elicit: to draw the answer out of the students instead of telling them.</div><div class=\"u\">الاستخراج: إنك تطلّع الإجابة من الطلبة بدل ما تقولها لهم.</div>", "n": 1, "i": 53, "a": "tefl-54-047", "x": "4f1d93f2"}, {"t": "learn", "h": "<div class=\"u\">model sentence: an example sentence used for concept questions.</div><div class=\"u\">الجملة النموذجية: جملة مثال بتتستخدم لأسئلة التحقق.</div>", "n": 1, "i": 54, "a": "tefl-54-048", "x": "55eb0fdc"}, {"t": "learn", "h": "<div class=\"u\">pair discussion: students talk in twos before feeding back.</div><div class=\"u\">النقاش الثنائي: الطلبة بيتكلموا في ثنائيات قبل المشاركة.</div>", "n": 1, "i": 55, "a": "tefl-54-049", "x": "082eafa5"}, {"t": "learn", "h": "<div class=\"u\">unrelated question: a student question off the lesson's focus; note it and return later.</div><div class=\"u\">السؤال غير المرتبط: سؤال طالب بره تركيز الدرس؛ دوّنه وارجعله بعدين.</div>", "n": 1, "i": 56, "a": "tefl-54-050", "x": "06b2f76a"}, {"t": "learn", "h": "<div class=\"u\">props: real objects used to check vocabulary.</div><div class=\"u\">الأدوات: حاجات حقيقية بتتستخدم لاختبار المفردات.</div>", "n": 1, "i": 57, "a": "tefl-54-051", "x": "8f53b10b"}, {"t": "learn", "h": "<div class=\"u\">unambiguous: having one clear meaning, no confusion.</div><div class=\"u\">غير غامض: ليه معنى واحد واضح، من غير لخبطة.</div>", "n": 1, "i": 58, "a": "tefl-54-052", "x": "2daaedf3"}, {"t": "learn", "h": "<div class=\"u\">revise: to go over material again at the end of a lesson.</div><div class=\"u\">المراجعة: ترجع على المادة تاني في آخر الدرس.</div>", "n": 1, "i": 59, "a": "tefl-54-053", "x": "89ee4dec"}, {"t": "learn", "h": "<div class=\"u\">familiarise: to make yourself comfortable with terminology before class.</div><div class=\"u\">التأقلم: إنك تبقى مرتاح مع المصطلحات قبل الحصة.</div>", "n": 1, "i": 60, "a": "tefl-54-054", "x": "f2fc4fa7"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">Catherine's lesson teaches should have, would have and could have for talking about past situations.</div><div class=\"u\">درس كاثرين بيعلّم الشود هاف والوود هاف والكود هاف للكلام عن مواقف ماضية.</div>", "n": 1, "i": 62, "a": "tefl-54-055", "x": "b4a35311"}, {"t": "learn", "h": "<div class=\"u\">The context is a real story: a 70-year-old dad alone in Barcelona whose wallet is stolen on his first day.</div><div class=\"u\">السياق قصة حقيقية: بابا عنده ٧٠ سنة لوحده في برشلونة محفظته اتسرقت في أول يوم.</div>", "n": 1, "i": 63, "a": "tefl-54-056", "x": "b6e2b5e6"}, {"t": "learn", "h": "<div class=\"u\">She checked understanding with concept questions on three model sentences, and elicited the form after pair discussion instead of just explaining it.</div><div class=\"u\">هي اتأكدت من الفهم بأسئلة تحقق على تلات جمل نموذجية، واستخرجت الشكل بعد النقاش الثنائي بدل مجرد الشرح.</div>", "n": 1, "i": 64, "a": "tefl-54-057", "x": "21ff28df"}, {"t": "learn", "h": "<div class=\"u\">Know your terminology before the lesson, and note unrelated student questions down to answer at the end or the next day.</div><div class=\"u\">اعرف مصطلحاتك قبل الدرس، ودوّن أسئلة الطلبة غير المرتبطة عشان تجاوب عليها في الآخر أو اليوم التالي.</div>", "n": 1, "i": 65, "a": "tefl-54-058", "x": "9c58e392"}, {"t": "learn", "h": "<div class=\"u\">Good concept questions are short and simple, avoid the target language, use no harder language, skip nouns better shown with pictures, stay specific, and check only the concept.</div><div class=\"u\">أسئلة التحقق الكويسة قصيرة وبسيطة، بتتجنّب اللغة المستهدفة، من غير لغة أصعب، بتسيب الأسماء اللي الصور أحسن لها، محددة، وبتختبر المفهوم بس.</div>", "n": 1, "i": 66, "a": "tefl-54-059", "x": "ab4a0d78"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 67}, {"t": "mc", "q": "What is the target language of the Barcelona lesson?<br>إيه اللغة المستهدفة في درس برشلونة؟", "opts": ["should have, would have, could have plus past participle | الشود هاف والوود هاف والكود هاف مع التصريف التالت", "the zero conditional | الشرطية الصفرية", "reported questions | الأسئلة المنقولة"], "ans": 0, "why": "The lesson talks about things people should or should not have done in a past situation. | الدرس بيتكلم عن حاجات الناس المفروض كانوا عملوها أو لأ في موقف ماضي.", "ex": ["Correct. | صح.", "No. Conditionals were Unit 4. | غلط: الشرطيات كانت الوحدة الرابعة.", "No. Reported speech was Unit 5. | غلط: الكلام المنقول كان الوحدة الخامسة."], "n": 1, "i": 68, "h": ""}, {"t": "mc", "q": "How did Catherine check understanding?<br>كاثرين اتأكدت من الفهم إزاي؟", "opts": ["concept questions on three model sentences | أسئلة تحقق على تلات جمل نموذجية", "a written exam | امتحان مكتوب", "translating the text | ترجمة النص"], "ans": 0, "why": "She asked concept questions using three model sentences, and the practice activities showed how students coped. | هي سألت أسئلة تحقق باستخدام تلات جمل نموذجية، وأنشطة التدريب ورّتها الطلبة ماشيين إزاي.", "ex": ["Correct. | صح.", "No. She checked orally in class. | غلط: هي اتأكدت شفوي في الحصة.", "No. Translation was not her method. | غلط: الترجمة مكانتش طريقتها."], "n": 1, "i": 69, "h": ""}, {"t": "mc", "q": "Did Catherine explain the grammatical form or elicit it?<br>كاثرين شرحت الشكل القواعدي ولا استخرجته؟", "opts": ["she elicited it after pair discussion | استخرجته بعد النقاش الثنائي", "she explained it directly | شرحته مباشرة", "she skipped the form | سابت الشكل خالص"], "ans": 0, "why": "She elicited the form and highlighted it on the board after pairs discussed it; much more effective than explaining. | هي استخرجت الشكل وظهّرته على السبورة بعد ما الثنائيات ناقشوه؛ أجدى بكتير من الشرح.", "ex": ["Correct. | صح.", "No. Eliciting is more effective. | غلط: الاستخراج أجدى.", "No. The form was central to the lesson. | غلط: الشكل كان مركز الدرس."], "n": 1, "i": 70, "h": ""}, {"t": "tf", "q": "Did they take his mobile? is a good concept question for: they would have taken your mobile if they had seen it.<br>هما خدوا الموبايل بتاعه؟ سؤال تحقق كويس لجملة: كانوا هيدوخوا موبايلك لو كانوا شافوه.", "ans": true, "why": "Correct. It is short, simple, avoids the target language and checks the concept. | صح. قصير وبسيط وبيتحنّب اللغة المستهدفة وبيختبر المفهوم.", "ex": ["Correct. | صح.", "Wrong. It meets all the criteria. | غلط: بيحقق كل المعايير."], "n": 1, "i": 71, "h": ""}, {"t": "mc", "q": "Which of these breaks the rules for concept questions?<br>أنهي واحد في دول بيكسر قواعد أسئلة التحقق؟", "opts": ["Did I take up residence in my present abode three years prior to this date? | هل اتخذت سكن في مسكني الحالي قبل تلات سنين من التاريخ ده؟", "Did they see his mobile? | هما شافوا الموبايل بتاعه؟", "Can I change this situation? | أقدر أغيّر الموقف ده؟"], "ans": 0, "why": "It uses language much harder than the target language. Concept questions must stay simple. | بيستخدم لغة أصعب بكتير من اللغة المستهدفة. أسئلة التحقق لازم تفضل بسيطة.", "ex": ["Correct. | صح.", "No. That one is short and simple. | غلط: ده قصير وبسيط.", "No. That one checks the concept clearly. | غلط: ده بيختبر المفهوم بوضوح."], "n": 1, "i": 72, "h": ""}, {"t": "tf", "q": "For a noun like a chest of drawers, concept questions are better than pictures.<br>لاسم زي التسريحة، أسئلة التحقق أحسن من الصور.", "ans": false, "why": "False. Nouns are better checked with pictures, drawings or props. | غلط. الأسماء الأحسن تتختبر بالصور أو الرسم أو الأدوات.", "ex": ["Correct. | صح.", "Wrong. Show a picture instead. | غلط: اعرض صورة بدل كده."], "n": 1, "i": 73, "h": ""}, {"t": "mc", "q": "A student asks an unrelated grammar question mid-lesson. What should you do?<br>طالب سأل سؤال قواعدي مش مرتبط في نص الدرس. تعمل إيه؟", "opts": ["note it down, continue the lesson, and return to it at the end or the next day | دوّنه وكمّل الدرس وارجعله في الآخر أو اليوم التالي", "stop the lesson and answer fully | وقّف الدرس وجاوب بالتفصيل", "tell the student never to interrupt | قول للطالب متقاطعش أبدًا"], "ans": 0, "why": "Note it, keep the lesson's focus, then return to it at the end of class or the next day after looking it up. | دوّنه وحافظ على تركيز الدرس، وبعدين ارجعله في آخر الحصة أو اليوم التالي بعد ما تدور على الإجابة.", "ex": ["Correct. | صح.", "No. That loses the lesson's focus. | غلط: ده بيضيّع تركيز الدرس.", "No. The question is welcomed, just later. | غلط: السؤال مرحّب بيه، بس بعدين."], "n": 1, "i": 74, "h": ""}, {"t": "mc", "q": "Watch where you are going! We ___ into that car.<br>خلي بالك إنت ماشي فين! كنا ___ في العربية دي.", "opts": ["could have crashed | ممكن نخبط", "should have crashed | المفروض نخبط", "must have crashed | أكيد خبطنا"], "ans": 0, "why": "Could have crashed: it was possible, and it nearly happened, but it did not. | كان ممكن نخبط: كان ممكن، وكاد يحصل، بس ماحصلش.", "ex": ["Correct. | صح.", "No. Should have means it was right to do it. | غلط: المفروض معناها إنه كان الصح يحصل.", "No. They did not crash. | غلط: هما ماخبطوش."], "n": 1, "i": 75, "h": ""}, {"t": "recall", "q": "List the six criteria for good concept questions.<br>اذكر المعايير الستة لأسئلة التحقق الكويسة.", "a": "Short and simple; avoid the target language; no more difficult language; no nouns better checked with pictures or props; specific and unambiguous; check the concept only.<br>قصيرة وبسيطة؛ بتتجنّب اللغة المستهدفة؛ من غير لغة أصعب؛ مفيش أسماء الصور أحسن لها؛ محددة وواضحة؛ بتختبر المفهوم بس.", "n": 1, "i": 76, "h": ""}, {"t": "recall", "q": "What were the three observation questions for the Barcelona lesson?<br>إيه الأسئلة التلاتة اللي بنراقب بيها درس برشلونة؟", "a": "How did Catherine check understanding? Did she explain the form or elicit it? Did her students know the grammar terminology?<br>كاثرين اتأكدت من الفهم إزاي؟ هي شرحت الشكل ولا استخرجته؟ طلبتها كانوا عارفين المصطلحات؟", "n": 1, "i": 77, "h": ""}, {"t": "write", "q": "Why is eliciting better than explaining the grammar form? (3-4 sentences)<br>ليه الاستخراج أحسن من شرح الشكل القواعدي؟ (٣-٤ جمل).", "key": "tefl-54:1", "a": "Eliciting pulls the form out of the students after they discuss it in pairs, so they do the thinking themselves. Catherine elicited the form and highlighted it on the board, which is much more effective than just explaining it. Students who discover a pattern remember it better than students who only hear it. The discussion also shows the teacher who already understands and who still needs help.<br>الاستخراج بيطلّع الشكل من الطلبة بعد ما يناقشوه في ثنائيات، فهما اللي بيفكّروا بأنفسهم. كاثرين استخرجت الشكل وظهّرته على السبورة، وده أجدى بكتير من مجرد الشرح. الطلبة اللي بيكتشفوا القاعدة بيفتكروها أحسن من اللي بيسمعوها بس. النقاش كمان بيورّي المدرس مين فاهم خلاص ومين لسه محتاج مساعدة.", "n": 1, "i": 78, "h": ""}, {"t": "write", "q": "Write two good concept questions for: I have lived here for three years. Say why they are good. (3-4 sentences)<br>اكتب سؤالين تحقق كويسين لجملة: أنا عايش هنا من تلات سنين. وقول ليه هما كويسين. (٣-٤ جمل).", "key": "tefl-54:2", "a": "Question one: do I live here now? Question two: did I move here three years ago? Both are short and simple, and they avoid the target language, the present perfect. They use easier language than the target language, and they check only the concept: the living started three years ago and continues now. They are specific, so there is only one right answer to each.<br>سؤال واحد: أنا عايش هنا دلوقتي؟ سؤال اتنين: أنا انتقلت هنا من تلات سنين؟ الاتنين قصيرين وبسيطين، وبيتحنّبوا اللغة المستهدفة، المضارع التام. بيستخدموا لغة أسهل من اللغة المستهدفة، وبيختبروا المفهوم بس: السكن بدأ من تلات سنين ومستمر دلوقتي. محددين، ففي إجابة واحدة بس صح لكل واحد.", "n": 1, "i": 79, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 12, Targeting Children: managing behaviour.</div><div class=\"u\">الدرس الجاي: الوحدة ١٢، تعليم الأطفال: إدارة السلوك.</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 80}];</script>
