<h1>عالم تيفل ٥: إيه اللي بيخلي المدرس كفء؟</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٥</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script>window.LESSON_ID="tefl-05";window.STEPS=[{"t": "section", "h": "What is competence? | يعني إيه كفاءة؟", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Welcome to Unit 3. If you have never taught before, this is the biggest question in your mind. And even if you have just started teaching, it is still a big question.</div><div class=\"u\">أهلًا بيك في الوحدة التالتة. لو مدرّستش قبل كده، ده أكبر سؤال في دماغك. وحتى لو لسه بادئ تدرّس، لسه ده سؤال كبير.</div>", "n": 1, "i": 1, "a": "tefl-05-001", "x": "243d0ace"}, {"t": "learn", "h": "<div class=\"u\">What makes a competent and effective teacher?</div><div class=\"u\">إيه اللي بيخلي المدرس كفء وفعال؟</div>", "n": 1, "i": 2, "a": "tefl-05-002", "x": "47176194"}, {"t": "learn", "h": "<div class=\"u\">In any job, the goal is competence. Oxford Dictionaries says competent means having the necessary ability, knowledge, or skill to do something successfully.</div><div class=\"u\">في أي شغل، الهدف هو الكفاءة. قاموس أوكسفورد بيقول إن كفء معناها عندك القدرة أو المعرفة أو المهارة اللازمة عشان تعمل حاجة بنجاح.</div>", "n": 1, "i": 3, "a": "tefl-05-003", "x": "3cdb85c7"}, {"t": "learn", "h": "<div class=\"u\">Our experience tells us to also include habits. For example, arriving at the classroom on time and welcoming your students as they come in is a very good habit.</div><div class=\"u\">خبرتنا بتقول لازم نضيف كمان العادات. مثلًا، إنك توصل الفصل في معادك وترحّب بطلابك وهما داخلين، دي عادة كويسة جدًا.</div>", "n": 1, "i": 4, "a": "tefl-05-004", "x": "371fdec0"}, {"t": "learn", "h": "<div class=\"u\">Another good habit: reflecting on how the lesson went, immediately after the lesson or as soon as possible.</div><div class=\"u\">عادة كويسة تانية: إنك تراجع الدرس عدى إزاي، فورًا بعد الدرس أو في أقرب وقت ممكن.</div>", "n": 1, "i": 5, "a": "tefl-05-005", "x": "cd2e6066"}, {"t": "learn", "h": "<div class=\"u\">So our expanded definition: a competent teacher is a person who has the knowledge, ability, skills, and habits necessary to teach successfully.</div><div class=\"u\">فتعريفنا الموسّع: المدرس الكفء هو الشخص اللي عنده المعرفة والقدرة والمهارات والعادات اللازمة عشان يدرّس بنجاح.</div>", "n": 1, "i": 6, "a": "tefl-05-006", "x": "4ab0429e"}, {"t": "learn", "h": "<div class=\"u\">We changed the word order on purpose, so you can remember the parts with the mnemonic KASH: Knowledge, Ability, Skills, Habits.</div><div class=\"u\">غيّرنا ترتيب الكلمات بقصد، عشان تفتكر الأجزاء بكلمة اختصارية KASH: معرفة وقدرة ومهارات وعادات.</div>", "n": 1, "i": 7, "a": "tefl-05-007", "x": "592c3658"}, {"t": "learn", "h": "<div class=\"u\">Use KASH when you are asked in a staff meeting what makes a competent teacher.</div><div class=\"u\">استخدم KASH لما حد يسألك في اجتماع مدرسين: إيه اللي بيخلي المدرس كفء.</div>", "n": 1, "i": 8, "a": "tefl-05-008", "x": "80ae0d53"}, {"t": "learn", "h": "<div class=\"u\">The competent and effective teacher does 2 things at all times: follows a Code of Practice for Teachers, and demonstrates the necessary knowledge, abilities, skills, and habits.</div><div class=\"u\">المدرس الكفء والفعال بيعمل حاجتين طول الوقت: بيلتزم بميثاق ممارسة للمدرسين، وبيبيّن المعرفة والقدرات والمهارات والعادات اللازمة.</div>", "n": 1, "i": 9, "a": "tefl-05-009", "x": "ccedc9d1"}, {"t": "section", "h": "The Code and its heart | الميثاق وقلبه", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">Many schools do not have a Code of Practice that you are asked to follow. Do not worry about this; it does not stop you from following your own Code of Practice.</div><div class=\"u\">مدارس كتير مفيهاش ميثاق ممارسة بيتطلبوا منك تتبعه. متقلقش من ده؛ ده مش بيمنعك إنك تتبع ميثاق الممارسة بتاعك إنت.</div>", "n": 1, "i": 11, "a": "tefl-05-010", "x": "2752c78d"}, {"t": "learn", "h": "<div class=\"u\">Your Code of Practice was developed by ACCREDITAT, our accrediting body. It is based on their experience and the experience of thousands of EFL teachers.</div><div class=\"u\">ميثاق الممارسة بتاعك معمول بواسطة ACCREDITAT، وهي جهة الاعتماد بتاعتنا. ومبني على خبرتهم وخبرة آلاف المدرسين في تدريس الإنجليزي.</div>", "n": 1, "i": 12, "a": "tefl-05-011", "x": "dfce57dc"}, {"t": "learn", "h": "<div class=\"u\">At the heart of the Code: a conviction that excellence is achieved via competence.</div><div class=\"u\">في قلب الميثاق: قناعة إن التميز بيتحقق عن طريق الكفاءة.</div>", "n": 1, "i": 13, "a": "tefl-05-012", "x": "0502fa8e"}, {"t": "learn", "h": "<div class=\"u\">Also at its heart: a belief in the worth, individuality, and dignity of each person.</div><div class=\"u\">وكمان في قلبه: إيمان بقيمة وفردية وكرامة كل شخص.</div>", "n": 1, "i": 14, "a": "tefl-05-013", "x": "248fe4d2"}, {"t": "learn", "h": "<div class=\"u\">A commitment to truth, excellence, and democratic principles.</div><div class=\"u\">والتزام بالحقيقة والتميز والمبادئ الديمقراطية.</div>", "n": 1, "i": 15, "a": "tefl-05-014", "x": "5a3d9dbf"}, {"t": "learn", "h": "<div class=\"u\">An allegiance to the freedom to learn and teach.</div><div class=\"u\">ولاء لحرية التعلم والتدريس.</div>", "n": 1, "i": 16, "a": "tefl-05-015", "x": "bcdf6031"}, {"t": "learn", "h": "<div class=\"u\">And a dedication to the principle of equal opportunity for all.</div><div class=\"u\">وتفاني في مبدأ تكافؤ الفرص للكل.</div>", "n": 1, "i": 17, "a": "tefl-05-016", "x": "bdcf69a1"}, {"t": "section", "h": "Honesty and Integrity | الأمانة والنزاهة", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">Value group 1: Honesty and Integrity. Create and maintain appropriate professional relationships in the classroom, the school, and in public.</div><div class=\"u\">مجموعة القيم ١: الأمانة والنزاهة. اعمل وحافظ على علاقات مهنية مناسبة في الفصل والمدرسة وأما الناس.</div>", "n": 1, "i": 19, "a": "tefl-05-017", "x": "6830c812"}, {"t": "learn", "h": "<div class=\"u\">Act with impartiality, truthfulness, and honesty. Display consistently high standards of personal and professional behaviour.</div><div class=\"u\">تصرّف بحياد وصدق وأمانة. وأظهر مستويات عالية ثابتة من السلوك الشخصي والمهني.</div>", "n": 1, "i": 20, "a": "tefl-05-018", "x": "8f693a81"}, {"t": "learn", "h": "<div class=\"u\">Do not disclose information about colleagues, unless disclosure serves a compelling professional purpose or is required by law.</div><div class=\"u\">متفصحش عن معلومات عن زمايلك، إلا لو الإفصاح ليه غرض مهني قوي أو مطلوب قانونًا.</div>", "n": 1, "i": 21, "a": "tefl-05-019", "x": "116ba7ff"}, {"t": "learn", "h": "<div class=\"u\">Never abuse a position of authority, or relationships with students, parents, carers, or colleagues, for financial, political, or personal gain.</div><div class=\"u\">أبدًا متستغلش منصب السلطة، ولا علاقاتك بالطلاب أو أولياء الأمور أو الزمايل، عشان مكسب مادي أو سياسي أو شخصي.</div>", "n": 1, "i": 22, "a": "tefl-05-020", "x": "26ac25f4"}, {"t": "learn", "h": "<div class=\"u\">And act according to the law.</div><div class=\"u\">وتصرّف حسب القانون.</div>", "n": 1, "i": 23, "a": "tefl-05-021", "x": "80a96bbd"}, {"t": "section", "h": "Dignity and Diversity | الكرامة والتنوع", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">Value group 2: Dignity and Diversity. Value diversity and treat students, parents, carers, and colleagues equitably and fairly, with care and compassion.</div><div class=\"u\">مجموعة القيم ٢: الكرامة والتنوع. قدّر التنوع وعامل الطلاب وأولياء الأمور والزمايل بعدل وإنصاف، برعاية وتعاطف.</div>", "n": 1, "i": 25, "a": "tefl-05-022", "x": "8571b117"}, {"t": "learn", "h": "<div class=\"u\">Respect the uniqueness of family and socio-economic backgrounds, cultures, races, religions, and beliefs.</div><div class=\"u\">واحترم خصوصية الخلفيات العائلية والاجتماعية والاقتصادية والثقافات والأعراق والأديان والمعتقدات.</div>", "n": 1, "i": 26, "a": "tefl-05-023", "x": "e80c18ec"}, {"t": "learn", "h": "<div class=\"u\">Value the learning needs, the effort, and the potential of each student, and acknowledge the uniqueness of each one.</div><div class=\"u\">قدّر احتياجات التعلم والمجهود والإمكانيات لكل طالب، واعترف بخصوصية كل واحد فيهم.</div>", "n": 1, "i": 27, "a": "tefl-05-024", "x": "e3218108"}, {"t": "learn", "h": "<div class=\"u\">Improve the wellbeing and progress of students with special needs.</div><div class=\"u\">حسّن رفاهية وتقدم الطلاب ذوي الاحتياجات الخاصة.</div>", "n": 1, "i": 28, "a": "tefl-05-025", "x": "a21220e6"}, {"t": "learn", "h": "<div class=\"u\">Foster the valuing of diversity and encourage international, multicultural, gender, indigenous, and other perspectives.</div><div class=\"u\">شجّع تقدير التنوع وشجّع وجهات النظر الدولية ومتعددة الثقافات والنوع والسكان الأصليين وغيرها.</div>", "n": 1, "i": 29, "a": "tefl-05-026", "x": "44e7e736"}, {"t": "learn", "h": "<div class=\"u\">And allow, reasonably, the students' access to varying points of view.</div><div class=\"u\">واسمح، بشكل معقول، بوصول الطلاب لوجهات نظر متنوعة.</div>", "n": 1, "i": 30, "a": "tefl-05-027", "x": "f014d4c2"}, {"t": "section", "h": "Respect and Trust | الاحترام والثقة", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">Value group 3: Respect and Trust. Relationships with students and their families must be based on mutual respect, trust, and confidentiality of personal information.</div><div class=\"u\">مجموعة القيم ٣: الاحترام والثقة. العلاقات مع الطلاب وعائلاتهم لازم تبقى مبنية على الاحترام المتبادل والثقة وسرية المعلومات الشخصية.</div>", "n": 1, "i": 32, "a": "tefl-05-028", "x": "9db3672b"}, {"t": "learn", "h": "<div class=\"u\">The same exception applies: personal information can be disclosed only for a compelling professional purpose or when the law requires it.</div><div class=\"u\">ونفس الاستثناء: المعلومات الشخصية ممكن تتفصح بس لغرض مهني قوي أو لما القانون يطلب.</div>", "n": 1, "i": 33, "a": "tefl-05-029", "x": "9c308079"}, {"t": "learn", "h": "<div class=\"u\">Acknowledge the contribution that mutual respect, trust, and confidentiality make to students' wellbeing and learning.</div><div class=\"u\">اعترف بمساهمة الاحترام المتبادل والثقة والسرية في رفاهية الطلاب وتعلمهم.</div>", "n": 1, "i": 34, "a": "tefl-05-030", "x": "5e2aa81b"}, {"t": "learn", "h": "<div class=\"u\">Acknowledge the desires and hopes of the students' families and carers.</div><div class=\"u\">واعترف برغبات وآمال عائلات الطلاب والقائمين عليهم.</div>", "n": 1, "i": 35, "a": "tefl-05-031", "x": "ea242576"}, {"t": "learn", "h": "<div class=\"u\">Act with educational colleagues and the wider community in ways which enhance the profession. Acknowledge the status, responsibilities, and authority of colleagues.</div><div class=\"u\">تصرّف مع زمايلك في التعليم والمجتمع الأوسع بطرق بترفع من قيمة المهنة. واعترف بمكانة ومسؤوليات وسلطة زمايلك.</div>", "n": 1, "i": 36, "a": "tefl-05-032", "x": "5ed79753"}, {"t": "learn", "h": "<div class=\"u\">And remain open to constructive criticism from peers, showing respect and consideration for different viewpoints.</div><div class=\"u\">وفضل مفتوح للنقد البنّاء من الزمايل، مع احترام وتقدير لوجهات النظر المختلفة.</div>", "n": 1, "i": 37, "a": "tefl-05-033", "x": "a62240f5"}, {"t": "section", "h": "Responsibility | المسؤولية والمحاسبة", "n": 1, "i": 38}, {"t": "learn", "h": "<div class=\"u\">Value group 4: Responsibility and Accountability. Give priority to the education and welfare of all students in your care.</div><div class=\"u\">مجموعة القيم ٤: المسؤولية والمحاسبة. خلي أولويتك تعليم ورفاهية كل الطلاب اللي في رعايتك.</div>", "n": 1, "i": 39, "a": "tefl-05-034", "x": "29e5b980"}, {"t": "learn", "h": "<div class=\"u\">Guide and encourage students to achieve their potential, and ensure all students have an equal opportunity to achieve it.</div><div class=\"u\">وجّه وشجّع الطلاب يحققوا إمكانياتهم، واتأكد إن كل الطلاب عندهم فرصة متساوية يحققوها.</div>", "n": 1, "i": 40, "a": "tefl-05-035", "x": "665020fd"}, {"t": "learn", "h": "<div class=\"u\">Create interactive learning environments, not environments where students are merely passive recipients of information.</div><div class=\"u\">اعمل بيئات تعلم تفاعلية، مش بيئات الطلاب فيها مجرد مستقبلين سلبيين للمعلومات.</div>", "n": 1, "i": 41, "a": "tefl-05-036", "x": "ff50040c"}, {"t": "learn", "h": "<div class=\"u\">Regard yourself as a learner: engage in continuous professional development, and improve teaching and learning strategies for yourself and your colleagues.</div><div class=\"u\">اعتبر نفسك متعلم: شارك في التطوير المهني المستمر، وحسّن استراتيجيات التدريس والتعلم لنفسك ولزمايلك.</div>", "n": 1, "i": 42, "a": "tefl-05-037", "x": "cce38422"}, {"t": "learn", "h": "<div class=\"u\">Work collaboratively, co-operatively, and enthusiastically with colleagues and other educational bodies, in the best interests of the students.</div><div class=\"u\">اشتغل بتعاون وبحماس مع الزمايل والجهات التعليمية التانية، في مصلحة الطلاب.</div>", "n": 1, "i": 43, "a": "tefl-05-038", "x": "2848ab9c"}, {"t": "learn", "h": "<div class=\"u\">Take care to distinguish between your personal views and those of the school or governing body.</div><div class=\"u\">خد بالك تفرّق بين آرائك الشخصية وآراء المدرسة أو الجهة الحاكمة.</div>", "n": 1, "i": 44, "a": "tefl-05-039", "x": "1cbc2233"}, {"t": "learn", "h": "<div class=\"u\">Promote the ongoing development of teaching as a profession, and uphold school policies, procedures, and practices.</div><div class=\"u\">شجّع التطوير المستمر للتدريس كمهنة، واحترم سياسات وإجراءات وممارسات المدرسة.</div>", "n": 1, "i": 45, "a": "tefl-05-040", "x": "faab40dc"}, {"t": "learn", "h": "<div class=\"u\">Model the behaviour, attitudes, and positive values widely accepted in society, and encourage students to apply them and to critically appreciate their significance.</div><div class=\"u\">كن قدوة في السلوك والاتجاهات والقيم الإيجابية المقبولة في المجتمع، وشجّع طلابك يطبقوها ويقدّروا أهميتها بعقل نقدي.</div>", "n": 1, "i": 46, "a": "tefl-05-041", "x": "833b20cf"}, {"t": "section", "h": "Care, Fairness, and the end | الرعاية والعدل والختام", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">Value group 5: Care and Protection. Have empathy, respect, and rapport with students, their families and carers, colleagues, and communities.</div><div class=\"u\">مجموعة القيم ٥: الرعاية والحماية. خلي عندك تعاطف واحترام وألفة مع الطلاب وعائلاتهم وزمايلك والمجتمع.</div>", "n": 1, "i": 48, "a": "tefl-05-042", "x": "10643124"}, {"t": "learn", "h": "<div class=\"u\">Commit to students' wellbeing and learning through positive influence, professional judgment, and empathy in practice.</div><div class=\"u\">التزم برفاهية الطلاب وتعلمهم من خلال التأثير الإيجابي والحكم المهني والتعاطف في الممارسة.</div>", "n": 1, "i": 49, "a": "tefl-05-043", "x": "69b172ad"}, {"t": "learn", "h": "<div class=\"u\">Adhere to the school's student protection policies and procedures.</div><div class=\"u\">التزم بسياسات وإجراءات حماية الطلاب في المدرسة.</div>", "n": 1, "i": 50, "a": "tefl-05-044", "x": "5571a67b"}, {"t": "learn", "h": "<div class=\"u\">Make reasonable effort to protect the student from conditions harmful to learning or to health and safety.</div><div class=\"u\">ابذل مجهود معقول تحمي الطالب من أي ظروف مضرة بالتعلم أو بالصحة والسلامة.</div>", "n": 1, "i": 51, "a": "tefl-05-045", "x": "923e6fda"}, {"t": "learn", "h": "<div class=\"u\">Refrain from any racial, gender, political, verbal, physical, or emotional abuse, embarrassment, or harassment.</div><div class=\"u\">امتنع عن أي إساءة عرقية أو جنسية أو سياسية أو لفظية أو جسدية أو عاطفية، أو إحراج أو تحرش.</div>", "n": 1, "i": 52, "a": "tefl-05-046", "x": "b8da9fe7"}, {"t": "learn", "h": "<div class=\"u\">And be generous with praise, and give positive inputs and feedback.</div><div class=\"u\">وكن كريم في المدح، وقدّم ملاحظات وتقييمات إيجابية.</div>", "n": 1, "i": 53, "a": "tefl-05-047", "x": "276a1b04"}, {"t": "learn", "h": "<div class=\"u\">Value group 6: Fairness and Justice. Be fair and reasonable at all times, and be committed to the wellbeing of individuals and the community and to the common good.</div><div class=\"u\">مجموعة القيم ٦: العدل والإنصاف. كن عادل ومنطقي طول الوقت، وملتزم برفاهية الأفراد والمجتمع وبالخير العام.</div>", "n": 1, "i": 54, "a": "tefl-05-048", "x": "70aed3ce"}, {"t": "learn", "h": "<div class=\"u\">Resolve competing claims or problems arising from different ethical principles and interest groups through reflective professional discussion.</div><div class=\"u\">احل المطالب المتعارضة أو المشاكل الناشئة من مبادئ أخلاقية مختلفة ومجموعات مصالح مختلفة عن طريق النقاش المهني المتأمل.</div>", "n": 1, "i": 55, "a": "tefl-05-049", "x": "90461d77"}, {"t": "learn", "h": "<div class=\"u\">Adhere to this Code and you won't go wrong. Print it off and keep it with you always. Reflect on it frequently. It will serve you well.</div><div class=\"u\">التزم بالميثاق ده ومش هتغلط. اطبعه وخليه معاك دايمًا. راجعه وافتكره كتير. هينفعك.</div>", "n": 1, "i": 56, "a": "tefl-05-050", "x": "fbf0607a"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 57}, {"t": "learn", "h": "<div class=\"u\">Key terms. Competence: having the ability, knowledge, and skill to do something successfully. KASH: Knowledge, Ability, Skills, Habits.</div><div class=\"u\">مصطلحات الدرس. Competence: الكفاءة، القدرة والمعرفة والمهارة للنجاح. KASH: معرفة وقدرة ومهارات وعادات.</div>", "n": 1, "i": 58, "a": "tefl-05-051", "x": "7312da76"}, {"t": "learn", "h": "<div class=\"u\">Code of Practice: a set of professional rules a teacher follows. Accrediting body: an organization that approves a course or profession.</div><div class=\"u\">Code of Practice: ميثاق ممارسة، قواعد مهنية المدرس بيتبعها. Accrediting body: جهة اعتماد، منظمة بتعتمد الكورس أو المهنة.</div>", "n": 1, "i": 59, "a": "tefl-05-052", "x": "c2d8ff62"}, {"t": "learn", "h": "<div class=\"u\">Integrity: honest and strong moral behaviour. Impartiality: treating all sides fairly. Confidentiality: keeping personal information secret.</div><div class=\"u\">Integrity: النزاهة، سلوك أخلاقي أمين. Impartiality: الحياد، معاملة كل الأطراف بعدل. Confidentiality: السرية، حفظ المعلومات الشخصية.</div>", "n": 1, "i": 60, "a": "tefl-05-053", "x": "5952383e"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">Summary. A competent teacher has Knowledge, Ability, Skills, and Habits, KASH, and follows a Code of Practice at all times.</div><div class=\"u\">الخلاصة. المدرس الكفء عنده المعرفة والقدرة والمهارات والعادات، KASH، وبيلتزم بميثاق ممارسة طول الوقت.</div>", "n": 1, "i": 62, "a": "tefl-05-054", "x": "1cb980ee"}, {"t": "learn", "h": "<div class=\"u\">The Code has 6 value groups: Honesty and Integrity, Dignity and Diversity, Respect and Trust, Responsibility and Accountability, Care and Protection, Fairness and Justice.</div><div class=\"u\">الميثاق فيه ٦ مجموعات قيم: الأمانة والنزاهة، الكرامة والتنوع، الاحترام والثقة، المسؤولية والمحاسبة، الرعاية والحماية، العدل والإنصاف.</div>", "n": 1, "i": 63, "a": "tefl-05-055", "x": "a7c4c675"}, {"t": "learn", "h": "<div class=\"u\">Print the Code, keep it with you, and reflect on it often. Next lesson: the 19 daily traits of the competent teacher.</div><div class=\"u\">اطبع الميثاق وخليه معاك وراجعه كتير. الدرس الجاي: الـ١٩ سمة يومية للمدرس الكفء.</div>", "n": 1, "i": 64, "a": "tefl-05-056", "x": "71f85d54"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 65}, {"t": "tf", "q": "All schools you teach in will have a Code of Practice for Teachers.<br>كل المدارس اللي هتدرّس فيها هيبقى عندها ميثاق ممارسة للمدرسين.", "ans": false, "why": "Many schools have none. You follow your own Code. | مدارس كتير مفيهاش. إنت بتتبع الميثاق بتاعك.", "ex": ["Wrong. Many schools have no Code; follow yours. | غلط: مدارس كتير مفيهاش ميثاق؛ اتبع بتاعك.", "Correct. | صح."], "n": 1, "i": 66, "h": ""}, {"t": "tf", "q": "Valuing the learning needs, effort, and potential of each student is part of Dignity and Diversity.<br>تقدير احتياجات التعلم والمجهود والإمكانيات لكل طالب جزء من الكرامة والتنوع.", "ans": true, "why": "It is one of the Dignity and Diversity points. | دي واحدة من نقط الكرامة والتنوع.", "ex": ["Correct. | صح.", "Wrong. It belongs to Dignity and Diversity. | غلط: دي تابعة للكرامة والتنوع."], "n": 1, "i": 67, "h": ""}, {"t": "mc", "q": "KASH stands for:<br>KASH اختصار لـ:", "opts": ["Knowledge, Ability, Skills, Habits | معرفة، قدرة، مهارات، عادات", "Kindness, Attention, Skills, Honesty | لطف، انتباه، مهارات، أمانة", "Knowledge, Activities, Styles, Humor | معرفة، أنشطة، أساليب، فكاهة"], "ans": 0, "why": "Knowledge, Ability, Skills, Habits. | معرفة وقدرة ومهارات وعادات.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 1, "i": 68, "h": ""}, {"t": "tf", "q": "You may freely share a colleague's private information with other teachers.<br>ينفع تشارك معلومات زميلك الخاصة بحرية مع مدرسين تانيين.", "ans": false, "why": "Only for a compelling professional purpose or when the law requires it. | بس لغرض مهني قوي أو لما القانون يطلب.", "ex": ["Wrong. Disclosure needs a compelling purpose or the law. | غلط: الإفصاح محتاج غرض قوي أو القانون.", "Correct. | صح."], "n": 1, "i": 69, "h": ""}, {"t": "mc", "q": "Which of these is a value group in the Code of Practice?<br>أنهي واحدة من دول مجموعة قيم في ميثاق الممارسة؟", "opts": ["Respect and Trust | الاحترام والثقة", "Fun and Games | المرح والألعاب", "Speed and Testing | السرعة والاختبارات"], "ans": 0, "why": "The 6 groups include Respect and Trust. | المجموعات ال٦ منها الاحترام والثقة.", "ex": ["Correct. | صح.", "No. | غلط.", "No. | غلط."], "n": 1, "i": 70, "h": ""}, {"t": "tf", "q": "The Code asks teachers to avoid any abuse of authority for financial, political, or personal gain.<br>الميثاق بيطلب من المدرسين تجنّب أي استغلال للسلطة لمكسب مادي أو سياسي أو شخصي.", "ans": true, "why": "That is part of Honesty and Integrity. | ده جزء من الأمانة والنزاهة.", "ex": ["Correct. | صح.", "Wrong. That abuse is forbidden. | غلط: الاستغلال ده ممنوع."], "n": 1, "i": 71, "h": ""}, {"t": "tf", "q": "In an interactive learning environment, students are passive recipients of information.<br>في بيئة التعلم التفاعلية، الطلاب مستقبلين سلبيين للمعلومات.", "ans": false, "why": "Interactive is the opposite of passive. | التفاعلية عكس السلبية.", "ex": ["Wrong. Interactive means active, not passive. | غلط: تفاعلية يعني نشط مش سلبي.", "Correct. | صح."], "n": 1, "i": 72, "h": ""}, {"t": "mc", "q": "When ethical claims compete, the Code suggests resolving them through:<br>لما المطالب الأخلاقية تتعارض، الميثاق بيقترح حلها عن طريق:", "opts": ["reflective professional discussion | النقاش المهني المتأمل", "ignoring them | تجاهلها", "punishing the students | معاقبة الطلاب"], "ans": 0, "why": "Fairness and Justice: resolve through reflective professional discussion. | العدل والإنصاف: الحل بالنقاش المهني المتأمل.", "ex": ["Correct. | صح.", "No. Ignoring is not professional. | غلط: التجاهل مش مهني.", "No. | غلط."], "n": 1, "i": 73, "h": ""}, {"t": "tf", "q": "Being generous with praise is part of Care and Protection.<br>الكرم في المدح جزء من الرعاية والحماية.", "ans": true, "why": "Care and Protection includes generous praise and positive feedback. | الرعاية والحماية فيها المدح الكريم والتقييم الإيجابي.", "ex": ["Correct. | صح.", "Wrong. Praise belongs to Care and Protection. | غلط: المدح تابع للرعاية والحماية."], "n": 1, "i": 74, "h": ""}, {"t": "recall", "q": "What does KASH stand for?<br>KASH اختصار لإيه؟", "a": "Knowledge, Ability, Skills, Habits.<br>معرفة، قدرة، مهارات، عادات.", "n": 1, "i": 75, "h": ""}, {"t": "recall", "q": "Name 4 of the 6 value groups in the Code of Practice.<br>اذكر ٤ من مجموعات القيم ال٦ في ميثاق الممارسة.", "a": "Any 4: Honesty and Integrity, Dignity and Diversity, Respect and Trust, Responsibility and Accountability, Care and Protection, Fairness and Justice.<br>أي ٤: الأمانة والنزاهة، الكرامة والتنوع، الاحترام والثقة، المسؤولية والمحاسبة، الرعاية والحماية، العدل والإنصاف.", "n": 1, "i": 76, "h": ""}, {"t": "write", "q": "Write the expanded definition of a competent teacher and explain why habits were added (3-4 sentences).<br>اكتب التعريف الموسّع للمدرس الكفء واشرح ليه العادات اتضافت (٣-٤ جمل).", "key": "tefl-05:1", "a": "A competent teacher is a person who has the knowledge, ability, skills, and habits necessary to teach successfully. The dictionary mentions ability, knowledge, and skill, but experience adds habits. Good habits include arriving on time, greeting students, and reflecting on each lesson. The four parts are easy to remember with the mnemonic KASH.<br>المدرس الكفء هو الشخص اللي عنده المعرفة والقدرة والمهارات والعادات اللازمة عشان يدرّس بنجاح. القاموس بيذكر القدرة والمعرفة والمهارة، بس الخبرة بتضيف العادات. العادات الكويسة منها الوصول في المعاد وتحية الطلاب ومراجعة كل درس. والأجزاء الأربعة سهل تتفتكر بكلمة KASH.", "n": 1, "i": 77, "h": ""}, {"t": "write", "q": "Choose one value group from the Code of Practice and explain it in your own words (3-4 sentences).<br>اختار مجموعة قيم من ميثاق الممارسة واشرحها بكلامك (٣-٤ جمل).", "key": "tefl-05:2", "a": "Example, Respect and Trust. My relationship with students and their families must be built on mutual respect, trust, and confidentiality. I do not share their personal information, except for a strong professional reason or when the law requires it. I also stay open to constructive criticism from colleagues and respect different viewpoints.<br>مثال، الاحترام والثقة. علاقتي بالطلاب وعائلاتهم لازم تتبني على الاحترام المتبادل والثقة والسرية. مش بشارك معلوماتهم الشخصية، إلا لسبب مهني قوي أو لما القانون يطلب. وبفضل مفتوح للنقد البنّاء من الزمايل وبحترم وجهات النظر المختلفة.", "n": 1, "i": 78, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: the 19 daily traits of the competent teacher. What does a good teacher actually do every day?</div><div class=\"u\">الدرس الجاي: الـ١٩ سمة يومية للمدرس الكفء. المدرس الكويس بيعمل إيه كل يوم فعلًا؟</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 79}];</script>
