<h1>عالم تيفل ٤٢: مهارة الاستماع</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: مبتدئ</span><span class="tag">درس ٤٢</span><span class="tag"><span class="em">🎓</span> TEFL</span></div>

<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="tefl-42";window.STEPS=[{"t": "section", "h": "Why listening is hard | ليه الاستماع صعب", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">Although listening is a receptive skill, some students still find it very intimidating.</div><div class=\"u\">بالرغم إن الاستماع مهارة استقبالية، بعض الطلبة لسه بيلاقوه مخيف جدًا.</div>", "n": 1, "i": 1, "a": "tefl-42-001", "x": "294afd74"}, {"t": "learn", "h": "<div class=\"u\">It may seem to them that people speak too fast, they do not understand the accent, or they cannot tell where one word finishes and another starts.</div><div class=\"u\">ممكن يحسوا إن الناس بتتكلم بسرعة أوي، أو إنهم مش فاهمين اللهجة، أو مش عارفين الكلمة بتخلص فين والتانية بتبدأ منين.</div>", "n": 1, "i": 2, "a": "tefl-42-002", "x": "5b0f98de"}, {"t": "learn", "h": "<div class=\"u\">Aside from this, listening is not just about understanding each word.</div><div class=\"u\">غير كده، الاستماع مش بس فهم كل كلمة.</div>", "n": 1, "i": 3, "a": "tefl-42-003", "x": "6b1fce0d"}, {"t": "learn", "h": "<div class=\"u\">Students may need to listen for gist or for detail, to infer a speaker's attitude, or to comprehend the meaning behind what is said.</div><div class=\"u\">الطلبة ممكن يحتاجوا يسمعوا عشان الفكرة العامة أو التفاصيل، أو يستنتجوا موقف المتكلم، أو يفهموا المعنى اللي ورا اللي اتقال.</div>", "n": 1, "i": 4, "a": "tefl-42-004", "x": "0fb793b0"}, {"t": "learn", "h": "<div class=\"u\">In real life we always have a context when listening: we can see the speakers, know or infer their relationship, and have an idea of the topic from previous conversations or knowledge.</div><div class=\"u\">في الحياة الحقيقية دايمًا عندنا سياق واحنا بنسمع: بنشوف المتكلمين، عارفين أو بنستنتج علاقتهم ببعض، وعندنا فكرة عن الموضوع من محادثات أو معرفة سابقة.</div>", "n": 1, "i": 5, "a": "tefl-42-005", "x": "df46a7a7"}, {"t": "learn", "h": "<div class=\"u\">When listening to a recording in a foreign language, however, we have none of this, which makes listening even harder.</div><div class=\"u\">لما بنسمع تسجيل بلغة أجنبية بقى، ماعندناش أي حاجة من دي، وده بيخلي الاستماع أصعب كمان.</div>", "n": 1, "i": 6, "a": "tefl-42-006", "x": "7b07f0ab"}, {"t": "learn", "h": "<div class=\"u\">Spoken language is also generally much less well organised than written language. There may be hesitations, incomplete sentences or a sudden change of topic.</div><div class=\"u\">اللغة المنطوقة كمان عمومًا أقل تنظيمًا بكتير من المكتوبة. ممكن يكون فيها ترددات، وجمل مش كاملة، أو تغيير مفاجئ في الموضوع.</div>", "n": 1, "i": 7, "a": "tefl-42-007", "x": "b9e1d72a"}, {"t": "learn", "h": "<div class=\"u\">This is very challenging, so expose students to both authentic material, which prepares them for real language, and graded material, which builds their confidence.</div><div class=\"u\">ده تحدي كبير، فعرّض الطلبة للاتنين: مواد أصلية بتجهّزهم للغة الحقيقية، ومواد متدرجة بتبني ثقتهم.</div>", "n": 1, "i": 8, "a": "tefl-42-008", "x": "515afa5c"}, {"t": "section", "h": "Spoken texts + the unfair way | النصوص المنطوقة + الطريقة الظالمة", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">Consider the different types of spoken language: conversations, songs, speeches, announcements, advertisements, stories and lectures.</div><div class=\"u\">خد بالك من أنواع اللغة المنطوقة المختلفة: المحادثات، الأغاني، الخطب، الإعلانات الصوتية، الإعلانات التجارية، القصص والمحاضرات.</div>", "n": 1, "i": 10, "a": "tefl-42-009", "x": "05f9553a"}, {"t": "learn", "h": "<div class=\"u\">Listening means being able to understand a range of these spoken texts and to take meaning from them. In class we expose students to them via CDs, DVDs and our own speech.</div><div class=\"u\">الاستماع يعني القدرة على فهم تشكيلة من النصوص المنطوقة دي وأخد المعنى منها. في الفصل بنعرّض الطلبة ليها عن طريق الأسطوانات والفيديوهات وكلامنا إحنا.</div>", "n": 1, "i": 11, "a": "tefl-42-010", "x": "fea4c072"}, {"t": "learn", "h": "<div class=\"u\">With a recording we cannot see the speakers, so we cannot infer context, while in real life we usually have some idea of what we are going to hear.</div><div class=\"u\">مع التسجيل مش بنشوف المتكلمين، فمش بنقدر نستنتج السياق، بينما في الحياة الحقيقية عادة عندنا فكرة عن اللي هنسمعه.</div>", "n": 1, "i": 12, "a": "tefl-42-011", "x": "fe901032"}, {"t": "learn", "h": "<div class=\"u\">So it is unfair to expect students to just listen to the recording and answer the questions without any introduction at all.</div><div class=\"u\">فمش من العدل نتوقع من الطلبة يسمعوا التسجيل ويجاوبوا على الأسئلة من غير أي مقدمة خالص.</div>", "n": 1, "i": 13, "a": "tefl-42-012", "x": "b1a43edd"}, {"t": "learn", "h": "<div class=\"u\">If we approach listening lessons like this, students either understand and get the right answers or not, and if not, there is no way for them to improve.</div><div class=\"u\">لو تعاملنا مع دروس الاستماع كده، الطلبة يا بيفهموا وبيطلعوا الإجابات الصح يا لأ، ولو لأ، مفيش أي طريقة إنهم يتحسّنوا.</div>", "n": 1, "i": 14, "a": "tefl-42-013", "x": "74635f55"}, {"t": "learn", "h": "<div class=\"u\">Instead, there are a number of ways we can actually develop listening skills. The British Council gives some fun, useful pre-listening tasks.</div><div class=\"u\">بدل كده، في طرق كتير نقدر بيها فعلًا ننمّي مهارات الاستماع. المجلس الثقافي البريطاني بيقدّم مهام تمهيدية قبل الاستماع مفيدة وممتعة.</div>", "n": 1, "i": 15, "a": "tefl-42-014", "x": "fecd3c33"}, {"t": "section", "h": "Pre-listening tasks | مهام قبل الاستماع", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">Pre-listening task one: setting the context. Give students an idea of who is speaking, where, when, and an outline of the situation.</div><div class=\"u\">مهمة قبل الاستماع الأولى: تهيئة السياق. ادّي الطلبة فكرة عن مين اللي بيتكلم، وفين، وإمتى، وملخص الموقف.</div>", "n": 1, "i": 17, "a": "tefl-42-015", "x": "69e49832"}, {"t": "learn", "h": "<div class=\"u\">Task two: warmers to generate interest. If you are listening to a dialogue about food, start by asking students their favourite foods.</div><div class=\"u\">المهمة التانية: تسخينات بتولّد الاهتمام. لو هتسمعوا حوار عن الأكل، ابدأ بسؤال الطلبة عن أكلهم المفضّل.</div>", "n": 1, "i": 18, "a": "tefl-42-016", "x": "d728d1f6"}, {"t": "learn", "h": "<div class=\"u\">Task three: activating knowledge. Ask students what they already know about the topic to bring relevant vocabulary to the front of their minds, or give them a short, fun quiz.</div><div class=\"u\">المهمة التالتة: تفعيل المعرفة. اسأل الطلبة بيعرفوا إيه عن الموضوع عشان تطلّع المفردات المرتبطة في مقدمة دماغهم، أو اعملهم اختبار قصير ولطيف.</div>", "n": 1, "i": 19, "a": "tefl-42-017", "x": "dddef2a0"}, {"t": "learn", "h": "<div class=\"u\">Task four: predicting content. Once they know the context, they can guess what might or might not be mentioned.</div><div class=\"u\">المهمة الرابعة: توقع المحتوى. لما يعرفوا السياق، يقدروا يخمنوا إيه اللي ممكن أو مش ممكن يتذكر.</div>", "n": 1, "i": 20, "a": "tefl-42-018", "x": "4b786f78"}, {"t": "learn", "h": "<div class=\"u\">Task five: giving students the questions before they listen, so they can focus and listen out for cues instead of being overwhelmed trying to listen for absolutely everything.</div><div class=\"u\">المهمة الخامسة: إعطاء الطلبة الأسئلة قبل ما يسمعوا، عشان يركّزوا ويترصّدوا الإشارات بدل ما يتلخبطوا وهم بيحاولوا يسمعوا كل حاجة حرفيًا.</div>", "n": 1, "i": 21, "a": "tefl-42-019", "x": "822925f9"}, {"t": "learn", "h": "<div class=\"u\">Task six: predicting answers. Give students time to read all the questions and make notes on possible answers, so they are not concentrating on reading when they should be listening.</div><div class=\"u\">المهمة السادسة: توقع الإجابات. ادي الطلبة وقت يقرأوا كل الأسئلة ويدوّنوا إجابات محتملة، عشان ميبقوش بيركّزوا على القراءة في الوقت اللي المفروض يسمعوا فيه.</div>", "n": 1, "i": 22, "a": "tefl-42-020", "x": "6fa06655"}, {"t": "section", "h": "While and after listening | أثناء وبعد الاستماع", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">While listening, it is usually best to start with gist questions, like why did the girl phone her friend?, before more specific details, like what time did they arrange to meet?</div><div class=\"u\">أثناء الاستماع، الأحسن عادة تبدأ بأسئلة الفكرة العامة، زي ليه البنت كلمت صاحبتها؟، قبل التفاصيل الأدق، زي اتفقوا يتقابلوا الساعة كام؟</div>", "n": 1, "i": 24, "a": "tefl-42-021", "x": "2554a4fe"}, {"t": "learn", "h": "<div class=\"u\">This way students are less likely to become overwhelmed and think: I do not understand anything at all!</div><div class=\"u\">كده الطلبة أقل احتمال إنهم يتلخبطوا ويفكروا: أنا مش فاهم أي حاجة خالص!</div>", "n": 1, "i": 25, "a": "tefl-42-022", "x": "10800a86"}, {"t": "learn", "h": "<div class=\"u\">Also, some students may have understood what they heard but be unable to vocalise it. A student who understood a story might not be able to re-tell it.</div><div class=\"u\">وكمان، بعض الطلبة ممكن يكونوا فهموا اللي سمعوه بس مش قادرين يعبّروا عنه. طالب فهم قصة ممكن مايعرفش يحكيها تاني.</div>", "n": 1, "i": 26, "a": "tefl-42-023", "x": "9604cc7f"}, {"t": "learn", "h": "<div class=\"u\">So it is unreasonable to ask hugely generalised questions like: okay, so what did you hear?</div><div class=\"u\">فمش من المعقول تسأل أسئلة عامة أوي زي: طيب، سمعتوا إيه؟</div>", "n": 1, "i": 27, "a": "tefl-42-024", "x": "9d8f3aa5"}, {"t": "learn", "h": "<div class=\"u\">Instead, use tasks like true/false questions or table completion to focus attention and assess understanding accurately.</div><div class=\"u\">بدل كده، استخدم مهام زي أسئلة صح/غلط أو إكمال جداول عشان تركّز الانتباه وتقيّم الفهم بدقة.</div>", "n": 1, "i": 28, "a": "tefl-42-025", "x": "c54029e1"}, {"t": "learn", "h": "<div class=\"u\">After listening, students need to feedback the answers. A good way is to have them check what they wrote in pairs.</div><div class=\"u\">بعد الاستماع، الطلبة محتاجين يراجعوا الإجابات. طريقة كويسة إنهم يتأكدوا من اللي كتبوه في أزواج.</div>", "n": 1, "i": 29, "a": "tefl-42-026", "x": "feeede47"}, {"t": "learn", "h": "<div class=\"u\">If pairs have wildly different responses, play the recording again. If problems remain, grade the questions or activities to a more appropriate level and then build up.</div><div class=\"u\">لو الأزواج طلعوا بإجابات مختلفة جدًا، شغّل التسجيل تاني. لو لسه في مشاكل، درّج الأسئلة أو الأنشطة لمستوى أنسب وبعدين ابني عليها.</div>", "n": 1, "i": 30, "a": "tefl-42-027", "x": "91d5a0ce"}, {"t": "learn", "h": "<div class=\"u\">You can grade tasks rather than the recording, so students meet authentic material early without overly-complicated activities.</div><div class=\"u\">تقدر تدرّج المهام بدل التسجيل نفسه، فالطلبة بيقابلوا مواد أصلية من بدري من غير أنشطة معقدة أوي.</div>", "n": 1, "i": 31, "a": "tefl-42-028", "x": "b437ca33"}, {"t": "learn", "h": "<div class=\"u\">Even a BBC radio interview could work for lower levels if you just ask who is being interviewed.</div><div class=\"u\">حتى مقابلة إذاعية من البي بي سي ممكن تنفع للمستويات الأقل لو سألتهم بس مين اللي بيتقابل.</div>", "n": 1, "i": 32, "a": "tefl-42-029", "x": "1dc8e27f"}, {"t": "learn", "h": "<div class=\"u\">Advanced levels can use the same piece to identify attitudes, opinions and more specific details.</div><div class=\"u\">المستويات المتقدمة تقدر تستخدم نفس المقطع عشان تحدد المواقف والآراء وتفاصيل أدق.</div>", "n": 1, "i": 33, "a": "tefl-42-030", "x": "af0b9fd4"}, {"t": "learn", "h": "<div class=\"u\">Some recordings will always suit some levels more, but do not get stuck in the notion that lower levels cannot handle realistic material. They may find it an interesting challenge.</div><div class=\"u\">بعض التسجيلات دايمًا هتناسب مستويات معينة أكتر، بس ماتعلقش في فكرة إن المستويات الأقل مابتقدرش على المواد الواقعية. ممكن يلاقوها تحدي ممتع.</div>", "n": 1, "i": 34, "a": "tefl-42-031", "x": "14066edc"}, {"t": "section", "h": "A listening lesson procedure | إجراء درس استماع", "n": 1, "i": 35}, {"t": "learn", "h": "<div class=\"u\">Here is a procedure for a listening skills lesson, adapted from Scrivener's Learning Teaching, about a recording set in a bus station.</div><div class=\"u\">ده إجراء لدرس مهارات استماع، مأخوذ من كتاب سكريفنر، عن تسجيل في محطة أتوبيسات.</div>", "n": 1, "i": 36, "a": "tefl-42-032", "x": "471b8141"}, {"t": "learn", "h": "<div class=\"u\">First, introduce the topic, long-distance buses, and discuss a little: ask students if they have ever been on a long-distance bus, especially in the UK or US.</div><div class=\"u\">أول حاجة، قدّم الموضوع، أتوبيسات المسافات الطويلة، وناقش شوية: اسأل الطلبة لو حد فيهم ركب أتوبيس مسافات طويلة، خصوصًا في إنجلترا أو أمريكا.</div>", "n": 1, "i": 37, "a": "tefl-42-033", "x": "21538732"}, {"t": "learn", "h": "<div class=\"u\">Second, show students a picture of a bus station and ask: where is this? What do you think is happening?</div><div class=\"u\">تاني حاجة، وري الطلبة صورة محطة أتوبيسات واسأل: ده فين؟ إيه اللي فاكرين بيحصل؟</div>", "n": 1, "i": 38, "a": "tefl-42-034", "x": "afcab0d1"}, {"t": "learn", "h": "<div class=\"u\">Third, set the first task: how many people are speaking? Where are they? Then play the recording.</div><div class=\"u\">تالت حاجة، حط المهمة الأولى: كام شخص بيتكلم؟ وهما فين؟ وبعدين شغّل التسجيل.</div>", "n": 1, "i": 39, "a": "tefl-42-035", "x": "0ae6eaed"}, {"t": "learn", "h": "<div class=\"u\">Fourth, students compare answers in pairs and give answers. If correct, continue; if not, play the recording again.</div><div class=\"u\">رابع حاجة، الطلبة بيقارنوا الإجابات في أزواج وبيدوا الإجابات. لو صح، كمّل؛ لو لأ، شغّل التسجيل تاني.</div>", "n": 1, "i": 40, "a": "tefl-42-036", "x": "1c746abc"}, {"t": "learn", "h": "<div class=\"u\">Fifth, set the second task: why is the old lady worried? This involves listening to a longer section and interpreting information in it.</div><div class=\"u\">خامس حاجة، حط المهمة التانية: ليه الست الكبيرة قلقانة؟ دي بتحتاج سماع جزء أطول وتفسير المعلومات اللي فيه.</div>", "n": 1, "i": 41, "a": "tefl-42-037", "x": "7e3997a6"}, {"t": "learn", "h": "<div class=\"u\">Sixth, play the recording. Seventh, students compare answers in pairs again, continuing if correct or replaying if not.</div><div class=\"u\">سادس حاجة، شغّل التسجيل. سابع حاجة، الطلبة بيقارنوا الإجابات في أزواج تاني، يكملوا لو صح أو يعيدوا التسجيل لو لأ.</div>", "n": 1, "i": 42, "a": "tefl-42-038", "x": "f0e465a5"}, {"t": "learn", "h": "<div class=\"u\">Eighth and last, lead into a communicative activity based around the topic of travel problems.</div><div class=\"u\">تامن وآخر حاجة، خش على نشاط تواصلي مبني حوالين موضوع مشاكل السفر.</div>", "n": 1, "i": 43, "a": "tefl-42-039", "x": "61bca786"}, {"t": "section", "h": "Strategies 1 | استراتيجيات ١", "n": 1, "i": 44}, {"t": "learn", "h": "<div class=\"u\">Now some effective strategies and activities. Your goal: make listening events interesting, productive, enjoyable and fun, but not too much fun with adults.</div><div class=\"u\">دلوقتي شوية استراتيجيات وأنشطة فعالة. هدفك: خلّي مواقف الاستماع ممتعة ومنتجة ومسلية وفيه مرح، بس مش مرح زيادة عن اللزوم مع الكبار.</div>", "n": 1, "i": 45, "a": "tefl-42-040", "x": "3eccdabe"}, {"t": "learn", "h": "<div class=\"u\">Strategy one, questions and answers: very short exchanges give elementary or lower intermediate students practice in listening and understanding.</div><div class=\"u\">الاستراتيجية الأولى، أسئلة وأجوبة: التبادلات القصيرة أوي بتدّي طلبة المستوى المبتدئ أو تحت المتوسط تدريب على الاستماع والفهم.</div>", "n": 1, "i": 46, "a": "tefl-42-041", "x": "9ab20d8e"}, {"t": "learn", "h": "<div class=\"u\">These exchanges can later be practised by the students themselves, and preferably recorded.</div><div class=\"u\">التبادلات دي ممكن بعدين الطلبة نفسهم يتدربوا عليها، ويفضّل تتسجّل.</div>", "n": 1, "i": 47, "a": "tefl-42-042", "x": "6f2c4cf2"}, {"t": "learn", "h": "<div class=\"u\">Recording students on tape is almost always universally enjoyed, even when they laughingly protest a little at first because they are shy about hearing their own voice.</div><div class=\"u\">تسجيل الطلبة صوتيًا بيبقى مستمتع بيه تقريبًا عالميًا، حتى لو بيعترضوا ضاحكين شوية في الأول لأنهم بيستحوا يسمعوا صوتهم.</div>", "n": 1, "i": 48, "a": "tefl-42-043", "x": "6ef6a4ed"}, {"t": "learn", "h": "<div class=\"u\">Strategy two, short dialogues: the way the dialogue is recorded affects its authenticity; traffic noise or café noise in the background adds a further degree of authenticity.</div><div class=\"u\">الاستراتيجية التانية، الحوارات القصيرة: طريقة تسجيل الحوار بتأثر على واقعيته؛ صوت المرور أو ضوضاء الكافيه في الخلفية بتضيف درجة واقعية زيادة.</div>", "n": 1, "i": 49, "a": "tefl-42-044", "x": "7bd2836a"}, {"t": "learn", "h": "<div class=\"u\">Strategy three, short passages: unlike dialogues, it is not so easy to make the language authentic in a short passage.</div><div class=\"u\">الاستراتيجية التالتة، القطع القصيرة: عكس الحوارات، مش سهل تخلي اللغة واقعية في قطعة قصيرة.</div>", "n": 1, "i": 50, "a": "tefl-42-045", "x": "6353e629"}, {"t": "learn", "h": "<div class=\"u\">However, a story with a touch of humour always appeals to learners. Prepare a wide range of factual questions together with one or two deductive questions.</div><div class=\"u\">بس قصة فيها لمسة فكاهة دايمًا بتعجب المتعلمين. جهّز تشكيلة واسعة من الأسئلة الواقعية مع سؤال أو اتنين استنتاجيين.</div>", "n": 1, "i": 51, "a": "tefl-42-046", "x": "1b615d7a"}, {"t": "learn", "h": "<div class=\"u\">Strategy four, reordering information: students get items on paper in the wrong order, like actions, descriptions and events, plus one or more specific tasks.</div><div class=\"u\">الاستراتيجية الرابعة، إعادة ترتيب المعلومات: الطلبة بياخدوا عناصر على ورق بترتيب غلط، زي أفعال وأوصاف وأحداث، مع مهمة أو أكتر محددة.</div>", "n": 1, "i": 52, "a": "tefl-42-047", "x": "a73315c2"}, {"t": "learn", "h": "<div class=\"u\">They then listen, and the tasks may involve categorising information, reordering actions in the correct order, or classifying events.</div><div class=\"u\">وبعدين بيسمعوا، والمهام ممكن تشمل تصنيف المعلومات، أو إعادة ترتيب الأفعال بالترتيب الصح، أو تصنيف الأحداث.</div>", "n": 1, "i": 53, "a": "tefl-42-048", "x": "eed97479"}, {"t": "learn", "h": "<div class=\"u\">Strategy five, information transfer: students translate part of the spoken message into a new format, such as a table, chart, picture or map.</div><div class=\"u\">الاستراتيجية الخامسة، نقل المعلومات: الطلبة بيحوّلوا جزء من الرسالة المسموعة لشكل جديد، زي جدول أو رسم بياني أو صورة أو خريطة.</div>", "n": 1, "i": 54, "a": "tefl-42-049", "x": "37575974"}, {"t": "learn", "h": "<div class=\"u\">They may then use this new format for a further activity, like working in pairs to solve a related problem.</div><div class=\"u\">وبعدين ممكن يستخدموا الشكل الجديد ده في نشاط تاني، زي الشغل في أزواج لحل مشكلة مرتبطة.</div>", "n": 1, "i": 55, "a": "tefl-42-050", "x": "45c09050"}, {"t": "learn", "h": "<div class=\"u\">Information transfer means any transfer of information to a new format: a listening passage to a table, a reading text to a dialogue, a telephone conversation to a map.</div><div class=\"u\">نقل المعلومات يعني أي تحويل لمعلومات لشكل جديد: قطعة استماع لجدول، نص قراءة لحوار، مكالمة تليفون لخريطة.</div>", "n": 1, "i": 56, "a": "tefl-42-051", "x": "cb014bc0"}, {"t": "section", "h": "Strategies 2 | استراتيجيات ٢", "n": 1, "i": 57}, {"t": "learn", "h": "<div class=\"u\">Strategy six, using humour: language learning is much less painful if students have something to smile about from time to time, and a bit of humour can do this.</div><div class=\"u\">الاستراتيجية السادسة، استخدام الفكاهة: تعلم اللغة بيبقى أقل وجعًا بكتير لو الطلبة عندهم حاجة تضحكهم من وقت للتاني، وشوية فكاهة بتعمل كده.</div>", "n": 1, "i": 58, "a": "tefl-42-052", "x": "dea85d32"}, {"t": "learn", "h": "<div class=\"u\">Strategy seven, dictation: it went out of fashion in language teaching for a long time, but it can be valuable listening practice and has now returned in revised forms.</div><div class=\"u\">الاستراتيجية السابعة، الإملاء: خرج من الموضة في تدريس اللغة فترة طويلة، بس ممكن يبقى تدريب استماع قيّم ودلوقتي رجع بأشكال متجددة.</div>", "n": 1, "i": 59, "a": "tefl-42-053", "x": "73e4e49f"}, {"t": "learn", "h": "<div class=\"u\">The important thing is that the dictation passage should normally be one which the students have met already.</div><div class=\"u\">الحاجة المهمة إن قطعة الإملاء المفروض عادة تكون واحدة الطلبة شافوها قبل كده.</div>", "n": 1, "i": 60, "a": "tefl-42-054", "x": "e9bab026"}, {"t": "learn", "h": "<div class=\"u\">It would normally be inappropriate to give English language students a dictation passage they have never met before. That would be tantamount to a test, which is very different from practice.</div><div class=\"u\">مش من المناسب عادة تدّي طلبة اللغة الإنجليزية قطعة إملاء ماشافوهاش قبل كده. ده هيبقى بمثابة اختبار، والاختبار مختلف تمامًا عن التدريب.</div>", "n": 1, "i": 61, "a": "tefl-42-055", "x": "8739b3a4"}, {"t": "learn", "h": "<div class=\"u\">Strategy eight, jigsaw listening: students listen to different parts of a passage or conversation, then come together in pairs to complete a particular task.</div><div class=\"u\">الاستراتيجية التامنة، الاستماع التركيبي: الطلبة بيسمعوا أجزاء مختلفة من قطعة أو محادثة، وبعدين بيتجمعوا في أزواج عشان يكملوا مهمة معينة.</div>", "n": 1, "i": 62, "a": "tefl-42-056", "x": "2fe6a913"}, {"t": "learn", "h": "<div class=\"u\">Each person has a different piece of information. The task might involve completing another dialogue, filling in a table or drawing a map.</div><div class=\"u\">كل شخص عنده جزء معلومات مختلف. المهمة ممكن تشمل إكمال حوار تاني، أو ملء جدول، أو رسم خريطة.</div>", "n": 1, "i": 63, "a": "tefl-42-057", "x": "7bfb73e0"}, {"t": "learn", "h": "<div class=\"u\">With a large class, divide students into two groups so they listen to two different tapes, then pair them up with one person from each group.</div><div class=\"u\">مع فصل كبير، قسّم الطلبة لمجموعتين عشان يسمعوا شريطين مختلفين، وبعدين قرّنهم بحيث كل زوج فيه واحد من كل مجموعة.</div>", "n": 1, "i": 64, "a": "tefl-42-058", "x": "9027425e"}, {"t": "learn", "h": "<div class=\"u\">You can prepare such materials yourself, but you will occasionally find jigsaw listening and reading tasks provided in your coursebook.</div><div class=\"u\">تقدر تجهّز المواد دي بنفسك، بس من وقت للتاني هتلاقي مهام استماع وقراءة تركيبية جاهزة في كتابك المقرر.</div>", "n": 1, "i": 65, "a": "tefl-42-059", "x": "be3c0ddb"}, {"t": "section", "h": "Activities | أنشطة", "n": 1, "i": 66}, {"t": "learn", "h": "<div class=\"u\">Now some tried and tested activities. Choose passages, topics and exercises that are participative, interesting and good fun.</div><div class=\"u\">دلوقتي شوية أنشطة متجربة ومضمونة. اختار قطع ومواضيع وتمارين تشاركية وممتعة وفيها مرح.</div>", "n": 1, "i": 67, "a": "tefl-42-060", "x": "4564070c"}, {"t": "learn", "h": "<div class=\"u\">Activity one, add on: one student starts with I went to the market and I bought some apples. The next adds: and a spoon. It continues until the sentence is unmanageably long.</div><div class=\"u\">النشاط الأول، ضيف على اللي قبلك: طالب يبدأ بـ رحت السوق واشتريت تفاح. اللي بعده يضيف: ومعلقة. وهكذا لحد ما الجملة تبقى طويلة بشكل مستحيل.</div>", "n": 1, "i": 68, "a": "tefl-42-061", "x": "c5b1782b"}, {"t": "learn", "h": "<div class=\"u\">This could be a competitive game with teams, but works better as a co-operative activity. Change the model sentence to anything you like and reuse it in future classes.</div><div class=\"u\">ده ممكن يبقى لعبة تنافسية بفرق، بس أحسن كنشاط تعاوني. غيّر الجملة النموذجية لأي حاجة واستخدمه تاني في حصص جاية.</div>", "n": 1, "i": 69, "a": "tefl-42-062", "x": "48f9092c"}, {"t": "learn", "h": "<div class=\"u\">Activity two, pass the message: one student thinks of a message and writes it down, then whispers it swiftly to the next student, and so on.</div><div class=\"u\">النشاط التاني، مرّر الرسالة: طالب يفكر في رسالة ويكتبها، وبعدين يهمسها بسرعة للطالب اللي بعده، وهكذا.</div>", "n": 1, "i": 70, "a": "tefl-42-063", "x": "ec16132d"}, {"t": "learn", "h": "<div class=\"u\">The message can only be said once, but it must be spoken clearly. However clearly it is spoken, it will almost always be distorted, often producing a comical sentence to compare with the original.</div><div class=\"u\">الرسالة بتتقال مرة واحدة بس، بس لازم تتقال بوضوح. ومهما اتقالت بوضوح، غالبًا هتتشوّه بطريقة أو بأخرى، وده بيطلّع جملة مضحكة تتقارن بالأصلية.</div>", "n": 1, "i": 71, "a": "tefl-42-064", "x": "c30e8f8e"}, {"t": "learn", "h": "<div class=\"u\">Activity three, think of a verb: each group writes a short passage of about three or four sentences, and the verbs are removed, excluding the verb to be.</div><div class=\"u\">النشاط التالت، فكّر في فعل: كل مجموعة بتكتب قطعة قصيرة حوالي تلات أو أربع جمل، والأفعال بتتشال منها، ما عدا فعل يكون.</div>", "n": 1, "i": 72, "a": "tefl-42-065", "x": "14e114e6"}, {"t": "learn", "h": "<div class=\"u\">One member of group A reads out the passage and the other groups suggest appropriate verbs for the gaps.</div><div class=\"u\">عضو من المجموعة أ بيقرأ القطعة والمجموعات التانية بتقترح أفعال مناسبة للفراغات.</div>", "n": 1, "i": 73, "a": "tefl-42-066", "x": "86cb69f7"}, {"t": "learn", "h": "<div class=\"u\">The final version is then read in full and compared with the original, often with a lot of laughs.</div><div class=\"u\">النسخة النهائية بعدين بتتقرأ كاملة وبتتقارن بالأصلية، وغالبًا بضحك كتير.</div>", "n": 1, "i": 74, "a": "tefl-42-067", "x": "f4d52c94"}, {"t": "learn", "h": "<div class=\"u\">You can do it again by changing the verb to a noun or adverb, linked hopefully to whatever else they are studying.</div><div class=\"u\">تقدر تعمله تاني بتغيير الفعل لاسم أو حال، مربوط يا ريت باللي بيدرسوه.</div>", "n": 1, "i": 75, "a": "tefl-42-068", "x": "6ed19294"}, {"t": "learn", "h": "<div class=\"u\">Activity four, what's the word?: you spell out words quickly, and the students have to shout out the word.</div><div class=\"u\">النشاط الرابع، إيه الكلمة؟: إنت بتهجّي كلمات بسرعة، والطلبة لازم يصرخوا بالكلمة.</div>", "n": 1, "i": 76, "a": "tefl-42-069", "x": "265c3117"}, {"t": "learn", "h": "<div class=\"u\">Activity five, hands up!: write five to ten words from current study, incorporate them into a passage, and read it out.</div><div class=\"u\">النشاط الخامس، ارفع إيدك!: اكتب خمس لعشر كلمات من اللي بيتدرس دلوقتي، ادّخلها في قطعة، واقراه بصوت عالي.</div>", "n": 1, "i": 77, "a": "tefl-42-070", "x": "4fa17a33"}, {"t": "learn", "h": "<div class=\"u\">Students put their hands up as soon as they hear each of the words.</div><div class=\"u\">الطلبة بيرفعوا إيديهم أول ما يسمعوا كل كلمة من الكلمات.</div>", "n": 1, "i": 78, "a": "tefl-42-071", "x": "7d667588"}, {"t": "learn", "h": "<div class=\"u\">Activity six, missing word: write up five words, read a short passage incorporating four of them, and students suggest the missing word.</div><div class=\"u\">النشاط السادس، الكلمة الناقصة: اكتب خمس كلمات، اقرا قطعة قصيرة فيها أربع كلمات منهم، والطلبة يقترحوا الكلمة الناقصة.</div>", "n": 1, "i": 79, "a": "tefl-42-072", "x": "a65ad3e2"}, {"t": "learn", "h": "<div class=\"u\">Activity seven, that's not right: speak out an incorrect sentence, nothing too difficult, like an elephant big is. Students have to decide what the correct version should be.</div><div class=\"u\">النشاط السابع، ده مش صح: قول جملة غلط بصوت عالي، حاجة مش صعبة أوي، زي فيل كبير هو. الطلبة لازم يقرروا النسخة الصح المفروض تبقى إيه.</div>", "n": 1, "i": 80, "a": "tefl-42-073", "x": "6ee73752"}, {"t": "section", "h": "Key terms | مصطلحات الدرس", "n": 1, "i": 81}, {"t": "learn", "h": "<div class=\"u\">listening for gist: listening to understand the general idea.</div><div class=\"u\">الاستماع للفكرة العامة: الاستماع عشان فهم الفكرة العامة.</div>", "n": 1, "i": 82, "a": "tefl-42-074", "x": "8a605dc4"}, {"t": "learn", "h": "<div class=\"u\">listening for detail: listening for specific pieces of information.</div><div class=\"u\">الاستماع للتفاصيل: الاستماع عشان معلومات محددة.</div>", "n": 1, "i": 83, "a": "tefl-42-075", "x": "6581fb8b"}, {"t": "learn", "h": "<div class=\"u\">authentic material: real-world language material, not simplified for learners.</div><div class=\"u\">المادة الأصلية: مادة لغوية من العالم الحقيقي، مش مبسطة للمتعلمين.</div>", "n": 1, "i": 84, "a": "tefl-42-076", "x": "41749f2f"}, {"t": "learn", "h": "<div class=\"u\">graded material: material adjusted to the learners' level.</div><div class=\"u\">المادة المتدرجة: مادة متظبطة على مستوى المتعلمين.</div>", "n": 1, "i": 85, "a": "tefl-42-077", "x": "d698930c"}, {"t": "learn", "h": "<div class=\"u\">pre-listening task: an activity done before listening to prepare students.</div><div class=\"u\">مهمة قبل الاستماع: نشاط بيتعمل قبل الاستماع عشان يجهّز الطلبة.</div>", "n": 1, "i": 86, "a": "tefl-42-078", "x": "40d2b20c"}, {"t": "learn", "h": "<div class=\"u\">warmer: a short starter activity that generates interest.</div><div class=\"u\">التسخينة: نشاط بداية قصير بيولّد الاهتمام.</div>", "n": 1, "i": 87, "a": "tefl-42-079", "x": "fc19c502"}, {"t": "learn", "h": "<div class=\"u\">information transfer: turning information from a text into a new format like a table or map.</div><div class=\"u\">نقل المعلومات: تحويل معلومات من نص لشكل جديد زي جدول أو خريطة.</div>", "n": 1, "i": 88, "a": "tefl-42-080", "x": "20bcf772"}, {"t": "learn", "h": "<div class=\"u\">dictation: students write down what they hear.</div><div class=\"u\">الإملاء: الطلبة بيكتبوا اللي بيسمعوه.</div>", "n": 1, "i": 89, "a": "tefl-42-081", "x": "4eec3e81"}, {"t": "learn", "h": "<div class=\"u\">jigsaw listening: students hear different parts, then combine information in pairs.</div><div class=\"u\">الاستماع التركيبي: الطلبة بيسمعوا أجزاء مختلفة وبعدين بيجمعوا المعلومات في أزواج.</div>", "n": 1, "i": 90, "a": "tefl-42-082", "x": "498f175d"}, {"t": "learn", "h": "<div class=\"u\">deductive question: a question whose answer must be inferred, not stated directly.</div><div class=\"u\">السؤال الاستنتاجي: سؤال إجابته بتتستنتج، مش مذكورة مباشرة.</div>", "n": 1, "i": 91, "a": "tefl-42-083", "x": "ac9c24df"}, {"t": "section", "h": "Summary | الخلاصة", "n": 1, "i": 92}, {"t": "learn", "h": "<div class=\"u\">Listening is hard for learners: speed, accents, unclear word boundaries, no context, and messy spoken language with hesitations and incomplete sentences.</div><div class=\"u\">الاستماع صعب على المتعلمين: السرعة، اللهجات، حدود الكلمات غير الواضحة، غياب السياق، واللغة المنطوقة المشوشة بتردداتها وجملها الناقصة.</div>", "n": 1, "i": 93, "a": "tefl-42-084", "x": "44ab27f1"}, {"t": "learn", "h": "<div class=\"u\">Prepare students with pre-listening tasks: set the context, warm up, activate knowledge, predict content and answers, and give the questions first.</div><div class=\"u\">جهّز الطلبة بمهام قبل الاستماع: هيّئ السياق، سخّنهم، فعّل معرفتهم، خلّيهم يتوقعوا المحتوى والإجابات، وادّهم الأسئلة الأول.</div>", "n": 1, "i": 94, "a": "tefl-42-085", "x": "d7f4141c"}, {"t": "learn", "h": "<div class=\"u\">Start with gist questions before details, and never ask: so what did you hear? Use true/false and table completion to check understanding.</div><div class=\"u\">ابدأ بأسئلة الفكرة العامة قبل التفاصيل، وأبدًا ماتسألش: طيب سمعتوا إيه؟ استخدم صح/غلط وإكمال الجداول عشان تتأكد من الفهم.</div>", "n": 1, "i": 95, "a": "tefl-42-086", "x": "802df044"}, {"t": "learn", "h": "<div class=\"u\">Grade the tasks, not the recording: even a BBC interview can work for low levels with a simple task, and for advanced levels with harder ones.</div><div class=\"u\">درّج المهام، مش التسجيل: حتى مقابلة بي بي سي ممكن تنفع للمستويات الأقل بمهمة بسيطة، وللمتقدمين بمهام أصعب.</div>", "n": 1, "i": 96, "a": "tefl-42-087", "x": "d647a916"}, {"t": "learn", "h": "<div class=\"u\">Use varied strategies and games: dialogues with background noise, information transfer, familiar-passage dictation, jigsaw listening, add on, pass the message and more.</div><div class=\"u\">استخدم استراتيجيات وألعاب متنوعة: حوارات بضوضاء خلفية، نقل معلومات، إملاء بقطعة مألوفة، استماع تركيبي، ضيف على اللي قبلك، مرّر الرسالة وغيرهم.</div>", "n": 1, "i": 97, "a": "tefl-42-088", "x": "2331546e"}, {"t": "section", "h": "Quiz | الكويز", "n": 1, "i": 98}, {"t": "mc", "q": "Which of the following is NOT an example of a feature of spoken language?<br>أنهي من دول مش مثال لخاصية من خواص اللغة المنطوقة؟", "opts": ["punctuation | علامات الترقيم", "pauses | الوقفات", "intonation | التنغيم", "utterances | التلفظات"], "ans": 0, "why": "Pauses, intonation and utterances are spoken features; punctuation belongs to writing. | الوقفات والتنغيم والتلفظات خواص منطوقة؛ الترقيم للكتابة.", "ex": ["Correct. Punctuation is a written feature. | صح: الترقيم خاصية مكتوبة.", "No. Pauses are a feature of speech. | غلط: الوقفات خاصية من الكلام.", "No. Intonation is spoken. | غلط: التنغيم منطوق.", "No. Utterances are spoken. | غلط: التلفظات منطوقة."], "n": 1, "i": 99, "h": ""}, {"t": "tf", "q": "Recording the students on tape is almost always universally enjoyed by students.<br>تسجيل الطلبة صوتيًا بيبقى مستمتع بيه تقريبًا عالميًا من الطلبة.", "ans": true, "why": "True. Students enjoy it, even when they protest shyly at first about hearing their own voice. | صح. الطلبة بيستمتعوا بيه، حتى لو بيعترضوا مستحيين في الأول بسبب سماع صوتهم.", "ex": ["Correct. | صح.", "Wrong. They enjoy it despite the shy protests. | غلط: بيستمتعوا بيه رغم الاعتراضات الخجولة."], "n": 1, "i": 100, "h": ""}, {"t": "tf", "q": "Unlike dialogues, it is easy to make the language authentic in a short passage.<br>عكس الحوارات، سهل تخلي اللغة واقعية في قطعة قصيرة.", "ans": false, "why": "False. It is NOT so easy to make a short passage authentic; that is easier with dialogues. | غلط. مش سهل تخلي القطعة القصيرة واقعية؛ ده أسهل في الحوارات.", "ex": ["Correct. Short passages are harder to make authentic. | صح: القطع القصيرة أصعب في الواقعية.", "Wrong. The statement reverses the truth. | غلط: الجملة بتعكس الحقيقة."], "n": 1, "i": 101, "h": ""}, {"t": "tf", "q": "It would normally be appropriate with English language students to give them a dictation passage that they have never met before.<br>عادة بيبقى مناسب تدّي طلبة الإنجليزية قطعة إملاء ماشافوهاش قبل كده.", "ans": false, "why": "False. A never-met passage is tantamount to a test, not practice. Dictation passages should normally be familiar. | غلط. القطعة الجديدة تمامًا بتبقى بمثابة اختبار، مش تدريب. قطع الإملاء المفروض تكون مألوفة.", "ex": ["Correct. Dictation is practice, so the passage should be familiar. | صح: الإملاء تدريب، فالقطعة لازم تكون مألوفة.", "Wrong. That would be a test, not practice. | غلط: ده هيبقى اختبار، مش تدريب."], "n": 1, "i": 102, "h": ""}, {"t": "tf", "q": "In jigsaw listening, each person has a different piece of information.<br>في الاستماع التركيبي، كل شخص عنده جزء معلومات مختلف.", "ans": true, "why": "True. That is the core of jigsaw listening: different parts, combined later in pairs. | صح. ده جوهر الاستماع التركيبي: أجزاء مختلفة، بتتجمع بعدين في أزواج.", "ex": ["Correct. | صح.", "Wrong. Different pieces are the whole point. | غلط: الأجزاء المختلفة هي الفكرة كلها."], "n": 1, "i": 103, "h": ""}, {"t": "mc", "q": "Which is a pre-listening task recommended in this unit?<br>أنهي من دول مهمة قبل استماع مُوصى بيها في الوحدة دي؟", "opts": ["asking students their favourite foods before a dialogue about food | سؤال الطلبة عن أكلهم المفضّل قبل حوار عن الأكل", "playing the recording with no introduction | تشغيل التسجيل من غير مقدمة", "asking: so what did you hear? | سؤال: طيب سمعتوا إيه؟"], "ans": 0, "why": "That is a warmer to generate interest, one of the British Council pre-listening tasks. | دي تسخينة بتولّد الاهتمام، واحدة من مهام المجلس الثقافي البريطاني قبل الاستماع.", "ex": ["Correct. | صح.", "No. Playing with no introduction is the unfair approach. | غلط: التشغيل من غير مقدمة هو الطريقة الظالمة.", "No. Overly general questions are unreasonable. | غلط: الأسئلة العامة أوي مش من المعقول."], "n": 1, "i": 104, "h": ""}, {"t": "mc", "q": "When checking understanding while listening, it is usually best to start with:<br>لما بتتأكد من الفهم أثناء الاستماع، الأحسن عادة تبدأ بـ:", "opts": ["gist questions, like why the girl phoned her friend | أسئلة الفكرة العامة، زي ليه البنت كلمت صاحبتها", "detail questions, like the arranged meeting time | أسئلة التفاصيل، زي وقت الميعاد المتفق عليه", "a full re-telling of the story | إعادة حكاية كاملة للقصة"], "ans": 0, "why": "Gist first, details later, so students are not overwhelmed. | الفكرة العامة الأول، التفاصيل بعدين، عشان الطلبة ميتلخبطوش.", "ex": ["Correct. | صح.", "No. Details come after gist. | غلط: التفاصيل بتيجي بعد الفكرة العامة.", "No. Some students understood but cannot re-tell. | غلط: بعض الطلبة فهموا بس مابيعرفوش يحكوا."], "n": 1, "i": 105, "h": ""}, {"t": "mc", "q": "Turning a telephone conversation into a map is an example of:<br>تحويل مكالمة تليفون لخريطة مثال على:", "opts": ["information transfer | نقل المعلومات", "dictation | الإملاء", "reordering information | إعادة ترتيب المعلومات"], "ans": 0, "why": "Information transfer moves information from a text or utterance into a new format like a table or map. | نقل المعلومات بينقل المعلومات من نص أو كلام لشكل جديد زي جدول أو خريطة.", "ex": ["Correct. | صح.", "No. Dictation is writing down what you hear. | غلط: الإملاء هو كتابة اللي بتسمعه.", "No. Reordering puts jumbled items in the correct order. | غلط: إعادة الترتيب بتحط عناصر مخلوطة بالترتيب الصح."], "n": 1, "i": 106, "h": ""}, {"t": "recall", "q": "Name the six pre-listening tasks from this unit.<br>اذكر مهام قبل الاستماع الستة من الوحدة دي.", "a": "Setting the context; warmers to generate interest; activating knowledge; predicting content; giving students the questions before they listen; predicting answers.<br>تهيئة السياق؛ تسخينات بتولّد الاهتمام؛ تفعيل المعرفة؛ توقع المحتوى؛ إعطاء الأسئلة قبل الاستماع؛ توقع الإجابات.", "n": 1, "i": 107, "h": ""}, {"t": "recall", "q": "Name at least five listening activities from this unit.<br>اذكر على الأقل خمس أنشطة استماع من الوحدة دي.", "a": "Add on; pass the message; think of a verb; what's the word?; hands up!; missing word; that's not right.<br>ضيف على اللي قبلك؛ مرّر الرسالة؛ فكّر في فعل؛ إيه الكلمة؟؛ ارفع إيدك!؛ الكلمة الناقصة؛ ده مش صح.", "n": 1, "i": 108, "h": ""}, {"t": "write", "q": "Why is it unfair to play a recording and say: listen and answer the questions? (3-4 sentences)<br>ليه مش من العدل تشغّل تسجيل وتقول: اسمعوا وجاوبوا على الأسئلة؟ (٣-٤ جمل).", "key": "tefl-42:1", "a": "A recording has no visible speakers, so students cannot infer context the way they do in real life. Without any introduction, students either understand and answer correctly or not, and if not, there is no way for them to improve. Pre-listening tasks like setting the context and predicting content give students the support real-life listeners always have. That turns a listening test into listening practice.<br>التسجيل مفيهوش متكلمين مرئيين، فالطلبة مابيعرفوش يستنتجوا السياق زي الحياة الحقيقية. من غير أي مقدمة، الطلبة يا بيفهموا وبيطلعوا الإجابات الصح يا لأ، ولو لأ، مفيش أي طريقة يتحسّنوا بيها. مهام قبل الاستماع زي تهيئة السياق وتوقع المحتوى بتدّي الطلبة الدعم اللي المستمعين في الحقيقة دايمًا عندهم. وكده بتحوّل اختبار الاستماع لتدريب استماع.", "n": 1, "i": 109, "h": ""}, {"t": "write", "q": "Explain how you can use the same authentic recording with different levels (3-4 sentences).<br>اشرح إزاي تقدر تستخدم نفس التسجيل الأصلي مع مستويات مختلفة (٣-٤ جمل).", "key": "tefl-42:2", "a": "The trick is to grade the tasks rather than the recording. A BBC radio interview, for example, could work for lower levels if you only ask them to listen for who is being interviewed. More advanced levels can listen to the same piece and identify attitudes, opinions and more specific details. This way students meet authentic material from an early stage without facing overly-complicated activities.<br>الحيلة إنك تدرّج المهام بدل التسجيل نفسه. مقابلة إذاعية من البي بي سي، مثلًا، ممكن تنفع للمستويات الأقل لو طلبت منهم بس يسمعوا مين اللي بيتقابل. المستويات المتقدمة تقدر تسمع نفس المقطع وتحدد المواقف والآراء والتفاصيل الأدق. كده الطلبة بيقابلوا مواد أصلية من مرحلة مبكرة من غير ما يواجهوا أنشطة معقدة أوي.", "n": 1, "i": 110, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">Next lesson: Module 8 begins, the reading skill. Module 7 is complete!</div><div class=\"u\">الدرس الجاي: بداية الموديول التامن، مهارة القراءة. الموديول السابع خلص!</div>", "extra": "درس مبسّط للمذاكرة الشخصية.", "i": 111}];</script>
