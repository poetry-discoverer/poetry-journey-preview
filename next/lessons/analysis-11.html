<script>window.LESSON_ID="analysis-11";window.STEPS=[{"t":"learn","h":"<div class=\"u\">بدأنا البلوك الفيكتوري/الأمريكي. أول قصيدة: سونيتة حب من أشهر السونيتات في الإنجليزية، ومكتوبة لشخص معين.</div><div class=\"u\">القصيدة: Sonnet 43 من Sonnets from the Portuguese لإليزابيث باريت براوننج.</div>","n":2,"i":0,"a":"analysis-11-001","x":"2ec8c6c3"},{"t":"section","h":"الشاعرة والسياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">إليزابيث باريت براوننج <span class=\"en\">(Elizabeth Barrett Browning)</span>، 1806-1861، شاعرة إنجليزية. كانت مريضة ومنعزلة سنين في بيت أهلها، واشتهرت قبل الجواز بشعرها.</div>","n":1,"i":2,"a":"analysis-11-002","x":"472585e6"},{"t":"learn","h":"<div class=\"u\">روبرت براوننج <span class=\"en\">(Robert Browning)</span> شاعر، قرأ شعرها وبدأ يراسلها، واتجوزوا سنة 1846 وسافروا إيطاليا. السونيتات دي كتبتها في فترة الخطوبة والجواز.</div>","n":1,"i":3,"a":"analysis-11-003","x":"8b2f2c70"},{"t":"learn","h":"<div class=\"u\">المجموعة اتنشرت 1850 باسم <span class=\"en\">Sonnets from the Portuguese</span>. العنوان مش لأنها برتغالية: هو إشارة لقصيدة قديمة لروبرت بيسميها فيها «البرتغالية»، وده اللي خلى الاسم يبقى غطا لقصايد شخصية جدًا.</div>","n":1,"i":4,"a":"analysis-11-004","x":"753c2cba"},{"t":"learn","h":"<div class=\"u\">الشكل: سونيتة بتراركية <span class=\"en\">(Petrarchan sonnet)</span> — تمانية سطور <span class=\"en\">(octave)</span> وستة <span class=\"en\">(sestet)</span>، بقافية <span class=\"en\">abba abba cdcdcd</span>.</div>","n":1,"i":5,"a":"analysis-11-005","x":"a1bccb19"},{"t":"mc","h":"","q":"إيه شكل القصيدة؟","opts":["سونيتة بتراركية: أوكتاف وسستيت","سونيتة شكسبيرية: 3 رباعيات وكوبليه","شعر حر"],"ans":0,"why":"سونيتة بتراركية (8+6).","n":1,"i":6,"ex":["صح: تمانية سطور + ستة، والقافية abba abba cdcdcd.","غلط: التقسيم هنا 8+6 مش 4+4+4+2.","غلط: القصيدة موزونة ومقفّاة بانتظام."]},{"t":"section","h":"الأوكتاف: العدّ (<span dir=\"ltr\">1-8</span>)","n":1,"i":7},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">How do I love thee? Let me count the ways. / I love thee to the depth and breadth and height / My soul can reach, when feeling out of sight / For the ends of being and ideal grace.</span></div>","n":2,"i":8,"a":"analysis-11-006","x":"ad9b02ea"},{"t":"learn","h":"<div class=\"u\">«إزاي بحبك؟ خليني أعدّ الطرق». السؤال في أول سطر جوابه القصيدة كلها. و«أعدّ» <span class=\"en\">(count)</span> بتحوّل الحب لحاجة ممكن تتقاس، وده اللي بيدي القصيدة بنيتها.</div>","n":1,"i":9,"a":"analysis-11-007","x":"f867f78b"},{"t":"tf","h":"","q":"القصيدة بتحكي قصة حب بترتيب زمني.","ans":false,"why":"غلط: مفيش حكاية ولا أحداث. القصيدة جواب على سؤال «إزاي بحبك؟» بطريقة العدّ.","n":1,"i":10,"ex":["غلط. مفيش سرد؛ فيه إجابة عن سؤال.","صح، الجملة غلط: القصيدة بنية عدّ مش بنية حكاية."]},{"t":"learn","h":"<div class=\"u\">«بحبك لعمق وعرض وارتفاع» — تلات أبعاد للمكان، يعني الحب ماليه كل حيز. و«لحد ما روحي توصل» — الحب متقاس بقدرة الروح، مش بقدرة الجسد.</div>","n":1,"i":11,"a":"analysis-11-008","x":"d2b66542"},{"t":"learn","h":"<div class=\"u\">و«وهي بتحس بعيد عن النظر» <span class=\"en\">(feeling out of sight)</span>: الروح بتلمس حدود الوجود والنعمة الإلهية. لاحظ اللغة الدينية من بدري: <span class=\"en\">grace</span>.</div>","n":1,"i":12,"a":"analysis-11-009","x":"b1ebbe3e"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">5-8</span>:</div><div class=\"u\"><span class=\"en\">I love thee to the level of every day’s / Most quiet need, by sun and candle-light. / I love thee freely, as men strive for right; / I love thee purely, as they turn from praise.</span></div>","n":2,"i":13,"a":"analysis-11-010","x":"1e2e0e22"},{"t":"learn","h":"<div class=\"u\">من الأبعاد الكبيرة للتفاصيل الصغيرة: «لمستوى أبسط احتياج يومي»، «بالشمس والشمعة». الحب مش بس لحظات كبيرة، هو كمان الحاجات الهادفة في اليوم العادي.</div>","n":1,"i":14,"a":"analysis-11-011","x":"0952ffb7"},{"t":"learn","h":"<div class=\"u\">«بحبك بحرية، زي ما الناس بتسعى للحق» <span class=\"en\">(freely, as men strive for right)</span>: الحب اختيار حر، مش اضطرار. و«بحبك بنقاء، زي ما بيعرضوا عن المدح» <span class=\"en\">(purely, as they turn from praise)</span>: حب مش محتاج تصفيق.</div>","n":1,"i":15,"a":"analysis-11-012","x":"b3ce3b24"},{"t":"mc","h":"","q":"«I love thee freely, as men strive for right» بتقول إيه عن الحب؟","opts":["إنه اختيار حر مش إجبار","إنه واجب ديني","إنه صعب زي الكفاح"],"ans":0,"why":"الحب اختيار حر.","n":1,"i":16,"ex":["صح: التشبيه بالسعي للحق بيوضح إن الحب اختيار أخلاقي حر.","غلط: الدين حاضر في القصيدة، لكن السطر ده عن الحرية.","غلط: التشبيه بيوضح الحرية مش الصعوبة."]},{"t":"learn","h":"<div class=\"u\">والتكرار <span class=\"en\">(anaphora)</span> في «I love thee» هو الإيقاع الأساسي: كل مرة بيفتح سبب جديد، زي العدّ اللي بدأت بيه.</div>","n":1,"i":17,"a":"analysis-11-013","x":"fdea5186"},{"t":"section","h":"السستيت: من الحب للخلود (<span dir=\"ltr\">9-14</span>)","n":1,"i":18},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">9-14</span>:</div><div class=\"u\"><span class=\"en\">I love thee with the passion put to use / In my old griefs, and with my childhood’s faith. / I love thee with a love I seemed to lose / With my lost saints. I love thee with the breath, / Smiles, tears, of all my life; and, if God choose, / I shall but love thee better after death.</span></div>","n":2,"i":19,"a":"analysis-11-014","x":"18458b9f"},{"t":"learn","h":"<div class=\"u\">«بحبك بالشغف اللي كان مستخدم في أحزاني القديمة»: الطاقة اللي كانت بتتصرف في الحزن اتحولت لحب. و«بإيمان طفولتي» — الحب بياخد مكان الإيمان القديم.</div>","n":1,"i":20,"a":"analysis-11-015","x":"4a29a524"},{"t":"learn","h":"<div class=\"u\">«بحبك بحب كنت فاكرة إني ضيّعته مع قديسيني الضايعين» <span class=\"en\">(my lost saints)</span>: فيه إحساس بفقدان ديني، والحب بيعوّضه. ده أهم تحول في القصيدة.</div>","n":1,"i":21,"a":"analysis-11-016","x":"77913600"},{"t":"mc","h":"","q":"«my lost saints» بتشير لإيه؟","opts":["فقدان إيمان أو أشخاص كانوا مقدسين عندها","قديسين في كنيسة","أهلها اللي ماتوا"],"ans":0,"why":"فقدان قديم، والحب بيعوّضه.","n":1,"i":22,"ex":["صح: التعبير عن فقدان قديم، والحب بيعوّضه («a love I seemed to lose»).","غلط: مفيش إشارة لكنيسة أو أشخاص محددين.","غلط: مفيش ذكر لأهلها في القصيدة."]},{"t":"learn","h":"<div class=\"u\">وبعدها «بنَفَس كل حياتي، وضحكها ودموعها» — الحب بقى شامل الحياة كلها، مش شعور منفصل.</div>","n":1,"i":23,"a":"analysis-11-017","x":"aec0d99a"},{"t":"learn","h":"<div class=\"u\">والختام: «ولو ربنا اختار، هحبك أحسن بعد الموت» <span class=\"en\">(I shall but love thee better after death)</span>. الحب هنا بيتجاوز حدود الحياة، لكن بصيغة مشروطة ومتواضعة: «لو ربنا اختار».</div>","n":1,"i":24,"a":"analysis-11-018","x":"6085e07c"},{"t":"mc","h":"","q":"السطر الأخير بيقول إيه؟","opts":["هتحبه أحسن بعد الموت، لو ربنا اختار","الحب هينتهي بالموت","هتنساه بعد الموت"],"ans":0,"why":"الحب بيكمل ويتقوّى بعد الموت.","n":1,"i":25,"ex":["صح: «I shall but love thee better after death» بصيغة مشروطة ومتواضعة.","غلط: السطر بيقول العكس تمامًا.","غلط: مفيش نسيان في القصيدة."]},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":26},{"t":"learn","h":"<div class=\"u\">العدّ والقياس: أبعاد (عمق، عرض، ارتفاع)، ومستويات (اليومي)، وأزمنة (الطفولة، الحاضر، بعد الموت). القصيدة مبنية زي حصر <span class=\"en\">(enumeration)</span>، وده اللي بيخليها محكمة.</div>","n":1,"i":27,"a":"analysis-11-019","x":"2b6c895c"},{"t":"learn","h":"<div class=\"u\">التكرار <span class=\"en\">(anaphora)</span>: «I love thee» بتتكرر في معظم السطور. التكرار مش تكرار ممل، هو طريقة العدّ اللي وعدت بيها في السطر الأول.</div>","n":1,"i":28,"a":"analysis-11-020","x":"b91052b8"},{"t":"tf","h":"","q":"التكرار في «I love thee» مرتبط بفكرة العدّ في السطر الأول.","ans":true,"why":"صح: «Let me count the ways» وعدّت، وكل تكرار بيضيف سبب.","n":1,"i":29,"ex":["صح، الجملة صح: التكرار هو العدّ نفسه.","غلط. التكرار هنا وظيفي ومقصود."]},{"t":"learn","h":"<div class=\"u\">اللغة الدينية: <span class=\"en\">grace, saints, faith, God</span>. الحب بيتوصف بمفردات العبادة، وبعض القراءات بتشوف إن القصيدة بتحوّل الحب لشكل من الإيمان.</div>","n":1,"i":30,"a":"analysis-11-021","x":"7170735a"},{"t":"learn","h":"<div class=\"u\">الموضوعات: الحب كاختيار حر ونقي، والحب في التفاصيل اليومية، وتحويل الحزن لفعل، والحب اللي بيتجاوز الموت. ونقطة مهمة: القصيدة مش بتحكي قصة، هي بتحاول تثبت حاجة بسؤال وعدّ.</div>","n":1,"i":31,"a":"analysis-11-022","x":"e9a795f4"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":32},{"t":"recall","h":"","q":"اشرح إزاي القصيدة بتحوّل الحب لحاجة بتتقاس.","a":"السطر الأول بيسأل «How do I love thee?» وبيقول «Let me count the ways» — يعني في نية عدّ. وبعدها القياس بيتم بأكتر من طريقة: أبعاد مكانية (depth, breadth, height)، ومدى روحي (لحد ما الروح توصل لحدود الوجود والنعمة)، ومستوى يومي (every day’s most quiet need)، وأزمنة (طفولة، حاضر، بعد الموت). وكمان بيقيس بالبدائل: حرية زي السعي للحق، ونقاء زي الإعراض عن المدح. فالقياس هنا مش رقمي، هو ترتيب أسباب — وده اللي بيدي القصيدة شكل الحصر.","n":1,"i":33},{"t":"recall","h":"","q":"إيه وظيفة اللغة الدينية في القصيدة؟","a":"اللغة الدينية موجودة من أول الأوكتاف: «ideal grace»، وبعدين «childhood’s faith»، و«my lost saints»، وفي الآخر «if God choose». الوظيفة إن الحب بياخد مكانة الإيمان القديم: الشغف اللي كان في الأحزان، والإيمان اللي كان في الطفولة، والحب اللي ضاع مع القديسين — كلهم بيتحولوا لحب واحد. وفي نفس الوقت الصيغة الأخيرة «if God choose» بترجع السلطة لله، فالحب مش بيتحط فوق الدين، هو بيطلب مباركته. وبعض القراءات بتشوف إن القصيدة بتحوّل الحب لشكل من العبادة.","n":1,"i":34},{"t":"write","h":"","q":"حلّل العلاقة بين شكل السونيتة ومعنى القصيدة.","key":"analysis-11:1","a":"السونيتة البتراركية 8+6، والقصيدة بتستخدم التقسيم ده: الأوكتاف بيعدّ أسباب الحب في المكان والزمان واليومي، والسستيت بينتقل لمصدر الحب (الشغف القديم والإيمان الطفولي) ولمستقبله (بعد الموت). الانتقال (volta) بييجي عند «I love thee with the passion put to use / In my old griefs» — من وصف الحب لشرح أصله. والقافية abba abba بتدي إحساس بالثبات والتكرار المنظم في الأوكتاف، والسستيت بقتافيه المتغيرة cdcdcd بتفتح الحركة ناحية الختام. والقافية المتقاطعة مع التكرار في «I love thee» بتخلي القصيدة تبدو زي عدّ محكم بيتقفل بسطر أخير قوي.","n":1,"i":35},{"t":"write","h":"","q":"ناقش إزاي القصيدة بتوازن بين الحب اليومي والحب المتجاوز.","key":"analysis-11:2","a":"القصيدة بتفتح بأبعاد كبيرة: depth, breadth, height، وحدود الوجود والنعمة الإلهية. لكن بعدها مباشرة بتنزل للحياة اليومية: «every day’s most quiet need, by sun and candle-light». التوازن ده مقصود: الحب كبير لأنه موجود في الحاجات الصغيرة، مش رغم عنها. وفي السستيت بيزيد العمق: الشغف اللي كان في الأحزان القديمة، وإيمان الطفولة، وقديسين ضاعوا — يعني الحب بياخد طاقة التجارب الصعبة كلها. والختام بيرفع السقف تاني: «I shall but love thee better after death». فالحركة رايحة جاية بين اليومي والمتجاوز، والقصيدة مش بتختار بينهم: بتقول إن الاتنين نفس الحب. وده اللي بيخليها مقنعة، لأنها مش بتتكلم في المطلق بس.","n":1,"i":36},{"t":"end","h":"","teaser":"<div class=\"u\">كده Sonnet 43 خلصت: سؤال وعدّ، حب في الأبعاد والاحتياج اليومي، وحب بيزيد بعد الموت.</div><div class=\"u\">الدرس الجاي: The Lady of Shalott لتينيسون — قصة في أربع أجزاء، ورمز مش سهل.</div>","extra":"المصادر: Elizabeth Barrett Browning, Sonnets from the Portuguese (1850), Sonnet 43؛ مصطلحات: Petrarchan sonnet, octave, sestet, volta, anaphora.","i":37}];</script>
