<script>window.LESSON_ID="poetry-18";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة أداة ذكية: لما اللي بيتقال أو بيحصل عكس اللي متوقع. زي لما تقول \"يا سلام على الجو الحلو!\" وإنتوا واقفين في الشمس الحارقة <span class=\"em\"><span class=\"em\">😄</span></span>. نتعلم نكتشفها في الشعر، وإزاي نحللها.</div>", "n": 1, "i": 0, "a": "poetry-18-001", "x": "55bbde58"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: النقطة الأولى — إيه هو الـ <span class=\"en\">irony</span>؟ <span class=\"em\"><span class=\"em\">🤔</span></span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١) التعريف</div><div class=\"u\">١.١ الـ <span class=\"en\">irony</span> (مفارقة / سخرية) = فرق بين الظاهر وبين الحقيقة أو المتوقع.</div><div class=\"u\">١.٢ تعريف تاني بسيط: \"التعبير عن المعنى بلغة معناها المعتاد عكسه، غالباً للفكاهة أو للتأكيد\".</div><div class=\"u\">٢) أصل الكلمة</div>", "n": 4, "i": 2, "a": "poetry-18-002", "x": "f1ae1263"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">irony</span> هي...", "nq": 1, "opts": ["فرق بين الظاهر والحقيقة أو المتوقع", "تكرار صوت", "مقارنة بـ <span class=\"en\">like</span>"], "ans": 0, "why": "فرق بين الظاهر والحقيقة أو المتوقع", "ex": ["صح: زي لما تقول الجو حلو وإنتوا في الشمس الحارقة.", "غلط: ده <span class=\"en\">alliteration</span> أو <span class=\"en\">consonance</span>.", "غلط: ده <span class=\"en\">simile</span>."], "i": 3}, {"t": "learn", "h": "<div class=\"u\">٢.١ الكلمة جاية من اليونانية. (شخصيات الـ <span class=\"en\">eiron</span> \"الماكر\" زي سقراط عند أفلاطون مثال على الشخصية المرتبطة بالمفارقة.)</div><div class=\"u\">٣) ليه المفارقة بتحتاج جمهور مزدوج؟</div><div class=\"u\">٣.١ في ناس بتفهم المعنى الحقيقي، وناس لأ. (كلام <span class=\"en\">Fowler</span> في <span class=\"en\">The King's English</span> سنة ١٩٠٦ عن تعريف المفارقة.)</div>", "n": 3, "i": 4, "a": "poetry-18-003", "x": "996a333b"}, {"t": "learn", "h": "<div class=\"u\">٣.٢ عشان كده المفارقة بتقرّب اللي فاهمين وبتبعّد اللي مش فاهمين. (قراءة)</div>", "n": 1, "i": 5, "a": "poetry-18-004", "x": "b4a82120"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: النقطة التانية — أنواع الـ <span class=\"en\">irony</span> الأساسية <span class=\"em\"><span class=\"em\">🧩</span></span>", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">١) <span class=\"em\"><span class=\"em\">🗣️</span></span> <span class=\"en\">Verbal irony</span> (مفارقة لفظية)</div><div class=\"u\">١.١ المتكلم عن قصد بيقول عكس معناه الحقيقي.</div><div class=\"u\">١.٢ مثال: <span class=\"en\">Samuel Johnson</span> قال \"<span class=\"en\">Bolingbroke was a holy man</span>\" (وهو كان بعيد عن القداسة).</div><div class=\"u\">١.٣ مثال من حياتك: \"برافو عليك\" لما واحد يوقع الكوباية. <span class=\"em\"><span class=\"em\">😄</span></span></div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">🎭</span></span> <span class=\"en\">Dramatic irony</span> (مفارقة درامية)</div>", "n": 5, "i": 7, "a": "poetry-18-005", "x": "2c038d82"}, {"t": "mc", "h": "", "q": "لما حد يوقع الكوباية وتقوله برافو عليك، دي مفارقة...", "nq": 1, "opts": ["لفظية (<span class=\"en\">verbal</span>)", "درامية", "قدر"], "ans": 0, "why": "لفظية (<span class=\"en\">verbal</span>)", "ex": ["صح: المتكلم بيقول عكس معناه الحقيقي عن قصد.", "غلط: الدرامية لما الجمهور يعرف حاجة الشخصية مش عارفاها.", "غلط: مفارقة القدر عن قوى أكبر من الشخصية."], "i": 8}, {"t": "learn", "h": "<div class=\"u\">٢.١ الجمهور بيعرف حاجة الشخصيات مش عارفاها. فبنشوف كلامهم وأفعالهم \"غلط\" وهم مش واخدين بالهم.</div><div class=\"u\">٢.٢ بتتكون من ٣ مراحل: تمهيد، شد، حل.</div><div class=\"u\">٢.٣ مثال من تأليفي: في فيلم، المشاهد عارف إن الحرامي مستخبي ورا الباب والبطل داخل الأوضة بابتسامة.</div><div class=\"u\">٣) <span class=\"em\"><span class=\"em\">🎲</span></span> <span class=\"en\">Situational irony</span> (مفارقة الموقف)</div><div class=\"u\">٣.١ النتيجة عكس المتوقع تماماً، وبشكل مفاجئ (مش مجرد وحش حظ).</div>", "n": 5, "i": 9, "a": "poetry-18-006", "x": "7cd53a13"}, {"t": "mc", "h": "", "q": "مشاهد عارف إن الحرامي مستخبي ورا الباب والبطل داخل بابتسامة، دي مفارقة...", "nq": 1, "opts": ["درامية (<span class=\"en\">dramatic</span>)", "لفظية", "موقف"], "ans": 0, "why": "درامية (<span class=\"en\">dramatic</span>)", "ex": ["صح: الجمهور عارف حاجة والشخصية مش عارفاها.", "غلط: اللفظية قول عكس المعنى.", "غلط: الموقف نتيجة عكس المتوقع."], "i": 10}, {"t": "learn", "h": "<div class=\"u\">٣.٢ مثال: في <span class=\"en\">The Wizard of Oz</span>، الأبطال رايحين للساحر عشان يديهم اللي ناقصهم. الساحر طلع رجل عادي، وهم كانوا معاهم اللي بيدوروا عليه من الأول.</div><div class=\"u\">٣.٣ مثال تاني (من عندي): جملة \"<span class=\"en\">nothing is written in stone</span>\" (مفيش حاجة مكتوبة في الحجر) لو اتنقشت فعلاً على حجر!</div><div class=\"u\">٤) <span class=\"em\"><span class=\"em\">🌌</span></span> <span class=\"en\">Cosmic irony</span> (مفارقة القدر)</div>", "n": 3, "i": 11, "a": "poetry-18-007", "x": "9d452914"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">The Wizard of Oz</span>، إيه المفارقة؟", "nq": 1, "opts": ["الأبطال كان معاهم اللي بيدوروا عليه من الأول", "الساحر ساحر حقيقي", "الأبطال رجعوا من غير مشاكل"], "ans": 0, "why": "الأبطال كان معاهم اللي بيدوروا عليه من الأول", "ex": ["صح: الساحر طلع رجل عادي، وهم كانوا معاهم اللي بيدوروا عليه من الأول.", "غلط: الساحر طلع رجل عادي.", "غلط: المفارقة في النتيجة المعكوسة."], "i": 12}, {"t": "learn", "h": "<div class=\"u\">٤.١ الشخصيات بتتحبط دايماً من قوى أكبر منها. مرتبطة بأعمال <span class=\"en\">Thomas Hardy.</span></div>", "n": 1, "i": 13, "a": "poetry-18-008", "x": "495539ec"}, {"t": "mc", "h": "", "q": "مفارقة القدر (<span class=\"en\">cosmic irony</span>) مرتبطة بأعمال...", "nq": 1, "opts": ["<span class=\"en\">Thomas Hardy</span>", "<span class=\"en\">Edgar Allan Poe</span>", "<span class=\"en\">Emily Dickinson</span>"], "ans": 0, "why": "<span class=\"en\">Thomas Hardy</span>", "ex": ["صح: <span class=\"en\">Hardy</span> شخصياته بتتحبط من قوى أكبر منها.", "غلط: <span class=\"en\">Poe</span> كتب <span class=\"en\">The Raven</span> و<span class=\"en\">The Bells</span>.", "غلط: <span class=\"en\">Dickinson</span> قصيدتها عن الموت زي ضيف."], "i": 14}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: النقطة التالتة — المفارقة في قصايد معانا <span class=\"em\"><span class=\"em\">📜</span></span>", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">١) <span class=\"en\">Shakespeare</span>، <span class=\"en\">Sonnet 130</span></div><div class=\"u\">\"<span class=\"en\">My mistress' eyes are nothing like the sun</span>; / <span class=\"en\">Coral is far more red than her lips' red</span>;\"</div><div class=\"u\">١.١ معظم الشعراء في زمنه بيشبهوا حبيباتهم بالشمس والمرجان والورد (تشبيهات مبالغ فيها).</div><div class=\"u\">١.٢ هو بيعمل العكس ظاهرياً: \"عينيها مش زي الشمس\"! بس في الآخر بيقول: \"أنا شايف حبيبتي نادرة زي أي واحدة اتوصفت بتشبيهات كاذبة\".</div>", "n": 4, "i": 16, "a": "poetry-18-009", "x": "b4151edd"}, {"t": "learn", "h": "<div class=\"u\">١.٣ القصيدة بتسخر من مبالغات الشعراء وتمدح الحبيبة بصدق.</div><div class=\"u\">١.٤ المفارقة: بيمدحها بالعكس: بيقول عيوبها عشان يثبت إنه بيحبها بجد.</div><div class=\"u\">٢) <span class=\"en\">Shelley</span>، <span class=\"en\">Ozymandias</span> (١٨١٨)</div>", "n": 3, "i": 17, "a": "poetry-18-010", "x": "18f1767c"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Sonnet</span> 130 لشكسبير، إيه اللي بيعمله الشاعر؟", "nq": 1, "opts": ["بيسخر من مبالغات الشعراء ويمدح حبيبته بصدق", "بيقارن عينيها بالشمس", "بيكرهها"], "ans": 0, "why": "بيسخر من مبالغات الشعراء ويمدح حبيبته بصدق", "ex": ["صح: بيقول عيوبها عشان يثبت إنه بيحبها بجد.", "غلط: هو بيقول عينيها مش زي الشمس.", "غلط: القصيدة مدح صادق."], "i": 18}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">And on the pedestal these words appear</span>: / '<span class=\"en\">My name is Ozymandias,</span> <span class=\"en\">king of kings</span>: / <span class=\"en\">Look on my works,</span> <span class=\"en\">ye Mighty,</span> <span class=\"en\">and despair</span>!' / <span class=\"en\">Nothing beside remains.</span> <span class=\"en\">Round the decay</span> / <span class=\"en\">Of that colossal wreck,</span> <span class=\"en\">boundless and bare</span> / <span class=\"en\">The lone and level sands stretch far away.</span>\"</div><div class=\"u\">٢.١ الملك كتب على التمثال: \"بصوا على أعمالي يا أقوياء وانهاروا من اليأس!\" يعني بيتباهى.</div>", "n": 2, "i": 19, "a": "poetry-18-011", "x": "ec883dd1"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ بس \"<span class=\"en\">Nothing beside remains</span>\": مفيش حاجة فاضلة غير رمال. التمثال مكسور.</div><div class=\"u\">٢.٣ دي مفارقة موقف: الملك اللي كان عايز يخوّف الكل بعظمته، النهاردة عظمته ضايعة. (قراءة: القصيدة عن \"أضرار الزمن على إرث العظماء\")</div><div class=\"u\">٢.٤ كمان فيه مفارقة: الكلمات \"<span class=\"en\">Look on my works</span>\" بقت دعوة للنظر لخرابه.</div>", "n": 3, "i": 20, "a": "poetry-18-012", "x": "a3c34b24"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Ozymandias</span> لـ <span class=\"en\">Shelley</span> (1818)، المفارقة إن...", "nq": 1, "opts": ["الملك كان عايز يخوّف الكل بعظمته وعظمته ضاعت", "التمثال سليم", "الملك فاز"], "ans": 0, "why": "الملك كان عايز يخوّف الكل بعظمته وعظمته ضاعت", "ex": ["صح: <span class=\"en\">Look on my works</span> بقت دعوة للنظر لخرابه، و<span class=\"en\">Nothing beside remains</span>.", "غلط: التمثال مكسور.", "غلط: الزمن هو اللي فاز."], "i": 21}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: النقطة الرابعة — إزاي أكتشف وأحلل المفارقة؟ <span class=\"em\"><span class=\"em\">🔍</span></span>", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">١) علامات تنبيه</div><div class=\"u\">١.١ كلام فيه مبالغة أو مدح في موقف سيء (أو العكس).</div><div class=\"u\">١.٢ فرق بين اللي الشخصية فاكراه واللي القارئ عارفه.</div><div class=\"u\">١.٣ نتيجة عكس المتوقع.</div><div class=\"u\">٢) خطوات التحليل (٥ أسئلة)</div><div class=\"u\">٢.١ إيه المعنى الظاهر (السطح)؟</div><div class=\"u\">٢.٢ إيه المعنى الحقيقي أو المتوقع؟</div><div class=\"u\">٢.٣ إيه النوع (لفظية، درامية، موقف، قدر)؟</div><div class=\"u\">٢.٤ مين اللي فاهم ومين لأ؟</div><div class=\"u\">٢.٥ إيه الإحساس: سخرية، حزن، فكاهة، تحذير؟</div><div class=\"u\">٣) تحذير <span class=\"em\"><span class=\"em\">⚠️</span></span></div>", "n": 11, "i": 23, "a": "poetry-18-013", "x": "fec1f54e"}, {"t": "learn", "h": "<div class=\"u\">٣.١ الكلمة \"<span class=\"en\">irony</span>\" بتتلخبط في الكلام اليومي مع \"المصادفة\" أو \"حظ وحش\". مش كل مصادفة <span class=\"en\">irony.</span> <span class=\"en\">situational irony</span> لازم تكون عكس المتوقع بشكل صارخ، مش مجرد حظ وحش. وفيه خلاف حتى بين الباحثين على تعريف دقيق للكلمة.</div>", "n": 1, "i": 24, "a": "poetry-18-014", "x": "5205c2fe"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅</span></span>", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">١) الملخص</div><div class=\"u\">١.١ <span class=\"en\">irony</span> = فرق بين الظاهر والحقيقة أو المتوقع.</div><div class=\"u\">١.٢ الأنواع: لفظية، درامية، موقف، قدر.</div><div class=\"u\">١.٣ أمثلة: <span class=\"en\">Bolingbroke was a holy man</span>، <span class=\"en\">Wizard of Oz</span>، <span class=\"en\">Sonnet 130</span>، <span class=\"en\">Ozymandias.</span></div><div class=\"u\">١.٤ خطوات: السطح، الحقيقة، النوع، مين فاهم، الإحساس.</div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">✏️</span></span> تمرين</div>", "n": 6, "i": 26, "a": "poetry-18-015", "x": "55c84c54"}, {"t": "learn", "h": "<div class=\"u\">٢.١ حدد نوع المفارقة في: \"برافو\" لما واحد يوقع الكوباية؛ والمشاهد اللي عارف إن في فيلم الحرامي ورا الباب؛ وجملة \"<span class=\"en\">nothing is written in stone</span>\" المنقوشة على حجر.</div><div class=\"u\">٢.٢ حلل <span class=\"en\">Ozymandias</span> بالخمس خطوات.</div><div class=\"u\">٢.٣ اكتب مثال لكل نوع (لفظية، درامية، موقف) من تأليفك.</div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح. <span class=\"em\"><span class=\"em\">✍️</span></span></div>", "n": 4, "i": 27, "a": "poetry-18-016", "x": "88a86e14"}, {"t": "recall", "h": "", "q": "يعني إيه <span class=\"en\">verbal irony</span>؟ اديني مثال.", "a": "المتكلم بيقول عن قصد عكس معناه. مثال: <span class=\"en\">Samuel Johnson</span>: \"<span class=\"en\">Bolingbroke was a holy man</span>\" (وهو كان بعيد عن القداسة).", "n": 1, "i": 28}, {"t": "recall", "h": "", "q": "إيه الفرق بين <span class=\"en\">verbal irony</span> و <span class=\"en\">dramatic irony</span>؟", "a": "<span class=\"en\">verbal</span>: المتكلم نفسه بيقصد عكس كلامه. <span class=\"en\">dramatic</span>: الجمهور بيعرف حاجة الشخصيات مش عارفاها.", "n": 1, "i": 29}, {"t": "recall", "h": "", "q": "ليه <span class=\"en\">Ozymandias</span> فيها <span class=\"en\">situational irony</span>؟", "a": "الملك كتب على التمثال إنه عظيم، ومفيش دلوقتي غير رمال وتمثال مكسور: النتيجة عكس اللي كان يتمناه.", "n": 1, "i": 30}, {"t": "tf", "h": "", "q": "صح ولا غلط: أي حظ وحش يبقى <span class=\"en\">irony.</span>", "ans": false, "why": "غلط. لازم تكون النتيجة عكس المتوقع بشكل واضح، مش مجرد حظ وحش.", "n": 1, "i": 31, "ex": ["الجملة غلط. لازم تكون النتيجة عكس المتوقع بشكل واضح، مش مجرد حظ وحش.", "صح، الجملة غلط. لازم تكون النتيجة عكس المتوقع بشكل واضح، مش مجرد حظ وحش."]}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳</span></span> الدرس الجاي (الدرس ١٩): <span class=\"en\">metonymy</span> و <span class=\"en\">synecdoche</span> و <span class=\"en\">oxymoron</span> و <span class=\"en\">paradox.</span>", "extra": "", "i": 32}];</script>
