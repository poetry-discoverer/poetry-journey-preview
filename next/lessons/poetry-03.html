<script>window.LESSON_ID="poetry-03";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة هنسمع المزيكا اللي جوه القصيدة. خد وقتك في كل صفحة.</div>", "n": 1, "i": 0, "a": "poetry-03-001", "x": "a64129d3"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: إيه هي القافية أصلاً؟", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">تخيل حد بيدق على طبلة: دوم.. دوم.. تكا.. دوم.. دوم.. تكا.. الإيقاع الحلو جاي من صوت بيتكرر في مكان متوقع. القافية نفس الفكرة: صوت بيتكرر في آخر السطور، فيخلي القصيدة ليها مزيكا.</div><div class=\"u\">التعريف: <span class=\"en\">rhyme</span> (قافية) يعني كلمات بتقفل على نفس الصوت. ولما بتيجي في آخر السطور بنسميها <span class=\"en\">end rhyme.</span></div>", "n": 2, "i": 2, "a": "poetry-03-002", "x": "00fdd6d4"}, {"t": "learn", "h": "<div class=\"u\">أمثلة: في مقطع <span class=\"en\">The Tyger</span>: <span class=\"en\">bright</span> مع <span class=\"en\">night</span>، و <span class=\"en\">eye</span> مع <span class=\"en\">symmetry.</span> وكمان: <span class=\"en\">day</span> مع <span class=\"en\">May</span>، <span class=\"en\">cat</span> مع <span class=\"en\">mat</span>، <span class=\"en\">tree</span> مع <span class=\"en\">me.</span></div><div class=\"u\">نقطة مهمة: القافية على الصوت، مش على الحروف. <span class=\"en\">night</span> و <span class=\"en\">bright</span> مكتوبين مختلف بس صوتهم واحد. وزيها <span class=\"en\">through</span> مع <span class=\"en\">blue.</span> عينك متهمهاش، ودنك هي الحكم.</div>", "n": 2, "i": 3, "a": "poetry-03-003", "x": "37ba01ee"}, {"t": "mc", "h": "", "q": "القافية بتتحدد على أساس...", "nq": 1, "opts": ["الصوت", "شكل الحروف", "عدد الكلمات"], "ans": 0, "why": "الصوت", "ex": ["صح: القافية على الصوت: <span class=\"en\">night</span> و <span class=\"en\">bright</span> صوتهم واحد رغم اختلاف الحروف.", "غلط: الحروف ممكن تختلف والقافية موجودة، زي <span class=\"en\">through</span> و <span class=\"en\">blue</span>.", "غلط: عدد الكلمات مالوش علاقة بالقافية."], "i": 4}, {"t": "mc", "h": "", "q": "أنهي زوج كلمات بيقفل على نفس الصوت؟", "nq": 1, "opts": ["<span class=\"en\">tree</span> و <span class=\"en\">me</span>", "<span class=\"en\">cat</span> و <span class=\"en\">dog</span>", "<span class=\"en\">day</span> و <span class=\"en\">night</span>"], "ans": 0, "why": "<span class=\"en\">tree</span> و <span class=\"en\">me</span>", "ex": ["صح: <span class=\"en\">tree</span> و <span class=\"en\">me</span> بيقفلوا على نفس الصوت.", "غلط: <span class=\"en\">cat</span> و <span class=\"en\">dog</span> صوت آخرهم مختلف.", "غلط: <span class=\"en\">day</span> و <span class=\"en\">night</span> صوت آخرهم مختلف."], "i": 5}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: إزاي نسمّي نظام القافية؟ (<span class=\"en\">rhyme scheme</span>)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">نظام القافية يعني: مين السطر اللي بيقفل على مين؟ وبنكتبه بحروف <span class=\"en\">A</span> و <span class=\"en\">B</span> و <span class=\"en\">C.</span></div>", "n": 1, "i": 7, "a": "poetry-03-004", "x": "c3b4621b"}, {"t": "learn", "h": "<div class=\"lead\">خطوة خطوة:</div><div class=\"u\">١- آخر كلمة في أول سطر = <span class=\"en\">A.</span></div><div class=\"u\">٢- آخر كلمة في السطر التاني بتقفل على <span class=\"en\">A</span>؟ لو أه تاخد <span class=\"en\">A</span>، لو لأ تاخد <span class=\"en\">B.</span></div><div class=\"u\">٣- كمّل كده، أي صوت جديد ياخد الحرف اللي بعده.</div>", "n": 3, "i": 8, "a": "poetry-03-005", "x": "5d0ff09a"}, {"t": "learn", "h": "<div class=\"lead\">تطبيق على مقطع بسيط من تأليفي:</div><div class=\"u\"><span class=\"en\">The cat is sleeping on the mat,</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">A</span></div><div class=\"u\"><span class=\"en\">The dog is running with a bat,</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">A</span></div><div class=\"u\"><span class=\"en\">The bird is singing in the tree,</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">B</span></div><div class=\"u\"><span class=\"en\">Come here,</span> <span class=\"en\">come here,</span> <span class=\"en\">and look at me</span>! <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">B</span></div><div class=\"u\">النظام: <span class=\"en\">AABB.</span></div>", "n": 5, "i": 9, "a": "poetry-03-006", "x": "5719ea01"}, {"t": "mc", "h": "", "q": "في مقطع القطة والكلب (<span class=\"en\">The cat... mat</span> / <span class=\"en\">dog... bat</span> / <span class=\"en\">bird... tree</span> / <span class=\"en\">me</span>)، نظام القافية هو...", "nq": 1, "opts": ["<span class=\"en\">ABAB</span>", "<span class=\"en\">AABB</span>", "<span class=\"en\">ABCB</span>"], "ans": 1, "why": "<span class=\"en\">AABB</span>", "ex": ["غلط: <span class=\"en\">ABAB</span> معناه الأول مع التالت والتاني مع الرابع.", "صح: <span class=\"en\">mat</span> مع <span class=\"en\">bat</span> (<span class=\"en\">A A</span>)، وبعدين <span class=\"en\">tree</span> مع <span class=\"en\">me</span> (<span class=\"en\">B B</span>).", "غلط: <span class=\"en\">ABCB</span> معناه التاني والرابع بس."], "i": 10}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: أشهر ٣ أنظمة قافية", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">١- <span class=\"en\">AABB</span>: كل سطرين ورا بعض بيقفلوا على بعض.</div><div class=\"u\"><span class=\"en\">Tyger Tyger,</span> <span class=\"en\">burning bright,</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">A</span></div><div class=\"u\"><span class=\"en\">In the forests of the night</span>; <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">A</span></div><div class=\"u\"><span class=\"en\">What immortal hand or eye,</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">B</span></div><div class=\"u\"><span class=\"en\">Could frame thy fearful symmetry?</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">B</span></div><div class=\"u\">٢- <span class=\"en\">ABAB</span>: بالتبادل، الأول مع التالت والتاني مع الرابع. أول مقطع من <span class=\"en\">Sonnet 18</span> لشكسبير:</div><div class=\"u\"><span class=\"en\">Shall I compare thee to a summer's day?</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">A</span></div><div class=\"u\"><span class=\"en\">Thou art more lovely and more temperate</span>: <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">B</span></div>", "n": 8, "i": 12, "a": "poetry-03-007", "x": "ce326309"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Rough winds do shake the darling buds of May,</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">A</span></div><div class=\"u\"><span class=\"en\">And summer's lease hath all too short a date</span>: <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">B</span></div><div class=\"u\">٣- <span class=\"en\">ABCB</span>: التاني والرابع بس بيقفلوا (نظام الـ <span class=\"en\">ballads</span>). أول مقطع من <span class=\"en\">The Rime of the Ancient Mariner</span> لكوليردج:</div><div class=\"u\"><span class=\"en\">It is an ancient Mariner,</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">A</span></div><div class=\"u\"><span class=\"en\">And he stoppeth one of three.</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">B</span></div><div class=\"u\">'<span class=\"en\">By thy long grey beard and glittering eye,</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">C</span></div><div class=\"u\"><span class=\"en\">Now wherefore stopp'st thou me?</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">B</span></div>", "n": 7, "i": 13, "a": "poetry-03-008", "x": "b5aa2740"}, {"t": "mc", "h": "", "q": "نظام <span class=\"en\">ABAB</span> اتشرح بأول مقطع من أي عمل؟", "nq": 1, "opts": ["<span class=\"en\">Sonnet</span> 18 لشكسبير", "<span class=\"en\">The Tyger</span> لـ <span class=\"en\">Blake</span>", "<span class=\"en\">The Rime of the Ancient Mariner</span> لكوليردج"], "ans": 0, "why": "<span class=\"en\">Sonnet</span> 18 لشكسبير", "ex": ["صح: <span class=\"en\">Sonnet</span> 18 لشكسبير مثال <span class=\"en\">ABAB</span>: <span class=\"en\">day</span> مع <span class=\"en\">May</span>، و<span class=\"en\">temperate</span> مع <span class=\"en\">date</span>.", "غلط: <span class=\"en\">The Tyger</span> مثال <span class=\"en\">AABB</span>.", "غلط: <span class=\"en\">The Rime of the Ancient Mariner</span> مثال <span class=\"en\">ABCB</span>."], "i": 14}, {"t": "mc", "h": "", "q": "نظام <span class=\"en\">ABCB</span> بيتميز بإن...", "nq": 1, "opts": ["كل الأسطر بتقفل على بعض", "التاني والرابع بس بيقفلوا على بعض", "مفيش قافية خالص"], "ans": 1, "why": "التاني والرابع بس بيقفلوا على بعض", "ex": ["غلط: ده شكل تاني من القافية مش <span class=\"en\">ABCB</span>.", "صح: في <span class=\"en\">ABCB</span> التاني والرابع بس بيقفلوا، وده نظام الـ <span class=\"en\">ballads</span>.", "غلط: ده الـ <span class=\"en\">free verse</span>."], "i": 15}, {"t": "learn", "h": "<div class=\"u\">وسطرين <span class=\"en\">couplet</span> بيقفلوا على بعض اسمهم <span class=\"en\">rhyming couplet.</span></div>", "n": 1, "i": 16, "a": "poetry-03-009", "x": "baa8cd50"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: ليه القافية مهمة؟ وهل كل شعر فيه قافية؟", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">١- مزيكا: بتخلي القصيدة حلوة في الودن.</div><div class=\"u\">٢- حفظ: عشان كده أغاني الأطفال كلها قافية، المخ بيمسك الكلام المقفّى بسرعة.</div><div class=\"u\">٣- توقع ومفاجأة: ودنك بتستنى الصوت اللي هيقفل، والشاعر الشاطر يفاجئك.</div><div class=\"u\">بس مش كل شعر فيه قافية! فيه شعر حر اسمه <span class=\"en\">free verse</span> من غير قافية. افتكر <span class=\"en\">The Red Wheelbarrow</span>: مفيهاش قافية وبرضه قصيدة مشهورة جدًا. يعني القافية أداة حلوة، مش قانون.</div>", "n": 4, "i": 18, "a": "poetry-03-010", "x": "59814694"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">free verse</span> هو شعر...", "nq": 1, "opts": ["من غير قافية", "كله بقافية <span class=\"en\">AABB</span>", "من سطر واحد"], "ans": 0, "why": "من غير قافية", "ex": ["صح: الـ <span class=\"en\">free verse</span> شعر من غير قافية منتظمة، زي <span class=\"en\">The Red Wheelbarrow</span>.", "غلط: ده شكل تاني من القافية.", "غلط: الـ <span class=\"en\">free verse</span> ممكن يكون أي طول."], "i": 19}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">١- القافية: كلمات بتقفل على نفس الصوت (الصوت مش الحروف).</div><div class=\"u\">٢- نظام القافية: بنسمي أصوات آخر السطور بالحروف <span class=\"en\">A B C.</span></div><div class=\"u\">٣- أشهر ٣ أنظمة: <span class=\"en\">AABB</span>، <span class=\"en\">ABAB</span>، <span class=\"en\">ABCB.</span></div><div class=\"u\">٤- القافية أداة مش قانون: فيه شعر حر.</div>", "n": 4, "i": 21, "a": "poetry-03-011", "x": "817cae20"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️</span></span> تمرين:</div><div class=\"u\">١- اكتب نظام القافية للمقطع ده (<span class=\"en\">Sonnet 18</span>، المقطع التاني):</div><div class=\"u\"><span class=\"en\">Sometime too hot the eye of heaven shines,</span></div><div class=\"u\"><span class=\"en\">And often is his gold complexion dimmed</span>;</div><div class=\"u\"><span class=\"en\">And every fair from fair sometime declines,</span></div><div class=\"u\"><span class=\"en\">By chance,</span> <span class=\"en\">or nature's changing course,</span> <span class=\"en\">untrimmed</span>:</div><div class=\"u\">٢- اكتب نظام مقطع <span class=\"en\">The Tyger</span> من غير ما تبص فوق.</div><div class=\"u\">٣- اكتب <span class=\"en\">rhyming couplet</span> بنفسك عن أي حاجة في يومك.</div>", "n": 7, "i": 22, "a": "poetry-03-012", "x": "d107224c"}, {"t": "learn", "h": "<div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.</div>", "n": 2, "i": 23, "a": "poetry-03-013", "x": "13b8cd28"}, {"t": "recall", "h": "", "q": "القافية بتتحدد على أساس إيه: شكل الحروف ولا الصوت؟", "a": "على أساس الصوت، مش الحروف. عشان كده <span class=\"en\">night</span> و <span class=\"en\">bright</span> قافية رغم إن كتابتهم مختلفة.", "n": 1, "i": 24}, {"t": "recall", "h": "", "q": "لو آخر كلمات مقطع هي: <span class=\"en\">day</span> ... <span class=\"en\">night</span> ... <span class=\"en\">May</span> ... <span class=\"en\">bright</span> بالترتيب، اكتب نظام القافية بالحروف.", "a": "<span class=\"en\">ABAB</span>: يعني <span class=\"en\">day</span> (<span class=\"en\">A)</span> <span class=\"en\">night</span> (<span class=\"en\">B)</span> <span class=\"en\">May</span> (<span class=\"en\">A</span> بتقفل على <span class=\"en\">day)</span> <span class=\"en\">bright</span> (<span class=\"en\">B</span> بتقفل على <span class=\"en\">night)</span>.", "n": 1, "i": 25}, {"t": "recall", "h": "", "q": "أي نظام قافية هو الأشهر في الأغاني الشعبية والحكايات المغناة (<span class=\"en\">ballads)</span>؟", "a": "<span class=\"en\">ABCB</span>: السطر التاني والرابع بس اللي بيقفلوا.", "n": 1, "i": 26}, {"t": "tf", "h": "", "q": "صح ولا غلط: أي قصيدة كويسة لازم يكون فيها قافية.", "ans": false, "why": "غلط. فيه شعر حر (<span class=\"en\">free verse)</span> من غير قافية خالص، زي قصيدة <span class=\"en\">The Red Wheelbarrow</span> من الدرس الأول، وده ممنعهاش تكون قصيدة عظيمة.", "n": 1, "i": 27, "ex": ["الجملة غلط. فيه شعر حر (<span class=\"en\">free verse</span>) من غير قافية خالص، زي قصيدة <span class=\"en\">The Red Wheelbarrow</span> من الدرس الأول، وده ممنعهاش تكون قصيدة عظيمة.", "صح، الجملة غلط. فيه شعر حر (<span class=\"en\">free verse</span>) من غير قافية خالص، زي قصيدة <span class=\"en\">The Red Wheelbarrow</span> من الدرس الأول، وده ممنعهاش تكون قصيدة عظيمة."]}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 28}];</script>
