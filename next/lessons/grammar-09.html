<script>window.LESSON_ID="grammar-09";window.STEPS=[{"t": "section", "h": "نصنع كلمات", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في الدرس التاسع. لو عندك كلمة <span class=\"en\">teach</span>، تقدر تعمل منها كلمات جديدة. <span class=\"en\">Teacher</span>، اللي بيعلّم. <span class=\"en\">Teachable</span>، ينفع يتعلّم. <span class=\"en\">Reteach</span>، يعلّم تاني. كل كلمة جديدة بنضيف لها قطعة. ده اسمه اشتقاق، <span class=\"en\">derivation</span>.</div>", "n": 1, "i": 1, "a": "grammar-09-001", "x": "fb0b2898"}, {"t": "learn", "h": "<div class=\"u\">وبعدها ممكن نضيف نهاية نحوية، زي <span class=\"en\">teachers</span> للجمع. ده تصريف، <span class=\"en\">inflection</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">derivation makes new words</span>, <span class=\"en\">and inflection changes the grammar of a word</span>.</div>", "n": 1, "i": 2, "a": "grammar-09-002", "x": "d070d09c"}, {"t": "section", "h": "الاشتقاق بيغير القسم", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\">أغلب اللواحق بتغير نوع الكلمة. <span class=\"en\">Er</span> من فعل لاسم: <span class=\"en\">teach</span> و<span class=\"en\">teacher</span>. <span class=\"en\">Ness</span> من صفة لاسم: <span class=\"en\">happy</span> و<span class=\"en\">happiness</span>. <span class=\"en\">Able</span> من فعل لصفة: <span class=\"en\">read</span> و<span class=\"en\">readable</span>. <span class=\"en\">Ize</span> من اسم لفعل: <span class=\"en\">symbol</span> و<span class=\"en\">symbolize</span>. <span class=\"en\">Ly</span> من صفة لظرف: <span class=\"en\">quick</span> و<span class=\"en\">quickly</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">most suffixes change the word class</span>.</div>", "n": 1, "i": 4, "a": "grammar-09-003", "x": "05659ed9"}, {"t": "mc", "q": "-<span class=\"en\">ness</span>: صفة ← اسم. ده:", "opts": ["<span class=\"en\">category-changing</span>", "<span class=\"en\">category-maintaining</span>", "<span class=\"en\">inflection</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the class changes</span>.", "ex": ["صح: اشتقاق مغيّر للقسم.", "غلط: القسم اتغير.", "غلط: -<span class=\"en\">ness</span> اشتقاقية."], "n": 1, "i": 5, "h": ""}, {"t": "learn", "h": "<div class=\"u\">أما السوابق فغالبًا بتغير المعنى من غير ما تغير القسم. <span class=\"en\">Unhappy</span> صفة من صفة. <span class=\"en\">Rewrite</span> فعل من فعل. وفي الإنجليزي كل السوابق اشتقاقية، لكن اللواحق ممكن تكون اشتقاقية أو تصريفية.</div>", "n": 1, "i": 6, "a": "grammar-09-004", "x": "d8d37566"}, {"t": "tf", "q": "كل السوابق في الإنجليزي اشتقاقية.", "ans": true, "why": "صح: مفيش سابقة تصريفية في الإنجليزي.", "ex": ["صح: السوابق اشتقاقية.", "غلط: السوابق كلها اشتقاقية."], "n": 1, "i": 7, "h": ""}, {"t": "tf", "q": "-<span class=\"en\">er</span> في <span class=\"en\">bigger</span> اشتقاقية.", "ans": false, "why": "غلط: دي تصريفية (مقارنة).", "ex": ["غلط: -<span class=\"en\">er</span> هنا تصريفية.", "صح، الجملة غلط: مقارنة نحوية."], "n": 1, "i": 8, "h": ""}, {"t": "section", "h": "الترتيب والإنتاجية", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">التصريف بييجي دايمًا في آخر الكلمة بعد الاشتقاق. زي <span class=\"en\">nation</span>، ثم <span class=\"en\">al</span>، ثم <span class=\"en\">iz</span>، ثم <span class=\"en\">ation</span>، ثم <span class=\"en\">s</span>. مفيش حد يقول <span class=\"en\">nation s al</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">derivation comes first and inflection comes last</span>.</div>", "n": 1, "i": 10, "a": "grammar-09-005", "x": "8889e385"}, {"t": "mc", "q": "إيه الترتيب الصح للأفكسات؟", "opts": ["<span class=\"en\">nation-al-iz-ation-s</span>", "<span class=\"en\">nation-s-al-iz-ation</span>", "<span class=\"en\">nation-ation-s-iz-al</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">inflection is last</span>.", "ex": ["صح: الاشتقاق الأول والتصريف -<span class=\"en\">s</span> في الآخر.", "غلط: التصريف ما بيتوسطش الاشتقاق.", "غلط: التصريف ما بيتوسطش الاشتقاق."], "n": 1, "i": 11, "h": ""}, {"t": "learn", "h": "<div class=\"u\">واللاحقة المنتجة، <span class=\"en\">productive</span>، بتتلزق بكلمات جديدة بسهولة، زي <span class=\"en\">ness</span>. أما غير المنتجة فنادرة، زي <span class=\"en\">th</span> في <span class=\"en\">warmth</span> و<span class=\"en\">depth</span>. إحنا مبنقولش <span class=\"en\">greenth</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a productive affix can make new words easily</span>.</div>", "n": 1, "i": 12, "a": "grammar-09-006", "x": "2e732ec1"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">الشكل: سابقة أو لاحقة. الوظيفة: بتغير القسم أو بتضيف معنى. المعنى: كل أفكس له معنى، زي <span class=\"en\">er</span> اللي بيعمل، و<span class=\"en\">less</span> من غير. والاستعمال: الأفكسات المنتجة بتخلق كلمات جديدة في الاستعمال الحديث.</div>", "n": 1, "i": 14, "a": "grammar-09-007", "x": "d8223065"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">الإنجليزي فيه طبقتين من الأفكسات. أصلية، <span class=\"en\">native</span>: <span class=\"en\">un</span> و<span class=\"en\">ness</span> و<span class=\"en\">ful</span> و<span class=\"en\">less</span>. ومستعارة، <span class=\"en\">Latinate</span>: <span class=\"en\">in</span> و<span class=\"en\">dis</span> و<span class=\"en\">tion</span> و<span class=\"en\">ity</span> و<span class=\"en\">able</span>. الاستعارة جت كتير بعد التأثير الفرنسي واللاتيني. <span class=\"en\">In simple English</span>: <span class=\"en\">English has older affixes and borrowed Latin and French ones</span>.</div>", "n": 1, "i": 16, "a": "grammar-09-008", "x": "b28ab59a"}, {"t": "learn", "h": "<div class=\"u\">وبتشوف الأثر. <span class=\"en\">Un</span> بتتلزق بكلمات أصلية، زي <span class=\"en\">unhappy</span>. و<span class=\"en\">in</span> بتتلزق بكلمات لاتينية، زي <span class=\"en\">impossible</span>. والكلمة اللاتينية بتبان أكتر رسمية.</div>", "n": 1, "i": 17, "a": "grammar-09-009", "x": "fb8907c0"}, {"t": "learn", "h": "<div class=\"u\">والمعنى مش دايمًا شفاف. <span class=\"en\">Er</span> مش دايمًا اللي بيعمل. <span class=\"en\">Teacher</span> آه، لكن <span class=\"en\">computer</span> جهاز مش شخص. ده اسمه <span class=\"en\">lexicalization</span>: الكلمة المشتقة بتاخد معنى خاص مش متوقع من أجزائها. <span class=\"en\">In simple English</span>: <span class=\"en\">a derived word can get a special meaning of its own</span>.</div>", "n": 1, "i": 18, "a": "grammar-09-010", "x": "f994a1b7"}, {"t": "mc", "q": "<span class=\"en\">computer</span> جهاز مش «شخص بيحسب». ده مثال على:", "opts": ["<span class=\"en\">inflection</span>", "<span class=\"en\">lexicalization</span>", "<span class=\"en\">zero derivation</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the word got a special meaning</span>.", "ex": ["غلط: مفيش نهاية نحوية.", "صح: المعنى اتحجّر.", "غلط: فيه أفكس -<span class=\"en\">er</span>."], "n": 1, "i": 19, "h": ""}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. <span class=\"en\">Derivation</span>: اشتقاق. <span class=\"en\">In simple English</span>: <span class=\"en\">making a new word with an affix</span>. <span class=\"en\">Inflection</span>: تصريف. <span class=\"en\">In simple English</span>: <span class=\"en\">changing the grammar form</span>. <span class=\"en\">Category-changing</span>: مغيّر للقسم. <span class=\"en\">Category-maintaining</span>: محافظ على القسم.</div>", "n": 1, "i": 21, "a": "grammar-09-011", "x": "9089a945"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Productive affix</span>: أفكس منتج. <span class=\"en\">In simple English</span>: <span class=\"en\">it makes new words easily</span>. <span class=\"en\">Unproductive affix</span>: أفكس غير منتج. <span class=\"en\">In simple English</span>: <span class=\"en\">it is found in only a few old words</span>. <span class=\"en\">Native affix</span>: أفكس أصلي. <span class=\"en\">Latinate affix</span>: أفكس لاتيني.</div>", "n": 1, "i": 22, "a": "grammar-09-012", "x": "2169029c"}, {"t": "mc", "q": "ليه ما نقولش <span class=\"en\">greenth</span>؟", "opts": ["لأن <span class=\"en\">green</span> مش صفة", "لأن -<span class=\"en\">th</span> لاحقة غير منتجة", "لأن الكلمة طويلة"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: -<span class=\"en\">th is stuck in old words</span>.", "ex": ["غلط: <span class=\"en\">green</span> صفة فعلًا.", "صح: -<span class=\"en\">th</span> محصورة في <span class=\"en\">warmth</span> و<span class=\"en\">depth</span>.", "غلط: الطول مالوش علاقة."], "n": 1, "i": 23, "h": ""}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Lexicalization</span>: تحجّر المعنى. <span class=\"en\">In simple English</span>: <span class=\"en\">a word gets a special fixed meaning</span>. <span class=\"en\">Nominalization</span>: تحويل لاسم. <span class=\"en\">Zero derivation</span>: اشتقاق صفري، يعني تغيير القسم من غير أفكس.</div>", "n": 1, "i": 24, "a": "grammar-09-013", "x": "f88da187"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: الاشتقاق بيعمل كلمة جديدة، والتصريف بيغير الصيغة النحوية. اتنين: اللواحق غالبًا بتغير القسم، والسوابق غالبًا لأ. تلاتة: الاشتقاق قبل التصريف دايمًا. أربعة: فيه أفكسات منتجة وغير منتجة، وأصلية ولاتينية. <span class=\"en\">In short</span>: <span class=\"en\">derivation comes first</span>, <span class=\"en\">inflection last</span>. الدرس الجاي: تكوين الكلمات بالتركيب والاختصار.</div>", "n": 1, "i": 26, "a": "grammar-09-014", "x": "d282dac3"}, {"t": "section", "h": "الكويز", "n": 1, "i": 27}, {"t": "recall", "q": "اذكر ٣ لواحق بتغير القسم مع مثال.", "a": "-<span class=\"en\">er</span> (<span class=\"en\">teacher</span>، فعل ← اسم)، -<span class=\"en\">ness</span> (<span class=\"en\">happiness</span>، صفة ← اسم)، -<span class=\"en\">able</span> (<span class=\"en\">readable</span>، فعل ← صفة). <span class=\"en\">In simple English</span>: <span class=\"en\">they change the word class</span>.", "n": 1, "i": 28, "h": ""}, {"t": "recall", "q": "اذكر ٢ أفكس أصلي و٢ لاتيني.", "a": "أصلي: <span class=\"en\">un-</span>, -<span class=\"en\">ness</span>. لاتيني: <span class=\"en\">in-</span>, -<span class=\"en\">tion</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">older English vs Latin and French</span>.", "n": 1, "i": 29, "h": ""}, {"t": "write", "q": "اشرح ليه الاشتقاق بييجي قبل التصريف في ترتيب الكلمة (٣-٤ جمل).", "key": "grammar-09:1", "a": "التصريف بيحدد الصيغة النحوية النهائية للكلمة، فبييجي في الآخر. الاشتقاق بيكوّن الكلمة نفسها الأول. مثال: <span class=\"en\">nation-al-iz-ation-s</span>: الجمع -<span class=\"en\">s</span> في الآخر. <span class=\"en\">In simple English</span>: <span class=\"en\">first make the word</span>, <span class=\"en\">then change its grammar form</span>.", "n": 1, "i": 30, "h": ""}, {"t": "write", "q": "اشرح <span class=\"en\">lexicalization</span> بمثال (٣-٤ جمل).", "key": "grammar-09:2", "a": "الكلمة المشتقة أحيانًا بتاخد معنى خاص مش متوقع من أجزائها. <span class=\"en\">computer</span> جهاز، مش شخص بيحسب مع إن -<span class=\"en\">er</span> معناها اللي بيعمل. <span class=\"en\">In simple English</span>: <span class=\"en\">the whole word means more than its parts</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "قارن بين الأفكسات الأصلية (<span class=\"en\">Germanic</span>) والأفكسات اللاتينية (<span class=\"en\">Latinate</span>) في الإنجليزي.", "key": "grammar-09:3", "a": "الأفكسات الأصلية، زي <span class=\"en\">un</span>- و -<span class=\"en\">ness</span> و -<span class=\"en\">ful</span>، جاية من الإنجليزي القديم وبتتلزق بكلمات أصلية، مثل <span class=\"en\">unhappy</span>. الأفكسات اللاتينية، زي <span class=\"en\">in</span>- و -<span class=\"en\">tion</span> و -<span class=\"en\">ity</span>، دخلت بعد التأثير الفرنسي واللاتيني، وبتتلزق غالبًا بكلمات لاتينية، مثل <span class=\"en\">impossible</span>. الأصلية أكتر شيوعًا في الكلام اليومي، واللاتينية أكتر رسمية وأكاديمية. فالطبقتين بتعكس تاريخ اللغة نفسه.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "قارن بين السوابق (<span class=\"en\">prefixes</span>) واللواحق (<span class=\"en\">suffixes</span>) في الاشتقاق.", "key": "grammar-09:4", "a": "السوابق في الإنجليزي كلها اشتقاقية، وغالبًا بتغير المعنى من غير ما تغير القسم، زي <span class=\"en\">unhappy</span>. اللواحق ممكن تكون اشتقاقية أو تصريفية، والاشتقاقية منها غالبًا بتغير القسم، زي <span class=\"en\">happiness</span>. فاللواحق أكتر قدرة على تغيير وظيفة الكلمة النحوية، والسوابق بتشتغل أكتر على المعنى.", "n": 1, "i": 33, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: تكوين الكلمات بالتركيب والاختصار.</div><div class=\"u\">هنشوف <span class=\"en\">compounding</span> و<span class=\"en\">blending</span> و<span class=\"en\">clipping</span>.</div>", "extra": "المصادر: Bauer (1983); Haspelmath and Sims (2010).", "i": 34}];</script>
