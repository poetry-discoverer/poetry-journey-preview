<script>window.LESSON_ID="poetry-05";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة بنبدأ وحدة جديدة: الصوت والموسيقى في الشعر. أول خطوة نتقن حاجتين: الـ <span class=\"en\">syllable</span> والـ <span class=\"en\">stress.</span> هما الأساس اللي هنبني عليه الوزن الشعري.</div>", "n": 1, "i": 0, "a": "poetry-05-001", "x": "dfd5404d"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: إزاي أقسّم أي كلمة لمقاطع؟", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">syllable</span> هو وحدة الصوت جوه الكلمة: <span class=\"en\">cat</span> مقطع واحد، <span class=\"en\">wa-ter</span> مقطعين، <span class=\"en\">beau-ti-ful</span> تلاتة.</div><div class=\"u\">١- طريقة التصفيق: صفق مع كل نَفَس وإنت بتقول الكلمة ببطء. <span class=\"en\">ba-na-na</span> = ٣ تصفيقات.</div><div class=\"u\">٢- طريقة الدقن: حط إيدك تحت دقنك. كل ما تنزل = مقطع. <span class=\"en\">ta-ble</span> = ٢.</div>", "n": 3, "i": 2, "a": "poetry-05-002", "x": "c2b21997"}, {"t": "learn", "h": "<div class=\"lead\">تمرن:</div><div class=\"li\"><span class=\"en\">apple</span>: <span class=\"en\">ap-ple</span> = ٢</div><div class=\"li\"><span class=\"en\">computer</span>: <span class=\"en\">com-pu-ter</span> = ٣</div><div class=\"li\"><span class=\"en\">education</span>: <span class=\"en\">e-du-ca-tion</span> = ٤</div><div class=\"li\"><span class=\"en\">university</span>: <span class=\"en\">u-ni-ver-si-ty</span> = ٥</div><div class=\"li\"><span class=\"en\">poetry</span>: <span class=\"en\">po-e-try</span> = ٣ (الشعر نفسه ٣ مقاطع!)</div>", "n": 5, "i": 3, "a": "poetry-05-003", "x": "3c91c676"}, {"t": "mc", "h": "", "q": "كلمة <span class=\"en\">university</span> فيها كام <span class=\"en\">syllable</span>؟", "nq": 1, "opts": ["٣", "٤", "٥"], "ans": 2, "why": "٥", "ex": ["غلط: العدد أكتر من كده.", "غلط: لسه فيه مقطع زيادة.", "صح: <span class=\"en\">u-ni-ver-si-ty</span> = ٥ مقاطع."], "i": 4}, {"t": "mc", "h": "", "q": "أنهي طريقة بنستخدمها عشان نعد المقاطع الصوتية؟", "nq": 1, "opts": ["نصفق مع كل نَفَس وإحنا بنقول الكلمة ببطء", "نعد الحروف", "نعد الكلمات في الجملة"], "ans": 0, "why": "نصفق مع كل نَفَس وإحنا بنقول الكلمة ببطء", "ex": ["صح: التصفيق أو حركة الدقن بيعدوا المقاطع.", "غلط: عدد الحروف مش بيساوي عدد المقاطع.", "غلط: ده بيعد الكلمات مش المقاطع."], "i": 5}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: إيه هو النَّبْر (<span class=\"en\">stress</span>)؟", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">في أي كلمة فيها أكتر من مقطع، فيه مقطع واحد بنقوله أقوى من الباقي: أعلى وأطول شوية. ده النبر. ركّز على الحروف الكبيرة:</div><div class=\"li\"><span class=\"en\">TA-ble</span></div><div class=\"li\"><span class=\"en\">WA-ter</span></div><div class=\"li\"><span class=\"en\">com-PU-ter</span></div><div class=\"li\"><span class=\"en\">ba-NA-na</span></div><div class=\"li\"><span class=\"en\">BEAU-ti-ful</span></div><div class=\"u\">لو حطيت النبر غلط الكلمة بتبقى غريبة. جرب <span class=\"en\">ta-BLE</span> بدل <span class=\"en\">TA-ble.</span></div>", "n": 7, "i": 7, "a": "poetry-05-004", "x": "6e6f25ce"}, {"t": "learn", "h": "<div class=\"lead\">والنبر بيتحرك في عيلة الكلمة:</div><div class=\"li\"><span class=\"en\">PHO-to-graph</span></div><div class=\"li\"><span class=\"en\">pho-TO-gra-phy</span></div><div class=\"li\"><span class=\"en\">pho-to-GRA-phic</span></div>", "n": 3, "i": 8, "a": "poetry-05-005", "x": "e361fa6c"}, {"t": "mc", "h": "", "q": "النبر (<span class=\"en\">stress</span>) في كلمة <span class=\"en\">table</span> هو على...", "nq": 1, "opts": ["المقطع الأول: <span class=\"en\">TA-ble</span>", "المقطع التاني: <span class=\"en\">ta-BLE</span>", "الاتنين بنفس القوة"], "ans": 0, "why": "المقطع الأول: <span class=\"en\">TA-ble</span>", "ex": ["صح: <span class=\"en\">TA-ble</span>، النبر على المقطع الأول.", "غلط: <span class=\"en\">ta-BLE</span> بتخلي الكلمة غريبة.", "غلط: النبر دايماً على مقطع واحد أقوى."], "i": 9}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: النبر بيغيّر المعنى!", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">RE-cord</span> (النبر الأول) = تسجيل (اسم)</div><div class=\"li\"><span class=\"en\">re-CORD</span> (النبر التاني) = يسجّل (فعل)</div><div class=\"li\"><span class=\"en\">PRE-sent</span> = هدية / حاضر (اسم)</div><div class=\"li\"><span class=\"en\">pre-SENT</span> = يقدّم (فعل)</div><div class=\"u\">الأسماء غالباً نبرها في الأول، والأفعال في الآخر. مش قانون 100%، بس بيساعد كتير.</div>", "n": 5, "i": 11, "a": "poetry-05-006", "x": "e009ee93"}, {"t": "mc", "h": "", "q": "<span class=\"en\">RE-cord</span> (النبر على الأول) معناها...", "nq": 1, "opts": ["يسجّل (فعل)", "تسجيل (اسم)", "هدية"], "ans": 1, "why": "تسجيل (اسم)", "ex": ["غلط: ده <span class=\"en\">re-CORD</span> بالنبر التاني.", "صح: <span class=\"en\">RE-cord</span> اسم يعني تسجيل، و<span class=\"en\">re-CORD</span> فعل يعني يسجّل.", "غلط: الهدية هي <span class=\"en\">PRE-sent</span>."], "i": 12}, {"t": "mc", "h": "", "q": "إيه القاعدة العامة (مش ١٠٠٪) لنبر الأسماء والأفعال؟", "nq": 1, "opts": ["الأسماء غالباً بنبرها في الأول، والأفعال في الآخر", "الأسماء في الآخر والأفعال في الأول", "مفيش أي قاعدة"], "ans": 0, "why": "الأسماء غالباً بنبرها في الأول، والأفعال في الآخر", "ex": ["صح: زي <span class=\"en\">PRE-sent</span> (اسم) و <span class=\"en\">pre-SENT</span> (فعل).", "غلط: ده العكس.", "غلط: فيه قاعدة تساعد، رغم إنها مش ١٠٠٪."], "i": 13}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: النبر في الجملة وفي الشعر", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الكلمات المهمة (أسماء وأفعال وصفات) بتنبر، والصغيرة (<span class=\"en\">a,</span> <span class=\"en\">the,</span> <span class=\"en\">of,</span> <span class=\"en\">and,</span> <span class=\"en\">to</span>) بتضعف وتجري. سطر <span class=\"en\">Sonnet 18</span>:</div><div class=\"u\">\"<span class=\"en\">Shall I compare thee to a summer's day?</span>\"</div><div class=\"u\"><span class=\"en\">shall I com-PARE thee TO a SUM-mer's DAY</span></div><div class=\"u\">فاكر الدقات القوية في سطر النمر؟ هي هي المقاطع المنبورة. يعني كنت بتتمرن على أساس الوزن الشعري من غير ما تاخد بالك.</div>", "n": 4, "i": 15, "a": "poetry-05-007", "x": "496d9406"}, {"t": "mc", "h": "", "q": "في الجملة، أنهي كلمات بتضعف وتجري؟", "nq": 1, "opts": ["الأسماء والأفعال والصفات", "الكلمات الصغيرة زي <span class=\"en\">a</span> و <span class=\"en\">the</span> و <span class=\"en\">of</span>", "كل الكلمات بنفس القوة"], "ans": 1, "why": "الكلمات الصغيرة زي <span class=\"en\">a</span> و <span class=\"en\">the</span> و <span class=\"en\">of</span>", "ex": ["غلط: دول الكلمات المهمة، وبتتنبر.", "صح: الكلمات الصغيرة (<span class=\"en\">a, the, of, and, to</span>) بتضعف.", "غلط: الجملة فيها قوي وضعيف."], "i": 16}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">١- الـ <span class=\"en\">syllable</span>: مقطع صوتي، نقسمه بالتصفيق أو الدقن.</div><div class=\"u\">٢- الـ <span class=\"en\">stress</span>: مقطع واحد أقوى في كل كلمة.</div><div class=\"u\">٣- النبر بيتحرك (<span class=\"en\">PHOtograph</span> / <span class=\"en\">phoTOgraphy</span>) وممكن يغيّر المعنى (<span class=\"en\">REcord</span> / <span class=\"en\">reCORD</span>).</div><div class=\"u\">٤- في الجملة، المهم بينبر والصغير بيضعف.</div>", "n": 4, "i": 18, "a": "poetry-05-008", "x": "11c9bd84"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️</span></span> تمرين:</div><div class=\"u\">١- قسّم الكلمات دي لمقاطع وحدد النبر: <span class=\"en\">teacher,</span> <span class=\"en\">banana,</span> <span class=\"en\">important,</span> <span class=\"en\">examination.</span></div><div class=\"u\">٢- عد المقاطع في \"<span class=\"en\">Tyger Tyger,</span> <span class=\"en\">burning bright</span>\" (عد بنفسك!)</div><div class=\"u\">٣- سجّل صوتك بالكلمات في ١ واسمع النبر وقع صح ولا
