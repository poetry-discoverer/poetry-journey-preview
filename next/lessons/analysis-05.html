<script>window.LESSON_ID="analysis-05";window.STEPS=[{"t":"learn","h":"<div class=\"u\">الدرس اللي فات: The Hollow Men — عالم ميت، ونهاية بنحيب مش بفرقعة. الدرس ده من نفس البلوك الحديث، لكن بالعكس تمامًا: مش عن الضعف، عن العنف اللي بيصنع تاريخ.</div><div class=\"u\">القصيدة: Leda and the Swan لييتس. أسطورة إغريقية في سونيتة قصيرة، وفيها سؤال واحد كبير مش بيتجاوب.</div>","n":2,"i":0,"a":"analysis-05-001","x":"538bdf65"},{"t":"section","h":"ييتس والسياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">وليام بتلر ييتس <span class=\"en\">(W. B. Yeats)</span>، 1865-1939، إيرلندي، من أهم شعراء الحداثة <span class=\"en\">(Modernism)</span>. خد نوبل في الأدب سنة 1923، والقصيدة دي اتكتبت 1923 واتنشرت 1924 (أول مرة في The Dial في يونيو 1924).</div>","n":1,"i":2,"a":"analysis-05-002","x":"639fd410"},{"t":"learn","h":"<div class=\"u\">ييتس بدأ شاعر رمزي <span class=\"en\">(symbolist)</span> بروح رومانسية، وبعدين لغته بقت أكثف وأقسى. عنده هوس بالأسطورة <span class=\"en\">(myth)</span>: بياخد حكاية قديمة ويستخدمها عشان يقول حاجة عن الحاضر.</div>","n":1,"i":3,"a":"analysis-05-003","x":"e89a6551"},{"t":"learn","h":"<div class=\"u\">الحكاية: زيوس <span class=\"en\">(Zeus)</span> تحوّل لبجعة <span class=\"en\">(swan)</span> واغتصب ليدا <span class=\"en\">(Leda)</span>، مرات ملك إسبرطة. من البيضة خرج أربع: هيلين <span class=\"en\">(Helen)</span> اللي هتسبب حرب طروادة، وكليتمنسترا <span class=\"en\">(Clytemnestra)</span> اللي هتقتل جوزها، وكاستور وبولوكس <span class=\"en\">(Castor and Pollux)</span>.</div>","n":1,"i":4,"a":"analysis-05-004","x":"fc765f30"},{"t":"learn","h":"<div class=\"u\">القصيدة مش بتحكي الحكاية كلها، بتاخد لحظة واحدة بس: لحظة الاغتصاب. وكل حاجة بعدها — طروادة، القتل، التاريخ — بتطلع من اللحظة دي.</div>","n":1,"i":5,"a":"analysis-05-005","x":"20ebdf21"},{"t":"learn","h":"<div class=\"u\">الشكل: سونيتة <span class=\"en\">(sonnet)</span>. تمانية سطور <span class=\"en\">(octave)</span> للمشهد الجسدي، وستة <span class=\"en\">(sestet)</span> للنتيجة التاريخية. يعني القصيدة نفسها بتتحرك من الجسد للتاريخ.</div>","n":1,"i":6,"a":"analysis-05-006","x":"878cc211"},{"t":"section","h":"المشهد: السطور <span dir=\"ltr\">1-8</span>","n":1,"i":7},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">A sudden blow: the great wings beating still / Above the staggering girl, her thighs caressed / By the dark webs, her nape caught in his bill, / He holds her helpless breast upon his breast.</span></div>","n":2,"i":8,"a":"analysis-05-007","x":"1032ac6f"},{"t":"learn","h":"<div class=\"u\">«ضربة مفاجئة» <span class=\"en\">(A sudden blow)</span>. القصيدة بتبدأ في وسط الحركة، من غير مقدمة ولا أسماء. زي كاميرا مفتوحة على الحدث وهو بيحصل، والقارئ بيدخل متأخر.</div>","n":1,"i":9,"a":"analysis-05-008","x":"a904e389"},{"t":"learn","h":"<div class=\"u\">«الأجنحة الكبيرة بتضرب» وكلمة <span class=\"en\">still</span> هنا ليها معنيين: لسه بتضرب، أو ساكنة تمامًا. الاتنين صح، والغموض <span class=\"en\">(ambiguity)</span> مقصود: حركة في الهوا وسكون مخيف في نفس اللحظة.</div>","n":1,"i":10,"a":"analysis-05-009","x":"52a1b1a8"},{"t":"tf","h":"","q":"كلمة still في السطر الأول ليها أكتر من معنى.","ans":true,"why":"صح: بتقرأ «لسه بتضرب» أو «ساكنة»، والاتنين بيدّوا إحساس مختلف تمامًا.","n":1,"i":11,"ex":["صح، الجملة صح: الغموض مقصود، والقراءتين شغالين.","غلط. الكلمة مفتوحة على معنيين بشكل واضح."]},{"t":"learn","h":"<div class=\"u\">«الشبكات الغامقة» <span class=\"en\">(dark webs)</span> = رجل البجعة المكففة. و«الرقبة» و«الصدر العاجز على صدره»: تفاصيل جسدية دقيقة، كلها بتحدد مين ماسك ومين متمسَّك.</div>","n":1,"i":12,"a":"analysis-05-010","x":"7b53b380"},{"t":"learn","h":"<div class=\"u\">وكلمة <span class=\"en\">breast</span> جاية مرتين في سطر واحد: صدرها على صدره. اللفظ نفسه بيلزق الجسمين، مش الصورة بس.</div>","n":1,"i":13,"a":"analysis-05-011","x":"cf1a0cff"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">5-8</span>:</div><div class=\"u\"><span class=\"en\">How can those terrified vague fingers push / The feathered glory from her loosening thighs? / And how can body, laid in that white rush, / But feel the strange heart beating where it lies?</span></div>","n":2,"i":14,"a":"analysis-05-012","x":"72966975"},{"t":"learn","h":"<div class=\"u\">سؤالين بلاغيين <span class=\"en\">(rhetorical questions)</span>: إزاي الصوابع المرعوبة الضبابية تدفع «المجد المكسو بالريش» عن فخديها؟ السؤال مش بيدور على إجابة، هو طريقة لتثبيت العجز.</div>","n":1,"i":15,"a":"analysis-05-013","x":"49c7867c"},{"t":"learn","h":"<div class=\"u\">«المجد المكسو بالريش» <span class=\"en\">(the feathered glory)</span>: تلطيف <span class=\"en\">(euphemism)</span> بيتكلم بلسان الإله، مش بلسان الضحية. اللغة هنا بتجمّل العنف، وده جزء من معنى القصيدة.</div>","n":1,"i":16,"a":"analysis-05-014","x":"a4c957e1"},{"t":"mc","h":"","q":"«the feathered glory» في السطر 6 بيعمل إيه في القصيدة؟","opts":["تلطيف بيتكلم بلسان الإله مش بلسان الضحية","وصف علمي لريش البجعة","سخرية من الأسطورة"],"ans":0,"why":"تلطيف بيخفي العنف وبيتكلم بلسان القوة.","n":1,"i":17,"ex":["صح: ده تلطيف (euphemism) بيحوّل الاغتصاب لمجد، واللغة بتماشي القوة مش الضحية.","غلط: الوصف هنا أخلاقي وليس علمي؛ الريش رمز للقوة الإلهية.","غلط: مفيش سخرية، النبرة جدية تمامًا."]},{"t":"learn","h":"<div class=\"u\">«الاندفاع الأبيض» <span class=\"en\">(white rush)</span> = الريش والسرعة في تعبير واحد. و«القلب الغريب بيدق في مكانه»: جوه جسمها قلب إله. أقرب لحظة في القصيدة، وأخطرها.</div>","n":1,"i":18,"a":"analysis-05-015","x":"90ad0c92"},{"t":"section","h":"من الجسد للتاريخ: السطور <span dir=\"ltr\">9-14</span>","n":1,"i":19},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">9-11</span>:</div><div class=\"u\"><span class=\"en\">A shudder in the loins engenders there / The broken wall, the burning roof and tower / And Agamemnon dead.</span></div>","n":2,"i":20,"a":"analysis-05-016","x":"b1d7fbef"},{"t":"mc","h":"","q":"الانتقال من الجسد للتاريخ بيحصل في أي سطر؟","opts":["السطر 9: A shudder in the loins engenders there","السطر 1: A sudden blow","السطر الأخير"],"ans":0,"why":"السطر 9، اللي بيربط الرجفة بالتاريخ.","n":1,"i":21,"ex":["صح: من السطر 9 الفعل الجسدي بيبقى سبب مباشر في تدمير طروادة وقتل أجاممنون.","غلط: السطر الأول مشهد جسدي خالص، التاريخ لسه مجاش.","غلط: السطر الأخير سؤال، مش بداية الانتقال."]},{"t":"learn","h":"<div class=\"u\">«رجفة في الحقوين بتخلّق هناك» <span class=\"en\">(engenders there)</span>: فعل جسدي واحد، وفي نفس السطر بيتحول لسبب في التاريخ. السبب والنتيجة في جملة واحدة، من غير أي فاصل.</div>","n":1,"i":22,"a":"analysis-05-017","x":"2b2764fc"},{"t":"learn","h":"<div class=\"u\">«الحيط المكسور، والسطح والبرج المحروق»: طروادة بعد عشر سنين حرب، في سطر واحد. الصورة مش بتحكي الحرب، بتعرض نتيجتها: ركام.</div>","n":1,"i":23,"a":"analysis-05-018","x":"9e6440e0"},{"t":"learn","h":"<div class=\"u\">«وأجاممنون ميت» <span class=\"en\">(Agamemnon dead)</span>: لما رجع من طروادة، مراته كليتمنسترا قتلته. يعني البنت اللي اتولدت من ليدا هي اللي هتقفل الدايرة بالدم.</div>","n":1,"i":24,"a":"analysis-05-019","x":"e01e31e4"},{"t":"mc","h":"","q":"«And Agamemnon dead» بيرجع لمين؟","opts":["كليتمنسترا، بنت ليدا، اللي قتلت جوزها أجاممنون","زيوس بعد ما خلص","هيلين بعد حرب طروادة"],"ans":0,"why":"كليتمنسترا قتلت أجاممنون بعد عودته من طروادة.","n":1,"i":25,"ex":["صح: كليتمنسترا بنت ليدا قتلت أجاممنون لما رجع من طروادة، فالدايرة بتتقفل بالدم.","غلط: زيوس مظهرش في القصيدة كضحية ولا كقاتل.","غلط: هيلين سبب الحرب، لكن قتل أجاممنون حصل في إسبرطة بعد الرجوع."]},{"t":"learn","h":"<div class=\"u\">خد بالك من السرعة: من شهوة لإمبراطورية مهدومة في تلات سطور. دي قوة التكثيف <span class=\"en\">(compression)</span> عند ييتس.</div>","n":1,"i":26,"a":"analysis-05-020","x":"f5dcee42"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">12-14</span>:</div><div class=\"u\"><span class=\"en\">Being so caught up, / So mastered by the brute blood of the air, / Did she put on his knowledge with his power / Before the indifferent beak could let her drop?</span></div>","n":2,"i":27,"a":"analysis-05-021","x":"c010187f"},{"t":"learn","h":"<div class=\"u\">«لإنها اتقبض عليها كده، ومُتسلَّط عليها بدم الهوا الوحشي» <span class=\"en\">(caught up, mastered, brute blood of the air)</span>. ليدا مش فاعلة في ولا لحظة: مفعول به من أول كلمة لآخر كلمة.</div>","n":1,"i":28,"a":"analysis-05-022","x":"03fbc099"},{"t":"learn","h":"<div class=\"u\">والسؤال المركزي: «هل لبست علمه مع قوته؟» <span class=\"en\">(Did she put on his knowledge with his power)</span>. يعني هل الضحية خدت من الجاني حاجة غير الأذى؟ هل المعرفة بتيجي مع القوة، ولا القوة لوحدها؟</div>","n":1,"i":29,"a":"analysis-05-023","x":"03fffdd1"},{"t":"learn","h":"<div class=\"u\">«المنقار غير المبالي» <span class=\"en\">(the indifferent beak)</span>: الإله مش مهتم. القوة اللي بتحصل هنا مش شايفة اللي بيحصل، واللامبالاة <span class=\"en\">(indifference)</span> هي آخر إحساس في القصيدة.</div>","n":1,"i":30,"a":"analysis-05-024","x":"164d4a19"},{"t":"learn","h":"<div class=\"u\">وآخر كلمة: <span class=\"en\">drop</span> — يسيبها تقع. مش بيحطها، ومش بيحميها، بيسيبها. النهاية مش موت، هي إفلات.</div>","n":1,"i":31,"a":"analysis-05-025","x":"6e9b66c7"},{"t":"section","h":"السؤال اللي مش بيتجاوب","n":1,"i":32},{"t":"learn","h":"<div class=\"u\">القصيدة بتخلص بسؤال، ومفيش إجابة. وده مقصود: لو ييتس جاوب، هيبقى بيحكم على الحكاية من فوق. السؤال بيخلّي القارئ شريك في الحيرة بدل ما يستلم حكم جاهز.</div>","n":1,"i":33,"a":"analysis-05-026","x":"612ada47"},{"t":"learn","h":"<div class=\"u\">ييتس في كتابه <span class=\"en\">A Vision</span> (1925) بيشوف التاريخ دورات <span class=\"en\">(gyres)</span>: كل حضارة بتبدأ بلحظة إلهية، وبعد ألفين سنة بتبوظ، وواحدة تانية تبدأ مكانها.</div>","n":1,"i":34,"a":"analysis-05-027","x":"bd0a00a4"},{"t":"learn","h":"<div class=\"u\">وفي نفس الكتاب بيربط بين حاديتين: بجعة على ليدا بدأت الحضارة الإغريقية، وحمامة على مريم <span class=\"en\">(the Annunciation)</span> بدأت الحضارة المسيحية. القصيدة دي هي النسخة الوحشية من البشارة.</div>","n":1,"i":35,"a":"analysis-05-028","x":"cb0f98fe"},{"t":"learn","h":"<div class=\"u\">ونفس الفكرة في قصيدته التانية The Second Coming: عشرين قرن نوم حجري، وبعدين حاجة جديدة بتتولد — وبتتولد بعنف. ييتس مش بيطمّن حد.</div>","n":1,"i":36,"a":"analysis-05-029","x":"642897cd"},{"t":"section","h":"الأدوات الفنية","n":1,"i":37},{"t":"learn","h":"<div class=\"u\">أفعال القوة: <span class=\"en\">blow, beating, caught, holds, mastered</span>. القصيدة بتتكلم بأفعال مش بصفات، عشان كده الإحساس بالعنف مستمر من أول سطر لآخره.</div>","n":1,"i":38,"a":"analysis-05-030","x":"dd3a33e8"},{"t":"learn","h":"<div class=\"u\">السونيتة والقافية: التمانية سطور بقافية متبادلة <span class=\"en\">(abab cdcd)</span>، والستة الأخيرة بقافية مترابطة، والانتقال <span class=\"en\">(volta)</span> جاي في أول الستة عند السطر 9، مش في نص القصيدة.</div>","n":1,"i":39,"a":"analysis-05-031","x":"6f715cee"},{"t":"tf","h":"","q":"القصيدة بتحكي حرب طروادة بالتفصيل.","ans":false,"why":"غلط: مفيش تفاصيل حرب خالص. تلات سطور بتلخص النتيجة: حيط مكسور، سطح وبرج محروق، وأجاممنون ميت.","n":1,"i":40,"ex":["غلط. مفيش ولا مشهد من الحرب؛ كله تكثيف في صور قليلة.","صح، الجملة غلط: القصيدة بتكثف التاريخ في صور مش بتحكيه."]},{"t":"learn","h":"<div class=\"u\">والسطر المكسور <span class=\"en\">(broken line)</span>: «And Agamemnon dead. / Being so caught up» — الجملة بتتكسر في نص السطر، والكسر بيعمل وقفة درامية عند أكبر حدث في القصيدة.</div>","n":1,"i":41,"a":"analysis-05-032","x":"efb15501"},{"t":"learn","h":"<div class=\"u\">الغموض <span class=\"en\">(ambiguity)</span> في تلات كلمات: <span class=\"en\">still</span> (ساكنة/لسه)، <span class=\"en\">glory</span> (مجد/جمال)، <span class=\"en\">indifferent</span> (غير مبالي/محايد). كل واحدة بتفتح معنى زيادة.</div>","n":1,"i":42,"a":"analysis-05-033","x":"e3a48246"},{"t":"section","h":"الموضوعات","n":1,"i":43},{"t":"learn","h":"<div class=\"u\">العنف والجمال: القصيدة بتحط الجمال في نفس مكان الأذى، ومش بتفصلهم. حتى وصف الإله بيطلع جميل، وده اللي بيخلي المشهد أصعب مش أسهل.</div>","n":1,"i":44,"a":"analysis-05-034","x":"8dad52f0"},{"t":"learn","h":"<div class=\"u\">المعرفة والقوة: سؤال القصيدة الأساسي. هل اللي عنده القوة عنده معرفة؟ وهل الضحية بتتعلم حاجة من الأذى، ولا بتفضل مفعول به للأبد؟</div>","n":1,"i":45,"a":"analysis-05-035","x":"66312741"},{"t":"learn","h":"<div class=\"u\">التاريخ بيتولد من جسد: ييتس بيقول إن التحولات الكبيرة مش بتيجي من قرارات ولا مؤتمرات، بتيجي من لحظات مادية وحشية. ومش بيوعد إن التاريخ عادل أو أخلاقي.</div>","n":1,"i":46,"a":"analysis-05-036","x":"6b680970"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":47},{"t":"mc","h":"","q":"السؤال الأخير بيسأل عن إيه بالظبط؟","opts":["هل خدت معرفته مع قوته","هل هتموت من الضربة","هل بتحب الإله"],"ans":0,"why":"هل نالت معرفته مع قوته.","n":1,"i":48,"ex":["صح: السؤال عن المعرفة والقوة مع بعض (knowledge with power) — هل الضحية كسبت وعي من الأذى.","غلط: الموت مش موضوع السؤال، النهاية إفلات مش موت.","غلط: الحب مش مطروح خالص؛ العلاقة قوة وسيطرة."]},{"t":"recall","h":"","q":"اشرح إزاي القصيدة بتحوّل لحظة واحدة لتاريخ كامل.","a":"القصيدة بتبدأ بلحظة اغتصاب واحدة (ضربة مفاجئة، جناحين، رقبة ممسوكة)، وبعدين في السطر 9 نفس الفعل الجسدي بيبقى سبب مباشر: «A shudder in the loins engenders there / The broken wall, the burning roof and tower / And Agamemnon dead». يعني ييتس بيلغي المسافة بين الجسد والتاريخ: شهوة واحدة بتخلّق حرب طروادة وقتل أجاممنون. والتكثيف ده هو الفكرة نفسها: التحولات الكبيرة بتبدأ من لحظة مادية، مش من قرار.","n":1,"i":49},{"t":"recall","h":"","q":"ليه ييتس بيستخدم أسطورة قديمة بدل حكاية معاصرة؟","a":"لأن الأسطورة بتدّي اللحظة بعد أكبر من حكاية شخصية: ليدا مش ست واحدة، هي بداية حضارة. وييتس في A Vision شايف التاريخ دورات، والحرب العالمية الأولى كانت بنسبة له نهاية دورة وبداية واحدة جديدة بعنف. فالأسطورة بتخلي السؤال عن المعرفة والقوة سؤال عن التاريخ نفسه، مش عن حادثة فردية.","n":1,"i":50},{"t":"write","h":"","q":"ناقش سؤال المعرفة والقوة في القصيدة، وهل اتجاوب ولا لأ.","key":"analysis-05:1","a":"السؤال في آخر سطرين: «Did she put on his knowledge with his power / Before the indifferent beak could let her drop?» ييتس بيسأل هل ليدا، وهي مفعول به تمامًا (caught up, mastered)، خدت من الإله معرفته مع قوته — يعني هل الوعي ممكن يتولد من الأذى. القصيدة مش بتجاوب، والسبب إن الإجابة هتغير معنى الحكاية كلها: لو خدت المعرفة، يبقى الضحية شريكة في صناعة التاريخ (وهي أم هيلين وكليتمنسترا)؛ ولو مخدتش، يبقى التاريخ بيتم على الناس مش بيهم. «indifferent beak» بيقفل الباب على أي عزاء: القوة نفسها مش مهتمة، فالمعرفة مش مضمونة معاها. والسؤال المعلّق بيخلّي القارئ يحمل الحيرة بدل ما يستلم حكم.","n":1,"i":51},{"t":"write","h":"","q":"حلّل العلاقة بين شكل السونيتة ومعنى القصيدة.","key":"analysis-05:2","a":"السونيتة تمانية سطور + ستة، والقصيدة بتستخدم التقسيم ده بدقة: التمانية (<span dir=\"ltr\">1-8</span>) مشهد جسدي في الزمن الحاضر، والستة (<span dir=\"ltr\">9-14</span>) نتيجة تاريخية. الانتقال (volta) جاي في السطر 9 عند «A shudder in the loins engenders there» — يعني في اللحظة اللي الجسد بيبقى تاريخ. القافية المتبادلة في التمانية (abab cdcd) بتدّي إحساس بالنظام والجمال، وده بيسخّر الشكل الغنائي لصالح مشهد وحشي: قصيدة حب تقليدية بتتحول لمشهد اغتصاب ونبوءة. والسطر المكسور عند «And Agamemnon dead» بيعمل وقفة درامية في مكان أكبر حدث، وبعدين السستيت بتنتهي بسؤال مفتوح بدل قرار — فالشكل اللي المفروض يقفل (خاتمة السونيتة) بيتساب مفتوح.","n":1,"i":52},{"t":"end","h":"","teaser":"<div class=\"u\">كده Leda and the Swan خلصت: ضربة واحدة، بجعة، وجسد بيصنع تاريخ، وسؤال عن المعرفة والقوة مش بيتجاوب.</div><div class=\"u\">الدرس الجاي: Sailing to Byzantium — ييتس بردو، لكن هذه المرة عن الشيخوخة والفن والخلود.</div>","extra":"المصادر: Yeats, “Leda and the Swan” (1923; The Tower, 1928)؛ الأسطورة الإغريقية (زيوس وليدا، هيلين، كليتمنسترا)؛ Aeschylus, Agamemnon؛ Yeats, A Vision (1925) لفكرة الدورات والبشارتين.","i":53}];</script>
