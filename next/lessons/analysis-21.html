<h1>تحليل ٢١: Telling the Bees لويتير — نحل في حداد وسر في آخر القصيدة</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">تحليل ٢١ من ٢٢</span><span class="tag"><span class="em">🖋️</span> تحليل القصائد المهمة</span></div>

<script>window.LESSON_ID="analysis-21";window.STEPS=[{"t":"learn","h":"<div class=\"u\">من لويزيانا وشجرة وحيدة، لنيو إنجلاند وبيت فيه نحل. القصيدة دي بتحكي عادة قديمة، وفيها سر بيتكشف في آخر سطرين.</div><div class=\"u\">القصيدة: Telling the Bees لجون جرينليف ويتير — 14 رباعية، والمشهد بيتعاد فيه الذهاب لنفس المكان.</div>","n":2,"i":0,"a":"analysis-21-001","x":"9e6f2749"},{"t":"mc","h":"","q":"عادة «telling the bees» إيه؟","opts":["إبلاغ النحل بموت حد في البيت وتغطية الخلايا بالسواد","جمع العسل في الصيف","تعليم الأطفال النحل"],"ans":0,"why":"إبلاغ النحل بالموت وتغطية الخلايا بالسواد.","n":1,"i":1,"ex":["صح: البنت بتلف قدام الخلايا وتغطي كل واحدة بخرقة سودا وهي بتغني الخبر.","غلط: مفيش جمع عسل في القصيدة.","غلط: العادة مرتبطة بالموت مش بالتعليم."]},{"t":"section","h":"ويتير والعادة","n":1,"i":2},{"t":"learn","h":"<div class=\"u\">جون جرينليف ويتير <span class=\"en\">(John Greenleaf Whittier)</span>، 1807-1892، شاعر أمريكي من نيو إنجلاند، وكان من أنشط دعاة إلغاء العبودية في عصره.</div>","n":1,"i":3,"a":"analysis-21-002","x":"63262919"},{"t":"learn","h":"<div class=\"u\">القصيدة اتنشرت 1858، وفيها عادة ريفية قديمة: لما حد يموت في البيت، لازم يقولوا للنحل ويغطوا الخلايا بخرقة سودا، وإلا النحل بيسيب الخلية ويمشي.</div>","n":1,"i":4,"a":"analysis-21-003","x":"d3da3184"},{"t":"learn","h":"<div class=\"u\">ويتير نفسه كتب ملاحظة عن العادة دي، ووصفها بأنها «عادة غريبة جت من البلد القديم» وكانت منتشرة في ريف نيو إنجلاند، والاعتقاد إن الإبلاغ ضروري عشان النحل ما يهربش.</div>","n":1,"i":5,"a":"analysis-21-004","x":"22c224b1"},{"t":"learn","h":"<div class=\"u\">المشهد في القصيدة هو بيت طفولة ويتير نفسه — الطريق، وفتحة الحيطة القديمة، وحجر العبور في الجدول. لكن حكاية ماري وحبيبها خيالية حسب ملاحظات المحررين.</div>","n":1,"i":6,"a":"analysis-21-005","x":"4cc39bc0"},{"t":"learn","h":"<div class=\"u\">الشكل: رباعيات بقافية <span class=\"en\">abab</span>، وسطور بأطوال مختلفة (أربع تفاعيل وثلاث). الإيقاع قريب من الحكاية الشعبية.</div>","n":1,"i":7,"a":"analysis-21-006","x":"61b406b7"},{"t":"section","h":"المكان: الرباعيات <span dir=\"ltr\">1-3</span>","n":1,"i":8},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">Here is the place; right over the hill / Runs the path I took; / You can see the gap in the old wall still, / And the stepping-stones in the shallow brook.</span></div>","n":2,"i":9,"a":"analysis-21-007","x":"cf254235"},{"t":"learn","h":"<div class=\"u\">«هنا المكان؛ على طول التلة طريق كنت مشيته»: البداية بتثبت المكان قبل أي حكاية. والتفاصيل (فتحة الحيطة، حجر العبور) بتخلي المكان حقيقي وملموس.</div>","n":1,"i":10,"a":"analysis-21-008","x":"afaf21b0"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">9-12</span>:</div><div class=\"u\"><span class=\"en\">There are the beehives ranged in the sun; / And down by the brink / Of the brook are her poor flowers, weed-o’errun, / Pansy and daffodil, rose and pink.</span></div>","n":2,"i":11,"a":"analysis-21-009","x":"9201d0ae"},{"t":"learn","h":"<div class=\"u\">خلايا النحل مصفوفة في الشمس، وورودها «poor» ومغطاة بالحشيش. أول إشارة إن فيه حاجة مهملة — والورود دي بتاعة «her»، يعني فيه ست غايبة.</div>","n":1,"i":12,"a":"analysis-21-010","x":"d3818885"},{"t":"section","h":"الزمن والتغيير: الرباعيات <span dir=\"ltr\">4-9</span>","n":1,"i":13},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">13-16</span>:</div><div class=\"u\"><span class=\"en\">A year has gone, as the tortoise goes, / Heavy and slow; / And the same rose blows, and the same sun glows, / And the same brook sings of a year ago.</span></div>","n":2,"i":14,"a":"analysis-21-011","x":"bad7a628"},{"t":"tf","h":"","q":"الطبيعة في القصيدة بتتغير زي الإنسان.","ans":false,"why":"غلط: «the same rose blows, and the same sun glows» — الطبيعة ثابتة، والتغيير في الإنسان بس.","n":1,"i":15,"ex":["غلط. القصيدة بتأكد إن كل حاجة زي ما هي.","صح، الجملة غلط: الثبات هو اللي بيميز الطبيعة هنا."]},{"t":"learn","h":"<div class=\"u\">«سنة عدت زي ما السلحفاة بتمشي، تقيلة وبطيئة»: الزمن هنا مش سريع، هو تقيل. وتكرار «the same» تلات مرات بيقول إن كل حاجة زي ما هي.</div>","n":1,"i":16,"a":"analysis-21-012","x":"21f65611"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">33-36</span>:</div><div class=\"u\"><span class=\"en\">Just the same as a month before, – / The house and the trees, / The barn’s brown gable, the vine by the door, – / Nothing changed but the hives of bees.</span></div>","n":2,"i":17,"a":"analysis-21-013","x":"ea09cbd0"},{"t":"mc","h":"","q":"«Nothing changed but the hives of bees» بتعمل إيه؟","opts":["بتحدد التغيير الوحيد في مكان كله ثابت","بتقول إن النحل مات","بتوصف الجو"],"ans":0,"why":"بتحدد التغيير الوحيد في المكان.","n":1,"i":18,"ex":["صح: كل حاجة زي ما هي، والخلايا بس هي اللي اتغيرت — وده اللي بيكشف المصيبة.","غلط: النحل نفسه هو اللي بيتبلغ، مش بيموت.","غلط: السطر مش عن الجو، هو عن التغيير."]},{"t":"learn","h":"<div class=\"u\">«كل حاجة زي ما هي — البيت والشجر والجارن والعريشة — مفيش حاجة اتغيرت غير خلايا النحل». السطر ده هو مفتاح القصيدة: التغيير الوحيد في مكان كله ثابت.</div>","n":1,"i":19,"a":"analysis-21-014","x":"3346b35c"},{"t":"section","h":"الحداد: الرباعيات <span dir=\"ltr\">10-11</span>","n":1,"i":20},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">37-40</span>:</div><div class=\"u\"><span class=\"en\">Before them, under the garden wall, / Forward and back, / Went drearily singing the chore-girl small, / Draping each hive with a shred of black.</span></div>","n":2,"i":21,"a":"analysis-21-015","x":"dd355ad2"},{"t":"learn","h":"<div class=\"u\">بنت صغيرة بتتحرك رايحة جاية قدام الخلايا، وبتغني بحزن، وبتغطي كل خلية بخرقة سودا. الصورة دي هي العادة نفسها وهي بتتنفذ.</div>","n":1,"i":22,"a":"analysis-21-016","x":"dd47ba80"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">41-44</span>:</div><div class=\"u\"><span class=\"en\">Trembling, I listened: the summer sun / Had the chill of snow; / For I knew she was telling the bees of one / Gone on the journey we all must go!</span></div>","n":2,"i":23,"a":"analysis-21-017","x":"e3e1f8af"},{"t":"learn","h":"<div class=\"u\">«رجفت وأنا بسمع: شمس الصيف بقى فيها برد التلج» — المفارقة الحسية: حرّ الصيف بقى بارد. وده اللي بيحصل لما الخبر يوصل.</div>","n":1,"i":24,"a":"analysis-21-018","x":"dee29020"},{"t":"learn","h":"<div class=\"u\">«عشان عرفت إنها بتقول للنحل عن واحد راح في الرحلة اللي كلنا لازم نمشيها» — الموت هنا رحلة، والقصيدة مش بتسمي الميت لسه.</div>","n":1,"i":25,"a":"analysis-21-019","x":"ab42d512"},{"t":"section","h":"المفارقة: الرباعيات <span dir=\"ltr\">12-14</span>","n":1,"i":26},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">45-48</span>:</div><div class=\"u\"><span class=\"en\">Then I said to myself, “My Mary weeps / For the dead to-day: / Haply her blind old grandsire sleeps / The fret and the pain of his age away.”</span></div>","n":2,"i":27,"a":"analysis-21-020","x":"8af40a5c"},{"t":"learn","h":"<div class=\"u\">«قلت لنفسي: ماري بتعيّط على الميت النهارده، يمكن جدها الأعمى العجوز ارتاح من تعب سنّه». الشاعر بيحاول يفسر المصيبة بحاجة محتملة ومقبولة.</div>","n":1,"i":28,"a":"analysis-21-021","x":"08527f71"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">49-52</span>:</div><div class=\"u\"><span class=\"en\">But her dog whined low; on the doorway sill, / With his cane to his chin, / The old man sat; and the chore-girl still / Sung to the bees stealing out and in.</span></div>","n":2,"i":29,"a":"analysis-21-022","x":"b8b3aefd"},{"t":"learn","h":"<div class=\"u\">والكلب بيون، والجد العجوز قاعد على عتبة الباب وعصايته تحت دقنه — حيّ. يعني اللي ماتش هو الجد، وده معناه إن الميتة هي ماري نفسها.</div>","n":1,"i":30,"a":"analysis-21-023","x":"b63f8265"},{"t":"tf","h":"","q":"القصيدة فيها مفارقة درامية.","ans":true,"why":"صح: الشاعر بيفسر الموت على إنه موت الجد، وبعدين بيتأكد إن الميتة هي ماري.","n":1,"i":31,"ex":["صح، الجملة صح: التفسير الغلط هو أساس المفارقة.","غلط. المفارقة واضحة في الرباعيتين 12 و13."]},{"t":"learn","h":"<div class=\"u\">ده أول ما الشاعر يفهم، والقارئ معاه. من غير أي سطر يقول «ماتت ماري»، الصورة هي اللي قالت.</div>","n":1,"i":32,"a":"analysis-21-024","x":"42baaac8"},{"t":"mc","h":"","q":"مين اللي مات في القصيدة؟","opts":["ماري، حبيبة الشاعر","الجد الأعمى","البنت الصغيرة"],"ans":0,"why":"ماري.","n":1,"i":33,"ex":["صح: الشاعر افتكر الجد الأول، لكن ظهور الجد حي على العتبة بيصحح الفهم، والأغنية بتقول «Mistress Mary is dead».","غلط: الجد ظهر قاعد على العتبة حيّ.","غلط: البنت هي اللي بتنفذ العادة وهي حية."]},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">53-56</span>:</div><div class=\"u\"><span class=\"en\">And the song she was singing ever since / In my ear sounds on: – / “Stay at home, pretty bees, fly not hence! / Mistress Mary is dead and gone!”</span></div>","n":2,"i":34,"a":"analysis-21-025","x":"d30fca39"},{"t":"learn","h":"<div class=\"u\">وأغنية البنت بقت تفضل في ودنه: «اقعدوا في البيت يا نحل، ما تطيروش! الست ماري ماتت وراحت». الخبر بييجي في أغنية، مش في كلام مباشر.</div>","n":1,"i":35,"a":"analysis-21-026","x":"ba0c4330"},{"t":"mc","h":"","q":"إيه وظيفة أغنية البنت في النهاية؟","opts":["بتوصل خبر الموت بشكل غير مباشر وبتفضل في ودن الشاعر","بتوصف العسل","بتنادي النحل للشغل"],"ans":0,"why":"بتوصل الخبر غير مباشر وبتفضل عالقة.","n":1,"i":36,"ex":["صح: الخبر بييجي في أغنية، والقصيدة بتقفل عليها: «Mistress Mary is dead and gone».","غلط: مفيش وصف عسل.","غلط: الأغنية بتمنع النحل من الطيران، مش بتناديه للشغل."]},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":37},{"t":"learn","h":"<div class=\"u\">المفارقة الدرامية <span class=\"en\">(dramatic irony)</span>: الشاعر بيفسر غلط، والقارئ بيكتشف معاه. التفسير الغلط بيخلي الصدمة أقوى، لأن القارئ كان مستعد لموت عجوز.</div>","n":1,"i":38,"a":"analysis-21-027","x":"a8fafbcc"},{"t":"learn","h":"<div class=\"u\">ثبات الطبيعة: الوردة والنهار والجدول كلهم زي ما هم، والزمن تقيل لكنه ماشي. الطبيعة مش بتشارك في الحزن — وده اللي بيدّي القصيدة قسوتها الهادية.</div>","n":1,"i":39,"a":"analysis-21-028","x":"1f0360b6"},{"t":"learn","h":"<div class=\"u\">التفاصيل الريفية: فتحة الحيطة، حجر العبور، الجارن، عريشة العنب، أجراس الخلايا. القصيدة بتوثق عالم قروي كامل في 56 سطر.</div>","n":1,"i":40,"a":"analysis-21-029","x":"a2a93a6e"},{"t":"learn","h":"<div class=\"u\">الموضوعات: الحزن والذاكرة، والعادات الشعبية كطريقة للتعامل مع الموت، والفرق بين ثبات المكان وتغير الإنسان. وبعض القراءات بتشوف القصيدة كرثاء هادي، وبعضها بيشوف إن المفارقة فيها قسوة مش مواساة.</div>","n":1,"i":41,"a":"analysis-21-030","x":"2fd88542"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":42},{"t":"recall","h":"","q":"اشرح العادة الشعبية ودورها في القصيدة.","a":"العادة إن النحل لازم يتبلغ بموت حد في البيت، والخلايا تتغطى بخرقة سودا، وإلا النحل بيسيب الخلية ويهاجر. وفي القصيدة بنت صغيرة بتلف قدام الخلايا وهي بتغني بحزن، وبتغطي كل خلية بشريط أسود. العادة دي هي اللي بتوصل الخبر: الشاعر شاف الحداد على الخلايا وعرف إن فيه ميت. وبعدين الأغنية قالت له مين. فالعادة مش خلفية فلكلورية، هي وسيلة السرد — من غيرها مفيش طريقة للخبر.","n":1,"i":43},{"t":"recall","h":"","q":"إزاي القصيدة بتبني المفارقة؟","a":"القصيدة بتبني المفارقة على تلات خطوات. أولًا بتوصف المكان بتفصيل وهو ثابت: البيت، الجارن، الشجر، والخلايا بس اللي اتغيرت. تانيًا بتوصف الحداد على الخلايا من غير ما تسمي الميت: «one / Gone on the journey we all must go». تالتًا الشاعر بيفسر الموت بتفسير معقول: الجد العجوز الأعمى «sleeps the fret and the pain of his age away». القارئ بيقبل التفسير ده لأنه منطقي. وبعدين في الرباعية اللي بعدها الجد بيظهر قاعد على العتبة حيّ — فالتفسير بينهار، والقارئ بيوصل للحقيقة في نفس لحظة الشاعر. والأغنية الأخيرة بتعلن الاسم: «Mistress Mary is dead and gone». الصدمة جاية من الترتيب مش من المعلومة.","n":1,"i":44},{"t":"write","h":"","q":"حلّل صورة المكان في القصيدة.","key":"analysis-21:1","a":"المكان هو بطل القصيدة الأول. التفاصيل بتبدأ من بره: التلة، الطريق، فتحة الحيطة القديمة، وحجر العبور في الجدول. وبعدين البيت: بوابة حمرا، حور طويل، جارن بني، ساحة مواشي بقرون بيضا فوق الحيطة، وخلايا نحل مصفوفة في الشمس. والورود «weed-o’errun» بتقول إن فيه إهمال. الصورة دي مش ديكور: المكان ثابت في كل زيارة، والشاعر بيرجع له بعد سنة ويلاقيه زي ما هو — «Nothing changed but the hives of bees». الثبات ده هو اللي بيخلي الفقد محسوس، لأن كل حاجة شاهد على اللي مش موجود. وبعض القراءات بتشوف المكان كذاكرة مادية، وبعضها بتشوفه كتعويض: الطبيعة بتفضل، والإنسان بيروح.","n":1,"i":45},{"t":"write","h":"","q":"ناقش علاقة الطبيعة بالحزن في القصيدة.","key":"analysis-21:2","a":"الطبيعة في القصيدة مش بتعيّط مع الشاعر. الوردة بتزهر زي ما هي، والشمس بتغيب زي ما هي، والجدول بيغني «of a year ago». والتغيير الوحيد هو الخلايا المعلقة بالسواد. وده يعمل حاجتين: بيخلي الحزن أكثر وحدة، لأن العالم مش متضامن معاه؛ وبيخلي العادة البشرية (إبلاغ النحل) هي الوسيلة الوحيدة اللي فيها اعتراف بالموت. وفي نفس الوقت القصيدة بتحسّسنا بالبرد في الحر: «the summer sun / Had the chill of snow» — الطبيعة ثابتة، والإحساس هو اللي اتغير. وبعض القراءات بتشوف إن ده موقف قاسي من ويتير، وبعضها بتشوفه واقعي: الطبيعة مش مطالبة إنها تحزن، والحزن شغل الإنسان.","n":1,"i":46},{"t":"end","h":"","teaser":"<div class=\"u\">كده Telling the Bees خلصت: خلايا نحل في حداد، أغنية بنت صغيرة، وسر اتكشف في العتبة.</div><div class=\"u\">الدرس الجاي: The Darkling Thrush لتوماس هاردي — آخر قصيدة في البلوك، وعصفور بيغني في أحلك ليلة.</div>","extra":"المصادر: John Greenleaf Whittier, “Telling the Bees” (1858)؛ نص وملاحظات ويتير عن العادة من The Complete Poetical Works (1894)؛ ملاحظات محرري RPO عن المكان.","i":47}];</script>
