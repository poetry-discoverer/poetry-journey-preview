<script>window.LESSON_ID="myth-m12", "myth-m13";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">🎣 فيه بنت اتولدت بطريقة محدش يتخيلها: ما اتولدتش من بطن أم. اتولدت من راس أبوها.<\/div><div class=\"u\">وطلعت من راسه كاملة، لابسة درع دهبي، وبتلوّح برمح حاد. والدنيا كلها ارتعشت من صرختها.<\/div>", "n": 2, "a": "myth-m12-001", "x": "cbdec4f1", "en": "There is a girl who was born in a way nobody can imagine: she was not born from a mother's womb. She was born from her father's head. She came out of it fully grown, wearing a golden armour and shaking a sharp spear. And the whole world trembled at her cry.", "i": 1}, {"t": "learn", "h": "<div class=\"u\">دي مش قصة خيال علمي. دي أول حاجة بيقولها الإغريق عن أثينا (<span class=\"en\">Athena<\/span>)، واسمها عند الرومان مينيرفا (<span class=\"en\">Minerva<\/span>).<\/div><div class=\"u\">الفصل ده هو التوأم المعنوي للفصل اللي فات. في <span class=\"en\">M11<\/span> خدنا أرتميس: إلهة الغابة والصيد والحدود. النهارده أثينا: إلهة المدينة والحكمة والحرف والقانون.<\/div>", "n": 2, "a": "myth-m12-002", "x": "a8d3f3c8", "en": "This is not science fiction. It is the first thing the Greeks say about Athena, called Minerva by the Romans. This lesson is the twin of the last one. In M11 we met Artemis: goddess of the forest, hunting and borders. Today we meet Athena: goddess of the city, wisdom, crafts and law.", "i": 2}, {"t": "learn", "h": "<div class=\"u\">الاتنين عذارى، والاتنين إلهات قويات. بس واحدة ملكة البرية، والتانية ملكة المدينة. وده الفرق اللي هيمشي معانا طول الفصل.<\/div>", "n": 1, "a": "myth-m12-003", "x": "cbcb729c", "en": "Both are virgin goddesses, and both are powerful. But one is queen of the wild, and the other is queen of the city. This is the difference that will stay with us through the whole lesson.", "i": 3}, {"t": "section", "h": "إحنا فين في الحكاية؟", "i": 4}, {"t": "learn", "h": "<div class=\"li\">في الأول عرفنا يعني إيه أسطورة، وإيه الـ <span class=\"en\">allusion<\/span> (الإشارة لأسطورة من غير ذكر اسمها)، وإيه البطل.<\/div><div class=\"li\">بعدها خدنا زيوس، وأبولو، وأرتميس.<\/div><div class=\"li\">النهارده أثينا، وهي إلهة هنقابلها بعد كده في قصص كتير: النسّاجة أراخني، ومحاكمة أوريستيس، وميدوسا، وحرب طروادة.<\/div>", "n": 3, "a": "myth-m12-004", "x": "8e70d298", "en": "First we learned what a myth is, what an allusion is, and what a hero is. Then we took Zeus, Apollo and Artemis. Today we take Athena, a goddess we will meet again in many stories: the weaver Arachne, the trial of Orestes, Medusa, and the Trojan War.", "i": 5}, {"t": "learn", "h": "<div class=\"u\">وليه أثينا مهمة لكورس الشعر الإنجليزي؟ لأن الشاعر بيستدعيها لما يتكلم عن العقل والحكمة والقانون والفن.<\/div><div class=\"u\">ولما تشوف في قصيدة إنجليزية كلمة <span class=\"en\">Pallas<\/span> أو <span class=\"en\">Minerva<\/span>، اعرف إن الشاعر بيستدعي العقل نفسه.<\/div>", "n": 2, "a": "myth-m12-005", "x": "8f3aab3d", "en": "Why is Athena important for an English poetry course? Because the poet calls on her when he speaks about reason, wisdom, law and art. When you see the word Pallas or Minerva in an English poem, know that the poet is calling on reason itself.", "i": 6}, {"t": "section", "h": "1) مين أثينا؟ البطاقة الأساسية 🪪", "i": 7}, {"t": "learn", "h": "<div class=\"u\">الاسم:<\/div><div class=\"li\">أثينا (<span class=\"en\">Athena<\/span>) هو الاسم اليوناني. والرومان سموها مينيرفا (<span class=\"en\">Minerva<\/span>).<\/div><div class=\"li\">أصل اسم أثينا مش معروف بشكل مؤكد. فيه علماء، زي <span class=\"en\">Beekes<\/span>، بيرجّحوا إنه من لغة أقدم من اليونانية، اللي بيسموها <span class=\"en\">pre-Greek<\/span>.<\/div>", "n": 3, "a": "myth-m12-006", "x": "41454ba6", "en": "The name. Athena is the Greek name, and the Romans called her Minerva. The origin of the name Athena is not known for sure. Some scholars, such as Beekes, think it comes from a language older than Greek, which they call pre-Greek.", "i": 8}, {"t": "learn", "h": "<div class=\"u\">أما مينيرفا فاسم روماني قديم، وأصله من كلمة معناها \"ذكي، فاهم\"، من جذر هندو-أوروبي معناه \"يفكر\". ومن نفس الجذر جت كلمة <span class=\"en\">mind<\/span> الإنجليزية.<\/div><div class=\"u\">يعني اسم مينيرفا قريب جداً من معنى \"العقل\". وده مش صدفة: الإلهة الرومانية كانت إلهة العقل والحرف.<\/div>", "n": 2, "a": "myth-m12-007", "x": "59c95056", "en": "Minerva is an old Roman name, from a word meaning clever or understanding, from an Indo-European root meaning to think. The English word mind comes from the same root. So the name Minerva is very close to the meaning of mind. This is no accident: the Roman goddess was goddess of the mind and of crafts.", "i": 9}, {"t": "learn", "h": "<div class=\"u\">العيلة:<\/div><div class=\"li\">أبوها زيوس.<\/div><div class=\"li\">أمها ميتيس (<span class=\"en\">Metis<\/span>)، واسمها معناه \"الحكمة\" أو \"الفكرة الذكية\".<\/div><div class=\"li\">وميتيس مش أم عادية، لأن زيوس بلعها وهي حامل. هنحكي الحكاية بعد شوية.<\/div>", "n": 4, "a": "myth-m12-008", "x": "9bc5fce9", "en": "The family. Her father is Zeus. Her mother is Metis, whose name means wisdom or clever thinking. And Metis is no ordinary mother, because Zeus swallowed her while she was pregnant. We will tell the story soon.", "i": 10}, {"t": "learn", "h": "<div class=\"u\">ألقابها، وكل لقب بيقول حاجة:<\/div><div class=\"li\"><span class=\"en\">Pallas<\/span>: أشهر ألقابها، وبيتستخدم في الشعر الإنجليزي كتير.<\/div><div class=\"li\"><span class=\"en\">Parthenos<\/span>: يعني \"العذراء\". ومنها اسم البارثينون.<\/div><div class=\"li\"><span class=\"en\">Promachos<\/span>: \"اللي بتقاتل في المقدمة\".<\/div><div class=\"li\"><span class=\"en\">Polias<\/span>: \"حامية المدينة\".<\/div>", "n": 5, "a": "myth-m12-009", "x": "0b31eca7", "en": "Her titles, and each title says something. Pallas is her most famous title, often used in English poetry. Parthenos means the virgin, and the Parthenon takes its name from it. Promachos means she who fights in the front. Polias means protector of the city.", "i": 11}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">glaukopis<\/span>: صفة بتتكرر عند هوميروس. معناها غالباً \"اللي عينيها لامعة\"، وفيه تفسير تاني إنها \"بعين البومة\".<\/div><div class=\"li\"><span class=\"en\">Tritogeneia<\/span>: لقب معناه مختلف عليه، ومحدش متأكد منه. وإحنا مش هنخترع له معنى.<\/div>", "n": 2, "a": "myth-m12-010", "x": "beca2738", "en": "Glaukopis is a word repeated in Homer. It most likely means with bright eyes, and another reading says owl-eyed. Tritogeneia is a title whose meaning is disputed, and nobody is sure of it. We will not invent a meaning for it.", "i": 12}, {"t": "learn", "h": "<div class=\"u\">مجالاتها:<\/div><div class=\"li\">الحكمة والمشورة.<\/div><div class=\"li\">الحرب العاقلة والدفاعية، مش الحرب الهمجية.<\/div><div class=\"li\">الحرف: النسيج والفخار وبناء السفن.<\/div><div class=\"li\">القانون والمدينة.<\/div><div class=\"li\">وهي حامية الأبطال الأذكياء، زي أوديسيوس.<\/div>", "n": 6, "a": "myth-m12-011", "x": "eb8cf9c0", "en": "Her areas. Wisdom and counsel. Wise and defensive war, not savage war. Crafts: weaving, pottery and shipbuilding. Law and the city. And she is the protector of clever heroes, like Odysseus.", "i": 13}, {"t": "section", "h": "2) القصة الكبيرة: الولادة من الراس 🧠⚡", "i": 14}, {"t": "learn", "h": "<div class=\"u\">زيوس وميتيس:<\/div><div class=\"li\">بعد ما الآلهة كسبوا حرب التيتان، زيوس اتجوز ميتيس، وهي كانت \"أحكم من الآلهة والبشر\".<\/div><div class=\"li\">في \"نسب الآلهة\" (<span class=\"en\">Theogony<\/span>) لهسيود، تقريباً في الأسطر 886 لـ 900، فيه نبوة: ميتيس هتولد بنت تساوي أبوها في القوة والحكمة، وبعدها ولد هيبقى ملك الآلهة وهيزيح زيوس.<\/div>", "n": 3, "a": "myth-m12-012", "x": "048f8043", "en": "Zeus and Metis. After the gods won the war against the Titans, Zeus married Metis, who was wiser than gods and men. In Hesiod's Theogony, roughly lines 886 to 900, there is a prophecy: Metis will bear a daughter equal to her father in strength and wisdom, and then a son who will become king of the gods and push Zeus aside.", "i": 15}, {"t": "learn", "h": "<div class=\"u\">وزيوس، اللي هو نفسه خدع أبوه كرونوس، عرف يعني إيه نبوة زي دي. فعمل إيه؟ خدع ميتيس بكلام ناعم، وبلعها وهي حامل.<\/div>", "n": 1, "a": "myth-m12-013", "x": "8c1b73c2", "en": "Zeus, who had himself overthrown his father Cronus, knew what a prophecy like this means. So what did he do? He tricked Metis with soft words, and swallowed her while she was pregnant.", "i": 16}, {"t": "mc", "h": "", "q": "ليه زيوس بلع ميتيس؟", "nq": 1, "opts": ["عشان النبوة قالت إن ابنها هيزيحه عن الحكم", "عشان كانت بتحارب الآلهة", "عشان ماكانتش حكيمة"], "ans": 0, "why": "عشان النبوة قالت إن ابنها هيزيحه عن الحكم", "ex": ["صح: بلعها عشان يمنع النبوة.", "غلط: الحكاية مش كده.", "غلط: العكس، هي كانت أحكم الجميع."], "i": 17}, {"t": "learn", "h": "<div class=\"u\">النتيجة: أثينا اتولدت من راس زيوس. هسيود، في حوالي السطر 924، بيقول إن زيوس ولد من راسه أثينا \"اللامعة العينين\" (<span class=\"en\">glaukopis<\/span>).<\/div><div class=\"u\">وفي الترنيمة الهوميرية 28، المشهد بيتحكي بالتفصيل. ده وصف جميل: \"<span class=\"en\">From his awful head wise Zeus himself bare her arrayed in warlike arms of flashing gold, and awe seized all the gods as they gazed<\/span>.\"<\/div>", "n": 2, "a": "myth-m12-014", "x": "ce5b0dd7", "en": "The result: Athena was born from the head of Zeus. Hesiod, around line 924, says Zeus bore from his own head bright-eyed Athena. In Homeric Hymn 28 the scene is told in detail. It is a beautiful description: From his awful head wise Zeus himself bare her arrayed in warlike arms of flashing gold, and awe seized all the gods as they gazed.", "i": 18}, {"t": "learn", "h": "<div class=\"u\">يعني: \"من راسه المهيب، زيوس الحكيم نفسه ولدها، لابسة سلاح حرب من دهب لامع، والرهبة أخدت الآلهة كلهم وهما بيبصوا\".<\/div>", "n": 1, "a": "myth-m12-015", "x": "682e1754", "en": "That means: from his dreadful head, wise Zeus himself bore her, dressed in war arms of shining gold, and awe seized all the gods as they looked.", "i": 19}, {"t": "learn", "h": "<div class=\"u\">وبعدها: \"<span class=\"en\">But Athena sprang quickly from the immortal head and stood before Zeus who holds the aegis, shaking a sharp spear<\/span>: <span class=\"en\">great Olympus began to reel horribly at the might of the bright-eyed goddess<\/span>.\"<\/div><div class=\"u\">يعني أثينا نطّت من الراس ووقفت قدام زيوس بتلوّح برمح حاد، وجبل أوليمبوس العظيم بدأ يترنّح من قوتها.<\/div>", "n": 2, "a": "myth-m12-016", "x": "a29f4772", "en": "After that: But Athena sprang quickly from the immortal head and stood before Zeus who holds the aegis, shaking a sharp spear: great Olympus began to reel horribly at the might of the bright-eyed goddess. So Athena jumped from the head and stood before Zeus shaking a sharp spear, and great Mount Olympus began to shake at her power.", "i": 20}, {"t": "learn", "h": "<div class=\"u\">وأجمل تفصيلة: الشمس نفسها وقفت. الترنيمة بتقول إن ابن هيبيريون (يعني الشمس) وقّف حصانه السريع فترة طويلة.<\/div><div class=\"u\">يعني الكون كله اتجمّد لحظة الميلاد.<\/div>", "n": 2, "a": "myth-m12-017", "x": "a620c46a", "en": "The most beautiful detail: the sun itself stopped. The hymn says that the son of Hyperion, meaning the sun, stopped his swift horses for a long while. So the whole universe froze for the moment of the birth.", "i": 21}, {"t": "learn", "h": "<div class=\"lead\">ملحوظة أمانة علمية: هسيود هو أقدم مصدر عندنا، وهو ما ذكرش هيفايستوس ولا الفأس ولا إنها طلعت لابسة سلاح.<\/div><div class=\"u\">أول واحد ذكر السلاح هو الشاعر <span class=\"en\">Stesichorus<\/span>، وقصيدته ضاعت. وبعده <span class=\"en\">Pindar<\/span> (<span class=\"en\">Olympian<\/span> 7) حكى إن هيفايستوس شق راس زيوس بفأس، والدنيا ارتعبت من الصرخة.<\/div>", "n": 2, "a": "myth-m12-018", "x": "53a7a8fe", "en": "A note of honesty. Hesiod is our oldest source, and he does not mention Hephaestus, the axe, or her coming out armed. The first to mention the weapons was the poet Stesichorus, whose poem is lost. After him Pindar, in Olympian 7, told that Hephaestus split the head of Zeus with an axe, and the world was afraid at the cry.", "i": 22}, {"t": "learn", "h": "<div class=\"u\">يعني التفصيلة الشهيرة \"هيفايستوس شق الراس بفأس\" جت متأخرة عن هسيود. والنسخة الشعبية النهارده خليط من مصادر كتير.<\/div>", "n": 1, "a": "myth-m12-019", "x": "33fc9f49", "en": "So the famous detail of Hephaestus splitting the head with an axe came later than Hesiod. And the popular version today is a mix of many sources.", "i": 23}, {"t": "tf", "h": "", "q": "هسيود، أقدم مصدر، ذكر إن هيفايستوس شق راس زيوس بفأس.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: هسيود ما ذكرش هيفايستوس ولا الفأس. التفصيلة دي جت عند <span class=\"en\">Pindar<\/span>.", "صح: هسيود ما ذكرش الفأس. ده جه بعده عند <span class=\"en\">Pindar<\/span>."], "i": 24}, {"t": "learn", "h": "<div class=\"u\">ليه من الراس؟ لأنها إلهة العقل. الحكاية رمز: الحكمة بتتولد من العقل نفسه، من غير أم ومن غير جسد.<\/div><div class=\"u\">وفيها حاجة تانية أعمق: الإلهة الراعية لأثينا، المدينة اللي اخترعت الديمقراطية، بتتولد من الأب بس. وده بيفسّر موقفها في محاكمة أوريستيس، وهنشوفها بعد شوية.<\/div>", "n": 2, "a": "myth-m12-020", "x": "c311f3c2", "en": "Why from the head? Because she is the goddess of the mind. The story is a symbol: wisdom is born from the mind itself, without a mother and without a body. And there is something deeper: the patron goddess of Athens, the city that invented democracy, is born from the father only. This explains her position in the trial of Orestes, which we will see soon.", "i": 25}, {"t": "learn", "h": "<div class=\"u\">مثال من حياتنا: تخيل شركة كل الناس فيها بيقولوا \"الفكرة دي جت من دماغ المدير\". الفكرة مالهاش أم، ليها مصدر واحد بس: العقل.<\/div><div class=\"u\">الأسطورة بتقول نفس الحكاية عن الحكمة.<\/div>", "n": 2, "a": "myth-m12-021", "x": "da95e15b", "en": "An example from our life: imagine a company where everyone says this idea came from the manager's head. The idea has no mother, it has only one source: the mind. The myth tells the same story about wisdom.", "i": 26}, {"t": "section", "h": "3) الميادين الأربعة 🗺️", "i": 27}, {"t": "learn", "h": "<div class=\"u\">المدينة 🏙️<\/div><div class=\"li\">أثينا حامية المدينة اللي اسمها عليها. والعلاقة بينهم قوية لدرجة إن ناس بتقول إن اسم المدينة جاي من اسم الإلهة، وناس بتقول العكس، ويمكن الاتنين من أصل أقدم.<\/div><div class=\"li\">معبدها الكبير هو البارثينون على الأكروبوليس.<\/div><div class=\"li\">ومهرجانها الكبير اسمه <span class=\"en\">Panathenaia<\/span>، وفيه موكب ضخم.<\/div>", "n": 4, "a": "myth-m12-022", "x": "13db6556", "en": "The city. Athena protects the city that has her name. The link is so strong that some say the city's name comes from the goddess, others say the opposite, and maybe both come from an older source. Her great temple is the Parthenon on the Acropolis. Her great festival is called the Panathenaia, with a huge procession.", "i": 28}, {"t": "learn", "h": "<div class=\"u\">الحرب العاقلة ⚔️<\/div><div class=\"li\">أثينا إلهة الحرب، بس مش أي حرب. هي حرب التخطيط والدفاع عن المدينة والاستراتيجية.<\/div><div class=\"li\">الحرب الهمجية والعنف من غير سبب شغل آريس (<span class=\"en\">Ares<\/span>)، إله الحرب العنيف.<\/div><div class=\"li\">ولما شاعر عايز يقول \"حرب شريفة\" بيستدعي أثينا. ولما عايز يقول \"حرب وحشية\" بيستدعي آريس.<\/div>", "n": 4, "a": "myth-m12-023", "x": "2a8c3bce", "en": "Wise war. Athena is a goddess of war, but not any war. Hers is the war of planning, defending the city and strategy. Savage war and violence without reason belong to Ares, the violent god of war. When a poet wants to say an honourable war he calls on Athena. When he wants a brutal war he calls on Ares.", "i": 29}, {"t": "learn", "h": "<div class=\"u\">الحرف والنسيج 🧵<\/div><div class=\"li\">أثينا إلهة الصنعة: النسيج والفخار وبناء السفن.<\/div><div class=\"li\">النسيج كان شغل الستات الأساسي في اليونان، وفيه مهارة وفن. وده اللي بيخلي حكاية أراخني خطيرة: ست بتتحدى إلهة الحرفة في حرفتها.<\/div>", "n": 3, "a": "myth-m12-024", "x": "bc8f8b44", "en": "Crafts and weaving. Athena is the goddess of skill: weaving, pottery and shipbuilding. Weaving was women's main work in Greece, and it needed skill and art. This is what makes the story of Arachne dangerous: a woman challenges the goddess of craft in her own craft.", "i": 30}, {"t": "learn", "h": "<div class=\"u\">العقل والحيلة 🦉<\/div><div class=\"li\">أثينا إلهة <span class=\"en\">metis<\/span>، يعني الحكمة العملية، الذكاء اللي بيلاقي طريق.<\/div><div class=\"li\">وده اللي بيخليها تحب أوديسيوس، الراجل اللي بيكسب بالعقل مش بالعضلات.<\/div><div class=\"li\">والبومة رمزها، لأن البومة بتشوف في الضلمة. الحكمة إنك تشوف اللي غيرك مش شايفه.<\/div>", "n": 4, "a": "myth-m12-025", "x": "be8958cf", "en": "Mind and cunning. Athena is the goddess of metis, meaning practical wisdom, the intelligence that finds a way. This is why she loves Odysseus, the man who wins with his brain, not his muscles. The owl is her symbol, because the owl sees in the dark. Wisdom is to see what others do not see.", "i": 31}, {"t": "mc", "h": "", "q": "مين اللي بيمثل الحرب العاقلة، ومين اللي بيمثل الحرب الهمجية؟", "nq": 1, "opts": ["أثينا للعاقلة، وآريس للهمجية", "آريس للعاقلة، وأثينا للهمجية", "أرتميس للعاقلة، وأبولو للهمجية"], "ans": 0, "why": "أثينا للعاقلة، وآريس للهمجية", "ex": ["صح.", "غلط: العكس.", "غلط: دول مش إلهات الحرب."], "i": 32}, {"t": "section", "h": "4) أثينا وأوديسيوس: المدينة بتحب الذكي 🧠🌊", "i": 33}, {"t": "learn", "h": "<div class=\"u\">في الأوديسة، أثينا هي اللي بتقود الحكاية.<\/div><div class=\"li\">في الكتاب الأول بتنزل في شكل <span class=\"en\">Mentes<\/span> عشان تحرّك تليماخوس، ابن أوديسيوس.<\/div><div class=\"li\">وفي الكتاب التاني بتاخد شكل <span class=\"en\">Mentor<\/span>، صاحب قديم لأوديسيوس.<\/div><div class=\"li\">ومن هنا جت كلمة <span class=\"en\">mentor<\/span> الإنجليزية، يعني \"مرشد\". اسم شخصية في الأوديسة بقى كلمة عادية بنستخدمها كل يوم.<\/div>", "n": 4, "a": "myth-m12-026", "x": "6dadbc71", "en": "In the Odyssey, Athena is the one who leads the story. In Book 1 she comes down in the shape of Mentes to move Telemachus, the son of Odysseus. In Book 2 she takes the shape of Mentor, an old friend of Odysseus. From here comes the English word mentor, meaning a guide. The name of a character in the Odyssey became an ordinary word we use every day.", "i": 34}, {"t": "learn", "h": "<div class=\"u\">وفي الكتاب 13، أحلى مشهد بينهم. أوديسيوس رجع إيثاكا، وأثينا جات له في شكل راعي شاب. هو حكى لها قصة كدب كاملة عشان يخبّي نفسه.<\/div><div class=\"u\">أثينا ضحكت، ومسحت على وشه، وتحوّلت لست طويلة جميلة.<\/div>", "n": 2, "a": "myth-m12-027", "x": "213560ff", "en": "In Book 13 comes the best scene between them. Odysseus came back to Ithaca, and Athena came to him in the shape of a young shepherd. He told her a whole made-up story to hide himself. Athena laughed, stroked his face, and became a tall, beautiful woman.", "i": 35}, {"t": "learn", "h": "<div class=\"u\">وقالت له جملة تستاهل تتحفظ (ترجمة <span class=\"en\">Murray<\/span>): \"<span class=\"en\">Cunning must he be and knavish, who would go beyond thee in all manner of guile, aye, though it were a god that met thee<\/span>.\"<\/div><div class=\"u\">يعني: لازم يكون ماكر وخبيث جداً اللي عايز يغلبك في الحيلة، حتى لو كان إله قابلك.<\/div>", "n": 2, "a": "myth-m12-028", "x": "3923dca0", "en": "She said a sentence worth remembering, in Murray's translation: Cunning must he be and knavish, who would go beyond thee in all manner of guile, aye, though it were a god that met thee. It means: whoever wants to beat you in trickery must be very cunning and sly, even if it were a god who met you.", "i": 36}, {"t": "learn", "h": "<div class=\"u\">وبعدها: \"<span class=\"en\">thou art far the best of all men in counsel and in speech, and I among all the gods am famed for wisdom and craft<\/span>.\"<\/div><div class=\"u\">يعني: إنت الأفضل بين كل البشر في المشورة والكلام، وأنا بين كل الآلهة مشهورة بالحكمة والحيلة. الإلهة بتقول للبطل: إحنا شبه بعض.<\/div>", "n": 2, "a": "myth-m12-029", "x": "e2f47cce", "en": "After that: thou art far the best of all men in counsel and in speech, and I among all the gods am famed for wisdom and craft. So you are the best of men in counsel and speech, and I am famous among the gods for wisdom and craft. The goddess tells the hero: we are alike.", "i": 37}, {"t": "learn", "h": "<div class=\"u\">ليه المشهد ده مهم للفصل؟ لأن أرتميس بتحب الصياد المنفرد اللي في الغابة، وأثينا بتحب الراجل اللي بيكسب بالعقل وسط الناس.<\/div><div class=\"u\">واحدة بتحمي الحدود، والتانية بتحمي النظام. وده الفرق اللي بدأنا بيه الفصل.<\/div>", "n": 2, "a": "myth-m12-030", "x": "d53591ed", "en": "Why is this scene important for the lesson? Because Artemis loves the lonely hunter in the forest, and Athena loves the man who wins with his mind among people. One protects borders, the other protects order. This is the difference we started the lesson with.", "i": 38}, {"t": "mc", "h": "", "q": "إيه أصل كلمة <span class=\"en\">mentor<\/span> الإنجليزية؟", "nq": 1, "opts": ["اسم <span class=\"en\">Mentor<\/span>، شخصية في الأوديسة أثينا اتخفّت في شكلها", "اسم إله روماني للحرب", "اسم مدينة يونانية"], "ans": 0, "why": "اسم <span class=\"en\">Mentor<\/span>، شخصية في الأوديسة أثينا اتخفّت في شكلها", "ex": ["صح.", "غلط.", "غلط."], "i": 39}, {"t": "section", "h": "5) البارثينون: البيت الحجري للإلهة 🏛️", "i": 40}, {"t": "learn", "h": "<div class=\"u\">الأرقام:<\/div><div class=\"li\">البارثينون اتبنى بين 447 و438 قبل الميلاد، والمهندسين <span class=\"en\">Iktinos<\/span> و<span class=\"en\">Kallikrates<\/span>.<\/div><div class=\"li\">النحت اتعمل بإشراف النحات <span class=\"en\">Pheidias<\/span>، وخلص سنة 432 قبل الميلاد.<\/div><div class=\"li\">والمعبد كان في قلب برنامج البناء بتاع <span class=\"en\">Pericles<\/span> في أثينا.<\/div>", "n": 4, "a": "myth-m12-031", "x": "0e67669b", "en": "The numbers. The Parthenon was built between 447 and 438 BC, by the architects Iktinos and Kallikrates. The sculpture was made under the sculptor Pheidias and finished in 432 BC. The temple was at the heart of the building programme of Pericles in Athens.", "i": 41}, {"t": "learn", "h": "<div class=\"u\">الاسم: كلمة <span class=\"en\">parthenos<\/span> في اليونانية معناها \"بنت، عذراء\". فالبارثينون معناه تقريباً \"بيت العذراء\".<\/div><div class=\"u\">وجوه المعبد كان فيه تمثال أثينا بارثينوس من الدهب والعاج، عمله <span class=\"en\">Pheidias<\/span>، وطوله حوالي 12 متر، واتدشن حوالي 438 قبل الميلاد.<\/div>", "n": 2, "a": "myth-m12-032", "x": "fa077f82", "en": "The name. The Greek word parthenos means girl or virgin. So the Parthenon means roughly the house of the virgin. Inside the temple stood the statue of Athena Parthenos, made of gold and ivory by Pheidias, about 12 metres tall, dedicated around 438 BC.", "i": 42}, {"t": "learn", "h": "<div class=\"u\">النحت هو أهم حاجة:<\/div><div class=\"li\">البروز الشرقي (فوق الباب الرئيسي): ميلاد أثينا من راس زيوس.<\/div><div class=\"li\">البروز الغربي: المنافسة بين أثينا وبوسيدون على المدينة.<\/div><div class=\"li\">والفريز: موكب <span class=\"en\">Panathenaia<\/span>، يعني ناس حقيقيين في موكب ديني.<\/div><div class=\"u\">يعني المعبد نفسه بيحكي الأسطورة اللي في الفصل ده. الحجر بقى كتاب.<\/div>", "n": 5, "a": "myth-m12-033", "x": "6793e11c", "en": "The sculpture is the most important thing. The east pediment, above the main door, shows the birth of Athena from the head of Zeus. The west pediment shows the contest between Athena and Poseidon for the city. The frieze shows the Panathenaic procession, real people in a religious parade. So the temple itself tells the myth of this lesson. The stone became a book.", "i": 43}, {"t": "learn", "h": "<div class=\"u\">المنافسة مع بوسيدون: الآلهة قررت إن المدينة تتسمى على اسم اللي يدّيها أحسن هدية.<\/div><div class=\"u\">في بعض الروايات بوسيدون ضرب الصخر بالرمح الثلاثي، فطلع حصان. وفي روايات تانية طلعت عين مية مالحة. وأثينا ضربت الأرض فطلعت شجرة زيتون. وأثينا هي اللي كسبت.<\/div>", "n": 2, "a": "myth-m12-034", "x": "1cfdee53", "en": "The contest with Poseidon. The gods decided the city would be named after whoever gave it the best gift. In some versions Poseidon struck the rock with his trident and a horse came out. In other versions a spring of salt water came out. Athena struck the earth and an olive tree came out. And Athena won.", "i": 44}, {"t": "learn", "h": "<div class=\"u\">أوفيد (<span class=\"en\">Metamorphoses<\/span> 6) بيوصف المشهد منسوج على نسيج مينيرفا. وهيرودوت (<span class=\"en\">Histories<\/span> 8.55) بيقول إن على الأكروبوليس، في معبد <span class=\"en\">Erechtheus<\/span>، فيه شجرة زيتون وعين مية مالحة، والأثينيين بيقولوا إن بوسيدون وأثينا حطوهم شهود على خلافهم.<\/div>", "n": 1, "a": "myth-m12-035", "x": "bb22e023", "en": "Ovid, in Metamorphoses 6, describes the scene woven on Minerva's cloth. Herodotus, in Histories 8.55, says that on the Acropolis, in the temple of Erechtheus, there is an olive tree and a salt-water spring, and the Athenians say that Poseidon and Athena put them there as witnesses of their quarrel.", "i": 45}, {"t": "learn", "h": "<div class=\"u\">الدرس: المدينة اختارت الزيتون، يعني الغذاء والسلام والتجارة، مش الحرب. وده اختيار بيقول إيه شخصية المدينة.<\/div><div class=\"u\">وفي حاجة كمان: الغرفة الغربية من المعبد غالباً كانت بتحفظ فيها أموال المدينة وهداياها. يعني المعبد كان زي بنك كمان.<\/div>", "n": 2, "a": "myth-m12-036", "x": "fc8ab65a", "en": "The lesson: the city chose the olive, meaning food, peace and trade, not war. This choice says what the city's character is. And there is more: the west room of the temple was probably used to keep the city's money and gifts. So the temple was also like a bank.", "i": 46}, {"t": "mc", "h": "", "q": "إيه اللي بيظهر في البروز الشرقي من البارثينون؟", "nq": 1, "opts": ["ميلاد أثينا من راس زيوس", "موت أوديسيوس", "حرب طروادة"], "ans": 0, "why": "ميلاد أثينا من راس زيوس", "ex": ["صح.", "غلط.", "غلط."], "i": 47}, {"t": "tf", "h": "", "q": "كلمة <span class=\"en\">parthenos<\/span> معناها \"عذراء\"، ومنها اسم البارثينون.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح.", "غلط: ده فعلاً أصل الاسم."], "i": 48}, {"t": "mc", "h": "", "q": "إيه هدية أثينا للمدينة في المنافسة مع بوسيدون؟", "nq": 1, "opts": ["شجرة زيتون", "حصان", "سيف"], "ans": 0, "why": "شجرة زيتون", "ex": ["صح.", "غلط: الحصان في بعض الروايات هدية بوسيدون.", "غلط."], "i": 49}, {"t": "section", "h": "6) قصص مرتبطة، وهنقابلها لاحقاً 🧵", "i": 50}, {"t": "learn", "h": "<div class=\"u\">أراخني، النسّاجة اللي تحدّت الإلهة. (أوفيد، <span class=\"en\">Metamorphoses<\/span> 6)<\/div><div class=\"li\">أراخني بنت من ليديا، مشهورة بالنسيج لدرجة إن الحوريات كانوا بيسيبوا كرومهم عشان يتفرجوا عليها.<\/div><div class=\"li\">قالت إن مهارتها من نفسها، مش من مينيرفا. فمينيرفا جات لها في شكل عجوزة تنصحها، وأراخني رفضت. فالإلهة كشفت نفسها، واتفقوا على مسابقة نسيج.<\/div>", "n": 3, "a": "myth-m12-037", "x": "d4322d43", "en": "Arachne, the weaver who challenged the goddess (Ovid, Metamorphoses 6). Arachne was a girl from Lydia, so famous for weaving that the nymphs left their vineyards to watch her. She said her skill came from herself, not from Minerva. So Minerva came to her as an old woman to advise her, and Arachne refused. The goddess revealed herself, and they agreed on a weaving contest.", "i": 51}, {"t": "learn", "h": "<div class=\"li\">مينيرفا نسجت منافستها مع بوسيدون على المدينة. وأراخني نسجت فضايح الآلهة وحبهم للبشر.<\/div><div class=\"li\">شغل أراخني كان بلا عيب. فمينيرفا مزّقته وضربتها. وأراخني شنقت نفسها، فحوّلتها مينيرفا لعنكبوت.<\/div><div class=\"li\">وفيها سؤال حلو: ليه الإلهة بتعاقب أحسن واحدة بعدها؟ هنرجع له في فصل جاي.<\/div>", "n": 3, "a": "myth-m12-038", "x": "c9769786", "en": "Minerva wove her contest with Poseidon over the city. Arachne wove the scandals of the gods and their loves for humans. Arachne's work was without fault. So Minerva tore it and struck her. Arachne hanged herself, and Minerva turned her into a spider. And there is a good question in it: why does the goddess punish the best one after her? We will come back to it in a later lesson.", "i": 52}, {"t": "learn", "h": "<div class=\"u\">أوريستيس والمحكمة: أثينا بتأسس القانون.<\/div><div class=\"li\">في مسرحية <span class=\"en\">Aeschylus<\/span> اللي اسمها <span class=\"en\">Eumenides<\/span>، أوريستيس متحاكم لأنه قتل أمه. وأثينا هي اللي بترأس المحكمة، وبتصوّت معاه.<\/div><div class=\"li\">وقالت جملة هي مفتاح شخصيتها (ترجمة <span class=\"en\">Smyth<\/span>، الأسطر 734 لـ 738): \"<span class=\"en\">For there was no mother who gave me birth<\/span>; <span class=\"en\">and in all things, except for marriage, whole-heartedly I am for the male and entirely on the father's side<\/span>.\"<\/div>", "n": 3, "a": "myth-m12-039", "x": "8e3fa02c", "en": "Orestes and the court: Athena founds the law. In Aeschylus's play Eumenides, Orestes is on trial because he killed his mother. Athena presides over the court, and she votes for him. She said a sentence that is the key to her character (Smyth's translation, lines 734 to 738): For there was no mother who gave me birth; and in all things, except for marriage, whole-heartedly I am for the male and entirely on the father's side.", "i": 53}, {"t": "learn", "h": "<div class=\"u\">يعني: مفيش أم ولدتني، وفي كل حاجة ما عدا الجواز أنا بكل قلبي مع الذكر، ومع الأب تماماً.<\/div><div class=\"u\">ده مش رأي شخصي منها، ده نتيجة أسطورتها: اللي اتولد من راس أبوه بيقف مع الأب.<\/div><div class=\"u\">والمحكمة اللي أسستها هي الأريوباغوس. وفي آخر المسرحية الإلهات القديمة (الإيرينيس) بتبقى جزء من المدينة بدل ما تفضل بره، يعني أثينا بتحوّل الغضب القديم لقانون.<\/div>", "n": 3, "a": "myth-m12-040", "x": "43e79bd0", "en": "It means: no mother bore me, and in everything except marriage I am wholeheartedly on the male's side, and fully on the father's side. This is not a personal opinion, it is a result of her myth: the one born from her father's head stands with the father. The court she founded is the Areopagus. At the end of the play the old goddesses, the Erinyes, become part of the city instead of staying outside. So Athena turns old anger into law.", "i": 54}, {"t": "learn", "h": "<div class=\"u\">ميدوسا: الدرع اللي بيجمّد.<\/div><div class=\"li\">على درع أثينا (الأيجيس، <span class=\"en\">aegis<\/span>) كان فيه راس ميدوسا، اللي بتحوّل اللي يبص لها لحجر.<\/div><div class=\"li\">وحكاية ميدوسا لها نسخ كتير، وأوفيد عنده نسخة قاسية جداً. هنشوفها بالتفصيل بعدين.<\/div>", "n": 3, "a": "myth-m12-041", "x": "3940d56f", "en": "Medusa: the shield that freezes. On Athena's shield, the aegis, was the head of Medusa, who turns whoever looks at her into stone. The story of Medusa has many versions, and Ovid has a very harsh one. We will see it in detail later.", "i": 55}, {"t": "learn", "h": "<div class=\"u\">طروادة: الإلهة اللي اختارت جانب.<\/div><div class=\"li\">أثينا كانت مع اليونانيين في حرب طروادة. وفي الإلياذة، الكتاب 6، الأسطر 297 لـ 311، فيه مشهد قاسي: الستات الطرواديات راحوا معبد أثينا، وحطّوا أفخم روب عندهم على ركبتي التمثال.<\/div><div class=\"li\">وصلّوا: \"<span class=\"en\">Lady Athene, that dost guard our city, fairest among goddesses, break now the spear of Diomedes<\/span>.\"<\/div>", "n": 3, "a": "myth-m12-042", "x": "e564fd0c", "en": "Troy: the goddess who chose a side. Athena was with the Greeks in the Trojan War. In the Iliad, Book 6, lines 297 to 311, there is a harsh scene: the Trojan women went to Athena's temple and placed their finest robe on the knees of the statue. And they prayed: Lady Athene, that dost guard our city, fairest among goddesses, break now the spear of Diomedes.", "i": 56}, {"t": "learn", "h": "<div class=\"u\">يعني: \"يا سيدة أثينا، حامية مدينتنا، أجمل الإلهات، اكسري رمح ديوميديس.\"<\/div><div class=\"u\">والجواب: \"<span class=\"en\">So spake she praying, but Pallas Athene denied the prayer<\/span>.\" يعني كده صلّت، لكن بالاس أثينا رفضت الدعاء.<\/div><div class=\"u\">ده مش موقف أخلاقي، ده موقف سياسي: الإلهة بتحمي مدينتها هي مش أي مدينة.<\/div>", "n": 3, "a": "myth-m12-043", "x": "44eeef3d", "en": "It means: lady Athena, guardian of our city, most beautiful of goddesses, break the spear of Diomedes. And the answer: So spake she praying, but Pallas Athene denied the prayer. So she prayed like this, but Pallas Athena refused the prayer. This is not a moral position, it is a political position: the goddess protects her own city, not any city.", "i": 57}, {"t": "mc", "h": "", "q": "مين اللي حوّلته مينيرفا لعنكبوت؟", "nq": 1, "opts": ["أراخني", "ميدوسا", "ميتيس"], "ans": 0, "why": "أراخني", "ex": ["صح.", "غلط: ميدوسا قصتها مختلفة.", "غلط: ميتيس أمها."], "i": 58}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Eumenides<\/span>، أثينا قالت إنها مع الأب. ليه؟", "nq": 1, "opts": ["لأن مفيش أم ولدتها، هي اتولدت من راس أبوها", "لأنها كانت بتكره الستات", "لأن أبوها أمرها"], "ans": 0, "why": "لأن مفيش أم ولدتها، هي اتولدت من راس أبوها", "ex": ["صح: ده نتيجة أسطورتها.", "غلط: القصة مش كده.", "غلط."], "i": 59}, {"t": "tf", "h": "", "q": "في الإلياذة 6، أثينا وافقت على دعاء الستات الطرواديات.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: النص بيقول إنها رفضت الدعاء.", "صح: هي رفضت."], "i": 60}, {"t": "section", "h": "7) الأسطورة في الشعر الإنجليزي 📜", "i": 61}, {"t": "learn", "h": "<div class=\"u\">شكسبير: اسم الإلهة كاستدعاء للإلهام ✨<\/div><div class=\"u\">في <span class=\"en\">Titus Andronicus<\/span>، الفصل الرابع، المشهد الأول، تقريباً سطر 66-67، ماركوس بيقول:<\/div><div class=\"u\">\"<span class=\"en\">Apollo, Pallas, Jove, or Mercury<\/span> / <span class=\"en\">Inspire me, that I may this treason find<\/span>.\"<\/div><div class=\"u\">يعني: أبولو أو بالاس أو جوف أو عطارد، ألهموني عشان أقدر أكتشف الخيانة دي.<\/div>", "n": 4, "a": "myth-m12-044", "x": "c81db2fb", "en": "Shakespeare: the goddess's name as a call for inspiration. In Titus Andronicus, Act 4, Scene 1, about lines 66 to 67, Marcus says: Apollo, Pallas, Jove, or Mercury, Inspire me, that I may this treason find. It means: Apollo, Pallas, Jove or Mercury, inspire me so I can discover this treason.", "i": 62}, {"t": "learn", "h": "<div class=\"u\">وفي <span class=\"en\">The Taming of the Shrew<\/span>، الفصل الأول، المشهد الأول، تقريباً سطر 85، لوسينتيو بيقول عن بيانكا: \"<span class=\"en\">Hark, Tranio, thou mayst hear Minerva speak<\/span>!\"<\/div><div class=\"u\">يعني: اسمع يا ترانيو، إنت بتسمع مينيرفا وهي بتتكلم!<\/div><div class=\"u\">شكسبير بيستخدم أسماء الإلهة كإشارات سريعة: بالاس للإلهام، ومينيرفا لواحدة بتتكلم بحكمة. وده <span class=\"en\">allusion<\/span> صريح بالاسم.<\/div>", "n": 3, "a": "myth-m12-045", "x": "27dcf40d", "en": "And in The Taming of the Shrew, Act 1, Scene 1, about line 85, Lucentio says about Bianca: Hark, Tranio, thou mayst hear Minerva speak! It means: listen, Tranio, you can hear Minerva speaking! Shakespeare uses the names of goddesses as quick signs: Pallas for inspiration, and Minerva for a woman who speaks wisely. This is an allusion with the name stated.", "i": 63}, {"t": "learn", "h": "<div class=\"u\">ميلتون، <span class=\"en\">Comus<\/span>: بيسأل عن درع الجورجون اللي لبسته مينيرفا:<\/div><div class=\"u\">\"<span class=\"en\">What was that snaky-headed Gorgon shield<\/span> / <span class=\"en\">That wise Minerva wore, unconquer'd Virgin<\/span>, / <span class=\"en\">Wherewith she freez'd her foes to congeal'd stone<\/span>, / <span class=\"en\">But rigid looks of Chaste austerity<\/span>\"<\/div><div class=\"u\">يعني: إيه الدرع ده اللي راسه تعابين، اللي لبسته مينيرفا الحكيمة، العذراء اللي ما اتغلبتش، وجمّدت بيه أعداءها حجر؟ كان نظرات صارمة من العفة الشديدة.<\/div>", "n": 3, "a": "myth-m12-046", "x": "1cfe3325", "en": "Milton, Comus: he asks about the Gorgon shield that Minerva wore: What was that snaky-headed Gorgon shield That wise Minerva wore, unconquer'd Virgin, Wherewith she freez'd her foes to congeal'd stone, But rigid looks of Chaste austerity. It means: what was this shield with a snake-covered head, which wise Minerva wore, the unconquered virgin, with which she froze her enemies to stone? It was the severe looks of strict chastity.", "i": 64}, {"t": "learn", "h": "<div class=\"u\">ميلتون بيسأل سؤال وبعدين بيجاوب: اللي بيجمّد الأعداء مش سحر، ده نظرة العفة الصارمة. يعني أسطورة بقت فكرة أخلاقية.<\/div><div class=\"u\">وقبلها بكام سطر ذكر أرتميس: \"<span class=\"en\">Hence had the huntress Dian her dread bow<\/span>, / <span class=\"en\">Fair silver-shafted Queen for ever chaste<\/span>\".<\/div><div class=\"u\">يعني الفصل اللي فات والفصل ده بيتقابلوا في نفس القصيدة: العفة سلاح. أرتميس بالقوس، وأثينا بالدرع.<\/div>", "n": 3, "a": "myth-m12-047", "x": "d327ae1d", "en": "Milton asks a question and then answers it: what freezes the enemies is not magic, it is the look of strict chastity. So a myth became a moral idea. A few lines before, he mentioned Artemis: Hence had the huntress Dian her dread bow, Fair silver-shafted Queen for ever chaste. So the last lesson and this lesson meet in the same poem: chastity is a weapon. Artemis with the bow, and Athena with the shield.", "i": 65}, {"t": "learn", "h": "<div class=\"u\">بوب، <span class=\"en\">The Dunciad<\/span>، الكتاب الأول، السطرين 9 و10:<\/div><div class=\"u\">\"<span class=\"en\">In eldest time, e'er mortals writ or read<\/span>, / <span class=\"en\">E'er Pallas issu'd from the Thund'rer's head<\/span>\"<\/div><div class=\"u\">يعني: في أقدم زمن، قبل ما البشر يكتبوا ويقروا، قبل ما بالاس تطلع من راس الراعد (زيوس).<\/div><div class=\"u\">بوب بيستخدم ميلاد أثينا كعلامة على \"أول الزمن\". والسخرية حلوة: القصيدة كلها عن الغباء، وبتبدأ من ولادة الحكمة.<\/div>", "n": 4, "a": "myth-m12-048", "x": "54d666c0", "en": "Pope, The Dunciad, Book 1, lines 9 and 10: In eldest time, e'er mortals writ or read, E'er Pallas issu'd from the Thund'rer's head. It means: in the oldest time, before humans wrote and read, before Pallas came out of the head of the Thunderer (Zeus). Pope uses the birth of Athena as a sign of the beginning of time. And the irony is nice: the whole poem is about stupidity, and it starts from the birth of wisdom.", "i": 66}, {"t": "learn", "h": "<div class=\"u\">كيتس، سونيتة \"<span class=\"en\">On Seeing the Elgin Marbles<\/span>\":<\/div><div class=\"u\">\"<span class=\"en\">My spirit is too weak<\/span>—<span class=\"en\">mortality<\/span> / <span class=\"en\">Weighs heavily on me like unwilling sleep<\/span>\"<\/div><div class=\"u\">يعني: روحي ضعيفة جداً، والفناء بيتقل عليّ زي نوم مش عايزه.<\/div><div class=\"u\">كيتس كتبها بعد ما شاف رخام البارثينون في المتحف البريطاني. والقصيدة ما بتذكرش أثينا بالاسم، بس كلها عن أثر فنها عليه: حس إنه صغير وضعيف قدام حاجة عمرها ألفين سنة.<\/div>", "n": 4, "a": "myth-m12-049", "x": "ea321d0d", "en": "Keats, the sonnet On Seeing the Elgin Marbles: My spirit is too weak—mortality Weighs heavily on me like unwilling sleep. It means: my spirit is too weak, and mortality weighs on me like an unwilling sleep. Keats wrote it after seeing the Parthenon marbles in the British Museum. The poem does not mention Athena by name, but it is all about the effect of her art on him: he felt small and weak before something two thousand years old.", "i": 67}, {"t": "mc", "h": "", "q": "إيه اللي بيقوله ميلتون عن درع مينيرفا في <span class=\"en\">Comus<\/span>؟", "nq": 1, "opts": ["اللي بيجمّد الأعداء هو نظرة العفة الصارمة", "الدرع كان من دهب", "الدرع كان لأرتميس"], "ans": 0, "why": "اللي بيجمّد الأعداء هو نظرة العفة الصارمة", "ex": ["صح: أسطورة بقت فكرة أخلاقية.", "غلط.", "غلط: الدرع بتاع مينيرفا."], "i": 68}, {"t": "tf", "h": "", "q": "بوب في <span class=\"en\">The Dunciad<\/span> استخدم ميلاد أثينا كعلامة على أول الزمن.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح.", "غلط: ده فعلاً اللي عمله."], "i": 69}, {"t": "mc", "h": "", "q": "مين قال: <span class=\"en\">Hark, Tranio, thou mayst hear Minerva speak<\/span>؟", "nq": 1, "opts": ["لوسينتيو في <span class=\"en\">The Taming of the Shrew<\/span>", "ماركوس في <span class=\"en\">Titus Andronicus<\/span>", "ميلتون في <span class=\"en\">Comus<\/span>"], "ans": 0, "why": "لوسينتيو في <span class=\"en\">The Taming of the Shrew<\/span>", "ex": ["صح.", "غلط: ماركوس قال سطر تاني.", "غلط."], "i": 70}, {"t": "section", "h": "8) أخطاء شائعة ⚠️", "i": 71}, {"t": "learn", "h": "<div class=\"u\">\"أثينا إلهة الحرب\". نص صح. هي إلهة الحرب العاقلة والدفاعية. الحرب الهمجية إلهها آريس.<\/div><div class=\"u\">\"أثينا اتولدت وهيفايستوس شق الراس بفأس في كل النسخ\". لأ. هسيود ما ذكرش لا هيفايستوس ولا الفأس ولا السلاح. والنسخة الشعبية خليط متأخر.<\/div>", "n": 2, "a": "myth-m12-050", "x": "7a017128", "en": "Athena is the goddess of war. Half right. She is the goddess of wise and defensive war. The god of savage war is Ares. Athena was born and Hephaestus split the head with an axe in all versions. No. Hesiod mentions neither Hephaestus nor the axe nor the weapons. And the popular version is a later mix.", "i": 72}, {"t": "learn", "h": "<div class=\"u\">\"مينيرفا مجرد ترجمة لأثينا\". لأ. مينيرفا اسم روماني قديم، وأصله من كلمة معناها \"ذكي، فاهم\"، من جذر معناه \"يفكر\".<\/div><div class=\"u\">\"أثينا وأرتميس نفس الحاجة\". لأ. الاتنين عذارى، بس واحدة للمدينة (النظام والقانون والحرف)، وواحدة للغابة (الحدود والصيد والوحدة). وبيظهروا في نفس القصيدة عند ميلتون، وكل واحدة بشغلها.<\/div>", "n": 2, "a": "myth-m12-051", "x": "09162193", "en": "Minerva is only a translation of Athena. No. Minerva is an old Roman name, from a word meaning clever or understanding, from a root meaning to think. Athena and Artemis are the same thing. No. Both are virgins, but one is for the city (order, law and crafts) and one for the forest (borders, hunting and solitude). They appear in the same poem in Milton, each with her own work.", "i": 73}, {"t": "section", "h": "9) كلمات هتقع لك في الشعر 📖", "i": 74}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">wisdom<\/span> = حكمة<\/div><div class=\"li\"><span class=\"en\">counsel<\/span> = مشورة<\/div><div class=\"li\"><span class=\"en\">cunning<\/span> = حيلة / ذكاء ماكر<\/div><div class=\"li\"><span class=\"en\">craft<\/span> = حرفة (وكمان: مكر)<\/div><div class=\"li\"><span class=\"en\">loom<\/span> = نول النسيج<\/div><div class=\"li\"><span class=\"en\">weave<\/span> = ينسج<\/div><div class=\"li\"><span class=\"en\">shield<\/span> = درع<\/div><div class=\"li\"><span class=\"en\">aegis<\/span> = درع زيوس اللي بتحمله أثينا، ومنها التعبير <span class=\"en\">under the aegis of<\/span> يعني \"تحت حماية\"<\/div><div class=\"li\"><span class=\"en\">helmet<\/span> = خوذة<\/div><div class=\"li\"><span class=\"en\">spear<\/span> = رمح<\/div>", "n": 10, "a": "myth-m12-052", "x": "4701aabb", "en": "Wisdom. Counsel. Cunning, meaning clever trickery. Craft, meaning skill and also slyness. Loom, the weaving frame. Weave. Shield. Aegis, the shield of Zeus that Athena carries, and from it the expression under the aegis of, meaning under the protection of. Helmet. Spear.", "i": 75}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">owl<\/span> = بومة<\/div><div class=\"li\"><span class=\"en\">olive<\/span> = زيتون<\/div><div class=\"li\"><span class=\"en\">virgin<\/span> / <span class=\"en\">maiden<\/span> = عذراء / بنت<\/div><div class=\"li\"><span class=\"en\">mentor<\/span> = مرشد (من اسم <span class=\"en\">Mentor<\/span> في الأوديسة)<\/div><div class=\"li\"><span class=\"en\">strategy<\/span> = استراتيجية<\/div>", "n": 5, "a": "myth-m12-053", "x": "b0e7131f", "en": "Owl. Olive. Virgin or maiden. Mentor, a guide, from the name Mentor in the Odyssey. Strategy.", "i": 76}, {"t": "mc", "h": "", "q": "إيه معنى التعبير <span class=\"en\">under the aegis of<\/span>؟", "nq": 1, "opts": ["تحت حماية", "ضد", "بعيد عن"], "ans": 0, "why": "تحت حماية", "ex": ["صح.", "غلط.", "غلط."], "i": 77}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\">craft<\/span> في الشعر؟", "nq": 1, "opts": ["حرفة، وأحياناً مكر", "سفينة", "درع"], "ans": 0, "why": "حرفة، وأحياناً مكر", "ex": ["صح.", "غلط.", "غلط."], "i": 78}, {"t": "section", "h": "10) كويز سريع 🧠", "i": 79}, {"t": "learn", "h": "<div class=\"u\">راجع معانا:<\/div><div class=\"li\">مين أم أثينا؟ ميتيس، ومعناها الحكمة.<\/div><div class=\"li\">اتولدت من فين؟ من راس زيوس، بعد ما بلع ميتيس.<\/div><div class=\"li\">اسمها عند الرومان إيه؟ مينيرفا.<\/div><div class=\"li\">في الإلياذة 6، الستات الطرواديات حطّوا إيه على ركبتي تمثال أثينا؟ أفخم روب عندهم.<\/div><div class=\"li\">وفي <span class=\"en\">Eumenides<\/span>، قالت إيه عن أمها؟ إن مفيش أم ولدتها.<\/div>", "n": 6, "a": "myth-m12-054", "x": "a280d4e9", "en": "Review with us. Who is Athena's mother? Metis, whose name means wisdom. Where was she born from? From the head of Zeus, after he swallowed Metis. What is her name among the Romans? Minerva. In Iliad 6, what did the Trojan women place on the knees of Athena's statue? Their finest robe. And in Eumenides, what did she say about her mother? That no mother bore her.", "i": 80}, {"t": "mc", "h": "", "q": "مين أم أثينا؟", "nq": 1, "opts": ["ميتيس", "هيرا", "ليتو"], "ans": 0, "why": "ميتيس", "ex": ["صح: واسمها معناه الحكمة.", "غلط: هيرا زوجة زيوس.", "غلط: ليتو أم أبولو وأرتميس."], "i": 81}, {"t": "mc", "h": "", "q": "اسم أثينا عند الرومان إيه؟", "nq": 1, "opts": ["مينيرفا", "ديانا", "فينوس"], "ans": 0, "why": "مينيرفا", "ex": ["صح.", "غلط: ديانا هي أرتميس.", "غلط: فينوس أفروديت."], "i": 82}, {"t": "section", "h": "الخلاصة", "i": 83}, {"t": "learn", "h": "<div class=\"u\">الخلاصة:<\/div><div class=\"li\">أثينا (مينيرفا) إلهة الحكمة والمدينة والحرف والحرب العاقلة، واتولدت من راس زيوس بعد ما بلع أمها ميتيس.<\/div><div class=\"li\">هسيود ما ذكرش الفأس ولا السلاح. دول جم من مصادر أحدث.<\/div><div class=\"li\">البارثينون بيحكي أسطورتها بالحجر، والمدينة اختارت الزيتون.<\/div><div class=\"li\">والشعراء، من شكسبير لكيتس، استدعوا اسمها أو أثرها.<\/div>", "n": 5, "a": "myth-m12-055", "x": "de699114", "en": "In short: Athena, or Minerva, is the goddess of wisdom, the city, crafts and wise war, and she was born from the head of Zeus after he swallowed her mother Metis. Hesiod does not mention the axe or the weapons, which came from later sources. The Parthenon tells her myth in stone, and the city chose the olive. And poets, from Shakespeare to Keats, called on her name or her effect.", "i": 84}, {"t": "learn", "h": "<div class=\"u\">مهمة صغيرة ✍️<\/div><div class=\"li\">اقرا جملة أثينا في <span class=\"en\">Eumenides<\/span> بصوت عالي: \"<span class=\"en\">there was no mother who gave me birth<\/span>\". حس بالقسوة اللي فيها.<\/div><div class=\"li\">فكّر: مين في حياتك \"مرشد\" بالمعنى اللي شفناه في الأوديسة؟<\/div><div class=\"li\">وفكّر: لو مدينتك كانت هتختار هدية من إله، هتختار الزيتون ولا الحصان؟ وليه؟<\/div>", "n": 4, "a": "myth-m12-056", "x": "a1ad4a5a", "en": "A small task. Read Athena's sentence in Eumenides out loud: there was no mother who gave me birth. Feel the harshness in it. Think: who in your life is a mentor in the sense we saw in the Odyssey? And think: if your city were to choose a gift from a god, would you choose the olive or the horse? And why?", "i": 85}, {"t": "end", "h": "", "teaser": "الدرس الجاي (<span class=\"en\">M13<\/span>): أفروديت وفينوس، إلهة الحب والجمال. والتلات إلهات أرتميس وأثينا وأفروديت كل واحدة بتمثل حاجة مختلفة: البرية والعقل والرغبة.", "extra": "", "i": 86}];</script>
