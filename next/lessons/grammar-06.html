<script>window.LESSON_ID="grammar-06";window.STEPS=[{"t": "section", "h": "وحدات جوا وحدات", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في الدرس السادس، وده آخر درس في الوحدة الأولى. خد الجملة دي: <span class=\"en\">The cat sleeps</span>. فيها كلمتين: <span class=\"en\">cat</span> و<span class=\"en\">sleeps</span>. وفيها عبارة: <span class=\"en\">the cat</span>. وفيها <span class=\"en\">clause</span>، جملة صغرى. وفيها جملة كاملة.</div>", "n": 1, "i": 1, "a": "grammar-06-001", "x": "cb1b544a"}, {"t": "learn", "h": "<div class=\"u\">اللغة بتتبني من وحدات، كل وحدة جوا اللي أكبر منها. صوت، بعدين مورفيم، بعدين كلمة، بعدين عبارة، بعدين <span class=\"en\">clause</span>، بعدين جملة. <span class=\"en\">In simple English</span>: <span class=\"en\">small parts make bigger parts</span>.</div>", "n": 1, "i": 2, "a": "grammar-06-002", "x": "bf04e6cb"}, {"t": "mc", "q": "إيه الترتيب الصح من الأصغر للأكبر؟", "opts": ["<span class=\"en\">word</span>, <span class=\"en\">phrase</span>, <span class=\"en\">clause</span>, <span class=\"en\">sentence</span>", "<span class=\"en\">sentence</span>, <span class=\"en\">clause</span>, <span class=\"en\">phrase</span>, <span class=\"en\">word</span>", "<span class=\"en\">phrase</span>, <span class=\"en\">word</span>, <span class=\"en\">sentence</span>, <span class=\"en\">clause</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">small parts make bigger parts</span>.", "ex": ["صح: كلمة ثم عبارة ثم <span class=\"en\">clause</span> ثم جملة.", "غلط: ده الترتيب العكسي.", "غلط: الكلمة أصغر من العبارة."], "n": 1, "i": 3, "h": ""}, {"t": "section", "h": "الوحدات واحدة واحدة", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الكلمة، <span class=\"en\">word</span>: أصغر وحدة بتقدر تقولها لوحدها وليها معنى. زي <span class=\"en\">cat</span> و<span class=\"en\">run</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a word is a small piece of language that can stand alone</span>. العبارة، <span class=\"en\">phrase</span>: مجموعة كلمات بتشتغل كوحدة واحدة حوالين كلمة رئيسية. زي <span class=\"en\">the big cat</span> و<span class=\"en\">in the garden</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a phrase is a group of words that work together</span>.</div>", "n": 1, "i": 5, "a": "grammar-06-003", "x": "8dfc6b56"}, {"t": "learn", "h": "<div class=\"u\">الجملة الصغرى، <span class=\"en\">clause</span>: فيها فاعل وفعل، وممكن تبقى جزء من جملة أكبر. زي <span class=\"en\">when he arrived</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a clause has a subject and a verb</span>. الجملة، <span class=\"en\">sentence</span>: وحدة نحوية كاملة. زي <span class=\"en\">He arrived late</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a sentence is a complete grammar unit</span>.</div>", "n": 1, "i": 6, "a": "grammar-06-004", "x": "525785b0"}, {"t": "learn", "h": "<div class=\"u\">والملفوظ، <span class=\"en\">utterance</span>: كلام فعلي بيتقال في موقف معين. ممكن يكون كلمة واحدة، زي <span class=\"en\">Water</span>! <span class=\"en\">In simple English</span>: <span class=\"en\">an utterance is what someone really says in a real moment</span>.</div>", "n": 1, "i": 7, "a": "grammar-06-005", "x": "4401fe32"}, {"t": "section", "h": "ليه الكلمة مش بسيطة", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">كلمة <span class=\"en\">word</span> ليها تلات معاني على الأقل. الأول الكلمة المكتوبة، <span class=\"en\">orthographic word</span>: اللي بين مسافتين. <span class=\"en\">ice cream</span> مكتوبة كلمتين، بس هي وحدة معنى. التاني الكلمة النطقية، <span class=\"en\">phonological word</span>: وحدة نطق واحدة، زي <span class=\"en\">gonna</span>. والتالت الكلمة المعجمية، <span class=\"en\">lexeme</span>: <span class=\"en\">run</span> و<span class=\"en\">runs</span> و<span class=\"en\">ran</span> و<span class=\"en\">running</span> أشكال لكلمة واحدة في القاموس.</div>", "n": 1, "i": 9, "a": "grammar-06-006", "x": "27bb970a"}, {"t": "mc", "q": "«<span class=\"en\">ice cream</span>» مكتوبة كلمتين. هي:", "opts": ["كلمتين دايمًا", "وحدة معنى واحدة", "مش كلمة"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the written space is not a perfect word test</span>.", "ex": ["غلط: المسافة مش مقياس نهائي.", "صح: معناها وحدة واحدة.", "غلط: هي وحدة معجمية."], "n": 1, "i": 10, "h": ""}, {"t": "tf", "q": "الكلمة المكتوبة هي دايمًا وحدة المعنى.", "ans": false, "why": "غلط: <span class=\"en\">ice cream</span> مثال.", "ex": ["غلط: المسافة مش دايمًا بتحدد الكلمة.", "صح، الجملة غلط: فيه <span class=\"en\">ice cream</span>."], "n": 1, "i": 11, "h": ""}, {"t": "tf", "q": "<span class=\"en\">run</span> و<span class=\"en\">runs</span> و<span class=\"en\">ran</span> أشكال لوحدة معجمية واحدة.", "ans": true, "why": "صح: دي <span class=\"en\">lexeme</span> واحدة.", "ex": ["صح: <span class=\"en\">lexeme</span> واحدة بأشكال مختلفة.", "غلط: هما نفس الكلمة المعجمية."], "n": 1, "i": 12, "h": ""}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">In simple English</span>: <span class=\"en\">the word word can mean what you write</span>, <span class=\"en\">what you say</span>, <span class=\"en\">or the dictionary item</span>.</div>", "n": 1, "i": 13, "a": "grammar-06-007", "x": "84c04727"}, {"t": "section", "h": "جملة ولا ملفوظ", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Could you close the window</span> جملة كاملة. لكن <span class=\"en\">Window</span>! لوحدها مش جملة نحوية كاملة، ومع كده ملفوظ مفهوم في الموقف. <span class=\"en\">In simple English</span>: <span class=\"en\">a sentence is about grammar</span>, <span class=\"en\">and an utterance is about real speech</span>.</div>", "n": 1, "i": 15, "a": "grammar-06-008", "x": "fd9fe796"}, {"t": "mc", "q": "«<span class=\"en\">Water</span>!» لوحدها هي:", "opts": ["<span class=\"en\">sentence</span> نحوية كاملة", "<span class=\"en\">utterance</span> مفهومة في الموقف", "<span class=\"en\">clause</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it is real speech</span>, <span class=\"en\">not a full grammar sentence</span>.", "ex": ["غلط: ناقصها بناء الجملة الكامل.", "صح: ملفوظ في موقف.", "غلط: مفيش فاعل وفعل."], "n": 1, "i": 16, "h": ""}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">الشكل، <span class=\"en\">form</span>: كل وحدة ليها شكل، كلمة أو عبارة أو <span class=\"en\">clause</span>. الوظيفة، <span class=\"en\">function</span>: العبارة بتشتغل فاعل أو مفعول. المعنى، <span class=\"en\">meaning</span>: الجملة بتعبر عن فكرة كاملة. والاستعمال، <span class=\"en\">use</span>: الملفوظ بيتقال في موقف.</div>", "n": 1, "i": 18, "a": "grammar-06-009", "x": "6e2984d0"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Bloomfield</span> سنة 1933 عرّف الكلمة بإنها <span class=\"en\">minimum free form</span>: أصغر شكل يقدر يقف لوحده. لكن <span class=\"en\">Haspelmath</span> سنة 2011 بيبيّن إن من الصعب تحديد الكلمة بتعريف واحد صالح لكل اللغات. <span class=\"en\">In simple English</span>: <span class=\"en\">linguists still do not agree on one perfect definition of word</span>.</div>", "n": 1, "i": 20, "a": "grammar-06-010", "x": "c409b33a"}, {"t": "learn", "h": "<div class=\"u\">و<span class=\"en\">Lyons</span> عرّف الجملة بإنها أكبر وحدة في التحليل النحوي. اللي فوقها، زي الفقرة، بيتدرس في تحليل الخطاب. <span class=\"en\">In simple English</span>: <span class=\"en\">a sentence is the biggest grammar unit</span>.</div>", "n": 1, "i": 21, "a": "grammar-06-011", "x": "6e0f34fa"}, {"t": "learn", "h": "<div class=\"u\">والـ <span class=\"en\">clause</span> هي الوحدة الأساسية للتحليل، ونوعين. <span class=\"en\">finite clause</span> فيها فعل بزمن، زي <span class=\"en\">He left</span>. و<span class=\"en\">non-finite clause</span> من غير زمن، زي <span class=\"en\">to leave</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a finite clause shows tense</span>, <span class=\"en\">and a non-finite clause does not</span>.</div>", "n": 1, "i": 22, "a": "grammar-06-012", "x": "98f1ba08"}, {"t": "mc", "q": "«<span class=\"en\">to leave</span>» دي:", "opts": ["<span class=\"en\">finite clause</span>", "<span class=\"en\">non-finite</span>", "<span class=\"en\">sentence</span> كاملة"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">no tense</span>, <span class=\"en\">so non-finite</span>.", "ex": ["غلط: مفيش فعل بزمن.", "صح: <span class=\"en\">non-finite</span> لأنها من غير زمن.", "غلط: مش جملة كاملة."], "n": 1, "i": 23, "h": ""}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. <span class=\"en\">Word</span>: كلمة. <span class=\"en\">In simple English</span>: <span class=\"en\">a small unit that can stand alone</span>. <span class=\"en\">Morpheme</span>: مورفيم، أصغر وحدة بمعنى. <span class=\"en\">In simple English</span>: <span class=\"en\">the smallest unit with meaning</span>. <span class=\"en\">Lexeme</span>: وحدة معجمية. <span class=\"en\">In simple English</span>: <span class=\"en\">one dictionary item</span>.</div>", "n": 1, "i": 25, "a": "grammar-06-013", "x": "8dd79446"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Phrase</span>: عبارة. <span class=\"en\">In simple English</span>: <span class=\"en\">a group of words</span>. <span class=\"en\">Clause</span>: جملة صغرى. <span class=\"en\">In simple English</span>: <span class=\"en\">it has a subject and a verb</span>. <span class=\"en\">Finite clause</span>: جملة بزمن. <span class=\"en\">Non-finite clause</span>: جملة من غير زمن.</div>", "n": 1, "i": 26, "a": "grammar-06-014", "x": "46c8535f"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Sentence</span>: جملة. <span class=\"en\">In simple English</span>: <span class=\"en\">a complete grammar unit</span>. <span class=\"en\">Utterance</span>: ملفوظ. <span class=\"en\">In simple English</span>: <span class=\"en\">what is said in a real moment</span>. <span class=\"en\">Orthographic word</span>: كلمة مكتوبة. <span class=\"en\">Phonological word</span>: كلمة نطقية. <span class=\"en\">Constituent</span>: مكوّن، جزء من وحدة أكبر.</div>", "n": 1, "i": 27, "a": "grammar-06-015", "x": "e5bedb54"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: اللغة وحدات جوا بعض: كلمة وعبارة و<span class=\"en\">clause</span> وجملة. اتنين: الكلمة ليها تلات معاني، مكتوبة ونطقية ومعجمية. تلاتة: الجملة وحدة نحوية، والملفوظ كلام في موقف. أربعة: الـ <span class=\"en\">clause</span> الأساس، <span class=\"en\">finite</span> أو <span class=\"en\">non-finite</span>. <span class=\"en\">In short</span>: <span class=\"en\">language units sit inside each other</span>. الدرس الجاي: وحدة جديدة، الكلمات، وبنبدأ بأنواع الكلمات.</div>", "n": 1, "i": 29, "a": "grammar-06-016", "x": "d568c83b"}, {"t": "section", "h": "الكويز", "n": 1, "i": 30}, {"t": "recall", "q": "اشرح الفرق بين <span class=\"en\">finite</span> و <span class=\"en\">non-finite clause</span> بمثال.", "a": "<span class=\"en\">finite</span> فيها فعل بزمن: <span class=\"en\">He left</span>. <span class=\"en\">non-finite</span> من غير زمن: <span class=\"en\">to leave</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">finite shows tense</span>, <span class=\"en\">non-finite does not</span>.", "n": 1, "i": 31, "h": ""}, {"t": "recall", "q": "اذكر المعاني التلاتة لكلمة <span class=\"en\">word</span>.", "a": "مكتوبة (<span class=\"en\">orthographic</span>)، نطقية (<span class=\"en\">phonological</span>)، معجمية (<span class=\"en\">lexeme</span>). <span class=\"en\">In simple English</span>: <span class=\"en\">what you write</span>, <span class=\"en\">what you say</span>, <span class=\"en\">the dictionary item</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "اشرح الفرق بين <span class=\"en\">sentence</span> و <span class=\"en\">utterance</span> بمثال (٣-٤ جمل).", "key": "grammar-06:1", "a": "الجملة وحدة نحوية كاملة، زي <span class=\"en\">He arrived late</span>. الملفوظ كلام فعلي في موقف، وممكن يبقى كلمة، زي <span class=\"en\">Window</span>!. ففي الموقف الكلمة دي مفهومة، بس مش جملة نحوية كاملة. <span class=\"en\">In simple English</span>: <span class=\"en\">a sentence is grammar</span>, <span class=\"en\">an utterance is real speech</span>.", "n": 1, "i": 33, "h": ""}, {"t": "write", "q": "ناقش ليه تعريف «الكلمة» صعب (٤-٥ جمل).", "key": "grammar-06:2", "a": "الكلمة ليها معاني: مكتوبة ونطقية ومعجمية، وكل واحدة بتدي حدود مختلفة، زي <span class=\"en\">ice cream</span> و<span class=\"en\">gonna</span>. <span class=\"en\">Bloomfield</span> عرّفها بـ <span class=\"en\">minimum free form</span>. لكن <span class=\"en\">Haspelmath</span> بيبيّن إن مفيش تعريف واحد صالح لكل اللغات. <span class=\"en\">In simple English</span>: <span class=\"en\">there is no one perfect definition</span>.", "n": 1, "i": 34, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: وحدة الكلمات، وأنواع الكلمات.</div><div class=\"u\">هنعرف إزاي نصنف الكلمات: اسم وفعل وصفة وغيرهم.</div>", "extra": "المصادر: Bloomfield, Language (1933); Haspelmath (2011); Lyons, Introduction to Theoretical Linguistics.", "i": 35}];</script>
