<h1>الدرس M13: أفروديت وفينوس — إلهة الحب والجمال</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس M13</span><span class="tag"><span class="em">🏛️</span> كورس الميثولوجيا</span></div>

<script>window.LESSON_ID="myth-m13";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"u\">فيه إلهة في اليونان اتولدت من البحر. مش من بطن أم، ولا من راس أب. من الزبد الأبيض اللي طلع على سطح المية.<\/div><div class=\"u\">والحكاية اللي قبلها بشعة: حد قطع أعضاء أبوه ورماهم في البحر. ومن الجرح ده، ومن الزبد، طلعت أجمل إلهة في الأسطورة كلها.<\/div><div class=\"u\">يعني أول درس في الفصل ده: الحب في الميثولوجيا اليونانية مش ناعم. الحب بيطلع من جرح، وبيبدأ من عنف، وبيبقى قوة ماحدش يقدر يقاومها. حتى الآلهة نفسها.<\/div>", "n": 3, "a": "myth-m13-001", "x": "23c79f79", "en": "There is a goddess in Greece who was born from the sea. Not from a mother's womb or a father's head, but from the white foam on the water. And the story before it is brutal: someone cut off his father's genitals and threw them into the sea.", "i": 1}, {"t": "learn", "h": "<div class=\"u\">دي أفروديت (<span class=\"en\">Aphrodite<\/span>)، اللي الرومان سموها فينوس (<span class=\"en\">Venus<\/span>). والنهارده هنقابل معاها ابنها المشهور: إيروس (<span class=\"en\">Eros<\/span>)، أو كيوبيد (<span class=\"en\">Cupid<\/span>) عند الرومان.<\/div><div class=\"u\">وفيه حاجة تحفة هنكتشفها في الفصل ده: الترنيمة الهوميرية لأفروديت بتقول بالنص إن فيه تلات إلهات أفروديت مابتعرفش تتحكم فيهم: أثينا، وأرتميس، وهيستيا. يعني الفصل ده بيربط الفصلين اللي فاتوا بالخيط الرسمي: الحب نفسه بيعترف إن فيه حاجات بره سلطته.<\/div>", "n": 2, "a": "myth-m13-002", "x": "f5669001", "en": "This is Aphrodite, whom the Romans called Venus. Today we also meet her famous son Eros, or Cupid for the Romans. And the Homeric Hymn says there are three goddesses Aphrodite cannot control: Athena, Artemis and Hestia.", "i": 2}, {"t": "learn", "h": "<div class=\"u\">📍 إحنا فين في الحكاية؟<\/div><div class=\"li\">في <span class=\"en\">M11<\/span> خدنا أرتميس: البرية، والحدود، والصيد.<\/div><div class=\"li\">في <span class=\"en\">M12<\/span> خدنا أثينا: المدينة، والعقل، والقانون.<\/div><div class=\"li\">والنهارده أفروديت: الرغبة، والجمال، والقوة اللي بتحرّك كل حاجة حية.<\/div><div class=\"li\">والتلاتة مع بعض بيمثلوا تلات قوى في الإنسان: الغريزة (أرتميس)، والعقل (أثينا)، والرغبة (أفروديت).<\/div><div class=\"li\">وهي هتفتح لنا أبواب كتير: فينوس وأدونيس (<span class=\"en\">M31<\/span>)، كيوبيد وسايكي (<span class=\"en\">M30<\/span>)، هيلين وطروادة (<span class=\"en\">M66<\/span>)، إينياس والإنيد (<span class=\"en\">M76<\/span>)، وأفروديت في تاريخ الشعر الإنجليزي (<span class=\"en\">M109<\/span> و<span class=\"en\">M110<\/span>).<\/div>", "n": 6, "a": "myth-m13-003", "x": "d81c23d9", "en": "Where are we in the story? M11 Artemis (wild, borders), M12 Athena (city, reason, law), today Aphrodite (desire, beauty, the force that moves every living thing). Instinct, reason, desire. She opens doors to Venus and Adonis, Cupid and Psyche, Helen and Troy, Aeneas and the Aeneid, and Aphrodite in English poetry.", "i": 3}, {"t": "section", "h": "النقطة 1: مين أفروديت؟ البطاقة الأساسية", "i": 4}, {"t": "learn", "h": "<div class=\"u\">الاسم.<\/div><div class=\"li\">أفروديت يوناني، وفينوس روماني.<\/div><div class=\"li\">والإغريق نفسهم فسّروا اسم أفروديت من كلمة <span class=\"en\">aphros<\/span>، يعني \"زبد البحر\"، لأنها اتولدت من الزبد.<\/div><div class=\"li\">بس فيه حاجة مهمة: الاسم على الأرجح مش يوناني أصلاً. عالم اللغة بهيكس (<span class=\"en\">Beekes<\/span>) بيقول إن الإلهة نفسها أصلها شرقي، والاسم غالباً جاي من الشرق، ويمكن دخل اليونانية عن طريق لغة تانية، وأقرب احتمال إنه جاي من الفينيقيين في قبرص.<\/div>", "n": 4, "a": "myth-m13-004", "x": "d42980a5", "en": "The name: Aphrodite is Greek, Venus is Roman. The Greeks explained Aphrodite from aphros, sea foam, because she was born from foam. But the name is probably not Greek originally: the linguist Beekes says the goddess herself is of eastern origin, probably through Phoenicians in Cyprus.", "i": 5}, {"t": "mc", "h": "", "q": "الإغريق فسّروا اسم أفروديت من كلمة <span class=\"en\">aphros<\/span>، معناها إيه؟", "nq": 1, "opts": ["زبد البحر", "نار", "ضحك"], "ans": 0, "why": "زبد البحر", "ex": ["صح: لأنها اتولدت من الزبد.", "غلط: النار مش هي.", "غلط: <span class=\"en\">philommeides<\/span> هي اللي معناها محبة الضحك."], "i": 6}, {"t": "learn", "h": "<div class=\"li\">يعني الإغريق عملوا نفس اللي عملناه في الفصل اللي فات: خدوا إلهة من حضارة أقدم، وحطوا لها حكاية تشرح اسمها.<\/div><div class=\"li\">وفينوس اسمها من كلمة لاتينية معناها \"حب، رغبة، جمال\"، من جذر هندو-أوروبي *<span class=\"en\">wen-<\/span> يعني \"يرغب، يسعى\".<\/div>", "n": 2, "a": "myth-m13-005", "x": "55de9cd1", "en": "So the Greeks did what we saw last lesson: took a goddess from an older civilisation and gave her a story that explains her name. Venus is a Latin word meaning love, desire, beauty, from an Indo-European root meaning to desire.", "i": 7}, {"t": "learn", "h": "<div class=\"li\">وملحوظة لطيفة: فينوس الرومانية كانت في الأصل إلهة أقل شأناً، يعني الرومان ما كانوش بيعتبروها من كبار الآلهة، وبعد ما اتوحّدت مع أفروديت اليونانية كبرت. الآلهة كمان بتكبر بالشغل.<\/div>", "n": 1, "a": "myth-m13-006", "x": "c253082f", "en": "A nice note: Roman Venus was originally a lesser goddess, not one of the great ones, and she grew after being identified with Greek Aphrodite. Gods grow by work too.", "i": 8}, {"t": "learn", "h": "<div class=\"u\">العيلة، وهنا مشكلة.<\/div><div class=\"li\">في نسخة هسيود: أفروديت مالهاش أم ولا أب بالمعنى العادي. هي بنت قطع من جسد أورانوس (السماء). (هنحكيها كاملة.)<\/div><div class=\"li\">في نسخة هوميروس: هي بنت زيوس وديوني (<span class=\"en\">Dione<\/span>). (الإلياذة 5.312 و5.370-371، وده مذكور في حواشي ترجمة <span class=\"en\">Symposium<\/span>)<\/div><div class=\"li\">والنسختين مش متفقين، وده طبيعي. الأسطورة ليها نسخ، زي ما اتعلمنا من أول فصل.<\/div>", "n": 4, "a": "myth-m13-007", "x": "dc91f5e8", "en": "Family, a problem: in Hesiod, Aphrodite has no ordinary mother or father, she comes from the parts of Uranus (the sky). In Homer, she is the daughter of Zeus and Dione. Two versions, and that is normal.", "i": 9}, {"t": "mc", "h": "", "q": "مين أبو أفروديت عند هوميروس؟", "nq": 1, "opts": ["زيوس (مع ديوني)", "أورانوس", "كرونوس"], "ans": 0, "why": "زيوس (مع ديوني)", "ex": ["صح: بنت زيوس وديوني.", "غلط: أورانوس عند هسيود.", "غلط: كرونوس هو اللي قطع."], "i": 10}, {"t": "learn", "h": "<div class=\"u\">ألقابها.<\/div><div class=\"li\"><span class=\"en\">Cytherea<\/span>: من جزيرة سيثيرا (<span class=\"en\">Cythera<\/span>).<\/div><div class=\"li\"><span class=\"en\">Cypris<\/span> / <span class=\"en\">Cyprogenes<\/span>: من قبرص (<span class=\"en\">Cyprus<\/span>)، لأنها طلعت على شطها.<\/div><div class=\"li\"><span class=\"en\">Aphrogeneia<\/span>: \"المولودة من الزبد\".<\/div><div class=\"li\"><span class=\"en\">philommeides<\/span>: \"محبة الضحك\". ودي صفة بتتكرر معاها كتير في هوميروس.<\/div>", "n": 5, "a": "myth-m13-008", "x": "86e4fe15", "en": "Her epithets: Cytherea from the island Cythera; Cypris from Cyprus; Aphrogeneia, born of foam; philommeides, laughter-loving, a common Homeric epithet.", "i": 11}, {"t": "learn", "h": "<div class=\"li\">وملحوظة أمانة علمية حلوة: في مخطوطات هسيود، اللقب مكتوب <span class=\"en\">philommedes<\/span>، يعني \"محبة الأعضاء\"، وده مقصود بيه إنها طلعت من أعضاء أورانوس. والمحقّقين بيقولوا إن دي غالباً تحريف لكلمة <span class=\"en\">philommeides<\/span>، \"محبة الضحك\".<\/div><div class=\"li\">يعني عندنا لقبين: واحد وقح ومقصود، وواحد لطيف، والنسخ مختلفة. وده بيوريك إن النقل النصي نفسه فيه حكاية.<\/div>", "n": 2, "a": "myth-m13-009", "x": "c8de1c2d", "en": "An honest scholarly note: in Hesiod's manuscripts the epithet is written philommedes, member-loving, referring to her birth, and editors think it is probably a corruption of philommeides. So there is a rude, deliberate epithet and a gentle one; even textual transmission has a story.", "i": 12}, {"t": "section", "h": "النقطة 2: قصة الميلاد: من الجرح للجمال", "i": 13}, {"t": "learn", "h": "<div class=\"u\">المشهد الأول، وهو بشع.<\/div><div class=\"li\">جيا (الأرض) كانت زعلانة من أورانوس (السماء) لأنه كان بيخبّي ولادها جواها. فعملت مؤامرة مع ابنها كرونوس.<\/div><div class=\"li\">وفي \"نسب الآلهة\"، سطر 176-182، المشهد بيتحكي: أورانوس جه بالليل، ونام على الأرض، وكرونوس من الكمين مد إيده الشمال، ومسك في إيده اليمين المنجل الكبير المسنن، وقطع أعضاء أبوه، ورماهم ورا ظهره.<\/div>", "n": 3, "a": "myth-m13-010", "x": "2c9c4b43", "en": "The first scene, brutal: Gaia (Earth) was angry that Uranus hid their children inside her, so she plotted with her son Cronus. In the Theogony, Uranus came at night, Cronus ambushed him with the great sickle, cut off his genitals and threw them behind him.", "i": 14}, {"t": "learn", "h": "<div class=\"li\">والدم اللي نزل على الأرض، الأرض خدته، وولدت منه الإيرينيس (إلهات الانتقام)، والعمالقة (<span class=\"en\">Giants<\/span>)، وحوريات الرماد (<span class=\"en\">Meliae<\/span>).<\/div>", "n": 1, "a": "myth-m13-011", "x": "2fb8fdfe", "en": "The blood that fell on the earth gave birth to the Erinyes (Furies), the Giants and the Meliae (ash-tree nymphs).", "i": 15}, {"t": "learn", "h": "<div class=\"u\">المشهد التاني، وهو اللي يخصنا.<\/div><div class=\"li\">الأعضاء نفسها وقعت في البحر. والنص بيقول: \"<span class=\"en\">and a white foam spread around them from the immortal flesh, and in it there grew a maiden<\/span>.\"، \"وزبد أبيض انتشر حواليهم من اللحم الخالد، وجواه كبرت بنت.\"<\/div>", "n": 2, "a": "myth-m13-012", "x": "3e4927a7", "en": "The second scene, ours: the parts fell into the sea, and the text says a white foam spread around them and in it grew a maiden.", "i": 16}, {"t": "mc", "h": "", "q": "من فين طلعت أفروديت حسب هسيود؟", "nq": 1, "opts": ["من زبد البحر حوالين أعضاء أورانوس", "من راس زيوس", "من الغابة"], "ans": 0, "why": "من زبد البحر حوالين أعضاء أورانوس", "ex": ["صح: وبعدها وصلت سيثيرا وقبرص.", "غلط: دي أثينا.", "غلط: دي أرتميس."], "i": 17}, {"t": "learn", "h": "<div class=\"li\">وبعدها: \"<span class=\"en\">First she drew near holy Cythera, and from there, afterwards, she came to sea-girt Cyprus, and came forth an awful and lovely goddess, and grass grew up about her beneath her shapely feet<\/span>.\"، \"قربت الأول من سيثيرا المقدسة، وبعدها جات لقبرص المحاطة بالبحر، وطلعت إلهة مهيبة وجميلة، والعشب نبت حواليها تحت رجليها الجميلة.\"<\/div>", "n": 1, "a": "myth-m13-013", "x": "6e862762", "en": "Then: first she drew near holy Cythera, afterwards she came to sea-girt Cyprus, and came forth an awful and lovely goddess, and grass grew up about her feet.", "i": 18}, {"t": "learn", "h": "<div class=\"li\">يعني البحر حمّلها من سيثيرا لقبرص، والشط هو أول أرض لمستها. تخيل الصورة: زبد في البحر، وبنت طالعة منه، والعشب بينبت تحت رجليها.<\/div>", "n": 1, "a": "myth-m13-014", "x": "8e625834", "en": "So the sea carried her from Cythera to Cyprus, and the shore was the first land she touched. Picture: foam, a girl rising from it, grass growing under her feet.", "i": 19}, {"t": "learn", "h": "<div class=\"u\">الأسماء، والنص نفسه بيشرحها.<\/div><div class=\"li\">النص بيقول: \"<span class=\"en\">Her gods and men call Aphrodite, and the foam-born goddess and rich-crowned Cytherea, because she grew amid the foam, and Cytherea because she reached Cythera, and Cyprogenes because she was born in billowy Cyprus, and Philommedes because she sprang from the members<\/span>.\"<\/div>", "n": 2, "a": "myth-m13-015", "x": "9e5a9f81", "en": "The names, explained by the text itself: her gods and men call her Aphrodite because she grew amid the foam; Cytherea because she reached Cythera; Cyprogenes because she was born in Cyprus; Philommedes because she sprang from the members.", "i": 20}, {"t": "learn", "h": "<div class=\"li\">يعني: الآلهة والناس بيسموها أفروديت، والمولودة من الزبد، وسيثيريا المتوّجة، لأنها كبرت في الزبد، وسيثيريا لأنها وصلت سيثيرا، وكيبروجينيس لأنها اتولدت في قبرص المتلاطمة، وفيلوميديس لأنها طلعت من الأعضاء.<\/div><div class=\"li\">يعني الاسم مش مجرد لافتة: كل لقب بيحكي مرحلة من الرحلة.<\/div>", "n": 2, "a": "myth-m13-016", "x": "a1eb8dfd", "en": "So the name is not a sign; each epithet tells a stage of the journey.", "i": 21}, {"t": "learn", "h": "<div class=\"u\">ومين كان معاها؟<\/div><div class=\"li\">النص بيقول: \"<span class=\"en\">And with her went Eros, and comely Desire followed her at her birth<\/span>.\"، \"ومعاها مشى إيروس (الحب)، والرغبة الجميلة (<span class=\"en\">Himeros<\/span>) تبعتها من أول لحظة في ميلادها.\"<\/div><div class=\"li\">يعني الحب والرغبة اتولدوا معاها، مش بعدها. ومن أول لحظة، الحب هو رفيقها.<\/div>", "n": 3, "a": "myth-m13-017", "x": "25c9cdbe", "en": "Who went with her? The text says Eros went with her and comely Desire followed her at her birth. Love and desire were born with her, not after.", "i": 22}, {"t": "tf", "h": "", "q": "إيروس اتولد مع أفروديت ومشي معاها من أول لحظة في رواية هسيود عن ميلادها.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: ومعاه الرغبة.", "غلط: النص بيقول إنه مشي معاها."], "i": 23}, {"t": "learn", "h": "<div class=\"u\">وليه الحكاية دي مهمة؟<\/div><div class=\"li\">لأنها بتقول حاجة عن الحب نفسه: الحب في الميثولوجيا اليونانية مش حاجة ناعمة ولطيفة. هو قوة بتطلع من جرح، ومن عنف، ومن قطع. وده مش تشاؤم، ده وصف دقيق لتجربة إنسانية: أقوى حالات الحب بتيجي مع أضعف لحظاتنا.<\/div>", "n": 2, "a": "myth-m13-018", "x": "bf302429", "en": "Why the story matters: love in Greek myth is not soft and gentle. It is a force that rises from a wound, from violence. Not pessimism but an accurate description: the strongest love often arrives with our weakest moments.", "i": 24}, {"t": "learn", "h": "<div class=\"li\">ومثال من الحياة: زي اللؤلؤة. بيقولوا إنها بتتكون من حاجة دخلت المحارة وجرحتها، فالمحارة بتحوّلها لحاجة جميلة. الحب كده: بيبدأ من جرح، وبيطلع منه حاجة جميلة. (ودي مقارنة، مش حقيقة علمية.)<\/div><div class=\"li\">ومثال تاني أقرب: أول مرة تحب فيها، بتبقى مرتبك ومكسور شوية في نفس الوقت. الحب مش بيدخل حد وهو مرتاح.<\/div>", "n": 2, "a": "myth-m13-019", "x": "9fe91412", "en": "An example: a pearl, said to form from something that entered the oyster and hurt it, which the oyster turns into something beautiful. Love is like that. (A comparison, not scientific fact.) And an example nearer: the first time you love, you are confused and a bit broken at once.", "i": 25}, {"t": "section", "h": "النقطة 3: إيروس/كيوبيد: إلهين في اسم واحد", "i": 26}, {"t": "learn", "h": "<div class=\"u\">إيروس الأول: قوة كونية.<\/div><div class=\"li\">في \"نسب الآلهة\"، سطر 116-120، إيروس مش ابن أفروديت ولا ابن حد. هو من أقدم الآلهة، قبل أوليمبوس، قبل زيوس.<\/div><div class=\"li\">والنص بيقول: \"<span class=\"en\">Eros<\/span> (<span class=\"en\">Love<\/span>), <span class=\"en\">fairest among the deathless gods, who unnerves the limbs and overcomes the mind and wise counsels of all gods and all men within them<\/span>.\"<\/div>", "n": 3, "a": "myth-m13-020", "x": "3d0bc93a", "en": "Eros the first: a cosmic force. In the Theogony, lines 116-120, Eros is not the son of Aphrodite or anyone; he is among the oldest gods, before Olympus and before Zeus.", "i": 27}, {"t": "mc", "h": "", "q": "إيه إيروس عند هسيود؟", "nq": 1, "opts": ["من أقدم الآلهة، قوة كونية", "ابن أفروديت الطفل", "إله الحرب"], "ans": 0, "why": "من أقدم الآلهة، قوة كونية", "ex": ["صح: قبل أوليمبوس.", "غلط: ده التقليد المتأخر.", "غلط: ده أريس."], "i": 28}, {"t": "learn", "h": "<div class=\"li\">يعني: إيروس، أجمل الآلهة الخالدين، اللي بيرخي الأعصاب، وبيغلب العقل والمشورة الحكيمة جوه كل الآلهة وكل البشر.<\/div><div class=\"li\">خد بالك من الجملة: بيغلب العقل والمشورة الحكيمة. يعني حتى العقل نفسه بيتغلب. وده بيرجعنا للفصل اللي فات.<\/div><div class=\"li\">وفي النسخة دي، إيروس مالهوش أجنحة، ولا قوس، ولا سهام. هو مبدأ كوني: القوة اللي بتخلّي الأشياء تتجاذب وتتوالد.<\/div>", "n": 3, "a": "myth-m13-021", "x": "cb53d2e0", "en": "The text: Eros, fairest among the deathless gods, who unnerves the limbs and overcomes the mind and wise counsels of all gods and all men. Even reason is overcome. In this version Eros has no wings, bow or arrows: he is a cosmic principle of attraction and generation.", "i": 29}, {"t": "learn", "h": "<div class=\"u\">إيروس التاني: الولد الصغير بسهام.<\/div><div class=\"li\">بعد كده بقرون، إيروس بقى ابن أفروديت، وبقى شاب جميل، وبعدها بقى طفل صغير.<\/div><div class=\"li\">ودارسين الفن بيقولوا: في الفن اليوناني القديم، إيروس كان بيتصوّر شاب مجنّح، وأحياناً طفل. وفي العصر الهيلينستي (323-31 قبل الميلاد)، صورته اتغيرت: بقى طفل صغير ممتلئ الجسم، ملزوق بأفروديت. والطفل ده هو اللي أثر على كيوبيد الروماني، وبعدها على الملائكة الصغار (<span class=\"en\">cherubs<\/span>) في الفن الأوروبي.<\/div>", "n": 3, "a": "myth-m13-022", "x": "e5bd2887", "en": "Eros the second: the little boy with arrows. Centuries later Eros becomes Aphrodite's son, a beautiful youth, then a small child. Scholars of art say in early Greek art he is a winged youth, sometimes a child; in the Hellenistic period (323-31 BC) he becomes a chubby little child close to Aphrodite, who influenced Roman Cupid and then the cherubs of European art.", "i": 30}, {"t": "tf", "h": "", "q": "صورة كيوبيد الطفل السمين صورة يونانية قديمة.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: هي صورة هيلينستية متأخرة.", "صح: ده الغلط الشائع."], "i": 31}, {"t": "learn", "h": "<div class=\"li\">وأدواته بقيت مشهورة: القوس والسهام، والمشعل، والشبكة اللي بيصطاد بيها القلوب.<\/div><div class=\"li\">يعني الصورة اللي في دماغك، الطفل السمين اللي عنده قوس وسهم، دي مش يونانية قديمة. دي صورة متأخرة، وبعدها بقت صورة عصر النهضة.<\/div>", "n": 2, "a": "myth-m13-023", "x": "88c5d64e", "en": "His tools became famous: bow and arrows, torch, and the net he catches hearts with. So the chubby boy with a bow in your head is not ancient Greek but a late image that became a Renaissance image.", "i": 32}, {"t": "learn", "h": "<div class=\"u\">الدرس.<\/div><div class=\"li\">نفس الاسم، إلهين مختلفين. واحد قوة كونية قديمة، وواحد طفل مدلل بيصطاد بالأسهم.<\/div><div class=\"li\">وفي الشعر الإنجليزي، لما تقرا \"<span class=\"en\">Cupid<\/span>\"، غالباً المقصود هو التاني. ولما تقرا \"<span class=\"en\">Love<\/span>\" بحرف كبير، ممكن يكون الأول. وده فرق مهم في التحليل.<\/div>", "n": 3, "a": "myth-m13-024", "x": "f0e182e6", "en": "The lesson: same name, two gods: an old cosmic force and a spoiled child hunting with arrows. In English poetry Cupid usually means the second, while Love with a capital L may mean the first. That difference matters in analysis.", "i": 33}, {"t": "section", "h": "النقطة 4: الميادين: فين بتشتغل أفروديت؟", "i": 34}, {"t": "learn", "h": "<div class=\"u\">الحب والرغبة.<\/div><div class=\"li\">ده مجالها الأساسي، وكل حاجة حية بتخضع له: الآلهة، والبشر، والطيور، ووحوش البر، وسمك البحر. (الترنيمة الهوميرية 5، سطر 1-6)<\/div>", "n": 2, "a": "myth-m13-025", "x": "5b83912c", "en": "Her domains: love and desire, her main field; everything alive is subject to it: gods, men, birds, land beasts and sea fish (Homeric Hymn 5, lines 1-6).", "i": 35}, {"t": "learn", "h": "<div class=\"u\">الجمال.<\/div><div class=\"li\">جمالها مش صفة شخصية، ده قوة. زي ما الشمس قوية، الجمال قوي. وبيخلي الناس تعمل حاجات مش معقولة.<\/div>", "n": 2, "a": "myth-m13-026", "x": "30ed647a", "en": "Beauty: her beauty is not a personal trait but a force. As the sun is strong, beauty is strong, and it makes people do unreasonable things.", "i": 36}, {"t": "learn", "h": "<div class=\"u\">البحر والتجارة.<\/div><div class=\"li\">هي إلهة بحرية كمان: اتولدت من البحر، وطلعت على شط قبرص، ومراكز عبادتها كانت مواني (قبرص، سيثيرا). والمواني دي كانت مراكز تجارة.<\/div><div class=\"li\">وده منطقي: الحب والبحر والتجارة كلهم بيربطوا الناس ببعض.<\/div>", "n": 3, "a": "myth-m13-027", "x": "caebb70f", "en": "Sea and trade: she is also a sea goddess, born from the sea, landing on Cyprus, and her worship centres were ports (Cyprus, Cythera), which were trade centres. Love, sea and trade all connect people.", "i": 37}, {"t": "learn", "h": "<div class=\"u\">الزواج والعيلة.<\/div><div class=\"li\">أفروديت متجوزة هيفايستوس (إله الحدادة). والجواز ده مش جواز حب، ده جواز بين الجمال والصنعة. وهنشوف نتيجته بعد شوية، في القصة الكبيرة.<\/div>", "n": 2, "a": "myth-m13-028", "x": "9735a36a", "en": "Marriage: she is married to Hephaestus, god of the forge. It is not a love match but a match between beauty and craft. We will see the result in the big story.", "i": 38}, {"t": "section", "h": "النقطة 5: القصة الكبيرة: أفروديت وأريس في الشبكة", "i": 39}, {"t": "learn", "h": "<div class=\"u\">الخلفية.<\/div><div class=\"li\">أفروديت متجوزة هيفايستوس، إله الحدادة، وهو أعرج وقبيح الشكل بس أشطر صانع في العالم.<\/div><div class=\"li\">وهي بتحب أريس (<span class=\"en\">Mars<\/span>)، إله الحرب. يعني الجمال بيحب القوة العنيفة، مش الصنعة الذكية.<\/div>", "n": 3, "a": "myth-m13-029", "x": "66605f8a", "en": "Background: Aphrodite is married to Hephaestus, god of the forge, lame and ugly but the best craftsman in the world. She loves Ares (Mars), god of war. So beauty loves violent force, not clever craft.", "i": 40}, {"t": "learn", "h": "<div class=\"u\">المؤامرة.<\/div><div class=\"li\">في الأوديسة، الكتاب 8، سطر 266-366، الشاعر ديمودوكوس بيغني القصة في بلاط الفياشيين، وأوديسيوس بيسمعها.<\/div><div class=\"li\">هيليوس (الشمس) شافهم وهما مع بعض، وراح بلّغ هيفايستوس.<\/div><div class=\"li\">وهيفايستوس عمل إيه؟ راح لحدادته، وحط السندان، وصنع قيود ماحدش يقدر يفكها، وفرشها حوالين السرير، ومن السقف كمان، \"<span class=\"en\">fine as spiders' webs<\/span>\"، رفيعة زي شباك العنكبوت، لدرجة إن ولا إله كان يقدر يشوفها.<\/div>", "n": 4, "a": "myth-m13-030", "x": "5a21b7d4", "en": "The plot: in Odyssey Book 8, lines 266-366, the singer Demodocus tells it at the court of the Phaeacians while Odysseus listens. Helios (the Sun) saw them together and told Hephaestus. He went to his forge, set the anvil, made unbreakable bonds and spread them around the bed and from the roof, fine as spiders' webs, so no god could see them.", "i": 41}, {"t": "mc", "h": "", "q": "مين بلّغ هيفايستوس عن أفروديت وأريس؟", "nq": 1, "opts": ["هيليوس (الشمس)", "هيرميس", "أبولو"], "ans": 0, "why": "هيليوس (الشمس)", "ex": ["صح: شافهم وراح بلّغ.", "غلط: هيرميس اتمنى مكان أريس.", "غلط: أبولو سأل هيرميس بس."], "i": 42}, {"t": "learn", "h": "<div class=\"u\">الفخ.<\/div><div class=\"li\">هيفايستوس عمل نفسه مسافر للينوس. وأريس، اللي مش أعمى، شاف فرصة، ودخل البيت، ومسك إيد أفروديت، وقال لها: \"<span class=\"en\">Come, love, let us to bed and take our joy, couched together. For Hephaestus is no longer here in the land<\/span>.\"<\/div><div class=\"li\">وناموا. والشبكة وقعت عليهم. ومقدروش يتحركوا.<\/div>", "n": 3, "a": "myth-m13-031", "x": "45efb7c0", "en": "The trap: Hephaestus pretended to travel to Lemnos. Ares, not blind, saw his chance, came in, took Aphrodite's hand and said: come, love, let us to bed and take our joy, for Hephaestus is no longer here. They lay down, the net fell on them and they could not move.", "i": 43}, {"t": "learn", "h": "<div class=\"u\">الفضيحة.<\/div><div class=\"li\">هيفايستوس رجع، ووقف على الباب، وزعق على كل الآلهة: تعالوا شوفوا حاجة مضحكة، أفروديت بنت زيوس بتحتقرني عشان أعرج، وبتحب أريس المدمر عشان حلو وشكله متناسق.<\/div><div class=\"li\">والآلهة جات. والضحك ملأ المكان: \"<span class=\"en\">unquenchable laughter flowed from the blessed gods<\/span>\".<\/div>", "n": 3, "a": "myth-m13-032", "x": "da04664d", "en": "The scandal: Hephaestus returned, stood at the door and shouted to all the gods: come see something laughable, Aphrodite, Zeus's daughter, despises me because I am lame and loves destructive Ares because he is handsome. The gods came and unquenchable laughter filled the place.", "i": 44}, {"t": "learn", "h": "<div class=\"li\">والآلهة قالت جملة بقت مثل: \"<span class=\"en\">Ill deeds thrive not. The slow catches the swift<\/span>; <span class=\"en\">even as now Hephaestus, slow though he is, has out-stripped Ares for all that he is the swiftest of the gods<\/span>.\"، \"الأعمال الوحشة مابتنجحش. البطيء بيمسك السريع، زي ما هيفايستوس، بطيء زي ما هو، سبق أريس، مع إنه أسرع الآلهة.\"<\/div>", "n": 1, "a": "myth-m13-033", "x": "4766590d", "en": "The gods said a line that became a proverb: ill deeds thrive not; the slow catches the swift, as Hephaestus, slow as he is, has outstripped Ares, the swiftest of the gods.", "i": 45}, {"t": "learn", "h": "<div class=\"li\">وأبولو سأل هيرميس: تبقى عايز تنام جنب أفروديت الدهبية ولو كنت مربوط بقيود؟ وهيرميس رد رد مضحك جداً: \"<span class=\"en\">three times as many inescapable links could hold me, and you gods could be watching, and yes, all the goddesses too, if only I might sleep with golden Aphrodite<\/span>.\"، \"حتى لو كانوا تلات أضعاف القيود اللي مالهاش فك، والآلهة كلهم بيتفرجوا، وأنا نايم جنب أفروديت الدهبية.\"<\/div>", "n": 1, "a": "myth-m13-034", "x": "9344d9d2", "en": "Apollo asked Hermes: would you want to sleep beside golden Aphrodite even in bonds? Hermes answered, very funny: three times as many inescapable bonds, and you gods all watching, and all the goddesses too, if only I might sleep with golden Aphrodite.", "i": 46}, {"t": "learn", "h": "<div class=\"li\">والآلهة ضحكت أكتر. وبعدها أريس راح تراقيا، وأفروديت راحت قبرص، لغاية بافوس، حيث الحوريات غسّلوها ودهنوها بزيت خالد. يعني حتى بعد الفضيحة، رجعت لمكانها واتصلحت.<\/div>", "n": 1, "a": "myth-m13-035", "x": "303d98d2", "en": "The gods laughed more. Then Ares went to Thrace and Aphrodite to Cyprus, to Paphos, where the Graces bathed and anointed her with immortal oil. Even after the scandal she returned to her place and was restored.", "i": 47}, {"t": "learn", "h": "<div class=\"u\">ليه القصة دي مهمة؟<\/div><div class=\"li\">لأنها بتحكي الحكاية من وجهة نظر هيفايستوس، مش من وجهة نظر أفروديت. الضحك كله على الاتنين، بس التعاطف مع الأعرج اللي اتنصب عليه.<\/div><div class=\"li\">وفيها حكمة شعبية يونانية بقت مثل: البطيء بيمسك السريع. يعني الذكاء والصبر بيغلبوا القوة والسرعة.<\/div><div class=\"li\">وفيها كمان سؤال أخلاقي: هل الفضيحة عقاب عادل؟ ولا مجرد تشهير؟ الآلهة ضحكت، ومحدش قال إن ده صح. والقصة محفوظة في الأوديسة كنكتة، مش كموعظة.<\/div>", "n": 4, "a": "myth-m13-036", "x": "4cd59005", "en": "Why the story matters: it is told from Hephaestus's point of view, not Aphrodite's. The laughter is on both, but sympathy is with the lame one who was tricked. It holds a Greek proverb: the slow catches the swift, cleverness and patience beat force and speed. And a moral question: is scandal a fair punishment or just exposure? The gods laughed, nobody said it was right. The story is kept in the Odyssey as a joke, not a sermon.", "i": 48}, {"t": "mc", "h": "", "q": "القصة بتحكي من وجهة نظر مين؟", "nq": 1, "opts": ["هيفايستوس", "أفروديت", "أريس"], "ans": 0, "why": "هيفايستوس", "ex": ["صح: والتعاطف مع الأعرج.", "غلط: مش من وجهتها.", "غلط: مش من وجهته."], "i": 49}, {"t": "learn", "h": "<div class=\"li\">وملاحظة مهمة للشعر الإنجليزي: المشهد ده اتستخدم بعدين في الكوميديا والهجاء، وأشهر تعبير جه منه هو \"شبكة فولكان\" (<span class=\"en\">Vulcan's net<\/span>)، يعني فخ بيتحط للحبيبين. وهتقابل التعبير ده كتير.<\/div>", "n": 1, "a": "myth-m13-037", "x": "51a62adc", "en": "For English poetry: the scene was later used in comedy and satire, and the best-known phrase from it is Vulcan's net, a trap set for lovers. You will meet that expression often.", "i": 50}, {"t": "section", "h": "النقطة 6: التلاتة اللي الحب مش قادر عليهم", "i": 51}, {"t": "learn", "h": "<div class=\"u\">الترنيمة الهوميرية 5 بتقول حاجة تحفة.<\/div><div class=\"li\">بعد ما وصفت قوة أفروديت على كل الكائنات، بتقول: \"<span class=\"en\">Yet there are three hearts that she cannot bend nor yet ensnare. First is the daughter of Zeus who holds the aegis, bright-eyed Athena<\/span>.\"<\/div><div class=\"li\">يعني: فيه تلات قلوب مش قادرة تلوّيهم ولا تصطادهم. الأول: بنت زيوس، أثينا اللامعة العينين.<\/div>", "n": 3, "a": "myth-m13-038", "x": "dd953a2b", "en": "Homeric Hymn 5 says something wonderful: after describing her power over all creatures, it says there are three hearts she cannot bend or ensnare. First, the daughter of Zeus who holds the aegis, bright-eyed Athena.", "i": 52}, {"t": "mc", "h": "", "q": "مين التلات إلهات اللي أفروديت مش قادرة عليهم؟", "nq": 1, "opts": ["أثينا وأرتميس وهيستيا", "هيرا وديميتر وهيستيا", "أثينا وهيرا وأرتميس"], "ans": 0, "why": "أثينا وأرتميس وهيستيا", "ex": ["صح: بنص الترنيمة 5.", "غلط: ديميتر وهيرا مش فيهم.", "غلط: هيرا مش فيهم."], "i": 53}, {"t": "learn", "h": "<div class=\"li\">والتاني: \"<span class=\"en\">Nor does laughter-loving Aphrodite ever tame in love Artemis, the huntress with shafts of gold<\/span>.\"، \"ولا أفروديت محبة الضحك تقدر تروّض أرتميس، الصيادة ذات السهام الدهبية.\"<\/div><div class=\"li\">والتالت: هيستيا (<span class=\"en\">Hestia<\/span>)، إلهة البيت والنار، \"العذراء الطاهرة\".<\/div><div class=\"li\">يعني الفصل ده بيعترف بالفصلين اللي فاتوا بالنص. الإلهة اللي بتحكم الحب بتقول: فيه تلاتة بره سلطتي.<\/div>", "n": 3, "a": "myth-m13-039", "x": "5d9ad96e", "en": "Second: laughter-loving Aphrodite never tames in love Artemis, the huntress with shafts of gold. Third: Hestia, goddess of hearth and fire, the pure virgin. So the lesson acknowledges the two earlier ones in the text itself: the goddess of love says three are beyond my power.", "i": 54}, {"t": "learn", "h": "<div class=\"u\">وليه؟<\/div><div class=\"li\">لأن التلاتة اختاروا العذرية، وكل واحدة اختارت لأسباب مختلفة: أثينا اختارت العقل والحرب، أرتميس اختارت البرية والحرية، وهيستيا اختارت البيت والنار.<\/div><div class=\"li\">والفكرة دي بتوريك إن الميثولوجيا اليونانية مش نظام واحد. هي شبكة اتفاقات، وكل إله عنده حدود، وبيعرف حدوده.<\/div>", "n": 3, "a": "myth-m13-040", "x": "f39f0116", "en": "Why these three? All three chose virginity, each for different reasons: Athena chose reason and war, Artemis the wild and freedom, Hestia the home and fire. Greek mythology is not one system but a network of agreements: each god has limits and knows them.", "i": 55}, {"t": "learn", "h": "<div class=\"u\">وزيوس عمل إيه؟<\/div><div class=\"li\">زيوس، اللي بيحب يتسلط، قرر يكسّر كبرياء أفروديت. فحط في قلبها رغبة في راجل بشري، أنخيسيس (<span class=\"en\">Anchises<\/span>)، اللي كان بيرعى بقر في جبل إيدا.<\/div><div class=\"li\">والسبب؟ عشان ما تفضلش تتشمّت بالآلهة وتقول إنها قدرت تخلي الآلهة تحب بشر. (الترنيمة 5، سطر 45-55)<\/div><div class=\"li\">يعني العقاب هنا مش عنف، ده إذلال: أجمل إلهة هتحب راجل، وهتعرف معنى الضعف اللي كانت بتضحك عليه.<\/div>", "n": 4, "a": "myth-m13-041", "x": "bde1329e", "en": "What did Zeus do? Zeus, who likes to dominate, decided to break Aphrodite's pride, so he put in her heart desire for a mortal man, Anchises, herding cattle on Mount Ida. The reason: so she would stop boasting that she could make gods love mortals (Hymn 5, lines 45-55). The punishment is humiliation, not violence: the most beautiful goddess will love a man and learn weakness, and the others had been laughing at her.", "i": 56}, {"t": "mc", "h": "", "q": "ليه زيوس خلّى أفروديت تحب أنخيسيس؟", "nq": 1, "opts": ["عشان يكسّر كبرياءها", "عشان يكافئها", "عشان يتجوزها"], "ans": 0, "why": "عشان يكسّر كبرياءها", "ex": ["صح: إذلال مش عنف.", "غلط: مش مكافأة.", "غلط: مش ده."], "i": 57}, {"t": "section", "h": "النقطة 7: أنخيسيس وإينياس: من قبرص لروما", "i": 58}, {"t": "learn", "h": "<div class=\"u\">الحكاية.<\/div><div class=\"li\">أفروديت جات لأنخيسيس في شكل أميرة بشرية، عشان ما يخافش. ولبست واتزينت، والحوريات غسّلوها ودهنوها.<\/div><div class=\"li\">وهو لما شافها، ظنها إلهة، وقال لها: \"هلا يا سيدة، أي واحدة من السعداء إنتِ، أرتميس، ولا ليتو، ولا أفروديت الدهبية، ولا ثيميس، ولا أثينا اللامعة العينين؟\" (الترنيمة 5، سطر 91-95)، يعني الراجل عدّد كل الإلهات اللي يعرفهم، ما عدا اللي واقفة قدامه.<\/div>", "n": 3, "a": "myth-m13-042", "x": "20d72f70", "en": "The story: Aphrodite came to Anchises as a human princess so he would not be afraid; she dressed and adorned herself, the nymphs bathed and anointed her. He thought she was a goddess and said: hail, lady, which of the blessed are you, Artemis, Leto, golden Aphrodite, Themis, or bright-eyed Athena? (Hymn 5, lines 91-95). He listed every goddess he knew except the one standing in front of him.", "i": 59}, {"t": "learn", "h": "<div class=\"li\">ونام معاها، وهو مش فاهم إنها إلهة. والنص بيقول: \"<span class=\"en\">a mortal man with an immortal goddess, not clearly knowing what he did<\/span>\"، \"راجل فاني مع إلهة خالدة، وهو مش فاهم بالظبط بيعمل إيه.\"<\/div>", "n": 1, "a": "myth-m13-043", "x": "3ef9e24b", "en": "And he lay with her not understanding she was a goddess; the text says a mortal man with an immortal goddess, not clearly knowing what he did.", "i": 60}, {"t": "learn", "h": "<div class=\"u\">الصدمة.<\/div><div class=\"li\">لما صحّى، شاف وشها الحقيقي، وخاف، وغطى وشه بعبايته، وقال لها: أنا عارف إنك إلهة، بس إنتِ ما قلتليش الحقيقة. أرجوكي، متسيبنيش أعيش عاجز بعد كده، لأن اللي ينام مع إلهة ما بيبقاش سليم بعدها.<\/div><div class=\"li\">وده خوف حقيقي في الميثولوجيا: القرب من الإله بيحرق.<\/div>", "n": 3, "a": "myth-m13-044", "x": "bc784588", "en": "The shock: when he woke he saw her true face, was afraid, covered his face with his cloak and said: I know you are a goddess, but you did not tell me the truth. Please do not let me live crippled afterwards, for a man who lies with a goddess does not stay unharmed. This is real fear in mythology: closeness to a god burns.", "i": 61}, {"t": "learn", "h": "<div class=\"u\">الوعد.<\/div><div class=\"li\">أفروديت طمّنته، وقالت له: \"<span class=\"en\">you shall have a dear son who shall reign among the Trojans, and children's children after him, springing up continually. His name shall be Aeneas<\/span>.\"، \"هيبقى عندك ابن غالي هيملك على الطرواديين، وأولاد أولاد بعده، يطلعوا باستمرار. اسمه إينياس.\"<\/div><div class=\"li\">وإينياس ده هو بطل الإنيد لفيرجيل، يعني جد الرومان. وهنشوفه في <span class=\"en\">M76<\/span>.<\/div>", "n": 3, "a": "myth-m13-045", "x": "bf1d8f0a", "en": "The promise: Aphrodite reassured him: you shall have a dear son who shall reign among the Trojans, and children's children after him. His name shall be Aeneas. Aeneas is the hero of Virgil's Aeneid, ancestor of the Romans; we meet him in M76.", "i": 62}, {"t": "mc", "h": "", "q": "إيه اسم ابن أفروديت من أنخيسيس؟", "nq": 1, "opts": ["إينياس", "أدونيس", "هيكتور"], "ans": 0, "why": "إينياس", "ex": ["صح: جد الرومان.", "غلط: أدونيس موضوع تاني.", "غلط: هيكتور طروادي مش ابنها."], "i": 63}, {"t": "learn", "h": "<div class=\"u\">التحذير.<\/div><div class=\"li\">وقالت له حاجة أخيرة، وهي أهم حاجة في الحكاية: \"<span class=\"en\">But if you tell all and foolishly boast that you lay with rich-crowned Aphrodite, Zeus will smite you in his anger with a smoking thunderbolt<\/span>.\"، \"بس لو حكيت كل حاجة، وافتخرت بحماقة إنك نمت مع أفروديت المتوّجة، زيوس هيضربك بغضبه بصاعقة مدخنة.\"<\/div><div class=\"li\">يعني القاعدة: الحب مع الإله بيبقى سر. اللي بيتكلم، بيتحرق.<\/div>", "n": 3, "a": "myth-m13-046", "x": "a710709d", "en": "The warning, the most important part: but if you tell all and foolishly boast that you lay with rich-crowned Aphrodite, Zeus will smite you in his anger with a smoking thunderbolt. The rule: love with a god is a secret; whoever speaks is burned.", "i": 64}, {"t": "tf", "h": "", "q": "أفروديت حذّرت أنخيسيس إن الكلام عن علاقتهم بيعرّضه لصاعقة زيوس.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: العلاقة سر.", "غلط: ده هو التحذير."], "i": 65}, {"t": "learn", "h": "<div class=\"li\">وده موضوع كبير في الميثولوجيا: العلاقة بين الإله والإنسان فيها سر، والكلام عنها كارثة. (زي ما هنشوف مع سيميلي وزيوس في <span class=\"en\">M18<\/span>)<\/div>", "n": 1, "a": "myth-m13-047", "x": "4c4cc32b", "en": "A big theme in mythology: the relation between god and human holds a secret, and talking about it is a disaster (as with Semele and Zeus in M18).", "i": 66}, {"t": "learn", "h": "<div class=\"u\">وأفروديت في روما.<\/div><div class=\"li\">إينياس بقى جد الرومان، وفينوس بقت الجدة الإلهية لعيلة يوليوس.<\/div><div class=\"li\">ويوليوس قيصر بنى معبد فينوس جينيتريكس (<span class=\"en\">Venus Genetrix<\/span>)، يعني \"فينوس الأم/الوالدة\"، في منتداه، واتدشن في 26 سبتمبر سنة 46 قبل الميلاد، في آخر يوم من انتصاراته.<\/div><div class=\"li\">وده استخدام سياسي كامل للأسطورة: عيلة حاكمة بتقول إنها من نسل إلهة. ونفس الحكاية اللي بدأت من زبد البحر، بقت شهادة ميلاد لإمبراطورية.<\/div>", "n": 4, "a": "myth-m13-048", "x": "d41534c1", "en": "Aphrodite in Rome: Aeneas became the ancestor of the Romans and Venus the divine grandmother of the Julian family. Julius Caesar built the temple of Venus Genetrix, Venus the Mother, in his forum, dedicated on 26 September 46 BC on the last day of his triumphs. A full political use of myth: a ruling family says it descends from a goddess; the story that began with sea foam became the birth certificate of an empire.", "i": 67}, {"t": "mc", "h": "", "q": "إيه معبد <span class=\"en\">Venus Genetrix<\/span> اللي بناه يوليوس قيصر؟", "nq": 1, "opts": ["معبد فينوس الأم", "معبد حرب", "معبد البحر"], "ans": 0, "why": "معبد فينوس الأم", "ex": ["صح: في منتداه سنة 46 ق.م.", "غلط: مش للحرب.", "غلط: مش للبحر."], "i": 68}, {"t": "section", "h": "النقطة 8: فينوس: إلهة واحدة ولا اتنين؟", "i": 69}, {"t": "learn", "h": "<div class=\"u\">أفلاطون في \"المأدبة\" (<span class=\"en\">Symposium<\/span> 180<span class=\"en\">d-181<\/span>).<\/div><div class=\"li\">بيقول إن فيه أفروديتين: واحدة قديمة، مالهاش أم، بنت أورانوس (السماء)، ودي اسمها \"الأورانية\" (<span class=\"en\">Ourania<\/span>)، يعني السماوية.<\/div><div class=\"li\">والتانية أصغر، بنت زيوس وديوني، واسمها \"البانديموس\" (<span class=\"en\">Pandemos<\/span>)، يعني \"بتاعة كل الشعب\".<\/div><div class=\"li\">وكل واحدة ليها إيروس بتاعها: إيروس سماوي، وإيروس شعبي.<\/div><div class=\"li\">والفكرة: الحب له درجتين. حب راقي بيحب الروح، وحب شعبي بيحب الجسد.<\/div>", "n": 5, "a": "myth-m13-049", "x": "5280ec6f", "en": "Plato in the Symposium (180d-181) says there are two Aphrodites: an old one with no mother, daughter of Uranus, called Ourania (heavenly); and a younger one, daughter of Zeus and Dione, called Pandemos (of all the people). Each has her own Eros. The idea: love has two degrees, a high love of the soul and a common love of the body.", "i": 70}, {"t": "mc", "h": "", "q": "الأفروديتين عند أفلاطون اسمهم إيه؟", "nq": 1, "opts": ["<span class=\"en\">Ourania<\/span> و<span class=\"en\">Pandemos<\/span>", "<span class=\"en\">Cypris<\/span> و<span class=\"en\">Cytherea<\/span>", "<span class=\"en\">Eros<\/span> و<span class=\"en\">Himeros<\/span>"], "ans": 0, "why": "<span class=\"en\">Ourania<\/span> و<span class=\"en\">Pandemos<\/span>", "ex": ["صح: السماوية والشعبية.", "غلط: دي ألقاب.", "غلط: دول ولاد."], "i": 71}, {"t": "learn", "h": "<div class=\"u\">وهل ده حقيقي في العبادة؟<\/div><div class=\"li\">أيوه. فيه إشارة عند باوسانياس (1.14.7 و1.22.3) إن أفروديت كان ليها معبدين في أثينا بالاسمين دول،.<\/div><div class=\"li\">يعني التقسيم مش فلسفة بس، ده عبادة حقيقية: إلهة للحب الشعبي، وإلهة للحب الراقي.<\/div>", "n": 3, "a": "myth-m13-050", "x": "d4176292", "en": "Is it real in worship? Yes. There is a reference in Pausanias (1.14.7 and 1.22.3) that Aphrodite had two temples in Athens under these two names. So the division is not just philosophy but real worship: one goddess for common love and one for high love.", "i": 72}, {"t": "learn", "h": "<div class=\"u\">وده بيوريك حاجة مهمة.<\/div><div class=\"li\">نفس الإلهة بتتقسم على حسب الوظيفة. زي ما كان عندنا ديانا النيمورينسيس وديانا أفسس في <span class=\"en\">M11<\/span>. الاسم واحد، والشغل مختلف.<\/div>", "n": 2, "a": "myth-m13-051", "x": "d36fa940", "en": "This shows something important: the same goddess is split by function, like Diana Nemorensis and Diana of Ephesus in M11. Same name, different work.", "i": 73}, {"t": "section", "h": "النقطة 9: الأسطورة في الشعر الإنجليزي", "i": 74}, {"t": "learn", "h": "<div class=\"u\">شكسبير، السونيتة 153. وأول أربع سطور بيرجعونا للفصل اللي فات:<\/div><div class=\"u\">\"<span class=\"en\">Cupid laid by his brand and fell asleep<\/span>.<\/div><div class=\"u\"><span class=\"en\">A maid of Dian's this advantage found<\/span>,<\/div><div class=\"u\"><span class=\"en\">And his love-kindling fire did quickly steep<\/span><\/div><div class=\"u\"><span class=\"en\">In a cold valley-fountain of that ground<\/span>\"<\/div>", "n": 5, "a": "myth-m13-052", "x": "42f4f48a", "en": "Shakespeare, sonnet 153. The first four lines take us back to last lesson: Cupid laid by his brand and fell asleep; a maid of Dian's this advantage found, and his love-kindling fire did quickly steep in a cold valley-fountain of that ground.", "i": 75}, {"t": "mc", "h": "", "q": "في سونيت 153، مين اللي أخد مشعل كيوبيد وهو نايم؟", "nq": 1, "opts": ["خادمة من خدامات ديان", "أبولو", "فينوس"], "ans": 0, "why": "خادمة من خدامات ديان", "ex": ["صح: وغرقت ناره في النافورة.", "غلط: مش أبولو.", "غلط: فينوس مش هي."], "i": 76}, {"t": "learn", "h": "<div class=\"u\">الترجمة: \"كيوبيد حط مشعله ونام. وخادمة من خدامات ديان (أرتميس) لقيت الفرصة دي، وغرقت ناره اللي بتشعل الحب بسرعة في نافورة باردة في الوادي ده.\"<\/div>", "n": 1, "a": "myth-m13-053", "x": "4271e7ee", "en": "Translation: Cupid put down his torch and slept; a maid of Diana's (Artemis) found the chance and quickly plunged his love-kindling fire into a cold valley fountain.", "i": 77}, {"t": "learn", "h": "<div class=\"li\">الشرح: المشهد كله مبني على حاجة واحدة: إله الحب نام، وسلاحه (المشعل) وقع في إيد حد تاني. وخادمة أرتميس، يعني واحدة من عالم العفة، هي اللي خدت النار.<\/div><div class=\"li\">وباقي السونيتة بتحكي إن النافورة بقت حمام سخن بيشفي الأمراض، والشاعر راح يستحمى عشان يتعالج من حب حبيبته، فما لقاش علاج. والعلاج الحقيقي في عينها هي.<\/div>", "n": 2, "a": "myth-m13-054", "x": "419aed35", "en": "Explanation: the whole scene rests on one thing: the god of love sleeps and his weapon (the torch) falls into someone else's hands, a servant of Artemis, from the world of chastity. The rest says the fountain became a hot bath that cures diseases, and the poet goes to bathe to cure his love and finds no cure: the real cure is in her eyes.", "i": 78}, {"t": "learn", "h": "<div class=\"li\">ليه مهم؟ لأن شكسبير بيستخدم الأسطورة كأداة ساخرة: إله الحب نفسه بيتسرق سلاحه، والشاعر بيدوّر على علاج من الحب في حمام أسطوري. يعني الأسطورة بقت نكتة عن العجز.<\/div>", "n": 1, "a": "myth-m13-055", "x": "7483f930", "en": "Why it matters: Shakespeare uses myth as a satirical tool: the god of love has his weapon stolen, and the poet looks for a cure for love in a mythical bath. The myth becomes a joke about helplessness.", "i": 79}, {"t": "learn", "h": "<div class=\"u\">شكسبير تاني: \"فينوس وأدونيس\" (<span class=\"en\">Venus and Adonis<\/span>)، أول ست سطور:<\/div><div class=\"u\">\"<span class=\"en\">Even as the sun with purple-colored face<\/span><\/div><div class=\"u\"><span class=\"en\">Had ta'en his last leave of the weeping morn<\/span>,<\/div><div class=\"u\"><span class=\"en\">Rose-cheeked Adonis hied him to the chase<\/span>.<\/div><div class=\"u\"><span class=\"en\">Hunting he loved, but love he laughed to scorn<\/span>.<\/div><div class=\"u\"><span class=\"en\">Sick-thought<\/span>è<span class=\"en\">d Venus makes amain unto him<\/span><\/div><div class=\"u\"><span class=\"en\">And, like a bold-faced suitor, gins to woo him<\/span>.\"<\/div>", "n": 7, "a": "myth-m13-056", "x": "68bc7735", "en": "Shakespeare again, Venus and Adonis, first six lines: as the sun with purple-coloured face had taken his last leave of the weeping morn, rose-cheeked Adonis hied him to the chase; hunting he loved, but love he laughed to scorn; sick-thoughted Venus makes amain unto him and, like a bold-faced suitor, begins to woo him.", "i": 80}, {"t": "learn", "h": "<div class=\"u\">الترجمة: \"لما كانت الشمس بوشها البنفسجي بتاخد آخر وداعها من الصبح الباكي، أدونيس الخدود وردية راح يجري ورا الصيد. كان بيحب الصيد، وبيسخر من الحب. وفينوس المتعبة الفكر جات له بسرعة، وزي خاطب وقح، بدأت تغازله.\"<\/div>", "n": 1, "a": "myth-m13-057", "x": "04651dc3", "en": "Translation: as the sun with a purple face took its last farewell of the weeping morning, rosy-cheeked Adonis went off to the hunt. He loved hunting and scorned love. Venus, sick at heart, came quickly to him and, like a bold suitor, began to woo him.", "i": 81}, {"t": "learn", "h": "<div class=\"li\">الشرح: في ست سطور، شكسبير حط الموضوع كله: راجل بيحب الصيد وبيكره الحب، وإلهة الحب بتحاول تصطاده. والصراع ده هو القصيدة كلها.<\/div><div class=\"li\">ولاحظ التشابه مع <span class=\"en\">M11<\/span>: أرتميس بتحب الصيد. وأدونيس هنا بيشبهها في الاختيار. الحب بيحاول يغلب الصيد، والنتيجة مأساة.<\/div><div class=\"li\">هنقرا القصيدة في <span class=\"en\">M31<\/span>.<\/div>", "n": 3, "a": "myth-m13-058", "x": "39dc0bc8", "en": "Explanation: in six lines Shakespeare puts the whole subject: a man who loves hunting and hates love, and the goddess of love trying to hunt him. Note the similarity with M11: Artemis loves hunting, and Adonis here resembles her in choice. Love tries to beat hunting and the result is tragedy. We read the poem in M31.", "i": 82}, {"t": "learn", "h": "<div class=\"u\">كريستوفر مارلو، \"هيرو وليندر\"، أول ست سطور:<\/div><div class=\"u\">\"<span class=\"en\">On Hellespont, guilty of true love's blood<\/span>,<\/div><div class=\"u\"><span class=\"en\">In view and opposite two cities stood<\/span>,<\/div><div class=\"u\"><span class=\"en\">Sea-borderers, disjoin'd by Neptune's might<\/span>;<\/div><div class=\"u\"><span class=\"en\">The one Abydos, the other Sestos hight<\/span>.<\/div><div class=\"u\"><span class=\"en\">At Sestos Hero dwelt<\/span>; <span class=\"en\">Hero the fair<\/span>,<\/div><div class=\"u\"><span class=\"en\">Whom young Apollo courted for her hair<\/span>\"<\/div>", "n": 7, "a": "myth-m13-059", "x": "eb6e025c", "en": "Christopher Marlowe, Hero and Leander, first six lines: on Hellespont, guilty of true love's blood, in view and opposite two cities stood, sea-borderers, disjoined by Neptune's might; the one Abydos, the other Sestos hight. At Sestos Hero dwelt; Hero the fair, whom young Apollo courted for her hair.", "i": 83}, {"t": "learn", "h": "<div class=\"u\">الترجمة: \"على الهليسبونت، المتهم بدم حب حقيقي، وقفت مدينتين في النظر ومتقابلين، على حدود البحر، فصلهم قوة نبتون. واحدة أبيدوس، والتانية اسمها سيستوس. في سيستوس عاشت هيرو، هيرو الجميلة، اللي أبولو الشاب حاول يتودد لها بسبب شعرها.\"<\/div>", "n": 1, "a": "myth-m13-060", "x": "40d8394b", "en": "Translation: on the Hellespont, guilty of the blood of true love, two cities stood in view and opposite, on the borders of the sea, separated by Neptune's might. One is Abydos, the other called Sestos. In Sestos lived Hero the fair, whom young Apollo courted for her hair.", "i": 84}, {"t": "learn", "h": "<div class=\"li\">الشرح: مارلو بيبدأ بمكان، مش بشخص. الهليسبونت مضيق مية بين أوروبا وآسيا، وهو \"متهم\" بالدم. يعني الحب عنده جريمة من أول سطر.<\/div><div class=\"li\">والمدينتين على شطين متقابلين، والحب هيبقى بينهم. وده أنسب مشهد لقصة حب مأساوية: مسافة مية.<\/div><div class=\"li\">هنقراها في <span class=\"en\">M27<\/span>.<\/div>", "n": 3, "a": "myth-m13-061", "x": "fa1e5c57", "en": "Explanation: Marlowe begins with a place, not a person. The Hellespont is a strait between Europe and Asia, and it is guilty of blood: love as a crime from line one. Two cities on opposite shores, with love between them: the right scene for a tragic love story, a distance of water. We read it in M27.", "i": 85}, {"t": "learn", "h": "<div class=\"u\">لوكريتيوس، بداية قصيدته عن طبيعة الأشياء، في ترجمة إنجليزية قديمة:<\/div><div class=\"u\">\"<span class=\"en\">Delight of Human kind, and Gods above<\/span>;<\/div><div class=\"u\"><span class=\"en\">Parent of Rome<\/span>; <span class=\"en\">Propitious Queen of Love<\/span>;<\/div><div class=\"u\"><span class=\"en\">Whose vital pow'r, Air, Earth, and Sea supplies<\/span>;<\/div><div class=\"u\"><span class=\"en\">And breeds what e'er is born beneath the rowling Skies<\/span>\"<\/div>", "n": 5, "a": "myth-m13-062", "x": "7c1651ac", "en": "Lucretius, the opening of his poem on the nature of things, in an old English translation: Delight of human kind, and gods above; parent of Rome; propitious queen of love; whose vital power, air, earth and sea supplies, and breeds whatever is born beneath the rolling skies.", "i": 86}, {"t": "tf", "h": "", "q": "عند لوكريتيوس فينوس قوة طبيعية بتخلّي الحياة شغالة.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: وأم روما كمان.", "غلط: ده بالظبط موقفه."], "i": 87}, {"t": "learn", "h": "<div class=\"u\">الترجمة: \"فرحة البشر، والآلهة اللي فوق؛ أم روما؛ ملكة الحب الراضية؛ اللي قوتها الحيوية بتمد الهوا والأرض والبحر، وبتولّد كل اللي بيتولد تحت السما الدايرة.\"<\/div>", "n": 1, "a": "myth-m13-063", "x": "f9ee6b69", "en": "Translation: joy of humans and the gods above; mother of Rome; gracious queen of love; whose life-giving power fills air, earth and sea, and begets all that is born under the turning sky.", "i": 88}, {"t": "learn", "h": "<div class=\"li\">الشرح: لاحظ إن فينوس هنا مش إلهة غراميات، هي قوة طبيعية: هي اللي بتخلّي الحياة تفضل شغالة. وده إيروس الأول، القوة الكونية، بس باسم فينوس.<\/div><div class=\"li\">و\"أم روما\" جاية من إينياس: فينوس جدة الرومان. يعني السطر ده سياسي وديني وعلمي في نفس الوقت.<\/div><div class=\"li\">ودي حاجة مهمة: الشعراء الإنجليز استخدموا فينوس في النسختين: إلهة الغرام (زي شكسبير)، وقوة الطبيعة (زي لوكريتيوس).<\/div>", "n": 3, "a": "myth-m13-064", "x": "de3360aa", "en": "Explanation: here Venus is not a goddess of romance but a natural force that keeps life going. That is the first Eros, the cosmic force, under the name Venus. And mother of Rome comes from Aeneas: Venus is the grandmother of the Romans, so the line is political, religious and scientific at once. English poets used Venus in both ways: goddess of romance (Shakespeare) and force of nature (Lucretius).", "i": 89}, {"t": "learn", "h": "<div class=\"u\">سبنسر (تشويق لـ <span class=\"en\">M109<\/span>): في \"ملكة الجن\"، الكتاب الثالث، فيه \"حديقة أدونيس\" (<span class=\"en\">Garden of Adonis<\/span>)، وفيها فينوس وأدونيس، والحديقة رمز للخصوبة الأبدية. هنقراها بالتفصيل.<\/div>", "n": 1, "a": "myth-m13-065", "x": "c9142a31", "en": "Spenser, a teaser for M109: in The Faerie Queene, Book 3, there is the Garden of Adonis, with Venus and Adonis, and the garden is a symbol of eternal fertility. We will read it in detail.", "i": 90}, {"t": "section", "h": "النقطة 10: أخطاء شائعة", "i": 91}, {"t": "learn", "h": "<div class=\"u\">\"أفروديت إلهة الجمال بس\". لأ. هي إلهة الحب والرغبة والقوة اللي بتحرّك كل حاجة حية، وفي روما بقت قوة سياسية (أم روما).<\/div>", "n": 1, "a": "myth-m13-066", "x": "7fb236ef", "en": "Common mistake: Aphrodite is only the goddess of beauty. No: she is the goddess of love, desire and the force that moves everything alive, and in Rome she became a political force, mother of Rome.", "i": 92}, {"t": "learn", "h": "<div class=\"u\">\"أفروديت بنت زيوس وديوني دائماً\". لأ. عند هسيود مالهاش أم ولا أب، طلعت من أعضاء أورانوس. عند هوميروس بنت زيوس وديوني. نسختين.<\/div>", "n": 1, "a": "myth-m13-067", "x": "f43f842a", "en": "Common mistake: Aphrodite is always the daughter of Zeus and Dione. No: in Hesiod she has no mother or father, she rose from Uranus's parts; in Homer she is the daughter of Zeus and Dione. Two versions.", "i": 93}, {"t": "learn", "h": "<div class=\"u\">\"إيروس ابن أفروديت من الأول\". لأ. عند هسيود إيروس من أقدم الآلهة، قوة كونية قبل أوليمبوس. الابن بيسهم في التقليد المتأخر.<\/div>", "n": 1, "a": "myth-m13-068", "x": "bec330f4", "en": "Common mistake: Eros is Aphrodite's son from the start. No: in Hesiod Eros is among the oldest gods, a cosmic force before Olympus. Being her son appears in the later tradition.", "i": 94}, {"t": "learn", "h": "<div class=\"u\">\"كيوبيد طفل سمين بأجنحة\". دي صورة هيلينستية (323-31 قبل الميلاد) اتطورت لكيوبيد الروماني، وبعدها للملائكة الصغار في الفن الأوروبي. مش الصورة اليونانية القديمة.<\/div>", "n": 1, "a": "myth-m13-069", "x": "bc7e1623", "en": "Common mistake: Cupid is a chubby winged child. That is a Hellenistic image (323-31 BC) that developed into Roman Cupid and then the cherubs of European art, not the old Greek image.", "i": 95}, {"t": "mc", "h": "", "q": "\"فينوس = أفروديت بالظبط\". إيه الغلط؟", "nq": 1, "opts": ["فينوس كانت في الأصل إلهة أقل شأناً وكبرت بعد التوحيد", "فينوس إله ذكر", "مفيش فرق"], "ans": 0, "why": "فينوس كانت في الأصل إلهة أقل شأناً وكبرت بعد التوحيد", "ex": ["صح: قريبة مش مطابقة.", "غلط: فينوس إلهة.", "غلط: فيه فرق."], "i": 96}, {"t": "learn", "h": "<div class=\"u\">\"فينوس = أفروديت بالظبط\". قريبة، بس فينوس الرومانية كانت في الأصل إلهة أقل شأناً، وكبرت بعد ما اتوحّدت مع أفروديت.<\/div>", "n": 1, "a": "myth-m13-070", "x": "54ac3f2c", "en": "Common mistake: Venus equals Aphrodite exactly. Close, but Roman Venus was originally a lesser goddess and grew after identification with Aphrodite.", "i": 97}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين أفروديت عند هسيود وأفروديت عند هوميروس: الأصل، والعيلة، وإيه اللي كل نسخة بتقوله عن الحب.", "a": "<div class=\"u\">عند هسيود أفروديت مالهاش أم ولا أب بالمعنى العادي: هي بنت زبد طلع حوالين أعضاء أورانوس بعد ما كرونوس قطعها ورماها في البحر. يعني ميلادها من عنف وجرح، وإيروس والرغبة بيمشوا معاها من أول لحظة. عند هوميروس هي بنت زيوس وديوني، يعني داخلة في عيلة الآلهة عادي، ومن غير المشهد البشع.<\/div><div class=\"u\">الفرق بيغيّر معنى الحب: نسخة هسيود بتقول إن الحب قوة كونية بتطلع من جرح وعنف، وما حدش يقدر يتحكم فيها. نسخة هوميروس بتخلي الحب جزء من نظام الأسرة الإلهية، وبتحكي عنه بأسلوب اجتماعي: جواز، وخيانة، وفضيحة، وضحك.<\/div><div class=\"u\">والتشابه إن الاتنين بيسموها إلهة قوية، والاتنين بيربطوها بقبرص والبحر. والخلاصة: الأسطورة ليها نسخ، والنسخة اللي تختارها بتحدد هتقول إيه عن الحب.<\/div>", "key": "myth-m13:W70", "n": 1, "i": 98}, {"t": "end", "h": "", "teaser": "الفصل الجاي (<span class=\"en\">M14<\/span>): هيرميس، الرسول واللص وإله الحدود.", "extra": "", "i": 99}];</script>
