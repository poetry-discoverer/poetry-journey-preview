<script>window.LESSON_ID="myth-m2";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 1) يعني إيه قصة خلق؟</div><div class=\"u\">كل حضارة قديمة عندها حكاية بتجاوب على أصعب سؤال: \"العالم ده جه منين؟\"</div><div class=\"li\">مثال من حياتنا: زي ما تلاقي شقتك مكركبة قبل ما تنضفها — حاجات مرمية من غير ترتيب — وبعدين تبتدي ترتب كل حاجة في مكانها.</div><div class=\"li\">الإغريق شافوا الكون كده بالظبط: كان \"كركبة\" الأول، وبعدين جه الترتيب.</div>", "n": 4, "i": 0, "a": "myth-m2-001", "x": "ad5e1739"}, {"t": "learn", "h": "<div class=\"li\">المهم للشعر: الشاعر لما يقول \"<span class=\"en\">Chaos</span>\" مش قصده \"زحمة\"، قصده الكلمة القديمة بالمعنى ده: اللاشكل اللي كان قبل كل شكل.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 2) <span class=\"en\">Chaos</span>: أول حاجة خالص</div><div class=\"u\"><span class=\"en\">Hesiod</span> في <span class=\"en\">Theogony</span> (حوالي 700 ق.م) بيقول بالحرف:</div><div class=\"u\">\"<span class=\"en\">Verily at the first Chaos came to be,</span> <span class=\"en\">but next wide-bosomed Earth.</span>.. <span class=\"en\">and dim Tartarus.</span>.. <span class=\"en\">and Eros</span> (<span class=\"en\">Love</span>), <span class=\"en\">fairest among the deathless gods</span>\" (<span class=\"en\">Theogony 116-120</span>)</div>", "n": 4, "i": 1, "a": "myth-m2-002", "x": "9e2a0d2a"}, {"t": "mc", "h": "", "q": "كلمة <span class=\"en\">Chaos</span> في الشعر الإنجليزي القديم معناها الأصلي...", "nq": 1, "opts": ["اللاشكل اللي كان قبل كل شكل", "زحمة وضوضاء", "حرب"], "ans": 0, "why": "اللاشكل اللي كان قبل كل شكل", "ex": ["صح: اللاشكل اللي كان قبل كل شكل، مش مجرد زحمة.", "غلط: ده معناها في الشارع.", "غلط: مش المعنى الأصلي."], "i": 2}, {"t": "learn", "h": "<div class=\"li\">الترتيب: <span class=\"en\">Chaos</span> الأول، بعده <span class=\"en\">Gaia</span> (الأرض)، بعده <span class=\"en\">Tartarus</span> (الهاوية تحت الأرض)، وبعده <span class=\"en\">Eros</span> (الحب).</div><div class=\"li\">ليه الحب بدري؟ عشان من غير \"انجذاب\" مفيش حاجة هتتحد مع حاجة ولا حاجة هتتولد. فكرة عبقرية: الحب هو أول قوة خلق.</div><div class=\"li\"><span class=\"en\">Chaos</span> مش إله بشكل، دي حالة: فجوة/فراغ لانهائي بلا ملامح. ومنها طلع <span class=\"en\">Erebus</span> (الظلام) و<span class=\"en\">Night</span> (الليل)، ومنهم <span class=\"en\">Aether</span> (النور) و<span class=\"en\">Day</span> (النهار).</div>", "n": 3, "i": 3, "a": "myth-m2-003", "x": "e4a40f7f"}, {"t": "mc", "h": "", "q": "الترتيب عند <span class=\"en\">Hesiod</span> في <span class=\"en\">Theogony</span> هو...", "nq": 1, "opts": ["<span class=\"en\">Chaos</span>، <span class=\"en\">Gaia</span>، <span class=\"en\">Tartarus</span>، <span class=\"en\">Eros</span>", "<span class=\"en\">Gaia</span>، <span class=\"en\">Chaos</span>، <span class=\"en\">Eros</span>، <span class=\"en\">Tartarus</span>", "<span class=\"en\">Eros</span>، <span class=\"en\">Chaos</span>، <span class=\"en\">Gaia</span>، <span class=\"en\">Tartarus</span>"], "ans": 0, "why": "<span class=\"en\">Chaos</span>، <span class=\"en\">Gaia</span>، <span class=\"en\">Tartarus</span>، <span class=\"en\">Eros</span>", "ex": ["صح: <span class=\"en\">Chaos</span> الأول، وبعده <span class=\"en\">Gaia</span> و<span class=\"en\">Tartarus</span> و<span class=\"en\">Eros</span>.", "غلط: <span class=\"en\">Chaos</span> بيجي قبل <span class=\"en\">Gaia</span>.", "غلط: <span class=\"en\">Chaos</span> بيجي الأول مش <span class=\"en\">Eros</span>."], "i": 4}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 3) <span class=\"en\">Gaia</span> و<span class=\"en\">Uranus</span>: أول جواز وأول مشكلة عائلية</div><div class=\"li\"><span class=\"en\">Gaia</span> (الأرض) ولّدت <span class=\"en\">Uranus</span> (السماء) من غير زوج، وبعدين اتجوزته. (في الأساطير ده عادي: الأولين كلهم عيلة واحدة.)</div><div class=\"li\">ولادتهم:</div>", "n": 3, "i": 5, "a": "myth-m2-004", "x": "b46686c7"}, {"t": "learn", "h": "<div class=\"u\">١) الـ <span class=\"en\">Titans</span> الـ 12: ستة ولاد وست بنات. <span class=\"en\">Hesiod</span> عدّهم بالاسم (<span class=\"en\">Theogony 133-138</span>): <span class=\"en\">Oceanus,</span> <span class=\"en\">Coeus,</span> <span class=\"en\">Crius,</span> <span class=\"en\">Hyperion,</span> <span class=\"en\">Iapetus,</span> <span class=\"en\">Theia,</span> <span class=\"en\">Rhea,</span> <span class=\"en\">Themis,</span> <span class=\"en\">Mnemosyne,</span> <span class=\"en\">Phoebe,</span> <span class=\"en\">Tethys</span>، وآخرهم <span class=\"en\">Cronos</span> \"أصغرهم وأخطرهم وكان بيكره أبوه\".</div><div class=\"u\">٢) الـ <span class=\"en\">Cyclopes</span>: عمالقة بعين واحدة، صنّاع البرق.</div><div class=\"u\">٣) الـ <span class=\"en\">Hecatoncheires</span>: وحوش بمية إيد.</div>", "n": 3, "i": 6, "a": "myth-m2-005", "x": "788ba0e3"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">Cyclopes</span> هم...", "nq": 1, "opts": ["عمالقة بعين واحدة وصنّاع البرق", "وحوش بمية إيد", "ست بنات"], "ans": 0, "why": "عمالقة بعين واحدة وصنّاع البرق", "ex": ["صح: عمالقة بعين واحدة، وصنعوا الصاعقة لـ <span class=\"en\">Zeus</span>.", "غلط: دول الـ <span class=\"en\">Hecatoncheires</span>.", "غلط: دول مش الـ <span class=\"en\">Cyclopes</span>."], "i": 7}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Uranus</span> خاف من ولاده وحبسهم جوه الأرض. <span class=\"en\">Gaia</span> اتوجعت وعملت منجل، وقالت لولادها: مين فيكم يعاقب أبوه؟</div><div class=\"li\"><span class=\"en\">Cronos</span> الوحيد اللي استجاب: قطع عضو أبوه بالمنجل. من الدم طلعت الـ <span class=\"en\">Furies</span>، ومن العضو اللي اترمى في البحر طلعت <span class=\"en\">Aphrodite.</span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 4) <span class=\"en\">Cronos</span> ياكل ولاده</div>", "n": 3, "i": 8, "a": "myth-m2-006", "x": "72b30f17"}, {"t": "mc", "h": "", "q": "مين اللي استجاب لطلب <span class=\"en\">Gaia</span> وعاقب أبوه <span class=\"en\">Uranus</span> بالمنجل؟", "nq": 1, "opts": ["<span class=\"en\">Cronos</span>", "<span class=\"en\">Zeus</span>", "<span class=\"en\">Hades</span>"], "ans": 0, "why": "<span class=\"en\">Cronos</span>", "ex": ["صح: <span class=\"en\">Cronos</span> الوحيد اللي استجاب.", "غلط: <span class=\"en\">Zeus</span> جه بعدين وحارب <span class=\"en\">Cronos</span>.", "غلط: <span class=\"en\">Hades</span> كان ابن <span class=\"en\">Cronos</span> اللي بلعه."], "i": 9}, {"t": "learn", "h": "<div class=\"li\">اتنبأ لـ <span class=\"en\">Cronos</span> إن ابنه هيعمل فيه زي ما هو عمل في أبوه. فكان بيبلع كل مولود من مراته <span class=\"en\">Rhea</span> أول ما يتولد: <span class=\"en\">Hestia</span> و<span class=\"en\">Demeter</span> و<span class=\"en\">Hera</span> و<span class=\"en\">Hades</span> و<span class=\"en\">Poseidon.</span></div><div class=\"li\">مثال من حياتنا: زي ديكتاتور بيخلص من أي منافس محتمل قبل ما يكبر — بس هنا \"المنافسين\" ولاده هو.</div><div class=\"li\"><span class=\"en\">Rhea</span> زهقت: خبّت آخر مولود (<span class=\"en\">Zeus</span>) في جزيرة كريت وقدمت له حجر ملفوف في قماط، فبلعه <span class=\"en\">Cronos</span> من غير ما يبص.</div>", "n": 3, "i": 10, "a": "myth-m2-007", "x": "ae83da17"}, {"t": "mc", "h": "", "q": "ليه كان <span class=\"en\">Cronos</span> بيبلع ولاده؟", "nq": 1, "opts": ["اتنبأ له إن ابنه هيقلعه من العرش", "كان جعان", "كانت لعبة"], "ans": 0, "why": "اتنبأ له إن ابنه هيقلعه من العرش", "ex": ["صح: اتنبأ له إن ابنه هيعمل فيه زي ما عمل في أبوه.", "غلط: السبب النبوءة.", "غلط: السبب النبوءة."], "i": 11}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 5) الـ <span class=\"en\">Titanomachy</span>: حرب الجيلين (عشر سنين)</div><div class=\"li\"><span class=\"en\">Zeus</span> كبر ورجع، خلى أبوه يرجّع إخواته، وأعلن الحرب على الـ <span class=\"en\">Titans.</span> الحرب دي اسمها <span class=\"en\">Titanomachy</span> واستمرت عشر سنين (<span class=\"en\">Hesiod</span>).</div><div class=\"li\"><span class=\"en\">Zeus</span> حرّر الـ <span class=\"en\">Cyclopes</span> من السجن، فشكروه بأجمل هدية في الأساطير: الصاعقة (<span class=\"en\">thunderbolt</span>). وحرّر الـ <span class=\"en\">Hecatoncheires</span> فرموا صخور بمية إيد.</div>", "n": 3, "i": 12, "a": "myth-m2-008", "x": "a2d1ab9b"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">Titanomachy</span> هي...", "nq": 1, "opts": ["حرب الجيلين بين <span class=\"en\">Zeus</span> والـ <span class=\"en\">Titans</span> واستمرت عشر سنين", "حرب طروادة", "رحلة <span class=\"en\">Odysseus</span>"], "ans": 0, "why": "حرب الجيلين بين <span class=\"en\">Zeus</span> والـ <span class=\"en\">Titans</span> واستمرت عشر سنين", "ex": ["صح: عشر سنين، وانتهت بغلبة الـ <span class=\"en\">Titans</span> واتحبسوا في <span class=\"en\">Tartarus</span>.", "غلط: حرب طروادة حرب تانية.", "غلط: ده في الأوديسا."], "i": 13}, {"t": "learn", "h": "<div class=\"li\">النتيجة: الـ <span class=\"en\">Titans</span> اتغلبوا واتحبسوا في <span class=\"en\">Tartarus</span>، و<span class=\"en\">Atlas</span> (من طرف الـ <span class=\"en\">Titans</span>) اتعاقب بأنه يشيل السما على كتفه للأبد.</div><div class=\"li\">وبكده اتأسس نظام الأوليمبيين: <span class=\"en\">Zeus</span> سيد السما، <span class=\"en\">Poseidon</span> البحر، <span class=\"en\">Hades</span> العالم السفلي.</div><div class=\"li\">مثال من حياتنا: جيل بيقلب على جيل: الجد (<span class=\"en\">Uranus</span>) قلع عليه الأب (<span class=\"en\">Cronos</span>)، والأب قلع عليه الابن (<span class=\"en\">Zeus</span>).</div>", "n": 3, "i": 14, "a": "myth-m2-009", "x": "26ca23bb"}, {"t": "mc", "h": "", "q": "إيه عقاب <span class=\"en\">Atlas</span> بعد الحرب؟", "nq": 1, "opts": ["يشيل السما على كتفه للأبد", "يتحبس في الجبل", "يتحول لشجرة"], "ans": 0, "why": "يشيل السما على كتفه للأبد", "ex": ["صح: اتعاقب بشيل السما للأبد.", "غلط: ده عقاب تاني.", "غلط: ده مش عقابه."], "i": 15}, {"t": "learn", "h": "<div class=\"li\">القاعدة اللي هتشوفها في كل الأسطورة: اللي بياخد العرش بالقوة بيعيش خايف يتقلع بنفس الطريقة.</div>", "n": 1, "i": 16, "a": "myth-m2-010", "x": "24c78b1d"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 6) الأسطورة في الشعر الإنجليزي:</div><div class=\"u\">أ) <span class=\"en\">Ovid</span> بترجمة <span class=\"en\">Arthur Golding</span> (1567) — الترجمة اللي شكسبير نفسه قراها، <span class=\"en\">Metamorphoses</span> الكتاب 1:</div><div class=\"u\">\"<span class=\"en\">Before the Sea and Lande were made,</span> <span class=\"en\">and Heaven that all doth hide,</span></div><div class=\"u\"><span class=\"en\">In all the worlde one onely face of nature did abide,</span></div><div class=\"u\"><span class=\"en\">Which Chaos hight,</span> <span class=\"en\">a huge rude heape.</span>..\"</div>", "n": 4, "i": 17, "a": "myth-m2-011", "x": "a1dcbc77"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">In all the _____ one onely face of nature did abide,</div>", "opts": ["shady", "again", "worlde"], "ans": 2, "why": "<span class=\"en\">In all the worlde one onely face of nature did abide,</span>", "i": 18, "ex": ["غلط: <span class=\"en\">shady</span> تعني ظليلاً، ولا تناسب عبارة 'في الكل ...'. السياق يتحدث عن العالم كله قبل الخلق.", "غلط: <span class=\"en\">again</span> ظرف (مرة أخرى)، ولا يأتي بعد <span class=\"en\">the</span>.", "صح: من ترجمة <span class=\"en\">Golding</span> لـ <span class=\"en\">Ovid</span>: <span class=\"en\">In all the worlde one onely face of nature did abide</span>، أي في العالم كله كان لطبيعة وجه واحد (<span class=\"en\">worlde</span> = <span class=\"en\">world</span> بالإملاء القديم)."]}, {"t": "learn", "h": "<div class=\"u\">(\"قبل ما البحر والأرض يتخلقوا، كان في العالم كله شكل واحد للطبيعة، اسمه <span class=\"en\">Chaos</span>: كومة ضخمة خشنة...\")</div><div class=\"u\">لما تلاقي \"<span class=\"en\">chaos</span>\" عند شكسبير (زي في <span class=\"en\">Othello</span>: \"<span class=\"en\">perdition catch my soul</span> / <span class=\"en\">But I do love thee</span>! <span class=\"en\">and when I love thee not,</span> / <span class=\"en\">Chaos is come again</span>\") فهو بيستدعي الصورة دي: رجوع الكون لأصله المكركب = انهيار كل نظام.</div>", "n": 2, "i": 19, "a": "myth-m2-012", "x": "90756c9d"}, {"t": "learn", "h": "<div class=\"u\">ب) ميلتون، <span class=\"en\">Paradise Lost</span> الكتاب 2: الشيطان بيعدي في رحلته من الجحيم على مملكة:</div><div class=\"u\">\"<span class=\"en\">eldest Night</span> / <span class=\"en\">And Chaos,</span> <span class=\"en\">ancestors of Nature,</span> <span class=\"en\">hold</span> / <span class=\"en\">Eternal Anarchy</span>\" (<span class=\"en\">PL 2.894-896</span>)</div><div class=\"u\">ميلتون حوّل <span class=\"en\">Chaos</span> لمكان وملك: <span class=\"en\">Chaos</span> والليل \"أجداد الطبيعة\" حاكمين فوضى أبدية. الصورة الإغريقية بقت جزء من جغرافيا ملحمة مسيحية.</div>", "n": 3, "i": 20, "a": "myth-m2-013", "x": "f9e7aeed"}, {"t": "learn", "h": "<div class=\"u\">ج) <span class=\"en\">Keats</span>، بداية ملحمته \"<span class=\"en\">Hyperion</span>\" (1818-19) عن سقوط الـ <span class=\"en\">Titans</span>:</div><div class=\"u\">\"<span class=\"en\">Deep in the shady sadness of a vale</span></div><div class=\"u\"><span class=\"en\">Far sunken from the healthy breath of morn,</span></div><div class=\"u\"><span class=\"en\">Far from the fiery noon,</span> <span class=\"en\">and eve's one star,</span></div><div class=\"u\"><span class=\"en\">Sat gray-hair'd Saturn,</span> <span class=\"en\">quiet as a stone</span>\"</div>", "n": 5, "i": 21, "a": "myth-m2-014", "x": "05ea9050"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Hyperion</span> لـ <span class=\"en\">Keats</span>، إيه الاسم الروماني لـ <span class=\"en\">Cronos</span>؟", "nq": 1, "opts": ["<span class=\"en\">Saturn</span>", "<span class=\"en\">Jupiter</span>", "<span class=\"en\">Neptune</span>"], "ans": 0, "why": "<span class=\"en\">Saturn</span>", "ex": ["صح: <span class=\"en\">Cronos</span> هو <span class=\"en\">Saturn</span>.", "غلط: <span class=\"en\">Jupiter</span> هو <span class=\"en\">Zeus</span>.", "غلط: <span class=\"en\">Neptune</span> هو <span class=\"en\">Poseidon</span>."], "i": 22}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Saturn</span> هو الاسم الروماني لـ <span class=\"en\">Cronos</span>: الملك المخلوع قاعد في الوادي \"ساكن زي الحجر\". <span class=\"en\">Keats</span> خد حرب الجيلين وعملها تراجيديا عن الجيل القديم اللي لازم يروح عشان الجديد ييجي.</div>", "n": 1, "i": 23, "a": "myth-m2-015", "x": "61097dda"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 7) كلمات إنجليزي من درس النهارده:</div><div class=\"u\"><span class=\"en\">chaos</span> / <span class=\"en\">chaotic</span> (مش \"زحمة\" — معناها الأصلي اللاشكل) • <span class=\"en\">titan</span> / <span class=\"en\">titanic</span> / <span class=\"en\">titanium</span> • <span class=\"en\">Uranus</span> (الكوكب) • <span class=\"en\">Gaia</span> (وكلمة <span class=\"en\">geography</span> و<span class=\"en\">geology</span> من نفس الجذر) • <span class=\"en\">erotic</span> من <span class=\"en\">Eros.</span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">✏️</span></span> كويز <span class=\"en\">M2</span> (بعد ٣٠ دقيقة):</div><div class=\"u\">١) رتّب دول حسب الظهور عند <span class=\"en\">Hesiod</span>: <span class=\"en\">Eros,</span> <span class=\"en\">Chaos,</span> <span class=\"en\">Titans,</span> <span class=\"en\">Gaia.</span> وليه ترتيبهم مهم؟</div>", "n": 3, "i": 24, "a": "myth-m2-016", "x": "4e9a7578"}, {"t": "learn", "h": "<div class=\"u\">٢) احكِ قصة \"الحجر الملفوف\" وبيّن إيه القاعدة المتكررة في أجيال الحكم.</div><div class=\"u\">٣) إيه الفرق بين معنى \"<span class=\"en\">chaos</span>\" في الشارع ومعناها في الشعر؟ ادّي مثال <span class=\"en\">Othello.</span></div><div class=\"u\">٤) ليه <span class=\"en\">Keats</span> اختار <span class=\"en\">Saturn</span> مش <span class=\"en\">Zeus</span> بطل لملحمته؟ وإيه الفكرة اللي بيعبّر عنها؟</div><div class=\"u\">٥) ترجم واشرح سطرين <span class=\"en\">Golding</span> عن <span class=\"en\">Chaos</span>، وقول ليه الترجمة دي بالذات مهمة لطالب أدب إنجليزي.</div>", "n": 4, "i": 25, "a": "myth-m2-017", "x": "6f7c92a2"}, {"t": "end", "h": "", "teaser": "", "extra": "(المصادر: <span class=\"en\">Hesiod,</span> <span class=\"en\">Theogony 116-138</span> (ترجمة <span class=\"en\">Evelyn-White</span>، <span class=\"en\">Loeb)</span>؛ <span class=\"en\">Ovid,</span> <span class=\"en\">Metamorphoses</span> بترجمة <span class=\"en\">Golding 1567</span> الكتاب 1. كل الاقتباسات متراجعة على النصوص المنشورة)", "i": 26}];</script>
