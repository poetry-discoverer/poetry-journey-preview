<script>window.LESSON_ID="history-4";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Beowulf</span> ج2: أم الوحش، التنين، ونهاية البطل\"</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🐉</span></span> في الجزء اللي فات: بيوولف قتل جرندل بإيده الفاضية، والدنمارك فرحت. بس الملحمة لسه مخلصتش. النهاردة هنكمل: الانتقام الجاي من المستنقع، وبعدها خمسين سنة كاملة، التنين ونهاية البطل. جهز نفسك، الجزء ده أحزن وأعمق.</div><div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️</span></span>⃣: أم جرندل، الانتقام اللي محدش حسب حسابه <span class=\"em\"><span class=\"em\">🌊</span></span></div>", "n": 3, "i": 0, "a": "history-4-001", "x": "997e69af"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الليلة اللي بعد الفرح:</div><div class=\"li\">الكل نام مبسوط إن الكابوس خلص. بس في الضلمة، أم جرندل طلعت من المستنقع تنتقم لابنها.</div><div class=\"li\">اقتحمت هيروت وخطفت Æ<span class=\"en\">schere</span>، أقرب صاحب ومستشار للملك هرودجار، وقتلته.</div><div class=\"li\">لاحظ الذكاء الفني: القصيدة بتقولك الفرح مبيدومش، وكل انتصار ليه ثمن.</div>", "n": 3, "i": 1, "a": "history-4-002", "x": "397016bb"}, {"t": "mc", "h": "", "q": "مين اللي اقتحمت هيروت بعد موت <span class=\"en\">Grendel</span>؟", "nq": 1, "opts": ["أم <span class=\"en\">Grendel</span>", "التنين", "<span class=\"en\">Unferth</span>"], "ans": 0, "why": "أم <span class=\"en\">Grendel</span>", "ex": ["صح: طلعت من المستنقع تنتقم لابنها.", "غلط: التنين في الآخر.", "غلط: <span class=\"en\">Unferth</span> من بلاط الملك."], "i": 2}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> البحيرة الملعونة (<span class=\"en\">the mere</span>):</div><div class=\"li\">مكان الأم: بحيرة مرعبة، ميتها بيغلي، ونار غريبة بتبان على وشها بالليل، والغزال المطارد يفضل يموت على شطها وما ينزلش يشرب منها.</div><div class=\"li\">بيوولف مفكرش مرتين: لبس درعه ونزل المية لوحده. وأنفيرث، اللي كان ساخر منه، اداله سيفه الشهير <span class=\"en\">Hrunting</span> كأنه بيعتذر.</div>", "n": 2, "i": 3, "a": "history-4-003", "x": "38e387cc"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> المعركة تحت المية:</div><div class=\"li\">الأم جرته لقاعتها تحت، و<span class=\"en\">Hrunting</span> فشل، أول مرة في تاريخه يفشل.</div><div class=\"li\">بيوولف كان هيتخنق، بس عينه وقعت على سيف عملاق من صنع العمالقة معلق في المكان، خطفه وضربها بيه فقتلها.</div><div class=\"li\">وبعدين شاف جثة جرندل نايمة، فقطع راسها.</div><div class=\"li\">دم الوحوش كان حارق لدرجة إن نصل السيف اتداب زي التلج، وفضل بس اليد (الـ <span class=\"en\">hilt</span>).</div>", "n": 4, "i": 4, "a": "history-4-004", "x": "e53d0a13"}, {"t": "mc", "h": "", "q": "في المعركة تحت المية، السيف <span class=\"en\">Hrunting</span>...", "nq": 1, "opts": ["فشل، وبيوولف قتلها بسيف عملاق لقاه هناك", "كسر الوحش", "اتسرق"], "ans": 0, "why": "فشل، وبيوولف قتلها بسيف عملاق لقاه هناك", "ex": ["صح: أول مرة في تاريخه يفشل.", "غلط: فشل مش نجح.", "غلط: مش المذكور."], "i": 5}, {"t": "learn", "h": "<div class=\"li\">طلع شايل الراس واليد، والراس كانت تقيلة لدرجة إن 4 رجالة شالوها بصعوبة.</div>", "n": 1, "i": 6, "a": "history-4-005", "x": "28e89b53"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> خطبة الملك:</div><div class=\"li\">بعد الفرح، هرودجار العجوز وقف يعمل خطبة طويلة لبيوولف: خليك شجاع بس متحتشمش، القوة بتروح، والكبر بيهلك قبل الموت.</div><div class=\"li\">(النقاد بيسموا الجزء ده \"خطبة هرودجار\"، وهو من أشهر أجزاء القصيدة.)</div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️</span></span>⃣: خمسين سنة من الحكم الكويس <span class=\"em\"><span class=\"em\">👑</span></span></div><div class=\"li\">بيوولف رجع بلده، وادى كل الغنايم لملكه <span class=\"en\">Hygelac</span>، وده كرم وولاء مش طمع.</div><div class=\"li\">الملك كافأه بأرض وقاعة وعرش.</div>", "n": 5, "i": 7, "a": "history-4-006", "x": "8a0d67ee"}, {"t": "learn", "h": "<div class=\"li\">وبعدين <span class=\"en\">Hygelac</span> مات في معركة، ومن بعده ابنه، فبقى بيوولف ملك الـ <span class=\"en\">Geats.</span></div><div class=\"li\">وحكم 50 سنة كاملة حكم كويس، والقصيدة بتختصر النص ده كله في سطور قليلة، كأنها بتقول: السنين الهادية مش محتاجة حكي كتير.</div><div class=\"li\">مثال يومي: زي لما تحكي عن عمك: \"عاش خمسين سنة شغل وعيلة وستر\"، جملة واحدة، بس وزنها عمر.</div><div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️</span></span>⃣: التنين <span class=\"em\"><span class=\"em\">🔥</span></span></div>", "n": 4, "i": 8, "a": "history-4-007", "x": "efc3262e"}, {"t": "mc", "h": "", "q": "كام سنة حكم <span class=\"en\">Beowulf</span> الـ <span class=\"en\">Geats</span>؟", "nq": 1, "opts": ["50 سنة", "5 سنين", "100 سنة"], "ans": 0, "why": "50 سنة", "ex": ["صح: 50 سنة حكم كويس.", "غلط: أطول.", "غلط: أقصر."], "i": 9}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> بداية الكارثة:</div><div class=\"li\">في أرض الـ <span class=\"en\">Geats</span> فيه تل جواه كنز قديم، بيحرسه تنين من 300 سنة.</div><div class=\"li\">واحد هربان دخل التل وسرق كأس دهب عشان يرضي سيده. التنين صحي لقى الكأس مش موجودة.</div><div class=\"li\">غضب التنين: طلع يطير بالليل ويحرق البيوت والقاعات.</div>", "n": 3, "i": 10, "a": "history-4-008", "x": "78b1a7f9"}, {"t": "mc", "h": "", "q": "التنين صحي ليه؟", "nq": 1, "opts": ["واحد هربان سرق كأس دهب من التل", "<span class=\"en\">Beowulf</span> هاجمه", "<span class=\"en\">Hrothgar</span> استدعاه"], "ans": 0, "why": "واحد هربان سرق كأس دهب من التل", "ex": ["صح: وكان بيحرس الكنز من 300 سنة.", "غلط: <span class=\"en\">Beowulf</span> راح بعد الهجوم.", "غلط: مش المذكور."], "i": 11}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> قرار الملك العجوز:</div><div class=\"li\">بيوولف بقى عجوز، بس قال: دي بلدي وشعبي، وأنا اللي هروح. زي زمان، قال الـ <span class=\"en\">boast</span> الأخير: أنا اللي هقابل التنين.</div><div class=\"li\">راح معاه 11 راجل، وواحد منهم هو اللي سرق الكأس بيمشي قدامهم دليل للطريق.</div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️</span></span>⃣: المعركة الأخيرة <span class=\"em\"><span class=\"em\">⚔️</span></span></div>", "n": 3, "i": 12, "a": "history-4-009", "x": "404197ef"}, {"t": "learn", "h": "<div class=\"li\">التنين طلع بناره. بيوولف ضربه بسيفه العتيق <span class=\"en\">Naegling</span>، بس السيف اتكسر. صدفة مؤلمة: السيوف دايماً بتخونه في معاركه الكبيرة.</div><div class=\"li\">العشرة رجالة هربوا للغابة من الخوف. واحد بس فضل: شاب اسمه <span class=\"en\">Wiglaf</span>، قريب بيوولف.</div><div class=\"li\"><span class=\"en\">Wiglaf</span> وقف يعاير زمايله الهاربين: انسيتوا الكؤوس اللي شربناها والخواتم اللي خدناها والوعود اللي قطعناها لسيدنا في القاعة؟ وبعدين جري على نار التنين.</div>", "n": 3, "i": 13, "a": "history-4-010", "x": "77b6a420"}, {"t": "mc", "h": "", "q": "إيه اللي حصل مع الرجالة اللي راحوا مع <span class=\"en\">Beowulf</span> في معركة التنين؟", "nq": 1, "opts": ["هربوا كلهم إلا <span class=\"en\">Wiglaf</span>", "وقفوا كلهم", "ماتوا كلهم"], "ans": 0, "why": "هربوا كلهم إلا <span class=\"en\">Wiglaf</span>", "ex": ["صح: 10 هربوا وواحد وقف.", "غلط: واحد بس وقف.", "غلط: فضل <span class=\"en\">Wiglaf</span>."], "i": 14}, {"t": "learn", "h": "<div class=\"li\">التنين عض بيوولف في رقبته، والسم دخل جسمه. بس الاتنين مع بعض، العجوز والشاب، قدروا يقتلوا التنين: <span class=\"en\">Wiglaf</span> طعنه من تحت، وبيوولف خلص عليه بسكينته.</div>", "n": 1, "i": 15, "a": "history-4-011", "x": "929d8dcf"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> موت البطل:</div><div class=\"li\">بيوولف عارف إن النهاية جات. طلب من <span class=\"en\">Wiglaf</span> يجيبله شوية من الكنز يشوفه قبل ما يموت.</div><div class=\"li\">وبعدين اده الياقوتة الدهب والخوذة والدرع، وقاله المعنى: انت آخر واحد في نسلنا، خد مكاني.</div><div class=\"li\">آخر طلب: ابنوا ليا تل على راس البحر اسمه <span class=\"en\">Hronesness</span> (راس الحوت)، وسمّوه \"تل بيوولف\"، عشان المراكب تشوفه من بعيد ويفتكروني.</div>", "n": 3, "i": 16, "a": "history-4-012", "x": "60dd4c0b"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الجنازة:</div><div class=\"li\">محرقة عظيمة على شط البحر، وتل ضخم فوق الرماد.</div><div class=\"li\">12 فارس لفوا حوالين التل على خيولهم بيغنوا في رثاه.</div><div class=\"li\">وآخر سطور القصيدة كلها (سطور 3180-3182) بتحكي إنهم وصفوه بإنه:</div><div class=\"u\">\"<span class=\"en\">wyruldcyninga manna mildust ond mon</span>ð<span class=\"en\">w</span>æ<span class=\"en\">rust,</span></div><div class=\"u\"><span class=\"en\">leodum li</span>ð<span class=\"en\">ost ond lofgeornost</span>\"</div><div class=\"u\">المعنى: \"أرق ملوك الدنيا وألطفهم، وأحنّهم على شعبه، وأحرصهم على المجد\".</div>", "n": 6, "i": 17, "a": "history-4-013", "x": "e3432286"}, {"t": "learn", "h": "<div class=\"li\">الكلمة الأخيرة في القصيدة كلها هي <span class=\"en\">lofgeornost</span>: الأحرص على المجد. افتكر قيمة <span class=\"en\">lof</span> من الدرس اللي فات؟ القصيدة قفلت عليها بآخر حرف.</div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️</span></span>⃣: إيه اللي بيتقال هنا تحت الحكاية؟ <span class=\"em\"><span class=\"em\">🌑</span></span></div>", "n": 2, "i": 18, "a": "history-4-014", "x": "841ca2b8"}, {"t": "mc", "h": "", "q": "إيه الكلمة الأخيرة في القصيدة؟", "nq": 1, "opts": ["<span class=\"en\">lofgeornost</span> (الأحرص على المجد)", "<span class=\"en\">wyrd</span>", "<span class=\"en\">Heorot</span>"], "ans": 0, "why": "<span class=\"en\">lofgeornost</span> (الأحرص على المجد)", "ex": ["صح: <span class=\"en\">lofgeornost</span>.", "غلط: ده القدر.", "غلط: ده اسم القاعة."], "i": 19}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> نغمة الرثاء:</div><div class=\"li\">الجزء ده مش مغامرة، ده وداع. البطل مات، والرسل بتقول إن الجيتس خايفين من حروب جاية من السويديين من غير ملكهم. النهاية مش \"وعاشوا في سعادة\"، النهاية قلق وحزن.</div>", "n": 1, "i": 20, "a": "history-4-015", "x": "1182c879"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الولاء آخر حاجة بتتجرب:</div><div class=\"li\">10 هربوا وواحد وقف. القصيدة بتحط الولاء على الميزان في أصعب لحظة، و<span class=\"en\">Wiglaf</span> هو الجواب. افتكر قيمة <span class=\"en\">comitatus</span>؟ هنا شفتها بتتكسر وبتتثبت في نفس المشهد.</div>", "n": 1, "i": 21, "a": "history-4-016", "x": "587fb9b4"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> خليط الوثني والمسيحي:</div><div class=\"li\">الراهب اللي كتب القصيدة مسيحي، وأبطالها وثنيون. عشان كده هتلاقي جنازة بالحرق (وثنية) جنب كلام عن ربنا والقضاء (مسيحي). الخليط ده من أمتع ما فيها.</div>", "n": 1, "i": 22, "a": "history-4-017", "x": "5171d216"}, {"t": "mc", "h": "", "q": "إزاي بيظهر الخليط الوثني والمسيحي في القصيدة؟", "nq": 1, "opts": ["جنازة بالحرق (وثنية) جنب كلام عن ربنا (مسيحي)", "كلها وثنية", "كلها مسيحية"], "ans": 0, "why": "جنازة بالحرق (وثنية) جنب كلام عن ربنا (مسيحي)", "ex": ["صح: الراهب المسيحي كتب عن أبطال وثنيين.", "غلط: فيها خليط.", "غلط: فيها خليط."], "i": 23}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📝</span></span> كويز الدرس 4 (مقالي أو بالصوت):</div><div class=\"u\">١. احكي معركة بيوولف مع أم جرندل من أول ما نزل المية لحد ما طلع، واذكر السيفين اللي ظهروا فيها.</div><div class=\"u\">٢. ليه هروب العشرة رجالة كان عار كبير؟ اربطه بقيمة اتعلمناها في الدرس اللي فات.</div><div class=\"u\">٣. بيوولف في شبابه حارب بإيده الفاضية، وفي شيخوخته حارب بسيف ودرع. شايف فرق؟ وإيه رأيك فيه؟</div>", "n": 3, "i": 24, "a": "history-4-018", "x": "0986227c"}, {"t": "learn", "h": "<div class=\"u\">٤. ترجم بكلماتك وصف القصيدة الأخير لبيوولف (<span class=\"en\">lofgeornost</span> وصحابها)، وقول ليه القصيدة اختارت تختم بيهم.</div><div class=\"u\">٥. سؤال تفكير: القصيدة بتبدأ بجنازة وتنتهي بجنازة. إيه الإحساس اللي البنية دي بتسيبه فيك كقارئ؟</div>", "n": 2, "i": 25, "a": "history-4-019", "x": "63675c1a"}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">🌊</span></span> قصائد الرثاء والحنين: <span class=\"en\">The Wanderer</span> و<span class=\"en\">The Seafarer.</span>", "extra": "", "i": 26}];</script>
