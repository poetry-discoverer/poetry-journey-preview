<script>window.LESSON_ID="grammar-14";window.STEPS=[{"t": "section", "h": "الجملة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في الدرس الأربعتاشر. دلوقتي هنوصل للجملة نفسها. الجملة، <span class=\"en\">sentence</span>، بتتكون من مجموعات. وأهم جزئين فيها هما الفاعل، <span class=\"en\">subject</span>، والمحمول، <span class=\"en\">predicate</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a sentence has a subject and a predicate</span>.</div>", "n": 1, "i": 1, "a": "grammar-14-001", "x": "e94b8844"}, {"t": "section", "h": "الفاعل والمحمول", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الفاعل هو اللي الجملة بتتكلم عنه. والمحمول هو اللي بيتقال عن الفاعل. في <span class=\"en\">The old man left</span>، الفاعل <span class=\"en\">the old man</span>، والمحمول <span class=\"en\">left</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the subject is who or what</span>, <span class=\"en\">and the predicate is what is said about it</span>.</div>", "n": 1, "i": 3, "a": "grammar-14-002", "x": "4d78e622"}, {"t": "learn", "h": "<div class=\"u\">الفاعل في الإنجليزي بيجي غالبًا قبل الفعل، وبيتحكم في الفعل. يعني بنقول <span class=\"en\">He walks</span> و<span class=\"en\">They walk</span>. ودي اسمها <span class=\"en\">agreement</span>، أو تطابق. <span class=\"en\">In simple English</span>: <span class=\"en\">the verb agrees with the subject</span>.</div>", "n": 1, "i": 4, "a": "grammar-14-003", "x": "e0681a2a"}, {"t": "section", "h": "الـ clause", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">clause</span> هي وحدة فيها فاعل وفعل. <span class=\"en\">The old man left</span> هي <span class=\"en\">clause</span>. وممكن الجملة تبقى <span class=\"en\">clause</span> واحدة، أو أكتر. <span class=\"en\">In simple English</span>: <span class=\"en\">a clause has a subject and a verb</span>.</div>", "n": 1, "i": 6, "a": "grammar-14-004", "x": "2b6957c5"}, {"t": "mc", "q": "الـ <span class=\"en\">clause</span> لازم فيها:", "opts": ["فاعل وفعل", "صفة", "حرف جر"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a subject and a verb</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 7, "h": ""}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">clause</span> المستقلة، <span class=\"en\">independent clause</span>، تقدر تقف لوحدها. زي <span class=\"en\">She left</span>. والـ <span class=\"en\">clause</span> التابعة، <span class=\"en\">dependent clause</span>، لازم تعتمد على <span class=\"en\">clause</span> تانية. زي <span class=\"en\">because she was tired</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">an independent clause can stand alone</span>, <span class=\"en\">a dependent clause cannot</span>.</div>", "n": 1, "i": 8, "a": "grammar-14-005", "x": "9ec3cbb6"}, {"t": "tf", "q": "الـ <span class=\"en\">dependent clause</span> تقدر تقف لوحدها.", "ans": false, "why": "غلط.", "ex": ["غلط: بتعتمد على <span class=\"en\">clause</span> تانية.", "صح، الجملة غلط."], "n": 1, "i": 9, "h": ""}, {"t": "section", "h": "أنواع الجمل", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">الجملة البسيطة، <span class=\"en\">simple sentence</span>، فيها <span class=\"en\">clause</span> واحدة. <span class=\"en\">She left</span>. والجملة المركبة، <span class=\"en\">compound sentence</span>، فيها <span class=\"en\">clauses</span> مستقلة متصلة بـ <span class=\"en\">and</span> أو <span class=\"en\">but</span>. <span class=\"en\">She left and he stayed</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">compound means two equal clauses</span>.</div>", "n": 1, "i": 11, "a": "grammar-14-006", "x": "d9ee1758"}, {"t": "mc", "q": "<span class=\"en\">She left and he stayed</span> هي جملة:", "opts": ["<span class=\"en\">simple</span>", "<span class=\"en\">compound</span>", "<span class=\"en\">complex</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">two equal clauses</span>.", "ex": ["غلط.", "صح.", "غلط."], "n": 1, "i": 12, "h": ""}, {"t": "learn", "h": "<div class=\"u\">والجملة المعقدة، <span class=\"en\">complex sentence</span>، فيها <span class=\"en\">clause</span> مستقلة و<span class=\"en\">clause</span> تابعة. <span class=\"en\">She left because she was tired</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">complex means one main clause and one dependent clause</span>.</div>", "n": 1, "i": 13, "a": "grammar-14-007", "x": "8fa33e68"}, {"t": "mc", "q": "<span class=\"en\">She left because she was tired</span> هي جملة:", "opts": ["<span class=\"en\">simple</span>", "<span class=\"en\">compound</span>", "<span class=\"en\">complex</span>"], "ans": 2, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">one main clause and one dependent clause</span>.", "ex": ["غلط.", "غلط: مفيش <span class=\"en\">clauses</span> متساوية.", "صح."], "n": 1, "i": 14, "h": ""}, {"t": "section", "h": "الجملة بحسب الغرض", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">الجملة الخبرية، <span class=\"en\">declarative</span>، بتقول معلومة. والاستفهامية، <span class=\"en\">interrogative</span>، بتسأل. والأمرية، <span class=\"en\">imperative</span>، بتطلب. والتعجبية، <span class=\"en\">exclamative</span>، بتعبّر عن انفعال. <span class=\"en\">In simple English</span>: <span class=\"en\">statements</span>, <span class=\"en\">questions</span>, <span class=\"en\">commands and exclamations</span>.</div>", "n": 1, "i": 16, "a": "grammar-14-008", "x": "9515fa59"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">الشكل: فاعل ومحمول. الوظيفة: تنقل فكرة كاملة. المعنى: بتقول حاجة عن حاجة. والاستعمال: بنختار نوع الجملة حسب الغرض، معلومة أو سؤال أو طلب.</div>", "n": 1, "i": 18, "a": "grammar-14-009", "x": "52d46dfd"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">الفاعل النحوي، <span class=\"en\">grammatical subject</span>، غير الفاعل الدلالي، <span class=\"en\">semantic agent</span>. في <span class=\"en\">The window was broken by the boy</span>، الفاعل النحوي <span class=\"en\">the window</span>، لكن اللي كسر هو <span class=\"en\">the boy</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the grammatical subject is not always the doer</span>.</div>", "n": 1, "i": 20, "a": "grammar-14-010", "x": "2ccf0292"}, {"t": "tf", "q": "الفاعل النحوي هو دايمًا اللي بيعمل الفعل.", "ans": false, "why": "غلط: في المبني للمجهول لا.", "ex": ["غلط: <span class=\"en\">the window was broken</span>.", "صح، الجملة غلط."], "n": 1, "i": 21, "h": ""}, {"t": "learn", "h": "<div class=\"u\">وفي العربية الفاعل بييجي بعد الفعل في الجملة الفعلية، زي كتب الولد. وفي الإنجليزي بيجي قبله. ودي من أهم فروق ترتيب الكلمات. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic often puts the subject after the verb</span>. وفيه جمل من غير فاعل ظاهر، زي <span class=\"en\">Stop</span>. الفاعل هنا مفهوم من السياق، <span class=\"en\">you</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">in commands the subject is understood</span>.</div>", "n": 1, "i": 22, "a": "grammar-14-011", "x": "3f4c92c3"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس. <span class=\"en\">Sentence</span>: جملة. <span class=\"en\">In simple English</span>: <span class=\"en\">a full idea</span>. <span class=\"en\">Subject</span>: الفاعل. <span class=\"en\">Predicate</span>: المحمول. <span class=\"en\">Clause</span>: جملة صغرى. <span class=\"en\">In simple English</span>: <span class=\"en\">a group with a subject and a verb</span>. <span class=\"en\">Independent clause</span>: جملة مستقلة. <span class=\"en\">Dependent clause</span>: جملة تابعة.</div>", "n": 1, "i": 24, "a": "grammar-14-012", "x": "41a159e3"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Simple sentence</span>: جملة بسيطة. <span class=\"en\">Compound sentence</span>: جملة مركبة. <span class=\"en\">Complex sentence</span>: جملة معقدة. <span class=\"en\">Agreement</span>: التطابق. <span class=\"en\">Declarative</span>: خبرية. <span class=\"en\">Interrogative</span>: استفهامية. <span class=\"en\">Imperative</span>: أمرية.</div>", "n": 1, "i": 25, "a": "grammar-14-013", "x": "194b8212"}, {"t": "mc", "q": "<span class=\"en\">Close the door</span> هي جملة:", "opts": ["<span class=\"en\">declarative</span>", "<span class=\"en\">interrogative</span>", "<span class=\"en\">imperative</span>"], "ans": 2, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a command</span>.", "ex": ["غلط.", "غلط.", "صح."], "n": 1, "i": 26, "h": ""}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 27}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: الجملة فيها فاعل ومحمول. اتنين: الـ <span class=\"en\">clause</span> فيها فاعل وفعل، وممكن تكون مستقلة أو تابعة. تلاتة: الجملة بسيطة أو مركبة أو معقدة. أربعة: الجملة ممكن تكون خبرية أو استفهامية أو أمرية. <span class=\"en\">In short</span>: <span class=\"en\">a sentence is made of clauses</span>. الدرس الجاي: الجملة المعقدة.</div>", "n": 1, "i": 28, "a": "grammar-14-014", "x": "116c58da"}, {"t": "section", "h": "الكويز", "n": 1, "i": 29}, {"t": "recall", "q": "إيه أنواع الجمل بحسب التركيب؟", "a": "بسيطة ومركبة ومعقدة. <span class=\"en\">In simple English</span>: <span class=\"en\">simple</span>, <span class=\"en\">compound</span>, <span class=\"en\">complex</span>.", "n": 1, "i": 30, "h": ""}, {"t": "recall", "q": "إيه الفرق بين <span class=\"en\">independent</span> و <span class=\"en\">dependent clause</span>؟", "a": "المستقلة تقف لوحدها، والتابعة لا. <span class=\"en\">In simple English</span>: <span class=\"en\">one stands alone</span>, <span class=\"en\">one does not</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "حلل الجملة <span class=\"en\">She left because she was tired</span> (٣-٤ جمل).", "key": "grammar-14:1", "a": "فيها <span class=\"en\">clause</span> مستقلة <span class=\"en\">She left</span>، و<span class=\"en\">clause</span> تابعة <span class=\"en\">because she was tired</span>. فهي <span class=\"en\">complex sentence</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">one main clause and one dependent clause</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "اشرح الفرق بين الفاعل النحوي والفاعل الدلالي بمثال (٣-٤ جمل).", "key": "grammar-14:2", "a": "في <span class=\"en\">The window was broken by the boy</span> الفاعل النحوي <span class=\"en\">the window</span>. لكن اللي كسر هو <span class=\"en\">the boy</span>، وده الفاعل الدلالي. <span class=\"en\">In simple English</span>: <span class=\"en\">the subject is not always the doer</span>.", "n": 1, "i": 33, "h": ""}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين الجملة المركبة (<span class=\"en\">compound</span>) والجملة المعقدة (<span class=\"en\">complex</span>).", "a": "<div class=\"u\">المركبة فيها <span class=\"en\">clauses</span> مستقلة متساوية متصلة بـ <span class=\"en\">and</span> أو <span class=\"en\">but</span>، زي <span class=\"en\">She left and he stayed</span>.</div><div class=\"u\">والمعقدة فيها <span class=\"en\">clause</span> مستقلة و<span class=\"en\">clause</span> تابعة، زي <span class=\"en\">She left because she was tired</span>. في الأولى العلاقة تساوي، وفي التانية تبعية.</div>", "key": "grammar-14:3", "n": 1, "i": 34}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين موقع الفاعل في الجملة الإنجليزية والجملة الفعلية العربية.", "a": "<div class=\"u\">في الإنجليزي الفاعل غالبًا قبل الفعل، زي <span class=\"en\">The boy wrote</span>.</div><div class=\"u\">وفي العربية الفعلية الفعل الأول والفاعل بعده، زي كتب الولد. ده فرق في ترتيب الكلمات، وممكن يسبب أخطاء عند بعض المتعلمين العرب في الإنجليزي.</div>", "key": "grammar-14:4", "n": 1, "i": 35}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الجملة المعقدة.</div><div class=\"u\">هنشوف الـ <span class=\"en\">clauses</span> التابعة بالتفصيل.</div>", "extra": "المصادر: Huddleston and Pullum (2005); Quirk et al. (1985).", "i": 36}];</script>
