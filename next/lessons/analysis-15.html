<h1>تحليل ١٥: A Birthday لكريستينا روزيتي — فرح بيتبني من الطبيعة للفن</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">تحليل ١٥ من ٢٢</span><span class="tag"><span class="em">🖋️</span> تحليل القصائد المهمة</span></div>

<script>window.LESSON_ID="analysis-15";window.STEPS=[{"t":"learn","h":"<div class=\"u\">من لقاء ليلي في الظلمة، لفرح مفتوح وشمس. القصيدة دي مش عن الشوق، هي عن الوصول: الحب جه خلاص.</div><div class=\"u\">القصيدة: A Birthday لكريستينا روزيتي — مقطعين، كل واحد تمانية سطور.</div>","n":2,"i":0,"a":"analysis-15-001","x":"76da79b1"},{"t":"section","h":"الشاعرة والسياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">كريستينا روزيتي <span class=\"en\">(Christina Rossetti)</span>، 1830-1894، شاعرة إنجليزية، أخت الرسام دانتي جابرييل روزيتي. من أهم شواعر العصر الفيكتوري، واشتهرت بمجموعة <span class=\"en\">Goblin Market</span>.</div>","n":1,"i":2,"a":"analysis-15-002","x":"2e1b881e"},{"t":"learn","h":"<div class=\"u\">القصيدة دي اتنشرت في <span class=\"en\">Goblin Market and Other Poems</span> سنة 1862. قصيرة، وحماستها واضحة من أول سطر — مفيش تردد ولا شك.</div>","n":1,"i":3,"a":"analysis-15-003","x":"b4a2f0b8"},{"t":"learn","h":"<div class=\"u\">المشهد: مفيش مشهد. القصيدة كلها إحساس داخلي، بس بيتحول لصورة، وبعدين لطلب إن حد يبني حاجة. الحب وصل، فالنهارده عيد ميلاد جديد.</div>","n":1,"i":4,"a":"analysis-15-004","x":"7cf5fc66"},{"t":"learn","h":"<div class=\"u\">الشكل: مقطعين × تمانية سطور. القافية في السطور الزوجية (shoot/fruit، tree/sea)، وكل مقطع بيقفل بكوبليه (these/me، life/me).</div>","n":1,"i":5,"a":"analysis-15-005","x":"1e6bad36"},{"t":"section","h":"المقطع الأول: القلب زي إيه (<span dir=\"ltr\">1-8</span>)","n":1,"i":6},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-6</span>:</div><div class=\"u\"><span class=\"en\">My heart is like a singing bird / Whose nest is in a water’d shoot; / My heart is like an apple-tree / Whose boughs are bent with thick-set fruit; / My heart is like a rainbow shell / That paddles in a halcyon sea;</span></div>","n":2,"i":7,"a":"analysis-15-006","x":"e75c0ea4"},{"t":"learn","h":"<div class=\"u\">تلات تشبيهات <span class=\"en\">(similes)</span> بنفس البداية: «قلبي زي عصفور بيغني»، «قلبي زي شجرة تفاح»، «قلبي زي صدفة قوس قزح». التكرار <span class=\"en\">(anaphora)</span> ده هو الإيقاع الأساسي.</div>","n":1,"i":8,"a":"analysis-15-007","x":"b5eac938"},{"t":"mc","h":"","q":"المقطع الأول مبني على إيه؟","opts":["تلات تشبيهات من الطبيعة بنفس البداية","حكاية لقاء","وصف بيت"],"ans":0,"why":"تلات تشبيهات طبيعية متكررة البداية.","n":1,"i":9,"ex":["صح: عصفور، شجرة تفاح، صدفة — وكلها بتبدأ «My heart is like».","غلط: مفيش حكاية ولا أحداث في المقطع.","غلط: مفيش وصف مكان؛ الصور مجازية."]},{"t":"learn","h":"<div class=\"u\">العصفور عنده عش في «فرع مسقي» — حياة وصغر ودفء. والشجرة فروعها منحنية من كتر الثمر — امتلاء. والصدفة «بتجدّف في بحر هادي» <span class=\"en\">(halcyon sea)</span> — سكون.</div>","n":1,"i":10,"a":"analysis-15-008","x":"9d171ca8"},{"t":"learn","h":"<div class=\"u\">تلات صور مختلفة، بس كلها من الطبيعة، وكلها بتقول نفس الحاجة: حياة مليانة وساكنة في نفس الوقت. ودي حالة الفرح اللي مش محتاج حركة.</div>","n":1,"i":11,"a":"analysis-15-009","x":"5ab088db"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">7-8</span>:</div><div class=\"u\"><span class=\"en\">My heart is gladder than all these, / Because my love is come to me.</span></div>","n":2,"i":12,"a":"analysis-15-010","x":"afc4e1e2"},{"t":"tf","h":"","q":"التكرار في «My heart is like» موجود في أول تلات سطور.","ans":true,"why":"صح: العبارة بتتكرر تلات مرات قبل ما تتغير لـ «My heart is gladder than all these».","n":1,"i":13,"ex":["صح، الجملة صح: التكرار أساس إيقاع المقطع.","غلط. التكرار واضح في أول تلات سطور."]},{"t":"learn","h":"<div class=\"u\">«قلبي أفرح من كل ده، لأن حبيبي جه ليّا». السطر السابع بيرفع التشبيهات كلها: الطبيعة مش كفاية للتعبير. والسبب في السطر التامن بسيط ومباشر.</div>","n":1,"i":14,"a":"analysis-15-011","x":"18248473"},{"t":"learn","h":"<div class=\"u\">لاحظ الترتيب: الصور الأول، والسبب في الآخر. كأن الشاعرة عايزة القارئ يحس قبل ما يعرف السبب — وبعد كده السبب بيخلي كل الصور مفهومة.</div>","n":1,"i":15,"a":"analysis-15-012","x":"495433c6"},{"t":"section","h":"المقطع التاني: ارفعولي منصة (<span dir=\"ltr\">9-16</span>)","n":1,"i":16},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">9-12</span>:</div><div class=\"u\"><span class=\"en\">Raise me a dais of silk and down; / Hang it with vair and purple dyes; / Carve it in doves and pomegranates, / And peacocks with a hundred eyes;</span></div>","n":2,"i":17,"a":"analysis-15-013","x":"270c7071"},{"t":"learn","h":"<div class=\"u\">«ارفعوا ليّا منصة من حرير وزغب» <span class=\"en\">(a dais)</span>: المنصة دي بتاعة ملوك. من غير ما تقول، الشاعرة بقت ملكة في يومها.</div>","n":1,"i":18,"a":"analysis-15-014","x":"9fc9c258"},{"t":"learn","h":"<div class=\"u\">والخامات فخمة: فرو <span class=\"en\">(vair)</span>، وصبغات بنفسجية، ونقش حمام ورمان، وطاووس بـ«مية عين». الرمان والطاووس صور كلاسيكية للخصوبة والجمال.</div>","n":1,"i":19,"a":"analysis-15-015","x":"f29fe3cb"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">13-16</span>:</div><div class=\"u\"><span class=\"en\">Work it in gold and silver grapes, / In leaves and silver fleurs-de-lys; / Because the birthday of my life / Is come, my love is come to me.</span></div>","n":2,"i":20,"a":"analysis-15-016","x":"d46de47b"},{"t":"learn","h":"<div class=\"u\">«اشتغلوه بعنب دهب وفضة، وبورق وزهرة زنبق فضية» <span class=\"en\">(fleurs-de-lys)</span> — رمز ملكي فرنسي. النقش بقى صنعة، مش طبيعة.</div>","n":1,"i":21,"a":"analysis-15-017","x":"54b075ae"},{"t":"learn","h":"<div class=\"u\">والختام بيرجع نفس السبب: «عيد ميلاد حياتي جه، حبيبي جه ليّا». كلمة <span class=\"en\">birthday</span> هنا مش يوم الميلاد الحقيقي — هو اليوم اللي اتولدت فيه حياتها بالمعنى المجازي.</div>","n":1,"i":22,"a":"analysis-15-018","x":"392ee9f3"},{"t":"mc","h":"","q":"«the birthday of my life» معناها إيه؟","opts":["اليوم اللي الحب وصل فيه — ولادة جديدة","يوم ميلادها الحقيقي","عيد ميلاد حبيبها"],"ans":0,"why":"اليوم اللي اتولدت فيه حياتها بالحب.","n":1,"i":23,"ex":["صح: السطر اللي بعدها بيوضح: «my love is come to me».","غلط: مفيش ذكر لتاريخ ميلادها.","غلط: القصيدة عن إحساسها هي، مش عن عيد ميلاده."]},{"t":"tf","h":"","q":"القصيدة عن يوم ميلاد حقيقي بيحتفل بيه.","ans":false,"why":"غلط: «birthday» هنا مجازية: يوم وصول الحب، اللي بيعتبر ولادة جديدة لحياتها.","n":1,"i":24,"ex":["غلط. الكلمة مجازية والسياق بيوضح.","صح، الجملة غلط: مفيش يوم ميلاد حقيقي في القصيدة."]},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":25},{"t":"learn","h":"<div class=\"u\">التحول من الطبيعة للفن: المقطع الأول كله طبيعة (عصفور، شجرة، صدفة)، والمقطع التاني كله صنعة (حرير، نقش، دهب، فضة). الفرح الأول اتولد، والتاني اتحوّل لاحتفال.</div>","n":1,"i":26,"a":"analysis-15-019","x":"4c25809e"},{"t":"mc","h":"","q":"«Raise me a dais» بيعمل إيه في القصيدة؟","opts":["بيحوّل الفرح لاحتفال ملكي","بيوصف مسرح","بيطلب كرسي للراحة"],"ans":0,"why":"بيحوّل الفرح لاحتفال ملكي.","n":1,"i":27,"ex":["صح: المنصة رمز سلطة، فالشاعرة بقت ملكة في يومها.","غلط: مفيش مسرح هنا؛ المنصة رمز.","غلط: الطلب احتفالي مش عملي."]},{"t":"mc","h":"","q":"ليه الصور في المقطع التاني مصنوعة مش طبيعية؟","opts":["لأن الفرح اتحول من إحساس لاحتفال فني","لأن الشاعرة غنية","لأن الطبيعة اتكلمت عنها كفاية"],"ans":0,"why":"لأن الفرح اتحوّل لفن واحتفال.","n":1,"i":28,"ex":["صح: التحول من عصفور وشجرة لحرير ودهب ونقش هو بنية القصيدة.","غلط: مفيش إشارة لمكانتها الاجتماعية.","غلط: السبب بنيوي ورمزي مش عدّ كلمات."]},{"t":"learn","h":"<div class=\"u\">صيغة الأمر <span class=\"en\">(imperative)</span> في المقطع التاني: ارفعوا، علّقوا، انقشوا، اشتغلوا. الفرح مش بيتوصف، بيتطلب تنفيذه — وده اللي بيدي القصيدة طاقة.</div>","n":1,"i":29,"a":"analysis-15-020","x":"ecbb67a8"},{"t":"learn","h":"<div class=\"u\">الإفراط في الزينة: الرمان والطاووس والزنبق مش حاجات إنجليزية عادية. الاختيار ده مقصود: الفرح هنا مش ريفي بسيط، هو احتفال فخم.</div>","n":1,"i":30,"a":"analysis-15-021","x":"c00ec974"},{"t":"learn","h":"<div class=\"u\">الموضوعات: الفرح، والحب كولادة جديدة، وتحويل الإحساس لفن. وبعض القراءات بتشوف إن القصيدة بتحوّل الحب لطقس ملكي، وبعضها بيقراها كتعبير خالص عن لحظة سعادة نادرة.</div>","n":1,"i":31,"a":"analysis-15-022","x":"be4e603a"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":32},{"t":"recall","h":"","q":"اشرح إزاي القصيدة بتبني إحساس الفرح.","a":"المقطع الأول بيبني الفرح بتشبيهات من الطبيعة، وكل تشبيه بيضيف نوع مختلف من السعادة: العصفور المغني (حياة وصوت)، شجرة التفاح المليانة (امتلاء)، والصدفة في بحر هادي (سكون). والتكرار في «My heart is like» بيدّي إيقاع متصاعد. وبعدين السطر السابع بيرفع السقف: «gladder than all these»، والسبب في السطر التامن. المقطع التاني بيحوّل الفرح لفعل: أوامر لبناء منصة فخمة بالحرير والدهب والنقش، فالسعادة بقت احتفال ملكي. والختام بيرجع السبب نفسه، فالقصيدة بتقفل دايرة: من إحساس، لصورة، لطقس.","n":1,"i":33},{"t":"recall","h":"","q":"قارن بين المقطع الأول والمقطع التاني.","a":"المقطع الأول كله طبيعة: عصفور، شجرة، صدفة، بحر. لغته تشبيهات هادية، والصور حاجات بتتولد وتنمو. المقطع التاني كله صنعة: حرير، فرو، صبغات، نقش، دهب وفضة، زنبق ملكي. ولغته أوامر: ارفعوا، علّقوا، انقشوا، اشتغلوا. الأول بيوصف إحساس، والتاني بيطلب تنفيذ احتفال. والرابط بينهم إن الاتنين نتيجة نفس السبب: «my love is come to me». الفرق إن الأول طبيعي وحميم، والتاني فخم واجتماعي — والاتنين مع بعض بيوروا إن الفرح محتاج يتقال بالصور وبعدين يتعمل.","n":1,"i":34},{"t":"write","h":"","q":"حلّل الصور في المقطع التاني.","key":"analysis-15:1","a":"المقطع التاني مبني على صورة منصة <span class=\"en\">(dais)</span> — رمز ملكي — وكل الأوامر بتتوجه لبنائها وتزيينها. الخامات فخمة ومقصودة: حرير وزغب، فرو <span class=\"en\">(vair)</span> وصبغات بنفسجية (اللون الملكي)، ثم نقش الحمام والرمان (خصوبة وحب)، والطاووس بـ«مية عين» (جمال فيه إسراف)، وأخيرًا عنب من دهب وفضة وورق وزنبق فرنسي. الصور دي مش إنجليزية ريفية، هي صور عالم قديم فخم — وده اللي بيحوّل الفرح من إحساس شخصي لطقس عام. وبعض القراءات بتشوف إن الإفراط في الزينة مقصود: الفرح هنا أكبر من إنه يتوصف، فبيتحول لشيء يتعمل ويتشاف.","n":1,"i":35},{"t":"write","h":"","q":"ناقش علاقة القصيدة بالطبيعة والفن.","key":"analysis-15:2","a":"القصيدة بتعمل حركة واضحة من الطبيعة للفن. المقطع الأول بيستخدم الطبيعة عشان يقول الإحساس: عصفور، شجرة، صدفة، بحر — كلها حاجات بتتولد وتنمو، وبتعبّر عن فرح عضوي. لكن السطر السابع بيقول إن القلب «gladder than all these»، يعني الطبيعة مش كفاية. فالمقطع التاني بينتقل لصنعة الإنسان: حرير، نقش، دهب، فضة. والفرق مش في الدرجة، هو في النوع: الطبيعة بتشهد على الفرح، والفن بيحتفل بيه. وده بيمشي مع فكرة إن الحب مش تجربة داخلية بس، هو حدث لازم يتعمل له احتفال. والقصيدة بتبني نفسها بنفس الطريقة: صورة، بعدين صورة، بعدين طقس.","n":1,"i":36},{"t":"end","h":"","teaser":"<div class=\"u\">كده A Birthday خلصت: قلب زي عصفور وشجرة وصدفة، ومنصة حرير ودهب، وعيد ميلاد جديد.</div><div class=\"u\">الدرس الجاي: Dover Beach لماثيو أرنولد — شط ليلي، وصوت بحر بيحمل شك.</div>","extra":"المصادر: Christina Rossetti, “A Birthday” (Goblin Market and Other Poems, 1862)؛ مصطلحات: simile, anaphora, imperative, imagery.","i":37}];</script>
