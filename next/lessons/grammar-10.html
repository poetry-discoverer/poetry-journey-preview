<script>window.LESSON_ID="grammar-10";window.STEPS=[{"t":"section","h":"طرق تكوين الكلمات","n":1,"i":0},{"t":"learn","h":"<div class=\"u\">أهلًا بيك في الدرس العاشر. الأفكسات مش الطريقة الوحيدة لتكوين كلمات. فيه التركيب، <span class=\"en\">compounding</span>: كلمتين في كلمة، زي <span class=\"en\">sunflower</span>. وفيه الدمج، <span class=\"en\">blending</span>: بنقطع أجزاء من كلمتين، زي <span class=\"en\">brunch</span> من <span class=\"en\">breakfast</span> و<span class=\"en\">lunch</span>. وفيه الاختصار، <span class=\"en\">clipping</span>: بنقصّر كلمة، زي <span class=\"en\">exam</span> من <span class=\"en\">examination</span>. وفيه الحروف الأولى، زي <span class=\"en\">NASA</span>.</div>","n":1,"i":1,"a":"grammar-10-001","x":"7df138f8"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">In simple English</span>: <span class=\"en\">we make new words by joining</span>, <span class=\"en\">mixing or cutting</span>.</div>","n":1,"i":2,"a":"grammar-10-002","x":"941edada"},{"t":"section","h":"التركيب","n":1,"i":3},{"t":"learn","h":"<div class=\"u\">الكلمة المركبة، <span class=\"en\">compound</span>، كلمتين أو أكتر بتشتغل كوحدة واحدة بمعنى واحد. ممكن تتكتب ملزوقة، زي <span class=\"en\">sunflower</span>. أو بشرطة، زي <span class=\"en\">mother-in-law</span>. أو منفصلة، زي <span class=\"en\">ice cream</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a compound is two words that work as one new word</span>.</div>","n":1,"i":4,"a":"grammar-10-003","x":"07b25c4f"},{"t":"learn","h":"<div class=\"u\">مهم تفرق بين <span class=\"en\">compound</span> و<span class=\"en\">phrase</span>. <span class=\"en\">Blackbird</span> نوع طير، لكن <span class=\"en\">black bird</span> أي طير أسود. وفي المركبة النبرة بتبقى على الكلمة الأولى: <span class=\"en\">BLACKbird</span>.</div>","n":1,"i":5,"a":"grammar-10-004","x":"0e3f6c37"},{"t":"tf","q":"النبرة في المركبة <span class=\"en\">blackbird</span> على الكلمة الأولى.","ans":true,"why":"صح.","ex":["صح: <span class=\"en\">BLACKbird</span>.","غلط: النبرة غالبًا على الأولى."],"n":1,"i":6,"h":""},{"t":"section","h":"الرأس","n":1,"i":7},{"t":"learn","h":"<div class=\"u\">أغلب المركبات في الإنجليزي الرأس فيها على اليمين. <span class=\"en\">Endocentric</span> يعني الرأس واضح والكلمة نوع منه. <span class=\"en\">Blackbird</span> هو <span class=\"en\">bird</span>، و<span class=\"en\">bookshelf</span> هو <span class=\"en\">shelf</span>. و<span class=\"en\">exocentric</span> يعني مفيش رأس جوا الكلمة. <span class=\"en\">Pickpocket</span> مش <span class=\"en\">pocket</span>، هو شخص. <span class=\"en\">In simple English</span>: <span class=\"en\">in most compounds</span>, <span class=\"en\">the last word is the main part</span>.</div>","n":1,"i":8,"a":"grammar-10-005","x":"f8c78abb"},{"t":"mc","q":"<span class=\"en\">pickpocket</span> مركب:","opts":["<span class=\"en\">endocentric</span>","<span class=\"en\">exocentric</span>","مش مركب"],"ans":1,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">it is a person</span>, <span class=\"en\">not a pocket</span>.","ex":["غلط: مش نوع من <span class=\"en\">pocket</span>.","صح: مفيش رأس جوا الكلمة.","غلط: هي مركبة."],"n":1,"i":9,"h":""},{"t":"section","h":"طرق تانية","n":1,"i":10},{"t":"learn","h":"<div class=\"u\">الدمج بيجمع أجزاء، زي <span class=\"en\">brunch</span> و<span class=\"en\">smog</span> و<span class=\"en\">motel</span>. والاختصار بيحذف جزء، زي <span class=\"en\">exam</span> و<span class=\"en\">phone</span> و<span class=\"en\">ad</span>. والـ <span class=\"en\">acronym</span> حروف أولى بتتنطق كلمة، زي <span class=\"en\">NASA</span>. والـ <span class=\"en\">initialism</span> حروف أولى بتتنطق حرف حرف، زي <span class=\"en\">BBC</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">acronyms are said as words</span>, <span class=\"en\">and initialisms are said letter by letter</span>.</div>","n":1,"i":11,"a":"grammar-10-006","x":"7ba3d490"},{"t":"mc","q":"<span class=\"en\">BBC</span> هي:","opts":["<span class=\"en\">acronym</span>","<span class=\"en\">initialism</span>","<span class=\"en\">blend</span>"],"ans":1,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">said letter by letter</span>.","ex":["غلط: ما بتتنطقش كلمة.","صح: بتتنطق حرف حرف.","غلط: مش دمج."],"n":1,"i":12,"h":""},{"t":"learn","h":"<div class=\"u\">وفيه <span class=\"en\">back-formation</span>: بنحذف جزء ظانين إنه أفكس. زي <span class=\"en\">edit</span> من <span class=\"en\">editor</span>. و<span class=\"en\">conversion</span>: تغيير القسم من غير تغيير الشكل، زي <span class=\"en\">email</span> و<span class=\"en\">to email</span>.</div>","n":1,"i":13,"a":"grammar-10-007","x":"014f580e"},{"t":"section","h":"أربع زوايا","n":1,"i":14},{"t":"learn","h":"<div class=\"u\">الشكل: كلمتين، أو جزء كلمة، أو حروف. الوظيفة: تكوين كلمة جديدة. المعنى: المركبة معناها غالبًا مش مجموع أجزائها، زي <span class=\"en\">butterfly</span>. والاستعمال: الدمج والاختصار بيظهروا في الإعلام واللغة غير الرسمية.</div>","n":1,"i":15,"a":"grammar-10-008","x":"0bf46fe1"},{"t":"section","h":"الطبقة المتقدمة","n":1,"i":16},{"t":"learn","h":"<div class=\"u\">كلمة <span class=\"en\">portmanteau</span> اتستخدمت للكلمة المدمجة بعد ما <span class=\"en\">Lewis Carroll</span> استخدمها في <span class=\"en\">Through the Looking-Glass</span> سنة 1871، لوصف كلماته المدمجة زي <span class=\"en\">slithy</span>. الدمج بيحصل غالبًا بين بداية الكلمة الأولى ونهاية التانية. <span class=\"en\">In simple English</span>: <span class=\"en\">a portmanteau is a word made from parts of two words</span>.</div>","n":1,"i":17,"a":"grammar-10-009","x":"bf3529d4"},{"t":"learn","h":"<div class=\"u\">والمركبات بتتفاوت في الشفافية. <span class=\"en\">Sunflower</span> شفافة، و<span class=\"en\">butterfly</span> مش شفافة، لأن معناها مش مجموع <span class=\"en\">butter</span> و<span class=\"en\">fly</span>. ومع الوقت المركبة ممكن تتحجر وتفقد معناها الأصلي. والإنجليزي كثير التركيب، لكن العربية بتعتمد أكتر على الاشتقاق من الجذر وعلى الإضافة. وده سبب أخطاء متعلمين عرب زي <span class=\"en\">a book of school</span> بدل <span class=\"en\">school book</span>.</div>","n":1,"i":18,"a":"grammar-10-010","x":"12e768c7"},{"t":"tf","q":"<span class=\"en\">butterfly</span> شفافة المعنى مثل <span class=\"en\">sunflower</span>.","ans":false,"why":"غلط: معناها اتحجّر.","ex":["غلط: <span class=\"en\">butterfly</span> مش <span class=\"en\">butter</span> + <span class=\"en\">fly</span> بالمعنى.","صح، الجملة غلط: معناها مش مجموع أجزائها."],"n":1,"i":19,"h":""},{"t":"section","h":"مصطلحات الدرس","n":1,"i":20},{"t":"learn","h":"<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. <span class=\"en\">Compounding</span>: التركيب. <span class=\"en\">In simple English</span>: <span class=\"en\">joining two words</span>. <span class=\"en\">Compound</span>: كلمة مركبة. <span class=\"en\">Head</span>: الرأس. <span class=\"en\">In simple English</span>: <span class=\"en\">the main part of the compound</span>. <span class=\"en\">Endocentric</span>: مركب ذو رأس. <span class=\"en\">Exocentric</span>: مركب بلا رأس.</div>","n":1,"i":21,"a":"grammar-10-011","x":"094742f6"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Blending</span>: الدمج. <span class=\"en\">In simple English</span>: <span class=\"en\">mixing parts of two words</span>. <span class=\"en\">Clipping</span>: الاختصار بالحذف. <span class=\"en\">In simple English</span>: <span class=\"en\">cutting a long word</span>. <span class=\"en\">Acronym</span>: اختصار منطوق كلمة. <span class=\"en\">Initialism</span>: اختصار حروف. <span class=\"en\">Back-formation</span>: اشتقاق عكسي. <span class=\"en\">Lexicalization</span>: تحجّر المعنى.</div>","n":1,"i":22,"a":"grammar-10-012","x":"17b60927"},{"t":"mc","q":"<span class=\"en\">brunch</span> من <span class=\"en\">breakfast</span> و<span class=\"en\">lunch</span> ده:","opts":["<span class=\"en\">clipping</span>","<span class=\"en\">blending</span>","<span class=\"en\">back-formation</span>"],"ans":1,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">parts of two words are mixed</span>.","ex":["غلط: الاختصار لكلمة واحدة.","صح: دمج أجزاء كلمتين.","غلط: ده مش حذف أفكس."],"n":1,"i":23,"h":""},{"t":"mc","q":"<span class=\"en\">edit</span> من <span class=\"en\">editor</span> هي:","opts":["<span class=\"en\">back-formation</span>","<span class=\"en\">compounding</span>","<span class=\"en\">conversion</span>"],"ans":0,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">we cut a supposed affix</span>.","ex":["صح: حذف جزء ظانين إنه أفكس.","غلط: مفيش كلمتين.","غلط: القسم والشكل اتغيروا."],"n":1,"i":24,"h":""},{"t":"section","h":"الخلاصة","n":1,"i":25},{"t":"learn","h":"<div class=\"u\">أربع نقط. واحد: الكلمات الجديدة بتتكون بالتركيب والدمج والاختصار والحروف الأولى. اتنين: الكلمة المركبة وحدة واحدة، والنبرة غالبًا على الجزء الأول. تلاتة: الرأس في المركبة الإنجليزية على اليمين. أربعة: المعنى ممكن يتحجّر فتبقى الكلمة مش شفافة. <span class=\"en\">In short</span>: <span class=\"en\">English makes new words by joining</span>, <span class=\"en\">mixing and cutting</span>.</div>","n":1,"i":26,"a":"grammar-10-013","x":"2947f552"},{"t":"learn","h":"<div class=\"u\">الدرس الجاي: الألومورف والتغيرات الصرفية الصوتية.</div>","n":1,"i":27,"a":"grammar-10-014","x":"4034b8ee"},{"t":"section","h":"الكويز","n":1,"i":28},{"t":"recall","q":"اذكر ٣ طرق لتكوين كلمات غير الأفكسات.","a":"التركيب (<span class=\"en\">sunflower</span>)، الدمج (<span class=\"en\">brunch</span>)، الاختصار (<span class=\"en\">exam</span>)، الحروف الأولى (<span class=\"en\">NASA</span>). (أي ٣). <span class=\"en\">In simple English</span>: <span class=\"en\">join</span>, <span class=\"en\">mix</span>, <span class=\"en\">cut</span>.","n":1,"i":29,"h":""},{"t":"recall","q":"إيه الفرق بين <span class=\"en\">endocentric</span> و <span class=\"en\">exocentric</span>؟","a":"<span class=\"en\">endocentric</span> له رأس والكلمة نوع منه (<span class=\"en\">bookshelf</span>). <span class=\"en\">exocentric</span> مفيش رأس جواه (<span class=\"en\">pickpocket</span>). <span class=\"en\">In simple English</span>: <span class=\"en\">the first has a main part inside</span>, <span class=\"en\">the second does not</span>.","n":1,"i":30,"h":""},{"t":"write","q":"اشرح الفرق بين <span class=\"en\">compound</span> و <span class=\"en\">phrase</span> بمثال (٣-٤ جمل).","key":"grammar-10:1","a":"<span class=\"en\">blackbird</span> مركب: نوع طير، والنبرة على <span class=\"en\">black</span>، وبتتعامل كوحدة. <span class=\"en\">black bird</span> عبارة: أي طير أسود، والنبرة على <span class=\"en\">bird</span>. فالنبرة والمعنى هم الفرق. <span class=\"en\">In simple English</span>: <span class=\"en\">a compound is one word</span>, <span class=\"en\">a phrase is two</span>.","n":1,"i":31,"h":""},{"t":"write","q":"ليه المتعلم العربي ممكن يغلط في المركبات؟ (٣-٤ جمل).","key":"grammar-10:2","a":"العربية بتعبر عن نفس المعنى بالإضافة، زي كتاب المدرسة. فالمتعلم ممكن يقول <span class=\"en\">a book of school</span> بدل <span class=\"en\">school book</span>. الإنجليزي بيضع الجزء الوصفي قبل الرأس. <span class=\"en\">In simple English</span>: <span class=\"en\">English puts the describing word first</span>.","n":1,"i":32,"h":""},{"t":"write","h":"","q":"<b>مقارنة:</b> قارن بين التركيب (<span class=\"en\">compounding</span>) والاشتقاق (<span class=\"en\">derivation</span>) في تكوين الكلمات.","a":"<div class=\"u\">التركيب بيجمع كلمتين حرتين، زي <span class=\"en\">sun</span> + <span class=\"en\">flower</span>. والاشتقاق بيضيف أفكس مقيّد لجذر، زي <span class=\"en\">happy</span> + <span class=\"en\">ness</span>.</div><div class=\"u\">التركيب مفتوح وغير محدود تقريبًا في الإنجليزي، والاشتقاق محدود بقائمة الأفكسات. وفي التركيب الرأس على اليمين غالبًا. أما في الاشتقاق فالأفكس غالبًا هو اللي بيحدد القسم.</div>","key":"grammar-10:3","n":1,"i":33},{"t":"write","h":"","q":"<b>مقارنة:</b> قارن بين الدمج (<span class=\"en\">blending</span>) والاختصار (<span class=\"en\">clipping</span>).","a":"<div class=\"u\">الدمج بيجمع أجزاء من كلمتين، زي <span class=\"en\">brunch</span> من <span class=\"en\">breakfast</span> و<span class=\"en\">lunch</span>، وبيعمل كلمة جديدة بمعنى مركب.</div><div class=\"u\">الاختصار بيقصّر كلمة واحدة من غير تغيير معناها، زي <span class=\"en\">exam</span> من <span class=\"en\">examination</span>. الدمج بيكوّن مفهوم جديد، والاختصار بيغير الشكل بس، وغالبًا بيدخل الكلام غير الرسمي.</div>","key":"grammar-10:4","n":1,"i":34},{"t":"end","h":"","teaser":"<div class=\"u\">الدرس الجاي: الألومورف والتغيرات الصرفية الصوتية.</div><div class=\"u\">هنشوف إزاي نفس المورفيم بيتنطق بأشكال مختلفة.</div>","extra":"المصادر: Bauer (1983); Plag (2003); Carroll (1871), Through the Looking-Glass.","i":35}];</script>
