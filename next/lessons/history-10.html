<script>window.LESSON_ID="history-10";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Chaucer</span> ج2: <span class=\"en\">The Canterbury Tales -</span> أشهر حج في تاريخ الأدب\"</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📖</span></span> الدرس اللي فات عرفنا <span class=\"en\">Chaucer</span> الراجل. النهاردة نعرف <span class=\"en\">Chaucer</span> التحفة: <span class=\"en\">The Canterbury Tales</span>، الكتاب اللي فضل يكتبه لآخر يوم في عمره، واللي لسه بيتدرس في كل جامعات العالم لحد النهاردة.</div><div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️</span></span>⃣: الفكرة العبقرية: مسابقة حكايات على الطريق <span class=\"em\"><span class=\"em\">🐎</span></span></div>", "n": 3, "i": 0, "a": "history-10-001", "x": "b24485df"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الفكرة في سطور:</div><div class=\"li\">في يوم من أيام أبريل، حوالي 30 حاج اجتمعوا في فندق اسمه <span class=\"en\">Tabard Inn</span> في منطقة <span class=\"en\">Southwark</span> جنوب لندن.</div><div class=\"li\">كلهم رايحين حج لـ <span class=\"en\">Canterbury</span>: يزوروا ضريح القديس <span class=\"en\">Thomas Becket</span>، الشهيد اللي ضريحه في كاتدرائية <span class=\"en\">Canterbury</span> كان أشهر مزارات إنجلترا.</div>", "n": 2, "i": 1, "a": "history-10-002", "x": "0dde5024"}, {"t": "mc", "h": "", "q": "فين اجتمع الحجاج في بداية <span class=\"en\">The Canterbury Tales</span>؟", "nq": 1, "opts": ["<span class=\"en\">Tabard Inn</span> في <span class=\"en\">Southwark</span>", "في قصر الملك", "في الكنيسة"], "ans": 0, "why": "<span class=\"en\">Tabard Inn</span> في <span class=\"en\">Southwark</span>", "ex": ["صح: وكانوا رايحين لـ <span class=\"en\">Canterbury</span>.", "غلط: مش المذكور.", "غلط: مش المذكور."], "i": 2}, {"t": "learn", "h": "<div class=\"li\">صاحب الفندق <span class=\"en\">Harry Bailly</span> يقرر يروح معاهم ويقترح لعبة: كل واحد يحكي حكايتين في الطريق رايح، وحكايتين راجع. وصاحب أحلى حكاية ياخد عشا مجاني على حساب الباقيين!</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> ليه الفكرة دي عبقرية؟</div><div class=\"li\">مثال يومي: تخيل أتوبيس رحلة طويلة، وفيه ناس من كل الأنواع: دكتور ومحامي وفلاح وتاجر وراهبة. والسواق يقول: كل واحد يحكي حكاية يعدّي بيها الطريق.</div>", "n": 3, "i": 3, "a": "history-10-003", "x": "fadf47de"}, {"t": "mc", "h": "", "q": "إيه اللعبة اللي اقترحها <span class=\"en\">Harry Bailly</span>؟", "nq": 1, "opts": ["كل واحد يحكي حكايتين رايح وحكايتين راجع، وأحلى حكاية ليها عشا مجاني", "سباق", "مسابقة غنا"], "ans": 0, "why": "كل واحد يحكي حكايتين رايح وحكايتين راجع، وأحلى حكاية ليها عشا مجاني", "ex": ["صح: هو صاحب الفندق.", "غلط: مش المذكور.", "غلط: مش المذكور."], "i": 4}, {"t": "learn", "h": "<div class=\"li\">كل واحد هيحكي حاجة من عالمه، والناس هتعلق وتتخانق وترد على بعض.</div><div class=\"li\">الحج في العصور الوسطى كان فعلاً زي رحلة الأتوبيس: الطبقات كلها بتتلاقى في مكان واحد، مفيش موبايلات ولا سماعات، بس طريق طويل وناس ليها تحكي.</div><div class=\"li\"><span class=\"en\">Chaucer</span> لقى الإطار المثالي اللي يجمع فيه إنجلترا كلها في كتاب واحد.</div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️</span></span>⃣: الشخصيات: إنجلترا كلها في أتوبيس واحد <span class=\"em\"><span class=\"em\">👥</span></span></div>", "n": 4, "i": 5, "a": "history-10-004", "x": "91e518f7"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> في المقدمة العامة (<span class=\"en\">General Prologue</span>)، <span class=\"en\">Chaucer</span> بيرسملنا بورتريه لكل حاج:</div><div class=\"li\">الـ <span class=\"en\">Knight</span>: فارس نبيل محترم، حارب في حروب كتير، مؤدب ومتواضع. المثال المثالي للفروسية.</div><div class=\"li\">الـ <span class=\"en\">Wife of Bath</span>: ست من <span class=\"en\">Bath</span>، اتجوزت خمس مرات! شخصية جريئة ومرحة وبتتكلم في الجواز والرجالة بمنتهى الصراحة. من أشهر شخصيات الأدب الإنجليزي كلها.</div>", "n": 3, "i": 6, "a": "history-10-005", "x": "5c980118"}, {"t": "learn", "h": "<div class=\"li\">الـ <span class=\"en\">Miller</span>: طحان ضخم وسكير وفظ، بيحكي حكايات سوقية ويضحك الكل.</div><div class=\"li\">الـ <span class=\"en\">Pardoner</span>: بياع صكوك غفران، شخصية فاسدة بيعترف بنفاقه بنفسه.</div><div class=\"li\">الـ <span class=\"en\">Parson</span>: كاهن القرية المثالي، فقير بس صادق، عكس رجال الدين الفاسدين.</div><div class=\"li\">ومعاهم: الراهبة، الراهب الصياد، التاجر، المحامي، الطبيب، الكاتب، الطباخ، البحار، الفلاح، وغيرهم.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> السر في إيه؟</div>", "n": 5, "i": 7, "a": "history-10-006", "x": "6f71f5f9"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">Pardoner</span> هو...", "nq": 1, "opts": ["بياع صكوك غفران فاسد بيعترف بنفاقه", "فارس", "كاهن طيب"], "ans": 0, "why": "بياع صكوك غفران فاسد بيعترف بنفاقه", "ex": ["صح: ده وصفه.", "غلط: ده الـ <span class=\"en\">Knight</span>.", "غلط: ده الـ <span class=\"en\">Parson</span>."], "i": 8}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Chaucer</span> مش بيسخر من الناس دي بس، ولا بيمدحهم بس. بيوريهم زي ما هم: الحلو والوحش مع بعض. عشان كده الشخصيات دي عايشة لحد النهاردة، هتلاقي ناس زيهم في أي ميكروباص في مصر.</div><div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️</span></span>⃣: الحكايات: كل الأنواع في كتاب واحد <span class=\"em\"><span class=\"em\">🎭</span></span></div>", "n": 2, "i": 9, "a": "history-10-007", "x": "25d611dc"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> تنوع الأجناس مذهل:</div><div class=\"li\">حكاية الفارس: رومانسية فروسية راقية، فارسين بيحبوا نفس الأميرة.</div><div class=\"li\">حكاية الطحان: كوميديا سوقية (<span class=\"en\">fabliau</span>) عن نجار ومراته الشابة وعاشقها.</div><div class=\"li\">وحكايات تانية: حياة قديسة، حكاية حيوانات رمزية، حكايات أخلاقية، وعظات.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> أجمل حاجة: الحكايات بتتكلم مع بعض!</div>", "n": 4, "i": 10, "a": "history-10-008", "x": "71c587ee"}, {"t": "learn", "h": "<div class=\"li\">الحكايات مش مصفوفة ساكتة، دي بترد على بعض. الطحان السكران يقاطع الترتيب ويحكي حكاية تسخر من حكاية الفارس.</div><div class=\"li\">والـ <span class=\"en\">Reeve</span> (اللي شغلانته الأصلية نجار) يتنرفز من حكاية الطحان عن النجار المخدوع، فيحكي حكاية عن طحان فاسد انتقاماً!</div><div class=\"li\">مثال يومي: زي جروب واتساب عائلي: حد ينزل بوست، والتاني يرد عليه ببوست مضاد. الأدب هنا شغال زي قعدة قهوة.</div>", "n": 3, "i": 11, "a": "history-10-009", "x": "6355a18c"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> حقيقة مهمة:</div><div class=\"li\"><span class=\"en\">Chaucer</span> مات سنة 1400 قبل ما يكمل المشروع. الخطة كانت حوالي 120 حكاية (أربع لكل حاج)، اللي اتكتب فعلاً 24 حكاية بس. الكتاب تحفة ناقصة، وده نفسه جزء من سحره.</div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️</span></span>⃣: اللغة والموسيقى <span class=\"em\"><span class=\"em\">🎵</span></span></div>", "n": 2, "i": 12, "a": "history-10-010", "x": "77f42fe7"}, {"t": "mc", "h": "", "q": "كام حكاية اتكتبت فعلاً؟", "nq": 1, "opts": ["24 من حوالي 120 مخططة", "120", "4"], "ans": 0, "why": "24 من حوالي 120 مخططة", "ex": ["صح: تحفة ناقصة.", "غلط: الخطة كانت 120.", "غلط: أكتر من كده."], "i": 13}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الوزن الجديد:</div><div class=\"li\">فاكر من درس 8 إن فرنسا دخلت الإنجليزية القافية وعدّ المقاطع؟ <span class=\"en\">Chaucer</span> هو اللي حقق الوعد ده.</div><div class=\"li\">معظم <span class=\"en\">Canterbury Tales</span> مكتوبة بسطور من 10 مقاطع، بقوافي متتابعة (كل سطرين بيقفلوا مع بعض)، والنظام ده هيبقى أساس الشعر الإنجليزي لقرون.</div>", "n": 2, "i": 14, "a": "history-10-011", "x": "61afd013"}, {"t": "mc", "h": "", "q": "معظم <span class=\"en\">Canterbury Tales</span> مكتوبة بسطور من...", "nq": 1, "opts": ["10 مقاطع", "3 مقاطع", "100 مقطع"], "ans": 0, "why": "10 مقاطع", "ex": ["صح: <span class=\"en\">Chaucer</span> حقق وعد الدرس 8.", "غلط: أكتر.", "غلط: أكتر بكتير."], "i": 15}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> أشهر سطور في الأدب الإنجليزي (أول الكتاب):</div><div class=\"u\">\"<span class=\"en\">Whan that Aprill with his shoures soote</span></div><div class=\"u\"><span class=\"en\">The droghte of March hath perced to the roote</span>\"</div><div class=\"li\">المعنى: \"لما أبريل بأمطاره الحلوة يخترق جفاف مارس لحد الجذور\". وبعد شوية سطور عن الربيع والعصافير، بيوصل للفكرة: \"وقتها الناس بتحنّ تروح الحج\".</div>", "n": 3, "i": 16, "a": "history-10-012", "x": "20ffcf04"}, {"t": "learn", "h": "<div class=\"li\">لاحظ: الإنجليزية هنا قريبة من لغتنا بشكل مش مصدق مقارنة بـ <span class=\"en\">Beowulf.</span> كلمات زي <span class=\"en\">Aprill</span> و<span class=\"en\">soote</span> (<span class=\"en\">sweet</span>) و<span class=\"en\">droghte</span> (<span class=\"en\">drought</span>) و<span class=\"en\">roote</span> (<span class=\"en\">root</span>) هتعرفها لوحدك.</div><div class=\"li\">دي أول مره تشوف فيها إنجليزي \"شبه إنجليزي\".</div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️</span></span>⃣: ليه الكتاب ده نقطة تحول في التاريخ؟ <span class=\"em\"><span class=\"em\">🌟</span></span></div><div class=\"u\">١. أثبت إن الإنجليزية تقدر تعمل كل حاجة: الراقي والسوقي، الحزين والمضحك، الديني والدنيوي، في كتاب واحد.</div>", "n": 4, "i": 17, "a": "history-10-013", "x": "b36e92c1"}, {"t": "mc", "h": "", "q": "إيه الملاحظة على لغة أول سطور الكتاب؟", "nq": 1, "opts": ["قريبة من لغتنا جداً مقارنة بـ <span class=\"en\">Beowulf</span>", "مش مفهومة خالص", "فرنسية"], "ans": 0, "why": "قريبة من لغتنا جداً مقارنة بـ <span class=\"en\">Beowulf</span>", "ex": ["صح: كلمات زي <span class=\"en\">Aprill</span> و<span class=\"en\">roote</span> هتعرفها.", "غلط: أسهل بكتير من القديم.", "غلط: إنجليزية وسيطة."], "i": 18}, {"t": "learn", "h": "<div class=\"u\">٢. أول مرة في الأدب الإنجليزي نشوف بورتريه كامل لمجتمع كامل: كل الطبقات والمهن، بضحكهم ونفاقهم وكرامتهم.</div><div class=\"u\">٣. القاعدة الذهبية <span class=\"em\"><span class=\"em\">⭐</span></span>: <span class=\"en\">Chaucer</span> مش بيثور على اللي قبله، بس بيجمع كل حاجة (فرنسي وإيطالي وإنجليزي، راقي وشعبي) في مزيج جديد. أحياناً الثورة في الأدب بتبقى \"خلط\" مش \"هدم\".</div>", "n": 2, "i": 19, "a": "history-10-014", "x": "b312d833"}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">🟢</span></span> <span class=\"en\">Sir Gawain and the Green Knight</span>: الفارس والتحدي الأخضر، عودة الـ <span class=\"en\">alliteration</span> بأبهى صورها.", "extra": "", "i": 20}];</script>
