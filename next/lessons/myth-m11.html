<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس M11</span><span class="tag"><span class="em">🏛️</span> كورس الميثولوجيا</span></div>

<script>window.LESSON_ID="myth-m11";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">🎣</span></span> أول حاجة: تخيل الإحساس ده</div><div class=\"u\">فيه بنت عندها 17 سنة، أبوها رئيس دولة. جات له في يوم وقالت له: \"يا بابا، أنا عايزة حاجة واحدة بس: عايزة أفضل حرة، ماحدش يتجوزني، وماحدش يقولي أعمل إيه. هاتلي قوس وسهام، وهاتلي كلاب، وهاتلي جبل أعيش فيه.\"</div><div class=\"u\">وأبوها ضحك، وقال: \"خدي اللي عايزاه، وزودك كمان.\"</div>", "n": 3, "i": 0, "a": "myth-m11-001", "x": "4b620fe7"}, {"t": "learn", "h": "<div class=\"u\">دي مش قصة عصرية عن بنت مستقلة. دي حكاية إغريقية عمرها أكتر من 2200 سنة، عن إلهة اسمها أرتميس (<span class=\"en\">Artemis</span>)، الرومان سموها ديانا (<span class=\"en\">Diana</span>). وكل حاجة في الفصل ده هترجع للحظة الطفولة دي: البنت اللي اختارت حدودها بنفسها.</div>", "n": 1, "i": 1, "a": "myth-m11-002", "x": "2c66ec9f"}, {"t": "learn", "h": "<div class=\"u\">وفي حاجة كمان: أرتميس هي أخت أبولو التوأم، اللي خدناه الفصل اللي فات. وبالرغم إنهم توأم، هم نقيضين تماماً. وهو الشمس والنور والكلام والشعر. وهي الليل والغابة والسكوت والقوس. وهنشوف النهارده إن الشعر الإنجليزي استخدم الاتنين، بس كل واحد في مكان مختلف.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📍</span></span> إحنا فين في الحكاية؟</div>", "n": 2, "i": 2, "a": "myth-m11-003", "x": "14958b07"}, {"t": "learn", "h": "<div class=\"li\">في أول الكورس عرفنا يعني إيه أسطورة، وإن الإشارة للأسطورة من غير ذكر اسمها اسمها <span class=\"en\">allusion.</span></div><div class=\"li\">بعدها خدنا زيوس، أبو الآلهة.</div><div class=\"li\">وفي الدرس اللي فات خدنا أبولو: الشمس، النبوة، الشعر، دلفي.</div><div class=\"li\">النهارده: أخته التوأم أرتميس، إلهة الصيد والقمر والبرية والولادة.</div>", "n": 4, "i": 3, "a": "myth-m11-004", "x": "ede81774"}, {"t": "learn", "h": "<div class=\"li\">وليه الفصل ده مهم للكورس كله؟ لأن أرتميس هي أول إلهة \"الحدود\" في الكورس. هي اللي بتحدد إيه مسموح وإيه ممنوع، وإيه اللي بيحصل لما حد يعدّي الخط.</div><div class=\"li\">والفكرة دي هتيجي معانا في قصص كتير جاية: نيوبي ، أكتايون ، كاليستو ، أنديميون ، إيفيجينيا ، هيبوليتوس .</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ مين أرتميس؟ البطاقة الأساسية <span class=\"em\"><span class=\"em\">🪪</span></span></div><div class=\"u\">1.1 الاسم.</div>", "n": 4, "i": 4, "a": "myth-m11-005", "x": "99f318a3"}, {"t": "learn", "h": "<div class=\"li\">أرتميس (<span class=\"en\">Artemis</span>) هو الاسم اليوناني. الرومان سموها ديانا (<span class=\"en\">Diana</span>).</div><div class=\"li\">والرومان ما اخترعوش إلهة جديدة. هم خدوا الإلهة اليونانية وحطوا عليها الاسم الروماني.</div><div class=\"li\">العادة دي اسمها في التاريخ <span class=\"en\">interpretatio romana</span>، يعني \"الترجمة الرومانية\" للآلهة الأجنبية. فلو قريت \"<span class=\"en\">Diana</span>\" في قصيدة إنجليزية، اعرف إنها أرتميس.</div>", "n": 3, "i": 5, "a": "myth-m11-006", "x": "e51e7782"}, {"t": "learn", "h": "<div class=\"li\">وأصل الاسم اليوناني نفسه مش معروف. ده مش رأيي، ده كلام قاموس أصول الكلمات بالحرف: اسمها \"<span class=\"en\">of unknown origin</span>\".</div><div class=\"li\">وعالم اللغة بهيكس (<span class=\"en\">Beekes</span>) بيرجّح إنه اسم من لغة أقدم من اليونانية (<span class=\"en\">Pre-Greek</span>). يعني الإغريق نفسهم أخدوا الإلهة دي من حضارة أقدم منهم، وحطوا لها اسم.</div><div class=\"u\">1.2 العيلة.</div><div class=\"li\">أبوها زيوس، وأمها ليتو (<span class=\"en\">Leto</span>، والرومان سموها <span class=\"en\">Latona</span>).</div>", "n": 4, "i": 6, "a": "myth-m11-007", "x": "2251e918"}, {"t": "mc", "h": "", "q": "إيه الاسم الروماني لأرتميس؟", "nq": 1, "opts": ["ديانا", "سيليني", "أفروديت"], "ans": 0, "why": "ديانا", "ex": ["صح: الرومان أخدوا الإلهة وحطوا عليها اسم روماني.", "غلط: سيليني إلهة القمر عند اليونان.", "غلط: أفروديت إلهة الحب."], "i": 7}, {"t": "learn", "h": "<div class=\"li\">أخوها التوأم: أبولو.</div><div class=\"li\">ودي حاجة قالها هسيود في \"نسب الآلهة\" (<span class=\"en\">Theogony</span>) في سطر 918: ليتو حملت من زيوس وولدت \"أبولو وأرتميس المحبة للسهام\" (الترجمة الإنجليزية: \"<span class=\"en\">Artemis delighting in arrows</span>\").</div><div class=\"li\">يعني الصفة الأولى اللي اتقالت عنها في أقدم نص: السهام.</div><div class=\"u\">1.3 الولادة، وأغرب تفصيلة في الحكاية.</div>", "n": 4, "i": 8, "a": "myth-m11-008", "x": "97c150da"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Artemis delighting in _____</div>", "opts": ["archer", "chair", "arrows"], "ans": 2, "why": "<span class=\"en\">Artemis delighting in arrows</span>", "i": 9}, {"t": "learn", "h": "<div class=\"li\">ليتو كانت هربانة من هيرا (مرات زيوس) اللي كانت بتطاردها في كل الأرض، لحد ما وصلت لجزيرة صغيرة اسمها ديلوس (<span class=\"en\">Delos</span>).</div><div class=\"li\">وفي \"الترنيمة الهوميرية لأبولو\" (<span class=\"en\">Hymn 3,</span> سطر 14-16) بنقرا: \"ابتهجي يا ليتو المباركة، لأنك ولدتِ أولاداً مجيدين: السيد أبولو وأرتميس المحبة للسهام؛ هي في أورتيجيا، وهو في ديلوس الصخرية.\"</div>", "n": 2, "i": 10, "a": "myth-m11-009", "x": "6f7e6607"}, {"t": "learn", "h": "<div class=\"li\">يعني الاتنين ما اتولدوش في نفس المكان بالظبط. أرتميس اتولدت الأول، في أورتيجيا.</div><div class=\"li\">وهنا الجزء الغريب: أبولودوروس (<span class=\"en\">Library 1.4.1</span>) بيقول إن ليتو \"ولدت أرتميس أولاً، وبمساعدة قابليتها (<span class=\"en\">midwifery</span>) ولدت أبولو بعدها\".</div>", "n": 2, "i": 11, "a": "myth-m11-010", "x": "b36ef6bd"}, {"t": "learn", "h": "<div class=\"li\">تخيل المشهد: بنت مولودة لسه، بتساعد أمها تولد أخوها. والحكاية دي معمولة لسبب: عشان تفسّر ليه الستات في اليونان كانوا بينادوا أرتميس وقت الولادة.</div><div class=\"li\">ونفس الحكاية عند كاليماكوس (شاعر إسكندري من القرن الثالث قبل الميلاد)، وفيها إن الآلام ما جاتش على ليتو وهي بتولد أرتميس، فبقيت أرتميس هي اللي بتخفف آلام غيرها.</div><div class=\"li\">(<span class=\"en\">Callimachus,</span> <span class=\"en\">Hymn 3,</span> سطر 1-40)</div>", "n": 3, "i": 12, "a": "myth-m11-011", "x": "8eacc4dc"}, {"t": "mc", "h": "", "q": "إيه اللي حصل في الولادة حسب الرواية اللي حكاها أبولودوروس؟", "nq": 1, "opts": ["أرتميس اتولدت الأول وساعدت أمها تولد أبولو", "أبولو اتولد الأول", "اتولدوا في نفس اللحظة"], "ans": 0, "why": "أرتميس اتولدت الأول وساعدت أمها تولد أبولو", "ex": ["صح: ولهذا كانت الستات بتنادي أرتميس وقت الولادة.", "غلط: أرتميس هي الأولى.", "غلط: الرواية بتقول أرتميس الأول."], "i": 13}, {"t": "learn", "h": "<div class=\"u\">1.4 ألقابها، وكل لقب وراه حكاية.</div><div class=\"li\"><span class=\"en\">Cynthia</span> (كينثيا): من جبل كينثوس (<span class=\"en\">Cynthus</span>) في جزيرة ديلوس، مكان ولادتها. (من اللاتينية <span class=\"en\">Cynthia dea</span>، \"الإلهة الكينثية\")</div><div class=\"li\"><span class=\"en\">Delia</span>: نفس الفكرة، من ديلوس.</div><div class=\"li\"><span class=\"en\">Phoebe</span> (فيبي): يعني \"المشرقة\"، وده لقب بيستخدم للقمر كمان.</div><div class=\"li\"><span class=\"en\">Diana Nemorensis</span>: \"ديانا الغابة\"، وهنحكي عنها تحت.</div>", "n": 5, "i": 14, "a": "myth-m11-012", "x": "13a4571c"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">potnia theron</span>: يعني \"سيدة الوحوش\". ده لقبها عند هوميروس، في الإلياذة 21.470.</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ القصة الكبيرة: البنت اللي طلبت حاجاتها من أبوها <span class=\"em\"><span class=\"em\">👧</span></span></div><div class=\"u\">2.1 المشهد.</div><div class=\"u\">كاليماكوس، في ترنيمته لأرتميس، بيبدأ من مشهد واحد بس: طفلة صغيرة قاعدة على رُكب أبوها (زيوس)، وبتتكلم معاه بجدية تامة.</div><div class=\"u\">2.2 الطلبات، واحدة واحدة.</div>", "n": 5, "i": 15, "a": "myth-m11-013", "x": "0292c9c1"}, {"t": "learn", "h": "<div class=\"li\">العذرية الأبدية: \"<span class=\"en\">Give me to keep my maidenhood,</span> <span class=\"en\">Father,</span> <span class=\"en\">forever</span>\" — \"اديني أحفظ عذريتي للأبد يا بابا\".</div><div class=\"li\">أسماء كتير: \"<span class=\"en\">give me to be of many names</span>\" — عشان أبولو ما يبقاش هو الأشهر.</div><div class=\"li\">القوس والسهام: بس بذكاء، ما طلبتش قوس كبير: قالت للسيклопات هيعملوا لها واحد.</div><div class=\"li\">النور: \"<span class=\"en\">Bringer of Light</span>\" — إنها تبقى جايبة النور.</div>", "n": 4, "i": 16, "a": "myth-m11-014", "x": "206bf3e5"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Give me to keep my _____,</div>", "opts": ["granted", "maidenhood", "against"], "ans": 1, "why": "<span class=\"en\">Give me to keep my maidenhood,</span>", "i": 17}, {"t": "learn", "h": "<div class=\"li\">هدوم عملية: تونيك قصير لحد الركبة، مطرّز، عشان تقدر تجري وتصطاد.</div><div class=\"li\">60 بنت من بنات أوقيانوس، كلهم 9 سنين، كورس بيغنوا معاها.</div><div class=\"li\">20 حورية من أمنيسوس يخدموا كلابها وأحذيتها.</div><div class=\"li\">كل الجبال.</div><div class=\"li\">ومدينة واحدة بس. وقالت: \"قليل لما أرتميس بتنزل المدينة.\"</div><div class=\"u\">2.3 رد الأب.</div>", "n": 6, "i": 18, "a": "myth-m11-015", "x": "aef3051f"}, {"t": "learn", "h": "<div class=\"u\">زيوس ضحك، ووافق، وزادها: 30 مدينة، وقال لها إنها هتبقى \"حارسة الشوارع والمواني\". (<span class=\"en\">Callimachus,</span> <span class=\"en\">Hymn 3,</span> سطر 28-39)</div><div class=\"u\">2.4 ليه المشهد ده عبقرية؟</div><div class=\"li\">لأنه بيشرح كل صفات الإلهة في مشهد واحد، من غير ما يعدّدها.</div><div class=\"li\">ولأنه بيقول حاجة مهمة: أرتميس هي الإلهة الوحيدة اللي \"اختارت\" هويتها بنفسها. ماحدش فرضها عليها.</div>", "n": 4, "i": 19, "a": "myth-m11-016", "x": "73852d2b"}, {"t": "mc", "h": "", "q": "إيه اللي طلبته أرتميس من أبوها وهي صغيرة؟", "nq": 1, "opts": ["تفضل حرة، وقوس وسهام وأسماء كتير", "قصر وعرش", "جواز"], "ans": 0, "why": "تفضل حرة، وقوس وسهام وأسماء كتير", "ex": ["صح: وزيوس ضحك ووافق.", "غلط: اختارت الحرية.", "غلط: رفضت الجواز."], "i": 20}, {"t": "learn", "h": "<div class=\"li\">وده أول مفتاح للفصل: أرتميس إلهة الحدود. هي اللي بترسم الخط، ومش بتحب اللي يعديه.</div><div class=\"u\">2.5 ملحوظة أمانة علمية.</div><div class=\"u\">كاليماكوس متأخر: القرن الثالث قبل الميلاد. يعني النسخة دي مصقولة ومكتوبة، مش أقدم نص. أقدم الإشارات لأرتميس عندنا في هوميروس وهسيود، وأرتميس عندهم إلهة صيد، مش \"بنت طلبت حاجات من أبوها\". الأسطورة بتكبر وتتظبط مع الزمن.</div>", "n": 3, "i": 21, "a": "myth-m11-017", "x": "022ea832"}, {"t": "learn", "h": "<div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ الميادين الأربعة بتاعتها <span class=\"em\"><span class=\"em\">🗺️</span></span></div><div class=\"u\">3.1 الصيد والبرية <span class=\"em\"><span class=\"em\">🏹</span></span></div><div class=\"li\">هي إلهة الصيد الأول. بتصطاد بالليل، وبتخرج مع حورياتها.</div><div class=\"li\">وفي هوميروس، لقبها \"سيدة الوحوش\" (<span class=\"en\">potnia theron</span>). يعني مش بس بتصطاد الحيوانات، هي مسؤولة عنهم.</div><div class=\"li\">والبرية عند الإغريق مش \"مكان وحش\". البرية هي المكان اللي بره المدينة، بره القانون، بره البيوت. وأرتميس هي ملكة المكان ده.</div>", "n": 5, "i": 22, "a": "myth-m11-018", "x": "4e024142"}, {"t": "learn", "h": "<div class=\"li\">مثال من الحياة: الفرق بين الشارع المنظم اللي فيه إشارات ومرور، وبين الصحرا اللي بره البلد. الاتنين موجودين، بس لكل واحد قواعده.</div><div class=\"u\">3.2 القمر <span class=\"em\"><span class=\"em\">🌙</span></span></div><div class=\"li\">أرتميس اتربطت بالقمر. بس خلينا نكون دقيقين: الربط ده جه متأخر.</div>", "n": 3, "i": 23, "a": "myth-m11-019", "x": "651b705c"}, {"t": "learn", "h": "<div class=\"li\">فيه مرجع متخصص في الأساطير بيقول بالحرف: \"<span class=\"en\">The identification of Selene with Artemis was a late invention</span>\" — توحيد سيليني (إلهة القمر اليونانية) مع أرتميس كان اختراعاً متأخراً، ويمكن جه مع دخول إلهة تراقية اسمها بنديس (<span class=\"en\">Bendis</span>) لليونان.</div><div class=\"li\">ومع الوقت، التلاتة (سيليني + هيكاتي + أرتميس) اندمجوا في فكرة واحدة: الإلهة التلاتية.</div>", "n": 2, "i": 24, "a": "myth-m11-020", "x": "1d069129"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">The identification of Selene with Artemis was a late _____</div>", "opts": ["bethought", "albeit", "invention"], "ans": 2, "why": "<span class=\"en\">The identification of Selene with Artemis was a late invention</span>", "i": 25}, {"t": "learn", "h": "<div class=\"li\">وشاهد حلو من شيشرون (<span class=\"en\">De Natura Deorum 2.27</span>): \"ديانا بيعرّفوها بالقمر... واسم لونا جاي من <span class=\"en\">lucere</span> يعني 'يلمع'... وهي بتتنادى عشان تساعد في ولادة الأطفال، لأن مدة الحمل سبع أو تسع دورات قمرية.\"</div><div class=\"li\">يعني الربط بين القمر والولادة مش شعر: هو محاولة بدائية لتفسير إن الشهور مرتبطة بالقمر.</div><div class=\"li\">وفي الشعر الإنجليزي، القمر = ديانا = كينثيا. تلات أسماء لحاجة واحدة.</div>", "n": 3, "i": 26, "a": "myth-m11-021", "x": "c07b95cc"}, {"t": "mc", "h": "", "q": "إمتى اتربطت أرتميس بالقمر؟", "nq": 1, "opts": ["متأخر، واتوحدت مع سيليني بعدين", "من أول الأسطورة", "عمرها ما اتربطت بيه"], "ans": 0, "why": "متأخر، واتوحدت مع سيليني بعدين", "ex": ["صح: في هوميروس هي إلهة الصيد.", "غلط: الربط جه متأخر.", "غلط: اتربطت بيه في العصور المتأخرة."], "i": 27}, {"t": "learn", "h": "<div class=\"u\">3.3 الولادة والموت المفاجئ <span class=\"em\"><span class=\"em\">⚖️</span></span></div><div class=\"li\">دي أغرب نقطة في أرتميس، ومحتاجة تركيز.</div><div class=\"li\">هي بتحمي الأطفال والحيوانات الصغيرة. وبنفس الوقت، هي اللي بتموّت الستات موتاً مفاجئاً من غير مرض.</div>", "n": 3, "i": 28, "a": "myth-m11-022", "x": "3b5f0a48"}, {"t": "learn", "h": "<div class=\"li\">الدليل الأول، الإلياذة 21: هيرا بتعيّر أرتميس وتقول لها بالحرف (ترجمة <span class=\"en\">Murray</span>): \"<span class=\"en\">Zeus made thee a lion against women,</span> <span class=\"en\">and granted thee to slay whomsoever of them thou wilt</span>\" — \"زيوس خلاكِ لبؤة على الستات، وأدالكِ تقتلي أي واحدة فيهم تحبيها.\"</div>", "n": 1, "i": 29, "a": "myth-m11-023", "x": "2fb357b8"}, {"t": "learn", "h": "<div class=\"li\">الدليل التاني، الأوديسة 11: أوديسيوس بيسأل أمه الميتة عن سبب موتها (ترجمة <span class=\"en\">Kline</span>): \"<span class=\"en\">Was it a wasting disease,</span> <span class=\"en\">or did Artemis of the Bow attack you with her gentle arrows,</span> <span class=\"en\">and kill you?</span>\" — \"كان مرض بياكلكِ، ولا أرتميس صاحبة القوس ضربتكِ بسهامها اللطيفة وقتلتكِ؟\"</div>", "n": 1, "i": 30, "a": "myth-m11-024", "x": "c208cc7b"}, {"t": "learn", "h": "<div class=\"li\">خد بالك من الكلمة: \"<span class=\"en\">gentle arrows</span>\"، سهام لطيفة. الموت اللي بييجي من غير وجع، من غير حرب، من غير مرض طويل: ده سهم أرتميس.</div><div class=\"li\">يعني أرتميس مش \"إلهة الموت\". هي الإلهة اللي بتقف على الحد بين الحياة والموت. الست بتولد بمساعدة أرتميس، وبتموت فجأة بسهم أرتميس. نفس الإلهة على الطرفين.</div>", "n": 2, "i": 31, "a": "myth-m11-025", "x": "e4f918eb"}, {"t": "learn", "h": "<div class=\"li\">وده مثال كويس على حاجة اسمها في الدراسات الدينية \"تفسير بدائي للظاهرة\": الإغريق شافوا إن الستات بتموت فجأة أكتر من الرجالة في سن معينة، فحطوا تفسير: فيه إلهة بتصطادهم.</div><div class=\"li\">التفسير غلط طبياً، بس الأسطورة شغالة عشان بتدي معنى.</div><div class=\"u\">3.4 الطهارة والعذرية <span class=\"em\"><span class=\"em\">🕊️</span></span></div><div class=\"li\">أرتميس عذراء للأبد، وحورياتها كلهم عذارى.</div>", "n": 4, "i": 32, "a": "myth-m11-026", "x": "39d68ce9"}, {"t": "mc", "h": "", "q": "الموت المفاجئ من غير مرض للستات اتنسب في هوميروس لمين؟", "nq": 1, "opts": ["أرتميس بسهامها", "أثينا", "ديميتر"], "ans": 0, "why": "أرتميس بسهامها", "ex": ["صح: سهام لطيفة، موت من غير وجع.", "غلط: ده دور أرتميس.", "غلط: ده دور أرتميس."], "i": 33}, {"t": "learn", "h": "<div class=\"li\">والقاعدة دي هي اللي بتفجّر معظم قصصها: أول ما حد يكسر القاعدة، العقاب بييجي فوراً. أكتايون شافها، كاليستو حملت، هيبوليتوس اختارها على أفروديت.</div><div class=\"li\">مثال من الحياة: مدرّبة فريق صارمة عندها قواعد واضحة، وماحدش بيتناقش فيها. أول واحد يكسر قاعدة بيتطرد من الفريق، مش بسبب كره، بسبب إن القاعدة هي اللي بتحمي الفريق كله.</div><div class=\"u\">4<span class=\"em\"><span class=\"em\">️</span></span>⃣ <span class=\"em\"><span class=\"em\">🔄</span></span> من الحياة: فين أرتميس في يومك؟</div>", "n": 3, "i": 34, "a": "myth-m11-027", "x": "0eb8265b"}, {"t": "learn", "h": "<div class=\"u\">4.1 البنت اللي بتحب \"البرية\".</div><div class=\"u\">فيه ناس مابيرتاحوش غير بره المدينة: يمشوا في الصحرا، يناموا في خيمة، يصحوا على صوت طيور. المدينة بتخنقهم. أرتميس هي القديسة الراعية للنوع ده من البشر. ولاحظ إنها في الحكاية ما اختارتش قصر، اختارت جبل.</div><div class=\"u\">4.2 الطبيبة أو القابلة.</div>", "n": 3, "i": 35, "a": "myth-m11-028", "x": "c01cbd84"}, {"t": "learn", "h": "<div class=\"u\">اللي بتدخل أوضة الولادة وتقف مع ست في أخطر لحظة في حياتها. ده بالظبط الشغل التاني لأرتميس، والدليل إنها في الحكاية ساعدت أمها تولد وهي لسه مولودة. مفيش إله يوناني تاني عنده الشغلانة دي.</div><div class=\"u\">4.3 الخط الأحمر.</div><div class=\"u\">فيه ناس بتعرف تقول \"لأ\" بوضوح، وعندها خط ما بيتعداش. أرتميس هي أسطورة الخط الأحمر. وكل مشاكلها بتيجي من ناس عدّوا الخط.</div>", "n": 3, "i": 36, "a": "myth-m11-029", "x": "a05faf58"}, {"t": "learn", "h": "<div class=\"u\">4.4 اللي بيحصل لما حد يعدّي الحد.</div><div class=\"u\">أرتميس ما بتعملش محاكمة. ما بتسمعش دفاع. بتعاقب على طول. وده فرق مهم بين الأسطورة والقانون: القانون بيسأل، الأسطورة بتحكم. خد بالك من النقطة دي لما تقرا قصصها.</div><div class=\"u\">5<span class=\"em\"><span class=\"em\">️</span></span>⃣ ديانا الرومانية وملك الغابة <span class=\"em\"><span class=\"em\">🌲🗡️</span></span></div><div class=\"u\">5.1 الاسم.</div>", "n": 4, "i": 37, "a": "myth-m11-030", "x": "3e6e003c"}, {"t": "learn", "h": "<div class=\"u\">ديانا اسم إيطالي قديم، مش ترجمة لأرتميس. وأصله غالباً من جذر هندو-أوروبي *<span class=\"en\">dyeu-</span> يعني \"يلمع\"، ومنه كمان كلمات زي <span class=\"en\">divine</span> و<span class=\"en\">deity</span> و<span class=\"en\">Zeus</span> نفسه. يعني الاسم معناه تقريباً \"اللامعة\"، وده مناسب للقمر.</div><div class=\"u\">5.2 غابة نيمي.</div>", "n": 2, "i": 38, "a": "myth-m11-031", "x": "e466249b"}, {"t": "learn", "h": "<div class=\"u\">قرب روما، في منطقة اسمها جبال ألبان، فيه بحيرة اسمها نيمي (<span class=\"en\">Lake Nemi</span>). الرومان سموها \"مراية ديانا\" (<span class=\"en\">Speculum Dianae</span>) لأنها كانت بتعكس القمر. وحواليها غابة مقدسة لديانا نيمورينسيس.</div><div class=\"li\">وفي الغابة دي كان فيه كاهن اسمه \"ملك الغابة\" (<span class=\"en\">rex Nemorensis</span>).</div>", "n": 2, "i": 39, "a": "myth-m11-032", "x": "2eff7c5a"}, {"t": "learn", "h": "<div class=\"li\">والقاعدة: عبد هارب (<span class=\"en\">runaway slave</span>) لو كسر غصن من شجرة بلوط مقدسة، بياخد حق إنه يحارب الكاهن الحالي. لو قتله، بيبقى هو الكاهن الجديد.</div><div class=\"li\">والكاهن الجديد بيفضل شايل سيفه، قاعد مستني اللي جاي يقتله. (المصادر: سترابو، الجغرافيا 5.3.12؛ باوسانياس 2.27.4؛ سويتونيوس، كاليجولا 35.3)</div><div class=\"li\">وده مش تخيل: ده وصف من نصوص قديمة.</div><div class=\"u\">5.3 ليه ده مهم؟</div>", "n": 4, "i": 40, "a": "myth-m11-033", "x": "e6326787"}, {"t": "learn", "h": "<div class=\"u\">لأن جيمس فريزر بدأ كتابه الشهير \"الغصن الذهبي\" (<span class=\"en\">The Golden Bough</span>) من السؤال ده بالظبط: ليه كاهن ديانا لازم يقتل اللي قبله؟ وده بداية علم الأنثروبولوجيا الحديثة في دراسة الأسطورة.</div><div class=\"li\">ملحوظة مهمة: مفيش دليل إن أرتميس اليونانية كان عندها طقس زي ده. ده طقس إيطالي محلي لديانا. يعني نفس الإلهة، لكن كل شعب حطّ لها طقوسه.</div>", "n": 2, "i": 41, "a": "myth-m11-034", "x": "fffb5ba8"}, {"t": "mc", "h": "", "q": "إيه القاعدة في غابة نيمي لديانا؟", "nq": 1, "opts": ["اللي يقتل الكاهن الحالي يبقى هو الكاهن الجديد", "الكاهن بيتنتخب بالتصويت", "الكاهن بيورّث لابنه"], "ans": 0, "why": "اللي يقتل الكاهن الحالي يبقى هو الكاهن الجديد", "ex": ["صح: وده اللي بدأ منه فريزر الغصن الذهبي.", "غلط: القاعدة بالقتل.", "غلط: القاعدة بالقتل."], "i": 42}, {"t": "learn", "h": "<div class=\"u\">6<span class=\"em\"><span class=\"em\">️</span></span>⃣ أفسس: المعبد اللي اتحرق في يوم ميلاد الإسكندر <span class=\"em\"><span class=\"em\">🏛️🔥</span></span></div><div class=\"u\">6.1 المدينة.</div><div class=\"u\">أفسس مدينة على ساحل آسيا الصغرى (تركيا النهاردة). وكان فيها معبد أرتميس، واحد من عجائب الدنيا السبع.</div><div class=\"u\">6.2 البناء.</div><div class=\"u\">بدأ حوالي سنة 550 قبل الميلاد، واتموّل جزئياً من كروسوس (<span class=\"en\">Croesus</span>)، ملك ليديا الغني. (المصدر: <span class=\"en\">Biblical Archaeology Society</span>، مقال مارك ويلسون عن حريق المعبد)</div><div class=\"u\">6.3 الحريق.</div>", "n": 6, "i": 43, "a": "myth-m11-035", "x": "1d5c8fe2"}, {"t": "learn", "h": "<div class=\"u\">في سنة 356 قبل الميلاد، واحد اسمه هيروستراتوس (<span class=\"en\">Herostratus</span>) دخل المعبد بالليل وحط نار في الأماكن الحساسة، وحرقه بالكامل. وسلّم نفسه بنفسه، واعترف، والسبب؟ عايز اسمه يفضل في التاريخ.</div><div class=\"li\">والأفسسيون عملوا إيه؟ قتلوه، ومنعوا ذكر اسمه تحت تهديد الموت. بس مؤرخ اسمه ثيوبومبوس كتب عنه، فالاسم وصل لنا. الخطة نجحت. <span class=\"em\"><span class=\"em\">😅</span></span></div><div class=\"u\">6.4 الحكاية الحلوة.</div>", "n": 3, "i": 44, "a": "myth-m11-036", "x": "91a01fe7"}, {"t": "learn", "h": "<div class=\"u\">في نفس الليلة، اتولد الإسكندر الأكبر في مقدونيا. بلوتارخ في \"حياة الإسكندر\" (فصل 3) بيقول إن هيجيسياس قال جملة لطيفة: مش عجيب إن معبد أرتميس اتحرق، لأن الإلهة كانت مشغولة تولّد الإسكندر.</div><div class=\"li\">وفيه تفصيلة سياسية حلوة: الإسكندر بعدين عرض يدفع تمن إعادة البناء، فالأفسسيون رفضوا، وقالوا: \"مش صح إن إله يبني معبد لإله تاني.\" (نفس المصدر)</div>", "n": 2, "i": 45, "a": "myth-m11-037", "x": "445d7ff5"}, {"t": "learn", "h": "<div class=\"u\">6.5 الاسم في العهد الجديد.</div><div class=\"u\">المعبد اتبنى تاني بعد كده. والرومان سموها ديانا أفسس. وفي سفر أعمال الرسل، الفصل 19، فيه مشهد كامل عن هيصة في المدينة بسببها:</div><div class=\"li\">واحد اسمه ديميتروس، صايغ فضة، كان بيصنع \"مقامات فضة لديانا\" وبيتعيش من الشغلانة دي. (أعمال 19:24)</div><div class=\"li\">لما بولس بقى يوعظ، ديميتروس خاف على تجارته، وجمّع الصنّاع، وقال لهم إن \"صناعتنا في خطر\". (19:27)</div>", "n": 4, "i": 46, "a": "myth-m11-038", "x": "f9c4bd6a"}, {"t": "learn", "h": "<div class=\"li\">والنتيجة: المدينة اتقسمت، والناس اتجمعت في المسرح، وفضلوا يصوتوا لمدة ساعتين: \"<span class=\"en\">Great is Diana of the Ephesians</span>\" — \"عظيمة هي ديانا الأفسسيين\".</div><div class=\"li\">(أعمال 19:34، ترجمة <span class=\"en\">King James</span>)</div><div class=\"u\">6.6 التمثال الشهير، والحقيقة اللي ماحدش بيقولها.</div><div class=\"li\">تمثال ديانا أفسس مش زي أي تمثال يوناني أو روماني. فيه \"زخرفة صدر متعدد\" — كتل كتير على الصدر أو على الوسط.</div>", "n": 4, "i": 47, "a": "myth-m11-039", "x": "10e8ef95"}, {"t": "mc", "h": "", "q": "مين حرق معبد أرتميس في أفسس سنة 356 ق.م؟", "nq": 1, "opts": ["هيروستراتوس عشان اسمه يفضل في التاريخ", "زلزال", "الرومان"], "ans": 0, "why": "هيروستراتوس عشان اسمه يفضل في التاريخ", "ex": ["صح: وسلّم نفسه واعترف.", "غلط: الحريق كان بفعل شخص.", "غلط: الحريق كان بفعل شخص."], "i": 48}, {"t": "learn", "h": "<div class=\"li\">والكتب الشعبية بتقول \"إلهة بأثداء كتير\". الحقيقة: العلماء مش متفقين خالص.</div><div class=\"li\">فيه دراسات بتقول أثداء، ودراسات بتقول بلح أو فواكه (لأن النخلة رمز أفسس)، وفيه اللي بيقول بيض، وفيه اللي بيقول خصي تيران.</div><div class=\"li\">(بحث أنيتا رادي، \"<span class=\"en\">The Polymastic Nature of the Diana Ephesia Cult Statue</span>\")</div>", "n": 3, "i": 49, "a": "myth-m11-040", "x": "1e2d8817"}, {"t": "learn", "h": "<div class=\"li\">الخلاصة الأمينة: إحنا مش عارفين. وأي حد يقول لك \"دي إلهة الخصوبة بألف بز\" بيبقى بيبالغ.</div><div class=\"u\">6.7 تنبيه مهم.</div><div class=\"u\">ديانا أفسس مش ديانا الرومانية الكلاسيكية. التمثال شكله شرقي قديم جداً، واليونانيين والرومان نفسهم كانوا مستغربين منه. نفس الاسم، حاجات مختلفة. وده درس في الميثولوجيا: الاسم الواحد ممكن يغطي تلات ديانات.</div><div class=\"u\">7<span class=\"em\"><span class=\"em\">️</span></span>⃣ القصص المرتبطة، وهنقابلها لاحقاً <span class=\"em\"><span class=\"em\">🧵</span></span></div>", "n": 4, "i": 50, "a": "myth-m11-041", "x": "01f0bf4e"}, {"t": "learn", "h": "<div class=\"u\">7.1 نيوبي — ست تحدّت أم الإلهة.</div><div class=\"li\">نيوبي ست من طيبة، عندها ولاد كتير. قالت لليتو: \"أنا ولدت كتير، وإنتِ ولدتِ اتنين بس.\"</div><div class=\"li\">النتيجة: أبولو قتل الولاد بسهامه، وأرتميس قتلت البنات بسهامها.</div><div class=\"li\">وهوميروس حكاها في الإلياذة 24، سطر 602-617، وهي أقدم ذكر للقصة.</div>", "n": 4, "i": 51, "a": "myth-m11-042", "x": "31b320c2"}, {"t": "learn", "h": "<div class=\"li\">والاقتباس (ترجمة <span class=\"en\">Murray</span>): \"<span class=\"en\">For even the fair-haired Niobe bethought her of meat,</span> <span class=\"en\">albeit twelve children perished in her halls,</span> <span class=\"en\">six daughters and six lusty sons.</span> <span class=\"en\">The sons Apollo slew with shafts from his silver bow.</span>.. <span class=\"en\">and the daughters the archer Artemis.</span>\"</div>", "n": 1, "i": 52, "a": "myth-m11-043", "x": "64852970"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">For even the fair-_____ Niobe bethought her of meat,</div>", "opts": ["sleep", "wandring", "haired"], "ans": 2, "why": "<span class=\"en\">For even the fair-haired Niobe bethought her of meat,</span>", "i": 53}, {"t": "learn", "h": "<div class=\"li\">يعني: \"حتى نيوبي الجميلة شعرها افتكرت الأكل، مع إن 12 ولد ماتوا في بيتها، ست بنات وست ولاد. الولاد قتلهم أبولو بسهام قوسه الفضي، والبنات قتلتهم أرتميس صاحبة السهام.\"</div><div class=\"li\">وبعدها نيوبي بكت لحد ما بقت حجر على جبل سيبيلوس، والدموع لسه بتنزل منه.</div>", "n": 2, "i": 54, "a": "myth-m11-044", "x": "eb1bea9d"}, {"t": "learn", "h": "<div class=\"li\">ملحوظة: عدد الولاد بيختلف بين النسخ. هوميروس بيقول 12 (6+6)، أوفيد بيقول 14 (7+7)، وفيه نسخ بأرقام تانية. (<span class=\"en\">Oxford Classical Dictionary</span>، مادة <span class=\"en\">Niobe</span>)</div><div class=\"u\">7.2 أكتايون — الصياد اللي شافها.</div><div class=\"li\">أكتايون صياد شاف أرتميس وهي بتستحمى في الغابة. العقاب: حوّلته لغزال، وكلابه هي اللي قتلته.</div>", "n": 3, "i": 55, "a": "myth-m11-045", "x": "534a5618"}, {"t": "learn", "h": "<div class=\"li\">أوفيد حكى القصة في \"التحولات\" الكتاب 3 ولاحظ الحكمة القاسية: الصياد اللي عاش على الصيد، مات بسبب كلابه.</div><div class=\"u\">7.3 كاليستو — الحورية اللي بقت دبة.</div><div class=\"li\">كاليستو كانت من حوريات أرتميس. زيوس حبها، وجالها في شكل أرتميس نفسها (يعني استغل شكل الإلهة عشان يخدعها).</div><div class=\"li\">لما الحمل بان وهي بتستحمى، أرتميس طردتها. وبعدين هيرا (مرات زيوس) حوّلتها لدبة.</div>", "n": 4, "i": 56, "a": "myth-m11-046", "x": "9a83ab79"}, {"t": "learn", "h": "<div class=\"li\">وابنها أركاس كبر وصياد، وجا يقتلها وهو مش عارف إنها أمه، فزيوس أنقذ الموقف وحوّل الاتنين لكواكب: الدب الأكبر والدب الأصغر. (<span class=\"en\">Ovid,</span> <span class=\"en\">Metamorphoses 2.409-531</span>)</div><div class=\"li\">الحكاية دي فيها كل حاجة: الخداع، والطرد، والتحول، والنجاة في السما.</div><div class=\"u\">7.4 أوريون — الصياد العملاق.</div>", "n": 3, "i": 57, "a": "myth-m11-047", "x": "0a8aaaa4"}, {"t": "mc", "h": "", "q": "كاليستو حورية أرتميس اتحولت لإيه؟", "nq": 1, "opts": ["دبة", "غزالة", "شجرة"], "ans": 0, "why": "دبة", "ex": ["صح: وبعدين بقت كوكبة الدب الأكبر.", "غلط: الأسطورة بتقول دبة.", "غلط: الأسطورة بتقول دبة."], "i": 58}, {"t": "learn", "h": "<div class=\"li\">أوريون صياد عملاق. فيه نسخة قديمة عند هوميروس إن إيوس (الفجر) حبته، فأرتميس قتلته في أورتيجيا. (الأوديسة 5.121-124)</div><div class=\"li\">وفي الأوديسة 11.572-575، أوديسيوس شافه في العالم السفلي وهو بيجمع الوحوش اللي كان قتلهم في حياته.</div><div class=\"li\">وفي الإلياذة 18.487-489، أوريون مرسوم على درع أخيل، والدب في السما بيراقبه. (المصدر: <span class=\"en\">Oxford Classical Dictionary</span>، مادة <span class=\"en\">Orion</span>)</div>", "n": 3, "i": 59, "a": "myth-m11-048", "x": "1657dac9"}, {"t": "learn", "h": "<div class=\"li\">يعني أوريون موجود في السما كنجم، وقصته فيها أكتر من نسخة، وده طبيعي في الميثولوجيا.</div><div class=\"u\">7.5 إيفيجينيا — البنت اللي اتطلبت قربان.</div><div class=\"li\">أرتميس هي اللي طلبت من أجاممنون يقدّم بنته إيفيجينيا قربان، عشان الرياح ترجع للسفن اللي رايحة طروادة. والحكاية دي من أهم حكايات حرب طروادة</div><div class=\"u\">7.6 هيبوليتوس — الشاب اللي اختارها.</div>", "n": 4, "i": 60, "a": "myth-m11-049", "x": "2fe22511"}, {"t": "learn", "h": "<div class=\"li\">هيبوليتوس شاب مخصص حياته لأرتميس، ورفض أفروديت (إلهة الحب). النتيجة: مات موتة فظيعة بسبب حصنه.</div><div class=\"u\">7.7 أنديميون — الراعي النايم.</div><div class=\"li\">أبولودوروس (<span class=\"en\">Library 1.7.5</span>) بيقول: أنديميون كان جميل جداً، \"فالقمر حبّه، وزيوس خلاه يختار، فاختار إنه ينام للأبد، بلا موت وبلا شيخوخة\".</div>", "n": 3, "i": 61, "a": "myth-m11-050", "x": "f7ed20bb"}, {"t": "learn", "h": "<div class=\"li\">يعني إلهة القمر حبت واحد، وهو اختار النوم. أغرب قصة حب في الميثولوجيا، وكيتس كتب عنها قصيدة كاملة.</div><div class=\"u\">8<span class=\"em\"><span class=\"em\">️</span></span>⃣ <span class=\"em\"><span class=\"em\">📜</span></span> الأسطورة في الشعر الإنجليزي</div><div class=\"u\">8.1 شكسبير، \"حلم ليلة صيف\" (<span class=\"en\">A Midsummer Night's Dream</span>)، الفصل الأول، المشهد الأول، سطر 9-11. هيبوليتا بتتكلم:</div><div class=\"u\">\"<span class=\"en\">And then the moon,</span> <span class=\"en\">like to a silver bow</span></div><div class=\"u\"><span class=\"en\">New-bent in heaven,</span> <span class=\"en\">shall behold the night</span></div><div class=\"u\"><span class=\"en\">Of our solemnities.</span>\"</div>", "n": 6, "i": 62, "a": "myth-m11-051", "x": "abfcfcf9"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">like to a _____ bow</div>", "opts": ["shafts", "slain", "silver"], "ans": 2, "why": "<span class=\"en\">like to a silver bow</span>", "i": 63}, {"t": "learn", "h": "<div class=\"u\">الترجمة: \"وبعدين القمر، زي قوس فضي متوتّر جديد في السما، هيشهد ليلة أفراحنا.\"</div><div class=\"li\">الشرح: هيبوليتا بتتكلم عن الهلال اللي هيطلع بعد أربع ليالي. وشبهته بقوس \"متوتّر جديد\" (<span class=\"en\">new-bent</span>).</div><div class=\"li\">وليه التشبيه ده ذكي؟ لأن القوس هو سلاح أرتميس بالظبط. يعني شكسبير حط الإلهة في المشهد من غير ما ينطق اسمها. ده الـ <span class=\"en\">allusion</span> اللي اتكلمنا عنه، إشارة من غير اسم.</div>", "n": 3, "i": 64, "a": "myth-m11-052", "x": "880b65ab"}, {"t": "learn", "h": "<div class=\"li\">وكمان: المسرحية كلها مشغولة بالقمر. القمر هو اللي بيحدد مواعيد العرس، والقمر هو اللي بيخبط على كل حاجة في الغابة. فالتشبيه مش زينة، هو موضوع المسرحية.</div><div class=\"u\">8.2 بن جونسون، \"<span class=\"en\">Queen and huntress,</span> <span class=\"en\">chaste and fair</span>\" — من مسرحية <span class=\"en\">Cynthia's Revels</span> (اتعملت بين سبتمبر 1600 ومايو 1601):</div>", "n": 3, "i": 65, "a": "myth-m11-053", "x": "7373441a"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Queen and huntress,</span> <span class=\"en\">chaste and fair,</span></div><div class=\"u\"><span class=\"en\">Now the sun is laid to sleep,</span></div><div class=\"u\"><span class=\"en\">Seated in thy silver chair</span></div>", "n": 3, "i": 66, "a": "myth-m11-054", "x": "044aa779"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">State in wonted manner keep</span>:</div><div class=\"u\"><span class=\"en\">Hesperus entreats thy light,</span></div><div class=\"u\"><span class=\"en\">Goddess excellently bright.</span>\"</div><div class=\"u\">الترجمة: \"يا ملكة ويا صيادة، عفيفة وجميلة، / الشمس دلوقتي راحت تنام، / قاعدة على كرسيك الفضي / حافظة مكانك زي عادتك: / نجمة المساء بتستأذن نورك، / يا إلهة شديدة الإشراق.\"</div>", "n": 3, "i": 67, "a": "myth-m11-055", "x": "5a762f6d"}, {"t": "learn", "h": "<div class=\"li\">الشرح: أول سطر فيه تلات صفات في ست كلمات: <span class=\"en\">queen</span> (ملكة)، <span class=\"en\">huntress</span> (صيادة)، <span class=\"en\">chaste</span> (عفيفة). ده تلخيص كامل لأرتميس.</div><div class=\"li\">\"<span class=\"en\">silver chair</span>\" = القمر، عرش فضي في السما.</div><div class=\"li\">و<span class=\"en\">Hesperus</span> هو نجم المساء (كوكب الزهرة)، وبيتوسل للإلهة إنها تطلع. يعني جونسون بيصوّر لحظة غروب الشمس وظهور القمر كأنها تغيير حراسة.</div>", "n": 3, "i": 68, "a": "myth-m11-056", "x": "b4b45d37"}, {"t": "learn", "h": "<div class=\"li\">و\"<span class=\"en\">Cynthia</span>\" في عنوان المسرحية مش القمر بس: هي الملكة إليزابيث الأولى. الملكة كانت بتتسمى كينثيا في البلاط، وجونسون استغل ده.</div><div class=\"li\">وليه ده مهم؟ لأنه بيورينا الاستخدام التاني للأسطورة: مش بس تشبيه شعري، ده مدح سياسي. الشاعر بيقول للملكة: إنتِ الإلهة. والمدح ده كان شغلانة الشاعر في القرن السبعتاشر.</div>", "n": 2, "i": 69, "a": "myth-m11-057", "x": "427cac61"}, {"t": "learn", "h": "<div class=\"u\">8.3 ميلتون، \"<span class=\"en\">Il Penseroso</span>\" (نُشرت في مجموعة <span class=\"en\">Poems</span> سنة 1645)، سطر 59-60:</div><div class=\"u\">\"<span class=\"en\">While Cynthia checks her Dragon yoke,</span></div><div class=\"u\"><span class=\"en\">Gently o're th' accustom'd Oke</span>\"</div><div class=\"u\">الترجمة: \"بينما كينثيا تكبح نير تنينها، / بهدوء فوق البلوطة المعتادة.\"</div>", "n": 4, "i": 70, "a": "myth-m11-058", "x": "8d5fea56"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">While Cynthia _____ her Dragon yoke,</div>", "opts": ["wasting", "checks", "sleep"], "ans": 1, "why": "<span class=\"en\">While Cynthia checks her Dragon yoke,</span>", "i": 71}, {"t": "learn", "h": "<div class=\"li\">الشرح: كينثيا = القمر. والتنين هو التنين اللي بيجر عربة القمر في التقليد القديم. ميلتون بيصوّر مشهد الليل الهادي: القمر بيعدي على الشجرة اللي هو معتاد يعدي عليها كل ليلة.</div><div class=\"li\">وفي نفس القصيدة، سطر 67-68، بيكمّل: \"<span class=\"en\">To behold the wandring Moon,</span> / <span class=\"en\">Riding neer her highest noon</span>\" — \"عشان أشوف القمر التايه، راكب قريب من أعلى نقطة ليه.\"</div>", "n": 2, "i": 72, "a": "myth-m11-059", "x": "4229cc21"}, {"t": "learn", "h": "<div class=\"li\">وملحوظة إملاء مهمة: النص الأصلي فيه \"<span class=\"en\">wandring</span>\" و\"<span class=\"en\">neer</span>\" و\"<span class=\"en\">o're</span>\". دي إملاء القرن السبعتاشر. لما تنقل اقتباس من ميلتون، انقله بإملائه الأصلي، وماتصلحهوش.</div><div class=\"li\">(دي نفس الملحوظة اللي عملناها في فصل أبولو.)</div><div class=\"li\">والمصدر: نص مشروع ميلتون في جامعة دارتموث.</div><div class=\"u\">8.4 ماكولي، \"<span class=\"en\">The Battle of the Lake Regillus</span>\" (من مجموعة <span class=\"en\">Lays of Ancient Rome</span>):</div><div class=\"u\">\"<span class=\"en\">The priest who slew the slayer,</span></div>", "n": 5, "i": 73, "a": "myth-m11-060", "x": "8d949b67"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">And shall himself be slain.</span>\"</div><div class=\"u\">الترجمة: \"الكاهن اللي قتل القاتل، / وهو نفسه هيُقتل.\"</div><div class=\"li\">الشرح: سطرين بس، وفيهم كل حكاية ملك الغابة اللي حكيناها فوق. ماكولي بيلخص الدايرة: العنف بيدور، واللي بيقتل بيبقى هو اللي مستني دوره.</div><div class=\"li\">ودي حاجة حلوة تتعلمها عن الشعر: مش لازم تقول كل حاجة. سطرين كفاية لو اختارتهم صح.</div>", "n": 4, "i": 74, "a": "myth-m11-061", "x": "ba2ef73b"}, {"t": "learn", "h": "<div class=\"lead\">8.5 كيتس، \"<span class=\"en\">Endymion</span>\" (1818):</div><div class=\"u\">\"<span class=\"en\">A thing of beauty is a joy for ever.</span>\"</div><div class=\"u\">الترجمة: \"الحاجة الجميلة فرحة للأبد.\"</div><div class=\"li\">الشرح: القصيدة كلها عن الراعي أنديميون، وإلهة القمر — كيتس بيسميها <span class=\"en\">Cynthia</span> في القصيدة — بتحبه. وأول سطر في القصيدة بقى واحد من أشهر سطور الشعر الإنجليزي كله.</div>", "n": 3, "i": 75, "a": "myth-m11-063", "x": "60c4a161"}, {"t": "learn", "h": "<div class=\"li\">ولاحظ: كيتس كتب 4000 سطر عشان يحكي قصة حب إلهة القمر لراعي نايم. الأسطورة دي عندها طاقة شعرية غريبة.</div><div class=\"u\">8.6 والتر رالي، \"<span class=\"en\">The Ocean to Cynthia</span>\" — الإلهة بقت ملكة.</div><div class=\"li\">رالي كتب قصيدة طويلة عن الملكة إليزابيث الأولى، وسمّاها <span class=\"en\">Cynthia.</span></div>", "n": 3, "i": 76, "a": "myth-m11-064", "x": "b104ec39"}, {"t": "learn", "h": "<div class=\"li\">ما اتنشرتش في حياته، ومفيش نسخة كاملة. اتلاقى جزء منها في مخطوطات هاتفيلد، مكتوب عليه \"الكتاب الحادي والعشرين والأخير من المحيط، إلى كينثيا\".</div><div class=\"li\">وطبعها ج. هانا أول مرة سنة 1870.</div><div class=\"li\">وحتى سبنسر، صاحب \"ملكة الجن\"، بيسموها كينثيا في قصيدته <span class=\"en\">Colin Clout.</span></div>", "n": 3, "i": 77, "a": "myth-m11-065", "x": "bcf10d33"}, {"t": "learn", "h": "<div class=\"li\">الخلاصة: من القرن الستاشر، \"كينثيا\" في الشعر الإنجليزي بقت تعني الملكة إليزابيث. الإلهة خرجت من الأسطورة ودخلت السياسة.</div><div class=\"u\">9<span class=\"em\"><span class=\"em\">️</span></span>⃣ أخطاء شائعة، خد بالك منها <span class=\"em\"><span class=\"em\">⚠️</span></span></div><div class=\"u\">9.1 \"ديانا إلهة الشر\". لأ. هي إلهة حدود. العقاب عندها مش شر، هو نتيجة حتمية لتعدي الحد. والفرق ده هو اللي بيخلي القصص مفهومة، مش مجرد حكايات عن إلهة عصبية.</div>", "n": 3, "i": 78, "a": "myth-m11-066", "x": "87e548d8"}, {"t": "mc", "h": "", "q": "من القرن الـ16، كينثيا (<span class=\"en\">Cynthia</span>) في الشعر الإنجليزي بقت تعني مين؟", "nq": 1, "opts": ["الملكة إليزابيث", "القمر بس", "أبولو"], "ans": 0, "why": "الملكة إليزابيث", "ex": ["صح: الإلهة دخلت السياسة.", "غلط: بقت تعني أكتر من القمر.", "غلط: أبولو أخوها."], "i": 79}, {"t": "learn", "h": "<div class=\"u\">9.2 \"أرتميس = القمر من الأول\". لأ. الربط بالقمر جه متأخر، واتوحّدت مع سيليني بعدين. في هوميروس هي بالأساس إلهة الصيد والوحوش.</div><div class=\"u\">9.3 \"ديانا أفسس = ديانا الرومانية\". لأ. التمثال مختلف تماماً وأقدم بكتير، واليونانيين والرومان نفسهم كانوا مستغربين منه.</div>", "n": 2, "i": 80, "a": "myth-m11-067", "x": "b360e23e"}, {"t": "learn", "h": "<div class=\"u\">9.4 \"الأسطورة نسخة واحدة\". لأ. عدد ولاد نيوبي 12 عند هوميروس و14 عند أوفيد. ومكان ولادة التوأم مختلف عليه (ديلوس وأورتيجيا). وده مش عيب في الأسطورة، ده طبيعتها.</div><div class=\"u\">9.5 \"أرتميس وأبولو توأم يعني شبه بعض\". لأ، هما نقيضين: نهار/ليل، كلام/سكوت، مدينة/غابة، شمس/قمر. والاتنين بيتقابلوا في حاجة واحدة: ديلوس، أمهم، وليتو.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🔟</span></span> كلمات هتقع لك في الشعر <span class=\"em\"><span class=\"em\">📖</span></span></div>", "n": 3, "i": 81, "a": "myth-m11-068", "x": "bbb774a5"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">huntress</span> = صيادة (مؤنث <span class=\"en\">hunter</span>)</div><div class=\"li\"><span class=\"en\">chaste</span> = عفيفة / عذراء</div><div class=\"li\"><span class=\"en\">quiver</span> = جعبة السهام</div><div class=\"li\"><span class=\"en\">bow</span> = قوس</div><div class=\"li\"><span class=\"en\">hind</span> = غزالة</div><div class=\"li\"><span class=\"en\">stag</span> = غزال ذكر</div><div class=\"li\"><span class=\"en\">yoke</span> = نير (اللي بيربط الحيوانات بالعربة)</div><div class=\"li\"><span class=\"en\">orb</span> = جسم سماوي / كرة (بيتقال على القمر والشمس)</div><div class=\"li\"><span class=\"en\">maidenhood</span> = العذرية</div><div class=\"li\"><span class=\"en\">wilderness</span> = البرية</div><div class=\"li\"><span class=\"en\">nymph</span> = حورية</div><div class=\"li\"><span class=\"en\">the chase</span> = الصيد / المطاردة</div><div class=\"li\"><span class=\"en\">silver</span> = فضي (صفة أساسية لأرتميس: قوس فضي، كرسي فضي، سهام فضية)</div>", "n": 13, "i": 82, "a": "myth-m11-069", "x": "cece81c4"}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">the chase</span> ؟", "opts": ["نير (اللي بيربط الحيوانات بالعربة)", "الصيد / المطاردة", "العذرية"], "ans": 1, "why": "the chase = الصيد / المطاردة", "n": 1, "i": 83}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">maidenhood</span> ؟", "opts": ["الصيد / المطاردة", "العذرية", "صيادة (مؤنث hunter)"], "ans": 1, "why": "maidenhood = العذرية", "n": 1, "i": 84}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">huntress</span> ؟", "opts": ["جسم سماوي / كرة (بيتقال على القمر والشمس)", "صيادة (مؤنث hunter)", "البرية"], "ans": 1, "why": "huntress = صيادة (مؤنث hunter)", "n": 1, "i": 85}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">orb</span> ؟", "opts": ["فضي (صفة أساسية لأرتميس: قوس فضي، كرسي فضي، سهام فضية)", "نير (اللي بيربط الحيوانات بالعربة)", "جسم سماوي / كرة (بيتقال على القمر والشمس)"], "ans": 2, "why": "orb = جسم سماوي / كرة (بيتقال على القمر والشمس)", "n": 1, "i": 86}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين أرتميس وأبولو: العلاقة بينهم، والمجالات، وإيه اللي بيرمز له كل واحد في الشعر.", "a": "<div class=\"u\">أرتميس وأبولو توأم، أولاد زيوس وليتو.</div><div class=\"u\">أبولو: الشمس والنور والنبوءة والموسيقى والشعر (وفي معبد دلفي). أرتميس: القمر والبرية والصيد وحماية البنات الصغيرات والولادة، وهي عذراء.</div><div class=\"u\">في الشعر أبولو غالباً بيمثل الإلهام والنظام والنور، وأرتميس (أو ديانا) بتمثل العفة والقمر والحدود والعالم البري.</div><div class=\"u\">الخلاصة: الاتنين نقيضين: هو نهار وكلام وفن، وهي ليل وغابة وسكوت.</div>", "key": "myth-m11:CMP", "n": 1, "i": 87}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 88}];</script>
