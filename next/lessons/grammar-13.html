<script>window.LESSON_ID="grammar-13";window.STEPS=[{"t": "section", "h": "أنواع المجموعات", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في الدرس التلتاشر. في الدرس اللي فات عرفنا إن الكلمات بتتجمع حوالين رأس. النهاردة هنشوف أنواع المجموعات. النوع بيتحدد بنوع الرأس. <span class=\"en\">In simple English</span>: <span class=\"en\">the type of the head gives the type of the phrase</span>.</div>", "n": 1, "i": 1, "a": "grammar-13-001", "x": "58094f54"}, {"t": "mc", "q": "نوع المجموعة بيتحدد بـ:", "opts": ["الرأس", "أول كلمة", "آخر كلمة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the head decides</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 2, "h": ""}, {"t": "section", "h": "المجموعة الاسمية والفعلية", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">noun phrase</span> رأسها اسم. زي <span class=\"en\">the old man</span>، وزي <span class=\"en\">books</span>، وزي <span class=\"en\">my sister</span>. وبتشتغل غالبًا فاعل أو مفعول. <span class=\"en\">In simple English</span>: <span class=\"en\">a noun phrase has a noun as its head</span>. والـ <span class=\"en\">verb phrase</span> رأسها فعل. زي <span class=\"en\">read a book</span>، وزي <span class=\"en\">has been waiting</span>. وبتشتغل كمحمول في الجملة، يعني بتقول إيه اللي حصل. <span class=\"en\">In simple English</span>: <span class=\"en\">a verb phrase has a verb as its head</span>.</div>", "n": 1, "i": 4, "a": "grammar-13-002", "x": "46e4fdc4"}, {"t": "mc", "q": "<span class=\"en\">read the book</span> هي:", "opts": ["<span class=\"en\">verb phrase</span>", "<span class=\"en\">adverb phrase</span>", "<span class=\"en\">adjective phrase</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the head is read</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 5, "h": ""}, {"t": "section", "h": "الصفة والظرف", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">adjective phrase</span> رأسها صفة. زي <span class=\"en\">very happy</span>، وزي <span class=\"en\">afraid of dogs</span>. والـ <span class=\"en\">adverb phrase</span> رأسها ظرف. زي <span class=\"en\">very quickly</span>، وزي <span class=\"en\">quite often</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the head is an adjective or an adverb</span>.</div>", "n": 1, "i": 7, "a": "grammar-13-003", "x": "b828f1e8"}, {"t": "mc", "q": "<span class=\"en\">very happy</span> هي:", "opts": ["<span class=\"en\">noun phrase</span>", "<span class=\"en\">adjective phrase</span>", "<span class=\"en\">adverb phrase</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the head is an adjective</span>.", "ex": ["غلط.", "صح: الرأس <span class=\"en\">happy</span>.", "غلط."], "n": 1, "i": 8, "h": ""}, {"t": "section", "h": "حرف الجر", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">prepositional phrase</span> رأسها حرف جر وبعده مجموعة اسمية. زي <span class=\"en\">in the garden</span>، وزي <span class=\"en\">with my friend</span>. ودي ممكن تعدّل اسم أو فعل. <span class=\"en\">The book on the table</span> يعني <span class=\"en\">on the table</span> بتعدّل <span class=\"en\">book</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a preposition plus a noun phrase</span>.</div>", "n": 1, "i": 10, "a": "grammar-13-004", "x": "9e48d39a"}, {"t": "mc", "q": "<span class=\"en\">in the garden</span> هي:", "opts": ["<span class=\"en\">verb phrase</span>", "<span class=\"en\">prepositional phrase</span>", "<span class=\"en\">noun phrase</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a preposition plus a noun phrase</span>.", "ex": ["غلط.", "صح.", "غلط: الرأس <span class=\"en\">in</span>."], "n": 1, "i": 11, "h": ""}, {"t": "section", "h": "المجموعات جوا بعض", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">المجموعات بتتداخل. المجموعة الفعلية <span class=\"en\">read the book on the table</span> فيها مجموعة اسمية، <span class=\"en\">the book on the table</span>. وجواها مجموعة حرف جر، <span class=\"en\">on the table</span>. وجواها كمان مجموعة اسمية تانية، <span class=\"en\">the table</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">phrases can be inside other phrases</span>.</div>", "n": 1, "i": 13, "a": "grammar-13-005", "x": "097e2057"}, {"t": "learn", "h": "<div class=\"u\">الفكرة دي اسمها <span class=\"en\">embedding</span>، أو تداخل. وبتخلي الجملة تكبر من غير حد. <span class=\"en\">In simple English</span>: <span class=\"en\">a phrase can contain another phrase</span>.</div>", "n": 1, "i": 14, "a": "grammar-13-006", "x": "26ed56a4"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">الشكل: رأس من نوع معين، وحواليه كلمات. الوظيفة: كل نوع بيشتغل وظيفة، زي فاعل أو محمول أو وصف. المعنى: المجموعة بتدّي معنى أكبر من رأسها. والاستعمال: بنختار نوع المجموعة حسب اللي عايزين نقوله.</div>", "n": 1, "i": 16, "a": "grammar-13-007", "x": "176a6257"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">فيه فرق بين النوع والوظيفة. النوع هو شكل المجموعة، زي <span class=\"en\">noun phrase</span>. والوظيفة هي دورها في الجملة، زي <span class=\"en\">subject</span>. نفس النوع ممكن يشتغل بوظايف مختلفة. <span class=\"en\">In simple English</span>: <span class=\"en\">the type is what it is</span>, <span class=\"en\">and the function is what it does</span>.</div>", "n": 1, "i": 18, "a": "grammar-13-008", "x": "080cec30"}, {"t": "tf", "q": "النوع والوظيفة نفس الحاجة.", "ans": false, "why": "غلط.", "ex": ["غلط: النوع شكل والوظيفة دور.", "صح، الجملة غلط."], "n": 1, "i": 19, "h": ""}, {"t": "learn", "h": "<div class=\"u\">وفيه تحليل أحدث بيقول إن كل مجموعة لها بنية داخلية ثابتة. الرأس بيتحط مع المكمّل، وبعدين مع المعدّل. ودي اسمها <span class=\"en\">X-bar theory</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">every phrase has the same inside structure</span>.</div>", "n": 1, "i": 20, "a": "grammar-13-009", "x": "dc06eab8"}, {"t": "learn", "h": "<div class=\"u\">وفي العربية فيه الجملة الاسمية والجملة الفعلية، لكن ده تقسيم للجملة مش للمجموعة. فالمقارنة محتاجة حذر. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic uses these words for sentences</span>, <span class=\"en\">not for phrases</span>.</div>", "n": 1, "i": 21, "a": "grammar-13-010", "x": "8685827a"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس. <span class=\"en\">Noun phrase</span>: مجموعة اسمية. <span class=\"en\">In simple English</span>: <span class=\"en\">head is a noun</span>. <span class=\"en\">Verb phrase</span>: مجموعة فعلية. <span class=\"en\">In simple English</span>: <span class=\"en\">head is a verb</span>. <span class=\"en\">Adjective phrase</span>: مجموعة صفة. <span class=\"en\">Adverb phrase</span>: مجموعة ظرف.</div>", "n": 1, "i": 23, "a": "grammar-13-011", "x": "1e637723"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Prepositional phrase</span>: مجموعة حرف جر. <span class=\"en\">Embedding</span>: التداخل. <span class=\"en\">Category</span>: النوع. <span class=\"en\">Function</span>: الوظيفة. <span class=\"en\">X-bar theory</span>: نظرية الـ <span class=\"en\">X-bar</span>. <span class=\"en\">Predicate</span>: المحمول.</div>", "n": 1, "i": 24, "a": "grammar-13-012", "x": "73c602a6"}, {"t": "tf", "q": "المجموعة ممكن تحتوي مجموعة تانية.", "ans": true, "why": "صح: ده <span class=\"en\">embedding</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: نوع المجموعة بيتحدد بنوع رأسها. اتنين: فيه خمس أنواع أساسية، اسمية وفعلية وصفة وظرف وحرف جر. تلاتة: المجموعات بتتداخل جوا بعض. أربعة: النوع غير الوظيفة. <span class=\"en\">In short</span>: <span class=\"en\">the head decides the phrase type</span>. الدرس الجاي: الجملة وأنواعها.</div>", "n": 1, "i": 27, "a": "grammar-13-013", "x": "c7446905"}, {"t": "section", "h": "الكويز", "n": 1, "i": 28}, {"t": "recall", "q": "اذكر ٣ أنواع من المجموعات.", "a": "اسمية وفعلية وصفة وظرف وحرف جر (أي ٣). <span class=\"en\">In simple English</span>: <span class=\"en\">noun</span>, <span class=\"en\">verb</span>, <span class=\"en\">adjective</span>, <span class=\"en\">adverb</span>, <span class=\"en\">preposition</span>.", "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "إيه هو الـ <span class=\"en\">embedding</span>؟", "a": "مجموعة جوا مجموعة تانية، زي <span class=\"en\">the table</span> جوا <span class=\"en\">on the table</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a phrase inside a phrase</span>.", "n": 1, "i": 30, "h": ""}, {"t": "write", "q": "حلل المجموعة <span class=\"en\">the book on the table</span> (٣-٤ جمل).", "key": "grammar-13:1", "a": "المجموعة كلها <span class=\"en\">noun phrase</span> رأسها <span class=\"en\">book</span>. وجواها <span class=\"en\">prepositional phrase</span> هي <span class=\"en\">on the table</span>. وجواها <span class=\"en\">noun phrase</span> تانية هي <span class=\"en\">the table</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">phrases inside phrases</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "اشرح الفرق بين النوع والوظيفة بمثال (٣-٤ جمل).", "key": "grammar-13:2", "a": "النوع هو شكل المجموعة، زي <span class=\"en\">noun phrase</span>. والوظيفة دورها، زي <span class=\"en\">subject</span>. <span class=\"en\">the old man</span> نفس النوع لكن ممكن تكون <span class=\"en\">subject</span> أو <span class=\"en\">object</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">type is form</span>, <span class=\"en\">function is role</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين المجموعة الاسمية والمجموعة الفعلية من حيث الرأس والوظيفة.", "a": "<div class=\"u\">المجموعة الاسمية رأسها اسم، زي <span class=\"en\">the old man</span>، وبتشتغل غالبًا فاعل أو مفعول.</div><div class=\"u\">والفعلية رأسها فعل، زي <span class=\"en\">read a book</span>، وبتشتغل محمول بيقول اللي حصل. الاتنين ممكن يتعدلوا ويتكملوا، لكن الرأس هو اللي بيحدد النوع.</div>", "key": "grammar-13:3", "n": 1, "i": 33}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين تقسيم الجملة في العربية (اسمية وفعلية) وتقسيم المجموعات في الإنجليزي.", "a": "<div class=\"u\">التقسيم العربي بيصنف الجملة كلها حسب أول كلمة فيها، اسم أو فعل.</div><div class=\"u\">أما الإنجليزي فبيصنف المجموعات حسب رأسها، وكل مجموعة ممكن تكون جوا جملة. يعني العربي تقسيم للجملة، والإنجليزي تقسيم للمجموعات الأصغر.</div>", "key": "grammar-13:4", "n": 1, "i": 34}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الجملة وأنواعها.</div><div class=\"u\">هنشوف إزاي المجموعات بتكوّن جملة كاملة.</div>", "extra": "المصادر: Radford (2009); Huddleston and Pullum (2005).", "i": 35}];</script>
