<script>window.LESSON_ID="analysis-07";window.STEPS=[{"t":"learn","h":"<div class=\"u\">فاكرين هيلين؟ شفناها في Leda and the Swan كبنت اتولدت من لحظة عنف، وسبب حرب طروادة. الدرس ده بياخد نفس الست، بس بيحطها تحت نظر اليونان.</div><div class=\"u\">القصيدة: Helen لـ H.D. — قصيرة جدًا، 18 سطر، وكلها عن نظرة الناس.</div>","n":2,"i":0,"a":"analysis-07-001","x":"aa5b29bb"},{"t":"section","h":"H.D. والإيماجزم","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">H.D. هي هيلدا دوليتل <span class=\"en\">(Hilda Doolittle)</span>، 1886-1961، أمريكية عاشت في لندن. من أهم شاعرات الإيماجزم <span class=\"en\">(Imagism)</span>، ونشرت Sea Garden سنة 1916 وHelen in Egypt سنة 1961.</div>","n":1,"i":2,"a":"analysis-07-002","x":"3a27845a"},{"t":"learn","h":"<div class=\"u\">الحكاية ورا هيلين: باريس أخدها من إسبرطة، واليونان حاربوا طروادة عشر سنين عشان يرجّعوها، وفي الطريق مات الآلاف. يعني هي في الوعي اليوناني مش ست، هي سبب كارثة.</div>","n":1,"i":3,"a":"analysis-07-003","x":"30fa8365"},{"t":"learn","h":"<div class=\"u\">الإيماجزم حركة قالت: الصورة نفسها هي القصيدة. معالجة مباشرة للشيء، من غير كلام زايد، ومن غير وزن تقليدي. الشاعر بيعرض، مش بيشرح.</div>","n":1,"i":4,"a":"analysis-07-004","x":"30f5d205"},{"t":"learn","h":"<div class=\"u\">القصيدة دي اتنشرت في مجموعة <span class=\"en\">Heliodora</span> سنة 1924. تلات مقاطع: 5 سطور، وبعدين 6، وبعدين 7 — القصيدة بتتوسع وهي ماشية ناحية النهاية.</div>","n":1,"i":5,"a":"analysis-07-005","x":"3e1c858a"},{"t":"tf","h":"","q":"المقاطع بتزيد سطر بعد سطر (5 ثم 6 ثم 7).","ans":true,"why":"صح: القصيدة بتتوسع وهي ماشية ناحية النهاية، وكأن الضغط بيزيد لحد ما توصل لفكرة الإفناء.","n":1,"i":6,"ex":["صح، الجملة صح: 5 ثم 6 ثم 7 سطور.","غلط. عدّ السطور في المقاطع الثلاثة يوضح الزيادة."]},{"t":"learn","h":"<div class=\"u\">ومفيش قافية ولا وزن منتظم: شعر حر <span class=\"en\">(free verse)</span>. الإيقاع جاي من الصور ومن التكرار، مش من القافية.</div>","n":1,"i":7,"a":"analysis-07-006","x":"5d61eaf2"},{"t":"section","h":"المقطع الأول: الكراهية (<span dir=\"ltr\">1-5</span>)","n":1,"i":8},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-5</span>:</div><div class=\"u\"><span class=\"en\">All Greece hates / the still eyes in the white face, / the lustre as of olives / where she stands, / and the white hands.</span></div>","n":2,"i":9,"a":"analysis-07-007","x":"959e6314"},{"t":"learn","h":"<div class=\"u\">«كل اليونان بتكره» <span class=\"en\">(All Greece hates)</span>. الفاعل هنا مش شخص، هو بلد كامل. القصيدة من أول سطر مش عن هيلين، هي عن نظرة الجماعة ليها.</div>","n":1,"i":10,"a":"analysis-07-008","x":"288b9a14"},{"t":"mc","h":"","q":"«All Greece hates» بيفتح القصيدة بإيه؟","opts":["بنظرة الجماعة لهيلين، مش بشعور هيلين نفسها","بوصف طبيعة اليونان","بحكاية حرب طروادة"],"ans":0,"why":"بنظرة اليونان الجماعية لهيلين.","n":1,"i":11,"ex":["صح: الفاعل جماعي، والقصيدة كلها عن نظرة اليونان ليها كموضوع.","غلط: مفيش وصف طبيعة؛ الصور كلها عن الجسم والنظرة.","غلط: الحرب موجودة كذكرى بس، مش كمشهد."]},{"t":"learn","h":"<div class=\"u\">«العيون الساكنة في الوش الأبيض» — سكون العيون وبياض الوش بيحوّلوها لتمثال <span class=\"en\">(statue)</span>. مش ست بتتنفس، حاجة منحوتة بتتشاف.</div>","n":1,"i":12,"a":"analysis-07-009","x":"b954b49a"},{"t":"learn","h":"<div class=\"u\">«اللمعة زي لمعة الزيتون» <span class=\"en\">(the lustre as of olives)</span>: تشبيه <span class=\"en\">(simile)</span> بيلمع زي الزيت على الجلد، وفي نفس الوقت بيربطها بمنظر اليونان نفسه — الزيتون.</div>","n":1,"i":13,"a":"analysis-07-010","x":"54640d9e"},{"t":"mc","h":"","q":"«the lustre as of olives» بيربط هيلين بإيه؟","opts":["بمنظر اليونان نفسه (الزيتون)","بالبحر","بالذهب"],"ans":0,"why":"بمنظر اليونان وزراعة الزيتون.","n":1,"i":14,"ex":["صح: التشبيه بيلمع زي الزيت، وبيخلي جمالها جزء من الأرض اللي بتكرهها.","غلط: مفيش بحر في القصيدة.","غلط: مفيش دهب؛ اللمعان هنا زي زيت الزيتون."]},{"t":"learn","h":"<div class=\"u\">«والإيدين البيضا»: مرتين «أبيض» في المقطع الأول (الوش والإيدين). الأبيض هنا مش براءة، هو بياض الرخام والبرد والموت.</div>","n":1,"i":15,"a":"analysis-07-011","x":"5be3fece"},{"t":"learn","h":"<div class=\"u\">والأبيض في القصيدة بيتحول في الآخر لرماد أبيض. نفس اللون من أول سطر لآخر سطر: من رخام لرماد، من تمثال لجثة محروقة. القصيدة بتقفل على نفس اللون.</div>","n":1,"i":16,"a":"analysis-07-012","x":"bb2ad2d0"},{"t":"section","h":"المقطع التاني: الاشمئزاز (<span dir=\"ltr\">6-11</span>)","n":1,"i":17},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">6-11</span>:</div><div class=\"u\"><span class=\"en\">All Greece reviles / the wan face when she smiles, / hating it deeper still / when it grows wan and white, / remembering past enchantments / and past ills.</span></div>","n":2,"i":18,"a":"analysis-07-013","x":"2bcebcc5"},{"t":"learn","h":"<div class=\"u\">«كل اليونان بتشمئز» <span class=\"en\">(reviles)</span>: الفعل بقى أقوى من الكراهية. والتكرار <span class=\"en\">(anaphora)</span> في «All Greece» بيربط المقطعين ويوري إن النظرة واحدة ومستمرة.</div>","n":1,"i":19,"a":"analysis-07-014","x":"260d4218"},{"t":"learn","h":"<div class=\"u\">«الوش الشاحب لما بتبتسم» <span class=\"en\">(the wan face when she smiles)</span>: حتى الابتسامة بتتسبب في كراهية أكتر. يعني الجمال نفسه هو المشكلة، مش حاجة عملتها.</div>","n":1,"i":20,"a":"analysis-07-015","x":"55593dc6"},{"t":"learn","h":"<div class=\"u\">«فاكرة تعاويذ قديمة وآلام قديمة» <span class=\"en\">(past enchantments and past ills)</span>: اليونان مش شايفينها هي، شايفين الحرب اللي حصلت بسببها. هي عندهم ذكرى مش إنسانة.</div>","n":1,"i":21,"a":"analysis-07-016","x":"821fdcf5"},{"t":"section","h":"المقطع التالت: الحب المستحيل (<span dir=\"ltr\">12-18</span>)","n":1,"i":22},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">12-18</span>:</div><div class=\"u\"><span class=\"en\">Greece sees, unmoved, / God’s daughter, born of love, / the beauty of cool feet / and slenderest knees, / could love indeed the maid, / only if she were laid, / white ash amid funereal cypresses.</span></div>","n":2,"i":23,"a":"analysis-07-017","x":"cab6661f"},{"t":"learn","h":"<div class=\"u\">«اليونان شايفة، غير متأثرة» <span class=\"en\">(Greece sees, unmoved)</span>. الكلمة ليها معنيين: مش متأثرة عاطفيًا، وحرفيًا مش بتتحرك زي التمثال. هي كمان بقت حجر.</div>","n":1,"i":24,"a":"analysis-07-018","x":"09f6efea"},{"t":"learn","h":"<div class=\"u\">«بنت ربنا، مولودة من حب» <span class=\"en\">(God’s daughter, born of love)</span>: هيلين بنت زيوس وليدا — نفس اللحظة اللي شفناها في الدرس اللي فات. القصيدة بتفكرنا بأصلها الإلهي، وبعدين بتقول إزاي اتعاملت معاها اليونان.</div>","n":1,"i":25,"a":"analysis-07-019","x":"e96cfe2b"},{"t":"learn","h":"<div class=\"u\">«جمال الرجلين الباردين والركب النحيفة» — تاني، الجسم بيتقسم لأجزاء: عيون، وش، إيدين، رجلين، ركب. التقسيم ده هو اللي بيحوّل الإنسانة لحاجة بتتشاف.</div>","n":1,"i":26,"a":"analysis-07-020","x":"2a26c26b"},{"t":"learn","h":"<div class=\"u\">والجملة المفتاحية: «كانت تقدر تحب البنت فعلًا، بس لو كانت ممدّدة ميتة» <span class=\"en\">(could love indeed the maid, only if she were laid)</span>. الحب مشروط بموتها.</div>","n":1,"i":27,"a":"analysis-07-021","x":"bfb92f5d"},{"t":"mc","h":"","q":"«could love indeed the maid, only if she were laid, white ash» معناها إيه؟","opts":["اليونان ما يقدروش يحبوها إلا ميتة","اليونان بيحبوها وهي عايشة","اليونان نسيوها"],"ans":0,"why":"الحب مشروط بموتها وتحولها لرماد.","n":1,"i":28,"ex":["صح: الحب مشروط بالتحول لرماد — يعني الجماعة عايزة تمحي وجودها الحقيقي.","غلط: المقطع كله بيقول العكس؛ الكراهية مستمرة وهي عايشة.","غلط: هم فاكرينها كويس، والذاكرة دي سبب الكراهية."]},{"t":"learn","h":"<div class=\"u\">«رماد أبيض وسط سرو المتوفي» <span class=\"en\">(white ash amid funereal cypresses)</span>: الرماد اللي بيفضل بعد الحرق، والسرو شجرة جنازات في المتوسط. يعني اليونان عايزينها رماد مش ست.</div>","n":1,"i":29,"a":"analysis-07-022","x":"3c097080"},{"t":"learn","h":"<div class=\"u\">وفي تقليد يوناني قديم، هيلين نفسها ما راحتش طروادة أصلًا: اللي راحت كانت شبح <span class=\"en\">(phantom)</span>، وهي كانت مستخبية في مصر. يعني حتى وجودها الحقيقي كان محل خلاف — وده بيمشي مع القصيدة: هي عند اليونان صورة، مش شخص.</div>","n":1,"i":30,"a":"analysis-07-023","x":"0adff70c"},{"t":"learn","h":"<div class=\"u\">ومكانة القصيدة في التقليد: فيه قصايد كتير عن هيلين، وأشهرها <span class=\"en\">To Helen</span> لإدجار آلان بو، اللي بيشوفها «زي تمثال» واقف في نافذة. H.D. بتاخد نفس صورة التمثال، بس بتوري تمنها.</div>","n":1,"i":31,"a":"analysis-07-024","x":"15156081"},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":32},{"t":"learn","h":"<div class=\"u\">الإيماجزم في الممارسة: مفيش شرح ولا خطبة. صور بس — عيون ساكنة، وش أبيض، إيدين، ركب، رماد، سرو. والقارئ هو اللي يستنتج الحكم.</div>","n":1,"i":33,"a":"analysis-07-025","x":"32f0d283"},{"t":"mc","h":"","q":"صورة التمثال (عيون ساكنة، وش أبيض، رجلين باردين) بتعمل إيه؟","opts":["بتحوّل هيلين لحاجة بتتشاف بدل إنسانة","بتوصف منحوتات يونانية قديمة","بتدّي إحساس بالدفء"],"ans":0,"why":"بتحوّلها لموضوع نظر (تمثال) مش إنسانة.","n":1,"i":34,"ex":["صح: التجميد والتبييض والتقسيم لأجزاء بيحولوها لموضوع نظر، مش شخص.","غلط: مفيش إشارة لمنحوتة معينة؛ الصورة مجازية عنها.","غلط: «cool feet» و«white» و«unmoved» كلهم برد وسكون."]},{"t":"tf","h":"","q":"القصيدة بتدافع عن هيلين بخطاب مباشر وبتقول إنها مظلومة.","ans":false,"why":"غلط: مفيش أي خطاب مباشر. القصيدة بتعرض نظرة اليونان ببرود، والقارئ هو اللي يستنتج الظلم من غير ما الشاعرة تقوله.","n":1,"i":35,"ex":["غلط. الشاعرة بتعرض مش بتشرح، والحكم متروك للقارئ.","صح، الجملة غلط: مفيش دفاع صريح، فيه عرض للكراهية."]},{"t":"learn","h":"<div class=\"u\">التكرار <span class=\"en\">(repetition)</span> هو الإيقاع: «All Greece» مرتين، و«white / wan» متكررين. كل تكرار بيزوّد الضغط بدل ما يضيف معلومة.</div>","n":1,"i":36,"a":"analysis-07-026","x":"4def5b6c"},{"t":"learn","h":"<div class=\"u\">البناء: من كراهية، لاشمئزاز، لحب مشروط بالموت. القصيدة مش بتتطور ناحية تفاهم، بتتطور ناحية رغبة في الإفناء.</div>","n":1,"i":37,"a":"analysis-07-027","x":"3618dec9"},{"t":"learn","h":"<div class=\"u\">الموضوعات: الجمال والكراهية، والتضحية بالشخص عشان الجماعة <span class=\"en\">(scapegoat)</span>، وتحويل المرأة لحاجة بتتشاف <span class=\"en\">(objectification)</span>، والتمثال اللي بيقتل صاحبه.</div>","n":1,"i":38,"a":"analysis-07-028","x":"1d4bda91"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":39},{"t":"recall","h":"","q":"اشرح إزاي القصيدة بتحوّل هيلين لتمثال.","a":"القصيدة بتبدأ بالعيون «still eyes» في وش أبيض، وبتضيف «white hands»، وبعدين «cool feet and slenderest knees». يعني الجسم بيتقسم لأجزاء جامدة وباردة، من غير أي حركة أو صوت منها. وكلمة «unmoved» بتوصف اليونان لكن بتنطبق عليها كمان: هي كمان بقت حاجة مش بتتحرك. والنتيجة إن هيلين مالهاش صوت في القصيدة خالص — مش بتتكلم ولا مرة، وكل اللي بنعرفه عنها جاي من نظرة الجماعة. التحويل لتمثال هو نفسه الموضوع: الجماعة بتخلي الجمال حاجة، مش إنسانة.","n":1,"i":40},{"t":"recall","h":"","q":"إيه علاقة القصيدة بالإيماجزم؟","a":"الإيماجزم بيرفض الشرح والكلام الزايد، وبيقول إن الصورة نفسها هي المعنى. وده واضح هنا: مفيش سطر واحد بيقول «اليونان ظلموها» أو «الجمال بيكلف صاحبه». بدل كده في صور دقيقة ومباشرة: عيون ساكنة، وش أبيض، إيدين، ركب، رماد، سرو. الشعر الحر من غير قافية كمان جزء من المدرسة: الإيقاع جاي من التكرار («All Greece») ومن ترتيب الصور، مش من الوزن. القارئ بيكمل المعنى من الصور.","n":1,"i":41},{"t":"write","h":"","q":"حلّل صورة اليونان كجماعة في القصيدة.","key":"analysis-07:1","a":"اليونان في القصيدة مش أفراد، هم كتلة واحدة بتتحرك بفعل واحد: «All Greece hates»، وبعدها «All Greece reviles»، وبعدها «Greece sees, unmoved». التدرج ده مهم: كراهية، اشمئزاز، برود. والجماعة بتتكلم بصيغة الذاكرة: «remembering past enchantments and past ills» — يعني بيحاكموها على نتيجة حرب مش هي اللي قررتها. وفي المقطع الأخير الجماعة بتعترف بأصلها الإلهي «God’s daughter, born of love» وبجمالها، لكن الاعتراف ده مش بيرحمها؛ بيخلي الحكم أقسى لأنهم شايفين الجمال ومصممين يكرهوه. الشرط الأخير «only if she were laid, white ash» بيفضح إن الجماعة عايزة حل نهائي: مش مصالحة، إفناء. فالقصيدة بتصوّر الجماعة كقوة بتحمي نفسها من الجمال بالتخلص منه.","n":1,"i":42},{"t":"write","h":"","q":"قارن بين هيلين عند ييتس في Leda and the Swan وهيلين عند H.D.","key":"analysis-07:2","a":"عند ييتس، هيلين مش موجودة أصلًا كشخصية: هي نتيجة. القصيدة بتحكي اغتصاب ليدا، وبعدين بتقول «And Agamemnon dead» — يعني هيلين بتظهر كسبب في التاريخ، مش كإنسانة عندها مشاعر. الاهتمام عند ييتس بالمصير والتاريخ وبسؤال المعرفة والقوة. عند H.D.، هيلين موجودة لكن من غير صوت: القصيدة كلها عن نظرة اليونان ليها، وعيونها ساكنة وإيدها بيضا وركبها نحيفة، ومفيش ولا كلمة منها. ييتس بياخد اللحظة اللي بتصنع التاريخ، وH.D. بتاخد النتيجة الاجتماعية: إيه اللي بيحصل لست لما تبقى رمز. والاتنين بيستخدموا الأسطورة، بس ييتس بيسأل عن القوة الإلهية، وH.D. بتسأل عن نظر الجماعة. وده فرق بين حداثة ييتس الرمزية وحداثة الإيماجزم اللي بتوقف عند الصورة.","n":1,"i":43},{"t":"end","h":"","teaser":"<div class=\"u\">كده Helen خلصت: بلد كامل بيكره وش أبيض، وجمال مفيش قدامه غير الرماد.</div><div class=\"u\">الدرس الجاي: Stopping by Woods on a Snowy Evening لروبرت فروست — قصيدة بسيطة الشكل، وأسئلتها أعمق مما تبدو.</div>","extra":"المصادر: H. D., “Helen” (Heliodora, 1924)؛ مبادئ الإيماجزم (Imagism) كما صاغها Ezra Pound؛ الأسطورة الإغريقية لهيلين بنت زيوس وليدا.","i":44}];</script>
