<script>window.LESSON_ID="history-18", "history-19", "history-20", "history-21", "history-13", "history-14", "history-15", "history-16", "history-17";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"u\">في الدرس اللي فات شفنا <span class=\"en\">Spenser<\/span> وهو بيعمل ملحمة، وحط فيها إنجلترا كلها. النهاردة بقى هنرجع لحاجة أصغر وأقرب: السونيت. بعد ما <span class=\"en\">Sidney<\/span> نشر <span class=\"en\">Astrophil and Stella<\/span> سنة 1591، إنجلترا كلها اتجننت. في ست سنين تقريباً، طلعت حوالي عشرين سلسلة سونيتات. يعني السونيت بقت موضة، والموضة بقت سوق، والسوق ده طلع منه شوية قصايد جميلة جداً، وشوية قصايد تعبانة، وفن حقيقي.<\/div><div class=\"u\">والدرس ده مختلف، لأننا هنقرا تلات شعرا كبار: <span class=\"en\">Daniel<\/span>، و<span class=\"en\">Drayton<\/span>، و<span class=\"en\">Spenser<\/span>. وكل واحد منهم عمل حاجة مختلفة بالسونيت، وده اللي يوريك إن الشكل الواحد مش بيعمل نفس النتيجة.<\/div>", "n": 2, "a": "history-18-001", "x": "b5626209", "en": "In the last lesson Spenser built an epic. Today we go back to something smaller: the sonnet. After Sidney's Astrophil and Stella (1591) England went sonnet-mad: about twenty sequences in six years. We read three poets: Daniel, Drayton, Spenser.", "i": 1}, {"t": "section", "h": "النقطة 1: الموجة: إزاي سلسلة بقت موضة", "i": 2}, {"t": "learn", "h": "<div class=\"u\">📌 البداية:<\/div><div class=\"li\">سنة 1591، <span class=\"en\">Sidney<\/span> نشر <span class=\"en\">Astrophil and Stella<\/span> (بعد موته)، وفيها 108 سونيت و11 أغنية.<\/div><div class=\"li\">والكتاب ده عمل حاجة ماحدش كان متوقعها: الناس عايزة تعرف مين <span class=\"en\">Stella<\/span>، وعايزة تقرا المزيد.<\/div>", "n": 3, "a": "history-18-002", "x": "e74a09b1", "en": "The wave: 1591, Sidney's Astrophil and Stella appears after his death, with 108 sonnets and 11 songs. Readers want to know who Stella is.", "i": 3}, {"t": "mc", "h": "", "q": "إيه اللي بدأ موجة السونيتات في إنجلترا؟", "nq": 1, "opts": ["نشر <span class=\"en\">Astrophil and Stella<\/span> سنة 1591", "نشر سونيتات <span class=\"en\">Shakespeare<\/span>", "موت <span class=\"en\">Spenser<\/span>"], "ans": 0, "why": "نشر <span class=\"en\">Astrophil and Stella<\/span> سنة 1591", "ex": ["صح: بعده طلعت سلاسل كتير.", "غلط: سونيتات <span class=\"en\">Shakespeare<\/span> طلعت سنة 1609، بعد الموجة.", "غلط: <span class=\"en\">Spenser<\/span> نشر <span class=\"en\">Amoretti<\/span> سنة 1595 وسط الموجة."], "i": 4}, {"t": "learn", "h": "<div class=\"u\">📌 الانفجار:<\/div><div class=\"li\">في 1592: <span class=\"en\">Delia<\/span> بتاعة <span class=\"en\">Samuel Daniel<\/span>، و<span class=\"en\">Diana<\/span> بتاعة <span class=\"en\">Henry Constable<\/span>.<\/div><div class=\"li\">في 1593: <span class=\"en\">Phillis<\/span> بتاعة <span class=\"en\">Thomas Lodge<\/span>، و<span class=\"en\">Parthenophil and Parthenophe<\/span> بتاعة <span class=\"en\">Barnabe Barnes<\/span>.<\/div><div class=\"li\">في 1594: <span class=\"en\">Idea's Mirror<\/span> بتاعة <span class=\"en\">Michael Drayton<\/span>.<\/div><div class=\"li\">في 1595: <span class=\"en\">Amoretti<\/span> بتاعة <span class=\"en\">Spenser<\/span>.<\/div><div class=\"li\">وفي 1609، متأخر: سونيتات <span class=\"en\">Shakespeare<\/span>.<\/div>", "n": 6, "a": "history-18-003", "x": "2a633837", "en": "The burst: Delia (Daniel) and Diana (Constable) in 1592; Phillis (Lodge) and Parthenophil (Barnes) in 1593; Idea's Mirror (Drayton) in 1594; Amoretti (Spenser) in 1595; Shakespeare's sonnets only in 1609.", "i": 5}, {"t": "mc", "h": "", "q": "مين كتب <span class=\"en\">Delia<\/span>؟", "nq": 1, "opts": ["<span class=\"en\">Samuel Daniel<\/span>", "<span class=\"en\">Michael Drayton<\/span>", "<span class=\"en\">Thomas Lodge<\/span>"], "ans": 0, "why": "<span class=\"en\">Samuel Daniel<\/span>", "ex": ["صح: <span class=\"en\">Delia<\/span> طلعت سنة 1592.", "غلط: <span class=\"en\">Drayton<\/span> كتب <span class=\"en\">Idea<\/span>.", "غلط: <span class=\"en\">Lodge<\/span> كتب <span class=\"en\">Phillis<\/span>."], "i": 6}, {"t": "mc", "h": "", "q": "إيه اللي ميّز كتاب <span class=\"en\">Idea<\/span> عند <span class=\"en\">Drayton<\/span>؟", "nq": 1, "opts": ["عدّل فيه طول عمره وغيّر عدد السونيتات", "طلع مرة واحدة بس", "كان نثر مش شعر"], "ans": 0, "why": "عدّل فيه طول عمره وغيّر عدد السونيتات", "ex": ["صح: طبعات 1599 و1600 و1605 و1619.", "غلط: طلع في طبعات كتير.", "غلط: هو سلسلة سونيتات."], "i": 7}, {"t": "learn", "h": "<div class=\"u\">📌 الأرقام:<\/div><div class=\"li\">الدارسين بيقولوا إن في ست سنين تقريباً طلعت حوالي عشرين سلسلة.<\/div><div class=\"li\">وده معناه إن السونيت مكانش شكل شعري، كان \"منتج\". الناشر بيطلبه، والشاعر بيكتبه، والجمهور بيشتريه.<\/div>", "n": 3, "a": "history-18-004", "x": "0ec3314a", "en": "Scholars say about twenty sequences came out in about six years. The sonnet became a product: a publisher asks, a poet writes, the public buys.", "i": 8}, {"t": "tf", "h": "", "q": "الدارسين بيقولوا إن حوالي عشرين سلسلة سونيتات طلعت في ست سنين تقريباً بعد 1591.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: وده بيبين إن السونيت بقت منتج.", "غلط: العدد ده هو اللي بيقولوه، حتى لو تقدير تقريبي."], "i": 9}, {"t": "learn", "h": "<div class=\"u\">📌 ليه الموجة دي؟<\/div><div class=\"li\">لأن السونيت قصير، وسهل يتنشر، ومربح.<\/div><div class=\"li\">ولأنه بيبيع حكاية: مين الست؟ هل هي حقيقية؟ هل الشاعر بيحبها فعلاً؟<\/div><div class=\"li\">والفضول ده هو المحرك. الناس بتشتري الفضول، مش الشعر.<\/div>", "n": 4, "a": "history-18-005", "x": "0ef9abc3", "en": "Why the wave? A sonnet is short, easy to print and profitable, and it sells a story: who is the lady, is she real, does he really love her?", "i": 10}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: زي ما بيحصل في المسلسلات الرمضانية: مسلسل ينجح، فالسنة اللي بعدها تلاقي عشر مسلسلات بنفس الفكرة. بعضها حلو، وبعضها تقليد. والفرق بينهم مش الفكرة، الفرق في التنفيذ. وده بالظبط اللي حصل مع السونيت في التسعينات.<\/div>", "n": 1, "a": "history-18-006", "x": "0c6e9a38", "en": "Everyday example: like Ramadan TV series. One succeeds, next year there are ten copies. The difference is not the idea, it is the execution.", "i": 11}, {"t": "section", "h": "النقطة 2: إيه اللي بيتباع في السلسلة؟", "i": 12}, {"t": "learn", "h": "<div class=\"u\">📌 السلسلة مش مجموعة قصايد:<\/div><div class=\"li\">السلسلة ليها بطل (الشاعر)، وليها ست (باسم)، وليها قصة (بداية، وأزمة، ونهاية).<\/div><div class=\"li\">والقارئ بيقراها بالترتيب، زي ما بيقرا رواية.<\/div>", "n": 3, "a": "history-18-007", "x": "e4ac087f", "en": "A sequence is not a random group of poems: it has a hero (the poet), a lady, and a story with a beginning, a crisis and an ending, read in order like a novel.", "i": 13}, {"t": "learn", "h": "<div class=\"u\">📌 العناصر الثابتة:<\/div><div class=\"li\">الست جميلة وقاسية في نفس الوقت.<\/div><div class=\"li\">الشاعر عاشق ومتعذب ومخلص.<\/div><div class=\"li\">الطبيعة بتشارك: القمر، والنجوم، والبحر، والزهور.<\/div><div class=\"li\">والحب بيدي الشاعر إحساس إنه بيكتب حاجة خالدة.<\/div>", "n": 5, "a": "history-18-008", "x": "8abec767", "en": "The fixed elements: the lady is beautiful and cruel, the poet is a faithful suffering lover, nature takes part, and love makes the poet feel he writes something that lasts.", "i": 14}, {"t": "learn", "h": "<div class=\"u\">📌 والعنصر اللي بيتغير:<\/div><div class=\"li\">النهاية. ودي أهم حاجة، لأنها بتقول لك الشاعر مؤمن بإيه.<\/div><div class=\"li\">في التقليد الإيطالي، النهاية غالباً فشل: الست بترفض، أو بتموت، أو الشاعر بيسيب.<\/div><div class=\"li\">وفي بعض السلاسل الإنجليزية، النهاية مختلفة تماماً، وهنشوفها مع <span class=\"en\">Spenser<\/span>.<\/div>", "n": 4, "a": "history-18-009", "x": "a81ee568", "en": "The element that changes is the ending. In the Italian tradition it is often failure: she refuses, dies, or he leaves. Some English sequences end differently, as Spenser's does.", "i": 15}, {"t": "mc", "h": "", "q": "إيه العنصر اللي بيتغير من سلسلة لسلسلة وبيكشف فلسفة الشاعر؟", "nq": 1, "opts": ["النهاية", "عدد السطور", "القافية"], "ans": 0, "why": "النهاية", "ex": ["صح: النهاية بتقول الشاعر مؤمن بإيه.", "غلط: السونيت دايماً 14 سطر.", "غلط: ده مش أهم عنصر متغير هنا."], "i": 16}, {"t": "learn", "h": "<div class=\"u\">📌 وده اللي يخلي السلسلة اختبار للشاعر:<\/div><div class=\"li\">لو كتبت نفس الحكاية زي ما هي، هتبقى تقليد.<\/div><div class=\"li\">ولو غيّرت في النهاية أو في الشخصية، ممكن تعمل حاجة جديدة.<\/div>", "n": 3, "a": "history-18-010", "x": "aceecd18", "en": "So a sequence tests the poet: repeat the same story and you imitate; change the ending or the character and you may make something new.", "i": 17}, {"t": "section", "h": "النقطة 3: <span class=\"en\">Daniel<\/span> و<span class=\"en\">Delia<\/span>: الحزن اللي بقى موسيقى", "i": 18}, {"t": "learn", "h": "<div class=\"u\">📌 مين <span class=\"en\">Daniel<\/span>؟<\/div><div class=\"li\"><span class=\"en\">Samuel Daniel<\/span>، عاش من 1562 لـ 1619، شاعر ومؤرخ وكاتب مسرحيات.<\/div><div class=\"li\">و<span class=\"en\">Delia<\/span> طلعت سنة 1592، وفيها حوالي 50 سونيت، ومعاها قصيدة طويلة اسمها <span class=\"en\">The Complaint of Rosamond<\/span>.<\/div>", "n": 3, "a": "history-18-011", "x": "bb5c9a03", "en": "Samuel Daniel (1562-1619) was a poet, historian and playwright. Delia (1592) has about 50 sonnets and the long poem The Complaint of Rosamond.", "i": 19}, {"t": "tf", "h": "", "q": "<span class=\"en\">Delia<\/span> فيها حوالي 50 سونيت ومعاها قصيدة <span class=\"en\">The Complaint of Rosamond<\/span>.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح.", "غلط: الاتنين فعلاً في الكتاب."], "i": 20}, {"t": "learn", "h": "<div class=\"u\">📌 والسونيت الأشهر فيها، رقم 45:<\/div><div class=\"u\">\"<span class=\"en\">Care-charmer Sleep, son of the sable Night<\/span>,<\/div><div class=\"u\"><span class=\"en\">Brother to Death, in silent darkness born<\/span>:<\/div><div class=\"u\"><span class=\"en\">Relieve my languish, and restore the light<\/span>,<\/div><div class=\"u\"><span class=\"en\">With dark forgetting of my cares, return<\/span>;<\/div><div class=\"u\"><span class=\"en\">And let the day be time enough to mourn<\/span><\/div><div class=\"u\"><span class=\"en\">The shipwreck of my ill-adventur'd youth<\/span>:<\/div><div class=\"u\"><span class=\"en\">Let waking eyes suffice to wail their scorn<\/span>,<\/div><div class=\"u\"><span class=\"en\">Without the torment of the night's untruth<\/span>.<\/div><div class=\"u\"><span class=\"en\">Cease dreams, th' imagery of our day-desires<\/span>,<\/div><div class=\"u\"><span class=\"en\">To model forth the passions of the morrow<\/span>;<\/div><div class=\"u\"><span class=\"en\">Never let rising sun approve you liars<\/span>,<\/div><div class=\"u\"><span class=\"en\">To add more grief to aggravate my sorrow<\/span>.<\/div><div class=\"u\"><span class=\"en\">Still let me sleep, embracing clouds in vain<\/span>;<\/div><div class=\"u\"><span class=\"en\">And never wake to feel the day's disdain<\/span>.\"<\/div>", "n": 15, "a": "history-18-012", "x": "68b08e77", "en": "Delia sonnet 45, usually numbered so, begins Care-charmer Sleep. The poem is the full sonnet, fourteen lines.", "i": 21}, {"t": "learn", "h": "<div class=\"u\">الترجمة: يا نوم اللي بتهدّي الهم، يا ابن الليل الأسود، وأخو الموت، اللي اتولد في ضلمة ساكتة: خفّف تعبي، ورجّع النور، وارجع لي بالنسيان الأسود لهمومي. وخلّي النهار يكون وقت كافي للحزن على شبابي اللي راح في غرقة غرقانة. وخلّي العيون الصاحية كفاية عشان تنوح على الاحتقار اللي شافته، من غير عذاب كدب الليل. بطلوا يا أحلام، يا صور رغبات النهار، إنكم ترسموا مشاعر بكرة؛ وعمر ما الشمس الطالعة تشهد إنكم كدابين، فمتزيدوش حزني. خلّوني أنام وأنا أحضن سحاب على الفاضي، وعمر ما أصحى أحس باحتقار النهار.<\/div>", "n": 1, "a": "history-18-013", "x": "b5c669a3", "en": "Translation of Daniel's sonnet: the poet begs Sleep, brother of Death, to take away his cares and let him never wake to the day's disdain.", "i": 22}, {"t": "learn", "h": "<div class=\"u\">📌 إيه اللي بيحصل هنا؟<\/div><div class=\"li\">الراجل مش بيدعو النوم عشان يرتاح، هو بيدعوه عشان يهرب.<\/div><div class=\"li\">والنوم هنا شخصية: ابن الليل، وأخو الموت. ودي صورة قوية جداً، وفيها فكرة إن النوم \"موت صغير\".<\/div><div class=\"li\">والنهار هو العدو، لأنه بيصحّي الحقيقة: إن الشباب راح، وإن الحب مش متبادل.<\/div>", "n": 4, "a": "history-18-014", "x": "4759ca37", "en": "What happens: he calls Sleep not to rest but to escape. Sleep is a person, son of Night and brother of Death, a small death. Day is the enemy because it brings the truth: youth is gone and love is not returned.", "i": 23}, {"t": "mc", "h": "", "q": "ليه الشاعر بيدعو النوم في سونيت <span class=\"en\">Daniel<\/span>؟", "nq": 1, "opts": ["عشان يهرب من حزن النهار", "عشان يرتاح بعد شغل", "عشان يحلم بحبيبته"], "ans": 0, "why": "عشان يهرب من حزن النهار", "ex": ["صح: النهار بيصحّي الحقيقة.", "غلط: هو مش بيدعوه للراحة، بيدعوه للهروب.", "غلط: الأحلام هنا هي اللي بيتمنى تبطل."], "i": 24}, {"t": "learn", "h": "<div class=\"u\">📌 والجمال في السونيت:<\/div><div class=\"li\">كل حاجة فيها متوازنة: النوم/النهار، والموت/الحياة، والحلم/الحقيقة.<\/div><div class=\"li\">والسطر الأخير قاسي: \"<span class=\"en\">And never wake to feel the day's disdain<\/span>\"، يعني: وعمر ما أصحى عشان أحس باحتقار النهار.<\/div><div class=\"li\">يعني الأمنية مش السعادة، الأمنية هي النسيان. وده مستوى تاني من الحزن.<\/div>", "n": 4, "a": "history-18-015", "x": "dd575dee", "en": "The beauty: everything is balanced: sleep and day, death and life, dream and reality. The last line is hard: And never wake to feel the day's disdain. The wish is not happiness, it is forgetting.", "i": 25}, {"t": "learn", "h": "<div class=\"u\">📌 ملاحظة مهمة:<\/div><div class=\"li\">الدارسين بيقولوا إن السونيت دي مأخوذة من سونيت فرنسي للشاعر <span class=\"en\">Desportes<\/span>. يعني هي ترجمة/تقليد، مش ابتكار خالص.<\/div><div class=\"li\">وده مش عيب، ده عادي في العصر: الشعرا كانوا بياخدوا من بعض، والمهارة في التنفيذ مش في الفكرة.<\/div>", "n": 3, "a": "history-18-016", "x": "14fa50a8", "en": "Scholars say the poem was taken from a French sonnet by Desportes, so it is a translation or imitation. That was normal then: skill was in the execution, not the idea.", "i": 26}, {"t": "tf", "h": "", "q": "الدارسين بيقولوا إن سونيت <span class=\"en\">Daniel<\/span> مأخوذة من سونيت فرنسي للشاعر <span class=\"en\">Desportes<\/span>.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: وده كان عادي في العصر.", "غلط: ده اللي بيقوله الدارسين."], "i": 27}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: زي واحد عنده مشكلة كبيرة، ومش عايز حد يحلها، هو عايز ينام وخلاص. اللي بيكتبه هنا هو الإحساس ده بالحرف: مش \"أنا حزين\"، لكن \"أنا عايز الضلمة تفضل\".<\/div>", "n": 1, "a": "history-18-017", "x": "6c7eb7f0", "en": "Everyday example: someone with a big problem who does not want it solved, he just wants to sleep. The poem is that feeling: not I am sad, but I want the darkness to stay.", "i": 28}, {"t": "section", "h": "النقطة 4: <span class=\"en\">Drayton<\/span> و<span class=\"en\">Idea<\/span>: الحب اللي بيقوم في آخر لحظة", "i": 29}, {"t": "learn", "h": "<div class=\"u\">📌 مين <span class=\"en\">Drayton<\/span>؟<\/div><div class=\"li\"><span class=\"en\">Michael Drayton<\/span>، عاش من 1563 لـ 1631.<\/div><div class=\"li\">و<span class=\"en\">Idea<\/span> طلعت أول مرة سنة 1594 باسم <span class=\"en\">Idea's Mirror<\/span>، وفضل يعدل فيها طول عمره، وطلع منها طبعات 1599 و1600 و1605 و1619.<\/div><div class=\"li\">وعدد السونيتات اتغير من طبعة لطبعة، لأنه كان بيشيل ويضيف.<\/div>", "n": 4, "a": "history-18-018", "x": "bb50ca66", "en": "Michael Drayton (1563-1631). Idea first came out in 1594 as Idea's Mirror and he kept revising it all his life (editions 1599, 1600, 1605, 1619); the number of sonnets changed.", "i": 30}, {"t": "learn", "h": "<div class=\"u\">📌 والسونيت 61، وهي من أشهر السونيتات في الإنجليزي:<\/div><div class=\"u\">\"<span class=\"en\">Since there's no help, come let us kiss and part<\/span>.<\/div><div class=\"u\"><span class=\"en\">Nay, I have done, you get no more of me<\/span>;<\/div><div class=\"u\"><span class=\"en\">And I am glad, yea glad with all my heart<\/span>,<\/div><div class=\"u\"><span class=\"en\">That thus so cleanly I myself can free<\/span>.<\/div><div class=\"u\"><span class=\"en\">Shake hands for ever, cancel all our vows<\/span>,<\/div><div class=\"u\"><span class=\"en\">And when we meet at any time again<\/span>,<\/div><div class=\"u\"><span class=\"en\">Be it not seen in either of our brows<\/span><\/div><div class=\"u\"><span class=\"en\">That we one jot of former love retain<\/span>.<\/div><div class=\"u\"><span class=\"en\">Now at the last gasp of Love's latest breath<\/span>,<\/div><div class=\"u\"><span class=\"en\">When, his pulse failing, Passion speechless lies<\/span>;<\/div><div class=\"u\"><span class=\"en\">When Faith is kneeling by his bed of death<\/span>,<\/div><div class=\"u\"><span class=\"en\">And Innocence is closing up his eyes--<\/span><\/div><div class=\"u\"><span class=\"en\">Now, if thou wouldst, when all have given him over<\/span>,<\/div><div class=\"u\"><span class=\"en\">From death to life thou might'st him yet recover<\/span>!\"<\/div>", "n": 15, "a": "history-18-019", "x": "e21d2ce0", "en": "Idea sonnet 61, one of the best known in English: Since there's no help, come let us kiss and part.", "i": 31}, {"t": "learn", "h": "<div class=\"u\">الترجمة: بما إن مفيش فايدة، تعالوا نتبوّس ونفترق. لأ، أنا خلصت، مش هتاخدي مني أكتر من كده؛ وأنا مبسوط، أيوه مبسوط بكل قلبي، إني أقدر أحرر نفسي بالطريقة النضيفة دي. نسلم على بعض للأبد، ونلغي كل وعودنا، ولو اتقابلنا تاني في أي وقت، متبانش على جبين حد فينا ذرة من الحب القديم. ودلوقتي، في آخر نفس للحب، لما النبض بيفشل والشغف بيسكت، ولما الإيمان بيركع جنب سرير الموت، والبراءة بتقفل عينيه: دلوقتي، لو عايزة، بعد ما الكل سابه يموت، تقدر ترجّعيه من الموت للحياة!<\/div>", "n": 1, "a": "history-18-020", "x": "00d60f52", "en": "Translation of Drayton's sonnet: since there is no help, let us part; I am glad to be free. But at love's last breath, if you wish, you can bring him back from death to life.", "i": 32}, {"t": "learn", "h": "<div class=\"u\">📌 إيه العبقرية هنا؟<\/div><div class=\"li\">أول 8 سطور: راجل بيقول \"خلصت، وأنا مبسوط، وحررت نفسي\". كل حاجة فيها قسوة وكرامة.<\/div><div class=\"li\">وبعدين، في الستة الأخيرة، بيعمل حاجة غريبة: بيحوّل الحب لمشهد موت. الحب بقى عيان على سرير، والنبض بيفشل، والإيمان بيركع، والبراءة بتقفل عينيه.<\/div><div class=\"li\">وفي آخر سطرين بيفتح باب: لو إنت عايزة، لسه تقدري ترجعيه للحياة.<\/div>", "n": 4, "a": "history-18-021", "x": "e0e1e50a", "en": "The cleverness: the first eight lines say I am finished and glad to be free. The last six turn love into a deathbed scene: pulse failing, Faith kneeling, Innocence closing his eyes. The last two lines open a door.", "i": 33}, {"t": "mc", "h": "", "q": "إيه اللي بتعمله الستة سطور الأخيرة في سونيت 61 عند <span class=\"en\">Drayton<\/span>؟", "nq": 1, "opts": ["بتحوّل الحب لمشهد موت وتفتح باب أمل", "بتقول إن الحب انتهى للأبد بدون أمل", "بتوصف الطبيعة"], "ans": 0, "why": "بتحوّل الحب لمشهد موت وتفتح باب أمل", "ex": ["صح: وفي آخر سطرين بيقول لسه تقدري ترجعيه.", "غلط: السطرين الأخيرين بيفتحوا باب.", "غلط: القصيدة عن الحب مش الطبيعة."], "i": 34}, {"t": "learn", "h": "<div class=\"u\">📌 يعني إيه؟<\/div><div class=\"li\">يعني الراجل مش بيقول \"أنا مش بحبك\". هو بيقول \"الحب بيموت، وإنت اللي بتقدري تنقذيه\".<\/div><div class=\"li\">وده أذكى من الشكوى: هو بيحمّل الست مسؤولية، وبيديها سلطة، وبيخلي الرفض قرار واعي منها.<\/div><div class=\"li\">والسخرية إنه في أول القصيدة قال \"حررت نفسي\"، وفي الآخر بيقول \"لسه تقدري ترجعيني\". يعني الحرية اللي قال عليها كانت كلام.<\/div>", "n": 4, "a": "history-18-022", "x": "a61fbc53", "en": "So he is not saying I do not love you but love is dying and only you can save it. That is cleverer than complaining: he gives her the power. The irony: the freedom he claimed at the start was only talk.", "i": 35}, {"t": "tf", "h": "", "q": "في سونيت 61 الشاعر بيحمّل الست مسؤولية إنقاذ الحب.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: وده أذكى من الشكوى.", "غلط: هو فعلاً بيديها السلطة."], "i": 36}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: زي واحد بيقول لصاحبه \"خلاص، أنا مش زعلان، وأنا مبسوط إننا بعدنا\"، وبعد شوية يقول له: \"بس لو كلمتني، أنا هسامحك\". الرسالة الحقيقية مش في الكلام الأول، الرسالة في الجملة الأخيرة.<\/div>", "n": 1, "a": "history-18-023", "x": "8b94b382", "en": "Everyday example: a friend says I'm not upset, I'm glad we parted, then adds but if you call me I'll forgive you. The real message is the last sentence.", "i": 37}, {"t": "section", "h": "النقطة 5: <span class=\"en\">Spenser<\/span> و<span class=\"en\">Amoretti<\/span>: سلسلة بتنتهي بجواز", "i": 38}, {"t": "learn", "h": "<div class=\"u\">📌 الكتاب:<\/div><div class=\"li\"><span class=\"en\">Amoretti<\/span> طلعت سنة 1595، عند الناشر <span class=\"en\">William Ponsonby<\/span>، ومعاها قصيدة <span class=\"en\">Epithalamion<\/span>، وهي قصيدة جواز.<\/div><div class=\"li\">وفيها حوالي 89 سونيت (بعض المراجع بتقول 88، والعدد بيتحسب حسب الطبعة).<\/div><div class=\"li\">والجواز اللي بتحكيه حصل فعلاً: <span class=\"en\">Spenser<\/span> اتجوز <span class=\"en\">Elizabeth Boyle<\/span> في 11 يونيو 1594.<\/div>", "n": 4, "a": "history-18-024", "x": "cde042d3", "en": "Amoretti came out in 1595 from the printer William Ponsonby, with Epithalamion, a wedding poem. It has about 89 sonnets (some say 88). Spenser really married Elizabeth Boyle on 11 June 1594.", "i": 39}, {"t": "mc", "h": "", "q": "إمتى اتجوز <span class=\"en\">Spenser Elizabeth Boyle<\/span>؟", "nq": 1, "opts": ["11 يونيو 1594", "سنة 1591", "سنة 1609"], "ans": 0, "why": "11 يونيو 1594", "ex": ["صح: والجواز بيتحكي في السلسلة.", "غلط: 1591 سنة <span class=\"en\">Astrophil and Stella<\/span>.", "غلط: 1609 سنة سونيتات <span class=\"en\">Shakespeare<\/span>."], "i": 40}, {"t": "learn", "h": "<div class=\"u\">📌 والابتكار الكبير:<\/div><div class=\"li\">في التقليد الإيطالي، الست بعيدة، أو متجوزة، أو مرفوضة. الحب مستحيل.<\/div><div class=\"li\"><span class=\"en\">Spenser<\/span> كتب سلسلة عن ست متاحة، وحرة، وانتهت بجواز.<\/div><div class=\"li\">ودي حاجة نادرة جداً في السونيت، والدارسين بيعتبروها أهم فرق بينه وبين <span class=\"en\">Sidney<\/span>.<\/div>", "n": 4, "a": "history-18-025", "x": "ee57e2ee", "en": "The big innovation: in the Italian tradition the lady is distant, married or refusing. Spenser wrote about a free woman and ended with marriage. Scholars see this as the main difference from Sidney.", "i": 41}, {"t": "mc", "h": "", "q": "إيه الفرق الكبير بين <span class=\"en\">Amoretti<\/span> وسلاسل <span class=\"en\">Sidney<\/span> و<span class=\"en\">Daniel<\/span>؟", "nq": 1, "opts": ["<span class=\"en\">Amoretti<\/span> بتنتهي بجواز", "<span class=\"en\">Amoretti<\/span> من غير ست", "<span class=\"en\">Amoretti<\/span> مش سونيتات"], "ans": 0, "why": "<span class=\"en\">Amoretti<\/span> بتنتهي بجواز", "ex": ["صح: ست حرة ونهاية بجواز.", "غلط: فيها ست.", "غلط: هي سلسلة سونيتات."], "i": 42}, {"t": "learn", "h": "<div class=\"u\">📌 والتقويم:<\/div><div class=\"li\">فيه دراسة مشهورة بتقول إن الـ89 سونيت مرتبة على تقويم الكنيسة الإنجليزي: كل سونيت مرتبطة بقراءات يوم معين.<\/div><div class=\"li\">والجواز نفسه كان في 11 يونيو 1594.<\/div><div class=\"li\">والسونيت 22 بتوافق أربعاء الرماد، والسونيت 68 بتوافق عيد القيامة، والسونيتات اللي بينهم بيوافقوا أيام الصوم.<\/div><div class=\"li\">⚠️ ودي قراءة علمية مشهورة، لكنها مش إجماع، فخدها كتفسير قوي، مش كحقيقة مطلقة.<\/div>", "n": 5, "a": "history-18-026", "x": "be8b67a4", "en": "The calendar: a well-known study says the sonnets follow the English church calendar (for example sonnet 22 near Ash Wednesday, sonnet 68 at Easter). It is a famous reading, not a consensus, so take it as a strong interpretation.", "i": 43}, {"t": "tf", "h": "", "q": "فكرة إن سونيتات <span class=\"en\">Amoretti<\/span> مرتبة على تقويم الكنيسة إجماع كل الدارسين.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: قراءة مشهورة لكن مش إجماع.", "صح: مش دقيق، هي قراءة دارسين مش إجماع."], "i": 44}, {"t": "learn", "h": "<div class=\"u\">📌 يعني إيه؟<\/div><div class=\"li\">يعني السلسلة مش بس قصة حب، هي كمان \"رحلة روحية\" بتوصل للجواز كعهد.<\/div><div class=\"li\">وفي العصر ده، الجواز في الفكر البروتستانتي مكانش حاجة رومانسية، كان \"عهد\" مقدس.<\/div>", "n": 3, "a": "history-18-027", "x": "79a59f12", "en": "So the sequence is also a spiritual journey ending in marriage as a covenant, which in Protestant thought was sacred, not just romantic.", "i": 45}, {"t": "section", "h": "النقطة 6: <span class=\"en\">Amoretti<\/span> 75: الاسم اللي المية مش بتمحيه", "i": 46}, {"t": "learn", "h": "<div class=\"u\">📌 القصيدة:<\/div><div class=\"u\">\"<span class=\"en\">One day I wrote her name upon the strand<\/span>,<\/div><div class=\"u\"><span class=\"en\">But came the waves and washed it away<\/span>:<\/div><div class=\"u\"><span class=\"en\">Again I wrote it with a second hand<\/span>,<\/div><div class=\"u\"><span class=\"en\">But came the tide, and made my pains his prey<\/span>.<\/div><div class=\"u\">'<span class=\"en\">Vain man<\/span>,' <span class=\"en\">said she<\/span>, '<span class=\"en\">that dost in vain assay<\/span>,<\/div><div class=\"u\"><span class=\"en\">A mortal thing so to immortalize<\/span>;<\/div><div class=\"u\"><span class=\"en\">For I myself shall like to this decay<\/span>,<\/div><div class=\"u\"><span class=\"en\">And eke my name be wiped out likewise.'<\/span><\/div><div class=\"u\">'<span class=\"en\">Not so<\/span>,' (<span class=\"en\">quod I<\/span>) '<span class=\"en\">let baser things devise<\/span><\/div><div class=\"u\"><span class=\"en\">To die in dust, but you shall live by fame<\/span>:<\/div><div class=\"u\"><span class=\"en\">My verse your vertues rare shall eternize<\/span>,<\/div><div class=\"u\"><span class=\"en\">And in the heavens write your glorious name<\/span>:<\/div><div class=\"u\"><span class=\"en\">Where whenas death shall all the world subdue<\/span>,<\/div><div class=\"u\"><span class=\"en\">Our love shall live, and later life renew.'<\/span>\"<\/div>", "n": 15, "a": "history-18-028", "x": "a2a238dd", "en": "Amoretti 75: One day I wrote her name upon the strand. The poem is a full sonnet of fourteen lines.", "i": 47}, {"t": "learn", "h": "<div class=\"u\">الترجمة: يوم، كتبت اسمها على الرمل، فجت الموجة وغسلته. كتبته تاني بإيد تانية، فجت المية والمد خد تعبي غنيمة. فقالت لي: يا راجل فاضي، إنت بتحاول على الفاضي إنك تخلّد حاجة فانية؛ لأني أنا نفسي هذوب زي ده، واسمي كمان هيتشال. فقلت: مش صح. خلّي الحاجات الوضيعة تموت في التراب، أما إنت هتعيشي بالشهرة: شعري هيخلّد فضائلك النادرة، وهيكتب اسمك المجيد في السما. وهناك، لما الموت يخضع العالم كله، حبنا هيعيش، وهيحيي الحياة اللي بعده.<\/div>", "n": 1, "a": "history-18-029", "x": "18730f15", "en": "Translation: he writes her name on the sand, the waves wash it away. She says you cannot make a mortal thing immortal. He answers: my verse will make you live, and our love will live.", "i": 48}, {"t": "learn", "h": "<div class=\"u\">📌 الحوار:<\/div><div class=\"li\">هي بتقول الحقيقة: كل حاجة بتزول، وأنا كمان.<\/div><div class=\"li\">وهو بيرد بحجة الشعر: الشعر بيخلّد.<\/div>", "n": 3, "a": "history-18-030", "x": "22651d42", "en": "The dialogue: she tells the truth, everything passes, and so will I. He answers with the argument of poetry: verse makes things last.", "i": 49}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Amoretti<\/span> 75، هو بيرد على كلامها بإيه؟", "nq": 1, "opts": ["إن شعره هيخلّد اسمها وحبهم", "إن الموج مش هيرجع", "إن الاسم مش مهم"], "ans": 0, "why": "إن شعره هيخلّد اسمها وحبهم", "ex": ["صح: الشعر بيغلب الموت.", "غلط: ده مش رده.", "غلط: هو شايف الاسم مهم."], "i": 50}, {"t": "learn", "h": "<div class=\"u\">📌 وليه دي من أشهر سونيتات السلسلة؟<\/div><div class=\"li\">لأنها بتقول وظيفة الشعر: إنه يغلب الموت.<\/div><div class=\"li\">وفيها تواضع غريب: هو مش بيقول \"أنا عظيم\"، هو بيقول \"شعري هيخلّدك\". يعني الخلود في خدمة الست.<\/div><div class=\"li\">والسطر الأخير بيفتح أفق أكبر: مش بس اسمنا، \"حبنا هيعيش، وهيحيي الحياة اللي بعده\". يعني الحب بقى حاجة بتتوارث.<\/div>", "n": 4, "a": "history-18-031", "x": "694c9318", "en": "Why it is one of the best known in the sequence: it states the job of poetry, to beat death. It is humble: he does not say I am great but my verse will make you last. The last line widens it: our love will live.", "i": 51}, {"t": "learn", "h": "<div class=\"u\">📌 والشكل:<\/div><div class=\"li\">السونيت دي مكتوبة بشكل اسمه \"السونيت السبنسرية\": تلات رباعيات متشابكة، وبعدها بيتين. والقافية <span class=\"en\">ababbcbccdcdee<\/span>.<\/div><div class=\"li\">ولاحظ الفرق: الإيطالي بيفصل التمانية عن الستة، والشكسبيري بيفصل 4+4+4+2، والسبنسري بيلزق الرباعيات ببعض بقافية مشتركة، فبيبقى كأنه سلسلة.<\/div><div class=\"li\">وده مناسب للفكرة: الحب مش قفلة، الحب استمرار.<\/div>", "n": 4, "a": "history-18-032", "x": "2776954c", "en": "The form: the Spenserian sonnet has three linked quatrains and a couplet, rhyming ababbcbccdcdee. Italian separates 8 and 6, Shakespearean is 4+4+4+2, Spenserian links the quatrains like a chain, which suits the idea: love is a continuation.", "i": 52}, {"t": "mc", "h": "", "q": "إيه قافية السونيت السبنسرية؟", "nq": 1, "opts": ["<span class=\"en\">ababbcbccdcdee<\/span>", "<span class=\"en\">abab cdcd efef gg<\/span>", "<span class=\"en\">abbaabba cdecde<\/span>"], "ans": 0, "why": "<span class=\"en\">ababbcbccdcdee<\/span>", "ex": ["صح: الرباعيات متشابكة.", "غلط: دي القافية الشكسبيرية.", "غلط: دي الإيطالية تقريباً."], "i": 53}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: زي واحد بيحفر اسم حبيبته على الشاطئ، والموج بيمحيه، فيقول: طيب أنا هكتبه في حاجة المية متوصلهاش. ودي بالظبط فكرة السونيت: الرمل بيموت، والورق بيعيش.<\/div>", "n": 1, "a": "history-18-033", "x": "37c97fb1", "en": "Everyday example: a man carves his love's name on the beach and the waves erase it. So he writes it where water cannot reach: the sand dies, the paper lives.", "i": 54}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين نهاية <span class=\"en\">Astrophil and Stella<\/span> ونهاية <span class=\"en\">Amoretti<\/span>، وإيه اللي بتقوله كل نهاية عن تقليد السونيت الإنجليزي؟", "a": "<div class=\"u\">الاتنين كتبوا سلاسل سونيتات، والاتنين استخدموا نفس المفردات: الجمال، والقسوة، والشعر اللي بيخلّد. الفرق الحقيقي بينهم في النهاية، والنهاية هي اللي بتكشف فلسفة كل شاعر.<\/div><div class=\"u\"><span class=\"en\">Sidney<\/span> بينهي السلسلة بالفشل: <span class=\"en\">Astrophil<\/span> بيحب <span class=\"en\">Stella<\/span>، وهي متجوزة، وهو بيحاول ويخسر. والسلسلة بتفضل معلقة، والشغف مش بيتحقق. وده مش عيب فني، ده اختيار: التقليد الإيطالي بيبني طاقته على المسافة بين العاشق والمحبوبة، ولما المسافة بتقرب، الحكاية بتخلص. فالسلسلة عند <span class=\"en\">Sidney<\/span> بتعيش على الألم.<\/div><div class=\"u\"><span class=\"en\">Spenser<\/span> بقى عمل العكس: <span class=\"en\">Amoretti<\/span> بتحكي قصة حب لست حرة، والجواز حصل فعلاً في 11 يونيو 1594، والكتاب بينتهي بـ <span class=\"en\">Epithalamion<\/span>، يعني قصيدة جواز. والفكرة مش إن الحب بقى سهل، الفكرة إن الحب في الفكر البروتستانتي عهد، والعهد بيحل الصراع مش بيكمله. والسونيت 75 بتوضح ده: هي بتقول كل حاجة بتزول، وهو بيرد إن الشعر بيخلّد، والسطر الأخير بيقول \"حبنا هيعيش\"، يعني الخلود بقى مشروع مشترك، مش مجرد مدح.<\/div><div class=\"u\">والنتيجة إن الاتنين بيقولوا لنا حاجة عن التقليد: الشكل واحد، لكن النهاية أيديولوجيا. <span class=\"en\">Sidney<\/span> بيستخدم السونيت عشان يحكي عن رغبة مش قابلة للحل، و<span class=\"en\">Spenser<\/span> بيستخدمه عشان يحكي عن رغبة بتوصل لعهد. وعشان كده <span class=\"en\">Amoretti<\/span> بتبان غريبة في التقليد: هي السلسلة اللي بتخلص بفرح.<\/div>", "key": "history-18:W33", "n": 1, "i": 55}, {"t": "section", "h": "النقطة 7: ليه الموجة خلصت؟", "i": 56}, {"t": "learn", "h": "<div class=\"u\">📌 الأسباب:<\/div><div class=\"li\">التكرار: لما كل واحد بيكتب نفس الحكاية، الجمهور بيزهق.<\/div><div class=\"li\">الشكل بقى متوقع: عارف من أول سطر إن الشاعر هيعاني، وإن الست هترفض.<\/div><div class=\"li\">والسخرية: المسرح الإنجليزي بدأ يسخر من العاشق المتعذب، وده قتل الجدية.<\/div><div class=\"li\">والسوق: الناشرين بقوا بينشروا أي حاجة، فالجودة نزلت.<\/div>", "n": 5, "a": "history-18-034", "x": "14d87ef6", "en": "Why did the wave end? Repetition, a predictable form (you know he will suffer and she will refuse), the theatre mocking the suffering lover, and publishers printing anything so quality fell.", "i": 57}, {"t": "tf", "h": "", "q": "من أسباب نهاية الموجة التكرار وإن الشكل بقى متوقع.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح.", "غلط: دي فعلاً من الأسباب."], "i": 58}, {"t": "learn", "h": "<div class=\"u\">📌 ومين كسب في الآخر؟<\/div><div class=\"li\"><span class=\"en\">Sidney<\/span>، لأنه هو اللي فتح الباب.<\/div><div class=\"li\"><span class=\"en\">Spenser<\/span>، لأنه غيّر النهاية.<\/div><div class=\"li\"><span class=\"en\">Shakespeare<\/span>، لأنه جاء متأخر، وكتب حاجة مختلفة: ست غامضة، وشاب وسيم، ومثلث حب، ولغة معقدة.<\/div><div class=\"li\">وده اللي هيبقى موضوع الدرسين الجايين.<\/div>", "n": 5, "a": "history-18-035", "x": "fb9aa5ae", "en": "Who won in the end? Sidney, who opened the door. Spenser, who changed the ending. Shakespeare, who came late and wrote something different: a mysterious lady, a handsome young man, a triangle, complex language.", "i": 59}, {"t": "learn", "h": "<div class=\"u\">📌 الدرس:<\/div><div class=\"li\">الموجة مش عيب. الموجة بتعمل أرضية، وبعدها بيطلع واحد عظيم بيستخدم الأرضية دي.<\/div><div class=\"li\">والسونيت الإنجليزي، بعد 1591، بقى شكل معروف، وده اللي خلّى <span class=\"en\">Shakespeare<\/span> يقدر يلعب بيه ويقلبه.<\/div>", "n": 3, "a": "history-18-036", "x": "5ba4f7e6", "en": "The lesson: a wave is not a flaw. It builds the ground, and then a great poet uses it. After 1591 the English sonnet was well known, which let Shakespeare play with it and turn it upside down.", "i": 60}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين سونيتات <span class=\"en\">Wyatt<\/span> و<span class=\"en\">Surrey<\/span> المفردة، وبين السلسلة الإليزابيثية: إيه اللي اتغير في الشكل، وفي فكرة \"الكتاب\"؟", "a": "<div class=\"u\">الفرق الأول في الوحدة: <span class=\"en\">Wyatt<\/span> و<span class=\"en\">Surrey<\/span> كتبوا قصايد منفردة. \"<span class=\"en\">Whoso list to hunt<\/span>\" قصيدة كاملة، بتقف لوحدها، ومش محتاجة قصايد تانية حوالينها. أما السلسلة، فوحدتها الكتاب: 108 سونيت عند <span class=\"en\">Sidney<\/span>، و89 عند <span class=\"en\">Spenser<\/span>، وكل سونيت بتاخد معناها من موقعها. سونيت 75 عند <span class=\"en\">Spenser<\/span> مش هتشتغل بنفس القوة لو كانت لوحدها، لأنها بتجي بعد رحلة طويلة.<\/div><div class=\"u\">الفرق التاني في الشكل: <span class=\"en\">Wyatt<\/span> استخدم الثمانية الإيطالية والستة بأشكال مختلفة، و<span class=\"en\">Surrey<\/span> ثبّت <span class=\"en\">abab cdcd efef gg<\/span>. والسلسلة الإليزابيثية وسّعت الخيارات: <span class=\"en\">Spenser<\/span> عمل شكل جديد <span class=\"en\">ababbcbccdcdee<\/span>، وده شكل متشابك، مش مفصول. يعني الشكل نفسه بقى بيقول حاجة: الحب عند <span class=\"en\">Spenser<\/span> مش قفلة، هو استمرار.<\/div><div class=\"u\">الفرق التالت في النشر: <span class=\"en\">Wyatt<\/span> و<span class=\"en\">Surrey<\/span> ما نشروش في حياتهم، وشعرهم اتنشر بعد موتهم في <span class=\"en\">Tottel's Miscellany<\/span> سنة 1557. والسلسلة الإليزابيثية كانت منتج مطبوع، بصفحة عنوان، وإهداء، وناشر، وسوق. وده غيّر علاقة الشاعر بالجمهور: بقى بيكتب لحد بيدفع.<\/div><div class=\"u\">والفرق الرابع في الشخصية: <span class=\"en\">Wyatt<\/span> بيكتب بصوت \"أنا\" بسيط، أما السلسلة فبتبني \"شخصية\"، <span class=\"en\">Astrophil<\/span> أو العاشق المجهول، والقارئ بيتابع الشخصية دي على مدى عشرات القصايد.<\/div><div class=\"u\">فالخلاصة: الاتنين شعر حب، لكن الأول قصيدة، والتاني كتاب. والأول بيقول إحساس، والتاني بيبني عالم.<\/div>", "key": "history-18:W36", "n": 1, "i": 61}, {"t": "end", "h": "", "teaser": "الدرس الجاي: سونيتات <span class=\"en\">Shakespeare<\/span>، 154 سونيت، وشاب وسيم، وست غامضة.", "extra": "", "i": 62}];</script>
