<script>window.LESSON_ID="history-14", "history-15", "history-16", "history-17", "history-18", "history-19", "history-20", "history-21";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">✒️ في الدرس اللي فات عرفنا إن النهضة دخلت إنجلترا بالمطبعة والترجمة والسونيت.</div><div class=\"u\">النهاردة هنتعرف على الراجلين اللي عملوا الحكاية: <span class=\"en\">Thomas Wyatt</span> و<span class=\"en\">Henry Howard</span>، إيرل <span class=\"en\">Surrey</span>.</div>", "n": 2, "a": "history-14-001", "x": "4b29cfce", "en": "In the last lesson we learned that the Renaissance came into England with printing, translation and the sonnet. Today we meet the two men who made it happen: Thomas Wyatt and Henry Howard, Earl of Surrey.", "i": 1}, {"t": "learn", "h": "<div class=\"u\">الاتنين عاشوا في بلاط <span class=\"en\">Henry VIII</span>. واحد منهم مات شاب بالحمى، والتاني اتعدم على التل.</div><div class=\"u\">والاتنين، من غير ما يقصدوا، حددوا شكل الشعر الإنجليزي لقرون.</div>", "n": 2, "a": "history-14-002", "x": "9e7348d0", "en": "Both lived at the court of Henry VIII. One died young of a fever, and the other was executed on the hill. And both, without planning it, set the shape of English poetry for centuries.", "i": 2}, {"t": "section", "h": "النقطة 1: <span class=\"en\">Thomas Wyatt</span>، راجل البلاط اللي كتب شعر حقيقي", "i": 3}, {"t": "learn", "h": "<div class=\"u\">حياة <span class=\"en\">Wyatt</span> (1503 لـ 1542):</div><div class=\"li\">اتولد في قلعة <span class=\"en\">Allington</span> في <span class=\"en\">Kent</span>، وأبوه كان من رجال البلاط القريبين من الملك.</div><div class=\"li\">اتعلم في <span class=\"en\">Cambridge</span>، واتجوز سنة 1520، وخدم في بلاط <span class=\"en\">Henry VIII</span>.</div><div class=\"li\">من حوالي 1527 بقى دبلوماسي، وسافر فرنسا وإيطاليا. وده مهم له كشاعر، لأنه في إيطاليا اتعرف على الشعر الإيطالي والسونيت.</div>", "n": 4, "a": "history-14-003", "x": "62e1655b", "en": "Wyatt's life, 1503 to 1542. He was born in Allington Castle in Kent, and his father was close to the king at court. He studied at Cambridge, married in 1520, and served at the court of Henry VIII. From about 1527 he became a diplomat and travelled to France and Italy. This matters for him as a poet, because in Italy he came to know Italian poetry and the sonnet.", "i": 4}, {"t": "learn", "h": "<div class=\"li\">سنة 1536 اتقبض عليه ودخل برج لندن لفترة قصيرة، في الوقت اللي <span class=\"en\">Anne Boleyn</span>، مراة الملك، اتقبض عليها واتعدمت. خرج ورجع لخدمة الملك. يعني عاش في بلاط أي حاجة فيه ممكن تقتلك.</div><div class=\"li\">مات بالحمى في أكتوبر 1542، وعمره حوالي 39 سنة.</div><div class=\"u\">مثال: موظف كبير في جهاز حكومي، بيكتب شعر بالليل ومش بينشره، وبيبعته لأصحابه بس. عنده موهبة حقيقية وخوف حقيقي. ده <span class=\"en\">Wyatt</span>.</div>", "n": 3, "a": "history-14-004", "x": "62b2c0d4", "en": "In 1536 he was arrested and held for a short time in the Tower of London, at the time Anne Boleyn, the king's wife, was arrested and executed. He came out and went back to the king's service. So he lived in a court where anything could get you killed. He died of a fever in October 1542, at about 39. An example: a senior government employee who writes poetry at night, does not publish it, and sends it only to friends. Real talent and real fear. That is Wyatt.", "i": 5}, {"t": "mc", "h": "", "q": "مين <span class=\"en\">Thomas Wyatt</span>؟", "nq": 1, "opts": ["دبلوماسي في بلاط <span class=\"en\">Henry VIII</span> وأول من كتب سونيتات بالإنجليزية", "ملك إنجلترا", "مترجم الكتاب المقدس"], "ans": 0, "why": "دبلوماسي في بلاط <span class=\"en\">Henry VIII</span> وأول من كتب سونيتات بالإنجليزية", "ex": ["صح: وسافر إيطاليا وشاف السونيت هناك.", "غلط: ده <span class=\"en\">Henry VIII</span>.", "غلط: ده <span class=\"en\">Tyndale</span>."], "i": 6}, {"t": "learn", "h": "<div class=\"u\">شعره مش ناعم، وده سر قوته:</div><div class=\"li\">وزنه كتير بيكون خشن، والإيقاع بيتكسر، والكلام بيبان زي حد بيتكلم وهو متضايق.</div><div class=\"li\">ده في رأي كتير من الدارسين أسلوب مش عيب: هو بيكتب إحساس حقيقي، مش قصيدة مصقولة للعرض.</div><div class=\"li\">واتعتبر أول واحد كتب سونيتات بالإنجليزية.</div>", "n": 4, "a": "history-14-005", "x": "73d30f6f", "en": "His poetry is not smooth, and that is its strength. His rhythm is often rough and broken, and the words sound like someone speaking while upset. Many scholars see this as a style, not a fault: he writes real feeling, not a polished poem for show. He is considered the first person to write sonnets in English.", "i": 7}, {"t": "tf", "h": "", "q": "شعر <span class=\"en\">Wyatt</span> ناعم ومصقول جداً.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: وزنه كتير بيكون خشن وإيقاعه بيتكسر.", "صح: وده أسلوب عند كتير من الدارسين."], "i": 8}, {"t": "section", "h": "النقطة 2: <span class=\"en\">Whoso list to hunt</span>، أشهر سونيت في القرن الـ16", "i": 9}, {"t": "learn", "h": "<div class=\"u\">أول أربع سطور من القصيدة:</div><div class=\"u\">\"<span class=\"en\">Whoso list to hunt, I know where is an hind</span>,</div><div class=\"u\"><span class=\"en\">But as for me, h</span>é<span class=\"en\">las, I may no more</span>.</div><div class=\"u\"><span class=\"en\">The vain travail hath wearied me so sore</span>,</div><div class=\"u\"><span class=\"en\">I am of them that farthest cometh behind</span>.\"</div>", "n": 5, "a": "history-14-006", "x": "b9a1b896", "en": "The first four lines of the poem: Whoso list to hunt, I know where is an hind, but as for me, alas, I may no more. The vain travail hath wearied me so sore, I am of them that farthest cometh behind.", "i": 10}, {"t": "learn", "h": "<div class=\"u\">المعنى: \"اللي عايز يصطاد، أنا عارف الغزالة فين. أما أنا، للأسف، مش قادر أكمل. التعب الفاضي هدّني لدرجة إني بقيت آخر واحد ورا الباقيين.\"</div><div class=\"u\">لاحظ: هو مش بيقول \"أنا بحبها\". هو بيقول \"أنا تعبت\". ودي بداية مختلفة عن شعر الحب اللي قبله.</div>", "n": 2, "a": "history-14-007", "x": "e259680f", "en": "The meaning: whoever wants to hunt, I know where the deer is. But I, sadly, cannot go on. The useless effort has tired me so much that I am now the last one behind the others. Notice: he does not say I love her. He says I am tired. This is a different start from the love poetry before it.", "i": 11}, {"t": "learn", "h": "<div class=\"u\">السطور الأخيرة هي اللي خلت القصيدة مشهورة:</div><div class=\"u\">\"<span class=\"en\">And graven with diamonds in letters plain</span></div><div class=\"u\"><span class=\"en\">There is written, her fair neck round about</span>:</div><div class=\"u\"><span class=\"en\">Noli me tangere, for Caesar's I am</span>,</div><div class=\"u\"><span class=\"en\">And wild for to hold, though I seem tame</span>.\"</div>", "n": 5, "a": "history-14-008", "x": "7ed83a34", "en": "The last lines made the poem famous: And engraved with diamonds in clear letters, around her fair neck, it is written: Noli me tangere, for Caesar's I am, and wild to hold, though I seem tame.", "i": 12}, {"t": "learn", "h": "<div class=\"u\">المعنى: \"ومنقوش بالألماس بحروف واضحة حوالين رقبتها الجميلة: ما تلمسني، أنا بتاعة قيصر. وصعب تمسكني، حتى لو بشبه أليفة.\"</div><div class=\"u\"><span class=\"en\">Noli me tangere</span> لاتيني ومعناها \"ما تلمسني\". و<span class=\"en\">Caesar</span> هنا غالباً معناها السلطة العليا: الغزالة ملك حد أكبر من الصياد.</div>", "n": 2, "a": "history-14-009", "x": "f33a7345", "en": "The meaning: and engraved with diamonds in clear letters around her fair neck: do not touch me, I belong to Caesar. And I am hard to hold, even if I seem tame. 'Noli me tangere' is Latin and means do not touch me. 'Caesar' here most likely means the highest power: the deer belongs to someone greater than the hunter.", "i": 13}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\">Noli me tangere</span>؟", "nq": 1, "opts": ["ما تلمسني", "ارجع تاني", "أنا بحبك"], "ans": 0, "why": "ما تلمسني", "ex": ["صح: وهي لاتيني.", "غلط.", "غلط: القصيدة مش عن الحب المعلن."], "i": 14}, {"t": "learn", "h": "<div class=\"u\">من فين جت الفكرة؟ من سونيت لـ <span class=\"en\">Petrarca</span> عن غزالة بيضا (<span class=\"en\">Rime</span> 190)، فيها غزالة بيضا عليها طوق مكتوب عليه إنها حرة. <span class=\"en\">Wyatt</span> خد الفكرة وحطها في عالم الصيد الإنجليزي، وخلاها قصة عن واحدة \"ملك\" حد تاني.</div><div class=\"u\">وقراء كتير قالوا إن الغزالة هي <span class=\"en\">Anne Boleyn</span> والملك هو <span class=\"en\">Henry</span>. بس ده تفسير مش حقيقة مؤكدة، والقصيدة نفسها أقوى من أي تفسير.</div>", "n": 2, "a": "history-14-010", "x": "1c4a8e43", "en": "Where did the idea come from? From a sonnet by Petrarca about a white deer, Rime 190, where a white deer wears a collar that says she is free. Wyatt took the idea and put it into the English world of hunting, making it a story about a woman who belongs to someone else. Many readers say the deer is Anne Boleyn and the king is Henry. But this is an interpretation, not a proven fact, and the poem is stronger than any interpretation.", "i": 15}, {"t": "tf", "h": "", "q": "تفسير إن الغزالة هي <span class=\"en\">Anne Boleyn</span> حقيقة مؤكدة.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: ده تفسير مش حقيقة مؤكدة.", "صح."], "i": 16}, {"t": "learn", "h": "<div class=\"u\">مثال: واحدة لابسة دبلة، وكل اللي في القهوة عارفين إنها مخطوبة، وواحد لسه بيجري وراها. وفي الآخر يقول لنفسه: \"هي مكتوب عليها اسم حد تاني، وأنا بتعب على الفاضي\". القصيدة دي هي لحظة الاعتراف إنه خسر.</div><div class=\"u\">الشكل: قافية السونيت دي <span class=\"en\">abba abba cddc ee</span>. يعني خد الشكل الإيطالي (8 + 6)، وحط في آخر الـ6 بيتين بقافية مزدوجة (<span class=\"en\">ee</span>). وده بداية الطريق للشكل الإنجليزي.</div>", "n": 2, "a": "history-14-011", "x": "dca16a9a", "en": "An example: a woman wears an engagement ring, everyone in the café knows she is engaged, and one man still runs after her. At the end he tells himself: someone else's name is on her, and I am tiring myself for nothing. This poem is the moment of admitting he lost. The form: the rhyme of this sonnet is abba abba cddc ee. So he took the Italian shape, 8 plus 6, and put a rhyming pair, ee, at the end of the six. This is the start of the road to the English form.", "i": 17}, {"t": "mc", "h": "", "q": "قافية سونيت <span class=\"en\">Wyatt</span> \"<span class=\"en\">Whoso list to hunt</span>\" بتنتهي بإيه؟", "nq": 1, "opts": ["بيتين بقافية مزدوجة <span class=\"en\">ee</span>", "سطر من غير قافية", "كلمة واحدة مكررة"], "ans": 0, "why": "بيتين بقافية مزدوجة <span class=\"en\">ee</span>", "ex": ["صح: <span class=\"en\">abba abba cddc ee</span>.", "غلط.", "غلط."], "i": 18}, {"t": "section", "h": "النقطة 3: <span class=\"en\">They flee from me</span>، قصيدة عن الغدر", "i": 19}, {"t": "learn", "h": "<div class=\"u\">أول سطرين:</div><div class=\"u\">\"<span class=\"en\">They flee from me that sometime did me seek</span></div><div class=\"u\"><span class=\"en\">With naked foot, stalking in my chamber</span>.\"</div>", "n": 3, "a": "history-14-012", "x": "dc59ad80", "en": "The first two lines: They flee from me, those who once sought me, with bare foot, stalking quietly in my room.", "i": 20}, {"t": "learn", "h": "<div class=\"u\">المعنى: \"كانوا بيدوّروا عليا، ودلوقتي بيهربوا مني. كانوا بيدخلوا أوضتي حفاة، بيتحركوا بهدوء.\"</div><div class=\"u\">هو بيشبّه نفسه بصاحب بيت كان بييجي له ناس ويأكلوا من إيده (زي الغزلان)، ودلوقتي بقوا وحوش بتهرب منه.</div>", "n": 2, "a": "history-14-013", "x": "3c366e91", "en": "The meaning: they used to look for me, and now they run away from me. They used to enter my room barefoot, moving softly. He compares himself to a house owner whose visitors used to eat from his hand, like deer, and now they have become wild animals running away from him.", "i": 21}, {"t": "learn", "h": "<div class=\"u\">في النص بيحكي لحظة واحدة بالتفصيل: ست نزل ثوبها من على كتفها وضمّته، وقالت: \"<span class=\"en\">dear heart, how like you this</span>?\" (يا حبيبي، إيه رأيك في ده؟).</div><div class=\"u\">وبعدها بيقول: \"<span class=\"en\">It was no dream</span>: <span class=\"en\">I lay broad waking</span>\" (مكانش حلم، أنا كنت صاحي تماماً).</div><div class=\"u\">وبعدين الحاجة اتقلبت لـ <span class=\"en\">newfangleness</span>، يعني ولع بالجديد وتقلب مزاج.</div>", "n": 3, "a": "history-14-014", "x": "9f3c34cb", "en": "In the middle he tells one moment in detail: a woman let her gown fall from her shoulder and held him, and said: dear heart, how like you this? Then he says: it was no dream, I lay broad awake. Then everything turned into 'newfangleness', which means a love of new things and a changing mood.", "i": 22}, {"t": "learn", "h": "<div class=\"u\">ليه القصيدة عظيمة؟ لأنها مش شكوى بس. فيها سخرية واعتراف، وفي الآخر سؤال:</div><div class=\"u\">\"<span class=\"en\">since that I so kindely am served, I would fain know what she hath deserved</span>.\"</div><div class=\"u\">يعني: \"بما إني اتعاملت بالشكل ده، عايز أعرف هي تستاهل إيه؟\" الراجل بيحول الغدر لسؤال عن العدل.</div>", "n": 3, "a": "history-14-015", "x": "63db9807", "en": "Why is the poem great? Because it is not only a complaint. It has irony and confession, and at the end a question: since I am treated like this, I would like to know what she deserves. In other words, the man turns betrayal into a question about justice.", "i": 23}, {"t": "mc", "h": "", "q": "قصيدة <span class=\"en\">They flee from me</span> بتتكلم عن إيه؟", "nq": 1, "opts": ["ناس كانوا قريبين منه وبقوا يهربوا منه، وغدر وسؤال عن العدل", "معركة بحرية", "رحلة حج"], "ans": 0, "why": "ناس كانوا قريبين منه وبقوا يهربوا منه، وغدر وسؤال عن العدل", "ex": ["صح.", "غلط.", "غلط: ده <span class=\"en\">Chaucer</span>."], "i": 24}, {"t": "section", "h": "النقطة 4: <span class=\"en\">Surrey</span>، النبيل اللي ثبّت الشكل الإنجليزي", "i": 25}, {"t": "learn", "h": "<div class=\"u\">حياة <span class=\"en\">Surrey</span> (حوالي 1517 لـ 1547):</div><div class=\"li\"><span class=\"en\">Henry Howard</span>، إيرل <span class=\"en\">Surrey</span>، ابن دوق <span class=\"en\">Norfolk</span>، من أكبر عائلات إنجلترا.</div><div class=\"li\">اتربى مع <span class=\"en\">Henry FitzRoy</span>، ابن الملك غير الشرعي، وكانوا أصحاب.</div><div class=\"li\">سنة 1537 اتحبس في <span class=\"en\">Windsor</span> بعد ما ضرب واحد من رجال البلاط.</div><div class=\"li\">يوم 19 يناير 1547 اتعدم على <span class=\"en\">Tower Hill</span> بتهمة الخيانة العظمى، وعمره حوالي 30 سنة.</div><div class=\"li\">شعره اتنشر بعد موته.</div>", "n": 6, "a": "history-14-016", "x": "454c4a02", "en": "Surrey's life, about 1517 to 1547. Henry Howard, Earl of Surrey, was the son of the Duke of Norfolk, from one of the greatest families in England. He grew up with Henry FitzRoy, the king's illegitimate son, and they were friends. In 1537 he was held at Windsor after he struck a man of the court. On 19 January 1547 he was executed on Tower Hill for high treason, aged about 30. His poetry was published after his death.", "i": 26}, {"t": "tf", "h": "", "q": "<span class=\"en\">Surrey</span> عاش أطول من <span class=\"en\">Wyatt</span> وكتب شعره وهو شيخ.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: اتعدم وعمره حوالي 30 سنة.", "صح: واتعدم سنة 1547."], "i": 27}, {"t": "learn", "h": "<div class=\"u\">عمل <span class=\"en\">Surrey</span> حاجتين كبار. الأولى: الشكل الإنجليزي للسونيت.</div><div class=\"u\">بدل ما يقسم الـ14 سطر لـ8 و6 زي الإيطالي، قسمهم لـ3 رباعيات وبيتين في الآخر (<span class=\"en\">couplet</span>): <span class=\"en\">abab cdcd efef gg</span>.</div><div class=\"u\">النتيجة: تلات أفكار وبعدها قفلة قوية في آخر بيتين. وده الشكل اللي <span class=\"en\">Shakespeare</span> كتب بيه 154 سونيت، فاتسمى السونيت الشكسبيرية أو الإنجليزية.</div>", "n": 3, "a": "history-14-017", "x": "08f2ee9a", "en": "Surrey did two big things. The first: the English form of the sonnet. Instead of splitting the 14 lines into 8 and 6 like the Italian, he split them into three groups of four lines and a final pair, a couplet: abab cdcd efef gg. The result: three ideas and then a strong closing in the last two lines. This is the form Shakespeare used for his 154 sonnets, so it is called the Shakespearean or English sonnet.", "i": 28}, {"t": "mc", "h": "", "q": "إيه شكل السونيت الإنجليزي اللي ثبّته <span class=\"en\">Surrey</span>؟", "nq": 1, "opts": ["3 رباعيات وبيتين في الآخر: <span class=\"en\">abab cdcd efef gg</span>", "8 سطور و6 سطور", "سطر واحد بس"], "ans": 0, "why": "3 رباعيات وبيتين في الآخر: <span class=\"en\">abab cdcd efef gg</span>", "ex": ["صح: وده شكل سونيتات <span class=\"en\">Shakespeare</span>.", "غلط: ده الشكل الإيطالي.", "غلط."], "i": 29}, {"t": "learn", "h": "<div class=\"u\">مثال من سونيته \"<span class=\"en\">Set me whereas the sun doth parch the green</span>\":</div><div class=\"u\">\"<span class=\"en\">Set me whereas the sun doth parch the green</span></div><div class=\"u\"><span class=\"en\">Or where his beams may not dissolve the ice</span>;</div><div class=\"u\"><span class=\"en\">In temperate heat where he is felt and seen</span>...\"</div><div class=\"u\">المعنى: \"حطّني في مكان الشمس بتحرق فيه العشب، أو مكان أشعتها مش بتسيّح التلج، في حر معتدل...\" وبيكمل يعدد أماكن وأحوال تانية. الفكرة: في أي مكان وأي حال، أنا لها.</div>", "n": 5, "a": "history-14-018", "x": "754feec8", "en": "An example from his sonnet Set me whereas the sun doth parch the green: Set me where the sun burns the grass, or where its rays cannot melt the ice, in a mild heat where it is felt and seen. He goes on to list other places and states. The idea: in any place and any state, I am hers.", "i": 30}, {"t": "learn", "h": "<div class=\"u\">التانية: الوزن المرسل (<span class=\"en\">blank verse</span>).</div><div class=\"u\"><span class=\"en\">Surrey</span> ترجم الكتاب التاني والرابع من الإنيادة (<span class=\"en\">Aeneid</span>) بتاعة فيرجيل (<span class=\"en\">Virgil</span>)، وكتبهم في سطور من 10 مقاطع من غير قافية.</div><div class=\"u\">ده أول استخدام معروف للوزن المرسل في الإنجليزية.</div>", "n": 3, "a": "history-14-019", "x": "64430da8", "en": "The second: blank verse. Surrey translated the second and fourth books of Virgil's Aeneid and wrote them in lines of ten syllables without rhyme. This is the first known use of blank verse in English.", "i": 31}, {"t": "mc", "h": "", "q": "إيه الوزن المرسل (<span class=\"en\">blank verse</span>)؟", "nq": 1, "opts": ["سطور من 10 مقاطع من غير قافية", "قصيدة كلها قافية واحدة", "وزن الأغاني بس"], "ans": 0, "why": "سطور من 10 مقاطع من غير قافية", "ex": ["صح: و<span class=\"en\">Surrey</span> استخدمه في ترجمة الإنيادة.", "غلط.", "غلط."], "i": 32}, {"t": "learn", "h": "<div class=\"u\">وأهميته إنه وزن قريب من الكلام الطبيعي لكنه موزون: سطر طويل من غير قافية، بيسمح بالحوار والوصف الطويل.</div><div class=\"u\"><span class=\"en\">Shakespeare</span> كتب بيه مسرحه، و<span class=\"en\">Milton</span> كتب بيه <span class=\"en\">Paradise Lost</span>. يعني <span class=\"en\">Surrey</span> وهو بيترجم فيرجيل فتح الباب لأعظم أعمال الإنجليزية.</div>", "n": 2, "a": "history-14-020", "x": "f106328a", "en": "Its importance: it is close to natural speech but still measured: a long line without rhyme that allows dialogue and long description. Shakespeare wrote his plays in it and Milton wrote Paradise Lost in it. So Surrey, while translating Virgil, opened the door to some of the greatest works in English.", "i": 33}, {"t": "mc", "h": "", "q": "مين كتب بالوزن المرسل بعد <span class=\"en\">Surrey</span>؟", "nq": 1, "opts": ["<span class=\"en\">Shakespeare</span> و<span class=\"en\">Milton</span>", "<span class=\"en\">Chaucer</span> و<span class=\"en\">Langland</span>", "<span class=\"en\">Beowulf</span>"], "ans": 0, "why": "<span class=\"en\">Shakespeare</span> و<span class=\"en\">Milton</span>", "ex": ["صح: <span class=\"en\">Shakespeare</span> في مسرحه و<span class=\"en\">Milton</span> في <span class=\"en\">Paradise Lost</span>.", "غلط: دول قبله.", "غلط: ده اسم قصيدة."], "i": 34}, {"t": "learn", "h": "<div class=\"u\">تشبيه بسيط:</div><div class=\"li\">السونيت: علبة مقفولة بمقاس ثابت، لازم تحط فيها إحساس كامل.</div><div class=\"li\">الوزن المرسل: زي حد بيتكلم في التليفون بإيقاع. مش أغنية ومش كلام عادي، حاجة بين الاتنين. عشان كده المسرح بيستخدمه: الممثل بيتكلم زي الناس، بس بكلام موزون.</div>", "n": 3, "a": "history-14-021", "x": "b6bc97fe", "en": "A simple comparison. The sonnet is a closed box of fixed size, and you must put a full feeling inside. Blank verse is like someone talking on the phone with a rhythm: not a song and not ordinary talk, something in between. That is why the theatre uses it: the actor speaks like real people, but in measured words.", "i": 35}, {"t": "section", "h": "النقطة 5: الحكاية أعقد من الكتاب المدرسي", "i": 36}, {"t": "learn", "h": "<div class=\"u\">خد بالك من التفصيلة دي، لأنها بتفرق بين طالب بيحفظ وطالب بيفهم.</div><div class=\"u\">الكتاب المدرسي بيقول: \"<span class=\"en\">Wyatt</span> أدخل السونيت، و<span class=\"en\">Surrey</span> اخترع الشكل الإنجليزي\". الحكاية الحقيقية أعقد.</div><div class=\"u\">أولاً: <span class=\"en\">Wyatt</span> نفسه كان بيختم السونيت ببيتين بقافية مزدوجة، فهو قرّب من الشكل الإنجليزي.</div>", "n": 3, "a": "history-14-022", "x": "f69ccd37", "en": "Pay attention to this detail, because it separates a student who memorises from a student who understands. The textbook says: Wyatt brought in the sonnet, and Surrey invented the English form. The real story is more complex. First: Wyatt himself ended his sonnets with a rhyming couplet, so he came close to the English form.", "i": 37}, {"t": "learn", "h": "<div class=\"u\">ثانياً: بحث من جامعة <span class=\"en\">Oxford</span> سنة 2021 لقى إن شاعر اسمه <span class=\"en\">John Metham</span> كتب حوالي 1448-1449، في حكاية شعرية اسمها <span class=\"en\">Amoryus and Cleopes</span>، قصيدة غنائية قافيتها <span class=\"en\">abab cdcd efef gg</span>.</div><div class=\"u\">يعني الشكل ده ظهر قبل <span class=\"en\">Wyatt</span> بأكتر من 70 سنة. والباحثة بتقول إن <span class=\"en\">Metham</span> غالباً مكانش عارف إنه كتب سونيت.</div>", "n": 2, "a": "history-14-023", "x": "0cddefd2", "en": "Second: research from Oxford University in 2021 found that a poet called John Metham, around 1448 to 1449, in a verse story called Amoryus and Cleopes, wrote a lyric with the rhyme abab cdcd efef gg. So this form appeared more than 70 years before Wyatt. The researcher says Metham probably did not know he had written a sonnet.", "i": 38}, {"t": "tf", "h": "", "q": "بحث 2021 لقى قصيدة بقافية <span class=\"en\">abab cdcd efef gg</span> قبل <span class=\"en\">Wyatt</span> بأكتر من 70 سنة.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: للشاعر <span class=\"en\">John Metham</span> حوالي 1448.", "غلط: ده اللي لقاه البحث فعلاً."], "i": 39}, {"t": "learn", "h": "<div class=\"u\">فالأدق نقول: <span class=\"en\">Surrey</span> هو اللي ثبّت الشكل وخلاه الشكل المعتاد، مش بالضرورة أول واحد وصل له.</div><div class=\"u\">الدرس: في تاريخ الأدب، جملة \"أول واحد عمل كذا\" خطيرة. الأحسن تقول: \"أول واحد خلّى كذا يبقى القاعدة\".</div>", "n": 2, "a": "history-14-024", "x": "95aad314", "en": "So it is more exact to say: Surrey is the one who fixed the form and made it the usual form, not necessarily the first to reach it. The lesson: in literary history, the sentence 'the first one to do this' is dangerous. It is better to say: the first one who made this become the rule.", "i": 40}, {"t": "mc", "h": "", "q": "ليه الأدق نقول إن <span class=\"en\">Surrey</span> \"ثبّت\" الشكل بدل \"اخترعه\"؟", "nq": 1, "opts": ["لأن الشكل ظهر قبله وهو خلاه الشكل المعتاد", "لأنه مكانش شاعر", "لأنه كتب بالفرنسي"], "ans": 0, "why": "لأن الشكل ظهر قبله وهو خلاه الشكل المعتاد", "ex": ["صح.", "غلط.", "غلط."], "i": 41}, {"t": "section", "h": "النقطة 6: <span class=\"en\">Tottel's Miscellany</span>، الكتاب اللي خلّد الاتنين", "i": 42}, {"t": "learn", "h": "<div class=\"u\">سنة 1557 الناشر <span class=\"en\">Richard Tottel</span> طبع مجموعة اسمها <span class=\"en\">Songes and Sonettes</span>، واتعرفت بعد كده باسم <span class=\"en\">Tottel's Miscellany</span>.</div><div class=\"u\">المجموعة فيها 271 قصيدة: 96 لـ <span class=\"en\">Wyatt</span> و40 لـ <span class=\"en\">Surrey</span> و40 لـ <span class=\"en\">Nicholas Grimald</span>، والباقي مش معروف مؤلفه.</div><div class=\"u\">وبتتعتبر من أهم الأنطولوجيات الأولى في الشعر الإنجليزي المطبوع.</div>", "n": 3, "a": "history-14-025", "x": "8ff4310a", "en": "In 1557 the publisher Richard Tottel printed a collection called Songes and Sonettes, later known as Tottel's Miscellany. It has 271 poems: 96 by Wyatt, 40 by Surrey, 40 by Nicholas Grimald, and the rest by authors who are not known. It is seen as one of the first important anthologies of printed English poetry.", "i": 43}, {"t": "mc", "h": "", "q": "كام قصيدة ليها <span class=\"en\">Wyatt</span> في <span class=\"en\">Tottel's Miscellany</span>؟", "nq": 1, "opts": ["96", "10", "271 كلها"], "ans": 0, "why": "96", "ex": ["صح: و40 لـ <span class=\"en\">Surrey</span>.", "غلط.", "غلط: 271 هو إجمالي المجموعة."], "i": 44}, {"t": "learn", "h": "<div class=\"u\">ليه ده مهم؟ <span class=\"en\">Wyatt</span> مات 1542 و<span class=\"en\">Surrey</span> اتعدم 1547، والاتنين ما شافوش كتابهم مطبوع.</div><div class=\"u\">الكتاب ده هو اللي خلّى شعرهم يعيش: من مخطوطات في أدراج النبلاء لكتاب في إيد الناس.</div><div class=\"u\">وده اللي اتكلمنا عنه في الدرس اللي فات: الطباعة بتخلي الشاعر يعيش بعد موته.</div>", "n": 3, "a": "history-14-026", "x": "b156fbf7", "en": "Why is it important? Wyatt died in 1542 and Surrey was executed in 1547, and neither saw his poems in print. This book is what kept their poetry alive: from handwritten pages in the drawers of nobles to a book in people's hands. And this is what we talked about in the last lesson: printing lets a poet live after death.", "i": 45}, {"t": "tf", "h": "", "q": "<span class=\"en\">Wyatt</span> و<span class=\"en\">Surrey</span> شافوا <span class=\"en\">Tottel's Miscellany</span> مطبوع في حياتهم.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: اتطبع سنة 1557 بعد موتهم.", "صح: ماتوا قبله."], "i": 46}, {"t": "learn", "h": "<div class=\"u\">والمفارقة: الاتنين كانوا بيكتبوا لمجموعة صغيرة من الأصحاب في البلاط، وبعد موتهم بقوا أساس الشعر الإنجليزي الحديث بفضل كتاب مطبوع.</div><div class=\"u\">يعني الطباعة اللي كانوا بيتجنبوها هي اللي خلّدتهم.</div>", "n": 2, "a": "history-14-027", "x": "b8d9fb74", "en": "And the irony: both wrote for a small group of friends at court, and after their death they became the base of modern English poetry thanks to a printed book. So the printing they avoided is what made them last.", "i": 47}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين دور <span class=\"en\">Wyatt</span> ودور <span class=\"en\">Surrey</span> في إدخال السونيت إنجلترا وتطوير الوزن.", "a": "<div class=\"u\"><span class=\"en\">Wyatt</span> هو اللي ترجم واقتبس السونيت من <span class=\"en\">Petrarch</span> وأدخلها الإنجليزية. سونيتاته غالباً بنت على الشكل الإيطالي: ثمانية بقافية <span class=\"en\">abbaabba</span> وبعدها ستة، وكتير منها بتختم ببيتين مقفيين. وإيقاعه أحياناً بيتعثر.</div><div class=\"u\"><span class=\"en\">Surrey</span> جاء بعده وطوّر الشكل: استخدم أربع رباعيات وبيتين مقفيين (<span class=\"en\">abab cdcd efef gg</span>) وده اللي بقى اسمه الشكل الإنجليزي، وكان أنعم في الوزن. وكمان استخدم الشعر المرسل (<span class=\"en\">blank verse</span>) في ترجمته لأجزاء من <span class=\"en\">Aeneid</span>.</div><div class=\"u\">والاتنين اتنشروا بعد موتهم في <span class=\"en\">Tottel's Miscellany</span> سنة 1557.</div><div class=\"u\">الخلاصة: <span class=\"en\">Wyatt</span> فتح الباب، و<span class=\"en\">Surrey</span> صقل الشكل والوزن.</div>", "key": "history-14:CMP", "n": 1, "i": 48}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"en\">Sir Philip Sidney</span>، الفارس والشاعر والسياسي، و<span class=\"en\">Defense of Poetry</span>، وأول سلسلة سونيتات إنجليزية طويلة.", "extra": "", "i": 49}];</script>
