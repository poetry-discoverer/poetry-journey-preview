<h1>تحليل ١٦: Dover Beach لماثيو أرنولد — بحر بيحمل شك</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">تحليل ١٦ من ٢٢</span><span class="tag"><span class="em">🖋️</span> تحليل القصائد المهمة</span></div>

<script>window.LESSON_ID="analysis-16";window.STEPS=[{"t":"learn","h":"<div class=\"u\">الدرس اللي فات كان فرح خالص. الدرس ده العكس: منظر جميل جدًا، ووراه أزمة إيمان.</div><div class=\"u\">القصيدة: Dover Beach لماثيو أرنولد — أربع مقاطع، ومفيش وزن منتظم ولا طول ثابت للمقطع.</div>","n":2,"i":0,"a":"analysis-16-001","x":"531ef72d"},{"t":"section","h":"السياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">ماثيو أرنولد <span class=\"en\">(Matthew Arnold)</span>، 1822-1888، شاعر وناقد إنجليزي. القصيدة اتنشرت 1867 في <span class=\"en\">New Poems</span>، واتكتبت على الأرجح سنة 1851.</div>","n":1,"i":2,"a":"analysis-16-002","x":"41e43f4f"},{"t":"learn","h":"<div class=\"u\">دوفر <span class=\"en\">(Dover)</span> مدينة على الساحل الإنجليزي، والقنال <span class=\"en\">(the straits)</span> بينها وبين فرنسا. المشهد: ليلة هادية، قمر، ونور على الساحل الفرنسي.</div>","n":1,"i":3,"a":"analysis-16-003","x":"3a577ac1"},{"t":"learn","h":"<div class=\"u\">والقصيدة بتتكلم لشخص: «come to the window» و«Ah, love». يعني فيه مستمع، وده اللي بيخليها مونولوج درامي حميم، مش تأمل لوحده.</div>","n":1,"i":4,"a":"analysis-16-004","x":"febea577"},{"t":"learn","h":"<div class=\"u\">القرن الـ19 كان فيه أزمة إيمان: العلم والداروينية والنقد الديني خلّوا ناس كتير تفقد يقينها. القصيدة دي من أشهر تعبيرات الأزمة دي.</div>","n":1,"i":5,"a":"analysis-16-005","x":"bc543f36"},{"t":"section","h":"المقطع الأول: المنظر (<span dir=\"ltr\">1-14</span>)","n":1,"i":6},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-6</span>:</div><div class=\"u\"><span class=\"en\">The sea is calm tonight. / The tide is full, the moon lies fair / Upon the straits; on the French coast the light / Gleams and is gone; the cliffs of England stand, / Glimmering and vast, out in the tranquil bay. / Come to the window, sweet is the night-air!</span></div>","n":2,"i":7,"a":"analysis-16-006","x":"6e1b3b6b"},{"t":"learn","h":"<div class=\"u\">البداية هادية جدًا: بحر ساكن، مد كامل، قمر على المضيق. ونور الساحل الفرنسي «بيلمع ويروح» — نقطة صغيرة في منظر واسع، وبتحس إنها إشارة مؤقتة.</div>","n":1,"i":8,"a":"analysis-16-007","x":"503aa453"},{"t":"learn","h":"<div class=\"u\">و«تعالى على الشباك، هوا الليل حلو»: القصيدة بتدعو المستمع يشارك. بعد كده الصوت هو اللي هيقلب المشهد.</div>","n":1,"i":9,"a":"analysis-16-008","x":"9b6aa4f7"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">7-14</span>:</div><div class=\"u\"><span class=\"en\">Only, from the long line of spray / Where the sea meets the moon-blanched land, / Listen! you hear the grating roar / Of pebbles which the waves draw back, and fling, / At their return, up the high strand, / Begin, and cease, and then again begin, / With tremulous cadence slow, and bring / The eternal note of sadness in.</span></div>","n":2,"i":10,"a":"analysis-16-009","x":"ec88367c"},{"t":"learn","h":"<div class=\"u\">«بس» <span class=\"en\">(Only)</span> — كلمة تحوّل المشهد. من جمال بصري لصوت: «اسمع!». والحصى بترجع وتتزحلق وتترمي تاني، والحركة متكررة بلا نهاية.</div>","n":1,"i":11,"a":"analysis-16-010","x":"c8a3b878"},{"t":"learn","h":"<div class=\"u\">والصوت ده بيجيب «النغمة الأبدية للحزن» <span class=\"en\">(the eternal note of sadness)</span>. يعني الحزن مش في الشاعر، هو في الصوت نفسه — والشاعر سمعه.</div>","n":1,"i":12,"a":"analysis-16-011","x":"19eee49c"},{"t":"mc","h":"","q":"صوت الحصى في القصيدة بيعمل إيه؟","opts":["بيجيب «النغمة الأبدية للحزن» ويحوّل المنظر لمعنى","بيوصف الطقس","بيزيّن المشهد"],"ans":0,"why":"بيحوّل المنظر لنغمة حزن أبدية.","n":1,"i":13,"ex":["صح: «the grating roar… bring / The eternal note of sadness in».","غلط: مفيش وصف طقس؛ الصوت هو اللي بيهمه.","غلط: الصوت هنا مصدر معنى مش زينة."]},{"t":"section","h":"المقطع التاني: سوفوكليس (<span dir=\"ltr\">15-20</span>)","n":1,"i":14},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">15-20</span>:</div><div class=\"u\"><span class=\"en\">Sophocles long ago / Heard it on the Aegean, and it brought / Into his mind the turbid ebb and flow / Of human misery; we / Find also in the sound a thought, / Hearing it by this distant northern sea.</span></div>","n":2,"i":15,"a":"analysis-16-012","x":"f320afcd"},{"t":"tf","h":"","q":"فيها إشارة لسوفوكليس.","ans":true,"why":"صح: «Sophocles long ago / Heard it on the Aegean» — سمع نفس الصوت على بحر إيجه.","n":1,"i":16,"ex":["صح، الجملة صح: الإحالة واضحة في المقطع التاني.","غلط. الاسم مذكور صريح."]},{"t":"learn","h":"<div class=\"u\">الإحالة <span class=\"en\">(allusion)</span> لسوفوكليس، الشاعر الإغريقي، اللي سمع نفس الصوت على بحر إيجه. يعني الحزن اللي بيسمعه الشاعر مش جديد ولا خاص بيه.</div>","n":1,"i":17,"a":"analysis-16-013","x":"cd7b3099"},{"t":"learn","h":"<div class=\"u\">«مد وجزر عكر للبؤس الإنساني» <span class=\"en\">(turbid ebb and flow)</span>: نفس استعارة البحر، بس مطبقة على الألم البشري. والربط بين «البحر الشمالي البعيد» والبحر الإغريقي بيوسّع التجربة عبر الزمن.</div>","n":1,"i":18,"a":"analysis-16-014","x":"d1ad1f67"},{"t":"section","h":"المقطع التالت: بحر الإيمان (<span dir=\"ltr\">21-28</span>)","n":1,"i":19},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">21-28</span>:</div><div class=\"u\"><span class=\"en\">The Sea of Faith / Was once, too, at the full, and round earth’s shore / Lay like the folds of a bright girdle furled. / But now I only hear / Its melancholy, long, withdrawing roar, / Retreating, to the breath / Of the night-wind, down the vast edges drear / And naked shingles of the world.</span></div>","n":2,"i":20,"a":"analysis-16-015","x":"c99a3175"},{"t":"learn","h":"<div class=\"u\">الاستعارة المركزية: «بحر الإيمان» <span class=\"en\">(The Sea of Faith)</span>. زمان كان مليان وبيلف الأرض زي حزام لامع. دلوقتي بقى صوته الوحيد هو صوت الانسحاب.</div>","n":1,"i":21,"a":"analysis-16-016","x":"779d8b54"},{"t":"mc","h":"","q":"«The Sea of Faith» استعارة لإيه؟","opts":["الإيمان اللي كان مليان وبقى بينسحب","البحر الحقيقي في دوفر","العلم الجديد"],"ans":0,"why":"إيمان بينحسر زي المد.","n":1,"i":22,"ex":["صح: «Was once, too, at the full… But now I only hear / Its melancholy, long, withdrawing roar».","غلط: البحر الحقيقي موجود كمنظر، لكن الاستعارة عن الإيمان.","غلط: العلم موجود كخلفية تاريخية مش كاستعارة."]},{"t":"learn","h":"<div class=\"u\">وصورة الساحل «العرايا» <span class=\"en\">(naked shingles)</span>: لما الميّة تنحسر، الحصى يبان. الإيمان بيسيب وراه أرض جردا، وده اللي بيخلي الفقد محسوس.</div>","n":1,"i":23,"a":"analysis-16-017","x":"2cdbccb8"},{"t":"learn","h":"<div class=\"u\">وكلمة <span class=\"en\">withdrawing</span> بتعمل شغل مزدوج: البحر بينسحب، والإيمان بينسحب، والثقة بتنسحب. استعارة واحدة بتحمل التلاتة.</div>","n":1,"i":24,"a":"analysis-16-018","x":"d3d11f78"},{"t":"section","h":"المقطع الرابع: الخطاب للحب (<span dir=\"ltr\">29-37</span>)","n":1,"i":25},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">29-33</span>:</div><div class=\"u\"><span class=\"en\">Ah, love, let us be true / To one another! for the world, which seems / To lie before us like a land of dreams, / So various, so beautiful, so new,</span></div>","n":2,"i":26,"a":"analysis-16-019","x":"321c4bed"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">34-37</span>:</div><div class=\"u\"><span class=\"en\">Hath really neither joy, nor love, nor light, / Nor certitude, nor peace, nor help for pain; / And we are here as on a darkling plain / Swept with confused alarms of struggle and flight, / Where ignorant armies clash by night.</span></div>","n":2,"i":27,"a":"analysis-16-020","x":"50968c67"},{"t":"mc","h":"","q":"«ignorant armies clash by night» بتشير لإيه؟","opts":["صراع بشري أعمى بلا رؤية ولا هدف","معركة في التاريخ الإنجليزي","الحرب العالمية"],"ans":0,"why":"صراع أعمى في عالم بلا يقين.","n":1,"i":28,"ex":["صح: الصورة بتوصف عالم بلا يقين، وفيه إشارة تاريخية لمعركة ليلية وصفها ثوسيديدس.","غلط: الإشارة تاريخية قديمة، مش إنجليزية حديثة.","غلط: القصيدة أقدم من الحرب العالمية بكتير."]},{"t":"learn","h":"<div class=\"u\">«آه يا حبيبي، خلّينا صادقين مع بعض» — أول حل بيقدمه: الوفاء الشخصي. مش إيمان ديني، لكن وفاء بين اتنين.</div>","n":1,"i":29,"a":"analysis-16-021","x":"c8c699e6"},{"t":"learn","h":"<div class=\"u\">والعالم اللي «بيبان» زي حلم جميل ومتنوع وجديد، الحقيقة فيه إنه «مفيهوش فرح ولا حب ولا نور ولا يقين ولا سلام ولا عزاء للألم».</div>","n":1,"i":30,"a":"analysis-16-022","x":"99c1ec10"},{"t":"learn","h":"<div class=\"u\">النفي المتكرر <span class=\"en\">(anaphora)</span> في «nor… nor… nor» بيفرّغ العالم حاجة حاجة: ست نفيات ورا بعض، وكل واحدة بتشيل عزاء مختلف.</div>","n":1,"i":31,"a":"analysis-16-023","x":"bb03a98e"},{"t":"learn","h":"<div class=\"u\">والصورة الأخيرة: إحنا على سهل مظلم <span class=\"en\">(darkling plain)</span>، وجيوش بتتصادم في الليل وهي مش شايفة. صراع بلا رؤية ولا هدف معلن.</div>","n":1,"i":32,"a":"analysis-16-024","x":"caf1109d"},{"t":"tf","h":"","q":"القصيدة تفاؤلية وبتحتفل بجمال الطبيعة.","ans":false,"why":"غلط: المنظر جميل، لكن القصيدة بتخلص بسهل مظلم وجيوش بتتصادم وعالم بلا فرح ولا يقين.","n":1,"i":33,"ex":["غلط. الجمال في البداية بيتحول لشك وحزن.","صح، الجملة غلط: نبرة القصيدة مأساوية."]},{"t":"learn","h":"<div class=\"u\">و«جيوش جاهلة» <span class=\"en\">(ignorant armies)</span> فيها إشارة تاريخية لمعركة ليلية في الحملة الصقلية اللي وصفها ثوسيديدس، وفيها الجيوش ما كانتش عارفة مين عدوها.</div>","n":1,"i":34,"a":"analysis-16-025","x":"fc694350"},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":35},{"t":"learn","h":"<div class=\"u\">الصوت أساس القصيدة: من منظر بصري لصوت حصى لنغمة حزن لصوت انسحاب. القصيدة بتسمع أكتر ما بتشوف، والحزن بيدخل من السمع.</div>","n":1,"i":36,"a":"analysis-16-026","x":"f01bc022"},{"t":"learn","h":"<div class=\"u\">الاستعارة الممتدة: البحر بيتحول من منظر لبحر إيمان لبحر بؤس. نفس الصورة بتخدم أكتر من معنى، وده سر تماسك القصيدة.</div>","n":1,"i":37,"a":"analysis-16-027","x":"772d4137"},{"t":"learn","h":"<div class=\"u\">البنية: منظر ← صوت ← مقارنة تاريخية ← فقدان إيمان ← طلب شخصي. الحركة من العام للخاص، ومن الجمال لليأس لطلب صغير ممكن.</div>","n":1,"i":38,"a":"analysis-16-028","x":"2b2ca3e0"},{"t":"learn","h":"<div class=\"u\">الموضوعات: أزمة الإيمان في العصر الفيكتوري، والعزلة الإنسانية، والفرق بين المظهر والحقيقة، والحب كآخر مرساة. وبعض القراءات بتشوف إن القصيدة بتقترح إن الوفاء الإنساني بديل جزئي عن اليقين الغايب.</div>","n":1,"i":39,"a":"analysis-16-029","x":"b6431262"},{"t":"mc","h":"","q":"إيه الحل اللي القصيدة بتقترحه في الآخر؟","opts":["الوفاء بين الحبيبين","الرجوع للدين","الهروب من المدينة"],"ans":0,"why":"الوفاء الشخصي بين الاتنين.","n":1,"i":40,"ex":["صح: «Ah, love, let us be true / To one another!» — الوفاء الشخصي هو المرساة الوحيدة.","غلط: القصيدة بتقول إن بحر الإيمان بينسحب.","غلط: مفيش اقتراح هروب مكاني."]},{"t":"section","h":"أسئلة الامتحان","n":1,"i":41},{"t":"recall","h":"","q":"اشرح تطور القصيدة من المنظر للمعنى.","a":"القصيدة بتبدأ بمنظر هادي: بحر ساكن، مد كامل، قمر على المضيق، ونور على الساحل الفرنسي بيلمع ويروح. بعدين كلمة «Only» بتحوّل الاتجاه من البصر للسمع: صوت الحصى اللي بيرجع ويتزحلق، وده بيجيب «النغمة الأبدية للحزن». بعد كده الصوت بياخد بعد تاريخي: سوفوكليس سمعه على بحر إيجه وافتكر بؤس الإنسان. وبعدها الصوت نفسه بقى استعارة: بحر الإيمان اللي كان مليان وبقى بينسحب، وبيسيب ساحل عريان. وآخر خطوة هي الخطاب للحبيب: العالم مش زي ما بيبان، والحل الوحيد وفاء بين اتنين على سهل مظلم.","n":1,"i":42},{"t":"recall","h":"","q":"ليه القصيدة بتخاطب «love» في المقطع الأخير؟","a":"لأن الخطاب الشخصي بيحط الحل في مكان محدد. طول القصيدة كان بيتكلم عن العالم والبشرية والتاريخ، وفي الآخر بيلتفت لشخص واحد: «Ah, love, let us be true / To one another!». ده بيضيّق المسافة من تاريخ كبير لتجربة صغيرة ممكنة. وكمان الخطاب بيخلق شاهد على الأزمة: المستمع بيرى المنظر وبيسمع الصوت مع الشاعر، فاليأس مش مونولوج داخلي. وبعض القراءات بتشوف إن الالتفاتة دي هي اللي بتمنع القصيدة من إنها تبقى نهاية مطلقة، لأنها بتسيب حاجة ممكنة: الصدق بين اتنين.","n":1,"i":43},{"t":"write","h":"","q":"حلّل استعارة بحر الإيمان في القصيدة.","key":"analysis-16:1","a":"الاستعارة بتبني على المشهد الحقيقي: مد كامل، وبعدها جزر. «The Sea of Faith / Was once, too, at the full» — الإيمان زمان كان مليان وبيلف الأرض «like the folds of a bright girdle furled»، صورة حزام لامع، يعني حماية وتحديد للشكل. بعدين الاستعارة بتنقلب: «But now I only hear / Its melancholy, long, withdrawing roar» — الإيمان بقى صوت انسحاب. والتفاصيل بتكمل الصورة: «Retreating… down the vast edges drear / And naked shingles of the world» — الساحل العريان هو اللي بيفضح الفقد. الاستعارة قوية لأنها بتستخدم نفس الحركة الطبيعية (مد وجزر) لوصف حالة ثقافية، وبتخلي فقدان الإيمان محسوس زي حاجة بتتشال من تحت رجلك.","n":1,"i":44},{"t":"write","h":"","q":"ناقش القصيدة كتعبير عن أزمة إيمان في العصر الفيكتوري.","key":"analysis-16:2","a":"القصيدة بتعبّر عن الأزمة من غير خطبة: بتحط المنظر، وبعدين تسمع الصوت، وبعدين تستعير البحر للإيمان. في القرن الـ19، النقد التاريخي للكتاب المقدس ونظريات العلم خلت ناس كتير تحس إن اليقين الديني بينسحب — والقصيدة بتصوّر ده كمد بيتراجع، مش كهجوم على الدين. وكمان بتوسّع التجربة تاريخيًا بسوفوكليس، فبيبقى الحزن جزء من الحالة الإنسانية مش مشكلة شخصية. والنتيجة اللي بتوصلها: العالم «which seems / To lie before us like a land of dreams» لكنه «Hath really neither joy, nor love, nor light, / Nor certitude, nor peace, nor help for pain». البديل اللي بتقترحه مش إيمان جديد، هو وفاء إنساني محدود: «let us be true / To one another». وبعض القراءات بتشوف إن ده موقف شجاع، وبعضها بيشوفه استسلام؛ والقصيدة بتسيب التوتر ده قايم.","n":1,"i":45},{"t":"end","h":"","teaser":"<div class=\"u\">كده Dover Beach خلصت: منظر هادي، صوت حصى، بحر إيمان بينسحب، وسهل مظلم.</div><div class=\"u\">الدرس الجاي: I heard a Fly buzz — when I died لإميلي ديكنسون — موت من جوه الغرفة.</div>","extra":"المصادر: Matthew Arnold, “Dover Beach” (New Poems, 1867)؛ Sophocles؛ Thucydides عن المعركة الليلية في الحملة الصقلية؛ مصطلحات: extended metaphor, allusion, anaphora.","i":46}];</script>
