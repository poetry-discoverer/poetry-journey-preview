<script>window.LESSON_ID="grammar-01";window.STEPS=[{"t":"learn","h":"<div class=\"u\">أهلًا بيك. إحنا هنبدأ من الأول خالص، من الصفر، ومش هنفترض إنك عارف حاجة. الدرس الأول ده مش درس قواعد عادي، ده درس \"إيه هي القواعد أصلًا\". ولو حسيت إنه سهل زيادة في الأول، استحمل، لأن آخر الدرس بيروح لمكان تاني خالص. خليني أبدأ بسؤال: إنت ليه بتفهم إنجليزي؟ مش عشان حفظت كلمات. عشان عندك نظام في دماغك. الدرس ده كله عن النظام ده.</div>","n":1,"i":0,"a":"grammar-01-001","x":"3a6376fd"},{"t":"learn","h":"<div class=\"u\">خد الجملتين دول. الأولى: <span class=\"en\">The cat ate the fish</span>. التانية: <span class=\"en\">The fish ate the cat</span>. نفس الكلمات بالظبط، أربع كلمات، نفس الحروف. بس الأولى معناها قطة أكلت سمكة، والتانية سمكة أكلت قطة. إيه اللي غيّر المعنى؟ مفيش كلمة اتغيرت. اللي اتغير هو الترتيب.</div>","n":1,"i":1,"a":"grammar-01-002","x":"d8984098"},{"t":"mc","q":"ليه جملة <span class=\"en\">The cat ate the fish</span> معناها مختلف عن <span class=\"en\">The fish ate the cat</span>؟","opts":["اتغيّرت كلمة","اتغيّر الترتيب","اتغيّر حرف جر"],"ans":1,"why":"الكلمات نفسها، والترتيب هو اللي غيّر المعنى.","ex":["غلط: مفيش كلمة اتغيّرت، الجملتين فيهم نفس الكلمات.","صح: الترتيب هو القواعد هنا، وهو اللي بيحدد مين الفاعل.","غلط: مفيش حرف جر في الجملتين أصلًا."],"n":1,"i":2,"h":""},{"t":"learn","h":"<div class=\"u\">الترتيب ده هو القواعد. ولاحظ حاجة: إنت مش محتاج تفكر. لما تقرا <span class=\"en\">the fish ate the cat</span>، دماغك بتعمل شغل في نص ثانية، وبتقول لك: السمكة هي اللي أكلت. مفيش تفكير واعي. ده معناه إن النظام ده متركب فيك، مش محفوظ في ورق.</div>","n":1,"i":3,"a":"grammar-01-003","x":"4ed2551b"},{"t":"learn","h":"<div class=\"u\">تعالى نزود حاجة. في العربي، الترتيب مرن أكتر. تقدر تقول \"أكل الولد التفاحة\"، وتقدر تقول \"التفاحة أكلها الولد\"، والمعنى قريب. في الإنجليزي الترتيب أشد. لو قلت <span class=\"en\">The apple ate the boy</span>، إنت مش بتعمل حاجة شاعرية، إنت بتعمل جملة معناها إن التفاحة أكلت الولد.</div>","n":1,"i":4,"a":"grammar-01-004","x":"76726245"},{"t":"learn","h":"<div class=\"u\">عشان كده الإنجليزي بيعتمد على الترتيب أكتر من العربي، وده هيرجع معانا لاحقًا لما نتكلم عن أخطاء متعلمي الإنجليزي العرب. دلوقتي خد الجملة دي: \"القطة الشطرنجية شربت قهوة باردة\". غالبًا عمرك ما سمعت الجملة دي قبل كده، ومع كده فهمتها فورًا. بلاش، إنت كمان ممكن تتصورها، قطة بتلعب شطرنج وبتشرب قهوة.</div>","n":1,"i":5,"a":"grammar-01-005","x":"3711d593"},{"t":"learn","h":"<div class=\"u\">ليه فهمتها؟ لأنك مش عندك قائمة جمل محفوظة في دماغك. عندك نظام بيبني جمل جديدة. النظام ده هو اللي بنسميه القواعد. وفي سطر واحد: القواعد هي النظام اللي في دماغك اللي بيخليك تبني جمل وتفهم جمل جديدة.</div>","n":1,"i":6,"a":"grammar-01-006","x":"16a7f7c0"},{"t":"section","h":"قواعد بتأمر وقواعد بتصف","n":1,"i":7},{"t":"learn","h":"<div class=\"u\">طيب لو القواعد نظام في الدماغ، ليه في المدرسة بتيجي على شكل أوامر؟ \"متقولش كذا\"، \"اكتب كذا\". هنا بندخل أول مصطلحين، وهما مهمين جدًا وهتسمعهم طول دراستك. المصطلح الأول: <span class=\"en\">prescriptive grammar</span>، القواعد المعيارية. دي قواعد بتأمر وتنهى. زي: متبدأش جملة بـ <span class=\"en\">And</span>. متفرقش الفعل المركب. دي قواعد التصحيح والامتحان.</div>","n":1,"i":8,"a":"grammar-01-007","x":"8cd18d0c"},{"t":"learn","h":"<div class=\"u\">المصطلح التاني: <span class=\"en\">descriptive grammar</span>، القواعد الوصفية. دي قواعد بتحكي الواقع، الناس بتتكلم إزاي فعلاً، من غير ما تحكم. دي شغل اللساني. خد مثال يوضح الفرق. جملتين: <span class=\"en\">Who did you talk to</span>? و <span class=\"en\">To whom did you talk</span>?</div>","n":1,"i":9,"a":"grammar-01-008","x":"09c4c2bf"},{"t":"mc","q":"القواعد الوصفية (<span class=\"en\">descriptive grammar</span>) بتعمل إيه؟","opts":["بتأمر وتنهى","بتحكي إزاي الناس بتتكلم فعلًا","بتمنع الأخطاء في الامتحان"],"ans":1,"why":"الوصفية بترصد الاستعمال الحقيقي من غير أحكام.","ex":["غلط: ده شغل القواعد المعيارية (<span class=\"en\">prescriptive</span>).","صح: بتوصف الواقع زي ما هو من غير حكم.","غلط: التصحيح والامتحان شغل المعيارية."],"n":1,"i":10,"h":""},{"t":"learn","h":"<div class=\"u\">الوصفية بتقول لك: الاتنين مستخدمين في الإنجليزي الحقيقي، والتانية أكتر رسمية، والأولى مش غلط، هي بس أقل رسمية. مفيش حد في الحياة اليومية بيقول <span class=\"en\">To whom did you talk</span>، إلا في خطاب رسمي أو امتحان.</div>","n":1,"i":11,"a":"grammar-01-009","x":"03043edf"},{"t":"learn","h":"<div class=\"u\">تعالى على الحكاية اللي بتوضح إن القاعدة ممكن تبقى عادة مش قانون. فيه قاعدة مشهورة: متخلّيش حرف الجر في آخر الجملة. يعني متقولش <span class=\"en\">Who did you talk to</span>، قول <span class=\"en\">To whom did you talk</span>.</div>","n":1,"i":12,"a":"grammar-01-010","x":"7a886da5"},{"t":"learn","h":"<div class=\"u\">القاعدة دي جت منين؟ مش من طبيعة الإنجليزي. مؤرخو اللغة بيقولوا إنها جت من محاولة تطبيق نموذج اللاتينية على الإنجليزي في القرن التمنتاشر، وبيتربطوها بنقاد زي <span class=\"en\">Lowth</span>. اللاتينية مكنتش بتسمح إن حرف الجر يبقى في الآخر، فالناس افتكرت إن الإنجليزي لازم يبقى زي اللاتينية عشان يبقى \"لغة محترمة\".</div>","n":1,"i":13,"a":"grammar-01-011","x":"509d14fa"},{"t":"learn","h":"<div class=\"u\">والإنجليزي مش لاتيني، ودي مش قاعدة من قواعده. بس خد بالك، ومتزعلش من اللي جاي: المعياري ليه وظيفة حقيقية. في الكتابة الأكاديمية، وفي الامتحان، وفي التحرير، فيه <span class=\"en\">standard English</span> محدد، ولازم تلتزم بيه. عشان كده إحنا في الكورس هنستخدم الاتنين: الوصفي عشان تفهم اللغة، والمعياري عشان تكتب وتتصحح. مش أعداء، أدوات.</div>","n":1,"i":14,"a":"grammar-01-012","x":"906e76a3"},{"t":"section","h":"الكفاءة والأداء","n":1,"i":15},{"t":"learn","h":"<div class=\"u\">تشومسكي فرّق بين حاجتين في كتابه <span class=\"en\">Aspects of the Theory of Syntax</span> سنة 1965. الأولى: <span class=\"en\">competence</span>، الكفاءة. دي معرفتك باللغة، النظام اللي في دماغك. التانية: <span class=\"en\">performance</span>، الأداء. ده اللي بيطلع منك فعلاً، في الكلام والكتابة.</div>","n":1,"i":16,"a":"grammar-01-013","x":"745f9002"},{"t":"mc","q":"الـ <span class=\"en\">competence</span> معناها إيه؟","opts":["اللي بيطلع منك فعلًا في الكلام","معرفتك المخزنة باللغة","سرعة الكلام"],"ans":1,"why":"الكفاءة معرفة، والأداء تنفيذ.","ex":["غلط: ده الأداء (<span class=\"en\">performance</span>).","صح: <span class=\"en\">competence</span> هي النظام اللي في دماغك.","غلط: السرعة مالهاش علاقة بالمفهوم."],"n":1,"i":17,"h":""},{"t":"learn","h":"<div class=\"u\">إيه الفرق العملي؟ ممكن تكون عارف القاعدة تمام، وبعدين تتلخبط، أو تبلغ لسانك، أو تنسى آخر الجملة. ده أداء تعبان، مش كفاءة تعبانة. خد مثال: سواق شاطر جدًا، سايق من عشرين سنة. يوم من الأيام إيده بترتعش شوية، أو مرهق. هو لسه شاطر، مهارته موجودة، بس التنفيذ اللي اتأثر. نفس الحكاية: الكفاءة موجودة، الأداء هو اللي تعبان.</div>","n":1,"i":18,"a":"grammar-01-014","x":"7a907fac"},{"t":"learn","h":"<div class=\"u\">وليه ده مهم؟ عشان تفرق بين حاجتين: إنك تغلط، وإنك متعرفش. الغلطة في الكلام العادي حاجة، ونقص المعرفة حاجة تانية. ولاحقًا في الكورس هنسمي الأولى <span class=\"en\">mistake</span>، الزلة، والتانية <span class=\"en\">error</span>، الخطأ.</div>","n":1,"i":19,"a":"grammar-01-015","x":"95d82b68"},{"t":"section","h":"أشهر جملة في علم اللغة","n":1,"i":20},{"t":"learn","h":"<div class=\"u\">دلوقتي خد أشهر جملة في تاريخ علم اللغة. تشومسكي كتبها في كتاب <span class=\"en\">Syntactic Structures</span> سنة 1957: <span class=\"en\">Colorless green ideas sleep furiously</span>. تعالى نقراها كلمة كلمة. <span class=\"en\">Colorless</span>، عديم اللون. <span class=\"en\">Green</span>، أخضر. <span class=\"en\">Ideas</span>، أفكار. <span class=\"en\">Sleep</span>، بتنوم. <span class=\"en\">Furiously</span>، بشراسة. يعني: أفكار خضراء عديمة اللون بتنوم بشراسة.</div>","n":1,"i":21,"a":"grammar-01-016","x":"f811bc1a"},{"t":"tf","q":"جملة <span class=\"en\">Colorless green ideas sleep furiously</span> صحيحة نحويًا لكن معناها مش مقبول.","ans":true,"why":"صح: الترتيب والصيغة سليمين، لكن المعنى غير منطقي.","ex":["صح: <span class=\"en\">grammatical</span> لكن مش مقبولة دلاليًا.","غلط: القواعد سليمة، المشكلة في المعنى بس."],"n":1,"i":22,"h":""},{"t":"learn","h":"<div class=\"u\">كل كلمة إنجليزي سليمة، والترتيب سليم: صفة، صفة، اسم، فعل، ظرف. بس المعنى مستحيل. الأفكار ملهاش لون، ومينفعش تبقى خضراء وعديمة اللون في نفس الوقت، والأفكار مش بتنوم، ومحدش بينوم بشراسة.</div>","n":1,"i":23,"a":"grammar-01-017","x":"c9d6a05d"},{"t":"learn","h":"<div class=\"u\">الجملة دي صحيحة نحويًا، <span class=\"en\">grammatical</span>، ومش مقبولة دلاليًا، <span class=\"en\">not semantically acceptable</span>. والدرس هنا: النحو لوحده مش كفاية. لو النحو لوحده كان كفاية، كنا هنعتبر الجملة دي إنجليزي سليم.</div>","n":1,"i":24,"a":"grammar-01-018","x":"ede8d9e2"},{"t":"learn","h":"<div class=\"u\">والعكس صحيح كمان. لو واحد أجنبي دخل مطعم وقال: <span class=\"en\">Me want water</span>. إيه اللي هيحصل؟ الويتر هيفهمه فورًا، وهيجيب له ماية. الجملة دي مفهومة، <span class=\"en\">acceptable</span>، بس مش صحيحة نحويًا في <span class=\"en\">standard English</span>، المفروض <span class=\"en\">I want water</span>. يعني عندنا مقياسين مختلفين: الصحة النحوية من ناحية، والمقبولية من ناحية تانية. ومش دايمًا بيمشوا مع بعض.</div>","n":1,"i":25,"a":"grammar-01-019","x":"1b2c08dd"},{"t":"section","h":"خمس مستويات للغة","n":1,"i":26},{"t":"learn","h":"<div class=\"u\">تعالى بقى على أهم خريطة في الكورس كله. اللغة مش حاجة واحدة، اللغة خمس مستويات. المستوى الأول: <span class=\"en\">phonology</span>، الصوتيات. الأصوات ونظامها. مثال: ليه جمع <span class=\"en\">cat</span> بينطق <span class=\"en\">cats</span> بصوت س، وجمع <span class=\"en\">dog</span> بينطق <span class=\"en\">dogs</span> بصوت ز؟ الاتنين جمع، بس الصوت اتغير. ده نظام صوتي.</div>","n":1,"i":27,"a":"grammar-01-020","x":"878eb552"},{"t":"learn","h":"<div class=\"u\">المستوى التاني: <span class=\"en\">morphology</span>، الصرف. بناء الكلمة. زي <span class=\"en\">un</span>، <span class=\"en\">happi</span>، <span class=\"en\">ness</span>. تلات قطع بيعملوا كلمة واحدة. المستوى التالت: <span class=\"en\">syntax</span>، النحو. بناء الجملة والعلاقات بين أجزائها. المستوى الرابع: <span class=\"en\">semantics</span>، الدلالة. المعنى الحرفي. المستوى الخامس: <span class=\"en\">pragmatics</span>، التداولية. المعنى في الاستخدام والمقام.</div>","n":1,"i":28,"a":"grammar-01-021","x":"fc54553b"},{"t":"learn","h":"<div class=\"u\">خد جملة واحدة وحللها بالخمسة: <span class=\"en\">Could you close the window</span>? صوتيًا: <span class=\"en\">could you</span> بتندمج في النطق، بتسمعها كأنها كلمة واحدة. صرفيًا: <span class=\"en\">could</span> فعل ناقص، <span class=\"en\">close</span> فعل، <span class=\"en\">window</span> اسم. نحويًا: شكلها سؤال. دلاليًا: سؤال عن القدرة، يعني \"تقدر تقفل الشباك؟\"</div>","n":1,"i":29,"a":"grammar-01-022","x":"4bcf3980"},{"t":"mc","q":"جملة «<span class=\"en\">Could you close the window</span>?» استخدامها الحقيقي إيه؟","opts":["سؤال عن القدرة","طلب مؤدب","وصف للشباك"],"ans":1,"why":"تداوليًا هي طلب مش سؤال.","ex":["غلط: ده معناها الحرفي (دلالة)، لكن استخدامها مش كده.","صح: <span class=\"en\">pragmatics</span>: المعنى في الاستخدام، وهي طلب.","غلط: مفيش وصف في الجملة."],"n":1,"i":30,"h":""},{"t":"learn","h":"<div class=\"u\">وتداوليًا؟ هنا المفاجأة: دي مش سؤال، دي طلب. ومحدش في الدنيا هيرد \"<span class=\"en\">yes I could</span>\" ويسيب الشباك مفتوح. الرد الطبيعي إنه يقفل الشباك. نفس الجملة، خمس معاني مختلفة حسب المستوى اللي بتبص منه. وده الفرق بين اللي \"بيعرف إنجليزي\" واللي \"فاهم إنجليزي\".</div>","n":1,"i":31,"a":"grammar-01-023","x":"8a3a5129"},{"t":"section","h":"قالب كل درس: أربع زوايا","n":1,"i":32},{"t":"learn","h":"<div class=\"u\">دلوقتي هشرح لك القالب اللي هيمشي على كل درس في الكورس. إحنا هنبص على أي عنصر من أربع زوايا. الزاوية الأولى: الشكل، <span class=\"en\">form</span>. بيتبني إزاي؟ الصيغة والترتيب والاتساق. الزاوية التانية: الوظيفة، <span class=\"en\">function</span>. بيعمل إيه في الجملة؟ فاعل، مفعول، معدّل. وإزاي الوظيفة دي بتتحقق بأشكال مختلفة. الزاوية التالتة: المعنى، <span class=\"en\">meaning</span>. بيضيف إيه دلاليًا؟</div>","n":1,"i":33,"a":"grammar-01-024","x":"5a54fd7e"},{"t":"learn","h":"<div class=\"u\">الزاوية الرابعة: الاستخدام، <span class=\"en\">use</span>. بيتستخدم إمتى، ومين بيستخدمه، وفي أي مقام؟</div>","n":1,"i":34,"a":"grammar-01-025","x":"8fd45102"},{"t":"learn","h":"<div class=\"u\">خد مثال بيربط الأربعة: الفاعل، <span class=\"en\">the Subject</span>. شكله ممكن يبقى جملة اسمية زي <span class=\"en\">The results show</span>. أو جملة نسبية موصولة زي <span class=\"en\">What he said surprised me</span>. أو مصدر زي <span class=\"en\">To err is human</span>. وظيفته إن الفعل بيتفق معاه في العدد، والاتفاق ده اسمه <span class=\"en\">concord</span>. ومعناه ممكن يبقى اللي بيعمل الفعل، أو اللي الفعل بيحصل عليه.</div>","n":1,"i":35,"a":"grammar-01-026","x":"c243ec66"},{"t":"learn","h":"<div class=\"u\">واستخدامه في الكتابة الأكاديمية اختيار استراتيجي، وعشان كده بنكتب <span class=\"en\">This study shows</span>، مش <span class=\"en\">I show</span>. وهنفرد للفاعل دروس لوحدها لاحقًا.</div>","n":1,"i":36,"a":"grammar-01-027","x":"94e13fc7"},{"t":"section","h":"مصطلحات الدرس","n":1,"i":37},{"t":"learn","h":"<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. هتلاقيها كلها مكتوبة في الـ <span class=\"en\">PDF</span>، وهنا هتسمعها مرة بصوتي.</div>","n":1,"i":38,"a":"grammar-01-028","x":"614f41b2"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Grammar</span>: القواعد، نظام اللغة ككل. <span class=\"en\">Syntax</span>: النحو، بناء الجملة. <span class=\"en\">Morphology</span>: الصرف، بناء الكلمة. <span class=\"en\">Phonology</span>: علم الأصوات الوظيفي. <span class=\"en\">Phonetics</span>: علم الأصوات النطقي. <span class=\"en\">Semantics</span>: الدلالة، المعنى الحرفي. <span class=\"en\">Pragmatics</span>: التداولية، المعنى في المقام. <span class=\"en\">Lexicon</span>: المعجم الذهني، قاموسك الداخلي. <span class=\"en\">Morpheme</span>: مورفيم، أصغر وحدة ليها معنى. <span class=\"en\">Phrase</span>: عبارة.</div>","n":1,"i":39,"a":"grammar-01-029","x":"83a3a98a"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Clause</span>: جملة صغرى. <span class=\"en\">Sentence</span>: جملة كاملة. <span class=\"en\">Utterance</span>: ملفوظ، كلام في سياق. <span class=\"en\">Prescriptive</span>: معياري. <span class=\"en\">Descriptive</span>: وصفي. <span class=\"en\">Standard English</span>: الإنجليزية المعيارية. <span class=\"en\">Dialect</span>: لهجة. <span class=\"en\">Register</span>: سجل لغوي. <span class=\"en\">Competence</span>: الكفاءة. <span class=\"en\">Performance</span>: الأداء. <span class=\"en\">Grammaticality</span>: الصحة النحوية. <span class=\"en\">Acceptability</span>: المقبولية. <span class=\"en\">Well-formedness</span>: سلامة البناء.</div>","n":1,"i":40,"a":"grammar-01-030","x":"25b40c86"},{"t":"tf","q":"القواعد المعيارية ملهاش أي فايدة.","ans":false,"why":"غلط: لازم <span class=\"en\">standard English</span> في الكتابة الأكاديمية والتحرير.","ex":["غلط: المعياري ليه وظيفة حقيقية في الكتابة والامتحان.","صح، الجملة غلط: إحنا بنستخدم الاتنين: الوصفي للفهم والمعياري للكتابة."],"n":1,"i":41,"h":""},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Metalanguage</span>: لغة وصف اللغة. <span class=\"en\">Usage</span>: الاستعمال.</div>","n":1,"i":42,"a":"grammar-01-031","x":"412c4436"},{"t":"section","h":"تمرين سريع","n":1,"i":43},{"t":"learn","h":"<div class=\"u\">خد التمرين معايا. الأول بسيط: غيّر ترتيب <span class=\"en\">The dog chased the cat</span> وخلي المعنى يتغير. لو عملت <span class=\"en\">The cat chased the dog</span>، بقى القط هو اللي بيطارد الكلب. إيه الفرق بين <span class=\"en\">sentence</span> و<span class=\"en\">utterance</span>؟ الـ <span class=\"en\">sentence</span> وحدة نحوية كاملة، والـ <span class=\"en\">utterance</span> كلام بيطلع في سياق. \"ممكن تقفل الشباك؟\" <span class=\"en\">utterance</span>، مش <span class=\"en\">sentence</span> بالمعنى النحوي.</div>","n":1,"i":44,"a":"grammar-01-032","x":"13e8193a"},{"t":"learn","h":"<div class=\"u\">متوسط: <span class=\"en\">He goed to school</span>، زلة ولا خطأ؟ دي خطأ، <span class=\"en\">error</span>، لأن اللي قالها مش عارف قاعدة الماضي، فعمّم القاعدة على غير محلها. لو واحد عارف وقالها وهو مرهق، دي زلة. متقدم: اشرح ليه <span class=\"en\">standard English</span> لهجة مش لغة أرقى. الإجابة: لأن كل اللغات لها لهجات، واللي بيبقى <span class=\"en\">standard</span> بيبقى بسبب سلطة ومدارس وطباعة، مش بسبب إنه أرقى لغويًا.</div>","n":1,"i":45,"a":"grammar-01-033","x":"fe69e55a"},{"t":"section","h":"الخلاصة","n":1,"i":46},{"t":"learn","h":"<div class=\"u\">أربع نقط ونقفل. واحد: القواعد نظام في الدماغ، مش قائمة محفوظة. اتنين: وصفي للفهم، معياري للكتابة والامتحان. تلاتة: اللغة خمس مستويات، والمعنى بيتحدد في المقام. أربعة: القواعد مش نظرية واحدة، فيه أطر متنازعة بتفسر اللغة بطرق مختلفة، وده هنوصله في المراحل المتقدمة من الكورس.</div>","n":1,"i":47,"a":"grammar-01-034","x":"3359af98"},{"t":"learn","h":"<div class=\"u\">الدرس الجاي: الوصفي مقابل المعياري بعمق، وإزاي تعرف <span class=\"en\">standard English</span> وإمتى تلتزم بيه. سلام.</div>","n":1,"i":48,"a":"grammar-01-035","x":"7f6440d7"},{"t":"section","h":"الكويز","n":1,"i":49},{"t":"recall","q":"اذكر المستويات الخمسة للغة بالترتيب.","a":"<span class=\"en\">phonology</span> (الأصوات)، <span class=\"en\">morphology</span> (الصرف)، <span class=\"en\">syntax</span> (النحو)، <span class=\"en\">semantics</span> (الدلالة)، <span class=\"en\">pragmatics</span> (التداولية).","n":1,"i":50,"h":""},{"t":"recall","q":"إيه الفرق بين <span class=\"en\">error</span> و <span class=\"en\">mistake</span>؟","a":"&<span class=\"en\">lt</span>;<span class=\"en\">span class</span>=\"<span class=\"en\">en</span>\"&<span class=\"en\">gt</span>;<span class=\"en\">error</span>&<span class=\"en\">lt</span>;/<span class=\"en\">span</span>&<span class=\"en\">gt</span>; خطأ ناتج عن عدم معرفة القاعدة. &<span class=\"en\">lt</span>;<span class=\"en\">span class</span>=\"<span class=\"en\">en</span>\"&<span class=\"en\">gt</span>;<span class=\"en\">mistake</span>&<span class=\"en\">lt</span>;/<span class=\"en\">span</span>&<span class=\"en\">gt</span>; زلة: عارف القاعدة وغلطت بسبب تعب أو تسرع.","n":1,"i":51,"h":""},{"t":"write","q":"حلّل جملة «<span class=\"en\">Could you close the window</span>?» على المستويات الخمسة (٥ جمل).","key":"grammar-01:1","a":"صوتيًا: <span class=\"en\">could you</span> بتندمج في النطق. صرفيًا: <span class=\"en\">could</span> فعل ناقص، <span class=\"en\">close</span> فعل، <span class=\"en\">window</span> اسم. نحويًا: شكلها سؤال. دلاليًا: سؤال عن القدرة. تداوليًا: طلب مؤدب مش سؤال.","n":1,"i":52,"h":""},{"t":"write","q":"اشرح ليه <span class=\"en\">standard English</span> لهجة مش لغة أرقى (٣-٤ جمل).","key":"grammar-01:2","a":"كل اللغات ليها لهجات. الـ <span class=\"en\">standard</span> اتحددت بالسلطة والمدارس والطباعة، مش لأنها أحسن لغويًا. الناس بتحس إنها «الصح» لأن المدرسة بتعلمها وبتعاقب على غيرها.","n":1,"i":53,"h":""},{"t":"end","h":"","teaser":"<div class=\"u\">الدرس الجاي: الوصفي مقابل المعياري بعمق.</div><div class=\"u\">هنشوف قواعد زي حرف الجر في آخر الجملة والنفي المزدوج جت منين، وإزاي تحكم على أي قاعدة.</div>","extra":"المصادر: Chomsky, Syntactic Structures (1957); Chomsky, Aspects of the Theory of Syntax (1965); Larsen-Freeman, Teaching and Testing Grammar.","i":54}];</script>
