<script>window.LESSON_ID="history-19", "history-20", "history-21", "history-13", "history-14", "history-15", "history-16", "history-17";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"u\">الدرس اللي فات قفلنا الموجة الإليزابيثية: عشرين سلسلة سونيتات في ست سنين، وكلها بتحكي نفس الحكاية، راجل بيحب ست قاسية. وبعدين، سنة 1609، طلع كتاب فيه 154 سونيت لراجل اسمه <span class=\"en\">William Shakespeare<\/span>. والكتاب ده مختلف، مش لأنه أحلى، لكن لأنه بيرفض الحكاية من أساسها: هنا الشاعر بيحب شاب، والست اللي بتحبها مش جميلة، والشعر نفسه بقى موضوع القصيدة.<\/div><div class=\"u\">وعشان نفهم ليه السونيتات دي أشهر الشعر في اللغة الإنجليزية، لازم نبدأ بحاجة غريبة: الكتاب طلع، ومحدش لاحظه.<\/div>", "n": 2, "a": "history-19-001", "x": "b0073151", "en": "Last lesson closed the Elizabethan wave: twenty sequences in six years telling one story. Then in 1609 came a book of 154 sonnets by William Shakespeare, different not because it is sweeter but because it rejects the story: he loves a young man, the woman is not beautiful, and the poem itself becomes the subject. The book came out and nobody noticed.", "i": 1}, {"t": "section", "h": "النقطة 1: الكتاب اللي طلع ومحدش لاحظه", "i": 2}, {"t": "learn", "h": "<div class=\"u\">📌 الوقائع:<\/div><div class=\"li\">في 20 مايو 1609، الناشر <span class=\"en\">Thomas Thorpe<\/span> سجّل الكتاب في سجل أصحاب المهن (<span class=\"en\">Stationers' Register<\/span>)، والمدخل مكتوب بالعامية كده: كتاب اسمه \"<span class=\"en\">Shakespeares sonnettes<\/span>\"، برسوم ستة بنس.<\/div><div class=\"li\">العنوان على الغلاف: \"<span class=\"en\">Shake-speares Sonnets<\/span>\"، والاسم مكتوب بشرطة، وده ظهر في كتب كتير في العصر.<\/div><div class=\"li\">الطبّاع: <span class=\"en\">George Eld<\/span>.<\/div><div class=\"li\">التوزيع: النسخ اتقسمت على بائعَي كتب، <span class=\"en\">William Aspley<\/span> و<span class=\"en\">John Wright<\/span>.<\/div>", "n": 5, "a": "history-19-002", "x": "2c433483", "en": "The facts: on 20 May 1609 the publisher Thomas Thorpe registered it in the Stationers' Register. The title page reads Shake-speares Sonnets. Printed by George Eld, sold by William Aspley and John Wright.", "i": 3}, {"t": "mc", "h": "", "q": "مين الناشر اللي سجّل سونيتات <span class=\"en\">Shakespeare<\/span> سنة 1609؟", "nq": 1, "opts": ["<span class=\"en\">Thomas Thorpe<\/span>", "<span class=\"en\">John Benson<\/span>", "<span class=\"en\">William Ponsonby<\/span>"], "ans": 0, "why": "<span class=\"en\">Thomas Thorpe<\/span>", "ex": ["صح: سجّلها في 20 مايو 1609.", "غلط: <span class=\"en\">Benson<\/span> طلع طبعة 1640.", "غلط: <span class=\"en\">Ponsonby<\/span> ناشر <span class=\"en\">Amoretti<\/span>."], "i": 4}, {"t": "learn", "h": "<div class=\"li\">النهاردة فاضل من الطبعة دي 13 نسخة بس، ودي حاجة طبيعية: دي كراسة صغيرة رخيصة، مش كتاب فخم.<\/div>", "n": 1, "a": "history-19-003", "x": "14535642", "en": "Only 13 copies of that edition survive today, which is normal for a cheap little pamphlet.", "i": 5}, {"t": "learn", "h": "<div class=\"u\">📌 الاستقبال:<\/div><div class=\"li\">بالمقارنة مع <span class=\"en\">Venus and Adonis<\/span>، القصيدة اللي <span class=\"en\">Shakespeare<\/span> نشرها سنة 1593 وحققت نجاح كبير واتطبعت كذا مرة، السونيتات دي عدت في صمت تقريباً.<\/div><div class=\"li\">مفيش ردود فعل مسجلة، مفيش قصايد بتجاملها، مفيش طبعة تانية في حياة الشاعر.<\/div>", "n": 3, "a": "history-19-004", "x": "cb7cb137", "en": "Reception: next to Venus and Adonis (1593), which sold well and was reprinted, the sonnets passed almost in silence: no recorded reactions and no second edition in the poet's lifetime.", "i": 6}, {"t": "tf", "h": "", "q": "سونيتات 1609 حققت نجاح كبير زي <span class=\"en\">Venus and Adonis<\/span>.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: عدّت في صمت تقريباً ومفيش طبعة تانية في حياة الشاعر.", "صح: ده كان نجاح <span class=\"en\">Venus and Adonis<\/span>."], "i": 7}, {"t": "learn", "h": "<div class=\"u\">📌 ليه؟<\/div><div class=\"li\">السبب الأول: الموضة كانت خلصت. الموجة اللي حكينا عنها في الدرس اللي فات كانت في التسعينات، وبحلول 1609 السونيت بقى شكل قديم شوية.<\/div><div class=\"li\">السبب التاني، والأهم: المحتوى. راجل بيكتب 126 سونيت لشاب وسيم، وبيمدح جماله. ده مش موضوع لطيف في إنجلترا 1609.<\/div><div class=\"li\">والسبب التالت: الشاعر نفسه كان مشغول بحاجة تانية خالص، المسرح.<\/div>", "n": 4, "a": "history-19-005", "x": "f61586b1", "en": "Why? First, the fashion had ended. Second, the content: 126 sonnets to a handsome young man was not a comfortable subject. Third, Shakespeare was busy with the theatre.", "i": 8}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: زي ألبوم موسيقي نزل بعد ما \"الترند\" خلص. الأغاني فيه حلوة، لكن الجمهور مش مستني، والراديو مش هيديه مساحة. وبعد عشرين سنة، الناس تكتشفه ويبقى \"ألبوم كلاسيكي\". الشهرة مش بتتقرر يوم الإصدار، الشهرة بتتقرر بالقراءة اللي بتتكرر على مدى قرون.<\/div>", "n": 1, "a": "history-19-006", "x": "7a4aae6b", "en": "Everyday example: an album released after the trend is over. Fame is decided by readers over centuries, not on release day.", "i": 9}, {"t": "section", "h": "النقطة 2: الإهداء: من أشهر ألغاز الأدب الإنجليزي", "i": 10}, {"t": "learn", "h": "<div class=\"u\">📌 النص:<\/div><div class=\"u\">الكتاب بيبدأ بصفحة إهداء، مكتوبة كلها بحروف كبيرة، ومن غير نقط، وده شكلها:<\/div><div class=\"li\">\"<span class=\"en\">TO.THE.ONLIE.BEGETTER.OF.THESE.INSUING.SONNETS.Mr.W.H. ALL.HAPPINESSE.AND.THAT.ETERNITIE.PROMISED.BY.OUR.EVER-LIVING.POET.WISHETH.THE.WELL-WISHING.ADVENTURER.IN.SETTING.FORTH<\/span>.\"<\/div><div class=\"li\">وتحتهم الحرفين: <span class=\"en\">T.T<\/span>.<\/div>", "n": 4, "a": "history-19-007", "x": "3a7405c7", "en": "The dedication, in capital letters with dots: TO THE ONLIE BEGETTER OF THESE INSUING SONNETS Mr. W.H. ALL HAPPINESSE AND THAT ETERNITIE PROMISED BY OUR EVER-LIVING POET WISHETH THE WELL-WISHING ADVENTURER IN SETTING FORTH. Below it: T.T.", "i": 11}, {"t": "mc", "h": "", "q": "\"<span class=\"en\">T.T<\/span>.\" في صفحة الإهداء معناها إيه؟", "nq": 1, "opts": ["<span class=\"en\">Thomas Thorpe<\/span> الناشر", "<span class=\"en\">Shakespeare<\/span> نفسه", "الشاب الوسيم"], "ans": 0, "why": "<span class=\"en\">Thomas Thorpe<\/span> الناشر", "ex": ["صح: الناشر هو اللي كتب الإهداء.", "غلط: الشاعر مش هو اللي كتبه.", "غلط: الشاب هو <span class=\"en\">Mr. W.H<\/span>. في بعض التفسيرات."], "i": 12}, {"t": "learn", "h": "<div class=\"u\">📌 يعني إيه؟<\/div><div class=\"li\">\"<span class=\"en\">T.T<\/span>.\" = <span class=\"en\">Thomas Thorpe<\/span>، الناشر. يعني الناشر هو اللي بيكتب الإهداء، مش الشاعر.<\/div><div class=\"li\">\"<span class=\"en\">the onlie begetter<\/span>\": كلمة <span class=\"en\">begetter<\/span> ليها معنيين في الإنجليزي القديم.<\/div><div class=\"li\">المعنى الأول: اللي \"خلّف\" السونيتات، يعني اللي ألهمها أو كان سببها. يعني الشاب اللي القصايد بتتكلم عنه.<\/div><div class=\"li\">المعنى التاني: اللي \"حصل عليها\"، يعني اللي جمّعها ووصّلها للناشر. يعني \"المورّد\".<\/div>", "n": 5, "a": "history-19-008", "x": "91d51bea", "en": "T.T. is Thomas Thorpe the publisher, so the publisher wrote the dedication. Begetter had two meanings: the one who inspired the sonnets (the young man) or the one who got them and brought them to the publisher.", "i": 13}, {"t": "mc", "h": "", "q": "ليه كلمة <span class=\"en\">begetter<\/span> في الإهداء بتعمل لغز؟", "nq": 1, "opts": ["ليها معنيين: اللي ألهم القصايد أو اللي جابها للناشر", "معناها الشاعر بس", "معناها الناشر بس"], "ans": 0, "why": "ليها معنيين: اللي ألهم القصايد أو اللي جابها للناشر", "ex": ["صح: والمعنيين بيغيروا مين هو <span class=\"en\">Mr. W.H<\/span>.", "غلط: دي مش معناها الوحيد.", "غلط: الناشر هو <span class=\"en\">T.T<\/span>. مش <span class=\"en\">begetter<\/span>."], "i": 14}, {"t": "learn", "h": "<div class=\"li\">والفرق بين المعنيين مش تفصيلة لغوية، ده الفرق بين إن <span class=\"en\">Mr. W.H<\/span>. هو حبيب الشاعر، أو مجرد واحد ساعد في النشر.<\/div>", "n": 1, "a": "history-19-009", "x": "86eeefa7", "en": "The difference is not a detail: it decides whether Mr. W.H. was the poet's beloved or just someone who helped publication.", "i": 15}, {"t": "tf", "h": "", "q": "كلمة <span class=\"en\">lease<\/span> في سونيت 18 كلمة قانونية معناها عقد إيجار.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: الصيف مستأجر ومدته تخلص.", "غلط: هي فعلاً قانونية."], "i": 16}, {"t": "learn", "h": "<div class=\"u\">📌 المرشحين:<\/div><div class=\"li\"><span class=\"en\">William Herbert<\/span>، إيرل <span class=\"en\">Pembroke<\/span> التالت. اسمه يبدأ بـ <span class=\"en\">W.H<\/span>.، وكان من نبلاء الشباب اللي بيدعموا الأدب.<\/div><div class=\"li\"><span class=\"en\">Henry Wriothesley<\/span>، إيرل <span class=\"en\">Southampton<\/span> التالت. اسمه يبدأ <span class=\"en\">H.W<\/span>.، ولو عكستهم تبقى <span class=\"en\">W.H. Southampton<\/span> هو اللي <span class=\"en\">Shakespeare<\/span> أهداله <span class=\"en\">Venus and Adonis<\/span> و<span class=\"en\">The Rape of Lucrece<\/span>، يعني فيه سابقة إهداء.<\/div>", "n": 3, "a": "history-19-010", "x": "02fde51a", "en": "Candidates: William Herbert, third Earl of Pembroke (initials W.H.), and Henry Wriothesley, third Earl of Southampton (H.W. reversed), to whom Shakespeare dedicated Venus and Adonis and Lucrece.", "i": 17}, {"t": "learn", "h": "<div class=\"li\">لكن فيه مشكلة في الترشيحين: الاتنين إيرلات، والإهداء بيقول \"<span class=\"en\">Mr<\/span>.\" واللقب ده مش بيستخدم مع إيرل. الإيرل بيبقى \"<span class=\"en\">Lord<\/span>\". فـ \"<span class=\"en\">Mr<\/span>.\" بتقول لنا إن الشخص ده راجل نبيل من طبقة أقل، أو ابن فارس.<\/div>", "n": 1, "a": "history-19-011", "x": "2d407f3b", "en": "The problem: both are earls and the dedication says Mr., which is not used for an earl (he would be Lord). So Mr. suggests a gentleman of lower rank.", "i": 18}, {"t": "tf", "h": "", "q": "لقب \"<span class=\"en\">Mr<\/span>.\" مناسب جداً لإيرل زي <span class=\"en\">Southampton<\/span>.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: الإيرل بيتقال له <span class=\"en\">Lord<\/span>، فـ <span class=\"en\">Mr<\/span>. بتلخبط الترشيح.", "صح: ده كلام عكس المشكلة."], "i": 19}, {"t": "learn", "h": "<div class=\"u\">📌 الحقيقة:<\/div><div class=\"li\">محدش يعرف. والدارسين بيكتبوا عن الموضوع من قرنين، ومحدش وصّل لحل.<\/div><div class=\"li\">والغريب إن الإهداء نفسه هو اللي خلّى الكتاب يعيش. الناس بتحب الألغاز، والكتاب اللي فيه لغز بيتقرا أكتر من الكتاب اللي مفهوم.<\/div>", "n": 3, "a": "history-19-012", "x": "e8f28cb2", "en": "The truth: nobody knows. Scholars have written about it for two centuries. The puzzle itself helped the book survive: people love a riddle.", "i": 20}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: زي رسالة حب قديمة لقيتها في كتاب مستعمل، مكتوب عليها حرفين بس. المحتوى حلو، لكن الحرفين دول هما اللي هيخلوك تسأل عنهم عشرين سنة.<\/div>", "n": 1, "a": "history-19-013", "x": "0c1a479c", "en": "Everyday example: an old love letter found in a second-hand book, signed with two letters. The two letters make you ask for twenty years.", "i": 21}, {"t": "section", "h": "النقطة 3: الخريطة: 154 سونيت + قصيدة طويلة", "i": 22}, {"t": "learn", "h": "<div class=\"u\">📌 الشكل العام:<\/div><div class=\"li\">الطبعة فيها 154 سونيت، وبعدهم قصيدة طويلة اسمها \"<span class=\"en\">A Lover's Complaint<\/span>\"، يعني شكوى عاشقة.<\/div><div class=\"li\">فده مش كتاب سونيتات بس، ده كتاب فيه جزء أول (الشاب) وجزء تاني (المرأة اللي بتشكي). والبنية دي كانت معروفة: <span class=\"en\">Daniel<\/span> عملها في <span class=\"en\">Delia<\/span>، و<span class=\"en\">Spenser<\/span> عملها في <span class=\"en\">Amoretti<\/span> + <span class=\"en\">Epithalamion<\/span>.<\/div>", "n": 3, "a": "history-19-014", "x": "b117587a", "en": "The shape: 154 sonnets and then a long poem, A Lover's Complaint. Daniel did the same in Delia and Spenser in Amoretti plus Epithalamion.", "i": 23}, {"t": "mc", "h": "", "q": "إيه قافية السونيت الشكسبيري؟", "nq": 1, "opts": ["<span class=\"en\">abab cdcd efef gg<\/span>", "<span class=\"en\">ababbcbccdcdee<\/span>", "<span class=\"en\">abbaabba<\/span>"], "ans": 0, "why": "<span class=\"en\">abab cdcd efef gg<\/span>", "ex": ["صح: تلات رباعيات وبيت.", "غلط: دي السبنسرية.", "غلط: دي الثمانية الإيطالية."], "i": 24}, {"t": "learn", "h": "<div class=\"u\">📌 الأقسام الأربعة:<\/div><div class=\"li\">السونيتات 1 إلى 17 (أول جزء من القسم اللي بعده): سونيتات الإنجاب. الشاعر بيطلب من الشاب إنه يتجوز ويخلف، عشان جماله يفضل في ولاده. يعني الخلود بالنسل.<\/div><div class=\"li\">السونيتات 1 إلى 126: الشاب الوسيم (<span class=\"en\">Fair Youth<\/span>). الحب، والغيرة، والخيانة، والزمن، والشعر.<\/div><div class=\"li\">السونيتات 127 إلى 152: الست السمرا (<span class=\"en\">Dark Lady<\/span>). هنا الشغف، والخيانة، والشهوة، والمرارة.<\/div><div class=\"li\">السونيتات 153 و154: قصيدتين رمزيتين عن <span class=\"en\">Cupid<\/span>، إله الحب، مبنيين على قصايد يونانية قديمة.<\/div>", "n": 5, "a": "history-19-015", "x": "5f0a3741", "en": "The four parts: sonnets 1-17 ask the young man to marry and have children (immortality by offspring); 1-126 the Fair Youth; 127-152 the Dark Lady; 153-154 two poems about Cupid based on old Greek poems.", "i": 25}, {"t": "mc", "h": "", "q": "السونيتات 127 إلى 152 عن مين؟", "nq": 1, "opts": ["الست السمرا", "الشاب الوسيم", "الشاعر المنافس"], "ans": 0, "why": "الست السمرا", "ex": ["صح: <span class=\"en\">Dark Lady<\/span>.", "غلط: الشاب في 1 إلى 126.", "غلط: المنافس تقريباً 78 إلى 86."], "i": 26}, {"t": "learn", "h": "<div class=\"li\">وفيه كمان \"الشاعر المنافس\" (<span class=\"en\">Rival Poet<\/span>)، والدارسين بيحطوه في حدود السونيتات 78 إلى 86، وفيه خلاف على مين هو.<\/div>", "n": 1, "a": "history-19-016", "x": "319a247b", "en": "There is also a Rival Poet, which scholars place around sonnets 78 to 86, and they disagree on who he is.", "i": 27}, {"t": "learn", "h": "<div class=\"u\">📌 الأرقام مش بالضرورة الترتيب الزمني:<\/div><div class=\"li\">فيه دارسين بيقولوا إن السونيتات اتكتبت على مدى سنين طويلة، من التسعينات لحد أوائل 1600، ومش بالترتيب اللي في الكتاب.<\/div><div class=\"li\">وده رأي دارسين، مش حقيقة مؤكدة. ومهم إنك تعرف إن رقم السونيت مش تاريخ كتابتها.<\/div>", "n": 3, "a": "history-19-017", "x": "451ba1ea", "en": "The numbers are not necessarily the order of writing. Some scholars say the sonnets were written over many years between the 1590s and early 1600s, not in book order.", "i": 28}, {"t": "tf", "h": "", "q": "رقم السونيت في الكتاب هو بالضرورة تاريخ كتابتها.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: الترتيب مش بالضرورة ترتيب الكتابة.", "صح: الدارسين بيختلفوا في ده."], "i": 29}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: زي ألبوم صور العيلة. الترتيب في الألبوم هو ترتيب اللي رتّب الألبوم، مش ترتيب الأيام. وممكن صور قديمة تبقى في آخر الألبوم لأنها اتفقست في وقت متأخر.<\/div>", "n": 1, "a": "history-19-018", "x": "40a8423a", "en": "Everyday example: a family photo album. The order is the arranger's, not the order of the days.", "i": 30}, {"t": "section", "h": "النقطة 4: مين الشاب؟ ومين الست؟", "i": 31}, {"t": "learn", "h": "<div class=\"u\">📌 الشاب الوسيم:<\/div><div class=\"li\">الدارسين بيوصفوه من داخل السونيتات: جميل، مغرور شوية، محبوب من كل الناس، وعنده موهبة إنه يخلّي اللي حواليه يعشقوه.<\/div><div class=\"li\">الترشيح الأشهر: <span class=\"en\">Henry Wriothesley<\/span>، إيرل <span class=\"en\">Southampton<\/span>، لأن عمره وجماله وطبقته تناسب الصورة.<\/div><div class=\"li\">لكن مفيش دليل قاطع، وفيه دارسين بيقولوا الشخصية أدبية مش حقيقية.<\/div>", "n": 4, "a": "history-19-019", "x": "23881523", "en": "The Fair Youth: scholars describe him from inside the poems as beautiful, a bit vain, loved by all. The best-known candidate is Southampton, but there is no firm proof and some say he is a literary character.", "i": 32}, {"t": "learn", "h": "<div class=\"u\">📌 الست السمرا:<\/div><div class=\"li\">اسمها كده لأن شعرها أسود وبشرتها \"<span class=\"en\">dun<\/span>\"، يعني مائلة للون الترابي، مش بيضاء زي جمال الموضة في العصر ده.<\/div><div class=\"li\">ومن هنا جاي اسم السونيتات 127-152.<\/div><div class=\"li\">من الترشيحات المشهورة: <span class=\"en\">Emilia Lanier<\/span>، ست إنجليزية من أصل إيطالي، وكانت شاعرة بنفسها، ودارس مشهور رشّحها سنة 1973. وده ترشيح، مش إثبات.<\/div>", "n": 4, "a": "history-19-020", "x": "6d2d523b", "en": "The Dark Lady: named for her black hair and dun skin, not fair like the fashion of the time. Sonnets 127-152. Emilia Lanier, an English poet of Italian descent, was proposed by a well-known scholar in 1973. A proposal, not proof.", "i": 33}, {"t": "learn", "h": "<div class=\"li\">وهنشوف <span class=\"en\">Emilia Lanier<\/span> بعد كده في الكورس، لأنها من أوائل الستات الإنجليزيات اللي نشروا كتاب شعر، وده موضوع درس كامل.<\/div>", "n": 1, "a": "history-19-021", "x": "6b3e77d1", "en": "We will meet Emilia Lanier later in the course, as one of the first Englishwomen to publish a book of poems.", "i": 34}, {"t": "learn", "h": "<div class=\"u\">📌 هل دي سيرة ذاتية؟<\/div><div class=\"li\">محدش يعرف. فيه دارسين بيقروا السونيتات كاعتراف، وفيه دارسين بيقروها كفن.<\/div><div class=\"li\">والخطر في القراءة الأولى إنها بتقلل من القصايد: لو القصيدة بقت \"وثيقة\" عن حياة الشاعر، مش هتقراها كفن.<\/div>", "n": 3, "a": "history-19-022", "x": "28aca9ee", "en": "Is it autobiography? Nobody knows. Some read the sonnets as confession, some as art. The danger of the first reading is that it shrinks the poems into documents.", "i": 35}, {"t": "tf", "h": "", "q": "محدش يعرف بالتأكيد إذا كانت السونيتات سيرة ذاتية.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: الدارسين مختلفين.", "غلط: مفيش دليل قاطع."], "i": 36}, {"t": "section", "h": "النقطة 5: سونيت 18: من أشهر قصايد الجمال، وهي في الحقيقة عن الشعر", "i": 37}, {"t": "learn", "h": "<div class=\"u\">📌 النص:<\/div><div class=\"u\"><span class=\"en\">Shall I compare thee to a summer's day<\/span>?<\/div><div class=\"u\"><span class=\"en\">Thou art more lovely and more temperate<\/span>:<\/div><div class=\"u\"><span class=\"en\">Rough winds do shake the darling buds of May<\/span>,<\/div><div class=\"u\"><span class=\"en\">And summer's lease hath all too short a date<\/span>:<\/div><div class=\"u\"><span class=\"en\">Sometime too hot the eye of heaven shines<\/span>,<\/div><div class=\"u\"><span class=\"en\">And often is his gold complexion dimmed<\/span>,<\/div><div class=\"u\"><span class=\"en\">And every fair from fair sometime declines<\/span>,<\/div><div class=\"u\"><span class=\"en\">By chance, or nature's changing course untrimmed<\/span>:<\/div><div class=\"u\"><span class=\"en\">But thy eternal summer shall not fade<\/span>,<\/div>", "n": 10, "a": "history-19-023", "x": "babd4e6a", "en": "Sonnet 18, first part: Shall I compare thee to a summer's day? up to the twelfth line.", "i": 38}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Nor lose possession of that fair thou ow'st<\/span>,<\/div><div class=\"u\"><span class=\"en\">Nor shall death brag thou wander'st in his shade<\/span>,<\/div><div class=\"u\"><span class=\"en\">When in eternal lines to time thou grow'st<\/span>,<\/div><div class=\"u\"><span class=\"en\">So long as men can breathe, or eyes can see<\/span>,<\/div><div class=\"u\"><span class=\"en\">So long lives this, and this gives life to thee<\/span>.<\/div>", "n": 5, "a": "history-19-024", "x": "a19a56d7", "en": "Sonnet 18, last two lines: So long as men can breathe, or eyes can see, So long lives this, and this gives life to thee.", "i": 39}, {"t": "learn", "h": "<div class=\"u\">📌 إيه اللي بيحصل في الأربعتاشر سطر؟<\/div><div class=\"li\">الرباعية الأولى: سؤال، وجواب فوري. \"أشبهك بيوم صيف؟\" لأ، أنت أحلى وأهدى. والسبب: رياح بتكسر براعم مايو، والصيف عنده \"<span class=\"en\">lease<\/span>\"، عقد إيجار، ومده قصيرة.<\/div><div class=\"li\">الرباعية التانية: الصيف نفسه فيه عيوب. الشمس بتحرق، وبعدين بتتغطى بالسحاب، وكل جميل بيزول، إما بالصدفة أو بدورة الطبيعة.<\/div><div class=\"li\">السطر التاسع: التحول. \"لكن صيفك الأبدي مش هيذبل\". الكلمة \"<span class=\"en\">But<\/span>\" هي باب، وبعدها القصيدة بتدخل مكان تاني خالص.<\/div>", "n": 4, "a": "history-19-025", "x": "fd5c43b8", "en": "What happens: first quatrain, a question and an answer: you are lovelier and milder, summer has rough winds and a short lease. Second quatrain: even summer has flaws. Line 9, But: the turn.", "i": 40}, {"t": "mc", "h": "", "q": "إيه اللي بيحصل عند \"<span class=\"en\">But<\/span>\" في السطر التاسع من سونيت 18؟", "nq": 1, "opts": ["القصيدة بتتحول من العيوب للوعد بالخلود", "القصيدة بتخلص", "الشاعر بيشتم الشاب"], "ans": 0, "why": "القصيدة بتتحول من العيوب للوعد بالخلود", "ex": ["صح: دي الـ <span class=\"en\">volta<\/span>.", "غلط: لسه فيه 6 سطور.", "غلط: مفيش شتيمة."], "i": 41}, {"t": "learn", "h": "<div class=\"li\">البيت الأخير: الوعد. \"طول ما فيه ناس بتتنفس، أو عيون بتشوف، طول ما القصيدة دي عايشة، وهي اللي بتديك الحياة\".<\/div>", "n": 1, "a": "history-19-026", "x": "e4319f88", "en": "The last couplet: the promise. As long as men breathe or eyes see, as long as this poem lives, it gives you life.", "i": 42}, {"t": "learn", "h": "<div class=\"u\">📌 الحركة الذكية:<\/div><div class=\"li\">الشاعر في أول 12 سطر بيقول إن كل حاجة بتزول، بما فيها الصيف، وبما فيها أنت.<\/div><div class=\"li\">وفي آخر سطرين بيقول: إلا إنك هتفضل عايش في القصيدة دي.<\/div><div class=\"li\">لكن الحياة دي مش مطلقة، هي مشروطة: \"طول ما فيه ناس بتتنفس\". يعني خلود الشاب معلّق على القراء. القصيدة بتدّعي إنها بتدي الحياة، وفي نفس الوقت بتعترف إنها محتاجة حد يقراها.<\/div>", "n": 4, "a": "history-19-027", "x": "d9364d3f", "en": "The clever move: for twelve lines everything fades, even you; the last two say you will live in this poem. But the life is conditional: as long as people read. The poem claims to give life and admits it needs readers.", "i": 43}, {"t": "mc", "h": "", "q": "ليه خلود الشاب في سونيت 18 مشروط؟", "nq": 1, "opts": ["لأنه معلّق على إن الناس تفضل تقرا القصيدة", "لأنه معلّق على موت الشاعر", "لأنه معلّق على الصيف"], "ans": 0, "why": "لأنه معلّق على إن الناس تفضل تقرا القصيدة", "ex": ["صح: طول ما فيه ناس بتتنفس.", "غلط: مش مرتبط بالشاعر.", "غلط: الصيف هو اللي بيزول."], "i": 44}, {"t": "learn", "h": "<div class=\"li\">و\"<span class=\"en\">eternal lines<\/span>\" كلمة <span class=\"en\">lines<\/span> ممكن تتقرا سطور شعر، وبعض القراء بيسمعوا فيها كمان معنى النسل أو خطوط الوجه. يعني الشاب هيعيش في السطور دي.<\/div>", "n": 1, "a": "history-19-028", "x": "62b8f629", "en": "On eternal lines: lines can be lines of verse, and some readers also hear descendants or face lines. So you will live in my lines.", "i": 45}, {"t": "learn", "h": "<div class=\"u\">📌 تفصيلة لغوية:<\/div><div class=\"li\">كلمة \"<span class=\"en\">lease<\/span>\" في السطر الرابع قانونية واقتصادية. الصيف مستأجر، ومدة الإيجار بتنتهي. والشاب عنده حاجة أحسن من الإيجار: ملكية دائمة.<\/div><div class=\"li\">و\"<span class=\"en\">ow'st<\/span>\" في السطر العاشر معناها \"تملك\" (<span class=\"en\">own<\/span>) أو \"مدين بـ\" (<span class=\"en\">owe<\/span>). المعنيين شغالين: أنت مالك الجمال ده، وأنت مدين بيه لحد.<\/div>", "n": 3, "a": "history-19-029", "x": "04a76007", "en": "A detail: lease in line 4 is a legal word: summer is rented and the term ends. The young man gets something better: ownership. And ow'st can mean own or owe: both work.", "i": 46}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: جدك مات، وعندك صورتين ليه. صورة في البطاقة، وصورة في حكاية بيحكيها أبوك عنه. الصورة بتحفظ الوش، لكن الحكاية هي اللي بتخلي الناس تحبه وهي اللي مش بتموت. سونيت 18 بيعمل الحكاية، مش الصورة.<\/div>", "n": 1, "a": "history-19-030", "x": "ca073f02", "en": "Everyday example: a dead grandfather with two pictures: an ID photo and a story your father tells. The photo keeps the face, the story keeps people loving him. Sonnet 18 makes the story.", "i": 47}, {"t": "section", "h": "النقطة 6: سونيت 130: الرد على <span class=\"en\">Petrarch<\/span>", "i": 48}, {"t": "learn", "h": "<div class=\"u\">📌 النص:<\/div><div class=\"u\"><span class=\"en\">My mistress' eyes are nothing like the sun<\/span>;<\/div><div class=\"u\"><span class=\"en\">Coral is far more red than her lips' red<\/span>;<\/div><div class=\"u\"><span class=\"en\">If snow be white, why then her breasts are dun<\/span>;<\/div><div class=\"u\"><span class=\"en\">If hairs be wires, black wires grow on her head<\/span>.<\/div><div class=\"u\"><span class=\"en\">I have seen roses damasked, red and white<\/span>,<\/div><div class=\"u\"><span class=\"en\">But no such roses see I in her cheeks<\/span>;<\/div><div class=\"u\"><span class=\"en\">And in some perfumes is there more delight<\/span><\/div><div class=\"u\"><span class=\"en\">Than in the breath that from my mistress reeks<\/span>.<\/div><div class=\"u\"><span class=\"en\">I love to hear her speak, yet well I know<\/span><\/div>", "n": 10, "a": "history-19-031", "x": "38f9c5cb", "en": "Sonnet 130, first part: My mistress' eyes are nothing like the sun...", "i": 49}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">That music hath a far more pleasing sound<\/span>;<\/div><div class=\"u\"><span class=\"en\">I grant I never saw a goddess go<\/span>;<\/div><div class=\"u\"><span class=\"en\">My mistress, when she walks, treads on the ground<\/span>:<\/div><div class=\"u\"><span class=\"en\">And yet, by heaven, I think my love as rare<\/span><\/div><div class=\"u\"><span class=\"en\">As any she belied with false compare<\/span>.<\/div>", "n": 5, "a": "history-19-032", "x": "a3483ce9", "en": "Sonnet 130, rest: ...yet, by heaven, I think my love as rare as any she belied with false compare.", "i": 50}, {"t": "learn", "h": "<div class=\"u\">📌 التقليد اللي بيرد عليه:<\/div><div class=\"li\">من <span class=\"en\">Petrarch<\/span> لحد <span class=\"en\">Sidney<\/span>، المدح كان بيشتغل بمخزون ثابت من الصور: عينيها زي الشمس، شفايفها زي المرجان، شعرها خيوط دهب، نفسها ريحة مسك، ومشيتها مشية إلهة.<\/div><div class=\"li\">والصور دي مش كذب بالمعنى الحرفي، هي عادة. الشاعر بيستخدمها لأنها متوقعة، والجمهور بيستريح لها.<\/div>", "n": 3, "a": "history-19-033", "x": "d92b7175", "en": "The tradition he answers: from Petrarch to Sidney, praise used a fixed stock of images: eyes like the sun, lips like coral, golden hair, a sweet breath, a goddess's walk. Habit, not exactly lies.", "i": 51}, {"t": "mc", "h": "", "q": "سونيت 130 بترد على إيه؟", "nq": 1, "opts": ["مخزون <span class=\"en\">Petrarch<\/span> من تشبيهات المدح", "سونيتات <span class=\"en\">Daniel<\/span>", "أوامر الملكة"], "ans": 0, "why": "مخزون <span class=\"en\">Petrarch<\/span> من تشبيهات المدح", "ex": ["صح: الشمس والمرجان والورد.", "غلط: مش هو.", "غلط: مفيش علاقة."], "i": 52}, {"t": "learn", "h": "<div class=\"u\">📌 إيه اللي بيعمله <span class=\"en\">Shakespeare<\/span>؟<\/div><div class=\"li\">بياخد كل صورة من المخزون ده، ويرفضها واحدة واحدة.<\/div><div class=\"li\">عينيها مش زي الشمس، خالص.<\/div><div class=\"li\">المرجان أحمر بكتير من شفايفها.<\/div><div class=\"li\">لو التلج أبيض، يبقى صدرها مش أبيض، هو \"<span class=\"en\">dun<\/span>\"، ترابي.<\/div><div class=\"li\">لو الشعر خيوط، يبقى في راسها خيوط سودا. والكلمة \"<span class=\"en\">wires<\/span>\" مش رومانسية، دي أسلاك.<\/div><div class=\"li\">الورد شافه، لكن مش في خدودها.<\/div><div class=\"li\">وريحة العطر أحلى من نفسها. وكلمة <span class=\"en\">reeks<\/span> في زمنه معناها تنبعث منها ريحة، وكتير من القراء بيسمعوها ريحة مش حلوة، فهي بتلعب على المعنيين.<\/div>", "n": 8, "a": "history-19-034", "x": "8c822de3", "en": "What Shakespeare does: he takes each image and refuses it. Her eyes are not like the sun, coral is redder than her lips, her breasts are dun, her hair is black wires, roses are not in her cheeks, some perfumes smell better.", "i": 53}, {"t": "learn", "h": "<div class=\"li\">ومشيتها على الأرض، مش مشية إلهة.<\/div>", "n": 1, "a": "history-19-035", "x": "ca78409d", "en": "And her walk: she treads on the ground, not like a goddess.", "i": 54}, {"t": "learn", "h": "<div class=\"u\">📌 البيت الأخير هو المفتاح:<\/div><div class=\"li\">\"ومع ذلك، وحق السماء، أنا شايف إن حبي نادر زي أي ست اتظلمت بالتشبيهات الكاذبة\".<\/div><div class=\"li\">كلمة \"<span class=\"en\">belied<\/span>\" معناها اتظلم أو اتشوّه بالكذب. فالشاعر مش بيقول إن حبيبته وحشة، هو بيقول إن الستات اللي اتكتب فيهم القصايد الكبيرة اتظلموا، لأن التشبيهات دي بتوعد بحاجة مش موجودة.<\/div><div class=\"li\">يعني الهجوم مش عليها، الهجوم على اللغة نفسها.<\/div>", "n": 4, "a": "history-19-036", "x": "8e155873", "en": "The last couplet is the key: and yet I think my love as rare as any woman belied with false compare. He does not say she is ugly; he says women praised with false comparisons were wronged. The attack is on the language, not on her.", "i": 55}, {"t": "mc", "h": "", "q": "الهجوم في سونيت 130 على مين؟", "nq": 1, "opts": ["على التشبيهات الكاذبة مش على الحبيبة", "على حبيبته", "على الشعر كله"], "ans": 0, "why": "على التشبيهات الكاذبة مش على الحبيبة", "ex": ["صح: <span class=\"en\">belied<\/span> معناها اتظلم بالكذب.", "غلط: هو بيحبها.", "غلط: هو بيهاجم نوع من التشبيه."], "i": 56}, {"t": "learn", "h": "<div class=\"u\">📌 ليه ده مدح أعلى؟<\/div><div class=\"li\">لأن الشاعر بيدّي حبيبته حقيقة، مش صورة. والصدق في التقليد ده كان حاجة نادرة.<\/div><div class=\"li\">وفي نفس الوقت، القصيدة بتبقى عن نفسها: شاعر بيكتب سونيت عشان يقول إنه مش هيكتب سونيت بالطريقة المتوقعة. ده فن عن الفن.<\/div>", "n": 3, "a": "history-19-037", "x": "679f57d2", "en": "Why it is higher praise: he gives his beloved reality, not an image. And the poem is about itself: a sonnet saying he will not write a sonnet the expected way. Art about art.", "i": 57}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: الفرق بين إعلان محل بيقول \"أحسن منتج في العالم\"، وصاحبك بيقول لك \"هو مش أحسن حاجة، بس أنا بستخدمه كل يوم ومريحني\". التاني أقل كلاماً، وأكتر ثقة.<\/div>", "n": 1, "a": "history-19-038", "x": "48abf018", "en": "Everyday example: an ad that says best product in the world, versus a friend who says it is not the best but I use it daily and it works. The second says less and is more trusted.", "i": 58}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين سونيت 18 لـ <span class=\"en\">Shakespeare<\/span> وسونيت 75 لـ <span class=\"en\">Spenser<\/span>: الاتنين بيوعدوا بالخلود عن طريق الشعر. إيه الفرق في طريقة كل واحد في كسب الوعد ده؟", "a": "<div class=\"u\">الوعد واحد في الظاهر: الحبيبة أو الحبيب هيفضل عايش لأن الشاعر كتب عنه. لكن الاتنين بيكسبوا الوعد ده بطرق مختلفة تماماً، والفرق بيرجع لفكرة الشعر نفسه عند كل واحد.<\/div><div class=\"u\"><span class=\"en\">Spenser<\/span> في <span class=\"en\">Amoretti<\/span> 75 بيبني القصيدة على حوار: هي بتقرا اسمه على الشاطئ، والمية بتمحيه، وهو بيقول إن اللي بيموت هو المادة، واللي بيفضل هو الاسم المكتوب في الشعر. فالقصيدة عند <span class=\"en\">Spenser<\/span> حاجة بتغلّب المادة: الطبيعة بتمحي، والشعر بيثبّت. والخلود هنا هدية الشاعر للحبيبة، وهو واثق إن الشعر أقوى من الزمن.<\/div><div class=\"u\"><span class=\"en\">Shakespeare<\/span> في سونيت 18 بيعمل نفس الحركة، لكن بيعترف بحاجة <span class=\"en\">Spenser<\/span> ما بيعترفهاش: إن خلود القصيدة مش مطلق، هو مشروط بالقراء. السطر قبل الأخير بيقول \"طول ما فيه ناس بتتنفس، أو عيون بتشوف\". يعني القصيدة نفسها بتموت لو مفيش حد بيقراها. فالشاعر بيدّي الحياة للحبيب، وفي نفس الوقت بيعترف إنه محتاج حد يدّيه هو الحياة.<\/div><div class=\"u\">والفرق التاني في الموقف من الطبيعة: <span class=\"en\">Spenser<\/span> بيحط الطبيعة كمحاولة فاشلة (المية بتمحي)، و<span class=\"en\">Shakespeare<\/span> بيحط الطبيعة كقانون عام: كل جميل بيزول، إما بالصدفة أو بدورة الطبيعة. فالطبيعة عند <span class=\"en\">Shakespeare<\/span> مش عدو، هي نظام. والقصيدة بتنتصر على النظام ده، لكن انتصار مؤقت ومعلّق على البشر.<\/div><div class=\"u\">والنتيجة إن <span class=\"en\">Spenser<\/span> بيكتب قصيدة ثقة، و<span class=\"en\">Shakespeare<\/span> بيكتب قصيدة ثقة فيها شرط. وده اللي بيخلي سونيت 18 أعمق في نظر ناس كتير: هو وعد، لكنه وعد عارف حدوده.<\/div>", "key": "history-19:W38", "n": 1, "i": 59}, {"t": "section", "h": "النقطة 7: إزاي الكتاب اتشوّه: 1640", "i": 60}, {"t": "learn", "h": "<div class=\"u\">📌 <span class=\"en\">John Benson<\/span>:<\/div><div class=\"li\">سنة 1640، ناشر اسمه <span class=\"en\">John Benson<\/span> طلع كتاب اسمه \"<span class=\"en\">Poems<\/span>: <span class=\"en\">Written by Wil. Shakespeare Gent<\/span>\".<\/div><div class=\"li\">الكتاب ده مجموعة شعر، وفيه عدد من القصايد منسوبة له ومش كلها له.<\/div><div class=\"li\">والأهم: <span class=\"en\">Benson<\/span> أخد السونيتات، وأعاد ترتيبها، وحذف بعضها، وغيّر الضمائر. الضمير \"<span class=\"en\">he<\/span>\" بقى \"<span class=\"en\">she<\/span>\" في كذا مكان، عشان القصايد تبان موجهة لست.<\/div>", "n": 4, "a": "history-19-039", "x": "f141a286", "en": "In 1640 the publisher John Benson issued Poems: Written by Wil. Shake-speare, Gent. It held many poems attributed to him that were not all his, and Benson reordered the sonnets, dropped some and changed some pronouns, he to she, to make them seem addressed to a woman.", "i": 61}, {"t": "mc", "h": "", "q": "إيه اللي عمله <span class=\"en\">John Benson<\/span> سنة 1640؟", "nq": 1, "opts": ["أعاد ترتيب السونيتات وغيّر ضمائر في بعضها", "نشر طبعة 1609 زي ما هي", "كتب الإهداء"], "ans": 0, "why": "أعاد ترتيب السونيتات وغيّر ضمائر في بعضها", "ex": ["صح: عشان تبان موجهة لست.", "غلط: ده اللي عمله <span class=\"en\">Malone<\/span> سنة 1780.", "غلط: الإهداء بتاع <span class=\"en\">Thorpe<\/span>."], "i": 62}, {"t": "learn", "h": "<div class=\"u\">📌 النتيجة:<\/div><div class=\"li\">لمدة تزيد على قرن، القراء كانوا فاكرين إن السونيتات دي قصايد حب لست.<\/div><div class=\"li\">سنة 1780، <span class=\"en\">Edmond Malone<\/span>، في ملحق لطبعة أعمال <span class=\"en\">Shakespeare<\/span>، أعاد طبعة 1609 كالنص المعتمد الوحيد.<\/div>", "n": 3, "a": "history-19-040", "x": "7be405d0", "en": "The result: for more than a century readers thought these were love poems to a woman. In 1780 Edmond Malone reprinted the 1609 edition as the authority.", "i": 63}, {"t": "learn", "h": "<div class=\"u\">📌 الدرس:<\/div><div class=\"li\">النص اللي بتقراه مش \"الشعر\" في حالته الطبيعية، هو قرار حد أخده. المحرر بيختار الترتيب، وبيختار الضمير، وبيختار القصايد.<\/div><div class=\"li\">وده بيرجعنا لدرس الطباعة: الكتاب مش وعاء محايد، الكتاب تدخّل.<\/div>", "n": 3, "a": "history-19-041", "x": "e3ab203d", "en": "The lesson: the text you read is the decision of someone. An editor chooses the order, the pronoun, the poems. A book is not a neutral container, it intervenes.", "i": 64}, {"t": "section", "h": "النقطة 8: الشكل: تلات رباعيات وبيت", "i": 65}, {"t": "learn", "h": "<div class=\"u\">📌 البنية:<\/div><div class=\"li\">الوزن: خمس تفعيلات، وقافية <span class=\"en\">abab cdcd efef gg<\/span>.<\/div><div class=\"li\">ده الشكل اللي <span class=\"en\">Surrey<\/span> ثبّته في الدرس 14، وبقى اسمه بعد كده \"الشكل الإنجليزي\" أو \"الشكل الشكسبيري\".<\/div><div class=\"li\">فيه تحول (<span class=\"en\">volta<\/span>) في العادة عند السطر التاسع، أو في البيت الأخير.<\/div>", "n": 4, "a": "history-19-042", "x": "9cf08468", "en": "The structure: five beats to the line, rhyme abab cdcd efef gg, the form Surrey fixed in lesson 14, later called the English or Shakespearean form. Usually a turn (volta) at line 9 or in the couplet.", "i": 66}, {"t": "learn", "h": "<div class=\"u\">📌 البيت الأخير كباب:<\/div><div class=\"li\">أول 12 سطر بيبنوا حجة، والبيت الأخير بيقلبها أو بيقفلها.<\/div><div class=\"li\">في سونيت 130، البيت الأخير بيقلب القصيدة كلها: 12 سطر سخروا، وسطرين حبّوا.<\/div><div class=\"li\">في سونيت 18، البيت الأخير مش قلب، هو نتيجة: الوعد اللي كان مستني.<\/div>", "n": 4, "a": "history-19-043", "x": "898057e9", "en": "The last couplet as a door: twelve lines build an argument, the couplet flips or closes it. In 130 it flips (twelve lines mocked, two loved). In 18 it is the result of the promise.", "i": 67}, {"t": "learn", "h": "<div class=\"u\">📌 المقارنة مع <span class=\"en\">Spenser<\/span>:<\/div><div class=\"li\"><span class=\"en\">Spenser<\/span> عمل شكل متشابك <span class=\"en\">ababbcbccdcdee<\/span>، القافية بتدخل في اللي بعدها، والشكل بيبان مستمر.<\/div><div class=\"li\"><span class=\"en\">Shakespeare<\/span> عمل شكل مفصول: كل رباعية قافية لوحدها، والبيت لوحده.<\/div><div class=\"li\">والفرق ده مش تقني بس: الشكل المفصول بيدي الشاعر فرصة إنه يبني حجة في 12 سطر ويقفلها في سطرين، وده يناسب عقل بيسأل ويشك.<\/div>", "n": 4, "a": "history-19-044", "x": "719c868a", "en": "Versus Spenser: his form is linked, ababbcbccdcdee, so it looks continuous. Shakespeare's is separate: each quatrain on its own and the couplet alone, which lets him build an argument in twelve lines and close it in two, fitting a questioning mind.", "i": 68}, {"t": "section", "h": "النقطة 9: ليه السونيتات دي بالتحديد هي المشهورة؟", "i": 69}, {"t": "learn", "h": "<div class=\"u\">📌 مش لأنها الأحلى:<\/div><div class=\"li\"><span class=\"en\">Sidney<\/span> أكتر موسيقى، و<span class=\"en\">Spenser<\/span> أكتر تعقيداً في الشكل.<\/div><div class=\"li\">لكن سونيتات <span class=\"en\">Shakespeare<\/span> أكتر تناقضاً.<\/div>", "n": 3, "a": "history-19-045", "x": "bac50e3f", "en": "Why these sonnets are the famous ones: not because they are sweetest. Sidney has more music and Spenser more formal complexity. But Shakespeare's sonnets are more contradictory.", "i": 70}, {"t": "learn", "h": "<div class=\"u\">📌 التناقض هو السر:<\/div><div class=\"li\">الشاعر مش عاشق نموذجي. هو بيحب، وبيكره نفسه، وبيكره اللي بيحب، وبيشك في شعره، وبعدين بيفخر بيه.<\/div><div class=\"li\">والشاب مش ملاك، هو مغرور وخاين.<\/div><div class=\"li\">والست مش صنم، هي حقيقية، وفيه بينهم شهوة ومرارة.<\/div>", "n": 4, "a": "history-19-046", "x": "964790fd", "en": "Contradiction is the secret: the poet is not a model lover. He loves, hates himself, hates the one he loves, doubts his verse, then boasts. The young man is no angel, vain and unfaithful, and the woman is no idol but real, with desire and bitterness.", "i": 71}, {"t": "tf", "h": "", "q": "الدرس بيقول إن شهرة سونيتات <span class=\"en\">Shakespeare<\/span> بسبب إنها الأحلى موسيقى.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: <span class=\"en\">Sidney<\/span> أكتر موسيقى، والسر هو التناقض.", "صح: ده اللي الدرس بينفيه."], "i": 72}, {"t": "learn", "h": "<div class=\"u\">📌 والفايدة العملية ليك:<\/div><div class=\"li\">لو كتبت مقال عن السونيتات دي، ابدأ بالتناقض، مش بالجمال. الجمال رأي، والتناقض حجة.<\/div>", "n": 2, "a": "history-19-047", "x": "56afef3d", "en": "A practical use for you: when you write an essay on these sonnets, begin with the contradiction, not the beauty. Beauty is opinion, contradiction is an argument.", "i": 73}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; سونيت 130 بترفض تقليد <span class=\"en\">Petrarch<\/span>. هل ده رفض للتقاليد، ولا أفصح نسخة منها؟", "a": "<div class=\"u\">الظاهر إن سونيت 130 هجوم على التقليد: الشاعر بياخد كل صورة معتادة، من الشمس والمرجان والورد والعطر، ويرفضها واحدة واحدة، وبكلمات قاسية زي \"<span class=\"en\">reeks<\/span>\" و\"<span class=\"en\">black wires<\/span>\". لكن الرفض ده مش خروج عن التقليد، هو إعادة استخدام لقواعده.<\/div><div class=\"u\">أولاً، القصيدة مبنية على نفس المخزون. الشاعر مش بيبتكر صور جديدة، هو بيستدعي الصور القديمة وينفيها. وده معناه إنه محتاج التقليد عشان يشتغل: من غير الشمس والمرجان، مفيش قصيدة.<\/div><div class=\"u\">ثانياً، الغرض من التقليد كان المدح. والقصيدة دي كمان مدح، بس بمنطق مختلف: بدل ما ترفع الحبيبة لفوق، بتنزّلها للأرض وتمدحها هناك. \"مشيتها على الأرض\" مش إهانة، دي أعلى مدح في القصيدة: هي إنسانة، مش تمثال.<\/div><div class=\"u\">ثالثاً، البيت الأخير بيقول \"زي أي ست اتظلمت بالتشبيهات الكاذبة\". يعني الهجوم على الشعراء اللي بيكدبوا، مش على الشعر. والشاعر بيقدّم نفسه كشاعر أحسن، مش كخارج عن المهنة.<\/div><div class=\"u\">رابعاً، فيه ناس بترد إن القصيدة مش مدح خالص، وإن السخرية فيها بتغلب. والرد على ده إن السخرية في 12 سطر، والتصريح في سطرين، والسطرين هما اللي بيقفلوا القصيدة. وفي السونيت الإنجليزي، البيت الأخير هو اللي بيحكم.<\/div><div class=\"u\">فالخلاصة: سونيت 130 مش رفض للتقاليد، هي أعلى شكل من أشكال استخدامها. الشاعر بيثبت إنه يعرف المخزون كله، وعشان كده يقدر يرفضه. والرفض نفسه بيبقى مدح، والقصيدة بتبقى عن اللغة أكتر منها عن الست.<\/div>", "key": "history-19:W47", "n": 1, "i": 74}, {"t": "end", "h": "", "teaser": "الدرس الجاي: سونيتات <span class=\"en\">Shakespeare<\/span> الجزء التاني، الزمن والخيانة والشعر، وسونيت 73 و116 و129.", "extra": "", "i": 75}];</script>
