<script>window.LESSON_ID="analysis-12";window.STEPS=[{"t":"learn","h":"<div class=\"u\">من سونيتة حب قصيرة لقصيدة حكاية طويلة: أربع أجزاء، ست بيت، وقصة ست محبوسة في برج.</div><div class=\"u\">القصيدة: The Lady of Shalott لتينيسون. الدرس ده بياخد المقاطع المهمة من كل جزء ويحلّلها سطر سطر.</div>","n":2,"i":0,"a":"analysis-12-001","x":"6e67eb45"},{"t":"section","h":"تينيسون والسياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">ألفريد تينيسون <span class=\"en\">(Alfred, Lord Tennyson)</span>، 1809-1892، أهم شاعر فيكتوريّ. قصيدته عن الأسطورة الآرثرية <span class=\"en\">(Arthurian legend)</span>، والحكاية أصلها في مالوري <span class=\"en\">(Malory)</span> عن إلين من أستولات <span class=\"en\">(Elaine of Astolat)</span>.</div>","n":1,"i":2,"a":"analysis-12-002","x":"a7b3264e"},{"t":"learn","h":"<div class=\"u\">القصيدة اتنشرت أول مرة 1832، وبعدين تينيسون عدّلها ونشرها تاني في مجموعة 1842. النسخة المشهورة واللي بتتدرس هي نسخة 1842.</div>","n":1,"i":3,"a":"analysis-12-003","x":"6d72f5d4"},{"t":"learn","h":"<div class=\"u\">الحكاية باختصار: ست محبوسة في برج على جزيرة، بتنسج على نول، وممنوع عليها تبص على كاميلوت مباشرة — بس من خلال مرآة. لما بتبص، اللعنة بتنزل عليها.</div>","n":1,"i":4,"a":"analysis-12-004","x":"7a6eeeb3"},{"t":"learn","h":"<div class=\"u\">الشكل: تسع سطور في كل مقطع، بقافية <span class=\"en\">aaabcccb</span>، وآخر سطر في كل مقطع دايمًا اسم البطلة. الوزن رباعي <span class=\"en\">(iambic tetrameter)</span> مع سطور أقصر — إيقاعه قريب من الأغنية.</div>","n":1,"i":5,"a":"analysis-12-005","x":"f351b567"},{"t":"section","h":"الجزء الأول: الجزيرة والطريق","n":1,"i":6},{"t":"learn","h":"<div class=\"lead\">المقطع الأول (السطور <span dir=\"ltr\">1-9</span>):</div><div class=\"u\"><span class=\"en\">On either side the river lie / Long fields of barley and of rye, / That clothe the wold and meet the sky; / And through the field the road runs by / To many-towered Camelot;</span></div>","n":2,"i":7,"a":"analysis-12-006","x":"3326f773"},{"t":"learn","h":"<div class=\"u\">القصيدة بتبدأ بمنظر واسع: نهر، شعير، جاودار، طريق بيوصل لكاميلوت. الطبيعة مفتوحة وواسعة — وده مهم عشان نفهم إن البطلة محبوسة في نقطة صغيرة وسط كل ده.</div>","n":1,"i":8,"a":"analysis-12-007","x":"fad0b735"},{"t":"learn","h":"<div class=\"u\">وكلمة <span class=\"en\">many-towered</span> بتوصف كاميلوت: مدينة أبراج كتير، عكس البرج الواحد اللي هي فيه. المدينة مركز الحياة، والجزيرة طرف.</div>","n":1,"i":9,"a":"analysis-12-008","x":"cda07018"},{"t":"learn","h":"<div class=\"lead\">المقطع التاني (السطور <span dir=\"ltr\">10-18</span>):</div><div class=\"u\"><span class=\"en\">Willows whiten, aspens quiver, / Little breezes dusk and shiver / Through the wave that runs for ever / By the island in the river / Flowing down to Camelot. / Four grey walls, and four grey towers, / Overlook a space of flowers, / And the silent isle imbowers / The Lady of Shalott.</span></div>","n":2,"i":10,"a":"analysis-12-009","x":"fe5f552b"},{"t":"learn","h":"<div class=\"u\">«أربع حيطان رمادية وأربع أبراج رمادية» — تكرار <span class=\"en\">grey</span> وتكرار الرقم أربعة بيدّي إحساس بالحصار والرتابة. لاحظ إن المنظر حوالين الجزيرة مليان حركة وألوان، والبرج رمادي وساكت.</div>","n":1,"i":11,"a":"analysis-12-010","x":"e21a4ab0"},{"t":"learn","h":"<div class=\"u\">«الجزيرة الساكتة بتحتويها» <span class=\"en\">(imbowers)</span>: الجزيرة نفسها بقت برج. العزلة هنا مش اختيار، هي بناء.</div>","n":1,"i":12,"a":"analysis-12-011","x":"f51ce195"},{"t":"learn","h":"<div class=\"lead\">المقطع الرابع (السطور <span dir=\"ltr\">28-36</span>):</div><div class=\"u\"><span class=\"en\">Only reapers, reaping early / In among the bearded barley, / Hear a song that echoes cheerly / From the river winding clearly, / Down to towered Camelot: / And by the moon the reaper weary, / Piling sheaves in uplands airy, / Listening, whispers “’Tis the fairy / Lady of Shalott.”</span></div>","n":2,"i":13,"a":"analysis-12-012","x":"fdd35d8c"},{"t":"learn","h":"<div class=\"u\">الحصّادين بس هما اللي بيسمعوا صوتها، وبينادوها «الجنية» <span class=\"en\">(the fairy)</span>. يعني الناس عارفة إن فيه حد هناك، بس كحكاية مش كإنسانة — زي هيلين عند H.D.</div>","n":1,"i":14,"a":"analysis-12-013","x":"323d13c1"},{"t":"learn","h":"<div class=\"u\">وصوتها بيوصل من غير ما حد يشوفها: الغنا هو الوسيلة الوحيدة للتواصل، وده رمز مهم للفن <span class=\"en\">(art)</span> اللي بيوصل من غير حضور.</div>","n":1,"i":15,"a":"analysis-12-014","x":"e5215eea"},{"t":"section","h":"الجزء الثاني: النول والمرآة واللعنة","n":1,"i":16},{"t":"learn","h":"<div class=\"lead\">المقطع الأول (السطور <span dir=\"ltr\">37-45</span>):</div><div class=\"u\"><span class=\"en\">There she weaves by night and day / A magic web with colours gay. / She has heard a whisper say, / A curse is on her if she stay / To look down to Camelot. / She knows not what the curse may be, / And so she weaveth steadily, / And little other care hath she, / The Lady of Shalott.</span></div>","n":2,"i":17,"a":"analysis-12-015","x":"f99fdf85"},{"t":"tf","h":"","q":"الليدي بتعرف اللعنة إيه قبل ما تنزل تبص.","ans":false,"why":"غلط: «She knows not what the curse may be» — هي بس سمعت همسة باللعنة.","n":1,"i":18,"ex":["غلط. النص بيقول إنها مش عارفة اللعنة إيه.","صح، الجملة غلط: المعرفة بتيجي مع اللعنة."]},{"t":"learn","h":"<div class=\"u\">«بتنسج ليل ونهار شبكة سحرية بألوان مبهجة». النسيج هنا الفن: منظر بتصنعه بإيديها من غير ما تشوف الأصل مباشرة.</div>","n":1,"i":19,"a":"analysis-12-016","x":"26c9b73a"},{"t":"learn","h":"<div class=\"u\">واللعنة شرطها واحد: لو «فضلت» تبص على كاميلوت. وهي مش عارفة اللعنة إيه بالظبط — وده اللي بيخلي الخوف أكبر، وبيخلي الطاعة عادة مش قرار.</div>","n":1,"i":20,"a":"analysis-12-017","x":"98d615ee"},{"t":"learn","h":"<div class=\"lead\">المقطع التاني (السطور <span dir=\"ltr\">46-54</span>):</div><div class=\"u\"><span class=\"en\">And moving through a mirror clear / That hangs before her all the year, / Shadows of the world appear. / There she sees the highway near / Winding down to Camelot:</span></div>","n":2,"i":21,"a":"analysis-12-018","x":"7a2aa0be"},{"t":"learn","h":"<div class=\"u\">المرآة <span class=\"en\">(mirror)</span> هي الوسيط: «ظلال العالم» <span class=\"en\">(shadows of the world)</span> بتظهر فيها. يعني هي بتشوف الواقع منعكس، مش مباشر — وده تعريف دقيق للفن اللي بيمرر الحياة من خلال صورة.</div>","n":1,"i":22,"a":"analysis-12-019","x":"ed9bab1d"},{"t":"mc","h":"","q":"المرآة في القصيدة بترمز لإيه؟","opts":["إنها بتشوف العالم منعكس، مش مباشر","الغرور","السحر الأسود"],"ans":0,"why":"الوسيط اللي بيحوّل الواقع لصورة.","n":1,"i":23,"ex":["صح: «Shadows of the world appear» — الوسيط اللي بيوصل الصورة بدل التجربة.","غلط: مفيش إشارة للغرور؛ المرآة أداة شغل.","غلط: السحر موجود كجو، لكن المرآة وسيط رؤية."]},{"t":"learn","h":"<div class=\"lead\">المقطع الرابع (السطور <span dir=\"ltr\">64-72</span>):</div><div class=\"u\"><span class=\"en\">But in her web she still delights / To weave the mirror’s magic sights, / For often through the silent nights / A funeral, with plumes and lights / And music, went to Camelot: / Or when the moon was overhead, / Came two young lovers lately wed; / “I am half sick of shadows,” said / The Lady of Shalott.</span></div>","n":2,"i":24,"a":"analysis-12-020","x":"beef0d08"},{"t":"learn","h":"<div class=\"u\">هي مبسوطة بالنسيج: بتنسج «مناظر المرآة السحرية». لكن وسط ده كله بتيجي الجملة المفتاحية: «أنا نصّ عيانة من الظلال» <span class=\"en\">(I am half sick of shadows)</span>.</div>","n":1,"i":25,"a":"analysis-12-021","x":"a92c3643"},{"t":"mc","h":"","q":"«I am half sick of shadows» بتبدأ إيه؟","opts":["بداية التمرد على العزلة","مرض جسدي","خوف من لانسلوت"],"ans":0,"why":"بداية التمرد والرغبة في الحياة.","n":1,"i":26,"ex":["صح: هي أول لحظة تعلن فيها إن الظلال مش كفاية، وبعدها بتنزل تبص.","غلط: التعب هنا نفسي، مش مرضي.","غلط: لانسلوت لسه مظهرش في القصيدة عند اللحظة دي."]},{"t":"learn","h":"<div class=\"u\">الجملة دي هي بداية التمرد: الظلال مش كفاية. ووقتها جاي بعد جنازة وعروسين — يعني مناظر الموت والحب، أقوى حاجتين في الحياة، وكلها بتمر من غيرها.</div>","n":1,"i":27,"a":"analysis-12-022","x":"e623104e"},{"t":"section","h":"الجزء الثالث: لانسلوت والكسرة","n":1,"i":28},{"t":"learn","h":"<div class=\"lead\">المقطع الأول (السطور <span dir=\"ltr\">73-81</span>):</div><div class=\"u\"><span class=\"en\">A bow-shot from her bower-eaves, / He rode between the barley-sheaves, / The sun came dazzling through the leaves, / And flamed upon the brazen greaves / Of bold Sir Lancelot.</span></div>","n":2,"i":29,"a":"analysis-12-023","x":"b7fb1a54"},{"t":"learn","h":"<div class=\"u\">لانسلوت بيوصل بضجة ضوء: الشمس بتلمع على دروعه النحاسية. بعد الظلال والسكون، القصيدة كلها بتولّع في لحظة واحدة.</div>","n":1,"i":30,"a":"analysis-12-024","x":"bb63ebbf"},{"t":"learn","h":"<div class=\"u\">ولاحظ الوصف: تفاصيل كتير جدًا (اللجام، الأجراس، البوق، السرج المرصّع). تينيسون بيبطّأ السرد عشان اللحظة تبقى حاسمة، زي مشهد سينمائي بطيء.</div>","n":1,"i":31,"a":"analysis-12-025","x":"29ab77ef"},{"t":"learn","h":"<div class=\"lead\">المقطع الرابع (السطور <span dir=\"ltr\">100-108</span>):</div><div class=\"u\"><span class=\"en\">His broad clear brow in sunlight glowed; / On burnished hooves his war-horse trode; / From underneath his helmet flowed / His coal-black curls as on he rode, / As he rode down to Camelot. / From the bank and from the river / He flashed into the crystal mirror, / “Tirra lirra,” by the river / Sang Sir Lancelot.</span></div>","n":2,"i":32,"a":"analysis-12-026","x":"bc0c1537"},{"t":"learn","h":"<div class=\"u\">«تيرّا ليرّا» <span class=\"en\">(Tirra lirra)</span>: أغنية خفيفة، شبه استهزاء بجمال الجو. الصوت ده هو اللي بيكسر عزلتها — مش موعظة ولا رسالة، أغنية.</div>","n":1,"i":33,"a":"analysis-12-027","x":"cfb2eff0"},{"t":"learn","h":"<div class=\"lead\">المقطع الخامس (السطور <span dir=\"ltr\">109-117</span>):</div><div class=\"u\"><span class=\"en\">She left the web, she left the loom, / She made three paces through the room, / She saw the water-lily bloom, / She saw the helmet and the plume, / She looked down to Camelot. / Out flew the web and floated wide; / The mirror cracked from side to side; / “The curse is come upon me,” cried / The Lady of Shalott.</span></div>","n":2,"i":34,"a":"analysis-12-028","x":"33704506"},{"t":"learn","h":"<div class=\"u\">تلات خطوات بس <span class=\"en\">(three paces)</span> — القصيدة بتحسب المسافة بالخطوات، زي ما بتعد الأبراج والحواجز. تلات خطوات بينها وبين الحياة.</div>","n":1,"i":35,"a":"analysis-12-029","x":"939044d2"},{"t":"learn","h":"<div class=\"u\">وبعدها كل حاجة بتنكسر مرة واحدة: النسيج بيطير، والمرآة بتتشق من الجنب للجنب. الفن اتهد، والوسيط اتهد — وهي بقت في الواقع من غير حماية.</div>","n":1,"i":36,"a":"analysis-12-030","x":"22893773"},{"t":"mc","h":"","q":"لما بتنزل تبص على كاميلوت، بيحصل إيه؟","opts":["النسيج بيطير والمرآة بتتشق واللعنة بتنزل","لانسلوت بياخدها","بتفضل زي ما هي"],"ans":0,"why":"النسيج بيتدمر والمرآة بتتشق.","n":1,"i":37,"ex":["صح: اللحظة دي هي الذروة، وكل حاجة بتهد فيها.","غلط: مفيش لقاء بينهم في القصيدة.","غلط: اللعنة بتنزل فعلًا وبتؤدي لموتها."]},{"t":"learn","h":"<div class=\"u\">«اللعنة جات عليّا» — لاحظ إنها ما عرفتش اللعنة إيه غير بعد ما نزلت. المعرفة بتيجي مع العقاب في نفس اللحظة.</div>","n":1,"i":38,"a":"analysis-12-031","x":"3c5fd6bc"},{"t":"section","h":"الجزء الرابع: القارب والنهاية","n":1,"i":39},{"t":"learn","h":"<div class=\"lead\">المقطع الأول (السطور <span dir=\"ltr\">118-126</span>):</div><div class=\"u\"><span class=\"en\">In the stormy east-wind straining, / The pale yellow woods were waning, / The broad stream in his banks complaining, / Heavily the low sky raining / Over towered Camelot; / Down she came and found a boat / Beneath a willow left afloat, / And round about the prow she wrote / The Lady of Shalott.</span></div>","n":2,"i":40,"a":"analysis-12-032","x":"b86619e5"},{"t":"learn","h":"<div class=\"u\">الجو اتغير فورًا: ريح شرقية عاصفة، خشب مصفر، سما واطية بتمطر. الطبيعة بتعكس الحالة <span class=\"en\">(pathetic fallacy)</span> — منظر حزين قبل موت حزين.</div>","n":1,"i":41,"a":"analysis-12-033","x":"89263a59"},{"t":"tf","h":"","q":"الجو بيتغير في الجزء الرابع لريح ومطر قبل موتها.","ans":true,"why":"صح: ريح شرقية عاصفة، خشب مصفر، سما واطية بتمطر — والطبيعة بتعكس الحالة.","n":1,"i":42,"ex":["صح، الجملة صح: الوصف في أول مقطع من الجزء الرابع.","غلط. التغيير في الجو واضح ومقصود."]},{"t":"learn","h":"<div class=\"u\">وهي بتكتب اسمها حوالين مقدم القارب: «الليدي أوف شالوت». أول مرة تعلن هويتها بنفسها — مش الحصّادين ولا المرآة.</div>","n":1,"i":43,"a":"analysis-12-034","x":"357365cf"},{"t":"learn","h":"<div class=\"lead\">المقطع التاني (السطور <span dir=\"ltr\">127-135</span>):</div><div class=\"u\"><span class=\"en\">And down the river’s dim expanse, / Like some bold seër in a trance / Seeing all his own mischance— / With a glassy countenance / Did she look to Camelot. / And at the closing of the day / She loosed the chain, and down she lay; / The broad stream bore her far away, / The Lady of Shalott.</span></div>","n":2,"i":44,"a":"analysis-12-035","x":"2bb8ca74"},{"t":"learn","h":"<div class=\"u\">«زي عرّاف جسور في غيبة» <span class=\"en\">(seër in a trance)</span>: هي شايفة مصيرها وهي ماشية ناحيته. و«وش زجاجي» <span class=\"en\">(glassy countenance)</span> — زي المرآة اللي اتشقت.</div>","n":1,"i":45,"a":"analysis-12-036","x":"2523da9c"},{"t":"learn","h":"<div class=\"lead\">المقطع الأخير (السطور <span dir=\"ltr\">163-171</span>):</div><div class=\"u\"><span class=\"en\">Who is this? and what is here? / And in the lighted palace near / Died the sound of royal cheer; / And they crossed themselves for fear, / All the knights at Camelot: / But Lancelot mused a little space; / He said, “She has a lovely face; / God in his mercy lend her grace, / The Lady of Shalott.”</span></div>","n":2,"i":46,"a":"analysis-12-037","x":"e6d26f28"},{"t":"mc","h":"","q":"تعليق لانسلوت الأخير («She has a lovely face») بيعمل إيه؟","opts":["بيلخصها في جمالها وبيوري إنه ما فهمهاش","بيعبر عن حزن عميق","بيعلن حبه ليها"],"ans":0,"why":"بيلخصها في جمالها من غير فهم.","n":1,"i":47,"ex":["صح: السطر بيرجعها لكونها وش جميل، وده أقسى تعليق ممكن بعد موتها.","غلط: «mused a little space» مش حزن عميق، هو تأمل قصير.","غلط: مفيش أي إعلان حب في القصيدة."]},{"t":"learn","h":"<div class=\"u\">الناس بتسأل «مين دي؟ وإيه ده؟» — حتى في الموت هي مجهولة. والخوف بيوقف الاحتفال في القصر.</div>","n":1,"i":48,"a":"analysis-12-038","x":"7dee82c0"},{"t":"learn","h":"<div class=\"u\">وتعليق لانسلوت الوحيد: «عندها وش جميل، وربنا يرحمها». مفيش فهم ولا حزن حقيقي — بس جمال. وده أقسى سطر في القصيدة: اللي ماتت عشان تبص عليه، بيلخصها في وش.</div>","n":1,"i":49,"a":"analysis-12-039","x":"c803244d"},{"t":"section","h":"الأدوات والرمز","n":1,"i":50},{"t":"learn","h":"<div class=\"u\">المرآة والنول: الفن بيشوف الحياة منعكسة، والنسيج هو الشكل اللي بيطلع من الانعكاس. لما بتبص مباشرة، الوسيط بيتكسر — وده رمز لتكلفة معرفة الواقع.</div>","n":1,"i":51,"a":"analysis-12-040","x":"7acde9d4"},{"t":"learn","h":"<div class=\"u\">التكرار: «Shalott» في آخر كل مقطع، و«Camelot» في السطر الخامس، و«four grey walls» — التكرار ده بيعمل إحساس بالرتابة اللي هي فيها.</div>","n":1,"i":52,"a":"analysis-12-041","x":"1289d6b3"},{"t":"learn","h":"<div class=\"u\">الضوء واللون: رمادي وساكت جوه البرج، ودهب ولمعان وضوء لما لانسلوت يظهر. التضاد ده هو اللي بيخلي اللحظة حاسمة.</div>","n":1,"i":53,"a":"analysis-12-042","x":"87eef865"},{"t":"learn","h":"<div class=\"u\">الرمز: بعض القراءات بتشوف الليدي كفنانة معزولة عن الحياة، وبعضها بيشوفها كست في مجتمع بيمنعها من النظر بنفسها، وبعضها بيقراها عن تكلفة المعرفة. القصيدة نفسها بتسيب الرمز مفتوح.</div>","n":1,"i":54,"a":"analysis-12-043","x":"28997ac4"},{"t":"section","h":"الموضوعات","n":1,"i":55},{"t":"learn","h":"<div class=\"u\">الفن والحياة: العزلة بتحمي الفن، بس بتمنعه من الحياة. وأول ما بتحاول تعيش، الفن بتاعها بيتدمر. القصيدة مش بتحل المعادلة، هي بتعرضها.</div>","n":1,"i":56,"a":"analysis-12-044","x":"3f74b369"},{"t":"learn","h":"<div class=\"u\">الممنوع والنظر: اللعنة مش على فعل شر، هي على النظر المباشر. مين اللي حط اللعنة؟ القصيدة مش بتقول — وده اللي بيخليها رمز للسلطة الاجتماعية اللي بتمنع من غير تفسير.</div>","n":1,"i":57,"a":"analysis-12-045","x":"b0b3d2fc"},{"t":"learn","h":"<div class=\"u\">العزلة والموت: الغنا والاسم والقارب — كل وسايل التعبير عندها بتشتغل بعد ما تكون خلصت. القصيدة بتخلي الجمهور يشوفها وهي ميتة، زي ما بيحصل مع كتير من الفنانين.</div>","n":1,"i":58,"a":"analysis-12-046","x":"65e33bb0"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":59},{"t":"recall","h":"","q":"اشرح إزاي القصيدة بتربط بين الفن والعزلة.","a":"الليدي بتنسج «magic web» من صور المرآة: فن مبني على انعكاس العالم مش على التجربة المباشرة. والعزلة هي شرط الشغل ده: أربع حيوط وأربع أبراج، وممنوع تنزل تبص. أول ما بتحس إنها «half sick of shadows» وتقرر تشوف الحياة مباشرة، النسيج بيطير والمرآة بتتشق — يعني الفن بتاعها بيتدمر في نفس لحظة التحرر. والقصيدة بتكمل: بعد موتها الناس بتشوفها كشكل جميل واسم على قارب. فالعزلة بتحمي الفن، والفن بيوصل بعد فوات الأوان.","n":1,"i":60},{"t":"recall","h":"","q":"إيه وظيفة التكرار في القصيدة؟","a":"التكرار في القصيدة على مستويين. الأول بنيوي: كل مقطع بينتهي باسم «The Lady of Shalott»، وكلمة «Camelot» بتيجي في السطر الخامس، فالقصيدة بتدق على نفس الإيقاع تسع سطور بعد تسع سطور — وده بيوحي برتابة حياتها. التاني داخل الصور: «four grey walls, and four grey towers» تكرار الرقم واللون، و«by night and day»، و«She left the web, she left the loom». التكرار ده مش حشو، هو اللي بيدّي إحساس بالحصار، ولما بيتكسر في الجزء الرابع (الجو، الريح، المطر) بنحس إن النظام كله اتهد.","n":1,"i":61},{"t":"write","h":"","q":"حلّل صورة لانسلوت في القصيدة ودورها.","key":"analysis-12:1","a":"لانسلوت بيدخل القصيدة كضجة ضوء: «The sun came dazzling through the leaves, / And flamed upon the brazen greaves». وصفه طويل ومفصّل (اللجام المرصّع، أجراس اللجام، البوق الفضي، السرج المرصّع)، والقصيدة بتبطّأ عشان تخلّي اللحظة حاسمة. وهو بيدخل المرآة «He flashed into the crystal mirror» وبيغني «Tirra lirra» — أغنية خفيفة مش رسالة. دوره في البنية إنه السبب المباشر في كسر اللعنة، لكن القصيدة مش بتديله وعي: آخر تعليق ليه «She has a lovely face» بيحوّلها لوش جميل. يعني هو مش شرير، هو غير منتبه — وده أخطر، لأن اللي بيتفرج على الجمال من غير ما يفهم تكلفته هو نفس النظام اللي حبسها.","n":1,"i":62},{"t":"write","h":"","q":"ناقش إزاي القصيدة بتعرض العلاقة بين الممنوع والمعرفة.","key":"analysis-12:2","a":"الممنوع في القصيدة هو النظر المباشر: «A curse is on her if she stay / To look down to Camelot». والغريب إن اللي حط اللعنة مش معروف — هي سمعت همسة بس، ومش عارفة اللعنة إيه. السلطة هنا مجهولة، وده اللي بيخلي المنع مطلق. والمعرفة بتيجي في لحظة واحدة: لما بتبص، بتعرف اللعنة لأنها نزلت («The curse is come upon me»). فالقصيدة بتربط المعرفة بالعقاب، لكن مش بتحكم عليها بالغلط: الجملة اللي قبلها «I am half sick of shadows» بتخلي القرار مفهوم ومشروع. وبعض القراءات بتشوف إن القصيدة بتحاكم المجتمع اللي بيمنع المعرفة ويحاسب على طلبها، وبعضها بيشوفها عن التكلفة الحتمية لأي معرفة حقيقية. المهم إن القصيدة بتسيب السؤال مفتوح.","n":1,"i":63},{"t":"end","h":"","teaser":"<div class=\"u\">كده The Lady of Shalott خلصت: مرآة، نسيج، تلات خطوات، وقارب بينزل النهر بالاسم المكتوب.</div><div class=\"u\">الدرس الجاي: Crossing the Bar لتينيسون — قصيدة قصيرة عن الموت كعبور.</div>","extra":"المصادر: Tennyson, “The Lady of Shalott” (1832; revised 1842)؛ Malory, Morte d’Arthur (Elaine of Astolat)؛ مصطلحات: pathetic fallacy, iambic tetrameter, refrain.","i":64}];</script>
