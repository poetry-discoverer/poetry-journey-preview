<script>window.LESSON_ID="history-8";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"سنة 1066: الغزو النورماندي وميلاد الإنجليزية الوسيطة\"</div><div class=\"u\"><span class=\"em\"><span class=\"em\">⚔️</span></span> قفلنا محطة العصر القديم. النهاردة نفتح محطة جديدة بأشهر سنة في تاريخ إنجلترا كلها: 1066. معركة واحدة هتغير اللغة والشعر والبلد، وبعدها هتتولد الإنجليزية الوسيطة، اللغة اللي هيكتب بيها <span class=\"en\">Chaucer.</span></div><div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️</span></span>⃣: إيه اللي حصل في 1066؟</div>", "n": 3, "i": 0, "a": "history-8-001", "x": "cae23139"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الحكاية في سطور:</div><div class=\"li\">ملك إنجلترا مات من غير وريث واضح، والعرش بقى عليه عينين.</div><div class=\"li\"><span class=\"en\">William</span> دوق <span class=\"en\">Normandy</span> (في شمال فرنسا) جاب مراكبه وعبّر البحر.</div><div class=\"li\">يوم 14 أكتوبر 1066: معركة <span class=\"en\">Hastings</span> في جنوب إنجلترا. الملك الإنجليزي <span class=\"en\">Harold</span> اتقتل، و<span class=\"en\">William</span> انتصر، وبقى ملك إنجلترا. الناس بتسميه <span class=\"en\">William the Conqueror</span> (ويليام الفاتح).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> ليه دي لحظة مفصلية؟</div>", "n": 4, "i": 1, "a": "history-8-002", "x": "2337e343"}, {"t": "mc", "h": "", "q": "إيه حصل يوم 14 أكتوبر 1066؟", "nq": 1, "opts": ["معركة <span class=\"en\">Hastings</span>: <span class=\"en\">Harold</span> اتقتل و<span class=\"en\">William</span> بقى ملك", "اتولد <span class=\"en\">Chaucer</span>", "اتطبع أول كتاب"], "ans": 0, "why": "معركة <span class=\"en\">Hastings</span>: <span class=\"en\">Harold</span> اتقتل و<span class=\"en\">William</span> بقى ملك", "ex": ["صح: <span class=\"en\">William the Conqueror</span>.", "غلط: <span class=\"en\">Chaucer</span> جه بعد بقرون.", "غلط: مش المذكور."], "i": 2}, {"t": "learn", "h": "<div class=\"li\">مش مجرد ملك جديد: طبقة حاكمة كاملة جديدة، بتتكلم لغة تانية (الفرنسية النورماندية)، هتحل محل النخبة الإنجليزية في البلاط والكنيسة والقانون.</div><div class=\"li\">مثال يومي من تاريخنا: زي لما دولة تحتل بلد واللغة الرسمية في المحاكم والمدارس تتغير. إحنا عارفين الإحساس ده من تاريخنا الحديث كويس.</div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️</span></span>⃣: تلتمية سنة بثلاث لغات <span class=\"em\"><span class=\"em\">🗣️</span></span></div>", "n": 3, "i": 3, "a": "history-8-003", "x": "934548c0"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الخريطة اللغوية بعد الغزو:</div><div class=\"li\">الفرنسية النورماندية: لغة البلاط والطبقة الحاكمة والقانون والأدب الراقي.</div><div class=\"li\">اللاتينية: لغة الكنيسة والعلم والوثائق (زي ما هي في أوروبا كلها).</div><div class=\"li\">الإنجليزية: لغة الناس العادية، في الشارع والحقل والبيت. اتطردت من المحاكم والبرلمان والجامعة لحوالي 300 سنة.</div>", "n": 3, "i": 4, "a": "history-8-004", "x": "979580e9"}, {"t": "mc", "h": "", "q": "بعد الغزو، لغة البلاط والقانون كانت...", "nq": 1, "opts": ["الفرنسية النورماندية", "الإنجليزية", "العربية"], "ans": 0, "why": "الفرنسية النورماندية", "ex": ["صح: والإنجليزية بقت لغة الناس العادية.", "غلط: اتطردت من المحاكم.", "غلط: مش المذكور."], "i": 5}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الحقيقة المهمة:</div><div class=\"li\">الإنجليزية مماتتش، بس بقت لغة \"مش رسمية\". يعني محدش بيعلّمها ولا بيكتب بيها قوانين، فبقت تتغير بحرية زي أي لهجة شعبية من غير حارس.</div><div class=\"li\">وبعد حوالي 3 قرون، لما الإنجليزية رجعت تتوج لغة قومية في نص القرن 14، كانت بقت لغة تانية خالص.</div><div class=\"li\">اسمها الجديد: <span class=\"en\">Middle English</span> (الإنجليزية الوسيطة)، وبنقول تقريباً من 1100 لـ 1500.</div>", "n": 3, "i": 6, "a": "history-8-005", "x": "abdde3a7"}, {"t": "mc", "h": "", "q": "اسم الإنجليزية بعد التغيير ده...", "nq": 1, "opts": ["<span class=\"en\">Middle English</span> (تقريباً من 1100 لـ 1500)", "<span class=\"en\">Old English</span>", "<span class=\"en\">Modern English</span>"], "ans": 0, "why": "<span class=\"en\">Middle English</span> (تقريباً من 1100 لـ 1500)", "ex": ["صح: الإنجليزية الوسيطة.", "غلط: ده اللي قبل.", "غلط: ده اللي بعد."], "i": 7}, {"t": "learn", "h": "<div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️</span></span>⃣: إزاي اللغة اتغيرت بالظبط؟ <span class=\"em\"><span class=\"em\">🔧</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> التغيير 1: النهايات ضاعت</div><div class=\"li\">الإنجليزي القديم كان مليان تصريفات ونهايات للاسم والفعل (حالات إعرابية معقدة). في الفترة دي النهايات دي اتبسطت ومعظمها مات، والمعنى بقى بيتفهم من ترتيب الكلمات.</div><div class=\"li\">مثال يومي: زي الفرق بين الفصحى المليانة إعراب والعامية اللي بتوصل المعنى بترتيب الجملة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> التغيير 2: غزو الكلمات الفرنسية</div>", "n": 5, "i": 8, "a": "history-8-006", "x": "4a0f6b9a"}, {"t": "mc", "h": "", "q": "إيه حصل للنهايات في الإنجليزي القديم؟", "nq": 1, "opts": ["اتبسطت ومعظمها مات، والمعنى بقى من ترتيب الكلمات", "زادت", "ما اتغيرتش"], "ans": 0, "why": "اتبسطت ومعظمها مات، والمعنى بقى من ترتيب الكلمات", "ex": ["صح: التغيير 1.", "غلط: العكس.", "غلط: اتغيرت."], "i": 9}, {"t": "learn", "h": "<div class=\"li\">آلاف الكلمات الفرنسية دخلت الإنجليزية: كلمات قانون وجيش وموضة وأكل ودين.</div><div class=\"li\">أشهر مثال في كتب اللغة، واحفظه: الحيوان الحي اسمه إنجليزي (<span class=\"en\">cow,</span> <span class=\"en\">pig,</span> <span class=\"en\">sheep</span>) لأن اللي بيرعيه فلاح ساكسوني، بس الأكل على السفرة اسمه فرنسي (<span class=\"en\">beef,</span> <span class=\"en\">pork,</span> <span class=\"en\">mutton</span>) لأن اللي بياكله سيد نورماندي.</div><div class=\"li\">الكلمة نفسها بتحكي مين بيشتغل ومين بياكل!</div>", "n": 3, "i": 10, "a": "history-8-007", "x": "0603770d"}, {"t": "mc", "h": "", "q": "ليه <span class=\"en\">cow</span> إنجليزي و<span class=\"en\">beef</span> فرنسي؟", "nq": 1, "opts": ["اللي بيرعى فلاح ساكسوني، واللي بياكل سيد نورماندي", "صدفة", "غلط مطبعي"], "ans": 0, "why": "اللي بيرعى فلاح ساكسوني، واللي بياكل سيد نورماندي", "ex": ["صح: الكلمة نفسها بتحكي مين بيشتغل ومين بياكل.", "غلط: ليها سبب.", "غلط: مش المذكور."], "i": 11}, {"t": "learn", "h": "<div class=\"li\">وفي ثنائيات لحد النهاردة: <span class=\"en\">freedom/liberty</span>، <span class=\"en\">wood/forest.</span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> التغيير 3: مفيش معيار واحد</div><div class=\"li\">اللغة الرسمية القديمة (إنجليزي ويسكس بتاع الملك ألفريد) وقعت من مكانتها، فبقت كل منطقة بتكتب بلهجتها. مفيش \"إنجليزي الملك\" لفترة.</div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️</span></span>⃣: إيه اللي اتكتب في الفترة الانتقالية؟ <span class=\"em\"><span class=\"em\">📜</span></span></div>", "n": 4, "i": 12, "a": "history-8-008", "x": "ec381faa"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> نصوص مفتاحية (احفظ الأسماء دي):</div><div class=\"li\"><span class=\"en\">Peterborough Chronicle</span>: استمرار \"السجلات الأنجلو-ساكسونية\" بالإنجليزي جوه دير، وقف فجأة سنة 1154. آخر نص مهم بالإنجليزي القديم، وبتوّضح فيه اللغة وهي بتتحول تحت عينك.</div><div class=\"li\"><span class=\"en\">Ormulum</span>: نص ديني من النص التاني من القرن 12، كاتبه راهب اسمه <span class=\"en\">Orrm</span>، مشهور بنظام هجاء غريب اخترعه.</div>", "n": 2, "i": 13, "a": "history-8-009", "x": "8790c614"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Layamon's Brut</span>: قصيدة طويلة بتحكي تاريخ بريطانيا الأسطوري، ومن أوائل النصوص اللي بتحكي عن الملك <span class=\"en\">Arthur</span> بالإنجليزي.</div><div class=\"li\"><span class=\"en\">The Owl and the Nightingale</span>: قصيدة ظريفة، مناظرة بين بومة وعندليب، كل واحدة بتدافع عن نفسها. (زي مناظرة بين اتنين في القهوة، بس بشعر!)</div>", "n": 2, "i": 14, "a": "history-8-010", "x": "c6534c83"}, {"t": "mc", "h": "", "q": "<span class=\"en\">The Owl and the Nightingale</span> قصيدة عن...", "nq": 1, "opts": ["مناظرة بين بومة وعندليب", "حرب", "تنين"], "ans": 0, "why": "مناظرة بين بومة وعندليب", "ex": ["صح: كل واحدة بتدافع عن نفسها.", "غلط: مش المذكور.", "غلط: مش المذكور."], "i": 15}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> أهم تغيير في موسيقى الشعر:</div><div class=\"li\">من فرنسا دخلت الإنجليزية حاجتين جداد: القافية في آخر السطر، وعدّ المقاطع.</div><div class=\"li\">يعني بعد قرون من الـ <span class=\"en\">alliteration</span> بس، بقى فيه موسيقى جديدة ممكنة. والاتنين هيعيشوا جنب بعض، وهنشوف الـ <span class=\"en\">alliteration</span> بترجع بقوة في القرن 14.</div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️</span></span>⃣: ليه الدرس ده مهم؟ <span class=\"em\"><span class=\"em\">🌟</span></span></div>", "n": 3, "i": 16, "a": "history-8-011", "x": "b84501b4"}, {"t": "mc", "h": "", "q": "إيه الجديد في موسيقى الشعر من فرنسا؟", "nq": 1, "opts": ["القافية في آخر السطر وعدّ المقاطع", "الـ <span class=\"en\">kenning</span>", "الـ <span class=\"en\">caesura</span>"], "ans": 0, "why": "القافية في آخر السطر وعدّ المقاطع", "ex": ["صح: الحاجتين دول دخلوا من فرنسا.", "غلط: ده من العصر القديم.", "غلط: ده من العصر القديم."], "i": 17}, {"t": "learn", "h": "<div class=\"u\">١. من غير 1066 مكنش هيبقى فيه <span class=\"en\">Chaucer</span> بالشكل اللي هنشوفه: اللغة الجديدة هي اللي هتديه أدواته.</div><div class=\"u\">٢. فكرة عامة في تاريخ الأدب: اللغات بتتغير بالأحداث مش بالقرارات. معركة واحدة غيرت موسيقى الشعر الإنجليزي للأبد.</div><div class=\"u\">٣. افتكر القاعدة الذهبية <span class=\"em\"><span class=\"em\">⭐</span></span>: المره دي مش جيل بيثور على جيل، دي لغة بتثور على لغة. النتيجة: شعر إنجليزي جديد هيتولد في القرن 14.</div>", "n": 3, "i": 18, "a": "history-8-012", "x": "9880afcf"}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين الشعر الإنجليزي القديم (<span class=\"en\">Old English</span>) والإنجليزي الوسيط (<span class=\"en\">Middle English</span>) من حيث الوزن والقافية واللغة.", "a": "<div class=\"u\">الشعر الإنجليزي القديم، زي <span class=\"en\">Beowulf</span>، بُني على الـ <span class=\"en\">alliteration</span>: أربع نبرات رئيسية في السطر، وفاصل (<span class=\"en\">caesura</span>) في النص، وغالباً من غير قافية في آخر السطر. ومن أدواته الـ <span class=\"en\">kennings</span>.</div><div class=\"u\">بعد الغزو النورماندي سنة 1066 دخلت كلمات كتير من الفرنسية، واتغيرت الإنجليزية، واتأثر الشعر بالتقاليد الفرنسية: ظهرت القافية وعدّ المقاطع. و<span class=\"en\">Chaucer</span> بعدها كتب بسطور بقافية على إيقاع قريب من الـ <span class=\"en\">iambic</span>.</div><div class=\"u\">مع كده الـ <span class=\"en\">alliteration</span> ما اختفتش: فيه قصائد وسيطة زي <span class=\"en\">Sir Gawain and the Green Knight</span> اتكتبت بوزن <span class=\"en\">alliterative</span>.</div><div class=\"u\">الخلاصة: القديم نبر وتجانس صوتي، والوسيط خليط بين ده وبين القافية والوزن الفرنسي.</div>", "key": "history-8:CMP", "n": 1, "i": 19}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">👑</span></span> <span class=\"en\">Chaucer</span> ج1: حياته ودنياه، الراجل اللي هيلقبوه أبو الشعر الإنجليزي.", "extra": "", "i": 20}];</script>
