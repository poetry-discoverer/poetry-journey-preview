<script>window.LESSON_ID="history-21", "history-13", "history-14", "history-15", "history-16", "history-17", "history-18", "history-19", "history-20";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"u\">الدرس اللي فات قفلنا السونيتات. وقبل ما نسيب <span class=\"en\">Shakespeare<\/span>، لازم نعترف بحاجة: هو مكانش شاعر سونيتات في الأساس. هو كان راجل مسرح. كتب حوالي سبعة وتلاتين مسرحية، والسونيتات كانت حاجة جانبية، نشرها الناشر سنة 1609، والدارسين مختلفين لو كان ده بإذنه.<\/div><div class=\"u\">والدرس ده عن الشعر اللي الناس سمعته فعلاً في عصره. لأن السونيت كان بيتقرا في غرفة، لكن المسرح كان بيتكلم بصوت عالي قدام آلاف الناس. والشكل اللي خلّى ده ممكن اسمه الشعر المرسل.<\/div>", "n": 2, "a": "history-21-001", "x": "370c20e6", "en": "Last lesson we closed the sonnets. Before leaving Shakespeare: he was mainly a man of the theatre, about thirty-seven plays, and the sonnets were a side thing, published in 1609, and scholars differ on whether with his permission. Today is about the poetry people actually heard, spoken aloud before thousands. The form that made it possible is called blank verse.", "i": 1}, {"t": "section", "h": "النقطة 1: إيه هو الشعر المرسل؟", "i": 2}, {"t": "learn", "h": "<div class=\"u\">📌 التعريف:<\/div><div class=\"li\">الشعر المرسل (<span class=\"en\">blank verse<\/span>) هو شعر بوزن منتظم، لكن من غير قافية.<\/div><div class=\"li\">الوزن: خمس تفعيلات يامبية في السطر. يعني <span class=\"en\">ten syllables<\/span> في الغالب، والنغمة بتطلع وتهبط: <span class=\"en\">da-DUM da-DUM da-DUM da-DUM da-DUM<\/span>.<\/div><div class=\"li\">ومن غير قافية، السطر مش مضطر يقفل على صوت واحد.<\/div>", "n": 4, "a": "history-21-002", "x": "bdeb4521", "en": "Point 1: what is blank verse? Regular metre but no rhyme: five iambs in a line, usually ten syllables, da-DUM five times. Without rhyme the line does not have to end on one sound.", "i": 3}, {"t": "mc", "h": "", "q": "إيه هو الشعر المرسل (<span class=\"en\">blank verse<\/span>)؟", "nq": 1, "opts": ["وزن منتظم من غير قافية", "قافية من غير وزن", "نثر عادي"], "ans": 0, "why": "وزن منتظم من غير قافية", "ex": ["صح: خمس تفعيلات يامبية من غير قافية.", "غلط: عكس التعريف.", "غلط: ده موزون."], "i": 4}, {"t": "learn", "h": "<div class=\"u\">📌 ليه ده مهم في المسرح؟<\/div><div class=\"li\">القافية بتقفل السطر، والقفل ده بيخلّي الكلام يبان \"مكتوب\" ومرتب.<\/div><div class=\"li\">من غير قافية، الكلام بيبان أقرب للكلام العادي، لكنه لسه موزون. يعني بيدّي إحساس إن الشخصية بتتكلم، مش بتقرا.<\/div><div class=\"li\">وكمان: القافية في المسرح بتبان مضحكة لو زادت، لأن الجمهور بيحس إنه بيسمع أغنية مش حوار.<\/div>", "n": 4, "a": "history-21-003", "x": "4d813b48", "en": "Why it matters on stage: rhyme closes a line and makes speech sound written and arranged. Without it the speech sounds closer to ordinary talk but is still measured. A character seems to speak, not read. Too much rhyme in a play can sound like a song, not a dialogue.", "i": 5}, {"t": "tf", "h": "", "q": "من غير قافية، الكلام بيبان أقرب للكلام العادي لكنه لسه موزون.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: وده بيدّي إحساس إن الشخصية بتتكلم.", "غلط: ده بالظبط اللي بيحصل."], "i": 6}, {"t": "learn", "h": "<div class=\"u\">📌 الأصل:<\/div><div class=\"li\">أول استخدام معروف للشعر المرسل في الإنجليزي كان <span class=\"en\">Henry Howard<\/span>، إيرل <span class=\"en\">Surrey<\/span>، في ترجمته للإنيادة، حوالي 1540، واتنشرت بعد موته في خمسينات القرن.<\/div><div class=\"li\">وأول مسرحية إنجليزية بالشعر المرسل هي <span class=\"en\">Gorboduc<\/span> سنة 1561، لـ <span class=\"en\">Thomas Norton<\/span> و<span class=\"en\">Thomas Sackville<\/span>.<\/div><div class=\"li\">ومن 1561، المسرح الإنجليزي خد الشكل ده ومشي، وبقى هو الشكل الغالب في الدراما الجدية.<\/div>", "n": 4, "a": "history-21-004", "x": "5e06c74c", "en": "The origin: the first known English blank verse is by Henry Howard, Earl of Surrey, in his translation of the Aeneid, around 1540, published after his death. The first English play in blank verse is Gorboduc, 1561, by Norton and Sackville. From then on it became the usual form of serious drama.", "i": 7}, {"t": "mc", "h": "", "q": "إيه أول مسرحية إنجليزية بالشعر المرسل؟", "nq": 1, "opts": ["<span class=\"en\">Gorboduc<\/span>", "<span class=\"en\">Hamlet<\/span>", "<span class=\"en\">Tamburlaine<\/span>"], "ans": 0, "why": "<span class=\"en\">Gorboduc<\/span>", "ex": ["صح: <span class=\"en\">Gorboduc<\/span> سنة 1561.", "غلط: <span class=\"en\">Hamlet<\/span> جت بعدها بكتير.", "غلط: <span class=\"en\">Tamburlaine<\/span> جت بعدها."], "i": 8}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: الفرق بين إعلان بيقول \"اشتري، اشتري، والفرحة هتيجي\" وكلام ممثل في مسلسل بيقول \"أنا مش عارف أنا بعمل إيه\". الأول موزون ومقفول، والتاني طبيعي. الشعر المرسل هو التاني، بس بإيقاع محسوب.<\/div>", "n": 1, "a": "history-21-005", "x": "58e387ca", "en": "Everyday example: an advert saying buy, buy, and joy will come, against an actor in a series saying I do not know what I am doing. The first is measured and closed, the second natural. Blank verse is the second, but with a counted rhythm.", "i": 9}, {"t": "section", "h": "النقطة 2: <span class=\"en\">Marlowe<\/span> و\"السطر الجبار\"", "i": 10}, {"t": "learn", "h": "<div class=\"u\">📌 الراجل:<\/div><div class=\"li\"><span class=\"en\">Christopher Marlowe<\/span>، اتولد سنة 1564، نفس سنة <span class=\"en\">Shakespeare<\/span>.<\/div><div class=\"li\">مات سنة 1593، اتقتل في <span class=\"en\">Deptford<\/span> وعمره تسعة وعشرين سنة، وظروف موته لسه مختلف عليها.<\/div><div class=\"li\">وقبل ما يموت، عمل حاجة غيّرت المسرح الإنجليزي.<\/div>", "n": 4, "a": "history-21-006", "x": "8d0ff308", "en": "Point 2: Marlowe. Born 1564, the same year as Shakespeare. Died 1593 in Deptford at twenty-nine, and the circumstances of his death are still disputed. Before that he changed the English stage.", "i": 11}, {"t": "tf", "h": "", "q": "<span class=\"en\">Marlowe<\/span> و<span class=\"en\">Shakespeare<\/span> اتولدوا في نفس السنة.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: 1564.", "غلط: الاتنين 1564."], "i": 12}, {"t": "learn", "h": "<div class=\"u\">📌 <span class=\"en\">Tamburlaine<\/span>:<\/div><div class=\"li\">مسرحية <span class=\"en\">Tamburlaine the Great<\/span>، اتكتبت سنة 1587 أو 1588، وبتتكلم عن تيمورلنك.<\/div><div class=\"li\">والمسرحية دي معروفة كواحدة من أول نجاحات المسرح العام في لندن، ومع <span class=\"en\">Thomas Kyd's The Spanish Tragedy<\/span>.<\/div><div class=\"li\">وأهم حاجة فيها: إنها أثبتت إن الشعر المرسل يقدر يحمل صوت القوة والعنف.<\/div>", "n": 4, "a": "history-21-007", "x": "37215356", "en": "Tamburlaine the Great, written 1587 or 1588, about Timur. It is known as one of the first big successes of the London public theatre, with Kyd's The Spanish Tragedy. Above all it proved blank verse could carry the voice of power and violence.", "i": 13}, {"t": "mc", "h": "", "q": "مسرحية <span class=\"en\">Tamburlaine the Great<\/span> بتتكلم عن مين؟", "nq": 1, "opts": ["تيمورلنك", "الإسكندر الأكبر", "نابليون"], "ans": 0, "why": "تيمورلنك", "ex": ["صح: تيمورلنك.", "غلط: مش الإسكندر.", "غلط: نابليون جه بعدها بقرون."], "i": 14}, {"t": "learn", "h": "<div class=\"u\">📌 البرولوج (المقدمة)، والنص:<\/div><div class=\"u\"><span class=\"en\">From jigging veins of rhyming mother-wits<\/span>,<\/div><div class=\"u\"><span class=\"en\">And such conceits as clownage keeps in pay<\/span>,<\/div><div class=\"u\"><span class=\"en\">We'll lead you to the stately tent of war<\/span>,<\/div><div class=\"u\"><span class=\"en\">Where you shall hear the Scythian Tamburlaine<\/span><\/div><div class=\"u\"><span class=\"en\">Threatening the world with high astounding terms<\/span>,<\/div><div class=\"u\"><span class=\"en\">And scourging kingdoms with his conquering sword<\/span>.<\/div><div class=\"u\"><span class=\"en\">View but his picture in this tragic glass<\/span>,<\/div><div class=\"u\"><span class=\"en\">And then applaud his fortunes as you please<\/span>.<\/div>", "n": 9, "a": "history-21-008", "x": "42f08514", "en": "The prologue text: From jigging veins of rhyming mother-wits, we'll lead you to the stately tent of war, where you shall hear Tamburlaine threatening the world with high astounding terms.", "i": 15}, {"t": "mc", "h": "", "q": "إيه اللي بيقول برولوج <span class=\"en\">Tamburlaine<\/span> إنه هيسيبه؟", "nq": 1, "opts": ["الأوزان المقفّية والمزاح", "الحرب", "الجمهور"], "ans": 0, "why": "الأوزان المقفّية والمزاح", "ex": ["صح: <span class=\"en\">jigging rhyming mother-wits<\/span>.", "غلط: الحرب هي الموضوع.", "غلط: الجمهور مش بيتساب."], "i": 16}, {"t": "learn", "h": "<div class=\"u\">📌 إيه اللي بيقوله؟<\/div><div class=\"li\">\"من الأوزان الراقصة للعقول المقفّية\"، يعني: إحنا بنسيب القافية والمزاح.<\/div><div class=\"li\">\"هنوديك لخيمة الحرب\"، يعني: المسرح بقى مكان جد، مش مكان رقص.<\/div><div class=\"li\">و\"<span class=\"en\">high astounding terms<\/span>\": كلام عالي وصادم.<\/div><div class=\"li\">فالبرولوج ده مش مقدمة، ده إعلان برنامج فني: إحنا بنغيّر الموضة.<\/div>", "n": 5, "a": "history-21-009", "x": "cf5040ea", "en": "What it says: we leave the dancing rhymed verse and the clowning. We lead you to the tent of war. High astounding terms means big, shocking words. So the prologue is an artistic announcement: we are changing fashion.", "i": 17}, {"t": "learn", "h": "<div class=\"u\">📌 الأسلوب:<\/div><div class=\"li\">أسطر طويلة، وأسماء ضخمة، وتهديدات، وأفعال قوية: <span class=\"en\">threatening<\/span>، <span class=\"en\">scourging<\/span>.<\/div><div class=\"li\">والموسيقى مش ناعمة، هي موسيقى طبل.<\/div><div class=\"li\">والنتيجة إن الجمهور بيحس إنه واقف قدام حاجة أكبر منه.<\/div>", "n": 4, "a": "history-21-010", "x": "3c953599", "en": "The style: long lines, huge names, threats, strong verbs like threatening and scourging. The music is not soft, it is drum music. The audience feels it is standing before something bigger than itself.", "i": 18}, {"t": "learn", "h": "<div class=\"u\">📌 الشهادة:<\/div><div class=\"li\"><span class=\"en\">Ben Jonson<\/span>، في قصيدته اللي اتنشرت في الطبعة الأولى من أعمال <span class=\"en\">Shakespeare<\/span> سنة 1623، قال عن <span class=\"en\">Marlowe<\/span>: \"<span class=\"en\">Marlowe's mighty line<\/span>\"، يعني السطر الجبار بتاع <span class=\"en\">Marlowe<\/span>.<\/div><div class=\"li\">وده وصف دقيق: <span class=\"en\">Marlowe<\/span> عمل سطر قوي ومتين.<\/div>", "n": 3, "a": "history-21-011", "x": "79774dc3", "en": "The witness: Ben Jonson, in his poem in the 1623 First Folio, speaks of Marlowe's mighty line. Marlowe made a strong, solid line.", "i": 19}, {"t": "mc", "h": "", "q": "مين اللي قال \"<span class=\"en\">Marlowe's mighty line<\/span>\"؟", "nq": 1, "opts": ["<span class=\"en\">Ben Jonson<\/span>", "<span class=\"en\">Edmund Spenser<\/span>", "<span class=\"en\">Philip Sidney<\/span>"], "ans": 0, "why": "<span class=\"en\">Ben Jonson<\/span>", "ex": ["صح: في قصيدته في <span class=\"en\">Folio<\/span> 1623.", "غلط: مش <span class=\"en\">Spenser<\/span>.", "غلط: مش <span class=\"en\">Sidney<\/span>."], "i": 20}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: فيلم أكشن مفتاحه مشهد انفجار وكاميرا بتلف. أول دقيقة بتقول لك: الفيلم ده كبير. برولوج <span class=\"en\">Tamburlaine<\/span> بيعمل كده بالظبط، بس بالكلام.<\/div>", "n": 1, "a": "history-21-012", "x": "adca4a84", "en": "Everyday example: an action film opens with an explosion and a spinning camera. The first minute tells you this film is big. The Tamburlaine prologue does exactly that, with words.", "i": 21}, {"t": "section", "h": "النقطة 3: <span class=\"en\">Shakespeare<\/span> بياخد الخيط ويلفّه", "i": 22}, {"t": "learn", "h": "<div class=\"u\">📌 البداية:<\/div><div class=\"li\"><span class=\"en\">Shakespeare<\/span> بدأ بالتاريخ والكوميديا، وخد من <span class=\"en\">Marlowe<\/span> الصوت العالي.<\/div><div class=\"li\">ومسرحية <span class=\"en\">Richard III<\/span>، اللي بتتأرخ حوالي 1592-1593، بتبدأ بمونولوج مشهور.<\/div>", "n": 3, "a": "history-21-013", "x": "8c54cd90", "en": "Point 3: Shakespeare takes the thread. He began with histories and comedies and took Marlowe's loud voice. Richard III, around 1592 to 1593, opens with a famous monologue.", "i": 23}, {"t": "learn", "h": "<div class=\"u\">📌 النص (الافتتاحية):<\/div><div class=\"u\"><span class=\"en\">Now is the winter of our discontent<\/span><\/div><div class=\"u\"><span class=\"en\">Made glorious summer by this sun of York<\/span>;<\/div><div class=\"u\"><span class=\"en\">And all the clouds that loured upon our house<\/span><\/div><div class=\"u\"><span class=\"en\">In the deep bosom of the ocean buried<\/span>.<\/div><div class=\"u\"><span class=\"en\">Now are our brows bound with victorious wreaths<\/span>;<\/div><div class=\"u\"><span class=\"en\">Our bruised arms hung up for monuments<\/span>;<\/div><div class=\"u\"><span class=\"en\">Our stern alarums changed to merry meetings<\/span>,<\/div><div class=\"u\"><span class=\"en\">Our dreadful marches to delightful measures<\/span>.<\/div><div class=\"u\"><span class=\"en\">Grim-visaged war hath smoothed his wrinkled front<\/span>;<\/div>", "n": 10, "a": "history-21-014", "x": "2f64f35f", "en": "The opening text: Now is the winter of our discontent made glorious summer by this sun of York, and all the clouds that loured upon our house in the deep bosom of the ocean buried. Now are our brows bound with victorious wreaths, our bruised arms hung up for monuments. Grim-visaged war hath smoothed his wrinkled front.", "i": 24}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">And now, instead of mounting barb<\/span>è<span class=\"en\">d steeds<\/span><\/div><div class=\"u\"><span class=\"en\">To fright the souls of fearful adversaries<\/span>,<\/div><div class=\"u\"><span class=\"en\">He capers nimbly in a lady's chamber<\/span><\/div><div class=\"u\"><span class=\"en\">To the lascivious pleasing of a lute<\/span>.<\/div>", "n": 4, "a": "history-21-015", "x": "93cd6154", "en": "And now, instead of mounting barbed steeds to fright the souls of fearful adversaries, he capers nimbly in a lady's chamber to the lascivious pleasing of a lute.", "i": 25}, {"t": "learn", "h": "<div class=\"u\">📌 إيه اللي بيحصل؟<\/div><div class=\"li\">أول سطرين بيقولوا: الحرب خلصت، والسلام جه. ده كلام احتفالي.<\/div><div class=\"li\">وبعدين الصور بتقلب: الأسلحة بقت آثار، وأجراس الحرب بقت اجتماعات، والحرب نفسها بقت بترقص في غرفة ست.<\/div><div class=\"li\">والسطر الأخير بيوصف الحرب وهي بترقص على <span class=\"en\">lascivious pleasing of a lute<\/span>، يعني متعة شهوانية على صوت العود.<\/div><div class=\"li\">واللي بيتكلم هو <span class=\"en\">Richard<\/span>، وهو مش مبسوط. وغالباً الكلام ده بيتقرا بسخرية، وبعد شوية بيقول إنه مش خلق للسلام، فهو هيبقى شرير.<\/div>", "n": 5, "a": "history-21-016", "x": "9d76fd1b", "en": "What happens: the first lines say the war is over and peace has come, a celebration. Then the images turn: weapons become monuments, war alarms become meetings, war itself dances in a lady's room. The speaker is Richard, and he is unhappy. The speech is usually read as sarcastic, and soon he says he is not made for peace, so he will be a villain.", "i": 26}, {"t": "mc", "h": "", "q": "مين اللي بيتكلم في افتتاحية <span class=\"en\">Richard III<\/span>؟", "nq": 1, "opts": ["<span class=\"en\">Richard<\/span>", "<span class=\"en\">Hamlet<\/span>", "<span class=\"en\">Romeo<\/span>"], "ans": 0, "why": "<span class=\"en\">Richard<\/span>", "ex": ["صح: <span class=\"en\">Richard<\/span> وهو مش مبسوط.", "غلط: <span class=\"en\">Hamlet<\/span> مسرحية تانية.", "غلط: <span class=\"en\">Romeo<\/span> مسرحية تانية."], "i": 27}, {"t": "learn", "h": "<div class=\"u\">📌 الفرق بينه وبين <span class=\"en\">Marlowe<\/span>:<\/div><div class=\"li\">عند <span class=\"en\">Marlowe<\/span>، الصوت العالي بيعلن الحرب، وغالباً بنسمعه بيصدق كلامه.<\/div><div class=\"li\">عند <span class=\"en\">Shakespeare<\/span>، الصوت العالي بيتقال وبعدين بيتكسر. وفي القراءة الشائعة الخطابة بتبقى مادة للسخرية.<\/div><div class=\"li\">وده تطور مهم: الشكل نفسه بقى أداة للشك، مش بس للإعلان.<\/div>", "n": 4, "a": "history-21-017", "x": "b1651c07", "en": "The difference from Marlowe: with Marlowe the loud voice announces war, and we mostly hear a man who believes his words. With Shakespeare the loud voice is spoken and then broken. In the common reading, rhetoric becomes something to mock. The form itself becomes a tool for doubt, not only announcement.", "i": 28}, {"t": "tf", "h": "", "q": "عند <span class=\"en\">Shakespeare<\/span>، الصوت العالي ممكن يتقال وبعدين يتكسر، فالشكل بيبقى أداة للشك.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: ده في القراءة الشائعة.", "غلط: ده فرق مهم بينه وبين <span class=\"en\">Marlowe<\/span>."], "i": 29}, {"t": "learn", "h": "<div class=\"u\">📌 وفرق تاني:<\/div><div class=\"li\"><span class=\"en\">Marlowe<\/span> بيستخدم الشعر المرسل للخطابة.<\/div><div class=\"li\"><span class=\"en\">Shakespeare<\/span> بيستخدمه للتفكير. الشخصية بتفكر بصوت عالي، والجملة بتتغير وهي ماشية.<\/div>", "n": 3, "a": "history-21-018", "x": "a9585606", "en": "Another difference: Marlowe uses blank verse for oratory. Shakespeare uses it for thinking. The character thinks aloud and the sentence changes as it goes.", "i": 30}, {"t": "mc", "h": "", "q": "حسب الدرس، <span class=\"en\">Shakespeare<\/span> بيستخدم الشعر المرسل لإيه؟", "nq": 1, "opts": ["للتفكير بصوت عالي", "للخطابة بس", "للترجمة"], "ans": 0, "why": "للتفكير بصوت عالي", "ex": ["صح: الشخصية بتفكر والجملة بتتغير.", "غلط: الخطابة عند <span class=\"en\">Marlowe<\/span>.", "غلط: الترجمة عند <span class=\"en\">Surrey<\/span>."], "i": 31}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين ترجمة <span class=\"en\">Surrey<\/span> للإنيادة وبرولوج <span class=\"en\">Tamburlaine<\/span>. الاتنين شعر مرسل، لكن كل واحد بيستخدمه لغرض مختلف. إيه الفرق؟", "a": "<div class=\"u\">الشكل واحد تقريباً: أسطر من خمس تفعيلات، من غير قافية. لكن الغرض مختلف تماماً، والفرق ده بيوضح إزاي الشكل الواحد بيتغير لما بيتنقل من مكان لمكان.<\/div><div class=\"u\"><span class=\"en\">Surrey<\/span> كان بيترجم ملحمة لاتينية. والهدف بتاعه غالباً لغوي: إنه يجرّب ويثبت إن الإنجليزي يقدر يحمل وزن الشعر الكلاسيكي من غير ما يحتاج قافية. فالشعر المرسل عنده أداة ترجمة، ووسيلة لنقل نص كبير، والتركيز على الأمانة للمعنى، مش على التأثير في جمهور. والسطر عنده بيشتغل كوحدة نقل، والسؤال اللي بيحكمه هو: هل المعنى وصل؟<\/div><div class=\"u\"><span class=\"en\">Marlowe<\/span> كان بيكتب برولوج لمسرحية، والهدف بتاعه مسرحي: إنه يخلق إحساس بالحجم والخطورة في أول دقيقة. فالشعر المرسل عنده أداة صوت، مش أداة نقل. والبرولوج بيعلن موقف فني: إحنا بنسيب القافية والرقص، وهنقدم لكم حرب. والأسطر عنده طويلة وصاخبة، وفيها أسماء وتهديدات، والهدف مش الأمانة، الهدف التأثير.<\/div><div class=\"u\">والفرق التاني في العلاقة بالجمهور. <span class=\"en\">Surrey<\/span> بيترجم لقراء، والقراءة فعل فردي وصامت. <span class=\"en\">Marlowe<\/span> بيكتب لجمهور مسرح، والجمهور جماعي وصاخب. فالسطر عنده لازم يشتغل في الهوا، ويوصل لآخر الصالة، ويخلّي الناس تسكت. وده بيفسر ليه الكلمات عنده كبيرة: <span class=\"en\">threatening<\/span>، <span class=\"en\">scourging<\/span>، <span class=\"en\">astounding<\/span>. الكلمة الكبيرة هي اللي بتوصل.<\/div><div class=\"u\">والفرق التالت في الاستمرارية. <span class=\"en\">Surrey<\/span> بيفتح باب، لكنه مش بيكتب دراما. <span class=\"en\">Marlowe<\/span> بيدخل الشكل الباب ده، ويثبت إنه صالح للمسرح، وده اللي خلّى <span class=\"en\">Shakespeare<\/span> وغيره يبنوا عليه. فلو <span class=\"en\">Surrey<\/span> هو اللي اخترع الأداة، <span class=\"en\">Marlowe<\/span> هو اللي ورّى الناس إنها بتقطع.<\/div><div class=\"u\">فالخلاصة إن الاتنين بيثبتوا إن الإنجليزي يقدر يعمل شعر كبير من غير قافية. <span class=\"en\">Surrey<\/span> أثبت ده في الترجمة، و<span class=\"en\">Marlowe<\/span> أثبت ده في المسرح. والفرق بينهم هو الفرق بين إنك تفتح الطريق وإنك تمشي فيه.<\/div>", "key": "history-21:W18", "n": 1, "i": 32}, {"t": "section", "h": "النقطة 4: المونولوج: الشكل الغنائي الحقيقي في العصر", "i": 33}, {"t": "learn", "h": "<div class=\"u\">📌 الفكرة:<\/div><div class=\"li\">في المسرح عادةً مفيش سونيت. فيه مونولوج، والراجل لوحده على المسرح بيتكلم.<\/div><div class=\"li\">والمونولوج ده هو المكان اللي الشاعر بيقدر يكتب فيه \"أنا\" بكل تفاصيلها.<\/div><div class=\"li\">فنقدر نقول إن المونولوج خد وظيفة قريبة من وظيفة السونيت: صوت فردي، ومشاعر داخلية، ولغة عالية.<\/div>", "n": 4, "a": "history-21-019", "x": "452a40aa", "en": "Point 4: the monologue. On stage there is usually no sonnet, there is the monologue, a man alone speaking. It is where the poet can write a full I. So we can say the soliloquy took on a function close to the sonnet: an individual voice, inner feeling, high language.", "i": 34}, {"t": "learn", "h": "<div class=\"u\">📌 الفرق بين السونيت والمونولوج:<\/div><div class=\"li\">السونيت غالباً بيخاطب \"أنت\": أنت أحلى من يوم صيف، أنت هتعيش في سطوري.<\/div><div class=\"li\">المونولوج غالباً بيعبّر عن \"أنا\": أنا مش عارف أعمل إيه، أنا خايف، أنا مش نايم.<\/div><div class=\"li\">والسونيت بيتقرا، والمونولوج بيتسمع. والفرق في الوسيط بيغيّر اللغة.<\/div>", "n": 4, "a": "history-21-020", "x": "14d3e8e3", "en": "Sonnet and monologue: the sonnet often addresses a you, you are lovelier than a summer's day. The monologue often expresses an I: I do not know what to do, I am afraid, I cannot sleep. The sonnet is read, the monologue is heard. The medium changes the language.", "i": 35}, {"t": "tf", "h": "", "q": "السونيت غالباً بيتقرا، والمونولوج بيتسمع.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: الوسيط بيغيّر اللغة.", "غلط: ده فرق الوسيط."], "i": 36}, {"t": "learn", "h": "<div class=\"u\">📌 مثال:<\/div><div class=\"li\">في <span class=\"en\">Hamlet<\/span>، المونولوجات هي أهم حاجة في المسرحية، وفيها أسئلة عن الموت والوعي والفعل.<\/div><div class=\"li\">وفي <span class=\"en\">Macbeth<\/span>، المونولوجات بتشتغل على الوقت وعلى الخوف.<\/div><div class=\"li\">ولحد النهارده الناس بتحفظ مونولوجات من المسرحيتين دول.<\/div>", "n": 4, "a": "history-21-021", "x": "61d96b87", "en": "Examples: in Hamlet the monologues are the heart of the play, asking about death, consciousness and action. In Macbeth they work on time and fear. People still memorise soliloquies from these plays today.", "i": 37}, {"t": "mc", "h": "", "q": "المونولوجات في <span class=\"en\">Macbeth<\/span> بتشتغل على إيه حسب الدرس؟", "nq": 1, "opts": ["الوقت والخوف", "الحب والزواج", "الحرب والسلام"], "ans": 0, "why": "الوقت والخوف", "ex": ["صح: الوقت والخوف.", "غلط: مش الحب.", "غلط: مش ده."], "i": 38}, {"t": "learn", "h": "<div class=\"u\">📌 ليه ده مهم لتاريخ الشعر؟<\/div><div class=\"li\">لأن المسرح درّب اللغة الإنجليزية على الحوار الطويل، وعلى تغيير النبرة جوه الجملة، وعلى الكلام اللي بيبني فكرة على المسرح قدام الناس.<\/div><div class=\"li\">والشعر الغنائي بعد كده استفاد من التدريب ده.<\/div>", "n": 3, "a": "history-21-022", "x": "cb10804b", "en": "Why it matters for the history of poetry: the theatre trained English in long dialogue, in changing tone inside a sentence, and in building an idea in front of people. Later lyric poetry used that training.", "i": 39}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: الفرق بين رسالة صوتية بتبعت لصاحبك وبتقول فيها \"إنت وحشتني\"، ومذكرات على الموبايل بتكتبها لنفسك الساعة تلاتة بالليل. التانية أقرب للمونولوج: مفيش حد بيسمع، فالكلام بيطلع صادق ومكركب.<\/div>", "n": 1, "a": "history-21-023", "x": "41a79f3c", "en": "Everyday example: a voice note to a friend saying I miss you, against a note on your phone to yourself at three in the morning. The second is closer to a soliloquy: nobody listens, so it comes out honest and messy.", "i": 40}, {"t": "section", "h": "النقطة 5: السونيت بيدخل المسرحية", "i": 41}, {"t": "learn", "h": "<div class=\"u\">📌 <span class=\"en\">Romeo and Juliet<\/span>:<\/div><div class=\"li\">المسرحية دي حوالي 1595، وفيها حاجة جميلة جداً: البرولوج سونيت كامل.<\/div><div class=\"li\">أربعتاشر سطر، بنفس شكل السونيت الإنجليزي: تلات رباعيات وبيت.<\/div>", "n": 3, "a": "history-21-024", "x": "25625775", "en": "Point 5: the sonnet enters the play. Romeo and Juliet, around 1595, opens with a full sonnet as its prologue: fourteen lines, three quatrains and a couplet.", "i": 42}, {"t": "mc", "h": "", "q": "برولوج <span class=\"en\">Romeo and Juliet<\/span> شكله إيه؟", "nq": 1, "opts": ["سونيت من أربعتاشر سطر", "قصيدة من ست سطور", "نثر"], "ans": 0, "why": "سونيت من أربعتاشر سطر", "ex": ["صح: تلات رباعيات وبيت.", "غلط: مش ست سطور.", "غلط: ده شعر."], "i": 43}, {"t": "learn", "h": "<div class=\"u\">📌 البرولوج:<\/div><div class=\"u\"><span class=\"en\">Two households, both alike in dignity<\/span>,<\/div><div class=\"u\"><span class=\"en\">In fair Verona, where we lay our scene<\/span>,<\/div><div class=\"u\"><span class=\"en\">From ancient grudge break to new mutiny<\/span>,<\/div><div class=\"u\"><span class=\"en\">Where civil blood makes civil hands unclean<\/span>.<\/div><div class=\"u\"><span class=\"en\">From forth the fatal loins of these two foes<\/span><\/div><div class=\"u\"><span class=\"en\">A pair of star-crossed lovers take their life<\/span>;<\/div><div class=\"u\"><span class=\"en\">Whose misadventured piteous overthrows<\/span><\/div><div class=\"u\"><span class=\"en\">Do with their death bury their parents' strife<\/span>.<\/div><div class=\"u\"><span class=\"en\">The fearful passage of their death-marked love<\/span>,<\/div>", "n": 10, "a": "history-21-025", "x": "7acb8cdb", "en": "The prologue: Two households, both alike in dignity, in fair Verona, where we lay our scene, from ancient grudge break to new mutiny, where civil blood makes civil hands unclean. From forth the fatal loins of these two foes a pair of star-crossed lovers take their life.", "i": 44}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">And the continuance of their parents' rage<\/span>,<\/div><div class=\"u\"><span class=\"en\">Which, but their children's end, naught could remove<\/span>,<\/div><div class=\"u\"><span class=\"en\">Is now the two hours' traffic of our stage<\/span>;<\/div><div class=\"u\"><span class=\"en\">The which if you with patient ears attend<\/span>,<\/div><div class=\"u\"><span class=\"en\">What here shall miss, our toil shall strive to mend<\/span>.<\/div>", "n": 5, "a": "history-21-026", "x": "4107ab95", "en": "And the continuance of their parents' rage, which but their children's end naught could remove, is now the two hours' traffic of our stage. The which if you with patient ears attend, what here shall miss, our toil shall strive to mend.", "i": 45}, {"t": "learn", "h": "<div class=\"u\">📌 إيه اللي بيعمله الشكل هنا؟<\/div><div class=\"li\">البرولوج بيقول لك الحكاية كلها في أربعتاشر سطر. يعني القصيدة بتلخص المسرحية قبل ما تبدأ.<\/div><div class=\"li\">والبيت الأخير بيطلب من الجمهور الصبر. يعني الشكل بيشتغل كإعلان وكمدخل.<\/div><div class=\"li\">وفيه حاجة تانية: البرولوج بيقول إن الحكاية \"<span class=\"en\">two hours' traffic of our stage<\/span>\"، يعني ساعتين على المسرح. السونيت نفسه بقى جزء من العرض.<\/div>", "n": 4, "a": "history-21-027", "x": "95c64da6", "en": "What the form does here: the prologue tells the whole story in fourteen lines, so the poem summarises the play before it starts. The last couplet asks the audience for patience, so the form works as an announcement and an entrance. And two hours' traffic of our stage means about two hours. The sonnet itself becomes part of the show.", "i": 46}, {"t": "learn", "h": "<div class=\"u\">📌 والأجمل: السونيت المشترك:<\/div><div class=\"li\">في أول لقاء بين <span class=\"en\">Romeo<\/span> و<span class=\"en\">Juliet<\/span>، الاتنين بيتكلموا في شكل سونيت. السونيت بيتقسم بينهم: رباعية لـ <span class=\"en\">Romeo<\/span>، ورباعية لـ <span class=\"en\">Juliet<\/span>، وبعدين بيتبادلوا السطور لحد البيت الأخير.<\/div><div class=\"li\">أول أربع سطور من <span class=\"en\">Romeo<\/span>:<\/div><div class=\"u\"><span class=\"en\">If I profane with my unworthiest hand<\/span><\/div><div class=\"u\"><span class=\"en\">This holy shrine, the gentle sin is this<\/span>:<\/div><div class=\"u\"><span class=\"en\">My lips, two blushing pilgrims, ready stand<\/span><\/div><div class=\"u\"><span class=\"en\">To smooth that rough touch with a tender kiss<\/span>.<\/div><div class=\"li\">و<span class=\"en\">Juliet<\/span> بترد عليه بنفس الشكل، بنفس الشكل والقافية.<\/div>", "n": 8, "a": "history-21-028", "x": "448552e4", "en": "Even better, the shared sonnet: at their first meeting Romeo and Juliet speak in sonnet form. The sonnet is split between them, a quatrain for Romeo, a quatrain for Juliet, then they trade lines to the end. Romeo's first four lines: If I profane with my unworthiest hand this holy shrine, the gentle sin is this: my lips, two blushing pilgrims, ready stand to smooth that rough touch with a tender kiss. Juliet answers in the same form and rhyme.", "i": 47}, {"t": "learn", "h": "<div class=\"li\">يعني الشكل اللي كان للعاشق لوحده في السونيت، بقى حوار بين اتنين.<\/div>", "n": 1, "a": "history-21-029", "x": "f776a5e6", "en": "So the form that belonged to the lover alone in the sonnet becomes a dialogue between two.", "i": 48}, {"t": "tf", "h": "", "q": "<span class=\"en\">Romeo<\/span> و<span class=\"en\">Juliet<\/span> بيتكلموا في أول لقاء بينهم في شكل سونيت مشترك.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: رباعية لكل واحد وبعدين بيتبادلوا.", "غلط: ده المشهد المشهور."], "i": 49}, {"t": "learn", "h": "<div class=\"u\">📌 ليه ده ذكي؟<\/div><div class=\"li\">لأن <span class=\"en\">Romeo<\/span> و<span class=\"en\">Juliet<\/span> من عيلتين أعداء، ولسه ما يعرفوش ده وقت المشهد.<\/div><div class=\"li\">والسونيت المشترك بيقول حاجة الشكل نفسه: الاتنين بيكمّلوا بعض في الوزن والقافية، حتى لو الدنيا كلها ضدهم.<\/div><div class=\"li\">فالشكل مش وعاء للكلام، الشكل نفسه بيحمل معنى.<\/div>", "n": 4, "a": "history-21-030", "x": "f7d85150", "en": "Why it is clever: Romeo and Juliet come from enemy families and do not yet know it at that moment. The shared sonnet says something the form itself carries: the two complete each other in metre and rhyme, even if the world is against them. The form is not a container for words, the form itself carries meaning.", "i": 50}, {"t": "mc", "h": "", "q": "إيه اللي بيقوله السونيت المشترك عن <span class=\"en\">Romeo<\/span> و<span class=\"en\">Juliet<\/span>؟", "nq": 1, "opts": ["الاتنين بيكمّلوا بعض في الوزن والقافية", "الاتنين بيتخانقوا", "الاتنين ساكتين"], "ans": 0, "why": "الاتنين بيكمّلوا بعض في الوزن والقافية", "ex": ["صح: الشكل نفسه بيحمل معنى.", "غلط: مش خناق.", "غلط: بيتكلموا."], "i": 51}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: لما اتنين بيكتبوا أغنية مع بعض، وواحد بيقول الشطر والتاني بيكمّله. اللي بيحصل مش بس كلام، ده إحساس إنهم على نفس الموجة. المشهد بتاع <span class=\"en\">Romeo<\/span> و<span class=\"en\">Juliet<\/span> شغال بنفس المنطق.<\/div>", "n": 1, "a": "history-21-031", "x": "9ed515f5", "en": "Everyday example: two people writing a song together, one says the first line and the other completes it. It is not only words, it is a feeling of being on the same wave. The Romeo and Juliet scene works the same way.", "i": 52}, {"t": "section", "h": "النقطة 6: إيه اللي العصر ده عمله في الشعر الإنجليزي؟", "i": 53}, {"t": "learn", "h": "<div class=\"u\">📌 تلات حاجات:<\/div><div class=\"li\">الشعر المرسل بقى الشكل الأساسي للكتابة الجدية، ومش بس في المسرح. <span class=\"en\">Milton<\/span> بعد كده هيكتب <span class=\"en\">Paradise Lost<\/span> بيه.<\/div><div class=\"li\">المسرح بقى سوق كبير: الجمهور بيدفع تذكرة، وكتير من الشعر الغنائي كان بيتداول في نسخ مكتوبة بخط اليد وكتب صغيرة.<\/div><div class=\"li\">والشعر اتعلم من المسرح الحوار والحركة: الجملة بتبقى فعل، مش وصف.<\/div>", "n": 4, "a": "history-21-032", "x": "c3c5121c", "en": "Point 6: what this age did to English poetry. Three things. Blank verse became the main form for serious writing, not only in theatre: Milton will write Paradise Lost in it. The theatre became a big market: the audience pays a ticket, while much lyric poetry circulated in handwritten copies and small books. And poetry learned dialogue and movement from the stage: the sentence becomes action, not description.", "i": 54}, {"t": "mc", "h": "", "q": "مين هيكتب <span class=\"en\">Paradise Lost<\/span> بالشعر المرسل؟", "nq": 1, "opts": ["<span class=\"en\">Milton<\/span>", "<span class=\"en\">Donne<\/span>", "<span class=\"en\">Spenser<\/span>"], "ans": 0, "why": "<span class=\"en\">Milton<\/span>", "ex": ["صح: <span class=\"en\">Milton<\/span>.", "غلط: <span class=\"en\">Donne<\/span> هو الدرس الجاي.", "غلط: <span class=\"en\">Spenser<\/span> كتب بمقطع سبنسر."], "i": 55}, {"t": "learn", "h": "<div class=\"u\">📌 ونتيجة عكسية:<\/div><div class=\"li\">المسرح خد من السونيت حاجة كمان: الصورة المكثفة. مسرحيات <span class=\"en\">Shakespeare<\/span> مليانة صور من نوع الصور اللي في السونيتات.<\/div><div class=\"li\">والاتجاه ده هو اللي هيدخل القرن السبعتاشر: كتير من الدارسين بيشوفوا إن <span class=\"en\">John Donne<\/span> أخد من المسرح نبرة الكلام المباشر ودخّلها في القصيدة الغنائية، وده موضوع الدرس الجاي.<\/div>", "n": 3, "a": "history-21-033", "x": "856a72e4", "en": "A side effect: the theatre took from the sonnet its dense image, and Shakespeare's plays are full of sonnet-type images. Many scholars see John Donne taking from the theatre the tone of direct speech and bringing it into lyric poetry. That is the next lesson.", "i": 56}, {"t": "learn", "h": "<div class=\"u\">📌 والدرس العملي:<\/div><div class=\"li\">لو حد سألك \"إيه أهم شكل شعري في العصر الإليزابيثي؟\" الجواب مش السونيت. ممكن تقول الشعر المرسل، لأنه شكل المسرح، والمسرح كان من أهم اللي درّب اللغة.<\/div>", "n": 2, "a": "history-21-034", "x": "a00594e9", "en": "The practical lesson: if someone asks what the most important poetic form of the Elizabethan age is, the answer is not the sonnet. You can say blank verse, because it was the form of the theatre, and the theatre was one of the main things that trained the language.", "i": 57}, {"t": "tf", "h": "", "q": "حسب الدرس، السونيت هو أهم شكل شعري في العصر الإليزابيثي.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: الدرس بيقول الشعر المرسل.", "صح: العكس."], "i": 58}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين سونيت 18 لـ <span class=\"en\">Shakespeare<\/span> والبرولوج بتاع <span class=\"en\">Romeo and Juliet<\/span>. الاتنين سونيت، لكن واحد بيتقرا والتاني بيتقال على المسرح. إيه اللي بيتغير في الشكل؟", "a": "<div class=\"u\">الشكل واحد: أربعتاشر سطر، تلات رباعيات وبيت. لكن الوظيفة مختلفة، والوظيفة بتغيّر كل حاجة تانية: المخاطَب، والنبرة، والعلاقة بالوقت.<\/div><div class=\"u\">سونيت 18 بيخاطب شخص واحد: \"أشبهك بيوم صيف؟\". القصيدة حوار بين اتنين، واحد بيتكلم وواحد ساكت، والكلام مبني على المدح والوعد. والزمن في القصيدة طويل: \"طول ما فيه ناس بتتنفس\"، يعني القصيدة بتتكلم عن قرون. والقارئ بيقرا لوحده، فيقدر يوقف ويقرا السطر مرتين.<\/div><div class=\"u\">البرولوج بتاع <span class=\"en\">Romeo and Juliet<\/span> بيخاطب جمهور. مفيش \"أنت\" واحد، فيه \"<span class=\"en\">you<\/span>\" جمع، وفيه طلب مباشر: \"لو عندكم صبر، اسمعوا\". والزمن قصير جداً: \"<span class=\"en\">two hours' traffic of our stage<\/span>\"، يعني ساعتين وبس. والقارئ هنا مش قارئ، ده متفرج قاعد في النور، والسطر بيعدي ومش هيرجع.<\/div><div class=\"u\">والفرق التاني في نوع الكلام. سونيت 18 كلام مدح، ومبني على صورة واحدة كبيرة: الصيف. والبرولوج كلام تلخيص: بيقول لك الحكاية كلها، من الخلاف القديم لحد موت الاتنين. فالقصيدة الأولى بتوسّع لحظة، والتانية بتضغط حكاية كاملة في أربعتاشر سطر.<\/div><div class=\"u\">والفرق التالت في النهاية. سونيت 18 بيقفل على وعد: القصيدة هتديك حياة. والبرولوج بيقفل على طلب: سامحونا لو قصّرنا. الأول وعد فني، والتاني اعتذار مسرحي. وده يوضح إن نفس الشكل لما بيتنقل من الصفحة للمسرح، بيفقد بعض سلطته وبيكسب وظيفة جديدة: إنه يخدم حكاية أكبر منه.<\/div><div class=\"u\">فالخلاصة إن السونيت في الصفحة بطل، والسونيت في المسرح خادم. والاتنين فن، لكن الأول بيقول \"أنا\"، والتاني بيقول \"اتفرجوا\".<\/div>", "key": "history-21:W34", "n": 1, "i": 59}, {"t": "end", "h": "", "teaser": "الدرس الجاي: القرن السبعتاشر بيبدأ، <span class=\"en\">John Donne<\/span>، والشعر الميتافيزيقي، وإزاي قصيدة حب بقت بتحتج بالعلم والفلسفة.", "extra": "", "i": 60}];</script>
