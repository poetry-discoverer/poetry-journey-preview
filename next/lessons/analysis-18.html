<script>window.LESSON_ID="analysis-18";window.STEPS=[{"t":"learn","h":"<div class=\"u\">الدرس اللي فات: غرفة، ذبابة، وفشل الرؤية. الدرس ده نفس الشاعرة، ونفس الموضوع، لكن الموت هنا مهذّب وبيركب عربية.</div><div class=\"u\">القصيدة: Because I could not stop for Death — ست رباعيات، والراوي بتحكي رحلتها.</div>","n":2,"i":0,"a":"analysis-18-001","x":"ca3c461b"},{"t":"mc","h":"","q":"الموت بيتصور في القصيدة إزاي؟","opts":["سيد مهذّب جه يستناها وبيركبها في عربية","وحش بيرعبها","طبيب"],"ans":0,"why":"سيد مهذّب في رحلة عربية.","n":1,"i":1,"ex":["صح: «He kindly stopped for me» و«For His Civility» — الأدب هو مفتاح الشخصية.","غلط: مفيش أي عنف في القصيدة.","غلط: مفيش طبيب ولا مشهد مرض."]},{"t":"section","h":"السياق","n":1,"i":2},{"t":"learn","h":"<div class=\"u\">القصيدة من حوالي 1863، ورقمها 479 عند فرانكلين و712 عند جونسون. زي القصيدة اللي فاتت، النص ليه ترقيمين ونسخ مختلفة.</div>","n":1,"i":3,"a":"analysis-18-002","x":"0968045f"},{"t":"learn","h":"<div class=\"u\">الفكرة الأساسية: الموت مش وحش بياخد الروح بالقوة، هو سيد مهذّب جه يستنى. والقصيدة كلها رحلة عربية، مفيش فيها صراع ولا مقاومة.</div>","n":1,"i":4,"a":"analysis-18-003","x":"52e96ee5"},{"t":"learn","h":"<div class=\"u\">الشكل: ست رباعيات، وزن قريب من الترانيم، وقوافي ناقصة (me/Immortality، haste/Civility). والشرطات موجودة زي كل قصايد ديكنسون.</div>","n":1,"i":5,"a":"analysis-18-004","x":"0869ac22"},{"t":"section","h":"المقطع الأول (<span dir=\"ltr\">1-4</span>)","n":1,"i":6},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">Because I could not stop for Death – / He kindly stopped for me – / The Carriage held but just Ourselves – / And Immortality.</span></div>","n":2,"i":7,"a":"analysis-18-005","x":"77beacd3"},{"t":"learn","h":"<div class=\"u\">«لإني مقدرتش أقف للموت، هو بلطف وقف ليّا»: قلب كامل للأدوار. اللي بيتوقف مش هي، هو الموت. وكلمة <span class=\"en\">kindly</span> هي اللي بتبني الشخصية كلها.</div>","n":1,"i":8,"a":"analysis-18-006","x":"d8e3bfa0"},{"t":"learn","h":"<div class=\"u\">«العربية ما كانتش شايلة غيرنا إحنا — والخلود»: تلات مسافرين، والخلود راكب معاهم من أول لحظة. يعني الموت مش نهاية، هو مركبة.</div>","n":1,"i":9,"a":"analysis-18-007","x":"d96866b3"},{"t":"learn","h":"<div class=\"u\">وكلمة <span class=\"en\">Ourselves</span> بحرف كبير: الشاعرة والموت بقوا «إحنا». العلاقة بينهم مش عداوة، هي صحبة في سفر.</div>","n":1,"i":10,"a":"analysis-18-008","x":"22781ce9"},{"t":"section","h":"المقطع التاني (<span dir=\"ltr\">5-8</span>)","n":1,"i":11},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">5-8</span>:</div><div class=\"u\"><span class=\"en\">We slowly drove – He knew no haste / And I had put away / My labor and my leisure too, / For His Civility –</span></div>","n":2,"i":12,"a":"analysis-18-009","x":"02b1939d"},{"t":"learn","h":"<div class=\"u\">«مشينا بالراحة — هو ما كانش يعرف العجلة»: الموت مش مستعجل. الإيقاع نفسه بطيء، والقافية الناقصة بتخلي الحركة أهدى.</div>","n":1,"i":13,"a":"analysis-18-010","x":"4eb9e4cc"},{"t":"learn","h":"<div class=\"u\">«وكنت سبت شغلي وفراغي كمان، عشان تهذيبه»: هي تركت الحياة كلها — مش الشغل الصعب بس، ولا الراحة كمان. الحياة كلها اتحطت جانبًا مقابل أدبه.</div>","n":1,"i":14,"a":"analysis-18-011","x":"e5c2a430"},{"t":"learn","h":"<div class=\"u\">وده استسلام مش خوف: مفيش مقاومة ولا حتى حزن. القصيدة بتقدّم الموت كأدب <span class=\"en\">(Civility)</span>، والرد عليها كمان أدب.</div>","n":1,"i":15,"a":"analysis-18-012","x":"81b9e166"},{"t":"section","h":"المقطع التالت (<span dir=\"ltr\">9-12</span>)","n":1,"i":16},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">9-12</span>:</div><div class=\"u\"><span class=\"en\">We passed the School, where Children strove / At Recess – in the Ring – / We passed the Fields of Gazing Grain – / We passed the Setting Sun –</span></div>","n":2,"i":17,"a":"analysis-18-013","x":"1f469d69"},{"t":"learn","h":"<div class=\"u\">تلات مشاهد بترتيب العمر: المدرسة والأطفال بيلعبوا (الطفولة)، حقول الحبوب «اللي بتبص» (النضج والحصاد)، والشمس الغاربة (آخر النهار).</div>","n":1,"i":18,"a":"analysis-18-014","x":"e286beb3"},{"t":"tf","h":"","q":"الرحلة في القصيدة بتعدي على مراحل العمر.","ans":true,"why":"صح: المدرسة والأطفال (الطفولة)، حقول الحبوب (النضج)، والشمس الغاربة (آخر النهار).","n":1,"i":19,"ex":["صح، الجملة صح: التلات مشاهد بترتيب العمر.","غلط. الترتيب واضح في المقطع التالت."]},{"t":"learn","h":"<div class=\"u\">والتكرار «We passed» تلات مرات هو اللي بيعمل إحساس بالمرور. مفيش توقف، والشاعرة بتتفرج على حياتها وهي بتعدي من جنبها.</div>","n":1,"i":20,"a":"analysis-18-015","x":"ab750001"},{"t":"learn","h":"<div class=\"u\">و«الحقول اللي بتبص» <span class=\"en\">(Gazing Grain)</span>: تشخيص غريب — الحبوب بتبصلها وهي ماشية. كأن الطبيعة نفسها بتودّعها.</div>","n":1,"i":21,"a":"analysis-18-016","x":"d0638c06"},{"t":"section","h":"المقطع الرابع (<span dir=\"ltr\">13-16</span>)","n":1,"i":22},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">13-16</span>:</div><div class=\"u\"><span class=\"en\">Or rather – He passed Us – / The Dews drew quivering and chill – / For only Gossamer, my Gown – / My Tippet – only Tulle –</span></div>","n":2,"i":23,"a":"analysis-18-017","x":"7192e830"},{"t":"tf","h":"","q":"الهدوم اللي لابساها مناسبة لجو الموت البارد.","ans":false,"why":"غلط: «only Gossamer, my Gown – / My Tippet – only Tulle» — هدوم شفافة جدًا، والندى بارد. المفارقة مقصودة.","n":1,"i":24,"ex":["غلط. الهدوم خفيفة والبرد واضح — ده تناقض مقصود.","صح، الجملة غلط: هي مش مستعدة للبرد."]},{"t":"learn","h":"<div class=\"u\">«أو بالأحرى — هو عدّى علينا»: تصحيح مفاجئ. مش إحنا اللي عدّينا على الشمس، الشمس هي اللي عدّت علينا. الزمن هو اللي بيمشي، وإحنا اللي واقفين.</div>","n":1,"i":25,"a":"analysis-18-018","x":"e7d8f0c5"},{"t":"mc","h":"","q":"«Or rather — He passed Us» بتصحح إيه؟","opts":["إن الشمس/الزمن هو اللي عدّى عليهم، مش هم اللي عدّوا عليه","إن العربية اتأخرت","إنها نسيت الطريق"],"ans":0,"why":"إن الزمن هو اللي عدّى عليهم.","n":1,"i":26,"ex":["صح: التصحيح بيحول الحركة من فاعلة لمفعول به — الزمن هو اللي بيمشي.","غلط: مفيش كلام عن تأخير.","غلط: مفيش نسيان؛ التصحيح دقيق ومقصود."]},{"t":"learn","h":"<div class=\"u\">وبعدين البرد: «الندى بقى راجف وبارد». الجو اتغير فجأة، وده أول إحساس بالموت الحقيقي بعد الأدب والرحلة الهادية.</div>","n":1,"i":27,"a":"analysis-18-019","x":"80f21db5"},{"t":"learn","h":"<div class=\"u\">«لأن فستاني كان شفاف، وشالي كان تول بس»: هدوم خفيفة جدًا. المفارقة إنها خرجت للرحلة بأخف هدوم، والموت بارد. مش مستعدة، ومع ذلك ماشية.</div>","n":1,"i":28,"a":"analysis-18-020","x":"5ac43219"},{"t":"section","h":"المقطع الخامس (<span dir=\"ltr\">17-20</span>)","n":1,"i":29},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">17-20</span>:</div><div class=\"u\"><span class=\"en\">We paused before a House that seemed / A Swelling of the Ground – / The Roof was scarcely visible – / The Cornice – in the Ground –</span></div>","n":2,"i":30,"a":"analysis-18-021","x":"664aaa22"},{"t":"mc","h":"","q":"«a House that seemed / A Swelling of the Ground» إيه ده؟","opts":["القبر، بتعبير ملطف","بيت طفولتها","مزرعة"],"ans":0,"why":"القبر بتعبير ملطف.","n":1,"i":31,"ex":["صح: الوصف لكومة تراب فيها باب مسقوف — القبر من غير كلمة «قبر».","غلط: مفيش إشارة لطفولة هنا.","غلط: الحقول كانت في المقطع التالت، مش هنا."]},{"t":"learn","h":"<div class=\"u\">«وقفنا قدام بيت شبه انتفاخة في الأرض»: ده القبر، بس مفيش كلمة «قبر» في القصيدة. التعبير الملطف <span class=\"en\">(euphemism)</span> بيسيب المشهد غامض وهادي في نفس الوقت.</div>","n":1,"i":32,"a":"analysis-18-022","x":"4b9e16de"},{"t":"learn","h":"<div class=\"u\">والبيت بيوصف زي عمارة: سطحه بالعافية يبان، والكورنيش <span class=\"en\">(Cornice)</span> مدفون في الأرض. القبر بيتحول لبيت، والبيت بيغرق في التراب.</div>","n":1,"i":33,"a":"analysis-18-023","x":"cbab6187"},{"t":"section","h":"المقطع السادس (<span dir=\"ltr\">21-24</span>)","n":1,"i":34},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">21-24</span>:</div><div class=\"u\"><span class=\"en\">Since then – ’tis Centuries – and yet / Feels shorter than the Day / I first surmised the Horses’ Heads / Were toward Eternity –</span></div>","n":2,"i":35,"a":"analysis-18-024","x":"cdb789be"},{"t":"learn","h":"<div class=\"u\">«من ساعتها — بقت قرون — ومع كده بتحس أقصر من اليوم»: الزمن بيتقلب. القرون أقصر من يوم واحد، وده لأن المقياس اتغير.</div>","n":1,"i":36,"a":"analysis-18-025","x":"2421e21c"},{"t":"mc","h":"","q":"آخر مقطع بيقول إيه عن الزمن؟","opts":["القرون بتحس أقصر من يوم واحد","الزمن بيساوي بين كل الأيام","الزمن وقف"],"ans":0,"why":"القرون بقت أقصر من يوم.","n":1,"i":37,"ex":["صح: «’tis Centuries – and yet / Feels shorter than the Day» — المقياس اتغير بعد الموت.","غلط: مفيش مساواة؛ فيه انقلاب في الإحساس.","غلط: الزمن مش واقف، هو اللي بيمشي وإحنا اللي واقفين."]},{"t":"learn","h":"<div class=\"u\">واليوم المقصود هو اليوم اللي فهمت فيه أول مرة إن روس الخيول متجهة للأبدية. لحظة الإدراك هي اللي بقت المقياس، مش المدة.</div>","n":1,"i":38,"a":"analysis-18-026","x":"f5cd741d"},{"t":"learn","h":"<div class=\"u\">وآخر كلمة: «الأبدية» <span class=\"en\">(Eternity)</span>. القصيدة بدأت بالخلود كراكب في العربية، وخلصت بالأبدية كاتجاه — نفس الفكرة في الأول وفي الآخر.</div>","n":1,"i":39,"a":"analysis-18-027","x":"9e5215d3"},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":40},{"t":"learn","h":"<div class=\"u\">التشخيص <span class=\"en\">(personification)</span>: الموت سيد مهذّب، والشمس بتبص، والحبوب بتعدي. القصيدة كلها بتحوّل المجردات لشخصيات بتتحرك.</div>","n":1,"i":41,"a":"analysis-18-028","x":"764283ad"},{"t":"learn","h":"<div class=\"u\">التعبير الملطف <span class=\"en\">(euphemism)</span>: «بيت»، «انتفاخة في الأرض»، «رحلة». الموت مش مسمّى بالاسم في أي مشهد من مشاهد النهاية، وده اللي بيخلي القصيدة هادية في ظاهرها.</div>","n":1,"i":42,"a":"analysis-18-029","x":"d0903b51"},{"t":"learn","h":"<div class=\"u\">البنية: من العربية، للطريق، لتصحيح الاتجاه، للبرد، للبيت، للزمن. الحركة بتوصل لمكان، وبعدها القصيدة بتخرج من الزمن نفسه في المقطع الأخير.</div>","n":1,"i":43,"a":"analysis-18-030","x":"f3688f01"},{"t":"learn","h":"<div class=\"u\">الموضوعات: الموت كرحلة مش نهاية، والخلود كرفيق، والزمن نسبي، والاستسلام المهذّب. وبعض القراءات بتشوف إن الهدوء ده مفارقة قاسية، لأن البرد والهدوم الخفيفة بيوروا إن الموت مش لطيف زي ما بان.</div>","n":1,"i":44,"a":"analysis-18-031","x":"60415919"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":45},{"t":"recall","h":"","q":"اشرح مراحل الرحلة ومعانيها.","a":"الرحلة بتبدأ بالعربية اللي فيها تلات: الشاعرة والموت والخلود. بعدين المشي البطيء وترك الشغل والراحة. بعد كده تلات مشاهد من النافذة: المدرسة والأطفال بيلعبوا (الطفولة)، حقول الحبوب (النضج والحصاد)، والشمس الغاربة (نهاية النهار/العمر). وبعدين تصحيح مهم: «Or rather — He passed Us» — الزمن هو اللي بيمشي عليهم. والبرد والندى والهدوم الخفيفة بيحطوا أول إحساس حقيقي بالموت. وبعدها التوقف قدام «بيت» هو القبر. وآخر مقطع بيحوّل كل ده لزمن متقلب: قرون بتحس أقصر من يوم الإدراك.","n":1,"i":46},{"t":"recall","h":"","q":"ليه القصيدة بتوصف الموت بالتهذيب؟","a":"التهذيب هو اللي بيدّي القصيدة توترها. لو الموت كان وحش، القصيدة كانت بقت قصة رعب عادية. لكن هنا الموت «kindly» وعنده «Civility»، والرحلة بطيئة، والطريق فيه مناظر جميلة. والنتيجة إن الشاعرة بتسيب الحياة كلها (شغلها وراحتها) من غير مقاومة. لكن في نفس الوقت القصيدة بتحط تفاصيل بتخالف الهدوء ده: ندى بارد، وهدوم شفافة مش مناسبة. فالأدب ممكن يكون حقيقي، وممكن يكون قناع. وبعض القراءات بتشوف إن المفارقة دي هي الفكرة: الموت مؤدب لأنه مش بيستأذن.","n":1,"i":47},{"t":"write","h":"","q":"حلّل شخصية الموت في القصيدة.","key":"analysis-18:1","a":"الموت في القصيدة شخصية كاملة، مش رمز مجرد. أول مرة بيظهر كسيد مؤدب: «He kindly stopped for me». وبعدين بيبان إنه بيعرف يسوق بهدوء («He knew no haste»)، وإنه بيلتزم بأدب («For His Civility»). وفي المقطع الرابع بيظهر كقوة طبيعية: «He passed Us» — هو اللي عدّى، مش هي. ووظيفته البنيوية إنه السواق والدليل: هو اللي بياخدها في الطريق اللي بتشوف فيه حياتها. والخلود راكب معاهم من الأول، فالشخصية مش نهاية الطريق، هي وسيلة. وبعض القراءات بتشوف إن الأدب ده هو اللي بيمنع القصيدة من الحزن المباشر، وبعضها بتشوفه تهكمًا هادي: الموت بيعاملها بلطف وهو واخدها لمكان بارد.","n":1,"i":48},{"t":"write","h":"","q":"ناقش استخدام التعبيرات الملطفة في القصيدة.","key":"analysis-18:2","a":"القصيدة مبتقولش «قبر» ولا «موت» في مشهد النهاية. التعبير الأساسي هو البيت: «a House that seemed / A Swelling of the Ground»، وبعده وصف معماري — سطح بالعافية يبان، وكورنيش مدفون. التعبير الملطف بيعمل حاجتين: بيحافظ على هدوء النبرة، وبيخلي المشهد مقبول بصريًا. وكمان كلمة «Carriage» نفسها ملطفة: الموت مش بياخدها، هو بياخدها في مشوار. لكن اللطف ده مش تغييب للحقيقة: التفاصيل بتكشف كل حاجة (ندى بارد، هدوم شفافة، بيت تحت الأرض). فالتلطيف هنا أسلوب سرد مش إنكار — وبعض القراءات بتشوف إنه الطريقة الوحيدة إن الراوي تحكي تجربة موتها وهي جواها.","n":1,"i":49},{"t":"write","h":"","q":"<b>مقارنة:</b> قارن بين <span class=\"en\">Crossing the Bar</span> لتينيسون و<span class=\"en\">Because I could not stop for Death</span> لديكنسون في طريقة تصوير الموت.","a":"<div class=\"u\">عند <span class=\"en\">Tennyson</span> الموت عبور بحري: المتكلم ما يريدش حزن عند الوداع (<span class=\"en\">no moaning of the bar</span>)، وبيتمنى يشوف الـ <span class=\"en\">Pilot</span> وجهاً لوجه. الجو هادي ومطمئن، والموت رحلة بإرادة المتكلم تقريباً.</div><div class=\"u\">عند <span class=\"en\">Dickinson</span> الموت سائق مؤدب بعربية، والمتكلمة هي اللي ما وقفتش (<span class=\"en\">I could not stop</span>)، فهي سلبية والموت هو اللي بيقود. الرحلة بتعدّي على المدرسة والحقول وغروب الشمس، وبتنتهي عند بيت تحت الأرض، والآخر مفتوح على <span class=\"en\">Eternity</span>.</div><div class=\"u\">التشابه: الموت رحلة. الفرق: عند <span class=\"en\">Tennyson</span> فيها إيمان واستسلام واضح، وعند <span class=\"en\">Dickinson</span> فيها هدوء ظاهري وغموض.</div><div class=\"u\">الخلاصة: نفس الفكرة، بنبرتين مختلفتين.</div>","key":"analysis-18:CMP","n":1,"i":50},{"t":"end","h":"","teaser":"<div class=\"u\">كده Because I could not stop for Death خلصت: عربية بطيئة، مراحل العمر من الشباك، وبيت تحت الأرض.</div><div class=\"u\">الدرس الجاي: I Hear America Singing لوالتمن — أمريكا وهي بتغني بشغل الناس.</div>","extra":"المصادر: Emily Dickinson, “Because I could not stop for Death” (c. 1863; Franklin 479 / Johnson 712)؛ مصطلحات: personification, euphemism, slant rhyme, allegory.","i":51}];</script>
