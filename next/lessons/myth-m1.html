<script>window.LESSON_ID="myth-m1";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 1) يعني إيه أسطورة (<span class=\"en\">myth</span>)؟</div><div class=\"u\">حكاية قديمة عن آلهة وأبطال وكائنات خارقة، اتوارثتها الشعوب عشان تشرح العالم: الخلق، الموت، الحب، الفصول، العقاب. مش مجرد حدوتة: الأسطورة كانت الدين والعلم والأدب بتاع الإغريق والرومان.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 2) ليه الشعراء الإنجليز مهووسين بيها؟</div>", "n": 3, "i": 0, "a": "myth-m1-001", "x": "9b9aecc3"}, {"t": "mc", "h": "", "q": "الأسطورة (<span class=\"en\">myth</span>) هي...", "nq": 1, "opts": ["حكاية قديمة عن آلهة وأبطال، بتشرح العالم زي الخلق والموت والحب", "خبر النهارده في الجرنال", "قصيدة بقافية <span class=\"en\">AABB</span>"], "ans": 0, "why": "حكاية قديمة عن آلهة وأبطال، بتشرح العالم زي الخلق والموت والحب", "ex": ["صح: حكاية قديمة اتوارثتها الشعوب عشان تشرح العالم.", "غلط: الأسطورة حكاية قديمة مش خبر.", "غلط: الأسطورة نوع حكاية مش نظام قافية."], "i": 1}, {"t": "learn", "h": "<div class=\"li\">الشاعر الإنجليزي من العصور الوسطى للقرن العشرين اتربى على اللاتيني واليوناني، فالأساطير دي كانت \"القاموس المشترك\" بينه وبين قارئه — زي ما انت وصحابك عندكم أفلام وأغانٍ مشتركة، كلمة منها بتفهمهم قصيدة كاملة.</div><div class=\"li\">لما يقول \"<span class=\"en\">Hector</span>\" فهو مختصر صفحة كاملة من المعنى في كلمة: البطولة والشرف والموت.</div>", "n": 2, "i": 2, "a": "myth-m1-002", "x": "44ad122e"}, {"t": "learn", "h": "<div class=\"li\">الأسطورة بتديه صور جاهزة للحب (<span class=\"en\">Cupid</span>)، والجمال (<span class=\"en\">Venus</span>)، والطموح (<span class=\"en\">Icarus</span>)، والعقاب (<span class=\"en\">Tantalus</span>).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 3) الـ <span class=\"en\">allusion</span> (الإشارة): أهم مهارة في الكورس ده</div><div class=\"u\">الشاعر مش هيحكيلك الأسطورة، هيلمّح ليها بس. إشارة = اسم أو كلمة بتستدعي الحكاية كلها.</div>", "n": 3, "i": 3, "a": "myth-m1-003", "x": "8dea02d7"}, {"t": "learn", "h": "<div class=\"u\">مثال من حياتنا: لما حد يقول \"ده فيلم تيتانيك\" وانت فاهم فوراً: غرق، حب، نهاية حزينة — من غير ما يحكي الفيلم. أو لما تقول \"عمل زي فيلم الأفلام دي\" وصاحبك يضحك لأنه شاف نفس المشهد. الشاعر الإنجليزي بيعمل كده بالأساطير بالظبط: يقول \"<span class=\"en\">wax wings</span>\" فيفهم قارئه قصة <span class=\"en\">Icarus</span> كلها في كلمتين.</div>", "n": 1, "i": 4, "a": "myth-m1-004", "x": "6438526b"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">allusion</span> (الإشارة) هي...", "nq": 1, "opts": ["اسم أو كلمة بتستدعي حكاية كاملة من غير ما الشاعر يحكيها", "شرح طويل للأسطورة", "سطر بيتكرر"], "ans": 0, "why": "اسم أو كلمة بتستدعي حكاية كاملة من غير ما الشاعر يحكيها", "ex": ["صح: زي <span class=\"en\">wax wings</span> بتفكّرك بحكاية <span class=\"en\">Icarus</span>.", "غلط: الشاعر بيلمّح مش بيحكي.", "غلط: ده الـ <span class=\"en\">refrain</span>."], "i": 5}, {"t": "learn", "h": "<div class=\"lead\">إزاي تمسكها في الامتحان:</div><div class=\"u\">١) اسم علم غريب (شخصية/مكان) = غالباً إشارة.</div><div class=\"u\">٢) اسأل: مين ده؟ وحصله إيه؟</div><div class=\"u\">٣) اسأل: ليه الشاعر اختار الحكاية دي هنا بالظبط؟ الفكرة اللي بيقولها من خلالها هي الإجابة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 4) خريطة الأسماء: يوناني <span class=\"em\"><span class=\"em\">←</span></span> روماني (الشعر الإنجليزي بيستخدم الاتنين)</div>", "n": 4, "i": 6, "a": "myth-m1-005", "x": "9aff6efe"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Zeus</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Jupiter/Jove</span> | <span class=\"en\">Hera</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Juno</span> | <span class=\"en\">Poseidon</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Neptune</span> | <span class=\"en\">Athena</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Minerva</span> | <span class=\"en\">Apollo</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Apollo</span> (نفسه) | <span class=\"en\">Artemis</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Diana</span> | <span class=\"en\">Aphrodite</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Venus</span> | <span class=\"en\">Ares</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Mars</span> | <span class=\"en\">Hermes</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Mercury</span> | <span class=\"en\">Hephaestus</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Vulcan</span> | <span class=\"en\">Dionysus</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Bacchus</span> | <span class=\"en\">Hades</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Pluto</span> | <span class=\"en\">Heracles</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Hercules</span> | <span class=\"en\">Odysseus</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Ulysses</span></div>", "n": 1, "i": 7, "a": "myth-m1-006", "x": "03283521"}, {"t": "mc", "h": "", "q": "إيه الاسم الروماني لـ <span class=\"en\">Zeus</span>؟", "nq": 1, "opts": ["<span class=\"en\">Jupiter</span>", "<span class=\"en\">Neptune</span>", "<span class=\"en\">Mars</span>"], "ans": 0, "why": "<span class=\"en\">Jupiter</span>", "ex": ["صح: <span class=\"en\">Zeus</span> ← <span class=\"en\">Jupiter</span> أو <span class=\"en\">Jove</span>.", "غلط: <span class=\"en\">Neptune</span> هو <span class=\"en\">Poseidon</span>.", "غلط: <span class=\"en\">Mars</span> هو <span class=\"en\">Ares</span>."], "i": 8}, {"t": "mc", "h": "", "q": "إيه الاسم الروماني لـ <span class=\"en\">Aphrodite</span>؟", "nq": 1, "opts": ["<span class=\"en\">Venus</span>", "<span class=\"en\">Juno</span>", "<span class=\"en\">Diana</span>"], "ans": 0, "why": "<span class=\"en\">Venus</span>", "ex": ["صح: <span class=\"en\">Aphrodite</span> ← <span class=\"en\">Venus</span>.", "غلط: <span class=\"en\">Juno</span> هي <span class=\"en\">Hera</span>.", "غلط: <span class=\"en\">Diana</span> هي <span class=\"en\">Artemis</span>."], "i": 9}, {"t": "learn", "h": "<div class=\"u\">ملحوظة امتحان: ميلتون بيحب \"<span class=\"en\">Jove</span>\"، وشكسبير بيحب \"<span class=\"en\">Jupiter</span>\"، والرومانتيكيين بيرجعوا للأسماء اليونانية.</div>", "n": 1, "i": 10, "a": "myth-m1-007", "x": "8c497cc4"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 5) الشخصيات اللي هتقابلك في كل قصيدة:</div><div class=\"li\">الـ <span class=\"en\">Muses</span> التسعة: بنات <span class=\"en\">Zeus</span> و<span class=\"en\">Mnemosyne</span> (الذاكرة)، ساكنين جبل <span class=\"en\">Helicon</span> و<span class=\"en\">Parnassus</span>، وبيلهموا الشعراء.</div><div class=\"li\">أهمهم للشعر: <span class=\"en\">Calliope</span> (شعر الملاحم)، <span class=\"en\">Erato</span> (شعر الحب)، <span class=\"en\">Melpomene</span> (التراجيديا)، <span class=\"en\">Thalia</span> (الكوميديا)، <span class=\"en\">Urania</span> (الفلك، ميلتون بيسميها في <span class=\"en\">Paradise Lost</span>).</div><div class=\"li\">الـ \"<span class=\"en\">sacred well</span>\" (عين <span class=\"en\">Aganippe</span> المقدسة) بتاعتهم تحت عرش <span class=\"en\">Jove.</span></div>", "n": 3, "i": 11, "a": "myth-m1-008", "x": "69d60110"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">Muses</span> التسعة هم بنات...", "nq": 1, "opts": ["<span class=\"en\">Zeus</span> و<span class=\"en\">Mnemosyne</span> (الذاكرة)", "<span class=\"en\">Poseidon</span> و<span class=\"en\">Athena</span>", "<span class=\"en\">Hades</span> و<span class=\"en\">Hera</span>"], "ans": 0, "why": "<span class=\"en\">Zeus</span> و<span class=\"en\">Mnemosyne</span> (الذاكرة)", "ex": ["صح: بنات <span class=\"en\">Zeus</span> و<span class=\"en\">Mnemosyne</span>، وبيلهموا الشعراء.", "غلط: الاسمين دول مش أبوهم وأمهم.", "غلط: الاسمين دول مش أبوهم وأمهم."], "i": 12}, {"t": "learn", "h": "<div class=\"li\">الـ <span class=\"en\">Fates</span> التلاتة (<span class=\"en\">Moirai/Parkae</span>): <span class=\"en\">Clotho</span> بتغزل خيط العمر، <span class=\"en\">Lachesis</span> بتقيسه، <span class=\"en\">Atropos</span> بتقطعه. ولا <span class=\"en\">Zeus</span> نفسه يقدر يرجّعهم.</div><div class=\"li\">الـ <span class=\"en\">Furies</span> (<span class=\"en\">Erinyes</span>): تلات كيانات عقاب (<span class=\"en\">Alecto</span> و<span class=\"en\">Megaera</span> و<span class=\"en\">Tisiphone</span>) بيطاردوا قاتل الدم حتى الجنون، وبعدين اتحولوا لـ <span class=\"en\">Eumenides</span> \"المُهدوِّنات\" في مسرحية <span class=\"en\">Aeschylus.</span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 6) الأسطورة في الشعر الإنجليزي (قسم ثابت في كل درس):</div>", "n": 3, "i": 13, "a": "myth-m1-009", "x": "298b7cc1"}, {"t": "mc", "h": "", "q": "مين من الـ <span class=\"en\">Fates</span> بتقطع خيط العمر؟", "nq": 1, "opts": ["<span class=\"en\">Atropos</span>", "<span class=\"en\">Clotho</span>", "<span class=\"en\">Lachesis</span>"], "ans": 0, "why": "<span class=\"en\">Atropos</span>", "ex": ["صح: <span class=\"en\">Atropos</span> بتقطعه.", "غلط: <span class=\"en\">Clotho</span> بتغزل الخيط.", "غلط: <span class=\"en\">Lachesis</span> بتقيسه."], "i": 14}, {"t": "learn", "h": "<div class=\"u\">أ) الاستدعاء (<span class=\"en\">invocation</span>): الشاعر بيفتح قصيدته بطلب الإلهام من الـ <span class=\"en\">Muse</span>، تقليد من <span class=\"en\">Homer</span> لفيرجيل لميلتون:</div><div class=\"li\"><span class=\"en\">Milton,</span> <span class=\"en\">Paradise Lost 1.6-9</span>:</div><div class=\"u\">\"<span class=\"en\">Sing Heav'nly Muse,</span> <span class=\"en\">that on the secret top</span></div><div class=\"u\"><span class=\"en\">Of Oreb,</span> <span class=\"en\">or of Sinai,</span> <span class=\"en\">didst inspire</span></div><div class=\"u\"><span class=\"en\">That Shepherd,</span> <span class=\"en\">who first taught the chosen Seed,</span>\"</div>", "n": 5, "i": 15, "a": "myth-m1-010", "x": "3b30ac21"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">invocation</span> في بداية القصيدة هو...", "nq": 1, "opts": ["الشاعر بيطلب الإلهام من الـ <span class=\"en\">Muse</span>", "الشاعر بيشكر القارئ", "الشاعر بيختم القصيدة"], "ans": 0, "why": "الشاعر بيطلب الإلهام من الـ <span class=\"en\">Muse</span>", "ex": ["صح: تقليد من <span class=\"en\">Homer</span> لـ <span class=\"en\">Virgil</span> لـ <span class=\"en\">Milton</span>.", "غلط: الاستدعاء بيكون في الأول مش للشكر.", "غلط: ده بيكون في البداية."], "i": 16}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">that on the _____ top</div>", "opts": ["learning", "loudly", "secret"], "ans": 2, "why": "<span class=\"en\">that on the secret top</span>", "i": 17, "ex": ["غلط: <span class=\"en\">learning</span> تعني التعلّم، ولا تصف قمة جبل.", "غلط: <span class=\"en\">loudly</span> ظرف (بصوت عال). الكلمة قبل <span class=\"en\">top</span> يجب أن تصف الاسم، والظرف لا يصف اسماً.", "صح: من <span class=\"en\">Paradise Lost</span> للكتاب الأول: <span class=\"en\">that on the secret top of Oreb</span>, <span class=\"en\">or of Sinai</span>, <span class=\"en\">didst inspire</span>... أي القمة السرية للجبل."]}, {"t": "learn", "h": "<div class=\"u\">ميلتون بيخلط: <span class=\"en\">Muse</span> إغريقية + جبل <span class=\"en\">Oreb/Sinai</span> توراتي = \"ميوز مسيحية\". ده أشهر سطر استدعاء في الإنجليزي.</div><div class=\"li\"><span class=\"en\">Milton,</span> <span class=\"en\">Lycidas 15-17</span>:</div><div class=\"u\">\"<span class=\"en\">Begin then,</span> <span class=\"en\">Sisters of the sacred well,</span></div><div class=\"u\"><span class=\"en\">That from beneath the seat of Jove doth spring,</span></div><div class=\"u\"><span class=\"en\">Begin,</span> <span class=\"en\">and somwhat loudly sweep the string.</span>\"</div><div class=\"u\">الـ \"<span class=\"en\">Sisters</span>\" هما الـ <span class=\"en\">Muses</span>، والـ \"<span class=\"en\">sacred well</span>\" هي عينهم. قصيدة رثاء بتستدعي إلهام الشعر نفسه.</div>", "n": 6, "i": 18, "a": "myth-m1-011", "x": "3bbac0a3"}, {"t": "learn", "h": "<div class=\"lead\">ب) <span class=\"en\">Pieria</span> (موطن الـ <span class=\"en\">Muses</span> عند جبل <span class=\"en\">Olympus</span>):</div><div class=\"li\"><span class=\"en\">Pope,</span> <span class=\"en\">An Essay on Criticism 215-218</span>:</div><div class=\"u\">\"<span class=\"en\">A little learning is a dangerous thing</span>;</div>", "n": 2, "i": 19, "a": "myth-m1-012", "x": "924e0cb5"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">Drink deep,</span> <span class=\"en\">or taste not the Pierian spring</span>:</div><div class=\"u\"><span class=\"en\">There shallow draughts intoxicate the brain,</span></div><div class=\"u\"><span class=\"en\">And drinking largely sobers us again.</span>\"</div><div class=\"u\">\"العين البييرية\" = منبع المعرفة بتاع الـ <span class=\"en\">Muses.</span> الشربة الصغيرة بتسكّر، الغوص بيعقل: تعلم للآخر أو بلاش.</div>", "n": 3, "i": 20, "a": "myth-m1-013", "x": "b554575c"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">An Essay on Criticism</span> لـ <span class=\"en\">Pope</span>، الـ <span class=\"en\">Pierian spring</span> معناها...", "nq": 1, "opts": ["منبع المعرفة بتاع الـ <span class=\"en\">Muses</span>", "نهر في مصر", "جبل عالي"], "ans": 0, "why": "منبع المعرفة بتاع الـ <span class=\"en\">Muses</span>", "ex": ["صح: <span class=\"en\">Pieria</span> موطن الـ <span class=\"en\">Muses</span>، والمعنى: تعلم للآخر أو بلاش.", "غلط: مفيش علاقة بمصر.", "غلط: العين مش جبل."], "i": 21}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 7) كلمات إنجليزي طلعت من درس النهارده:</div><div class=\"u\
