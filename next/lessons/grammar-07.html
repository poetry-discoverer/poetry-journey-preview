<h1>الكلمات 1: أنواع الكلمات</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: من الصفر</span><span class="tag">درس 7</span><span class="tag"><span class="em">🧩</span> القواعد الأكاديمية</span></div>

<script>window.LESSON_ID="grammar-07";window.STEPS=[{"t":"section","h":"الكلمات مش كلها زي بعض","n":1,"i":0},{"t":"learn","h":"<div class=\"u\">أهلًا بيك في الدرس السابع، وأول درس في وحدة الكلمات. الكلمات مش كلها زي بعض. فيه كلمات بتسمّي حاجة، زي <span class=\"en\">cat</span> و<span class=\"en\">book</span>. وكلمات بتقول إيه اللي بيحصل، زي <span class=\"en\">run</span> و<span class=\"en\">eat</span>. وكلمات بتوصف، زي <span class=\"en\">big</span> و<span class=\"en\">red</span>. كل نوع اسمه <span class=\"en\">word class</span>، أو <span class=\"en\">part of speech</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">words are put into groups</span>, <span class=\"en\">and each group works in a similar way</span>.</div>","n":1,"i":1,"a":"grammar-07-001","x":"1401f826"},{"t":"learn","h":"<div class=\"u\">الأنواع التقليدية تمانية. <span class=\"en\">Noun</span>، اسم. <span class=\"en\">Verb</span>، فعل. <span class=\"en\">Adjective</span>، صفة. <span class=\"en\">Adverb</span>، ظرف. <span class=\"en\">Pronoun</span>، ضمير. <span class=\"en\">Preposition</span>، حرف جر. <span class=\"en\">Conjunction</span>، أداة ربط. و<span class=\"en\">Determiner</span>، محدِّد، زي <span class=\"en\">the</span> و<span class=\"en\">a</span> و<span class=\"en\">some</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">nouns name things</span>, <span class=\"en\">verbs show actions</span>, <span class=\"en\">adjectives describe nouns</span>.</div>","n":1,"i":2,"a":"grammar-07-002","x":"712e434f"},{"t":"section","h":"إزاي نعرف نوع الكلمة","n":1,"i":3},{"t":"learn","h":"<div class=\"u\">المدرسة بتقول الاسم هو اللي بيسمّي حاجة. ده مش كفاية. كلمة <span class=\"en\">light</span> ممكن تبقى اسم أو فعل أو صفة. <span class=\"en\">The light is on</span>: اسم. <span class=\"en\">Please light the candle</span>: فعل. <span class=\"en\">The room is light</span>: صفة. <span class=\"en\">In simple English</span>: <span class=\"en\">the same word can have different classes</span>.</div>","n":1,"i":4,"a":"grammar-07-003","x":"49f98b78"},{"t":"tf","q":"كلمة <span class=\"en\">light</span> ممكن تبقى اسم أو فعل أو صفة.","ans":true,"why":"صح.","ex":["صح: حسب الاستعمال.","غلط: فعلًا بتغير حسب الاستعمال."],"n":1,"i":5,"h":""},{"t":"learn","h":"<div class=\"u\">يعني نفس الشكل، ومعنى مختلف، ووظيفة مختلفة. فالمعيار الأقوى هو الشكل والوظيفة، مش المعنى بس. <span class=\"en\">In simple English</span>: <span class=\"en\">we look at the word's form and what it does in the sentence</span>.</div>","n":1,"i":6,"a":"grammar-07-004","x":"7fb737e3"},{"t":"section","h":"تلات اختبارات","n":1,"i":7},{"t":"learn","h":"<div class=\"u\">الاختبار الأول الشكل، <span class=\"en\">form</span>. هل الكلمة بتاخد <span class=\"en\">s</span> للجمع؟ يبقى اسم. هل بتاخد <span class=\"en\">ed</span> للماضي؟ يبقى فعل. هل بتاخد <span class=\"en\">er</span> للمقارنة؟ يبقى صفة.</div>","n":1,"i":8,"a":"grammar-07-005","x":"365ffa3c"},{"t":"learn","h":"<div class=\"u\">التاني الوظيفة، <span class=\"en\">function</span>. إيه اللي بييجي قبلها وبعدها؟ الاسم بييجي بعد <span class=\"en\">the</span>. والتالت التوزيع، <span class=\"en\">distribution</span>: تقدر تحط الكلمة في الفراغ ده؟ <span class=\"en\">The blank slept</span>. لو دخلت، يبقى اسم. <span class=\"en\">In simple English</span>: <span class=\"en\">test the word with endings and with a sentence frame</span>.</div>","n":1,"i":9,"a":"grammar-07-006","x":"0d7acf61"},{"t":"section","h":"مفتوحة ومقفولة","n":1,"i":10},{"t":"learn","h":"<div class=\"u\">الأقسام المفتوحة، <span class=\"en\">open classes</span>، بتتضاف لها كلمات جديدة طول الوقت: <span class=\"en\">nouns</span> و<span class=\"en\">verbs</span> و<span class=\"en\">adjectives</span> و<span class=\"en\">adverbs</span>. زي <span class=\"en\">selfie</span> و<span class=\"en\">google</span>. الأقسام المقفولة، <span class=\"en\">closed classes</span>، نادرًا بتتضاف لها كلمات: <span class=\"en\">pronouns</span> و<span class=\"en\">prepositions</span> و<span class=\"en\">determiners</span> و<span class=\"en\">conjunctions</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">open classes accept new words</span>, <span class=\"en\">and closed classes almost never do</span>.</div>","n":1,"i":11,"a":"grammar-07-007","x":"df22b050"},{"t":"mc","q":"«<span class=\"en\">selfie</span>» مثال على:","opts":["<span class=\"en\">closed class</span>","<span class=\"en\">open class</span>","<span class=\"en\">function word</span>"],"ans":1,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">open classes accept new words</span>.","ex":["غلط: المقفولة نادرًا بتقبل جديد.","صح: الأسماء من الأقسام المفتوحة.","غلط: <span class=\"en\">selfie</span> كلمة محتوى."],"n":1,"i":12,"h":""},{"t":"tf","q":"الـ <span class=\"en\">prepositions</span> من الأقسام المفتوحة.","ans":false,"why":"غلط: مقفولة.","ex":["غلط: كلمات الجر نادرًا بتتضاف.","صح، الجملة غلط: <span class=\"en\">prepositions</span> مقفولة."],"n":1,"i":13,"h":""},{"t":"learn","h":"<div class=\"u\">وفيه تقسيم تاني: <span class=\"en\">content words</span>، كلمات المحتوى، ليها معنى واضح زي <span class=\"en\">book</span> و<span class=\"en\">run</span> و<span class=\"en\">happy</span>. و<span class=\"en\">function words</span>، الكلمات الوظيفية، وظيفتها نحوية زي <span class=\"en\">the</span> و<span class=\"en\">of</span> و<span class=\"en\">and</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">content words carry meaning</span>, <span class=\"en\">and function words do grammar jobs</span>.</div>","n":1,"i":14,"a":"grammar-07-008","x":"db38b425"},{"t":"mc","q":"«<span class=\"en\">of</span>» و«<span class=\"en\">the</span>» و«<span class=\"en\">and</span>» دي:","opts":["<span class=\"en\">content words</span>","<span class=\"en\">function words</span>","<span class=\"en\">verbs</span>"],"ans":1,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">they do grammar jobs</span>.","ex":["غلط: معناها المعجمي ضعيف.","صح: كلمات وظيفية.","غلط: مش أفعال."],"n":1,"i":15,"h":""},{"t":"section","h":"أربع زوايا","n":1,"i":16},{"t":"learn","h":"<div class=\"u\">الشكل: النهايات اللي بتقبلها الكلمة. الوظيفة: دورها في العبارة. المعنى: معنى عام مش حاسم، زي الاسم غالبًا شيء. والاستعمال: كلمة واحدة ممكن تغير قسمها بالاستخدام، زي <span class=\"en\">to google</span>.</div>","n":1,"i":17,"a":"grammar-07-009","x":"f32278a3"},{"t":"section","h":"الطبقة المتقدمة","n":1,"i":18},{"t":"learn","h":"<div class=\"u\">التعريفات التقليدية بتفشل. <span class=\"en\">Destruction</span> اسم ومش شيء. و<span class=\"en\">red</span> صفة، لكنها كمان اسم في <span class=\"en\">red is my favourite</span>. <span class=\"en\">Huddleston</span> و<span class=\"en\">Pullum</span> سنة 2002 رفضوا التعريف المعنوي واعتمدوا على الشكل والوظيفة النحوية، وفرّقوا بين <span class=\"en\">category</span>، القسم، و<span class=\"en\">function</span>، الوظيفة.</div>","n":1,"i":19,"a":"grammar-07-010","x":"59945283"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">In simple English</span>: <span class=\"en\">a word class is not defined by meaning</span>, <span class=\"en\">but by how the word behaves in grammar</span>.</div>","n":1,"i":20,"a":"grammar-07-011","x":"c10f7d66"},{"t":"learn","h":"<div class=\"u\">وعندهم تصنيف أدق: <span class=\"en\">verb</span> و<span class=\"en\">noun</span> و<span class=\"en\">adjective</span> و<span class=\"en\">adverb</span> و<span class=\"en\">preposition</span> و<span class=\"en\">determinative</span> و<span class=\"en\">subordinator</span> و<span class=\"en\">coordinator</span>. والتصنيف التقليدي التمانية جاي من النحو اليوناني واللاتيني. <span class=\"en\">In simple English</span>: <span class=\"en\">modern grammar uses a more careful list than school grammar</span>.</div>","n":1,"i":21,"a":"grammar-07-012","x":"6a380e8d"},{"t":"learn","h":"<div class=\"u\">ولما كلمة تغير قسمها من غير ما يتغير شكلها، اسمها <span class=\"en\">conversion</span>. زي <span class=\"en\">email</span> اسم، و<span class=\"en\">to email</span> فعل. <span class=\"en\">In simple English</span>: <span class=\"en\">conversion means the word changes class but not shape</span>.</div>","n":1,"i":22,"a":"grammar-07-013","x":"dc4820a9"},{"t":"mc","q":"<span class=\"en\">email</span> (اسم) بقت <span class=\"en\">to email</span> (فعل). دي:","opts":["<span class=\"en\">conversion</span>","<span class=\"en\">allomorph</span>","<span class=\"en\">inflection</span>"],"ans":0,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">same word</span>, <span class=\"en\">new class</span>.","ex":["صح: <span class=\"en\">conversion</span>، تغير القسم من غير تغير الشكل.","غلط: <span class=\"en\">allomorph</span> شكل مورفيم.","غلط: <span class=\"en\">inflection</span> نهاية نحوية."],"n":1,"i":23,"h":""},{"t":"section","h":"مصطلحات الدرس","n":1,"i":24},{"t":"learn","h":"<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. <span class=\"en\">Word class</span>: نوع الكلمة. <span class=\"en\">In simple English</span>: <span class=\"en\">a group of words that work the same way</span>. <span class=\"en\">Noun</span>: اسم. <span class=\"en\">In simple English</span>: <span class=\"en\">it names a person</span>, <span class=\"en\">place or thing</span>. <span class=\"en\">Verb</span>: فعل. <span class=\"en\">In simple English</span>: <span class=\"en\">it shows an action or state</span>.</div>","n":1,"i":25,"a":"grammar-07-014","x":"f187be32"},{"t":"mc","q":"ليه ما نعتمدش على المعنى بس في تحديد نوع الكلمة؟","opts":["لأن المعنى مش بيحدد دايمًا، و<span class=\"en\">light</span> مثال","لأن الكلمات ملهاش معنى","لأن الشكل مش مهم"],"ans":0,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">one word can work as noun</span>, <span class=\"en\">verb or adjective</span>.","ex":["صح: <span class=\"en\">light</span> اسم أو فعل أو صفة.","غلط: الكلمات ليها معنى.","غلط: الشكل والوظيفة هم المعيار."],"n":1,"i":26,"h":""},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Adjective</span>: صفة. <span class=\"en\">In simple English</span>: <span class=\"en\">it describes a noun</span>. <span class=\"en\">Adverb</span>: ظرف. <span class=\"en\">In simple English</span>: <span class=\"en\">it describes a verb or adjective</span>. <span class=\"en\">Pronoun</span>: ضمير. <span class=\"en\">In simple English</span>: <span class=\"en\">it replaces a noun</span>. <span class=\"en\">Preposition</span>: حرف جر. <span class=\"en\">In simple English</span>: <span class=\"en\">it shows place</span>, <span class=\"en\">time or relation</span>.</div>","n":1,"i":27,"a":"grammar-07-015","x":"f414a495"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Conjunction</span>: أداة ربط. <span class=\"en\">In simple English</span>: <span class=\"en\">it joins words or clauses</span>. <span class=\"en\">Determiner</span>: محدِّد. <span class=\"en\">In simple English</span>: <span class=\"en\">it goes before a noun</span>. <span class=\"en\">Open class</span>: قسم مفتوح. <span class=\"en\">Closed class</span>: قسم مقفول. <span class=\"en\">Conversion</span>: تحويل.</div>","n":1,"i":28,"a":"grammar-07-016","x":"492729cf"},{"t":"section","h":"الخلاصة","n":1,"i":29},{"t":"learn","h":"<div class=\"u\">أربع نقط. واحد: الكلمات بتتصنف في أقسام حسب الشكل والوظيفة. اتنين: المعنى لوحده مش معيار كفاية. تلاتة: الأقسام مفتوحة أو مقفولة، ومحتوى أو وظيفية. أربعة: كلمة ممكن تغير قسمها، وده <span class=\"en\">conversion</span>. <span class=\"en\">In short</span>: <span class=\"en\">we sort words by how they behave in grammar</span>. الدرس الجاي: المورفيم والجذر والأفكسات.</div>","n":1,"i":30,"a":"grammar-07-017","x":"3f10a351"},{"t":"section","h":"الكويز","n":1,"i":31},{"t":"recall","q":"اذكر الاختبارات التلاتة لتحديد القسم.","a":"الشكل (النهايات)، الوظيفة (إيه حواليها)، التوزيع (الفراغ في جملة). <span class=\"en\">In simple English</span>: <span class=\"en\">ending</span>, <span class=\"en\">position</span>, <span class=\"en\">frame</span>.","n":1,"i":32,"h":""},{"t":"recall","q":"إيه الفرق بين <span class=\"en\">open</span> و <span class=\"en\">closed class</span>؟","a":"المفتوحة بتقبل كلمات جديدة (<span class=\"en\">nouns</span>, <span class=\"en\">verbs</span>...). المقفولة نادرًا (<span class=\"en\">pronouns</span>, <span class=\"en\">prepositions</span>...). <span class=\"en\">In simple English</span>: <span class=\"en\">open accepts new words</span>, <span class=\"en\">closed does not</span>.","n":1,"i":33,"h":""},{"t":"write","q":"اشرح ليه التعريف التقليدي «الاسم يسمّي شخص أو مكان أو شيء» مش كفاية (٣-٤ جمل).","key":"grammar-07:1","a":"لأن كلمات زي <span class=\"en\">destruction</span> اسم ومش شيء. و<span class=\"en\">red</span> صفة لكنها كمان اسم في <span class=\"en\">red is my favourite</span>. فالمعنى مش حاسم، والأدق نعتمد على الشكل والوظيفة النحوية. <span class=\"en\">In simple English</span>: <span class=\"en\">meaning alone is not enough</span>.","n":1,"i":34,"h":""},{"t":"write","q":"وضّح <span class=\"en\">conversion</span> بمثالين من عندك (٣-٤ جمل).","key":"grammar-07:2","a":"<span class=\"en\">conversion</span> يعني كلمة تغير قسمها من غير ما يتغير شكلها. مثال: <span class=\"en\">email</span> اسم، و<span class=\"en\">to email</span> فعل. ومثال تاني: <span class=\"en\">water</span> اسم، و<span class=\"en\">to water the plants</span> فعل. <span class=\"en\">In simple English</span>: <span class=\"en\">same word</span>, <span class=\"en\">new class</span>.","n":1,"i":35,"h":""},{"t":"end","h":"","teaser":"<div class=\"u\">الدرس الجاي: المورفيم والجذر والأفكسات.</div><div class=\"u\">هنفكك الكلمة لأجزائها.</div>","extra":"المصادر: Huddleston and Pullum (2002), The Cambridge Grammar of the English Language; Górska on parts of speech in Greek and Latin grammar.","i":36}];</script>
