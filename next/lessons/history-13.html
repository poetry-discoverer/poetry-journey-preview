<script>window.LESSON_ID="history-13", "history-14", "history-15", "history-16", "history-17", "history-18", "history-19", "history-20", "history-21";window.STEPS=[{"t": "section", "h": "الباب: المستوى التاني", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">🖨️ مبروك، خلصت المستوى الأول ودخلت المستوى التاني.<\/div><div class=\"u\">من هنا القصة بتتغير بسرعة: في أقل من 100 سنة، إنجلترا هتاخد المطبعة، وتخرج من الكنيسة الكاثوليكية، وتترجم الكتاب المقدس، وتستورد السونيت من إيطاليا، وتبني مسرح هيطلع منه أشهر كاتب في التاريخ.<\/div>", "n": 2, "a": "history-13-001", "x": "007eceeb", "en": "Congratulations! You finished Level 1 and now you start Level 2. From here the story changes fast. In less than 100 years, England gets the printing press, leaves the Catholic Church, translates the Bible, brings the sonnet from Italy, and builds a theatre that will produce the most famous writer in history.", "i": 1}, {"t": "learn", "h": "<div class=\"u\">الدرس ده مش عن شاعر واحد. ده الباب اللي كل اللي جاي هيعدي منه: الظروف اللي خلت الشعر الإنجليزي يبقى حاجة تانية خالص.<\/div>", "n": 1, "a": "history-13-002", "x": "7ccf1883", "en": "This lesson is not about one poet. It is the door that everything after it will pass through: the conditions that made English poetry something completely new.", "i": 2}, {"t": "section", "h": "النقطة 1: النهضة إيه؟ وليه إنجلترا اتأخرت؟", "i": 3}, {"t": "learn", "h": "<div class=\"u\">النهضة (<span class=\"en\">Renaissance<\/span>): حركة ثقافية بدأت في إيطاليا في القرن الـ14. فكرتها: إحنا مش ورثة الجهل، إحنا ورثة روما واليونان.<\/div><div class=\"li\">الرجوع للنصوص القديمة.<\/div><div class=\"li\">تعلم اللغات القديمة.<\/div><div class=\"li\">اعتبار الإنسان مركز الاهتمام، مش بس الآخرة.<\/div>", "n": 4, "a": "history-13-003", "x": "b5375533", "en": "The Renaissance was a cultural movement that began in Italy in the 14th century. Its idea: we are not heirs of ignorance, we are heirs of Rome and Greece. People went back to old texts, learned old languages, and put human beings at the centre, not only the afterlife.", "i": 4}, {"t": "learn", "h": "<div class=\"u\">في إنجلترا، النهضة وصلت متأخرة، حوالي سنة 1500. السبب بسيط: إنجلترا كانت مشغولة بحرب داخلية دموية، حرب الوردتين (<span class=\"en\">Wars of the Roses<\/span>)، من 1455 لـ 1485.<\/div><div class=\"u\">تلاتين سنة قتال على العرش. وخلصت لما <span class=\"en\">Henry VII<\/span> مسك الحكم وبدأ عهد <span class=\"en\">Tudor<\/span>.<\/div>", "n": 2, "a": "history-13-004", "x": "8224a3f9", "en": "In England the Renaissance arrived late, around 1500. The reason is simple: England was busy with a bloody civil war, the Wars of the Roses, from 1455 to 1485. Thirty years of fighting for the throne. It ended when Henry VII took power and the Tudor age began.", "i": 5}, {"t": "mc", "h": "", "q": "ليه النهضة وصلت إنجلترا متأخرة؟", "nq": 1, "opts": ["لأن إنجلترا كانت في حرب داخلية دموية (حرب الوردتين)", "لأن مفيش كتب في إنجلترا", "لأن الملك منع التعليم"], "ans": 0, "why": "لأن إنجلترا كانت في حرب داخلية دموية (حرب الوردتين)", "ex": ["صح: وخلصت سنة 1485 مع بداية عهد <span class=\"en\">Tudor<\/span>.", "غلط: الكتب كانت موجودة، بس الناس مكانوش فاضيين ليها.", "غلط: ده مش اللي حصل."], "i": 6}, {"t": "learn", "h": "<div class=\"u\">مثال من حياتنا: بلد فيها اقتتال تلاتين سنة، ومحدش فاضي يقرا ولا يبني مدرسة. أول ما البلد تهدى، تبدأ المدارس والكتب والترجمة. ده اللي حصل في إنجلترا بالظبط.<\/div><div class=\"u\">الفترة دي اسمها في الأدب الإنجليزي <span class=\"en\">early modern<\/span> (أوائل الحداثة). مش لأن الناس بقت حديثة، لكن لأن الحاجات اللي هتحكم العالم بعد كده اتولدت فيها: المطبعة، واللغة القياسية، والترجمة، والسوق.<\/div>", "n": 2, "a": "history-13-005", "x": "a43ceba5", "en": "Think of a country with thirty years of fighting. Nobody has time to read or build a school. When it calms down, schools, books and translation begin. This is exactly what happened in England. We call this period early modern. Not because people became modern, but because the things that will rule the world later were born in it: printing, a standard language, translation and the market.", "i": 7}, {"t": "tf", "h": "", "q": "كلمة <span class=\"en\">early modern<\/span> معناها إن الناس في الفترة دي بقت حديثة زي النهاردة.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: معناها إن حاجات زي المطبعة واللغة القياسية اتولدت فيها.", "صح."], "i": 8}, {"t": "section", "h": "النقطة 2: الطباعة، أول ثورة معلومات", "i": 9}, {"t": "learn", "h": "<div class=\"u\">مين جاب المطبعة لإنجلترا؟ <span class=\"en\">William Caxton<\/span>، عاش حوالي 1422 لـ 1491. تاجر إنجليزي عاش في بروج (<span class=\"en\">Bruges<\/span>) في بلجيكا، واتعلم الطباعة في كولونيا في ألمانيا.<\/div><div class=\"u\">يعني مكانش كاتب ولا شاعر، كان تاجر. والمطبعة دخلت إنجلترا عن طريق التجارة، مش عن طريق الأدب.<\/div>", "n": 2, "a": "history-13-006", "x": "a41f46ff", "en": "Who brought the printing press to England? William Caxton, who lived from about 1422 to 1491. He was an English merchant living in Bruges, in Belgium, and he learned printing in Cologne, in Germany. So he was not a writer or a poet. He was a trader. Printing came to England through trade, not through literature.", "i": 10}, {"t": "mc", "h": "", "q": "مين <span class=\"en\">William Caxton<\/span>؟", "nq": 1, "opts": ["تاجر إنجليزي جاب المطبعة لإنجلترا", "شاعر كتب <span class=\"en\">The Canterbury Tales<\/span>", "ملك من عائلة <span class=\"en\">Tudor<\/span>"], "ans": 0, "why": "تاجر إنجليزي جاب المطبعة لإنجلترا", "ex": ["صح: ودخلت المطبعة عن طريق التجارة.", "غلط: ده <span class=\"en\">Chaucer<\/span>.", "غلط: ده مش ملك."], "i": 11}, {"t": "learn", "h": "<div class=\"u\">سنة 1473 أو 1474 طبع في بروج أول كتاب مطبوع بالإنجليزية: <span class=\"en\">Recuyell of the Historyes of Troye<\/span> (حكايات طروادة). وهو ترجمة عملها <span class=\"en\">Caxton<\/span> نفسه من الفرنسي.<\/div><div class=\"u\">يعني أول كتاب إنجليزي مطبوع كان قصة عن طروادة، واللي طبعه هو نفسه اللي ترجمه.<\/div><div class=\"u\">وبالمناسبة: القصيدة الإنجليزية الكبيرة <span class=\"en\">Gawain<\/span> اللي درسناها بتبدأ بطروادة كمان.<\/div>", "n": 3, "a": "history-13-007", "x": "2a6eed94", "en": "In 1473 or 1474 he printed, in Bruges, the first book printed in English: Recuyell of the Historyes of Troye, the stories of Troy. He translated it himself from French. So the first printed English book was a story about Troy, and the man who printed it also translated it. By the way, the great poem Gawain, from Level 1, also starts with Troy.", "i": 12}, {"t": "learn", "h": "<div class=\"u\">سنة 1476 رجع لإنجلترا وفتح أول مطبعة فيها، في وستمنستر (<span class=\"en\">Westminster<\/span>) جنب الدير. ومن أوائل الكتب اللي طبعها كان <span class=\"en\">The Canterbury Tales<\/span> بتاع <span class=\"en\">Chaucer<\/span>.<\/div><div class=\"u\">وطبع في حياته حوالي مية كتاب أو أكتر، وترجم كتير منهم بنفسه.<\/div>", "n": 2, "a": "history-13-008", "x": "b8661edf", "en": "In 1476 he came back to England and opened the first printing press there, in Westminster, next to the abbey. One of the first books he printed was Chaucer's Canterbury Tales. In his life he printed about a hundred books or more, and he translated many of them himself.", "i": 13}, {"t": "learn", "h": "<div class=\"u\">أشهر حكاية في تاريخ اللغة الإنجليزية، و<span class=\"en\">Caxton<\/span> نفسه كتبها. في مقدمة ترجمته للإنيادة (<span class=\"en\">Eneydos<\/span>) سنة 1490 قال إنه محتار: يكتب بأي إنجليزي؟ لأن الإنجليزي في كل مقاطعة مختلف.<\/div><div class=\"u\">وحكى إن تجار كانوا مسافرين في نهر التايمز، ووقفوا على الشط. واحد منهم، اسمه <span class=\"en\">Sheffield<\/span>، دخل بيت وطلب <span class=\"en\">egges<\/span>، يعني بيض. الست اللي في البيت قالت: أنا مش بتكلم فرنساوي!<\/div><div class=\"u\">الراجل اتعصب، لأنه هو كمان مش بيتكلم فرنساوي، هو عايز بيض بس. لحد ما واحد تاني قال: هو عايز <span class=\"en\">eyren<\/span>. فقالت الست: آه، كده فهمت.<\/div>", "n": 3, "a": "history-13-009", "x": "4c085bc0", "en": "The most famous story in the history of English, written by Caxton himself. In the preface to his translation of the Eneydos in 1490 he says he is confused: which English should he write? English is different in every county. He tells how some merchants were travelling on the Thames and stopped on the shore. One of them, Sheffield, went into a house and asked for eggs, 'egges'. The woman said: I do not speak French! The man got angry, because he does not speak French either, he just wants eggs. Then another man said: he wants 'eyren'. And the woman said: Ah, now I understand.", "i": 14}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">egges<\/span> كلمة من أصل إسكندنافي، و<span class=\"en\">eyren<\/span> كلمة إنجليزية قديمة. الاتنين معناهم بيض، بس من عالمين مختلفين، وواقفين في نفس البيت ومش فاهمين بعض.<\/div><div class=\"u\">مثال مصري: واحد من الصعيد يقول القِلّة، وواحد من القاهرة يقول الإبريق، ويتخانقوا في المحل. اللغة واحدة والكلمات مختلفة.<\/div>", "n": 2, "a": "history-13-010", "x": "26af62b4", "en": "'Egges' comes from a Scandinavian word and 'eyren' is an old English word. Both mean eggs, but they come from two different worlds, and the two people stand in the same house and do not understand each other. An Egyptian example: one man from Upper Egypt says 'el-olla' and one from Cairo says 'el-ibriq', and they argue in the shop. The language is one, the words are different.", "i": 15}, {"t": "mc", "h": "", "q": "حكاية <span class=\"en\">egges<\/span> و<span class=\"en\">eyren<\/span> بتوضح إيه؟", "nq": 1, "opts": ["إن الإنجليزي في كل منطقة كان مختلف، فالناس مكانتش بتفهم بعض", "إن الإنجليزية لغة صعبة جداً", "إن <span class=\"en\">Caxton<\/span> مكانش بيعرف يطبع"], "ans": 0, "why": "إن الإنجليزي في كل منطقة كان مختلف، فالناس مكانتش بتفهم بعض", "ex": ["صح: والمطبعة هي اللي وحّدت الشكل.", "غلط: الحكاية عن اختلاف الكلمات بين المناطق.", "غلط: <span class=\"en\">Caxton<\/span> هو اللي كتب الحكاية."], "i": 16}, {"t": "learn", "h": "<div class=\"u\">وزي ما التلفزيون والسينما في مصر وحّدوا اللهجة، المطبعة في إنجلترا عملت نفس الحاجة. الكتب بقت بتتطبع بلهجة لندن، والناس بقت تقرا نفس الشكل، فلهجة لندن بقت الإنجليزي القياسي.<\/div><div class=\"u\">يعني الإنجليزي اللي بتتعلمه النهاردة، أساسه قرارات المطبعة في القرن الـ15.<\/div>", "n": 2, "a": "history-13-011", "x": "77297912", "en": "Like TV and cinema in Egypt made one common dialect, the printing press in England did the same. Books were printed in the London dialect, people read the same form, and London English became standard English. So the English you learn today has its roots in printing decisions in the 15th century.", "i": 17}, {"t": "learn", "h": "<div class=\"u\">طيب الطباعة عملت إيه للشعر بالتحديد؟ أربع حاجات:<\/div><div class=\"u\">١. النص بقى ثابت: قبل كده كل نسخة مخطوطة مختلفة، وبعد كده كل نسخ الطبعة واحدة بالحرف.<\/div><div class=\"u\">٢. الجمهور بقى أكبر: كتاب واحد بيوصل لمية واحد بدل واحد.<\/div><div class=\"u\">٣. الشاعر بقى معروف بالاسم: اسمه على الغلاف.<\/div><div class=\"u\">٤. ظهرت فكرة الملكية: النص بقى بتاع صاحبه، وممكن يتسرق وممكن يتباع.<\/div>", "n": 5, "a": "history-13-012", "x": "f924a2b7", "en": "What did printing do for poetry in particular? Four things. One: the text became fixed. Before, every handwritten copy was different. After, all copies of an edition are exactly the same. Two: the audience became bigger. One book reaches a hundred people instead of one. Three: the poet became known by name, with the name on the cover. Four: the idea of ownership appeared. A text belongs to its author and it can be stolen or sold.", "i": 18}, {"t": "tf", "h": "", "q": "بعد المطبعة، كل نسخ الطبعة الواحدة بقت متطابقة.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: النص بقى ثابت.", "غلط: ده كان قبل المطبعة، في المخطوطات."], "i": 19}, {"t": "section", "h": "النقطة 3: الإنسانية، الرجوع لليونان وروما", "i": 20}, {"t": "learn", "h": "<div class=\"u\">الإنسانية (<span class=\"en\">humanism<\/span>): حركة فكرية فكرتها:<\/div><div class=\"li\">اقرا النصوص القديمة بلغتها الأصلية.<\/div><div class=\"li\">اتعلم اليوناني واللاتيني.<\/div><div class=\"li\">اتعلم البلاغة (<span class=\"en\">rhetoric<\/span>).<\/div><div class=\"li\">التعليم هو اللي بيصنع الإنسان الحر.<\/div>", "n": 5, "a": "history-13-013", "x": "6bc40483", "en": "Humanism was an intellectual movement. Its idea: read the old texts in their original language, learn Greek and Latin, learn rhetoric, the art of speaking and writing well, and believe that education is what makes a free person.", "i": 21}, {"t": "mc", "h": "", "q": "إيه هي الإنسانية (<span class=\"en\">humanism<\/span>)؟", "nq": 1, "opts": ["حركة بتقول اقرا النصوص القديمة بلغتها وتعلم اليوناني واللاتيني والبلاغة", "حركة ضد الكتب", "حركة بتمنع الترجمة"], "ans": 0, "why": "حركة بتقول اقرا النصوص القديمة بلغتها وتعلم اليوناني واللاتيني والبلاغة", "ex": ["صح: والتعليم بيصنع الإنسان الحر.", "غلط: العكس، هي بتحب الكتب.", "غلط: الترجمة بقت شغل وطني."], "i": 22}, {"t": "learn", "h": "<div class=\"u\">في إنجلترا ارتبطت الحركة دي بأسماء:<\/div><div class=\"li\"><span class=\"en\">John Colet<\/span>: أسس مدرسة <span class=\"en\">St Paul's<\/span> في لندن.<\/div><div class=\"li\"><span class=\"en\">Thomas More<\/span>: كتب <span class=\"en\">Utopia<\/span> سنة 1516.<\/div><div class=\"li\"><span class=\"en\">Erasmus<\/span>: هولندي عاش في إنجلترا فترة، وطبع نسخة يونانية من العهد الجديد سنة 1516.<\/div>", "n": 4, "a": "history-13-014", "x": "992e9f8a", "en": "In England this movement is linked to some names. John Colet founded St Paul's School in London. Thomas More wrote Utopia in 1516. Erasmus, a Dutchman who lived in England for a time, printed a Greek edition of the New Testament in 1516.", "i": 23}, {"t": "learn", "h": "<div class=\"u\">ليه ده مهم للشعر؟ لأن الشعراء اتدربوا في مدارس بتدرس البلاغة والترجمة والتقليد (<span class=\"en\">imitation<\/span>). الشاب كان بيخد قصيدة لاتينية، يترجمها، يقلدها، وبعدين يعمل حاجة جديدة.<\/div><div class=\"u\">وده اللي خلى السونيت الإيطالي يدخل إنجلترا بسهولة: هم أصلاً متدربين على الاستيراد والتصنيع.<\/div>", "n": 2, "a": "history-13-015", "x": "bf395a6a", "en": "Why does this matter for poetry? Because poets were trained in schools that taught rhetoric, translation and imitation. A young man would take a Latin poem, translate it, copy it, and then make something new. This is why the Italian sonnet entered England easily: they were already trained to import and rework.", "i": 24}, {"t": "learn", "h": "<div class=\"u\">والترجمة بقت شغل وطني: عندنا كنوز في اللاتيني واليوناني، لازم ننقلها للإنجليزي. وده خلى الشعر الإنجليزي يورث كل حاجة: الأسطورة، والفلسفة، والبلاغة، وأشكال القصايد.<\/div><div class=\"u\">مثال: جيل كامل اتربى على ترجمة المسلسلات التركية والكورية، وبعدين عمل مسلسلات مصرية بنفس الصنعة. الترجمة علمتهم الحرفة، وبعدين عملوا حاجة بلغتهم.<\/div>", "n": 2, "a": "history-13-016", "x": "801bff8e", "en": "Translation became national work: we have treasures in Latin and Greek, and we must move them into English. This let English poetry inherit everything: myth, philosophy, rhetoric and poem forms. An example: a whole generation grew up on translated Turkish and Korean series, and then made Egyptian series with the same craft. Translation taught them the craft, and then they made something in their own language.", "i": 25}, {"t": "mc", "h": "", "q": "ليه تدريب الشعراء على الترجمة والتقليد سهّل دخول السونيت لإنجلترا؟", "nq": 1, "opts": ["لأنهم كانوا متعودين ياخدوا شكل من لغة ويشتغلوا عليه", "لأن السونيت كانت إنجليزية أصلاً", "لأن الملك أمر بكده"], "ans": 0, "why": "لأنهم كانوا متعودين ياخدوا شكل من لغة ويشتغلوا عليه", "ex": ["صح: استيراد وإعادة تصنيع.", "غلط: السونيت اتولدت في إيطاليا.", "غلط: ده مش السبب."], "i": 26}, {"t": "section", "h": "النقطة 4: الإصلاح الديني، الكتاب المقدس بالإنجليزي", "i": 27}, {"t": "learn", "h": "<div class=\"u\">خد الأحداث بالترتيب، لأنها خريطة القرن كله:<\/div><div class=\"li\">1526: <span class=\"en\">William Tyndale<\/span> طبع العهد الجديد بالإنجليزي من اليوناني، في ألمانيا. الكنيسة منعته في إنجلترا وحرقت نسخ منه. وفي 1536 <span class=\"en\">Tyndale<\/span> نفسه اتعدم واتحرق.<\/div><div class=\"li\">1534: الملك <span class=\"en\">Henry VIII<\/span> قطع العلاقة مع روما. قانون السيادة (<span class=\"en\">Act of Supremacy<\/span>) خلى الملك رأس كنيسة إنجلترا.<\/div>", "n": 3, "a": "history-13-017", "x": "8d7a8bda", "en": "Take the events in order, because they are the map of the whole century. In 1526 William Tyndale printed the New Testament in English, from Greek, in Germany. The Church banned it in England and burned copies. In 1536 Tyndale himself was executed and burned. In 1534 King Henry VIII cut ties with Rome. The Act of Supremacy made the king head of the Church of England.", "i": 28}, {"t": "mc", "h": "", "q": "مين طبع العهد الجديد بالإنجليزي سنة 1526 واتعدم سنة 1536؟", "nq": 1, "opts": ["<span class=\"en\">William Tyndale<\/span>", "<span class=\"en\">William Caxton<\/span>", "<span class=\"en\">Thomas More<\/span>"], "ans": 0, "why": "<span class=\"en\">William Tyndale<\/span>", "ex": ["صح: وطبعه في ألمانيا.", "غلط: <span class=\"en\">Caxton<\/span> مات سنة 1491.", "غلط: ده كتب <span class=\"en\">Utopia<\/span>."], "i": 29}, {"t": "learn", "h": "<div class=\"li\">السبب الظاهر لقطع العلاقة مع روما: البابا رفض يلغي جواز <span class=\"en\">Henry<\/span> من <span class=\"en\">Catherine of Aragon<\/span> عشان يتجوز <span class=\"en\">Anne Boleyn<\/span>. وكان فيه كمان فلوس وسلطة، والأديرة اتقفلت وأراضيها اتباعت.<\/div><div class=\"li\">1539: الكتاب المقدس الكبير (<span class=\"en\">Great Bible<\/span>) بالإنجليزي، بإذن الملك، واتعلق في الكنايس.<\/div><div class=\"li\">1549: كتاب الصلاة العام (<span class=\"en\">Book of Common Prayer<\/span>) بالإنجليزي. لغته لسه بتتسمع في الكنايس الإنجليزية لحد النهاردة.<\/div>", "n": 3, "a": "history-13-018", "x": "d0eb1690", "en": "The open reason for the break with Rome: the Pope refused to cancel Henry's marriage to Catherine of Aragon so he could marry Anne Boleyn. There was also money and power: the monasteries were closed and their land was sold. In 1539 came the Great Bible in English, with the king's permission, and it was placed in churches. In 1549 came the Book of Common Prayer in English. Its language is still heard in English churches today.", "i": 30}, {"t": "tf", "h": "", "q": "سنة 1534 الملك <span class=\"en\">Henry VIII<\/span> بقى رأس كنيسة إنجلترا بقانون السيادة (<span class=\"en\">Act of Supremacy<\/span>).", "nq": 1, "ans": true, "why": "صح", "ex": ["صح.", "غلط: ده حصل فعلاً سنة 1534."], "i": 31}, {"t": "learn", "h": "<div class=\"li\">1553 لـ 1558: ماري (<span class=\"en\">Mary I<\/span>) رجعت الكاثوليكية وحرقت البروتستانت، واتسمت <span class=\"en\">Bloody Mary<\/span>.<\/div><div class=\"li\">1558: إليزابيث بقت ملكة ورجعت البروتستانتية، وقانون 1559 ثبّت الكنيسة.<\/div><div class=\"li\">1562: كتاب المزامير المنظومة (<span class=\"en\">The Whole Book of Psalms<\/span>): ترجمة شعرية للمزامير، عشان الناس تغنيها في الكنايس.<\/div>", "n": 3, "a": "history-13-019", "x": "de2adf64", "en": "From 1553 to 1558 Mary I brought back Catholicism and burned Protestants, and she was called Bloody Mary. In 1558 Elizabeth became queen and brought back Protestantism, and a law of 1559 fixed the Church. In 1562 came the Whole Book of Psalms: a poetic translation of the Psalms so that people could sing them in church.", "i": 32}, {"t": "learn", "h": "<div class=\"u\">ليه ده يهمنا كشعر؟ تلات أسباب:<\/div><div class=\"u\">١. الشعب بقى عنده نص عظيم بلغته، بيتقرا في الكنيسة كل أسبوع. اللغة دي دخلت ودان الناس وذاكرتهم، والشعراء كتبوا على موسيقاها.<\/div><div class=\"u\">٢. المزامير اتترجمت شعر، فالناس اتعودت إن الشعر حاجة بتتغنى في الكنيسة، مش ترف قصور.<\/div><div class=\"u\">٣. الجدل الديني ولّد شعر سياسي وديني حاد، بيستخدم الدين في الصراع على السلطة.<\/div>", "n": 4, "a": "history-13-020", "x": "d199183b", "en": "Why does this matter for poetry? Three reasons. One: the people now had a great text in their own language, read in church every week. This language entered people's ears and memory, and poets wrote on its music. Two: the Psalms were translated into verse, so people got used to poetry as something sung in church, not a luxury of palaces. Three: the religious argument produced sharp political and religious poetry, using religion in the fight for power.", "i": 33}, {"t": "mc", "h": "", "q": "إيه أهمية الكتاب المقدس بالإنجليزي للشعر؟", "nq": 1, "opts": ["بقى عند الناس نص عظيم بلغتهم، والشعراء كتبوا على موسيقاه", "خلى الشعراء يبطلوا يكتبوا", "خلى الشعر كله بالفرنسي"], "ans": 0, "why": "بقى عند الناس نص عظيم بلغتهم، والشعراء كتبوا على موسيقاه", "ex": ["صح: دخل ودان الناس وذاكرتهم.", "غلط: العكس.", "غلط: ده مش اللي حصل."], "i": 34}, {"t": "section", "h": "النقطة 5: عار الطباعة", "i": 35}, {"t": "learn", "h": "<div class=\"u\">حقيقة غريبة: في القرن الـ16، شعراء البلاط الكبار مكانوش بيطبعوا شعرهم! كانوا يكتبوا ويسيبوا النسخ تتداول بالمخطوط بين الأصحاب.<\/div><div class=\"u\">سنة 1951 الباحث <span class=\"en\">J. W. Saunders<\/span> كتب مقال شهير اسمه \"عار الطباعة\" (<span class=\"en\">The Stigma of Print<\/span>). قال إن الشاعر الأرستقراطي كان شايف الطبع حاجة سوقية: الطبع معناه إنك محتاج فلوس أو شهرة.<\/div>", "n": 2, "a": "history-13-021", "x": "67cb11db", "en": "A strange fact: in the 16th century, the great court poets did not print their poems. They wrote, and let copies pass by hand between friends. In 1951 the scholar J. W. Saunders wrote a famous article called The Stigma of Print. He said the aristocratic poet saw printing as common: printing meant you needed money or fame.", "i": 36}, {"t": "learn", "h": "<div class=\"u\">مثال موثق: <span class=\"en\">Wyatt<\/span> مات سنة 1542، ومعظم شعره ما اتطبعش إلا سنة 1557 في مجموعة اسمها <span class=\"en\">Tottel's Miscellany<\/span>. يعني بعد موته بـ 15 سنة.<\/div><div class=\"u\">بس خد بالك: النظرية دي فيها خلاف. فيه باحثين بيقولوا مفيش \"عار طباعة\" بالمعنى ده. اللي كان عليه ضغط هو كتابة الشعر نفسه في مجتمع بيقدّر الشغل الجدي والحرب والسياسة.<\/div>", "n": 2, "a": "history-13-022", "x": "4975c6ad", "en": "A documented example: Wyatt died in 1542, and most of his poetry was not printed until 1557, in a collection called Tottel's Miscellany. That is 15 years after his death. But be careful: this theory is debated. Some scholars say there was no stigma of print in this sense. The pressure was on writing poetry itself, in a society that valued serious work, war and politics.", "i": 37}, {"t": "mc", "h": "", "q": "إيه \"عار الطباعة\" (<span class=\"en\">stigma of print<\/span>)؟", "nq": 1, "opts": ["نظرية بتقول إن شعراء البلاط كانوا شايفين الطبع حاجة سوقية", "قانون منع الطباعة", "اسم أول كتاب مطبوع"], "ans": 0, "why": "نظرية بتقول إن شعراء البلاط كانوا شايفين الطبع حاجة سوقية", "ex": ["صح: وفيه باحثين بيختلفوا معاها.", "غلط: ده مش قانون.", "غلط: ده اسم نظرية."], "i": 38}, {"t": "learn", "h": "<div class=\"u\">الدرس المهم لك كدارس: في تاريخ الأدب، فيه نظريات بتثبت وبتنكسر. النظرية الجميلة اللي بتشرح كل حاجة غالباً فيها جزء مش دقيق. خدها كأداة تفكير، مش كحقيقة نهائية.<\/div><div class=\"u\">مثال: واحد شاطر في الكتابة بس مش بينشر على السوشيال ميديا، بيبعت لأصحابه في الخاص عشان يبان جدي. ولما يموت، حد يجمع كتاباته وينشرها، والناس تتفاجئ إن عنده كل ده.<\/div>", "n": 2, "a": "history-13-023", "x": "e00e0004", "en": "The important lesson for you as a student: in literary history, theories are proven and broken. A beautiful theory that explains everything usually has a part that is not exact. Take it as a tool for thinking, not as a final truth. An example: a man who writes well but does not post on social media. He sends his texts privately to friends so he looks serious. When he dies, someone collects his writing and publishes it, and people are surprised he had all that.", "i": 39}, {"t": "tf", "h": "", "q": "نظرية \"عار الطباعة\" متفق عليها بين كل الباحثين.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: فيه باحثين بيشكوا فيها.", "صح."], "i": 40}, {"t": "section", "h": "النقطة 6: السونيت، الشكل الجديد", "i": 41}, {"t": "learn", "h": "<div class=\"u\">السونيت اتولدت في إيطاليا. أشهر شاعر فيها <span class=\"en\">Francesco Petrarca<\/span> (1304 لـ 1374). كتب مجموعة قصايد عن حبه لـ <span class=\"en\">Laura<\/span> اسمها الـ <span class=\"en\">Canzoniere<\/span>: 366 قصيدة، منها 317 سونيت.<\/div><div class=\"u\">يعني السونيت مكانتش قصيدة واحدة، دي كانت مشروع حياة كامل.<\/div>", "n": 2, "a": "history-13-024", "x": "f7868de9", "en": "The sonnet was born in Italy. Its most famous poet is Francesco Petrarca, who lived from 1304 to 1374. He wrote a collection of poems about his love for Laura, called the Canzoniere: 366 poems, and 317 of them are sonnets. So the sonnet was not one poem. It was a whole life project.", "i": 42}, {"t": "learn", "h": "<div class=\"u\">شكل السونيت الإيطالي: 14 سطر، مقسومة نصين.<\/div><div class=\"li\">الـ 8 الأولى (<span class=\"en\">octave<\/span>): قافيتها <span class=\"en\">ABBAABBA<\/span>.<\/div><div class=\"li\">الـ 6 الأخيرة (<span class=\"en\">sestet<\/span>): قافيتها <span class=\"en\">CDECDE<\/span> أو <span class=\"en\">CDCDCD<\/span>.<\/div><div class=\"u\">وفيه نقطة تحول (<span class=\"en\">volta<\/span>) بين النصين: الأولانيين بيعرضوا المشكلة أو الحالة، والتانيين بيردوا عليها أو بيقلبوها.<\/div><div class=\"u\">يعني السونيت علبة مقفولة بمقاس ثابت، ولازم تقول جواها كل حاجة.<\/div>", "n": 5, "a": "history-13-025", "x": "06a7fb24", "en": "The shape of the Italian sonnet: 14 lines in two halves. The first 8 lines, the octave, rhyme ABBAABBA. The last 6 lines, the sestet, rhyme CDECDE or CDCDCD. There is a turning point, the volta, between the two halves. The first half shows the problem or the state, and the second half answers it or turns it around. So the sonnet is a closed box of a fixed size, and you must say everything inside it.", "i": 43}, {"t": "mc", "h": "", "q": "السونيت الإيطالي بيتقسم لإيه؟", "nq": 1, "opts": ["<span class=\"en\">octave<\/span> من 8 سطور و<span class=\"en\">sestet<\/span> من 6 سطور", "4 مقاطع كل واحد 4 سطور بس", "قصيدة من سطر واحد"], "ans": 0, "why": "<span class=\"en\">octave<\/span> من 8 سطور و<span class=\"en\">sestet<\/span> من 6 سطور", "ex": ["صح: ومعاهم الـ <span class=\"en\">volta<\/span>.", "غلط: ده السونيت الإنجليزي بعدين، مش الإيطالي.", "غلط."], "i": 44}, {"t": "learn", "h": "<div class=\"u\">ليه هي مهمة للتاريخ؟ لأنها من أول الأشكال اللي بتتحدد بالعدد والقافية بشكل صارم، ومعاها فكرة التسلسل: مجموعة قصايد بتحكي حكاية حب واحدة من أولها لآخرها. وده هيبقى أساس سونيتات كتير جاية، من <span class=\"en\">Shakespeare<\/span> لـ <span class=\"en\">Barrett Browning<\/span>.<\/div><div class=\"u\">والسونيت \"مستوردة\": الإنجليز خدوها من إيطاليا. النهضة الإنجليزية مش اختراع من الصفر، دي استيراد وإعادة تصنيع. وده مش عيب، ده سر قوتها.<\/div>", "n": 2, "a": "history-13-026", "x": "1a6bf2b8", "en": "Why is it important in history? Because it is one of the first forms fixed strictly by number of lines and rhyme, and it brings the idea of a sequence: a group of poems telling one love story from start to end. This will be the base of many sonnets to come, from Shakespeare to Barrett Browning. The sonnet is imported: the English took it from Italy. The English Renaissance is not an invention from zero. It is import and re-making. This is not a weakness, it is its strength.", "i": 45}, {"t": "mc", "h": "", "q": "إيه الـ <span class=\"en\">volta<\/span> في السونيت؟", "nq": 1, "opts": ["نقطة تحول بين النصين", "آخر سطر في القصيدة", "اسم القافية"], "ans": 0, "why": "نقطة تحول بين النصين", "ex": ["صح: الأول بيعرض والتاني بيرد أو بيقلب.", "غلط: هي في النص، مش آخر سطر.", "غلط: القافية حاجة تانية."], "i": 46}, {"t": "section", "h": "الخلاصة", "i": 47}, {"t": "learn", "h": "<div class=\"u\">الدرس الجاي كله عن الاتنين اللي دخلوا السونيت لإنجلترا: <span class=\"en\">Thomas Wyatt<\/span> و<span class=\"en\">Henry Howard<\/span>، <span class=\"en\">Earl of Surrey. Wyatt<\/span> بدأ ينقل السونيت من الإيطالي. و<span class=\"en\">Surrey<\/span> هو اللي هيدّي السونيت شكلها الإنجليزي، وهيستخدم وزناً من غير قافية هيبقى أساس المسرح الإنجليزي، الوزن اللي شكسبير هيكتب بيه هاملت.<\/div>", "n": 1, "a": "history-13-027", "x": "4cd935ac", "en": "The next lesson is all about the two men who brought the sonnet to England: Thomas Wyatt and Henry Howard, Earl of Surrey. Wyatt started to carry the sonnet over from Italian. Surrey gave the sonnet its English shape, and he used a line without rhyme that will become the base of English drama, the line Shakespeare will use to write Hamlet.", "i": 48}, {"t": "learn", "h": "<div class=\"u\">الخلاصة: الشعر الإنجليزي في القرن الـ16 مش مولود من عبقرية شاعر واحد، ده مولود من تكنولوجيا وسياسة ودين وسوق.<\/div><div class=\"u\">المطبعة غيرت شكل النص، والإصلاح غير جمهوره، والإنسانية غيرت أدواته، والسونيت دخلت له شكل جديد.<\/div><div class=\"u\">وراجع الأسامي والتواريخ، لأنها هترجع كلها في الدروس الجاية.<\/div>", "n": 3, "a": "history-13-028", "x": "1a4c4513", "en": "In short: English poetry in the 16th century was not born from the genius of one poet. It was born from technology, politics, religion and the market. Printing changed the shape of the text, the Reformation changed its audience, humanism changed its tools, and the sonnet brought a new form. Review the names and dates, because they will all come back in the next lessons.", "i": 49}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"en\">Wyatt<\/span> و<span class=\"en\">Surrey<\/span>، إزاي السونيت دخلت إنجلترا وإزاي اتولد الوزن اللي كتب بيه شكسبير مسرحه.", "extra": "", "i": 50}];</script>
