<script>window.LESSON_ID="poetry-12";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">بنقفل أول وحدة (الأساسيات والصوت والشكل)، وبنجرب أول مرة نحلل قصيدة كاملة بكل الأدوات اللي خدناها.</div>", "n": 1, "i": 0, "a": "poetry-12-001", "x": "204b3d44"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: صندوق العدة", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١- <span class=\"en\">line</span> / <span class=\"en\">stanza</span>: الشكل الخارجي. المقطع = فقرة الشعر.</div><div class=\"u\">٢- <span class=\"en\">speaker</span>: اللي بيتكلم في القصيدة (مش شرط الشاعر).</div><div class=\"u\">٣- <span class=\"en\">rhythm</span> / <span class=\"en\">meter</span>: دقات السطر. الأقدام: <span class=\"en\">iamb,</span> <span class=\"en\">trochee,</span> <span class=\"en\">anapest,</span> <span class=\"en\">dactyl.</span> والوصف = نوع القدم + العدد (<span class=\"en\">tetrameter,</span> <span class=\"en\">pentameter</span>).</div><div class=\"u\">٤- القافية: تامة، <span class=\"en\">internal</span>، <span class=\"en\">slant</span>، <span class=\"en\">eye.</span> ونظامها بحروف (<span class=\"en\">ABAB,</span> <span class=\"en\">ABCB,</span> <span class=\"en\">AABB</span>).</div>", "n": 4, "i": 2, "a": "poetry-12-002", "x": "a6c77f20"}, {"t": "learn", "h": "<div class=\"u\">٥- مزيكا الصوت: <span class=\"en\">alliteration,</span> <span class=\"en\">assonance,</span> <span class=\"en\">consonance,</span> <span class=\"en\">onomatopoeia,</span> <span class=\"en\">sound symbolism.</span></div><div class=\"u\">٦- <span class=\"en\">refrain</span>: التكرار (<span class=\"en\">Nevermore</span>).</div>", "n": 2, "i": 3, "a": "poetry-12-003", "x": "0cf1c9cf"}, {"t": "learn", "h": "<div class=\"lead\">أسئلة التحليل الأربعة:</div><div class=\"u\">(أ) مين بيتكلم؟</div><div class=\"u\">(ب) الشكل إيه؟</div><div class=\"u\">(ج) الصوت والإيقاع بيعملوا إيه؟</div><div class=\"u\">(د) المعنى والإحساس؟</div>", "n": 4, "i": 4, "a": "poetry-12-004", "x": "d91a8a6e"}, {"t": "mc", "h": "", "q": "إيه أول سؤال من أسئلة التحليل الأربعة؟", "nq": 1, "opts": ["مين بيتكلم؟", "كام كلمة في القصيدة؟", "القصيدة اتكتبت إمتى بالظبط؟"], "ans": 0, "why": "مين بيتكلم؟", "ex": ["صح: (أ) مين بيتكلم؟ (ب) الشكل، (ج) الصوت والإيقاع، (د) المعنى والإحساس.", "غلط: عدد الكلمات مش من الأسئلة الأربعة.", "غلط: التاريخ مش من الأسئلة الأربعة."], "i": 5}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: القصيدة", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">William Blake</span> (بتاع <span class=\"en\">The Tyger</span>) | <span class=\"en\">The Sick Rose</span>، من <span class=\"en\">Songs of Experience</span>:</div><div class=\"u\"><span class=\"en\">O Rose thou art sick.</span></div><div class=\"u\"><span class=\"en\">The invisible worm,</span></div><div class=\"u\"><span class=\"en\">That flies in the night</span></div>", "n": 4, "i": 7, "a": "poetry-12-005", "x": "7077a75d"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">In the howling storm</span>:</div><div class=\"u\"><span class=\"en\">Has found out thy bed</span></div>", "n": 1, "i": 8, "a": "poetry-12-006", "x": "d592b4b0"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">Of crimson joy</span>:</div><div class=\"u\"><span class=\"en\">And his dark secret love</span></div><div class=\"u\"><span class=\"en\">Does thy life destroy.</span></div><div class=\"u\">اقرأها بصوت عالي مرتين. إحساسك الأول إيه؟ مخيفة؟ حزينة؟ غامضة؟ افتكره، هنرجعله.</div>", "n": 3, "i": 9, "a": "poetry-12-007", "x": "c41fce40"}, {"t": "mc", "h": "", "q": "مين كتب <span class=\"en\">The Sick Rose</span>، ومن أي مجموعة؟", "nq": 1, "opts": ["<span class=\"en\">William Blake</span>، من <span class=\"en\">Songs of Experience</span>", "<span class=\"en\">Poe</span>، من <span class=\"en\">The Raven</span>", "<span class=\"en\">Shakespeare</span>، من <span class=\"en\">Sonnet</span> 18"], "ans": 0, "why": "<span class=\"en\">William Blake</span>، من <span class=\"en\">Songs of Experience</span>", "ex": ["صح: <span class=\"en\">The Sick Rose</span> لـ <span class=\"en\">William Blake</span> من <span class=\"en\">Songs of Experience</span>.", "غلط: <span class=\"en\">Poe</span> كتب <span class=\"en\">The Raven</span>.", "غلط: <span class=\"en\">Sonnet</span> 18 قصيدة تانية."], "i": 10}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: الشكل والصوت", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">(أ) المتكلم بيخاطب الوردة مباشرة (\"<span class=\"en\">thou</span>\" = إنتي قديماً)، زي طبيب أو حبيب.</div><div class=\"u\">(ب) مقطعين، كل واحد <span class=\"en\">quatrain.</span> الـ <span class=\"en\">rhyme scheme ABCB</span>: <span class=\"en\">worm</span> / <span class=\"en\">storm</span>، و <span class=\"en\">joy</span> / <span class=\"en\">destroy.</span> نفس شكل الـ <span class=\"en\">ballad stanza.</span> شكل بسيط زي أغنية أطفال والمعنى مرعب، والتضاد ده جزء من قوتها.</div><div class=\"u\">الوزن مش منتظم: عدد المقاطع ٥-٦-٥-٥ في المقطع الأول و٥-٤-٦-٥ في التاني. وده بيدي إحساس غير مريح.</div>", "n": 3, "i": 12, "a": "poetry-12-008", "x": "268f641a"}, {"t": "mc", "h": "", "q": "نظام القافية في <span class=\"en\">The Sick Rose</span> (<span class=\"en\">worm</span> / <span class=\"en\">storm</span> و <span class=\"en\">joy</span> / <span class=\"en\">destroy</span>) هو...", "nq": 1, "opts": ["<span class=\"en\">ABCB</span>", "<span class=\"en\">AABB</span>", "<span class=\"en\">ABAB</span>"], "ans": 0, "why": "<span class=\"en\">ABCB</span>", "ex": ["صح: التاني والرابع بس بيقفلوا، يعني <span class=\"en\">ABCB</span> زي الـ <span class=\"en\">ballad stanza</span>.", "غلط: السطور اللي ورا بعض مش بتقفل.", "غلط: الأول والتالت مش بيقفلوا."], "i": 13}, {"t": "learn", "h": "<div class=\"u\">(ج) \"<span class=\"en\">howling storm</span>\": أصوات ثقيلة وعاصفة. \"<span class=\"en\">crimson joy</span>\" ضد \"<span class=\"en\">dark secret love</span>\": نعيم وسواد في سطرين ورا بعض.</div>", "n": 1, "i": 14, "a": "poetry-12-009", "x": "1e85e164"}, {"t": "mc", "h": "", "q": "إيه التضاد اللي في سطرين ورا بعض في القصيدة؟", "nq": 1, "opts": ["<span class=\"en\">crimson joy</span> و <span class=\"en\">dark secret love</span>", "<span class=\"en\">howling</span> و <span class=\"en\">storm</span>", "<span class=\"en\">thou</span> و <span class=\"en\">thy</span>"], "ans": 0, "why": "<span class=\"en\">crimson joy</span> و <span class=\"en\">dark secret love</span>", "ex": ["صح: نعيم وسواد، وده التضاد اللي بيعمل التوتر.", "غلط: دول وصف وكلمة من نفس الجو العاصف.", "غلط: دول ضمائر قديمة مش تضاد."], "i": 15}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: المعنى (قراءات مش حقائق)", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">الناقد <span class=\"en\">Nathan Cervo</span> وصفها بأنها من أغمض القصايد في الإنجليزي (<span class=\"en\">The Explicator</span>، 1990). يعني مفيش إجابة واحدة صح. قراءات شائعة:</div><div class=\"li\">الوردة والدودة رموز للإنسان: حاجة جميلة وحاجة مخفية بتدمرها.</div><div class=\"li\">الحب السري ممكن يدمر لو اتخبى أو اتكبت.</div><div class=\"li\">ناس ربطوها بقصة <span class=\"en\">Cupid and Psyche.</span></div><div class=\"li\"><span class=\"en\">Blake</span> كان بيرسم القصيدة ويطبعها بإيده، فالصورة جزء من المعنى.</div>", "n": 5, "i": 17, "a": "poetry-12-010", "x": "9b196009"}, {"t": "learn", "h": "<div class=\"u\">القاعدة الذهبية: القراءة الكويسة وراها سطر من النص. مثال: ليه الدودة \"<span class=\"en\">invisible</span>\"؟ لأن أخطر حاجة هي اللي مش بنشوفها. و\"<span class=\"en\">That flies in the night</span>\" بيدعمها: الليل = الخفاء.</div>", "n": 1, "i": 18, "a": "poetry-12-011", "x": "285abe11"}, {"t": "mc", "h": "", "q": "إيه القاعدة الذهبية لقراءة المعنى في قصيدة غامضة؟", "nq": 1, "opts": ["كل قراءة لازم يكون وراها سطر من النص", "اللي بتحسه بس من غير دليل", "اللي قاله الناقد الأشهر بس"], "ans": 0, "why": "كل قراءة لازم يكون وراها سطر من النص", "ex": ["صح: القراءة الكويسة وراها دليل من النص.", "غلط: من غير دليل مش قراءة كويسة.", "غلط: النقاد نفسهم قدموا قراءات متعددة."], "i": 19}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: قالب التحليل + تمرين", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"lead\">٤ فقرات قصيرة:</div><div class=\"u\">١- مين بيتكلم ولمين، والموضوع.</div><div class=\"u\">٢- الشكل (<span class=\"en\">stanzas</span>، <span class=\"en\">rhyme scheme</span>، الوزن).</div><div class=\"u\">٣- الصوت والصور وتأثيرهم.</div><div class=\"u\">٤- المعنى: قراءتك إنت مع دليل من النص.</div>", "n": 4, "i": 21, "a": "poetry-12-012", "x": "db87f632"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️</span></span> تمرين:</div><div class=\"u\">١- اكتب <span class=\"en\">rhyme scheme</span> لـ <span class=\"en\">The Sick Rose</span> وسمّي نوع المقطع.</div><div class=\"u\">٢- طلّع مثال <span class=\"en\">alliteration</span> أو <span class=\"en\">assonance</span> أو <span class=\"en\">consonance</span> من النص.</div><div class=\"u\">٣- اكتب فقرة قصيرة (٤-٥ سطور) تحلل المعنى: \"أنا شايف إن الدودة بترمز لـ... لأن السطر ... بيقول...\".</div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">⏳</span></span> الدرس ١٣: لغة الصور، التشبيه (<span class=\"en\">simile</span>) والاستعارة (<span class=\"en\">metaphor</span>).</div>", "n": 5, "i": 22, "a": "poetry-12-013", "x": "64279c70"}, {"t": "recall", "h": "", "q": "مين بيتكلم في <span class=\"en\">The Sick Rose</span> ولمين؟", "a": "الـ <span class=\"en\">speaker</span> بيخاطب الوردة مباشرة (\"<span class=\"en\">O Rose thou art sick</span>\").", "n": 1, "i": 23}, {"t": "recall", "h": "", "q": "كام مقطع في القصيدة، وإيه نظام قافيتها؟", "a": "مقطعين (كل واحد ٤ سطور)، ونظام القافية <span class=\"en\">ABCB.</span>", "n": 1, "i": 24}, {"t": "recall", "h": "", "q": "هات مثال على الـ <span class=\"en\">assonance</span> أو الـ <span class=\"en\">consonance</span> من القصيدة.", "a": "أمثلة: <span class=\"en\">howling storm</span> (صوت الـ <span class=\"en\">ow</span> / أصوات ثقيلة)، <span class=\"en\">dark secret</span>، <span class=\"en\">life destroy.</span>.. أي مثال مقبول لو وضحت الصوت المتكرر.", "n": 1, "i": 25}, {"t": "tf", "h": "", "q": "صح ولا غلط: في تحليل الشعر، فيه قراءة واحدة بس صح للقصيدة الغامضة.", "ans": false, "why": "غلط. القصيدة الغامضة فيها قراءات كتير، والمهم إن كل قراءة تستند لدليل من النص.", "n": 1, "i": 26, "ex": ["الجملة غلط. القصيدة الغامضة فيها قراءات كتير، والمهم إن كل قراءة تستند لدليل من النص.", "صح، الجملة غلط. القصيدة الغامضة فيها قراءات كتير، والمهم إن كل قراءة تستند لدليل من النص."]}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 27}];</script>
