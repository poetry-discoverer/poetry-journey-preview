<script>window.LESSON_ID="myth-m10";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">🎣</span></span> أول حاجة: أول طاعون في تاريخ الأدب</div><div class=\"u\">الأدب الغربي كله بيبدأ بملحمة الإلياذة، والإلياذة بتبدأ بمصيبة: طاعون بيضرب معسكر الإغريق قدام طروادة. ومين اللي باعث الطاعون؟ مش شرير، مش وحش، ده إله النور نفسه: أبولو.</div>", "n": 2, "i": 0, "a": "myth-m10-001", "x": "ab13c7bf"}, {"t": "learn", "h": "<div class=\"lead\">هوميروس بيوصف نزوله من أوليمبوس غضبان:</div><div class=\"u\">\"<span class=\"en\">The arrows rattled on the shoulders of the angry god as he moved,</span> <span class=\"en\">and his coming was like the night.</span>\"</div><div class=\"u\">(السهام كانت بترعش على كتف الإله الغضبان وهو ماشي، وقدومه كان زي الليل.) (<span class=\"en\">Iliad 1.43-52</span>، ترجمة <span class=\"en\">Murray</span>)</div>", "n": 2, "i": 1, "a": "myth-m10-002", "x": "53ed4bc1"}, {"t": "learn", "h": "<div class=\"u\">إله الضوء بييجي زي الضلمة؟ دي أول مفارقة هتتعلمها النهارده عن أبولو: الإله اللي بيشفي هو نفسه اللي بيمرض، ونوره بيحرق.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🏝️</span></span> أولاً: الميلاد على الجزيرة المنبوذة</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ أم هاربة</div><div class=\"li\">أم أبولو هي ليتو (<span class=\"en\">Leto</span>)، من التييتنز، وأبوه زيوس. هيرا مرات زيوس غارت منها غيرة قاتلة، فممنوع أي أرض \"تشوفها الشمس\" تستقبلها للولادة.</div>", "n": 4, "i": 2, "a": "myth-m10-003", "x": "5cfa9970"}, {"t": "learn", "h": "<div class=\"li\">فليتو وهي تعبانة في الوضع لفّت على عشرات الجزر والمدن، \"بس الكل كان بيرتعب ويخاف، ومحدش، ولا أغنى أرض، جرؤ يستقبل فيبوس\".</div><div class=\"li\">(ترنيمة هوميروس لأبولو، رقم 3، ترجمة <span class=\"en\">Evelyn-White</span>)</div><div class=\"li\"><span class=\"em\"><span class=\"em\">🔄</span></span> من الحياة: زي واحدة في التاسع بتدور على مستشفى تقبلها وكل الأبواب بتتقفل. الحامل في الأسطورة مش بتدور على سرير، بتدور على أرض كاملة.</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ ديلوس تقول نعم <span class=\"em\"><span class=\"em\">🤝</span></span></div>", "n": 4, "i": 3, "a": "myth-m10-004", "x": "b932ade3"}, {"t": "learn", "h": "<div class=\"li\">أخيراً وافقت جزيرة صغيرة فقيرة اسمها ديلوس (<span class=\"en\">Delos</span>): صخرية، مابتزرعش، \"سمعتها وحشة بين الناس\".</div><div class=\"li\">بس ديلوس كانت خايفة برضه: قالت لليتو \"بيقولوا ابنك هيبقى متكبر جداً، خايفة أول ما يشوف نور الشمس يحتقرني ويدفعني برجليه في البحر\".</div><div class=\"li\">فليتو حلفت أعظم قسم عند الآلهة، القسم بستيكس (نهر العالم السفلي): أبولو هيبني هنا أول معبد وأوراكل عظيم. ديلوس وافقت.</div>", "n": 3, "i": 4, "a": "myth-m10-005", "x": "7cdf2bc4"}, {"t": "mc", "h": "", "q": "أنهي جزيرة قبلت تستقبل ليتو لتلد؟", "nq": 1, "opts": ["ديلوس، جزيرة صغيرة وفقيرة", "كريت", "جزيرة كبيرة وغنية"], "ans": 0, "why": "ديلوس، جزيرة صغيرة وفقيرة", "ex": ["صح: وبقت بعدها من أقدس الجزر.", "غلط: الجزيرة كانت ديلوس.", "غلط: الأغنى رفضت."], "i": 5}, {"t": "learn", "h": "<div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ الولادة المعجزة <span class=\"em\"><span class=\"em\">✨</span></span></div><div class=\"li\">ليتو فضلت في آلام الوضع تسع أيام وتسع ليالي، لأن هيرا خبّت إيليثيا (إلهة الولادة) عشان متجيش تساعدها. الآلهات بعتوا آيريس تستدعيها سراً بوعد عقد من الذهب طوله تسع أذرع.</div><div class=\"li\">أول ما إيليثيا دست الجزيرة، ليتو حضنت شجرة نخلة وركعت على المرج، \"والأرض ضحكت من الفرحة من تحتها\"، والطفل قفز للنور.</div>", "n": 3, "i": 6, "a": "myth-m10-006", "x": "b5a3a12c"}, {"t": "learn", "h": "<div class=\"li\">ثيمس سقته النكتار والأمبروزيا، وأول ما ذاق الأكل الإلهي، قال أول كلام في حياته:</div><div class=\"u\">\"<span class=\"en\">The lyre and the curved bow shall ever be dear to me,</span> <span class=\"en\">and I will declare to men the unfailing will of Zeus.</span>\"</div><div class=\"u\">(القيثارة والقوس المعقوف هيفضلوا أعز حاجة عندي، وهبلغ الناس إرادة زيوس اللي مابتكذبش.)</div><div class=\"li\">ثلاث كلمات تلخص شخصية أبولو كلها: موسيقى، وسهم، ونبوءة.</div>", "n": 4, "i": 7, "a": "myth-m10-007", "x": "e23c645d"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">The lyre and the _____ bow shall ever be dear to me,</div>", "opts": ["curved", "steeds", "those"], "ans": 0, "why": "<span class=\"en\">The lyre and the curved bow shall ever be dear to me,</span>", "i": 8}, {"t": "learn", "h": "<div class=\"li\">وديلوس الفقيرة؟ \"اتحملت كلها دهب... وتفتحت زي قمة جبل بالزهور\"، وبقت من أقدس جزر اليونان كلها.</div><div class=\"li\">ملحوظة توأم: أخت أبولو التوأم هي أرتميس (<span class=\"en\">Artemis</span>)، الترنيمة بتقول أرتميس اتولدت في أورتيجيا وأبولو في ديلوس. هنتكلم عن أرتميس في الدرس الجاي.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🐍</span></span> ثانياً: أبولو والحية العملاقة</div>", "n": 3, "i": 9, "a": "myth-m10-008", "x": "e3a0472c"}, {"t": "mc", "h": "", "q": "إيه اللي قاله أبولو في أول كلامه بعد الميلاد؟", "nq": 1, "opts": ["القيثارة والقوس أعز حاجة عنده، وهيبلغ الناس إرادة زيوس", "هحارب أبويا", "هبني مدينة"], "ans": 0, "why": "القيثارة والقوس أعز حاجة عنده، وهيبلغ الناس إرادة زيوس", "ex": ["صح: موسيقى وسهام ونبوءة.", "غلط: مش ده الكلام.", "غلط: مش ده الكلام."], "i": 10}, {"t": "learn", "h": "<div class=\"li\">أول شغلانة لأبولو الشاب: نزل منطقة دلفي (<span class=\"en\">Delphi</span>) وقتل التنين، أو الحية العملاقة بيثون (<span class=\"en\">Python</span>)، اللي كانت بترعب الناس عند عين المية.</div><div class=\"li\">المكان اتسمى \"بيثو\" (<span class=\"en\">Pytho</span>) من الفعل اليوناني اللي معناه \"يتعفن\"، لأن جثة الحية تعفنت في الشمس. ومن هنا جه لقب أبولو \"البيثياني\" (<span class=\"en\">Pythian</span>).</div><div class=\"li\">(المصدر: الترنيمة الهوميرية لأبولو، سطور 281-374)</div>", "n": 3, "i": 11, "a": "myth-m10-009", "x": "40d14990"}, {"t": "learn", "h": "<div class=\"li\">أوفيد عنده نسخة تانية: الحية طلعت من الطينة اللي فضلت بعد الطوفان العظيم (أوفيد بيربطها بطوفان ديوكاليون، <span class=\"en\">Metamorphoses 1.434-451</span>).</div><div class=\"li\">وعلى أنقاض المعركة أبولو أسس أهم مكان في اليونان كلها: معبد وأوراكل دلفي.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🔮</span></span> ثالثاً: دلفي، سقطة اللسان اللي حكمت اليونان</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ الأوراكل</div>", "n": 4, "i": 12, "a": "myth-m10-010", "x": "83279f0f"}, {"t": "mc", "h": "", "q": "مين اللي قتل الحية بيثون عند دلفي؟", "nq": 1, "opts": ["أبولو", "هرقل", "زيوس"], "ans": 0, "why": "أبولو", "ex": ["صح: وبعدها أسس الأوراكل.", "غلط: ده مش هو.", "غلط: ده مش هو."], "i": 13}, {"t": "learn", "h": "<div class=\"li\">الأوراكل (<span class=\"en\">oracle</span>) يعني \"الوحي\": مكان تسأل فيه الإله عن المستقبل. في دلفي، كانت كاهنة اسمها البيثيا (<span class=\"en\">Pythia</span>) تقعد فوق شق في الأرض، تدخل في حالة نشوة، وتتكلم بلسان أبولو.</div><div class=\"li\">ملوك ومدن كاملة كانت بتسافر تسأل: نحارب ولا لأ؟ نبني مستعمرة فين؟ وإجابات البيثيا كانت مشهورة بغموضها.</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ التلات حكم على المعبد <span class=\"em\"><span class=\"em\">📜</span></span></div>", "n": 3, "i": 14, "a": "myth-m10-011", "x": "16a1cfcd"}, {"t": "learn", "h": "<div class=\"li\">على معبد أبولو في دلفي اتكتبت تلات حكم (من القرن الخامس ق.م على الأقل، أفلاطون بيذكر الحكم دي في حواراته):</div><div class=\"u\">أ) \"اعرف نفسك\" (<span class=\"en\">Know thyself</span> / <span class=\"en\">Gnothi seauton</span>)</div><div class=\"u\">ب) \"لا شيء بزيادة\" (<span class=\"en\">Nothing in excess</span> / <span class=\"en\">Meden agan</span>)</div><div class=\"u\">ج) \"الضمان يجيب الخراب\" (متتكفلش لحد بفلوس، هتخسر)</div>", "n": 4, "i": 15, "a": "myth-m10-012", "x": "a70b80b8"}, {"t": "learn", "h": "<div class=\"li\">الحكم دي كانت بتتنسب لسبع حكماء اليونان أو لأبولو نفسه، وبلينيوس الأكبر بيقول إنها كانت مكتوبة بحروف من ذهب. (المصدر: مقال <span class=\"en\">Delphic maxims</span>)</div><div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ كلمة دخلت الإنجليزي: <span class=\"en\">Delphic</span></div><div class=\"li\">من غموض إجابات الأوراكل جت الصفة الإنجليزية <span class=\"en\">delphic</span>: معناها \"غامض، محتمل معنيين، زي كلام الوحي\".</div>", "n": 3, "i": 16, "a": "myth-m10-013", "x": "27c5053c"}, {"t": "mc", "h": "", "q": "أنهي جملة من الحكم المكتوبة على معبد دلفي؟", "nq": 1, "opts": ["اعرف نفسك", "الصبر مفتاح الفرج", "اللي يطلع الأول يكسب"], "ans": 0, "why": "اعرف نفسك", "ex": ["صح: <span class=\"en\">Know thyself</span>.", "غلط: مش من الحكم دي.", "غلط: مش من الحكم دي."], "i": 17}, {"t": "learn", "h": "<div class=\"li\">مثال: \"<span class=\"en\">She was known for her Delphic pronouncements.</span>\"</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🏹</span></span> رابعاً: وجه أبولو التاني، إله الطاعون والشفا</div><div class=\"li\">نرجع لمشهد البداية: الإلياذة الكتاب الأول.</div><div class=\"li\">أجاممنون أهان كاهن أبولو (كريسيس) ورفض يرجعله بنته، فالكاهن صلى: \"اسمعني يا إله القوس الفضي... خلي الدانايين يدفعوا ثمن دموعي بسهامك\".</div>", "n": 4, "i": 18, "a": "myth-m10-014", "x": "1cb0ee8c"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">She was known for her Delphic _____.</div>", "opts": ["pronouncements", "verse", "enormous"], "ans": 0, "why": "<span class=\"en\">She was known for her Delphic pronouncements.</span>", "i": 19}, {"t": "learn", "h": "<div class=\"li\">فأبولو نزل، ضرب البغال والكلاب الأول، وبعدين البشر، \"وكانت محارق الموتى بتولع بلا توقف\". تسع أيام كاملة. (<span class=\"en\">Iliad 1.8-52</span>)</div><div class=\"li\">اللقب اللي اتنادى بيه هنا غريب: \"<span class=\"en\">Sminthian</span>\"، يعني إله الفئران! لأن الفئران كانت بتتربط بالطاعون.</div>", "n": 2, "i": 20, "a": "myth-m10-015", "x": "25810c6a"}, {"t": "learn", "h": "<div class=\"li\">الدرس: أبولو عند الإغريق وجهين لعملة واحدة: إله الطب والشفا، وإله الوباء. نفس السهم اللي بيقتل بيشفي. عشان كده ابنه أسكليبيوس بقى إله الطب.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🌞</span></span> خامساً: فيبوس، الاسم اللي معناه \"المشرق\"</div><div class=\"li\">اللقب الأشهر لأبولو: فيبوس (<span class=\"en\">Phoebus</span>)، من اليوناني <span class=\"en\">Phoibos</span>، ومعناه حرفياً \"المشرق، اللامع، المتوهج\".</div>", "n": 3, "i": 21, "a": "myth-m10-016", "x": "30ddae8b"}, {"t": "mc", "h": "", "q": "ليه أبولو إله الطب وإله الوباء مع بعض؟", "nq": 1, "opts": ["لأن نفس السهم اللي بيقتل بيشفي", "لأن فيه إلهين بنفس الاسم", "لأنه كان طبيب"], "ans": 0, "why": "لأن نفس السهم اللي بيقتل بيشفي", "ex": ["صح: وابنه أسكليبيوس إله الطب.", "غلط: هو إله واحد.", "غلط: ده مش التفسير."], "i": 22}, {"t": "learn", "h": "<div class=\"li\">من اللقب ده، الشعراء بعدين عاملوا أبولو على إنه إله الشمس نفسها (اليونان القدام كانوا بيفرقوا بين أبولو وهيليوس، بس الشعراء اللاتيني والإنجليز دمجوهم).</div><div class=\"li\">لما شكسبير يقول \"فيبوس بيطلع\"، فهو قاصد الشمس.</div><div class=\"li\">ومن شجرة أبولو المقدسة، الغار (<span class=\"en\">laurel</span>)، جت عادة تتويج الشعراء بالغار: \"<span class=\"en\">poet laureate</span>\"، شاعر البلاط. قصة الغار نفسها (أبولو ودافني) هنقابلها في درس لاحق.</div>", "n": 3, "i": 23, "a": "myth-m10-017", "x": "3de2b6b1"}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\">Phoebus</span>؟", "nq": 1, "opts": ["المشرق اللامع", "الغاضب", "الحكيم"], "ans": 0, "why": "المشرق اللامع", "ex": ["صح: ومنه الشمس عند الشعراء.", "غلط: المعنى المشرق.", "غلط: المعنى المشرق."], "i": 24}, {"t": "mc", "h": "", "q": "تتويج الشعراء بتاج <span class=\"en\">poet laureate</span> جاي من أنهي شجرة؟", "nq": 1, "opts": ["الغار", "الزيتون", "النخيل"], "ans": 0, "why": "الغار", "ex": ["صح: الغار شجرة أبولو.", "غلط: الشجرة المقدسة لأبولو هي الغار.", "غلط: الشجرة المقدسة لأبولو هي الغار."], "i": 25}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📜</span></span> الأسطورة في الشعر الإنجليزي</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ برسي شيلي، \"نشيد أبولو\" (<span class=\"en\">Hymn of Apollo</span>، كتبها حوالي 1820 ونشرت بعد وفاته):</div><div class=\"u\">شيلي بيخلي أبولو يغني عن نفسه، والقصيدة كلها أنا الشمس/النور. من القصيدة:</div><div class=\"u\">\"<span class=\"en\">The sunbeams are my shafts,</span> <span class=\"en\">with which I kill</span></div><div class=\"u\"><span class=\"en\">Deceit,</span> <span class=\"en\">that loves the night and fears the day.</span>\"</div><div class=\"u\">(أشعة الشمس هي سهامي، بيها أقتل الخداع اللي بيحب الليل ويخاف النهار.)</div>", "n": 6, "i": 26, "a": "myth-m10-018", "x": "7b3a183b"}, {"t": "learn", "h": "<div class=\"u\">ومن مقطع تاني في القصيدة، التلخيص العبقري لكل وظايف أبولو:</div><div class=\"u\">\"<span class=\"en\">I am the eye with which the Universe</span></div><div class=\"u\"><span class=\"en\">Beholds itself and knows itself divine</span>;</div><div class=\"u\"><span class=\"en\">All harmony of instrument or verse,</span></div><div class=\"u\"><span class=\"en\">All prophecy,</span> <span class=\"en\">all medicine is mine,</span></div><div class=\"u\"><span class=\"en\">All light of art or nature.</span>\"</div>", "n": 6, "i": 27, "a": "myth-m10-019", "x": "c1c80357"}, {"t": "learn", "h": "<div class=\"u\">(أنا العين اللي الكون بيبص بيها على نفسه ويعرف إنه إلهي؛ كل انسجام آلة أو شعر، وكل نبوءة، وكل طب، ملكي؛ كل نور فن أو طبيعة.)</div>", "n": 1, "i": 28, "a": "myth-m10-020", "x": "45fb7cb0"}, {"t": "learn", "h": "<div class=\"lead\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ جون كيتس، <span class=\"en\">Hyperion</span> الكتاب التالت (1820):</div><div class=\"u\">كيتس بيكمل قصة صعود الأوليمبيين، وبيخلي الكتاب التالت كله لأبولو الشاب على جزيرة ديلوس:</div><div class=\"u\">\"<span class=\"en\">Chief isle of the embowered Cyclades,</span></div><div class=\"u\"><span class=\"en\">Rejoice,</span> <span class=\"en\">O Delos.</span>.. <span class=\"en\">Apollo is once more the golden theme</span>!\"</div><div class=\"u\">وأبولو في القصيدة بيتحول لإله لحظة ما العلم يدخل دماغه، فيقول الجملة المشهورة:</div><div class=\"u\">\"<span class=\"en\">Knowledge enormous makes a God of me.</span>\"</div>", "n": 5, "i": 29, "a": "myth-m10-021", "x": "6ccd7ec8"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Chief isle of the _____ Cyclades,</div>", "opts": ["embowered", "sunbeams", "instrument"], "ans": 0, "why": "<span class=\"en\">Chief isle of the embowered Cyclades,</span>", "i": 30}, {"t": "learn", "h": "<div class=\"u\">(المعرفة الهائلة هي اللي بتخليني إله.) (<span class=\"en\">Hyperion 3.113</span>)</div><div class=\"li\">لاحظ فكرة كيتس: أبولو مابقتش إله بالولادة، بقى إله بالمعرفة، ومعرفة مؤلمة. دي نفس فكرة \"الحكمة تجي بالألم\" اللي شفناها عند إسخيلوس.</div>", "n": 2, "i": 31, "a": "myth-m10-022", "x": "894ba0cf"}, {"t": "learn", "h": "<div class=\"lead\">القصيدة بتفتح بشجرة أبولو نفسها:</div><div class=\"u\">\"<span class=\"en\">Yet once more,</span> <span class=\"en\">O ye laurels,</span> <span class=\"en\">and once more</span></div><div class=\"u\"><span class=\"en\">Ye myrtles brown,</span> <span class=\"en\">with ivy never sere.</span>..\"</div><div class=\"u\">(مرة تاني يا أغصان الغار...)</div><div class=\"u\">ولما الشاعر بيشكي إن الشعر مالوش قيمة، بيرد عليه أبولو نفسه في السطر 77:</div><div class=\"u\">\"<span class=\"en\">Phoebus replied,</span> <span class=\"en\">and touch'd my trembling ears.</span>\"</div><div class=\"u\">(فيبوس رد، ولمس وداني المرتعشة.)</div>", "n": 6, "i": 32, "a": "myth-m10-023", "x": "ec0740ca"}, {"t": "learn", "h": "<div class=\"li\">أبولو هنا هو حارس قيمة الشعر نفسه: بيصحح للشاعر حساباته.</div><div class=\"u\">4<span class=\"em\"><span class=\"em\">️</span></span>⃣ شكسبير، أغنية الصباح في \"<span class=\"en\">Cymbeline</span>\" (الفصل التاني، المشهد التالت):</div><div class=\"u\">\"<span class=\"en\">Hark,</span> <span class=\"en\">hark</span>! <span class=\"en\">the lark at heaven's gate sings,</span></div><div class=\"u\"><span class=\"en\">And Phoebus 'gins arise,</span></div><div class=\"u\"><span class=\"en\">His steeds to water at those springs</span></div><div class=\"u\"><span class=\"en\">On chaliced flowers that lies.</span>..\"</div>", "n": 6, "i": 33, "a": "myth-m10-024", "x": "4f48e7b8"}, {"t": "learn", "h": "<div class=\"u\">(اسمعوا! القبرة بتغني عند بوابة السما، وفيبوس بدأ يطلع، خيوله بتشرب من الينابيع اللي على الأزهار كأسية الشكل...)</div><div class=\"li\">هنا فيبوس = شروق الشمس بعينه، بعربته وخيوله.</div><div class=\"u\">5<span class=\"em\"><span class=\"em\">️</span></span>⃣ المرجع الكلاسيكي: الترنيمة الهوميرية لأبولو (ترجمة <span class=\"en\">Evelyn-White</span>) والإلياذة الكتاب الأول (ترجمة <span class=\"en\">Murray</span>)، الاتنين فوق.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🧠</span></span> سادساً: الفكرة العامة</div>", "n": 4, "i": 34, "a": "myth-m10-025", "x": "5f67184b"}, {"t": "learn", "h": "<div class=\"lead\">أبولو هو \"إله النور\" بكل معاني الكلمة:</div><div class=\"li\">نور الشمس: فيبوس، عربة الشمس، السهام المضيئة.</div><div class=\"li\">نور المعرفة: النبوءة، \"اعرف نفسك\".</div><div class=\"li\">نور الفن: القيثارة، الشعر، الغار.</div><div class=\"u\">بس افتكر المفارقة: النور القوي بيحرق. إله النور هو نفسه إله الطاعون. الإغريق فاهمين إن الحقيقة، زي الشمس، تنفع ومتوُصلهاش مباشرة.</div>", "n": 4, "i": 35, "a": "myth-m10-026", "x": "3a0a8a12"}, {"t": "learn", "h": "<div class=\"u\">ولما تيجي تذاكر النقد الأدبي قدام، هتلاقي نيتشه سمى الروح دي \"الأبولونية\" (النظام والضوء والعقل)، في مقابل \"الديونيسية\" (الفوضى والنشوة).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🔤</span></span> كلمات إنجليزي من الفصل</div><div class=\"li\"><span class=\"en\">Phoebus</span>: فيبوس، لقب أبولو، معناه المشرق/اللامع.</div><div class=\"li\"><span class=\"en\">oracle</span>: أوراكل، الوحي أو مكانه.</div><div class=\"li\"><span class=\"en\">prophecy</span>: نبوءة.</div><div class=\"li\"><span class=\"en\">prophetess</span> / <span class=\"en\">priestess</span>: كاهنة.</div><div class=\"li\"><span class=\"en\">laurel</span>: الغار (شجرة أبولو، وتاج الشعراء).</div><div class=\"li\"><span class=\"en\">lyre</span>: القيثارة.</div>", "n": 8, "i": 36, "a": "myth-m10-027", "x": "6749e133"}, {"t": "mc", "h": "", "q": "إيه اللي سماه نيتشه الأبولونية؟", "nq": 1, "opts": ["النظام والضوء والعقل", "الفوضى والنشوة", "الحرب"], "ans": 0, "why": "النظام والضوء والعقل", "ex": ["صح: وده عكس الديونيسية.", "غلط: دي الديونيسية.", "غلط: مش المقصود."], "i": 37}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">bow and arrows</span>: قوس وسهام.</div><div class=\"li\"><span class=\"en\">plague</span>: طاعون / وباء.</div><div class=\"li\"><span class=\"en\">hymn</span>: ترنيمة / نشيد ديني.</div><div class=\"li\"><span class=\"en\">Delphic</span>: غامض زي كلام الوحي.</div><div class=\"li\">\"<span class=\"en\">Know thyself</span>\": اعرف نفسك.</div><div class=\"li\">\"<span class=\"en\">Nothing in excess</span>\": لا شيء بزيادة.</div>", "n": 6, "i": 38, "a": "myth-m10-028", "x": "ec40ca90"}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 39}];</script>
