<script>window.LESSON_ID="history-15", "history-16", "history-17", "history-18", "history-19", "history-20", "history-21", "history-13", "history-14";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">⚔️ في الدرس اللي فات شفنا <span class=\"en\">Wyatt</span> و<span class=\"en\">Surrey</span> بيدخلوا السونيت إنجلترا، والاتنين ماتوا قبل ما يشوفوا كتابهم مطبوع.</div><div class=\"u\">النهاردة هنقابل راجل مختلف: شاب نبيل ومتعلم وجندي وشاعر، مات وعنده 31 سنة في حرب، وبقى أسطورة. اسمه <span class=\"en\">Philip Sidney</span>.</div>", "n": 2, "a": "history-15-001", "x": "e3118391", "en": "In the last lesson we saw Wyatt and Surrey bring the sonnet to England, and both died before they saw their book in print. Today we meet a different man: a young noble, educated, a soldier and a poet, who died at 31 in a war and became a legend. His name is Philip Sidney.", "i": 1}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Sidney</span> مش بس شاعر مهم. هو اللي خلّى الشعر الإنجليزي \"مشروع\" ليه دفاع ونظرية وسلسلة سونيتات كاملة.</div><div class=\"u\">وفي الدرس ده هنقرا مع بعض سونيتين كاملتين، لأن <span class=\"en\">Sidney</span> يستاهل القراءة مش الكلام عنه بس.</div>", "n": 2, "a": "history-15-002", "x": "78675af6", "en": "Sidney is not only an important poet. He made English poetry a project, with a defence, a theory and a full sonnet sequence. In this lesson we will read two complete sonnets together, because Sidney deserves to be read, not only talked about.", "i": 2}, {"t": "section", "h": "النقطة 1: <span class=\"en\">Sidney</span>، الراجل اللي كان كل حاجة في وقت واحد", "i": 3}, {"t": "learn", "h": "<div class=\"u\">الميلاد والعيلة:</div><div class=\"li\">اتولد يوم 30 نوفمبر 1554 في <span class=\"en\">Penshurst Place</span> في <span class=\"en\">Kent</span>.</div><div class=\"li\">أبوه <span class=\"en\">Sir Henry Sidney</span>، وأمه <span class=\"en\">Lady Mary Dudley</span>، أخت <span class=\"en\">Robert Dudley</span>، إيرل <span class=\"en\">Leicester</span>، واحد من أقرب رجال الملكة <span class=\"en\">Elizabeth</span>.</div><div class=\"li\">يعني اتولد جوه الدايرة الحاكمة، مش قريب منها بس.</div><div class=\"u\">التعليم: <span class=\"en\">Shrewsbury School</span> وبعدها <span class=\"en\">Christ Church</span> في <span class=\"en\">Oxford</span>، وبيتكلم لغات ويقرا فلسفة وتاريخ.</div>", "n": 5, "a": "history-15-003", "x": "825f8863", "en": "Birth and family. He was born on 30 November 1554 at Penshurst Place in Kent. His father was Sir Henry Sidney, and his mother was Lady Mary Dudley, sister of Robert Dudley, Earl of Leicester, one of Queen Elizabeth's closest men. So he was born inside the ruling circle, not just near it. Education: Shrewsbury School and then Christ Church, Oxford. He spoke languages and read philosophy and history.", "i": 4}, {"t": "mc", "h": "", "q": "<span class=\"en\">Philip Sidney</span> اتولد فين وفي أنهي عيلة؟", "nq": 1, "opts": ["في <span class=\"en\">Penshurst</span> في <span class=\"en\">Kent</span>، وأمه أخت <span class=\"en\">Robert Dudley</span> إيرل <span class=\"en\">Leicester</span>", "في فرنسا لعيلة فلاحين", "في اسكتلندا لعيلة ملكية"], "ans": 0, "why": "في <span class=\"en\">Penshurst</span> في <span class=\"en\">Kent</span>، وأمه أخت <span class=\"en\">Robert Dudley</span> إيرل <span class=\"en\">Leicester</span>", "ex": ["صح: يعني اتولد جوه الدايرة الحاكمة.", "غلط.", "غلط."], "i": 5}, {"t": "learn", "h": "<div class=\"u\">السفر هو التكوين الحقيقي:</div><div class=\"li\">سنة 1572، وعنده 18 سنة، سافر فرنسا مع سفارة إنجليزية.</div><div class=\"li\">وفضل في أوروبا حوالي تلات سنين: ألمانيا وإيطاليا والنمسا وغيرها.</div><div class=\"li\">في باريس كان في بيت السفير <span class=\"en\">Walsingham</span> وقت مذبحة القديس برثولماوس سنة 1572، اللي اتقتل فيها آلاف البروتستانت.</div><div class=\"li\">المشهد ده سابه أثر عميق، وخلّاه بروتستانتي متحمس ومؤمن إن أوروبا البروتستانتية لازم تتوحد.</div>", "n": 5, "a": "history-15-004", "x": "4d1b9d6a", "en": "Travel was his real education. In 1572, aged 18, he went to France with an English embassy. He stayed in Europe for about three years: Germany, Italy, Austria and more. In Paris he was in the house of the ambassador Walsingham during the St Bartholomew's Day massacre of 1572, in which thousands of Protestants were killed. This left a deep mark on him, and made him a passionate Protestant who believed Protestant Europe must unite.", "i": 6}, {"t": "tf", "h": "", "q": "<span class=\"en\">Sidney</span> كان في باريس وقت مذبحة القديس برثولماوس سنة 1572.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: وكان في بيت السفير <span class=\"en\">Walsingham</span>.", "غلط: كان فعلاً في باريس."], "i": 7}, {"t": "learn", "h": "<div class=\"u\">البلاط والمشاكل:</div><div class=\"li\">رجع إنجلترا سنة 1575، وقابل <span class=\"en\">Penelope Devereux</span>، اللي هنرجع لها بعد شوية.</div><div class=\"li\">حوالي 1579 اتخانق مع <span class=\"en\">Edward de Vere</span>، إيرل <span class=\"en\">Oxford</span>، والملكة تدخلت.</div><div class=\"li\">وكتب للملكة خطاب طويل بيعارض فيه جوازها المحتمل من الأمير الفرنسي، فزعلت من جرأته وبعد عن البلاط شوية.</div><div class=\"li\">ده بيوريك شخصيته: راجل مبدأ ومش بيعرف يسكت.</div>", "n": 5, "a": "history-15-005", "x": "e82ade71", "en": "Court and trouble. He came back to England in 1575 and met Penelope Devereux, whom we will return to soon. Around 1579 he quarrelled with Edward de Vere, Earl of Oxford, and the queen stepped in. He also wrote the queen a long letter against her possible marriage to the French prince, and she was upset by his boldness, so he stayed away from court for a while. This shows his character: a man of principle who could not keep quiet.", "i": 8}, {"t": "mc", "h": "", "q": "ليه الملكة <span class=\"en\">Elizabeth</span> زعلت من <span class=\"en\">Sidney</span>؟", "nq": 1, "opts": ["لأنه كتب لها خطاب بيعارض جوازها المحتمل من الأمير الفرنسي", "لأنه رفض يكتب شعر", "لأنه سافر فرنسا"], "ans": 0, "why": "لأنه كتب لها خطاب بيعارض جوازها المحتمل من الأمير الفرنسي", "ex": ["صح: وبعد عن البلاط شوية.", "غلط.", "غلط."], "i": 9}, {"t": "learn", "h": "<div class=\"li\">سنة 1583 اتلقب فارس، واتجوز <span class=\"en\">Frances</span> بنت <span class=\"en\">Sir Francis Walsingham</span>، وكان عندها حوالي 16 سنة.</div><div class=\"li\">في 1585 اتولدت بنته <span class=\"en\">Elizabeth</span>.</div><div class=\"li\">و<span class=\"en\">Bruno</span>، الفيلسوف الإيطالي اللي قال إن الكون لا نهائي، أهدى له كتابين سنة 1585. و<span class=\"en\">Bruno</span> اتحرق بعدها بـ 15 سنة، سنة 1600.</div>", "n": 3, "a": "history-15-006", "x": "26915160", "en": "In 1583 he was knighted and married Frances, daughter of Sir Francis Walsingham, who was about 16. In 1585 his daughter Elizabeth was born. And Bruno, the Italian philosopher who said the universe has no end, dedicated two books to him in 1585. Bruno was burned 15 years later, in 1600.", "i": 10}, {"t": "learn", "h": "<div class=\"u\">مثال من حياتنا: طالب في كلية قمة، أبوه مسؤول كبير، بيسافر في الصيف لمنظمات دولية، وبيكتب مقال يهاجم فيه سياسة الحكومة. ده <span class=\"en\">Sidney</span>: عنده كل الامتيازات وبيستخدمها عشان يقول رأيه، وده اللي خلّاه محبوب ومكروه في نفس الوقت.</div>", "n": 1, "a": "history-15-007", "x": "92434db4", "en": "An example from our life: a student in a top college, his father a senior official, travels in the summer to international groups and writes an article attacking government policy. That is Sidney: he had every privilege and used it to say what he thought, and that made him loved and disliked at the same time.", "i": 11}, {"t": "section", "h": "النقطة 2: الجندي، والموت في <span class=\"en\">Zutphen</span>", "i": 12}, {"t": "learn", "h": "<div class=\"li\">في 1585 بقى حاكم <span class=\"en\">Flushing</span> في هولندا. إنجلترا كانت بتحارب إسبانيا هناك لدعم البروتستانت.</div><div class=\"li\">في سبتمبر 1586 شارك في معركة <span class=\"en\">Zutphen</span> واتضرب برصاصة في فخده.</div><div class=\"li\">مات بالغرغرينا يوم 17 أكتوبر 1586 في <span class=\"en\">Arnhem</span>، وعنده 31 سنة.</div>", "n": 3, "a": "history-15-008", "x": "c787f785", "en": "In 1585 he became governor of Flushing in the Netherlands. England was fighting Spain there to support the Protestants. In September 1586 he fought at the battle of Zutphen and was shot in the thigh. He died of gangrene on 17 October 1586 in Arnhem, aged 31.", "i": 13}, {"t": "learn", "h": "<div class=\"u\">حكايتين صنعوا الأسطورة: إنه وهو جريح ادّى قربة المية لجندي جريح تاني وقال له: \"<span class=\"en\">Thy necessity is yet greater than mine</span>\"، يعني \"احتياجك أكبر من احتياجي\". وإنه قلع جزء من درعه عشان جنوده مش لابسين زيه.</div><div class=\"u\">خد بالك: الحكايتين وصلوا لنا من كتب ومذكرات بعد موته، ومش موثقين بقوة. المؤرخين شايفينهم جزء من \"صناعة أسطورة <span class=\"en\">Sidney</span>\" أكتر من وقائع مؤكدة.</div>", "n": 2, "a": "history-15-009", "x": "a4ce6cda", "en": "Two stories made the legend. While wounded, he gave his water bottle to another wounded soldier and said: Thy necessity is yet greater than mine, meaning your need is greater than mine. And he took off part of his armour because his men did not wear the same. Be careful: both stories reached us from books and memoirs written after his death, and they are not strongly documented. Historians see them as part of the making of the Sidney legend more than confirmed facts.", "i": 14}, {"t": "mc", "h": "", "q": "إيه موقف المؤرخين من حكاية قربة المية؟", "nq": 1, "opts": ["وصلت من كتب بعد موته وغير موثقة بقوة، وبيشوفوها جزء من صناعة الأسطورة", "حقيقة مؤكدة بالكامل", "اتكتبت في حياته"], "ans": 0, "why": "وصلت من كتب بعد موته وغير موثقة بقوة، وبيشوفوها جزء من صناعة الأسطورة", "ex": ["صح.", "غلط: مش مؤكدة.", "غلط: اتنقلت بعد موته."], "i": 15}, {"t": "learn", "h": "<div class=\"li\">جثمانه رجع لندن، واتدفن في كاتدرائية <span class=\"en\">St Paul's</span> القديمة يوم 16 فبراير 1587، في جنازة من أفخم جنازات إنجلترا. و<span class=\"en\">Walsingham</span>، حماه، اتحمل مصاريف كبيرة.</div><div class=\"li\">والقبر اتدمر في حريق لندن الكبير سنة 1666.</div><div class=\"u\">ليه ده مهم للشعر؟ لأن صورة <span class=\"en\">Sidney</span> بعد موته بقت صورة \"الراجل الكامل\" في النهضة: شجاع ومثقف وبيحب الفن وبيكتب. وده بيبني فكرة إن الشعر مش ترف، الشعر جزء من الشرف والرجولة.</div>", "n": 3, "a": "history-15-010", "x": "20d6a4ee", "en": "His body returned to London and was buried in old St Paul's Cathedral on 16 February 1587, in one of the grandest funerals in England. Walsingham, his father-in-law, paid a large cost. The tomb was destroyed in the Great Fire of London in 1666. Why does this matter for poetry? After his death, Sidney's image became the complete man of the Renaissance: brave, educated, a lover of art, and a writer. This builds the idea that poetry is not a luxury, it is part of honour and manhood.", "i": 16}, {"t": "tf", "h": "", "q": "<span class=\"en\">Sidney</span> مات بعد معركة <span class=\"en\">Zutphen</span> بسبب غرغرينا في إصابة فخده.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يوم 17 أكتوبر 1586 وعنده 31 سنة.", "غلط: ده اللي حصل فعلاً."], "i": 17}, {"t": "section", "h": "النقطة 3: <span class=\"en\">Defence of Poesy</span>، محامي الشعر", "i": 18}, {"t": "learn", "h": "<div class=\"u\">المناسبة: سنة 1579 واحد اسمه <span class=\"en\">Stephen Gosson</span>، كان كاتب مسرحيات وبقى واعظ متشدد، نشر كتاب <span class=\"en\">The School of Abuse</span> بيهاجم فيه المسرح والشعر وبيقول إنهم بيعلّموا الفساد.</div><div class=\"u\">والغريب إنه أهدى الكتاب لـ <span class=\"en\">Sidney</span> نفسه!</div><div class=\"u\">و<span class=\"en\">Sidney</span> رد بكتاب: <span class=\"en\">The Defence of Poesy</span>، واسمه كمان <span class=\"en\">An Apology for Poetry</span>. اتكتب بين 1579 و1583 تقريباً، واتنشر بعد موته سنة 1595.</div>", "n": 3, "a": "history-15-011", "x": "2a8e68c1", "en": "The occasion: in 1579 a man called Stephen Gosson, once a playwright and now a strict preacher, published The School of Abuse, attacking the theatre and poetry and saying they teach corruption. The strange thing is that he dedicated the book to Sidney himself! And Sidney answered with a book: The Defence of Poesy, also called An Apology for Poetry. It was written between about 1579 and 1583, and published after his death in 1595.", "i": 19}, {"t": "mc", "h": "", "q": "ليه كتب <span class=\"en\">Sidney</span> كتاب <span class=\"en\">Defence of Poesy</span>؟", "nq": 1, "opts": ["ردّاً على كتاب <span class=\"en\">Gosson</span> اللي بيهاجم الشعر والمسرح", "عشان يترجم الإنيادة", "عشان يطلب منصب"], "ans": 0, "why": "ردّاً على كتاب <span class=\"en\">Gosson</span> اللي بيهاجم الشعر والمسرح", "ex": ["صح: و<span class=\"en\">Gosson</span> أهدى كتابه لـ <span class=\"en\">Sidney</span> نفسه.", "غلط: ده <span class=\"en\">Surrey</span>.", "غلط."], "i": 20}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Sidney</span> كان بيواجه اتهام أقدم من <span class=\"en\">Gosson</span>: اتهام <span class=\"en\">Plato</span>، اللي في كتابه <span class=\"en\">Republic</span> طرد الشعراء من المدينة الفاضلة لأن الشعر بيكدّب وبيحرك العواطف.</div><div class=\"u\">يعني <span class=\"en\">Sidney</span> بيدافع عن الشعر قدام اتهام عمره ألفين سنة.</div>", "n": 2, "a": "history-15-012", "x": "f8a17b31", "en": "Sidney was facing an accusation older than Gosson: the accusation of Plato, who in his Republic sent poets out of the ideal city because poetry lies and moves the emotions. So Sidney defends poetry against a charge that is two thousand years old.", "i": 21}, {"t": "mc", "h": "", "q": "مين اللي اتهم الشعر قبل <span class=\"en\">Gosson</span> بألفين سنة؟", "nq": 1, "opts": ["<span class=\"en\">Plato</span>", "<span class=\"en\">Chaucer</span>", "<span class=\"en\">Caxton</span>"], "ans": 0, "why": "<span class=\"en\">Plato</span>", "ex": ["صح: في كتابه <span class=\"en\">Republic</span>.", "غلط.", "غلط."], "i": 22}, {"t": "learn", "h": "<div class=\"u\">الحجة الكبيرة: الشعر أحسن من التاريخ وأحسن من الفلسفة.</div><div class=\"li\">التاريخ بيديك حوادث حقيقية، بس من غير ترتيب أخلاقي.</div><div class=\"li\">الفلسفة بتديك قواعد أخلاقية، بس جافة ومجردة ومش بتحرك حد.</div><div class=\"li\">الشعر بياخد حيوية التاريخ وأخلاق الفلسفة ويحطهم في صورة حية، فالقارئ يتحرك ناحية الفضيلة.</div><div class=\"li\">والهدف: \"<span class=\"en\">to teach and delight</span>\"، يعني يعلّم ويسلّي، وده مأخوذ من الشاعر الروماني <span class=\"en\">Horace</span>.</div>", "n": 5, "a": "history-15-013", "x": "991f54e2", "en": "The big argument: poetry is better than history and better than philosophy. History gives you real events, but without moral order. Philosophy gives you moral rules, but dry and abstract, and it does not move anyone. Poetry takes the life of history and the morals of philosophy and puts them in a living picture, so the reader moves toward virtue. The aim: to teach and delight, an idea taken from the Roman poet Horace.", "i": 23}, {"t": "mc", "h": "", "q": "ليه الشعر أحسن من التاريخ والفلسفة عند <span class=\"en\">Sidney</span>؟", "nq": 1, "opts": ["بياخد حيوية التاريخ وأخلاق الفلسفة في صورة حية بتحرك القارئ", "لأنه أقصر منهم", "لأنه من غير أخلاق"], "ans": 0, "why": "بياخد حيوية التاريخ وأخلاق الفلسفة في صورة حية بتحرك القارئ", "ex": ["صح: والهدف يعلّم ويسلّي.", "غلط.", "غلط."], "i": 24}, {"t": "learn", "h": "<div class=\"u\">الشاعر صانع مش ناقل. كلمة <span class=\"en\">poet</span> في اليونانية أصلها \"اللي بيصنع\". والجملة المشهورة:</div><div class=\"u\">\"<span class=\"en\">Only the Poet, disdaining to be tied to any such subjection, lifted up with the vigour of his own invention, doth grow in effect into another nature</span>.\"</div><div class=\"u\">المعنى: الشاعر بس، لأنه رافض إنه يتقيد، وبقوة خياله، بيعمل طبيعة تانية.</div><div class=\"u\">وبيكمل: \"<span class=\"en\">her world is brazen, the Poets only deliver a golden</span>\". يعني عالم الطبيعة نحاس، والشعراء بس هم اللي بيقدموا دهب.</div>", "n": 4, "a": "history-15-014", "x": "4ef475b8", "en": "The poet is a maker, not a copier. The word poet in Greek comes from one who makes. The famous sentence: Only the Poet, refusing to be tied to such control, lifted up by the strength of his own invention, grows in effect into another nature. The meaning: the poet alone, because he refuses to be tied, and with the power of his imagination, makes another nature. He goes on: her world is brazen, the Poets only deliver a golden. Nature's world is brass, and only poets give gold.", "i": 25}, {"t": "learn", "h": "<div class=\"u\">والرد على تهمة الكدب. الاتهام: الشعر كدب لأنه بيحكي حاجات مش حقيقية.</div><div class=\"u\">رد <span class=\"en\">Sidney</span>: \"<span class=\"en\">Now for the Poet, he nothing affirmeth, and therefore never lieth</span>.\"</div><div class=\"u\">المعنى: الشاعر مش بيأكد حاجة، فعمره ما بيكدب. الكدب إنك تأكد حاجة وهي غلط، والشاعر بيقول \"تخيل معايا\".</div><div class=\"u\">فكرة عميقة لسه بتتقال في النقد: القصيدة مش خبر، القصيدة صورة بنتخيلها.</div>", "n": 4, "a": "history-15-015", "x": "95a51357", "en": "The answer to the charge of lying. The charge: poetry lies because it tells things that are not real. Sidney's answer: Now for the Poet, he nothing affirmeth, and therefore never lieth. The meaning: the poet affirms nothing, so he never lies. A lie is when you state something as true and it is false, and the poet says imagine with me. A deep idea still used in criticism: a poem is not news, it is a picture we imagine.", "i": 26}, {"t": "tf", "h": "", "q": "عند <span class=\"en\">Sidney</span> الشاعر بيكدب لأنه بيحكي حاجات مش حقيقية.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: الشاعر مش بيأكد حاجة، فعمره ما بيكدب.", "صح: \"<span class=\"en\">he nothing affirmeth, and therefore never lieth</span>\"."], "i": 27}, {"t": "learn", "h": "<div class=\"u\">مثال: صاحبك قال \"الأفلام مضيعة وقت وكدب\". هتقوله: الفيلم مش بيقول لك \"ده خبر حصل النهاردة\"، هو بيقول لك \"اتفرج على قصة\". عشان كده يقدر يوريك حياة كاملة في ساعتين ويخليك تحس بحاجة. ده رد <span class=\"en\">Sidney</span> بأسلوب القرن الـ16.</div><div class=\"u\">وعنده تلات أنواع للشعر: ديني، وفلسفي، وخيالي، وده الأخير هو شعر \"الشعراء الحقيقيين\".</div>", "n": 2, "a": "history-15-016", "x": "6617bae8", "en": "An example: your friend says movies are a waste of time and lies. You tell him: the film does not say this is news that happened today, it says watch a story. That is why it can show you a whole life in two hours and make you feel something. That is Sidney's answer in a 16th-century style. He also has three kinds of poetry: religious, philosophical, and imaginative, and the last is the poetry of the true poets.", "i": 28}, {"t": "learn", "h": "<div class=\"u\">الكتاب ده من أهم أول أعمال النقد الأدبي بالإنجليزي. مش قواعد شعر بس، ده دفاع عن مكانة الفن في المجتمع، ولسه بيتقرا في كليات الأدب.</div>", "n": 1, "a": "history-15-017", "x": "3dd6aca7", "en": "This book is one of the most important early works of literary criticism in English. It is not only rules for poetry. It is a defence of the place of art in society, and it is still read in literature departments.", "i": 29}, {"t": "section", "h": "النقطة 4: <span class=\"en\">Astrophil and Stella</span>، أول سلسلة سونيتات إنجليزية طويلة", "i": 30}, {"t": "learn", "h": "<div class=\"u\">إيه هي سلسلة السونيتات (<span class=\"en\">sonnet sequence</span>)؟ مجموعة سونيتات بتحكي قصة واحدة بالترتيب، فيها شخصية العاشق والمحبوبة.</div><div class=\"u\"><span class=\"en\">Wyatt</span> كتب سونيتات منفردة، لكن <span class=\"en\">Sidney</span> كتب عمل واحد: 108 سونيت و11 أغنية.</div><div class=\"u\">واتكتب حوالي 1581 لـ 1583، و<span class=\"en\">Sidney</span> ما نشرش حاجة في حياته. كانت بتتداول بخط الإيد بين الأصحاب.</div>", "n": 3, "a": "history-15-018", "x": "c10255cb", "en": "What is a sonnet sequence? A group of sonnets telling one story in order, with a lover and a beloved. Wyatt wrote single sonnets, but Sidney wrote one work: 108 sonnets and 11 songs. It was written about 1581 to 1583, and Sidney published nothing in his life. His writing passed by hand between friends.", "i": 31}, {"t": "learn", "h": "<div class=\"u\">الاسم: <span class=\"en\">Astrophil</span> من اليوناني <span class=\"en\">aster</span> (نجمة) و<span class=\"en\">phil</span> (محب)، يعني \"محب النجمة\". و<span class=\"en\">Stella</span> باللاتيني \"النجمة\". وفي الاسم لعب على اسمه هو: <span class=\"en\">Phil</span> من <span class=\"en\">Philip</span>.</div>", "n": 1, "a": "history-15-019", "x": "2f5ed87b", "en": "The name: Astrophil comes from the Greek aster, star, and phil, lover, so lover of the star. Stella in Latin means star. The name also plays on his own name: Phil from Philip.", "i": 32}, {"t": "mc", "h": "", "q": "إيه معنى اسم <span class=\"en\">Astrophil</span>؟", "nq": 1, "opts": ["محب النجمة", "فارس الحرب", "ملك النجوم"], "ans": 0, "why": "محب النجمة", "ex": ["صح: <span class=\"en\">aster</span> نجمة و<span class=\"en\">phil</span> محب.", "غلط.", "غلط."], "i": 33}, {"t": "learn", "h": "<div class=\"u\">النشر حكاية قرصنة:</div><div class=\"li\">سنة 1591، بعد موته بخمس سنين، الناشر <span class=\"en\">Thomas Newman</span> طبع السلسلة من غير إذن، والنسخة كانت مليانة أخطاء.</div><div class=\"li\">أصحاب <span class=\"en\">Sidney</span> زعلوا، وطلعت طبعة تانية في نفس السنة.</div><div class=\"li\">والنص المعتمد بعد كده طلع سنة 1598 في كتاب <span class=\"en\">Arcadia</span>، بإشراف أخته <span class=\"en\">Mary Sidney</span>، اللي كانت كاتبة ومترجمة وراعية للفنون.</div>", "n": 4, "a": "history-15-020", "x": "612ccf33", "en": "Publishing is a story of piracy. In 1591, five years after his death, the publisher Thomas Newman printed the sequence without permission, and the copy was full of mistakes. Sidney's friends were upset, and another edition came out in the same year. The standard text came later, in 1598, in the book Arcadia, under the care of his sister Mary Sidney, who was a writer, a translator and a supporter of the arts.", "i": 34}, {"t": "mc", "h": "", "q": "إمتى اتنشرت <span class=\"en\">Astrophil and Stella</span> أول مرة؟", "nq": 1, "opts": ["سنة 1591 بعد موته، من غير إذن", "في حياته سنة 1581", "سنة 1700"], "ans": 0, "why": "سنة 1591 بعد موته، من غير إذن", "ex": ["صح: والنص المعتمد طلع سنة 1598 بإشراف أخته <span class=\"en\">Mary</span>.", "غلط: <span class=\"en\">Sidney</span> ما نشرش حاجة في حياته.", "غلط."], "i": 35}, {"t": "learn", "h": "<div class=\"u\">الشكل: <span class=\"en\">Sidney</span> استخدم الشكل الإيطالي بحرية. الـ8 الأولى بقافية <span class=\"en\">ABBAABBA</span>، والـ6 الأخيرة بأشكال مختلفة، وفي كتير منها بيتين بقافية مزدوجة في الآخر زي <span class=\"en\">Surrey</span>.</div><div class=\"u\">يعني هو اللي فتح باب التنويع، وده مهّد الطريق لشكسبير.</div>", "n": 2, "a": "history-15-021", "x": "52eb64c9", "en": "The form: Sidney used the Italian form freely. The first 8 lines rhyme ABBAABBA, and the last 6 lines take different patterns, and many end with a rhyming pair like Surrey. So he opened the door to variety, which prepared the way for Shakespeare.", "i": 36}, {"t": "learn", "h": "<div class=\"u\">القصة: <span class=\"en\">Astrophil</span> بيحب <span class=\"en\">Stella</span>، وهي متجوزة. هو عايزها، وهي بترفض، وهو بيحاول يقنع نفسه إنها بتحبه، وفي الآخر بيخسر.</div><div class=\"u\">مين <span class=\"en\">Stella</span>؟ أغلب الدارسين بيقولوا إنها <span class=\"en\">Penelope Devereux</span>. أبوها كان عايز يجوزها لـ <span class=\"en\">Sidney</span> لكنه مات سنة 1576 والجواز ما حصلش، واتجوزت <span class=\"en\">Robert Rich</span> سنة 1581.</div><div class=\"u\">و<span class=\"en\">Sidney</span> لعب على اسم \"<span class=\"en\">Rich</span>\" (غني) في سونيت 24 وسونيت 37.</div>", "n": 3, "a": "history-15-022", "x": "69bf70e6", "en": "The story: Astrophil loves Stella, and she is married. He wants her, she refuses, he tries to convince himself that she loves him, and in the end he loses. Who is Stella? Most scholars say she is Penelope Devereux. Her father wanted to marry her to Sidney, but he died in 1576 and the marriage did not happen, and she married Robert Rich in 1581. And Sidney plays on the name Rich, meaning wealthy, in sonnets 24 and 37.", "i": 37}, {"t": "mc", "h": "", "q": "إيه الفرق بين سونيت منفردة وسلسلة سونيتات؟", "nq": 1, "opts": ["السلسلة مجموعة سونيتات بتحكي قصة واحدة بالترتيب", "السلسلة سونيت طويلة جداً", "مفيش فرق"], "ans": 0, "why": "السلسلة مجموعة سونيتات بتحكي قصة واحدة بالترتيب", "ex": ["صح: و<span class=\"en\">Astrophil and Stella</span> فيها 108 سونيت.", "غلط.", "غلط."], "i": 38}, {"t": "learn", "h": "<div class=\"u\">خد بالك: النقد الحديث بيميل إن <span class=\"en\">Astrophil</span> شخصية صنعها <span class=\"en\">Sidney</span>، مش <span class=\"en\">Sidney</span> نفسه بالحرف. السلسلة فيها لمحات من سيرة، بس مش مذكرات. اللي بيقول سيرة واللي بيقول فن، الاتنين عندهم حجة.</div>", "n": 1, "a": "history-15-023", "x": "a5753325", "en": "Be careful: modern criticism tends to see Astrophil as a character Sidney made, not Sidney himself word for word. The sequence has hints of real life, but it is not a diary. The people who say biography and the people who say art both have an argument.", "i": 39}, {"t": "tf", "h": "", "q": "<span class=\"en\">Astrophil</span> هو <span class=\"en\">Sidney</span> نفسه بالحرف، والسلسلة مذكرات.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: النقد الحديث بيشوفه شخصية صنعها <span class=\"en\">Sidney</span>، والسلسلة فن مش مذكرات.", "صح."], "i": 40}, {"t": "section", "h": "النقطة 5: سونيت 1، الشاعر عاجز عن الكتابة", "i": 41}, {"t": "learn", "h": "<div class=\"u\">خليني أقرا لك السونيت كاملة، لأنها من أهم 14 سطر في تاريخ الشعر الإنجليزي. الأول الثمانية الأولى:</div><div class=\"u\"><span class=\"en\">Loving in truth, and fain in verse my love to show</span>,</div><div class=\"u\"><span class=\"en\">That she, dear she, might take some pleasure of my pain</span>,</div><div class=\"u\"><span class=\"en\">Pleasure might cause her read, reading might make her know</span>,</div><div class=\"u\"><span class=\"en\">Knowledge might pity win, and pity grace obtain</span>,</div><div class=\"u\"><span class=\"en\">I sought fit words to paint the blackest face of woe</span>;</div><div class=\"u\"><span class=\"en\">Studying inventions fine, her wits to entertain</span>,</div><div class=\"u\"><span class=\"en\">Oft turning others' leaves to see if thence would flow</span></div><div class=\"u\"><span class=\"en\">Some fresh and fruitful showers upon my sun-burned brain</span>.</div>", "n": 9, "a": "history-15-024", "x": "342d5b47", "en": "Let me read the sonnet in full, because it is among the most important 14 lines in English poetry. First the first eight lines, in English. Loving in truth, and eager to show my love in verse, so that she, dear she, might take some pleasure in my pain. Pleasure might make her read, reading might make her know, knowledge might win pity, and pity bring grace. I looked for fitting words to paint the blackest face of sorrow, studying fine ideas to entertain her mind, often turning other poets' pages to see whether fresh and fruitful rain might flow onto my sun-burned brain.", "i": 42}, {"t": "learn", "h": "<div class=\"u\">والستة الأخيرة:</div><div class=\"u\"><span class=\"en\">But words came halting forth, wanting invention's stay</span>;</div><div class=\"u\"><span class=\"en\">Invention, nature's child, fled step-dame Study's blows</span>,</div><div class=\"u\"><span class=\"en\">And others' feet still seemed but strangers in my way</span>.</div><div class=\"u\"><span class=\"en\">Thus, great with child to speak, and helpless in my throes</span>,</div><div class=\"u\"><span class=\"en\">Biting my truant pen, beating myself for spite</span>,</div><div class=\"u\"><span class=\"en\">Fool, said my muse to me, look in thy heart and write</span>.</div>", "n": 7, "a": "history-15-025", "x": "8d2de11b", "en": "Now the last six lines. But words came limping out, without the support of invention. Invention, nature's child, ran away from the blows of its stepmother, Study. And other poets' steps still seemed like strangers on my way. So, heavy with the child of speech and helpless in my labour, biting my lazy pen and hitting myself in anger, my muse said to me: Fool, look in your heart and write.", "i": 43}, {"t": "learn", "h": "<div class=\"u\">المعنى: بحب بجد، وعايز أوريها حبي في شعر عشان تحس بألمي. والمتعة تخليها تقرا، والقراءة تخليها تعرف، والمعرفة تجيب الشفقة، والشفقة تجيب الرضا.</div><div class=\"u\">فدورت على كلمات، وقلّبت صفحات شعراء تانيين أشوف لو هيجيلي إلهام. لكن الكلمات طلعت بتعرج، والاختراع هرب من \"زوجة الأب\" اللي هي الدراسة.</div><div class=\"u\">فبقيت زي حد حامل بالكلام وعاجز عن الولادة، بعضّ قلمي وبضرب نفسي. فقالت لي ملهمتي: يا أهبل، بص في قلبك واكتب.</div>", "n": 3, "a": "history-15-026", "x": "10839b80", "en": "The meaning: I love truly and want to show her my love in verse so that she feels my pain. Pleasure makes her read, reading makes her know, knowledge brings pity, and pity brings her favour. So I looked for words, and turned the pages of other poets to see if inspiration would come. But the words came limping, and invention ran away from its stepmother, which is study. So I became like someone full of words and unable to give birth, biting my pen and hitting myself. And my muse said to me: fool, look in your heart and write.", "i": 44}, {"t": "learn", "h": "<div class=\"u\">ليه السونيت دي عبقرية؟</div><div class=\"u\">أولاً: بتبدأ بسلسلة منطقية: المتعة، القراءة، المعرفة، الشفقة، الرضا. العاشق بيحسبها بالورقة والقلم: لو كتبت كويس هتقرا، ولو قرأت هتعرف، ولو عرفت هترحم، ولو رحمت هتحب.</div><div class=\"u\">ثانياً: الخطة بتفشل. \"<span class=\"en\">But words came halting forth</span>\": الكلمات طلعت بتعرج. وبيشبّه نفسه بحد حامل وعاجز عن الولادة، صورة قوية بتقول إن الكتابة وجع.</div>", "n": 3, "a": "history-15-027", "x": "556adc97", "en": "Why is this sonnet clever? First: it starts with a chain of logic: pleasure, reading, knowledge, pity, favour. The lover counts it out with pen and paper: if I write well she will read, if she reads she will know, if she knows she will pity, if she pities she will love. Second: the plan fails. But words came halting forth: the words came limping. He compares himself to someone pregnant and unable to give birth, a strong picture that says writing is pain.", "i": 45}, {"t": "learn", "h": "<div class=\"u\">ثالثاً: سبب الفشل واضح: \"<span class=\"en\">Invention, nature's child, fled step-dame Study's blows</span>\". كل ما تقرا وتحفظ أكتر، بتبعد عن الإحساس الأصلي. الدراسة بقت \"زوجة أب\" قاسية مش أم.</div><div class=\"u\">رابعاً: الحل في آخر سطر: \"<span class=\"en\">Fool, said my muse to me, look in thy heart and write</span>\". سيبك من قصايد الناس، واكتب اللي إنت حاسسه.</div><div class=\"u\">و<span class=\"en\">Sidney</span> بيقول هنا حاجة عن الشعر نفسه، من غير ما يكتفي بالحب. وده اللي النقد بيسميه \"الشعر عن الشعر\".</div>", "n": 3, "a": "history-15-028", "x": "e024c69d", "en": "Third: the reason for failure is clear. Invention, nature's child, ran from the blows of its stepmother, Study. The more you read and memorise, the further you move from the original feeling. Study became a hard stepmother, not a mother. Fourth: the answer is in the last line: Fool, said my muse to me, look in thy heart and write. Forget other people's poems and write what you feel. Here Sidney says something about poetry itself, not only about love. Critics call this poetry about poetry.", "i": 46}, {"t": "mc", "h": "", "q": "إيه اللي بيقوله آخر سطر في سونيت 1؟", "nq": 1, "opts": ["بص في قلبك واكتب", "قلّد الشعراء القدام", "بطّل كتابة"], "ans": 0, "why": "بص في قلبك واكتب", "ex": ["صح: \"<span class=\"en\">look in thy heart and write</span>\".", "غلط: العكس.", "غلط."], "i": 47}, {"t": "learn", "h": "<div class=\"u\">ولأنها في أول السلسلة، هي زي \"بيان\": بتقول لك إزاي تقرا اللي جاي.</div><div class=\"u\">مثال: عايز تكتب رسالة حب، فبتدوّر على جمل جاهزة على النت، وتحس إنها فاضية. وبعد ساعة تعب، تكتب سطرين بكلامك العادي، ويطلعوا أقوى من كل الجمل المصقولة. السونيت دي هي اللحظة دي، مكتوبة في القرن الـ16.</div>", "n": 2, "a": "history-15-029", "x": "81ec69f2", "en": "Because it comes at the start of the sequence, it works like a statement of purpose: it tells you how to read what comes next. An example: you want to write a love letter, so you search for ready-made lines online, and they feel empty. After an hour of effort, you write two lines in your own words, and they come out stronger than all the polished sentences. This sonnet is that moment, written in the 16th century.", "i": 48}, {"t": "mc", "h": "", "q": "في سونيت 1، ليه هربت الأفكار من الدراسة؟", "nq": 1, "opts": ["لأن الدراسة بتبعد الشاعر عن إحساسه الأصلي، زي زوجة أب قاسية", "لأن الشاعر مكانش بيقرا", "لأن القلم اتكسر"], "ans": 0, "why": "لأن الدراسة بتبعد الشاعر عن إحساسه الأصلي، زي زوجة أب قاسية", "ex": ["صح.", "غلط: هو كان بيقلّب صفحات كتير.", "غلط."], "i": 49}, {"t": "section", "h": "النقطة 6: سونيت 31، القمر والسؤال الكبير", "i": 50}, {"t": "learn", "h": "<div class=\"u\">السونيت دي بتكلم القمر وبتسأله عن الحب. الثمانية الأولى:</div><div class=\"u\"><span class=\"en\">With how sad steps, O Moon, thou climb'st the skies</span>!</div><div class=\"u\"><span class=\"en\">How silently, and with how wan a face</span>!</div><div class=\"u\"><span class=\"en\">What, may it be that even in heavenly place</span></div><div class=\"u\"><span class=\"en\">That busy archer his sharp arrows tries</span>?</div><div class=\"u\"><span class=\"en\">Sure, if that long with love-acquainted eyes</span></div><div class=\"u\"><span class=\"en\">Can judge of love, thou feel'st a lover's case</span>;</div><div class=\"u\"><span class=\"en\">I read it in thy looks</span>; <span class=\"en\">thy languisht grace</span></div><div class=\"u\"><span class=\"en\">To me that feel the like, thy state descries</span>.</div>", "n": 9, "a": "history-15-030", "x": "ebc3892d", "en": "This sonnet talks to the moon and asks it about love. The first eight lines, in English. With how sad steps, O Moon, you climb the skies! How silently, and with how pale a face! Can it be that even in heaven that busy archer tries his sharp arrows? Surely, if eyes long used to love can judge love, you feel a lover's state. I read it in your looks: your tired grace shows me your condition, because I feel the same.", "i": 51}, {"t": "learn", "h": "<div class=\"u\">والستة الأخيرة:</div><div class=\"u\"><span class=\"en\">Then, even of fellowship, O Moon, tell me</span>,</div><div class=\"u\"><span class=\"en\">Is constant love deemed there but want of wit</span>?</div><div class=\"u\"><span class=\"en\">Are beauties there as proud as here they be</span>?</div><div class=\"u\"><span class=\"en\">Do they above love to be loved, and yet</span></div><div class=\"u\"><span class=\"en\">Those lovers scorn whom that love doth possess</span>?</div><div class=\"u\"><span class=\"en\">Do they call virtue there ungratefulness</span>?</div>", "n": 7, "a": "history-15-031", "x": "398c2295", "en": "The last six lines. Then, in fellowship, O Moon, tell me: is constant love thought there to be only lack of sense? Are the beauties there as proud as they are here? Do they above love to be loved, and yet scorn the lovers whom that love holds? Do they call ingratitude a virtue there?", "i": 52}, {"t": "learn", "h": "<div class=\"u\">المعنى: يا قمر، بتطلع السما بخطوات حزينة وسكوت ووش شاحب! ممكن حتى هناك \"الصياد المشغول\" (كيوبيد) بيجرب سهامه؟ أنا بقرا حالتك في شكلك، وأنا حاسس بنفس الحاجة.</div><div class=\"u\">فقول لي من باب الرفقة: الحب الثابت هناك بيتحسب قلة عقل؟ والجميلات متكبرات زي هنا؟ واللي فوق بيحبوا إنهم محبوبين وبيحتقروا العشاق؟ وبيسمّوا الجحود فضيلة؟</div>", "n": 2, "a": "history-15-032", "x": "e1185cad", "en": "The meaning: Moon, you climb the sky with sad steps, silence and a pale face! Can even there the busy archer, Cupid, test his arrows? I read your state in your look, and I feel the same. So tell me, in fellowship: is steady love thought there to be foolishness? Are the beautiful women proud there as they are here? Do those above love to be loved and scorn their lovers? And do they call ingratitude a virtue?", "i": 53}, {"t": "learn", "h": "<div class=\"u\">إيه اللي بيحصل هنا؟</div><div class=\"u\">أولاً: بيحوّل القمر لصاحب. القمر بيطلع بخطوات حزينة وساكتة وشاحبة، ده وصف إنسان مش جسم سماوي. <span class=\"en\">Sidney</span> شايفه عاشق زيه.</div><div class=\"u\">ثانياً: \"<span class=\"en\">I read it in thy looks</span>\": أنا بقرا حالتك في شكلك. هو مش بيسأل، هو متأكد إن القمر كمان عاشق.</div>", "n": 3, "a": "history-15-033", "x": "46f7502d", "en": "What is happening here? First: he turns the moon into a friend. The moon climbs with sad, silent, pale steps, which is a description of a person, not a heavenly body. Sidney sees it as a lover like himself. Second: I read it in thy looks: I read your state in your face. He is not asking, he is sure the moon is also a lover.", "i": 54}, {"t": "learn", "h": "<div class=\"u\">ثالثاً: الأسئلة الكبيرة: هل الحب الثابت بيتحسب غباء؟ هل الجمال متكبر؟ هل الجحود بيتسمى \"فضيلة\"؟</div><div class=\"u\">رابعاً: الشك بقى أكبر من قصة حب. العاشق مش بس زعلان من حبيبته، هو بيسأل عن عدل العالم كله. والسؤال الأخير قاسي: هل الجحود بيتسمى فضيلة؟ ده سؤال عن العدل مش عن <span class=\"en\">Stella</span> بس.</div><div class=\"u\">والشكل: الـ8 الأولى بتشوف القمر، والـ6 الأخيرة بتسأله، يعني الشكل بيمشي مع الفكرة.</div>", "n": 3, "a": "history-15-034", "x": "8f9080f9", "en": "Third: the big questions: is steady love counted as stupidity? Is beauty proud? Is ingratitude called a virtue? Fourth: the doubt becomes bigger than a love story. The lover is not only upset with his beloved, he is asking about the justice of the whole world. And the last question is hard: is ingratitude called a virtue? This is a question about justice, not only about Stella. The form: the first 8 lines look at the moon and the last 6 question it, so the form follows the idea.", "i": 55}, {"t": "mc", "h": "", "q": "ليه سونيت 31 أكبر من قصة حب؟", "nq": 1, "opts": ["لأن الشاعر بيسأل عن عدل العالم كله، مش بس عن حبيبته", "لأنها طويلة", "لأنها عن الحرب"], "ans": 0, "why": "لأن الشاعر بيسأل عن عدل العالم كله، مش بس عن حبيبته", "ex": ["صح: والسؤال الأخير عن الجحود والفضيلة.", "غلط.", "غلط."], "i": 56}, {"t": "section", "h": "النقطة 7: <span class=\"en\">Arcadia</span> وأخت <span class=\"en\">Sidney</span>", "i": 57}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Sidney</span> كتب كمان <span class=\"en\">The Countess of Pembroke's Arcadia</span>: رواية رعوية طويلة نثر، فيها حب وحروب ومؤامرات، وفيها قصايد كتير.</div><div class=\"li\">وده بيوريك إن الشعر وقتها مكانش منفصل عن الحكاية.</div><div class=\"li\">وشكسبير خد من الرواية حكاية <span class=\"en\">Gloucester</span> الفرعية في <span class=\"en\">King Lear</span>.</div><div class=\"li\">وأخته <span class=\"en\">Mary</span>، الكونتيسة، هي اللي جمعت أعماله ونشرتها. وهي نفسها كانت شاعرة ومترجمة، وكملت معاه ترجمة المزامير.</div>", "n": 4, "a": "history-15-035", "x": "275eb273", "en": "Sidney also wrote The Countess of Pembroke's Arcadia: a long pastoral romance in prose, with love, wars and plots, and many poems inside it. This shows that poetry then was not separate from story. Shakespeare took from the book the Gloucester subplot in King Lear. His sister Mary, the Countess, collected and published his works. She herself was a poet and translator, and she finished his translation of the Psalms.", "i": 58}, {"t": "learn", "h": "<div class=\"u\">وفيه حكاية إن <span class=\"en\">Sidney</span> كان في مجموعة اسمها <span class=\"en\">Areopagus</span> مع <span class=\"en\">Spenser</span> و<span class=\"en\">Dyer</span> و<span class=\"en\">Greville</span>، هدفها تطويع الشعر الإنجليزي على المقاييس الكلاسيكية. بس الدارسين مش متأكدين إن المجموعة دي كانت حقيقية، فخدها كحكاية مش كحقيقة.</div>", "n": 1, "a": "history-15-036", "x": "b36abeff", "en": "There is a story that Sidney was in a group called the Areopagus with Spenser, Dyer and Greville, which aimed to shape English poetry on classical measures. But scholars are not sure this group was real, so take it as a story and not as a fact.", "i": 59}, {"t": "tf", "h": "", "q": "مجموعة <span class=\"en\">Areopagus</span> ثابت تماماً إنها كانت حقيقية.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: الدارسين مش متأكدين منها.", "صح."], "i": 60}, {"t": "section", "h": "النقطة 8: اللي عمله <span class=\"en\">Sidney</span> في الشعر الإنجليزي", "i": 61}, {"t": "learn", "h": "<div class=\"u\">١. خلّى السونيت \"سلسلة\": بعد 1591 الشعراء كلهم عايزين يعملوا سلسلة. منها <span class=\"en\">Amoretti</span> بتاعة <span class=\"en\">Spenser</span> سنة 1595 (89 سونيت تنتهي بالجواز)، وسونيتات شكسبير الـ154 سنة 1609.</div><div class=\"u\">٢. خلّى الشعر \"مشروع\": <span class=\"en\">Defence of Poesy</span> خلّى للشعر نظرية ومكانة، ومن يومها الشعر الإنجليزي بيتكتب وهو عارف إنه بيدافع عن نفسه.</div><div class=\"u\">٣. خلّى الشاعر شخصية عامة: فارس وسياسي ومات في حرب، فبقى الشعر حاجة النبلاء بيفتخروا بيها.</div><div class=\"u\">٤. خلّى الصدق الداخلي مبدأ: \"بص في قلبك واكتب\" جملة هتتردد لقرون، وبعد حوالي 200 سنة <span class=\"en\">Wordsworth</span> هيقول إن الشعر \"فيضان تلقائي لمشاعر قوية\".</div>", "n": 4, "a": "history-15-037", "x": "ee049aed", "en": "One: he made the sonnet a sequence. After 1591 all the poets wanted to make a sequence. Among them Spenser's Amoretti in 1595, with 89 sonnets that end in marriage, and Shakespeare's 154 sonnets in 1609. Two: he made poetry a project. The Defence of Poesy gave poetry a theory and a place, and since then English poetry has been written knowing it must defend itself. Three: he made the poet a public figure: a knight and politician who died in war, so poetry became something nobles were proud of. Four: he made inner truth a principle. Look in your heart and write will echo for centuries, and about 200 years later Wordsworth will say poetry is the spontaneous overflow of powerful feelings.", "i": 62}, {"t": "mc", "h": "", "q": "مين الشاعر اللي كتب سلسلة <span class=\"en\">Amoretti</span> بعد <span class=\"en\">Sidney</span> سنة 1595؟", "nq": 1, "opts": ["<span class=\"en\">Spenser</span>", "<span class=\"en\">Wyatt</span>", "<span class=\"en\">Langland</span>"], "ans": 0, "why": "<span class=\"en\">Spenser</span>", "ex": ["صح: 89 سونيت تنتهي بالجواز.", "غلط: <span class=\"en\">Wyatt</span> قبله.", "غلط: <span class=\"en\">Langland</span> أقدم بكتير."], "i": 63}, {"t": "section", "h": "الخلاصة", "i": 64}, {"t": "learn", "h": "<div class=\"u\">الخلاصة:</div><div class=\"li\"><span class=\"en\">Sidney</span> عاش 31 سنة، وكان فارس ومفكر وشاعر، ومات في حرب وبقى أسطورة.</div><div class=\"li\"><span class=\"en\">Defence of Poesy</span> دفاع كبير عن الشعر: بيعلّم ويسلّي، والشاعر صانع مش ناقل، ومش بيكدب لأنه مش بيأكد.</div><div class=\"li\"><span class=\"en\">Astrophil and Stella</span> أول سلسلة سونيتات إنجليزية طويلة: 108 سونيت و11 أغنية، اتنشرت بعد موته سنة 1591.</div><div class=\"li\">سونيت 1 بيان السلسلة: \"بص في قلبك واكتب\".</div><div class=\"li\">سونيت 31 بيسأل القمر عن الحب، والسؤال بيكبر لسؤال عن العدل.</div>", "n": 6, "a": "history-15-038", "x": "a7ddbcf1", "en": "In short: Sidney lived 31 years, was a knight, a thinker and a poet, died in a war and became a legend. The Defence of Poesy is a great defence of poetry: it teaches and delights, the poet is a maker and not a copier, and he does not lie because he does not affirm. Astrophil and Stella is the first full English sonnet sequence: 108 sonnets and 11 songs, published after his death in 1591. Sonnet 1 is the statement of the sequence: look in your heart and write. Sonnet 31 asks the moon about love, and the question grows into a question about justice.", "i": 65}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين <span class=\"en\">Sidney</span> و<span class=\"en\">Spenser</span>: الخلفية، وأهم أعمال كل واحد، وإيه الفرق في رؤيتهم للشعر.", "a": "<div class=\"u\"><span class=\"en\">Sidney</span>: نبيل ومن قلب البلاط، فارس ومات في حرب سنة 1586 وعنده 31 سنة. أهم أعماله: <span class=\"en\">Defence of Poesy</span> (دفاع نظري عن الشعر) وسلسلة <span class=\"en\">Astrophil and Stella</span> (سونيتات حب بتحط الشكل الإيطالي في إنجليزية جديدة)، واتنشروا بعد موته.</div><div class=\"u\"><span class=\"en\">Spenser</span>: من خلفية متواضعة، اشتغل في أيرلندا، ومات سنة 1599. أهم أعماله: <span class=\"en\">The Shepheardes Calender</span> (1579) و<span class=\"en\">The Faerie Queene</span> و<span class=\"en\">Amoretti</span>. وهو بيقدّم نفسه كشاعر جديد بكتاب كامل بمقدمة وشروح.</div><div class=\"u\">الفرق: <span class=\"en\">Sidney</span> كتب نظرية الشعر ودافع عنه، و<span class=\"en\">Spenser</span> كتب مشروع شعري عملي بلغة قديمة مقصودة. و<span class=\"en\">Sidney</span> نفسه ما وافقش على اللغة الريفية القديمة في <span class=\"en\">Calender</span>.</div><div class=\"u\">الخلاصة: واحد نظّر ودافع، والتاني طبّق وبنى المشروع.</div>", "key": "history-15:CMP", "n": 1, "i": 66}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"en\">Edmund Spenser</span>، <span class=\"en\">The Shepheardes Calender</span>، والراعي اللي بيحوّل السياسة لشعر، وأول قصيدة رعوية إنجليزية كاملة.", "extra": "", "i": 67}];</script>
