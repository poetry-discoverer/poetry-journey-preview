<script>window.LESSON_ID="poetry-06";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">الدرس اللي فات اتعلمنا الـ <span class=\"en\">syllable</span> والـ <span class=\"en\">stress.</span> النهاردة نركّبهم ونبني أشهر وزن في الشعر الإنجليزي. جرب كل مثال بصوتك.</div>", "n": 1, "i": 0, "a": "poetry-06-001", "x": "391590cf"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: إيه هو الـ <span class=\"en\">foot</span> (القدم)؟", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">الإيقاع زي المشية: شمال، يمين. الاتنين مع بعض بيعملوا \"وحدة\" وبتتكرر. الوحدة دي في الشعر اسمها <span class=\"en\">foot.</span></div><div class=\"u\">الـ <span class=\"en\">foot</span>: مجموعة صغيرة من المقاطع (٢ أو ٣) مترتبين بنظام ثابت، ضعيف وقوي، وبيتكرروا على طول السطر. زي موازير الأغنية، السطر بيتقسم لأقدام. وأول حاجة في تحليل أي قصيدة: نقسّم السطر لأقدام.</div>", "n": 2, "i": 2, "a": "poetry-06-002", "x": "29eaecc0"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">foot</span> في الشعر هو...", "nq": 1, "opts": ["سطر كامل", "وحدة صغيرة من ٢ أو ٣ مقاطع بنظام ثابت بتتكرر على طول السطر", "نوع من القافية"], "ans": 1, "why": "وحدة صغيرة من ٢ أو ٣ مقاطع بنظام ثابت بتتكرر على طول السطر", "ex": ["غلط: السطر بيتكون من عدة أقدام.", "صح: الـ <span class=\"en\">foot</span> مجموعة صغيرة من المقاطع، والسطر بيتقسم لأقدام.", "غلط: القدم عن الوزن مش القافية."], "i": 3}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: الـ <span class=\"en\">iamb</span>، أشهر قدم في الإنجليزي", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">iamb</span> قدم من مقطعين: ضعيف وبعدين قوي. دا-<span class=\"en\">DUM.</span> زي ضربات القلب: دا-<span class=\"en\">DUM</span>، دا-<span class=\"en\">DUM.</span></div>", "n": 1, "i": 5, "a": "poetry-06-003", "x": "decffd3a"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">iamb</span> هو قدم من مقطعين بالترتيب ده:", "nq": 1, "opts": ["قوي بعدين ضعيف", "ضعيف بعدين قوي (<span class=\"en\">da-DUM</span>)", "قوي وقوي"], "ans": 1, "why": "ضعيف بعدين قوي (<span class=\"en\">da-DUM</span>)", "ex": ["غلط: ده الـ <span class=\"en\">trochee</span>.", "صح: <span class=\"en\">iamb</span> = ضعيف ثم قوي، زي <span class=\"en\">a-LIVE</span>.", "غلط: الـ <span class=\"en\">iamb</span> فيه ضعيف وقوي."], "i": 6}, {"t": "learn", "h": "<div class=\"lead\">كلمات <span class=\"en\">iamb</span>ية:</div><div class=\"li\"><span class=\"en\">a-LIVE</span></div><div class=\"li\"><span class=\"en\">be-LIEVE</span></div><div class=\"li\"><span class=\"en\">com-PARE</span></div><div class=\"li\"><span class=\"en\">a-WAKE</span></div><div class=\"li\"><span class=\"en\">a-LONE</span></div><div class=\"u\">قولهم ورا بعض بسرعة: <span class=\"en\">a-LIVE be-LIEVE com-PARE a-WAKE a-LONE.</span> هتحس إنك بترقص. عشان كده الـ <span class=\"en\">iamb</span> هو الإيقاع الطبيعي للإنجليزي.</div>", "n": 6, "i": 7, "a": "poetry-06-004", "x": "fd79d160"}, {"t": "mc", "h": "", "q": "أنهي كلمة من دول <span class=\"en\">iamb</span>ية (ضعيف-قوي)؟", "nq": 1, "opts": ["<span class=\"en\">TA-ble</span>", "<span class=\"en\">be-LIEVE</span>", "<span class=\"en\">HAP-pi-ly</span>"], "ans": 1, "why": "<span class=\"en\">be-LIEVE</span>", "ex": ["غلط: <span class=\"en\">TA-ble</span> نبرها في الأول.", "صح: <span class=\"en\">be-LIEVE</span> ضعيف ثم قوي.", "غلط: دي تلاتة مقاطع ونبرها في الأول."], "i": 8}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: الـ <span class=\"en\">iambic pentameter</span>، ملك الأوزان", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">خمس أقدام <span class=\"en\">iamb</span>ية ورا بعض في سطر = <span class=\"en\">iambic pentameter.</span></div><div class=\"li\"><span class=\"en\">iambic</span> = من الـ <span class=\"en\">iamb</span></div><div class=\"li\"><span class=\"en\">pentameter</span> = خمسة موازين (<span class=\"en\">penta</span> = ٥)</div><div class=\"u\">يعني ١٠ مقاطع بالظبط: <span class=\"en\">da-DUM da-DUM da-DUM da- -ATE</span></div>", "n": 2, "i": 14, "a": "poetry-06-007", "x": "bd3cb0f4"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: ليه الوزن ده مشهور؟", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">١- بيطلع طبيعي من الإنجليزي العادي.</div><div class=\"u\">٢- شكسبير كتب معظم شغله بيه.</div><div class=\"u\">٣- سهل يتحفظ، زي الأغنية.</div><div class=\"u\">والشعراء بيكسروا الوزن عمد أحياناً عشان يبرزوا كلمة. الوزن مرجعية مش قفص (هنرجعله في الدرس ٥٨).</div>", "n": 4, "i": 16, "a": "poetry-06-008", "x": "aa377545"}, {"t": "mc", "h": "", "q": "من أسباب شهرة الـ <span class=\"en\">iambic pentameter</span>...", "nq": 1, "opts": ["إنه بيطلع طبيعي من الإنجليزي العادي وسهل يتحفظ", "إنه ممنوع كسره", "إنه بدون إيقاع"], "ans": 0, "why": "إنه بيطلع طبيعي من الإنجليزي العادي وسهل يتحفظ", "ex": ["صح: طبيعي، وشكسبير كتب بيه معظم شغله، وسهل يتحفظ.", "غلط: الشعراء بيكسروه عمد أحياناً، فهو مرجعية مش قفص.", "غلط: ده وزن بإيقاع واضح."], "i": 17}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">١- الـ <span class=\"en\">foot</span>: وحدة الوزن في السطر.</div><div class=\"u\">٢- الـ <span class=\"en\">iamb</span>: ضعيف-قوي، <span class=\"en\">da-DUM.</span></div><div class=\"u\">٣- الـ <span class=\"en\">iambic pentameter</span>: ٥ أقدام <span class=\"en\">iamb</span>ية = ١٠ مقاطع.</div>", "n": 3, "i": 19, "a": "poetry-06-009", "x": "c42c9e4e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️</span></span> تمرين:</div><div class=\"u\">١- قسّم السطر ده لأقدام (حط | بينهم) وقول وزنه إيه:</div><div class=\"u\">\"<span class=\"en\">Rough winds do shake the darling buds of May,</span>\"</div><div class=\"u\">٢- هات ٣ كلمات من عندك وزنها <span class=\"en\">iamb.</span></div><div class=\"u\">٣- اكتب سطر من تأليفك فيه ١٠ مقاطع على وزن <span class=\"en\">da-DUM</span> خمس مرات. صعب شوية، بس جرب!</div><div class=\"u\">اك
