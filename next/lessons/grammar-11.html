<script>window.LESSON_ID="grammar-11";window.STEPS=[{"t":"section","h":"الألومورف","n":1,"i":0},{"t":"learn","h":"<div class=\"u\">أهلًا بيك في الدرس الحداشر. المورفيم الواحد ممكن يتنطق بأكتر من شكل. الأشكال دي اسمها <span class=\"en\">allomorphs</span>. مثلًا الجمع في <span class=\"en\">cats</span> و<span class=\"en\">dogs</span> و<span class=\"en\">buses</span> هو نفس المورفيم، بس بيتنطق <span class=\"en\">s</span> و<span class=\"en\">z</span> و<span class=\"en\">iz</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">one morpheme can have different sounds</span>.</div>","n":1,"i":1,"a":"grammar-11-001","x":"35c9a700"},{"t":"mc","q":"الجمع في <span class=\"en\">buses</span> بيتنطق:","opts":["<span class=\"en\">s</span>","<span class=\"en\">z</span>","<span class=\"en\">iz</span>"],"ans":2,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">after s-like sounds we add a vowel</span>.","ex":["غلط.","غلط.","صح: بعد صوت صفير."],"n":1,"i":2,"h":""},{"t":"section","h":"الجمع والماضي","n":1,"i":3},{"t":"learn","h":"<div class=\"u\">الجمع المنتظم، <span class=\"en\">plural</span>، له تلات أشكال. بعد صوت مهموس زي <span class=\"en\">t</span> بنقول <span class=\"en\">s</span>، زي <span class=\"en\">cats</span>. بعد صوت مجهور زي <span class=\"en\">g</span> بنقول <span class=\"en\">z</span>، زي <span class=\"en\">dogs</span>. وبعد صوت صفير زي <span class=\"en\">s</span> بنقول <span class=\"en\">iz</span>، زي <span class=\"en\">buses</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the plural sound depends on the last sound of the word</span>.</div>","n":1,"i":4,"a":"grammar-11-002","x":"63c69d40"},{"t":"mc","q":"الجمع في <span class=\"en\">dogs</span> بيتنطق:","opts":["<span class=\"en\">s</span>","<span class=\"en\">z</span>","<span class=\"en\">iz</span>"],"ans":1,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">after a voiced sound we say z</span>.","ex":["غلط: <span class=\"en\">s</span> بعد المهموس.","صح: <span class=\"en\">g</span> مجهور.","غلط: <span class=\"en\">iz</span> بعد الصفير."],"n":1,"i":5,"h":""},{"t":"learn","h":"<div class=\"u\">الماضي المنتظم، <span class=\"en\">past tense</span>، بنفس المنطق. <span class=\"en\">walked</span> بتنتهي بـ <span class=\"en\">t</span>. و<span class=\"en\">played</span> بتنتهي بـ <span class=\"en\">d</span>. و<span class=\"en\">wanted</span> بتنتهي بـ <span class=\"en\">id</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the past ending also changes with the last sound</span>.</div>","n":1,"i":6,"a":"grammar-11-003","x":"40f2e24b"},{"t":"section","h":"أنواع التحديد","n":1,"i":7},{"t":"learn","h":"<div class=\"u\">لما الشكل بيتحدد بالصوت المجاور، بنسميه <span class=\"en\">phonologically conditioned</span>. زي الجمع والماضي. ولما الشكل بيتحدد بالكلمة نفسها، بنسميه <span class=\"en\">lexically conditioned</span>. زي <span class=\"en\">ox</span> و<span class=\"en\">oxen</span>، و<span class=\"en\">child</span> و<span class=\"en\">children</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">sometimes the sound decides</span>, <span class=\"en\">and sometimes the word decides</span>.</div>","n":1,"i":8,"a":"grammar-11-004","x":"09fdaecb"},{"t":"mc","q":"<span class=\"en\">ox</span> و<span class=\"en\">oxen</span> مثال على:","opts":["<span class=\"en\">phonologically conditioned</span>","<span class=\"en\">lexically conditioned</span>","<span class=\"en\">assimilation</span>"],"ans":1,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">the word decides</span>.","ex":["غلط: الصوت مش هو السبب.","صح: الكلمة نفسها بتحدد.","غلط."],"n":1,"i":9,"h":""},{"t":"learn","h":"<div class=\"u\">وفيه <span class=\"en\">zero allomorph</span>، شكل صفري. جمع <span class=\"en\">sheep</span> هو <span class=\"en\">sheep</span>، من غير أي إضافة. وفيه <span class=\"en\">suppletion</span>، يعني شكل مختلف تمامًا، زي <span class=\"en\">go</span> و<span class=\"en\">went</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">sometimes there is no change</span>, <span class=\"en\">or a completely different word</span>.</div>","n":1,"i":10,"a":"grammar-11-005","x":"ab22b7e0"},{"t":"tf","q":"<span class=\"en\">sheep</span> في الجمع فيها <span class=\"en\">zero allomorph</span>.","ans":true,"why":"صح.","ex":["صح: جمعها <span class=\"en\">sheep</span> من غير إضافة.","غلط."],"n":1,"i":11,"h":""},{"t":"section","h":"التغيرات الصوتية","n":1,"i":12},{"t":"learn","h":"<div class=\"u\">الـ <span class=\"en\">assimilation</span> معناها إن صوت بيشبه الصوت اللي جنبه. البادئة <span class=\"en\">in</span> بتبقى <span class=\"en\">im</span> قبل <span class=\"en\">p</span> و<span class=\"en\">b</span>، زي <span class=\"en\">impossible</span>. وبتبقى <span class=\"en\">il</span> قبل <span class=\"en\">l</span>، زي <span class=\"en\">illegal</span>. و<span class=\"en\">ir</span> قبل <span class=\"en\">r</span>، زي <span class=\"en\">irregular</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a sound becomes more like the next sound</span>.</div>","n":1,"i":13,"a":"grammar-11-006","x":"4a1b9b10"},{"t":"mc","q":"<span class=\"en\">in</span> + <span class=\"en\">legal</span> = <span class=\"en\">illegal</span> هي:","opts":["<span class=\"en\">suppletion</span>","<span class=\"en\">zero allomorph</span>","<span class=\"en\">assimilation</span>"],"ans":2,"why":"<span class=\"en\">In simple English</span>: <span class=\"en\">n becomes l</span>.","ex":["غلط.","غلط.","صح: <span class=\"en\">n</span> اتشبهت بـ <span class=\"en\">l</span>."],"n":1,"i":14,"h":""},{"t":"learn","h":"<div class=\"u\">وفيه <span class=\"en\">morphophonemic alternation</span>، يعني تغيير صوتي بيحصل لما نضيف أفكس. <span class=\"en\">knife</span> بتبقى <span class=\"en\">knives</span> في الجمع. و<span class=\"en\">electric</span> بتبقى <span class=\"en\">electricity</span>، والـ <span class=\"en\">k</span> بتبقى <span class=\"en\">s</span>. و<span class=\"en\">divine</span> بتبقى <span class=\"en\">divinity</span>، والحرف المتحرك بيتغير. <span class=\"en\">In simple English</span>: <span class=\"en\">adding an affix can change the sounds inside the word</span>.</div>","n":1,"i":15,"a":"grammar-11-007","x":"76b0287a"},{"t":"section","h":"أربع زوايا","n":1,"i":16},{"t":"learn","h":"<div class=\"u\">الشكل: الألومورفات بتختلف في النطق. الوظيفة: كلها بتؤدي نفس الوظيفة النحوية. المعنى: المعنى واحد في كل الأشكال. والاستعمال: الشكل بيتختار تلقائيًا من غير ما المتكلم ياخد باله.</div>","n":1,"i":17,"a":"grammar-11-008","x":"951ba1ea"},{"t":"section","h":"الطبقة المتقدمة","n":1,"i":18},{"t":"learn","h":"<div class=\"u\">الألومورفات بتتكتب بين أقواس مائلة، زي <span class=\"en\">s</span> و<span class=\"en\">z</span> و<span class=\"en\">iz</span> بالنسبة لمورفيم الجمع. والشكل الأساسي، <span class=\"en\">basic allomorph</span>، هو اللي بنعتبره الأصل، ومنه بنشتق الباقي بقواعد. <span class=\"en\">In simple English</span>: <span class=\"en\">we choose one form as the base</span>, <span class=\"en\">and make the others with rules</span>.</div>","n":1,"i":19,"a":"grammar-11-009","x":"358a0158"},{"t":"learn","h":"<div class=\"u\">وفيه مدرستين في الشرح. المدرسة البنيوية، <span class=\"en\">item and arrangement</span>، بتقول إن الألومورفات أشكال متجاورة. ومدرسة <span class=\"en\">item and process</span> بتقول إن فيه عملية بتغيّر الشكل. <span class=\"en\">In simple English</span>: <span class=\"en\">one view lists the forms</span>, <span class=\"en\">and the other describes the changes</span>.</div>","n":1,"i":20,"a":"grammar-11-010","x":"6d4e2945"},{"t":"learn","h":"<div class=\"u\">في العربية فيه مثال قريب. الألف واللام في الشمس بتتأثر بالحرف اللي بعدها، فبنقول الشَّمس مش الْشمس. ده <span class=\"en\">assimilation</span> كمان. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic has the same kind of sound change</span>.</div>","n":1,"i":21,"a":"grammar-11-011","x":"f4e65e07"},{"t":"section","h":"مصطلحات الدرس","n":1,"i":22},{"t":"learn","h":"<div class=\"u\">هنمر على مصطلحات الدرس. <span class=\"en\">Allomorph</span>: شكل من أشكال المورفيم. <span class=\"en\">In simple English</span>: <span class=\"en\">one form of a morpheme</span>. <span class=\"en\">Conditioning</span>: التحديد. <span class=\"en\">In simple English</span>: <span class=\"en\">what decides the form</span>. <span class=\"en\">Phonologically conditioned</span>: محدد بالصوت. <span class=\"en\">Lexically conditioned</span>: محدد بالكلمة.</div>","n":1,"i":23,"a":"grammar-11-012","x":"e9bc1c8c"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Zero allomorph</span>: شكل صفري. <span class=\"en\">Suppletion</span>: شكل مختلف تمامًا. <span class=\"en\">Assimilation</span>: التشابه الصوتي. <span class=\"en\">Morphophonemic alternation</span>: تغيير صوتي مرتبط بالصرف. <span class=\"en\">Basic allomorph</span>: الشكل الأساسي. <span class=\"en\">Voiced</span>: مجهور. <span class=\"en\">Voiceless</span>: مهموس.</div>","n":1,"i":24,"a":"grammar-11-013","x":"11efadd5"},{"t":"tf","q":"<span class=\"en\">go</span> و<span class=\"en\">went</span> مثال على <span class=\"en\">assimilation</span>.","ans":false,"why":"غلط: ده <span class=\"en\">suppletion</span>.","ex":["غلط: ده شكل مختلف تمامًا.","صح، الجملة غلط."],"n":1,"i":25,"h":""},{"t":"section","h":"الخلاصة","n":1,"i":26},{"t":"learn","h":"<div class=\"u\">أربع نقط. واحد: المورفيم الواحد ممكن له أشكال، اسمها <span class=\"en\">allomorphs</span>. اتنين: الشكل بيتحدد بالصوت أو بالكلمة. تلاتة: الـ <span class=\"en\">assimilation</span> بتخلي الصوت يشبه اللي جنبه. أربعة: إضافة الأفكس ممكن تغيّر أصوات الكلمة. <span class=\"en\">In short</span>: <span class=\"en\">one morpheme can have many forms</span>. الدرس الجاي: من الكلمة للجملة.</div>","n":1,"i":27,"a":"grammar-11-014","x":"0d799056"},{"t":"section","h":"الكويز","n":1,"i":28},{"t":"recall","q":"إيه هي أشكال الجمع المنتظم الثلاثة؟","a":"<span class=\"en\">s</span> و<span class=\"en\">z</span> و<span class=\"en\">iz</span>. زي <span class=\"en\">cats</span> و<span class=\"en\">dogs</span> و<span class=\"en\">buses</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">three sounds for one plural morpheme</span>.","n":1,"i":29,"h":""},{"t":"recall","q":"إيه الفرق بين <span class=\"en\">phonologically</span> و<span class=\"en\">lexically conditioned</span>؟","a":"الأول الصوت المجاور بيحدد الشكل، والتاني الكلمة نفسها. <span class=\"en\">In simple English</span>: <span class=\"en\">sound decides</span>, <span class=\"en\">or the word decides</span>.","n":1,"i":30,"h":""},{"t":"write","q":"اشرح ليه المورفيم الواحد له أكتر من ألومورف بمثال (٣-٤ جمل).","key":"grammar-11:1","a":"المورفيم هو الوحدة الصغيرة بمعنى واحد، لكن نطقه بيتأثر بالصوت اللي جنبه. الجمع المنتظم له <span class=\"en\">s</span> و<span class=\"en\">z</span> و<span class=\"en\">iz</span> حسب آخر صوت. كلهم نفس المعنى والوظيفة. <span class=\"en\">In simple English</span>: <span class=\"en\">same meaning</span>, <span class=\"en\">different sounds</span>.","n":1,"i":31,"h":""},{"t":"write","q":"اشرح ليه <span class=\"en\">electricity</span> فيها تغيير صوتي (٣-٤ جمل).","key":"grammar-11:2","a":"لما أضفنا <span class=\"en\">ity</span> لـ <span class=\"en\">electric</span>، الـ <span class=\"en\">k</span> اتحولت لـ <span class=\"en\">s</span>. ده <span class=\"en\">morphophonemic alternation</span>. يعني الأفكس غيّر صوت الجذر. <span class=\"en\">In simple English</span>: <span class=\"en\">the suffix changed the sound</span>.","n":1,"i":32,"h":""},{"t":"write","h":"","q":"<b>مقارنة:</b> قارن بين الألومورف المحدد بالصوت (<span class=\"en\">phonologically conditioned</span>) والمحدد بالكلمة (<span class=\"en\">lexically conditioned</span>).","a":"<div class=\"u\">المحدد بالصوت بيتبع قاعدة عامة، زي جمع <span class=\"en\">cats</span> و<span class=\"en\">dogs</span> و<span class=\"en\">buses</span>، وبيتنبأ بيه من الصوت المجاور.</div><div class=\"u\">أما المحدد بالكلمة فبيتحفظ كلمة كلمة، زي <span class=\"en\">ox</span> و<span class=\"en\">oxen</span> و<span class=\"en\">child</span> و<span class=\"en\">children</span>. الأول منتظم ومفتوح للكلمات الجديدة، والتاني محدود ومحفوظ.</div>","key":"grammar-11:3","n":1,"i":33},{"t":"write","h":"","q":"<b>مقارنة:</b> قارن بين مدرسة <span class=\"en\">item and arrangement</span> ومدرسة <span class=\"en\">item and process</span> في وصف الألومورفات.","a":"<div class=\"u\"><span class=\"en\">item and arrangement</span> بتشوف الألومورفات أشكال متجاورة ومرتبة، وبتسجلها كقائمة. و<span class=\"en\">item and process</span> بتشوف إن فيه عملية بتحول الشكل الأساسي لشكل تاني.</div><div class=\"u\">الأولى أبسط في الوصف، والتانية أقدر على تفسير التغيرات الصوتية زي <span class=\"en\">knife</span> و<span class=\"en\">knives</span>.</div>","key":"grammar-11:4","n":1,"i":34},{"t":"end","h":"","teaser":"<div class=\"u\">الدرس الجاي: من الكلمة للجملة.</div><div class=\"u\">هندخل الوحدة الثالثة ونشوف إزاي الكلمات بتتجمع.</div>","extra":"المصادر: Bloomfield (1933); Hockett (1954); Spencer (1991).","i":35}];</script>
