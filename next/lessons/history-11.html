<script>window.LESSON_ID="history-11";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Sir Gawain and the Green Knight</span> و<span class=\"en\">Pearl</span>: أعظم شاعر مجهول في التاريخ\"</div>", "n": 1, "i": 0, "a": "history-11-001", "x": "b5a4589d"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">🎭</span></span> في الدرس اللي فات شفنا <span class=\"en\">Chaucer</span>، الراجل اللي عنده اسم وصورة ووظيفة وقبر في <span class=\"en\">Westminster.</span> النهاردة هنتعرف على العكس بالظبط: شاعر مفيش حد في الدنيا يعرف اسمه، ولا فيه صورة ليه، ولا سطر واحد اتكتب عنه في حياته. ومع كل ده، شعره بيتحط جنب <span class=\"en\">Chaucer</span> في القمة. الدرس ده كمان فيه حاجة أهم: هنكتشف إن الشعر الإنجليزي مكانش طريق واحد، كان طريقتين بيتنافسوا.</div>", "n": 1, "i": 1, "a": "history-11-002", "x": "c30eca46"}, {"t": "learn", "h": "<div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️</span></span>⃣: مخطوطة واحدة فيها أربع تحف <span class=\"em\"><span class=\"em\">📜</span></span></div>", "n": 1, "i": 2, "a": "history-11-003", "x": "ffefdf3f"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الحكاية من الآخر:</div><div class=\"li\">كل اللي نعرفه عن الشاعر ده جه من مخطوطة واحدة بس، محفوظة في المكتبة البريطانية باسم <span class=\"en\">Cotton Nero A.x.</span></div><div class=\"li\">المخطوطة دي فيها أربع قصائد، ومفيش نسخة تانية منهم في الدنيا كلها:</div><div class=\"u\">١. <span class=\"en\">Pearl</span> (اللؤلؤة)</div><div class=\"u\">٢. <span class=\"en\">Cleanness</span> (أو <span class=\"en\">Purity</span>) - عن النقاء والطهر</div><div class=\"u\">٣. <span class=\"en\">Patience</span> (الصبر) - عن يونس والنبي</div><div class=\"u\">٤. <span class=\"en\">Sir Gawain and the Green Knight -</span> تحفته الكبرى</div>", "n": 6, "i": 3, "a": "history-11-004", "x": "c5265623"}, {"t": "learn", "h": "<div class=\"li\">المخطوطة نفسها مكتوبة حوالي سنة 1400، بس القصائد نفسها متألفة في النص التاني من القرن الـ14 (حوالي 1375-1400). يعني الناسخ مش الشاعر، وده واضح من اللغة والغلطات.</div><div class=\"li\">ولا قصيدة منهم ليها عنوان في المخطوطة! كل العناوين اللي بنستخدمها النهاردة من صنع المحررين المحدثين. ولا فيه اسم مؤلف.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> ليه اسم \"<span class=\"en\">Cotton Nero A.x</span>\"؟</div>", "n": 3, "i": 4, "a": "history-11-005", "x": "29c44234"}, {"t": "mc", "h": "", "q": "كل اللي نعرفه عن شاعر <span class=\"en\">Gawain</span> جه من إيه؟", "nq": 1, "opts": ["مخطوطة واحدة اسمها <span class=\"en\">Cotton Nero A.x</span> فيها أربع قصائد", "عشرات المخطوطات في مكتبات كتير", "كتاب سيرة ذاتية كتبه بنفسه"], "ans": 0, "why": "مخطوطة واحدة اسمها <span class=\"en\">Cotton Nero A.x</span> فيها أربع قصائد", "ex": ["صح: ومفيش نسخة تانية منهم.", "غلط: النسخة واحدة بس.", "غلط: ما نعرفش اسمه أصلاً."], "i": 5}, {"t": "learn", "h": "<div class=\"li\">السير <span class=\"en\">Robert Cotton</span>، جامع كتب في القرن الـ16، كان بيرتب مكتبته بشكل غريب: كل رف تحته تمثال لإمبراطور روماني.</div><div class=\"li\">المخطوطة دي كانت تحت تمثال نيرون (<span class=\"en\">Nero</span>)، في الرف العلوي، والكتاب العاشر في الرف. فبقت \"<span class=\"en\">Cotton Nero A.x</span>\".</div><div class=\"li\">ومخطوطة <span class=\"en\">Beowulf</span> اسمها \"<span class=\"en\">Cotton Vitellius A.xv</span>\" بنفس النظام، على اسم تمثال الإمبراطور <span class=\"en\">Vitellius.</span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> إزاي ظهرت للدنيا؟</div>", "n": 4, "i": 6, "a": "history-11-006", "x": "f6844791"}, {"t": "learn", "h": "<div class=\"li\">المخطوطة قعدت منسية قرون. دخلت مكتبة السير <span class=\"en\">Cotton</span> من مكتبة <span class=\"en\">Henry Savile</span> في <span class=\"en\">Yorkshire.</span></div><div class=\"li\">سنة 1824 اتكلم عنها أول مرة بشكل أكاديمي، وسنة 1839 طُبعت القصيدة كاملة لأول مرة بتحقيق السير <span class=\"en\">Frederic Madden</span>، وهو اللي إداها العنوان اللي بنعرفه.</div><div class=\"li\">يعني القصيدة دي من نفس جيل <span class=\"en\">Chaucer</span> تقريباً، ومع ذلك القراء ما عرفوهاش غير من حوالي 200 سنة!</div>", "n": 3, "i": 7, "a": "history-11-007", "x": "fad15817"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> مين الشاعر بقى؟ (بروفايل من غير اسم) <span class=\"em\"><span class=\"em\">🕵️</span></span></div><div class=\"li\">الدارسين بيسموه \"<span class=\"en\">the Gawain Poet</span>\" أو \"<span class=\"en\">the Pearl Poet</span>\" - اسمين مستعارين، مش اسمه الحقيقي.</div><div class=\"li\">من لهجة القصائد: من شمال غرب إنجلترا، تحديداً على حدود <span class=\"en\">Cheshire</span> و<span class=\"en\">Staffordshire.</span></div>", "n": 3, "i": 8, "a": "history-11-008", "x": "b02792f3"}, {"t": "learn", "h": "<div class=\"li\">من شعره: راجل متعلم جداً، يعرف الفرنسية واللاتينية، يعرف البلاط وآدابه، وبيعرف الكتاب المقدس حرفياً. كتير من الدارسين بيقولوا إنه غالباً رجل دين (<span class=\"en\">cleric</span>).</div><div class=\"li\">أشهر مرشح للاسم: <span class=\"en\">John Massey</span> من <span class=\"en\">Cheshire.</span> بس الترشيح ده لسه محل خلاف، والأغلبية بتقول: مجهول.</div>", "n": 2, "i": 9, "a": "history-11-009", "x": "4ab6116c"}, {"t": "mc", "h": "", "q": "إزاي نعرف الشاعر ده؟", "nq": 1, "opts": ["بدراسة اسمه الحقيقي في سجلات الملك", "بلقب مستعار: <span class=\"en\">the Gawain Poet</span> أو <span class=\"en\">the Pearl Poet</span>", "باسم <span class=\"en\">Chaucer</span>"], "ans": 1, "why": "بلقب مستعار: <span class=\"en\">the Gawain Poet</span> أو <span class=\"en\">the Pearl Poet</span>", "ex": ["غلط: اسمه الحقيقي مجهول.", "صح: ده لقب الدارسين، مش اسمه.", "غلط: <span class=\"en\">Chaucer</span> شاعر تاني معروف الاسم."], "i": 10}, {"t": "learn", "h": "<div class=\"li\">المثال اليومي: زي ما تلاقي فلاشة قديمة فيها أربع أغاني لرابر مجهول، مفيش اسم على الملفات، ومفيش صور، ومفيش أي أثر ليه على النت.</div><div class=\"li\">وكل اللي تقدر تعرفه عنه إنك تسمع الأغاني وتحلل اللغة والمواضيع. ده بالظبط اللي عمله العلماء مع المخطوطة دي.</div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️</span></span>⃣: عودة الجناس: الـ <span class=\"en\">Alliterative Revival</span> <span class=\"em\"><span class=\"em\">🔁</span></span></div>", "n": 3, "i": 11, "a": "history-11-010", "x": "10e6380e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> افتكر درسين 2 و3:</div><div class=\"li\">في <span class=\"en\">Beowulf</span>، الشعر كان بيمشي بالجناس (<span class=\"en\">alliteration</span>): تكرار نفس الصوت في أول الكلمات، زي \"<span class=\"en\">Hw</span>æ<span class=\"en\">t we Gar-Dena in geardagum</span>\". مفيش قافية خالص.</div><div class=\"li\">بعد 1066، فرنسا دخلت القافية والعدّ بالمقاطع، والطريق ده هو اللي <span class=\"en\">Chaucer</span> مشي فيه.</div>", "n": 2, "i": 12, "a": "history-11-011", "x": "6d9b51e0"}, {"t": "learn", "h": "<div class=\"li\">فهل الجناس مات؟ لأ! فضل حي في شمال وغرب إنجلترا، بعيد عن لندن، وفي القرن الـ14 رجع بقوة في قصائد زي <span class=\"en\">Gawain</span> و<span class=\"en\">Piers Plowman</span> و<span class=\"en\">Morte Arthure.</span></div><div class=\"li\">الظاهرة دي اسمها \"<span class=\"en\">the Alliterative Revival</span>\" - إحياء الشعر الجناسي.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> بس فيه جدل علمي حلو (وهو درس في التفكير النقدي):</div>", "n": 3, "i": 13, "a": "history-11-012", "x": "0390c741"}, {"t": "learn", "h": "<div class=\"li\">فيه علماء بيقولوا: \"إحياء\" إيه؟ مفيش قصيدة جناسية معروف تأريخها بين حوالي 1250 وحوالي 1340. يعني فيه فراغ حوالي 90 سنة في الأدلة. فممكن يكون انقطاع حقيقي ورجوع مفاجئ.</div><div class=\"li\">وفيه علماء تانيين (زي دراسات الوزن الحديثة) بيقولوا: لأ، الوزن نفسه فضل شغال.</div>", "n": 2, "i": 14, "a": "history-11-013", "x": "79cfc7d2"}, {"t": "learn", "h": "<div class=\"li\">السطر لسه مقسوم نصين بسكتة في النص (<span class=\"en\">caesura</span>)، والكلمات المهمة لسه بتاخد النبرة. يعني التقليد ما ماتش، إحنا بس فقدنا النصوص اللي في النص.</div><div class=\"li\">الخلاصة اللي تاخدها: في تاريخ الأدب، \"الانقطاع\" كتير بيطلع مجرد نقص في الأدلة. النصوص اللي بتوصلنا هي اللي بترسم التاريخ، مش كل اللي اتكتب.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> إيه الجديد اللي عمله شاعر <span class=\"en\">Gawain</span>؟</div>", "n": 3, "i": 15, "a": "history-11-014", "x": "f1966a40"}, {"t": "learn", "h": "<div class=\"li\">خد السطر القديم الطويل (زي <span class=\"en\">Beowulf</span>) وحطّه في إطار جديد: كل مقطع (<span class=\"en\">stanza</span>) بيتكون من عدد متغير من السطور الجناسية غير المقفّاة، وفي الآخر بيقفل بـ:</div><div class=\"li\">الـ <span class=\"en\">bob</span>: سطر قصير جداً، كلمتين أو تلاتة.</div><div class=\"li\">الـ <span class=\"en\">wheel</span>: أربع سطور قصيرة، وبتقفل مع الـ <span class=\"en\">bob</span> بقافية <span class=\"en\">ababa.</span></div>", "n": 3, "i": 16, "a": "history-11-015", "x": "b6fb20c2"}, {"t": "learn", "h": "<div class=\"li\">النظام ده اسمه \"<span class=\"en\">bob and wheel</span>\" وهو توقيع الشاعر ده. تخيله زي الموال: تسعين سطر بيمشوا على بحر واحد، وفي الآخر قفلة قصيرة سريعة بتلخص كل حاجة.</div><div class=\"li\">أرقام القصيدة: 2,530 سطر، 101 مقطع، مقسومة لأربع \"<span class=\"en\">fitts</span>\" (أقسام) بعلامات كبيرة في المخطوطة: 1-490، 491-1125، 1126-1997، 1998-2530.</div>", "n": 2, "i": 17, "a": "history-11-016", "x": "a189d3c8"}, {"t": "mc", "h": "", "q": "إيه هو الـ <span class=\"en\">bob and wheel</span>؟", "nq": 1, "opts": ["قفلة قصيرة في آخر كل مقطع: <span class=\"en\">bob</span> سطر قصير جداً ثم <span class=\"en\">wheel</span> أربع سطور قصيرة", "اسم الفارس الأخضر", "نوع من الحصان"], "ans": 0, "why": "قفلة قصيرة في آخر كل مقطع: <span class=\"en\">bob</span> سطر قصير جداً ثم <span class=\"en\">wheel</span> أربع سطور قصيرة", "ex": ["صح: وهو توقيع الشاعر ده.", "غلط: ده شكل في بناء المقطع.", "غلط: ده مصطلح شعري."], "i": 18}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> مثال من النص نفسه (أول سطر في القصيدة):</div><div class=\"u\">\"<span class=\"en\">Si</span>þ<span class=\"en\">en</span> þ<span class=\"en\">e sege and</span> þ<span class=\"en\">e assaut watz sesed at Troye</span>\"</div><div class=\"li\">المعنى: \"بعد ما الحصار والهجوم انتهى في طروادة\".</div><div class=\"li\">بص على الجناس: <span class=\"en\">sege</span> / <span class=\"en\">assaut</span> / <span class=\"en\">sesed -</span> كلهم صوت <span class=\"en\">S.</span> وبص على السكتة في النص: \"<span class=\"en\">Si</span>þ<span class=\"en\">en</span> þ<span class=\"en\">e sege and</span> þ<span class=\"en\">e assaut</span> | <span class=\"en\">watz sesed at Troye</span>\". نصين، زي <span class=\"en\">Beowulf</span> بالظبط، بعد 600 سنة!</div>", "n": 3, "i": 19, "a": "history-11-017", "x": "d16ec0a5"}, {"t": "learn", "h": "<div class=\"li\">والمفاجأة: القصيدة بتبدأ بطروادة، مش بآرثر! والقصيدة بتربط بريطانيا بأسطورة تأسيس قديمة تبدأ من طروادة، وده شبه اللي عمله فيرجيل في الإنيادة.</div><div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️</span></span>⃣: الحكاية: لعبة الكريسماس <span class=\"em\"><span class=\"em\">🎄</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> المشهد الأول: القصر</div><div class=\"li\">في <span class=\"en\">Camelot</span>، في ليلة رأس السنة، بلاط الملك آرثر بيحتفل. وآرثر عنده عادة غريبة: مش هياكل قبل ما يسمع أو يشوف حاجة عجيبة.</div>", "n": 4, "i": 20, "a": "history-11-018", "x": "96c802de"}, {"t": "learn", "h": "<div class=\"li\">وفجأة يدخل فارس ضخم، كله أخضر: جلده أخضر، هدومه خضرا، وحصانه أخضر. في إيده غصن شجرة (<span class=\"en\">holly</span>) وفي الإيد التانية فأس كبير.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> التحدي</div><div class=\"li\">الفارس بيقول: أنا جاي ألعب \"لعبة كريسماس\". فيه حد فيكم يضربني بالفأس ده دلوقتي، وأنا هردّله الضربة بعد سنة ويوم.</div><div class=\"li\">آرثر نفسه بيتقدم، لكن <span class=\"en\">Gawain</span> (ابن أخته، أصغر فرسان المائدة المستديرة) بيطلب الشرف ده.</div>", "n": 4, "i": 21, "a": "history-11-019", "x": "41320327"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Gawain</span> بياخد الفأس ويضرب، والراس بتتقص وتقع على الأرض.</div><div class=\"li\">والراجل الأخضر؟ بيقوم، يلمّ راسه من الأرض، يمسكها في إيده، يركب حصانه، ويقوله: قابلني في الـ <span class=\"en\">Green Chapel</span> بعد سنة ويوم. ويمشي.</div>", "n": 2, "i": 22, "a": "history-11-020", "x": "dff3039b"}, {"t": "mc", "h": "", "q": "إيه التحدي اللي قاله الفارس الأخضر؟", "nq": 1, "opts": ["واحد يضربه بالفأس دلوقتي، وهو يرد الضربة بعد سنة ويوم", "سباق على الخيل", "مسابقة شعر"], "ans": 0, "why": "واحد يضربه بالفأس دلوقتي، وهو يرد الضربة بعد سنة ويوم", "ex": ["صح: و<span class=\"en\">Gawain</span> هو اللي قبل التحدي.", "غلط: مش ده التحدي.", "غلط: مش ده التحدي."], "i": 23}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> المثال اليومي:</div><div class=\"li\">تخيل قعدة قهوة مع أصحابك، وواحد غريب داخل يقول: \"اضربني بالقلم ده قدام الكل، وأنا هردّه لك بعد سنة بالظبط، في مكان محدده لك\".</div><div class=\"li\">طبعاً الكل هيقول عليه مجنون. بس <span class=\"en\">Gawain</span> قبل. وده مش هزار: القصيدة كلها مبنية على إن الكلمة التزام، حتى لو التزام مجنون.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> السنة بتلف</div>", "n": 3, "i": 24, "a": "history-11-021", "x": "ae852835"}, {"t": "learn", "h": "<div class=\"li\">القصيدة بتعدي على الفصول في وصف من أجمل ما في الإنجليزية الوسيطة: الصوم، أمطار الربيع، زهور الصيف، رياح الحصاد، ورق الخريف اللي بيقع، لحد ما الشتا يرجع.</div><div class=\"li\">في يوم عيد كل القديسين (1 نوفمبر) <span class=\"en\">Gawain</span> بيلبس درعه ويخرج، وبيحط على درعه النجمة الخماسية (<span class=\"en\">pentangle</span>).</div>", "n": 2, "i": 25, "a": "history-11-022", "x": "7cb20967"}, {"t": "learn", "h": "<div class=\"li\">بيلف في شمال ويلز والـ <span class=\"en\">Wirral</span>، بيحارب تنانين ودياب ووحوش، بس الشاعر بيقول حاجة مهمة: البرد كان أقسى من الوحوش. بينام في درعه بين صخور متجمدة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> القلعة</div><div class=\"li\">ليلة عيد الميلاد، <span class=\"en\">Gawain</span> بيدعي لمريم إنها تلاقيله مأوى. وفجأة بتظهر قلعة عظيمة، كأنها \"مقطوعة من ورق\".</div>", "n": 3, "i": 26, "a": "history-11-023", "x": "bdca8207"}, {"t": "learn", "h": "<div class=\"li\">صاحب القلعة راجل ضخم، أحمر الوش، ودوده، ومراته ست جميلة جداً. وفيه كمان ست عجوزة وحشة، بس الكل بيحترمها احترام غريب.</div><div class=\"li\"><span class=\"en\">Gawain</span> بيقولهم إنه رايح الـ <span class=\"en\">Green Chapel</span> يوم رأس السنة. صاحب القلعة يضحك ويقوله: المكان على بعد ميلين بس! خد راحتك هنا لحد الميعاد.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> اللعبة التانية (وهي ذكاء الشاعر كله)</div>", "n": 3, "i": 27, "a": "history-11-024", "x": "bd40b03b"}, {"t": "learn", "h": "<div class=\"li\">صاحب القلعة يقترح: أنا كل يوم هروح أصطاد، وأنت ترتاح في القلعة. وبالليل، كل واحد يدي للتاني اللي كسبه في يومه.</div><div class=\"li\"><span class=\"en\">Gawain</span> بيقبل. وطبعاً مش عارف إنه بيوقع عقد مع نفسه.</div>", "n": 2, "i": 28, "a": "history-11-025", "x": "fcfd049e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> التلاتة أيام:</div><div class=\"li\">اليوم الأول: صاحب القلعة بيصطاد غزلان. وفي نفس الوقت، مراته بتدخل أوضة <span class=\"en\">Gawain</span> وتقعد على السرير وتغازله.</div><div class=\"li\">هو بيصدها بأدب شديد، وبس ياخد منها بوسة واحدة، وبالليل يدي البوسة لصاحب القلعة مقابل الغزلان.</div><div class=\"li\">اليوم التاني: الصيد خنزير بري ضخم. الست بترجع، وبتضغط أكتر، وبوسة، وبوسة. <span class=\"en\">Gawain</span> يديه بوسة وبوسة مقابل راس الخنزير.</div>", "n": 3, "i": 29, "a": "history-11-026", "x": "50e70353"}, {"t": "learn", "h": "<div class=\"li\">اليوم التالت: الصيد ثعلب (<span class=\"en\">fox</span>) ماكر. الست بترجع بأجمل شكل، وبتطلب منه خاتم، يرفض.</div><div class=\"li\">وتيجي للحزام الأخضر الحرير (<span class=\"en\">girdle</span>) وتقوله: اللي بيلبسه محدش يقدر يقتله.</div><div class=\"li\"><span class=\"en\">Gawain</span> بيفكر في الفأس اللي مستنياه بكرة، وبياخد الحزام، وبيوعدها إنه يخفيه عن جوزها. تلات بوسات، وبياخدهم، وبيدي التلاتة لصاحب القلعة...</div><div class=\"li\">إلا الحزام. الحزام مش في التبادل.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> ليه الحزام هو قلب القصيدة؟</div>", "n": 5, "i": 30, "a": "history-11-027", "x": "c1cb9ad4"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Gawain</span> ماغلطش في الشهوة. غلط في حاجة أصغر وأخطر: حب الحياة. خاف يموت، فقبل حاجة تخالف كلمته.</div><div class=\"li\">المثال اليومي: زي واحد في فريق بيساعد زمايله في كل حاجة، وبس في مرة واحدة ستر معلومة صغيرة عن نفسه عشان يحمي نفسه. مفيش حد اتأذى، بس العقد اتكسر.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> الـ <span class=\"en\">Green Chapel</span></div>", "n": 3, "i": 31, "a": "history-11-028", "x": "cf880648"}, {"t": "learn", "h": "<div class=\"li\">صباح رأس السنة، عاصفة تلج. الدليل بيوصله ويحذره: \"الراجل ده بيقتل كل اللي بيروحله، وربنا ما يجيب\". ويعرض عليه يهرب ويوعد إنه ميقولش لحد.</div><div class=\"li\"><span class=\"en\">Gawain</span> بيرفض: الهروب عار، حتى لو محدش هيعرف.</div><div class=\"li\">الـ <span class=\"en\">Green Chapel</span> طلع تلّة عشب، فيها فتحة، زي كهف. <span class=\"en\">Gawain</span> بيقول: ده مكان يليق بالشيطان يصلي فيه.</div><div class=\"li\">الفارس الأخضر يظهر، ويشكره إنه وفى بكلمته. <span class=\"en\">Gawain</span> يفتح رقبته.</div>", "n": 4, "i": 32, "a": "history-11-029", "x": "1fd74b4c"}, {"t": "learn", "h": "<div class=\"li\">الضربة الأولى: <span class=\"en\">Gawain</span> يتراجع شوية (<span class=\"en\">flinch</span>)، والفارس يوقفه ويقوله بسخرية إن ده مش <span class=\"en\">Gawain</span> اللي سمع عنه.</div><div class=\"li\">الضربة التانية: <span class=\"en\">Gawain</span> يثبت زي الحجر، والفارس يوقف إيده من غير ما يلمسه.</div><div class=\"li\">الضربة التالتة: بتجرح رقبته جرح بسيط، والدم ينزل على التلج. هنا <span class=\"en\">Gawain</span> يقوم ويقول: كفاية، أنا وفيت بالشرط.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> الكشف</div>", "n": 4, "i": 33, "a": "history-11-030", "x": "1809ce21"}, {"t": "learn", "h": "<div class=\"li\">الفارس الأخضر يضحك ويقول: أنا <span class=\"en\">Bertilak de Hautdesert</span>، صاحب القلعة اللي ضيفتك.</div><div class=\"li\">الضربتين اللي وقفهم: كانوا جزاء اليومين اللي وفيت فيهم بالتبادل. والجرح: جزاء الحزام اللي خبيته.</div><div class=\"li\">ومين اللي رتب كل ده؟ <span class=\"en\">Morgan le Fay</span>، الست العجوزة في القلعة، أخت آرثر غير الشقيقة. هدفها: تختبر كبرياء المائدة المستديرة، وتخوّف <span class=\"en\">Guinevere.</span></div>", "n": 3, "i": 34, "a": "history-11-031", "x": "d62d2806"}, {"t": "mc", "h": "", "q": "إزاي <span class=\"en\">Gawain</span> خالف كلمته في القصة؟", "nq": 1, "opts": ["هرب من القلعة", "خبّى الحزام الأخضر ومادهوش لصاحب القلعة", "ضرب الفارس الأخضر بالفأس"], "ans": 1, "why": "خبّى الحزام الأخضر ومادهوش لصاحب القلعة", "ex": ["غلط: ماهربش.", "صح: خاف على حياته فخبّى الحزام.", "غلط: ده كان أول التحدي."], "i": 35}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Gawain</span> بيخجل خالص، بيلوم نفسه على الجبن والطمع، ويقرر يلبس الحزام من دلوقتي كعلامة على غلطه.</div><div class=\"li\">ولما رجع <span class=\"en\">Camelot</span> وحكى، البلاط كله ضحك، وقروا كلهم يلبسوا شريط أخضر تكريماً ليه.</div><div class=\"li\">والقصيدة بتقفل بمثل شعار فرسان الرباط: \"<span class=\"en\">Hony soyt qui mal pence</span>\" (العار على من يفكر فيها سوءاً).</div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️</span></span>⃣: إيه اللي <span class=\"en\">Gawain</span> اتعلمه؟ (المعنى اللي تحت الحكاية) <span class=\"em\"><span class=\"em\">🔍</span></span></div>", "n": 4, "i": 36, "a": "history-11-032", "x": "9096864b"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> النجمة الخماسية (<span class=\"en\">pentangle</span>) - أهم رمز في القصيدة:</div><div class=\"li\">الشاعر بيشرحها في سطور حوالي 619-669، وهي \"عقدة لا تنتهي\" (<span class=\"en\">endless knot</span>): تقدر ترسمها بخط واحد متواصل من غير ما ترفع إيدك.</div><div class=\"li\">خمسة في خمسة عند <span class=\"en\">Gawain</span>:</div><div class=\"u\">١. خمس حواسه</div><div class=\"u\">٢. خمس صوابع إيده</div><div class=\"u\">٣. إيمانه بخمس جراح المسيح</div><div class=\"u\">٤. خمس أفراح مريم (وصورتها مرسومة جوه الدرع)</div><div class=\"u\">٥. خمس فضائل: الكرم، الصحبة، النقاء، الأدب، والرحمة</div>", "n": 8, "i": 37, "a": "history-11-033", "x": "897b3fe6"}, {"t": "learn", "h": "<div class=\"li\">المعنى: كل نقطة متعلقة بالتانية. لو جزء واحد اتكسر، الرسمة كلها بتتلخبط. مفيش \"أنا كويس في 24 حاجة من 25\".</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> الكلمة المفتاحية: <span class=\"en\">traw</span>þ<span class=\"en\">e</span></div><div class=\"li\">كلمة إنجليزية قديمة معناها مجتمعة: صدق + وفاء بالكلمة + إيمان. <span class=\"en\">Gawain</span> هو رمز <span class=\"en\">traw</span>þ<span class=\"en\">e</span>، والحزام هو أول مرة في حياته يكسرها.</div>", "n": 3, "i": 38, "a": "history-11-034", "x": "f30c0ca7"}, {"t": "mc", "h": "", "q": "النجمة الخماسية (<span class=\"en\">pentangle</span>) في القصيدة رمز لإيه؟", "nq": 1, "opts": ["عقدة لا تنتهي: كل جزء متعلق بالتاني", "علامة الفارس الأخضر", "نجمة في السما"], "ans": 0, "why": "عقدة لا تنتهي: كل جزء متعلق بالتاني", "ex": ["صح: وبتمثل خمسة في خمسة عند <span class=\"en\">Gawain</span>.", "غلط: ده رمز <span class=\"en\">Gawain</span>.", "غلط: هي رسمة على الدرع."], "i": 39}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> ليه القصيدة عظيمة؟ لأنها مش عن خاين:</div><div class=\"li\"><span class=\"en\">Gawain</span> ماغلطش مع الست، ماغلطش مع صاحبه في أي حاجة كبيرة. غلطه الوحيد إنه خبّى حزام عشان يعيش.</div><div class=\"li\">والشاعر مش بيحاسبه بقسوة: الفارس الأخضر نفسه بيقوله إنه بريء أكتر من أي فارس في البلاد، وإنه غلط \"شوية\" بس، وبسبب حبه لحياته.</div><div class=\"li\">وده اللي يخلي القصيدة حديثة: البطل مش قديس ولا مجرم. إنسان.</div>", "n": 3, "i": 40, "a": "history-11-035", "x": "161c6008"}, {"t": "learn", "h": "<div class=\"li\">المثال اليومي: زي طالب مجتهد طول السنة، وفي امتحان كبير غش في سؤال واحد صغير. الشهادة كلها بتتلوث مش عشان السؤال مهم، عشان العقد اللي بينك وبين نفسك اتكسر.</div>", "n": 1, "i": 41, "a": "history-11-036", "x": "5a3466c8"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الرمزية الخضراء:</div><div class=\"li\">الأخضر = الطبيعة والوحشية والخصوبة، ضد الأحمر والدهبي بتاع البلاط. الفارس الأخضر جاي من بره النظام، من الغابة، ومش بيحترم قوانين القاعة.</div><div class=\"li\">الحزام: حبل بيتفك، عكس النجمة اللي مبتتفكش. الأول شفناه \"تعويذة نجاة\"، بعدين بقى \"علامة كدب\"، وفي الآخر بقى \"شارة شرف\".</div><div class=\"li\">نفس الحاجة، تلات معاني - وده بالظبط اللي بتعمله القصيدة بكل حاجة.</div>", "n": 3, "i": 42, "a": "history-11-037", "x": "27f37151"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> نقطة نقدية مهمة (وهي موضع خلاف بين العلماء):</div><div class=\"li\"><span class=\"en\">Gawain</span> بعد ما يفشل، بيلوم \"النساء\" ويجيب سيرة حوا وشمشون وداود.</div><div class=\"li\">القصيدة نفسها فيها توتر بين نظام فرسان بيحترم الستات كرمز، وست حقيقية بتستخدم الغواية كسلاح. مفيش إجابة واحدة، والقصيدة بتسيب التوتر ده مفتوح.</div>", "n": 2, "i": 43, "a": "history-11-038", "x": "c25dadd6"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> ملاحظة صغيرة عن الأساطير:</div><div class=\"li\">آرثر و<span class=\"en\">Morgan le Fay</span> والقلعة دي كلها عالم أساطير آرثر. إحنا هنا بنتكلم عن القصيدة كشعر وتاريخ، والقصص نفسها ليها كورس الميثولوجيا بتاعنا لو عايز تتعمق.</div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️</span></span>⃣: <span class=\"en\">Pearl</span>: القصيدة اللي بتتكوّر على نفسها <span class=\"em\"><span class=\"em\">🦪</span></span></div>", "n": 2, "i": 44, "a": "history-11-039", "x": "f1fa9e93"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الشكل الأول (وهو أعجوبة رياضية):</div><div class=\"li\">1,212 سطر، في 101 مقطع (<span class=\"en\">stanza</span>)، كل مقطع 12 سطر بقافية <span class=\"en\">ABABABABBCBC.</span></div><div class=\"li\">المقاطع مجمعة في 20 قسم، كل قسم 5 مقاطع (ما عدا القسم 15 فيه 6).</div><div class=\"li\">وفيه حاجة اسمها \"<span class=\"en\">link word</span>\": آخر كلمة في كل مقطع بتتكرر في أول سطر في المقطع اللي بعده. ولما يخلص قسم، آخر كلمة فيه بتبدأ القسم الجديد.</div>", "n": 3, "i": 45, "a": "history-11-040", "x": "9a96f5c4"}, {"t": "learn", "h": "<div class=\"li\">وآخر كلمة في القصيدة كلها بترجع تلمس أول كلمة في أول سطر. يعني القصيدة دايرة مقفولة على نفسها، زي اللؤلؤة بالظبط.</div><div class=\"li\">المثال اليومي: تخيل سلسلة واتساب، كل رسالة بتبدأ بآخر كلمة في اللي قبلها، والقصة كلها في الآخر بترجع لأول كلمة. ده مش شعر وبس، ده تصميم هندسي.</div>", "n": 2, "i": 46, "a": "history-11-041", "x": "31f6cc8b"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الحكاية:</div><div class=\"li\">راوي غالباً بيتفسر إنه أب فقد بنته الصغيرة (أقل من سنتين، بيقول في سطر 483: \"<span class=\"en\">not two yer</span>\" - مش سنتين).</div><div class=\"li\">القصيدة بتبدأ وهو حاطط إيده على اللؤلؤة اللي ضاعت منه في الجنينة، وبعدين بينام على قبرها.</div><div class=\"li\">في الحلم بيلاقي جنينة تانية، ونهر، وست شابة واقفة على الناحية التانية، لابسة أبيض، وفي نص صدرها لؤلؤة.</div>", "n": 3, "i": 47, "a": "history-11-042", "x": "f5fa5530"}, {"t": "mc", "h": "", "q": "قصيدة <span class=\"en\">Pearl</span> بتبدأ بإيه؟", "nq": 1, "opts": ["معركة كبيرة", "حفلة في قلعة", "راوي فقد لؤلؤة وبعدين بينام على قبرها"], "ans": 2, "why": "راوي فقد لؤلؤة وبعدين بينام على قبرها", "ex": ["غلط: مش في <span class=\"en\">Pearl</span>.", "غلط: دي <span class=\"en\">Gawain</span>.", "صح: والراوي غالباً أب فقد بنته الصغيرة."], "i": 48}, {"t": "learn", "h": "<div class=\"li\">يبدأ حوار: هو بيسأل بجنون وحزن (إنتي لؤلؤتي؟ إزاي ضايعة وتلقى؟ إزاي عايشة سنتين وبقيتي ملكة في السما؟)، وهي بترد بهدوء لاهوتي، وبأدب شديد، وبترد عليه أسئلته بأسئلة.</div><div class=\"li\">وفي وسط الحوار بتعلمه الدرس الصعب: حزنه فيه شوية \"ملكية\" - هو مش حزين عليها، هو حزين على إنه خسر حاجة بتاعته. وبتقوله: \"أنا مش ضايعة، إنت اللي مش لاقي\".</div>", "n": 2, "i": 49, "a": "history-11-043", "x": "c9c429a2"}, {"t": "learn", "h": "<div class=\"li\">في الآخر بتوريه أورشليم السماوية، هو بيحاول يعدّي النهر عشان يوصلها، وفي اللحظة دي بيصحى على العشب.</div><div class=\"li\">المثال اليومي: زي حد بيفضل يفتح حساب حد مات كل يوم ويقرا الكومنتات، وفي يوم بيحلم بيه، واللي في الحلم بيقوله: \"أنا كويس. المشكلة إنك إنت مش قادر تسيب\".</div><div class=\"li\">الحزن الحقيقي مش على الميت، الحزن على نفسنا.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> ليه اسمها <span class=\"en\">Pearl</span>؟</div>", "n": 4, "i": 50, "a": "history-11-044", "x": "3aeaa683"}, {"t": "learn", "h": "<div class=\"li\">اللؤلؤة رمز النقاء (مستديرة، بيضا، من غير عيب)، والاسم <span class=\"en\">Margaret</span> / <span class=\"en\">Margery</span> معناه \"لؤلؤة\" باليوناني واللاتيني.</div><div class=\"li\">والقصيدة بتلمّح إن البنت ممكن تكون اتسمت كده، بس مش بتقول صريح.</div><div class=\"li\">يعني العنوان نفسه فيه لغز: لؤلؤة حقيقية، ولا بنت، ولا الروح، ولا الإيمان؟ القصيدة بتخليك تشك، والدارسين لسه بيتناقشوا.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> مين اللي كتبها؟</div>", "n": 4, "i": 51, "a": "history-11-045", "x": "fb53746e"}, {"t": "learn", "h": "<div class=\"li\">غالباً نفس الشاعر بتاع <span class=\"en\">Gawain</span>، بنفس اللهجة وبنفس الأسلوب. وده اللي خلى أغلب العلماء يربطوا الأربع قصائد ببعض.</div><div class=\"li\">وملاحظة حلوة: الترجمة الإنجليزية الشهيرة لـ <span class=\"en\">Pearl</span> و<span class=\"en\">Gawain</span> عملها <span class=\"en\">J.R.R.</span> <span class=\"en\">Tolkien</span> (نُشرت سنة 1975 بعد وفاته).</div><div class=\"li\">و<span class=\"en\">Tolkien</span> قبل كده بعشرين سنة كان هو اللي حقق نص <span class=\"en\">Gawain</span> مع <span class=\"en\">E.V.</span> <span class=\"en\">Gordon</span> سنة 1925، والتحقيق ده فضل المعيار العلمي 90 سنة.</div>", "n": 3, "i": 52, "a": "history-11-046", "x": "7a85c649"}, {"t": "learn", "h": "<div class=\"li\">يعني صاحب سيد الخواتم اتعلم الشغل ده من المخطوطة دي.</div><div class=\"u\">النقطة 6<span class=\"em\"><span class=\"em\">️</span></span>⃣: إزاي تقراها النهاردة؟ <span class=\"em\"><span class=\"em\">📱</span></span></div>", "n": 2, "i": 53, "a": "history-11-047", "x": "f8579729"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الترجمات (اختار واحدة واقرا):</div><div class=\"li\"><span class=\"en\">J.R.R.</span> <span class=\"en\">Tolkien</span> (1975): ترجمة أمينة للوزن والجو، شوية صعبة بس جميلة.</div><div class=\"li\"><span class=\"en\">Marie Borroff</span>: ترجمة شعرية مشهورة، أسهل شوية.</div><div class=\"li\"><span class=\"en\">Simon Armitage</span> (2007): ترجمة حديثة جداً وحيوية، وأسهل واحدة للمبتدئ.</div>", "n": 3, "i": 54, "a": "history-11-048", "x": "3908e375"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> تشوف المخطوطة بعينك:</div><div class=\"li\">المخطوطة متصورة صفحة صفحة، وفيها رسومات صغيرة للمشاهد، منها مشهد <span class=\"en\">Gawain</span> والست في الأوضة.</div>", "n": 1, "i": 55, "a": "history-11-049", "x": "33560fa8"}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">🏁</span></span> <span class=\"en\">Langland</span> و<span class=\"en\">Piers Plowman</span>، والـ <span class=\"en\">ballads</span> الشعبية، والشعر الاسكتلندي، وبعدها مراجعة المستوى الأول كله.", "extra": "", "i": 56}];</script>
