<script>window.LESSON_ID="poetry-06";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">الدرس اللي فات اتعلمنا الـ <span class=\"en\">syllable<\/span> والـ <span class=\"en\">stress.<\/span> النهاردة نركّبهم ونبني أشهر وزن في الشعر الإنجليزي. جرب كل مثال بصوتك.<\/div>", "n": 1, "i": 0, "a": "poetry-06-001", "x": "391590cf"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: إيه هو الـ <span class=\"en\">foot<\/span> (القدم)؟", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">الإيقاع زي المشية: شمال، يمين. الاتنين مع بعض بيعملوا \"وحدة\" وبتتكرر. الوحدة دي في الشعر اسمها <span class=\"en\">foot.<\/span><\/div><div class=\"u\">الـ <span class=\"en\">foot<\/span>: مجموعة صغيرة من المقاطع (٢ أو ٣) مترتبين بنظام ثابت، ضعيف وقوي، وبيتكرروا على طول السطر. زي موازير الأغنية، السطر بيتقسم لأقدام. وأول حاجة في تحليل أي قصيدة: نقسّم السطر لأقدام.<\/div>", "n": 2, "i": 2, "a": "poetry-06-002", "x": "29eaecc0"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: الـ <span class=\"en\">iamb<\/span>، أشهر قدم في الإنجليزي", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">iamb<\/span> قدم من مقطعين: ضعيف وبعدين قوي. دا-<span class=\"en\">DUM.<\/span> زي ضربات القلب: دا-<span class=\"en\">DUM<\/span>، دا-<span class=\"en\">DUM.<\/span><\/div>", "n": 1, "i": 4, "a": "poetry-06-003", "x": "decffd3a"}, {"t": "learn", "h": "<div class=\"lead\">كلمات <span class=\"en\">iamb<\/span>ية:<\/div><div class=\"li\"><span class=\"en\">a-LIVE<\/span><\/div><div class=\"li\"><span class=\"en\">be-LIEVE<\/span><\/div><div class=\"li\"><span class=\"en\">com-PARE<\/span><\/div><div class=\"li\"><span class=\"en\">a-WAKE<\/span><\/div><div class=\"li\"><span class=\"en\">a-LONE<\/span><\/div><div class=\"u\">قولهم ورا بعض بسرعة: <span class=\"en\">a-LIVE be-LIEVE com-PARE a-WAKE a-LONE.<\/span> هتحس إنك بترقص. عشان كده الـ <span class=\"en\">iamb<\/span> هو الإيقاع الطبيعي للإنجليزي.<\/div>", "n": 6, "i": 5, "a": "poetry-06-004", "x": "fd79d160"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: الـ <span class=\"en\">iambic pentameter<\/span>، ملك الأوزان", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">خمس أقدام <span class=\"en\">iamb<\/span>ية ورا بعض في سطر = <span class=\"en\">iambic pentameter.<\/span><\/div><div class=\"li\"><span class=\"en\">iambic<\/span> = من الـ <span class=\"en\">iamb<\/span><\/div><div class=\"li\"><span class=\"en\">pentameter<\/span> = خمسة موازين (<span class=\"en\">penta<\/span> = ٥)<\/div><div class=\"u\">يعني ١٠ مقاطع بالظبط: <span class=\"en\">da-DUM da-DUM da-DUM da-DUM da-DUM<\/span><\/div>", "n": 4, "i": 7, "a": "poetry-06-005", "x": "7a650518"}, {"t": "learn", "h": "<div class=\"lead\">أول سطر من <span class=\"en\">Sonnet 18<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">Shall I compare thee to a summer's day?<\/span>\"<\/div><div class=\"u\"><span class=\"en\">shall I<\/span> | <span class=\"en\">com-PARE<\/span> | <span class=\"en\">thee TO<\/span> | <span class=\"en\">a SUM<\/span> | <span class=\"en\">mer's DAY<\/span><\/div><div class=\"u\">١٠ مقاطع، ٥ أقدام، كل واحدة ضعيف-قوي.<\/div>", "n": 3, "i": 8, "a": "poetry-06-006", "x": "0a850331"}, {"t": "learn", "h": "<div class=\"lead\">والسطر اللي بعده:<\/div><div class=\"u\">\"<span class=\"en\">Thou art more lovely and more temperate<\/span>:\"<\/div><div class=\"u\"><span class=\"en\">Thou ART<\/span> | <span class=\"en\">more LOVE<\/span> | <span class=\"en\">ly AND<\/span> | <span class=\"en\">more TEM<\/span> | <span class=\"en\">per-ATE<\/span><\/div>", "n": 2, "i": 9, "a": "poetry-06-007", "x": "bd3cb0f4"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: ليه الوزن ده مشهور؟", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">١- بيطلع طبيعي من الإنجليزي العادي.<\/div><div class=\"u\">٢- شكسبير كتب معظم شغله بيه.<\/div><div class=\"u\">٣- سهل يتحفظ، زي الأغنية.<\/div><div class=\"u\">والشعراء بيكسروا الوزن عمد أحياناً عشان يبرزوا كلمة. الوزن مرجعية مش قفص (هنرجعله في الدرس ٥٨).<\/div>", "n": 4, "i": 11, "a": "poetry-06-008", "x": "aa377545"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: ملخص + تمرين", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">١- الـ <span class=\"en\">foot<\/span>: وحدة الوزن في السطر.<\/div><div class=\"u\">٢- الـ <span class=\"en\">iamb<\/span>: ضعيف-قوي، <span class=\"en\">da-DUM.<\/span><\/div><div class=\"u\">٣- الـ <span class=\"en\">iambic pentameter<\/span>: ٥ أقدام <span class=\"en\">iamb<\/span>ية = ١٠ مقاطع.<\/div>", "n": 3, "i": 13, "a": "poetry-06-009", "x": "c42c9e4e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️<\/span><\/span> تمرين:<\/div><div class=\"u\">١- قسّم السطر ده لأقدام (حط | بينهم) وقول وزنه إيه:<\/div><div class=\"u\">\"<span class=\"en\">Rough winds do shake the darling buds of May,<\/span>\"<\/div><div class=\"u\">٢- هات ٣ كلمات من عندك وزنها <span class=\"en\">iamb.<\/span><\/div><div class=\"u\">٣- اكتب سطر من تأليفك فيه ١٠ مقاطع على وزن <span class=\"en\">da-DUM<\/span> خمس مرات. صعب شوية، بس جرب!<\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس ٧: الـ <span class=\"en\">trochee<\/span> والـ <span class=\"en\">anapest<\/span> والـ <span class=\"en\">dactyl.<\/span><\/div>", "n": 6, "i": 14, "a": "poetry-06-010", "x": "693ef791"}, {"t": "recall", "h": "", "q": "الـ <span class=\"en\">iamb<\/span> ترتيب مقاطعه: قوي-ضعيف ولا ضعيف-قوي؟", "a": "ضعيف-قوي (دا-<span class=\"en\">DUM)<\/span>.", "n": 1, "i": 15}, {"t": "recall", "h": "", "q": "الكلمات دي وزنها <span class=\"en\">iamb<\/span> ولا لأ: <span class=\"en\">a-LIVE<\/span> و <span class=\"en\">be-LIEVE<\/span> و <span class=\"en\">com-PARE<\/span>؟", "a": "أيوه، التلاتة <span class=\"en\">iamb.<\/span>", "n": 1, "i": 16}, {"t": "recall", "h": "", "q": "الـ <span class=\"en\">iambic pentameter<\/span> فيه كام قدم؟ وكام مقطع في السطر؟", "a": "٥ أقدام = ١٠ مقاطع (٥ × ٢).", "n": 1, "i": 17}, {"t": "tf", "h": "", "q": "صح ولا غلط: الشاعر لازم يلتزم بالوزن 100% ولو كسره يبقى غلط.", "ans": false, "why": "غلط. الوزن مرجعية، والشعراء بيكسروه عمد أحياناً.", "n": 1, "i": 18, "ex": ["الجملة غلط. الوزن مرجعية، والشعراء بيكسروه عمد أحياناً.", "صح، الجملة غلط. الوزن مرجعية، والشعراء بيكسروه عمد أحياناً."]}, {"t": "write", "h": "", "q": "اشرح إيه هي الـ <span class=\"en\">foot<\/span> وقارنها بميزان الأغنية. وليه بنقول إن الـ <span class=\"en\">iamb<\/span> \"طبيعي\" في الإنجليزي؟ هات مثالين كلمات.", "key": "poetry-06:5", "n": 1, "i": 19}, {"t": "write", "h": "", "q": "قسّم سطر شكسبير \"<span class=\"en\">Shall I compare thee to a summer's day?<\/span>\" لأقدام (حط | بين كل قدم)، واشرح ليه الوزن اسمه <span class=\"en\">iambic pentameter.<\/span>", "key": "poetry-06:6", "n": 1, "i": 20}, {"t": "write", "h": "", "q": "اذكر ٣ أسباب خلّوا الـ <span class=\"en\">iambic pentameter<\/span> أشهر وزن، وقولي أنهي سبب أقنعك أكتر وليه.", "key": "poetry-06:7", "n": 1, "i": 21}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 22}];</script>
