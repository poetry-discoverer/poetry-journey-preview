<script>window.LESSON_ID="poetry-11";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">لحد دلوقتي اتعلمنا الصوت جوه السطر. النهاردة نكبر الصورة: إزاي السطور بتتجمع في مقاطع، وإزاي نكتب \"خريطة\" للقافية بحروف بسيطة.<\/div>", "n": 1, "i": 0, "a": "poetry-11-001", "x": "d1cefcba"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: الـ <span class=\"en\">stanza<\/span>، فقرة الشعر", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">مجموعة سطور مفصولة عن اللي بعدها بسطر فاضي. أصل الكلمة إيطالي ومعناها \"أوضة\". زي الفقرة في النثر بتجمع أفكار مرتبطة.<\/div><div class=\"u\">تشبيه: القصيدة عمارة، المقطع شقة، والسطور هي الأوض.<\/div><div class=\"u\">مثال: قصيدة <span class=\"en\">Dickinson<\/span> القصيرة \"<span class=\"en\">I had no time to hate<\/span>\" فيها مقطعين، كل واحد ٤ سطور.<\/div><div class=\"u\">المقطع ممكن يبقى له قافية ووزن منتظمين، بس مش شرط.<\/div>", "n": 4, "i": 2, "a": "poetry-11-002", "x": "2f805a39"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: أسماء المقاطع حسب عدد السطور", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">couplet<\/span> = ٢ سطر<\/div><div class=\"li\"><span class=\"en\">tercet<\/span> = ٣<\/div><div class=\"li\"><span class=\"en\">quatrain<\/span> = ٤ (أشهر نوع في الشعر الإنجليزي)<\/div><div class=\"li\"><span class=\"en\">cinquain<\/span> = ٥، <span class=\"en\">sestet<\/span> = ٦، <span class=\"en\">septet<\/span> = ٧، <span class=\"en\">octave<\/span> = ٨<\/div><div class=\"u\">(<span class=\"en\">quarter<\/span> = ربع = ٤، ومنها <span class=\"en\">quatrain.<\/span>)<\/div>", "n": 5, "i": 4, "a": "poetry-11-003", "x": "8996f740"}, {"t": "learn", "h": "<div class=\"lead\">مثال <span class=\"en\">couplet<\/span> من آخر <span class=\"en\">Sonnet 18<\/span> لشكسبير:<\/div><div class=\"u\">\"<span class=\"en\">So long as men can breathe or eyes can see,<\/span><\/div><div class=\"u\"><span class=\"en\">So long lives this,<\/span> <span class=\"en\">and this gives life to thee.<\/span>\"<\/div><div class=\"u\"><span class=\"en\">see<\/span> / <span class=\"en\">thee<\/span>، وبيقفلوا الفكرة زي الختم.<\/div>", "n": 3, "i": 5, "a": "poetry-11-004", "x": "7e8625fc"}, {"t": "learn", "h": "<div class=\"lead\">مثال <span class=\"en\">quatrain<\/span>، أول ٤ سطور في نفس القصيدة:<\/div><div class=\"u\">\"<span class=\"en\">Shall I compare thee to a summer's day?<\/span><\/div>", "n": 1, "i": 6, "a": "poetry-11-005", "x": "0064e4ae"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">Thou art more lovely and more temperate<\/span>:<\/div><div class=\"u\"><span class=\"en\">Rough winds do shake the darling buds of May,<\/span><\/div><div class=\"u\"><span class=\"en\">And summer's lease hath all too short a date.<\/span>\"<\/div>", "n": 2, "i": 7, "a": "poetry-11-006", "x": "69992cc2"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: الـ <span class=\"en\">rhyme scheme<\/span>، خريطة القافية", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"lead\">نمط القافية في آخر السطور بحروف:<\/div><div class=\"u\">١- السطر الأول = <span class=\"en\">A.<\/span><\/div><div class=\"u\">٢- السطر التاني: لو بيتقافى مع الأول يبقى <span class=\"en\">A<\/span>، لو لأ يبقى <span class=\"en\">B.<\/span><\/div><div class=\"u\">٣- كل صوت جديد ياخد حرف جديد.<\/div><div class=\"u\">أول <span class=\"en\">Sonnet 18<\/span>: <span class=\"en\">day<\/span> (<span class=\"en\">A<\/span>) / <span class=\"en\">temperate<\/span> (<span class=\"en\">B<\/span>) / <span class=\"en\">May<\/span> (<span class=\"en\">A<\/span>) / <span class=\"en\">date<\/span> (<span class=\"en\">B<\/span>) = <span class=\"en\">ABAB.<\/span><\/div>", "n": 4, "i": 9, "a": "poetry-11-007", "x": "effbd4bd"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">Herrick<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">Bid me to weep,<\/span> <span class=\"en\">and I will weep<\/span><\/div><div class=\"u\"><span class=\"en\">While I have eyes to see<\/span><\/div><div class=\"u\"><span class=\"en\">And having none,<\/span> <span class=\"en\">yet I will keep<\/span><\/div><div class=\"u\"><span class=\"en\">A heart to weep for thee<\/span>\"<\/div><div class=\"u\"><span class=\"en\">weep<\/span> (<span class=\"en\">A<\/span>) / <span class=\"en\">see<\/span> (<span class=\"en\">B<\/span>) / <span class=\"en\">keep<\/span> (<span class=\"en\">A<\/span>) / <span class=\"en\">thee<\/span> (<span class=\"en\">B<\/span>) = <span class=\"en\">ABAB.<\/span><\/div><div class=\"u\">و<span class=\"en\">Sonnet 18<\/span> كلها: <span class=\"en\">ABAB CDCD EFEF GG<\/span> (٣ <span class=\"en\">quatrains<\/span> + <span class=\"en\">couplet<\/span>).<\/div>", "n": 6, "i": 10, "a": "poetry-11-008", "x": "259a142c"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: أشكال شهيرة", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">AABB<\/span>: كل سطرين بيتقافوا. سريع ومباشر.<\/div><div class=\"li\"><span class=\"en\">ABAB<\/span>: تبادل. متوازن ومتحرك.<\/div><div class=\"li\"><span class=\"en\">ABBA<\/span>: قافية محاطة، اتنين من برة بيحضنوا اتنين من جوه.<\/div><div class=\"li\"><span class=\"en\">ABCB<\/span>: <span class=\"en\">ballad stanza<\/span>، التاني والرابع بس بيتقافوا.<\/div><div class=\"u\">مثال، أول مقطع في <span class=\"en\">Ancient Mariner<\/span> لـ <span class=\"en\">Coleridge<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">It is an ancient Mariner,<\/span><\/div><div class=\"u\"><span class=\"en\">And he stoppeth one of three.<\/span><\/div><div class=\"u\">'<span class=\"en\">By thy long grey beard and glittering eye,<\/span><\/div><div class=\"u\"><span class=\"en\">Now wherefore stopp'st thou me?<\/span>'\"<\/div>", "n": 9, "i": 12, "a": "poetry-11-009", "x": "0bfe4dfd"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Mariner<\/span> (<span class=\"en\">A<\/span>) / <span class=\"en\">three<\/span> (<span class=\"en\">B<\/span>) / <span class=\"en\">eye<\/span> (<span class=\"en\">C<\/span>) / <span class=\"en\">me<\/span> (<span class=\"en\">B<\/span>).<\/div><div class=\"u\">الشاعر بيختار النظام حسب السرعة والإحساس: <span class=\"en\">AABB<\/span> سريع ومقفول، <span class=\"en\">ABCB<\/span> حر وبيحكي زي الحدوتة، <span class=\"en\">ABAB<\/span> فيه توازن.<\/div>", "n": 2, "i": 13, "a": "poetry-11-010", "x": "97ed6f32"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: ملخص + تمرين", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">١- <span class=\"en\">stanza<\/span> = مجموعة سطور.<\/div><div class=\"u\">٢- <span class=\"en\">couplet<\/span> ٢، <span class=\"en\">tercet<\/span> ٣، <span class=\"en\">quatrain<\/span> ٤، <span class=\"en\">sestet<\/span> ٦، <span class=\"en\">octave<\/span> ٨.<\/div><div class=\"u\">٣- <span class=\"en\">rhyme scheme<\/span> = خريطة حروف للقافية.<\/div><div class=\"u\">٤- <span class=\"en\">AABB,<\/span> <span class=\"en\">ABAB,<\/span> <span class=\"en\">ABBA,<\/span> <span class=\"en\">ABCB.<\/span><\/div>", "n": 4, "i": 15, "a": "poetry-11-011", "x": "d830725e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️<\/span><\/span> تمرين:<\/div><div class=\"u\">١- اكتب <span class=\"en\">rhyme scheme<\/span> لأبيات <span class=\"en\">Herrick<\/span> اللي فوق.<\/div><div class=\"u\">٢- كام سطر في الـ <span class=\"en\">tercet<\/span>؟ وفي الـ <span class=\"en\">couplet<\/span>؟<\/div><div class=\"u\">٣- اكتب <span class=\"en\">quatrain<\/span> من تأليفك بنظام <span class=\"en\">ABAB<\/span> (١ مع ٣، و٢ مع ٤).<\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس ١٢: مراجعة كبيرة وأول تحليل لقصيدة قصيرة كاملة.<\/div>", "n": 5, "i": 16, "a": "poetry-11-012", "x": "995e8610"}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">cinquain<\/span> ؟", "opts": ["مقطع من ٥ سطور", "مقطع من ٤ سطور (أشهر نوع)", "خريطة حروف للقافية"], "ans": 0, "why": "مقطع من ٥ سطور", "n": 1, "i": 17, "ex": ["صح: <span class=\"en\">cinquain<\/span> مقطع من خمسة سطور (<span class=\"en\">cinq<\/span> = خمسة بالفرنسية).", "غلط: المقطع من أربعة سطور اسمه <span class=\"en\">quatrain<\/span>، وهو الأشهر في الشعر الإنجليزي.", "غلط: هذا معنى <span class=\"en\">rhyme scheme<\/span>، وليس <span class=\"en\">cinquain<\/span>."]}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">quatrain<\/span> ؟", "opts": ["مقطع من ٤ سطور (أشهر نوع في الشعر الإنجليزي)", "مقطع من ٦ سطور", "خريطة حروف للقافية"], "ans": 0, "why": "مقطع من ٤ سطور (أشهر نوع في الشعر الإنجليزي)", "n": 1, "i": 18, "ex": ["صح: <span class=\"en\">quatrain<\/span> مقطع من أربعة سطور، وهو أكثر المقاطع شيوعاً.", "غلط: المقطع من ستة سطور اسمه <span class=\"en\">sestet<\/span>.", "غلط: هذا معنى <span class=\"en\">rhyme scheme<\/span>."]}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">rhyme scheme<\/span> ؟", "opts": ["خريطة حروف للقافية (مثل <span class=\"en\">ABAB<\/span>)", "مقطع من ٤ سطور", "مجموعة سطور مرتبطة"], "ans": 0, "why": "خريطة حروف للقافية (مثل <span class=\"en\">ABAB<\/span>)", "n": 1, "i": 19, "ex": ["صح: <span class=\"en\">rhyme scheme<\/span> هي خريطة تعطي كل صوت قافية حرفاً، مثل <span class=\"en\">ABAB<\/span> أو <span class=\"en\">AABB<\/span>.", "غلط: هذا معنى <span class=\"en\">quatrain<\/span>.", "غلط: هذا معنى <span class=\"en\">stanza<\/span> (المقطع)."]}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">stanza<\/span> ؟", "opts": ["مجموعة سطور مرتبطة", "خريطة حروف للقافية", "مقطع من ٤ سطور فقط"], "ans": 0, "why": "مجموعة سطور مرتبطة", "n": 1, "i": 20, "ex": ["صح: <span class=\"en\">stanza<\/span> هو المقطع، أي مجموعة سطور مرتبطة داخل القصيدة، مثل الفقرة في النثر.", "غلط: هذا معنى <span class=\"en\">rhyme scheme<\/span>، أما <span class=\"en\">stanza<\/span> فهو المقطع نفسه.", "غلط: المقطع قد يكون سطرين أو ثلاثة أو ستة أو أكثر. الأربعة هي <span class=\"en\">quatrain<\/span> فقط."]}, {"t": "recall", "h": "", "q": "كام سطر في الـ <span class=\"en\">quatrain<\/span>؟ وفي الـ <span class=\"en\">tercet<\/span>؟", "a": "<span class=\"en\">quatrain<\/span> = ٤ سطور، <span class=\"en\">tercet<\/span> = ٣.", "n": 1, "i": 21}, {"t": "recall", "h": "", "q": "اكتب <span class=\"en\">rhyme scheme<\/span> للسطور دي: \"<span class=\"en\">Bid me to weep,<\/span> <span class=\"en\">and I will weep<\/span> / <span class=\"en\">While I have eyes to see<\/span> / <span class=\"en\">And having none,<\/span> <span class=\"en\">yet I will keep<\/span> / <span class=\"en\">A heart to weep for thee<\/span>\".", "a": "<span class=\"en\">ABAB<\/span> (<span class=\"en\">weep A<\/span> / <span class=\"en\">see B<\/span> / <span class=\"en\">keep A<\/span> / <span class=\"en\">thee B)<\/span>.", "n": 1, "i": 22}, {"t": "recall", "h": "", "q": "إيه نظام الـ <span class=\"en\">ballad stanza<\/span>؟", "a": "<span class=\"en\">ABCB<\/span>: التاني والرابع بس بيتقافوا.", "n": 1, "i": 23}, {"t": "tf", "h": "", "q": "صح ولا غلط: المقطع لازم يكون له قافية ووزن منتظمين.", "ans": false, "why": "غلط. ممكن يبقى له قافية ووزن منتظمين، بس مش شرط.", "n": 1, "i": 24, "ex": ["الجملة غلط. ممكن يبقى له قافية ووزن منتظمين، بس مش شرط.", "صح، الجملة غلط. ممكن يبقى له قافية ووزن منتظمين، بس مش شرط."]}, {"t": "write", "h": "", "q": "اشرح يعني إيه <span class=\"en\">stanza<\/span> بأسلوبك (بتشبيه من عندك)، واذكر ٤ أنواع مقاطع مع عدد سطور كل واحد.", "key": "poetry-11:5", "n": 1, "i": 25}, {"t": "write", "h": "", "q": "اشرح خطوات كتابة الـ <span class=\"en\">rhyme scheme<\/span> لقصيدة، وبعدين طبقها على أول <span class=\"en\">quatrain<\/span> في <span class=\"en\">Sonnet 18<\/span> (\"<span class=\"en\">Shall I compare thee to a summer's day?<\/span> / <span class=\"en\">Thou art more lovely and more temperate<\/span>: / <span class=\"en\">Rough winds do shake the darling buds of May,<\/span> / <span class=\"en\">And summer's lease hath all too short a date.<\/span>\").", "key": "poetry-11:6", "n": 1, "i": 26}, {"t": "write", "h": "", "q": "قارن بين نظامين (مثلاً <span class=\"en\">AABB<\/span> و <span class=\"en\">ABCB)<\/span>: كل واحد إحساسه إيه وبينفع لأي نوع قصايد؟ وبعدين اكتب <span class=\"en\">quatrain<\/span> من تأليفك بنظام تختاره وقول إيه النظام ده.", "key": "poetry-11:7", "n": 1, "i": 27}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 28}];</script>
