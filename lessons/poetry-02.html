<script>window.LESSON_ID="poetry-02";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">في الدرس الأول عرفنا إن القصيدة بتتكون من سطور، وإن الشاعر بيختار يقطع السطر فين. النهاردة ٣ أفكار جديدة، واحدة واحدة وبخطوات صغيرة.</div>", "n": 1, "i": 0, "a": "poetry-02-001", "x": "022b8d4f"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: إيه هو المقطع (<span class=\"en\">stanza</span>)؟", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">تخيل عمارة: العمارة فيها أدوار، وكل دور فيه أوض. القصيدة زي العمارة بالظبط: المقطع (<span class=\"en\">stanza</span>) هو \"الدور\"، والسطور هي \"الأوض\".</div><div class=\"u\">يعني إيه مقطع ببساطة؟ مجموعة سطور واقفين جنب بعض، وبعدهم سطر فاضي، وبعدين المجموعة اللي بعدها.</div>", "n": 2, "i": 2, "a": "poetry-02-002", "x": "585352db"}, {"t": "mc", "h": "", "q": "في تشبيه العمارة، المقطع (<span class=\"en\">stanza</span>) هو _____ والسطور هي الأوض.", "nq": 1, "opts": ["الدور", "السلم", "الباب"], "ans": 0, "why": "الدور", "ex": ["صح: المقطع هو الدور، والسطور هي الأوض اللي جواه.", "غلط: السلم مش بيمثل المقطع في التشبيه ده.", "غلط: الباب مش جزء من التشبيه."], "i": 3}, {"t": "learn", "h": "<div class=\"lead\">ليه الشاعر يقسّم قصيدته لمقاطع؟ ٣ أسباب:</div><div class=\"u\">١- كل مقطع بيقول فكرة واحدة أو بيورّي مشهد واحد، زي الكاميرا ما بتلف من حتة لحتة.</div><div class=\"u\">٢- المقاطع بتريّح عين القارئ، زي ما بنقف ناخد نفس بين دور ودور على السلم.</div><div class=\"u\">٣- أول مقطع جديد أحياناً معناه: \"انتبه، هنتكلم في حاجة تانية\".</div>", "n": 3, "i": 4, "a": "poetry-02-003", "x": "832c30d9"}, {"t": "learn", "h": "<div class=\"u\">افتكر قصيدة الدرس اللي فات (<span class=\"en\">The Red Wheelbarrow</span>): ٤ مقاطع، كل مقطع سطرين، وكل مقطع بيورّي جزء من الصورة: الأول فكرة \"الاعتماد\"، التاني العجلة، التالت مية المطر، الرابع الفراخ البيضا.</div>", "n": 1, "i": 5, "a": "poetry-02-004", "x": "ff104e50"}, {"t": "mc", "h": "", "q": "<span class=\"en\">The Red Wheelbarrow</span> فيها كام مقطع، وكل مقطع كام سطر؟", "nq": 1, "opts": ["مقطعين، كل مقطع ٤ سطور", "٤ مقاطع، كل مقطع سطرين", "مقطع واحد من ٨ سطور"], "ans": 1, "why": "٤ مقاطع، كل مقطع سطرين", "ex": ["غلط: ده مش شكل القصيدة.", "صح: ٤ مقاطع، كل مقطع سطرين، وكل مقطع بيورّي جزء من الصورة.", "غلط: القصيدة مقسومة لـ ٤ مقاطع."], "i": 6}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: للمقاطع أسماء على حسب عدد سطورها", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"lead\">احفظ أشهر ٣ أسماء:</div><div class=\"u\">١- <span class=\"en\">couplet</span>: مقطع من سطرين (من <span class=\"en\">couple</span> يعني اتنين مرتبطين، زي جوز ومراته).</div>", "n": 1, "i": 8, "a": "poetry-02-005", "x": "577c29ce"}, {"t": "mc", "h": "", "q": "مقطع من سطرين اسمه...", "nq": 1, "opts": ["<span class=\"en\">couplet</span>", "<span class=\"en\">tercet</span>", "<span class=\"en\">quatrain</span>"], "ans": 0, "why": "<span class=\"en\">couplet</span>", "ex": ["صح: الـ <span class=\"en\">couplet</span> مقطع من سطرين.", "غلط: الـ <span class=\"en\">tercet</span> من ٣ سطور.", "غلط: الـ <span class=\"en\">quatrain</span> من ٤ سطور."], "i": 9}, {"t": "learn", "h": "<div class=\"lead\">مثال بسيط من تأليفي:</div><div class=\"u\"><span class=\"en\">The moon is up,</span> <span class=\"en\">the stars are bright,</span></div><div class=\"u\"><span class=\"en\">I say goodnight,</span> <span class=\"en\">I sleep tight.</span></div><div class=\"u\">٢- <span class=\"en\">tercet</span>: مقطع من ٣ سطور (من <span class=\"en\">three</span>).</div>", "n": 3, "i": 10, "a": "poetry-02-006", "x": "c68485f7"}, {"t": "learn", "h": "<div class=\"lead\">مثال بسيط:</div><div class=\"u\"><span class=\"en\">The rain is falling on the street,</span></div><div class=\"u\"><span class=\"en\">The kids are running with bare feet,</span></div><div class=\"u\"><span class=\"en\">The smell of dust is oh so sweet.</span></div><div class=\"u\">٣- <span class=\"en\">quatrain</span>: مقطع من ٤ سطور (من <span class=\"en\">four</span>). وده أشهر مقطع في الشعر الإنجليزي كله.</div><div class=\"u\">مثال حقيقي: أول مقطع من قصيدة \"<span class=\"en\">The Tyger</span>\" (النمر) للشاعر <span class=\"en\">William Blake</span>، سنة ١٧٩٤:</div><div class=\"u\"><span class=\"en\">Tyger Tyger,</span> <span class=\"en\">burning bright,</span></div><div class=\"u\"><span class=\"en\">In the forests of the night</span>;</div>", "n": 7, "i": 11, "a": "poetry-02-007", "x": "a561d98a"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">What immortal hand or eye,</span></div><div class=\"u\"><span class=\"en\">Could frame thy fearful symmetry?</span></div><div class=\"u\">عد معايا: ١... ٢... ٣... ٤. يبقى ده <span class=\"en\">quatrain.</span> والقصيدة كلها ٦ مقاطع، كلهم أربع سطور.</div><div class=\"u\">فيه مقاطع أطول (٥ و٦ و٨ سطور وليها أسماء)، بس مش هنشغل دماغنا بيها دلوقتي.</div>", "n": 4, "i": 12, "a": "poetry-02-008", "x": "a5313516"}, {"t": "mc", "h": "", "q": "قصيدة <span class=\"en\">The Tyger</span> لـ <span class=\"en\">William Blake</span> (1794) مقاطعها كلها من نوع...", "nq": 1, "opts": ["<span class=\"en\">couplet</span>", "<span class=\"en\">tercet</span>", "<span class=\"en\">quatrain</span>"], "ans": 2, "why": "<span class=\"en\">quatrain</span>", "ex": ["غلط: مقاطعها مش من سطرين.", "غلط: مقاطعها مش من ٣ سطور.", "صح: كل مقطع فيها ٤ سطور، يعني <span class=\"en\">quatrain</span>، والقصيدة ٦ مقاطع."], "i": 13}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: الشاعر مش هو اللي بيتكلم! (<span class=\"en\">poet vs speaker</span>)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">دي من أهم الأفكار في الشعر كله، وناس كتير بتتلخبط فيها.</div><div class=\"u\">تخيل مسرحية: مؤلف كتب الكلام وهو قاعد في بيته، وممثل واقف على المسرح بيقول الكلام بشخصية معينة. الممثل بيمثّل، مش بيتكلم عن نفسه.</div>", "n": 2, "i": 15, "a": "poetry-02-009", "x": "4db56964"}, {"t": "learn", "h": "<div class=\"lead\">الشعر نفس النظام:</div><div class=\"li\">الـ <span class=\"en\">poet</span> (الشاعر): المؤلف، اللي كتب القصيدة فعلاً.</div><div class=\"li\">الـ <span class=\"en\">speaker</span> (المتكلم): \"الشخصية\" أو الصوت اللي بيتكلم جوه القصيدة.</div>", "n": 2, "i": 16, "a": "poetry-02-010", "x": "838e9446"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">poet</span> هو...", "nq": 1, "opts": ["الصوت اللي بيتكلم جوه القصيدة", "المؤلف اللي كتب القصيدة فعلاً", "القارئ"], "ans": 1, "why": "المؤلف اللي كتب القصيدة فعلاً", "ex": ["غلط: ده الـ <span class=\"en\">speaker</span>.", "صح: الـ <span class=\"en\">poet</span> هو المؤلف اللي كتب القصيدة، والـ <span class=\"en\">speaker</span> هو الصوت جواها.", "غلط: القارئ مش الشاعر."], "i": 17}, {"t": "learn", "h": "<div class=\"lead\">إزاي أعرف مين الـ <span class=\"en\">speaker</span>؟ ٣ خطوات:</div><div class=\"u\">١- شوف الضمائر: القصيدة بتقول \"أنا\" (<span class=\"en\">I</span>)؟</div><div class=\"u\">٢- اسأل: الـ \"أنا\" دي مين؟ طفل؟ شايب؟ جندي؟ حتى ممكن تكون شجرة أو حيوان.</div><div class=\"u\">٣- قارن بالشاعر الحقيقي: هل ممكن يكون هو فعلاً؟</div><div class=\"u\">مثال حقيقي: قصيدة \"<span class=\"en\">The Chimney Sweeper</span>\" (كنّاس المداخن) لـ <span class=\"en\">William Blake</span>، من <span class=\"en\">Songs of Innocence</span> سنة ١٧٨٩:</div><div class=\"u\"><span class=\"en\">When my mother died I was very young,</span></div>", "n": 5, "i": 18, "a": "poetry-02-011", "x": "3ae0ff08"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">And my father sold me while yet my tongue</span></div><div class=\"u\"><span class=\"en\">Could scarcely cry weep weep weep weep.</span></div><div class=\"u\">المعنى: \"لما ماما ماتت كنت صغير جداً، وبابا باعني وأنا لسه لساني بالكاد بيقول <span class=\"en\">weep weep</span>\" (<span class=\"en\">weep</span> يعني يعيط، وهي كمان صوت الكنّاسين وهما بينادوا على شغلهم).</div>", "n": 3, "i": 19, "a": "poetry-02-012", "x": "54ddf53a"}, {"t": "learn", "h": "<div class=\"u\">مين بيتكلم هنا؟ طفل صغير بيكنس مداخن. هل <span class=\"en\">Blake</span> كان طفل كنّاس؟ لأ، كان راجل بالغ بيكتب في بيته. يبقى الـ <span class=\"en\">poet</span> هو <span class=\"en\">Blake</span>، والـ <span class=\"en\">speaker</span> هو الطفل. وليه؟ عشان لما تسمع المأساة من بق الطفل نفسه، قلبك بيوجعك أكتر.</div>", "n": 1, "i": 20, "a": "poetry-02-013", "x": "3b3452b8"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">The Chimney Sweeper</span>، مين الـ <span class=\"en\">speaker</span>؟", "nq": 1, "opts": ["<span class=\"en\">William Blake</span>", "طفل صغير بيكنس مداخن", "أب الشاعر"], "ans": 1, "why": "طفل صغير بيكنس مداخن", "ex": ["غلط: <span class=\"en\">Blake</span> هو الـ <span class=\"en\">poet</span>، مش المتكلم.", "صح: المتكلم طفل كنّاس، والشاعر <span class=\"en\">Blake</span> راجل بالغ كتبها، وسماع المأساة من الطفل بيأثر أكتر.", "غلط: الأب مذكور في القصيدة بس مش هو اللي بيتكلم."], "i": 21}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: اقرأ القصيدة بصوت عالي!", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">الشعر اتعمل عشان يتسمع، زي الأغنية. خطوات القراءة:</div><div class=\"u\">١- اقرأها بعينك ببطء عشان تفهم الكلمات.</div><div class=\"u\">٢- اقرأها بصوت عالي ببطء برضه.</div><div class=\"u\">٣- وقف وقفة صغيرة في آخر كل مقطع (الفراغ معناه \"خد نفس\").</div><div class=\"u\">٤- سمّع ودانك: فيه كلمات بتقفل على بعض في آخر السطور؟ (زي <span class=\"en\">bright</span> و <span class=\"en\">night</span>). دي اسمها قافية، والدرس الجاي بالتفصيل.</div>", "n": 5, "i": 23, "a": "poetry-02-014", "x": "1b6996af"}, {"t": "tf", "h": "", "q": "الشعر اتعمل عشان يتسمع، فالأحسن تقراه بصوت عالي.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: الشعر زي الأغنية، واتعمل عشان يتسمع.", "الجملة صح: القراءة بصوت عالي مع وقفة في آخر كل مقطع بتخليك تحس بالقصيدة."], "i": 24}, {"t": "learn", "h": "<div class=\"u\">جرب دلوقتي: اقرأ مقطع <span class=\"en\">The Tyger</span> مرتين. مرة بسرعتك العادية ومرة ببطء مع وقفة في الآخر. هتحس الفرق.</div>", "n": 1, "i": 25, "a": "poetry-02-015", "x": "9ac3d44d"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">١- المقطع (<span class=\"en\">stanza</span>): مجموعة سطور وبعدها سطر فاضي، زي دور في عمارة.</div><div class=\"u\">٢- <span class=\"en\">couplet</span> سطرين، <span class=\"en\">tercet</span> تلاتة، <span class=\"en\">quatrain</span> أربعة (الأشهر).</div><div class=\"u\">٣- الـ <span class=\"en\">poet</span> كتب القصيدة، والـ <span class=\"en\">speaker</span> هو الصوت اللي بيتكلم جواها، ومش دايماً نفس الشخص.</div><div class=\"u\">والقاعدة الذهبية: القصيدة بتتقرا بصوت عالي عشان تتحس.</div>", "n": 4, "i": 27, "a": "poetry-02-016", "x": "77480aa3"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️</span></span> تمرين:</div><div class=\"u\">١- اكتب ٤ سطور عن أي حاجة شفتها النهاردة (الشمس، الشاي، الميكروباص) في مقطعين، كل مقطع سطرين (<span class=\"en\">couplet</span>ين).</div><div class=\"u\">٢- مين الـ <span class=\"en\">speaker</span> في سطورك؟ إنت؟ ولا شخصية تانية بتتخيلها؟</div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.</div>", "n": 4, "i": 28, "a": "poetry-02-017", "x": "e243ce0e"}, {"t": "recall", "h": "", "q": "مقطع من ٤ سطور اسمه إيه؟ ومن ٣ سطور؟", "a": "أربع سطور: <span class=\"en\">quatrain.</span> تلات سطور: <span class=\"en\">tercet.</span>", "n": 1, "i": 29}, {"t": "recall", "h": "", "q": "قصيدة <span class=\"en\">The Tyger</span> فيها كام مقطع؟ وكل مقطع نوعه إيه؟", "a": "٦ مقاطع، وكلها <span class=\"en\">quatrains</span> (كل مقطع ٤ سطور).", "n": 1, "i": 30}, {"t": "recall", "h": "", "q": "في قصيدة <span class=\"en\">The Chimney Sweeper</span>: مين الـ <span class=\"en\">poet</span>؟ ومين الـ <span class=\"en\">speaker</span>؟", "a": "الـ <span class=\"en\">poet</span> هو <span class=\"en\">William Blake</span>، والـ <span class=\"en\">speaker</span> هو طفل صغير بيشتغل كنّاس مداخن.", "n": 1, "i": 31}, {"t": "tf", "h": "", "q": "صح ولا غلط: عشان تفهم القصيدة صح، المفروض تقراها بسرعة وبصوت واطي.", "ans": false, "why": "غلط. القصيدة بتتقرا بصوت عالي وببطء، مع وقفة صغيرة في آخر كل مقطع، عشان تسمع مزيكا الكلام وتشوف الصور.", "n": 1, "i": 32, "ex": ["الجملة غلط. القصيدة بتتقرا بصوت عالي وببطء، مع وقفة صغيرة في آخر كل مقطع، عشان تسمع مزيكا الكلام وتشوف الصور.", "صح، الجملة غلط. القصيدة بتتقرا بصوت عالي وببطء، مع وقفة صغيرة في آخر كل مقطع، عشان تسمع مزيكا الكلام وتشوف الصور."]}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 33}];</script>
