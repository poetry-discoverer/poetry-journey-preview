<script>window.LESSON_ID="history-103";window.STEPS=[{"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🎩<\/span><\/span> القرن ١٨ (الكلاسيكية الجديدة / عصر العقل):<\/div><div class=\"u\">السمات: العقل فوق الإحساس، الاتزان والنظام، الهجاء الاجتماعي، تقليد شعراء اليونان وروما. الشكل الملك هو الـ <span class=\"en\">heroic couplet<\/span>: أبيات خماسية مقفّاة ورا بعضها زوج زوج.<\/div>", "n": 1, "i": 0, "a": "history-103-001", "x": "6c0a1e6e"}, {"t": "learn", "h": "<div class=\"u\">النجم الأول: <span class=\"en\">Alexander Pope.<\/span> كتب <span class=\"en\">The Rape of the Lock<\/span>، ملحمة هزلية (<span class=\"en\">mock-epic<\/span>) بيعامل فيها قصة خصلة شعر اتقصت من بنت كأنها معركة في الإلياذة، و<span class=\"en\">An Essay on Criticism<\/span> (١٧١١) اللي جالنا منها المثل:<\/div><div class=\"u\">\"<span class=\"en\">To err is human<\/span>; <span class=\"en\">to forgive,<\/span> <span class=\"en\">divine<\/span>\"<\/div><div class=\"u\">\"الغلط إنساني، والعفو إلهي\"<\/div>", "n": 3, "i": 1, "a": "history-103-002", "x": "80dcf27b"}, {"t": "learn", "h": "<div class=\"u\">من نص القرن بيبدأ التحول: الحنين والطبيعة والتأمل، حتى اتسمت مدرسة \"شعراء المقابر\". أشهرهم <span class=\"en\">Thomas Gray<\/span> بقصيدة <span class=\"en\">Elegy Written in a Country Churchyard<\/span> (١٧٥١) رثاء للناس العادية اللي ماتوا ومحدش يعرفهم:<\/div><div class=\"u\">\"<span class=\"en\">The curfew tolls the knell of parting day<\/span>\"<\/div><div class=\"u\">\"جرس الغروب بيدق معلنًا نهاية اليوم\"<\/div>", "n": 3, "i": 2, "a": "history-103-003", "x": "4f2c4384"}, {"t": "learn", "h": "<div class=\"u\">وفي آخر القرن البراعم: <span class=\"en\">Robert Burns<\/span> بشعر بلهجة الشعب الاسكتلندي (١٧٨٦)، و<span class=\"en\">William Blake<\/span> صاحب <span class=\"en\">Songs of Innocence<\/span> (١٧٨٩) و<span class=\"en\">Songs of Experience<\/span> (١٧٩٤)، اللي خدنا منه <span class=\"en\">The Tyger<\/span> و<span class=\"en\">The Sick Rose.<\/span> دول بوابة الرومانسية.<\/div>", "n": 1, "i": 3, "a": "history-103-004", "x": "6ce36e44"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🌹<\/span><\/span> القرن ١٩ (نصفين: رومانسية وفيكتوري):<\/div><div class=\"u\">١. الرومانسية (١٧٩٨ لحوالي ١٨٣٢): البداية الرسمية مجموعة <span class=\"en\">Lyrical Ballads<\/span> (١٧٩٨) لـ <span class=\"en\">Wordsworth<\/span> و<span class=\"en\">Coleridge.<\/span> السمات: الإحساس فوق العقل، الطبيعة مدرسة وإله، الخيال أعلى سلطة، الفرد والذات، ولغة الناس العادية بدل الزخرفة.<\/div><div class=\"u\"><span class=\"en\">Wordsworth<\/span>: \"<span class=\"en\">I wandered lonely as a cloud<\/span>\"<\/div><div class=\"u\">\"كنت بتسحّب وحدي زي سحابة\"<\/div>", "n": 3, "i": 4, "a": "history-103-005", "x": "fd11d926"}, {"t": "learn", "h": "<div class=\"u\">الجيل التاني: <span class=\"en\">Byron<\/span> المتمرد، و<span class=\"en\">Shelley<\/span> الحالم:<\/div><div class=\"u\">\"<span class=\"en\">If Winter comes,<\/span> <span class=\"en\">can Spring be far behind?<\/span>\"<\/div><div class=\"u\">\"لو الشتا جه، يبقى الربيع قريب\"<\/div>", "n": 3, "i": 5, "a": "history-103-006", "x": "087de1be"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">can Spring be far _____?<\/div>", "opts": ["behind", "loved", "cloud"], "ans": 0, "why": "<span class=\"en\">can Spring be far behind?<\/span>", "i": 6, "ex": ["صح: السطر من قصيدة <span class=\"en\">Shelley<\/span> (<span class=\"en\">Ode to the West Wind<\/span>): <span class=\"en\">If Winter comes<\/span>, <span class=\"en\">can Spring be far behind<\/span>? أي: هل الربيع بعيد وراء الشتاء؟", "غلط: <span class=\"en\">loved<\/span> فعل ماضٍ ولا يكمل السؤال بعد <span class=\"en\">far<\/span>. الشاعر يسأل عن قرب الربيع، لا عن الحب.", "غلط: <span class=\"en\">cloud<\/span> اسم (سحابة)، ولا يأتي بعد <span class=\"en\">far<\/span> في هذا التركيب. المطلوب ظرف يكمل المعنى: <span class=\"en\">far behind<\/span>."]}, {"t": "learn", "h": "<div class=\"lead\">و<span class=\"en\">Keats<\/span> شاعر الجمال:<\/div><div class=\"u\">\"<span class=\"en\">A thing of beauty is a joy for ever<\/span>\"<\/div><div class=\"u\">\"الحاجة الحلوة فرحة على طول\"<\/div><div class=\"u\">٢. الفيكتوري (١٨٣٧ لـ ١٩٠١، عصر الملكة فيكتوريا): شعر الشك والإيمان في زمن العلم والمصانع. <span class=\"en\">Alfred Tennyson<\/span> شاعر البلاط، و<span class=\"en\">Robert Browning<\/span> اللي طوّر الـ <span class=\"en\">dramatic monologue<\/span> زي <span class=\"en\">My Last Duchess<\/span>، و<span class=\"en\">Matthew Arnold.<\/span><\/div>", "n": 3, "i": 7, "a": "history-103-007", "x": "c833c7ea"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">Tennyson<\/span>:<\/div><div class=\"u\">\"'<span class=\"en\">Tis better to have loved and lost<\/span> / <span class=\"en\">Than never to have loved at all<\/span>\"<\/div><div class=\"u\">\"تحب وتخسر أحسن مليون مرة من إنك تعيش من غير حب\"<\/div>", "n": 2, "i": 8, "a": "history-103-008", "x": "a0f0a21e"}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 9}];</script>
