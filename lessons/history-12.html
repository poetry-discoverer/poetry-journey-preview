<script>window.LESSON_ID="history-12", "history-13", "history-14", "history-15", "history-16", "history-17", "history-18", "history-19", "history-20", "history-21";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Langland</span> و<span class=\"en\">Piers Plowman</span>، والـ <span class=\"en\">ballads</span>، والشعر الاسكتلندي + امتحان المستوى\"</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🏁</span></span> وصلنا لآخر درس في المستوى الأول. الدرس ده فيه تلات حاجات كبار: شاعر عظيم اسمه <span class=\"en\">William Langland</span>، ونوع شعر مختلف تماماً اسمه الـ <span class=\"en\">ballad</span>، ومدرسة اسكتلندية كاملة. وفي الآخر مراجعة وكويزات على المستوى كله. خد نفسك، الدرس ده طويل شوية بس هو اللي بيقفل المستوى كله.</div>", "n": 2, "i": 0, "a": "history-12-001", "x": "d94e8ad8"}, {"t": "learn", "h": "<div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️</span></span>⃣: <span class=\"en\">William Langland</span>: الشاعر اللي كتب وعدّل 20 سنة <span class=\"em\"><span class=\"em\">🕰️</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> مين هو؟</div><div class=\"li\"><span class=\"en\">William Langland</span>، اتولد حوالي 1330 ومات حوالي 1386-1400. يعني تقريباً نفس جيل <span class=\"en\">Chaucer</span>، وشاعر من نفس البلد.</div><div class=\"li\">الدارسين بيقولوا إنه غالباً كان رجل دين صغير (<span class=\"en\">cleric</span>)، وارتبط بمنطقة <span class=\"en\">Malvern Hills</span> في غرب إنجلترا، وعاش فترة في لندن.</div>", "n": 4, "i": 1, "a": "history-12-002", "x": "e0f5b827"}, {"t": "learn", "h": "<div class=\"li\">اسمه نفسه فيه لغز: القصيدة فيها سطر مشهور \"<span class=\"en\">I have lyved in londe.</span>.. <span class=\"en\">my name is longe wille</span>\" (عشت في البلد... اسمي <span class=\"en\">Will</span> الطويل)، والدارسين بيعتبروه تورية على \"<span class=\"en\">William Langland</span>\".</div><div class=\"li\">بس فيه ناس بتشك في النسبة أصلاً.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> المهم: القصيدة مش كتاب واحد!</div><div class=\"li\"><span class=\"en\">Piers Plowman</span> موجود في تلات نسخ مختلفة، وغالباً كلها من تعديل نفس الشاعر على مدى سنين:</div>", "n": 4, "i": 2, "a": "history-12-003", "x": "1b8900c0"}, {"t": "learn", "h": "<div class=\"u\">١. النسخة <span class=\"en\">A</span>: حوالي 2,500 سطر، مكتوبة حوالي 1367-1370.</div><div class=\"u\">٢. النسخة <span class=\"en\">B</span>: حوالي 7,200 سطر، مكتوبة حوالي 1377-1379، وهي اللي بتتقرا وتترجم أكتر من غيرها.</div><div class=\"u\">٣. النسخة <span class=\"en\">C</span>: حوالي 7,350 سطر، مكتوبة في التمانينات، وفيها حذف وتعديل.</div><div class=\"li\">يعني الراجل ده قعد حوالي 20 سنة يكتب ويعيد ويكتب نفس القصيدة. مفيش \"نسخة نهائية\" واحدة. وده مش غلط: ده جزء من طبيعة النص.</div>", "n": 4, "i": 3, "a": "history-12-004", "x": "41c505e9"}, {"t": "mc", "h": "", "q": "إيه المميز في قصيدة <span class=\"en\">Piers Plowman</span> من ناحية النسخ؟", "nq": 1, "opts": ["ليها نسخة واحدة نهائية", "ليها تلات نسخ <span class=\"en\">A</span> و<span class=\"en\">B</span> و<span class=\"en\">C</span>، والشاعر فضل يعدلها حوالي 20 سنة", "اتكتبت في سنة واحدة"], "ans": 1, "why": "ليها تلات نسخ <span class=\"en\">A</span> و<span class=\"en\">B</span> و<span class=\"en\">C</span>، والشاعر فضل يعدلها حوالي 20 سنة", "ex": ["غلط: مفيش نسخة نهائية واحدة.", "صح: والنسخة <span class=\"en\">B</span> هي الأكتر قراءة.", "غلط: خدت سنين."], "i": 4}, {"t": "learn", "h": "<div class=\"li\">المخطوطات: أكتر من 50 مخطوطة، مفيش واحدة بخط الشاعر. طبعة مطبوعة أول مرة سنة 1550 على يد <span class=\"en\">Robert Crowley.</span></div>", "n": 1, "i": 5, "a": "history-12-005", "x": "28ca0d47"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> المثال اليومي:</div><div class=\"li\">تخيل حد بيكتب رواية على مدى 20 سنة، وكل فترة بيطلّع نسخة جديدة، بيعدّل فيها حسب اللي حصل في البلد. مش \"كتاب\" واحد، ده سجل حياة.</div><div class=\"li\">وده بالظبط اللي عمله <span class=\"en\">Langland</span>: كل نسخة بتعكس زمنها ومخاوفها.</div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️</span></span>⃣: الحكاية: سلسلة أحلام عن مجتمع كامل <span class=\"em\"><span class=\"em\">💭</span></span></div>", "n": 3, "i": 6, "a": "history-12-006", "x": "b22391c1"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> البداية:</div><div class=\"li\"><span class=\"en\">Will</span> (الراوي، واسمه زي اسم الشاعر) بيمشي في تلال <span class=\"en\">Malvern</span>، يتعب، ينام، ويحلم.</div><div class=\"li\">في الحلم بيشوف برج عالي على تلّة (ده مقر الحقيقة/الجنة)، ووادي عميق فيه حصن (ده مملكة الظلام)، وبينهم \"<span class=\"en\">a fair field full of folk</span>\" - سهل جميل مليان ناس.</div><div class=\"li\">وده العالم كله: كل المهن والطبقات، بيشتغلوا وبيغلطوا.</div>", "n": 3, "i": 7, "a": "history-12-007", "x": "6aceb124"}, {"t": "mc", "h": "", "q": "الراوي <span class=\"en\">Will</span> في بداية القصيدة بيشوف إيه في حلمه؟", "nq": 1, "opts": ["برج عالي ووادي فيه حصن، وبينهم سهل مليان ناس", "معركة بين فرسان", "سفينة في البحر"], "ans": 0, "why": "برج عالي ووادي فيه حصن، وبينهم سهل مليان ناس", "ex": ["صح: السهل ده هو المجتمع كله.", "غلط: مش ده الحلم.", "غلط: مش ده الحلم."], "i": 8}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">a fair _____ full of folk</div>", "opts": ["where", "field", "blude"], "ans": 1, "why": "<span class=\"en\">a fair field full of folk</span>", "i": 9}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> بعد كده القصيدة بتبدأ تعمل حاجة عجيبة: بدل ما تحكي قصة، بتعرض المجتمع.</div><div class=\"li\"><span class=\"en\">Holy Church</span> (الكنيسة المقدسة) بتنزل من البرج وتشرحله معنى الحلم.</div><div class=\"li\"><span class=\"en\">Lady Meed</span> (الرشوة/المال) بتظهر، ومحاولة جوازها من <span class=\"en\">False</span> (الكذب)، وبعدين من <span class=\"en\">Conscience</span> (الضمير)، والملك بيحاول يوفق بينهم.</div><div class=\"li\">وده فصل كامل عن الفساد والمال في المحاكم والقصور.</div>", "n": 4, "i": 10, "a": "history-12-008", "x": "440f1b81"}, {"t": "learn", "h": "<div class=\"li\">بعدها اعترافات الخطايا السبع المميتة: <span class=\"en\">Pride</span> و<span class=\"en\">Envy</span> و<span class=\"en\">Wrath</span> و<span class=\"en\">Sloth</span> و<span class=\"en\">Avarice</span> و<span class=\"en\">Gluttony</span> و<span class=\"en\">Lechery.</span> كل واحد بيعترف بنفسه، بمشهد مضحك ومقزز في نفس الوقت.</div>", "n": 1, "i": 11, "a": "history-12-009", "x": "f7ae4f6f"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> ظهور <span class=\"en\">Piers</span>:</div><div class=\"li\">الفلاح <span class=\"en\">Piers Plowman</span> بيظهر لأول مرة، وبيقول للناس اللي عايزين يمشوا في طريق الحق: تعالى ساعدوني أحرث نص الفدان بتاعي الأول.</div><div class=\"li\">وفيه مشهد رائع: الناس بتتهاون في الشغل، فبيجيب \"<span class=\"en\">Hunger</span>\" (الجوع) يخوفهم، فيشتغلوا. ولما يشبعوا، يرجعوا يتهاونوا تاني. يعني الفلاح بيعرف حقيقة الناس.</div>", "n": 2, "i": 12, "a": "history-12-010", "x": "03010874"}, {"t": "learn", "h": "<div class=\"li\">وبعدين الحقيقة (<span class=\"en\">Truth</span>) تبعت لـ <span class=\"en\">Piers</span> \"صك غفران\" (<span class=\"en\">pardon</span>). وكاهن بيقراه ويقول: مفيش صك غفران هنا! فـ <span class=\"en\">Piers</span> يغضب ويقطع الصك نصين.</div><div class=\"li\">المشهد ده من أشهر مشاهد الأدب الإنجليزي في العصور الوسطى: فلاح بيقطع وثيقة دينية قدام كاهن، في بلد كان الدين فيها كل حاجة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> الجزء التاني: البحث</div>", "n": 3, "i": 13, "a": "history-12-011", "x": "f7b86906"}, {"t": "mc", "h": "", "q": "إيه اللي عمله <span class=\"en\">Piers</span> لما الكاهن قرا صك الغفران؟", "nq": 1, "opts": ["شكر الكاهن", "قطع الصك نصين من الغضب", "خبّاه في بيته"], "ans": 1, "why": "قطع الصك نصين من الغضب", "ex": ["غلط: غضب.", "صح: ومشهد زي ده من أشهر مشاهد العصور الوسطى.", "غلط: مش ده اللي حصل."], "i": 14}, {"t": "learn", "h": "<div class=\"li\">بعد كده القصيدة بتتحول لرحلة بحث: <span class=\"en\">Will</span> بيدور على \"<span class=\"en\">Do-Well</span>\" (اعمل خير)، وبعدين \"<span class=\"en\">Do-Better</span>\"، وبعدين \"<span class=\"en\">Do-Best</span>\".</div><div class=\"li\">تلات مراحل في الحياة المسيحية، وكل مرحلة بتبقى سلسلة أحلام وأسئلة.</div><div class=\"li\">وفي النهاية: شجرة الرحمة، وصلب المسيح، و\"سلب الجحيم\" (<span class=\"en\">Harrowing of Hell</span>) - المسيح بينزل الجحيم ويطلع الأرواح.</div>", "n": 3, "i": 15, "a": "history-12-012", "x": "84b7e3ff"}, {"t": "learn", "h": "<div class=\"li\">وفي الآخر، الكنيسة بتبقى مخزن (<span class=\"en\">barn</span>)، والمسيحية بتتهاجم من <span class=\"en\">Antichrist</span>، و<span class=\"en\">Conscience</span> بيهرب في آخر القصيدة وهو بيدور على <span class=\"en\">Piers Plowman.</span></div><div class=\"li\">القصيدة بتخلص والناس تايهة. مفيش نهاية سعيدة.</div>", "n": 2, "i": 16, "a": "history-12-013", "x": "0a82f44e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> المثال اليومي:</div><div class=\"li\">فكر في مسلسل مش عن بطل واحد، بل عن مدينة كاملة: حلقة عن الفساد في المحكمة، حلقة عن الفقر، حلقة عن رجل الدين المنافق، حلقة عن الفلاح اللي بيشتغل.</div><div class=\"li\"><span class=\"en\">Piers Plowman</span> زي المسلسل ده، بس مكتوب شعر، وفي القرن الـ14.</div><div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️</span></span>⃣: ليه <span class=\"en\">Piers Plowman</span> مهم للتاريخ؟ <span class=\"em\"><span class=\"em\">🌍</span></span></div>", "n": 3, "i": 17, "a": "history-12-014", "x": "ada90b7a"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> تلات أسباب:</div><div class=\"u\">١. من أوائل القصايد الإنجليزية الكبيرة عن المجتمع كله، مش عن فارس ولا عن حب. البطل الحقيقي فيها فلاح، وده حاجة جديدة تماماً في أدب راقي.</div><div class=\"u\">٢. القصيدة سياسية بشكل خطير. وفي سنة 1381، وقت ثورة الفلاحين، ظهر اسم \"<span class=\"en\">Piers Plowman</span>\" في رسايل منسوبة لقادة الثورة. يعني القصيدة كان ليها صدى سياسي حقيقي.</div>", "n": 2, "i": 18, "a": "history-12-015", "x": "4fd87573"}, {"t": "learn", "h": "<div class=\"u\">٣. الأليلجوري (<span class=\"en\">allegory</span>): كل شخصية فيها معنى. <span class=\"en\">Holy Church</span> مش ست، دي الكنيسة. <span class=\"en\">Lady Meed</span> مش ست، دي الرشوة. وده مش رمز بسيط: القصيدة بتخليك تشك في كل معنى بتقوله.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> الأليلجوري إيه بالظبط؟ (شرح مبسط)</div><div class=\"li\">في الحلم، مفيش حد بيفكر: \"ده رمز\". إنت بتشوف ناس، وبعدين بتكتشف إنهم أفكار. زي ما تحلم بامتحان، وتلاقي الامتحان نفسه شخص بيجري وراك.</div>", "n": 3, "i": 19, "a": "history-12-016", "x": "9a0ad485"}, {"t": "mc", "h": "", "q": "إيه معنى الأليجوري (<span class=\"en\">allegory</span>) في <span class=\"en\">Piers Plowman</span>؟", "nq": 1, "opts": ["كل شخصية بتمثل فكرة، زي <span class=\"en\">Lady Meed</span> اللي هي الرشوة", "كل شخصية فارس حقيقي", "القصيدة كلها قافية"], "ans": 0, "why": "كل شخصية بتمثل فكرة، زي <span class=\"en\">Lady Meed</span> اللي هي الرشوة", "ex": ["صح: وده بيخلي القصيدة بتنتقد المجتمع.", "غلط: دي أفكار مش ناس.", "غلط: القصيدة مكتوبة بالجناس."], "i": 20}, {"t": "learn", "h": "<div class=\"li\">الحلم بيخلط بين الحقيقي والمجازي، والقارئ بيحس بالمعنى قبل ما يفهمه.</div><div class=\"li\">وده اللي يخلي <span class=\"en\">Piers Plowman</span> صعب: مش عشان اللغة بس، عشان كل حاجة فيها ليها أكتر من معنى، ومفيش مفتاح واحد يفتح كل حاجة.</div>", "n": 2, "i": 21, "a": "history-12-017", "x": "6d24878e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> ملاحظة على اللغة:</div><div class=\"li\">القصيدة مكتوبة بالجناس، مش بالقافية. يعني هي في نفس خط <span class=\"en\">Gawain</span> (درس 11)، وفي نفس خط <span class=\"en\">Beowulf</span> (درس 2).</div><div class=\"li\"><span class=\"en\">Langland</span> فضل على الطريق القديم، و<span class=\"en\">Chaucer</span> مشي على الطريق الجديد. الاتنين في نفس البلد، في نفس الجيل، وكل واحد منهم بيمثل مستقبل مختلف للإنجليزية.</div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️</span></span>⃣: الـ <span class=\"en\">ballads</span>: الشعر اللي ملكش صاحب <span class=\"em\"><span class=\"em\">🎶</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> إيه هي الـ <span class=\"en\">ballad</span>؟</div>", "n": 4, "i": 22, "a": "history-12-018", "x": "cd949422"}, {"t": "learn", "h": "<div class=\"li\">أغنية بتحكي حكاية. مش قصيدة غزل ولا تأمل، حكاية: حصل كذا، وبعدين كذا، وبعدين كذا. ومكتوبة بشكل بسيط جداً، ومتكررة، وسهلة الحفظ.</div><div class=\"li\">ومفيش مؤلف. الـ <span class=\"en\">ballad</span> مش بتاعة شاعر، دي بتاعة الناس. كل واحد بيغنيها بيغير فيها شوية، وكل نسخة مختلفة عن التانية.</div>", "n": 2, "i": 23, "a": "history-12-019", "x": "4ff088ef"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الشكل:</div><div class=\"li\">المقطع (<span class=\"en\">stanza</span>) أربع سطور، والقافية في السطر التاني والرابع (<span class=\"en\">abcb</span>)، والسطر الأول والتالت فيهم 4 نبرات، والتاني والرابع 3 نبرات.</div><div class=\"li\">النظام ده اسمه \"<span class=\"en\">ballad stanza</span>\"، وهو الشكل الغالب في مجموعة <span class=\"en\">Child</span> (الدارسين بيعدّوه في أكتر من نص الـ305 <span class=\"en\">ballad</span>).</div><div class=\"li\">مثال (من <span class=\"en\">Sir Patrick Spens</span>):</div><div class=\"u\">\"<span class=\"en\">The king sits in Dunfermline town</span></div><div class=\"u\"><span class=\"en\">Drinking the blude-red wine</span>;</div>", "n": 5, "i": 24, "a": "history-12-020", "x": "f4ac2b29"}, {"t": "mc", "h": "", "q": "إيه شكل المقطع في الـ <span class=\"en\">ballad</span> العادية؟", "nq": 1, "opts": ["مقطع من أربع سطور وقافية <span class=\"en\">abcb</span>", "مقطع من 14 سطر", "مقطع من سطرين بس"], "ans": 0, "why": "مقطع من أربع سطور وقافية <span class=\"en\">abcb</span>", "ex": ["صح: ده الـ <span class=\"en\">ballad stanza</span>.", "غلط: ده سونيت مش <span class=\"en\">ballad</span>.", "غلط: مش الشكل المعتاد."], "i": 25}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Drinking the _____-red wine</div>", "opts": ["lyved", "londe", "blude"], "ans": 2, "why": "<span class=\"en\">Drinking the blude-red wine</span>", "i": 26}, {"t": "learn", "h": "<div class=\"u\">'<span class=\"en\">O where sall I get a guid sailor,</span></div><div class=\"u\"><span class=\"en\">To sail this ship o mine?</span>'\"</div><div class=\"li\">بص على البساطة: مفيش وصف، مفيش تحليل، مفيش \"حس\" داخلي. حوار، وأحداث، وخلاص. والقصيدة بتسيب الإحساس للقارئ.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> خد بالك من حاجة مهمة: الحوار</div><div class=\"li\">في الـ <span class=\"en\">ballad</span>، الشخصيات بتتكلم، والشاعر مش بيشرح. وده اللي بيخليها قريبة من المسرح، وسريعة، ومؤثرة.</div>", "n": 5, "i": 27, "a": "history-12-021", "x": "32883fee"}, {"t": "learn", "h": "<div class=\"li\">وفيه كمان \"<span class=\"en\">incremental repetition</span>\": الجملة بتتكرر بتغيير صغير، وكل تكرار بيضيف معلومة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> إزاي وصلت لنا؟</div><div class=\"li\">الـ <span class=\"en\">ballads</span> كانت بتتغنى وتتنقل بالذاكرة، من جيل لجيل، من غير ورق. ولما الكتابة بقت شائعة، ناس بدأت تجمعها.</div>", "n": 3, "i": 28, "a": "history-12-022", "x": "f3b4043c"}, {"t": "learn", "h": "<div class=\"li\">سنة 1765: الأسقف <span class=\"en\">Thomas Percy</span> طبع <span class=\"en\">Reliques of Ancient English Poetry</span>، وفيها عدد كبير من الـ <span class=\"en\">ballads</span> (الدارسين بيقدّروا بحوالي 180، والعدد نفسه محل خلاف لأن <span class=\"en\">Percy</span> عدّل وحذف وأضاف)، و<span class=\"en\">Percy</span> نفسه \"حسّنها\" وعدّل فيها براحته.</div><div class=\"li\">سنة 1802: <span class=\"en\">Walter Scott</span> طبع <span class=\"en\">Minstrelsy of the Scottish Border</span>، وهو كمان عدّل وحسّن.</div>", "n": 2, "i": 29, "a": "history-12-023", "x": "53dfe626"}, {"t": "learn", "h": "<div class=\"li\">وفي الآخر، العالم الأمريكي <span class=\"en\">Francis James Child</span> عمل المجموعة الكبيرة: <span class=\"en\">The English and Scottish Popular Ballads</span>، اتنشرت بين 1882 و1898، وفيها 305 <span class=\"en\">ballad</span> بكل نسخها.</div><div class=\"li\">لحد النهاردة، لما تقول \"<span class=\"en\">Child ballad</span> رقم 58\" الكل يعرف إنك بتتكلم عن <span class=\"en\">Sir Patrick Spens.</span></div>", "n": 2, "i": 30, "a": "history-12-024", "x": "78c1b53c"}, {"t": "mc", "h": "", "q": "مين جمع 305 <span class=\"en\">ballad</span> في مجموعة ضخمة بين 1882 و1898؟", "nq": 1, "opts": ["<span class=\"en\">Francis James Child</span>", "<span class=\"en\">Walter Scott</span>", "<span class=\"en\">Chaucer</span>"], "ans": 0, "why": "<span class=\"en\">Francis James Child</span>", "ex": ["صح: ولحد النهاردة بنقول <span class=\"en\">Child ballad</span> رقم كذا.", "غلط: <span class=\"en\">Scott</span> طبع <span class=\"en\">Minstrelsy</span> سنة 1802.", "غلط: <span class=\"en\">Chaucer</span> عاش قبل كده بقرون."], "i": 31}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> المثال اليومي (وهو مثال قريب منك):</div><div class=\"li\">إنت حافظ القرآن، وعارف إن النص بيوصل بالحفظ والسماع والترديد، وإن الحفاظ بيمشوا بنفس النص بالحرف.</div><div class=\"li\">الـ <span class=\"en\">ballad</span> بتشتغل بنفس المنطق، بس معاكس: في الحفظ الشفهي للـ <span class=\"en\">ballad</span>، التغيير هو القاعدة، والنسخة الأصلية مش موجودة.</div><div class=\"li\">كل مغني بيعيد إنتاج الأغنية من ذاكرته، وكل إعادة فيها فقد وإضافة.</div>", "n": 3, "i": 32, "a": "history-12-025", "x": "efe31ec3"}, {"t": "learn", "h": "<div class=\"li\">وده بالظبط الفرق بين نص مقدس ونص شعبي: الأول بيتحفظ بالضبط، والتاني بيتحفظ بالمعنى.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> ليه الـ <span class=\"en\">ballads</span> مهمة في تاريخ الشعر؟</div><div class=\"li\">لأنها بتثبت إن الشعر الإنجليزي مكانش بس اللي بيتكتب في القصور. كان فيه خط تاني، شعبي، شفهي، بيتغنى في المطابخ والحقول.</div>", "n": 3, "i": 33, "a": "history-12-026", "x": "5978438e"}, {"t": "learn", "h": "<div class=\"li\">ولما الرومانسيين بعد 300 سنة عايزين يرجعوا للجذور، هيرجعوا للـ <span class=\"en\">ballads</span> دي (وهنشوف ده في المستوى التالت مع <span class=\"en\">Wordsworth</span> و<span class=\"en\">Coleridge</span>).</div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️</span></span>⃣: الشعر الاسكتلندي: الـ <span class=\"en\">Makars</span> <span class=\"em\"><span class=\"em\">🏴</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> إيه حكاية اسكتلندا؟</div><div class=\"li\">اسكتلندا كانت مملكة مستقلة، ولغتها الأدبية كانت \"<span class=\"en\">Older Scots</span>\" - إنجليزي الشمال بلهجة اسكتلندية، مختلفة عن لهجة لندن.</div>", "n": 4, "i": 34, "a": "history-12-027", "x": "bfd81354"}, {"t": "learn", "h": "<div class=\"li\">والشعرا الاسكتلنديين قروا <span class=\"en\">Chaucer</span> و<span class=\"en\">Gower</span>، واعتبروه \"الأستاذ\"، بس عملوا حاجة أهم: بنوا لغتهم الأدبية الخاصة.</div>", "n": 1, "i": 35, "a": "history-12-028", "x": "24bf2ab3"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الأربعة الكبار:</div><div class=\"u\">١. الملك <span class=\"en\">James I</span> (1394-1437): قصيدة <span class=\"en\">The Kingis Quair</span> (كتاب الملك)، حلم فلسفي على طريقة <span class=\"en\">Chaucer</span>، مكتوبة على الأرجح في الفترة بين 1424 و1437، وده رأي أغلب الدارسين. القصة: شاب أسير بيحب ست شافها من شباك السجن (وهي حكايته هو نفسه مع <span class=\"en\">Joan Beaufort</span>).</div>", "n": 1, "i": 36, "a": "history-12-029", "x": "8507156f"}, {"t": "learn", "h": "<div class=\"u\">٢. <span class=\"en\">Robert Henryson</span> (حوالي 1450-1505): بيتقال تقليدياً إنه كان مدرس في <span class=\"en\">Dunfermline.</span> تحفته <span class=\"en\">The Testament of Cresseid</span>، وهي تكملة لـ <span class=\"en\">Troilus and Criseyde</span> بتاع <span class=\"en\">Chaucer</span>: <span class=\"en\">Cresseid</span> بعد ما اتخلى عنها، بتلعن الأقدار، فبتتحول لأبرص (<span class=\"en\">leper</span>) وبتعيش شحادة، وبتموت. حكاية قاسية جداً، وفيها أخلاق وحسرة.</div>", "n": 1, "i": 37, "a": "history-12-030", "x": "d4c61293"}, {"t": "learn", "h": "<div class=\"u\">٣. <span class=\"en\">William Dunbar</span> (حوالي 1460-1513): شاعر بلاط <span class=\"en\">James IV</span>، سليط اللسان وساخر. أشهر قصائده <span class=\"en\">Lament for the Makaris</span>، وهي رثاء لكل الشعرا اللي ماتوا، وكل مقطع بيقفل بـ \"<span class=\"en\">Timor mortis conturbat me</span>\" (خوف الموت بيقلقني). وفيها أسماء شعرا كتير ضاع شعرهم.</div>", "n": 1, "i": 38, "a": "history-12-031", "x": "0360829a"}, {"t": "mc", "h": "", "q": "قصيدة <span class=\"en\">Lament for the Makaris</span> كتبها مين؟", "nq": 1, "opts": ["<span class=\"en\">Robert Henryson</span>", "<span class=\"en\">William Dunbar</span>", "<span class=\"en\">Gavin Douglas</span>"], "ans": 1, "why": "<span class=\"en\">William Dunbar</span>", "ex": ["غلط: <span class=\"en\">Henryson</span> كتب <span class=\"en\">Testament of Cresseid</span>.", "صح: وكل مقطع بيقفل بـ <span class=\"en\">Timor mortis conturbat me</span>.", "غلط: <span class=\"en\">Douglas</span> ترجم الإنيادة."], "i": 39}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Timor _____ conturbat me</div>", "opts": ["mortis", "sailor", "longe"], "ans": 0, "why": "<span class=\"en\">Timor mortis conturbat me</span>", "i": 40}, {"t": "learn", "h": "<div class=\"u\">٤. <span class=\"en\">Gavin Douglas</span> (1474-1522): ترجم الإنيادة بتاعة فيرجيل كاملة في قصيدة اسمها <span class=\"en\">Eneados</span>، خلصها في يوليو 1513. وهي أول ترجمة كاملة للإنيادة للإنجليزية أو الإسكتلندية على أغلب المراجع. وبيتقال إنه من أوائل اللي سموا لغته \"<span class=\"en\">Scottis</span>\" بفخر.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> ليه اسمهم \"<span class=\"en\">Scottish Chaucerians</span>\"؟</div>", "n": 2, "i": 41, "a": "history-12-032", "x": "ebe5ade9"}, {"t": "mc", "h": "", "q": "إيه أنجز <span class=\"en\">Gavin Douglas</span>؟", "nq": 1, "opts": ["كتب <span class=\"en\">Kingis Quair</span>", "ترجم الإنيادة لفيرجيل كاملة في <span class=\"en\">Eneados</span>", "جمع الـ <span class=\"en\">ballads</span>"], "ans": 1, "why": "ترجم الإنيادة لفيرجيل كاملة في <span class=\"en\">Eneados</span>", "ex": ["غلط: ده الملك <span class=\"en\">James I</span>.", "صح: خلصها سنة 1513.", "غلط: ده <span class=\"en\">Child</span>."], "i": 42}, {"t": "learn", "h": "<div class=\"li\">الاسم ده قديم، والدارسين بيقولوا إنه مضلل: صحيح إنهم اتأثروا بـ <span class=\"en\">Chaucer</span>، بس هم مش تلامذة، دول مدرسة كاملة بلغة تانية وتجارب مختلفة.</div><div class=\"li\">الاسم الأدق: \"<span class=\"en\">the Makars</span>\" (من كلمة \"<span class=\"en\">maker</span>\" اللي معناها \"شاعر\" بالإسكتلندي القديم).</div>", "n": 2, "i": 43, "a": "history-12-033", "x": "d54b13a8"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> المثال اليومي:</div><div class=\"li\">زي ما حد في مصر يقرا نجيب محفوظ ويحب أسلوبه، وبعدين يكتب رواية بالمصري، مش يقلده. التأثر مش تقليد. الاسكتلنديين خدوا الأدوات من <span class=\"en\">Chaucer</span>، وعملوا بيها حاجة بلغتهم.</div><div class=\"u\">النقطة 6<span class=\"em\"><span class=\"em\">️</span></span>⃣: خلاصة المستوى الأول: إيه اللي بقى في دمك دلوقتي؟ <span class=\"em\"><span class=\"em\">🧠</span></span></div>", "n": 2, "i": 44, "a": "history-12-034", "x": "0a3a41ef"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> إنت دلوقتي عارف إن:</div><div class=\"li\">الشعر الإنجليزي بدأ شفهي، بالجناس، وبطريقة الحفظ (<span class=\"en\">Beowulf</span> ودرس 2).</div><div class=\"li\">وبعدين دخلته المسيحية (درس 6)، والحرب (درس 3-4)، والحزن (درس 5).</div><div class=\"li\">وفي 1066 دخلت الفرنسية، واتولدت الإنجليزية الوسيطة (درس 8).</div><div class=\"li\">وبعدها ظهر طريقين: <span class=\"en\">Chaucer</span> والقافية في لندن (درس 9-10)، والجناس في الشمال والغرب (درس 11-12).</div>", "n": 4, "i": 45, "a": "history-12-035", "x": "82465855"}, {"t": "learn", "h": "<div class=\"li\">وفي نفس الوقت، كان فيه شعر شعبي شفهي، بلا مؤلف، عايش في الذاكرة (الـ <span class=\"en\">ballads</span>).</div><div class=\"li\">وفي اسكتلندا، كانت بتتبني لغة أدبية تانية خالص (الـ <span class=\"en\">Makars</span>).</div>", "n": 2, "i": 46, "a": "history-12-036", "x": "c4d3cff6"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> والقاعدة الكبيرة اللي تاخدها للمستوى التاني:</div><div class=\"li\">تاريخ الأدب مش سلم واحد. في أي لحظة، فيه أكتر من طريق شغال في نفس الوقت، واللي بيكسب في المدرسة النهاردة ممكن يكون خسر في زمنه.</div><div class=\"li\">والنهضة الجاية (المستوى التاني) هتقلب كل ده: طباعة، وإصلاح ديني، وإعادة اكتشاف الكلاسيكيات، وسونيتات، ومسرح. يعني هتخلي الشعر الإنجليزي حاجة تانية خالص.</div>", "n": 2, "i": 47, "a": "history-12-037", "x": "32bc3037"}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">🎓</span></span> الدرس الجاي: المستوى التاني، النهضة <span class=\"em\"><span class=\"em\">🖨️</span></span> الطباعة والإصلاح وإعادة اكتشاف الكلاسيك، وإزاي <span class=\"en\">Wyatt</span> و<span class=\"en\">Surrey</span> دخلوا السونيت لإنجلترا.", "extra": "", "i": 48}];</script>
