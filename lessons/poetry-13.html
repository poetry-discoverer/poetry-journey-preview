<script>window.LESSON_ID="poetry-13";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">بنبدأ وحدة جديدة اسمها <span class=\"en\">figurative language<\/span> (اللغة المجازية): كلام معناه مش حرفي. النهاردة أول أداة: التشبيه.<\/div>", "n": 1, "i": 0, "a": "poetry-13-001", "x": "1310fc91"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: يعني إيه <span class=\"en\">figurative<\/span>؟ <span class=\"em\"><span class=\"em\">🤔<\/span><\/span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">أولاً الفرق بين الكلام الحرفي (<span class=\"en\">literal<\/span>) والمجازي (<span class=\"en\">figurative<\/span>):<\/div><div class=\"li\">حرفي: \"أحمد جري بسرعة.\" (ده اللي حصل فعلاً.)<\/div><div class=\"li\">مجازي: \"أحمد جري زي الصاروخ.\" (أحمد مش صاروخ، بس بنقارن عشان نوصل الإحساس.)<\/div><div class=\"u\">الشاعر بيحب المجاز لأنه بيخلي الكلام صورة وإحساس مش معلومة. تخيل بدل ما تقول \"هو خايف\"، تقول \"قلبه زي عصفور محبوس\". عرفت الإحساس أسرع.<\/div>", "n": 4, "i": 2, "a": "poetry-13-002", "x": "45d38bfd"}, {"t": "learn", "h": "<div class=\"u\">ومعظم لغتنا اليومية مجازية: \"قلبي وقع\"، \"جو تلج\"، \"دمه خفيف\". كلنا بنتكلم شعر من غير ما ننتبه.<\/div>", "n": 1, "i": 3, "a": "poetry-13-003", "x": "b77d1838"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: التشبيه — <span class=\"en\">simile<\/span> <span class=\"em\"><span class=\"em\">✨<\/span><\/span>", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">simile<\/span> (تشبيه) = مقارنة مباشرة بين حاجتين مختلفتين، بكلمة صريحة زي <span class=\"en\">like<\/span> أو <span class=\"en\">as<\/span> (زي / مثل).<\/div><div class=\"u\">الصيغة: حاجة <span class=\"en\">A<\/span> زي حاجة <span class=\"en\">B.<\/span><\/div>", "n": 2, "i": 5, "a": "poetry-13-004", "x": "9f08072f"}, {"t": "learn", "h": "<div class=\"lead\">أمثلة بسيطة (من تأليفي للتوضيح):<\/div><div class=\"li\">\"<span class=\"en\">He is as strong as a lion.<\/span>\" (قوي زي الأسد)<\/div><div class=\"li\">\"<span class=\"en\">Her smile was like sunshine.<\/span>\" (ابتسامتها زي الشمس)<\/div><div class=\"li\">\"<span class=\"en\">The night was as quiet as a library.<\/span>\" (الليل هادي زي المكتبة)<\/div>", "n": 3, "i": 6, "a": "poetry-13-005", "x": "5675ea8f"}, {"t": "mc", "h": "", "q": "إيه معنى الجملة دي بالعربي؟<div class=\"en bigen\">Her smile was like sunshine<\/div>", "opts": ["قوي زي الأسد", "ابتسامتها زي الشمس", "الليل هادي زي المكتبة"], "ans": 1, "why": "Her smile was like sunshine = ابتسامتها زي الشمس", "n": 1, "i": 7, "ex": ["غلط: هذه ترجمة جملة أخرى (<span class=\"en\">strong as a lion<\/span>). جملتنا عن الابتسامة والشمس.", "صح: <span class=\"en\">Her smile was like sunshine<\/span> = ابتسامتها كانت مثل أشعة الشمس. <span class=\"en\">smile<\/span> = ابتسامة، <span class=\"en\">like<\/span> = مثل.", "غلط: هذه ترجمة جملة أخرى (<span class=\"en\">The night is quiet like a library<\/span>). جملتنا عن الابتسامة."]}, {"t": "learn", "h": "<div class=\"u\">لاحظ إن الأسد والإنسان حاجتين مختلفتين، بس بنقارن في نقطة واحدة: القوة. دي نقطة الشبه.<\/div><div class=\"u\">قاعدة: اللي بنقارنه (الإنسان) اسمه <span class=\"en\">tenor<\/span> (المشبّه)، واللي بنقارن بيه (الأسد) اسمه <span class=\"en\">vehicle<\/span> (المشبّه به). نفس الفكرة اللي عندنا في البلاغة العربية: المشبّه والمشبّه به وأداة التشبيه ووجه الشبه.<\/div>", "n": 2, "i": 8, "a": "poetry-13-006", "x": "0fcd0327"}, {"t": "learn", "h": "<div class=\"u\">ويعني إيه \"وجه الشبه\"؟ يعني القوة في مثالنا. أحياناً الشاعر بيقوله، وأحياناً بيسيبه لخيالك.<\/div>", "n": 1, "i": 9, "a": "poetry-13-007", "x": "a0d7ae5f"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: أمثلة من الشعر الكبير <span class=\"em\"><span class=\"em\">📜<\/span><\/span>", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">١- <span class=\"en\">Robert Burns<\/span> (شاعر اسكتلندي): \"<span class=\"en\">O My Luve's like a red,<\/span> <span class=\"en\">red rose<\/span>\"<\/div><div class=\"u\">(حبي زي وردة حمرا، حمرا.) المشبّه: حبيبته، المشبّه به: وردة. الأداة: <span class=\"en\">like.<\/span> وجه الشبه: جمال وطزاجة وحيوية. وتكرار \"<span class=\"en\">red,<\/span> <span class=\"en\">red<\/span>\" بيدي مزيكا وتأكيد.<\/div>", "n": 2, "i": 11, "a": "poetry-13-008", "x": "8a9569af"}, {"t": "learn", "h": "<div class=\"lead\">٢- <span class=\"en\">Shakespeare<\/span>، من <span class=\"en\">The Merchant of Venice<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">How far that little candle throws his beams<\/span>! / <span class=\"en\">So shines a good deed in a naughty world.<\/span>\"<\/div><div class=\"u\">(بصّ إزاي الشمعة الصغيرة بتنور بعيد! كده العمل الطيب بينور في عالم شرير.)<\/div>", "n": 2, "i": 12, "a": "poetry-13-009", "x": "2317810c"}, {"t": "learn", "h": "<div class=\"u\">هنا شكسبير بيقارن عمل صغير طيب بشمعة صغيرة. الأداة \"<span class=\"en\">so<\/span>\" بتعمل نفس شغل <span class=\"en\">like.<\/span> الشمعة صغيرة بس بتنور ضلمة كبيرة. وجه الشبه: حاجة صغيرة بتفرق في عالم مظلم.<\/div>", "n": 1, "i": 13, "a": "poetry-13-010", "x": "bc229b06"}, {"t": "learn", "h": "<div class=\"u\">٣- <span class=\"en\">John Milton<\/span>، من <span class=\"en\">Paradise Lost<\/span> (قصيدة طويلة جداً هنتكلم عنها بعدين): تشبيه طويل بيشبه الشيطان بذئب جعان داخل زريبة غنم: \"<span class=\"en\">As when a prowling Wolf.<\/span>.. <span class=\"en\">Leaps o'er the fence with ease into the Fold<\/span>: ... <span class=\"en\">So clomb this first grand Thief into God's Fold<\/span>\". ده اسمه <span class=\"en\">epic simile<\/span> (أو <span class=\"en\">Homeric simile<\/span>): تشبيه ممتد على أسطر كتيرة، بيحكي مشهد كامل، مش كلمة.<\/div>", "n": 1, "i": 14, "a": "poetry-13-011", "x": "0b86905b"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: ليه <span class=\"en\">simile<\/span> أقوى من الوصف العادي؟ وإزاي أحلله؟ <span class=\"em\"><span class=\"em\">🔍<\/span><\/span>", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"lead\">٣ أسباب:<\/div><div class=\"u\">١- بيحول فكرة مجردة لصورة (الحب = وردة).<\/div><div class=\"u\">٢- بيخلي القارئ يشوف ويحس (الشمعة).<\/div><div class=\"u\">٣- ممكن يكون طويل ومفصل (زي <span class=\"en\">Milton<\/span>)، وده مزية للتشبيه عن الاستعارة (اللي هنخدها الدرس الجاي): لأن \"<span class=\"en\">like<\/span>\" واضحة فممكن نمدها ونفضل مفهومين.<\/div>", "n": 3, "i": 16, "a": "poetry-13-012", "x": "2feacc9c"}, {"t": "learn", "h": "<div class=\"lead\">خطوات تحليل أي تشبيه (٤ أسئلة):<\/div><div class=\"u\">١- إيه المشبّه (<span class=\"en\">tenor<\/span>)؟<\/div><div class=\"u\">٢- إيه المشبّه به (<span class=\"en\">vehicle<\/span>)؟<\/div><div class=\"u\">٣- إيه وجه الشبه؟<\/div><div class=\"u\">٤- إيه الإحساس اللي بيضيفه؟ ولو التشبيه تقليدي ومستهلك (<span class=\"en\">clich<\/span>é) زي \"أبيض زي الثلج\"، حاول تفكر في بديل أجدد.<\/div>", "n": 4, "i": 17, "a": "poetry-13-013", "x": "0f704b11"}, {"t": "learn", "h": "<div class=\"u\">ملحوظة علمية: حتى الدارسين مختلفين: مدرسة بتقول التشبيه والاستعارة ضدين، ومدرسة بتقول التشبيه نوع من الاستعارة. إحنا هنمشي إنهم شكلين قريبين: التشبيه صريح (فيه <span class=\"en\">like/as<\/span>) والاستعارة ضمنية.<\/div>", "n": 1, "i": 18, "a": "poetry-13-014", "x": "5de5a431"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅<\/span><\/span>", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">١- <span class=\"en\">figurative<\/span> = معنى مش حرفي، بيقارن عشان يوصل إحساس.<\/div><div class=\"u\">٢- <span class=\"en\">simile<\/span> = مقارنة صريحة بـ <span class=\"en\">like<\/span> / <span class=\"en\">as.<\/span><\/div><div class=\"u\">٣- المشبّه = <span class=\"en\">tenor<\/span>، المشبّه به = <span class=\"en\">vehicle<\/span>، ووجه الشبه = نقطة التشابه.<\/div><div class=\"u\">٤- <span class=\"en\">epic simile<\/span> = تشبيه ممتد (<span class=\"en\">Milton<\/span>).<\/div><div class=\"u\">٥- خطوات التحليل: <span class=\"en\">tenor,<\/span> <span class=\"en\">vehicle,<\/span> وجه الشبه، الإحساس.<\/div>", "n": 5, "i": 20, "a": "poetry-13-015", "x": "35104e5c"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️<\/span><\/span> تمرين:<\/div><div class=\"u\">١- طلّع الـ <span class=\"en\">tenor<\/span> والـ <span class=\"en\">vehicle<\/span> ووجه الشبه من: \"<span class=\"en\">O My Luve's like a red,<\/span> <span class=\"en\">red rose<\/span>\".<\/div><div class=\"u\">٢- حلل تشبيه شكسبير \"<span class=\"en\">So shines a good deed in a naughty world<\/span>\" بالأربع خطوات.<\/div><div class=\"u\">٣- اكتب ٣ تشبيهات من تأليفك عن حاجة من يومك (الكورة، الأكل، الدراسة)، تشبيه واحد فيه <span class=\"en\">like<\/span> وواحد فيه <span class=\"en\">as<\/span> وواحد جديد مش مستهلك.<\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.<\/div>", "n": 4, "i": 21, "a": "poetry-13-016", "x": "de7eb4b9"}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">epic simile<\/span> ؟", "opts": ["تشبيه ممتد (Milton)", "مقارنة صريحة بـ like / as", "معنى مش حرفي، بيقارن عشان يوصل إحساس"], "ans": 0, "why": "epic simile = تشبيه ممتد (Milton)", "n": 1, "i": 22, "ex": ["صح: <span class=\"en\">epic simile<\/span> تشبيه طويل يمتد عدة سطور، ويشتهر عند <span class=\"en\">Homer<\/span> و<span class=\"en\">Milton<\/span>.", "غلط: هذا <span class=\"en\">simile<\/span> العادي، أما <span class=\"en\">epic simile<\/span> فهو الممتد.", "غلط: هذا معنى <span class=\"en\">figurative language<\/span> عموماً."]}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">figurative<\/span> ؟", "opts": ["تشبيه ممتد (Milton)", "مقارنة صريحة بـ like / as", "معنى مش حرفي، بيقارن عشان يوصل إحساس"], "ans": 2, "why": "figurative = معنى مش حرفي، بيقارن عشان يوصل إحساس", "n": 1, "i": 23, "ex": ["غلط: هذا <span class=\"en\">epic simile<\/span>، وهو نوع واحد من المجاز.", "غلط: هذا <span class=\"en\">simile<\/span>، وهو أيضاً نوع من المجاز، لكن <span class=\"en\">figurative<\/span> أعم منه.", "صح: <span class=\"en\">figurative<\/span> يعني غير حرفي: الكلمات تقصد معنى أبعد من ظاهرها لتوصل إحساساً."]}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">simile<\/span> ؟", "opts": ["تشبيه ممتد (Milton)", "معنى مش حرفي، بيقارن عشان يوصل إحساس", "مقارنة صريحة بـ like / as"], "ans": 2, "why": "simile = مقارنة صريحة بـ like / as", "n": 1, "i": 24, "ex": ["غلط: هذا <span class=\"en\">epic simile<\/span>، وهو التشبيه الطويل.", "غلط: هذا <span class=\"en\">figurative language<\/span>، والتشبيه نوع واحد منه.", "صح: <span class=\"en\">simile<\/span> مقارنة صريحة تستخدم <span class=\"en\">like<\/span> أو <span class=\"en\">as<\/span>، مثل: <span class=\"en\">brave as a lion<\/span>."]}, {"t": "recall", "h": "", "q": "إيه الكلمات اللي بتدل على التشبيه في الإنجليزي؟", "a": "<span class=\"en\">like<\/span> و <span class=\"en\">as<\/span> (وفي مثال شكسبير: <span class=\"en\">so)<\/span>.", "n": 1, "i": 25}, {"t": "recall", "h": "", "q": "في \"<span class=\"en\">He is as strong as a lion<\/span>\"، مين الـ <span class=\"en\">tenor<\/span> ومين الـ <span class=\"en\">vehicle<\/span>؟", "a": "<span class=\"en\">tenor<\/span> = <span class=\"en\">He<\/span> (الراجل)، <span class=\"en\">vehicle<\/span> = <span class=\"en\">a lion<\/span> (الأسد). وجه الشبه: القوة.", "n": 1, "i": 26}, {"t": "recall", "h": "", "q": "إيه معنى <span class=\"en\">epic simile<\/span>؟", "a": "تشبيه طويل ممتد على أسطر كتير، بيحكي مشهد كامل (زي تشبيه <span class=\"en\">Milton<\/span> للذئب).", "n": 1, "i": 27}, {"t": "tf", "h": "", "q": "صح ولا غلط: \"<span class=\"en\">Time is a river<\/span>\" تشبيه (<span class=\"en\">simile)<\/span>.", "ans": false, "why": "غلط. دي استعارة (<span class=\"en\">metaphor)<\/span> لأن مفيش <span class=\"en\">like<\/span> أو <span class=\"en\">as.<\/span> التشبيه هيبقى \"<span class=\"en\">Time is like a river<\/span>\".", "n": 1, "i": 28, "ex": ["الجملة غلط. دي استعارة (<span class=\"en\">metaphor<\/span>) لأن مفيش <span class=\"en\">like<\/span> أو <span class=\"en\">as<\/span>. التشبيه هيبقى \"<span class=\"en\">Time is like a river<\/span>\".", "صح، الجملة غلط. دي استعارة (<span class=\"en\">metaphor<\/span>) لأن مفيش <span class=\"en\">like<\/span> أو <span class=\"en\">as<\/span>. التشبيه هيبقى \"<span class=\"en\">Time is like a river<\/span>\"."]}, {"t": "write", "h": "", "q": "(الفكرة) اشرح الفرق بين الكلام الحرفي والمجازي، وبين إن التشبيه شغلة بتزود إيه للشعر. هات مثال حرفي ومثال مجازي من عندك.", "key": "poetry-13:5", "n": 1, "i": 29}, {"t": "write", "h": "", "q": "(تحليل) حلل تشبيه <span class=\"en\">Burns<\/span> \"<span class=\"en\">O My Luve's like a red,<\/span> <span class=\"en\">red rose<\/span>\" بالخطوات الأربع: <span class=\"en\">tenor<\/span>، <span class=\"en\">vehicle<\/span>، وجه الشبه، الإحساس.", "key": "poetry-13:6", "n": 1, "i": 30}, {"t": "write", "h": "", "q": "(إبداع) اكتب ٣ تشبيهات من تأليفك عن حاجة من يومك (واحد بـ <span class=\"en\">like<\/span> وواحد بـ <span class=\"en\">as<\/span> وواحد جديد مش مستهلك)، وحلل واحد منهم بالأربع خطوات.", "key": "poetry-13:7", "n": 1, "i": 31}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس الجاي (الدرس ١٤): الاستعارة (<span class=\"en\">metaphor<\/span>): التشبيه من غير <span class=\"en\">like.<\/span>", "extra": "<span class=\"em\"><span class=\"em\">🔗<\/span><\/span> روابط للتوسع (اتأكدت منها):<ul><li><span class=\"en\">Simile<\/span> على <span class=\"en\">Wikipedia<\/span>: <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Simile\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Simile<\/a><\/li><\/ul>", "i": 32}];</script>
