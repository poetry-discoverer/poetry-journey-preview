<script>window.LESSON_ID="poetry-13";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">بنبدأ وحدة جديدة اسمها <span class=\"en\">figurative language</span> (اللغة المجازية): كلام معناه مش حرفي. النهاردة أول أداة: التشبيه.</div>", "n": 1, "i": 0, "a": "poetry-13-001", "x": "1310fc91"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: يعني إيه <span class=\"en\">figurative</span>؟ <span class=\"em\"><span class=\"em\">🤔</span></span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">أولاً الفرق بين الكلام الحرفي (<span class=\"en\">literal</span>) والمجازي (<span class=\"en\">figurative</span>):</div><div class=\"li\">حرفي: \"أحمد جري بسرعة.\" (ده اللي حصل فعلاً.)</div><div class=\"li\">مجازي: \"أحمد جري زي الصاروخ.\" (أحمد مش صاروخ، بس بنقارن عشان نوصل الإحساس.)</div><div class=\"u\">الشاعر بيحب المجاز لأنه بيخلي الكلام صورة وإحساس مش معلومة. تخيل بدل ما تقول \"هو خايف\"، تقول \"قلبه زي عصفور محبوس\". عرفت الإحساس أسرع.</div>", "n": 4, "i": 2, "a": "poetry-13-002", "x": "45d38bfd"}, {"t": "mc", "h": "", "q": "أنهي جملة مجازية (<span class=\"en\">figurative</span>)؟", "nq": 1, "opts": ["أحمد جري زي الصاروخ", "أحمد جري بسرعة", "أحمد جري في الشارع"], "ans": 0, "why": "أحمد جري زي الصاروخ", "ex": ["صح: أحمد مش صاروخ، بنقارن عشان نوصل الإحساس.", "غلط: دي معلومة حرفية.", "غلط: دي معلومة حرفية."], "i": 3}, {"t": "learn", "h": "<div class=\"u\">ومعظم لغتنا اليومية مجازية: \"قلبي وقع\"، \"جو تلج\"، \"دمه خفيف\". كلنا بنتكلم شعر من غير ما ننتبه.</div>", "n": 1, "i": 4, "a": "poetry-13-003", "x": "b77d1838"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: التشبيه — <span class=\"en\">simile</span> <span class=\"em\"><span class=\"em\">✨</span></span>", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">simile</span> (تشبيه) = مقارنة مباشرة بين حاجتين مختلفتين، بكلمة صريحة زي <span class=\"en\">like</span> أو <span class=\"en\">as</span> (زي / مثل).</div><div class=\"u\">الصيغة: حاجة <span class=\"en\">A</span> زي حاجة <span class=\"en\">B.</span></div>", "n": 2, "i": 6, "a": "poetry-13-004", "x": "9f08072f"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">simile</span> بيستخدم كلمة...", "nq": 1, "opts": ["<span class=\"en\">like</span> أو <span class=\"en\">as</span>", "<span class=\"en\">is</span> أو <span class=\"en\">are</span> بس", "<span class=\"en\">and</span> أو <span class=\"en\">or</span>"], "ans": 0, "why": "<span class=\"en\">like</span> أو <span class=\"en\">as</span>", "ex": ["صح: <span class=\"en\">simile</span> مقارنة صريحة بكلمة زي <span class=\"en\">like</span> أو <span class=\"en\">as</span>.", "غلط: الاستعارة هي اللي بتقول إن حاجة هي حاجة.", "غلط: دي كلمات ربط عادية."], "i": 7}, {"t": "learn", "h": "<div class=\"lead\">أمثلة بسيطة (من تأليفي للتوضيح):</div><div class=\"li\">\"<span class=\"en\">He is as strong as a lion.</span>\" (قوي زي الأسد)</div><div class=\"li\">\"<span class=\"en\">Her smile was like sunshine.</span>\" (ابتسامتها زي الشمس)</div><div class=\"li\">\"<span class=\"en\">The night was as quiet as a library.</span>\" (الليل هادي زي المكتبة)</div>", "n": 3, "i": 8, "a": "poetry-13-005", "x": "5675ea8f"}, {"t": "mc", "h": "", "q": "إيه معنى الجملة دي بالعربي؟<div class=\"en bigen\">Her smile was like sunshine</div>", "opts": ["قوي زي الأسد", "ابتسامتها زي الشمس", "الليل هادي زي المكتبة"], "ans": 1, "why": "Her smile was like sunshine = ابتسامتها زي الشمس", "n": 1, "i": 9, "ex": ["غلط: هذه ترجمة جملة أخرى (<span class=\"en\">strong as a lion</span>). جملتنا عن الابتسامة والشمس.", "صح: <span class=\"en\">Her smile was like sunshine</span> = ابتسامتها كانت مثل أشعة الشمس. <span class=\"en\">smile</span> = ابتسامة، <span class=\"en\">like</span> = مثل.", "غلط: هذه ترجمة جملة أخرى (<span class=\"en\">The night is quiet like a library</span>). جملتنا عن الابتسامة."]}, {"t": "learn", "h": "<div class=\"u\">لاحظ إن الأسد والإنسان حاجتين مختلفتين، بس بنقارن في نقطة واحدة: القوة. دي نقطة الشبه.</div><div class=\"u\">قاعدة: اللي بنقارنه (الإنسان) اسمه <span class=\"en\">tenor</span> (المشبّه)، واللي بنقارن بيه (الأسد) اسمه <span class=\"en\">vehicle</span> (المشبّه به). نفس الفكرة اللي عندنا في البلاغة العربية: المشبّه والمشبّه به وأداة التشبيه ووجه الشبه.</div>", "n": 2, "i": 10, "a": "poetry-13-006", "x": "0fcd0327"}, {"t": "learn", "h": "<div class=\"u\">ويعني إيه \"وجه الشبه\"؟ يعني القوة في مثالنا. أحياناً الشاعر بيقوله، وأحياناً بيسيبه لخيالك.</div>", "n": 1, "i": 11, "a": "poetry-13-007", "x": "a0d7ae5f"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">He is as strong as a lion</span>، إيه الـ <span class=\"en\">vehicle</span>؟", "nq": 1, "opts": ["<span class=\"en\">the lion</span>", "<span class=\"en\">He</span>", "<span class=\"en\">strong</span>"], "ans": 0, "why": "<span class=\"en\">the lion</span>", "ex": ["صح: اللي بنقارن بيه (المشبّه به) هو الأسد.", "غلط: ده الـ <span class=\"en\">tenor</span> (المشبّه).", "غلط: دي وجه الشبه."], "i": 12}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: أمثلة من الشعر الكبير <span class=\"em\"><span class=\"em\">📜</span></span>", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">١- <span class=\"en\">Robert Burns</span> (شاعر اسكتلندي): \"<span class=\"en\">O My Luve's like a red,</span> <span class=\"en\">red rose</span>\"</div><div class=\"u\">(حبي زي وردة حمرا، حمرا.) المشبّه: حبيبته، المشبّه به: وردة. الأداة: <span class=\"en\">like.</span> وجه الشبه: جمال وطزاجة وحيوية. وتكرار \"<span class=\"en\">red,</span> <span class=\"en\">red</span>\" بيدي مزيكا وتأكيد.</div>", "n": 2, "i": 14, "a": "poetry-13-008", "x": "8a9569af"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">O My Luve's like a red, red rose</span> لـ <span class=\"en\">Robert Burns</span>، إيه الـ <span class=\"en\">tenor</span>؟", "nq": 1, "opts": ["حبيبته", "الوردة", "كلمة <span class=\"en\">like</span>"], "ans": 0, "why": "حبيبته", "ex": ["صح: المشبّه هو حبيبته.", "غلط: الوردة هي المشبّه به (<span class=\"en\">vehicle</span>).", "غلط: <span class=\"en\">like</span> هي أداة التشبيه."], "i": 15}, {"t": "learn", "h": "<div class=\"lead\">٢- <span class=\"en\">Shakespeare</span>، من <span class=\"en\">The Merchant of Venice</span>:</div><div class=\"u\">\"<span class=\"en\">How far that little candle throws his beams</span>! / <span class=\"en\">So shines a good deed in a naughty world.</span>\"</div><div class=\"u\">(بصّ إزاي الشمعة الصغيرة بتنور بعيد! كده العمل الطيب بينور في عالم شرير.)</div>", "n": 2, "i": 16, "a": "poetry-13-009", "x": "2317810c"}, {"t": "learn", "h": "<div class=\"u\">هنا شكسبير بيقارن عمل صغير طيب بشمعة صغيرة. الأداة \"<span class=\"en\">so</span>\" بتعمل نفس شغل <span class=\"en\">like.</span> الشمعة صغيرة بس بتنور ضلمة كبيرة. وجه الشبه: حاجة صغيرة بتفرق في عالم مظلم.</div>", "n": 1, "i": 17, "a": "poetry-13-010", "x": "bc229b06"}, {"t": "mc", "h": "", "q": "في تشبيه شكسبير (<span class=\"en\">So shines a good deed in a naughty world</span>)، العمل الطيب بيتقارن بإيه؟", "nq": 1, "opts": ["شمعة صغيرة بتنور", "شمس كبيرة", "نهر جاري"], "ans": 0, "why": "شمعة صغيرة بتنور", "ex": ["صح: الشمعة الصغيرة بتنور في الضلمة، زي العمل الطيب في عالم شرير.", "غلط: شكسبير قال شمعة صغيرة.", "غلط: النهر مش في المثال."], "i": 18}, {"t": "learn", "h": "<div class=\"u\">٣- <span class=\"en\">John Milton</span>، من <span class=\"en\">Paradise Lost</span> (قصيدة طويلة جداً هنتكلم عنها بعدين): تشبيه طويل بيشبه الشيطان بذئب جعان داخل زريبة غنم: \"<span class=\"en\">As when a prowling Wolf.</span>.. <span class=\"en\">Leaps o'er the fence with ease into the Fold</span>: ... <span class=\"en\">So clomb this first grand Thief into God's Fold</span>\". ده اسمه <span class=\"en\">epic simile</span> (أو <span class=\"en\">Homeric simile</span>): تشبيه ممتد على أسطر كتيرة، بيحكي مشهد كامل، مش كلمة.</div>", "n": 1, "i": 19, "a": "poetry-13-011", "x": "0b86905b"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">epic simile</span> عند <span class=\"en\">Milton</span> في <span class=\"en\">Paradise Lost</span> بيقارن الشيطان بـ...", "nq": 1, "opts": ["ذئب جعان داخل زريبة غنم", "أسد في الغابة", "حصان جاري"], "ans": 0, "why": "ذئب جعان داخل زريبة غنم", "ex": ["صح: <span class=\"en\">As when a prowling Wolf</span>، تشبيه ممتد على أسطر كتيرة.", "غلط: التشبيه الملحمي هنا بذئب.", "غلط: مفيش حصان في المثال."], "i": 20}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: ليه <span class=\"en\">simile</span> أقوى من الوصف العادي؟ وإزاي أحلله؟ <span class=\"em\"><span class=\"em\">🔍</span></span>", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"lead\">٣ أسباب:</div><div class=\"u\">١- بيحول فكرة مجردة لصورة (الحب = وردة).</div><div class=\"u\">٢- بيخلي القارئ يشوف ويحس (الشمعة).</div><div class=\"u\">٣- ممكن يكون طويل ومفصل (زي <span class=\"en\">Milton</span>)، وده مزية للتشبيه عن الاستعارة (اللي هنخدها الدرس الجاي): لأن \"<span class=\"en\">like</span>\" واضحة فممكن نمدها ونفضل مفهومين.</div>", "n": 3, "i": 22, "a": "poetry-13-012", "x": "2feacc9c"}, {"t": "learn", "h": "<div class=\"lead\">خطوات تحليل أي تشبيه (٤ أسئلة):</div><div class=\"u\">١- إيه المشبّه (<span class=\"en\">tenor</span>)؟</div><div class=\"u\">٢- إيه المشبّه به (<span class=\"en\">vehicle</span>)؟</div><div class=\"u\">٣- إيه وجه الشبه؟</div><div class=\"u\">٤- إيه الإحساس اللي بيضيفه؟ ولو التشبيه تقليدي ومستهلك (<span class=\"en\">clich</span>é) زي \"أبيض زي الثلج\"، حاول تفكر في بديل أجدد.</div>", "n": 4, "i": 23, "a": "poetry-13-013", "x": "0f704b11"}, {"t": "learn", "h": "<div class=\"u\">ملحوظة علمية: حتى الدارسين مختلفين: مدرسة بتقول التشبيه والاستعارة ضدين، ومدرسة بتقول التشبيه نوع من الاستعارة. إحنا هنمشي إنهم شكلين قريبين: التشبيه صريح (فيه <span class=\"en\">like/as</span>) والاستعارة ضمنية.</div>", "n": 1, "i": 24, "a": "poetry-13-014", "x": "5de5a431"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅</span></span>", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">١- <span class=\"en\">figurative</span> = معنى مش حرفي، بيقارن عشان يوصل إحساس.</div><div class=\"u\">٢- <span class=\"en\">simile</span> = مقارنة صريحة بـ <span class=\"en\">like</span> / <span class=\"en\">as.</span></div><div class=\"u\">٣- المشبّه = <span class=\"en\">tenor</span>، المشبّه به = <span class=\"en\">vehicle</span>، ووجه الشبه = نقطة التشابه.</div><div class=\"u\">٤- <span class=\"en\">epic simile</span> = تشبيه ممتد (<span class=\"en\">Milton</span>).</div><div class=\"u\">٥- خطوات التحليل: <span class=\"en\">tenor,</span> <span class=\"en\">vehicle,</span> وجه الشبه، الإحساس.</div>", "n": 5, "i": 26, "a": "poetry-13-015", "x": "35104e5c"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️</span></span> تمرين:</div><div class=\"u\">١- طلّع الـ <span class=\"en\">tenor</span> والـ <span class=\"en\">vehicle</span> ووجه الشبه من: \"<span class=\"en\">O My Luve's like a red,</span> <span class=\"en\">red rose</span>\".</div><div class=\"u\">٢- حلل تشبيه شكسبير \"<span class=\"en\">So shines a good deed in a naughty world</span>\" بالأربع خطوات.</div><div class=\"u\">٣- اكتب ٣ تشبيهات من تأليفك عن حاجة من يومك (الكورة، الأكل، الدراسة)، تشبيه واحد فيه <span class=\"en\">like</span> وواحد فيه <span class=\"en\">as</span> وواحد جديد مش مستهلك.</div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.</div>", "n": 4, "i": 27, "a": "poetry-13-016", "x": "de7eb4b9"}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en bigen\">epic simile</span> ؟", "opts": ["تشبيه ممتد (Milton)", "مقارنة صريحة بـ like / as", "معنى مش حرفي، بيقارن عشان يوصل إحساس"], "ans": 0, "why": "epic simile = تشبيه ممتد (Milton)", "n": 1, "i": 28, "ex": ["صح: <span class=\"en\">epic simile</span> تشبيه طويل يمتد عدة سطور، ويشتهر عند <span class=\"en\">Homer</span> و<span class=\"en\">Milton</span>.", "غلط: هذا <span class=\"en\">simile</span> العادي، أما <span class=\"en\">epic simile</span> فهو الممتد.", "غ n</span> للذئب).", "n": 1, "i": 33}, {"t": "tf", "h": "", "q": "صح ولا غلط: \"<span class=\"en\">Time is a river</span>\" تشبيه (<span class=\"en\">simile)</span>.", "ans": false, "why": "غلط. دي استعارة (<span class=\"en\">metaphor)</span> لأن مفيش <span class=\"en\">like</span> أو <span class=\"en\">as.</span> التشبيه هيبقى \"<span class=\"en\">Time is like a river</span>\".", "n": 1, "i": 34, "ex": ["الجملة غلط. دي استعارة (<span class=\"en\">metaphor</span>) لأن مفيش <span class=\"en\">like</span> أو <span class=\"en\">as</span>. التشبيه هيبقى \"<span class=\"en\">Time is like a river</span>\".", "صح، الجملة غلط. دي استعارة (<span class=\"en\">metaphor</span>) لأن مفيش <span class=\"en\">like</span> أو <span class=\"en\">as</span>. التشبيه هيبقى \"<span class=\"en\">Time is like a river</span>\"."]}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳</span></span> الدرس الجاي (الدرس ١٤): الاستعارة (<span class=\"en\">metaphor</span>): التشبيه من غير <span class=\"en\">like.</span>", "extra": "", "i": 35}];</script>
