<h1>تحليل ٨: Stopping by Woods on a Snowy Evening لفروست — الواجب والراحة</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">تحليل ٨ من ١٠</span><span class="tag"><span class="em">🖋️</span> تحليل القصائد المهمة</span></div>

<script>window.LESSON_ID="analysis-08";window.STEPS=[{"t":"learn","h":"<div class=\"u\">الدرس اللي فات: Helen لـ H.D. — جمال بيكرهه بلد كامل. الدرس ده قصيدة أمريكية هادية جدًا في ظاهرها، وكل أسئلتها تحت السطح.</div><div class=\"u\">القصيدة: Stopping by Woods on a Snowy Evening لروبرت فروست، أربع مقاطع، كل واحد أربع سطور.</div>","n":2,"i":0,"a":"analysis-08-001","x":"5fd637f5"},{"t":"section","h":"فروست والسياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">روبرت فروست <span class=\"en\">(Robert Frost)</span>، 1874-1963، أمريكي من نيو إنجلاند. لغته قريبة من الكلام العادي، لكنه بيقول إن الصوت نفسه لازم يحمل المعنى قبل الكلمات.</div>","n":1,"i":2,"a":"analysis-08-002","x":"b856ac00"},{"t":"learn","h":"<div class=\"u\">القصيدة اتكتبت سنة 1922 واتنشرت في مجموعة <span class=\"en\">New Hampshire</span> سنة 1923. فروست قال إنه كتبها في وقت قصير جدًا بعد ليلة شغل طويلة، وكان بيعتبرها من أحسن حاجاته.</div>","n":1,"i":3,"a":"analysis-08-003","x":"d1b1b7bd"},{"t":"learn","h":"<div class=\"u\">المشهد بسيط: راجل واقف بعربيته وحصانه جانب غابة بتتملى تلج، في أطول ليلة في السنة. مفيش حدث كبير — فيه وقفة بس.</div>","n":1,"i":4,"a":"analysis-08-004","x":"d753be48"},{"t":"learn","h":"<div class=\"u\">خد بالك من موقع الراجل: هو واقف على أرض حد تاني، ومش داخل. القصيدة كلها من بره الغابة — الملاحظة، والوقفة، والقرار، كله من الحدود.</div>","n":1,"i":5,"a":"analysis-08-005","x":"794385d1"},{"t":"section","h":"المقطع الأول (<span dir=\"ltr\">1-4</span>)","n":1,"i":6},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">Whose woods these are I think I know. / His house is in the village though; / He will not see me stopping here / To watch his woods fill up with snow.</span></div>","n":2,"i":7,"a":"analysis-08-006","x":"ab0ddfd6"},{"t":"learn","h":"<div class=\"u\">«أنا تقريبًا عارف الغابة دي بتاعة مين» — البداية بحديث داخلي، مش بوصف. الراجل بيتكلم مع نفسه، وده اللي بيدّي القصيدة نبرة الهمس.</div>","n":1,"i":8,"a":"analysis-08-007","x":"34d7e314"},{"t":"learn","h":"<div class=\"u\">«بيته في القرية» — يعني صاحب الغابة بعيد ومش شايفه. الوقفة دي شبه سر صغير: هو واقف في مكان مش مكانه، وبيتفرج.</div>","n":1,"i":9,"a":"analysis-08-008","x":"0d462916"},{"t":"learn","h":"<div class=\"u\">«الغابة بتتملى تلج» <span class=\"en\">(fill up with snow)</span>: صورة بطيئة بتدّي إحساس بالسكون. الملاحظة مش عن التلج، هي عن الوقوف نفسه.</div>","n":1,"i":10,"a":"analysis-08-009","x":"b0b18e9b"},{"t":"learn","h":"<div class=\"u\">«بتتملى تلج» حركة بطيئة جدًا — مش حدث، تراكم. والتلج بيمسح التفاصيل، فالمشهد بيبقى أنضف وأسكت كل ما الوقت يعدي.</div>","n":1,"i":11,"a":"analysis-08-010","x":"f899f072"},{"t":"section","h":"المقطع التاني (<span dir=\"ltr\">5-8</span>)","n":1,"i":12},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">5-8</span>:</div><div class=\"u\"><span class=\"en\">My little horse must think it queer / To stop without a farmhouse near / Between the woods and frozen lake / The darkest evening of the year.</span></div>","n":2,"i":13,"a":"analysis-08-011","x":"d659a909"},{"t":"learn","h":"<div class=\"u\">الحصان بقى هو اللي بيحكم على الموقف: «أكيد بيشوفه غريب». الحصان هنا عقل عملي، مش رومانسي — عنده معايير واضحة عن فين ينفع تقف.</div>","n":1,"i":14,"a":"analysis-08-012","x":"0e37bed8"},{"t":"learn","h":"<div class=\"u\">«بين الغابة والبحيرة المتجمدة» — المكان محصور بين حاجتين: غابة (داخل) وبحيرة متجمدة (برود). والاتنين ساكنين.</div>","n":1,"i":15,"a":"analysis-08-013","x":"3ed201ef"},{"t":"learn","h":"<div class=\"u\">«أظلم مساء في السنة» <span class=\"en\">(The darkest evening of the year)</span>: ده أطول ليلة في السنة، وقت الانقلاب الشتوي <span class=\"en\">(winter solstice)</span>. فروست نفسه قال إن القصيدة عن المساء ده.</div>","n":1,"i":16,"a":"analysis-08-014","x":"e0f66070"},{"t":"section","h":"المقطع التالت (<span dir=\"ltr\">9-12</span>)","n":1,"i":17},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">9-12</span>:</div><div class=\"u\"><span class=\"en\">He gives his harness bells a shake / To ask if there is some mistake. / The only other sound’s the sweep / Of easy wind and downy flake.</span></div>","n":2,"i":18,"a":"analysis-08-015","x":"577d16d3"},{"t":"learn","h":"<div class=\"u\">الحصان بيهز أجراس اللجام، والقافية نفسها بتعمل صوت الجرس. السؤال «فيه غلط؟» هو صوت الواقع اللي بيقطع التأمل.</div>","n":1,"i":19,"a":"analysis-08-016","x":"706d1de3"},{"t":"learn","h":"<div class=\"u\">«الصوت التاني الوحيد هو كسح الريح الهادية والندفة الناعمة» — صوت واحد بس، وده اللي بيخلي السكون مسموع. الريح «هادية» والتلج «ناعم»: مفيش عنف في المشهد.</div>","n":1,"i":20,"a":"analysis-08-017","x":"88aff8e2"},{"t":"section","h":"المقطع الرابع (<span dir=\"ltr\">13-16</span>)","n":1,"i":21},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">13-16</span>:</div><div class=\"u\"><span class=\"en\">The woods are lovely, dark and deep. / But I have promises to keep, / And miles to go before I sleep, / And miles to go before I sleep.</span></div>","n":2,"i":22,"a":"analysis-08-018","x":"749346e4"},{"t":"learn","h":"<div class=\"u\">«الغابة جميلة، غامقة وعميقة» <span class=\"en\">(lovely, dark and deep)</span>: الجمال والعمق في نفس الوصف. والعمق هنا مش وصف منظر بس، هو إغراء — حاجة بتسحب.</div>","n":1,"i":23,"a":"analysis-08-019","x":"177d4b93"},{"t":"learn","h":"<div class=\"u\">وكلمة <span class=\"en\">dark</span> هنا مش بمعنى مخيف بس: الغامق هو اللي بيشدي النظر، واللي مش باين كل حاجة. الغموض ده جزء من الإغراء.</div>","n":1,"i":24,"a":"analysis-08-020","x":"7c397847"},{"t":"learn","h":"<div class=\"u\">وبعدين كلمة <span class=\"en\">But</span>. الكلمة دي هي نقطة التحول <span class=\"en\">(turn)</span> في القصيدة: الجمال كان بيشد، والواجب رجّعه.</div>","n":1,"i":25,"a":"analysis-08-021","x":"77948c9b"},{"t":"learn","h":"<div class=\"u\">«عندي وعود لازم أحافظ عليها» <span class=\"en\">(promises to keep)</span> — مفيش تفاصيل عن الوعود دي. الغموض ده مقصود: أي قارئ بيحط وعوده هو مكانها.</div>","n":1,"i":26,"a":"analysis-08-022","x":"60514987"},{"t":"learn","h":"<div class=\"u\">و«ميل وأنا لسه نايم» — والنوم <span class=\"en\">(sleep)</span> هنا ليها معنيين: النوم العادي بعد المشوار، والنوم الكبير. القصيدة مش بتقول أي واحد، وسايبة الاتنين شغالين.</div>","n":1,"i":27,"a":"analysis-08-023","x":"244ee0ed"},{"t":"learn","h":"<div class=\"u\">وتكرار السطر الأخير <span class=\"en\">(repetition)</span>: نفس الجملة مرتين. المرة الأولى بتقفل الفكرة، والتانية بتقفل الحركة نفسها — كأن القصيدة وقفت زي الراجل.</div>","n":1,"i":28,"a":"analysis-08-024","x":"e2648fa0"},{"t":"section","h":"الشكل والأدوات","n":1,"i":29},{"t":"learn","h":"<div class=\"u\">الوزن: تفعيلة رباعية <span class=\"en\">(iambic tetrameter)</span> — أربع نبضات في السطر، إيقاعه قريب من المشي. القصيدة بتمشي زي الحصان.</div>","n":1,"i":30,"a":"analysis-08-025","x":"c0cea880"},{"t":"learn","h":"<div class=\"u\">القافية المتشابكة: كل مقطع بيقفل بسطر بيربطه بالمقطع اللي بعده <span class=\"en\">(aaba bbcb ccdc)</span>، والمقطع الأخير بيقفل على قافية واحدة <span class=\"en\">(dddd)</span>. الحركة دي بتوحي بالتقدم، والقفل الأخير بوقفها.</div>","n":1,"i":31,"a":"analysis-08-026","x":"38ab75d7"},{"t":"learn","h":"<div class=\"u\">والسطر التالت في كل مقطع هو اللي بيحمل القافية الجديدة للمقطع اللي بعده — يعني القصيدة بتسيب باب مفتوح ورا كل مقطع، لحد المقطع الأخير اللي بيقفل كل حاجة.</div>","n":1,"i":32,"a":"analysis-08-027","x":"d798f846"},{"t":"learn","h":"<div class=\"u\">الأصوات: الجناس الصوتي <span class=\"en\">(alliteration)</span> في «sound’s the sweep» و«downy flake»، ومحاكاة صوت <span class=\"en\">(onomatopoeia)</span> في <span class=\"en\">sweep</span>. الصوت هو نص القصيدة: صوت واحد في وسط سكون.</div>","n":1,"i":33,"a":"analysis-08-028","x":"2b163038"},{"t":"learn","h":"<div class=\"u\">ولاحظ اللغة: القصيدة كلها كلمات قصيرة من أصل إنجليزي، وأقرب حاجة لكلمة مجردة هي <span class=\"en\">promises</span>. البساطة دي مش صدفة، هي أسلوب فروست.</div>","n":1,"i":34,"a":"analysis-08-029","x":"26f1177b"},{"t":"section","h":"الموضوعات","n":1,"i":35},{"t":"learn","h":"<div class=\"u\">الواجب ضد الراحة: الغابة بتعرض سكون وراحة، والوعود بتطلب حركة. القصيدة مش بتحل الصراع، هي بتوقف عنده وبتكمل المشوار.</div>","n":1,"i":36,"a":"analysis-08-030","x":"5d3230ca"},{"t":"learn","h":"<div class=\"u\">الجمال كإغراء: الغابة «جميلة، غامقة وعميقة»، وبعض القراءات بتشوف إن الجمال هنا مش بريء — هو حاجة عايزة تخليك تسيب كل حاجة. والفاء <span class=\"en\">But</span> هي اللي بتحمي الراجل.</div>","n":1,"i":37,"a":"analysis-08-031","x":"5076d3ec"},{"t":"learn","h":"<div class=\"u\">العزلة: مفيش ناس في القصيدة غير الراجل والحصان، وصاحب الغابة غايب. العزلة هنا مريحة، وبرضه خطر — مفيش حد هيشوفه لو قعد.</div>","n":1,"i":38,"a":"analysis-08-032","x":"0456fdf6"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":39},{"t":"mc","h":"","q":"إيه نظام القافية في القصيدة؟","opts":["متشابك: السطر التالت بيفتح قافية المقطع اللي بعده، والمقطع الأخير بيقفل على قافية واحدة","قافية موحدة في كل القصيدة","شعر حر من غير قافية"],"ans":0,"why":"قافية متشابكة تنتهي بمقطع كله على قافية واحدة.","n":1,"i":40,"ex":["صح: النظام aaba bbcb ccdc dddd، وده اللي بيدّي إحساس بالتقدم وبعدين بالقفل.","غلط: القافية بتتغير من مقطع لمقطع، ومفيش قافية واحدة مسيطرة غير في الأخير.","غلط: القصيدة موزونة ومقفّاة بانتظام."]},{"t":"mc","h":"","q":"«The darkest evening of the year» بتشير لإيه؟","opts":["أطول ليلة في السنة (الانقلاب الشتوي)","ليلة عاصفة قوية","مساء في مدينة"],"ans":0,"why":"أطول ليلة في السنة.","n":1,"i":41,"ex":["صح: أظلم مساء = أطول ليلة، وقت الانقلاب الشتوي، وفروست ربط القصيدة بالمساء ده.","غلط: مفيش عاصفة؛ التلج ناعم والريح هادية.","غلط: المكان ريف — غابة وبحيرة وقرية."]},{"t":"mc","h":"","q":"تكرار السطر الأخير بيعمل إيه؟","opts":["بيضيف معنى تاني (المشوار الحقيقي والنوم الكبير) وبيوقف حركة القصيدة","بيملأ سطر ناقص","بيوضح إن الراجل نعسان بس"],"ans":0,"why":"بيفتح معنى مجازي ويقفل الحركة.","n":1,"i":42,"ex":["صح: التكرار بيفتح قراءة مجازية ويقفل الإيقاع في نفس الوقت.","غلط: مفيش سطر ناقص؛ القصيدة مكتملة الوزن.","غلط: النعاس موجود، لكن التكرار مقصود لمعنى أوسع."]},{"t":"mc","h":"","q":"دور الحصان في القصيدة إيه؟","opts":["بيمثل الصوت العملي اللي بيرجّع الراجل للواقع","بيمثل جمال الطبيعة","بيمثل صاحب الغابة"],"ans":0,"why":"الصوت العملي اللي بيرجّع الراجل للواقع.","n":1,"i":43,"ex":["صح: الحصان بيسأل «فيه غلط؟» وبيقطع التأمل، فهو صوت الواجب والمنطق.","غلط: جمال الطبيعة متصور في الغابة والتلج، مش الحصان.","غلط: صاحب الغابة إنسان غايب، والحصان بتاع الراجل."]},{"t":"tf","h":"","q":"القصيدة بتحكي حادثة درامية كبيرة.","ans":false,"why":"غلط: مفيش حدث؛ فيه وقفة قصيرة في مكان هادي. الدراما كلها داخلية.","n":1,"i":44,"ex":["غلط. القصيدة وقفة تأمل، مش حكاية حدث.","صح، الجملة غلط: مفيش صراع خارجي خالص."]},{"t":"tf","h":"","q":"ألفاظ القصيدة بسيطة، لكن معناها فيه غموض.","ans":true,"why":"صح: كلام عادي جدًا، لكن «promises» و«sleep» مفتوحين على أكتر من معنى.","n":1,"i":45,"ex":["صح، الجملة صح: البساطة في اللفظ والغموض في المعنى.","غلط. الغموض موجود في الكلمات المفتاحية."]},{"t":"recall","h":"","q":"اشرح إزاي شكل القافية بيربط مقاطع القصيدة.","a":"كل مقطع أربع سطور، وتلات سطور بتقفى مع بعض والسطر التالت بيقفى مع المقطع اللي بعده: aaba، بعدين bbcb، بعدين ccdc. يعني كل مقطع بيسيب قافية معلقة بتدخل معاه للمقطع الجاي، فالقصيدة بتحس إنها ماشية للأمام زي المشوار. وفي المقطع الأخير السلسلة بتتقفل: dddd، كل السطور على قافية واحدة. والقفل ده بيمنع الحركة، في الوقت اللي فيه تكرار للسطر الأخير — فالشكل نفسه بيعمل معنى التوقف بعد مشوار.","n":1,"i":46},{"t":"recall","h":"","q":"إيه اللي بيخلي القصيدة تتقرأ كقصيدة عن الموت؟","a":"تلات حاجات. أولًا «The darkest evening of the year»: أطول ليلة، ووقت رمزي للنهاية. ثانيًا الغابة «lovely, dark and deep» — إغراء بالسكون والعمق، والعمق في الشعر غالبًا بمعنى الموت. ثالثًا كلمة «sleep» في السطرين الأخيرين: النوم العادي بعد مشوار طويل، أو النوم الكبير. وفروست ما حسمش القراءة، وده اللي بيخلي القراءتين شغالين: راجل تعبان بيتمنى يرتاح، لكنه بيكمل لأنه وعد.","n":1,"i":47},{"t":"write","h":"","q":"حلّل الصراع بين الواجب والراحة في القصيدة.","key":"analysis-08:1","a":"الصراع مبني على وقفة: الراجل وقف في مكان مالوش لازمة عملية فيه — «To stop without a farmhouse near» — وده اللي بيخلي الحصان يستغرب. الغابة بتقدّم له حاجة تانية غير الطريق: سكون، جمال، عمق. والوصف «lovely, dark and deep» مش وصف محايد، هو إغراء، والكلمة اللي بتوقف الإغراء هي «But». الواجب في القصيدة مش مثالي ولا بطولي، هو بس «promises to keep» — وعود مش محددة، وده اللي بيخليها قابلة للتعميم. والقصيدة مش بتقول إن الواجب أحسن من الراحة: بتقول إنه غلب، وبتسيب الإحساس بالخسارة في تكرار السطر الأخير. النتيجة إن الصراع مش بين خير وشر، هو بين حاجتين لكل واحدة وزنها.","n":1,"i":48},{"t":"write","h":"","q":"ناقش استخدام فروست للألفاظ البسيطة والإيقاع.","key":"analysis-08:2","a":"فروست بيكتب بكلام قريب من الحديث: «Whose woods these are I think I know» جملة ممكن تتقال في الشارع. مفيش مفردات فلسفية ولا استعارات معقدة، والقوة جاية من الترتيب والصوت. الوزن تفعيلة رباعية بيدّي إحساس بالمشي — مناسب لعربية وحصان ومشوار. القافية المتشابكة بتخلي القصيدة تتقدم خطوة خطوة، والسطر التالت في كل مقطع هو المحرك لأنه بيفتح قافية جديدة. والأصوات موظفة: أجراس الحصان، «sweep» اللي بتحاكي صوت الريح، «downy flake» اللي نعومتها في حروفها. البساطة دي مش سذاجة: هي طريقة عشان القارئ يعدي القصيدة بسرعة، وبعدين يرجع يلاقي إن «promises» و«sleep» مش واضحين خالص. والغموض في قلب البساطة هو أسلوب فروست.","n":1,"i":49},{"t":"end","h":"","teaser":"<div class=\"u\">كده Stopping by Woods خلصت: وقفة في تلج، حصان بيستغرب، وغابة جميلة سايبها الراجل عشان وعود.</div><div class=\"u\">الدرس الجاي: The Emperor of Ice-Cream لوالاس ستيفنز — قصيدة غريبة تمامًا، وفيها آيس كريم وجنازة في نفس الغرفة.</div>","extra":"المصادر: Robert Frost, “Stopping by Woods on a Snowy Evening” (New Hampshire, 1923)؛ ملاحظات فروست عن الانقلاب الشتوي؛ مصطلحات العروض: iambic tetrameter والقافية المتشابكة.","i":50}];</script>
