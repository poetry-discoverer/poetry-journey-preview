<div class="tags"><span class="tag"><span class="em">📊</span> تمهيدي</span><span class="tag">الدرس 9</span><span class="tag"><span class="em">📜</span> تاريخ الشعر</span></div>

<script>window.LESSON_ID="history-9";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Chaucer<\/span> ج1: حياته ودنياه\"<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">👑<\/span><\/span> في الدرس اللي فات شفنا إزاي 1066 ولّدت الإنجليزية الوسيطة. النهاردة نتعرف على الراجل اللي هيرفع اللغة دي لقمة الشعر: <span class=\"en\">Geoffrey Chaucer<\/span>، اللي بيتلقب \"أبو الشعر الإنجليزي\". الدرس ده عن حياته وزمانه، والدرس الجاي عن أعماله.<\/div><div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: مين <span class=\"en\">Chaucer<\/span>؟ وليه \"أبو الشعر الإنجليزي\"؟<\/div>", "n": 3, "i": 0, "a": "history-9-001", "x": "306f1e1b"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> اللقب على مين:<\/div><div class=\"li\"><span class=\"en\">Geoffrey Chaucer<\/span> (اتولد حوالي 1340-1343 ومات سنة 1400) يعتبر أعظم شاعر إنجليزي في العصور الوسطى كلها.<\/div><div class=\"li\">لقبه المشهور: \"أبو الشعر الإنجليزي\". وليه؟ لأنه أول واحد يكتب شعراً عظيماً بالإنجليزية في زمن كان الأدب الراقي فيه فرنسي أو لاتيني.<\/div><div class=\"li\">هو اللي أثبت إن الإنجليزية تقدر تحمل أعلى مستويات الشعر.<\/div>", "n": 3, "i": 1, "a": "history-9-002", "x": "f267e2fb"}, {"t": "learn", "h": "<div class=\"li\">مثال يومي: تخيل زمن كل الأغاني الراقية فيه بالفرنسي، ويجي فنان يعمل أغنية بالعامية تكسر الدنيا وتثبت إن العامية تقدر توصل لأعلى فن. ده اللي <span class=\"en\">Chaucer<\/span> عمله مع الإنجليزية.<\/div>", "n": 1, "i": 2, "a": "history-9-003", "x": "98b71f60"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> شهادة على مكانته:<\/div><div class=\"li\">لما مات سنة 1400 اتدفن في <span class=\"en\">Westminster Abbey<\/span>، أهم كنيسة في إنجلترا.<\/div><div class=\"li\">وقبره في الجناح الجنوبي من الكنيسة، اللي بقى اسمه بعد قرون <span class=\"en\">Poets' Corner<\/span> (ركن الشعراء)، واتدفن أو اتخلّد فيه بعده أدباء كتير.<\/div><div class=\"li\">هو اتدفن هناك لأنه كان عايش في محيط الكنيسة في آخر سنة من عمره.<\/div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: النشأة: ابن التاجر اللي دخل القصر <span class=\"em\"><span class=\"em\">🍷<\/span><\/span><\/div>", "n": 4, "i": 3, "a": "history-9-004", "x": "e4f09e12"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الحكاية من الأول:<\/div><div class=\"li\"><span class=\"en\">Chaucer<\/span> اتولد في لندن حوالي 1340-1343. أبوه <span class=\"en\">John Chaucer<\/span> كان تاجر نبيذ ناجح، بيورد النبيذ لبلاط الملك <span class=\"en\">Edward III<\/span> نفسه.<\/div><div class=\"li\">يعني <span class=\"en\">Chaucer<\/span> مش ابن نبيل ولا ابن فلاح: ابن طبقة تجار مرتاحة وطموحة. ودي نقطة مهمة هترجع في شعره: الراجل عاش بين كل الطبقات.<\/div>", "n": 2, "i": 4, "a": "history-9-005", "x": "5b5e5199"}, {"t": "learn", "h": "<div class=\"li\">سنة 1357، وهو لسه مراهق (حوالي 14-17 سنة)، اشتغل \"<span class=\"en\">page<\/span>\" (خادم صغير) في بيت <span class=\"en\">Countess of Ulster<\/span>، مرات واحد من أبناء الملك. سجلات البيت لسه موجودة: حتى قماش هدومه مسجلينها!<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> ليه ده مهم؟<\/div><div class=\"li\">الـ <span class=\"en\">page<\/span> في بيت نبيل بيشوف كل حاجة: النبلاء والخدم والضيوف والفضائح. تخيل واحد صغير بيشتغل في قصر كبير وعينه على كل حاجة، وكل اللي شافه هيطلع بعدين في شخصياته.<\/div>", "n": 3, "i": 5, "a": "history-9-006", "x": "e3c2036f"}, {"t": "learn", "h": "<div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: جندي وأسير ودبلوماسي <span class=\"em\"><span class=\"em\">⚔️<\/span><\/span><\/div>", "n": 1, "i": 6, "a": "history-9-007", "x": "79153924"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> محطات مغامرة:<\/div><div class=\"li\">سنة 1359: راح الحرب في فرنسا مع جيش <span class=\"en\">Edward III<\/span> (حرب المائة سنة)، واتأسر هناك!<\/div><div class=\"li\">سنة 1360: اتحرر بفدية، والملك بنفسه دفع منها 16 جنيه. يعني الملك كان شايف قيمته وهو لسه شاب.<\/div><div class=\"li\">سنة 1366: اتجوز <span class=\"en\">Philippa Roet<\/span>، اللي كانت بتشتغل في خدمة الملكة.<\/div><div class=\"li\">من أواخر الستينات: بقى دبلوماسي بيسافر في مهمات للملك: فرنسا وإسبانيا وإيطاليا.<\/div>", "n": 4, "i": 7, "a": "history-9-008", "x": "b6464a52"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> رحلة إيطاليا، نقطة التحول الكبرى:<\/div><div class=\"li\">سنة 1372-1373 سافر لإيطاليا (جنوة وفلورنسا)، وسنة 1378 سافر تاني (ميلانو).<\/div><div class=\"li\">هناك اكتشف شعر التلاتة العظام: <span class=\"en\">Dante<\/span> و<span class=\"en\">Petrarch<\/span> و<span class=\"en\">Boccaccio.<\/span> شعره بعد إيطاليا اتغير خالص.<\/div><div class=\"li\">مثال يومي: زي طالب سافر منحة بره ورجع بأفكار وأدوات جديدة غيرت شغله كله. إيطاليا كانت منحة <span class=\"en\">Chaucer.<\/span><\/div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: موظف نهاراً، شاعر بالليل <span class=\"em\"><span class=\"em\">💼<\/span><\/span><\/div>", "n": 4, "i": 8, "a": "history-9-009", "x": "76d8435e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الوظايف الرسمية:<\/div><div class=\"li\">سنة 1374: اتعين <span class=\"en\">Controller of Customs<\/span> (مراقب جمارك) على ميناء لندن، وفضل فيها 12 سنة. وفي نفس السنة الملك اداله \"جالون نبيذ يومياً مدى الحياة\"!<\/div><div class=\"li\">(مكافأة ملكية غريبة بس حقيقية وموثقة).<\/div><div class=\"li\">سنة 1386: بقى عضو برلمان عن مقاطعة <span class=\"en\">Kent.<\/span><\/div><div class=\"li\">بعدها: <span class=\"en\">Clerk of the King's Works<\/span>، يعني مسؤول عن مباني الملك وصيانتها.<\/div>", "n": 4, "i": 9, "a": "history-9-010", "x": "d1f87af0"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الرسالة المهمة:<\/div><div class=\"li\"><span class=\"en\">Chaucer<\/span> مش شاعر قاعد في برج عاجي. ده موظف شاطر ودبلوماسي وراجل أعمال، والشعر كان شغله التاني. عشان كده شعره مليان ناس حقيقيين مش أفكار مجردة.<\/div><div class=\"li\">مثال يومي: زي موظف في الحكومة بيكتب روايات بالليل عن زمايله والناس اللي بيقابلهم في الشغل.<\/div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: دنياه: قرن مليان قلاقل <span class=\"em\"><span class=\"em\">🌪️<\/span><\/span><\/div>", "n": 3, "i": 10, "a": "history-9-011", "x": "0ef87517"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> <span class=\"en\">Chaucer<\/span> عاش في قرن 14 مليان أحداث ضخمة:<\/div><div class=\"li\">الموت الأسود (الطاعون) 1348-1350: قتل جزءاً ضخماً من سكان إنجلترا. <span class=\"en\">Chaucer<\/span> كان طفل لما ضرب.<\/div><div class=\"li\">حرب المائة سنة مع فرنسا (1337-1453).<\/div><div class=\"li\">ثورة الفلاحين سنة 1381: الفلاحين زحفوا على لندن، والبلد كانت على وشك تنقلب.<\/div><div class=\"li\">الانشقاق الكبير في الكنيسة سنة 1378: بابا في روما وبابا تاني في أفينيون، والمسيحيين مش عارفين يتبعوا مين!<\/div>", "n": 4, "i": 11, "a": "history-9-012", "x": "f2fd9aa2"}, {"t": "learn", "h": "<div class=\"li\">سنة 1377 مات <span class=\"en\">Edward III<\/span> وجه <span class=\"en\">Richard II<\/span>، وعصره كله توتر سياسي.<\/div>", "n": 1, "i": 12, "a": "history-9-013", "x": "939baa1e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> افتكر قاعدتنا الذهبية <span class=\"em\"><span class=\"em\">⭐<\/span><\/span>:<\/div><div class=\"li\">الأدب بيتولد من الأحداث. كل القلاقل دي: طاعون وثورة وكنيسة منقسمة وحرب، هتلاقيها مخبوطة في شخصيات <span class=\"en\">Canterbury Tales<\/span> اللي هناخدها الدرس الجاي.<\/div><div class=\"u\">النقطة 6<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: مراحل شغله التلاتة <span class=\"em\"><span class=\"em\">🎭<\/span><\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الدارسين بيقسموا شعر <span class=\"en\">Chaucer<\/span> لـ3 مراحل على حسب تأثيره:<\/div>", "n": 3, "i": 13, "a": "history-9-014", "x": "a59742bb"}, {"t": "learn", "h": "<div class=\"u\">١. المرحلة الفرنسية (لحد حوالي 1370): شعر بيتأثر بالنمط الفرنسي الرومانسي، زي <span class=\"en\">The Book of the Duchess.<\/span><\/div><div class=\"u\">٢. المرحلة الإيطالية (السبعينات وأوائل التمانينات): بعد رحلات إيطاليا، قصائد زي <span class=\"en\">The House of Fame<\/span> و<span class=\"en\">The Parliament of Fowls<\/span> وتحفته <span class=\"en\">Troilus and Criseyde<\/span> (حوالي 1382-1386).<\/div>", "n": 2, "i": 14, "a": "history-9-015", "x": "8ea47de3"}, {"t": "learn", "h": "<div class=\"u\">٣. المرحلة الإنجليزية (من أواخر التمانينات لوفاته): التحفة الكبرى <span class=\"en\">The Canterbury Tales<\/span>، اللي فضل يكتب فيها لآخر عمره.<\/div>", "n": 1, "i": 15, "a": "history-9-016", "x": "d7ecd70a"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الخلاصة:<\/div><div class=\"li\">لغته: إنجليزي وسيط بلهجة لندن، وده هيفرق لاحقاً: لهجة لندن هي اللي هتبقى أساس الإنجليزية القياسية.<\/div>", "n": 1, "i": 16, "a": "history-9-017", "x": "b094d38c"}, {"t": "write", "h": "", "q": "ليه <span class=\"en\">Chaucer<\/span> بيتلقب \"أبو الشعر الإنجليزي\"؟ اشرحها بمثال من الموسيقى أو الفن في زمننا.", "key": "history-9:1", "n": 1, "i": 17}, {"t": "write", "h": "", "q": "احكي نشأة <span class=\"en\">Chaucer<\/span>: اتولد فين، أبوه كان بيشتغل إيه، وأول شغلانة ليه كانت إيه؟", "key": "history-9:2", "n": 1, "i": 18}, {"t": "write", "h": "", "q": "إيه قصة أسره في الحرب؟ وإيه اللي بيثبت إن الملك كان شايف قيمته؟", "key": "history-9:3", "n": 1, "i": 19}, {"t": "write", "h": "", "q": "ليه رحلات إيطاليا كانت نقطة تحول؟ وإيه التشبيه اليومي اللي قولناه؟", "key": "history-9:4", "n": 1, "i": 20}, {"t": "write", "h": "", "q": "اذكر 3 أحداث ضخمة حصلت في زمن <span class=\"en\">Chaucer<\/span>، واربطها بقاعدتنا الذهبية.", "key": "history-9:5", "n": 1, "i": 21}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">📖<\/span><\/span> <span class=\"en\">Chaucer<\/span> ج2: <span class=\"en\">The Canterbury Tales<\/span>، أشهر حج في تاريخ الأدب.", "extra": "<span class=\"em\"><span class=\"em\">🔗<\/span><\/span> المصادر:<ul><li><span class=\"en\">Chaucer Heritage Trust<\/span>: <span class=\"en\">chaucer.org.uk<\/span><\/li><li><span class=\"en\">Harvard Geoffrey Chaucer Website<\/span>: <span class=\"en\">chaucer.fas.harvard.edu<\/span> (خط زمني مفصل)<\/li><li><span class=\"en\">Academy of American Poets<\/span>: <span class=\"en\">poets.org<\/span><\/li><li><span class=\"en\">Westminster Abbey<\/span>: <span class=\"en\">westminster-abbey.org<\/span><\/li><\/ul>", "i": 22}];</script>
