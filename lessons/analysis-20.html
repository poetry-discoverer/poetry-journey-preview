<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">تحليل ٢٠ من ٢٢</span><span class="tag"><span class="em">🖋️</span> تحليل القصائد المهمة</span></div>

<script>window.LESSON_ID="analysis-20";window.STEPS=[{"t":"learn","h":"<div class=\"u\">والتمن تاني، بس المرة دي مش جوقة. شجرة واحدة، في مكان واسع فاضي، والشاعر واقف قدامها.</div><div class=\"u\">القصيدة: I Saw in Louisiana a Live-Oak Growing — 13 سطر، وجملة واحدة تقريبًا بتكبر لحد الاعتراف الأخير.</div>","n":2,"i":0,"a":"analysis-20-001","x":"ff2ec7fb"},{"t":"section","h":"السياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">القصيدة من <span class=\"en\">Leaves of Grass</span>، اتنشرت في طبعة 1860 جوه مجموعة <span class=\"en\">Calamus</span>، ومن أشهر قصايد والتمن القصيرة. والتمن كان عاش في نيو أورليانز تلات شهور سنة 1848، والمكان المذكور ولاية لويزيانا.</div>","n":1,"i":2,"a":"analysis-20-002","x":"2c6cbe83"},{"t":"learn","h":"<div class=\"u\">«البلوط الحي» <span class=\"en\">(live-oak)</span> نوع بلوط بيبقى أخضر طول السنة. عليه طحلب إسباني <span class=\"en\">(moss)</span> متعلق من الفروع — منظر جنوبي معروف.</div>","n":1,"i":3,"a":"analysis-20-003","x":"ade78440"},{"t":"learn","h":"<div class=\"u\">القصيدة مش وصف شجرة، هي مقارنة بين الشجرة والشاعر. والشاعر مش بيسيب المقارنة مفتوحة، هو بيقفلها باعتراف في الآخر.</div>","n":1,"i":4,"a":"analysis-20-004","x":"670aead1"},{"t":"mc","h":"","q":"الشجرة في القصيدة بتشبه مين؟","opts":["الشاعر نفسه","صاحب الشاعر","أمريكا"],"ans":0,"why":"الشاعر نفسه.","n":1,"i":5,"ex":["صح: «its look… made me think of myself» — المقارنة صريحة من الشاعر.","غلط: الصاحب غايب ومذكور كسؤال، مش كصورة للشجرة.","غلط: مفيش رمز وطني هنا؛ القصيدة شخصية."]},{"t":"learn","h":"<div class=\"u\">الشكل: شعر حر، سطور طويلة، ومفيش قافية. الجملة بتكمل من سطر لسطر، والقوسين في السطر التاسع بيدخلوا همسة داخلية.</div>","n":1,"i":6,"a":"analysis-20-005","x":"c1ec3d6a"},{"t":"section","h":"السطور <span dir=\"ltr\">1-4</span>: الشجرة والمقارنة","n":1,"i":7},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">I saw in Louisiana a live-oak growing, / All alone stood it and the moss hung down from the branches, / Without any companion it grew there uttering joyous leaves of dark green, / And its look, rude, unbending, lusty, made me think of myself,</span></div>","n":2,"i":8,"a":"analysis-20-006","x":"09ad3350"},{"t":"learn","h":"<div class=\"u\">«شفت في لويزيانا بلوط حي بيكبر» — البداية بمشاهدة بسيطة. وبعدين تلات تأكيدات على الوحدة: «all alone»، «without any companion»، وطحلب متعلق من غير سند.</div>","n":1,"i":9,"a":"analysis-20-007","x":"d3404722"},{"t":"learn","h":"<div class=\"u\">«بيطلع ورق فرحان أخضر غامق» <span class=\"en\">(uttering joyous leaves)</span>: الشجرة بتتكلم — تشخيص <span class=\"en\">(personification)</span>. الورق هنا مش نبات، هو تعبير عن فرح.</div>","n":1,"i":10,"a":"analysis-20-008","x":"c6a8808a"},{"t":"mc","h":"","q":"«uttering joyous leaves» بتعمل إيه؟","opts":["بتشخّص الشجرة ككائن بيعبّر عن فرح","بتوصف نوع الورق","بتقول إن الشجرة بتتكلم إنجليزي"],"ans":0,"why":"بتشخّص الشجرة ككائن بيعبّر.","n":1,"i":11,"ex":["صح: الفعل uttering مستعار للكلام، فالشجرة بقت بتعبّر.","غلط: الوصف هنا مجازي مش نباتي.","غلط: التشخيص شعري، مش حرفي."]},{"t":"learn","h":"<div class=\"u\">ووصف الشكل: «خشن، مش بينحني، وقوي» <span class=\"en\">(rude, unbending, lusty)</span>. تلات صفات بتخلي الشجرة شخصية، وبعدها على طول: «خلتني أفكر في نفسي».</div>","n":1,"i":12,"a":"analysis-20-009","x":"c4741902"},{"t":"section","h":"السطور <span dir=\"ltr\">5-7</span>: السؤال والغصن","n":1,"i":13},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">5-7</span>:</div><div class=\"u\"><span class=\"en\">But I wonder’d how it could utter joyous leaves standing alone there without its friend near, for I knew I could not, / And I broke off a twig with a certain number of leaves upon it, and twined around it a little moss, / And brought it away, and I have placed it in sight in my room,</span></div>","n":2,"i":14,"a":"analysis-20-010","x":"1375188d"},{"t":"tf","h":"","q":"الشاعر كسر غصن وخده معاه لغرفته.","ans":true,"why":"صح: «I broke off a twig… And brought it away, and I have placed it in sight in my room».","n":1,"i":15,"ex":["صح، الجملة صح: الغصن موجود في الغرفة كتذكار.","غلط. الغصن مذكور صريح."]},{"t":"learn","h":"<div class=\"u\">«بس استغربت إزاي تقدر تطلع ورق فرحان وهي واقفة لوحدها من غير صاحبها، لأني عارف إني أنا مقدرش»: الاعتراف بييجي في نص السطر، وده أهم تحول في القصيدة.</div>","n":1,"i":16,"a":"analysis-20-011","x":"6a9cf686"},{"t":"learn","h":"<div class=\"u\">يعني الشجرة أقوى منه: هي بتحتفل وهي وحيدة، وهو لأ. المقارنة اللي بدأت بإعجاب بتتحول لتشخيص فرق.</div>","n":1,"i":17,"a":"analysis-20-012","x":"885bfd91"},{"t":"mc","h":"","q":"إيه الفرق اللي الشاعر بيكتشفه بينه وبين الشجرة؟","opts":["هي تقدر تفرح وهي وحيدة، وهو لأ","هي أقدم منه","هي في لويزيانا وهو مش منها"],"ans":0,"why":"هي تتحمل الوحدة وهو مايتحملهاش.","n":1,"i":18,"ex":["صح: «for I knew I could not» — الاعتراف بالفرق هو قلب القصيدة.","غلط: العمر مش موضوع القصيدة.","غلط: المكان خلفية، مش سبب الفرق."]},{"t":"learn","h":"<div class=\"u\">وبعد كده بيكسر غصن فيه عدد معين من الورق، ويلف عليه شوية طحلب، وياخده معاه لغرفته. الغصن ده تذكار <span class=\"en\">(token)</span> — حاجة صغيرة من مكان كبير.</div>","n":1,"i":19,"a":"analysis-20-013","x":"56775e88"},{"t":"section","h":"السطور <span dir=\"ltr\">8-13</span>: التذكار والاعتراف","n":1,"i":20},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">8-10</span>:</div><div class=\"u\"><span class=\"en\">It is not needed to remind me as of my own dear friends, / (For I believe lately I think of little else than of them,) / Yet it remains to me a curious token, it makes me think of manly love;</span></div>","n":2,"i":21,"a":"analysis-20-014","x":"2b89a6e1"},{"t":"learn","h":"<div class=\"u\">«مش محتاج إنه يفكرني بأصحابي الأعزاء» — وبعدها قوسين: «(لأني أعتقد إني مؤخرًا مش بفكر في حاجة تانية غيرهم)». القوسين هنا همسة، مش جزء من الفكرة العامة.</div>","n":1,"i":22,"a":"analysis-20-015","x":"b32b3a7e"},{"t":"learn","h":"<div class=\"u\">«ومع كده بيفضل عندي تذكار غريب، بيخليني أفكر في المحبة الرجولية» <span class=\"en\">(manly love)</span>. عند والتمن المصطلح ده بيرمز للرفقة العميقة والمحبة بين الرجال، مش لشيء تاني.</div>","n":1,"i":23,"a":"analysis-20-016","x":"468e28e1"},{"t":"mc","h":"","q":"«manly love» في القصيدة بتشير لإيه؟","opts":["الرفقة والمحبة العميقة بين الرجال عند والتمن","الحب الرومانسي للستات","حب الطبيعة"],"ans":0,"why":"الرفقة والمحبة بين الرجال.","n":1,"i":24,"ex":["صح: المصطلح عند والتمن بيرمز للرفقة والمحبة بين الرجال (comradeship).","غلط: القصيدة بتتكلم عن أصحابه الرجال.","غلط: حب الطبيعة موجود كخلفية، مش المقصود بالمصطلح."]},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">11-13</span>:</div><div class=\"u\"><span class=\"en\">For all that, and though the live-oak glistens there in Louisiana solitary in a wide flat space, / Uttering joyous leaves all its life without a friend a lover near, / I know very well I could not.</span></div>","n":2,"i":25,"a":"analysis-20-017","x":"8d4ed607"},{"t":"learn","h":"<div class=\"u\">«رغم كل ده، ورغم إن البلوط بيلف في لويزيانا وحيد في مكان واسع ومفلطح، وبيطلع ورق فرحان طول عمره من غير صاحب ولا حبيب قريب» — الجملة بترجع للشجرة تاني، بس المرة دي بوصف أوسع.</div>","n":1,"i":26,"a":"analysis-20-018","x":"faed15dc"},{"t":"learn","h":"<div class=\"u\">والختام: «أنا عارف كويس إني مقدرش» <span class=\"en\">(I know very well I could not)</span>. نفس الجملة اللي قلها في السطر الخامس، بس المرة دي في نهاية القصيدة وبوزن أكبر.</div>","n":1,"i":27,"a":"analysis-20-019","x":"bf3f63ae"},{"t":"tf","h":"","q":"الشاعر بيقول إنه يقدر يعيش لوحده زي الشجرة.","ans":false,"why":"غلط: هو بيقول العكس مرتين — في السطر الخامس وفي السطر الأخير «I know very well I could not».","n":1,"i":28,"ex":["غلط. الاعتراف بالنهاية واضح ومباشر.","صح، الجملة غلط: الشاعر بينفي قدرته على الوحدة."]},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":29},{"t":"learn","h":"<div class=\"u\">التشخيص <span class=\"en\">(personification)</span>: الشجرة «بتطلع» ورق فرحان، وليها «نظرة». الوصف ده هو اللي بيسمح بالمقارنة مع إنسان.</div>","n":1,"i":30,"a":"analysis-20-020","x":"99eb0657"},{"t":"learn","h":"<div class=\"u\">التكرار: «uttering joyous leaves» بتتكرر، و«I knew I could not» بتتقفل بـ«I know very well I could not». التكرار بيربط البداية بالنهاية ويخلي الاعتراف حاسم.</div>","n":1,"i":31,"a":"analysis-20-021","x":"2428eecc"},{"t":"learn","h":"<div class=\"u\">القوسين: بيدخلوا صوت داخلي في نص الجملة. القصيدة كلها كلام بيتقال، والقوسين همسة مش بتتقال.</div>","n":1,"i":32,"a":"analysis-20-022","x":"76aa0cee"},{"t":"learn","h":"<div class=\"u\">الموضوعات: العزلة والقوة، والرفقة كحاجة أساسية للإنسان، والطبيعة كمرآة للذات، والمحبة الرجولية عند والتمن. وبعض القراءات بتشوف القصيدة كاعتراف بالاعتماد على الآخرين، وبعضها بتقراها كتأمل في حدود الفردية.</div>","n":1,"i":33,"a":"analysis-20-023","x":"9d5e7f7d"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":34},{"t":"recall","h":"","q":"اشرح المقارنة بين الشاعر والشجرة.","a":"القصيدة بتبدأ بوصف الشجرة: واقفة لوحدها، طحلب متعلق من فروعها، من غير صاحب، وبتطلع ورق فرحان أخضر غامق. ووصفها «rude, unbending, lusty» بيخليها شخصية، وده اللي بيسمح للشاعر يقول إن شكلها فكّره في نفسه. لكن بعد كده بيسأل سؤال حاسم: إزاي تقدر تطلع ورق فرحان وهي وحيدة، «لأني عارف إني أنا مقدرش». يعني المقارنة بتتحول لتشخيص فرق: الشجرة عندها قوة على الوحدة، والشاعر معندهوش. والقافية الناقصة بين السطر الخامس والأخير بتقفل المقارنة بنفس الاعتراف.","n":1,"i":35},{"t":"recall","h":"","q":"إيه دور الغصن في القصيدة؟","a":"الغصن هو الجسر بين الشجرة والشاعر. هو بيكسره بيده، ويلف عليه شوية طحلب، وياخده لغرفته ويحطه قدام عينه. والغصن هنا تذكار (token) مش زينة: بيفضل حاضر في حياته اليومية. والقصيدة بتقول إنه مش محتاج حد يفكّره بأصحابه (وفي القوسين بيقول إنه مش بيفكر في حاجة تانية غيرهم)، لكن الغصن بيفضل «curious token» بيخليه يفكر في المحبة الرجولية. فالغصن وظيفته إنه يحوّل تجربة مشاهدة في لويزيانا لحاجة صغيرة عايشة معاه في الغرفة.","n":1,"i":36},{"t":"write","h":"","q":"حلّل صورة البلوط الحي في القصيدة.","key":"analysis-20:1","a":"البلوط الحي في القصيدة مزيج من قوة ووحدة: «All alone stood it»، و«Without any companion»، والطحلب متعلق من الفروع من غير سند. وفي نفس الوقت هو مش حزين: «uttering joyous leaves of dark green» — الورق فرحان، والوصف «rude, unbending, lusty» بيدي خشنته وقوته. الصورة دي مش صورة مأساة، هي صورة استقلال. والطحلب نفسه مضاف: حاجة تانية عايشة عليه، لكن مش صاحب. ووصف المكان في السطر 11 («solitary in a wide flat space») بيكمّل الصورة: مش وحدة جوه زحمة، وحدة في فضاء فاضي. وبعض القراءات بتشوف البلوط كصورة للفنان أو للإنسان المكتفي، وبعضها بيشوفه كصورة مثالية للفردية الأمريكية.","n":1,"i":37},{"t":"write","h":"","q":"ناقش فكرة العزلة والرفقة عند والتمن من خلال القصيدة.","key":"analysis-20:2","a":"القصيدة بتحط العزلة في وشها: الشجرة بتقدر تعيش لوحدها وتفرح، والشاعر بيقول مرتين إنه ما يقدرش. فالرفقة عنده مش رفاهية، هي شرط. والقوسين («For I believe lately I think of little else than of them») بيكشفوا إن أصحابه شغلوه كل حاجة، والغصن في الغرفة بيفضل تذكار للـ«manly love». الموقف ده متسق مع باقي شعر والتمن، اللي بيبني جماعة من أصوات وأجساد متجاورة. وفي نفس الوقت القصيدة مش بتحكم على الشجرة — هي بتعجب بيها. فالنتيجة إن فيه نوعين من القوة: قوة الوحدة، وقوة الاعتراف بالحاجة للآخر. وبعض القراءات بتشوف إن اعتراف الشاعر هو اللي بيخليه أقرب للإنسان، مش أقل.","n":1,"i":38},{"t":"end","h":"","teaser":"<div class=\"u\">كده Live-Oak Growing خلصت: شجرة وحيدة، غصن في الغرفة، واعتراف صريح.</div><div class=\"u\">الدرس الجاي: Telling the Bees لجون جرينليف ويتير — بيت فيه نحل، وحزن بيتبعت معاهم.</div>","extra":"المصادر: Walt Whitman, “I Saw in Louisiana a Live-Oak Growing” (Leaves of Grass, طبعة 1860، مجموعة Calamus)؛ إقامة والتمن في نيو أورليانز 1848 موثقة في Whitman Archive؛ مصطلحات: free verse, personification, token, comradeship.","i":39}];</script>
