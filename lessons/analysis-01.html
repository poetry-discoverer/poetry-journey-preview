<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">تحليل ١ من ٢</span><span class="tag"><span class="em">🖋️</span> تحليل القصائد المهمة</span></div>

<script>window.LESSON_ID="analysis-01";window.STEPS=[{"t":"learn","h":"<div class=\"lead\">الدرس ده أول قصيدة في تراك <span class=\"en\">تحليل القصائد المهمة</span>. إزاي بنحلّل قصيدة سطرًا سطرًا؟ بنمشي على ٦ محاور في كل قصيدة:</div><div class=\"li\">١) الشاعر والحقبة: مين كتبها وإمتى وليه.</div><div class=\"li\">٢) الحكاية والإحالات: مين بيتكلم، ولمين، وإيه الحكايات اللي بيستعين بيها.</div><div class=\"li\">٣) الشكل: النوع، الوزن، القافية، الصوت.</div><div class=\"li\">٤) السطر ومعناه: سطرًا سطرًا.</div><div class=\"li\">٥) الأدوات البلاغية: كل صورة ووظيفتها.</div><div class=\"li\">٦) الموضوعات وأسئلة الامتحان.</div>","n":7,"i":0,"a":"analysis-01-001","x":"33d77615"},{"t":"learn","h":"<div class=\"u\">القصيدة: <span class=\"en\">The Love Song of J. Alfred Prufrock</span> لـ <span class=\"en\">T. S. Eliot</span>. نُشرت أول مرة في مجلة <span class=\"en\">Poetry</span> الأمريكية في يونيو ١٩١٥، بدفع من <span class=\"en\">Ezra Pound</span>، ثم في أول ديوان لإليوت: <span class=\"en\">Prufrock and Other Observations</span> (١٩١٧).</div><div class=\"u\">طولها ١٣١ سطرًا، وإحنا هناخد الجزء الأول منها: السطور <span dir=\"ltr\">1-74</span>.</div>","n":2,"i":1,"a":"analysis-01-002","x":"2725a6a6"},{"t":"learn","h":"<div class=\"u\">ليه القصيدة دي مهمة؟ لأنها تُعتبر بداية الشعر الحديث (<span class=\"en\">modern poetry</span>) بالإنجليزية: بطل عادي، مدينة قذرة، شك وتردد، وشعر حر بدل الوزن المنتظم. قبلها كان الشعر الرومانسي والفيكتوري: عاطفة كبيرة ولغة عالية.</div>","n":1,"i":2,"a":"analysis-01-003","x":"4dc00d5a"},{"t":"section","h":"الحقبة: الحداثة (Modernism)","n":1,"i":3},{"t":"learn","h":"<div class=\"u\">الحداثة (<span class=\"en\">Modernism</span>) حركة في الفن والأدب من حوالي ١٨٩٠ إلى ١٩٤٠. أسبابها: الحرب العالمية الأولى، التصنيع والمدينة، انهيار اليقين الديني، أفكار <span class=\"en\">Freud</span> عن اللاوعي، والإحساس إن العالم القديم انتهى.</div>","n":1,"i":4,"a":"analysis-01-004","x":"9a542056"},{"t":"learn","h":"<div class=\"lead\">سمات القصيدة الحداثية:</div><div class=\"li\">شعر حر (<span class=\"en\">free verse</span>) ولغة قريبة من الكلام.</div><div class=\"li\">صور غير رومانسية: مستشفى، ضباب صناعي، فنادق رخيصة.</div><div class=\"li\">إحالات كثيرة (<span class=\"en\">allusion</span>) للثقافة القديمة.</div><div class=\"li\">مونولوج داخلي (<span class=\"en\">interior monologue</span>).</div><div class=\"li\">بطل غير بطولي (<span class=\"en\">anti-hero</span>) ومدينة حديثة.</div><div class=\"li\">سخرية (<span class=\"en\">irony</span>) ووعي بالذات.</div>","n":7,"i":5,"a":"analysis-01-005","x":"8684de37"},{"t":"learn","h":"<div class=\"u\">إليوت نفسه صاغ مبدأين مؤثرين. الأول: <span class=\"en\">impersonality</span> في مقال <span class=\"en\">Tradition and the Individual Talent</span> (١٩١٩): الشاعر يختفي وراء النص، والشعر تنظيم للمشاعر لا تفريغ لها.</div><div class=\"u\">التاني: <span class=\"en\">objective correlative</span> في مقال <span class=\"en\">Hamlet and His Problems</span> (١٩١٩): المشاعر تُنقل بصورة أو حدث مادي، لا بالكلام المباشر. يعني بدل ما تقول «أنا حزين»، تحط مشهد يعمل الإحساس ده.</div>","n":2,"i":6,"a":"analysis-01-006","x":"190fc98f"},{"t":"learn","h":"<div class=\"u\">الشكل: القصيدة <span class=\"en\">dramatic monologue</span> — متكلم واحد بيتكلم، وإحنا بنسمعه. مفيش مقاطع منتظمة ولا وزن منتظم، لكن فيها قوافي متفرقة (<span class=\"en\">irregular rhyme</span>) وإيقاع قريب من الكلام.</div><div class=\"u\">المتكلم اسمه <span class=\"en\">J. Alfred Prufrock</span>: راجل في منتصف العمر، مثقف، خجول، عايش في مدينة حديثة، ومش قادر يعمل حاجة.</div>","n":2,"i":7,"a":"analysis-01-007","x":"bffee523"},{"t":"learn","h":"<div class=\"lead\">ملاحظة عن الامتحان:</div><div class=\"u\">تواريخ ميلاد ووفاة الشعراء وتاريخ نشر القصائد غير مطلوبة عادةً. المطلوب تواريخ الأحداث المهمة والمفصلة. يعني ركّز على الحقبة وسماتها وعلى القصيدة نفسها، مش على سنة النشر.</div>","n":2,"i":8,"a":"analysis-01-008","x":"33d18952"},{"t":"section","h":"الاستهلال (Epigraph): دانتي","n":1,"i":9},{"t":"learn","h":"<div class=\"u\">قبل القصيدة اقتباس بالإيطالية من <span class=\"en\">Dante</span>، <span class=\"en\">Inferno XXVII</span> (النشيد ٢٧ من الجحيم). المتكلم فيه <span class=\"en\">Guido da Montefeltro</span>، محبوس في لهب، بيحكي حكايته لدانتي بشرط: إنه فاكر إن دانتي مش هيرجع للدنيا ويقولها لحد.</div>","n":1,"i":10,"a":"analysis-01-009","x":"71014b3f"},{"t":"learn","h":"<div class=\"u\">الترجمة: «لو كنتُ أعلم أن جوابي سيصل لإنسان يعود يومًا للدنيا، لما تكلمت. لكن بما إن ما حدش رجع حيًّا من هذا القاع، فأنا أرد بلا خوف من العار.»</div><div class=\"u\">يعني: هو شايف إن كلامه مش هيوصل لحد، فبيتكلم بصراحة.</div>","n":2,"i":11,"a":"analysis-01-010","x":"47975427"},{"t":"learn","h":"<div class=\"u\">ليه الاقتباس مهم؟ لأنه بيقول لنا إزاي نقرا القصيدة: المتكلم هيفضح نفسه لأنه متأكد إن كلامه مش هيوصل لحد. يعني القصيدة اعتراف في الفراغ.</div><div class=\"u\">والمفارقة إننا إحنا بنسمعه. اعتراف موجّه للي مش موجود، وقارئ موجود بيسمع.</div>","n":2,"i":12,"a":"analysis-01-011","x":"55cca681"},{"t":"section","h":"الدعوة (السطور <span dir=\"ltr\">1-12</span>)","n":1,"i":13},{"t":"learn","h":"<div class=\"lead\">السطر 1:</div><div class=\"u\"><span class=\"en\">Let us go then, you and I</span> — تعالَ نروح، أنا وإنت.</div><div class=\"u\">مين الـ <span class=\"en\">you</span>؟ مش محدد. ممكن حبيبة، أو القارئ، أو جزء تاني من نفسه. الغموض مقصود، وهو اللي بيخلي القصيدة حوارًا داخليًا مش قصة حب.</div>","n":3,"i":14,"a":"analysis-01-012","x":"665d224e"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">2-3</span>:</div><div class=\"u\"><span class=\"en\">When the evening is spread out against the sky / Like a patient etherized upon a table</span></div><div class=\"u\">تشبيه (<span class=\"en\">simile</span>): المساء زي مريض مخدَّر (<span class=\"en\">etherized</span>) ممدد على ترابيزة عمليات. صورة مستشفى وسكون وعجز، بدل صورة المساء الرومانسي.</div>","n":3,"i":15,"a":"analysis-01-013","x":"dc6e3987"},{"t":"learn","h":"<div class=\"u\">ليه الصورة دي صادمة؟ لأن الشعر القديم كان بيشبّه المساء بحبيبة أو بملك أو بطلة. هنا بقى مشهد جراحة: خدر وتسليم. دي أول علامة إننا في شعر حديث، وإن الجمال مش مطلوب في حد ذاته.</div>","n":1,"i":16,"a":"analysis-01-014","x":"7fd32de4"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">4-7</span>:</div><div class=\"u\"><span class=\"en\">half-deserted streets</span> / <span class=\"en\">one-night cheap hotels</span> / <span class=\"en\">sawdust restaurants with oyster-shells</span></div><div class=\"u\">شوارع نصف خالية، فنادق رخيصة لليلة، ومطاعم على الأرض نشارة خشب وقشور محار. تفاصيل حقيقية قذرة، مش عاطفة.</div>","n":3,"i":17,"a":"analysis-01-015","x":"058284b2"},{"t":"learn","h":"<div class=\"u\">الأماكن دي بتعمل حاجة مهمة: بتخلي القصيدة في مدينة حديثة فقيرة. والتفاصيل الصغيرة (نشارة الخشب، قشور المحار) أسلوب حداثي: الشيء المادي العادي بدل الصورة الجميلة.</div>","n":1,"i":18,"a":"analysis-01-016","x":"e6c33333"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">8-10</span>:</div><div class=\"u\"><span class=\"en\">Streets that follow like a tedious argument / Of insidious intent / To lead you to an overwhelming question</span></div><div class=\"u\">الشوارع زي جدال طويل ممل، بنيّة خفية، بيقودك بالراحة لسؤال ساحق (<span class=\"en\">an overwhelming question</span>). الشارع بقى منطق، والسؤال بقى نهاية الطريق.</div>","n":3,"i":19,"a":"analysis-01-017","x":"9d4bd379"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">11-12</span>:</div><div class=\"u\"><span class=\"en\">Oh, do not ask, “What is it?” / Let us go and make our visit.</span></div><div class=\"u\">بيقول: متسألنيش السؤال إيه. رفض تسمية السؤال. ده أول مثال على التهرب (<span class=\"en\">evasion</span>)، وهو الموضوع الأساسي في القصيدة.</div>","n":3,"i":20,"a":"analysis-01-018","x":"ff84d43c"},{"t":"section","h":"اللازمة: الغرفة","n":1,"i":21},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">13-14</span>:</div><div class=\"u\"><span class=\"en\">In the room the women come and go / Talking of Michelangelo.</span></div><div class=\"u\">في الغرفة ستات بيدخلوا ويخرجوا وبيتكلموا عن مايكل أنجلو. مشهد صالون اجتماعي: فن عظيم بقى كلام مجاملة.</div>","n":3,"i":22,"a":"analysis-01-019","x":"3f5816ea"},{"t":"learn","h":"<div class=\"u\">اللازمة (<span class=\"en\">refrain</span>) بتتكرر في <span dir=\"ltr\">35-36</span> بنفس الكلمات تقريبًا. وظيفتها: تقطع تيار الأفكار، وتفصل بين عالم بره (الشوارع) وعالم جوه (الغرفة). والقافية <span class=\"en\">go / Michelangelo</span> بتخلي الكلام العادي مقفولًا زي الشعر.</div>","n":1,"i":23,"a":"analysis-01-020","x":"1a901b8b"},{"t":"learn","h":"<div class=\"u\">المفارقة: الستات بيتكلموا عن فنان عظيم، وPrufrock مش قادر يقول حاجة. هو بره اللغة الاجتماعية دي، بيتفرج عليها من بعيد.</div>","n":1,"i":24,"a":"analysis-01-021","x":"2039ac36"},{"t":"section","h":"الضباب (السطور <span dir=\"ltr\">15-22</span>)","n":1,"i":25},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">15-16</span>:</div><div class=\"u\"><span class=\"en\">The yellow fog that rubs its back upon the window-panes, / The yellow smoke that rubs its muzzle on the window-panes</span></div><div class=\"u\">الضباب الأصفر بيدعك ظهره على الشبابيك، والدخان الأصفر بيدعك خطمه. تكرار مع تغيير: <span class=\"en\">back / muzzle</span>. الأصفر هنا لون صناعي مريض، مش لون شمس.</div>","n":3,"i":26,"a":"analysis-01-022","x":"b0842046"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">17-22</span>:</div><div class=\"u\"><span class=\"en\">Licked its tongue into the corners of the evening… Curled once about the house, and fell asleep.</span></div><div class=\"u\">الضباب بيلحس، بيتلكّع، بيوقّع سخام المداخن على ضهره، بيقفز، وبيتكوّر وينام. ده تشخيص (<span class=\"en\">personification</span>) وتحويل لحيوان.</div>","n":3,"i":27,"a":"analysis-01-023","x":"553d891d"},{"t":"learn","h":"<div class=\"u\">الضباب هنا قطة (<span class=\"en\">cat</span>) كبيرة: بتدعك ضهرها، بتلحس، بتقفز، وبتنام. الصورة كاملة من غير ما إليوت يقول «زي قطة». دي استعارة ممتدة (<span class=\"en\">extended metaphor</span>).</div>","n":1,"i":28,"a":"analysis-01-024","x":"49aae860"},{"t":"learn","h":"<div class=\"u\">ليه الضباب مهم؟ لأنه بيعمل كل اللي Prufrock عايز يعمله وما بيعرفش: بيتحرك، بياخد مكانه، وبيستريح. الضباب حر، والبطل مشلول.</div>","n":1,"i":29,"a":"analysis-01-025","x":"197a753e"},{"t":"section","h":"الوقت (السطور <span dir=\"ltr\">23-34</span>)","n":1,"i":30},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">23-26</span>:</div><div class=\"u\"><span class=\"en\">And indeed there will be time … There will be time, there will be time</span></div><div class=\"u\">التكرار (<span class=\"en\">repetition / anaphora</span>) بيوحي بوقت طويل، لكنه كمان بيوحي بتأجيل لا نهائي: فيه وقت، يعني مش دلوقتي.</div>","n":3,"i":31,"a":"analysis-01-026","x":"389dd46e"},{"t":"learn","h":"<div class=\"u\">إحالة (<span class=\"en\">allusion</span>): «<span class=\"en\">There will be time</span>» بترد على قصيدة <span class=\"en\">Andrew Marvell</span>: <span class=\"en\">To His Coy Mistress</span> («<span class=\"en\">Had we but world enough, and time</span>»)، وفيها عاشق بيطالب بالوقت. Prufrock بياخد نفس الجملة ويستخدمها للتأجيل، مش للفعل.</div>","n":1,"i":32,"a":"analysis-01-027","x":"34e63d4a"},{"t":"learn","h":"<div class=\"lead\">السطر 27:</div><div class=\"u\"><span class=\"en\">To prepare a face to meet the faces that you meet</span></div><div class=\"u\">تجهيز وش لمقابلة الوشوش. الحياة الاجتماعية قناع (<span class=\"en\">mask</span>)، والوشوش بترد على بعضها كأنها أشياء. ده أول ظهور لفكرة المراقبة الاجتماعية.</div>","n":3,"i":33,"a":"analysis-01-028","x":"be524fc8"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">28-30</span>:</div><div class=\"u\"><span class=\"en\">There will be time to murder and create, / And time for all the works and days of hands / That lift and drop a question on your plate</span></div><div class=\"u\">وقت للقتل والخلق (إحالة على سفر الجامعة: «لكل شيء وقت»)، ووقت لأعمال وأيام الأيدي (إحالة على قصيدة <span class=\"en\">Hesiod</span>: <span class=\"en\">Works and Days</span>). الأعمال العظيمة بقت مهام في قائمة.</div>","n":3,"i":34,"a":"analysis-01-029","x":"3e0de14f"},{"t":"learn","h":"<div class=\"u\">والسؤال اللي «بيرفعوه ويحطوه على طبقك» — السؤال بقى لقمة على طبق. تصغير ساخر (<span class=\"en\">mock-heroic</span>) للأمر الكبير.</div>","n":1,"i":35,"a":"analysis-01-030","x":"13be518d"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">31-34</span>:</div><div class=\"u\"><span class=\"en\">Time for you and time for me, / And time yet for a hundred indecisions, / And for a hundred visions and revisions, / Before the taking of a toast and tea</span></div><div class=\"u\">وقت لمئة تردد ومئة رؤية وتعديل، قبل شرب الشاي. التوازي والقافية (<span class=\"en\">indecisions / revisions</span>) بيخلوا التردد نفسه إيقاعًا.</div>","n":3,"i":36,"a":"analysis-01-031","x":"a9eb8d53"},{"t":"section","h":"الجرأة (السطور <span dir=\"ltr\">37-48</span>)","n":1,"i":37},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">37-41</span>:</div><div class=\"u\"><span class=\"en\">To wonder, “Do I dare?” and, “Do I dare?” / Time to turn back and descend the stair, / With a bald spot in the middle of my hair — / (They will say: “How his hair is growing thin!”)</span></div><div class=\"u\">السؤال بيتكرر، والنزول على السلم، والصلعة في نص الشعر. الخوف من كلام الناس على شعر خفيف: المراقبة بقت على الجسم نفسه.</div>","n":3,"i":38,"a":"analysis-01-032","x":"62da43dd"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">42-44</span>:</div><div class=\"u\"><span class=\"en\">My morning coat, my collar mounting firmly to the chin, / My necktie rich and modest, but asserted by a simple pin — / (They will say: “But how his arms and legs are thin!”)</span></div><div class=\"u\">هدومه درع: ياقة عالية، كرافتة بدبوس. ومع ذلك الوشوش بتشوف نحافته. اللبس مش بيحميه من الحكم.</div>","n":3,"i":39,"a":"analysis-01-033","x":"d6067f07"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">45-46</span>:</div><div class=\"u\"><span class=\"en\">Do I dare / Disturb the universe?</span></div><div class=\"u\">أكبر سؤال في القصيدة: يجرؤ يقلب الكون؟ التضخيم هنا ساخر: راجل خايف يقول كلمة بيحط نفسه في مواجهة الكون. ده البطولي المقلوب (<span class=\"en\">mock-heroic</span>).</div>","n":3,"i":40,"a":"analysis-01-034","x":"6151c056"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">47-48</span>:</div><div class=\"u\"><span class=\"en\">In a minute there is time / For decisions and revisions which a minute will reverse.</span></div><div class=\"u\">في دقيقة فيه وقت للقرارات والتعديلات اللي الدقيقة اللي بعدها هتلغيها. الحركة دائرية: قرار ثم نقض، بلا تقدم.</div>","n":3,"i":41,"a":"analysis-01-035","x":"4a005f0a"},{"t":"section","h":"عرفهم كلهم (السطور <span dir=\"ltr\">49-69</span>)","n":1,"i":42},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">49-51</span>:</div><div class=\"u\"><span class=\"en\">For I have known them all already, known them all: / Have known the evenings, mornings, afternoons, / I have measured out my life with coffee spoons</span></div><div class=\"u\">«قستُ حياتي بمعالق قهوة». أشهر سطر في القصيدة: العمر بيتقاس بأداة صغيرة جدًا، يعني حياة مقسمة لمهام تافهة بدقة.</div>","n":3,"i":43,"a":"analysis-01-036","x":"dbcc6ab7"},{"t":"learn","h":"<div class=\"u\">الأداة هنا مجاز مرسل (<span class=\"en\">metonymy</span>): المعلقة بتشير للعادات والروتين. والمعنى: مفيش حدث كبير، فيه معالق. والتكرار «<span class=\"en\">known them all</span>» بيوحي بسأم وإشباع مسبق.</div>","n":1,"i":44,"a":"analysis-01-037","x":"fa3050b0"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">52-53</span>:</div><div class=\"u\"><span class=\"en\">I know the voices dying with a dying fall / Beneath the music from a farther room</span></div><div class=\"u\">أصوات بتموت بسقوط هادي تحت مزيكا من أوضة بعيدة. إحالة على <span class=\"en\">Shakespeare</span>، <span class=\"en\">Twelfth Night</span>: «<span class=\"en\">That strain again! it had a dying fall</span>». الصوت البعيد = عالم مش بتاعه.</div>","n":3,"i":45,"a":"analysis-01-038","x":"9639f3a9"},{"t":"learn","h":"<div class=\"lead\">السطر 54:</div><div class=\"u\"><span class=\"en\">So how should I presume?</span></div><div class=\"u\">السؤال بيتكرر بصيغ مختلفة: <span class=\"en\">how should I presume / how should I begin</span>. هو مش سؤال عن الطريقة، هو إعلان عجز.</div>","n":3,"i":46,"a":"analysis-01-039","x":"e8339e4e"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">55-58</span>:</div><div class=\"u\"><span class=\"en\">The eyes that fix you in a formulated phrase, / And when I am formulated, sprawling on a pin, / When I am pinned and wriggling on the wall</span></div><div class=\"u\">عيون الناس بتثبتك في عبارة جاهزة. ولما تتحول لعبارة، تبقى حشرة مدبوسة بإبرة على الحيطة وبتتلوى.</div>","n":3,"i":47,"a":"analysis-01-040","x":"a2ab7d12"},{"t":"learn","h":"<div class=\"u\">الصورة دي بتشتغل على مستويين: فراشة في مجموعة (<span class=\"en\">specimen</span>) وضحية مراقبة. المراقبة الاجتماعية بتحوّل الإنسان لحاجة ميتة معروضة.</div>","n":1,"i":48,"a":"analysis-01-041","x":"701c38f3"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">59-61</span>:</div><div class=\"u\"><span class=\"en\">Then how should I begin / To spit out all the butt-ends of my days and ways? / And how should I presume?</span></div><div class=\"u\">إزاي يبدأ يبصق بواقي أيامه؟ <span class=\"en\">butt-ends</span> = عقب سيجارة. أيامه زي أعقاب مرمية. صورة تقزز من الذات.</div>","n":3,"i":49,"a":"analysis-01-042","x":"6df34da8"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">62-67</span>:</div><div class=\"u\"><span class=\"en\">Arms that are braceleted and white and bare / (But in the lamplight, downed with light brown hair!) / Is it perfume from a dress / That makes me so digress?</span></div><div class=\"u\">دراعات بسوار، بيضة، عريانة، وفي نور اللمبة عليها زغب بني فاتح. ريحة عطر بتخليه يتشتت. الرغبة بتقطع التفكير.</div>","n":3,"i":50,"a":"analysis-01-043","x":"6fa81d23"},{"t":"learn","h":"<div class=\"u\">لاحظ: أول ما ظهرت الأجساد، ظهر «<span class=\"en\">digress</span>» (يتشتت). Prufrock بيحاول يفكر، والجسد بيسحبه. والتفصيل الحسي الدقيق (الزغب في النور) حداثي: دقة بلا رومانسية.</div>","n":1,"i":51,"a":"analysis-01-044","x":"ce7f347b"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">68-69</span>:</div><div class=\"u\"><span class=\"en\">And should I then presume? / And how should I begin?</span></div><div class=\"u\">السؤال رجع تاني بنفس الكلمات تقريبًا. الدائرة اتقفلت: من «كيف أجرؤ» لـ«كيف أبدأ»، من غير إجابة.</div>","n":3,"i":52,"a":"analysis-01-045","x":"46f029ae"},{"t":"section","h":"السلطعون (السطور <span dir=\"ltr\">70-74</span>)","n":1,"i":53},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">70-72</span>:</div><div class=\"u\"><span class=\"en\">Shall I say, I have gone at dusk through narrow streets / And watched the smoke that rises from the pipes / Of lonely men in shirt-sleeves, leaning out of windows? …</span></div><div class=\"u\">رجالة وحيدة بقمصان نصف كم بيتفرجوا من الشبابيك. صورة المدينة الحديثة: ناس جنب بعض ومفصولين. الثلاث نقط (…) بتقطع الكلام.</div>","n":3,"i":54,"a":"analysis-01-046","x":"ccb7c61f"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">73-74</span>:</div><div class=\"u\"><span class=\"en\">I should have been a pair of ragged claws / Scuttling across the floors of silent seas.</span></div><div class=\"u\">«كان المفروض أكون زوجًا من مخالب بالية تزحف في أرض بحار صامتة». يعني: كان نفسي أكون سلطعون: بلا كلام، بلا وعي، بلا فشل.</div>","n":3,"i":55,"a":"analysis-01-047","x":"2492f8aa"},{"t":"learn","h":"<div class=\"u\">الصورة قوية لأنها بتشيل الإنسان كله: مش عايز يكون راجل، عايز يكون مخالب بس. دي رغبة في التراجع (<span class=\"en\">regression</span>) وفي الصمت. والصورة مادية جدًا: مخالب، أرض، بحر — ده أسلوب إليوت.</div>","n":1,"i":56,"a":"analysis-01-048","x":"7a8b5ed1"},{"t":"section","h":"الأدوات البلاغية (ملخص)","n":1,"i":57},{"t":"learn","h":"<div class=\"li\">١) التشبيه (<span class=\"en\">simile</span>): المساء/المريض المخدر (<span dir=\"ltr\">2-3</span>)، الشوارع/الجدال (<span dir=\"ltr\">8-10</span>).</div><div class=\"li\">٢) الاستعارة الممتدة (<span class=\"en\">extended metaphor</span>): الضباب/القطة (<span dir=\"ltr\">15-22</span>).</div><div class=\"li\">٣) التشخيص (<span class=\"en\">personification</span>): الضباب، والمساء النائم (٧٥).</div><div class=\"li\">٤) الإحالة (<span class=\"en\">allusion</span>): دانتي، مارفل، الجامعة، هسيود، شكسبير.</div>","n":4,"i":58,"a":"analysis-01-049","x":"7c3c407e"},{"t":"learn","h":"<div class=\"li\">٥) التكرار (<span class=\"en\">repetition / anaphora</span>): «<span class=\"en\">There will be time</span>»، «<span class=\"en\">known them all</span>».</div><div class=\"li\">٦) اللازمة (<span class=\"en\">refrain</span>): «<span class=\"en\">In the room the women…</span>».</div><div class=\"li\">٧) المجاز المرسل (<span class=\"en\">metonymy</span>): معالق القهوة.</div><div class=\"li\">٨) السخرية والبطل المقلوب (<span class=\"en\">irony / mock-heroic</span>): «<span class=\"en\">Disturb the universe</span>».</div><div class=\"li\">٩) الشعر الحر (<span class=\"en\">free verse</span>) والقافية غير المنتظمة.</div>","n":5,"i":59,"a":"analysis-01-050","x":"b4fddd50"},{"t":"section","h":"الموضوعات","n":1,"i":60},{"t":"learn","h":"<div class=\"u\">الموضوعات الأساسية: الشلل والتردد (<span class=\"en\">paralysis</span>)؛ الخوف من الحكم الاجتماعي؛ العزلة في المدينة الحديثة؛ فشل التواصل؛ الشيخوخة والخوف من الجسد؛ الرغبة والخوف منها؛ والفراغ الروحي.</div>","n":1,"i":61,"a":"analysis-01-051","x":"8f6c03f4"},{"t":"learn","h":"<div class=\"u\">السؤال الساحق (<span class=\"en\">the overwhelming question</span>) مش محدد في القصيدة، وده مقصود. أي قراءة بتحدده (سؤال عن معنى الحياة، أو عن الحب، أو عن الإيمان) هي قراءة، مش نص. في الامتحان اكتب: «السؤال غير مسمى، وعدم تسميته جزء من معنى القصيدة».</div>","n":1,"i":62,"a":"analysis-01-052","x":"40871946"},{"t":"section","h":"أسئلة امتحان (على طريقة المقرر)","n":1,"i":63},{"t":"learn","h":"<div class=\"lead\">سؤال ١: «Prufrock is an anti-hero of modern city life.» ناقش بالرجوع للسطور <span dir=\"ltr\">1-74</span>.</div><div class=\"u\">عناصر الإجابة: المساء المخدر، الشوارع الرخيصة، المراقبة الاجتماعية، العجز عن السؤال، صورة السلطعون.</div>","n":2,"i":64,"a":"analysis-01-053","x":"a34647bd"},{"t":"learn","h":"<div class=\"lead\">سؤال ٢: ناقش وظيفة الإحالات (<span class=\"en\">allusions</span>) في الجزء الأول.</div><div class=\"u\">عناصر: دانتي (اعتراف بلا مستمع)، مارفل (الوقت)، الجامعة (القتل والخلق)، هسيود (الأعمال)، شكسبير (الموت الهادي). كل إحالة بتصغّر موقف البطل أو بتسخر منه.</div>","n":2,"i":65,"a":"analysis-01-054","x":"4ce6c9ab"},{"t":"learn","h":"<div class=\"lead\">سؤال ٣: حلّل صورة الضباب كقطة.</div><div class=\"u\">عناصر: تشخيص، استعارة ممتدة، حركة، أصفر صناعي، ومفارقة الحركة مقابل شلل البطل.</div>","n":2,"i":66,"a":"analysis-01-055","x":"02ccf314"},{"t":"learn","h":"<div class=\"lead\">سؤال ٤: إزاي بيعبّر إليوت عن أزمة التواصل؟</div><div class=\"u\">عناصر: الـ <span class=\"en\">you</span> الغامض، اللازمة عن الستات، «<span class=\"en\">That is not what I meant</span>» في الجزء الثاني، والأصوات الميتة.</div>","n":2,"i":67,"a":"analysis-01-056","x":"3921440d"},{"t":"section","h":"الكويز","n":1,"i":68},{"t":"mc","h":"","q":"القصيدة تُعتبر بداية لأي حركة شعرية؟","opts":["الحداثة (Modernism)","الرومانسية (Romanticism)","الشعر الفيكتوري (Victorian)"],"ans":0,"why":"الحداثة (Modernism): القصيدة بداية الشعر الحديث بالإنجليزية.","n":1,"i":69,"ex":["صح: Prufrock (1915) تُعتبر بداية الشعر الحديث بالإنجليزية: بطل عادي، مدينة حديثة، شعر حر، وسخرية.","غلط: الرومانسية كانت قبلها بحوالي قرن، وبتفضل العاطفة الكبيرة والطبيعة، عكس جو القصيدة.","غلط: الشعر الفيكتوري هو اللي القصيدة بترد عليه وبتكسره (مثل قصائد تنيسون وأرنولد)."]},{"t":"mc","h":"","q":"الاقتباس (epigraph) في أول القصيدة من فين؟","opts":["الكوميديا الإلهية لدانتي، الجحيم","الإلياذة لهوميروس","هاملت لشكسبير"],"ans":0,"why":"من Inferno XXVII لدانتي.","n":1,"i":70,"ex":["صح: من Inferno XXVII لدانتي، وكلام Guido da Montefeltro عن الاعتراف بلا مستمع.","غلط: الإلياذة ملحمة حرب، والاقتباس من مشهد اعتراف في الجحيم لدانتي.","غلط: هاملت بيتذكر في القصيدة بعد كده (سطر ١١١)، لكن الاقتباس الأول من دانتي."]},{"t":"mc","h":"","q":"الضباب في السطور <span dir=\"ltr\">15-22</span> موصوف كإنه إيه؟","opts":["قطة","كلب","حصان"],"ans":0,"why":"قطة، من غير ما إليوت يقول «زي قطة» (استعارة ممتدة).","n":1,"i":71,"ex":["صح: بيدعك ظهره، بيلحس، بيقفز، وبيتكوّر وينام — سلوك قطة.","غلط: مفيش في السطور أي سلوك كلب زي النباح أو الجري ورا حد.","غلط: الحصان مالوش علاقة؛ الصورة كلها نعومة وتلكّع وبيت."]},{"t":"mc","h":"","q":"«I have measured out my life with coffee spoons» بتعبّر عن إيه؟","opts":["حياة مقسمة لروتين تافه بدقة","حب القهوة والشاي","الغنى والرفاهية"],"ans":0,"why":"حياة مقسمة لروتين تافه بدقة.","n":1,"i":72,"ex":["صح: العمر بيتقاس بأداة صغيرة جدًا، يعني حياة مليانة مهام صغيرة بدل أحداث كبيرة.","غلط: القهوة هنا أداة قياس للعمر، مش موضوع حب.","غلط: معالق القهوة والفنادق الرخيصة بتشير لحياة عادية، مش رفاهية."]},{"t":"tf","h":"","q":"الـ «you» في السطر الأول محدد بوضوح إنه حبيبة Prufrock.","ans":false,"why":"غلط: الـ you غامض، وممكن يكون القارئ أو جزء من نفسه، والغموض مقصود.","n":1,"i":73,"ex":["غلط. القصيدة مبتقولش مين الـ you، والغموض ده جزء من معناها.","صح، الجملة غلط: الـ you غامض، وممكن يكون القارئ أو جزء من نفسه."]},{"t":"tf","h":"","q":"الجزء الأول مكتوب بشعر حر وقافية غير منتظمة.","ans":true,"why":"صح: مفيش وزن منتظم ولا نظام قافية ثابت، لكن فيه قوافي متفرقة زي go/Michelangelo.","n":1,"i":74,"ex":["صح، الجملة صح: شعر حر بقوافي متفرقة، مش نظام قافية ثابت.","غلط. القصيدة مش موزونة بانتظام، وفيها قوافي متفرقة بس."]},{"t":"recall","h":"","q":"اذكر إحالتين في السطور <span dir=\"ltr\">23-34</span> ووظيفة كل واحدة.","a":"<span class=\"en\">To His Coy Mistress</span> لمارفل: نفس فكرة «فيه وقت»، لكن هنا للتأجيل مش للفعل. وسفر الجامعة: «وقت للقتل والخلق»، بيصغّر الأعمال العظيمة لمهام. وهسيود (<span class=\"en\">Works and Days</span>): الأعمال اليومية للأيدي.","n":1,"i":75},{"t":"recall","h":"","q":"إيه اللي بتقوله صورة «pair of ragged claws» عن حالة Prufrock؟","a":"إنه بيتمنى يبقى سلطعون: بلا كلام وبلا وعي، عشان يهرب من الفشل والتواصل. رغبة في التراجع والصمت، وصورة مادية جدًا (مخالب، بحر صامت).","n":1,"i":76},{"t":"write","h":"","q":"حلّل صورة الضباب كقطة في السطور <span dir=\"ltr\">15-22</span> (<span dir=\"ltr\">4-6</span> جمل) بأدلة من النص.","key":"analysis-01:1","a":"الضباب بيتشخّص كقطة من غير تصريح: بيدعك ظهره على الشبابيك (١٥)، بيلحس زوايا المساء (١٧)، بيتلكّع على برك التصريف (١٨)، وبعدين بيقفز وبيتكوّر وينام (<span dir=\"ltr\">20-22</span>). الوظيفة: الضباب بيتحرك ويستريح، عكس البطل المشلول اللي بيقف مكانه. والأصفر الصناعي بيخلي المشهد ملوثًا مش رومانسيًا.","n":1,"i":77},{"t":"write","h":"","q":"ناقش Prufrock كبطل غير بطولي في الجزء الأول، مستشهدًا بثلاث صور على الأقل.","key":"analysis-01:2","a":"مقدمة: القصيدة بتقدّم راجل عادي في مدينة حديثة بدل بطل ملحمي. صورة ١: المساء «مريض مخدَّر» (<span dir=\"ltr\">2-3</span>) — سكون وعجز. صورة ٢: «Do I dare / Disturb the universe?» (<span dir=\"ltr\">45-46</span>) — تضخيم ساخر لتردد تافه. صورة ٣: «pair of ragged claws» (<span dir=\"ltr\">73-74</span>) — رغبة في التخلي عن الإنسانية. خاتمة: البطلية المقلوبة والمراقبة الاجتماعية هما مفتاح شخصية Prufrock.","n":1,"i":78},{"t":"end","h":"","teaser":"<div class=\"u\">الجزء الأول خلص: من دعوة المساء للسطور ٧٤، والسلطعون اللي بيتمناه.</div><div class=\"u\">الجزء الثاني: من «<span class=\"en\">And the afternoon, the evening, sleeps so peacefully!</span>» للسطر الأخير، وفيه المواجهة اللي بتحصل في الآخر.</div>","extra":"المصادر: Eliot, “The Love Song of J. Alfred Prufrock,” Poetry (June 1915); Prufrock and Other Observations (1917); Eliot, “Tradition and the Individual Talent” (1919); “Hamlet and His Problems” (1919); Dante, Inferno XXVII; Marvell, “To His Coy Mistress”; Shakespeare, Twelfth Night I.i.","i":79}];</script>
