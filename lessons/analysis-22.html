<script>window.LESSON_ID="analysis-22";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">من نحل في حداد، لعصفور عجوز بيغني في آخر يوم في القرن. القصيدة دي بتبدأ بجنازة كاملة للقرن التسعتاشر، وبتخلص بأمل الشاعر نفسه مش متأكد منه.</div><div class=\"u\">القصيدة: The Darkling Thrush لتوماس هاردي — ٤ مقاطع، ٣٢ سطر، اتكتبت في ٣١ ديسمبر ١٩٠٠، آخر يوم في القرن التسعتاشر.</div>", "n": 2, "i": 0, "a": "analysis-22-001", "x": "a2826473"}, {"t": "section", "h": "هاردي والمناسبة", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">توماس هاردي <span class=\"en\">(Thomas Hardy)</span>، 1840-1928، إنجليزي. اشتهر الأول كروائي <span class=\"en\">(Tess of the d’Urbervilles)</span>، وبعدين رجع للشعر في آخر عمره وبقى من كبار شعراء عصره.</div>", "n": 1, "i": 2, "a": "analysis-22-002", "x": "792040db"}, {"t": "learn", "h": "<div class=\"u\">المناسبة نفسها هي الموضوع: القصيدة اتكتبت يوم ٣١ ديسمبر ١٩٠٠، وعنوانها الأول كان <span class=\"en\">“By the Century’s Deathbed”</span> يعني «على سرير موت القرن». القرن التسعتاشر بيموت والقرن العشرين لسه جاي.</div>", "n": 1, "i": 3, "a": "analysis-22-003", "x": "768c38c8"}, {"t": "mc", "h": "", "q": "القصيدة اتكتبت في أي مناسبة؟", "opts": ["آخر يوم في القرن التسعتاشر (٣١ ديسمبر ١٩٠٠)", "وفاة الملكة فيكتوريا", "بداية الحرب العالمية الأولى"], "ans": 0, "why": "اتكتبت في آخر يوم في القرن التسعتاشر.", "n": 1, "i": 4, "ex": ["صح: عنوانها الأول كان «By the Century’s Deathbed»، واتكتبت في ٣١ ديسمبر ١٩٠٠.", "غلط: الملكة فيكتوريا ماتت ١٩٠١ بعد كتابة القصيدة.", "غلط: الحرب العالمية الأولى بدأت ١٩١٤، بعد القصيدة بكتير."]}, {"t": "learn", "h": "<div class=\"u\">كلمة «darkling» يعني «في الضلمة». وهاردي بيستدعي صدى من قصيدة كيتس <span class=\"en\">Ode to a Nightingale</span>: <span class=\"en\">“Darkling I listen”</span>. بس عند كيتس كان بلبل، عند هاردي بقت دخلة عجوزة.</div>", "n": 1, "i": 5, "a": "analysis-22-004", "x": "63de54a7"}, {"t": "learn", "h": "<div class=\"u\">الشكل: ٤ مقاطع، كل مقطع ٨ سطور، قافية <span class=\"en\">ababcdcd</span>، ووزن قريب من البلاد: ٤ تفاعيل ثم ٣ بالتناوب. إيقاع ثابت ورسمي زي مراسم.</div>", "n": 1, "i": 6, "a": "analysis-22-005", "x": "13a55e06"}, {"t": "section", "h": "المشهد الميت: المقطع الأول", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">I leant upon a coppice gate / When Frost was spectre-gray, / And Winter’s dregs made desolate / The weakening eye of day.</span></div>", "n": 2, "i": 8, "a": "analysis-22-006", "x": "4fec9539"}, {"t": "learn", "h": "<div class=\"u\">«اتكيت على بوابة الأجمة، والصقيع كان شبح رمادي»: الصقيع هنا شخص، يعني تشخيص <span class=\"en\">(personification)</span>. والشتاء له «رواسب» <span class=\"en\">(dregs)</span>، وعين النهار «بتضعف». كل حاجة في المشهد في طريقها للموت.</div>", "n": 1, "i": 9, "a": "analysis-22-007", "x": "9a3d549f"}, {"t": "learn", "h": "<div class=\"lead\">السطور <span dir=\"ltr\">5-8</span>:</div><div class=\"u\"><span class=\"en\">The tangled bine-stems scored the sky / Like strings of broken lyres, / And all mankind that haunted nigh / Had sought their household fires.</span></div>", "n": 2, "i": 10, "a": "analysis-22-008", "x": "93bcfc70"}, {"t": "learn", "h": "<div class=\"u\">سيقان النبات المتشابكة شقّت السما «زي أوتار قيثارات مكسورة»: صورة موسيقية مقلوبة، الأوتار موجودة بس مكسورة. والبشر كلهم دخلوا بيوتهم لنار العيلة — الشاعر لوحده بره.</div>", "n": 1, "i": 11, "a": "analysis-22-009", "x": "493c518f"}, {"t": "section", "h": "جنازة القرن: المقطع الثاني", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"lead\">السطور <span dir=\"ltr\">9-12</span>:</div><div class=\"u\"><span class=\"en\">The land’s sharp features seemed to be / The Century’s corpse outleant, / His crypt the cloudy canopy, / The wind his death-lament.</span></div>", "n": 2, "i": 13, "a": "analysis-22-010", "x": "c48e738c"}, {"t": "learn", "h": "<div class=\"u\">«ملامح الأرض الحادة بقت جثة القرن المسجاة»: الأرض نفسها جثة، والسما المغيمة قبره <span class=\"en\">(crypt)</span>، والريح مرثيته. تشبيه ممتد بيحوّل المشهد كله لجنازة رسمية للقرن.</div>", "n": 1, "i": 14, "a": "analysis-22-011", "x": "843ae4b1"}, {"t": "mc", "h": "", "q": "«The Century’s corpse outleant» بتشبّه إيه بإيه؟", "opts": ["ملامح الأرض الحادة بجثة القرن المسجاة", "السما بقبر العصفور", "الريح بأغنية"], "ans": 0, "why": "الأرض الحادة الملامح = جثة القرن.", "n": 1, "i": 15, "ex": ["صح: ملامح الأرض الحادة بتبان كأنها جثة القرن، والسما قبره، والريح مرثيته.", "غلط: القبر في الصورة هو السما المغيمة، مش قبر العصفور.", "غلط: الريح في الصورة مرثية (death-lament)، مش أغنية."]}, {"t": "learn", "h": "<div class=\"lead\">السطور <span dir=\"ltr\">13-16</span>:</div><div class=\"u\"><span class=\"en\">The ancient pulse of germ and birth / Was shrunken hard and dry, / And every spirit upon earth / Seemed fervourless as I.</span></div>", "n": 2, "i": 16, "a": "analysis-22-012", "x": "219959b2"}, {"t": "learn", "h": "<div class=\"u\">«نبض الإنبات والولادة القديم انكمش ونشف»: حتى قدرة الطبيعة على التجدد واقفة. والسطر الأخير بيربط الشاعر بالمشهد: «كل روح على الأرض بلا حماس زيي بالظبط».</div>", "n": 1, "i": 17, "a": "analysis-22-013", "x": "c873ba33"}, {"t": "section", "h": "الصوت: المقطع الثالث", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"lead\">السطور <span dir=\"ltr\">17-20</span>:</div><div class=\"u\"><span class=\"en\">At once a voice arose among / The bleak twigs overhead / In a full-hearted evensong / Of joy illimited;</span></div>", "n": 2, "i": 19, "a": "analysis-22-014", "x": "7cfa6c50"}, {"t": "learn", "h": "<div class=\"u\">«فجأة صوت طلع من وسط الأغصان العارية اللي فوق»: كلمة <span class=\"en\">evensong</span> هي صلاة الغروب في الكنيسة. والفرح هنا <span class=\"en\">illimited</span> — مش محدود، في مشهد كله حدود وموت.</div>", "n": 1, "i": 20, "a": "analysis-22-015", "x": "2ed10fc6"}, {"t": "learn", "h": "<div class=\"lead\">السطور <span dir=\"ltr\">21-24</span>:</div><div class=\"u\"><span class=\"en\">An aged thrush, frail, gaunt, and small, / In blast-beruffled plume, / Had chosen thus to fling his soul / Upon the growing gloom.</span></div>", "n": 2, "i": 21, "a": "analysis-22-016", "x": "8695ffb2"}, {"t": "learn", "h": "<div class=\"u\">«دخلة عجوزة، ضعيفة ونحيفة وصغيرة، وريشها متكسر من العاصفة»: المغني مش بطل، هو مخلوق منهك زي المشهد بالظبط. ومع كده «اختار يرمي روحه على الضلمة اللي بتكبر» — كلمة «اختار» هي المفتاح.</div>", "n": 1, "i": 22, "a": "analysis-22-017", "x": "986f8d82"}, {"t": "tf", "h": "", "q": "العصفور في القصيدة مخلوق قوي ومنتصر على العاصفة.", "ans": false, "why": "غلط: العصفور «aged, frail, gaunt, and small» وريشه متكسر من العاصفة — منهك زي المشهد بالظبط.", "n": 1, "i": 23, "ex": ["غلط. وصف العصفور كله ضعف وإنهاك.", "صح، الجملة غلط: القوة في قراره إنه يغني، مش في جسمه."]}, {"t": "section", "h": "الأمل الغامض: المقطع الرابع", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"lead\">السطور <span dir=\"ltr\">25-28</span>:</div><div class=\"u\"><span class=\"en\">So little cause for carolings / Of such ecstatic sound / Was written on terrestrial things / Afar or nigh around,</span></div>", "n": 2, "i": 25, "a": "analysis-22-018", "x": "c3146993"}, {"t": "learn", "h": "<div class=\"u\">«مفيش أي سبب مكتوب على الأرض، قريب ولا بعيد، يبرر ترانيم بالحجم ده»: الشاعر بيدور على مبرر منطقي للأغنية ومش لاقي. وده اللي بيجهز الاستنتاج الأخير.</div>", "n": 1, "i": 26, "a": "analysis-22-019", "x": "413795bb"}, {"t": "learn", "h": "<div class=\"lead\">السطور <span dir=\"ltr\">29-32</span>:</div><div class=\"u\"><span class=\"en\">That I could think there trembled through / His happy good-night air / Some blessed Hope, whereof he knew / And I was unaware.</span></div>", "n": 2, "i": 27, "a": "analysis-22-020", "x": "e9b7e275"}, {"t": "mc", "h": "", "q": "«Some blessed Hope, whereof he knew / And I was unaware» معناها إيه؟", "opts": ["العصفور عارف أمل الشاعر مش عارفه", "الشاعر اكتشف إيمانه أخيرًا", "العصفور بيودع الشاعر"], "ans": 0, "why": "الأمل عند العصفور مش عند الشاعر.", "n": 1, "i": 28, "ex": ["صح: الأمل «he knew and I was unaware» — العصفور هو اللي عارف، والشاعر لسه بره.", "غلط: «could think» احتمال مش إيمان، الشاعر مأكدش.", "غلط: «good-night air» هي نغمة مساء الخير بتاعة العصفور، مش وداع للشاعر."]}, {"t": "learn", "h": "<div class=\"u\">«إني أقدر أفتكر إن فيه أمل مقدس بيرتجف في أغنيته، هو عارفه وأنا مش واخد بالي منه». الاختيار اللفظي هو كل القصيدة: «could think» مش «believed» — الشاعر بيسمح لنفسه بالاحتمال بس، مش بيؤمن.</div>", "n": 1, "i": 29, "a": "analysis-22-021", "x": "c893546c"}, {"t": "tf", "h": "", "q": "في نهاية القصيدة الشاعر بيؤمن بالأمل اللي العصفور بيغنيه.", "ans": false, "why": "غلط: الشاعر قال «I could think» — احتمال بس، مش إيمان. الأمل عند العصفور، والشاعر «unaware».", "n": 1, "i": 30, "ex": ["غلط. «could think» بتفتح احتمال من غير ما تؤكده.", "صح، الجملة غلط: الشاعر مش بيؤمن، هو بيسمح لنفسه بالاحتمال."]}, {"t": "section", "h": "الأدوات والموضوعات", "n": 1, "i": 31}, {"t": "learn", "h": "<div class=\"u\">التشبيه الممتد <span class=\"en\">(extended metaphor)</span>: المقطع التاني كله تشبيه واحد: الأرض جثة القرن، والسما القبر، والريح المرثية. الطبيعة كلها مشاركة في جنازة رمزية.</div>", "n": 1, "i": 32, "a": "analysis-22-022", "x": "648090a0"}, {"t": "learn", "h": "<div class=\"u\">الصوت مقابل الصمت: أوتار قيثارة مكسورة في الأول، وفي النص أغنية <span class=\"en\">full-hearted</span>. القصيدة مبنية على الانتقال من مشهد بلا صوت لصوت بلا سبب.</div>", "n": 1, "i": 33, "a": "analysis-22-023", "x": "a8e45850"}, {"t": "mc", "h": "", "q": "إيه اللي بيميز أغنية العصفور عن المشهد كله؟", "opts": ["فرح مش محدود في مشهد كله موت وصمت", "صوت عالي بيغطي على الريح", "لحن حزين مناسب للجنازة"], "ans": 0, "why": "الأغنية فرح بلا سبب ظاهر في مشهد ميت.", "n": 1, "i": 34, "ex": ["صح: الأغنية «full-hearted evensong of joy illimited» في مشهد كله رمادية وموت.", "غلط: القصيدة مش عن علو الصوت، هي عن الفرح اللي مالوش مبرر ظاهر.", "غلط: الأغنية فرح، مش حزن."]}, {"t": "learn", "h": "<div class=\"u\">الموضوعات: نهاية عصر وبداية عصر، والتشاؤم مقابل الأمل، وأزمة الإيمان الفيكتورية. هاردي مش بيعلن إيمان، هو بيسجل إن الأمل ممكن يكون موجود في مكان هو مش فيه.</div>", "n": 1, "i": 35, "a": "analysis-22-024", "x": "43eab14b"}, {"t": "learn", "h": "<div class=\"u\">والقراءات متقسمة: بعضها بيشوف النهاية متفائلة — الأمل موجود حتى لو الشاعر مش حاسس بيه. وبعضها بيشوفها أقسى: الأمل ملك العصفور بس، والإنسان بره.</div>", "n": 1, "i": 36, "a": "analysis-22-025", "x": "fbfb7623"}, {"t": "section", "h": "أسئلة الامتحان", "n": 1, "i": 37}, {"t": "recall", "h": "", "q": "اشرح التشبيه الممتد في المقطع الثاني.", "a": "المقطع الثاني كله تشبيه واحد ممتد: ملامح الأرض الحادة هي «جثة القرن المسجاة» (The Century’s corpse outleant)، والسما المغيمة هي قبره (crypt)، والريح هي مرثية الموت بتاعته (death-lament). وبعدين التشبيه بيكمل لجوا الطبيعة نفسها: «نبض الإنبات والولادة القديم انكمش ونشف»، يعني حتى قدرة الأرض على الحياة الجديدة واقفة. التشبيه الممتد ده بيحوّل منظر شتوي عادي لجنازة رمزية كاملة لقرن بيموت، وبيبرر ليه أي صوت فرح بعده هيبقى صادم.", "n": 1, "i": 38}, {"t": "recall", "h": "", "q": "إزاي القصيدة بتنتقل من التشاؤم للأمل؟", "a": "الانتقال بيحصل على مرحلتين. الأولى: القصيدة بتبني مشهد ميت بالكامل في مقطعين — صقيع شبح، أوتار مكسورة، جثة قرن، وروح بلا حماس. التانية: فجأة «At once a voice arose» — صوت بيطلع من غير مقدمات، والمفارقة إن صاحبه مش بطل: دخلة عجوزة وضعيفة وريشها متكسر. القوة مش في العصفور، في قراره إنه «يرمي روحه على الضلمة». وبعدها الشاعر بيدور على مبرر للأغنية ومش لاقي، فبيوصل لاستنتاج حذر: يمكن فيه «أمل مقدس» العصفور عارفه وهو لأ. الأمل داخل القصيدة كاحتمال، مش كحقيقة.", "n": 1, "i": 39}, {"t": "write", "h": "", "q": "حلّل صورة العصفور ودوره في القصيدة.", "key": "analysis-22:1", "a": "العصفور هو نقطة التحول الوحيدة في القصيدة. وصفه كله ضعف: «aged, frail, gaunt, and small» وريشه «blast-beruffled» — متكسر من العاصفة. يعني المغني جزء من المشهد الميت، مش استثناء منه. لكن الفعل بيقلب الصورة: «Had chosen thus to fling his soul / Upon the growing gloom». كلمة «اختار» بتديله إرادة، وكلمة «يرمي روحه» بتخلي الغناء فعل كامل مش مجرد صوت. الدور الدرامي: هو الدليل الوحيد إن الفرح ممكن يوجد من غير مبرر. وبكده بيفتح للشاعر باب الاحتمال: «Some blessed Hope, whereof he knew / And I was unaware». بعض القراءات بتشوف العصفور رمز للإيمان اللي العصر فقده، وقراءات تانية بتشوفه مجرد عصفور بيغني — وقوته إنه مش محتاج سبب.", "n": 1, "i": 40}, {"t": "write", "h": "", "q": "ناقش نهاية القصيدة: هل هي نهاية متفائلة؟", "key": "analysis-22:2", "a": "النهاية معلقة بين التفسيرين، وكلمة «could» هي اللي ماسكاها. من ناحية، فيه أمل حقيقي داخل القصيدة لأول مرة: «Some blessed Hope» وبصفة «مقدس». ومن ناحية تانية، الأمل ده مش بتاع الشاعر: العصفور «knew» والشاعر «unaware». يعني النهاية مش إعلان إيمان، هي اعتراف باحتمال. القراءة المتفائلة بتقول: كفاية إن الشاعر بقى قادر «يفتكر» الأمل بعد مقطعين من الموت الكامل، وده تحول. والقراءة المتشائمة بتقول: الأمل موجود بس في كائن تاني، والإنسان بره. والقراءة المتوازنة: هاردي بيسجل لحظة فتح صغيرة في آخر يوم في القرن — القرن الجديد ممكن يجيب حاجة، بس مفيش حد يقدر يأكد.", "n": 1, "i": 41}, {"t": "end", "h": "", "teaser": "<div class=\"u\">كده The Darkling Thrush خلصت، ومعاها بلوك التحليل كله: ١٢ قصيدة من Sonnet 43 لحد عصفور هاردي. من الحب، للموت، للأمل الغامض — كده عندك خريطة كاملة للقصايد المطلوبة.</div><div class=\"u\">راجع الكروت اللي فاتت، وارجع لأي قصيدة تحتاجها قبل الامتحان. بالتوفيق!</div>", "extra": "", "i": 42}];</script>
