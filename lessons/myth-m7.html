<h1>الدرس M7: Sisyphus — أشهر عقوبة في التاريخ</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس M7</span><span class="tag"><span class="em">🏛️</span> كورس الميثولوجيا</span></div>

<script>window.LESSON_ID="myth-m7";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 1) مين <span class=\"en\">Sisyphus</span>؟</div><div class=\"li\">ملك كورنث (<span class=\"en\">Corinth</span>)، وابن <span class=\"en\">Aeolus.</span> ومن حفيده هتعرفه بعدين: <span class=\"en\">Bellerophon</span> فارس الـ <span class=\"en\">Pegasus.</span></div><div class=\"li\">هوميروس بيقدمه في <span class=\"en\">Iliad</span> الكتاب 6 بلقب واحد:</div><div class=\"u\">\"<span class=\"en\">Sisyphus lived,</span> <span class=\"en\">who was the craftiest of all mankind</span>\"</div><div class=\"u\">(\"عاش سيزيف، أخبث وأمكر البشر كلهم.\") مش أقواهم ولا أشجعهم: أمكرهم. بطل الأسطورة دي عقله مش عضلاته.</div>", "n": 5, "i": 0, "a": "myth-m7-001", "x": "d7b15642"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 2) جرايمه (حسب الروايات اللاحقة — <span class=\"en\">Apollodorus</span> وغيره)</div><div class=\"u\">ملحوظة أمانة علمية: هوميروس نفسه ماقالش ليه اتعاقب؛ الحكايات التالية من مصادر أحدث، والنسخ بتختلف. ودي عادة كويسة تتعودها: الأسطورة ليها نسخ مش نص واحد مقدس.</div>", "n": 2, "i": 1, "a": "myth-m7-002", "x": "d024e864"}, {"t": "learn", "h": "<div class=\"u\">١) فضح سر <span class=\"en\">Zeus</span>: <span class=\"en\">Zeus</span> خطف بنت إله النهر <span class=\"en\">Asopus</span> (اسمها <span class=\"en\">Aegina</span>)، فـ <span class=\"en\">Sisyphus</span> قال لأبوها مكانها مقابل إنه يعمل عين مية لمدينته. باع سر إله بمية.</div><div class=\"u\">٢) قيّد الموت نفسه: لما جه <span class=\"en\">Thanatos</span> (الموت) ياخده، <span class=\"en\">Sisyphus</span> خدعه وكبّله بالسلاسل. النتيجة؟ محدش في الدنيا بقى بيموت! لحد ما <span class=\"en\">Ares</span> (إله الحرب — اللي زهق من حرب بلا موتى) فك الموت من السلاسل.</div>", "n": 2, "i": 2, "a": "myth-m7-003", "x": "b6b943cc"}, {"t": "learn", "h": "<div class=\"u\">٣) خدعة الجنازة: أوصى مراته ماتعملوش مراسم الدفن. لما نزل <span class=\"en\">Hades</span>، اشتكى: \"مراتي مادفنتنيش، سيبوني أطلع أوبخها وأرجع\". وطلع... وعاش لحد الشيخوخة وماردش. لحد ما اتسحب بالعافية في الآخر.</div><div class=\"li\">لاحظ الخيط المشترك: كل جريمة فيهم تحدي لنظام الكون نفسه — سر الآلهة، قانون الموت، إجراءات الدفن (افتكر العالم السفلي). الراجل كان بيختبر: هل القواعد دي فعلاً مابتتكسرش؟</div>", "n": 2, "i": 3, "a": "myth-m7-004", "x": "49823c82"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 3) العقوبة: الحجر</div><div class=\"u\"><span class=\"en\">Odysseus</span> شافه في العالم السفلي (افتكر خريطة العالم السفلي). النص من <span class=\"en\">Odyssey 11.593-600</span> بترجمة <span class=\"en\">Murray</span>:</div>", "n": 2, "i": 4, "a": "myth-m7-005", "x": "010a4a3f"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Aye,</span> <span class=\"en\">and I saw Sisyphus in violent torment,</span> <span class=\"en\">seeking to raise a monstrous stone with both his hands.</span> <span class=\"en\">Verily he would brace himself with hands and feet,</span> <span class=\"en\">and thrust the stone toward the crest of a hill,</span> <span class=\"en\">but as often as he was about to heave it over the top,</span> <span class=\"en\">the weight would turn it back,</span> <span class=\"en\">and then down again to the plain would come rolling the ruthless stone.</span> <span class=\"en\">But he would strain again and thrust it back,</span> <span class=\"en\">and the sweat flowed down from his limbs,</span> <span class=\"en\">and dust rose up from his head.</span>\"</div>", "n": 1, "i": 5, "a": "myth-m7-006", "x": "0c3bc52b"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">and I saw Sisyphus in _____ torment,</div>", "opts": ["often", "crest", "violent"], "ans": 2, "why": "<span class=\"en\">and I saw Sisyphus in violent torment,</span>", "i": 6, "ex": ["\"often\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"violent\".", "\"crest\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"violent\".", "صح، دي الكلمة اللي في القصيدة."]}, {"t": "learn", "h": "<div class=\"u\">(\"شفت سيزيف في عذاب شديد، بيحاول يرفع حجر ضخم بإيديه الاتنين. يتسنّد بإيديه ورجليه ويدفع الحجر ناحية قمة التل، بس كل ما يقرب يعدّي القمة، الوزن يرجعه، والحجر القاسي يتدحرج للسهل تاني. وهو يشد نفسه ويدفعه من جديد، والعرق بينزل من أطرافه، والتراب طالع من راسه.\")</div>", "n": 1, "i": 7, "a": "myth-m7-007", "x": "7daf4ae5"}, {"t": "learn", "h": "<div class=\"li\">ركّز في التفاصيل: \"كل ما يقرب يعدّي القمة\" — العذاب مش في الشغل، العذاب في القرب من النهاية والرجوع للصفر.</div><div class=\"li\">و\"لكنه يشد نفسه من جديد\" — هو مش مكسور، هو مداوم. النقطة دي هي اللي <span class=\"en\">Camus</span> هياخدها بعد 2800 سنة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 4) المعنى الأول: العقوبة على مقدار الذنب</div>", "n": 3, "i": 8, "a": "myth-m7-008", "x": "11a5fbc9"}, {"t": "learn", "h": "<div class=\"li\">في نظام <span class=\"en\">Tartarus</span> (من خريطة العالم السفلي)، كل عقوبة مصممة على صاحبها: اللي بيعيش بالمكر واللف والدوران... يقضي أبديته في لف ودوران ميفضيش.</div><div class=\"li\">اللي بيكسر القواعد بذكاء، اتعاقب بعمل ميستاهلوش ذكي: شغل بلا معنى.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 5) المعنى التاني: <span class=\"en\">Camus</span> وسيزيف السعيد</div>", "n": 3, "i": 9, "a": "myth-m7-009", "x": "d3c6dcf6"}, {"t": "learn", "h": "<div class=\"li\">الفيلسوف الجزائري-الفرنسي <span class=\"en\">Albert Camus</span> كتب مقال فلسفي مشهور اسمه \"<span class=\"en\">The Myth of Sisyphus</span>\" (1942، ترجمة إنجليزية لـ <span class=\"en\">Justin O'Brien</span>).</div><div class=\"li\">فكرته: حياة الإنسان زي حجر سيزيف بالظبط — شغلنا وتعبنا اليومي بيتكرر، والكون مابيجاوبش على سؤال \"ليه\". ده اللي بيسميه \"العبث\" (<span class=\"en\">the Absurd</span>).</div>", "n": 2, "i": 10, "a": "myth-m7-010", "x": "b0f2e3f1"}, {"t": "learn", "h": "<div class=\"li\">بس الحل مش الاستسلام: لما سيزيف بينزل من الجبل ورا حجره، هو واعي تماماً بمصيره، والوعي ده نفسه هو انتصاره. العقوبة بتتحول لملكيته هو.</div><div class=\"li\">الجملة الختامية المشهورة في المقال:</div><div class=\"u\">\"<span class=\"en\">One must imagine Sisyphus happy.</span>\"</div><div class=\"u\">(\"لازم نتخيل سيزيف سعيد.\")</div><div class=\"li\">ليه الكلام ده مهم ليك في الكورس؟ لأنه النموذج الكامل لـ \"إعادة القراءة\": الأسطورة مش بتموت، كل عصر بيقرأها بسؤاله.</div>", "n": 5, "i": 11, "a": "myth-m7-011", "x": "0b8ec7c0"}, {"t": "learn", "h": "<div class=\"li\">هوميروس شاف عذاب ماكر، و<span class=\"en\">Camus</span> شاف بطل حر. ده تمهيد للمستوى 9 (النظريات).</div>", "n": 1, "i": 12, "a": "myth-m7-012", "x": "f5b39e03"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 6) الأسطورة في الشعر الإنجليزي:</div><div class=\"li\">كلمة \"<span class=\"en\">Sisyphean</span>\" بقت صفة إنجليزية عادية: \"<span class=\"en\">a Sisyphean task</span>\" = مهمة مستحيلة بتتكرر بلا نتيجة.</div><div class=\"li\">هتلاقيها في المقالات والأخبار أكتر من القصائد، لكن وجودها نفسه إثبات إن الأسطورة عايشة في اللغة.</div>", "n": 2, "i": 13, "a": "myth-m7-013", "x": "8598ee20"}, {"t": "learn", "h": "<div class=\"li\">وفي الشعر الحديث، سيزيف بيظهر كل ما شاعر يتكلم عن الشغل اليومي المتكرر بلا معنى — افتكر الاسم لما تقابل صورة \"الجهد اللي بيرجع لنقطة الصفر\" في أي نص.</div>", "n": 1, "i": 14, "a": "myth-m7-014", "x": "ee03e3b3"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 7) كلمات من درس النهارده:</div><div class=\"u\"><span class=\"en\">Sisyphean</span> • \"<span class=\"en\">the Absurd</span>\" (مصطلح <span class=\"en\">Camus</span>) • <span class=\"en\">crafty</span> (من لقب هوميروس: <span class=\"en\">craftiest</span>).</div>", "n": 1, "i": 15, "a": "myth-m7-015", "x": "62b46b8a"}, {"t": "write", "h": "", "q": "اكتب لقب <span class=\"en\">Sisyphus</span> في <span class=\"en\">Iliad 6</span> واشرح ليه \"المكر\" هو سبب صعوده وسقوطه معاً.", "key": "myth-m7:1", "n": 1, "i": 16}, {"t": "write", "h": "", "q": "احكِ الجرايم التلاتة، وبين الخيط المشترك بينهم. وليه قلنا إن مصادرهم \"أحدث من هوميروس\"؟", "key": "myth-m7:2", "n": 1, "i": 17}, {"t": "write", "h": "", "q": "من نص <span class=\"en\">Odyssey 11</span>: استخرج تفصيلتين بيوجعوا القارئ في وصف العقوبة، واشرح وظيفة كل واحدة.", "key": "myth-m7:3", "n": 1, "i": 18}, {"t": "write", "h": "", "q": "اشرح مفهوم \"العبث\" عند <span class=\"en\">Camus</span>، وإزاي \"النزول من الجبل\" هو لحظة الانتصار؟", "key": "myth-m7:4", "n": 1, "i": 19}, {"t": "write", "h": "", "q": "ترجم واشرح: \"<span class=\"en\">One must imagine Sisyphus happy</span>\"، وقول إزاي الجملة دي مثال على \"إعادة قراءة الأسطورة\".", "key": "myth-m7:5", "n": 1, "i": 20}, {"t": "end", "h": "", "teaser": "", "extra": "(المصادر: <span class=\"en\">Homer,</span> <span class=\"en\">Odyssey 11.593-600</span> (ترجمة <span class=\"en\">Murray)</span>؛ <span class=\"en\">Iliad 6</span> (ترجمة <span class=\"en\">Butler)</span>؛ <span class=\"en\">Apollodorus</span> للجرائم؛ <span class=\"en\">Camus,</span> <span class=\"en\">The Myth of Sisyphus 1942</span> (ترجمة <span class=\"en\">O'Brien)</span>. الاقتباسات متراجعة على <span class=\"en\">theoi.com</span> و<span class=\"en\">MIT Classics)</span><span class=\"em\"><span class=\"em\">🔗</span></span> روابط:<ul><li><span class=\"en\">Homer,</span> <span class=\"en\">Odyssey</span> الكتاب 11 (ترجمة <span class=\"en\">Murray</span> — سيزيف وطنطالوس): <a class=\"en\" href=\"https://www.theoi.com/Text/HomerOdyssey11.html\" target=\"_blank\" rel=\"noopener\">https://www.theoi.com/Text/HomerOdyssey11.html</a></li><li><span class=\"en\">Homer,</span> <span class=\"en\">Iliad</span> الكتاب 6 (ترجمة <span class=\"en\">Butler</span> — نسب سيزيف): <a class=\"en\" href=\"https://classics.mit.edu/Homer/iliad.6.vi.html\" target=\"_blank\" rel=\"noopener\">https://classics.mit.edu/Homer/iliad.6.vi.html</a></li><li><span class=\"en\">Camus,</span> <span class=\"en\">The Myth of Sisyphus</span> (مقال عن الكتاب): <a class=\"en\" href=\"https://en.wikipedia.org/wiki/The_Myth_of_Sisyphus\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/The_Myth_of_Sisyphus</a></li></ul>", "i": 21}];</script>
