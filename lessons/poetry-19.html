<script>window.LESSON_ID="poetry-19";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة ٤ أدوات مرتبطين ببعض. اتنين بيستبدلوا كلمة بكلمة قريبة منها (<span class=\"en\">metonymy<\/span> و <span class=\"en\">synecdoche<\/span>)، واتنين بيجمعوا المتناقضات (<span class=\"en\">oxymoron<\/span> و <span class=\"en\">paradox<\/span>). <span class=\"em\"><span class=\"em\">⚡<\/span><\/span><\/div>", "n": 1, "i": 0, "a": "poetry-19-001", "x": "8c91dc90"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: الـ <span class=\"en\">metonymy<\/span> — الاسم المستعار <span class=\"em\"><span class=\"em\">🏛️<\/span><\/span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١) التعريف<\/div><div class=\"u\">١.١ <span class=\"en\">metonymy<\/span> (كناية مجازية / مجاز مرسل) = تشير لحاجة باسم حاجة تانية مرتبطة بيها. (<span class=\"en\">Wikipedia<\/span>)<\/div><div class=\"u\">١.٢ الكلمة يونانية: <span class=\"en\">met<\/span>ō<span class=\"en\">num<\/span>í<span class=\"en\">a<\/span> = \"تغيير الاسم\".<\/div><div class=\"u\">٢) أمثلة (من <span class=\"en\">Wikipedia<\/span>)<\/div><div class=\"u\">٢.١ \"<span class=\"en\">suit<\/span>\" = رجل أعمال أو محامي (لأنهم بيلبسوا بدل).<\/div><div class=\"u\">٢.٢ \"<span class=\"en\">the Crown<\/span>\" = الملكية البريطانية.<\/div><div class=\"u\">٢.٣ \"<span class=\"en\">the press<\/span>\" = الصحافة (بسبب المطبعة).<\/div>", "n": 7, "i": 2, "a": "poetry-19-002", "x": "c93e89fc"}, {"t": "learn", "h": "<div class=\"u\">٢.٤ \"<span class=\"en\">Washington<\/span>\" = الحكومة الأمريكية. \"<span class=\"en\">Westminster<\/span>\" = حكومة بريطانيا.<\/div><div class=\"u\">٢.٥ \"<span class=\"en\">The pen is mightier than the sword<\/span>\" = القلم (الكلام) أقوى من السيف (الحرب).<\/div><div class=\"u\">٢.٦ مثال عربي: \"القاهرة قررت\" = الحكومة المصرية. <span class=\"em\"><span class=\"em\">😄<\/span><\/span><\/div><div class=\"u\">٣) الفرق عن الاستعارة (<span class=\"en\">metaphor<\/span>)<\/div><div class=\"u\">٣.١ الاستعارة بتشبّه بجامع تشابه. الـ <span class=\"en\">metonymy<\/span> بتستبدل بجامع ارتباط وقرب. (<span class=\"en\">Wikipedia<\/span>)<\/div>", "n": 5, "i": 3, "a": "poetry-19-003", "x": "c951e4ff"}, {"t": "learn", "h": "<div class=\"u\">٣.٢ مفيش حاجة \"تاجية\" في الملك، بس التاج مرتبط بيه.<\/div>", "n": 1, "i": 4, "a": "poetry-19-004", "x": "6741c4bb"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: الـ <span class=\"en\">synecdoche<\/span> — الجزء بدل الكل <span class=\"em\"><span class=\"em\">👢<\/span><\/span>", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">١) التعريف<\/div><div class=\"u\">١.١ <span class=\"en\">synecdoche<\/span> (مجاز بالجزء) = نوع من الـ <span class=\"en\">metonymy<\/span>: بتستخدم جزء عشان تقصد الكل (<span class=\"en\">pars pro toto<\/span>) أو العكس (<span class=\"en\">totum pro parte<\/span>). (<span class=\"en\">Wikipedia<\/span>)<\/div><div class=\"u\">١.٢ يونانية: <span class=\"en\">sunekdokh<\/span>ḗ = \"فهم متزامن\".<\/div><div class=\"u\">٢) أمثلة<\/div><div class=\"u\">٢.١ \"<span class=\"en\">boots on the ground<\/span>\" = جنود.<\/div><div class=\"u\">٢.٢ \"<span class=\"en\">wheels<\/span>\" = سيارة. \"<span class=\"en\">suits<\/span>\" = رجال أعمال (<span class=\"en\">Wikipedia<\/span> بتعتبرها <span class=\"en\">synecdoche<\/span> مثال شائع).<\/div>", "n": 6, "i": 6, "a": "poetry-19-005", "x": "a4f71df1"}, {"t": "learn", "h": "<div class=\"u\">٢.٣ \"<span class=\"en\">I need a hand<\/span>\" = محتاج شخص يساعدني (الجزء بدل الكل).<\/div><div class=\"u\">٢.٤ \"<span class=\"en\">the world<\/span>\" وأنت تقصد دولة أو جزء بس (العكس: الكل بدل الجزء).<\/div><div class=\"u\">٣) في الشعر<\/div><div class=\"u\">٣.١ <span class=\"en\">Wikipedia<\/span> بتقول إن قصايد الحب (خصوصاً <span class=\"en\">Petrarchan sonnet<\/span>) كتير بتوصف الحبيبة عضو عضو (جزء بدل الكل).<\/div><div class=\"u\">٤) ملحوظة <span class=\"em\"><span class=\"em\">⚠️<\/span><\/span><\/div><div class=\"u\">٤.١ \"<span class=\"en\">the crown<\/span>\" بدل الملك مش <span class=\"en\">synecdoche<\/span>، لأن التاج مش جزء من الملك. ده <span class=\"en\">metonymy.<\/span> (<span class=\"en\">Wikipedia - Lanham<\/span>)<\/div>", "n": 6, "i": 7, "a": "poetry-19-006", "x": "adbbf30d"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: الـ <span class=\"en\">oxymoron<\/span> — كلمتين عكس بعض <span class=\"em\"><span class=\"em\">❄️🔥<\/span><\/span>", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">١) التعريف<\/div><div class=\"u\">١.١ <span class=\"en\">oxymoron<\/span> = كلمات متناقضة في معناها جنب بعض في عبارة واحدة. أمثلة <span class=\"en\">Wikipedia<\/span>: \"<span class=\"en\">bittersweet<\/span>\" (حلو مر) و \"<span class=\"en\">cruel kindness<\/span>\" (قسوة حنونة).<\/div><div class=\"u\">١.٢ يونانية: <span class=\"en\">ox<\/span>ú<span class=\"en\">s<\/span> \"حاد\" + <span class=\"en\">m<\/span>ō<span class=\"en\">ros<\/span> \"غبي\". يعني الكلمة نفسها <span class=\"en\">oxymoron<\/span>: \"حاد-غبي\"! (<span class=\"en\">Wikipedia<\/span> بتقول الكلمة نفسها مثال على <span class=\"en\">oxymoron.<\/span>)<\/div><div class=\"u\">٢) أمثلة من الأدب (<span class=\"en\">Wikipedia<\/span>)<\/div>", "n": 4, "i": 9, "a": "poetry-19-007", "x": "198ebb99"}, {"t": "learn", "h": "<div class=\"u\">٢.١ <span class=\"en\">Shakespeare<\/span>، <span class=\"en\">Romeo and Juliet<\/span> (<span class=\"en\">Romeo<\/span>): \"<span class=\"en\">O brawling love<\/span>! <span class=\"en\">O loving hate<\/span>! ... <span class=\"en\">O heavy lightness,<\/span> <span class=\"en\">serious vanity<\/span>! ... <span class=\"en\">Feather of lead,<\/span> <span class=\"en\">bright smoke,<\/span> <span class=\"en\">cold fire,<\/span> <span class=\"en\">sick health<\/span>! <span class=\"en\">Still-waking sleep,<\/span> <span class=\"en\">that is not what it is<\/span>!\"<\/div><div class=\"u\">٢.٢ \"<span class=\"en\">darkness visible<\/span>\" (<span class=\"en\">Milton<\/span>). \"<span class=\"en\">beggarly riches<\/span>\" (<span class=\"en\">Donne<\/span>). \"<span class=\"en\">melancholy merriment<\/span>\" (<span class=\"en\">Byron<\/span>).<\/div>", "n": 2, "i": 10, "a": "poetry-19-008", "x": "03e9310d"}, {"t": "learn", "h": "<div class=\"u\">٢.٣ أمثلة مصرية: \"فرحة حزينة\"، \"صمت صاخب\".<\/div><div class=\"u\">٣) ليه الشاعر بيستخدمه؟<\/div><div class=\"u\">٣.١ عشان يعبر عن شعور مختلط (حب ممزوج بألم) (قراءة).<\/div><div class=\"u\">٤) <span class=\"en\">oxymoron<\/span> ضحك (<span class=\"en\">comical<\/span>)<\/div><div class=\"u\">٤.١ كوميديان <span class=\"en\">George Carlin<\/span> (١٩٧٥) اشتهر بقوله \"<span class=\"en\">military intelligence<\/span>\" و \"<span class=\"en\">business ethics<\/span>\" كأمثلة ساخرة. (<span class=\"en\">Wikipedia<\/span>)<\/div>", "n": 5, "i": 11, "a": "poetry-19-009", "x": "828773d4"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: الـ <span class=\"en\">paradox<\/span> — المفارقة المنطقية <span class=\"em\"><span class=\"em\">🌀<\/span><\/span>", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">١) التعريف<\/div><div class=\"u\">١.١ <span class=\"en\">paradox<\/span> = عبارة متناقضة ظاهرياً أو ضد التوقع، بس ممكن تخبي حقيقة. (<span class=\"en\">Wikipedia<\/span>: \"<span class=\"en\">logically self-contradictory statement or a statement that runs contrary to expectations<\/span>\")<\/div><div class=\"u\">٢) الفرق بينه وبين <span class=\"en\">oxymoron<\/span><\/div><div class=\"u\">٢.١ <span class=\"en\">oxymoron<\/span> = كلمتين متناقضتين جنب بعض (صغير: عبارة).<\/div>", "n": 4, "i": 13, "a": "poetry-19-010", "x": "21f02cb0"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ <span class=\"en\">paradox<\/span> = فكرة كاملة متناقضة ظاهرياً (جملة أو أكتر). (<span class=\"en\">Wikipedia<\/span> بتقول إن <span class=\"en\">oxymoron<\/span> بيوضح <span class=\"en\">paradox.<\/span>)<\/div><div class=\"u\">٣) مثال شعري: <span class=\"en\">John Donne<\/span>، <span class=\"en\">Holy Sonnet X<\/span> (<span class=\"en\">Death Be Not Proud<\/span>)<\/div><div class=\"u\">\"<span class=\"en\">Death be not proud,<\/span> <span class=\"en\">though some have called thee<\/span> / <span class=\"en\">Mighty and dreadfull,<\/span> <span class=\"en\">for,<\/span> <span class=\"en\">thou art not soe,<\/span>\"<\/div>", "n": 3, "i": 14, "a": "poetry-19-011", "x": "9676a530"}, {"t": "learn", "h": "<div class=\"u\">٣.١ النهاية: \"<span class=\"en\">One short sleepe past,<\/span> <span class=\"en\">wee wake eternally,<\/span> / <span class=\"en\">And death shall be no more<\/span>; <span class=\"en\">death,<\/span> <span class=\"en\">thou shalt die.<\/span>\"<\/div><div class=\"u\">٣.٢ (نص <span class=\"en\">Wikipedia<\/span> بالإملاء القديم لعام ١٦٣٣.) الموت هيموت! دي تبدو متناقضة، لكن المعنى: بعد القيامة مفيش موت. (قراءة)<\/div>", "n": 2, "i": 15, "a": "poetry-19-012", "x": "db144696"}, {"t": "learn", "h": "<div class=\"u\">٣.٣ <span class=\"en\">Wikipedia<\/span>: كتبها <span class=\"en\">Donne<\/span> بين فبراير وأغسطس ١٦٠٩، ونُشرت في ١٦٣٣. وزنها <span class=\"en\">ABBA ABBA CDDC EE.<\/span> والسطر الأخير بيشير لرسالة كورنثوس الأولى ١٥:٢٦.<\/div><div class=\"u\">٣.٤ (اعتبار القصيدة <span class=\"en\">paradox<\/span>: قراءة، مش وصف من <span class=\"en\">Wikipedia.<\/span>)<\/div><div class=\"u\">٤) أمثلة <span class=\"en\">paradox<\/span> من <span class=\"en\">Wikipedia<\/span> (غير شعرية)<\/div><div class=\"u\">٤.١ سفينة <span class=\"en\">Theseus<\/span>: لو غيرنا كل ألواحها واحدة واحدة، هل هي نفس السفينة؟<\/div>", "n": 4, "i": 16, "a": "poetry-19-013", "x": "5cbf3db2"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅<\/span><\/span>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">١) الملخص<\/div><div class=\"u\">١.١ <span class=\"en\">metonymy<\/span>: اسم حاجة مرتبطة (<span class=\"en\">the Crown<\/span>، <span class=\"en\">the press<\/span>، <span class=\"en\">Washington<\/span>).<\/div><div class=\"u\">١.٢ <span class=\"en\">synecdoche<\/span>: جزء بدل كل أو العكس (<span class=\"en\">boots<\/span>، <span class=\"en\">wheels<\/span>، <span class=\"en\">hand<\/span>).<\/div><div class=\"u\">١.٣ <span class=\"en\">oxymoron<\/span>: كلمتين متناقضتين (<span class=\"en\">bittersweet<\/span>، <span class=\"en\">darkness visible<\/span>).<\/div><div class=\"u\">١.٤ <span class=\"en\">paradox<\/span>: فكرة متناقضة ظاهرياً فيها حقيقة (<span class=\"en\">Death,<\/span> <span class=\"en\">thou shalt die<\/span>).<\/div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">✏️<\/span><\/span> تمرين<\/div>", "n": 6, "i": 18, "a": "poetry-19-014", "x": "463642d9"}, {"t": "learn", "h": "<div class=\"u\">٢.١ صنّف: \"<span class=\"en\">the White House said<\/span>\" ، \"<span class=\"en\">all hands on deck<\/span>\" ، \"<span class=\"en\">deafening silence<\/span>\" ، \"<span class=\"en\">less is more<\/span>\".<\/div><div class=\"u\">٢.٢ اكتب مثال واحد لكل أداة من عندك.<\/div><div class=\"u\">٢.٣ في سطر <span class=\"en\">Romeo<\/span>: \"<span class=\"en\">cold fire,<\/span> <span class=\"en\">sick health<\/span>\": ليه الشاعر بيجمع المتناقضات؟<\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح. <span class=\"em\"><span class=\"em\">✍️<\/span><\/span><\/div>", "n": 4, "i": 19, "a": "poetry-19-015", "x": "f95b62d3"}, {"t": "recall", "h": "", "q": "إيه نوع المجاز في \"<span class=\"en\">the Crown<\/span>\" بمعنى الملكية؟ ولا ده <span class=\"en\">synecdoche<\/span>؟ ليه؟", "a": "<span class=\"en\">metonymy<\/span>، لأن التاج مش جزء من الملك، بس مرتبط بيه. (حسب <span class=\"en\">Wikipedia - Lanham)<\/span>", "n": 1, "i": 20}, {"t": "recall", "h": "", "q": "\"<span class=\"en\">boots on the ground<\/span>\" معناها إيه؟ وإيه نوعها؟", "a": "جنود. <span class=\"en\">synecdoche<\/span> (جزء بدل الكل).", "n": 1, "i": 21}, {"t": "recall", "h": "", "q": "اذكر <span class=\"en\">oxymoron<\/span> من سطور <span class=\"en\">Romeo.<\/span>", "a": "أمثلة: <span class=\"en\">loving hate<\/span>، <span class=\"en\">heavy lightness<\/span>، <span class=\"en\">feather of lead<\/span>، <span class=\"en\">bright smoke<\/span>، <span class=\"en\">cold fire<\/span>، <span class=\"en\">sick health<\/span>، <span class=\"en\">still-waking sleep.<\/span>", "n": 1, "i": 22}, {"t": "recall", "h": "", "q": "إيه الفرق بين <span class=\"en\">oxymoron<\/span> و <span class=\"en\">paradox<\/span>؟", "a": "<span class=\"en\">oxymoron<\/span> = كلمتين متناقضتين جنب بعض. <span class=\"en\">paradox<\/span> = فكرة كاملة متناقضة ظاهرياً فيها حقيقة.", "n": 1, "i": 23}, {"t": "write", "h": "", "q": "(الفكرة) اشرح الفرق بين <span class=\"en\">metonymy<\/span> و <span class=\"en\">synecdoche<\/span> بأسلوبك مع ٣ أمثلة لكل واحد (ممكن من الحياة اليومية).", "key": "poetry-19:5", "n": 1, "i": 24}, {"t": "write", "h": "", "q": "(<span class=\"en\">oxymoron)<\/span> اكتب ٣ <span class=\"en\">oxymorons<\/span> من عندك (ممكن بالعربي مع ترجمتها)، واشرح الإحساس اللي كل واحدة بتعبر عنه.", "key": "poetry-19:6", "n": 1, "i": 25}, {"t": "write", "h": "", "q": "(<span class=\"en\">paradox)<\/span> في <span class=\"en\">Donne<\/span>: \"<span class=\"en\">And death shall be no more<\/span>; <span class=\"en\">death,<\/span> <span class=\"en\">thou shalt die.<\/span>\" ليه الجملة بتبان متناقضة؟ وإيه المعنى اللي ممكن يكون وراها؟ (ده قراءتك إنت مع دليل من النص).", "key": "poetry-19:7", "n": 1, "i": 26}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس الجاي (الدرس ٢٠): وحدة جديدة، أشكال القصيدة: السونيت (<span class=\"en\">Petrarchan<\/span> مقابل <span class=\"en\">Shakespearean<\/span>).", "extra": "<span class=\"em\"><span class=\"em\">🔗<\/span><\/span> للتوسع (اتأكدت منهم): <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Metonymy\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Metonymy<\/a> ، <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Synecdoche\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Synecdoche<\/a> ، <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Oxymoron\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Oxymoron<\/a> ، <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Paradox\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Paradox<\/a> ، <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Death_Be_Not_Proud\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Death_Be_Not_Proud<\/a><span class=\"em\"><span class=\"em\">📚<\/span><\/span> المصادر: <span class=\"en\">Wikipedia - Metonymy<\/span>، <span class=\"en\">Synecdoche<\/span>، <span class=\"en\">Oxymoron<\/span>، <span class=\"en\">Paradox<\/span>، <span class=\"en\">Death Be Not Proud.<\/span>", "i": 27}];</script>
