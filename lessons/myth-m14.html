<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس M14</span><span class="tag"><span class="em">🏛️</span> كورس الميثولوجيا</span></div>

<script>window.LESSON_ID="myth-m14", "myth-m13";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"u\">في الفصل ١١ خدنا أرتميس: البرية، والحدود، والصيد.<\/div><div class=\"u\">في الفصل ١٢ خدنا أثينا: المدينة، والعقل، والقانون.<\/div><div class=\"u\">في الفصل ١٣ خدنا أفروديت: الرغبة، والجمال، والقوة اللي بتحرّك كل حاجة حية.<\/div><div class=\"u\">والنهارده هيرميس، اللي الرومان سموه عطارد.<\/div><div class=\"u\">وهو مختلف عن كل اللي فات. مش إله بيحكم مجال، هو إله بيعدّي بين المجالات.<\/div><div class=\"li\">بيعدّي بين الآلهة والبشر، لأنه رسول.<\/div><div class=\"li\">بيعدّي بين الأحياء والموتى، لأنه بيوصّل أرواح الموتى.<\/div>", "n": 7, "a": "myth-m14-001", "x": "b8ee2aca", "en": "Last lessons: Artemis (wild, borders), Athena (city, reason), Aphrodite (desire). Today Hermes, whom the Romans called Mercury. He is different: he does not rule a domain, he crosses between domains: gods and humans, living and dead.", "i": 1}, {"t": "learn", "h": "<div class=\"li\">بيعدّي بين الحدود، لأنه إله الطرق والأبواب والعلامات اللي بتفصل بين مكان ومكان.<\/div><div class=\"li\">وبيعدّي بين المعلوم والمخفي، لأنه إله اللصوص والتجار في نفس الوقت.<\/div><div class=\"u\">وهو أصغر إله اتكلمنا عنه لحد دلوقتي: في الحكاية الكبيرة بتاعته، هو طفل عنده يوم واحد. يوم واحد بس، وعمل فيه كل حاجة: اخترع آلة موسيقية، وسرق خمسين بقرة، وكدب على إله أكبر منه، وخرج من المحاكمة من غير عقاب.<\/div><div class=\"u\">يعني الفصل ده مش فصل قوة، ده فصل ذكاء. 🧠<\/div>", "n": 4, "a": "myth-m14-002", "x": "825ab923", "en": "Also between borders, and between the known and the hidden, since he is the god of thieves and of traders. He is the youngest god so far: in his big story he is a one-day-old child who invents an instrument, steals fifty cows, lies to an older god and walks free. This chapter is about cleverness, not power.", "i": 2}, {"t": "section", "h": "النقطة 1: البطاقة الأساسية", "i": 3}, {"t": "learn", "h": "<div class=\"u\">الاسم<\/div><div class=\"li\">هيرميس باليوناني، وعطارد (<span class=\"en\">Mercury<\/span>) باللاتيني.<\/div><div class=\"li\">والاسم اليوناني مشروح عند المفسرين القدامى من كلمة <span class=\"en\">herma<\/span>، يعني كومة حجر أو علامة على الطريق. ودي هترجع لنا في آخر الفصل، لأن الاسم ده هو أصل كلمة <span class=\"en\">herm<\/span>، العلامة الحجرية اللي كانت بتتحط على الطرق. 🪨<\/div>", "n": 3, "a": "myth-m14-003", "x": "9864df2e", "en": "The name: Hermes in Greek, Mercury in Latin. Ancient commentators connect the Greek name with herma, a heap of stones or a road marker, the source of the word herm.", "i": 4}, {"t": "mc", "h": "", "q": "مين أبو هيرميس وأمه؟", "nq": 1, "opts": ["زيوس ومايا", "أبولو وليتو", "هيرا وزيوس"], "ans": 0, "why": "زيوس ومايا", "ex": ["صح: زيوس ومايا بنت أطلس.", "غلط: أبولو ابن ليتو، مش هيرميس.", "غلط: هيرا زوجة زيوس."], "i": 5}, {"t": "learn", "h": "<div class=\"li\">والاسم اللاتيني <span class=\"en\">Mercury<\/span> جاي من <span class=\"en\">merx<\/span>، يعني بضاعة أو سلعة، ومنها كلمة <span class=\"en\">merchant<\/span>، التاجر، وكلمة <span class=\"en\">market<\/span>، السوق. وكان في الأصل غالباً إله التجار، وفيه رأي إن أصل الاسم ممكن يكون إتروسكي. يعني الاسم نفسه جاي من عالم البيع والشراء.<\/div>", "n": 1, "a": "myth-m14-004", "x": "0df007a5", "en": "Mercury comes from merx, goods, which gives merchant and market. He was probably first a god of traders, and some think the name may be Etruscan. The name itself comes from the world of buying and selling.", "i": 6}, {"t": "tf", "h": "", "q": "اسم <span class=\"en\">Mercury<\/span> جاي من <span class=\"en\">merx<\/span>، يعني بضاعة.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: ومنها <span class=\"en\">merchant<\/span> و<span class=\"en\">market<\/span>.", "غلط: الاسم من <span class=\"en\">merx<\/span>."], "i": 7}, {"t": "learn", "h": "<div class=\"u\">العيلة<\/div><div class=\"li\">أبوه زيوس، وأمه مايا، بنت أطلس، واحدة من البليادات، الحوريات اللي سكنوا جبل كيليني.<\/div><div class=\"li\">والنسب بيقولها في سطر واحد، نسب الآلهة ٩٣٨: \"<span class=\"en\">And Maia, the daughter of Atlas, bore to Zeus glorious Hermes, the herald of the deathless gods, for she went up into his holy bed<\/span>.\"<\/div><div class=\"li\">يعني: ومايا، بنت أطلس، خلفت لزيوس هيرميس المجيد، رسول الآلهة الخالدين.<\/div>", "n": 4, "a": "myth-m14-005", "x": "d917a442", "en": "Family: father Zeus, mother Maia, daughter of Atlas, a Pleiad who lived on Mount Cyllene. Theogony 938: And Maia, the daughter of Atlas, bore to Zeus glorious Hermes, the herald of the deathless gods.", "i": 8}, {"t": "learn", "h": "<div class=\"li\">خد بالك من اللقب اللي في السطر: رسول الآلهة الخالدين. اللقب ده هو وظيفته، وهو مكتوب في أول مرة يتذكر فيها اسمه.<\/div>", "n": 1, "a": "myth-m14-006", "x": "60126bf6", "en": "Note the title in the line: herald of the deathless gods. The title is his job, written the first time his name appears.", "i": 9}, {"t": "learn", "h": "<div class=\"u\">مكان الميلاد<\/div><div class=\"li\">كهف في جبل كيليني، في أركاديا، في وسط البيلوبونيز.<\/div><div class=\"li\">وهوميروس في الأوديسة بيناديه \"الكيليني\" (<span class=\"en\">Cyllenian<\/span>)، يعني المنسوب للجبل ده. يعني المكان بقة جزء من اسمه.<\/div>", "n": 3, "a": "myth-m14-007", "x": "6a21046c", "en": "Birthplace: a cave on Mount Cyllene in Arcadia, in the middle of the Peloponnese. Homer calls him Cyllenian, so the place is part of his name.", "i": 10}, {"t": "learn", "h": "<div class=\"u\">الألقاب<\/div><div class=\"li\">أرجهيفونتيس (<span class=\"en\">Argeiphontes<\/span>): يعني قاتل أرغوس. وأرغوس ده الوحش اللي عنده عيون كتير، اللي هيرا حطته يراقب البنت إيو. وهيرميس قتله. واللقب ده مستعمل في الترنيمة نفسها: \"<span class=\"en\">the sharp-eyed slayer of Argus<\/span>\".<\/div><div class=\"li\">سايكوبومبوس (<span class=\"en\">psychopompos<\/span>): دليل الأرواح، اللي بيوصّل أرواح الموتى للعالم التاني. وده أهم دور ليه في الشعر، وهنشوفه في الأوديسة ٢٤.<\/div><div class=\"li\">و\"رسول الآلهة\" و\"إله اللصوص\"، وكلها ألقاب بتوصف نفس الحاجة من زوايا مختلفة: الحركة.<\/div>", "n": 4, "a": "myth-m14-008", "x": "3fd10048", "en": "Titles: Argeiphontes, slayer of Argus, the many-eyed monster Hera set to watch Io, whom Hermes killed. And psychopompos, guide of souls to the other world, his most important role in poetry. Herald and god of thieves are also titles, and all describe movement.", "i": 11}, {"t": "mc", "h": "", "q": "لقب <span class=\"en\">Argeiphontes<\/span> معناه إيه؟", "nq": 1, "opts": ["قاتل أرغوس", "دليل الأرواح", "رسول الآلهة"], "ans": 0, "why": "قاتل أرغوس", "ex": ["صح: قتل الوحش ذو العيون الكتير.", "غلط: ده <span class=\"en\">psychopompos<\/span>.", "غلط: ده لقب تاني."], "i": 12}, {"t": "learn", "h": "<div class=\"u\">الأدوات<\/div><div class=\"li\">الكيريكيون (<span class=\"en\">kerykeion<\/span>)، وباللاتيني <span class=\"en\">caduceus<\/span>: العصاية اللي بيلف حواليها تعبانين. ودي عصاية الرسول، علامة إن اللي ماسكها مش بيتلمس.<\/div><div class=\"li\">الجناحات في الجزمة (<span class=\"en\">talaria<\/span>)، والطاقية اللي ليها حرف (<span class=\"en\">petasos<\/span>)، والعباية (<span class=\"en\">chlamys<\/span>). وده شكله المعتاد في الفن الكلاسيكي.<\/div><div class=\"li\">ومن الحيوانات المرتبطة بيه الكبش والسلحفاة.<\/div><div class=\"li\">والسلحفاة دي مش اختيار عشوائي، لأن أول آلة موسيقية عنده كانت من سلحفاة. وهنشوف الحكاية كمان سطر.<\/div>", "n": 5, "a": "myth-m14-009", "x": "2b625cad", "en": "His tools: the kerykeion or caduceus, the herald's staff with two snakes, a sign that its holder must not be touched. Winged sandals (talaria), a brimmed hat (petasos) and a cloak (chlamys), as shown in classical art. The ram and the tortoise are linked to him, and the tortoise gave him his first instrument.", "i": 13}, {"t": "mc", "h": "", "q": "إيه العصاية اللي بيلف حواليها تعبانين وبيشيلها هيرميس؟", "nq": 1, "opts": ["الكيريكيون (<span class=\"en\">caduceus<\/span>)", "الصاعقة", "الرمح"], "ans": 0, "why": "الكيريكيون (<span class=\"en\">caduceus<\/span>)", "ex": ["صح: عصاية الرسول.", "غلط: الصاعقة لزيوس.", "غلط: مش رمح."], "i": 14}, {"t": "learn", "h": "<div class=\"u\">شكله في الفن<\/div><div class=\"li\">في الفن القديم، كان بيتصوّر غالباً راجل ناضج بلحية، وبعدين بقى كمان شاب رياضي من غير لحية.<\/div>", "n": 2, "a": "myth-m14-010", "x": "2ed0f489", "en": "In art: often a mature bearded man, later also a beardless athletic youth.", "i": 15}, {"t": "section", "h": "النقطة 2: أول يوم في حياته", "i": 16}, {"t": "learn", "h": "<div class=\"u\">الترنيمة الهوميرية الرابعة، المخصصة لهيرميس، بتحكي أول يوم في حياته. وهي من أطول الترانيم الهوميرية، حوالي ٥٨٠ سطر، وكلها عن يوم واحد.<\/div>", "n": 1, "a": "myth-m14-011", "x": "9b2b48cf", "en": "The fourth Homeric Hymn tells his first day. It is one of the longest Homeric hymns, about 580 lines, all about one day.", "i": 17}, {"t": "learn", "h": "<div class=\"u\">المشهد الأول: السلحفاة<\/div><div class=\"li\">الطفل اتولد في الكهف، وأمه نامت. وهو قام من المهد، وخرج.<\/div><div class=\"li\">وعلى باب الكهف لقى سلحفاة بترعى العشب.<\/div><div class=\"li\">والنص بيقول: \"<span class=\"en\">But as he stepped over the threshold of the high-roofed cave, he found a tortoise there and gained endless delight. For it was Hermes who first made the tortoise a singer<\/span>.\"<\/div>", "n": 4, "a": "myth-m14-012", "x": "e97b0614", "en": "Scene one, the tortoise: the baby is born in the cave, his mother sleeps, he leaves the cradle and finds a tortoise at the door. The hymn: he found a tortoise there and gained endless delight, for it was Hermes who first made the tortoise a singer.", "i": 18}, {"t": "learn", "h": "<div class=\"li\">يعني: لما خطى على عتبة الكهف العالي السقف، لقى سلحفاة هناك، وفرح فرحة ملهاش آخر. لأن هيرميس هو أول واحد خلّى السلحفاة مغنية.<\/div><div class=\"li\">جملة \"خلّى السلحفاة مغنية\" دي هي أذكى جملة في الترنيمة. السلحفاة مالهاش صوت. بس لما تموت ويبقى صدفها آلة، تبقى بتغني.<\/div>", "n": 2, "a": "myth-m14-013", "x": "6b29679a", "en": "Made the tortoise a singer is the cleverest line in the hymn. The tortoise has no voice, but when it dies and its shell becomes an instrument, it sings.", "i": 19}, {"t": "learn", "h": "<div class=\"u\">المشهد التاني: اختراع القيثارة<\/div><div class=\"li\">هيرميس قتل السلحفاة، ونضّف الصدفة، وحط فيها أوتار.<\/div><div class=\"li\">والأوتار كانت من مصارين الخروف اللي كان بيرعاه. يعني الآلة الأولى اتولدت من حيوانين: سلحفاة وخروف.<\/div><div class=\"li\">وبقى عندها سبع أوتار، زي ما بتقول الترنيمة.<\/div><div class=\"li\">وغنى عليها عن أبوه وأمه، وعن ميلاده هو.<\/div><div class=\"li\">وده أول درس في الفصل: الفن مش رفاهية. أول حاجة عملها إله الذكاء إنه صنع آلة موسيقية من حاجة ميتة، وغنى.<\/div>", "n": 6, "a": "myth-m14-014", "x": "b4d9a3a4", "en": "Scene two, the lyre: he killed the tortoise, cleaned the shell and added strings of sheep gut. The first instrument came from two animals. It had seven strings, as the hymn says, and he sang of his father, his mother and his own birth.", "i": 20}, {"t": "mc", "h": "", "q": "القيثارة الأولى اتصنعت من إيه؟", "nq": 1, "opts": ["صدفة سلحفاة وأوتار من مصارين الخروف", "خشب وحرير", "نحاس وفضة"], "ans": 0, "why": "صدفة سلحفاة وأوتار من مصارين الخروف", "ex": ["صح: من حيوانين.", "غلط: مش خشب وحرير.", "غلط: مش معادن."], "i": 21}, {"t": "learn", "h": "<div class=\"li\">مثال من الحياة: أول مرة حد ياخد حاجة مكسورة ويصلحها ويخليها تشتغل، بيحس بنفس الفرحة. الإصلاح نفسه إبداع. 🔧<\/div>", "n": 1, "a": "myth-m14-015", "x": "e5f3cd2e", "en": "The first lesson: art is not a luxury. The god of cleverness first made an instrument from something dead and sang. Everyday example: mending something broken gives the same joy, and repair is creation.", "i": 22}, {"t": "learn", "h": "<div class=\"u\">المشهد التالت: سرقة البقر<\/div><div class=\"li\">هيرميس طلع من الكهف، ومشي لسهل بييريا، اللي فيه بقر الآلهة.<\/div><div class=\"li\">والنص بيقول:<\/div>", "n": 3, "a": "myth-m14-016", "x": "f9ec53e3", "en": "Scene three, the cattle: Hermes went to the plain of Pieria where the gods' cattle graze. The hymn says:", "i": 23}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Of these the Son of Maia, the sharp-eyed slayer of Argus then cut off from the herd fifty loud-lowing kine, and drove them straggling-wise across a sandy place, turning their hoof-prints aside. Also, he bethought him of a crafty ruse and reversed the marks of their hoofs, making the front behind and the hind before, while he himself walked the other way<\/span>.\"<\/div>", "n": 1, "a": "myth-m14-017", "x": "77b2a032", "en": "Of these the son of Maia cut off fifty loud-lowing kine and drove them across a sandy place, turning their hoof-prints aside, and reversed the marks of their hoofs, the front behind and the hind before, while he walked the other way.", "i": 24}, {"t": "learn", "h": "<div class=\"li\">يعني: ابن مايا، قاتل أرغوس الحاد البصر، فصل من القطيع خمسين بقرة بتخوار عالي، وساقهم متفرقين على أرض رملية، ولفّ آثار حوافرهم. وفكّر في حيلة ماكرة، وقلب علامات حوافرهم، فخلّى المقدمة ورا والمؤخرة قدام، وهو نفسه مشي في الاتجاه التاني.<\/div><div class=\"li\">تخيل المشهد: خمسين بقرة ماشية لورا، وآثارهم بتقول إنهم مشيوا في الاتجاه العكسي، والطفل ماشي في الاتجاه التاني. أي واحد يتتبعهم هيوصل لمكان تاني خالص.<\/div>", "n": 2, "a": "myth-m14-018", "x": "a1219c57", "en": "Meaning: he separated fifty cows and made their tracks point the wrong way, while he walked the opposite way. Anyone following the tracks would end up somewhere else entirely.", "i": 25}, {"t": "tf", "h": "", "q": "هيرميس خلّى آثار البقر تبان كأنها ماشية في الاتجاه العكسي.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: قلب الآثار.", "غلط: ده بالظبط اللي عمله."], "i": 26}, {"t": "learn", "h": "<div class=\"li\">وبعدين عمل جزمة. والنص بيقول: \"<span class=\"en\">Then he wove sandals with wicker-work by the sand of the sea, wonderful things, unthought of, unimagined<\/span>.\"<\/div><div class=\"li\">يعني: نسج جزمة من خيوط نباتية على رمل البحر، حاجات عجيبة، ماحدش فكر فيها ولا تخيلها.<\/div><div class=\"li\">ليه؟ عشان أثر رجله ما يبانش. يعني هو اخترع الجزمة كأداة تمويه، مش كأداة لبس. 😄<\/div>", "n": 3, "a": "myth-m14-019", "x": "399c979a", "en": "Then he made sandals, woven from plants on the sea sand, wonderful things nobody had thought of. Why? So his footprints would not show. He invented the sandal as camouflage, not clothing.", "i": 27}, {"t": "learn", "h": "<div class=\"li\">ودي حاجة تستاهل وقفة. الجزمة اللي في رجلك النهارده، في الحكاية دي، أول سببها جريمة. والتكنولوجيا كده: كل اختراع بيطلع من حاجة، والحاجة مش دايماً نبيلة.<\/div>", "n": 1, "a": "myth-m14-020", "x": "a603ec03", "en": "Worth a pause: the sandal on your foot began, in this story, with a crime. Technology is like that: every invention comes from something, not always noble.", "i": 28}, {"t": "mc", "h": "", "q": "ليه هيرميس نسج جزمة من النبات؟", "nq": 1, "opts": ["عشان أثر رجله ما يبانش", "عشان يبيعها", "عشان يهدّيها لأبولو"], "ans": 0, "why": "عشان أثر رجله ما يبانش", "ex": ["صح: تمويه.", "غلط: مش للبيع.", "غلط: مش هدية."], "i": 29}, {"t": "learn", "h": "<div class=\"u\">المشهد الرابع: المحاكمة<\/div><div class=\"li\">أبولو، صاحب البقر، اكتشف السرقة. وجه للكهف زعقان.<\/div><div class=\"li\">وهيرميس عمل إيه؟ دخل في قماشه. والنص بيقول: \"<span class=\"en\">he snuggled down in his fragrant swaddling-clothes... like a new born child seeking sweet sleep, though in truth he was wide awake, and he kept his lyre under his armpit<\/span>.\"<\/div><div class=\"li\">يعني: تمدد في قماشه الملفوف، زي طفل مولود بيدور على نوم حلو، مع إنه في الحقيقة صاحي خالص، وكان حاطط قيثارته تحت باطه.<\/div>", "n": 4, "a": "myth-m14-021", "x": "5432f32c", "en": "Scene four, the trial: Apollo, owner of the cattle, found the theft and came to the cave angry. Hermes snuggled down in his swaddling clothes like a newborn seeking sleep, though wide awake, with his lyre under his arm.", "i": 30}, {"t": "learn", "h": "<div class=\"li\">والتفصيلة الأخيرة دي هي الكوميديا كلها: الطفل بيدّعي إنه رضيع، وقيثارته تحت باطه.<\/div><div class=\"li\">وأبولو قال له: قول الحقيقة. وهيرميس رد بجملة بقت من أشهر مشاهد الدفاع الكوميدي:<\/div><div class=\"u\">\"<span class=\"en\">I care for sleep, and milk of my mother's breast, and wrappings round my shoulders, and warm baths<\/span>.\"<\/div><div class=\"li\">يعني: أنا بيهمني النوم، ولبن صدر أمي، ولفات على كتافي، وحمامات سخنة.<\/div><div class=\"li\">يعني: أنا رضيع. مش عارف حاجة عن بقر ولا سرقة ولا كلام من ده. 😂<\/div>", "n": 5, "a": "myth-m14-022", "x": "292e42e3", "en": "That last detail is the whole comedy: the baby pretends to be a baby, with the lyre under his armpit. Apollo says tell the truth. Hermes replies: I care for sleep, milk from my mother's breast, wrappings round my shoulders and warm baths. In other words: I am a baby, I know nothing about cows.", "i": 31}, {"t": "tf", "h": "", "q": "لما أبولو واجهه، هيرميس ادّعى إنه رضيع.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: وقيثارته تحت باطه.", "غلط: ده دفاعه."], "i": 32}, {"t": "learn", "h": "<div class=\"li\">والنص نفسه بيقول إنه رد \"بحكمة ماكرة\" (<span class=\"en\">with crafty words<\/span>). الشاعر مش مخدوع، وهو عايزك تعرف إن الطفل بيكدب.<\/div>", "n": 1, "a": "myth-m14-023", "x": "8886693e", "en": "The text says he answered with crafty words. The poet is not fooled and wants you to know the child lies.", "i": 33}, {"t": "learn", "h": "<div class=\"u\">المشهد الخامس: قدام زيوس<\/div><div class=\"li\">راحوا لزيوس، والد الاتنين. وأبولو شكى، وهيرميس دافع عن نفسه تاني.<\/div><div class=\"li\">وفي الدفاع ده بيصر الطفل إنه لسه مولود وملوش علاقة بالسرقة.<\/div><div class=\"li\">وزيوس ضحك من حيلة الطفل، وطلب منهم يدوروا على البقر مع بعض.<\/div>", "n": 4, "a": "myth-m14-024", "x": "d323471c", "en": "Scene five, before Zeus: they went to their father. Apollo complained and Hermes defended himself again, insisting he was newly born and had nothing to do with it. Zeus laughed at the child's trick and told them to look for the cattle together.", "i": 34}, {"t": "learn", "h": "<div class=\"u\">المشهد السادس: الهدية<\/div><div class=\"li\">هيرميس إيه اللي عمل؟ إدّى القيثارة لأبولو. هدية.<\/div><div class=\"li\">والأسطورة بتقول إن أبولو خد الآلة ونسي البقر. والترنيمة بتحكي التسليم ده قرب آخرها.<\/div><div class=\"li\">وده أهم تحول في الفصل: اللص بقى فنان، والخصم بقى صاحب. والآلة اللي اتولدت من سلحفاة ميتة بقت آلة أبولو الرسمية، وبعدها بقت آلة الشعر كله.<\/div><div class=\"li\">ومن هنا ممكن نربط هيرميس ببداية الغنا والآلة الموسيقية.<\/div>", "n": 5, "a": "myth-m14-025", "x": "c0859ade", "en": "Scene six, the gift: Hermes gave Apollo the lyre. As the story goes, Apollo took the instrument and forgot the cows; the hymn tells the handover near its end. The thief became an artist and the opponent a friend. The lyre born of a dead tortoise became Apollo's instrument and then the instrument of poetry. From here we can link Hermes with the beginning of song and the instrument.", "i": 35}, {"t": "mc", "h": "", "q": "هيرميس عمل إيه بالقيثارة في الآخر؟", "nq": 1, "opts": ["إدّاها لأبولو هدية", "كسرها", "خبّاها"], "ans": 0, "why": "إدّاها لأبولو هدية", "ex": ["صح: وبقت آلة أبولو.", "غلط: مكسرهاش.", "غلط: مخبّاهاش."], "i": 36}, {"t": "learn", "h": "<div class=\"li\">وبعد كده بيبقى رسول الآلهة. يعني الطفل اللي سرق بقى صوت الكلام الرسمي بين الآلهة.<\/div>", "n": 1, "a": "myth-m14-026", "x": "a1722963", "en": "After that he becomes the messenger of the gods: the child who stole becomes the voice of official speech among the gods.", "i": 37}, {"t": "section", "h": "النقطة 3: الميادين الخمسة", "i": 38}, {"t": "learn", "h": "<div class=\"u\">الأول: الحركة والطرق والحدود<\/div><div class=\"li\">هيرميس إله المسافرين، والطرق، والأبواب، والعلامات اللي على الطريق.<\/div><div class=\"li\">والهيرم، العلامة الحجرية اللي بتتحط عند مفترق الطرق وباب البيت، كانت بتتحط باسمه.<\/div><div class=\"li\">والهيرم عمود حجري مستطيل، فوقه راس، غالباً راس هيرميس، وفي النص أعضاء الرجل بارزة بالنحت.<\/div><div class=\"li\">والناس في العصور القديمة كانت بتعتبر الهيرم مقدس، وليها طبيعة حامية، وكانوا بيحطوها على جوانب الطرق، وعند المفترقات، ومداخل الأماكن العامة.<\/div>", "n": 5, "a": "myth-m14-027", "x": "6e511d92", "en": "Five domains. First, movement, roads and borders: he is the god of travellers, roads, doors and road markers. The herm, a stone marker at crossroads and house doors, carried his name. It is a rectangular stone pillar with a head, usually Hermes's, and a carved male member. Ancient people thought herms sacred and protective and set them by roads, crossroads and entrances to public places.", "i": 39}, {"t": "learn", "h": "<div class=\"li\">وده معنى مهم: العلامة اللي بتقول لك \"إنت هنا\" و\"إنت داخل\" كانت إله. الحدود نفسها كانت مقدسة، لأنها المكان اللي بيحصل فيه الانتقال.<\/div>", "n": 1, "a": "myth-m14-028", "x": "a82e0f79", "en": "An important idea: the sign that says you are here and you are entering was a god. The border itself was sacred because it is where passing happens.", "i": 40}, {"t": "learn", "h": "<div class=\"u\">التاني: التجارة واللصوص<\/div><div class=\"li\">نفس الإله بيحمي التاجر واللص. وده مش تناقض، ده منطق.<\/div><div class=\"li\">الاتنين بيتحركوا، والاتنين بيعتمدوا على الذكاء، والاتنين بيعملوا صفقة فيها مخاطرة.<\/div><div class=\"li\">والاسم اللاتيني نفسه من <span class=\"en\">merx<\/span>، بضاعة. يعني في اللاتيني، الإله ده إله السوق من اسمه.<\/div>", "n": 4, "a": "myth-m14-029", "x": "a82d2383", "en": "Second, trade and thieves. The same god protects trader and thief. Both move, both depend on cleverness, both make risky deals. The Latin name comes from merx, goods, so in Latin he is the god of the market by name.", "i": 41}, {"t": "learn", "h": "<div class=\"li\">ومثال من الحياة: في أي سوق، اللي بيبيع واللي بينصب على الناس بيلعبوا نفس اللعبة: إقناع وثقة وسرعة. الفرق إن واحد بيحترم العقد والتاني لأ. والميثولوجيا حطّت الاتنين تحت نفس الإله، عشان تفكرك إن الخط بينهم رفيع. ⚖️<\/div>", "n": 1, "a": "myth-m14-030", "x": "b917ad30", "en": "Everyday example: in any market, the honest seller and the cheat play the same game: persuasion, trust, speed. The difference is that one respects the contract. Mythology put both under one god to remind you the line between them is thin.", "i": 42}, {"t": "learn", "h": "<div class=\"u\">التالت: الكلام والرسالة والترجمة<\/div><div class=\"li\">هيرميس رسول، وده معناه إنه بيتكلم باسم حد تاني.<\/div><div class=\"li\">والرسول لازم يكون أمين وماهر في نفس الوقت. أمين في المعنى، ماهر في الصياغة.<\/div><div class=\"li\">وكلمة <span class=\"en\">hermeneia<\/span> يعني تفسير، ومنها <span class=\"en\">hermeneutics<\/span>، علم التفسير. والربط بينها وبين اسم هيرميس قديم ومعروف، مع إن أصل الكلمة مش محسوم.<\/div><div class=\"li\">وده هو سبب أهمية هيرميس للشعر الإنجليزي: كل شاعر بيترجم أسطورة بيبقى هيرميس. بياخد معنى من لغة ويديه للغة تانية.<\/div>", "n": 5, "a": "myth-m14-031", "x": "b6f8a3c4", "en": "Third, speech, message and translation. A herald speaks for someone else, so he must be faithful and skilled: faithful in meaning, skilled in wording. The word hermeneia means interpretation, giving hermeneutics, and the link to Hermes's name is old and well known, though the word's origin is not settled. That is why Hermes matters to English poetry: every poet who translates a myth is Hermes, carrying meaning from one language to another.", "i": 43}, {"t": "learn", "h": "<div class=\"u\">الرابع: الرعي والقطيع<\/div><div class=\"li\">هو كمان إله الرعاة والقطعان، وده واضح في الترنيمة اللي بيسرق فيها البقر وبيذبح منها.<\/div><div class=\"li\">وده بيوريك إن الآلهة اليونانية مالهاش تخصص ضيق. الإله بيغطي مجال واسع، وكل مجال بيفسّر جانب من شخصيته.<\/div>", "n": 3, "a": "myth-m14-032", "x": "caee493c", "en": "Fourth, herds: he is also a god of herdsmen and flocks, clear in the hymn where he steals cattle and sacrifices some. Greek gods do not have narrow jobs; each field explains a side of the personality.", "i": 44}, {"t": "learn", "h": "<div class=\"u\">الخامس: النوم والأحلام<\/div><div class=\"li\">هيرميس بيجيب النوم، وبيفتح العيون اللي نايمة، وبيوصل رسايل في الأحلام.<\/div><div class=\"li\">والعصاية بتاعته في الأوديسة ٢٤ بتعمل بالظبط كده: بتنيم اللي هو عايزه، وتصحّي اللي هو عايزه.<\/div><div class=\"li\">وده منطقي، لأن النوم هو الحد بين الوعي واللاشعور، وهيرميس إله الحدود.<\/div>", "n": 4, "a": "myth-m14-033", "x": "3af65c6b", "en": "Fifth, sleep and dreams: Hermes brings sleep, opens sleeping eyes and carries messages in dreams. His staff in Odyssey 24 does exactly that: it puts to sleep whom he wants and wakes whom he wants. Sleep is the border between awareness and the unconscious, and Hermes is the god of borders.", "i": 45}, {"t": "section", "h": "النقطة 4: هيرميس اللي بيوصّل الأرواح", "i": 46}, {"t": "learn", "h": "<div class=\"u\">ده أهم دور ليه في الشعر، ولازم تفتكره.<\/div>", "n": 1, "a": "myth-m14-034", "x": "b35fcca4", "en": "This is his most important role in poetry, remember it.", "i": 47}, {"t": "learn", "h": "<div class=\"u\">الأوديسة ٢٤<\/div><div class=\"li\">في آخر كتاب في الأوديسة، أرواح الخاطبين اللي اتقتلوا لسه بتطلع من العالم التاني. ومين اللي بياخدهم؟ هيرميس.<\/div><div class=\"li\">والنص بيقول، بترجمة موراي:<\/div><div class=\"u\">\"<span class=\"en\">Meanwhile Cyllenian Hermes called forth the spirits of the wooers. He held in his hands his wand, a fair wand of gold, wherewith he lulls to sleep the eyes of whom he will, while others again he wakens even out of slumber<\/span>.\"<\/div>", "n": 4, "a": "myth-m14-035", "x": "b80b87be", "en": "Odyssey 24: in the last book the spirits of the slain suitors rise from the world of the living. Who takes them? Hermes. The text: Cyllenian Hermes called forth the spirits of the wooers, holding his fair golden wand, with which he lulls to sleep the eyes of whom he will and wakens others out of slumber.", "i": 48}, {"t": "learn", "h": "<div class=\"li\">يعني: في الوقت ده، هيرميس الكيليني نادى أرواح الخاطبين. كان ماسك في إيده عصايته، عصاية جميلة من دهب، بيها بينيّم عيون اللي هو عايزه، وبيصحّي تانيين من النوم.<\/div><div class=\"li\">وبعدها بيقودهم، والنص بيقول: \"<span class=\"en\">Hermes, the Helper, led them down the dank ways<\/span>.\"<\/div><div class=\"li\">يعني: هيرميس، المعين، قادهم في الطرق الندية المظلمة.<\/div>", "n": 3, "a": "myth-m14-036", "x": "f282b037", "en": "Meaning: Hermes the Cyllenian called the spirits, holding a lovely golden wand that closes some eyes and wakes others. Then he leads them: Hermes, the helper, led them down the dank ways.", "i": 49}, {"t": "learn", "h": "<div class=\"li\">والصورة اللي بعده تحفة: الأرواح بتتحرك زي الخفافيش في كهف، بتصوّت وتتعلق في بعض. يعني الموت هنا مش ملك فخم، هو قطيع خفافيش بتمشي ورا عصاية.<\/div>", "n": 1, "a": "myth-m14-037", "x": "487d930c", "en": "The next image is wonderful: the spirits move like bats in a cave, squeaking and clinging together. Death here is not a grand king, it is a flock of bats following a staff.", "i": 50}, {"t": "mc", "h": "", "q": "في الأوديسة ٢٤، هيرميس بيعمل إيه؟", "nq": 1, "opts": ["بيقود أرواح الخاطبين للعالم التاني", "بيحارب الخاطبين", "بيحكم أيثاكا"], "ans": 0, "why": "بيقود أرواح الخاطبين للعالم التاني", "ex": ["صح: بعصاية دهب.", "غلط: مش بيحارب.", "غلط: مش حاكم."], "i": 51}, {"t": "learn", "h": "<div class=\"u\">الإلياذة ٢٤<\/div><div class=\"li\">في آخر كتاب في الإلياذة، بريام بيجي يطلب جثة ابنه هيكتور من أخيل. ومين اللي بيوصله في نص الليل، ويحميه من الجيش كله؟ هيرميس.<\/div><div class=\"li\">وزيوس بيقول له إن هيرميس أكتر واحد بيحب يرافق الناس في طريقهم، وإنه يوصّل بريام لسفن الآخيين من غير ما حد يشوفه.<\/div>", "n": 3, "a": "myth-m14-038", "x": "e76145c8", "en": "Iliad 24: at the end of the Iliad Priam comes to ask Achilles for his son Hector's body. Who leads him through the night and protects him from the whole army? Hermes. Zeus says Hermes loves most to escort people and should bring Priam to the Achaean ships unseen.", "i": 52}, {"t": "tf", "h": "", "q": "في الإلياذة ٢٤، هيرميس بيوصّل بريام لسفن الآخيين من غير ما حد يشوفه.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: بيحميه في الليل.", "غلط: ده دوره."], "i": 53}, {"t": "learn", "h": "<div class=\"u\">الأوديسة ٥ و١٠<\/div><div class=\"li\">في الأوديسة ٥، زيوس بيبعته لكاليبسو، عشان يقول لها تسيب أوديسيوس يمشي.<\/div><div class=\"li\">وفي الأوديسة ١٠، بيدّي أوديسيوس العشبة اللي بتحميه من سحر سيرسي. والنص بيقول:<\/div><div class=\"u\">\"<span class=\"en\">So saying, Argeiphontes gave me the herb, drawing it from the ground, and showed me its nature. At the root it was black, but its flower was like milk. Moly the gods call it, and it is hard for mortal men to dig<\/span>; <span class=\"en\">but with the gods all things are possible<\/span>.\"<\/div>", "n": 4, "a": "myth-m14-039", "x": "ae6e071a", "en": "Odyssey 5 and 10: in book 5 Zeus sends him to Calypso to tell her to let Odysseus go. In book 10 he gives Odysseus the herb that protects him from Circe's magic: So saying, Argeiphontes gave me the herb, drawing it from the ground. Black at the root, its flower like milk. Moly the gods call it, hard for mortals to dig, but with the gods all things are possible.", "i": 54}, {"t": "learn", "h": "<div class=\"li\">يعني: وقال ده، وأدّاني العشبة، قاتل أرغوس، وشالها من الأرض، ووراني طبيعتها. كانت سودا من تحت، وزهرتها زي اللبن. مولي بيسموها الآلهة، وصعب على البشر يقلعوها، بس مع الآلهة كل حاجة ممكنة.<\/div><div class=\"li\">وده أقدم ظهور معروف للعشبة السحرية في الأدب الأوروبي، واسمها مولي.<\/div>", "n": 2, "a": "myth-m14-040", "x": "e957e0c1", "en": "Meaning: he pulled the herb from the ground and showed its nature, black root and milk flower. The gods call it moly. It is the oldest known appearance of a magic herb in European literature.", "i": 55}, {"t": "mc", "h": "", "q": "إيه اسم العشبة اللي بتحمي أوديسيوس من سحر سيرسي؟", "nq": 1, "opts": ["مولي (<span class=\"en\">moly<\/span>)", "أمبروسيا", "نكتار"], "ans": 0, "why": "مولي (<span class=\"en\">moly<\/span>)", "ex": ["صح: <span class=\"en\">moly<\/span>.", "غلط: ده طعام الآلهة.", "غلط: ده شرابهم."], "i": 56}, {"t": "section", "h": "النقطة 5: عطارد في روما", "i": 57}, {"t": "learn", "h": "<div class=\"u\">الاسم والتجارة<\/div><div class=\"li\">عطارد في الأصل إله التجار والبيع والكسب. واسمه من <span class=\"en\">merx<\/span>، بضاعة.<\/div><div class=\"li\">والرومان وحّدوه مع هيرميس، فبقى بياخد وظايفه كلها: الرسول، والدليل، والحدود.<\/div>", "n": 3, "a": "myth-m14-041", "x": "ac86221a", "en": "Mercury in Rome: originally a god of traders, profit and trade, his name from merx. The Romans identified him with Hermes, so he took all Hermes's jobs: messenger, guide, boundaries.", "i": 58}, {"t": "learn", "h": "<div class=\"u\">المعبد<\/div><div class=\"li\">معبده في روما كان في السيرك ماكسيموس، واتدشن سنة ٤٩٥ قبل الميلاد.<\/div><div class=\"li\">والمعبد اتدشن على إيد قائد مئة، والشعب هو اللي إدّاه شرف التدشين.<\/div><div class=\"li\">واختيار المكان نفسه معنى: السيرك ماكسيموس مكان السباق والتجمع والتجارة. إله الحركة في مكان الحركة. 🏇<\/div>", "n": 4, "a": "myth-m14-042", "x": "d4c0f13a", "en": "The temple: in Rome it stood by the Circus Maximus, dedicated in 495 BC. It was dedicated by a centurion, and the people gave him the honour. The place is a meaning: the Circus is a place of racing, crowds and trade, the god of movement in a place of movement.", "i": 59}, {"t": "learn", "h": "<div class=\"u\">يوم الأربع<\/div><div class=\"li\">يوم الأربع في اللاتيني هو <span class=\"en\">dies Mercurii<\/span>، يوم عطارد. والجرمان القدام ترجموا الاسم لإلههم <span class=\"en\">Woden<\/span>، فبقت <span class=\"en\">Wednesday<\/span> في الإنجليزي.<\/div><div class=\"li\">يعني كل مرة تقول <span class=\"en\">Wednesday<\/span>، إنت بتقول اسم إله قديم، بس بواحد تاني. 😄<\/div>", "n": 3, "a": "myth-m14-043", "x": "e7a420b4", "en": "Wednesday: in Latin it is dies Mercurii, day of Mercury, and the ancient Germans translated the name to their god Woden, so English has Wednesday. Every time you say Wednesday you say an old god's name, but a different one.", "i": 60}, {"t": "mc", "h": "", "q": "اسم <span class=\"en\">Wednesday<\/span> جاي من إلهه إيه؟", "nq": 1, "opts": ["<span class=\"en\">Woden<\/span> (ترجمة جرمانية لعطارد)", "<span class=\"en\">Zeus<\/span>", "<span class=\"en\">Apollo<\/span>"], "ans": 0, "why": "<span class=\"en\">Woden<\/span> (ترجمة جرمانية لعطارد)", "ex": ["صح: <span class=\"en\">dies Mercurii<\/span> اتترجم لـ <span class=\"en\">Woden<\/span>.", "غلط: مش زيوس.", "غلط: مش أبولو."], "i": 61}, {"t": "learn", "h": "<div class=\"u\">عطارد في الإنيد<\/div><div class=\"li\">في الإنيد ٤، عطارد هو اللي بينزل من السما ويقول لإينياس: إنت بتعمل إيه في قرطاج؟ سيبك من الحب وسيبك من الملكة، إنت ليك مهمة في إيطاليا.<\/div><div class=\"li\">والمشهد في الكتاب الرابع، لما جوبيتر يبعت عطارد لإينياس.<\/div><div class=\"li\">وده استخدام سياسي للأسطورة: الرسول بييجي يفضح إينياس، وبكده قرطاج وديدو بيبقوا غلطة، وروما هي الوجهة الصح.<\/div>", "n": 4, "a": "myth-m14-044", "x": "f8bfca17", "en": "Mercury in the Aeneid: in book 4 Mercury descends and tells Aeneas: what are you doing in Carthage? Leave love and the queen, you have a mission in Italy. It is a political use of myth: the messenger exposes Aeneas, Carthage and Dido become a mistake and Rome the right destination.", "i": 62}, {"t": "learn", "h": "<div class=\"li\">ولاحظ الفرق: هيرميس في هوميروس بيحمي ضيف (بريام). وعطارد في فيرجيل بيقطع علاقة حب. نفس الوظيفة، ونتيجتين عكسيتين.<\/div>", "n": 1, "a": "myth-m14-045", "x": "a4c72f2d", "en": "Note the difference: Hermes in Homer protects a guest, Priam. Mercury in Virgil cuts off a love affair. Same function, opposite results.", "i": 63}, {"t": "tf", "h": "", "q": "في الإنيد ٤، عطارد بيقطع علاقة إينياس بقرطاج.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: بأمر جوبيتر.", "غلط: ده اللي بيحصل."], "i": 64}, {"t": "section", "h": "النقطة 6: عطارد في أوفيد: المحتال اللي بياخد أجره", "i": 65}, {"t": "learn", "h": "<div class=\"u\">قصة باتوس، الميتامورفوزيس ٢<\/div><div class=\"li\">عطارد سرق بقر، وشافه راجل اسمه باتوس. فعرض عليه صفقة: لو حد سألك، قول إنك ما شفتش حاجة، وخد بقرة أجر.<\/div><div class=\"li\">وباتوس وعد. وبعدها عطارد رجع في شكل تاني، وسأله السؤال نفسه، ووعده بأجر أكبر. فباتوس فضح نفسه وقال له كل حاجة.<\/div><div class=\"li\">والدرس: الإله ده بيختبر الناس بالطمع. واللي بيبيع نفسه مرة، بيبيعها تاني.<\/div>", "n": 4, "a": "myth-m14-046", "x": "46a59bbb", "en": "Battus, Metamorphoses 2: Mercury stole cattle and a man named Battus saw him. He offered a deal: if asked, say you saw nothing, and take a cow as payment. Battus promised. Mercury came back in another shape and asked again with a bigger reward, and Battus gave himself away, so Mercury turned him to stone. The lesson: the god tests people with greed.", "i": 66}, {"t": "mc", "h": "", "q": "عطارد عمل إيه في باتوس لما فضح نفسه؟", "nq": 1, "opts": ["حوّله لحجر", "كافأه ببقرة", "نيّمه"], "ans": 0, "why": "حوّله لحجر", "ex": ["صح: حجر.", "غلط: ده الأجر الأول.", "غلط: مش نوم."], "i": 67}, {"t": "learn", "h": "<div class=\"u\">قصة فيليمون وباوسيس، الميتامورفوزيس ٨<\/div><div class=\"li\">زيوس وعطارد نزلوا الأرض في شكل بشر، ولفّوا على ألف بيت يطلبوا ضيافة، وكل الأبواب اتقفلت.<\/div><div class=\"li\">وأوفيد بيوصف عطارد هناك بإنه ابن أطلس، حامل الكادوسيوس، وحاطط أجنحته على جنب.<\/div><div class=\"li\">وفي الآخر بيت فقير واحد فتح لهم: فيليمون وباوسيس.<\/div><div class=\"li\">والدرس: الإله اللي بيدخل بيتك على شكل غريب، ممكن يكون عطارد. والضيافة في الميثولوجيا اختبار، مش مجاملة.<\/div>", "n": 5, "a": "myth-m14-047", "x": "02ad4448", "en": "Philemon and Baucis, Metamorphoses 8: Zeus and Mercury came to earth as humans and tried a thousand houses for hospitality, and every door was shut. Ovid describes Mercury as Atlas's descendant, caduceus-bearer, with his wings put aside. One poor house opened: Philemon and Baucis. Lesson: a stranger at your door may be Mercury. Hospitality in myth is a test, not courtesy.", "i": 68}, {"t": "section", "h": "النقطة 7: الأسطورة في الشعر الإنجليزي", "i": 69}, {"t": "learn", "h": "<div class=\"u\">وصلنا للجزء المهم. هيرميس/عطارد دخل الشعر الإنجليزي من بابين: باب اللص الشاب، وباب الترجمة.<\/div>", "n": 1, "a": "myth-m14-048", "x": "48050b7c", "en": "Now the main part. Hermes and Mercury entered English poetry by two doors: the young thief and translation.", "i": 70}, {"t": "learn", "h": "<div class=\"u\">الشاهد الأول: جون كيتس، لاميا، الجزء الأول<\/div><div class=\"li\">في أول القصيدة، بعد افتتاحية قصيرة، هيرميس سايب عرشه ونازل يدور على حورية:<\/div><div class=\"u\">\"<span class=\"en\">The ever-smitten Hermes empty left<\/span><\/div><div class=\"u\"><span class=\"en\">His golden throne, bent warm on amorous theft<\/span>:<\/div><div class=\"u\"><span class=\"en\">From high Olympus had he stolen light<\/span>,<\/div><div class=\"u\"><span class=\"en\">On this side of Jove's clouds, to escape the sight<\/span><\/div><div class=\"u\"><span class=\"en\">Of his great summoner, and made retreat<\/span><\/div><div class=\"u\"><span class=\"en\">Into a forest on the shores of Crete<\/span>.\"<\/div>", "n": 8, "a": "myth-m14-049", "x": "6464e513", "en": "First witness, Keats, Lamia part 1. In the opening, after a short prelude, Hermes leaves his throne to look for a nymph: The ever-smitten Hermes empty left his golden throne, bent warm on amorous theft: from high Olympus had he stolen light, on this side of Jove's clouds, to escape the sight of his great summoner, and made retreat into a forest on the shores of Crete.", "i": 71}, {"t": "mc", "h": "", "q": "إيه اللي بيعمله هيرميس في أول قصيدة لاميا؟", "nq": 1, "opts": ["بيساب عرشه وينزل يدور على حورية", "بيقتل أرغوس", "بيغني لأبولو"], "ans": 0, "why": "بيساب عرشه وينزل يدور على حورية", "ex": ["صح: وبيهرب من اللي بيبعته.", "غلط: ده مش الموضوع هنا.", "غلط: مش بيغني."], "i": 72}, {"t": "learn", "h": "<div class=\"li\">والترجمة: هيرميس، اللي دايمًا مصدوم بالحب، ساب عرشه الدهبي فاضي، وماشي بحرارة في سرقة عاطفية. من أوليمبوس العالي كان سارق نزلة، على الناحية دي من سحاب جوبيتر، عشان يهرب من نظر اللي استدعاه، وانسحب لجوة غابة على شط كريت.<\/div><div class=\"li\">الشرح: كيتس بيستخدم هيرميس في أول قصيدة، وبيرجع للصورة الأصلية: الإله الشاب اللي بيسرق. بس السرقة هنا مش بقر، دي سرقة حب. وكلمة <span class=\"en\">amorous theft<\/span> بتفكرنا بروح الترنيمة: هو حرامي، والحب حرامي.<\/div>", "n": 2, "a": "myth-m14-050", "x": "52e59a8f", "en": "Translation and comment: Hermes, ever struck by love, left his golden throne empty, bent on a theft of love. Keats returns to the original image: the young god who steals, but here the theft is love, not cattle. Amorous theft recalls the spirit of the hymn.", "i": 73}, {"t": "learn", "h": "<div class=\"li\">والتفصيلة الأهم: \"<span class=\"en\">to escape the sight of his great summoner<\/span>\". يعني هيرميس هرب من اللي بيبعته. الرسول بيتمرد على المرسل. وده اللي بيخلي القصيدة تبدأ.<\/div><div class=\"li\">والقصة بعدين بتكمل: هيرميس بيقابل لاميا، وهي ثعبان، وبيساعدها مقابل إنها تدّيه الحورية اللي بيدور عليها. ولاميا قصيدة عن التحول.<\/div>", "n": 2, "a": "myth-m14-051", "x": "08e314ae", "en": "The key detail: to escape the sight of his great summoner. Hermes runs from the one who sends him, the messenger rebels against the sender, and that starts the poem. Later Hermes meets Lamia, a serpent, and helps her in return for the nymph he is looking for. Lamia is a poem about transformation.", "i": 74}, {"t": "learn", "h": "<div class=\"u\">الشاهد التاني: كريستوفر مارلو، هيرو وليندر<\/div><div class=\"li\">مارلو بيوصف عطارد في الجزء الأول من القصيدة، لما شاف بنت جميلة:<\/div><div class=\"u\">\"<span class=\"en\">Heavens winged herrald, Jove-borne Mercury<\/span>,<\/div><div class=\"u\"><span class=\"en\">The self-same day that he asleepe had layd<\/span><\/div><div class=\"u\"><span class=\"en\">Inchaunted Argus, spied a countrie mayd<\/span>,<\/div><div class=\"u\"><span class=\"en\">Whose carelesse haire, in stead of pearle t'adorne it<\/span>,<\/div><div class=\"u\"><span class=\"en\">Glist'red with deaw<\/span>...\"<\/div>", "n": 7, "a": "myth-m14-052", "x": "4a0f0e22", "en": "Second witness, Marlowe, Hero and Leander. Marlowe describes Mercury in the first part of the poem when he sees a beautiful girl: Heaven's winged herald, Jove-born Mercury, the same day that he had lulled enchanted Argus asleep, spied a country maid, whose careless hair, instead of pearl to adorn it, glistered with dew.", "i": 75}, {"t": "learn", "h": "<div class=\"li\">والترجمة: رسول السما المجنح، عطارد المحمول من جوبيتر، في نفس اليوم اللي كان بينيّم فيه أرغوس المسحور، شاف بنت ريفية، شعرها المهمل، بدل ما يتزين باللؤلؤ، كان بيلمع بالندى.<\/div><div class=\"li\">الشرح: في سطرين، مارلو جمع كل حاجة في الفصل: الجناحات، والرسول، وقتل أرغوس، والمرأة.<\/div><div class=\"li\">وكلمة \"<span class=\"en\">Inchaunted Argus<\/span>\" بتربط اللقب اليوناني بالحكاية: هيرميس نوّم أرغوس بالحكي والموسيقى، وبعدها قتله. 🎵<\/div>", "n": 3, "a": "myth-m14-053", "x": "5dcbcc61", "en": "Translation: heaven's winged herald, born of Jove, on the day he put enchanted Argus to sleep, saw a country girl whose careless hair glistened with dew instead of pearls. Comment: in two lines Marlowe gathers the whole chapter: wings, messenger, the killing of Argus and a woman. Enchanted Argus links the Greek title to the story: Hermes lulled Argus with words and music and then killed him.", "i": 76}, {"t": "learn", "h": "<div class=\"u\">الشاهد التالت: بيرسي بيش شيلي، ترنيمة لعطارد<\/div><div class=\"li\">شيلي ترجم الترنيمة الهوميرية الرابعة كاملة، ونشرها بعنوان \"<span class=\"en\">Hymn to Mercury<\/span>\"، وطبعت بعد وفاته سنة ١٨٢٤.<\/div><div class=\"li\">وده مش اقتباس، ده النص نفسه بينتقل للإنجليزي. يعني الترنيمة اللي اتكتبت في العصر القديم، غالباً حوالي القرن السادس قبل الميلاد، بقت قصيدة إنجليزية في القرن التسعتاشر.<\/div><div class=\"li\">وده مثال على إن الشعراء الإنجليز بيترجموا هيرميس كمان، فهو إله الترجمة بشكل ما.<\/div>", "n": 4, "a": "myth-m14-054", "x": "913d1a7b", "en": "Third witness, Shelley, Hymn to Mercury: Shelley translated the whole fourth Homeric Hymn and it was printed after his death in 1824. It is not a quotation, it is the text moving into English: a hymn written in antiquity, probably around the sixth century BC, becoming an English poem in the nineteenth century. An example of English poets translating Hermes, who is in a way the god of translation.", "i": 77}, {"t": "learn", "h": "<div class=\"u\">وليه هيرميس مناسب للشعر الإنجليزي أكتر من أي إله؟<\/div><div class=\"li\">لأنه إله الكلام. والرسول واللص والمترجم والتاجر كلهم بيشتغلوا بالكلام.<\/div><div class=\"li\">ولأنه إله الانتقال. والشعر الإنجليزي كله تقريباً بيتكلم عن لحظة انتقال: من حال لحال، من مكان لمكان، من حياة لموت.<\/div><div class=\"li\">ولأنه إله الحدود. والشعر بيقف على الحدود: بين المعنى والتفسير، بين الأصل والترجمة، بين اللي اتقال واللي اتقصد.<\/div>", "n": 4, "a": "myth-m14-055", "x": "fef21504", "en": "Why is Hermes so fitting for English poetry? He is the god of speech: messenger, thief, translator and trader all work with words. He is the god of transition, and English poetry is nearly always about a moment of change. He is the god of borders, and poetry stands on borders: between meaning and interpretation, original and translation, what was said and what was meant.", "i": 78}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين هيرميس عند هوميروس في الإلياذة ٢٤ وعطارد عند فيرجيل في الإنيد ٤. الاتنين رسول بيبعته كبير الآلهة، لكن النتيجة مختلفة. إيه الفرق؟", "a": "<div class=\"u\">الوظيفة واحدة: رسول بيبعته كبير الآلهة. عند هوميروس في الإلياذة ٢٤، هيرميس بيوصّل بريام لسفن الآخيين من غير ما حد يشوفه، فهو بيحمي راجل ضعيف وبيفتح له الطريق.<\/div><div class=\"u\">وعند فيرجيل في الإنيد ٤، عطارد بينزل لإينياس بأمر جوبيتر ويقول له يسيب قرطاج وديدو ويروح إيطاليا، فهو بيقطع علاقة حب.<\/div><div class=\"u\">يعني هيرميس هنا حامي، وعطارد هنا منفذ لقرار سياسي. والفرق ده بيوضح إن الأسطورة بتتغير مع الثقافة: عند اليونان الرسول مرافق وحامي، وعند الرومان الرسول بيخدم مصير روما.<\/div><div class=\"u\">ومع كده الاتنين بيعدّوا الحدود: بريام بيعدّي معسكر العدو، وإينياس بيطلع من قرطاج. الخلاصة: نفس الرسول، لكن اتجاه الرسالة بيتغير حسب هدف الشاعر.<\/div>", "key": "myth-m14:W55", "n": 1, "i": 79}, {"t": "section", "h": "النقطة 8: إزاي تعرف هيرميس في قصيدة", "i": 80}, {"t": "learn", "h": "<div class=\"u\">خمس مجموعات كلمات:<\/div><div class=\"li\">الأسماء: <span class=\"en\">Hermes<\/span>، <span class=\"en\">Mercury<\/span>، <span class=\"en\">Cyllenian<\/span>، <span class=\"en\">Maia<\/span>، <span class=\"en\">Argeiphontes<\/span>، <span class=\"en\">Atlantiades<\/span>.<\/div><div class=\"li\">الحركة: <span class=\"en\">wing<\/span>، <span class=\"en\">winged<\/span>، <span class=\"en\">fly<\/span>، <span class=\"en\">speed<\/span>، <span class=\"en\">swift<\/span>، <span class=\"en\">road<\/span>، <span class=\"en\">path<\/span>، <span class=\"en\">gate<\/span>، <span class=\"en\">threshold<\/span>، <span class=\"en\">cross<\/span>.<\/div><div class=\"li\">الرسالة: <span class=\"en\">message<\/span>، <span class=\"en\">herald<\/span>، <span class=\"en\">embassy<\/span>، <span class=\"en\">word<\/span>، <span class=\"en\">news<\/span>، <span class=\"en\">interpret<\/span>، <span class=\"en\">translate<\/span>.<\/div><div class=\"li\">الخداع: <span class=\"en\">theft<\/span>، <span class=\"en\">thief<\/span>، <span class=\"en\">trick<\/span>، <span class=\"en\">craft<\/span>، <span class=\"en\">cunning<\/span>، <span class=\"en\">wile<\/span>، <span class=\"en\">bargain<\/span>، <span class=\"en\">trade<\/span>، <span class=\"en\">market<\/span>.<\/div><div class=\"li\">الحد بين الحياة والموت: <span class=\"en\">wand<\/span>، <span class=\"en\">rod<\/span>، <span class=\"en\">golden<\/span>، <span class=\"en\">sleep<\/span>، <span class=\"en\">wake<\/span>، <span class=\"en\">shade<\/span>، <span class=\"en\">ghost<\/span>، <span class=\"en\">soul<\/span>، <span class=\"en\">lead<\/span>، <span class=\"en\">guide<\/span>.<\/div>", "n": 6, "a": "myth-m14-056", "x": "77f4b3c2", "en": "How to recognise Hermes in a poem: five word groups. Names: Hermes, Mercury, Cyllenian, Maia, Argeiphontes, Atlantiades. Movement: wing, fly, swift, road, path, gate, threshold. Message: herald, embassy, word, news, interpret, translate. Trickery: theft, thief, trick, cunning, wile, bargain, trade, market. Between life and death: wand, rod, golden, sleep, wake, shade, ghost, soul, lead, guide.", "i": 81}, {"t": "learn", "h": "<div class=\"u\">ولو لقيت تلاتة من دول، احتمال كبير إنك قدام هيرميس.<\/div><div class=\"u\">والفرق عن الآلهة اللي فاتوا: كلمات زيوس فيها السلطة والصاعقة. كلمات أبولو فيها النور والنبوة والشعر. كلمات أرتميس فيها القمر والغابة. كلمات أثينا فيها الدرع والنول والقانون. كلمات أفروديت فيها النار والسهم والزبد. وكلمات هيرميس فيها الجناح والطريق والعصاية والصفقة.<\/div>", "n": 2, "a": "myth-m14-057", "x": "6bcab0a8", "en": "If you find three of these, you are probably looking at Hermes. Compared with earlier gods: Zeus has authority and the thunderbolt, Apollo light, prophecy and poetry, Artemis moon and forest, Athena shield, loom and law, Aphrodite fire, arrow and foam. Hermes has wing, road, staff and bargain.", "i": 82}, {"t": "section", "h": "النقطة 9: سؤال مفتوح", "i": 83}, {"t": "learn", "h": "<div class=\"u\">فيه سؤال في الفصل ده، ومش هجاوب عليه.<\/div><div class=\"u\">هيرميس إله اللصوص، وفي نفس الوقت إله الرسول الأمين. وزيوس بيوصفه في الإلياذة بإنه أكتر إله بيحب مرافقة الناس.<\/div><div class=\"u\">السؤال: إزاي إله واحد يبقى أمين وخاين في نفس الوقت؟<\/div><div class=\"li\">فيه قراءة بتقول: لأن الأمانة مش في نقل الكلام حرفياً، الأمانة في إنك تنقل اللي محتاج يتنقل، مش كل اللي اتقال. والرسول الحكيم بيفهم إيه اللي يتقال وإيه اللي يتخبى.<\/div>", "n": 4, "a": "myth-m14-058", "x": "1020d21f", "en": "An open question: Hermes is the god of thieves and also the faithful messenger. Zeus describes him in the Iliad as the god who most loves escorting people. How can one god be faithful and treacherous? One reading: faithfulness is not literal transmission but carrying what needs to be carried, and a wise messenger knows what to say and what to hide.", "i": 84}, {"t": "learn", "h": "<div class=\"li\">وفيه قراءة تانية بتقول: لأن السلطة نفسها مبنية على الكتمان. اللي بيوصل الرسالة هو اللي بيعرف أسرارها، واللي بيعرف الأسرار بيقدر يبيعها.<\/div><div class=\"li\">والاتنين بيقروا نفس النص، والسؤال يفضل مفتوح.<\/div>", "n": 2, "a": "myth-m14-059", "x": "6cb48721", "en": "A second reading: power itself is built on secrecy. Whoever delivers the message knows its secrets, and whoever knows secrets can sell them. Both readings read the same text, and the question stays open.", "i": 85}, {"t": "section", "h": "النقطة 10: أخطاء شائعة", "i": 86}, {"t": "learn", "h": "<div class=\"li\">هيرميس إله اللصوص بس. لأ. هو إله الحركة كلها: الطرق، والتجارة، والرسالة، والحدود، والنوم، والموت.<\/div><div class=\"li\">هيرميس ابن أفروديت. لأ. هو ابن زيوس ومايا. اللي ابن أفروديت هو إيروس، وده اللي خدناه في الفصل اللي فات.<\/div><div class=\"li\">القيثارة اختراع أبولو. لأ. اختراع هيرميس، وهو اللي إدّاها لأبولو كهدية.<\/div><div class=\"li\">عطارد نسخة رومانية مطابقة. قريب، بس عطارد في الأصل إله تجارة وكسب، والاسم نفسه من <span class=\"en\">merx<\/span>، بضاعة.<\/div>", "n": 4, "a": "myth-m14-060", "x": "c0d6b043", "en": "Common mistakes: Hermes is not only the god of thieves, he is the god of all movement: roads, trade, messages, borders, sleep and death. He is not Aphrodite's son, he is the son of Zeus and Maia, and Eros is Aphrodite's. The lyre is not Apollo's invention, it is Hermes's, who gave it as a gift. Mercury is not an exact Roman copy: originally a god of trade and profit, with a name from merx.", "i": 87}, {"t": "tf", "h": "", "q": "القيثارة اختراع أبولو.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: اختراع هيرميس وإدّاها لأبولو.", "صح: العكس."], "i": 88}, {"t": "learn", "h": "<div class=\"li\">الهيرم مجرد تمثال. لأ. الهيرم علامة حدود ووقاية، وكانت بتتحط على الطرق والمفترقات ومداخل البيوت.<\/div>", "n": 1, "a": "myth-m14-061", "x": "8e28e906", "en": "The herm is not just a statue: it is a boundary and protective marker, set on roads, crossroads and house entrances.", "i": 89}, {"t": "section", "h": "ملخص في عشر جمل", "i": 90}, {"t": "learn", "h": "<div class=\"li\">هيرميس ابن زيوس ومايا بنت أطلس، واتولد في كهف على جبل كيليني في أركاديا.<\/div><div class=\"li\">في أول يوم في حياته اخترع القيثارة من صدفة سلحفاة، وسرق خمسين بقرة من أبولو.<\/div><div class=\"li\">الحيلة كانت في آثار الحوافر المقلوبة، وفي جزمة منسوجة تخفي أثره.<\/div><div class=\"li\">لما اتهمه أبولو، دافع عن نفسه بأنه رضيع بيحب اللبن والنوم والحمام الساخن.<\/div><div class=\"li\">زيوس ضحك، والاتنين تصالحوا، وهيرميس إدّى القيثارة لأبولو هدية.<\/div>", "n": 5, "a": "myth-m14-062", "x": "82b594a7", "en": "Summary, part one: Hermes is the son of Zeus and Maia, born in a cave on Mount Cyllene in Arcadia. On his first day he invented the lyre from a tortoise shell and stole fifty cows from Apollo. The trick was reversed hoof-prints and woven sandals that hid his trail. Accused by Apollo, he defended himself as a baby who likes milk, sleep and warm baths. Zeus laughed, they made peace, and Hermes gave Apollo the lyre.", "i": 91}, {"t": "learn", "h": "<div class=\"li\">وظايفه: الرسالة، والطرق، والحدود، والتجارة، واللصوص، والنوم، وقيادة الأرواح.<\/div><div class=\"li\">لقبه أرجهيفونتيس يعني قاتل أرغوس، وسايكوبومبوس يعني دليل الأرواح.<\/div><div class=\"li\">في الأوديسة ٢٤ بيقود أرواح الخاطبين بعصاية دهب، وفي الإلياذة ٢٤ بيحمي بريام.<\/div><div class=\"li\">عطارد الروماني إله تجارة، واسمه من <span class=\"en\">merx<\/span> بضاعة، ومعبده في السيرك ماكسيموس اتدشن ٤٩٥ قبل الميلاد.<\/div><div class=\"li\">في الشعر الإنجليزي، هيرميس هو إله الترجمة والانتقال، والشعراء بيستخدموه لما يتكلموا عن الكلام نفسه.<\/div>", "n": 5, "a": "myth-m14-063", "x": "88ed331c", "en": "Summary, part two: his jobs are message, roads, borders, trade, thieves, sleep and guiding souls. Argeiphontes means slayer of Argus and psychopompos means guide of souls. In Odyssey 24 he leads the suitors' spirits with a golden wand, in Iliad 24 he protects Priam. Roman Mercury is a god of trade, from merx, and his temple by the Circus Maximus was dedicated in 495 BC. In English poetry Hermes is the god of translation and transition, and poets use him to talk about speech itself.", "i": 92}, {"t": "section", "h": "الخلاصة", "i": 93}, {"t": "learn", "h": "<div class=\"u\">هيرميس هو الإله اللي بيفتح الأبواب. مش لأنه قوي، لأنه بيعرف فين الباب.<\/div><div class=\"u\">وهو الإله اللي بيعرف إن الكلام ممكن يكون رسالة، وممكن يكون صفقة، وممكن يكون سرقة.<\/div><div class=\"u\">وفي الفصل الجاي، هنقابل إلهين متضادين: آريس، الحرب العنيفة، وهيفايستوس، الصنعة الهادية. والاتنين كانوا في قصة أفروديت اللي خدناها.<\/div>", "n": 3, "a": "myth-m14-064", "x": "2781209a", "en": "Conclusion: Hermes is the god who opens doors, not because he is strong but because he knows where the door is. He knows speech can be a message, a deal or a theft. Next: Ares and Hephaestus, violent war and quiet craft, both in the Aphrodite story.", "i": 94}, {"t": "end", "h": "", "teaser": "الدرس الجاي: آريس وهيفايستوس، الحرب العنيفة والصنعة الهادية، والاتنين كانوا في قصة أفروديت.", "extra": "", "i": 95}];</script>
