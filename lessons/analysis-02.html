<h1>تحليل ٢: قصيدة Prufrock لإليوت — الجزء الثاني (السطور <span dir="ltr">75-131</span>)</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">تحليل ٢ من ٢</span><span class="tag"><span class="em">🖋️</span> تحليل القصائد المهمة</span></div>

<script>window.LESSON_ID="analysis-02";window.STEPS=[{"t":"learn","h":"<div class=\"u\">في الجزء الأول شفنا الدعوة، والضباب، والوقت، والخوف من الوشوش، والسلطعون. الجزء التاني هو المواجهة: هيعمل إيه بالسؤال الكبير؟ والإجابة هتكون صادمة في بساطتها.</div><div class=\"u\">لاحظ حاجة في الشكل: الجزء ده مليان تكرار وأسئلة («<span class=\"en\">Would it have been worth it</span>») — ده مش ضعف، ده أسلوب بيحاكي التردد نفسه.</div>","n":2,"i":0,"a":"analysis-02-001","x":"6592b24d"},{"t":"section","h":"المساء النائم (<span dir=\"ltr\">75-80</span>)","n":1,"i":1},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">75-78</span>:</div><div class=\"u\"><span class=\"en\">And the afternoon, the evening, sleeps so peacefully! / Smoothed by long fingers, / Asleep … tired … or it malingers, / Stretched on the floor, here beside you and me.</span></div>","n":2,"i":2,"a":"analysis-02-002","x":"dd13d07e"},{"t":"learn","h":"<div class=\"u\">المساء هنا نايم زي كائن ممدد على الأرض: هدوء، تعب، أو «<span class=\"en\">malingers</span>» يعني بيتمارض ويتصنّع المرض. تشخيص (<span class=\"en\">personification</span>) بيكمّل صورة المريض المخدر في السطور <span dir=\"ltr\">2-3</span>.</div><div class=\"u\">والمساء نايم «هنا جنبك وجنبي» — يعني المشهد جوّه أوضة، بين اتنين، والسكون ثقيل.</div>","n":2,"i":3,"a":"analysis-02-003","x":"125a3ac8"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">79-80</span>:</div><div class=\"u\"><span class=\"en\">Should I, after tea and cakes and ices, / Have the strength to force the moment to its crisis?</span></div>","n":2,"i":4,"a":"analysis-02-004","x":"1b0c474e"},{"t":"learn","h":"<div class=\"u\">الشاي والكيك والمثلجات (<span class=\"en\">ices</span>) في سطر، و«<span class=\"en\">crisis</span>» في السطر اللي بعده. الكلمة هنا مزدوجة: لحظة حسم في العلاقة، وأزمة طبية. الحلويات الصغيرة قبل الأزمة = تناقض ساخر (<span class=\"en\">bathos</span>).</div>","n":1,"i":5,"a":"analysis-02-005","x":"0ae4334b"},{"t":"section","h":"النبي والقدم (<span dir=\"ltr\">81-86</span>)","n":1,"i":6},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">81-83</span>:</div><div class=\"u\"><span class=\"en\">But though I have wept and fasted, wept and prayed, / Though I have seen my head (grown slightly bald) brought in upon a platter, / I am no prophet — and here’s no great matter</span></div>","n":2,"i":7,"a":"analysis-02-006","x":"5738851b"},{"t":"learn","h":"<div class=\"u\">إحالة (<span class=\"en\">allusion</span>) على يوحنا المعمدان، اللي اتقدم راسه على طبق لهيرودس. وPrufrock بيتخيل راسه هو على الطبق — بس «صلعته بانت شوية».</div><div class=\"u\">النتيجة: «أنا مش نبي، والموضوع مش كبير». بيكسر البطولة بنفسه، وده أسلوب البطل المقلوب (<span class=\"en\">mock-heroic</span>).</div>","n":2,"i":8,"a":"analysis-02-007","x":"6de9c9bc"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">84-86</span>:</div><div class=\"u\"><span class=\"en\">I have seen the moment of my greatness flicker, / And I have seen the eternal Footman hold my coat, and snicker, / And in short, I was afraid.</span></div>","n":2,"i":9,"a":"analysis-02-008","x":"909dd391"},{"t":"learn","h":"<div class=\"u\">«القدم الأبدي» (<span class=\"en\">the eternal Footman</span>) = الموت، زي خادم بياخد بالطو ويضحك منك. وفجأة: «<span class=\"en\">in short, I was afraid</span>» — جملة قصيرة بلغة عادية بعد كل الصور الكبيرة.</div><div class=\"u\">ده مشهد الاعتراف الحقيقي في القصيدة: كل التعقيد بيتلخص في خوف. والمفارقة إن الاعتراف بالخوف أقوى من كل الاستعارات.</div>","n":2,"i":10,"a":"analysis-02-009","x":"e1f7bd8e"},{"t":"section","h":"هل كان يستحق؟ (<span dir=\"ltr\">87-98</span>)","n":1,"i":11},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">87-91</span>:</div><div class=\"u\"><span class=\"en\">And would it have been worth it, after all, / After the cups, the marmalade, the tea, / Among the porcelain, among some talk of you and me, / Would it have been worth while, / To have bitten off the matter with a smile</span></div>","n":2,"i":12,"a":"analysis-02-010","x":"d880a702"},{"t":"learn","h":"<div class=\"u\">قائمة أشياء تافهة (كوباية، مربى، شاي، بورسلين) قبل السؤال الكبير. التكرار «<span class=\"en\">would it have been worth it</span>» بيرجع تاني في 99 وفي 106 — تكرار (<span class=\"en\">anaphora</span>) بيحوّل السؤال لطار.</div>","n":1,"i":13,"a":"analysis-02-011","x":"dec895e8"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">92-93</span>:</div><div class=\"u\"><span class=\"en\">To have squeezed the universe into a ball / To roll it towards some overwhelming question</span></div>","n":2,"i":14,"a":"analysis-02-012","x":"c0994c36"},{"t":"learn","h":"<div class=\"u\">إحالة على <span class=\"en\">Marvell</span> في <span class=\"en\">To His Coy Mistress</span>: «<span class=\"en\">Let us roll all our strength and all / Our sweetness up into one ball</span>». مارفل بيطلب لحظة حب جريئة؛ Prufrock بياخد الصورة ويحوّلها لكورة يتدحرجها ناحية سؤال — حركة بلا هدف.</div>","n":1,"i":15,"a":"analysis-02-013","x":"583cc498"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">94-98</span>:</div><div class=\"u\"><span class=\"en\">To say: “I am Lazarus, come from the dead, / Come back to tell you all, I shall tell you all”— / If one, settling a pillow by her head / Should say: “That is not what I meant at all; / That is not it, at all.”</span></div>","n":2,"i":16,"a":"analysis-02-014","x":"7add518f"},{"t":"learn","h":"<div class=\"u\">إحالة على لعازر اللي قام من الموت (إنجيل يوحنا 11). Prufrock بيتخيل نفسه راجع من الموت عشان يقول كل حاجة... والرد: «ده مش اللي قصدته خالص».</div><div class=\"u\">ده أهم سطر في موضوع التواصل: حتى لو رجع من الموت بالحقيقة، الست هتقول «مش ده اللي قصدته». فشل اللغة نفسه، مش فشل المتكلم بس.</div>","n":2,"i":17,"a":"analysis-02-015","x":"fe7a003a"},{"t":"section","h":"الصور والتكرار (<span dir=\"ltr\">99-110</span>)","n":1,"i":18},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">99-103</span>:</div><div class=\"u\"><span class=\"en\">And would it have been worth it, after all, / Would it have been worth while, / After the sunsets and the dooryards and the sprinkled streets, / After the novels, after the teacups, after the skirts that trail along the floor— / And this, and so much more?—</span></div>","n":2,"i":19,"a":"analysis-02-016","x":"bfd9f2b4"},{"t":"learn","h":"<div class=\"u\">تكرار السؤال بنفس الكلمات تقريبًا، وقائمة أطول من التفاصيل اليومية (غروب، حوش البيت، شوارع مبلولة، روايات، فناجين، تنانير). القائمة نفسها بتحسسك بثقل الحياة العادية.</div><div class=\"u\">الشرطة (—) بعد «<span class=\"en\">And this, and so much more?</span>» بتقطع الكلام زي ما الفكرة بتتقطع.</div>","n":2,"i":20,"a":"analysis-02-017","x":"48488303"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">104-105</span>:</div><div class=\"u\"><span class=\"en\">It is impossible to say just what I mean! / But as if a magic lantern threw the nerves in patterns on a screen</span></div>","n":2,"i":21,"a":"analysis-02-018","x":"799f1201"},{"t":"learn","h":"<div class=\"u\">«<span class=\"en\">It is impossible to say just what I mean</span>» — إعلان صريح بفشل التعبير. وبعدها صورة <span class=\"en\">magic lantern</span> (فانوس سحري بيعرض صور على حيطة) = العقل بيتعرض على شاشة.</div><div class=\"u\">الصورة دي حداثية: تكنولوجيا حديثة (بروجيكتور) بدل صورة طبيعية، والأعصاب (<span class=\"en\">nerves</span>) بقيت مادة تتفرج عليها.</div>","n":2,"i":22,"a":"analysis-02-019","x":"2d5c6201"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">106-110</span>:</div><div class=\"u\"><span class=\"en\">Would it have been worth while / If one, settling a pillow or throwing off a shawl, / And turning toward the window, should say: / “That is not it at all, / That is not what I meant, at all.”</span></div>","n":2,"i":23,"a":"analysis-02-020","x":"543ec6b5"},{"t":"learn","h":"<div class=\"u\">السؤال للمرة التالتة، والرد للمرة التانية بنفس المعنى. لاحظ الحركة: الست بتظبط المخدة أو ترمي الشال وتبص ناحية الشباك — مش ناحيته. الرفض هنا جسماني: بتحوّل وشها.</div>","n":1,"i":24,"a":"analysis-02-021","x":"5413c003"},{"t":"section","h":"أنا مش هاملت (<span dir=\"ltr\">111-119</span>)","n":1,"i":25},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">111-114</span>:</div><div class=\"u\"><span class=\"en\">No! I am not Prince Hamlet, nor was meant to be; / Am an attendant lord, one that will do / To swell a progress, start a scene or two, / Advise the prince; no doubt, an easy tool</span></div>","n":2,"i":26,"a":"analysis-02-022","x":"61a165a8"},{"t":"learn","h":"<div class=\"u\">إحالة على <span class=\"en\">Hamlet</span> لشكسبير. Hamlet بطل بيتردد في قرار كبير؛ Prufrock بيقول: أنا مش هاملت ولا اتصممت أكون. أنا لورد مرافق، بكمّل المشهد وأمشي.</div><div class=\"u\">ده تعريف صريح للبطل غير البطولي (<span class=\"en\">anti-hero</span>): راجل ثانوي في قصته هو نفسه.</div>","n":2,"i":27,"a":"analysis-02-023","x":"1ec14bfd"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">115-119</span>:</div><div class=\"u\"><span class=\"en\">Deferential, glad to be of use, / Politic, cautious, and meticulous; / Full of high sentence, but a bit obtuse; / At times, indeed, almost ridiculous— / Almost, at times, the Fool.</span></div>","n":2,"i":28,"a":"analysis-02-024","x":"a9afa7f8"},{"t":"learn","h":"<div class=\"u\">صفات الموظف المطيع: مؤدب، حريص، دقيق، «مليان كلام عالي» (<span class=\"en\">high sentence</span> — وصف Chaucer للكاتب العالم في حكايات كانتربري)، لكنه بليد شوية، وأحيانًا سخيف، وأحيانًا المهرّج (<span class=\"en\">the Fool</span>).</div><div class=\"u\">السخرية من نفسه هي اللي بتخلي القارئ يتعاطف معاه بدل ما يضحك عليه.</div>","n":2,"i":29,"a":"analysis-02-025","x":"0f3e255b"},{"t":"section","h":"الشيخوخة والخوخ (<span dir=\"ltr\">120-123</span>)","n":1,"i":30},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">120-121</span>:</div><div class=\"u\"><span class=\"en\">I grow old … I grow old … / I shall wear the bottoms of my trousers rolled.</span></div>","n":2,"i":31,"a":"analysis-02-026","x":"ef92b817"},{"t":"learn","h":"<div class=\"u\">«كبرت… كبرت» بتكرار ونقط، وبعدها قرار سخيف: هشمّر بنطلوني. النقط (<span class=\"en\">ellipsis</span>) بتخلي الجملة تخرج زي تنهيدة.</div><div class=\"u\">بعض القراءات بتشوف شمر البنطلون محاولة للتمسك بالشباب أو قرار سخيف بلا معنى — والاتنين بيقولوا نفس الحاجة: هو بيدير تفاصيل صغيرة بدل المواجهة.</div>","n":2,"i":32,"a":"analysis-02-027","x":"ebe15175"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">122-123</span>:</div><div class=\"u\"><span class=\"en\">Shall I part my hair behind? Do I dare to eat a peach? / I shall wear white flannel trousers, and walk upon the beach.</span></div>","n":2,"i":33,"a":"analysis-02-028","x":"bf263e99"},{"t":"learn","h":"<div class=\"u\">سؤالين تافهين: أفرّق شعري من ورا؟ أجرؤ آكل خوخاية؟ الخوخ هنا حِسّي: عصير وسيلان وقذارة محتملة — يعني الخوف من الجسد ومن المتعة نفسها.</div><div class=\"u\">وبعدها قرار آمن: بنطلون أبيض ومشي على الشاطئ. الحياة بقت اختيارات صغيرة آمنة، مش مواجهة.</div>","n":2,"i":34,"a":"analysis-02-029","x":"0806800b"},{"t":"section","h":"الحوريات والنهاية (<span dir=\"ltr\">124-131</span>)","n":1,"i":35},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">124-125</span>:</div><div class=\"u\"><span class=\"en\">I have heard the mermaids singing, each to each. / I do not think that they will sing to me.</span></div>","n":2,"i":36,"a":"analysis-02-030","x":"c167024b"},{"t":"learn","h":"<div class=\"u\">الحوريات (<span class=\"en\">mermaids</span>) = الجمال والخيال والحب. لكنهم بيغنّوا «لبعضهم» (<span class=\"en\">each to each</span>)، مش له. جملة واحدة قصيرة بتحمل رفض العالم كله.</div>","n":1,"i":37,"a":"analysis-02-031","x":"627b6654"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">126-128</span>:</div><div class=\"u\"><span class=\"en\">I have seen them riding seaward on the waves / Combing the white hair of the waves blown back / When the wind blows the water white and black.</span></div>","n":2,"i":38,"a":"analysis-02-032","x":"97fe6d0d"},{"t":"learn","h":"<div class=\"u\">الحوريات بيمشطوا «الشعر الأبيض» للموج — صورة جميلة، وفيها صدى للشيخوخة (شعر أبيض). والبحر أبيض وأسود في الريح: جمال وخوف في نفس الصورة.</div>","n":1,"i":39,"a":"analysis-02-033","x":"cef189e4"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">129-131</span>:</div><div class=\"u\"><span class=\"en\">We have lingered in the chambers of the sea / By sea-girls wreathed with seaweed red and brown / Till human voices wake us, and we drown.</span></div>","n":2,"i":40,"a":"analysis-02-034","x":"4ca45c6d"},{"t":"learn","h":"<div class=\"u\">آخر تلات سطور: «إحنا» رجعوا (إنت وأنا)، اتأخرنا في أوض البحر مع بنات البحر، لحد ما الأصوات البشرية تصحّينا... ونغرق.</div><div class=\"u\">الصحوة من الحلم = الغرق في الواقع. مفيش خلاص: اليقظة نفسها موت. وده أقوى إغلاق للقصيدة، وبيخليها تراجيدية بلا حدث.</div>","n":2,"i":41,"a":"analysis-02-035","x":"274ffb1c"},{"t":"section","h":"الأدوات البلاغية (الجزء الثاني)","n":1,"i":42},{"t":"learn","h":"<div class=\"li\">إحالات: يوحنا المعمدان (<span dir=\"ltr\">81-83</span>)، لعازر (94)، مارفل (92)، هاملت (111)، Chaucer في «<span class=\"en\">high sentence</span>» (117).</div><div class=\"li\">تشخيص: المساء النائم (<span dir=\"ltr\">75-78</span>).</div><div class=\"li\">باثوس / تناقض ساخر: «شاي وكيك» قبل «الأزمة» (<span dir=\"ltr\">79-80</span>).</div>","n":3,"i":43,"a":"analysis-02-036","x":"c91d76fc"},{"t":"learn","h":"<div class=\"li\">تكرار (<span class=\"en\">anaphora</span>): «<span class=\"en\">would it have been worth it</span>» (87، 99، 106).</div><div class=\"li\">قوائم (<span class=\"en\">catalogue</span>): الأشياء اليومية (<span dir=\"ltr\">88-89</span>، <span dir=\"ltr\">101-102</span>).</div><div class=\"li\">تشبيه: الفانوس السحري (105).</div><div class=\"li\">رمز: الخوخ، الحوريات، البحر.</div><div class=\"li\">نقط القطع (<span class=\"en\">ellipsis</span>): «<span class=\"en\">I grow old … I grow old …</span>».</div>","n":5,"i":44,"a":"analysis-02-037","x":"3c6f7d3a"},{"t":"section","h":"الموضوعات (القصيدة كلها)","n":1,"i":45},{"t":"learn","h":"<div class=\"u\">القصيدة كلها بتدور على: الشلل والتردد؛ فشل التواصل («مش ده اللي قصدته»)؛ الخوف من الموت والشيخوخة؛ الرغبة والخوف منها؛ العزلة في المدينة؛ والحياة الصغيرة الآمنة بدل المواجهة.</div>","n":1,"i":46,"a":"analysis-02-038","x":"4eb5ee7b"},{"t":"learn","h":"<div class=\"u\">والسؤال الساحق لسه من غير اسم. القصيدة مبتجاوبش عليه، وده جوابها: إن السؤال اللي مش بيتقال هو اللي بيحكم الحياة. في الامتحان: «عدم تسمية السؤال جزء من معنى القصيدة».</div>","n":1,"i":47,"a":"analysis-02-039","x":"12d845da"},{"t":"learn","h":"<div class=\"u\">جملة تنفع كأطروحة في الامتحان: «Prufrock is a modern anti-hero whose tragedy is not that he fails to act, but that he has already decided he cannot.»</div>","n":1,"i":48,"a":"analysis-02-040","x":"29cff310"},{"t":"section","h":"أسئلة امتحان","n":1,"i":49},{"t":"learn","h":"<div class=\"lead\">سؤال ١: ناقش فشل التواصل في القصيدة.</div><div class=\"u\">عناصر: الـ you الغامض، اللازمة عن الستات، لعازر (<span dir=\"ltr\">94-98</span>)، «<span class=\"en\">That is not what I meant at all</span>»، «<span class=\"en\">It is impossible to say just what I mean</span>» (104)، والحوريات اللي بتغني لبعضها (124).</div>","n":2,"i":50,"a":"analysis-02-041","x":"b56afed2"},{"t":"learn","h":"<div class=\"lead\">سؤال ٢: «Prufrock is not Prince Hamlet» — ناقش دلالة المقارنة.</div><div class=\"u\">عناصر: هاملت بطل تراجيدي بتردد مأساوي؛ Prufrock لورد مرافق/أداة سهلة؛ «<span class=\"en\">almost the Fool</span>»؛ النتيجة: تردد بلا مأساة، كوميديا سوداء.</div>","n":2,"i":51,"a":"analysis-02-042","x":"93279141"},{"t":"learn","h":"<div class=\"lead\">سؤال ٣: حلّل النهاية (<span dir=\"ltr\">129-131</span>).</div><div class=\"u\">عناصر: حلم البحر والحوريات، «<span class=\"en\">human voices</span>» = الواقع، «<span class=\"en\">and we drown</span>» = الغرق عند اليقظة، عودة «<span class=\"en\">we</span>» اللي بتربط بالبداية.</div>","n":2,"i":52,"a":"analysis-02-043","x":"798de0a9"},{"t":"learn","h":"<div class=\"lead\">سؤال ٤: إزاي بيعرض إليوت الشيخوخة والخوف من الجسد؟</div><div class=\"u\">عناصر: الصلعة (40، 82)، «<span class=\"en\">I grow old</span>» (120)، البنطلون المشمّر، «<span class=\"en\">Do I dare to eat a peach?</span>» (122)، والشعر الأبيض للموج (127).</div>","n":2,"i":53,"a":"analysis-02-044","x":"28440414"},{"t":"section","h":"الكويز","n":1,"i":54},{"t":"mc","h":"","q":"المساء في السطور <span dir=\"ltr\">75-78</span> موصوف كإنه إيه؟","opts":["كائن نايم ومتمارض على الأرض","عاصفة قادمة","امرأة بتغني"],"ans":0,"why":"كائن نايم ومتمارض، وده تشخيص.","n":1,"i":55,"ex":["صح: «نايم بسلام، ملسه أصابع طويلة، تعبان أو بيتمارض» — تشخيص بيكمّل صورة المريض المخدر في أول القصيدة.","غلط: مفيش أي عاصفة أو خطر في السطور؛ السمة الأساسية هي السكون والتعب.","غلط: الغنا بيظهر متأخر مع الحوريات (124)، مش هنا."]},{"t":"mc","h":"","q":"إحالة «head brought in upon a platter» بيرجع لمين؟","opts":["يوحنا المعمدان","لعازر","هاملت"],"ans":0,"why":"يوحنا المعمدان.","n":1,"i":56,"ex":["صح: راس يوحنا المعمدان اتقدمت على طبق لهيرودس، وPrufrock بيتخيل راسه هو على الطبق.","غلط: لعازر اتذكر بعد كده (94) لكنه قام من الموت، مش راس على طبق.","غلط: هاملت بيتذكر في 111، وملهوش علاقة بالطبق."]},{"t":"mc","h":"","q":"«I am no prophet — and here’s no great matter» بيعمل إيه؟","opts":["بيكسر البطولة وبيصغّر الموقف بسخرية","بيأكد إنه نبي حقيقي","بيوصف مشهد ديني مقدس"],"ans":0,"why":"بيكسر البطولة ويصغّر الموقف.","n":1,"i":57,"ex":["صح: بعد صورة الراس على الطبق، بيرجع ويقول «أنا مش نبي والموضوع مش كبير» — بطل مقلوب (mock-heroic).","غلط: هو بيقول عكس كده بالظبط: «أنا مش نبي».","غلط: المشهد مبني على إحالة دينية، لكن وظيفته السخرية من نفسه مش التقديس."]},{"t":"mc","h":"","q":"«Do I dare to eat a peach?» بتعبّر عن إيه؟","opts":["الخوف من المتعة الجسدية ومن الالتفاتة السخيفة","حب الفواكه","قرار مالي مهم"],"ans":0,"why":"الخوف من المتعة الجسدية ومن السخافة.","n":1,"i":58,"ex":["صح: الخوخ حِسّي (عصير وسيلان)، والسؤال بيدور على الخوف من الجسد ومن إنه يبان سخيف.","غلط: الأكل هنا رمز، مش موضوع طعام.","غلط: مفيش أي فلوس في السياق؛ القرارات كلها صغيرة واجتماعية."]},{"t":"tf","h":"","q":"Prufrock بيشبّه نفسه في النهاية بـ Prince Hamlet.","ans":false,"why":"غلط: هو بيقول صريح «أنا مش هاملت ولا اتصممت أكون» وبعدها يشبّه نفسه بلورد مرافق.","n":1,"i":59,"ex":["غلط. هو بينفي الشبه: «No! I am not Prince Hamlet, nor was meant to be».","صح، الجملة غلط: هو بينفي الشبه صريح ويقول إنه لورد مرافق مش بطل."]},{"t":"tf","h":"","q":"النهاية بتخلّي الصحوة من الحلم سببًا للغرق.","ans":true,"why":"صح: «لحد ما الأصوات البشرية تصحّينا، وإحنا نغرق» — اليقظة نفسها موت.","n":1,"i":60,"ex":["صح، الجملة صح: الصحوة من الحلم بتساوي الغرق.","غلط. النص بيقول «and we drown» بعد الصحوة مباشرة."]},{"t":"recall","h":"","q":"إيه الفرق بين إحالة مارفل في 92 وإحالة مارفل في 23؟","a":"الاتنين من «To His Coy Mistress». في 23 «فيه وقت» بقت أداة تأجيل بدل دعوة للفعل. وفي 92 «نلف الكون في كورة» بقت كورة بتتدحرج ناحية سؤال، مش ناحية حب. الاتنين بيستخدموا طاقة قصيدة حب في اتجاه معاكس.","n":1,"i":61},{"t":"recall","h":"","q":"إزاي القصيدة بتعرّف البطل غير البطولي في <span dir=\"ltr\">111-119</span>؟","a":"بالمقارنة بهاملت: مش بطل تراجيدي، لكن لورد مرافق بيكمّل مشهد، مؤدب وحريص ودقيق، «مليان كلام عالي» لكن بليد، وأحيانًا سخيف، وأحيانًا المهرّج. يعني راجل ثانوي في قصته.","n":1,"i":62},{"t":"write","h":"","q":"حلّل النهاية (السطور <span dir=\"ltr\">129-131</span>) ووظيفة «human voices» فيها.","key":"analysis-02:1","a":"النهاية بتحوّل القصيدة لحلم: «احنا اتأخرنا في أوض البحر» مع الحوريات. الصورة رومانسية وجميلة، لكن «الأصوات البشرية» هي الواقع والمجتمع اللي بيصحّي المتكلم، والصحوة بتساوي الغرق. يعني الحياة الاجتماعية موت، والخيال هو المكان الوحيد اللي فيه جمال — وهو مكان مش بتاعه. وعودة «we» بتربط النهاية بالبداية (you and I) وتقفل الدائرة.","n":1,"i":63},{"t":"write","h":"","q":"اكتب فقرة: إزاي بيعالج إليوت أزمة اللغة والتواصل في القصيدة؟","key":"analysis-02:2","a":"القصيدة بتعرض التواصل كفشل بنيوي: الـ you غير محدد، الستات بيتكلموا عن مايكل أنجلو، لعازر بيرجع من الموت والرد «مش ده اللي قصدته»، وبعدها إعلان صريح «It is impossible to say just what I mean»، والفانوس السحري بيحول الأعصاب لصور على شاشة. والنهاية: الحوريات بيغنوا «لبعضهم». يعني اللغة موجودة، لكن المعنى مش بيوصل، والقصيدة نفسها بتعمل المشكلة اللي بتتكلم عنها.","n":1,"i":64},{"t":"end","h":"","teaser":"<div class=\"u\">خلصت Prufrock كله: 131 سطرًا، من دعوة المساء للغرق في الآخر.</div><div class=\"u\">الدرس الجاي: The Hollow Men — العالم اللي بعد الحرب، وأشباح الناس.</div>","extra":"المصادر: Eliot, “The Love Song of J. Alfred Prufrock” (1915; Prufrock and Other Observations, 1917); Eliot, “Tradition and the Individual Talent” (1919); “Hamlet and His Problems” (1919); Dante, Inferno XXVII; Marvell, “To His Coy Mistress”; Shakespeare, Hamlet, Twelfth Night; Chaucer, The Canterbury Tales; John 11 (Lazarus); Mark 6 (John the Baptist).","i":65}];</script>
