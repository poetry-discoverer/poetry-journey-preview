<script>window.LESSON_ID="intensive-1";window.STEPS=[{"t": "section", "h": "1) ما هذا المنهج؟", "i": 0}, {"t": "learn", "h": "<div class=\"u\">النقد النفسي-التحليلي (<span class=\"en\">Psychoanalytic Criticism<\/span>) مدرسة معروفة في دراسة الأدب، تقوم على أفكار الطبيب والمفكر النمساوي <span class=\"en\">Sigmund Freud<\/span> (1856-1939). يقرأ النص بأسئلة عن الرغبات والصراعات النفسية التي قد تظهر في الكلام بشكل مباشر أو مقنَّع. وهو أحد المناهج الأساسية إلى جانب الشكلي والتاريخي والنسوي.<\/div>", "n": 1, "a": "intensive-1-001", "x": "d9baefc0", "i": 1}, {"t": "learn", "h": "<div class=\"u\">ومن الدقة أن نفهم فرويد جيداً. فقد رأى أن الدافع الجنسي (<span class=\"en\">libido<\/span>) قوة مهمة في تكوين النفس، لكنه لم يقل إن كل شيء في الحياة هو الجنس حرفياً. وبعد الحرب العالمية الأولى عدّل نظريته وأضاف \"غريزة الموت\" (<span class=\"en\">Thanatos<\/span>) في مقابل \"غريزة الحياة\" (<span class=\"en\">Eros<\/span>)، في كتابه <span class=\"en\">Beyond the Pleasure Principle<\/span> (1920).<\/div>", "n": 1, "a": "intensive-1-002", "x": "32e1e869", "i": 2}, {"t": "mc", "h": "", "q": "ما الذي يعنيه <span class=\"en\">Superego<\/span> في نظرية فرويد؟", "opts": ["الضمير والمعايير الأخلاقية", "الجزء الواقعي الذي يوازن", "الرغبات الخام الفورية"], "ans": 0, "why": "الضمير والمعايير الأخلاقية", "i": 3, "ex": ["صح: <span class=\"en\">Superego<\/span> هو الجزء الذي يحمل الضمير والمعايير الأخلاقية.", "غلط: هذا الـ <span class=\"en\">Ego<\/span>، الذي يوازن بين الـ <span class=\"en\">Id<\/span> والـ <span class=\"en\">Superego<\/span> والواقع.", "غلط: هذا الـ <span class=\"en\">Id<\/span>، الذي يطلب الإشباع الفوري."]}, {"t": "section", "h": "2) أفكاره الأساسية", "i": 4}, {"t": "learn", "h": "<div class=\"u\">أولاً: اللاوعي (<span class=\"en\">the Unconscious<\/span>): جزء من النفس فيه رغبات ومخاوف مكبوتة (<span class=\"en\">repressed<\/span>) لا نكون واعين بها، لكنها قد تظهر في الأحلام وفي زلات اللسان وفي الفن. ثانياً: بنية النفس عنده، كما في كتابه <span class=\"en\">The Ego and the Id<\/span> (1923)، ثلاثة أجزاء.<\/div>", "n": 1, "a": "intensive-1-003", "x": "761b03f1", "i": 5}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Id<\/span> (الهو): الدوافع الخام التي تريد الإشباع فوراً. الـ <span class=\"en\">Ego<\/span> (الأنا): الجزء الواقعي الذي يوازن بين الرغبة والواقع. الـ <span class=\"en\">Superego<\/span> (الأنا الأعلى): الضمير والمعايير الأخلاقية. والصراع بين هذه الأجزاء الثلاثة هو مادة كثير من القراءات النفسية للشخصيات والنصوص.<\/div>", "n": 1, "a": "intensive-1-004", "x": "094cd702", "i": 6}, {"t": "learn", "h": "<div class=\"u\">ثالثاً: الأحلام. في <span class=\"en\">The Interpretation of Dreams<\/span> (1900) رأى فرويد أن الحلم تحقيقٌ متنكّر لرغبة مكبوتة. وللحلم آليتان: <span class=\"en\">Condensation<\/span> (دمج عدة أفكار في صورة واحدة) و<span class=\"en\">Displacement<\/span> (نقل الشحنة الانفعالية إلى شيء آخر). لاحظ أن الدمج يشبه في بنيته الاستعارة (<span class=\"en\">metaphor<\/span>) التي درستها في كورس الشعر.<\/div>", "n": 1, "a": "intensive-1-005", "x": "e5a2e9de", "i": 7}, {"t": "mc", "h": "", "q": "أي كتاب لفرويد صدر عام 1900 وفيه فكرة أن الحلم تحقيق متنكر لرغبة مكبوتة؟", "opts": ["<span class=\"en\">Beyond the Pleasure Principle<\/span>", "<span class=\"en\">The Ego and the Id<\/span>", "<span class=\"en\">The Interpretation of Dreams<\/span>"], "ans": 2, "why": "<span class=\"en\">The Interpretation of Dreams<\/span>", "i": 8, "ex": ["غلط: صدر عام 1920، وفيه فكرة غريزة الموت.", "غلط: صدر عام 1923، وفيه النموذج: <span class=\"en\">Id<\/span> و<span class=\"en\">Ego<\/span> و<span class=\"en\">Superego<\/span>.", "صح: <span class=\"en\">The Interpretation of Dreams<\/span> نُشر في نهاية 1899 وتحمل طبعته الأولى تاريخ 1900، وفيه تفسير الأحلام."]}, {"t": "learn", "h": "<div class=\"u\">رابعاً: عقدة أوديب (<span class=\"en\">Oedipus Complex<\/span>): فكرة أن الطفل يتعلق بوالدته وينافس والده في مرحلة مبكرة. والاسم من مسرحية <span class=\"en\">Oedipus Rex<\/span> لسوفوكليس. وخامساً: مراحل النمو النفسي-الجنسي (فموية، شرجية، قضيبية، كمون، تناسلية)، والفكرة العامة أن الطفولة تشكّل الشخصية.<\/div>", "n": 1, "a": "intensive-1-006", "x": "493e26e6", "i": 9}, {"t": "section", "h": "3) كيف دخلت هذه الأفكار إلى النقد الأدبي؟", "i": 10}, {"t": "learn", "h": "<div class=\"u\">في مقال <span class=\"en\">Creative Writers and Day-Dreaming<\/span> (1908) شبّه فرويد الكاتب بالحالم أو باللاعب: يحوّل رغباته إلى عمل خيالي. ومن هنا ظهرت فكرة التسامي (<span class=\"en\">Sublimation<\/span>): توجيه طاقة الرغبة نحو هدف مقبول اجتماعياً مثل الفن. فيقرأ الناقد القصيدة بسؤال: ما الرغبة أو الصراع الذي قد يختبئ خلف الكلام؟<\/div>", "n": 1, "a": "intensive-1-007", "x": "0e26ffae", "i": 11}, {"t": "tf", "h": "", "q": "قال فرويد إن كل شيء في الحياة هو الجنس حرفياً.", "ans": false, "why": "غلط", "i": 12, "ex": ["غلط: هذه عبارة مبسطة. <span class=\"en\">Freud<\/span> جعل الدافع الجنسي (<span class=\"en\">libido<\/span>) قوة أساسية، لكنه لم يقل إن كل شيء جنس حرفياً.", "صح أن الجملة غلط: <span class=\"en\">Freud<\/span> قال إن الدافع الجنسي قوة مهمة في تكوين النفس، ولم يقل إن كل شيء جنس."]}, {"t": "learn", "h": "<div class=\"u\">يلخّص الدارسون الاستخدام النقدي عادةً في أربعة اتجاهات. الأول: تحليل المؤلف (حياته ودوافعه). الثاني: تحليل الشخصيات داخل النص. الثالث: تحليل القارئ (لماذا يؤثر النص فينا؟). الرابع: تحليل اللغة والرموز في النص نفسه. وسنرى أمثلة على الاتجاهين الثاني والرابع في الدرس 6.<\/div>", "n": 1, "a": "intensive-1-008", "x": "d6670d59", "i": 13}, {"t": "learn", "h": "<div class=\"u\">مثال شهير: فسّر فرويد تردد هاملت في الانتقام بأن هاملت يحمل رغبة لاواعية قريبة مما فعله عمّه كلوديوس: التخلص من الأب والزواج بالأم. فلا يستطيع معاقبته لأنه يرى فيه ما كان يرغب فيه هو نفسه. ورد هذا في <span class=\"en\">The Interpretation of Dreams<\/span>، وطوّره <span class=\"en\">Ernest Jones<\/span> في <span class=\"en\">Hamlet and Oedipus<\/span> (1949).<\/div>", "n": 1, "a": "intensive-1-009", "x": "d1c05828", "i": 14}, {"t": "section", "h": "4) تنبيه منهجي", "i": 15}, {"t": "learn", "h": "<div class=\"u\">هذه قراءات يقدمها ناقدون، وليست حقائق مثبتة عن الشاعر أو الشخصية. وللمدرسة نفسها انتقادات علمية وأدبية معروفة، سنعرضها في الدرس 5، منها أنها يصعب اختبارها علمياً، وأنها قد تفسر النص بحياة المؤلف أكثر مما يحتمل. استخدمها كأداة قراءة بين أدوات أخرى.<\/div>", "n": 1, "a": "intensive-1-010", "x": "e768b819", "i": 16}, {"t": "mc", "h": "", "q": "ماذا تعني <span class=\"en\">Condensation<\/span> في تفسير الأحلام؟", "opts": ["دمج عدة أفكار في صورة واحدة", "نسيان الحلم", "نقل الشحنة الانفعالية إلى شيء آخر"], "ans": 0, "why": "دمج عدة أفكار في صورة واحدة", "i": 17, "ex": ["صح: <span class=\"en\">Condensation<\/span> أن تُدمج عدة أفكار أو أشخاص في صورة واحدة في الحلم.", "غلط: نسيان الحلم ظاهرة منفصلة، وليست آلية من آليات عمل الحلم.", "غلط: هذا الإزاحة (<span class=\"en\">Displacement<\/span>)."]}, {"t": "mc", "h": "", "q": "عند <span class=\"en\">Freud<\/span>: الحلم هو تحقيق _____ لرغبة مكبوتة.", "opts": ["واعٍ", "متنكر", "مباشر"], "ans": 1, "why": "متنكر", "i": 18, "ex": ["غلط: الرغبة مكبوتة في اللاوعي، فتحقيقها في الحلم ليس واعياً.", "صح: عند <span class=\"en\">Freud<\/span> الحلم تحقيق متنكر (<span class=\"en\">disguised<\/span>) لرغبة مكبوتة، لأن الرغبة تظهر في صور رمزية.", "غلط: لو كان مباشراً لما احتجنا إلى تفسير الأحلام."]}, {"t": "write", "h": "", "q": "اشرح بجملتين لماذا قرأ فرويد تردد هاملت قراءة نفسية.", "a": "لأن فرويد رأى أن تردد هاملت في الانتقام قد يرتبط برغبات ومشاعر مكبوتة، وهي قراءة نفسية مقترحة وليست حكماً نهائياً (مثل قراءة <span class=\"en\">Jones<\/span> عام 1949).", "key": "intensive-1:essay", "i": 19}, {"t": "end", "h": "", "teaser": "ما درسته: ما هو المنهج النفسي-التحليلي، أفكار فرويد الأساسية، وكيف تدخل القراءة الأدبية، مع تنبيه منهجي. الدرس القادم: ما بعد فرويد (<span class=\"en\">Jung<\/span> و<span class=\"en\">Lacan<\/span> و<span class=\"en\">Kristeva<\/span>).", "extra": "المصادر: Freud, The Interpretation of Dreams (1900); Creative Writers and Day-Dreaming (1908); Beyond the Pleasure Principle (1920); The Ego and the Id (1923); Jones, Hamlet and Oedipus (1949).", "i": 20}];</script>
