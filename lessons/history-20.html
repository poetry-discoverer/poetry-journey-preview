<div class="tags"><span class="tag"><span class="em">📊</span> تمهيدي</span><span class="tag">الدرس 20</span><span class="tag"><span class="em">📜</span> تاريخ الشعر</span></div>

<script>window.LESSON_ID="history-20", "history-21", "history-13", "history-14", "history-15", "history-16", "history-17";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"u\">الدرس اللي فات فتحنا الكتاب: طبعة 1609، والإهداء الغامض، والأقسام الأربعة، وسونيت 18 و130. النهاردة هندخل جوه الكتاب. وهنقرا تلات سونيتات، وكل واحدة فيهم بتحاول تحل نفس المشكلة بطريقة مختلفة تماماً: إزاي تعيش حاجة جميلة وهي عارفة إنها هتخلص؟<\/div><div class=\"u\">والدرس ده فيه حاجة مهمة جداً في القراءة الأدبية: السونيت مش بيقف لوحده. السونيت اللي بتقراه في صفحة 20 في الكتاب، معناه بيتغير لأن اللي قبله واللي بعده بيفرقوا. وهنشوف ده بوضوح في سونيت 116.<\/div>", "n": 2, "a": "history-20-001", "x": "fd21a77b", "en": "Last lesson we opened the book: the 1609 edition, the mysterious dedication, the four parts, sonnets 18 and 130. Today we go inside with three sonnets that try to solve one problem: how to live something beautiful while knowing it will end. And a sonnet does not stand alone: its meaning changes with what comes before and after, as we will see in 116.", "i": 1}, {"t": "section", "h": "النقطة 1: سونيت 73: تلات صور للزوال", "i": 2}, {"t": "learn", "h": "<div class=\"u\">📌 النص:<\/div><div class=\"u\"><span class=\"en\">That time of year thou mayst in me behold<\/span><\/div><div class=\"u\"><span class=\"en\">When yellow leaves, or none, or few, do hang<\/span><\/div><div class=\"u\"><span class=\"en\">Upon those boughs which shake against the cold<\/span>,<\/div><div class=\"u\"><span class=\"en\">Bare ruined choirs, where late the sweet birds sang<\/span>.<\/div><div class=\"u\"><span class=\"en\">In me thou see'st the twilight of such day<\/span><\/div><div class=\"u\"><span class=\"en\">As after sunset fadeth in the west<\/span>,<\/div><div class=\"u\"><span class=\"en\">Which by and by black night doth take away<\/span>,<\/div><div class=\"u\"><span class=\"en\">Death's second self, that seals up all in rest<\/span>.<\/div><div class=\"u\"><span class=\"en\">In me thou see'st the glowing of such fire<\/span><\/div>", "n": 10, "a": "history-20-002", "x": "7099fdd7", "en": "Sonnet 73, first part: That time of year thou mayst in me behold, up to the fire image.", "i": 3}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">That on the ashes of his youth doth lie<\/span>,<\/div><div class=\"u\"><span class=\"en\">As the death-bed whereon it must expire<\/span>,<\/div><div class=\"u\"><span class=\"en\">Consumed with that which it was nourished by<\/span>.<\/div><div class=\"u\"><span class=\"en\">This thou perceiv'st, which makes thy love more strong<\/span>,<\/div><div class=\"u\"><span class=\"en\">To love that well which thou must leave ere long<\/span>.<\/div>", "n": 5, "a": "history-20-003", "x": "6bf86ad9", "en": "Sonnet 73, last part: ...Consumed with that which it was nourished by. This thou perceiv'st, which makes thy love more strong, To love that well which thou must leave ere long.", "i": 4}, {"t": "learn", "h": "<div class=\"u\">📌 الصورة الأولى: الخريف<\/div><div class=\"li\">\"<span class=\"en\">that time of year<\/span>\": وقت السنة اللي بتشوفني فيه. الشاعر بيقول للشاب: أنا الموسم ده.<\/div><div class=\"li\">والأوراق \"صفرا، أو مفيش، أو قليلة\"، والترتيب ده مقصود: من صفرا، لمفيش، لقليلة. يعني الشجرة فاضية أكتر من إنها مليانة.<\/div><div class=\"li\">والأغصان بترتعش من البرد، والأغصان دي كانت \"جوقة خربة عارية\" (<span class=\"en\">bare ruined choirs<\/span>) كان الطير الحلو بيغني فيها.<\/div>", "n": 4, "a": "history-20-004", "x": "9e4ecae7", "en": "First image, autumn: I am that season. Yellow leaves, or none, or few: the tree is emptier than full. The branches shake in the cold, bare ruined choirs where sweet birds sang.", "i": 5}, {"t": "mc", "h": "", "q": "إيه ترتيب الصور التلاتة في سونيت 73؟", "nq": 1, "opts": ["سنة، يوم، لحظة", "لحظة، يوم، سنة", "يوم، سنة، لحظة"], "ans": 0, "why": "سنة، يوم، لحظة", "ex": ["صح: كل صورة بتضيّق الوقت.", "غلط: الترتيب بيضيق مش بيوسع.", "غلط: بيبدأ بالسنة."], "i": 6}, {"t": "learn", "h": "<div class=\"li\">التفسير المشهور للصورة دي: شبابيك الكنايس اللي اتخربت في إنجلترا بعد حل الأديرة. الشبابيك دي كانت فيها زجاج ملوّن، ولما اتكسرت بقيت فتحات عارية، والطيور بتدخل تعشش فيها. فالصورة فيها حاجة مزدوجة: الأغصان زي الشبابيك، والطيور اللي كانت بتغني زي الجوقة اللي كانت بتصلي.<\/div><div class=\"li\">ومعنى تاني: الجوقة اللي غنّت زمان سابت مكانها. والصوت راح، والمكان فضل.<\/div>", "n": 2, "a": "history-20-005", "x": "11a2b8a0", "en": "A well-known reading of the choirs: the church windows and choirs ruined after the dissolution of the monasteries; the birds nest in the empty openings. The singing is gone and the place remains.", "i": 7}, {"t": "tf", "h": "", "q": "\"<span class=\"en\">bare ruined choirs<\/span>\" بتتفسر غالباً على إنها شبابيك وجوقات الكنايس اللي اتخربت بعد حل الأديرة.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: وده تفسير مشهور مش مؤكد.", "غلط: ده فعلاً التفسير المشهور."], "i": 8}, {"t": "learn", "h": "<div class=\"u\">📌 الصورة التانية: الغروب<\/div><div class=\"li\">\"<span class=\"en\">the twilight of such day<\/span>\": الشفق بعد الغروب، وهو بيموت في الغرب.<\/div><div class=\"li\">وبعد شوية الليل الأسود بياخده، والليل هنا \"التاني بتاع الموت\" (<span class=\"en\">Death's second self<\/span>)، لأنه بيقفل كل حاجة في الراحة، زي ما الموت بيقفل العمر.<\/div><div class=\"li\">الصورة دي أصغر من الأولى: مش سنة، دي يوم واحد.<\/div>", "n": 4, "a": "history-20-006", "x": "611c4e39", "en": "Second image, sunset: the twilight after the sun sets, soon taken by black night, Death's second self, which seals everything in rest. Smaller than the first: not a year, one day.", "i": 9}, {"t": "learn", "h": "<div class=\"u\">📌 الصورة التالتة: النار<\/div><div class=\"li\">النار بتحمرّ فوق الرماد، والرماد هو شبابها اللي بقى رماد.<\/div><div class=\"li\">والنار دي على سرير الموت، وبتنتهي، وبتحرق نفسها بالحاجة اللي كانت بتتغذى بيها.<\/div><div class=\"li\">الصورة دي أصغر كمان: مش يوم، دي لحظة. لحظة النار اللي بتطفى.<\/div>", "n": 4, "a": "history-20-007", "x": "42efff73", "en": "Third image, fire: the glow lies on the ashes of his youth, on its deathbed, consumed by what fed it. Smaller still: not a day, a moment.", "i": 10}, {"t": "mc", "h": "", "q": "إيه الصورة التالتة في سونيت 73؟", "nq": 1, "opts": ["نار بتطفى فوق الرماد", "نجم بيتحرك", "موج بيعلى"], "ans": 0, "why": "نار بتطفى فوق الرماد", "ex": ["صح: لحظة النار اللي بتطفى.", "غلط: النجم في سونيت 116.", "غلط: مفيش موج."], "i": 11}, {"t": "learn", "h": "<div class=\"u\">📌 الحركة اللي في القصيدة:<\/div><div class=\"li\">سنة ← يوم ← لحظة. كل صورة بتضيّق الوقت.<\/div><div class=\"li\">وده مش جمال بلاغي، ده إحساس. الشاعر بيحس إن عمره بيتسارع، والقصيدة نفسها بتتسارع.<\/div><div class=\"li\">والصورة بتتراجع: الشجرة الكبيرة، وبعدين يوم، وبعدين نار صغيرة على رماد.<\/div>", "n": 4, "a": "history-20-008", "x": "78b2a37b", "en": "The movement: year, day, moment. Each image narrows time. It is a feeling, not rhetoric: his life seems to speed up and the poem speeds up with it.", "i": 12}, {"t": "learn", "h": "<div class=\"u\">📌 البيت الأخير، وهو أهم حاجة في القصيدة:<\/div><div class=\"li\">\"أنت شايف ده، وده اللي بيخلي حبك أقوى: إنك تحب اللي هتسيبه قريب\".<\/div><div class=\"li\">خد بالك من المنطق الغريب: عادةً المعرفة بالزوال بتقلل الحب، أو بتخليه حزين. هنا بالعكس. المعرفة بتزوّد الحب.<\/div>", "n": 3, "a": "history-20-009", "x": "da58b57b", "en": "The last couplet matters most: you see this, and it makes your love stronger, to love what you must soon leave. Odd logic: knowing something ends usually lowers love, here it increases it.", "i": 13}, {"t": "mc", "h": "", "q": "إيه المنطق الغريب في آخر بيتين من سونيت 73؟", "nq": 1, "opts": ["معرفة الزوال بتزوّد الحب", "الحب بيموت مع الشباب", "الشاعر بيهرب"], "ans": 0, "why": "معرفة الزوال بتزوّد الحب", "ex": ["صح: بتحب اللي هتسيبه قريب.", "غلط: العكس هو اللي بيحصل.", "غلط: هو بيقبل."], "i": 14}, {"t": "learn", "h": "<div class=\"li\">وفيه غموض مقصود: مين اللي هيسيب مين؟ الشاعر بيقول \"<span class=\"en\">in me<\/span>\" يعني فيّ أنا، فالشاب بيشوف الشاعر وهو بيكبر. لكن البيت الأخير بيقول \"اللي أنت هتسيبه\"، يعني الشاب هو اللي هيسيب الشاعر، أو العمر هو اللي هيسيب الاتنين.<\/div><div class=\"li\">والغموض ده مش عيب، ده جزء من القصيدة: الحب هنا مبني على الوداع، مش على الوعد.<\/div>", "n": 2, "a": "history-20-010", "x": "8fcf008e", "en": "A deliberate ambiguity: who leaves whom? He says in me, so the young man watches the poet age, but the couplet says what you must leave, so the young man leaves him, or time leaves both. Love here is built on farewell, not promise.", "i": 15}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: صاحبك مسافر بعد أسبوع. الأسبوع ده هتقعد معاه أكتر، وتقول له كلام عمرك ما قلته. الوقت اللي قلّ هو اللي خلّى الحب يبان. سونيت 73 بيقول نفس الحاجة، بس على مدى عمر.<\/div>", "n": 1, "a": "history-20-011", "x": "93d0d2ac", "en": "Everyday example: a friend travels in a week; you sit with him more and say things you never said. The shrinking time reveals the love. Sonnet 73 says the same over a lifetime.", "i": 16}, {"t": "section", "h": "النقطة 2: سونيت 116: الحب مش خاضع للزمن", "i": 17}, {"t": "learn", "h": "<div class=\"u\">📌 النص:<\/div><div class=\"u\"><span class=\"en\">Let me not to the marriage of true minds<\/span><\/div><div class=\"u\"><span class=\"en\">Admit impediments. Love is not love<\/span><\/div><div class=\"u\"><span class=\"en\">Which alters when it alteration finds<\/span>,<\/div><div class=\"u\"><span class=\"en\">Or bends with the remover to remove<\/span>.<\/div><div class=\"u\"><span class=\"en\">O no, it is an ever-fix<\/span>è<span class=\"en\">d mark<\/span><\/div><div class=\"u\"><span class=\"en\">That looks on tempests and is never shaken<\/span>;<\/div><div class=\"u\"><span class=\"en\">It is the star to every wandering bark<\/span>,<\/div><div class=\"u\"><span class=\"en\">Whose worth's unknown, although his height be taken<\/span>.<\/div><div class=\"u\"><span class=\"en\">Love's not Time's fool, though rosy lips and cheeks<\/span><\/div><div class=\"u\"><span class=\"en\">Within his bending sickle's compass come<\/span>;<\/div>", "n": 11, "a": "history-20-012", "x": "edea7afe", "en": "Sonnet 116, first part: Let me not to the marriage of true minds admit impediments, up to the sickle.", "i": 18}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Love alters not with his brief hours and weeks<\/span>,<\/div><div class=\"u\"><span class=\"en\">But bears it out even to the edge of doom<\/span>.<\/div><div class=\"u\"><span class=\"en\">If this be error and upon me proved<\/span>,<\/div><div class=\"u\"><span class=\"en\">I never writ, nor no man ever loved<\/span>.<\/div>", "n": 4, "a": "history-20-013", "x": "3b4bfc74", "en": "Sonnet 116, rest: Love alters not with his brief hours and weeks, but bears it out even to the edge of doom. If this be error and upon me proved, I never writ, nor no man ever loved.", "i": 19}, {"t": "learn", "h": "<div class=\"u\">📌 البداية طقس جواز:<\/div><div class=\"li\">\"<span class=\"en\">let me not... admit impediments<\/span>\": يعني \"ما أقرّش بأي مانع\". والجملة دي مأخوذة من طقس الجواز في كتاب الصلاة الإنجليزي، اللي كان بيسأل العروسين: لو حد فيكم يعرف مانع شرعي يمنع الجواز، يقول دلوقتي.<\/div><div class=\"li\">فالشاعر واقف في موقف الكاهن، أو في موقف العروسين، وبيقول: أنا مش شايف مانع.<\/div><div class=\"li\">والجواز هنا مش جواز جسد: \"<span class=\"en\">marriage of true minds<\/span>\"، جواز عقلين صادقين.<\/div>", "n": 4, "a": "history-20-014", "x": "c09ddeb4", "en": "It begins like a wedding: let me not admit impediments comes from the marriage service in the English prayer book, asking if anyone knows an impediment. The poet stands in the priest's place: I see none. And it is a marriage of true minds, not bodies.", "i": 20}, {"t": "mc", "h": "", "q": "جملة \"<span class=\"en\">admit impediments<\/span>\" في سونيت 116 جاية من فين؟", "nq": 1, "opts": ["طقس الجواز في كتاب الصلاة الإنجليزي", "محكمة", "خطبة ملكية"], "ans": 0, "why": "طقس الجواز في كتاب الصلاة الإنجليزي", "ex": ["صح: كان بيسأل لو فيه مانع.", "غلط: مش من محكمة.", "غلط: مش من خطبة."], "i": 21}, {"t": "learn", "h": "<div class=\"u\">📌 التعريف بالسلب:<\/div><div class=\"li\">الحب مش حب لو بيتغير لما يلاقي تغيير.<\/div><div class=\"li\">ومش حب لو بينثني لما الطرف التاني ينثني.<\/div><div class=\"li\">وده تعريف غريب: بدل ما يقول لك الحب إيه، بيقول لك الحب مش إيه. والطريقة دي اسمها تعريف بالسلب، وهي طريقة قوية، لأنها بتقفل كل الأبواب اللي ممكن حد يهرب منها.<\/div>", "n": 4, "a": "history-20-015", "x": "fd98d93b", "en": "Definition by negation: love is not love if it alters when it finds change, or bends when the other bends. Saying what love is not closes every escape door.", "i": 22}, {"t": "tf", "h": "", "q": "سونيت 116 بتعرّف الحب بإنه إيه هو، مش بإنه إيه مش هو.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: بتعرّفه بالسلب: الحب مش حب لو بيتغير.", "صح: دي العكس."], "i": 23}, {"t": "learn", "h": "<div class=\"u\">📌 الصور البحرية:<\/div><div class=\"li\">\"<span class=\"en\">ever-fix<\/span>è<span class=\"en\">d mark<\/span>\": علامة ثابتة في البحر، زي فنار أو علامة ملاحية، وبتشوف العواصف ومش بتتهز.<\/div><div class=\"li\">\"<span class=\"en\">the star to every wandering bark<\/span>\": النجم اللي بيهتدي بيه كل مركب تايه. والنجم هنا غالباً بيتفسر على إنه النجم القطبي، اللي بيحدد الشمال.<\/div><div class=\"li\">\"<span class=\"en\">whose worth's unknown, although his height be taken<\/span>\": قيمته مجهولة، مع إن الملاحين بيقيسوا ارتفاعه. يعني إنت تقدر تحسب مكانه، لكن مش تقدر تحسب قيمته.<\/div>", "n": 4, "a": "history-20-016", "x": "c87c877c", "en": "Sea images: an ever-fixed mark, like a sea beacon that sees storms and is not shaken; the star for every wandering ship, usually read as the pole star. Its worth is unknown though its height can be measured: you can compute where it is, not what it is worth.", "i": 24}, {"t": "mc", "h": "", "q": "النجم والعلامة الثابتة في سونيت 116 بيرمزوا لإيه؟", "nq": 1, "opts": ["الحب اللي بيفضل ثابت وسط العاصفة", "الحب اللي بيمنع العاصفة", "الحب اللي بيتغير"], "ans": 0, "why": "الحب اللي بيفضل ثابت وسط العاصفة", "ex": ["صح: ثابت جوّه العاصفة.", "غلط: الحب مش بيمنعها.", "غلط: ده عكس الفكرة."], "i": 25}, {"t": "learn", "h": "<div class=\"li\">والصور دي بتقول حاجة: الحب مش بيمنع العاصفة، الحب بيفضل ثابت وهو جوّه العاصفة. الفرق كبير.<\/div>", "n": 1, "a": "history-20-017", "x": "e498141a", "en": "These images say something: love does not prevent the storm; it stays fixed inside it. A big difference.", "i": 26}, {"t": "learn", "h": "<div class=\"u\">📌 الزمن:<\/div><div class=\"li\">\"<span class=\"en\">Love's not Time's fool<\/span>\": الحب مش أهبل الزمن ولا لعبة عنده. والزمن في الصورة دي فلاح بيمسك منجل، وبيحصد كل حاجة: الشفايف الوردية، والخدود.<\/div><div class=\"li\">لكن الحب مش جوّه المحصول. \"<span class=\"en\">Love alters not with his brief hours and weeks<\/span>\"، الحب مش بيتغير بالساعات والأسابيع القصيرة.<\/div><div class=\"li\">و\"<span class=\"en\">bears it out even to the edge of doom<\/span>\": بيستحمل لحد حافة الحساب، يعني لحد يوم القيامة.<\/div>", "n": 4, "a": "history-20-018", "x": "d7d21dc6", "en": "Time: Love's not Time's fool. Time is a farmer with a sickle who reaps rosy lips and cheeks. Love is not in the harvest and it endures to the edge of doom, the Day of Judgment.", "i": 27}, {"t": "mc", "h": "", "q": "الزمن في سونيت 116 ظاهر في صورة إيه؟", "nq": 1, "opts": ["حصّاد بمنجل", "نهر", "ساعة رملية"], "ans": 0, "why": "حصّاد بمنجل", "ex": ["صح: <span class=\"en\">sickle<\/span> بيحصد الشفايف والخدود.", "غلط: مش نهر.", "غلط: مش ساعة."], "i": 28}, {"t": "learn", "h": "<div class=\"u\">📌 البيت الأخير، وهو أخطر حاجة في القصيدة:<\/div><div class=\"li\">\"لو ده غلط واتثبت عليّ، يبقى أنا ما كتبتش، ومحدش حب\".<\/div><div class=\"li\">يعني الشاعر بيحط شعره كله كضمانة. لو أنا غلطان في الكلام ده، يبقى كل اللي كتبته مش شعر، وكل حب في الدنيا مش حب.<\/div><div class=\"li\">وده مش تواضع، ده تحدٍّ. الشاعر بيقول: كلامي عن الحب صح، وإلا الفن نفسه كذبة.<\/div>", "n": 4, "a": "history-20-019", "x": "f6ecfd44", "en": "The last couplet is the boldest: if I am wrong, I never wrote and no one ever loved. He stakes all his poetry as a guarantee. That is a challenge, not modesty: either I am right about love or art itself is a lie.", "i": 29}, {"t": "mc", "h": "", "q": "ليه الشاعر بيحط شعره كضمانة في آخر سونيت 116؟", "nq": 1, "opts": ["عشان يتحدى: لو غلطان فمفيش شعر ولا حب", "عشان يعتذر", "عشان يبيع"], "ans": 0, "why": "عشان يتحدى: لو غلطان فمفيش شعر ولا حب", "ex": ["صح: تحدٍّ مش تواضع.", "غلط: مش اعتذار.", "غلط: مش تجارة."], "i": 30}, {"t": "learn", "h": "<div class=\"u\">📌 القراءة اللي بتقلب القصيدة:<\/div><div class=\"li\">القصيدة دي في مكانها في السلسلة بين سونيتات عن الخداع والخيانة، وبعدها سونيتات الشاعر بيعتذر فيها عن خيانته هو.<\/div><div class=\"li\">فلما تقراها في مكانها، بتبان حاجة تانية: مش وصف للحب، دي تعزية، أو دفاع، أو حتى إنكار.<\/div>", "n": 3, "a": "history-20-020", "x": "0a81d66f", "en": "A reading that flips the poem: placed in the sequence, between sonnets about deceit and then the poet's apology for his own betrayal, it may read as consolation, defence or even denial rather than description.", "i": 31}, {"t": "tf", "h": "", "q": "القراءة اللي بتقول إن المانع في سونيت 116 هو إن الاتنين رجالة حقيقة مؤكدة.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: دي قراءة دارسين مش حقيقة.", "صح: ده عكس اللي بيقوله الدرس."], "i": 32}, {"t": "learn", "h": "<div class=\"li\">وفيه قراءة تالتة، وهي قراءة دارسين معاصرين: المانع الحقيقي إن الاتنين رجالة، والجواز مستحيل في إنجلترا وقتها. فالقصيدة بتحوّل المستحيل لعهد. ودي قراءة، مش حقيقة، بسها إن القصيدة نفسها بتستخدم لغة الجواز عشان تنفي المانع.<\/div><div class=\"li\">وفيه كمان قراءة بتقول إن القصيدة مثالية زيادة عن اللزوم، والقصيدة عارفة ده، والسطر الأخير فيه نبرة تحدٍّ مش ثقة.<\/div>", "n": 2, "a": "history-20-021", "x": "f31aaa3c", "en": "A third reading, by some modern scholars: the real impediment is that both are men and marriage was impossible in England then; the poem turns the impossible into a vow. A reading, not a fact, but the poem does use marriage language to deny the impediment. Another reading says the poem is too idealistic and knows it, with a defiant tone at the end.", "i": 33}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: واحد بيقول لصاحبه \"الفلوس مش هتغيرنا\". الكلام ده بيتقال في لحظة معينة، والقيمة مش في إنه صحيح، القيمة في إنه بيتقال قدام الناس. سونيت 116 كده: مش تحليل، ده عهد بيتقال في وسط الخطر.<\/div>", "n": 1, "a": "history-20-022", "x": "5b30322a", "en": "Everyday example: a man says to a friend money will not change us. Its value is not that it is true but that it is said in front of people. Sonnet 116 is not analysis, it is a vow said in the middle of danger.", "i": 34}, {"t": "section", "h": "النقطة 3: سونيت 129: الشهوة", "i": 35}, {"t": "learn", "h": "<div class=\"u\">📌 النص:<\/div><div class=\"u\"><span class=\"en\">The expense of spirit in a waste of shame<\/span><\/div><div class=\"u\"><span class=\"en\">Is lust in action<\/span>; <span class=\"en\">and till action, lust<\/span><\/div><div class=\"u\"><span class=\"en\">Is perjured, murderous, bloody, full of blame<\/span>,<\/div><div class=\"u\"><span class=\"en\">Savage, extreme, rude, cruel, not to trust<\/span>;<\/div><div class=\"u\"><span class=\"en\">Enjoyed no sooner but despis<\/span>è<span class=\"en\">d straight<\/span>;<\/div><div class=\"u\"><span class=\"en\">Past reason hunted, and no sooner had<\/span>,<\/div><div class=\"u\"><span class=\"en\">Past reason hated, as a swallowed bait<\/span><\/div><div class=\"u\"><span class=\"en\">On purpose laid to make the taker mad<\/span>:<\/div><div class=\"u\"><span class=\"en\">Mad in pursuit, and in possession so<\/span>;<\/div><div class=\"u\"><span class=\"en\">Had, having, and in quest to have, extreme<\/span>;<\/div>", "n": 11, "a": "history-20-023", "x": "bbbdf26f", "en": "Sonnet 129, first part: The expense of spirit in a waste of shame is lust in action, up to a swallowed bait.", "i": 36}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">A bliss in proof, and proved, a very woe<\/span>;<\/div><div class=\"u\"><span class=\"en\">Before, a joy proposed<\/span>; <span class=\"en\">behind, a dream<\/span>.<\/div><div class=\"u\"><span class=\"en\">All this the world well knows<\/span>; <span class=\"en\">yet none knows well<\/span><\/div><div class=\"u\"><span class=\"en\">To shun the heaven that leads men to this hell<\/span>.<\/div>", "n": 4, "a": "history-20-024", "x": "86c01894", "en": "Sonnet 129, rest: Mad in pursuit, and in possession so... Before, a joy proposed; behind, a dream. All this the world well knows; yet none knows well to shun the heaven that leads men to this hell.", "i": 37}, {"t": "learn", "h": "<div class=\"u\">📌 إيه اللي بيقوله السطر الأول؟<\/div><div class=\"li\">\"<span class=\"en\">The expense of spirit in a waste of shame<\/span>\": إنفاق الروح في أرض خسارة وعار.<\/div><div class=\"li\"><span class=\"en\">expense<\/span> = صرف، زي فلوس بتتصرف. <span class=\"en\">spirit<\/span> = الروح. <span class=\"en\">waste<\/span> = أرض بور، أو خسارة.<\/div><div class=\"li\">وفيه قراءة قديمة عند الدارسين إن <span class=\"en\">spirit<\/span> هنا فيها تلميح جنسي، والكلام بيتكلم عن الجسد كمان. القراءة دي مش مؤكدة، لكنها موجودة ومشهورة.<\/div><div class=\"li\">والمعنى العام واضح: الشهوة بتصرف منك أغلى حاجة عندك، وبترميها في مكان مافيهوش نتيجة.<\/div>", "n": 5, "a": "history-20-025", "x": "5773cf19", "en": "The first line: expense of spirit in a waste of shame. Expense is spending, spirit is soul, waste is wasteland or loss. An old well-known reading hears a sexual pun in spirit, not certain. Overall: lust spends your most precious thing and throws it where nothing comes back.", "i": 38}, {"t": "mc", "h": "", "q": "كلمة <span class=\"en\">expense<\/span> في أول سطر من سونيت 129 معناها إيه؟", "nq": 1, "opts": ["إنفاق وصرف", "ربح", "حفلة"], "ans": 0, "why": "إنفاق وصرف", "ex": ["صح: إنفاق الروح.", "غلط: ده عكسها.", "غلط: مش حفلة."], "i": 39}, {"t": "learn", "h": "<div class=\"u\">📌 بنية القصيدة زي فخ:<\/div><div class=\"li\">السطر الأول بيوصف الشهوة \"في التنفيذ\" (<span class=\"en\">in action<\/span>).<\/div><div class=\"li\">وبعدين بيرجع للوراء: الشهوة \"قبل\" التنفيذ. وقبل التنفيذ هي: حلف كاذب، وقاتلة، ودموية، ووحشية، ومتوحشة، ومش ممكن تثق فيها.<\/div><div class=\"li\">وبعدين بيوصف اللحظة اللي بعد: \"<span class=\"en\">Enjoyed no sooner but despis<\/span>è<span class=\"en\">d straight<\/span>\"، بمجرد ما تتنعم بيها، بتتكره على طول.<\/div><div class=\"li\">وبعدين يلخص: \"<span class=\"en\">Had, having, and in quest to have extreme<\/span>\"، اللي حصل، واللي بيحصل، واللي بيسعى ليه، كلهن متطرفين.<\/div>", "n": 5, "a": "history-20-026", "x": "55f07ba7", "en": "The poem is built like a trap: lust in action first, then back to before action (perjured, murderous, bloody, savage, cruel, not to trust), then the moment after: enjoyed no sooner but despised straight.", "i": 40}, {"t": "learn", "h": "<div class=\"li\">وفي الآخر بيقفل: \"<span class=\"en\">Before, a joy proposed<\/span>; <span class=\"en\">behind, a dream<\/span>\"، قبلها وعد بفرح، وبعدها ذكرى زي الحلم.<\/div>", "n": 1, "a": "history-20-027", "x": "9866a5f1", "en": "Then a summary: had, having and in quest to have, extreme. And the close: before, a joy proposed; behind, a dream.", "i": 41}, {"t": "learn", "h": "<div class=\"u\">📌 الفكرة اللي بتخلي القصيدة مش وعظ:<\/div><div class=\"li\">\"<span class=\"en\">All this the world well knows<\/span>; <span class=\"en\">yet none knows well<\/span> / <span class=\"en\">To shun the heaven that leads men to this hell<\/span>\".<\/div><div class=\"li\">الكل عارف الحكاية دي، ومحدش عارف يتجنب الجنة اللي بتوديه للنار دي.<\/div><div class=\"li\">يعني المشكلة مش في الجهل، المشكلة في الإرادة. والإنسان عارف، وبيعمل، وبيعرف إنه بيعمل.<\/div><div class=\"li\">وده اللي بيفرقها عن الوعظ: الوعظ بيقول \"متعملش\". القصيدة بتقول \"إنت هتعمل، وإنت عارف، وده اللي بيوجع\".<\/div>", "n": 5, "a": "history-20-028", "x": "a82cbbbe", "en": "What stops it being a sermon: all this the world well knows, yet none knows well to shun the heaven that leads men to this hell. The problem is not ignorance but will: you will do it, you know, and that hurts. A sermon says do not.", "i": 42}, {"t": "mc", "h": "", "q": "ليه سونيت 129 مش وعظ؟", "nq": 1, "opts": ["لأنها بتقول إن الإنسان عارف وبيعمل برضه", "لأنها بتشجع الشهوة", "لأنها قصيرة"], "ans": 0, "why": "لأنها بتقول إن الإنسان عارف وبيعمل برضه", "ex": ["صح: المشكلة في الإرادة مش الجهل.", "غلط: مش بتشجع.", "غلط: الطول مش السبب."], "i": 43}, {"t": "learn", "h": "<div class=\"u\">📌 الأسلوب:<\/div><div class=\"li\">قائمة الصفات في أول أربع سطور: <span class=\"en\">perjured, murderous, bloody, full of blame, savage, extreme, rude, cruel<\/span>.<\/div><div class=\"li\">الصفات بتيجي ورا بعضها من غير تفسير، والتراكم ده نفسه إحساس: زي حد بيتكلم بسرعة وهو مخنوق.<\/div><div class=\"li\">وفيه صورة صيد: الطعم اللي بيتبلع، والسمكة اللي بتتصاد. الإنسان هنا مش صايد، هو اللي بيتصاد.<\/div>", "n": 4, "a": "history-20-029", "x": "e5342145", "en": "The style: a list of adjectives with no explanation, perjured, murderous, bloody, savage, extreme, rude, cruel. The pile-up is the feeling, like someone speaking fast while choking. There is also a hunting image: a swallowed bait. The man is the one hunted.", "i": 44}, {"t": "learn", "h": "<div class=\"u\">📌 المفارقة الكبيرة:<\/div><div class=\"li\">في نفس الكتاب، على بعد تلاتاشر سونيت، فيه سونيت بيقول إن الحب عهد ثابت لحد يوم القيامة، وسونيت بيقول إن الرغبة نار بتاكل صاحبها.<\/div><div class=\"li\">والاتنين مش تناقض بغلط. ده اللي الكتاب عايزه: راجل بيحب، وعنده شهوة، وبيعرف الفرق، وبيقع برضه.<\/div>", "n": 3, "a": "history-20-030", "x": "08f1f30b", "en": "The irony: thirteen sonnets from 116 there is a sonnet saying love is a fixed vow and one saying desire is a fire that eats its owner. Not a mistake: the book wants a man who loves, desires, knows the difference, and falls anyway.", "i": 45}, {"t": "tf", "h": "", "q": "سونيت 116 وسونيت 129 فيهم نفس النظرة للحب.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: واحدة عهد ثابت وواحدة شهوة بتاكل صاحبها.", "صح: الكتاب فيه الاتنين."], "i": 46}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: التسوق من الموبايل بالليل. بتشتري حاجة، وانت في اللحظة دي مقتنع إنك محتاجها. ولما بتوصل، بتحس إنك اشتريت حاجة مالهاش لازمة. الشهوة بتخليك تشتري، والندم بييجي بعدين، وفي المرة الجاية بتشتري تاني.<\/div>", "n": 1, "a": "history-20-031", "x": "24985d51", "en": "Everyday example: shopping on the phone at night. In the moment you are sure you need it; on arrival it feels pointless; next time you buy again. Desire buys, regret comes later.", "i": 47}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; سونيت 73 وسونيت 116 بيواجهوا الزمن. واحد بيستسلم ليه، والتاني بينكره. مين أقوى حجة، وليه؟", "a": "<div class=\"u\">الاتنين بيبدأوا من نفس المشكلة: الزمن بياكل الجمال، والشفايف والخدود مش هتفضل. لكن كل واحد بياخد طريق مختلف تماماً في الرد، والفرق بينهم مش في النتيجة، الفرق في المنطق.<\/div><div class=\"u\">سونيت 73 بيقبل الزمن، وبيستخدمه كأداة. الشاعر بيقول للشاب: بص عليّ، وشوف الخريف والغروب والنار اللي بتطفى. والصور بتتدرج من السنة لليوم للحظة، يعني الزمن بيتسارع في القصيدة نفسها. والقبول ده هو اللي بيخلّي القصيدة تعمل حاجة غريبة: المعرفة بالزوال بتزوّد الحب، مش بتقلله. والبيت الأخير بيقول \"إنك تحب اللي هتسيبه قريب\". فالحجة هنا إن الفناء مش عدو الحب، الفناء هو اللي بيدّي الحب قيمته. من غير نهاية، مفيش وداع، ومن غير وداع، مفيش حب حقيقي.<\/div><div class=\"u\">سونيت 116 بيعمل العكس: بينكر إن الزمن ليه سلطة على الحب. وبينكر بالطريقة القوية، يعني تعريفات سلبية: الحب مش بيتغير، ومش بينثني، ومش أهبل الزمن. وبعدين بيستخدم صور ثابتة: العلامة البحرية اللي بتشوف العاصفة ومش بتتهز، والنجم اللي المراكب التايهة بتهتدي بيه. والفرق إن الصور دي صور ثبات مش صور نمو. والحجة هنا إن الحب مش إحساس بيتغير، الحب قرار بيفضل.<\/div><div class=\"u\">فمين أقوى؟ من ناحية الحجة المنطقية، سونيت 116 أقوى في البناء، لأنه بيعرّف وبيقسّم وبيقدم دليل وبيختم بقسم. لكنه بيدفع التمن: القصيدة مضطرة تنكر حاجات واضحة، والزمن فعلاً بيأثر، والقصيدة عارفة ده لأنها في وسط سونيتات خيانة. أما سونيت 73 فحجته أضعف في الشكل، لأنها بتقول \"الحب بيزيد لما الوقت يقل\" من غير دليل، لكنها أقوى في الإحساس، لأنها مش بتوعد بحاجة مستحيلة.<\/div><div class=\"u\">والخلاصة إن الاتنين بيكسبوا في حاجة وخسروا في حاجة. سونيت 73 بتكسب الصدق، وسونيت 116 بتكسب الشكل. واللي بيفرّق بين طالب وطالب في الامتحان هو إنه يقول الاتنين، ويعرف ليه كل واحد اختار طريقه.<\/div>", "key": "history-20:W31", "n": 1, "i": 48}, {"t": "section", "h": "النقطة 4: المعارك النقدية: مين فيهم صح؟", "i": 49}, {"t": "learn", "h": "<div class=\"u\">📌 المعركة الأولى: هل دي سيرة ذاتية؟<\/div><div class=\"li\">الاتجاه الأول بيقرا السونيتات كسجل: راجل حب شاب، واتخان معاه، وحب ست، واتخدع.<\/div><div class=\"li\">الاتجاه التاني بيقراها كفن: الشخصيات أدبية، والشعر مش اعتراف.<\/div><div class=\"li\">والاتجاه التالت، وهو شائع بين الدارسين: مفيش دليل قاطع، والقراءتين بيقولوا لنا حاجة عن القارئ أكتر من الشاعر.<\/div>", "n": 4, "a": "history-20-032", "x": "3000df93", "en": "Battle one: is it autobiography? One side reads a record, another reads art, a third (common among scholars): no evidence, and both readings tell us about the reader.", "i": 50}, {"t": "tf", "h": "", "q": "فيه إجماع على إن السونيتات سيرة ذاتية.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: مفيش دليل قاطع والدارسين مختلفين.", "صح: ده عكس الواقع."], "i": 51}, {"t": "learn", "h": "<div class=\"u\">📌 المعركة التانية: سونيت 116 مثالي ولا ساخر؟<\/div><div class=\"li\">المثالي: القصيدة بتقول إن الحب ثابت، وده كلام جميل ومريح.<\/div><div class=\"li\">الساخر: القصيدة بتقول الكلام ده في وسط خيانة، فالوعد نفسه بيبان كذبة.<\/div><div class=\"li\">ومش لازم تختار. القصيدة بتشتغل بالاتنين مع بعض، وده سر قوتها.<\/div>", "n": 4, "a": "history-20-033", "x": "f201018c", "en": "Battle two: is sonnet 116 ideal or ironic? Ideal: love is constant. Ironic: said in the middle of betrayal, the promise looks like a lie. You need not choose; it works as both.", "i": 52}, {"t": "learn", "h": "<div class=\"u\">📌 المعركة التالتة: سونيت 129 أخلاقية ولا هي نفسها مستمتعة؟<\/div><div class=\"li\">فيه ناس بتقول: الشاعر بيدين الشهوة، والقصيدة أخلاقية.<\/div><div class=\"li\">وفيه ناس بتقول: الوصف قوي جداً وحسي جداً، لدرجة إن القصيدة بتستمتع بالحكاية اللي بتدينها.<\/div><div class=\"li\">والاتنين فيهم جزء من الحق. وده مثال حلو إن القصيدة مش رسالة، القصيدة تجربة.<\/div>", "n": 4, "a": "history-20-034", "x": "2d1b7ade", "en": "Battle three: is sonnet 129 moral, or does it enjoy itself? Some say the poet condemns lust; some say the description is so strong and sensual that the poem enjoys what it condemns. A poem is an experience, not a message.", "i": 53}, {"t": "learn", "h": "<div class=\"u\">📌 المعركة الرابعة: مين الشاعر المنافس؟<\/div><div class=\"li\">من الترشيحات المشهورة: <span class=\"en\">George Chapman<\/span>. وفيه ترشيحات تانية، ومحدش أثبت حاجة.<\/div><div class=\"li\">والمهم إن الشاعر المنافس في السونيتات مش شخص بقدر ما هو موقف: فيه واحد تاني بيكتب للشاب، والشاعر خايف ياخد مكانه.<\/div>", "n": 3, "a": "history-20-035", "x": "1b466289", "en": "Battle four: who is the Rival Poet? A well-known candidate is George Chapman; others exist, nothing proved. The Rival Poet is a position more than a person: another writes for the young man and the poet fears losing his place.", "i": 54}, {"t": "mc", "h": "", "q": "مين من الترشيحات المشهورة لـ <span class=\"en\">Rival Poet<\/span>؟", "nq": 1, "opts": ["<span class=\"en\">George Chapman<\/span>", "<span class=\"en\">Thomas Thorpe<\/span>", "<span class=\"en\">John Benson<\/span>"], "ans": 0, "why": "<span class=\"en\">George Chapman<\/span>", "ex": ["صح: وفيه ترشيحات تانية ومحدش أثبت.", "غلط: <span class=\"en\">Thorpe<\/span> هو الناشر.", "غلط: <span class=\"en\">Benson<\/span> محرر 1640."], "i": 55}, {"t": "learn", "h": "<div class=\"u\">📌 المعركة الخامسة: مين المحرر؟<\/div><div class=\"li\">النص اللي بتقراه دلوقتي فيه تنقيط وترقيم وحروف كبيرة، وكل ده مش موجود في 1609.<\/div><div class=\"li\">والمحرر بيقرر: فين تخلص الجملة، وإيه الكلمة اللي تتكتب بحرف كبير، وهل \"<span class=\"en\">spirit<\/span>\" هنا روح ولا حاجة تانية.<\/div><div class=\"li\">وده مش تفصيلة: التنقيط بيغيّر المعنى. ونفس الكلام ينطبق على الترتيب اللي حكينا عنه في 1640.<\/div>", "n": 4, "a": "history-20-036", "x": "870e537c", "en": "Battle five: who is the editor? The text you read has punctuation and capitals not in 1609. The editor decides where a sentence ends and whether spirit means soul or something else. Punctuation changes meaning, as with the 1640 reordering.", "i": 56}, {"t": "section", "h": "النقطة 5: إيه اللي بيفرق السونيتات دي عن كل اللي قريناه؟", "i": 57}, {"t": "learn", "h": "<div class=\"u\">📌 الحب عند كل واحد:<\/div><div class=\"li\"><span class=\"en\">Petrarch<\/span>: الحب وجع جميل، والمرأة بعيدة ومثالية.<\/div><div class=\"li\"><span class=\"en\">Wyatt<\/span>: الحب صيد، والغزال بيفلت.<\/div><div class=\"li\"><span class=\"en\">Sidney<\/span>: الحب فشل، والسلسلة بتخلص من غير وصال.<\/div><div class=\"li\"><span class=\"en\">Spenser<\/span>: الحب عهد، والسلسلة بتخلص بجواز.<\/div><div class=\"li\"><span class=\"en\">Shakespeare<\/span>: الحب مش حاجة واحدة. هو عهد في سونيت، وشهوة في سونيت، وخيانة في سونيت تالت.<\/div>", "n": 6, "a": "history-20-037", "x": "49b38242", "en": "Love for each poet: Petrarch, beautiful pain, an ideal distant lady. Wyatt, love as hunting, the deer escapes. Sidney, failure, no fulfilment. Spenser, covenant, ending in marriage. Shakespeare, not one thing: vow in one sonnet, lust in another, betrayal in a third.", "i": 58}, {"t": "mc", "h": "", "q": "إيه الحب عند <span class=\"en\">Spenser<\/span> حسب الدرس؟", "nq": 1, "opts": ["عهد بيخلص بجواز", "صيد والغزال بيفلت", "فشل من غير وصال"], "ans": 0, "why": "عهد بيخلص بجواز", "ex": ["صح: <span class=\"en\">Amoretti<\/span> بتخلص بجواز.", "غلط: ده <span class=\"en\">Wyatt<\/span>.", "غلط: ده <span class=\"en\">Sidney<\/span>."], "i": 59}, {"t": "learn", "h": "<div class=\"u\">📌 الشك في اللغة:<\/div><div class=\"li\">سونيت 130 بتشك في التشبيهات.<\/div><div class=\"li\">سونيت 116 بتشك في الكلام نفسه: الشاعر بيقسم إن كلامه صح.<\/div><div class=\"li\">سونيت 129 بتشك في الرغبة اللي بتخلّي الكلام كله كذب.<\/div><div class=\"li\">والاتجاه ده هو اللي بيميّز السونيتات دي: مش بس عن الحب، كمان عن إمكانية الكلام عن الحب.<\/div>", "n": 5, "a": "history-20-038", "x": "73fe8287", "en": "Doubt about language: 130 doubts the comparisons, 116 doubts speech itself (the poet swears his words are right), 129 doubts the desire that makes words lie. These sonnets are not only about love but about whether we can speak of love.", "i": 60}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين سونيت 129 لـ <span class=\"en\">Shakespeare<\/span> وسونيت من سلسلة <span class=\"en\">Astrophil and Stella<\/span> لـ <span class=\"en\">Sidney<\/span> في موضوع الرغبة. من فين بييجي الوجع عند كل واحد؟", "a": "<div class=\"u\">الوجع عند الاتنين حقيقي، لكن مصدره مختلف، والفرق ده بيرجع لتصوّر كل شاعر للرغبة نفسها.<\/div><div class=\"u\">عند <span class=\"en\">Sidney<\/span>، الوجع جاي من المسافة. <span class=\"en\">Astrophil<\/span> بيحب <span class=\"en\">Stella<\/span>، و<span class=\"en\">Stella<\/span> متجوزة، والمسافة دي مش هتتقفل. فالرغبة عنده رغبة في حاجة مش ممكنة، والقصايد بتبني طاقتها من الحرمان. والشاعر بيلعب على الثنائيات المعروفة في التقليد: العين والقلب، العقل والرغبة، والصراع بين إنه يقول وإنه يسكت. فالوجع هنا وجع انتظار، ووجع كرامة: هو عارف إنه بيتمنى حاجة مش هتحصل، وبيعمل منها فن.<\/div><div class=\"u\">عند <span class=\"en\">Shakespeare<\/span>، الوجع مش جاي من المسافة، هو جاي من القرب. الرغبة في سونيت 129 بتتحقق، والمشكلة إنها بتتحقق. القصيدة بتبدأ من اللحظة اللي بعد التنفيذ: \"بمجرد ما تتنعم بيها، بتتكره على طول\". فالوجع هنا وجع ما بعد، وجع اكتشاف إن الحاجة اللي اتمنيتها بقت قذارة. والقصيدة بتوصف الرغبة قبل التنفيذ كحلف كاذب وقتل ووحشية، وبعد التنفيذ كندم. يعني الرغبة نفسها هي اللي بتتحول، مش الظروف.<\/div><div class=\"u\">والفرق التاني في الموقف من اللغة: <span class=\"en\">Sidney<\/span> بيستخدم اللغة عشان يبني جمال من الحرمان، والشعر عنده تعويض. <span class=\"en\">Shakespeare<\/span> في 129 بيستخدم اللغة عشان يشرّح، والقصيدة بتبان زي تشريح جثة، مش زي لوحة. وفيه كمان فرق في الأخلاق: <span class=\"en\">Sidney<\/span> مش بيحكم على رغبته، هو بيعيشها. <span class=\"en\">Shakespeare<\/span> بيحكم، لكن الحكم نفسه مش نافع، والقصيدة بتقول في آخرها إن الكل عارف ومحدش بيتعلم.<\/div><div class=\"u\">فالنتيجة إن الاتنين بيعملوا شعر من الرغبة، لكن <span class=\"en\">Sidney<\/span> بيعمل شعر من الأمل الفاشل، و<span class=\"en\">Shakespeare<\/span> بيعمل شعر من النجاح المرير. والأول بيخليك تحس بالشوق، والتاني بيخليك تحس بالاشمئزاز، والاتنين في النهاية بيسألوا نفس السؤال: ليه بنتمنى حاجات بتوجعنا؟<\/div>", "key": "history-20:W38", "n": 1, "i": 61}, {"t": "end", "h": "", "teaser": "الدرس الجاي: المسرح الإنجليزي، إزاي <span class=\"en\">Shakespeare<\/span> بقى <span class=\"en\">Shakespeare<\/span>.", "extra": "", "i": 62}];</script>
