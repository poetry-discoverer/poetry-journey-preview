<h1>الدرس 2: العصر القديم (650-1100): إنجلترا قبل الكتابة، الـ scop، والـ alliteration</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> تمهيدي</span><span class="tag">الدرس 2</span><span class="tag"><span class="em">📜</span> تاريخ الشعر</span></div>

<script>window.LESSON_ID="history-2";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"العصر القديم (650-1100): إنجلترا قبل الكتابة، الـ <span class=\"en\">scop<\/span>، والـ <span class=\"en\">alliteration<\/span>\"<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🛡️<\/span><\/span> فاتحين الخريطة من أول محطة: العصر القديم. في الدرس اللي فات خدنا الخريطة كلها، النهاردة هنقف عند أول محطة ونعيش فيها: مين كان ساكن إنجلترا؟ والشعر كان بيتعمل ويتقال إزاي؟ وطعمه كان عامل إزاي؟<\/div><div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: دنيا العصر (إنجلترا بين سنة 650 و1100)<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> مين ساكن إنجلترا ساعتها؟<\/div>", "n": 4, "i": 0, "a": "history-2-001", "x": "54e741b6"}, {"t": "learn", "h": "<div class=\"li\">شعوب اسمها الأنجلو-ساكسون (<span class=\"en\">Anglo-Saxons<\/span>): قبائل جرمانية جت من شمال أوروبا بعد ما الرومان سابوا الجزيرة.<\/div><div class=\"li\">مش دولة واحدة: ممالك صغيرة بتتخانق مع بعضها، أشهرها <span class=\"en\">Wessex<\/span> و<span class=\"en\">Mercia<\/span> و<span class=\"en\">Northumbria.<\/span><\/div><div class=\"li\">من سنة 793 تقريباً: هجمات الفايكنج من الشمال، وده شبح العصر كله.<\/div>", "n": 3, "i": 1, "a": "history-2-002", "x": "483465c7"}, {"t": "learn", "h": "<div class=\"li\">سنة 597: المسيحية دخلت بجد مع أوغسطين، والأديرة بقت هي مراكز الكتابة والكتب. عشان كده أي حاجة مكتوبة وصلتنا من العصر ده، كتبها راهب في دير.<\/div>", "n": 1, "i": 2, "a": "history-2-003", "x": "cab11a7d"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> مثال من الحياة اليومية:<\/div><div class=\"u\">تخيل قرية مفيهاش نت ولا مطابع ولا تلفزيون. الأخبار والحكايات والأنساب كلها بتعيش في دماغ الناس وبتنتقل بالكلام في القعدات الليلية. دي كانت إنجلترا كلها: ثقافة \"ودان\" مش ثقافة \"عيون\".<\/div>", "n": 1, "i": 3, "a": "history-2-004", "x": "bcb472c0"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الخلاصة:<\/div><div class=\"u\">عصر حرب وتحالفات وملوك صغار، والكلمة المسموعة فيه أغلى من المكتوبة.<\/div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: الشعر شفهي، ومين هو الـ <span class=\"en\">scop<\/span>؟ <span class=\"em\"><span class=\"em\">🎤<\/span><\/span><\/div>", "n": 2, "i": 4, "a": "history-2-005", "x": "f3daf7e9"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> التعريف:<\/div><div class=\"u\">الـ <span class=\"en\">scop<\/span> (تنطق \"شوب\") هو الشاعر المحترف بتاع القبيلة أو الملك. مش هاوي بيكتب في دفتره، ده وظيفته الرسمية إنه يحفظ ويغني.<\/div>", "n": 1, "i": 5, "a": "history-2-006", "x": "6092fe7c"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> شغلانه في 3 حاجات:<\/div><div class=\"li\">ذاكرة القبيلة: يحفظ أنساب الملوك وانتصاراتهم، زي أرشيف حي.<\/div><div class=\"li\">المديح: يغني لبطولات الملك ورجولته، وده جزء من عقد الولاء بينهم.<\/div><div class=\"li\">الترفيه: في السهرة يسلّي القاعة بالحكايات.<\/div>", "n": 3, "i": 6, "a": "history-2-007", "x": "90fa172b"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> مكان الشغل: الـ <span class=\"en\">mead-hall<\/span> (قاعة الشراب):<\/div><div class=\"u\">أهم مكان في حياة القبيلة. الملك ورجالته بياكلوا ويشربوا ويحكوا فيها. هي القهوة والديوانية والمسرح في نفس الوقت. (في الملحمة هتقابلنا قاعة اسمها <span class=\"en\">Heorot<\/span>، احفظ الاسم من دلوقتي.)<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> ليه الشعر بيتقال بالبق ده محتاج \"أدوات حفظ\"؟<\/div><div class=\"li\">مفيش <span class=\"en\">Ctrl<\/span>+<span class=\"en\">S.<\/span> اللي انقال اتنسى.<\/div>", "n": 3, "i": 7, "a": "history-2-008", "x": "a246f719"}, {"t": "learn", "h": "<div class=\"li\">فالشاعر بيعتمد على: إيقاع ثابت، وجمل جاهزة متكررة (<span class=\"en\">formulas<\/span>)، وتكرار الأصوات. كل ده بيساعد الذاكرة.<\/div><div class=\"li\">مثال من حياتك انت بالذات: إنت حافظ القرآن، وعارف إن الإيقاع والوقف والتشابه بيساعدوا الحفظ والاسترجاع. نفس الفكرة بالظبط عندهم: الشكل مش زينة، الشكل هو فلاشة الحفظ.<\/div><div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: طعم الشعر القديم (٣ توابل أساسية) <span class=\"em\"><span class=\"em\">🎵<\/span><\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> التابل 1: مفيش قافية خالص!<\/div>", "n": 4, "i": 8, "a": "history-2-009", "x": "388372fb"}, {"t": "learn", "h": "<div class=\"u\">انسَ آخر السطور. موسيقى الشعر القديم مكانها تاني.<\/div>", "n": 1, "i": 9, "a": "history-2-010", "x": "b83be809"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> التابل 2: الـ <span class=\"en\">alliteration<\/span> (تكرار أول صوت):<\/div><div class=\"li\">زي ما اتعلمنا في كورس الأدوات: إنك تكرر أول حرف صوتي في كلمات ورا بعضها.<\/div><div class=\"li\">السطر متقسم نصين بوقفة في النص (اسمها <span class=\"en\">caesura<\/span>)، وفيه حوالي 4 نبرات قوية.<\/div><div class=\"li\">القاعدة تقريباً: النبرات تتفق مع بعضها في أول صوت، عشان السطر يمسك نفسه من غير قافية.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> التابل 3: الـ <span class=\"en\">kenning<\/span> (الاسم المركب الشاعري):<\/div>", "n": 4, "i": 10, "a": "history-2-011", "x": "408626a4"}, {"t": "learn", "h": "<div class=\"li\">يعني تسمي الحاجة بتركيب وصفي بدل اسمها: البحر = <span class=\"en\">whale-road<\/span> (طريق الحوت)، الملك = <span class=\"en\">ring-giver<\/span> (موزّع الخواتم، لأنه كان بيكافئ رجالته بالذهب).<\/div><div class=\"li\">مثال يومي من لساننا: لما نقول على الجمل \"سفينة الصحراء\" بدل \"جمل\". دي بالظبط فكرة الـ <span class=\"en\">kenning<\/span>!<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> عينة حقيقية: أول 3 سطور من ملحمة <span class=\"en\">Beowulf<\/span> بالإنجليزي القديم:<\/div><div class=\"u\">\"<span class=\"en\">HW<\/span>Æ<span class=\"en\">T WE GAR-DENA IN GEARDAGUM<\/span><\/div><div class=\"u\">þ<span class=\"en\">eodcyninga<\/span> þ<span class=\"en\">rym gefrunon,<\/span><\/div>", "n": 5, "i": 11, "a": "history-2-012", "x": "9d9d50e3"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">hu<\/span> ð<span class=\"en\">a<\/span> æþ<span class=\"en\">elingas ellen fremedon<\/span>\"<\/div><div class=\"u\">المعنى تقريباً: \"اسمعوا! سمعنا عن مجد ملوك الدانماركيين في الأيام القديمة، إزاي الأمراء عملوا أعمال شجاعة.\"<\/div><div class=\"u\">بص على أول سطر: <span class=\"en\">Gar-Dena<\/span> و<span class=\"en\">gear-dagum<\/span>، تكرار صوت الـ <span class=\"en\">G<\/span> في النصين. دي الـ <span class=\"en\">alliteration<\/span> شغالة قدامك. وكلمة <span class=\"en\">HW<\/span>Æ<span class=\"en\">T<\/span> يعني \"اسمع/ها!\"، زي واحد بيخبط على الترابيزة عشان القعدة تسكت وتسمع.<\/div>", "n": 3, "i": 12, "a": "history-2-013", "x": "76c4a070"}, {"t": "learn", "h": "<div class=\"u\">(السطور دي من نسخة <span class=\"en\">Electronic Beowulf<\/span>، جامعة كنتاكي.)<\/div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: إيه اللي وصلنا من العصر ده؟ <span class=\"em\"><span class=\"em\">📜<\/span><\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> كل اللي وصلنا محفوظ في مخطوطات قليلة كتبها الرهبان، أشهرها كتابين اسمهما <span class=\"en\">Exeter Book<\/span> و<span class=\"en\">Vercelli Book<\/span>، بالإضافة لمخطوطة <span class=\"en\">Beowulf.<\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> أربع أصناف هندرسها واحد واحد في الدروس الجاية:<\/div><div class=\"li\">الملحمة: <span class=\"en\">Beowulf<\/span> (أعظم كنز في العصر، درسين كاملين جايين ليها).<\/div>", "n": 5, "i": 13, "a": "history-2-014", "x": "6c6bf586"}, {"t": "learn", "h": "<div class=\"li\">قصائد الرثاء والحنين: <span class=\"en\">The Wanderer<\/span> و<span class=\"en\">The Seafarer.<\/span><\/div><div class=\"li\">الشعر الديني: <span class=\"en\">Caedmon<\/span> (أول شاعر معروف بالاسم) و<span class=\"en\">The Dream of the Rood.<\/span><\/div><div class=\"li\">الألغاز: قصايد قصيرة بتسألك \"خمن أنا مين؟\".<\/div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: ليه العصر ده مهم؟ <span class=\"em\"><span class=\"em\">⚓<\/span><\/span><\/div><div class=\"li\">هو نقطة الصفر: أساس اللغة الإنجليزية وأساس فكرة \"البطل\" في الأدب الإنجليزي.<\/div>", "n": 5, "i": 14, "a": "history-2-015", "x": "0241e4ec"}, {"t": "learn", "h": "<div class=\"li\">أفكاره الكبيرة اللي هتفضل تتردد لحد النهاردة: الشرف، والولاء للملك، والقدر (كانوا بيسموه <span class=\"en\">wyrd<\/span>)، والمجد اللي بيفضل بعد الموت في كلام الناس.<\/div><div class=\"li\">افتكر القاعدة الذهبية <span class=\"em\"><span class=\"em\">⭐<\/span><\/span>: ده أول عصر، فمفيش حد قبله يثور عليه. هو الأرض اللي كل الثورات الجاية هتقوم فوقها.<\/div>", "n": 2, "i": 15, "a": "history-2-016", "x": "eba2683e"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🔗<\/span><\/span> لو عايز تشوف بنفسك:<\/div><div class=\"li\">نص <span class=\"en\">Beowulf<\/span> بالإنجليزي القديم (نسخة علمية): <span class=\"en\">ebeowulf.uky.edu<\/span><\/div><div class=\"li\">موقع المكتبة البريطانية (<span class=\"en\">bl.uk<\/span>) عليه مقالات عن العصر الأنجلو-ساكسوني.<\/div>", "n": 2, "i": 16, "a": "history-2-017", "x": "2ef060e0"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📝<\/span><\/span> كويز الدرس 2 (مقالي أو بالصوت):<\/div><div class=\"u\">١. احكيلي دنيا العصر القديم في 4 جمل: مين السكان، شكل الحكم، خطر مين، ومين بيكتب.<\/div><div class=\"u\">٢. يعني إيه <span class=\"en\">scop<\/span>؟ واذكر شغلانه التلاتة.<\/div><div class=\"u\">٣. ليه الشعر الشفهي محتاج أدوات حفظ؟ اذكر أداتين واربطهم بمثال من تجربتك في الحفظ.<\/div><div class=\"u\">٤. بمثال من عندك (مش من الدرس): اشرح يعني إيه <span class=\"en\">kenning.<\/span><\/div>", "n": 4, "i": 17, "a": "history-2-018", "x": "16f1b6b2"}, {"t": "learn", "h": "<div class=\"u\">٥. من سطور <span class=\"en\">Beowulf<\/span> اللي في الدرس: طلع كلمة متكررة أول حرف فيها، وقول ده بيسمى إيه، وليه استخدموه بدل القافية؟<\/div>", "n": 1, "i": 18, "a": "history-2-019", "x": "5d243623"}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">🐉<\/span><\/span> <span class=\"en\">Beowulf<\/span> ج1، الحكاية والعالم من الأول لالآخر.", "extra": "", "i": 19}];</script>
