<h1>الدرس ١: إيه هي «القواعد»؟ ثلاث طبقات وأربع زوايا</h1>

<script>window.LESSON_ID="grammar-01";window.STEPS=[{"t": "section", "h": "القواعد نظام في دماغك", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا يا عمر. إحنا هنبدأ من الأول خالص، من الصفر، ومش هنفترض إنك عارف حاجة. الدرس الأول ده مش درس قواعد عادي، ده درس \"إيه هي القواعد أصلًا\". ولو حسيت إنه سهل زيادة في الأول، استحمل، لأن آخر الدرس بيروح لمكان تاني خالص.</div>", "n": 1, "i": 1, "a": "grammar-01-001", "x": "aa2ffeeb"}, {"t": "learn", "h": "<div class=\"u\">خليني أبدأ بسؤال: إنت ليه بتفهم إنجليزي؟ مش عشان حفظت كلمات. عشان عندك نظام في دماغك. الدرس ده كله عن النظام ده.</div>", "n": 1, "i": 2, "a": "grammar-01-002", "x": "b71a93d5"}, {"t": "learn", "h": "<div class=\"u\">خد الجملتين دول. الأولى: <span class=\"en\">The cat ate the fish</span>. التانية: <span class=\"en\">The fish ate the cat</span>.</div>", "n": 1, "i": 3, "a": "grammar-01-003", "x": "162712dc"}, {"t": "learn", "h": "<div class=\"u\">نفس الكلمات بالظبط، أربع كلمات، نفس الحروف. بس الأولى معناها قطة أكلت سمكة، والتانية سمكة أكلت قطة. إيه اللي غيّر المعنى؟ مفيش كلمة اتغيرت. اللي اتغير هو الترتيب.</div>", "n": 1, "i": 4, "a": "grammar-01-004", "x": "7c055ff8"}, {"t": "learn", "h": "<div class=\"u\">الترتيب ده هو القواعد. ولاحظ حاجة: إنت مش محتاج تفكر. لما تقرا <span class=\"en\">the fish ate the cat</span>، دماغك بتعمل شغل في نص ثانية، وبتقول لك: السمكة هي اللي أكلت. مفيش تفكير واعي. ده معناه إن النظام ده متركب فيك، مش محفوظ في ورق.</div>", "n": 1, "i": 5, "a": "grammar-01-005", "x": "4ed2551b"}, {"t": "learn", "h": "<div class=\"u\">تعالى نزود حاجة. في العربي، الترتيب مرن أكتر. تقدر تقول \"أكل الولد التفاحة\"، وتقدر تقول \"التفاحة أكلها الولد\"، والمعنى قريب. في الإنجليزي الترتيب أشد. لو قلت <span class=\"en\">The apple ate the boy</span>، إنت مش بتعمل حاجة شاعرية، إنت بتعمل جملة معناها إن التفاحة أكلت الولد.</div><div class=\"u\">عشان كده الإنجليزي بيعتمد على الترتيب أكتر من العربي، وده هيفضل يرجع معانا في الوحدة 12 لما نتكلم عن أخطاء العربي.</div>", "n": 2, "i": 6, "a": "grammar-01-006", "x": "cca68caa"}, {"t": "learn", "h": "<div class=\"u\">دلوقتي خد الجملة دي: \"القطة الشطرنجية شربت قهوة باردة\". عمري ما قلت لك الجملة دي قبل كده، وإنت عمرك ما سمعتها، ومع كده فهمتها فورًا. بلاش، إنت كمان ممكن تتصورها، قطة بتلعب شطرنج وبتشرب قهوة.</div>", "n": 1, "i": 7, "a": "grammar-01-007", "x": "d9973684"}, {"t": "learn", "h": "<div class=\"u\">ليه فهمتها؟ لأنك مش عندك قائمة جمل محفوظة في دماغك. عندك نظام بيبني جمل جديدة. النظام ده هو اللي بنسميه القواعد. وفي سطر واحد: القواعد هي النظام اللي في دماغك اللي بيخليك تبني جمل وتفهم جمل جديدة.</div>", "n": 1, "i": 8, "a": "grammar-01-008", "x": "16a7f7c0"}, {"t": "section", "h": "معياري ووصفي", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">طيب لو القواعد نظام في الدماغ، ليه في المدرسة بتيجي على شكل أوامر؟ \"متقولش كذا\"، \"اكتب كذا\". هنا بندخل أول مصطلحين، وهما مهمين جدًا وهتسمعهم طول دراستك.</div>", "n": 1, "i": 10, "a": "grammar-01-009", "x": "f1bf937e"}, {"t": "learn", "h": "<div class=\"u\">المصطلح الأول: <span class=\"en\">prescriptive grammar</span>، القواعد المعيارية. دي قواعد بتأمر وتنهى. زي: متبدأش جملة بـ <span class=\"en\">And</span>. متفرقش الفعل المركب. دي قواعد التصحيح والامتحان.</div>", "n": 1, "i": 11, "a": "grammar-01-010", "x": "0af9ab4e"}, {"t": "learn", "h": "<div class=\"u\">المصطلح التاني: <span class=\"en\">descriptive grammar</span>، القواعد الوصفية. دي قواعد بتحكي الواقع، الناس بتتكلم إزاي فعلاً، من غير ما تحكم. دي شغل اللساني.</div>", "n": 1, "i": 12, "a": "grammar-01-011", "x": "cc5604bd"}, {"t": "learn", "h": "<div class=\"u\">خد مثال يوضح الفرق. جملتين: <span class=\"en\">Who did you talk to</span>? و <span class=\"en\">To whom did you talk</span>?</div>", "n": 1, "i": 13, "a": "grammar-01-012", "x": "a7788d79"}, {"t": "learn", "h": "<div class=\"u\">الوصفية بتقول لك: الاتنين مستخدمين في الإنجليزي الحقيقي، والتانية أكتر رسمية، والأولى مش غلط، هي بس أقل رسمية. مفيش حد في الحياة اليومية بيقول <span class=\"en\">To whom did you talk</span>، إلا في خطاب رسمي أو امتحان.</div>", "n": 1, "i": 14, "a": "grammar-01-013", "x": "03043edf"}, {"t": "learn", "h": "<div class=\"u\">تعالى على الحكاية اللي بتوضح إن القاعدة ممكن تبقى عادة مش قانون. فيه قاعدة مشهورة: متخلّيش حرف الجر في آخر الجملة. يعني متقولش <span class=\"en\">Who did you talk to</span>، قول <span class=\"en\">To whom did you talk</span>.</div>", "n": 1, "i": 15, "a": "grammar-01-014", "x": "7a886da5"}, {"t": "learn", "h": "<div class=\"u\">القاعدة دي جت منين؟ مش من طبيعة الإنجليزي. مؤرخو اللغة بيقولوا إنها جت من محاولة تطبيق نموذج اللاتينية على الإنجليزي في القرن التمنتاشر، وبيتربطوها بنقاد زي <span class=\"en\">Lowth</span>.</div><div class=\"u\">اللاتينية مكنتش بتسمح إن حرف الجر يبقى في الآخر، فالناس افتكرت إن الإنجليزي لازم يبقى زي اللاتينية عشان يبقى \"لغة محترمة\". والإنجليزي مش لاتيني، ودي مش قاعدة من قواعده.</div>", "n": 2, "i": 16, "a": "grammar-01-015", "x": "fbe0d6e8"}, {"t": "learn", "h": "<div class=\"u\">بس خد بالك، ومتزعلش من اللي جاي: المعياري ليه وظيفة حقيقية. في الكتابة الأكاديمية، وفي الامتحان، وفي التحرير، فيه <span class=\"en\">standard English</span> محدد، ولازم تلتزم بيه. عشان كده إحنا في الكورس هنستخدم الاتنين: الوصفي عشان تفهم اللغة، والمعياري عشان تكتب وتتصحح.</div><div class=\"u\">مش أعداء، أدوات.</div>", "n": 2, "i": 17, "a": "grammar-01-016", "x": "59a1c46a"}, {"t": "section", "h": "الكفاءة والأداء", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">تشومسكي فرّق بين حاجتين في كتابه <span class=\"en\">Aspects of the Theory of Syntax</span> سنة 1965.</div>", "n": 1, "i": 19, "a": "grammar-01-017", "x": "74932561"}, {"t": "learn", "h": "<div class=\"u\">الأولى: <span class=\"en\">competence</span>، الكفاءة. دي معرفتك باللغة، النظام اللي في دماغك.</div>", "n": 1, "i": 20, "a": "grammar-01-018", "x": "d3d9cbd4"}, {"t": "learn", "h": "<div class=\"u\">التانية: <span class=\"en\">performance</span>، الأداء. ده اللي بيطلع منك فعلاً، في الكلام والكتابة.</div>", "n": 1, "i": 21, "a": "grammar-01-019", "x": "47d9e0bc"}, {"t": "learn", "h": "<div class=\"u\">إيه الفرق العملي؟ ممكن تكون عارف القاعدة تمام، وبعدين تتلخبط، أو تبلغ لسانك، أو تنسى آخر الجملة. ده أداء تعبان، مش كفاءة تعبانة.</div>", "n": 1, "i": 22, "a": "grammar-01-020", "x": "9b5fd768"}, {"t": "learn", "h": "<div class=\"u\">خد مثال: سواق شاطر جدًا، سايق من عشرين سنة. يوم من الأيام إيده بترتعش شوية، أو مرهق. هو لسه شاطر، مهارته موجودة، بس التنفيذ اللي اتأثر. نفس الحكاية: الكفاءة موجودة، الأداء هو اللي تعبان.</div>", "n": 1, "i": 23, "a": "grammar-01-021", "x": "fbdab73d"}, {"t": "learn", "h": "<div class=\"u\">وليه ده مهم لك؟ عشان تفرق بين حاجتين: إنك تغلط، وإنك متعرفش. الغلطة في الكلام العادي حاجة، ونقص المعرفة حاجة تانية. وفي الوحدة 12 هنسمي الأولى <span class=\"en\">mistake</span>، الزلة، والتانية <span class=\"en\">error</span>، الخطأ.</div>", "n": 1, "i": 24, "a": "grammar-01-022", "x": "21a45d86"}, {"t": "section", "h": "الصحة النحوية والمقبولية", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">دلوقتي خد أشهر جملة في تاريخ علم اللغة. تشومسكي كتبها في كتاب <span class=\"en\">Syntactic Structures</span> سنة 1957:</div>", "n": 1, "i": 26, "a": "grammar-01-023", "x": "01492d94"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Colorless green ideas sleep furiously</span>.</div>", "n": 1, "i": 27, "a": "grammar-01-024", "x": "208c586b"}, {"t": "learn", "h": "<div class=\"u\">تعالى نقراها كلمة كلمة. <span class=\"en\">Colorless</span>، عديم اللون. <span class=\"en\">Green</span>، أخضر. <span class=\"en\">Ideas</span>، أفكار. <span class=\"en\">Sleep</span>، بتنوم. <span class=\"en\">Furiously</span>، بشراسة. يعني: أفكار خضراء عديمة اللون بتنوم بشراسة.</div>", "n": 1, "i": 28, "a": "grammar-01-025", "x": "ba5f9f52"}, {"t": "learn", "h": "<div class=\"u\">كل كلمة إنجليزي سليمة، والترتيب سليم: صفة، صفة، اسم، فعل، ظرف. بس المعنى مستحيل. الأفكار ملهاش لون، ومينفعش تبقى خضراء وعديمة اللون في نفس الوقت، والأفكار مش بتنوم، ومحدش بينوم بشراسة.</div>", "n": 1, "i": 29, "a": "grammar-01-026", "x": "c9d6a05d"}, {"t": "learn", "h": "<div class=\"u\">الجملة دي صحيحة نحويًا، <span class=\"en\">grammatical</span>، ومش مقبولة دلاليًا، <span class=\"en\">not semantically acceptable</span>. والدرس هنا: النحو لوحده مش كفاية. لو النحو لوحده كان كفاية، كنا هنعتبر الجملة دي إنجليزي سليم.</div>", "n": 1, "i": 30, "a": "grammar-01-027", "x": "ede8d9e2"}, {"t": "learn", "h": "<div class=\"u\">والعكس صحيح كمان. لو واحد أجنبي دخل مطعم وقال: <span class=\"en\">Me want water</span>. إيه اللي هيحصل؟ الويتر هيفهمه فورًا، وهيجيب له ماية. الجملة دي مفهومة، <span class=\"en\">acceptable</span>، بس مش صحيحة نحويًا في <span class=\"en\">standard English</span>، المفروض <span class=\"en\">I want water</span>.</div>", "n": 1, "i": 31, "a": "grammar-01-028", "x": "a1c0b7ec"}, {"t": "learn", "h": "<div class=\"u\">يعني عندنا مقياسين مختلفين: الصحة النحوية من ناحية، والمقبولية من ناحية تانية. ومش دايمًا بيمشوا مع بعض.</div>", "n": 1, "i": 32, "a": "grammar-01-029", "x": "e2fa1279"}, {"t": "section", "h": "اللغة خمس مستويات", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">تعالى بقى على أهم خريطة في الكورس كله. اللغة مش حاجة واحدة، اللغة خمس مستويات.</div>", "n": 1, "i": 34, "a": "grammar-01-030", "x": "58e853df"}, {"t": "learn", "h": "<div class=\"u\">المستوى الأول: <span class=\"en\">phonology</span>، الصوتيات. الأصوات ونظامها. مثال: ليه جمع <span class=\"en\">cat</span> بينطق <span class=\"en\">cats</span> بصوت س، وجمع <span class=\"en\">dog</span> بينطق <span class=\"en\">dogs</span> بصوت ز؟ الاتنين جمع، بس الصوت اتغير. ده نظام صوتي.</div>", "n": 1, "i": 35, "a": "grammar-01-031", "x": "cb4fa009"}, {"t": "learn", "h": "<div class=\"u\">المستوى التاني: <span class=\"en\">morphology</span>، الصرف. بناء الكلمة. زي <span class=\"en\">un</span>، <span class=\"en\">happi</span>، <span class=\"en\">ness</span>. تلات قطع بيعملوا كلمة واحدة.</div>", "n": 1, "i": 36, "a": "grammar-01-032", "x": "a9b8e067"}, {"t": "learn", "h": "<div class=\"u\">المستوى التالت: <span class=\"en\">syntax</span>، النحو. بناء الجملة والعلاقات بين أجزائها.</div>", "n": 1, "i": 37, "a": "grammar-01-033", "x": "d87bf222"}, {"t": "learn", "h": "<div class=\"u\">المستوى الرابع: <span class=\"en\">semantics</span>، الدلالة. المعنى الحرفي.</div>", "n": 1, "i": 38, "a": "grammar-01-034", "x": "33d62276"}, {"t": "learn", "h": "<div class=\"u\">المستوى الخامس: <span class=\"en\">pragmatics</span>، التداولية. المعنى في الاستخدام والمقام.</div>", "n": 1, "i": 39, "a": "grammar-01-035", "x": "5809482b"}, {"t": "learn", "h": "<div class=\"u\">خد جملة واحدة وحللها بالخمسة: <span class=\"en\">Could you close the window</span>?</div>", "n": 1, "i": 40, "a": "grammar-01-036", "x": "b8ae8aa9"}, {"t": "learn", "h": "<div class=\"u\">صوتيًا: <span class=\"en\">could you</span> بتندمج في النطق، بتسمعها كأنها كلمة واحدة.</div>", "n": 1, "i": 41, "a": "grammar-01-037", "x": "b0f38f43"}, {"t": "learn", "h": "<div class=\"u\">صرفيًا: <span class=\"en\">could</span> فعل ناقص، <span class=\"en\">close</span> فعل، <span class=\"en\">window</span> اسم.</div>", "n": 1, "i": 42, "a": "grammar-01-038", "x": "cca2f4a1"}, {"t": "learn", "h": "<div class=\"u\">نحويًا: شكلها سؤال.</div>", "n": 1, "i": 43, "a": "grammar-01-039", "x": "2150bb46"}, {"t": "learn", "h": "<div class=\"u\">دلاليًا: سؤال عن القدرة، يعني \"تقدر تقفل الشباك؟\"</div>", "n": 1, "i": 44, "a": "grammar-01-040", "x": "4f95dc7f"}, {"t": "learn", "h": "<div class=\"u\">وتداوليًا؟ هنا المفاجأة: دي مش سؤال، دي طلب. ومحدش في الدنيا هيرد \"<span class=\"en\">yes I could</span>\" ويسيب الشباك مفتوح. الرد الطبيعي إنه يقفل الشباك.</div>", "n": 1, "i": 45, "a": "grammar-01-041", "x": "32162bb3"}, {"t": "learn", "h": "<div class=\"u\">نفس الجملة، خمس معاني مختلفة حسب المستوى اللي بتبص منه. وده الفرق بين اللي \"بيعرف إنجليزي\" واللي \"فاهم إنجليزي\".</div>", "n": 1, "i": 46, "a": "grammar-01-042", "x": "e1f95788"}, {"t": "section", "h": "أربع زوايا لأي عنصر", "n": 1, "i": 47}, {"t": "learn", "h": "<div class=\"u\">دلوقتي هشرح لك القالب اللي هيمشي على كل درس في الكورس. إحنا هنبص على أي عنصر من أربع زوايا.</div>", "n": 1, "i": 48, "a": "grammar-01-043", "x": "d75aa500"}, {"t": "learn", "h": "<div class=\"u\">الزاوية الأولى: الشكل، <span class=\"en\">form</span>. بيتبني إزاي؟ الصيغة والترتيب والاتساق.</div>", "n": 1, "i": 49, "a": "grammar-01-044", "x": "450e78ab"}, {"t": "learn", "h": "<div class=\"u\">الزاوية التانية: الوظيفة، <span class=\"en\">function</span>. بيعمل إيه في الجملة؟ فاعل، مفعول، معدّل. وإزاي الوظيفة دي بتتحقق بأشكال مختلفة.</div>", "n": 1, "i": 50, "a": "grammar-01-045", "x": "6080c652"}, {"t": "learn", "h": "<div class=\"u\">الزاوية التالتة: المعنى، <span class=\"en\">meaning</span>. بيضيف إيه دلاليًا؟</div>", "n": 1, "i": 51, "a": "grammar-01-046", "x": "87f74147"}, {"t": "learn", "h": "<div class=\"u\">الزاوية الرابعة: الاستخدام، <span class=\"en\">use</span>. بيتستخدم إمتى، ومين بيستخدمه، وفي أي مقام؟</div>", "n": 1, "i": 52, "a": "grammar-01-047", "x": "8fd45102"}, {"t": "learn", "h": "<div class=\"u\">خد مثال بيربط الأربعة: الفاعل، <span class=\"en\">the Subject</span>. شكله ممكن يبقى جملة اسمية زي <span class=\"en\">The results show</span>. أو جملة نسبية موصولة زي <span class=\"en\">What he said surprised me</span>، ودي حتة مهمة جدًا في برنامجك وهنفرد لها درس لوحدها. أو مصدر زي <span class=\"en\">To err is human</span>.</div><div class=\"u\">وظيفته إن الفعل بيتفق معاه في العدد، والاتفاق ده اسمه <span class=\"en\">concord</span>، وليه تلات أنواع: نحوي ومعنوي وجوار. وكل ده في الوحدة 3. معناه ممكن يبقى اللي بيعمل الفعل، أو اللي الفعل بيحصل عليه.</div><div class=\"u\">واستخدامه في الكتابة الأكاديمية اختيار استراتيجي، وعشان كده بنكتب <span class=\"en\">This study shows</span>، مش <span class=\"en\">I show</span>. الفاعل ده كله في الوحدة 3.</div>", "n": 3, "i": 53, "a": "grammar-01-048", "x": "f9a0d3dc"}, {"t": "section", "h": "المصطلحات", "n": 1, "i": 54}, {"t": "learn", "h": "<div class=\"u\">تعالى نمر على مصطلحات الدرس بسرعة، وإنت هتلاقيها في الجدول مكتوبة، بس أنا عايزك تسمعها بصوتي كمان.</div>", "n": 1, "i": 55, "a": "grammar-01-049", "x": "301a939e"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Grammar</span>: القواعد، نظام اللغة ككل. <span class=\"en\">Syntax</span>: النحو، بناء الجملة. <span class=\"en\">Morphology</span>: الصرف، بناء الكلمة. <span class=\"en\">Phonology</span>: علم الأصوات الوظيفي. <span class=\"en\">Phonetics</span>: علم الأصوات النطقي. <span class=\"en\">Semantics</span>: الدلالة، المعنى الحرفي. <span class=\"en\">Pragmatics</span>: التداولية، المعنى في المقام. <span class=\"en\">Lexicon</span>:</div><div class=\"u\">المعجم الذهني، قاموسك الداخلي. <span class=\"en\">Morpheme</span>: مورفيم، أصغر وحدة ليها معنى. <span class=\"en\">Phrase</span>: عبارة. <span class=\"en\">Clause</span>: جملة صغرى. <span class=\"en\">Sentence</span>: جملة كاملة. <span class=\"en\">Utterance</span>: ملفوظ، كلام في سياق. <span class=\"en\">Prescriptive</span>: معياري. <span class=\"en\">Descriptive</span>: وصفي. <span class=\"en\">Standard English</span>: الإنجليزية المعيارية. <span class=\"en\">Dialect</span>: لهجة.</div><div class=\"u\"><span class=\"en\">Register</span>: سجل لغوي. <span class=\"en\">Competence</span>: الكفاءة. <span class=\"en\">Performance</span>: الأداء. <span class=\"en\">Grammaticality</span>: الصحة النحوية. <span class=\"en\">Acceptability</span>: المقبولية. <span class=\"en\">Well-formedness</span>: سلامة البناء. <span class=\"en\">Metalanguage</span>: لغة وصف اللغة. <span class=\"en\">Usage</span>: الاستعمال.</div>", "n": 3, "i": 56, "a": "grammar-01-050", "x": "448ccef6"}, {"t": "section", "h": "تمرين سريع", "n": 1, "i": 57}, {"t": "learn", "h": "<div class=\"u\">خد التمرين معايا. الأول بسيط: غيّر ترتيب <span class=\"en\">The dog chased the cat</span> وخلي المعنى يتغير. لو عملت <span class=\"en\">The cat chased the dog</span>، بقى القط هو اللي بيطارد الكلب.</div>", "n": 1, "i": 58, "a": "grammar-01-051", "x": "9d3e87de"}, {"t": "learn", "h": "<div class=\"u\">إيه الفرق بين <span class=\"en\">sentence</span> و<span class=\"en\">utterance</span>؟ الـ <span class=\"en\">sentence</span> وحدة نحوية كاملة، والـ <span class=\"en\">utterance</span> كلام بيطلع في سياق. \"ممكن تقفل الشباك؟\" <span class=\"en\">utterance</span>، مش <span class=\"en\">sentence</span> بالمعنى النحوي.</div>", "n": 1, "i": 59, "a": "grammar-01-052", "x": "6f2ea639"}, {"t": "learn", "h": "<div class=\"u\">متوسط: <span class=\"en\">He goed to school</span>، زلة ولا خطأ؟ دي خطأ، <span class=\"en\">error</span>، لأن اللي قالها مش عارف قاعدة الماضي، فعمّم القاعدة على غير محلها. لو واحد عارف وقالها وهو مرهق، دي زلة.</div>", "n": 1, "i": 60, "a": "grammar-01-053", "x": "581dba10"}, {"t": "learn", "h": "<div class=\"u\">متقدم: اشرح ليه <span class=\"en\">standard English</span> لهجة مش لغة أرقى. الإجابة: لأن كل اللغات لها لهجات، واللي بيبقى <span class=\"en\">standard</span> بيبقى بسبب سلطة ومدارس وطباعة، مش بسبب إنه أرقى لغويًا.</div>", "n": 1, "i": 61, "a": "grammar-01-054", "x": "75bf0521"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">أربع نقط ونقفل.</div>", "n": 1, "i": 63, "a": "grammar-01-055", "x": "88a07d38"}, {"t": "learn", "h": "<div class=\"u\">واحد: القواعد نظام في الدماغ، مش قائمة محفوظة.</div>", "n": 1, "i": 64, "a": "grammar-01-056", "x": "1d8bc385"}, {"t": "learn", "h": "<div class=\"u\">اتنين: وصفي للفهم، معياري للكتابة والامتحان.</div>", "n": 1, "i": 65, "a": "grammar-01-057", "x": "a2b066a9"}, {"t": "learn", "h": "<div class=\"u\">تلاتة: اللغة خمس مستويات، والمعنى بيتحدد في المقام.</div>", "n": 1, "i": 66, "a": "grammar-01-058", "x": "c38da182"}, {"t": "learn", "h": "<div class=\"u\">أربعة: القواعد مش نظرية واحدة، فيه أطر متنافسة، وده موضوع الوحدات الأخيرة، لما نوصل للدكتوراه.</div>", "n": 1, "i": 67, "a": "grammar-01-059", "x": "3dbc6d1a"}, {"t": "learn", "h": "<div class=\"u\">الدرس الجاي: الوصفي مقابل المعياري بعمق، وإزاي تعرف <span class=\"en\">standard English</span> وإمتى تلتزم بيه. سلام.</div>", "n": 1, "i": 68, "a": "grammar-01-060", "x": "7f6440d7"}, {"t": "section", "h": "اختبر نفسك", "n": 1, "i": 69}, {"t": "write", "h": "", "q": "الجملتين دول فيهم نفس الكلمات: <span class=\"en\">The dog bit the man</span> / <span class=\"en\">The man bit the dog</span>. إيه اللي غيّر المعنى؟", "key": "grammar-01:1", "n": 1, "i": 70}, {"t": "write", "h": "", "q": "عرّف في سطر: <span class=\"en\">descriptive grammar</span>.", "key": "grammar-01:2", "n": 1, "i": 71}, {"t": "write", "h": "", "q": "\"<span class=\"en\">I seen it</span>\" في كلام واحد عربي بيتعلم إنجليزي: <span class=\"en\">error</span> ولا <span class=\"en\">mistake</span>؟ وليه؟", "key": "grammar-01:3", "n": 1, "i": 72}, {"t": "write", "h": "", "q": "إيه اسم المستوى اللي بيدرس المعنى في المقام؟", "key": "grammar-01:4", "n": 1, "i": 73}, {"t": "write", "h": "", "q": "رتّب من الأصغر للأكبر: <span class=\"en\">clause</span>، <span class=\"en\">morpheme</span>، <span class=\"en\">sentence</span>، <span class=\"en\">phrase</span>.", "key": "grammar-01:5", "n": 1, "i": 74}, {"t": "write", "h": "", "q": "اشرح الفرق بين <span class=\"en\">grammaticality</span> و <span class=\"en\">acceptability</span> بمثال من عندك (مش من الدرس).", "key": "grammar-01:6", "n": 1, "i": 75}, {"t": "write", "h": "", "q": "ليه \"<span class=\"en\">Who did you talk to</span>?\" مش غلط في القواعد الوصفية؟", "key": "grammar-01:7", "n": 1, "i": 76}, {"t": "write", "h": "", "q": "إيه الفرق بين <span class=\"en\">competence</span> و <span class=\"en\">performance</span>، وإيه اللي بيخلي الغلطة تبقى أداء مش كفاءة؟", "key": "grammar-01:8", "n": 1, "i": 77}, {"t": "write", "h": "", "q": "خد أي جملة إنجليزية بتحبها وحللها على المستويات الخمسة.", "key": "grammar-01:9", "n": 1, "i": 78}, {"t": "write", "h": "", "q": "اشرح بأسلوبك ليه <span class=\"en\">standard English</span> لهجة مش لغة أرقى، وإيه اللي بيخلي الناس تحس إنها \"الصح\".", "key": "grammar-01:10", "n": 1, "i": 79}, {"t": "write", "h": "", "q": "الفاعل (<span class=\"en\">the Subject</span>) ممكن يتحقق بأشكال مختلفة. اذكر 3 أشكال، وإيه اللي بيخليهم كلهم فاعل.", "key": "grammar-01:11", "n": 1, "i": 80}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الوصفي مقابل المعياري بعمق، وإزاي تعرف standard English وإمتى تلتزم بيه.</div>", "extra": "", "i": 81}];</script>
