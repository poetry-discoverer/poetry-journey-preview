<h1>الدرس 0: من أين نبدأ؟ خريطة المناهج النقدية</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> متقدم</span><span class="tag">درس 0 من 3</span><span class="tag"><span class="em">⚡</span> المنهج النقدي والأساطير</span></div>

<script>window.LESSON_ID="intensive-0";window.STEPS=[{"t": "section", "h": "1) ما معنى \"منهج نقدي\"؟", "i": 0}, {"t": "learn", "h": "<div class=\"u\">القصيدة الواحدة يمكن أن نقرأها بأسئلة مختلفة. المنهج النقدي (<span class=\"en\">critical approach<\/span>) هو مجموعة أسئلة وأدوات نقرأ بها النص، وليس حكماً نهائياً عليه. كأنه عدسة: كل عدسة تُظهر شيئاً، وتُخفي شيئاً آخر. وهذا الكورس يعلّمك العدسات الرئيسية، ثم يطبقها على قصائد حقيقية.<\/div>", "n": 1, "a": "intensive-0-001", "x": "407bef1f", "i": 1}, {"t": "section", "h": "2) ما الذي تملكه من الكورسات السابقة؟", "i": 2}, {"t": "learn", "h": "<div class=\"u\">في كورس الشعر تعلمت أدوات القراءة القريبة من سطح القصيدة: الصوت والإيقاع (<span class=\"en\">rhythm<\/span>) والقافية (<span class=\"en\">rhyme<\/span>) والمقطع (<span class=\"en\">stanza<\/span>)، ثم الصور: التشبيه (<span class=\"en\">simile<\/span>)، والاستعارة (<span class=\"en\">metaphor<\/span>)، والتشخيص (<span class=\"en\">personification<\/span>)، والصورة الشعرية (<span class=\"en\">imagery<\/span>). هذه هي أدواتك لوصف ما يفعله النص.<\/div>", "n": 1, "a": "intensive-0-002", "x": "161eb8cc", "i": 3}, {"t": "mc", "h": "", "q": "ما معنى \"المنهج النقدي\"؟", "opts": ["حكم نهائي بأن القصيدة جيدة أو سيئة", "ترجمة القصيدة إلى العربية", "مجموعة أسئلة وأدوات نقرأ بها النص"], "ans": 2, "why": "مجموعة أسئلة وأدوات نقرأ بها النص", "i": 4, "ex": ["غلط: المنهج يساعد على الفهم والتفسير بالدليل. الحكم بالجودة ليس وظيفته الأولى.", "غلط: الترجمة عمل مختلف. المنهج النقدي يحلل النص ويفسره.", "صح: المنهج النقدي عدسة تضم أسئلة وأدوات نقرأ بها النص، وليس نتيجة جاهزة."]}, {"t": "learn", "h": "<div class=\"u\">في كورس تاريخ الشعر تعرفت على الفترات والمدارس: متى كتب الشاعر؟ وماذا كان يحدث حوله؟ وفي كورس الميثولوجيا تعرفت على القصص القديمة التي يستعيرها الشعراء مثل <span class=\"en\">Chaos<\/span> و<span class=\"en\">Prometheus<\/span> و<span class=\"en\">Pandora<\/span>. الكورس المكثف يبني على الثلاثة: يسأل \"لماذا يعمل المعنى بهذه الطريقة؟\" ويعطيك لغة نقدية لتجيب.<\/div>", "n": 1, "a": "intensive-0-003", "x": "5b26fca4", "i": 5}, {"t": "section", "h": "3) خريطة المناهج الرئيسية", "i": 6}, {"t": "learn", "h": "<div class=\"u\">المنهج الشكلي (<span class=\"en\">Formalism<\/span> / <span class=\"en\">New Criticism<\/span>): يقرأ النص نفسه فقط، بدقة: الكلمات والصور والبناء. سؤاله: كيف يصنع النص معناه؟ ظهر في النصف الأول من القرن العشرين، ومن رموزه <span class=\"en\">I<\/span>. <span class=\"en\">A<\/span>. <span class=\"en\">Richards<\/span> و<span class=\"en\">Cleanth Brooks<\/span>. والمنهج التاريخي-السيرِي: يسأل عن الزمن والسيرة: ماذا كان يحدث حول الشاعر وفي حياته؟<\/div>", "n": 1, "a": "intensive-0-004", "x": "b2e17a6e", "i": 7}, {"t": "learn", "h": "<div class=\"u\">المنهج النفسي-التحليلي (<span class=\"en\">Psychoanalytic<\/span>): يسأل عن الرغبات والصراعات والدوافع غير الواعية في النص، وأساسه أفكار <span class=\"en\">Sigmund Freud<\/span>. والمنهج النسوي (<span class=\"en\">Feminist<\/span>): يسأل عن صورة المرأة وعن من يتكلم ومن يُسكَت، ومن أعماله <span class=\"en\">A Room of One's Own<\/span> لـ <span class=\"en\">Virginia Woolf<\/span> (1929).<\/div>", "n": 1, "a": "intensive-0-005", "x": "97923dc2", "i": 8}, {"t": "tf", "h": "", "q": "كل قراءة نقدية تحتاج دليلاً من النص نفسه.", "ans": true, "why": "صح", "i": 9, "ex": ["صح: القراءة النقدية تستند إلى دليل من النص.", "غلط: بدون دليل من النص تصبح القراءة رأياً فقط."]}, {"t": "learn", "h": "<div class=\"u\">المنهج الماركسي (<span class=\"en\">Marxist<\/span>): يسأل عن الطبقة والمال والسلطة في النص وفي ظروف إنتاجه. ونقد استجابة القارئ (<span class=\"en\">Reader-response<\/span>): يسأل ماذا يفعل القارئ بالنص، فالمعنى عنده يحدث في القراءة، ومن أعلامه <span class=\"en\">Louise Rosenblatt<\/span> و<span class=\"en\">Stanley Fish<\/span>. والنقد الأسطوري (<span class=\"en\">Myth<\/span> / <span class=\"en\">Archetypal<\/span>): يبحث عن الأنماط المتكررة، ومن أعلامه <span class=\"en\">Northrop Frye<\/span>.<\/div>", "n": 1, "a": "intensive-0-006", "x": "48d26d10", "i": 10}, {"t": "section", "h": "4) تجربة صغيرة: قصيدة واحدة وثلاث قراءات", "i": 11}, {"t": "learn", "h": "<div class=\"u\">هذه قصيدة <span class=\"en\">William Blake<\/span> القصيرة \"<span class=\"en\">The Sick Rose<\/span>\" من <span class=\"en\">Songs of Experience<\/span> (1794):\n\"<span class=\"en\">O Rose<\/span>, <span class=\"en\">thou art sick<\/span>! / <span class=\"en\">The invisible worm<\/span>, / <span class=\"en\">That flies in the night<\/span> / <span class=\"en\">In the howling storm<\/span>: / <span class=\"en\">Has found out thy bed<\/span> / <span class=\"en\">Of crimson joy<\/span>: / <span class=\"en\">And his dark secret love<\/span> / <span class=\"en\">Does thy life destroy<\/span>.\"<\/div>", "n": 1, "a": "intensive-0-007", "x": "973c70f0", "i": 12}, {"t": "mc", "h": "", "q": "أي منهج يسأل: \"كيف يصنع النص معناه؟\" ويركز على النص فقط؟", "opts": ["الشكلي (<span class=\"en\">New Criticism<\/span>)", "النسوي", "التاريخي-السيرِي"], "ans": 0, "why": "الشكلي (<span class=\"en\">New Criticism<\/span>)", "i": 13, "ex": ["صح: المنهج الشكلي يقرأ بنية النص وصوره ولغته، ولا يعتمد على حياة المؤلف.", "غلط: المنهج النسوي يسأل عن تمثيل المرأة والسلطة في النص.", "غلط: هذا المنهج يربط النص بزمنه وبحياة مؤلفه، فهو ينظر خارج النص."]}, {"t": "learn", "h": "<div class=\"u\">بأدوات كورس الشعر: الوردة مُشخَّصة (<span class=\"en\">personification<\/span>) تُخاطَب كإنسان، والدودة صورة (<span class=\"en\">imagery<\/span>) غامضة. والقصيدة مقطعان من أربعة أسطر (<span class=\"en\">stanza<\/span>). هذا وصف شكلي. بعده نسأل: ماذا تعني الوردة والدودة؟ هنا تبدأ المناهج في إعطاء إجابات مختلفة.<\/div>", "n": 1, "a": "intensive-0-008", "x": "d890d453", "i": 14}, {"t": "learn", "h": "<div class=\"u\">قراءة شكلية: التركيز على التناقض بين \"<span class=\"en\">joy<\/span>\" و\"<span class=\"en\">destroy<\/span>\" وعلى الصوت. قراءة تاريخية: يرى كثير من الدارسين أن <span class=\"en\">Blake<\/span> ينتقد المجتمع والكنيسة في عصره (انظر القرنين 18 و19 في كورس التاريخ). قراءة نفسية: ترى بعض القراءات في الوردة والدودة رغبة مكبوتة أو مدمّرة. لا توجد قراءة واحدة متفق عليها، وهذا مقصود في التمرين.<\/div>", "n": 1, "a": "intensive-0-009", "x": "18ba1a21", "i": 15}, {"t": "section", "h": "5) كيف نستخدم المنهج؟", "i": 16}, {"t": "learn", "h": "<div class=\"u\">ثلاث قواعد. أولاً: المنهج أداة قراءة وليس حقيقة نهائية عن الشاعر. ثانياً: كل قراءة تحتاج دليلاً من النص نفسه: سطر أو كلمة أو صورة. ثالثاً: اذكر دائماً أي منهج تستخدم، فتقول: \"من منظور نفسي-تحليلي، يمكن قراءة...\" وهذا أسلوب مقبول أكاديمياً.<\/div>", "n": 1, "a": "intensive-0-010", "x": "32d90718", "i": 17}, {"t": "mc", "h": "", "q": "المنهج الشكلي (<span class=\"en\">New Criticism<\/span>) يركز على _____ نفسه.", "opts": ["حياة المؤلف", "النص", "عصر الكتابة"], "ans": 1, "why": "النص", "i": 18, "ex": ["غلط: حياة المؤلف تهم المنهج السيري، وليس الشكلي.", "صح: يركز المنهج الشكلي على النص: كلماته وصوره وبنيته.", "غلط: عصر الكتابة يهم المنهج التاريخي."]}, {"t": "learn", "h": "<div class=\"u\">خريطة الكورس: الدروس 1 إلى 5 للنظريات (النفسي-التحليلي، ما بعد فرويد، بلوم وفراي، مناهج أخرى، الانتقادات). والدرسان 6 و7 للتطبيق على قصائد. والدروس 8 إلى 12 للأساطير في الشعر الإنجليزي. والدرس 13 للمراجعة والاختبار.<\/div>", "n": 1, "a": "intensive-0-011", "x": "1bc82695", "i": 19}, {"t": "mc", "h": "", "q": "نتعامل في الكورس مع المنهج النقدي كأنه _____ نقرأ بها القصيدة.", "opts": ["حكم نهائي", "قانون ثابت", "عدسة"], "ans": 2, "why": "عدسة", "i": 20, "ex": ["غلط: المناهج لا تعطي حكماً نهائياً، بل قراءات يدعمها الدليل.", "غلط: ليس للمناهج قانون ثابت. يختلف الناقد في اختيار المنهج.", "صح: العدسة تُظهر زاوية من النص، وغيرها من العدسات يُظهر زوايا أخرى."]}, {"t": "write", "h": "", "q": "اكتب منهجين من المناهج الرئيسية وسؤال كل منهما.", "a": "مثال: المنهج الشكلي (<span class=\"en\">New Criticism<\/span>) يسأل: كيف يصنع النص معناه؟ والمنهج التاريخي يسأل: في أي سياق كُتب النص؟", "key": "intensive-0:essay", "i": 21}, {"t": "end", "h": "", "teaser": "ما درسته: المنهج عدسة، والكورس يبني على الأدوات السابقة. الدرس القادم: المنهج النفسي-التحليلي.", "extra": "المصادر: Richards, Practical Criticism (1929); Woolf, A Room of One's Own (1929); Frye, Anatomy of Criticism (1957); Blake, Songs of Experience (1794).", "i": 22}];</script>
