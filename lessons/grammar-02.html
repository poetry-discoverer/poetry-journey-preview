<script>window.LESSON_ID="grammar-02";window.STEPS=[{"t":"section","h":"نظرتين للغة","n":1,"i":0},{"t":"learn","h":"<div class=\"u\">أهلًا بيك في الدرس التاني. في الدرس اللي فات عرفنا إن القواعد نظام في الدماغ. النهارده هنسأل سؤال أخطر: مين اللي يقول إيه الصح في اللغة؟ تخيل إنك بتسأل صاحبك سؤال بالإنجليزي: <span class=\"en\">Who did you talk to</span>? ومدرسك في المدرسة قال لك: الصح <span class=\"en\">To whom did you talk</span>. مين فيهم صح؟ الاتنين. الفرق إن الأولى كلام عادي، والتانية كلام رسمي.</div>","n":1,"i":1,"a":"grammar-02-001","x":"067daa5a"},{"t":"section","h":"طريقتين للنظر","n":1,"i":2},{"t":"learn","h":"<div class=\"u\">فيه طريقتين للنظر للغة. الأولى معيارية، <span class=\"en\">prescriptive</span>. بتقول لك اعمل كده ومتعملش كده. زي إشارة المرور. التانية وصفية، <span class=\"en\">descriptive</span>. بتقول لك الناس بتعمل كده. زي تقرير الطقس، هو مش بيأمر السما إنها تمطر، هو بس بيقول إيه اللي بيحصل.</div>","n":1,"i":3,"a":"grammar-02-002","x":"3c17d90b"},{"t":"learn","h":"<div class=\"u\">والاتنين مفيدين. الوصفية عشان تفهم اللغة. والمعيارية عشان تكتب بحث، أو تجيب درجة في امتحان، أو تتنشر لك مقالة.</div>","n":1,"i":4,"a":"grammar-02-003","x":"9e7d7cea"},{"t":"section","h":"أربع زوايا للفرق","n":1,"i":5},{"t":"learn","h":"<div class=\"u\">نبدأ بالشكل، <span class=\"en\">form</span>. القاعدة المعيارية دايمًا أمر أو نهي، زي <span class=\"en\">never end a sentence with a preposition</span>. القاعدة الوصفية دايمًا تقرير، زي <span class=\"en\">speakers often place the preposition at the end in informal speech</span>.</div>","n":1,"i":6,"a":"grammar-02-004","x":"f19cab4e"},{"t":"learn","h":"<div class=\"u\">الزاوية التانية الوظيفة، <span class=\"en\">function</span>. المعيارية وظيفتها توحيد المعيار في الكتابة والتعليم. الوصفية وظيفتها بناء نظرية تفسر اللغة زي ما هي. التالتة المعنى، <span class=\"en\">meaning</span>. كلمة صح عند المعياري معناها مطابق للنموذج المعتمد. وعند الوصفي معناها بيتكلم بيه ناس فعلًا وبيتفهم. يعني نفس الكلمة بمعنيين، وده سبب معظم الخناقات.</div>","n":1,"i":7,"a":"grammar-02-005","x":"b4725c15"},{"t":"learn","h":"<div class=\"u\">والرابعة الاستعمال، <span class=\"en\">use</span>. المعيارية في الامتحان والبحث والصحافة والتحرير. والوصفية في البحث اللغوي والمعاجم الحديثة وتحليل الكلام الحقيقي.</div>","n":1,"i":8,"a":"grammar-02-006","x":"a8bc0004"},{"t":"section","h":"من فين جت القواعد المعيارية","n":1,"i":9},{"t":"learn","h":"<div class=\"u\">تعالى نرجع للقرن التامن عشر. الإنجليزي كان بيتحول للغة ثقافة وطباعة، وناس كتير عايزة تضبطه. ظهرت كتب قواعد مشهورة، منها كتاب <span class=\"en\">Robert Lowth</span>: <span class=\"en\">A Short Introduction to English Grammar</span>، سنة 1762.</div>","n":1,"i":10,"a":"grammar-02-007","x":"a6b4e056"},{"t":"learn","h":"<div class=\"u\">كتّاب كتير في الفترة دي اتأثروا بالنحو اللاتيني. فظهرت قواعد زي: متنهيش الجملة بحرف جر. اسمها <span class=\"en\">preposition stranding</span>. مثال: <span class=\"en\">What are you looking at</span>؟ الباحثون بيربطوا النقد ده بإن اللاتينية مكنش فيها بناء زيه.</div>","n":1,"i":11,"a":"grammar-02-008","x":"e97a6b15"},{"t":"learn","h":"<div class=\"u\">وفيه قاعدة تانية، النفي المزدوج، <span class=\"en\">double negative</span>. زي <span class=\"en\">I didn't see nothing</span>. <span class=\"en\">Lowth</span> كتب إن نفيين في الإنجليزي بيلغوا بعض ويبقوا إثبات، زي الرياضيات. مع إن الإنجليزي القديم والوسيط كان بيستخدم النفي المتعدد عادي، ولهجات كتير لسه بتستخدمه.</div>","n":1,"i":12,"a":"grammar-02-009","x":"be31ee2d"},{"t":"learn","h":"<div class=\"u\">وخد بالك من نقطة دقيقة. <span class=\"en\">Lowth</span> نفسه مكانش متشدد زي سمعته. الأبحاث الحديثة بتقول إنه كان شايف الـ <span class=\"en\">stranding</span> أسلوب شائع في الكلام والكتابة غير الرسمية. السمعة السيئة جت ممن جه بعده وكرر القاعدة كأنها قانون.</div>","n":1,"i":13,"a":"grammar-02-010","x":"0e16cfa0"},{"t":"section","h":"تلات أنواع من القواعد","n":1,"i":14},{"t":"learn","h":"<div class=\"u\">مش كل قاعدة تتصحح بيها قاعدة من نفس النوع. فيه تلات أنواع. النوع الأول قاعدة أصلية في النظام. زي <span class=\"en\">the big house</span>، مش <span class=\"en\">big the house</span>. ده مستحيل على أي ناطق أصلي، ومحدش بيغلط فيه. النوع التاني قاعدة معيارية اجتماعية. زي <span class=\"en\">I saw nothing</span> بدل <span class=\"en\">I didn't see nothing</span>. التانية مقبولة في لهجات، ومرفوضة في المعيار.</div>","n":1,"i":15,"a":"grammar-02-011","x":"7cecfd6d"},{"t":"learn","h":"<div class=\"u\">النوع التالت قاعدة أسلوبية. زي تجنب الـ <span class=\"en\">passive</span> في البحث. دي اختيار تحرير، مش صح وغلط. ومعظم التصحيحات اللي بتتعمل في الدنيا من النوع التاني والتالت، مش الأول.</div>","n":1,"i":16,"a":"grammar-02-012","x":"d014cba2"},{"t":"section","h":"الطبقة المتقدمة","n":1,"i":17},{"t":"learn","h":"<div class=\"u\">أشهر سوء فهم عن الوصفية: اللساني بيقول مفيش غلط. لأ. الوصفي بيقول إن الحكم لازم يكون على ظرف. صح في أنهي لهجة، وأنهي سجل، <span class=\"en\">register</span>، ولمين. جملة <span class=\"en\">Me want water</span> مش مقبولة في المعيار، وده ملاحظة وصفية مش حكم أخلاقي.</div>","n":1,"i":18,"a":"grammar-02-013","x":"a73dba85"},{"t":"learn","h":"<div class=\"u\">الباحثة <span class=\"en\">Deborah Cameron</span> سمّت الاهتمام بتنقية اللغة <span class=\"en\">verbal hygiene</span>. يعني ممارسة اجتماعية مش علمية. اللي بيصحح <span class=\"en\">less</span> و<span class=\"en\">fewer</span> مش بيطبق قانون لغوي، هو بيعبر عن قيمة اجتماعية: إنه منضبط ومتعلم.</div>","n":1,"i":19,"a":"grammar-02-014","x":"84ff2f10"},{"t":"learn","h":"<div class=\"u\">واللهجة المعيارية، <span class=\"en\">standard</span>، مش أحسن لغويًا. هي اللهجة اللي اتربطت بالسلطة والتعليم والطباعة. وبتحس إنها الصح لأن المدرسة بتعلمها وبتعاقب على غيرها. هنرجع للسؤال ده بعمق لاحقًا.</div>","n":1,"i":20,"a":"grammar-02-015","x":"c55f065d"},{"t":"section","h":"أربع أسئلة قدام أي قاعدة","n":1,"i":21},{"t":"learn","h":"<div class=\"u\">لما تقابل أي قاعدة معيارية، اسأل أربع أسئلة. واحد: مين قالها ومتى؟ اتنين: مبنية على إيه، استعمال فعلي ولا لغة تانية ولا ذوق؟ تلاتة: هل الكتّاب المتميزين بيخالفوها؟ أربعة: بتخص أنهي سجل؟</div>","n":1,"i":22,"a":"grammar-02-016","x":"6ee19845"},{"t":"section","h":"مصطلحات الدرس","n":1,"i":23},{"t":"learn","h":"<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. <span class=\"en\">Prescriptivism</span>: المعيارية. <span class=\"en\">Descriptivism</span>: الوصفية. <span class=\"en\">Norm</span>: المعيار. <span class=\"en\">Preposition stranding</span>: حرف الجر المتروك في آخر الجملة. <span class=\"en\">Double negative</span>: النفي المزدوج. <span class=\"en\">Split infinitive</span>: فصل المصدر، زي <span class=\"en\">to boldly go</span>. <span class=\"en\">Hypercorrection</span>: التصحيح المفرط، زي <span class=\"en\">Between you and I</span>. <span class=\"en\">Prestige</span>: المكانة الاجتماعية للتنويعة.</div>","n":1,"i":24,"a":"grammar-02-017","x":"efc8cf2c"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Verbal hygiene</span>: تنقية اللغة. <span class=\"en\">Acceptability judgment</span>: حكم المقبولية.</div>","n":1,"i":25,"a":"grammar-02-018","x":"472ff2c7"},{"t":"section","h":"الخلاصة","n":1,"i":26},{"t":"learn","h":"<div class=\"u\">أربع نقط ونقفل. واحد: المعياري بيأمر، والوصفي بيرصد، والاتنين ليهم وظيفة. اتنين: كلمة صح ليها معنيين: مطابق للنموذج، أو مستخدم فعلًا. تلاتة: معظم قواعد التصحيح اجتماعية أو أسلوبية، مش قواعد نظام. أربعة: اسأل دايمًا مين قالها، ومبنية على إيه، وفي أنهي سجل. الدرس الجاي: الأمثلة الحقيقية على كل ده، وإزاي بنفرق بين الخطأ والاختلاف.</div>","n":1,"i":27,"a":"grammar-02-019","x":"c3d83782"},{"t":"section","h":"الكويز","n":1,"i":28},{"t":"mc","q":"القاعدة «<span class=\"en\">never end a sentence with a preposition</span>» من النوع ده:","opts":["قاعدة معيارية","قاعدة وصفية","قانون طبيعي في الإنجليزي"],"ans":0,"why":"دي أمر ونهي، يعني معيارية.","ex":["صح: صيغتها نهي، والنهي علامة المعيارية (<span class=\"en\">prescriptive</span>).","غلط: الوصفية تقرير مش نهي.","غلط: الإنجليزي بيستخدم الـ <span class=\"en\">stranding</span> طبيعي في الكلام."],"n":1,"i":29,"h":""},{"t":"mc","q":"ليه ظهر النقد لـ <span class=\"en\">preposition stranding</span> في القرن 18؟","opts":["لأن الإنجليزي ممنوع فيه","تأثرًا بالنحو اللاتيني اللي مكنش فيه بناء زيه","لأن الناس بطلت تستخدمه"],"ans":1,"why":"الباحثون بيربطوه بتأثير النحو اللاتيني.","ex":["غلط: الإنجليزي بيسمح بيه من زمان.","صح: اللاتينية مكنش فيها بناء زيه، فاتنقد.","غلط: الناس لسه بتستخدمه لحد النهارده."],"n":1,"i":30,"h":""},{"t":"mc","q":"صنّف: «<span class=\"en\">big the house</span>» مش مقبولة. دي قاعدة:","opts":["أصلية في النظام","اجتماعية","أسلوبية"],"ans":0,"why":"ناطق أصلي مستحيل يقولها.","ex":["صح: ترتيب الصفة والاسم جزء من نظام اللغة نفسه.","غلط: ده مش اختلاف لهجات.","غلط: ده مش اختيار تحرير."],"n":1,"i":31,"h":""},{"t":"mc","q":"الـ <span class=\"en\">hypercorrection</span> معناها:","opts":["تصحيح مبالغ فيه بيوقعك في غلط","تصحيح قاعدة نحوية بسيطة","تجنب اللهجة"],"ans":0,"why":"زي <span class=\"en\">Between you and I</span>.","ex":["صح: المبالغة في تطبيق قاعدة بتنتج جملة زي <span class=\"en\">Between you and I</span>.","غلط: ده مش التعريف.","غلط: ده موضوع تاني خالص."],"n":1,"i":32,"h":""},{"t":"tf","q":"الوصفية معناها إن أي جملة مقبولة في أي مقام.","ans":false,"why":"غلط: الوصفي بيحكم على الظرف: لهجة وسجل ومتكلم.","ex":["غلط: الحكم لازم يبقى حسب الظرف، مش بدون حدود.","صح، الجملة غلط: الوصفي بيقول صح في أنهي سجل ولمين."],"n":1,"i":33,"h":""},{"t":"tf","q":"<span class=\"en\">Lowth</span> كان متشدد جدًا في موضوع الـ <span class=\"en\">stranding</span>.","ans":false,"why":"غلط: الأبحاث بتبيّن إنه شايفه شائع في الأسلوب غير الرسمي.","ex":["غلط: السمعة أشد من موقفه الفعلي.","صح، الجملة غلط: الأبحاث الحديثة بتقول إنه اعتبره أسلوبًا شائعًا."],"n":1,"i":34,"h":""},{"t":"recall","q":"اذكر الأسئلة الأربعة اللي تسألها قدام أي قاعدة معيارية.","a":"مين قالها ومتى؟ مبنية على إيه (استعمال ولا لغة تانية ولا ذوق)؟ هل الكتّاب المتميزين بيخالفوها؟ وبتخص أنهي سجل؟","n":1,"i":35,"h":""},{"t":"recall","q":"إيه الفرق بين «الصح» عند المعياري وعند الوصفي؟","a":"عند المعياري: مطابق للنموذج المعتمد. عند الوصفي: بيتكلم بيه ناس فعلًا وبيتفهم.","n":1,"i":36,"h":""},{"t":"write","q":"اشرح ليه الوصفية مش معناها «مفيش غلط» (٣-٤ جمل).","key":"grammar-02:1","a":"الوصفي بيحكم على ظرف: أنهي لهجة وأنهي سجل ولمين. مثلًا <span class=\"en\">Me want water</span> مش مقبولة في المعيار وغير نموذجية في كلام الناضج. ده ملاحظة وصفية مش حكم أخلاقي.","n":1,"i":37,"h":""},{"t":"write","q":"طبّق الأسئلة الأربعة على قاعدة «<span class=\"en\">never split an infinitive</span>» (٤-٦ جمل).","key":"grammar-02:2","a":"مين قالها: كتّاب معياريين من القرن 19 تقريبًا. مبنية على إيه: ذوق وتأثر باللاتينية اللي فيها المصدر كلمة واحدة. الكتّاب المتميزين بيخالفوها وبيستخدموا <span class=\"en\">to boldly go</span>. السجل: بتخص الكتابة الرسمية، وفي الكلام العادي مش مشكلة.","n":1,"i":38,"h":""},{"t":"end","h":"","teaser":"<div class=\"u\">الدرس الجاي: الأمثلة الحقيقية على الخطأ والاختلاف.</div><div class=\"u\">هنفرق بين <span class=\"en\">error</span> و<span class=\"en\">mistake</span> و<span class=\"en\">variation</span>، وإزاي نحكم من غير ما نحط الناس في خانة.</div>","extra":"المصادر: Lowth, A Short Introduction to English Grammar (1762); Cameron, Verbal Hygiene (1995); Leiden Univ. HSL/SHL 6 on preposition stranding; Oxford Handbook of the English Language on Lowth.","i":39}];</script>
