<script>window.LESSON_ID="poetry-10";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">لحد دلوقتي القافية كانت بسيطة: كلمتين آخر سطرين صوتهم زي بعض (<span class=\"en\">bright<\/span> / <span class=\"en\">night<\/span>). النهاردة هتكتشف إن ليها أشكال تانية، والشعراء الكبار بيستخدموها بقصد.<\/div>", "n": 1, "i": 0, "a": "poetry-10-001", "x": "efc12f2e"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: مراجعة القافية التامة (<span class=\"en\">perfect rhyme<\/span>)", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">الصوت من المتحرك المنبور لحد آخر الكلمة بيتطابق، وأول صوت بيختلف: <span class=\"en\">kit<\/span> / <span class=\"en\">bit<\/span>، <span class=\"en\">pot<\/span> / <span class=\"en\">hot<\/span>، <span class=\"en\">night<\/span> / <span class=\"en\">bright.<\/span><\/div><div class=\"u\">الحكم بالسمع مش بالكتابة، ودي هتفرق بعد شوية.<\/div>", "n": 2, "i": 2, "a": "poetry-10-002", "x": "071a1906"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: <span class=\"en\">internal rhyme<\/span>، قافية جوه السطر", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\">كلمتين بيقفوا على نفس الصوت جوه نفس السطر.<\/div>", "n": 1, "i": 4, "a": "poetry-10-003", "x": "2c41fe05"}, {"t": "learn", "h": "<div class=\"lead\">من <span class=\"en\">The Raven<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">Once upon a midnight dreary,<\/span> <span class=\"en\">while I pondered,<\/span> <span class=\"en\">weak and weary<\/span>\" (<span class=\"en\">dreary<\/span> / <span class=\"en\">weary<\/span>)<\/div><div class=\"u\">\"<span class=\"en\">While I nodded,<\/span> <span class=\"en\">nearly napping,<\/span> <span class=\"en\">suddenly there came a tapping<\/span>\" (<span class=\"en\">napping<\/span> / <span class=\"en\">tapping<\/span>)<\/div>", "n": 2, "i": 5, "a": "poetry-10-004", "x": "f8bb2812"}, {"t": "learn", "h": "<div class=\"lead\">ومن <span class=\"en\">Coleridge<\/span> (<span class=\"en\">Ancient Mariner<\/span>):<\/div><div class=\"u\">\"<span class=\"en\">The guests are met,<\/span> <span class=\"en\">the feast is set<\/span>\" (<span class=\"en\">met<\/span> / <span class=\"en\">set<\/span>)<\/div><div class=\"u\">\"<span class=\"en\">The ship was cheered,<\/span> <span class=\"en\">the harbour cleared<\/span>\" (<span class=\"en\">cheered<\/span> / <span class=\"en\">cleared<\/span>)<\/div><div class=\"u\">\"<span class=\"en\">It cracked and growled,<\/span> <span class=\"en\">and roared and howled<\/span>\" (<span class=\"en\">growled<\/span> / <span class=\"en\">howled<\/span>)<\/div><div class=\"u\">الإحساس: السطر بيدق جرس جوه نفسه، فالمزيكا كثيفة وبتجري.<\/div>", "n": 4, "i": 6, "a": "poetry-10-005", "x": "4fba163b"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: <span class=\"en\">slant rhyme<\/span>، قافية ناقصة", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">كلمتين قريبين في الصوت بس مش متطابقين (برضه <span class=\"en\">half rhyme<\/span> أو <span class=\"en\">near rhyme<\/span>). مثال: <span class=\"en\">shape<\/span> / <span class=\"en\">ship.<\/span><\/div><div class=\"u\"><span class=\"en\">Emily Dickinson<\/span> في <span class=\"en\">Because I could not stop for Death<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">He kindly stopped for me<\/span>\" / \"<span class=\"en\">And Immortality<\/span>\"<\/div><div class=\"u\"><span class=\"en\">me<\/span> / <span class=\"en\">Immortality<\/span> قريبين مش تامين، وده بالقصد. المقطع التاني: <span class=\"en\">away<\/span> / <span class=\"en\">civility.<\/span><\/div>", "n": 4, "i": 8, "a": "poetry-10-006", "x": "35e6726a"}, {"t": "learn", "h": "<div class=\"u\">ليه؟ القافية الكاملة بتدي إحساس \"مقفول ومظبوط\". الـ <span class=\"en\">slant<\/span> بتسيب إحساس مش مرتاح، وده مناسب لموضوع الموت. الشاعرة بتستخدم النقصان كمعنى.<\/div>", "n": 1, "i": 9, "a": "poetry-10-007", "x": "8383d94e"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: <span class=\"en\">eye rhyme<\/span>، قافية للعين مش للودن", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">الكتابة شبه بعض والنطق مختلف.<\/div><div class=\"li\"><span class=\"en\">cough<\/span> (كوف) / <span class=\"en\">dough<\/span> (دو): العين تقول قافية والودن تقول لأ.<\/div><div class=\"li\"><span class=\"en\">love<\/span> / <span class=\"en\">move<\/span> / <span class=\"en\">prove<\/span>: نفس الحكاية.<\/div><div class=\"u\">والأحلى <span class=\"en\">historic rhyme<\/span>: في <span class=\"en\">Hamlet<\/span> (حوالي 1600) شكسبير كتب:<\/div><div class=\"u\">\"<span class=\"en\">The great man down,<\/span> <span class=\"en\">you mark his favourite flies<\/span>; / <span class=\"en\">The poor advanced makes friends of enemies.<\/span>\"<\/div>", "n": 5, "i": 11, "a": "poetry-10-008", "x": "d7362c70"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">flies<\/span> / <span class=\"en\">enemies<\/span> كانت قافية تامة بنطقهم وقتها. النطق اتغير بعدين (<span class=\"en\">Great Vowel Shift<\/span>) فبقت <span class=\"en\">eye rhyme.<\/span> لو حسيت إن قافية في شعر قديم ضايعة، ممكن النطق هو اللي اتغير.<\/div>", "n": 1, "i": 12, "a": "poetry-10-009", "x": "f9e3d192"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: ملخص + تمرين", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">١- <span class=\"en\">internal<\/span>: جوه السطر (<span class=\"en\">dreary<\/span> / <span class=\"en\">weary<\/span>).<\/div><div class=\"u\">٢- <span class=\"en\">slant<\/span>: ناقصة بقصد (<span class=\"en\">me<\/span> / <span class=\"en\">Immortality<\/span>).<\/div><div class=\"u\">٣- <span class=\"en\">eye<\/span>: للعين (<span class=\"en\">cough<\/span> / <span class=\"en\">dough<\/span>). ولو كانت تامة زمان فهي <span class=\"en\">historic<\/span> (<span class=\"en\">flies<\/span> / <span class=\"en\">enemies<\/span>).<\/div><div class=\"u\">٤- التامة = مقفول ومظبوط، والـ <span class=\"en\">slant<\/span> = مش مرتاح.<\/div>", "n": 4, "i": 14, "a": "poetry-10-010", "x": "8926e603"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️<\/span><\/span> تمرين:<\/div><div class=\"u\">١- طلّع الـ <span class=\"en\">internal rhyme<\/span> من: \"<span class=\"en\">The guests are met,<\/span> <span class=\"en\">the feast is set<\/span>\".<\/div><div class=\"u\">٢- <span class=\"en\">cough<\/span> / <span class=\"en\">dough<\/span>: تامة ولا <span class=\"en\">slant<\/span> ولا <span class=\"en\">eye<\/span>؟ ليه؟<\/div><div class=\"u\">٣- اكتب سطر فيه <span class=\"en\">internal rhyme<\/span> من عندك (عن أكلك المفضل مثلاً)، وكلمتين عاملين <span class=\"en\">slant rhyme.<\/span><\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس ١١: أنواع الـ <span class=\"en\">stanza<\/span> (<span class=\"en\">couplet,<\/span> <span class=\"en\">tercet,<\/span> <span class=\"en\">quatrain<\/span>) ونظام القافية.<\/div>", "n": 5, "i": 15, "a": "poetry-10-011", "x": "fbfb7bca"}, {"t": "recall", "h": "", "q": "فين مكان الـ <span class=\"en\">internal rhyme<\/span>؟", "a": "جوه السطر (في النص أو بين سطرين)، مش في آخره بس.", "n": 1, "i": 16}, {"t": "recall", "h": "", "q": "النوع ده إيه: <span class=\"en\">napping<\/span> / <span class=\"en\">tapping<\/span> (من <span class=\"en\">The Raven)<\/span>؟", "a": "<span class=\"en\">internal rhyme<\/span> (<span class=\"en\">napping<\/span> في نص السطر و <span class=\"en\">tapping<\/span> في آخره).", "n": 1, "i": 17}, {"t": "recall", "h": "", "q": "ليه <span class=\"en\">cough<\/span> / <span class=\"en\">dough<\/span> بيتسموا <span class=\"en\">eye rhyme<\/span>؟", "a": "لأن العين تشوفهم متشابهين (<span class=\"en\">ough<\/span> في الآخر) بس النطق مختلف (كوف / دو).", "n": 1, "i": 18}, {"t": "tf", "h": "", "q": "صح ولا غلط: القافية التامة بتتحكم بالكتابة مش بالسمع.", "ans": false, "why": "غلط. التامة بالسمع (الصوت) مش بالكتابة.", "n": 1, "i": 19, "ex": ["الجملة غلط. التامة بالسمع (الصوت) مش بالكتابة.", "صح، الجملة غلط. التامة بالسمع (الصوت) مش بالكتابة."]}, {"t": "write", "h": "", "q": "اشرح يعني إيه <span class=\"en\">internal rhyme<\/span> وهات مثالين (واحد من <span class=\"en\">The Raven<\/span> وواحد من <span class=\"en\">Coleridge)<\/span>. وقول إزاي بتغير إحساس السطر.", "key": "poetry-10:5", "n": 1, "i": 20}, {"t": "write", "h": "", "q": "اشرح يعني إيه <span class=\"en\">slant rhyme<\/span>، وهات مثال من <span class=\"en\">Dickinson<\/span>، وقول ليه الشاعرة ممكن تختار قافية ناقصة بالقصد بدل التامة.", "key": "poetry-10:6", "n": 1, "i": 21}, {"t": "write", "h": "", "q": "اشرح الفرق بين <span class=\"en\">eye rhyme<\/span> العادية والـ <span class=\"en\">historic rhyme.<\/span> هات مثال لكل واحدة، وقول ليه ممكن نفتكر إن شاعر قديم \"غلط\" في القافية وهو ما غلطش.", "key": "poetry-10:7", "n": 1, "i": 22}, {"t": "end", "h": "", "teaser": "", "extra": "المصادر: <span class=\"en\">Wikipedia<\/span> (<span class=\"en\">Internal rhyme,<\/span> <span class=\"en\">Eye rhyme,<\/span> <span class=\"en\">Slant rhyme)<\/span> وقصيدة <span class=\"en\">Dickinson.<\/span>", "i": 23}];</script>
