<script>window.LESSON_ID="myth-m5";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 1) التوصيل باللي فات</div><div class=\"li\">افتكر من <span class=\"en\">M4</span>: <span class=\"en\">Deucalion</span> ابن مين؟ ابن <span class=\"en\">Prometheus.</span> النهارده نعرف إيه اللي عمله الأب ده وخلّى اسمه أشهر اسم في الميثولوجيا كلها.</div><div class=\"li\">وافتكر من <span class=\"en\">M2</span>: <span class=\"en\">Prometheus</span> و<span class=\"en\">Epimetheus</span> ولاد <span class=\"en\">Iapetus</span> (من الـ <span class=\"en\">Titans</span>).</div>", "n": 3, "i": 0, "a": "myth-m5-001", "x": "f01ecfbc"}, {"t": "learn", "h": "<div class=\"li\">معنى الاسمين: <span class=\"en\">Prometheus</span> = \"اللي بيفكر قبل\" (<span class=\"en\">Forethought</span>)، و<span class=\"en\">Epimetheus</span> = \"اللي بيفكر بعد\" (<span class=\"en\">Afterthought</span>). الاسمين توقعات شخصية مكتوبة من الميلاد.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 2) خدعة الأضحية (عند <span class=\"en\">Mecone</span>)</div><div class=\"li\">لما اتقسم قربان الثور بين الآلهة والبشر، <span class=\"en\">Prometheus</span> قسّمه كومين: كوم لحم كويس متغطي بجلد قبيح، وكوم عظام متغطية بطبقة دهن شهية. وخلى <span class=\"en\">Zeus</span> يختار.</div>", "n": 3, "i": 1, "a": "myth-m5-002", "x": "dcd7d293"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Zeus</span> اختار الدهن اللامع... فطلع عظام. ومن يومها الإغريق بيحرقوا العظام والدهن للآلهة ويأكلوا اللحم هما.</div><div class=\"li\">مثال من حياتنا: زي اللي بيلف علبة فاضية بورق هدايا فخم. الدرس: شكل الكوم مش هو جواه.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 3) سرقة النار</div><div class=\"u\"><span class=\"en\">Zeus</span> عاقب البشر بإنه خبّى عنهم النار. بس <span class=\"en\">Prometheus</span> رجع سرقها لهم، بكلام <span class=\"en\">Hesiod</span> نفسه:</div>", "n": 4, "i": 2, "a": "myth-m5-003", "x": "4d4499c4"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">but that the noble son of Iapetos stole again for men from Zeus the counsellor in a hollow fennel-stalk,</span> <span class=\"en\">so that Zeus who delights in thunder did not see it.</span>\"</div><div class=\"u\">(ابن <span class=\"en\">Iapetos</span> النبيل سرقها تاني للبشر... في ساق نبات شمر مجوفة، من غير ما <span class=\"en\">Zeus</span> يشوف.)</div><div class=\"li\">النار هنا مش مجرد شوب: دي رمز الحضارة كلها — الطبخ والصناعة والعلم.</div>", "n": 3, "i": 3, "a": "myth-m5-004", "x": "f63eed58"}, {"t": "learn", "h": "<div class=\"li\">ورد <span class=\"en\">Zeus</span>، بكلام <span class=\"en\">Hesiod</span>: \"هيديكوا مقابل النار شرّ يفرّح قلوبكم وانتوا بتعانقوا دماركم بإيديكم\".</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 4) خلق <span class=\"en\">Pandora</span>: أول ست</div><div class=\"u\"><span class=\"en\">Zeus</span> أمر إنها تتصنع من طين ومية، وكل إله يديها \"هدية\":</div><div class=\"li\"><span class=\"en\">Hephaestus</span> شكّلها من الطين \"على شكل عذراء محتشمة\".</div><div class=\"li\"><span class=\"en\">Athena</span> لبّستها وعلّمتها الغزل والنسيج.</div><div class=\"li\"><span class=\"en\">Aphrodite</span> حطّت على رأسها الجاذبية و\"الشوق القاسي والهموم اللي بتتعب الجسد\".</div>", "n": 6, "i": 4, "a": "myth-m5-005", "x": "8f6e7384"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Hermes</span> حطّ فيها \"عقل بلا خجل وطبيعة مخادعة\" وعلّمها الكلام.</div><div class=\"li\">والتسمية، بكلام <span class=\"en\">Hesiod</span> بالحرف (<span class=\"en\">Works and Days 80-82</span>):</div><div class=\"u\">\"<span class=\"en\">And he called this woman Pandora</span> (<span class=\"en\">All-Gifts</span>), <span class=\"en\">because all they who dwelt on Olympos gave each a gift,</span> <span class=\"en\">a plague to men who eat bread.</span>\"</div><div class=\"u\">(وسمّى الست دي <span class=\"en\">Pandora</span> يعني \"كل الهدايا\"، لأن كل سكان أوليمبوس أدوها كل واحد هدية... بلاء على البشر.)</div>", "n": 4, "i": 5, "a": "myth-m5-006", "x": "b84332d4"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">And he _____ this woman Pandora</div>", "opts": ["dwelt", "called", "wrongs"], "ans": 1, "why": "<span class=\"en\">And he called this woman Pandora</span>", "i": 6, "ex": ["غلط: <span class=\"en\">dwelt</span> تعني سكن، وهو فعل لازم لا يأخذ مفعولاً بهذا المعنى.", "صح: <span class=\"en\">And he called this woman Pandora</span>، أي: وسمّى هذه المرأة <span class=\"en\">Pandora</span>. <span class=\"en\">called</span> هنا فعل التسمية.", "غلط: <span class=\"en\">wrongs</span> اسم جمع (مظالم)، وليس فعلاً يربط <span class=\"en\">he</span> بالمرأة."]}, {"t": "learn", "h": "<div class=\"li\">ملحوظة للمستويات العليا (هترجع في المستوى 9): النص فيه نظرة سلبية للمرأة كـ \"بلاء\" — النقد النسوي بيحلل ده. دلوقتي خزّن الملاحظة بس.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 5) <span class=\"en\">Epimetheus</span> ياخد الهدية</div><div class=\"li\"><span class=\"en\">Prometheus</span> كان محذّر أخوه: \"ماتاخدش أي هدية من <span class=\"en\">Zeus</span>، ابعتها راجع\".</div><div class=\"li\">بس <span class=\"en\">Epimetheus</span> (اللي بيفكر بعد!) شاف الجمال ونسي التحذير. <span class=\"en\">Hesiod</span> بيقول ببرود: \"أخد الهدية، ولما الشر بقى بتاعه خلاص، فهم.\"</div>", "n": 4, "i": 7, "a": "myth-m5-007", "x": "c8d2a6f6"}, {"t": "learn", "h": "<div class=\"li\">مثال من حياتنا: صاحبك اللي بيفتكر نصيحتك بعد ما يقع في المشكلة بالظبط.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 6) الجرة — مش علبة! (أهم تصحيح لغوي في الكورس)</div><div class=\"li\">في النص الأصلي الإغريقي، <span class=\"en\">Pandora</span> فتحت \"<span class=\"en\">pithos</span>\" — جرة تخزين كبيرة من الفخار، مش علبة. <span class=\"en\">Perseus</span> بيحط علامة حاشية على كلمة <span class=\"en\">jar</span> عشان دي.</div>", "n": 3, "i": 8, "a": "myth-m5-008", "x": "cbfc7887"}, {"t": "learn", "h": "<div class=\"li\">\"العلبة\" جت من خطأ ترجمة: عالم النهضة <span class=\"en\">Erasmus</span> في القرن 16 ترجم الكلمة للاتيني بكلمة معناها علبة (<span class=\"en\">pyxis</span>)، ومن يومها الإنجليزي ماشي بـ \"<span class=\"en\">Pandora's box</span>\".</div><div class=\"li\">(المصدر: <span class=\"en\">Wikipedia,</span> \"<span class=\"en\">Pandora's box</span>\").</div><div class=\"li\">مينفعش تنسى ده في امتحان: الأصل <span class=\"en\">jar</span>، والتقليد <span class=\"en\">box.</span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 7) اللي طلع... واللي فضل جوه</div>", "n": 4, "i": 9, "a": "myth-m5-009", "x": "b23473bd"}, {"t": "learn", "h": "<div class=\"lead\">بكلام <span class=\"en\">Hesiod</span> (<span class=\"en\">Works and Days 90-105</span>):</div><div class=\"u\">\"<span class=\"en\">But the woman took off the great lid of the jar with her hands and scattered all these and her thought caused sorrow and mischief to men.</span> <span class=\"en\">Only Hope remained there in an unbreakable home within under the rim of the great jar,</span> <span class=\"en\">and did not fly out at the door.</span>.. <span class=\"en\">But the rest,</span> <span class=\"en\">countless plagues,</span> <span class=\"en\">wander amongst men</span>; <span class=\"en\">for earth is full of evils and the sea is full.</span> <span class=\"en\">Of themselves diseases come upon men continually by day and by night,</span> <span class=\"en\">bringing mischief to mortals silently</span>; <span class=\"en\">for wise Zeus took away speech from them.</span>\"</div>", "n": 1, "i": 10, "a": "myth-m5-010", "x": "c783ab47"}, {"t": "learn", "h": "<div class=\"li\">طلعت: التعب الشاق، الأمراض، الهموم. وملحوظة عبقرية: <span class=\"en\">Zeus</span> شال من الأمراض الكلام، فبتيجي \"بصمت\" — مابتحذرش.</div><div class=\"li\">فضلت جوه: <span class=\"en\">Elpis</span> (الأمل)، اتقفل عليها الغطا قبل ما تطير.</div><div class=\"li\">سؤال النقاش المشهور (هتتسأل فيه): ليه الأمل فضل في الجرة؟ قراءتين:</div><div class=\"u\">١) الأمل هو العزاء الوحيد اللي اتساب للبشر.</div><div class=\"u\">٢) الأمل هو آخر الشرور، اتحبس عشان ميوصلش — لأن الأمل الكاذب بيطوّل المعاناة.</div>", "n": 5, "i": 11, "a": "myth-m5-011", "x": "e32e891c"}, {"t": "learn", "h": "<div class=\"u\">مفيش إجابة نهائية، والسؤال نفسه هو كنز الامتحان.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 8) عقاب <span class=\"en\">Prometheus</span></div><div class=\"li\"><span class=\"en\">Zeus</span> قيّده بسلاسل على جبل في الـ <span class=\"en\">Caucasus</span>، وبعت نسر ياكل كبده كل يوم، والكبد يتجدد كل ليلة (<span class=\"en\">Hesiod,</span> <span class=\"en\">Theogony 521-525</span>).</div><div class=\"li\">المسرحية الكاملة عن العقاب ده: <span class=\"en\">Aeschylus</span> \"<span class=\"en\">Prometheus Bound</span>\".</div><div class=\"li\">وأخيراً <span class=\"en\">Hercules</span> (هرقل، هنقابله بعدين في الكورس) قتل النسر وحرّره (<span class=\"en\">Theogony 526-528</span>).</div>", "n": 5, "i": 12, "a": "myth-m5-012", "x": "a9bafb0c"}, {"t": "learn", "h": "<div class=\"lead\">أ) <span class=\"en\">Byron</span>، قصيدة \"<span class=\"en\">Prometheus</span>\" (1816):</div><div class=\"u\">\"<span class=\"en\">Thy Godlike crime was to be kind,</span></div><div class=\"u\"><span class=\"en\">To render with thy precepts less</span></div><div class=\"u\"><span class=\"en\">The sum of human wretchedness,</span></div><div class=\"u\"><span class=\"en\">And strengthen Man with his own mind</span>;\"</div><div class=\"u\">(\"جريمتك الإلهية إنك كنت كريماً: إنك تقلل بمبادئك مجموع بؤس البشر، وتقوّي الإنسان بعقله هو.\") <span class=\"en\">Byron</span> بيقرأ <span class=\"en\">Prometheus</span> رمز للعقل الإنساني المتمرد اللي بيتحمل.</div>", "n": 5, "i": 13, "a": "myth-m5-013", "x": "52301eb1"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Thy Godlike _____ was to be kind,</div>", "opts": ["crime", "delights", "darker"], "ans": 0, "why": "<span class=\"en\">Thy Godlike crime was to be kind,</span>", "i": 14, "ex": ["صح: من قصيدة <span class=\"en\">Byron</span> عن <span class=\"en\">Prometheus</span>: <span class=\"en\">Thy Godlike crime was to be kind</span>. الشاعر سمّى مساعدة البشر 'جريمة' لأن الآلهة عاقبته عليها.", "غلط: <span class=\"en\">delights</span> تعني مسرّات، ولا تعبّر عن فكرة العقاب التي تقوم عليها القصيدة.", "غلط: <span class=\"en\">darker</span> صفة مقارنة (أكثر ظلمة)، ولا تناسب الموقع بعد <span class=\"en\">Godlike</span>."]}, {"t": "learn", "h": "<div class=\"u\">ب) <span class=\"en\">Percy Shelley</span>، \"<span class=\"en\">Prometheus Unbound</span>\" (1820): ملحمة درامية بيكمل فيها الأسطورة من عند <span class=\"en\">Aeschylus</span> بس بنهاية ثورية: <span class=\"en\">Prometheus</span> بيتحرر بالتسامح مش بالانتقام، والطغيان بينهار. من ختام الفصل الرابع:</div><div class=\"u\">\"<span class=\"en\">To suffer woes which Hope thinks infinite</span>;</div><div class=\"u\"><span class=\"en\">To forgive wrongs darker than death or night</span>;</div><div class=\"u\"><span class=\"en\">To defy Power,</span> <span class=\"en\">which seems omnipotent</span>;</div>", "n": 4, "i": 15, "a": "myth-m5-014", "x": "26416307"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">To love,</span> <span class=\"en\">and bear</span>; <span class=\"en\">to hope till Hope creates</span></div><div class=\"u\"><span class=\"en\">From its own wreck the thing it contemplates</span>;\"</div><div class=\"u\">(تتحمل آلام بتبان بلا نهاية، تسامح أخطاء أغمق من الموت والليل، تتحدى قوة بتبان مابتتقهرش، وتحب وتصبر...) دي واحدة من أشهر الخواتيم في الشعر الإنجليزي.</div>", "n": 3, "i": 16, "a": "myth-m5-015", "x": "7e780ff2"}, {"t": "learn", "h": "<div class=\"u\">ج) <span class=\"en\">Mary Shelley</span>، رواية \"<span class=\"en\">Frankenstein</span>; <span class=\"en\">or,</span> <span class=\"en\">The Modern Prometheus</span>\" (1818): العنوان الفرعي نفسه <span class=\"en\">allusion</span>: العالم اللي بيصنع حياة = <span class=\"en\">Prometheus</span> العصري، والعقاب وراه. وملحوظة تاريخية حلوة: صيف 1816 في جنيف هو نفسه اللي اتكتبت فيه قصيدة <span class=\"en\">Byron</span> اللي فوق وبدايات <span class=\"en\">Frankenstein</span> — أسطورة واحدة، تلات أعمال خالدة من نفس الموسم.</div>", "n": 1, "i": 17, "a": "myth-m5-016", "x": "7f610fce"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 10) كلمات من درس النهارده:</div><div class=\"u\"><span class=\"en\">Promethean</span> (مجهود/شجاعة بروميثيوسية: \"<span class=\"en\">Promethean effort</span>\") • <span class=\"en\">Pandora's box</span> (بتتقال في الأخبار لحد النهارده: \"فتح علبة باندورا\") • <span class=\"en\">pithos</span> (الجرة الأصلية — كلمة الامتحان).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">✏️</span></span> كويز <span class=\"en\">M5</span> (بعد ٣٠ دقيقة — جاوب مقالي أو بفويس):</div><div class=\"u\">١) احكِ خدعة الأضحية عند <span class=\"en\">Mecone</span>، واشرح إيه اللي بتبرره في العادات الإغريقية.</div>", "n": 3, "i": 18, "a": "myth-m5-017", "x": "c7c1a51a"}, {"t": "learn", "h": "<div class=\"u\">٢) بأي حاجة سرق <span class=\"en\">Prometheus</span> النار؟ واكتب السطر من <span class=\"en\">Hesiod.</span></div><div class=\"u\">٣) اشرح معنى اسم <span class=\"en\">Pandora</span> من نص <span class=\"en\">Hesiod</span>، وعدّد هدايا تلات آلهة ليها.</div><div class=\"u\">٤) صحّح: \"<span class=\"en\">Pandora's box</span>\" — إيه الأصل، ومين سبب الخطأ وإمتى؟</div><div class=\"u\">٥) قارن بين قراءة <span class=\"en\">Byron</span> وقراءة <span class=\"en\">Shelley</span> لـ <span class=\"en\">Prometheus</span> في فقرة قصيرة: مين شافه عقل صابر ومين شافه ثورة؟</div>", "n": 4, "i": 19, "a": "myth-m5-018", "x": "dd1c6c58"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🔗</span></span> روابط:</div><div class=\"li\"><span class=\"en\">Hesiod,</span> <span class=\"en\">Works and Days 42-105</span> (قصة <span class=\"en\">Pandora</span> كاملة، ترجمة <span class=\"en\">Evelyn-White</span>): <a class=\"en\" href=\"https://www.theoi.com/Heroine/Pandora.html\" target=\"_blank\" rel=\"noopener\">https://www.theoi.com/Heroine/Pandora.html</a></div><div class=\"li\"><span class=\"en\">Works and Days</span> الأسطر 83-105 على <span class=\"en\">Perseus</span>: <a class=\"en\" href=\"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0132%3Acard%3D83\" target=\"_blank\" rel=\"noopener\">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0132%3Acard%3D83</a></div><div class=\"li\"><span class=\"en\">Byron,</span> <span class=\"en\">Prometheus</span>: <a class=\"en\" href=\"https://www.poetryfoundation.org/poems/43843/prometheus-56d222b61d799\" target=\"_blank\" rel=\"noopener\">https://www.poetryfoundation.org/poems/43843/prometheus-56d222b61d799</a></div>", "n": 3, "i": 20, "a": "myth-m5-019", "x": "fe14aafc"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Shelley,</span> <span class=\"en\">Prometheus Unbound</span> الفصل الرابع: <a class=\"en\" href=\"https://knarf.english.upenn.edu/PShelley/prom4.html\" target=\"_blank\" rel=\"noopener\">https://knarf.english.upenn.edu/PShelley/prom4.html</a></div><div class=\"li\">حكاية الجرة/العلبة: <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Pandora%27s_box\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Pandora%27s_box</a></div>", "n": 2, "i": 21, "a": "myth-m5-020", "x": "e245abeb"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🖼️</span></span> صور مقترحة للكتاب:</div><div class=\"li\">كأس إغريقي أحمر (<span class=\"en\">red-figure kylix</span>) لمشهد خلق <span class=\"en\">Pandora</span>، المتحف البريطاني (مذكور في صفحة <span class=\"en\">theoi</span>)</div><div class=\"li\">\"<span class=\"en\">Prometheus Bound</span>\" لـ <span class=\"en\">Rubens</span> (متحف فيلادلفيا — <span class=\"en\">public domain</span>)</div><div class=\"li\">لوحة \"<span cl
