<script>window.LESSON_ID="history-5";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"قصائد الرثاء والحنين: <span class=\"en\">The Wanderer</span> و<span class=\"en\">The Seafarer</span>\"</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🌊</span></span> خلصنا <span class=\"en\">Beowulf</span> بجزأيها. النهاردة هنسمع صوت تاني من نفس العصر: أهدى، وأحزن، وأقرب للقلب. مش صوت بطل في معركة، دي صوت واحد قاعد لوحده بيحكي وجعه. دي أول مرة في الإنجليزية تسمع \"أنا\" بتتكلم.</div><div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️</span></span>⃣: يعني إيه <span class=\"en\">elegy</span> (رثاء)؟</div>", "n": 3, "i": 0, "a": "history-5-001", "x": "ebfc64e2"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> التعريف البسيط:</div><div class=\"u\">قصيدة حزن على حاجة راحت ومش هترجع. ممكن ترثي شخص مات، أو زمن ضاع، أو حياة خلصت.</div>", "n": 1, "i": 1, "a": "history-5-002", "x": "8bc64519"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">elegy</span> (الرثاء) هي قصيدة...", "nq": 1, "opts": ["حزن على حاجة راحت ومش هترجع", "مدح ملك", "لغز"], "ans": 0, "why": "حزن على حاجة راحت ومش هترجع", "ex": ["صح: ممكن ترثي شخص أو زمن أو حياة.", "غلط: ده مدح.", "غلط: ده نوع تاني."], "i": 2}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> مثال من الحياة اليومية:</div><div class=\"u\">زي واحد بيرجع لقريته بعد سنين غربة، يلاقي الديوانية مقفولة والناس اللي كانوا بيقعدوا فيها ماتوا أو سافروا، فيقف يبص ويكتب بوست حزين. البوست ده هو فكرة الـ <span class=\"en\">elegy</span> بالظبط.</div>", "n": 1, "i": 3, "a": "history-5-003", "x": "13705c25"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> في العصر القديم:</div><div class=\"u\">الرثاء عندهم مش بس على موتى. غالباً هو رثاء لعالم كامل راح: القاعة اللي خلت، الملك اللي مات، الصحاب اللي تفرقوا.</div>", "n": 1, "i": 4, "a": "history-5-004", "x": "cb66cfbc"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> بطاقة مكان:</div><div class=\"li\">القصيدتين دول محفوظين في <span class=\"en\">Exeter Book</span>، نفس المخطوطة اللي عرفناها في درس 2.</div><div class=\"li\"><span class=\"en\">Exeter Book</span> مخطوطة من حوالي سنة 975، ولسه محفوظة لحد النهاردة في مكتبة كاتدرائية إكستر.</div><div class=\"li\">ملحوظة مهمة: عناوين زي \"<span class=\"en\">The Wanderer</span>\" و\"<span class=\"en\">The Seafarer</span>\" مش من الشاعر نفسه، المخطوطة مفيهاش عناوين. دي أسماء حطها المحررون في العصر الحديث.</div>", "n": 3, "i": 5, "a": "history-5-005", "x": "167bdc8c"}, {"t": "mc", "h": "", "q": "<span class=\"en\">The Wanderer</span> و<span class=\"en\">The Seafarer</span> محفوظين في...", "nq": 1, "opts": ["<span class=\"en\">Exeter Book</span>", "<span class=\"en\">Vercelli Book</span>", "<span class=\"en\">Beowulf manuscript</span>"], "ans": 0, "why": "<span class=\"en\">Exeter Book</span>", "ex": ["صح: مخطوطة من حوالي سنة 975.", "غلط: الـ <span class=\"en\">Vercelli</span> فيه <span class=\"en\">Dream of the Rood</span>.", "غلط: ده فيه <span class=\"en\">Beowulf</span>."], "i": 6}, {"t": "learn", "h": "<div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️</span></span>⃣: <span class=\"en\">The Wanderer</span> (التائه)، 115 سطر <span class=\"em\"><span class=\"em\">🚶</span></span></div>", "n": 1, "i": 7, "a": "history-5-006", "x": "1812b051"}, {"t": "mc", "h": "", "q": "<span class=\"en\">The Wanderer</span> فيها كام سطر؟", "nq": 1, "opts": ["115 سطر", "15", "1150"], "ans": 0, "why": "115 سطر", "ex": ["صح: 115 سطر.", "غلط: أطول.", "غلط: أقصر."], "i": 8}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الحكاية:</div><div class=\"li\">راجل فقد ملكه وصحابه في الحرب، وبقى وحيد بيلف الأرض والبحر.</div><div class=\"li\">القصيدة بتسيبه يحكي: بيفتكر القاعة، والخواتم اللي الملك كان بيوزعها، والكؤوس والضحك. وكل ده خلص.</div><div class=\"li\">بيحلم بيهم وهو نايم، ويصحى يلاقي قدامه بس موج رمادي وطيور بحر. تصحى من حلم حلو لقيت واقع صعب؟ هو ده بالظبط.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> أشهر جزء فيها: أسئلة \"فين راح؟\"</div><div class=\"li\">وسط القصيدة فيه سلسلة أسئلة مفطرة:</div>", "n": 5, "i": 9, "a": "history-5-007", "x": "bd92e998"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Hw</span>æ<span class=\"en\">r cwom mearg?</span> <span class=\"en\">Hw</span>æ<span class=\"en\">r cwom mago?</span>\"</div><div class=\"u\">يعني: \"فين راح الحصان؟ فين الفارس؟\" وبيكمل: فين موزع الكنوز؟ فين قعدات القاعة؟</div><div class=\"li\">النمط ده ليه اسم لاتيني معروف: <span class=\"en\">ubi sunt</span> (يعني حرفياً \"أين هم؟\")، وهتلاقيه بيتردد في الأدب الإنجليزي لقرون بعد كده. احفظ المصطلح من دلوقتي.</div>", "n": 3, "i": 10, "a": "history-5-008", "x": "498af461"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">ubi sunt</span> معناها...", "nq": 1, "opts": ["أين هم؟ (فين راح الحصان؟ فين الفارس؟)", "اسمع!", "احذر"], "ans": 0, "why": "أين هم؟ (فين راح الحصان؟ فين الفارس؟)", "ex": ["صح: نمط لاتيني بيتسأل فين راح اللي راح.", "غلط: مش المعنى.", "غلط: مش المعنى."], "i": 11}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> النهاية:</div><div class=\"li\">بعد كل الوجع، الراجل بيوصل لنتيجة: الدنيا كلها عابرة، والثبات الحقيقي عند ربنا. نفس خليط الوثني والمسيحي اللي شفناه في <span class=\"en\">Beowulf.</span></div><div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️</span></span>⃣: <span class=\"en\">The Seafarer</span> (البحار)، 124 سطر <span class=\"em\"><span class=\"em\">⛵</span></span></div>", "n": 2, "i": 12, "a": "history-5-009", "x": "bd402854"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> الحكاية:</div><div class=\"li\">راجل بيحكي عن حياته في البحر. أول سطر بيناديك بنفسه:</div><div class=\"u\">\"<span class=\"en\">M</span>æ<span class=\"en\">g ic be me sylfum so</span>ð<span class=\"en\">gied wrecan</span>\"</div><div class=\"u\">يعني: \"أقدر أحكي عن نفسي حكاية صادقة\". كأنه بيقولك: اسمع، اللي جاي حقيقي مش خيال.</div><div class=\"li\">بيوصف الشتا في عرض البحر: رجليه متجمدة بالصقيع، والوحشة، وبدل ضحك القاعة وصوت الأصحاب، مفيش غير صراخ طيور البحر.</div>", "n": 4, "i": 13, "a": "history-5-010", "x": "9c56094b"}, {"t": "mc", "h": "", "q": "أول سطر في <span class=\"en\">The Seafarer</span> معناه...", "nq": 1, "opts": ["أقدر أحكي عن نفسي حكاية صادقة", "اسمعوا!", "فين الملك؟"], "ans": 0, "why": "أقدر أحكي عن نفسي حكاية صادقة", "ex": ["صح: كأنه بيقولك: اللي جاي حقيقي.", "غلط: ده سطر <span class=\"en\">Beowulf</span>.", "غلط: ده من <span class=\"en\">The Wanderer</span>."], "i": 14}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> المفارقة الجميلة:</div><div class=\"li\">البحر قاسي ومتعب، ومع ذلك الراجل مش قادر يبعد عنه. قلبه كل ما يقعد في الأرض يشده للسفر تاني.</div><div class=\"li\">مثال يومي: زي واحد شغلانه متعبة جداً وبيدمنها، بيسيبها يرتاح ويفضل يفكر فيها. الحاجة الصعبة اللي بتحبها رغم تعبها.</div>", "n": 2, "i": 15, "a": "history-5-011", "x": "ab75f752"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> التحول:</div><div class=\"li\">من نص القصيدة تقريباً، الكلام بيبقى عن الدنيا كلها: الملوك والمجد بيروحوا، والعالم بيشيخ، واللي يستاهل يتعمل هو العمل الصالح وذكرى حلوة بعد الموت.</div>", "n": 1, "i": 16, "a": "history-5-012", "x": "65f17f2d"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> تفصيلة لطيفة للمستقبل:</div><div class=\"li\">الشاعر الحداثي <span class=\"en\">Ezra Pound</span> عمل ترجمة/إعادة كتابة مشهورة لقصيدة دي سنة 1911. يعني أقدم صوت في الإنجليزية اتكلم مع أحدثه. احفظ الاسم، هنقابل <span class=\"en\">Pound</span> تاني لما نوصل للحداثة.</div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️</span></span>⃣: ليه القصيدتين دول مهمين؟ <span class=\"em\"><span class=\"em\">🌟</span></span></div>", "n": 2, "i": 17, "a": "history-5-013", "x": "08a136b8"}, {"t": "mc", "h": "", "q": "مين <span class=\"en\">Ezra Pound</span>، وإيه علاقته بـ <span class=\"en\">The Seafarer</span>؟", "nq": 1, "opts": ["شاعر حداثي عمل لها إعادة كتابة مشهورة سنة 1911", "شاعر ألفها", "راهب كتبها"], "ans": 0, "why": "شاعر حداثي عمل لها إعادة كتابة مشهورة سنة 1911", "ex": ["صح: أقدم صوت اتكلم مع أحدثه.", "غلط: شاعرها مجهول.", "غلط: مش راهب."], "i": 18}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 1) ميلاد صوت \"الأنا\":</div><div class=\"li\">في <span class=\"en\">Beowulf</span> كنت بتشوف بطل من بره. هنا لأول مرة بتدخل جوه دماغ وقلب واحد بيتكلم. ده بذرة الشعر الغنائي (اللي<span class=\"en\">ric</span>) اللي هيبقى أساس الشعر كله بعدين.</div>", "n": 1, "i": 19, "a": "history-5-014", "x": "bbbe57fa"}, {"t": "mc", "h": "", "q": "إيه الجديد في القصيدتين دول بالنسبة لـ <span class=\"en\">Beowulf</span>؟", "nq": 1, "opts": ["أول مرة ندخل جوه دماغ وقلب واحد بيتكلم بصيغة الأنا", "بطل جديد", "معركة جديدة"], "ans": 0, "why": "أول مرة ندخل جوه دماغ وقلب واحد بيتكلم بصيغة الأنا", "ex": ["صح: ده بذرة الشعر الغنائي (<span class=\"en\">lyric</span>).", "غلط: مفيش بطل ومعارك.", "غلط: مفيش معارك."], "i": 20}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 2) نفس أفكار الملحمة، من زاوية تانية:</div><div class=\"li\">الـ <span class=\"en\">wyrd</span> (القدر) والـ <span class=\"en\">lof</span> (المجد) والعزلة موجودين، بس مش في معركة، في نفس واحد قاعد لوحده. زي ما تكون شفت الفيلم من الكاميرا الداخلية بدل الخارجية.</div>", "n": 1, "i": 21, "a": "history-5-015", "x": "a5390a04"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 3) أسئلة <span class=\"en\">ubi sunt</span> هتعيش طويل:</div><div class=\"li\">الفورمولا دي هتقابلك في شعراء كبار بعد مئات السنين. لما تلاقي شاعر بيسأل \"فين راح الأبطال؟ فين الأيام الحلوة؟\" اعرف إن الجد يعيش هنا.</div>", "n": 1, "i": 22, "a": "history-5-016", "x": "b615398b"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 4) افتكر القاعدة الذهبية <span class=\"em\"><span class=\"em\">⭐</span></span>:</div><div class=\"li\">لسه إحنا في العصر القديم، مفيش ثورة لسه. بس الصوت الشخصي ده هو البذرة اللي هتكبر لحد ما تبقى مدرسة كاملة عند الرومانسيين بعد ألف سنة.</div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️</span></span>⃣: إزاي تقرا القصيدتين بنفسك <span class=\"em\"><span class=\"em\">📖</span></span></div><div class=\"u\">١. اقرا الترجمة الأول من غير ما تعلق على حاجة، بس عيش المزاج.</div><div class=\"u\">٢. حدد اللي فقده المتكلم في كل قصيدة (ملك؟ أصحاب؟ شباب؟).</div>", "n": 4, "i": 23, "a": "history-5-017", "x": "ebbbbb26"}, {"t": "learn", "h": "<div class=\"u\">٣. دور على صور البحر والشتا، واسأل نفسك: الجو ده بيعبر عن إيه جواه؟</div><div class=\"u\">٤. قارن نهاية كل قصيدة: فين لقى الراحة؟</div>", "n": 3, "i": 24, "a": "history-5-018", "x": "d04e8a23"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📝</span></span> كويز الدرس 5 (مقالي أو بالصوت):</div><div class=\"u\">١. في جملتين: يعني إيه <span class=\"en\">elegy</span>؟ وهات مثال من حياتنا لموقف يطلع منه نفس الإحساس.</div><div class=\"u\">٢. احكي حكاية المتكلم في <span class=\"en\">The Wanderer</span>: فقد إيه، وبيفتكر إيه، وبيحلم بإيه ويصحى على إيه؟</div><div class=\"u\">٣. اشرح يعني إيه <span class=\"en\">ubi sunt</span>، واكتب (أو احكي) السطرين اللي خدناهم كمثال وترجمهم بكلماتك.</div>", "n": 3, "i": 25, "a": "history-5-019", "x": "acaf9e9d"}, {"t": "learn", "h": "<div class=\"u\">٤. <span class=\"en\">The Seafarer</span> فيه مفارقة: البحر قاسي بس الراجل بيحبه. اشرحها، وهات مثال من الحياة لنفس الفكرة.</div><div class=\"u\">٥. سؤال مقارنة: إيه الفرق بين صوت المتكلم في <span class=\"en\">Beowulf</span> وصوته في القصيدتين دول؟ وليه النقاد بيعتبروا ده بداية مهمة في تاريخ الشعر؟</div>", "n": 2, "i": 26, "a": "history-5-020", "x": "74d74f32"}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">✝️</span></span> الشعر الديني القديم: <span class=\"en\">Caedmon</span>، أول شاعر إنجليزي نعرف اسمه، و<span class=\"en\">The Dream of the Rood.</span>", "extra": "", "i": 27}];</script>
