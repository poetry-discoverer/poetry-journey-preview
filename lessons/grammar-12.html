<script>window.LESSON_ID="grammar-12";window.STEPS=[{"t": "section", "h": "من الكلمة للجملة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في الدرس الاتناشر. لحد دلوقتي اشتغلنا على الكلمات. دلوقتي هنبدأ نشوف إزاي الكلمات بتتجمع في مجموعات. المجموعة دي اسمها <span class=\"en\">phrase</span>. <span class=\"en\">The old man</span> في جملة <span class=\"en\">The old man left</span> هي <span class=\"en\">phrase</span> واحدة. <span class=\"en\">In simple English</span>: <span class=\"en\">words group together into bigger units</span>.</div>", "n": 1, "i": 1, "a": "grammar-12-001", "x": "3fe7a408"}, {"t": "learn", "h": "<div class=\"u\">الجملة مش مجرد كلمات ورا بعض. فيه تنظيم جوّاها. مثلًا <span class=\"en\">The old man left</span> فيها مجموعة اسمية، <span class=\"en\">the old man</span>، ومجموعة فعلية، <span class=\"en\">left</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a sentence has a hidden structure</span>.</div>", "n": 1, "i": 2, "a": "grammar-12-002", "x": "8a1962b5"}, {"t": "section", "h": "الـ constituent", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">constituent</span> هي أي مجموعة كلمات بتتصرف كوحدة واحدة في الجملة. <span class=\"en\">The old man constituent</span>. لكن <span class=\"en\">old man left</span> مش <span class=\"en\">constituent</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a constituent is a group of words that acts as one unit</span>.</div>", "n": 1, "i": 4, "a": "grammar-12-003", "x": "6c5e6580"}, {"t": "mc", "q": "الـ <span class=\"en\">constituent</span> هو:", "opts": ["كلمة واحدة بس", "مجموعة كلمات بتتصرف كوحدة", "أي كلمتين جنب بعض"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a group that acts as one unit</span>.", "ex": ["غلط: ممكن يكون أكتر.", "صح.", "غلط: <span class=\"en\">old man left</span> مش وحدة."], "n": 1, "i": 5, "h": ""}, {"t": "section", "h": "اختبارات الـ constituent", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">عشان نعرف إن المجموعة <span class=\"en\">constituent</span> بنستخدم اختبارات. الأول <span class=\"en\">substitution</span>، بنبدل المجموعة بضمير. <span class=\"en\">The old man left</span> بتبقى <span class=\"en\">He left</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">replace the group with a pronoun</span>.</div>", "n": 1, "i": 7, "a": "grammar-12-004", "x": "e4697c43"}, {"t": "mc", "q": "<span class=\"en\">He left</span> بدل <span class=\"en\">The old man left</span> اختبار:", "opts": ["<span class=\"en\">substitution</span>", "<span class=\"en\">movement</span>", "<span class=\"en\">coordination</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">we replace the group with a pronoun</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 8, "h": ""}, {"t": "tf", "q": "<span class=\"en\">old man left constituent</span>.", "ans": false, "why": "غلط.", "ex": ["غلط: مش بتتصرف كوحدة.", "صح، الجملة غلط."], "n": 1, "i": 9, "h": ""}, {"t": "learn", "h": "<div class=\"u\">التاني <span class=\"en\">movement</span>، بنحرك المجموعة كلها. في الجملة <span class=\"en\">I saw the old man</span>، نقدر نقول <span class=\"en\">It was the old man that I saw</span>. وتالت اختبار <span class=\"en\">fragment</span>، المجموعة تنفع تبقى إجابة لوحدها. <span class=\"en\">Who left</span>? <span class=\"en\">The old man</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">if it moves</span>, <span class=\"en\">is replaced</span>, <span class=\"en\">or answers a question</span>, <span class=\"en\">it is probably a unit</span>.</div>", "n": 1, "i": 10, "a": "grammar-12-005", "x": "bc470892"}, {"t": "learn", "h": "<div class=\"u\">وفيه <span class=\"en\">coordination</span>، نقدر نعطف مجموعة على مجموعة تانية من نفس النوع. <span class=\"en\">The old man and the young woman left</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">you can join two units of the same kind with and</span>.</div>", "n": 1, "i": 11, "a": "grammar-12-006", "x": "ffadf9df"}, {"t": "section", "h": "الرأس", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">كل <span class=\"en\">phrase</span> ليها <span class=\"en\">head</span>، رأس، هي الكلمة الأهم فيها. في <span class=\"en\">the old man</span> الرأس هو <span class=\"en\">man</span>، فالمجموعة اسمية، <span class=\"en\">noun phrase</span>. وفي <span class=\"en\">very quickly</span> الرأس <span class=\"en\">quickly</span>، فهي <span class=\"en\">adverb phrase</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the head is the most important word in the phrase</span>.</div>", "n": 1, "i": 13, "a": "grammar-12-007", "x": "259587fc"}, {"t": "mc", "q": "رأس <span class=\"en\">the old man</span> هو:", "opts": ["<span class=\"en\">the</span>", "<span class=\"en\">old</span>", "<span class=\"en\">man</span>"], "ans": 2, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the main word is the noun</span>.", "ex": ["غلط.", "غلط: معدّل.", "صح."], "n": 1, "i": 14, "h": ""}, {"t": "learn", "h": "<div class=\"u\">الكلمات التانية في المجموعة بتعدّل أو بتكمّل الرأس. <span class=\"en\">Old</span> بتعدّل <span class=\"en\">man</span>. وفي <span class=\"en\">read a book</span>، كلمة <span class=\"en\">a book</span> بتكمّل <span class=\"en\">read</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">other words in the phrase add to the head</span>.</div>", "n": 1, "i": 15, "a": "grammar-12-008", "x": "30aaa189"}, {"t": "section", "h": "Modifier و complement", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">modifier</span> بيضيف معلومة اختيارية، زي <span class=\"en\">old</span> في <span class=\"en\">the old man</span>. نقدر نشيله والمجموعة تفضل سليمة. والـ <span class=\"en\">complement</span> بيكمّل الرأس وغالبًا مطلوب، زي <span class=\"en\">a book</span> مع <span class=\"en\">read</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a modifier is extra</span>, <span class=\"en\">and a complement is needed</span>.</div>", "n": 1, "i": 17, "a": "grammar-12-009", "x": "39d3af5a"}, {"t": "mc", "q": "<span class=\"en\">a book</span> مع <span class=\"en\">read</span> هي:", "opts": ["<span class=\"en\">modifier</span>", "<span class=\"en\">complement</span>", "<span class=\"en\">head</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it is needed by the verb</span>.", "ex": ["غلط: مش اختيارية.", "صح.", "غلط: الرأس <span class=\"en\">read</span>."], "n": 1, "i": 18, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">modifier</span> ممكن نشيله والمجموعة تفضل سليمة.", "ans": true, "why": "صح.", "ex": ["صح: <span class=\"en\">the man</span> لسه سليمة.", "غلط."], "n": 1, "i": 19, "h": ""}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">الشكل: المجموعة كلمات متجاورة حوالين رأس. الوظيفة: بتشتغل كوحدة في الجملة، زي فاعل أو مفعول. المعنى: المجموعة بتدّي معنى مركب أكبر من الكلمات منفردة. والاستعمال: بنحرك المجموعات ونستبدلها في الكلام اليومي من غير ما ناخد بالنا.</div>", "n": 1, "i": 21, "a": "grammar-12-010", "x": "36301479"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">بنرسم بنية المجموعة بشجرة، <span class=\"en\">tree diagram</span>. كل عقدة في الشجرة هي <span class=\"en\">constituent</span>. والرأس بيدّي اسمه للمجموعة كلها. ده اسمه <span class=\"en\">endocentric structure</span>، زي ما شفنا في المركبات. <span class=\"en\">In simple English</span>: <span class=\"en\">a tree shows how words group together</span>.</div>", "n": 1, "i": 23, "a": "grammar-12-011", "x": "d4e790c9"}, {"t": "learn", "h": "<div class=\"u\">وفيه فكرة مهمة: الاختبارات مش دايمًا بتتفق. ممكن مجموعة تعدّي اختبار وتفشل في التاني. عشان كده بنستخدم أكتر من اختبار. <span class=\"en\">In simple English</span>: <span class=\"en\">use more than one test</span>. وفي العربية نفس الفكرة. الولد الطويل مجموعة اسمية، والرأس الولد. بس الصفة بتيجي بعد الاسم، عكس الإنجليزي. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic puts the adjective after the noun</span>.</div>", "n": 1, "i": 24, "a": "grammar-12-012", "x": "53a19f8e"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس. <span class=\"en\">Phrase</span>: مجموعة كلمات. <span class=\"en\">In simple English</span>: <span class=\"en\">a group of words</span>. <span class=\"en\">Constituent</span>: مكوّن. <span class=\"en\">In simple English</span>: <span class=\"en\">a unit in a sentence</span>. <span class=\"en\">Head</span>: الرأس. <span class=\"en\">Modifier</span>: معدّل. <span class=\"en\">In simple English</span>: <span class=\"en\">extra information</span>. <span class=\"en\">Complement</span>: مكمّل. <span class=\"en\">In simple English</span>: <span class=\"en\">a needed part</span>.</div>", "n": 1, "i": 26, "a": "grammar-12-013", "x": "32eab855"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Substitution</span>: الاستبدال. <span class=\"en\">Movement</span>: النقل. <span class=\"en\">Fragment</span>: إجابة ناقصة. <span class=\"en\">Coordination</span>: العطف. <span class=\"en\">Noun phrase</span>: مجموعة اسمية. <span class=\"en\">Verb phrase</span>: مجموعة فعلية. <span class=\"en\">Tree diagram</span>: شجرة التحليل.</div>", "n": 1, "i": 27, "a": "grammar-12-014", "x": "3b0428a1"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: الكلمات بتتجمع في <span class=\"en\">phrases</span>. اتنين: الـ <span class=\"en\">constituent</span> وحدة بتتصرف ككتلة. تلاتة: بنختبرها بالاستبدال والنقل والإجابة والعطف. أربعة: كل <span class=\"en\">phrase</span> ليها <span class=\"en\">head</span>، وبيتعدّل بـ <span class=\"en\">modifiers</span> ويتكمل بـ <span class=\"en\">complements</span>. <span class=\"en\">In short</span>: <span class=\"en\">words form phrases around a head</span>. الدرس الجاي: أنواع المجموعات.</div>", "n": 1, "i": 29, "a": "grammar-12-015", "x": "dbca8f23"}, {"t": "section", "h": "الكويز", "n": 1, "i": 30}, {"t": "recall", "q": "اذكر ٣ اختبارات للـ <span class=\"en\">constituent</span>.", "a": "الاستبدال والنقل والإجابة الناقصة والعطف (أي ٣). <span class=\"en\">In simple English</span>: <span class=\"en\">replace</span>, <span class=\"en\">move</span>, <span class=\"en\">answer</span>, <span class=\"en\">join</span>.", "n": 1, "i": 31, "h": ""}, {"t": "recall", "q": "إيه الفرق بين <span class=\"en\">modifier</span> و<span class=\"en\">complement</span>؟", "a": "الـ <span class=\"en\">modifier</span> اختياري، والـ <span class=\"en\">complement</span> مطلوب غالبًا. <span class=\"en\">In simple English</span>: <span class=\"en\">extra versus needed</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "اشرح إزاي نعرف إن <span class=\"en\">the old man constituent</span> (٣-٤ جمل).", "key": "grammar-12:1", "a": "نستبدلها بـ <span class=\"en\">he</span> فتفضل الجملة سليمة. ونقدر نحركها: <span class=\"en\">It was the old man that I saw</span>. وتنفع إجابة: <span class=\"en\">Who left</span>? <span class=\"en\">The old man</span>. يعني بتتصرف كوحدة. <span class=\"en\">In simple English</span>: <span class=\"en\">it can be replaced</span>, <span class=\"en\">moved and used as an answer</span>.", "n": 1, "i": 33, "h": ""}, {"t": "write", "q": "اشرح معنى <span class=\"en\">head</span> بمثال (٣-٤ جمل).", "key": "grammar-12:2", "a": "الـ <span class=\"en\">head</span> هي أهم كلمة في المجموعة وبتحدد نوعها. في <span class=\"en\">the old man</span> الرأس <span class=\"en\">man</span> فالمجموعة اسمية. الكلمات التانية بتعدّل الرأس. <span class=\"en\">In simple English</span>: <span class=\"en\">the head gives the phrase its type</span>.", "n": 1, "i": 34, "h": ""}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين الـ <span class=\"en\">modifier</span> والـ <span class=\"en\">complement</span> في المجموعة.", "a": "<div class=\"u\">الـ <span class=\"en\">modifier</span> بيضيف معلومة اختيارية، زي <span class=\"en\">old</span> في <span class=\"en\">the old man</span>، ونقدر نشيله.</div><div class=\"u\">والـ <span class=\"en\">complement</span> بيكمّل الرأس وغالبًا مطلوب، زي <span class=\"en\">a book</span> مع <span class=\"en\">read</span>. الأول بيزوّد المعنى، والتاني بيكمّل معنى الرأس نفسه.</div>", "key": "grammar-12:3", "n": 1, "i": 35}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين الوصف التقليدي للجملة كقائمة كلمات وبين التحليل بالـ <span class=\"en\">constituents</span>.", "a": "<div class=\"u\">الوصف التقليدي بيعامل الجملة كسلسلة كلمات ورا بعض.</div><div class=\"u\">والتحليل بالـ <span class=\"en\">constituents</span> بيشوف إن الكلمات بتتجمع في مجموعات متداخلة حوالين رؤوس. التحليل التاني بيفسر ليه نقدر نبدل ونحرك مجموعات كاملة، وده الأول مش بيفسره.</div>", "key": "grammar-12:4", "n": 1, "i": 36}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: أنواع المجموعات.</div><div class=\"u\">هنشوف المجموعة الاسمية والفعلية وغيرهم بالتفصيل.</div>", "extra": "المصادر: Radford (2009); Huddleston and Pullum (2005).", "i": 37}];</script>
