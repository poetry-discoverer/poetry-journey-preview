<script>window.LESSON_ID="poetry-01";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">أهلاً بيك في أول درس. قبل الأوزان والقوافي والمصطلحات، لازم نجاوب على السؤال الأساسي: إيه هو الشعر؟ وإيه الفرق بينه وبين الكلام العادي؟<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🖋️<\/span><\/span> أشهر تعريف في تاريخ الشعر الإنجليزي<\/div><div class=\"u\">الشاعر <span class=\"en\">William Wordsworth<\/span> كتب في مقدمة كتابه <span class=\"en\">Lyrical Ballads<\/span> (طبعة ١٨٠٠):<\/div>", "n": 3, "i": 0, "a": "poetry-01-001", "x": "8424e294"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">I have said that Poetry is the spontaneous overflow of powerful feelings<\/span>: <span class=\"en\">it takes its origin from emotion recollected in tranquillity.<\/span>\"<\/div><div class=\"u\">الترجمة: \"الشعر هو الفيض التلقائي للمشاعر القوية، ومصدره الانفعال المتذكَّر في هدوء.\"<\/div>", "n": 2, "i": 1, "a": "poetry-01-002", "x": "1cbb2ee9"}, {"t": "learn", "h": "<div class=\"u\">يعني إيه؟ الشعر مش مجرد إحساس لحظي. إنت بتحس بحاجة قوية، وبعدين في هدوء بتفتكرها وتعيشها من تاني، وساعتها بتكتب. مشاعر + ذاكرة + هدوء = شعر.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">✂️<\/span><\/span> الفرق الأساسي بين الشعر والنثر: السطر<\/div><div class=\"u\">النثر (<span class=\"en\">prose<\/span>) بيمشي لآخر السطر عادي زي الفقرة دي. أما الشعر بيتكتب سطور (<span class=\"en\">lines<\/span>)، والشاعر هو اللي بيختار يقطع السطر فين. والقَطع ده مش شكل وبس، ده جزء من المعنى نفسه.<\/div>", "n": 3, "i": 2, "a": "poetry-01-003", "x": "7a070ab1"}, {"t": "learn", "h": "<div class=\"lead\">بص على المثال ده. الجملة دي كنثر عادي:<\/div><div class=\"u\">\"<span class=\"en\">so much depends upon a red wheelbarrow glazed with rain water beside the white chickens.<\/span>\"<\/div><div class=\"u\">دلوقتي نفس الكلمات بالظبط، زي ما كتبها الشاعر الأمريكي <span class=\"en\">William Carlos Williams<\/span> سنة ١٩٢٣:<\/div><div class=\"u\"><span class=\"en\">so much depends<\/span><\/div><div class=\"u\"><span class=\"en\">upon<\/span><\/div><div class=\"u\"><span class=\"en\">a red wheel<\/span><\/div><div class=\"u\"><span class=\"en\">barrow<\/span><\/div><div class=\"u\"><span class=\"en\">glazed with rain<\/span><\/div><div class=\"u\"><span class=\"en\">water<\/span><\/div><div class=\"u\"><span class=\"en\">beside the white<\/span><\/div><div class=\"u\"><span class=\"en\">chickens<\/span><\/div>", "n": 10, "i": 3, "a": "poetry-01-004", "x": "f3be15e1"}, {"t": "learn", "h": "<div class=\"u\">(القصيدة \"<span class=\"en\">The Red Wheelbarrow<\/span>\" من كتاب <span class=\"en\">Spring and All<\/span> سنة ١٩٢٣ — النص على موقع <span class=\"en\">Poetry Foundation<\/span>)<\/div>", "n": 1, "i": 4, "a": "poetry-01-005", "x": "ee077db3"}, {"t": "learn", "h": "<div class=\"lead\">إيه اللي حصل؟ نفس الكلمات، لكن:<\/div><div class=\"li\">كل سطر بيخليك توقف لحظة وتشوف الصورة لوحدها: العجلة، بعدين مية المطر الملمعة عليها، بعدين الفراخ البيضا.<\/div><div class=\"li\">كلمة <span class=\"en\">wheelbarrow<\/span> (عربة اليد) اتقسمت على سطرين، وكمان <span class=\"en\">rainwater<\/span>، فبتاخد بالك حتى من أجزاء الكلمة.<\/div><div class=\"li\">القصيدة كلها جملة واحدة متقطعة على سطور، يعني كل سطر \"بيعتمد\" على اللي بعده، زي ما أول كلمة في القصيدة بتقول: <span class=\"en\">depends.<\/span><\/div>", "n": 3, "i": 5, "a": "poetry-01-006", "x": "6828a2e6"}, {"t": "learn", "h": "<div class=\"u\">وده أول قانون في الشعر: الشعر مش بس اللي بتقوله، لكن إزاي بتقوله وإزاي بترتبه على الورقة.<\/div>", "n": 1, "i": 6, "a": "poetry-01-007", "x": "425e3cf7"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📚<\/span><\/span> مصطلحات الدرس (مهمة، هتيجي في الاختبار):<\/div><div class=\"u\">1. <span class=\"en\">Line<\/span> — السطر: وحدة الشعر الأساسية، والشاعر بيختار نهايته بنفسه.<\/div><div class=\"u\">2. <span class=\"en\">Stanza<\/span> — المقطع: مجموعة سطور متجمعة وبعدها سطر فاضي، زي الفقرة في النثر. قصيدتنا فيها ٤ مقاطع، كل مقطع سطرين.<\/div><div class=\"u\">3. <span class=\"en\">Verse<\/span> — كلمة ليها معنيين: \"شعر\" عموماً، أو مقطع واحد من قصيدة.<\/div><div class=\"u\">4. <span class=\"en\">Poet<\/span> — الشاعر: اللي كتب القصيدة فعلاً (<span class=\"en\">Williams<\/span> في مثالنا).<\/div>", "n": 4, "i": 7, "a": "poetry-01-008", "x": "f050ff80"}, {"t": "learn", "h": "<div class=\"u\">5. <span class=\"en\">Speaker<\/span> — المتكلم: الصوت اللي بيتكلم جوه القصيدة. ودي نقطة مهمة جداً: المتكلم مش دايماً الشاعر نفسه! هنرجع للنقطة دي كتير قدام.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🎯<\/span><\/span> ليه الدرس ده يهمك؟<\/div><div class=\"u\">لأنك طالب إنجليزي في الفرقة الأخيرة، وأسئلة زي \"عرّف الشعر\" و\"ما الفرق بين الشعر والنثر\" من أكتر الأسئلة تكراراً.<\/div>", "n": 3, "i": 8, "a": "poetry-01-009", "x": "486369c7"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️<\/span><\/span> تمرين صغير قبل الاختبار:<\/div><div class=\"u\">خد الجملة دي: \"<span class=\"en\">The old man sat under the tree watching the sunset in silence.<\/span>\"<\/div><div class=\"u\">حوّلها لقصيدة قصيرة: قطّعها لسطور (من ٣ لـ ٥ سطور) بالطريقة اللي تحس إنها بتخلي القارئ يشوف المشهد أوضح. اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⏳<\/span><\/span> بعد الدرس ده في اختبار بسيط عليه.<\/div>", "n": 3, "i": 9, "a": "poetry-01-010", "x": "2dd0973f"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">The old man sat under the tree watching the _____ in silence.<\/div>", "opts": ["overflow", "takes", "sunset"], "ans": 2, "why": "<span class=\"en\">The old man sat under the tree watching the sunset in silence.<\/span>", "i": 10, "ex": ["غلط: <span class=\"en\">overflow<\/span> تعني فيضاناً، وهي فعل أو اسم غير مناسب هنا لمشهد هادئ تحت شجرة.", "غلط: <span class=\"en\">takes<\/span> فعل، ولا يمكن مشاهدته بعد <span class=\"en\">the<\/span>.", "صح: الرجل العجوز يجلس تحت الشجرة ويراقب الغروب (<span class=\"en\">sunset<\/span>) في صمت. هذا ما يمكن أن يُشاهَد."]}, {"t": "recall", "h": "", "q": "أكمل تعريف <span class=\"en\">Wordsworth<\/span>: \"الشعر هو الفيض التلقائي لـ ... ومصدره ...؟\"", "a": "المشاعر القوية (<span class=\"en\">powerful feelings)<\/span>، ومصدره الانفعال المتذكَّر في هدوء (<span class=\"en\">emotion recollected in tranquillity)<\/span>.", "n": 1, "i": 11}, {"t": "recall", "h": "", "q": "قصيدة <span class=\"en\">The Red Wheelbarrow<\/span> فيها كام مقطع؟ وكل مقطع فيه كام سطر؟", "a": "٤ مقاطع، وكل مقطع سطرين.", "n": 1, "i": 12}, {"t": "tf", "h": "", "q": "صح ولا غلط: الـ <span class=\"en\">speaker<\/span> في أي قصيدة هو دايماً الشاعر نفسه.", "ans": false, "why": "غلط. الـ <span class=\"en\">speaker<\/span> ممكن يكون شخصية مختلفة تمامًا عن الشاعر: طفل، شايب، حتى حيوان أو شجرة.", "n": 1, "i": 13, "ex": ["الجملة غلط. الـ <span class=\"en\">speaker<\/span> ممكن يكون شخصية مختلفة تمامًا عن الشاعر: طفل، شايب، حتى حيوان أو شجرة.", "صح، الجملة غلط. الـ <span class=\"en\">speaker<\/span> ممكن يكون شخصية مختلفة تمامًا عن الشاعر: طفل، شايب، حتى حيوان أو شجرة."]}, {"t": "write", "h": "", "q": "اشرح بأسلوبك معنى تعريف <span class=\"en\">Wordsworth<\/span>: يعني إيه \"مشاعر قوية بتتفتكر في هدوء\"؟ وهات مثال من حياتك.", "key": "poetry-01:4", "n": 1, "i": 14}, {"t": "write", "h": "", "q": "قصيدة <span class=\"en\">The Red Wheelbarrow<\/span> كلها جملة واحدة عادية: \"<span class=\"en\">so much depends upon a red wheelbarrow glazed with rain water beside the white chickens<\/span>\". اشرح إيه اللي اتغير لما <span class=\"en\">Williams<\/span> قسّمها سطور ومقاطع، وليه ده فرّق في إحساسك بالصورة.", "key": "poetry-01:5", "n": 1, "i": 15}, {"t": "write", "h": "", "q": "اشرح بأسلوبك الفرق بين الـ <span class=\"en\">poet<\/span> والـ <span class=\"en\">speaker.<\/span> ولو هتكتب قصيدة الـ <span class=\"en\">speaker<\/span> فيها مش إنت، هتخلي مين يتكلم؟ (طفل؟ شجرة؟ عربية قديمة؟) وليه؟", "key": "poetry-01:6", "n": 1, "i": 16}, {"t": "end", "h": "", "teaser": "", "extra": "(المصدر: مقدمة <span class=\"en\">Lyrical Ballads 1800<\/span>، النص الكامل على <span class=\"en\">Project Gutenberg)<\/span>", "i": 17}];</script>
