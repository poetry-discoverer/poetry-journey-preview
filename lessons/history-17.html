<script>window.LESSON_ID="history-17", "history-18", "history-19", "history-20", "history-21", "history-13", "history-14", "history-15";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">🐉 في الدرس اللي فات شفنا <span class=\"en\">Spenser<\/span> وهو بيعمل كتابه الأول ويعلن إنه شاعر جديد.<\/div><div class=\"u\">النهاردة هنشوف الملحمة نفسها: <span class=\"en\">The Faerie Queene<\/span>. دي مش قصيدة، دي مشروع عمر.<\/div>", "n": 2, "a": "history-17-001", "x": "f04b1d13", "en": "In the last lesson we saw Spenser make his first book and announce that he is a new poet. Today we see the epic itself: The Faerie Queene. It is not a poem, it is a life project.", "i": 1}, {"t": "learn", "h": "<div class=\"u\">واحد من أطول الأعمال الشعرية في الإنجليزية، مكتوب في شكل شعري <span class=\"en\">Spenser<\/span> نفسه ابتكره، وبيحكي عن فارس بيدور على وحش، وفي نفس الوقت عن إنجلترا والكنيسة والملكة، وعنك إنت.<\/div><div class=\"u\">و<span class=\"en\">Spenser<\/span> مسابناش نخمّن: كتب رسالة بيشرح فيها خطته، والرسالة دي مفتاح الكتاب.<\/div>", "n": 2, "a": "history-17-002", "x": "dafb26d4", "en": "It is one of the longest poems in English, written in a poetic form Spenser himself developed, and it tells of a knight looking for a monster, and at the same time of England, the church, the queen, and you. And Spenser did not leave us to guess: he wrote a letter explaining his plan, and this letter is the key to the book.", "i": 2}, {"t": "section", "h": "النقطة 1: المشروع، ملحمة إنجليزية على 12 كتاب", "i": 3}, {"t": "learn", "h": "<div class=\"u\">النشر:<\/div><div class=\"li\">الكتب 1 لـ 3 طلعت سنة 1590.<\/div><div class=\"li\">والكتب 4 لـ 6 طلعت سنة 1596، مع إعادة طبع الأولى.<\/div><div class=\"li\">وفي طبعة 1609 اتنشر جزء اسمه <span class=\"en\">Cantos of Mutabilitie<\/span>، عن التغيير والثبات، والدارسين بيعتبروه جزء من كتاب سابع ما اتكملش.<\/div>", "n": 4, "a": "history-17-003", "x": "03b70e03", "en": "Publication. Books 1 to 3 came out in 1590. Books 4 to 6 came out in 1596, with a reprint of the first three. In the 1609 edition a part called the Cantos of Mutabilitie was published, about change and constancy, and scholars treat it as part of a seventh book that was never finished.", "i": 4}, {"t": "learn", "h": "<div class=\"u\">الحجم: حوالي 4000 مقطع، يعني فوق 35 ألف سطر. والأرقام بتختلف شوية بين الطبعات، فخدها كتقدير.<\/div><div class=\"u\">القصة مع الملكة: <span class=\"en\">Spenser<\/span> جه لندن حوالي 1589 و1590 لينشر الكتب الأولى، وواضح إن <span class=\"en\">Raleigh<\/span> ساعده. والملكة إدّته معاش 50 جنيه في السنة.<\/div>", "n": 2, "a": "history-17-004", "x": "8b7138c1", "en": "Size. About 4000 stanzas, which means over 35 thousand lines. The numbers differ a little between editions, so take it as an estimate. The story with the queen: Spenser came to London around 1589 and 1590 to publish the first books, and Raleigh clearly helped him. The queen gave him a pension of 50 pounds a year.", "i": 5}, {"t": "learn", "h": "<div class=\"u\">الخطة الأصلية: 12 كتاب، وكل كتاب عن فضيلة واحدة، وبطله فارس. يعني 12 فارس و12 فضيلة و12 مغامرة.<\/div><div class=\"u\">الكتاب مش مجموعة قصص: هو نظام أخلاقي كامل في صورة حكايات.<\/div><div class=\"u\">مثال من حياتنا: مسلسل من 12 موسم، كل موسم عن صفة واحدة: شجاعة، صبر، عفة. ده منهج تعليمي في صورة ترفيه.<\/div>", "n": 3, "a": "history-17-005", "x": "f0cb7cd6", "en": "The original plan: twelve books, each about one virtue, with a knight as its hero. So twelve knights, twelve virtues and twelve adventures. The book is not a set of stories: it is a full moral system in the form of tales. An example from our life: a series of twelve seasons, each about one quality: courage, patience, chastity. It is a teaching programme in the form of entertainment.", "i": 6}, {"t": "mc", "h": "", "q": "إمتى طلعت الكتب 1 لـ 3 من <span class=\"en\">The Faerie Queene<\/span>؟", "nq": 1, "opts": ["سنة 1590", "سنة 1579", "سنة 1609"], "ans": 0, "why": "سنة 1590", "ex": ["صح: والكتب 4 لـ 6 سنة 1596.", "غلط: 1579 هي سنة <span class=\"en\">Calender<\/span>.", "غلط: 1609 سنة <span class=\"en\">Mutabilitie<\/span>."], "i": 7}, {"t": "tf", "h": "", "q": "<span class=\"en\">Spenser<\/span> كمّل الـ12 كتاب اللي خطط لهم.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: طلع منهم 6 كتب كاملة، وجزء من كتاب سابع.", "صح: كمّل 6 بس."], "i": 8}, {"t": "section", "h": "النقطة 2: رسالة <span class=\"en\">Spenser<\/span> لـ <span class=\"en\">Raleigh<\/span>، الخطة بلسان الشاعر", "i": 9}, {"t": "learn", "h": "<div class=\"u\">الرسالة اسمها <span class=\"en\">A Letter of the Authors<\/span>، موجهة لـ <span class=\"en\">Sir Walter Raleigh<\/span>، واتنشرت مع طبعة 1590. فيها <span class=\"en\">Spenser<\/span> بيشرح نيته العامة. يعني هو نفسه بيديك دليل استخدام.<\/div><div class=\"u\">أهم جملة: \"<span class=\"en\">The generall end therefore of all the booke is to fashion a gentleman or noble person in vertuous and gentle discipline<\/span>.\"<\/div>", "n": 2, "a": "history-17-006", "x": "b78da5c2", "en": "The letter is called A Letter of the Authors, addressed to Sir Walter Raleigh, and published with the 1590 edition. In it Spenser explains his general intention. So he himself gives you a user guide. The most important sentence: The generall end therefore of all the booke is to fashion a gentleman or noble person in vertuous and gentle discipline.", "i": 10}, {"t": "learn", "h": "<div class=\"u\">يعني: الهدف العام من الكتاب كله إنه يصنع راجل نبيل في أدب وفضيلة. الكتاب مش للترفيه بس، ده مشروع تربية.<\/div><div class=\"u\">وبيقول إن الكتاب \"<span class=\"en\">a continued allegory, or darke conceit<\/span>\"، يعني رمزية متصلة، أو فكرة مظلمة. و\"مظلمة\" هنا مش عيب: معناها إن المعنى مش على السطح، ومحتاج قارئ شاطر.<\/div>", "n": 2, "a": "history-17-007", "x": "010879f4", "en": "It means: the general aim of the whole book is to make a noble man in good conduct and virtue. The book is not only for entertainment, it is an education project. And he calls the book a continued allegory, or darke conceit, meaning a running symbolic story, or a dark idea. Dark here is not a fault: it means the meaning is not on the surface and needs a clever reader.", "i": 11}, {"t": "learn", "h": "<div class=\"u\">وفكرة الـ12 يوم: في الرسالة، ملكة الجن بتعمل عيد 12 يوم، وكل يوم بتحصل مغامرة، وكل مغامرة بيخدها فارس.<\/div><div class=\"u\">والكتاب بيبدأ من وسط الحكاية: بيقول إن الشاعر \"<span class=\"en\">thrusteth into the middest<\/span>\"، يعني بيرمي نفسه في النص. وده اسمه <span class=\"en\">in medias res<\/span>، وهي طريقة <span class=\"en\">Homer<\/span> و<span class=\"en\">Virgil<\/span>. ف<span class=\"en\">Spenser<\/span> بيحط نفسه في صف الملاحم الكبيرة.<\/div>", "n": 2, "a": "history-17-008", "x": "4c1c4caf", "en": "The idea of twelve days: in the letter, the Fairy Queen holds a feast of twelve days, each day brings an adventure, and each adventure is taken by a knight. The book starts in the middle of the story: he says the poet thrusteth into the middest, meaning he throws himself into the text. This is called in medias res, the way of Homer and Virgil. So Spenser places himself in the line of the great epics.", "i": 12}, {"t": "learn", "h": "<div class=\"u\">ومين <span class=\"en\">Gloriana<\/span>؟ هي ملكة الجن اللي بيخدمها الفرسان.<\/div><div class=\"u\">و<span class=\"en\">Spenser<\/span> بيقول: \"<span class=\"en\">In that Fairy Queene I meane glory<\/span>\"، يعني أنا أقصد المجد. وفي التفصيل بيقصد شخص الملكة <span class=\"en\">Elizabeth<\/span>. يعني <span class=\"en\">Gloriana<\/span> هي المجد و<span class=\"en\">Elizabeth<\/span> في اسم واحد.<\/div><div class=\"u\">و<span class=\"en\">Prince Arthur<\/span> بيمثل \"<span class=\"en\">Magnificence<\/span>\"، يعني الكمال اللي فيه كل الفضائل. وهو بطل كل الكتب، لأنه بيجمع الفضائل.<\/div>", "n": 3, "a": "history-17-009", "x": "daeadb57", "en": "And who is Gloriana? She is the Fairy Queen whom the knights serve. And Spenser says: In that Fairy Queene I meane glory, meaning I mean glory. In particular he means the person of Queen Elizabeth. So Gloriana is glory and Elizabeth in one name. And Prince Arthur stands for Magnificence, the perfection that holds all virtues. He is the hero of all the books, because he gathers the virtues.", "i": 13}, {"t": "mc", "h": "", "q": "إيه الهدف العام للكتاب بحسب رسالة <span class=\"en\">Spenser<\/span>؟", "nq": 1, "opts": ["إنه يصنع راجل نبيل في أدب وفضيلة", "إنه يسلّي الملكة", "إنه يترجم <span class=\"en\">Virgil<\/span>"], "ans": 0, "why": "إنه يصنع راجل نبيل في أدب وفضيلة", "ex": ["صح.", "غلط.", "غلط."], "i": 14}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\">in medias res<\/span>؟", "nq": 1, "opts": ["إنك تبدأ الحكاية من وسطها", "إنك تبدأ بالنهاية", "إنك تكتب بالسجع"], "ans": 0, "why": "إنك تبدأ الحكاية من وسطها", "ex": ["صح: ده أسلوب <span class=\"en\">Homer<\/span> و<span class=\"en\">Virgil<\/span>.", "غلط.", "غلط."], "i": 15}, {"t": "mc", "h": "", "q": "مين <span class=\"en\">Gloriana<\/span>؟", "nq": 1, "opts": ["ملكة الجن، وفيها معنى المجد و<span class=\"en\">Elizabeth<\/span>", "الفارس الأحمر", "ساحر شرير"], "ans": 0, "why": "ملكة الجن، وفيها معنى المجد و<span class=\"en\">Elizabeth<\/span>", "ex": ["صح.", "غلط: ده <span class=\"en\">Redcrosse<\/span>.", "غلط: ده <span class=\"en\">Archimago<\/span>."], "i": 16}, {"t": "section", "h": "النقطة 3: الـ <span class=\"en\">Spenserian stanza<\/span>", "i": 17}, {"t": "learn", "h": "<div class=\"u\">الشكل:<\/div><div class=\"li\">المقطع تسع سطور.<\/div><div class=\"li\">أول 8 سطور كل واحد 5 تفعيلات (<span class=\"en\">iambic pentameter<\/span>).<\/div><div class=\"li\">والسطر التاسع 6 تفعيلات، واسمه <span class=\"en\">alexandrine<\/span>، يعني أطول.<\/div><div class=\"li\">والقافية: <span class=\"en\">ABABBCBCC<\/span>.<\/div>", "n": 5, "a": "history-17-010", "x": "55ef23da", "en": "The form. The stanza has nine lines. The first eight lines have five feet each, iambic pentameter. The ninth line has six feet, called an alexandrine, so it is longer. And the rhyme is ABABBCBCC.", "i": 18}, {"t": "learn", "h": "<div class=\"u\">من فين جاله؟ كتير من الدارسين بيقولوا إنه واخد من <span class=\"en\">rhyme royal<\/span> اللي <span class=\"en\">Chaucer<\/span> استخدمه (<span class=\"en\">ABABBCC<\/span>)، ومن <span class=\"en\">ottava rima<\/span> الإيطالية (<span class=\"en\">ABABABCC<\/span>)، وعمل منهم شكل جديد أطول.<\/div><div class=\"u\">وليه السطر التاسع طويل؟ لأنه بيبطّئ القارئ وبيقفل المقطع بوقفة. والمقطع بيبان كأنه بيتنفس: 8 سطور بتجري، وسطر طويل بياخد نفسه.<\/div>", "n": 2, "a": "history-17-011", "x": "55c48dc0", "en": "Where did it come from? Many scholars say he took from rhyme royal, which Chaucer used (ABABBCC), and from the Italian ottava rima (ABABABCC), and made from them a new, longer form. Why is the ninth line long? Because it slows the reader and closes the stanza with a pause. The stanza seems to breathe: eight lines that run, and one long line that takes a breath.", "i": 19}, {"t": "learn", "h": "<div class=\"u\">المقطع الأول من الكتاب:<\/div><div class=\"u\">\"<span class=\"en\">A Gentle Knight was pricking on the plaine<\/span>,<\/div><div class=\"u\"><span class=\"en\">Ycladd in mightie armes and siluer shielde<\/span>,<\/div><div class=\"u\"><span class=\"en\">Wherein old dints of deepe wounds did remaine<\/span>,<\/div><div class=\"u\"><span class=\"en\">The cruell markes of many a bloudy fielde<\/span>;<\/div><div class=\"u\"><span class=\"en\">Yet armes till that time did he neuer wield<\/span>:<\/div>", "n": 6, "a": "history-17-012", "x": "f4109a47", "en": "The first stanza of the book: A Gentle Knight was pricking on the plaine, Ycladd in mightie armes and siluer shielde, Wherein old dints of deepe wounds did remaine, The cruell markes of many a bloudy fielde; Yet armes till that time did he neuer wield.", "i": 20}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">His angry steede did chide his foming bitt<\/span>,<\/div><div class=\"u\"><span class=\"en\">As much disdayning to the curbe to yield<\/span>:<\/div><div class=\"u\"><span class=\"en\">Full iolly knight he seemd, and faire did sitt<\/span>,<\/div><div class=\"u\"><span class=\"en\">As one for knightly giusts and fierce encounters fitt<\/span>.\"<\/div>", "n": 4, "a": "history-17-013", "x": "1060cc5e", "en": "His angry steede did chide his foming bitt, As much disdayning to the curbe to yield: Full iolly knight he seemd, and faire did sitt, As one for knightly giusts and fierce encounters fitt.", "i": 21}, {"t": "learn", "h": "<div class=\"u\">يعني: فارس نبيل كان بيتحرك على السهل، لابس دروع قوية ودرع فضي، وفي الدروع آثار جروح قديمة من ساحات دم كتيرة. ومع كده هو ما استخدمش سلاح قبل الوقت ده: يعني الدروع قديمة، لكنه هو جديد.<\/div><div class=\"u\">حصانه الغضبان بيعض اللجام وبيزبد. والفارس بان مرح وقاعد حلو، كأنه مخلوق للمبارزات.<\/div>", "n": 2, "a": "history-17-014", "x": "354b26cd", "en": "It means: a noble knight was moving on the plain, wearing strong armour and a silver shield, and the armour has marks of old wounds from many bloody fields. Yet he had never used arms before this time: so the armour is old, but he is new. His angry horse bites the bit and foams. And the knight looked cheerful and sat well, as if made for jousts.", "i": 22}, {"t": "learn", "h": "<div class=\"u\">ولاحظ: <span class=\"en\">Ycladd<\/span> هي <span class=\"en\">clothed<\/span> بلغة قديمة، و<span class=\"en\">Spenser<\/span> بيستخدمها عن قصد عشان يبان وريث <span class=\"en\">Chaucer<\/span>.<\/div><div class=\"u\">والمقطع كله مدح، بس بعد كده هتشوف إن الفارس عديم الخبرة وبيغلط غلطات كبيرة. فالمقطع الأول فيه سخرية هادية: الصورة جميلة، والحقيقة أبسط.<\/div><div class=\"u\">مثال من حياتنا: سلم 9 درجات، 8 قصيرين، والتاسعة أطول عشان تريّح رجلك. ده المقطع عند <span class=\"en\">Spenser<\/span>.<\/div>", "n": 3, "a": "history-17-015", "x": "d9d1137a", "en": "Notice: Ycladd is clothed in old language, and Spenser uses it on purpose to look like Chaucer's heir. The whole stanza is praise, but later you will see that the knight is inexperienced and makes big mistakes. So the first stanza has a quiet irony: the picture is beautiful, the truth is simpler. An example from our life: a stair of nine steps, eight short ones, and the ninth longer to rest your foot. This is the stanza in Spenser.", "i": 23}, {"t": "mc", "h": "", "q": "كام سطر في الـ <span class=\"en\">Spenserian stanza<\/span>، وإيه القافية؟", "nq": 1, "opts": ["9 سطور، <span class=\"en\">ABABBCBCC<\/span>", "14 سطر، <span class=\"en\">ABAB CDCD<\/span>", "7 سطور، <span class=\"en\">ABABBCC<\/span>"], "ans": 0, "why": "9 سطور، <span class=\"en\">ABABBCBCC<\/span>", "ex": ["صح.", "غلط: ده السونيت.", "غلط: ده <span class=\"en\">rhyme royal<\/span>."], "i": 24}, {"t": "tf", "h": "", "q": "السطر التاسع في الـ <span class=\"en\">Spenserian stanza<\/span> أطول من الباقي (6 تفعيلات).", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: اسمه <span class=\"en\">alexandrine<\/span>.", "غلط: هو فعلاً أطول."], "i": 25}, {"t": "section", "h": "النقطة 4: الكتاب الأول، فارس اسمه <span class=\"en\">Redcrosse<\/span> وست اسمها <span class=\"en\">Una<\/span>", "i": 26}, {"t": "learn", "h": "<div class=\"u\">البطل: الفارس الأحمر <span class=\"en\">Redcrosse Knight<\/span>، بطل فضيلة <span class=\"en\">Holiness<\/span>، يعني القداسة.<\/div><div class=\"u\">والست اللي معاه <span class=\"en\">Una<\/span>، ومعناها \"واحدة\"، وهي بتمثل الحق والكنيسة الحقيقية.<\/div><div class=\"u\">بيوصلوا غابة، ويقابلوا وحش اسمه <span class=\"en\">Errour<\/span>، يعني الضلال. نصفه ست ونصفه حية ضخمة، وعنده أولاد كتير.<\/div>", "n": 3, "a": "history-17-016", "x": "74fa6076", "en": "The hero: the Redcrosse Knight, hero of the virtue Holiness. The lady with him is Una, which means one, and she stands for truth and the true church. They reach a forest and meet a monster called Errour, meaning error. Half woman and half huge serpent, with many young.", "i": 27}, {"t": "learn", "h": "<div class=\"u\">الفارس بيقاتله، والوحش بيلف عليه بذيله. والنص بيقول: \"<span class=\"en\">God helpe the man so wrapt in Errours endlesse traine<\/span>\".<\/div><div class=\"u\">يعني: يا رب ساعد الراجل اللي اتلف في ذيل الضلال اللي ما لوش آخر. الخطأ بيلفك، وكل ما تحاول تخرج بيلف أكتر.<\/div><div class=\"u\">والفارس بيكسب في الآخر، بس بعد معركة صعبة، وده أول درس: القداسة محتاجة انضباط مش حماس بس.<\/div>", "n": 3, "a": "history-17-017", "x": "8ac25926", "en": "The knight fights it, and the monster wraps him with its tail. The text says: God helpe the man so wrapt in Errours endlesse traine. It means: God help the man wrapped in the endless coil of error. Error wraps you, and the more you try to get out, the tighter it gets. The knight wins in the end, but after a hard fight, and this is the first lesson: holiness needs discipline, not only enthusiasm.", "i": 28}, {"t": "learn", "h": "<div class=\"u\">بعدها بيظهر <span class=\"en\">Archimago<\/span>، ساحر شرير في شكل راجل عجوز تقي. بيعمل حلم كاذب فيه <span class=\"en\">Una<\/span> بتخون الفارس، فالفارس يصحى ويسيبها ويمشي. ده أهم غلطة: هو بيصدّق صورة، مش حقيقة.<\/div><div class=\"u\">وبعدين بيقابل <span class=\"en\">Duessa<\/span>، ومعناها الازدواج، وبتظهر في شكل ست مسكينة، وبتستخدم اسم <span class=\"en\">Fidessa<\/span>، يعني \"الأمينة\". كدب في كدب.<\/div>", "n": 2, "a": "history-17-018", "x": "c894456c", "en": "Then Archimago appears, an evil magician in the shape of a pious old man. He makes a false dream in which Una betrays the knight, so the knight wakes up, leaves her and goes away. This is the biggest mistake: he believes a picture, not the truth. Then he meets Duessa, whose name means duplicity, who appears as a poor lady and uses the name Fidessa, meaning faithful. A lie on top of a lie.", "i": 29}, {"t": "learn", "h": "<div class=\"u\">السقوط: الفارس بيسيب <span class=\"en\">Una<\/span> ويصدّق <span class=\"en\">Duessa<\/span>، وبيتأسر عند عملاق اسمه <span class=\"en\">Orgoglio<\/span>، يعني الكبرياء.<\/div><div class=\"u\">و<span class=\"en\">Una<\/span> لوحدها بتدور عليه، وبتقابل <span class=\"en\">Prince Arthur<\/span>. و<span class=\"en\">Arthur<\/span> بيقتل العملاق، وبيحرر الفارس، وبيكشف <span class=\"en\">Duessa<\/span>: بتبان عجوزة مشوّهة مش ست جميلة. والجمال اللي كان بيخدع بان على حقيقته.<\/div>", "n": 2, "a": "history-17-019", "x": "3653de4c", "en": "The fall: the knight leaves Una and trusts Duessa, and is captured by a giant called Orgoglio, meaning pride. Una alone looks for him, and meets Prince Arthur. Arthur kills the giant, frees the knight, and exposes Duessa: she appears as a deformed old woman, not a beautiful lady. The beauty that was deceiving shows its true face.", "i": 30}, {"t": "mc", "h": "", "q": "مين <span class=\"en\">Errour<\/span>؟", "nq": 1, "opts": ["وحش نصفه ست ونصفه حية، رمز للضلال", "فارس", "ملكة"], "ans": 0, "why": "وحش نصفه ست ونصفه حية، رمز للضلال", "ex": ["صح.", "غلط.", "غلط."], "i": 31}, {"t": "mc", "h": "", "q": "إيه أكبر غلطة عملها <span class=\"en\">Redcrosse<\/span>؟", "nq": 1, "opts": ["صدّق صورة كاذبة وسيب <span class=\"en\">Una<\/span>", "قتل الوحش", "نام"], "ans": 0, "why": "صدّق صورة كاذبة وسيب <span class=\"en\">Una<\/span>", "ex": ["صح: <span class=\"en\">Archimago<\/span> خدعه بحلم كاذب.", "غلط.", "غلط."], "i": 32}, {"t": "mc", "h": "", "q": "مين <span class=\"en\">Duessa<\/span>؟", "nq": 1, "opts": ["ست مضللة، ظاهرها جميل وحقيقتها قبيحة", "أم <span class=\"en\">Una<\/span>", "الملكة"], "ans": 0, "why": "ست مضللة، ظاهرها جميل وحقيقتها قبيحة", "ex": ["صح.", "غلط.", "غلط."], "i": 33}, {"t": "section", "h": "النقطة 5: اليأس، بيت القداسة، والتنين، والاسم", "i": 34}, {"t": "learn", "h": "<div class=\"u\">بعد الأسر، بييجي مشهد <span class=\"en\">Despair<\/span>: راجل في كهف بيحاول يقنع الفارس إن حياته مالهاش معنى وإن الموت أرحم. الفارس تقريباً بيستسلم، و<span class=\"en\">Una<\/span> هي اللي بتوقفه. ده واحد من أقوى المشاهد في الكتاب.<\/div>", "n": 1, "a": "history-17-020", "x": "0e635ca2", "en": "After the captivity comes the scene of Despair: a man in a cave who tries to convince the knight that his life has no meaning and that death is easier. The knight almost gives up, and Una is the one who stops him. This is one of the strongest scenes in the book.", "i": 35}, {"t": "learn", "h": "<div class=\"u\">بعدها بياخدوه لبيت اسمه <span class=\"en\">House of Holiness<\/span>، صاحبته <span class=\"en\">Caelia<\/span> وبناتها. هناك بيتعلم ويتطهّر ويتعالج.<\/div><div class=\"u\">وبيشوف رؤية لأورشليم الجديدة. وبيتقال له اسمه: \"<span class=\"en\">Saint George of mery England, the signe of victoree<\/span>\".<\/div><div class=\"u\">يعني: القديس <span class=\"en\">George<\/span>، قديس إنجلترا المرحة، علامة النصر.<\/div>", "n": 3, "a": "history-17-021", "x": "a22c9a69", "en": "After that they take him to a house called the House of Holiness, whose lady is Caelia and her daughters. There he learns, is purified and healed. He sees a vision of the New Jerusalem. And he is told his name: Saint George of mery England, the signe of victoree. It means: Saint George, saint of merry England, sign of victory.", "i": 36}, {"t": "learn", "h": "<div class=\"u\">والتنين: بيرجع الفارس مع <span class=\"en\">Una<\/span> لأرض أهلها، اللي التنين بيدمّرها. والقتال بيمتد تلات أيام: في أول يومين الفارس بيتعب ويتجرح، وبيرجع يتعافى بعون الأمان، وفي اليوم التالت بيقتل التنين.<\/div><div class=\"u\">والنص بيقول إن التنين وقع: \"<span class=\"en\">So downe he fell, and like an heaped mountaine lay<\/span>\".<\/div>", "n": 2, "a": "history-17-022", "x": "71534acb", "en": "The dragon: the knight returns with Una to her parents' land, which the dragon is destroying. The fight lasts three days: in the first two days the knight is tired and wounded, and recovers with help, and on the third day he kills the dragon. The text says the dragon fell: So downe he fell, and like an heaped mountaine lay.", "i": 37}, {"t": "learn", "h": "<div class=\"u\">المفارقة الحلوة: الفارس اللي كان عديم الخبرة في الأول بقى قديس في الآخر. والرحلة كانت كلها تعليم.<\/div><div class=\"u\">والكتاب مش بيقول \"كن شجاع\" بس. بيقول: الشجاعة لوحدها مش كفاية، محتاجة معرفة وتواضع وتوبة.<\/div>", "n": 2, "a": "history-17-023", "x": "97ed9040", "en": "The nice irony: the knight who was inexperienced at the beginning becomes a saint at the end. The whole journey was education. The book does not only say be brave. It says: courage alone is not enough, it needs knowledge, humility and repentance.", "i": 38}, {"t": "mc", "h": "", "q": "إيه اللي بيحصل في بيت القداسة؟", "nq": 1, "opts": ["الفارس بيتعلم ويتطهّر ويتعالج", "بيقتل التنين", "بيتجوز"], "ans": 0, "why": "الفارس بيتعلم ويتطهّر ويتعالج", "ex": ["صح.", "غلط: التنين بعدها.", "غلط."], "i": 39}, {"t": "mc", "h": "", "q": "إيه الاسم اللي بيتقال للفارس في الرؤية؟", "nq": 1, "opts": ["<span class=\"en\">Saint George<\/span>", "<span class=\"en\">Arthur<\/span>", "<span class=\"en\">Gloriana<\/span>"], "ans": 0, "why": "<span class=\"en\">Saint George<\/span>", "ex": ["صح: قديس إنجلترا.", "غلط.", "غلط."], "i": 40}, {"t": "section", "h": "النقطة 6: إزاي تشتغل الرمزية؟", "i": 41}, {"t": "learn", "h": "<div class=\"u\">الكتاب بيتقري على أكتر من مستوى في نفس الوقت. ده تصميم مش عيب.<\/div><div class=\"u\">الطبقة الأخلاقية: <span class=\"en\">Redcrosse<\/span> هو القداسة، و<span class=\"en\">Errour<\/span> الضلال، و<span class=\"en\">Orgoglio<\/span> الكبرياء، و<span class=\"en\">Despair<\/span> اليأس. وكل واحد فينا بيمر بالرحلة دي: يغلط ويكبر ويكتشف نفسه.<\/div>", "n": 2, "a": "history-17-024", "x": "62a767be", "en": "The book is read on more than one level at the same time. This is a design, not a fault. The moral layer: Redcrosse is holiness, Errour is error, Orgoglio is pride, Despair is despair. And each of us goes through this journey: makes mistakes, grows and discovers himself.", "i": 42}, {"t": "learn", "h": "<div class=\"u\">الطبقة الكنسية والتاريخية: <span class=\"en\">Una<\/span> هي الحق والكنيسة الحقيقية في نظر <span class=\"en\">Spenser<\/span> البروتستانتي. و<span class=\"en\">Duessa<\/span> هي الكنيسة الكاثوليكية والتضليل. والوحش اللي بتركبه بروس كتيرة بيفكّر بوحش سفر الرؤيا.<\/div><div class=\"u\">وأهل <span class=\"en\">Una<\/span>، الملك والملكة العجوزين، بيتقروا كآدم وحواء أو كالبشرية كلها.<\/div>", "n": 2, "a": "history-17-025", "x": "3cb09107", "en": "The church and history layer: Una is truth and the true church in the eyes of the Protestant Spenser. Duessa is the Catholic Church and deception. The beast she rides, with many heads, recalls the beast of the Book of Revelation. And Una's parents, the old king and queen, are read as Adam and Eve, or humanity as a whole.", "i": 43}, {"t": "learn", "h": "<div class=\"u\">الطبقة السياسية والشخصية: <span class=\"en\">Gloriana<\/span> هي <span class=\"en\">Elizabeth<\/span>. وبعض القراء شافوا في <span class=\"en\">Duessa<\/span> ماري ستيوارت، وفي <span class=\"en\">Arthur<\/span> إشارة لـ <span class=\"en\">Leicester<\/span>، وإشارات لسياسة إنجلترا في أيرلندا وفرنسا. وده تفسير بعض القراء مش حاجة الشاعر قالها كلها.<\/div><div class=\"u\">يعني نفس المشهد ممكن يكون: صراع نفسي ومعركة دينية وسياسة دولية في نفس الوقت.<\/div>", "n": 2, "a": "history-17-026", "x": "748db033", "en": "The political and personal layer: Gloriana is Elizabeth. Some readers saw in Duessa Mary Stuart, and in Arthur a hint of Leicester, and hints of England's policy in Ireland and France. This is the interpretation of some readers, not something the poet said in full. So the same scene can be: a psychological struggle, a religious battle and international politics, at the same time.", "i": 44}, {"t": "learn", "h": "<div class=\"u\">مثال من حياتنا: حلم شفت فيه باب مقفول. الباب في الحلم هو خوفك من حاجة، وفي نفس الوقت ذكرى بيت جدتك، وفي نفس الوقت حد في العيلة مش بيكلمك. صورة واحدة ومعاني كتير، وكلها شغالة مع بعض. الرمزية كده.<\/div>", "n": 1, "a": "history-17-027", "x": "371f1986", "en": "An example from our life: a dream in which you saw a locked door. The door in the dream is your fear of something, and at the same time the memory of your grandmother's house, and at the same time someone in the family who does not talk to you. One picture, many meanings, all working together. This is allegory.", "i": 45}, {"t": "mc", "h": "", "q": "إيه معنى إن الكتاب <span class=\"en\">allegory<\/span> على طبقات؟", "nq": 1, "opts": ["نفس المشهد له معاني أخلاقية وكنسية وسياسية في نفس الوقت", "القصة بتتكرر", "الكتاب مترجم"], "ans": 0, "why": "نفس المشهد له معاني أخلاقية وكنسية وسياسية في نفس الوقت", "ex": ["صح.", "غلط.", "غلط."], "i": 46}, {"t": "tf", "h": "", "q": "كل تفسيرات الرموز في الكتاب قالها <span class=\"en\">Spenser<\/span> نفسه صراحة.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: كتير منها تفسير القراء، وفيه حاجات بتخالف رسالته.", "صح: كتير منها اجتهاد قراء."], "i": 47}, {"t": "section", "h": "النقطة 7: خطر الرمزية", "i": 48}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Spenser<\/span> نفسه حذّر إن الرمزية ممكن تتفسر بطرق مختلفة، وكتب رسالته عشان يقلل التفسيرات الغلط.<\/div><div class=\"u\">بس لما الكتاب يبقى رمز، كل قارئ بيشوفه من زاويته. ناس شافت <span class=\"en\">Una<\/span> هي الكنيسة، وناس شافت فيها إليزابيث، وناس شافت الحقيقة المجردة. وفيه حاجات في الكتاب بتخالف الرسالة، زي دور <span class=\"en\">Arthur<\/span> اللي المفروض بطل كل الكتب لكنه بيظهر ويختفي.<\/div>", "n": 2, "a": "history-17-028", "x": "818d6898", "en": "Spenser himself warned that allegory can be interpreted in different ways, and wrote his letter to reduce wrong readings. But when a book is a symbol, each reader sees it from his own angle. Some saw Una as the church, some saw Elizabeth in her, some saw abstract truth. And some things in the book go against the letter, like the role of Arthur, who should be hero of all the books but appears and disappears.", "i": 49}, {"t": "learn", "h": "<div class=\"u\">الدرس النقدي: كلام الشاعر عن نفسه مهم، لكنه مش قانون. النص بيتكلم أكتر من صاحبه.<\/div><div class=\"u\">وده درس لطالب الأدب: متصدّقش المؤلف على طول، ولا تكدبه على طول. قارن.<\/div>", "n": 2, "a": "history-17-029", "x": "eefb1eb0", "en": "The critical lesson: what the poet says about himself is important, but it is not law. The text speaks more than its author. And this is a lesson for a literature student: do not believe the author at once, and do not reject him at once. Compare.", "i": 50}, {"t": "mc", "h": "", "q": "ليه كلام الشاعر عن نصه مش قانون للقراءة؟", "nq": 1, "opts": ["لأن النص ممكن يقول أكتر أو يخالف كلام صاحبه", "لأن الشاعر بيكدب دايماً", "لأن الرسالة ضاعت"], "ans": 0, "why": "لأن النص ممكن يقول أكتر أو يخالف كلام صاحبه", "ex": ["صح.", "غلط: مش دايماً.", "غلط: الرسالة موجودة."], "i": 51}, {"t": "section", "h": "النقطة 8: أثر الكتاب على الشعر الإنجليزي", "i": 52}, {"t": "learn", "h": "<div class=\"u\">أولاً الشكل: الـ <span class=\"en\">Spenserian stanza<\/span> بقى شكل قائم بذاته، واستخدمه شعرا بعد قرنين: <span class=\"en\">Burns<\/span> في <span class=\"en\">The Cotter's Saturday Night<\/span>، و<span class=\"en\">Keats<\/span> في <span class=\"en\">The Eve of St. Agnes<\/span>، و<span class=\"en\">Shelley<\/span> في <span class=\"en\">Adonais<\/span>، و<span class=\"en\">Byron<\/span> في <span class=\"en\">Childe Harold's Pilgrimage<\/span>. و<span class=\"en\">Tennyson<\/span> في <span class=\"en\">The Lotos-Eaters<\/span> استخدم شكل قريب منه.<\/div>", "n": 1, "a": "history-17-030", "x": "969817ab", "en": "First, the form: the Spenserian stanza became a form on its own, and poets used it two centuries later: Burns in The Cotter's Saturday Night, Keats in The Eve of St. Agnes, Shelley in Adonais, and Byron in Childe Harold's Pilgrimage. Tennyson in The Lotos-Eaters used a form close to it.", "i": 53}, {"t": "learn", "h": "<div class=\"u\">ثانياً فكرة الملحمة الوطنية: <span class=\"en\">Spenser<\/span> حاول يعمل لإنجلترا اللي عمله <span class=\"en\">Virgil<\/span> لروما: ملحمة بتقول إن البلد دي ليها رسالة. و<span class=\"en\">Milton<\/span> بعده في <span class=\"en\">Paradise Lost<\/span> اتأثر بالفكرة الكبيرة، حتى لو قلب الموضوع.<\/div><div class=\"u\">ثالثاً الرمزية كأسلوب: بعده بقى مألوف في الشعر الإنجليزي إنك تحكي حكاية ومعناها حاجة تانية.<\/div>", "n": 2, "a": "history-17-031", "x": "0d2f7374", "en": "Second, the idea of a national epic: Spenser tried to do for England what Virgil did for Rome: an epic saying that this country has a mission. And Milton after him, in Paradise Lost, was influenced by the large idea, even if he changed the subject. Third, allegory as a style: after him it became familiar in English poetry to tell a story whose meaning is something else.", "i": 54}, {"t": "learn", "h": "<div class=\"u\">رابعاً الفلوس والرعاية: الكتاب كان محاولة واضحة إن الشاعر يعيش من الشعر: معاش وراعي وجمهور. ونجح جزئياً: خد المعاش وما خدش منصب. وده بيفتح سؤال لسه موجود: الشاعر بيكتب للفن ولا للسلطة؟<\/div>", "n": 1, "a": "history-17-032", "x": "54376d9c", "en": "Fourth, money and patronage: the book was a clear attempt for a poet to live from poetry: a pension, a patron and an audience. It partly succeeded: he got the pension but not a post. And this opens a question that still exists: does the poet write for art or for power?", "i": 55}, {"t": "mc", "h": "", "q": "مين استخدم الـ <span class=\"en\">Spenserian stanza<\/span> بعد <span class=\"en\">Spenser<\/span> بقرنين؟", "nq": 1, "opts": ["<span class=\"en\">Keats<\/span> و<span class=\"en\">Shelley<\/span> و<span class=\"en\">Byron<\/span>", "<span class=\"en\">Chaucer<\/span>", "<span class=\"en\">Wyatt<\/span>"], "ans": 0, "why": "<span class=\"en\">Keats<\/span> و<span class=\"en\">Shelley<\/span> و<span class=\"en\">Byron<\/span>", "ex": ["صح.", "غلط: <span class=\"en\">Chaucer<\/span> قبله.", "غلط: <span class=\"en\">Wyatt<\/span> قبله."], "i": 56}, {"t": "section", "h": "النقطة 9: تقراه إزاي النهاردة؟", "i": 57}, {"t": "learn", "h": "<div class=\"u\">المشكلة: 35 ألف سطر، ولغة قديمة، ورمزية كنسية كتير منها مش مفهوم للقارئ العادي.<\/div><div class=\"u\">الطريقة العملية: ابدأ بالكتاب الأول والمقاطع المشهورة: <span class=\"en\">Errour<\/span> و<span class=\"en\">Duessa<\/span> وبيت القداسة والتنين. واقرا معاها الرسالة لـ <span class=\"en\">Raleigh<\/span> لأنها الخريطة. وركّز على الصور مش على الأسماء: الوحش اللي بيلف، والست اللي بتخدع، والراجل اللي بييأس.<\/div>", "n": 2, "a": "history-17-033", "x": "fada0a0f", "en": "The problem: 35 thousand lines, old language, and church symbolism much of which is not clear to an ordinary reader. The practical way: start with Book One and the famous passages: Errour, Duessa, the House of Holiness and the dragon. And read with it the letter to Raleigh because it is the map. Focus on the pictures, not on the names: the monster that wraps, the lady who deceives, the man who despairs.", "i": 58}, {"t": "learn", "h": "<div class=\"u\">والتناقض اللي لازم تقفه عنده: <span class=\"en\">Spenser<\/span> هو نفسه اللي كتب <span class=\"en\">A View of the Present State of Ireland<\/span>، وفيه دعوة لإجراءات قاسية ضد الأيرلنديين وعاداتهم. يعني الراجل اللي كتب أجمل قصيدة عن الفضيلة كتب كمان كلام قاسي عن بلد تاني. ده تناقض في العصر: النهضة والإنسانية والاستعمار في نفس الرأس.<\/div><div class=\"u\">ودي طريقة ناضجة في القراءة: تحب العمل، وتشوف صاحبه كويس.<\/div>", "n": 2, "a": "history-17-034", "x": "a3c2e13e", "en": "And the contradiction you must stop at: Spenser is the same man who wrote A View of the Present State of Ireland, which calls for harsh measures against the Irish and their customs. So the man who wrote one of the finest poems on virtue also wrote harsh words about another country. This is a contradiction of the age: Renaissance, humanism and colonialism in the same head. And it is a mature way of reading: love the work, and see its author clearly.", "i": 59}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين <span class=\"en\">The Shepheardes Calender<\/span> و<span class=\"en\">The Faerie Queene<\/span> من حيث النوع، والشكل الشعري، والهدف، وإزاي كل واحد بيخدم مشروع <span class=\"en\">Spenser<\/span> كشاعر.", "a": "<span class=\"en\">The Shepheardes Calender<\/span> (1579): قصايد رعوية، 12 قصيدة بعدد شهور السنة، كل واحدة بشكل شعري مختلف، ومعاها <span class=\"en\">E.K<\/span>. والشروح والصور. هدفه إعلان شاعر جديد: <span class=\"en\">Spenser<\/span> قدّم نفسه كوريث <span class=\"en\">Chaucer<\/span> باسم مستعار (<span class=\"en\">Immerito<\/span>)، واستخدم قناع الرعاة عشان يقول كلام ديني وسياسي بحذر.\n<span class=\"en\">The Faerie Queene<\/span> (1590 و1596): ملحمة رمزية طويلة، مخططة في 12 كتاب (طلع منها 6)، بشكل ثابت واحد هو الـ <span class=\"en\">Spenserian stanza<\/span> من 9 سطور. هدفها المعلن في رسالة <span class=\"en\">Raleigh<\/span> إنها تصنع راجل نبيل في الفضيلة، ومعاها مدح للملكة في صورة <span class=\"en\">Gloriana<\/span>.\nالتشابه: الاتنين رمزي، والاتنين فيهم مدح للملكة وتلميح سياسي وديني، واللغة القديمة.\nالفرق: الأول تنوع وإعلان وتجريب للأشكال، والتاني مشروع كبير بشكل ثابت.\nالخلاصة: <span class=\"en\">Calender<\/span> هو الإعلان، و<span class=\"en\">Faerie Queene<\/span> هو الوعد اللي اتنفذ.", "key": "history-17:W34", "n": 1, "i": 60}, {"t": "end", "h": "", "teaser": "الدرس الجاي: سونيتات الإليزابيثيين، بعد ما <span class=\"en\">Spenser<\/span> فتح الباب: <span class=\"en\">Daniel<\/span> و<span class=\"en\">Drayton<\/span>، وبعدهم كلهم شكسبير.", "extra": "", "i": 61}];</script>
