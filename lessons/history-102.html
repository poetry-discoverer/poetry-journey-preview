<script>window.LESSON_ID="history-102";window.STEPS=[{"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🏰<\/span><\/span> القرن ١٦ (عصر النهضة والعصر الإليزابيثي):<\/div><div class=\"u\">السمات: إعادة اكتشاف التراث اليوناني والروماني، الشعر مربوط بالموسيقى وبلاط الملكة إليزابيث، ثقافة الغزل البلاطي، والإنجليزية بتثبت نفسها كلغة أدب بعد ما كانت لغة تانية جنب اللاتيني والفرنسي.<\/div>", "n": 1, "i": 0, "a": "history-102-001", "x": "106c5e6b"}, {"t": "learn", "h": "<div class=\"u\">أهم حدث: حوالي ١٥٣٠-١٥٥٠ <span class=\"en\">Thomas Wyatt<\/span> والكونت <span class=\"en\">Surrey<\/span> نقلوا السونيت من الإيطالي (بترارك) للإنجليزي، و<span class=\"en\">Surrey<\/span> اخترع الـ <span class=\"en\">blank verse<\/span> (شعر موزون بلا قافية) اللي هيبقى أهم مقياس في اللغة.<\/div>", "n": 1, "i": 1, "a": "history-102-002", "x": "e426024d"}, {"t": "learn", "h": "<div class=\"u\">النجوم: <span class=\"en\">Philip Sidney<\/span> صاحب <span class=\"en\">Astrophel and Stella<\/span> (١٥٩١، أول سلسلة سونيت إنجليزية كبيرة)، و<span class=\"en\">Edmund Spenser<\/span> صاحب ملحمة <span class=\"en\">The Faerie Queene<\/span> ومخترع البيت السبينسري، وشكسبير بـ ١٥٤ سونيت ومسرح كله شعر.<\/div>", "n": 1, "i": 2, "a": "history-102-003", "x": "d8dca3c8"}, {"t": "learn", "h": "<div class=\"lead\">مثال، افتتاحية <span class=\"en\">Sonnet 18<\/span> لشكسبير:<\/div><div class=\"u\">\"<span class=\"en\">Shall I compare thee to a summer's day?<\/span>\"<\/div><div class=\"u\">\"أقارنك بيوم من أيام الصيف؟\"<\/div><div class=\"u\">(عدّ المقاطع: عشرة، <span class=\"en\">iambic pentameter<\/span> زي ما خدنا).<\/div>", "n": 3, "i": 3, "a": "history-102-004", "x": "da2194b4"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">⚔️<\/span><\/span> القرن ١٧ (قرن بثلاث وشوش):<\/div><div class=\"u\">١. الميتافيزيقيون <span class=\"en\">Metaphysical poets<\/span>: <span class=\"en\">John Donne<\/span> و<span class=\"en\">George Herbert<\/span> و<span class=\"en\">Andrew Marvell.<\/span> شعر زكي وعقلاني، بضاعتهم الـ <span class=\"en\">conceit<\/span>: تشبيه بعيد ومفاجئ بيمتد في القصيدة كلها (<span class=\"en\">Donne<\/span> قارن العاشقين برجلين البرجل!). بيتكلموا عن الحب والموت والإيمان بعقل المحامي. (الاسم اتلزق فيهم بعدين على لسان الناقد <span class=\"en\">Samuel Johnson<\/span>).<\/div>", "n": 1, "i": 4, "a": "history-102-005", "x": "1dc70fef"}, {"t": "learn", "h": "<div class=\"lead\">مثال، <span class=\"en\">Donne<\/span> بيتحدى الموت في <span class=\"en\">Holy Sonnet 10<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">Death,<\/span> <span class=\"en\">be not proud<\/span>\"<\/div><div class=\"u\">\"يا موت، ما تتكبرش\"<\/div><div class=\"u\">٢. الـ <span class=\"en\">Cavalier poets<\/span> (<span class=\"en\">Herrick<\/span> ورفاقه): شعر خفيف، فكرته <span class=\"en\">carpe diem<\/span> يعني اقطف يومك.<\/div>", "n": 3, "i": 5, "a": "history-102-006", "x": "2a2508c3"}, {"t": "learn", "h": "<div class=\"lead\">مثال <span class=\"en\">Herrick<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">Gather ye rose-buds while ye may<\/span>\"<\/div><div class=\"u\">\"اقطف ورودك ما دمت تقدر\"<\/div><div class=\"u\">٣. <span class=\"en\">John Milton<\/span>: <span class=\"en\">Paradise Lost<\/span> (١٦٦٧) أعظم ملحمة إنجليزية: قصة آدم وإبليس في ١٢ كتاب (<span class=\"en\">book<\/span>) في طبعة ١٦٧٤، وكانت ١٠ كتب في طبعة ١٦٦٧، ببلانك فيرس، شكل يوناني كلاسيكي ومضمون ديني.<\/div>", "n": 3, "i": 6, "a": "history-102-007", "x": "73843666"}, {"t": "learn", "h": "<div class=\"lead\">مثال، الشيطان بيقول:<\/div><div class=\"u\">\"<span class=\"en\">Better to reign in Hell,<\/span> <span class=\"en\">than serve in Heav'n<\/span>\"<\/div><div class=\"u\">\"الملك في جهنم ولا الخدمة في الجنة\"<\/div><div class=\"u\">وفي آخر القرن <span class=\"en\">John Dryden<\/span> بيجهز الطريق للقرن ١٨: هجاء لاذع وسطور مقفّاة متزنة.<\/div>", "n": 3, "i": 7, "a": "history-102-008", "x": "59d3548b"}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 8}];</script>
