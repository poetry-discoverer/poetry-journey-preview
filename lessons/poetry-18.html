<h1>الدرس ١٨: irony — السخرية والمفارقة <span class="em">🙃</span></h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس 18 من 19</span><span class="tag"><span class="em">📖</span> كورس الشعر</span></div>

<script>window.LESSON_ID="poetry-18";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة أداة ذكية: لما اللي بيتقال أو بيحصل عكس اللي متوقع. زي لما تقول \"يا سلام على الجو الحلو!\" وإنتوا واقفين في الشمس الحارقة <span class=\"em\"><span class=\"em\">😄<\/span><\/span>. نتعلم نكتشفها في الشعر، وإزاي نحللها.<\/div>", "n": 1, "i": 0, "a": "poetry-18-001", "x": "55bbde58"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: النقطة الأولى — إيه هو الـ <span class=\"en\">irony<\/span>؟ <span class=\"em\"><span class=\"em\">🤔<\/span><\/span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١) التعريف<\/div><div class=\"u\">١.١ الـ <span class=\"en\">irony<\/span> (مفارقة / سخرية) = فرق بين الظاهر وبين الحقيقة أو المتوقع. (<span class=\"en\">Wikipedia<\/span>: \"مقابلة بين ما يبدو أنه الحال وما هو فعلاً أو متوقع أن يكون\").<\/div><div class=\"u\">١.٢ تعريف تاني بسيط: \"التعبير عن المعنى بلغة معناها المعتاد عكسه، غالباً للفكاهة أو للتأكيد\".<\/div><div class=\"u\">٢) أصل الكلمة<\/div>", "n": 4, "i": 2, "a": "poetry-18-002", "x": "f1ae1263"}, {"t": "learn", "h": "<div class=\"u\">٢.١ الكلمة جاية من اليونانية. (شخصيات الـ <span class=\"en\">eiron<\/span> \"الماكر\" زي سقراط عند أفلاطون ذكرها <span class=\"en\">Wikipedia<\/span> كمثال على الشخصية المرتبطة بالمفارقة.)<\/div><div class=\"u\">٣) ليه المفارقة بتحتاج جمهور مزدوج؟<\/div><div class=\"u\">٣.١ في ناس بتفهم المعنى الحقيقي، وناس لأ. (كلام <span class=\"en\">Fowler<\/span> في <span class=\"en\">The King's English<\/span> سنة ١٩٠٦ عن تعريف المفارقة، وبعده أُشير لفكرة \"الجمهور المزدوج\" في <span class=\"en\">Wikipedia.<\/span>)<\/div>", "n": 3, "i": 3, "a": "poetry-18-003", "x": "996a333b"}, {"t": "learn", "h": "<div class=\"u\">٣.٢ عشان كده المفارقة بتقرّب اللي فاهمين وبتبعّد اللي مش فاهمين. (قراءة)<\/div>", "n": 1, "i": 4, "a": "poetry-18-004", "x": "b4a82120"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: النقطة التانية — أنواع الـ <span class=\"en\">irony<\/span> الأساسية <span class=\"em\"><span class=\"em\">🧩<\/span><\/span>", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">١) <span class=\"em\"><span class=\"em\">🗣️<\/span><\/span> <span class=\"en\">Verbal irony<\/span> (مفارقة لفظية)<\/div><div class=\"u\">١.١ المتكلم عن قصد بيقول عكس معناه الحقيقي.<\/div><div class=\"u\">١.٢ مثال من <span class=\"en\">Wikipedia<\/span>: <span class=\"en\">Samuel Johnson<\/span> قال \"<span class=\"en\">Bolingbroke was a holy man<\/span>\" (وهو كان بعيد عن القداسة).<\/div><div class=\"u\">١.٣ مثال من حياتك: \"برافو عليك\" لما واحد يوقع الكوباية. <span class=\"em\"><span class=\"em\">😄<\/span><\/span><\/div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">🎭<\/span><\/span> <span class=\"en\">Dramatic irony<\/span> (مفارقة درامية)<\/div>", "n": 5, "i": 6, "a": "poetry-18-005", "x": "2c038d82"}, {"t": "learn", "h": "<div class=\"u\">٢.١ الجمهور بيعرف حاجة الشخصيات مش عارفاها. فبنشوف كلامهم وأفعالهم \"غلط\" وهم مش واخدين بالهم.<\/div><div class=\"u\">٢.٢ بتتكون من ٣ مراحل: تمهيد، شد، حل.<\/div><div class=\"u\">٢.٣ مثال من تأليفي: في فيلم، المشاهد عارف إن الحرامي مستخبي ورا الباب والبطل داخل الأوضة بابتسامة.<\/div><div class=\"u\">٣) <span class=\"em\"><span class=\"em\">🎲<\/span><\/span> <span class=\"en\">Situational irony<\/span> (مفارقة الموقف)<\/div><div class=\"u\">٣.١ النتيجة عكس المتوقع تماماً، وبشكل مفاجئ (مش مجرد وحش حظ).<\/div>", "n": 5, "i": 7, "a": "poetry-18-006", "x": "7cd53a13"}, {"t": "learn", "h": "<div class=\"u\">٣.٢ مثال من <span class=\"en\">Wikipedia<\/span>: في <span class=\"en\">The Wizard of Oz<\/span>، الأبطال رايحين للساحر عشان يديهم اللي ناقصهم. الساحر طلع رجل عادي، وهم كانوا معاهم اللي بيدوروا عليه من الأول.<\/div><div class=\"u\">٣.٣ مثال تاني (من عندي): جملة \"<span class=\"en\">nothing is written in stone<\/span>\" (مفيش حاجة مكتوبة في الحجر) لو اتنقشت فعلاً على حجر!<\/div><div class=\"u\">٤) <span class=\"em\"><span class=\"em\">🌌<\/span><\/span> <span class=\"en\">Cosmic irony<\/span> (مفارقة القدر)<\/div>", "n": 3, "i": 8, "a": "poetry-18-007", "x": "9d452914"}, {"t": "learn", "h": "<div class=\"u\">٤.١ الشخصيات بتتحبط دايماً من قوى أكبر منها. مرتبطة بأعمال <span class=\"en\">Thomas Hardy.<\/span> (المصدر: <span class=\"en\">Wikipedia - Irony<\/span>)<\/div>", "n": 1, "i": 9, "a": "poetry-18-008", "x": "495539ec"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: النقطة التالتة — المفارقة في قصايد معانا <span class=\"em\"><span class=\"em\">📜<\/span><\/span>", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">١) <span class=\"en\">Shakespeare<\/span>، <span class=\"en\">Sonnet 130<\/span><\/div><div class=\"u\">\"<span class=\"en\">My mistress' eyes are nothing like the sun<\/span>; / <span class=\"en\">Coral is far more red than her lips' red<\/span>;\"<\/div><div class=\"u\">١.١ معظم الشعراء في زمنه بيشبهوا حبيباتهم بالشمس والمرجان والورد (تشبيهات مبالغ فيها).<\/div><div class=\"u\">١.٢ هو بيعمل العكس ظاهرياً: \"عينيها مش زي الشمس\"! بس في الآخر بيقول: \"أنا شايف حبيبتي نادرة زي أي واحدة اتوصفت بتشبيهات كاذبة\".<\/div>", "n": 4, "i": 11, "a": "poetry-18-009", "x": "b4151edd"}, {"t": "learn", "h": "<div class=\"u\">١.٣ (المصدر: <span class=\"en\">Wikipedia - Sonnet 130<\/span>: القصيدة بتسخر من مبالغات الشعراء وتمدح الحبيبة بصدق.)<\/div><div class=\"u\">١.٤ المفارقة: بيمدحها بالعكس: بيقول عيوبها عشان يثبت إنه بيحبها بجد.<\/div><div class=\"u\">٢) <span class=\"en\">Shelley<\/span>، <span class=\"en\">Ozymandias<\/span> (١٨١٨)<\/div>", "n": 3, "i": 12, "a": "poetry-18-010", "x": "18f1767c"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">And on the pedestal these words appear<\/span>: / '<span class=\"en\">My name is Ozymandias,<\/span> <span class=\"en\">king of kings<\/span>: / <span class=\"en\">Look on my works,<\/span> <span class=\"en\">ye Mighty,<\/span> <span class=\"en\">and despair<\/span>!' / <span class=\"en\">Nothing beside remains.<\/span> <span class=\"en\">Round the decay<\/span> / <span class=\"en\">Of that colossal wreck,<\/span> <span class=\"en\">boundless and bare<\/span> / <span class=\"en\">The lone and level sands stretch far away.<\/span>\"<\/div><div class=\"u\">٢.١ الملك كتب على التمثال: \"بصوا على أعمالي يا أقوياء وانهاروا من اليأس!\" يعني بيتباهى.<\/div>", "n": 2, "i": 13, "a": "poetry-18-011", "x": "ec883dd1"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ بس \"<span class=\"en\">Nothing beside remains<\/span>\": مفيش حاجة فاضلة غير رمال. التمثال مكسور.<\/div><div class=\"u\">٢.٣ دي مفارقة موقف: الملك اللي كان عايز يخوّف الكل بعظمته، النهاردة عظمته ضايعة. (قراءة: القصيدة عن \"أضرار الزمن على إرث العظماء\" حسب <span class=\"en\">Wikipedia.<\/span>)<\/div><div class=\"u\">٢.٤ كمان فيه مفارقة: الكلمات \"<span class=\"en\">Look on my works<\/span>\" بقت دعوة للنظر لخرابه.<\/div>", "n": 3, "i": 14, "a": "poetry-18-012", "x": "a3c34b24"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: النقطة الرابعة — إزاي أكتشف وأحلل المفارقة؟ <span class=\"em\"><span class=\"em\">🔍<\/span><\/span>", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">١) علامات تنبيه<\/div><div class=\"u\">١.١ كلام فيه مبالغة أو مدح في موقف سيء (أو العكس).<\/div><div class=\"u\">١.٢ فرق بين اللي الشخصية فاكراه واللي القارئ عارفه.<\/div><div class=\"u\">١.٣ نتيجة عكس المتوقع.<\/div><div class=\"u\">٢) خطوات التحليل (٥ أسئلة)<\/div><div class=\"u\">٢.١ إيه المعنى الظاهر (السطح)؟<\/div><div class=\"u\">٢.٢ إيه المعنى الحقيقي أو المتوقع؟<\/div><div class=\"u\">٢.٣ إيه النوع (لفظية، درامية، موقف، قدر)؟<\/div><div class=\"u\">٢.٤ مين اللي فاهم ومين لأ؟<\/div><div class=\"u\">٢.٥ إيه الإحساس: سخرية، حزن، فكاهة، تحذير؟<\/div><div class=\"u\">٣) تحذير <span class=\"em\"><span class=\"em\">⚠️<\/span><\/span><\/div>", "n": 11, "i": 16, "a": "poetry-18-013", "x": "fec1f54e"}, {"t": "learn", "h": "<div class=\"u\">٣.١ الكلمة \"<span class=\"en\">irony<\/span>\" بتتلخبط في الكلام اليومي مع \"المصادفة\" أو \"حظ وحش\". مش كل مصادفة <span class=\"en\">irony.<\/span> <span class=\"en\">Wikipedia<\/span> بتقول إن <span class=\"en\">situational irony<\/span> لازم تكون عكس المتوقع بشكل صارخ، مش مجرد حظ وحش. وفيه خلاف حتى بين الباحثين على تعريف دقيق للكلمة.<\/div>", "n": 1, "i": 17, "a": "poetry-18-014", "x": "5205c2fe"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅<\/span><\/span>", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">١) الملخص<\/div><div class=\"u\">١.١ <span class=\"en\">irony<\/span> = فرق بين الظاهر والحقيقة أو المتوقع.<\/div><div class=\"u\">١.٢ الأنواع: لفظية، درامية، موقف، قدر.<\/div><div class=\"u\">١.٣ أمثلة: <span class=\"en\">Bolingbroke was a holy man<\/span>، <span class=\"en\">Wizard of Oz<\/span>، <span class=\"en\">Sonnet 130<\/span>، <span class=\"en\">Ozymandias.<\/span><\/div><div class=\"u\">١.٤ خطوات: السطح، الحقيقة، النوع، مين فاهم، الإحساس.<\/div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">✏️<\/span><\/span> تمرين<\/div>", "n": 6, "i": 19, "a": "poetry-18-015", "x": "55c84c54"}, {"t": "learn", "h": "<div class=\"u\">٢.١ حدد نوع المفارقة في: \"برافو\" لما واحد يوقع الكوباية؛ والمشاهد اللي عارف إن في فيلم الحرامي ورا الباب؛ وجملة \"<span class=\"en\">nothing is written in stone<\/span>\" المنقوشة على حجر.<\/div><div class=\"u\">٢.٢ حلل <span class=\"en\">Ozymandias<\/span> بالخمس خطوات.<\/div><div class=\"u\">٢.٣ اكتب مثال لكل نوع (لفظية، درامية، موقف) من تأليفك.<\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح. <span class=\"em\"><span class=\"em\">✍️<\/span><\/span><\/div>", "n": 4, "i": 20, "a": "poetry-18-016", "x": "88a86e14"}, {"t": "recall", "h": "", "q": "يعني إيه <span class=\"en\">verbal irony<\/span>؟ اديني مثال.", "a": "المتكلم بيقول عن قصد عكس معناه. مثال: <span class=\"en\">Samuel Johnson<\/span>: \"<span class=\"en\">Bolingbroke was a holy man<\/span>\" (وهو كان بعيد عن القداسة).", "n": 1, "i": 21}, {"t": "recall", "h": "", "q": "إيه الفرق بين <span class=\"en\">verbal irony<\/span> و <span class=\"en\">dramatic irony<\/span>؟", "a": "<span class=\"en\">verbal<\/span>: المتكلم نفسه بيقصد عكس كلامه. <span class=\"en\">dramatic<\/span>: الجمهور بيعرف حاجة الشخصيات مش عارفاها.", "n": 1, "i": 22}, {"t": "recall", "h": "", "q": "ليه <span class=\"en\">Ozymandias<\/span> فيها <span class=\"en\">situational irony<\/span>؟", "a": "الملك كتب على التمثال إنه عظيم، ومفيش دلوقتي غير رمال وتمثال مكسور: النتيجة عكس اللي كان يتمناه.", "n": 1, "i": 23}, {"t": "tf", "h": "", "q": "صح ولا غلط: أي حظ وحش يبقى <span class=\"en\">irony.<\/span>", "ans": false, "why": "غلط. لازم تكون النتيجة عكس المتوقع بشكل واضح، مش مجرد حظ وحش.", "n": 1, "i": 24, "ex": ["الجملة غلط. لازم تكون النتيجة عكس المتوقع بشكل واضح، مش مجرد حظ وحش.", "صح، الجملة غلط. لازم تكون النتيجة عكس المتوقع بشكل واضح، مش مجرد حظ وحش."]}, {"t": "write", "h": "", "q": "(الفكرة) اشرح بأسلوبك يعني إيه <span class=\"en\">irony<\/span>، واذكر ٣ أنواع منها بمثال من عندك لكل نوع.", "key": "poetry-18:5", "n": 1, "i": 25}, {"t": "write", "h": "", "q": "(<span class=\"en\">Sonnet 130)<\/span> \"<span class=\"en\">My mistress' eyes are nothing like the sun<\/span>; / <span class=\"en\">Coral is far more red than her lips' red<\/span>;\" ليه ده مش إهانة للحبيبة؟ وإيه المفارقة في القصيدة؟", "key": "poetry-18:6", "n": 1, "i": 26}, {"t": "write", "h": "", "q": "(<span class=\"en\">Ozymandias)<\/span> حلل المفارقة بين \"<span class=\"en\">Look on my works,<\/span> <span class=\"en\">ye Mighty,<\/span> <span class=\"en\">and despair<\/span>!\" و \"<span class=\"en\">Nothing beside remains<\/span>\". استخدم الخمس خطوات (السطح، الحقيقة، النوع، مين فاهم، الإحساس).", "key": "poetry-18:7", "n": 1, "i": 27}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس الجاي (الدرس ١٩): <span class=\"en\">metonymy<\/span> و <span class=\"en\">synecdoche<\/span> و <span class=\"en\">oxymoron<\/span> و <span class=\"en\">paradox.<\/span>", "extra": "<span class=\"em\"><span class=\"em\">🔗<\/span><\/span> للتوسع (اتأكدت منهم): <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Irony\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Irony<\/a> ، <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Sonnet_130\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Sonnet_130<\/a> ، <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Ozymandias\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Ozymandias<\/a><span class=\"em\"><span class=\"em\">📚<\/span><\/span> المصادر: <span class=\"en\">Wikipedia - Irony<\/span>، <span class=\"en\">Wikipedia - Sonnet 130<\/span>، <span class=\"en\">Wikipedia - Ozymandias<\/span> (نص القصيدة من <span class=\"en\">Wikipedia<\/span>، ينشر ١١ يناير ١٨١٨ في <span class=\"en\">The Examiner)<\/span>.", "i": 28}];</script>
