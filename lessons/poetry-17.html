<h1>الدرس ١٧: symbolism — الرمز <span class="em">🌹</span></h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس 17 من 19</span><span class="tag"><span class="em">📖</span> كورس الشعر</span></div>

<script>window.LESSON_ID="poetry-17";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة هنتعلم تلاحظ إن حاجة صغيرة في القصيدة (وردة، نمر، ألوان) ممكن يكون معناها أكبر منها بكتير. وكمان هنتعلم نحذر: مش كل حاجة رمز! <span class=\"em\"><span class=\"em\">⚠️<\/span><\/span><\/div>", "n": 1, "i": 0, "a": "poetry-17-001", "x": "6b2f76e5"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: النقطة الأولى — إيه هو الرمز؟ <span class=\"em\"><span class=\"em\">🤔<\/span><\/span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١) التعريف<\/div><div class=\"u\">١.١ الـ <span class=\"en\">symbol<\/span> (رمز) = حاجة ملموسة (شيء، لون، حيوان) بتمثل فكرة أكبر وأكتر تجريد.<\/div><div class=\"u\">١.٢ الـ <span class=\"en\">symbolism<\/span> = استخدام الرمز في الشعر والفن. (المصدر: <span class=\"en\">Wikipedia - Symbol<\/span>: \"في الفن، الرمزية هي استخدام عنصر محسوس لتمثيل فكرة أكتر تجريداً\".)<\/div><div class=\"u\">٢) أمثلة من الحياة<\/div><div class=\"u\">٢.١ <span class=\"em\"><span class=\"em\">🛑<\/span><\/span> المثمن الأحمر = \"قف\" حتى من غير كلمة.<\/div><div class=\"u\">٢.٢ <span class=\"em\"><span class=\"em\">🌹<\/span><\/span> الوردة الحمرا بتشير غالباً للحب والتعاطف.<\/div>", "n": 6, "i": 2, "a": "poetry-17-002", "x": "8ad5fd34"}, {"t": "learn", "h": "<div class=\"u\">٢.٣ <span class=\"em\"><span class=\"em\">🗺️<\/span><\/span> الخط الأزرق في الخريطة = نهر.<\/div><div class=\"u\">٢.٤ <span class=\"em\"><span class=\"em\">🤍<\/span><\/span> شريط أبيض على الجاكيت = دعم قضية (الشرائط الملونة في الحملات).<\/div><div class=\"u\">٣) الكلمة نفسها<\/div>", "n": 3, "i": 3, "a": "poetry-17-003", "x": "13a8db17"}, {"t": "learn", "h": "<div class=\"u\">٣.١ جاية من اليونانية <span class=\"en\">symbolon<\/span> ومعناها \"حاجة بتتحط مع بعض\": زمان كانوا يكسروا فخارة نصين، واحد مع المرسل وواحد مع المستلم، ولما النصين يتطابقوا يعرف إن الرسالة حقيقية. فالرمز \"نص\" بيكمل معناه مع نص تاني في دماغك. (المصدر: <span class=\"en\">Wikipedia - Symbol<\/span>)<\/div>", "n": 1, "i": 4, "a": "poetry-17-004", "x": "e18e25f8"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: النقطة التانية — إزاي الرمز بيشتغل في الشعر؟ <span class=\"em\"><span class=\"em\">⚙️<\/span><\/span>", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">١) رمز واحد، معاني كتير<\/div><div class=\"u\">١.١ في الشعر الرمز مش بيقول معنى واحد ثابت. ممكن يشير لفكرة أو أكتر حسب السياق.<\/div><div class=\"u\">١.٢ مثال من أستاذ الأدب <span class=\"en\">Gilad Elbom<\/span> (جامعة <span class=\"en\">Oregon State<\/span>): اللون الأحمر ممكن يمثل الحب، أو الخيانة، أو الدم، أو \"قف\" عند الإشارة، أو الشيوعية. (المصدر: <span class=\"en\">Oregon State Guide to Literary Terms<\/span>)<\/div><div class=\"u\">١.٣ واللون الأبيض: نقاء وبراءة وحياة... بس كمان شحوب وموت!<\/div>", "n": 4, "i": 6, "a": "poetry-17-005", "x": "59c8e5c4"}, {"t": "learn", "h": "<div class=\"u\">٢) يعني القاعدة إيه؟<\/div><div class=\"u\">٢.١ الرمز بياخد معناه من سياق القصيدة، مش من قاموس جاهز.<\/div><div class=\"u\">٢.٢ لازم تسأل: إيه اللي حوالين الحاجة دي في القصيدة؟<\/div>", "n": 3, "i": 7, "a": "poetry-17-006", "x": "fdc07461"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: النقطة التالتة — أمثلة من قصايد معانا <span class=\"em\"><span class=\"em\">📜<\/span><\/span>", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"lead\">١) <span class=\"em\"><span class=\"em\">🌹<\/span><\/span> <span class=\"en\">The Sick Rose<\/span> (<span class=\"en\">Blake<\/span>):<\/div><div class=\"u\">\"<span class=\"en\">O Rose thou art sick.<\/span> / <span class=\"en\">The invisible worm,<\/span> / <span class=\"en\">That flies in the night<\/span> / <span class=\"en\">In the howling storm<\/span>:\"<\/div><div class=\"u\">١.١ الوردة ممكن تكون رمز لحاجة جميلة وهشة (الحب؟ الإنسان؟). والدودة الخفية لحاجة بتدمر من جوه. الناقد <span class=\"en\">Cervo<\/span> قال إنها من أغمض القصايد، يعني مفيش معنى واحد. (قراءات، مش حقائق.)<\/div>", "n": 2, "i": 9, "a": "poetry-17-007", "x": "042a05fc"}, {"t": "learn", "h": "<div class=\"u\">١.٢ سؤال تفكير: إيه الدليل في النص؟ \"<span class=\"en\">invisible<\/span>\" و \"<span class=\"en\">night<\/span>\" و \"<span class=\"en\">dark secret love<\/span>\" كلها بتدعم فكرة الخفاء والسر.<\/div>", "n": 1, "i": 10, "a": "poetry-17-008", "x": "53929cdc"}, {"t": "learn", "h": "<div class=\"lead\">٢) <span class=\"em\"><span class=\"em\">🐯🐑<\/span><\/span> <span class=\"en\">The Tyger<\/span> (<span class=\"en\">Blake<\/span>):<\/div><div class=\"u\">\"<span class=\"en\">Tyger Tyger,<\/span> <span class=\"en\">burning bright,<\/span> / <span class=\"en\">In the forests of the night<\/span>;\"<\/div><div class=\"u\">٢.١ <span class=\"en\">Wikipedia<\/span> بتقول إن القصيدة بتسأل عن نية الإله في خلق مخلوقات مختلفة زي \"<span class=\"en\">Lamb<\/span>\" (الخروف) و \"<span class=\"en\">Tyger<\/span>\" (النمر).<\/div><div class=\"u\">٢.٢ يعني الخروف والنمر ممكن يكونوا رموز: الخروف للهدوء والبراءة، والنمر للقوة المخيفة (قراءة شائعة، مش حقيقة مطلقة).<\/div>", "n": 3, "i": 11, "a": "poetry-17-009", "x": "99b2e82f"}, {"t": "learn", "h": "<div class=\"lead\">٣) <span class=\"em\"><span class=\"em\">🛞<\/span><\/span> <span class=\"en\">The Red Wheelbarrow<\/span> (<span class=\"en\">Williams<\/span>):<\/div><div class=\"u\">٣.١ هل العربية الحمرا رمز؟ بعض القراء بيقولوا \"أه\"، وبعضهم بيقول \"لأ، هي نفسها المهمة\". وده بيودينا للتحذير <span class=\"em\"><span class=\"em\">👇<\/span><\/span><\/div>", "n": 1, "i": 12, "a": "poetry-17-010", "x": "75cf0af4"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: النقطة الرابعة — تحذير: مش كل حاجة رمز! <span class=\"em\"><span class=\"em\">⚠️<\/span><\/span>", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">١) كلام <span class=\"en\">Elbom<\/span> (<span class=\"en\">Oregon State<\/span>)<\/div><div class=\"u\">١.١ \"أحياناً الوردة هي وردة هي وردة\" (جملة شهيرة لـ <span class=\"en\">Gertrude Stein<\/span>). يعني مش لازم يكون ليها معنى تاني.<\/div><div class=\"u\">١.٢ إغراء كبير: نفكر إن كل حاجة في الأدب رمز (العاصفة = اضطراب البطل، العربية السودا = موته). ده ممكن يبقى قراءة سطحية.<\/div><div class=\"u\">٢) إزاي أعرف إن الحاجة رمز؟ (٤ أسئلة)<\/div><div class=\"u\">٢.١ هل الشاعر بيركز عليها (بيكررها، بيعنونها، بيدّيها مكان مهم)؟<\/div>", "n": 5, "i": 14, "a": "poetry-17-011", "x": "f74d4aa8"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ هل ليها معنى واضح من سياق القصيدة؟<\/div><div class=\"u\">٢.٣ هل فيه أدلة تانية في النص بتدعم الفكرة؟<\/div><div class=\"u\">٢.٤ لو شيلتها، هل المعنى بيتغير؟<\/div><div class=\"u\">٣) خطوات التحليل<\/div><div class=\"u\">٣.١ حدد الشيء. ٣.٢ قول القراءة الرمزية المحتملة. ٣.٣ ادّي دليل من النص. ٣.٤ اذكر إن فيه قراءات تانية.<\/div><div class=\"u\">٤) الفرق بينه وبين الاستعارة والتشخيص<\/div>", "n": 6, "i": 15, "a": "poetry-17-012", "x": "e180952b"}, {"t": "learn", "h": "<div class=\"u\">٤.١ الاستعارة بتقول \"ده هو ده\" وبتشرح العلاقة. الرمز بيفضل ظاهر كشيء حقيقي ومعاه معنى مخفي.<\/div>", "n": 1, "i": 16, "a": "poetry-17-013", "x": "51197c74"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅<\/span><\/span>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">١) الملخص<\/div><div class=\"u\">١.١ <span class=\"en\">symbol<\/span> = شيء ملموس بيمثل فكرة مجردة.<\/div><div class=\"u\">١.٢ المعنى بيتحدد من السياق، والرمز ممكن يشير لأكتر من فكرة.<\/div><div class=\"u\">١.٣ أمثلة: الوردة الحمرا، اللون الأبيض، الخروف والنمر.<\/div><div class=\"u\">١.٤ تحذير: مش كل حاجة رمز. لازم دليل من النص.<\/div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">✏️<\/span><\/span> تمرين<\/div><div class=\"u\">٢.١ اشرح كلمة <span class=\"en\">symbol<\/span> بأسلوبك وهات مثالين من الحياة.<\/div><div class=\"u\">٢.٢ في \"<span class=\"en\">The Sick Rose<\/span>\": إيه ممكن تكون الوردة رمز لإيه؟ وإيه دليلك من النص؟<\/div>", "n": 8, "i": 18, "a": "poetry-17-014", "x": "a2899cbf"}, {"t": "learn", "h": "<div class=\"u\">٢.٣ فكر في حاجة بتتكرر في حياتك أو في فيلم بتحبه (لون، حيوان، حاجة) وحلل قراءتها الرمزية بالأربع خطوات، ولاحظ لو ممكن تكون مش رمز.<\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح. <span class=\"em\"><span class=\"em\">✍️<\/span><\/span><\/div>", "n": 2, "i": 19, "a": "poetry-17-015", "x": "35322dea"}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس الجاي (الدرس ١٨): <span class=\"en\">irony<\/span> (السخرية): لما اللي بيتقال عكس اللي بيتقصد.", "extra": "<span class=\"em\"><span class=\"em\">🔗<\/span><\/span> للتوسع (اتأكدت منهم): <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Symbol\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Symbol<\/a> ، <a class=\"en\" href=\"https://liberalarts.oregonstate.edu/wlf/what-symbolism\" target=\"_blank\" rel=\"noopener\">https://liberalarts.oregonstate.edu/wlf/what-symbolism<\/a><span class=\"em\"><span class=\"em\">📚<\/span><\/span> المصادر: <span class=\"en\">Wikipedia - Symbol<\/span>، <span class=\"en\">Oregon State Guide to Literary Terms<\/span> (<span class=\"en\">What is Symbolism?<\/span> - <span class=\"en\">Gilad Elbom<\/span>، ٢٠٢٠)، <span class=\"en\">Wikipedia - The Tyger<\/span>، <span class=\"en\">Wikipedia - The Sick Rose<\/span>، <span class=\"en\">Poetry Foundation.<\/span>", "i": 20}];</script>
