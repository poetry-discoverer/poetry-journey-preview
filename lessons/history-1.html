<script>window.LESSON_ID="history-1";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"إيه هو تاريخ الأدب؟ وليه الشعر بيتغير؟ + الخريطة الكاملة\"<\/div>", "n": 1, "i": 0, "a": "history-1-001", "x": "9ab701e6"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">👋<\/span><\/span> أهلاً بيك في الكورس التالت. في كورس الشعر اتعلمنا الأدوات (الصوت والإيقاع والقافية)، وفي كورس الميثولوجيا هنتعلم الحكايات القديمة. الكورس ده هنمشي فيه مع الحكاية الكبيرة نفسها: الشعر الإنجليزي اتولد إزاي، وعدّى بإيه، لحد ما وصل للنهاردة. هنمشي من تحت الصفر خالص، خطوة خطوة، زي ما بنتعلم لغة جديدة من أول حرف لحد مستوى <span class=\"en\">C2.<\/span> مفيش حاجة هنفترض إنك عارفها.<\/div>", "n": 1, "i": 1, "a": "history-1-002", "x": "2ebfdde4"}, {"t": "learn", "h": "<div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: يعني إيه \"تاريخ الأدب\" أصلاً؟<\/div>", "n": 1, "i": 2, "a": "history-1-003", "x": "c4d4d3e7"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> التعريف البسيط:<\/div><div class=\"u\">تاريخ الأدب هو حكاية الكلام الجميل المكتوب في لغة معينة عبر الزمن: مين كتب، وكتب إيه، وليه كتب كده، وإزاي كل جيل اتأثر باللي قبله.<\/div>", "n": 1, "i": 3, "a": "history-1-004", "x": "d187f2a7"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> مثال من الحياة اليومية الأول:<\/div><div class=\"u\">فكر في الأغاني. اسمع أغنية من أيام جدك، وأغنية من أيام باباك، وأغنية طالعة السنة دي. هتلاقي:<\/div><div class=\"li\">الكلمات مختلفة (أغاني زمان فصحى ورصينة، دلوقتي عامية).<\/div><div class=\"li\">المواضيع مختلفة.<\/div><div class=\"li\">الأسلوب نفسه مختلف (مقدمة طويلة ولا دخول على اللحن على طول؟).<\/div>", "n": 4, "i": 4, "a": "history-1-005", "x": "d298a26d"}, {"t": "learn", "h": "<div class=\"u\">محدش قرر ده في يوم. ده حصل تدريجياً، جيل ورا جيل، وكل جيل كان بيرد على اللي قبله: يا يكمله يا يزهق منه ويعمل عكسه.<\/div>", "n": 1, "i": 5, "a": "history-1-006", "x": "d36d8631"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> طبق المثال على الشعر:<\/div><div class=\"u\">الشعر الإنجليزي بالظبط كده. اللي اتكتب سنة ١٤٠٠ غير اللي اتكتب سنة ١٦٠٠ غير اللي اتكتب سنة ١٩٠٠. وتاريخ الأدب هو إننا نمشي ورا التغيير ده ونفهم ليه حصل.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> ليه ده مهم ليك انت بالذات؟<\/div>", "n": 2, "i": 6, "a": "history-1-007", "x": "ee766bca"}, {"t": "learn", "h": "<div class=\"u\">لأنك طالب إنجليزي. لما تيجي تقرا قصيدة في الامتحان، أول سؤال بيفك شفرتها هو: \"دي من أنهي عصر؟\" لو عرفت العصر، عرفت تتوقع الشكل والأفكار واللغة قبل ما تقرا سطر واحد.<\/div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: ليه الشعر بيتغير؟ (٤ أسباب)<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> السبب 1: اللغة نفسها بتتغير <span class=\"em\"><span class=\"em\">🗣️<\/span><\/span><\/div><div class=\"li\">مثال يومي: جدك بيقول كلمات انت بتضحك عليها، وانت بتقول كلمات هو مش فاهمها. اللغة كائن حي بيكبر ويغيّر جلده.<\/div>", "n": 4, "i": 7, "a": "history-1-008", "x": "ae49f452"}, {"t": "learn", "h": "<div class=\"li\">في الإنجليزية: الإنجليزي القديم (سنة ١٠٠٠) كان لغة تانية خالص، أقرب للألماني، محدش يفهمه النهاردة غير بالدراسة.<\/div><div class=\"li\">والإنجليزي الوسيط (سنة ١٤٠٠) شبه مفهوم بصعوبة. وإنجليزي شكسبير (١٦٠٠) قريب بس قديم الطعم. فكل عصر كان ليه \"لغة الشعر\" بتاعته.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> السبب 2: الأحداث الكبيرة بتحرك المشاعر <span class=\"em\"><span class=\"em\">⚔️<\/span><\/span><\/div>", "n": 3, "i": 8, "a": "history-1-009", "x": "155a0a42"}, {"t": "learn", "h": "<div class=\"li\">مثال يومي: بعد أي حدث كبير في البلد، تلاحظ إن الأغاني والأغاني الوطنية والبوستات كلها بتتغير مودها.<\/div><div class=\"li\">في إنجلترا: الغزو النورماندي (١٠٦٦) غيّر اللغة كلها. الحروب العالمية خلت الشعر الحديث مكسور وحزين. الثورة الصناعية خلت شعراء يهربوا للطبيعة في قصايدهم.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> السبب 3: الأفكار الجديدة بتغير المواضيع <span class=\"em\"><span class=\"em\">💡<\/span><\/span><\/div>", "n": 3, "i": 9, "a": "history-1-010", "x": "c0f61cd6"}, {"t": "learn", "h": "<div class=\"li\">مثال يومي: جيل كان شغله الشاغل الفرح والستر، وجيل تاني شغله السفر والحرية. أفكار كل زمن بتحدد الناس بتتكلم في إيه.<\/div><div class=\"li\">في الشعر: عصر كان كله إيمان وكنيسة، وعصر بعده كان كله عقل ومنطق، وعصر بعده كان كله إحساس وطبيعة.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> السبب 4: كل جيل بيثور على اللي قبله <span class=\"em\"><span class=\"em\">🔁<\/span><\/span><\/div>", "n": 3, "i": 10, "a": "history-1-011", "x": "8bc380d6"}, {"t": "learn", "h": "<div class=\"li\">مثال يومي: موضة باباك كانت بنطلون ضيق، انت لبست واسع، وابنك غالباً هيرجع ضيق. الأجيال بتعمل عكس اللي قبلها عشان تحس إن ليها شخصية.<\/div><div class=\"li\">دي أهم قاعدة في الكورس كله، وسموها \"القاعدة الذهبية\" وتحت هتلاقيها بإيموجي نجمة.<\/div><div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: الخريطة الكاملة (احفظها، دي عمود الكورس) <span class=\"em\"><span class=\"em\">🗺️<\/span><\/span><\/div><div class=\"u\">الشعر الإنجليزي عمره حوالي ١٣٠٠ سنة، متقسم ٨ محطات كبيرة:<\/div>", "n": 4, "i": 11, "a": "history-1-012", "x": "c40481cb"}, {"t": "learn", "h": "<div class=\"u\">١. <span class=\"em\"><span class=\"em\">🛡️<\/span><\/span> العصر القديم <span class=\"en\">Old English<\/span> (حوالي ٦٥٠ - ١١٠٠)<\/div><div class=\"u\">شعر بيتقال مش بيتكتب، شعراء بيغنوا في قصور الملوك. أعظم أثر: ملحمة <span class=\"en\">Beowulf<\/span>، بطل بيحارب وحوش وتنين. الموسيقى كلها <span class=\"en\">alliteration<\/span> (تكرار أول حرف)، ومفيش قافية.<\/div><div class=\"u\">٢. <span class=\"em\"><span class=\"em\">🏰<\/span><\/span> العصر الوسيط <span class=\"en\">Middle English<\/span> (حوالي ١١٠٠ - ١٥٠٠)<\/div>", "n": 3, "i": 12, "a": "history-1-013", "x": "3e69ee23"}, {"t": "learn", "h": "<div class=\"u\">بعد الغزو النورماندي اللغة اتلخبطت واتولدت إنجليزية جديدة. النجم: <span class=\"en\">Geoffrey Chaucer<\/span> صاحب <span class=\"en\">The Canterbury Tales<\/span>، حكايات على لسان حجاج. بيتلقب \"أبو الشعر الإنجليزي\".<\/div><div class=\"u\">٣. <span class=\"em\"><span class=\"em\">🎭<\/span><\/span> القرن ١٦: عصر النهضة<\/div><div class=\"u\">إعادة اكتشاف اليونان وروما. السونيت يدخل إنجلترا من إيطاليا. شكسبير و<span class=\"en\">Spenser<\/span> و<span class=\"en\">Sidney.<\/span> الشعر مربوط بالموسيقى وبلاط الملكة إليزابيث.<\/div><div class=\"u\">٤. <span class=\"em\"><span class=\"em\">⚔️<\/span><\/span> القرن ١٧: قرن التلات وشوش<\/div>", "n": 4, "i": 13, "a": "history-1-014", "x": "2b112fab"}, {"t": "learn", "h": "<div class=\"u\">الميتافيزيقيون (<span class=\"en\">Donne<\/span> وشعر الـ <span class=\"en\">conceit<\/span> الزكي)، والـ <span class=\"en\">Cavaliers<\/span> (شعر \"اقطف يومك\")، وفي النص <span class=\"en\">Milton<\/span> صاحب <span class=\"en\">Paradise Lost<\/span> أعظم ملحمة إنجليزية.<\/div><div class=\"u\">٥. <span class=\"em\"><span class=\"em\">🎩<\/span><\/span> القرن ١٨: عصر العقل<\/div><div class=\"u\">العقل فوق الإحساس، الاتزان والهجاء. النجم: <span class=\"en\">Alexander Pope.<\/span> الشكل الملك: <span class=\"en\">heroic couplet.<\/span><\/div><div class=\"u\">٦. <span class=\"em\"><span class=\"em\">🌹<\/span><\/span> القرن ١٩: الرومانسية ثم الفيكتوري<\/div>", "n": 4, "i": 14, "a": "history-1-015", "x": "1f8d3a9e"}, {"t": "learn", "h": "<div class=\"u\">الرومانسيون (<span class=\"en\">Wordsworth<\/span> و<span class=\"en\">Coleridge<\/span> و<span class=\"en\">Byron<\/span> و<span class=\"en\">Shelley<\/span> و<span class=\"en\">Keats<\/span>): الإحساس فوق العقل والطبيعة مدرسة. وبعدين الفيكتوريون (<span class=\"en\">Tennyson<\/span> و<span class=\"en\">Browning<\/span>): شعر الشك والإيمان زمن العلم والمصانع.<\/div><div class=\"u\">٧. <span class=\"em\"><span class=\"em\">💥<\/span><\/span> القرن ٢٠: الحداثة<\/div><div class=\"u\">كسر القواعد. الشعر الحر بقى الأساس. <span class=\"en\">Eliot<\/span> و<span class=\"en\">Yeats<\/span> و<span class=\"en\">Pound<\/span>، وشعراء الحرب، وبعدهم الاعترافيون زي <span class=\"en\">Sylvia Plath.<\/span><\/div><div class=\"u\">٨. <span class=\"em\"><span class=\"em\">📱<\/span><\/span> النهاردة<\/div>", "n": 4, "i": 15, "a": "history-1-016", "x": "f362b234"}, {"t": "learn", "h": "<div class=\"u\">مفيش مذهب واحد حاكم: تنوع كامل، شعر مكتوب ومؤدّى ومنشور أونلاين.<\/div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: القاعدة الذهبية <span class=\"em\"><span class=\"em\">⭐<\/span><\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⭐<\/span><\/span> كل جيل بيثور على اللي قبله، والشعر الإنجليزي بندول بين العقل والإحساس.<\/div><div class=\"li\">عصر العقل (القرن ١٨) كان متزن وعقلاني <span class=\"em\"><span class=\"em\">→<\/span><\/span> الرومانسيون ثاروا عليه بالإحساس والطبيعة.<\/div><div class=\"li\">الفيكتوريون كانوا جادّين وعاطفيين <span class=\"em\"><span class=\"em\">→<\/span><\/span> الحداثيون ثاروا عليهم بالكسر والتجريب.<\/div>", "n": 5, "i": 16, "a": "history-1-017", "x": "eae2bd95"}, {"t": "learn", "h": "<div class=\"li\">مثال يومي: زي ما جيل بيربّي ولاده بالضبط عكس ما اتربّى، كل جيل شعراء بيربّي قصايده عكس الجيل اللي قبله.<\/div><div class=\"u\">خلي القاعدة دي قدامك في كل درس جاي: لما تسمع اسم عصر جديد، اسأل على طول: \"دول بيثوروا على مين؟\"<\/div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: إزاي هنمشي في الكورس ده؟ <span class=\"em\"><span class=\"em\">🧭<\/span><\/span><\/div><div class=\"li\">هنمشي بالترتيب الزمني، عصر عصر، وفي كل عصر:<\/div><div class=\"u\">١. دنيا العصر الأول (إيه اللي كان بيحصل، زي ما بنحكي لصاحبك).<\/div>", "n": 5, "i": 17, "a": "history-1-018", "x": "888aa29d"}, {"t": "learn", "h": "<div class=\"u\">٢. سمات الشعر فيه (الشكل والمواضيع).<\/div><div class=\"u\">٣. بروفايل كل شاعر مهم: حياته ودنياه وأهم أعماله وأمثلة منها.<\/div><div class=\"u\">٤. كويز بعد كل درس، ومراجعة متباعدة عشان المعلومة تثبت.<\/div><div class=\"li\">التدرج لغة-لغة: النهاردة انت في \"مستوى <span class=\"en\">A1<\/span>\" بتاع تاريخ الشعر. في آخر المستوى السادس هتكون بتقرا مقالات بحثية وبتفكك حجج باحثين، يعني مستوى دكتوراه.<\/div><div class=\"li\">كل درس هيبني على اللي قبله من غير ما يفترض حاجة.<\/div>", "n": 5, "i": 18, "a": "history-1-019", "x": "ac1d298f"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🔗<\/span><\/span> روابط مفيدة لو حبيت تبص بنفسك:<\/div><div class=\"li\">موقع <span class=\"en\">Poetry Foundation<\/span>: مكتبة ضخمة لقصايد وسير الشعراء - <span class=\"en\">poetryfoundation.org<\/span><\/div><div class=\"li\">المكتبة البريطانية: مقالات ومخطوطات أصلية مصوّرة - <span class=\"en\">bl.uk<\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📝<\/span><\/span> كويز الدرس 1 (جاوب مقالي أو بالصوت، زي ما يريحك):<\/div><div class=\"u\">١. في جملة من قلمك: يعني إيه تاريخ الأدب؟<\/div>", "n": 4, "i": 19, "a": "history-1-020", "x": "4070e144"}, {"t": "learn", "h": "<div class=\"u\">٢. اذكر الأسباب الأربعة اللي بتغيّر الشعر عبر الزمن، ومع كل سبب مثال من حياتك انت مش من الدرس.<\/div><div class=\"u\">٣. رتّب العصور التمنية من الأقدم للأحدث، واكتب جنب كل عصر كلمة واحدة توصفه.<\/div><div class=\"u\">٤. إيه هي \"القاعدة الذهبية\"؟ وليه الرومانسيون يعتبروا مثال عليها؟<\/div><div class=\"u\">٥. سؤال تفكير: لو عصرنا الحالي هيتلخص بعد ٢٠٠ سنة في سطر واحد في كتاب تاريخ أدب، تتوقع هيقولوا علينا إيه؟ ليه؟<\/div>", "n": 4, "i": 20, "a": "history-1-021", "x": "bd98c52d"}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">🛡️<\/span><\/span> العصر القديم، إنجلترا قبل الكتابة، وشعراء بيغنوا في قصور الملوك.", "extra": "", "i": 21}];</script>
