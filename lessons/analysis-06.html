<script>window.LESSON_ID="analysis-06";window.STEPS=[{"t":"learn","h":"<div class=\"u\">الدرس اللي فات: Leda and the Swan — عنف بيصنع تاريخ، وسؤال عن المعرفة والقوة. الدرس ده نفس الشاعر، لكن الموضوع اتغير تمامًا: راجل عجوز بيدوّر على شكل حياة مش بتموت.</div><div class=\"u\">القصيدة: Sailing to Byzantium، أربع مقاطع، كل مقطع تمانية سطور.</div>","n":2,"i":0,"a":"analysis-06-001","x":"ee86554a"},{"t":"section","h":"ييتس والقصيدة","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">القصيدة اتكتبت سنة 1926 واتنشرت في مجموعة <span class=\"en\">The Tower</span> سنة 1928. ييتس وقتها كان عنده 61 سنة، وعضو في مجلس الشيوخ الإيرلندي، وحاسس إنه خرج من عالم الشباب.</div>","n":1,"i":2,"a":"analysis-06-002","x":"0bafefbc"},{"t":"learn","h":"<div class=\"u\">بيزنطة <span class=\"en\">(Byzantium)</span> هنا مش مكان سياحي: هي رمز. ييتس شافها المكان الوحيد في التاريخ اللي كان فيه الفن والدين والحياة اليومية حاجة واحدة — وحدة ثقافية <span class=\"en\">(unity of culture)</span>.</div>","n":1,"i":3,"a":"analysis-06-003","x":"678b4267"},{"t":"learn","h":"<div class=\"u\">وهو ما سافرش لبيزنطة أصلًا. عرف فنها من الفسيفساء <span class=\"en\">(mosaics)</span> اللي شافها في إيطاليا ومن كتب عن الفن البيزنطي. الرحلة في القصيدة رحلة روحية، مش جغرافية.</div>","n":1,"i":4,"a":"analysis-06-004","x":"d02feacf"},{"t":"learn","h":"<div class=\"u\">الشكل: أربع مقاطع، كل واحد تمانية سطور — أوتافا ريما <span class=\"en\">(ottava rima)</span>. القافية مترابطة، وفيها قوافي ناقصة <span class=\"en\">(slant rhymes)</span> زي <span class=\"en\">dies / seas</span>، يعني موسيقى مش ناعمة تمامًا.</div>","n":1,"i":5,"a":"analysis-06-005","x":"a8f8ba60"},{"t":"section","h":"المقطع الأول: بلد الشباب (<span dir=\"ltr\">1-8</span>)","n":1,"i":6},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">That is no country for old men. The young / In one another’s arms, birds in the trees / —Those dying generations—at their song, / The salmon-falls, the mackerel-crowded seas,</span></div>","n":2,"i":7,"a":"analysis-06-006","x":"72b0bdc2"},{"t":"learn","h":"<div class=\"u\">«ده مش بلد للرجالة العواجيز». أول سطر بيقفل الباب: اللي جوه مش هيعرف يعيش فيه. والشباب في حضن بعض، والطير في الشجر — كله دفء وحركة وتكاثر.</div>","n":1,"i":8,"a":"analysis-06-007","x":"76161b5b"},{"t":"learn","h":"<div class=\"u\">و«أجيال بتموت» <span class=\"en\">(dying generations)</span>: الطير بيغني وهو جزء من دايرة بتخلص. حتى الفرح هنا مبني على الفناء — كل حاجة بتتولد عشان تموت.</div>","n":1,"i":9,"a":"analysis-06-008","x":"f7c3032d"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">5-8</span>:</div><div class=\"u\"><span class=\"en\">Fish, flesh, or fowl, commend all summer long / Whatever is begotten, born, and dies. / Caught in that sensual music all neglect / Monuments of unageing intellect.</span></div>","n":2,"i":10,"a":"analysis-06-009","x":"ac228f0e"},{"t":"learn","h":"<div class=\"u\">سمك ولحم وطير — كل الكائنات بتشهد للصيف. و«اللي اتولد واتخلق ومات»: سلسلة كاملة في سطر واحد. ده عالم الطبيعة <span class=\"en\">(nature)</span> اللي مفيش فيه استثناء.</div>","n":1,"i":11,"a":"analysis-06-010","x":"1e0f81d4"},{"t":"learn","h":"<div class=\"u\">«الموسيقى الحسية» <span class=\"en\">(sensual music)</span> هي موسيقى الجسد والحواس، وكل واحد مسحوب فيها فبيتجاهل حاجة تانية خالص: «آثار العقل اللي مش بيهرم» <span class=\"en\">(Monuments of unageing intellect)</span>.</div>","n":1,"i":12,"a":"analysis-06-011","x":"0192f4af"},{"t":"learn","h":"<div class=\"u\">الجملة دي مفتاح القصيدة كلها: فيه عالم بيولد ويموت، وفيه حاجة مصنوعة بتبقى. والمقطع الأول كله بيحط الفرق ده قبل ما الرحلة تبدأ.</div>","n":1,"i":13,"a":"analysis-06-012","x":"389909c0"},{"t":"section","h":"المقطع التاني: الشيخوخة والرحيل (<span dir=\"ltr\">9-16</span>)","n":1,"i":14},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">9-12</span>:</div><div class=\"u\"><span class=\"en\">An aged man is but a paltry thing, / A tattered coat upon a stick, unless / Soul clap its hands and sing, and louder sing / For every tatter in its mortal dress,</span></div>","n":2,"i":15,"a":"analysis-06-013","x":"c674f986"},{"t":"learn","h":"<div class=\"u\">«الراجل العجوز حاجة تافهة، بالطو مرقّع على عصاية» <span class=\"en\">(a tattered coat upon a stick)</span> — صورة فزاعة. الجسد بقى هدوم بالية، مش جسم.</div>","n":1,"i":16,"a":"analysis-06-014","x":"6120cad1"},{"t":"learn","h":"<div class=\"u\">بس فيه استثناء بـ <span class=\"en\">unless</span>: إلا لو الروح <span class=\"en\">(soul)</span> سقّفت بإيديها وغنت. والصورة دي مأخوذة من بليك <span class=\"en\">(Blake)</span>، اللي كتب عن الروح وهي بتصفّق.</div>","n":1,"i":17,"a":"analysis-06-015","x":"055be41f"},{"t":"learn","h":"<div class=\"u\">والأهم: «تغني أعلى مع كل خرق في هدومها الفانية» — كل ما الجسد يبلى، الصوت يعلى. الخسارة نفسها بقت وقود للغنا.</div>","n":1,"i":18,"a":"analysis-06-016","x":"84c6f746"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">13-16</span>:</div><div class=\"u\"><span class=\"en\">Nor is there singing school but studying / Monuments of its own magnificence; / And therefore I have sailed the seas and come / To the holy city of Byzantium.</span></div>","n":2,"i":19,"a":"analysis-06-017","x":"70e3d8c0"},{"t":"learn","h":"<div class=\"u\">«مفيش مدرسة غنا غير دراسة آثار مجدها هي» — يعني الروح لازم تتعلم من الأعمال الفنية اللي بقت. الفن هنا مدرسة الروح، مش تسلية.</div>","n":1,"i":20,"a":"analysis-06-018","x":"681d4d92"},{"t":"learn","h":"<div class=\"u\">وعشان كده «سافرت البحار وجيت للمدينة المقدسة بيزنطة». <span class=\"en\">And therefore</span> بتخلي الرحلة نتيجة منطقية، مش مغامرة. الراجل مش مسافر، هو بيدوّر على علاج.</div>","n":1,"i":21,"a":"analysis-06-019","x":"a852b73c"},{"t":"section","h":"المقطع التالت: صلاة للقديسين (<span dir=\"ltr\">17-24</span>)","n":1,"i":22},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">17-24</span>:</div><div class=\"u\"><span class=\"en\">O sages standing in God’s holy fire / As in the gold mosaic of a wall, / Come from the holy fire, perne in a gyre, / And be the singing-masters of my soul. / Consume my heart away; sick with desire / And fastened to a dying animal / It knows not what it is; and gather me / Into the artifice of eternity.</span></div>","n":2,"i":23,"a":"analysis-06-020","x":"dea69543"},{"t":"learn","h":"<div class=\"u\">«يا حكماء واقفين في نار ربنا زي ما تكونوا في فسيفساء دهب على حيطة» — القديسين هنا جزء من عمل فني. القصيدة بتحوّل الفن لكنيسة، والقديسين لصورة.</div>","n":1,"i":24,"a":"analysis-06-021","x":"301de3d4"},{"t":"learn","h":"<div class=\"u\">«تعالوا من النار، <span class=\"en\">perne in a gyre</span>» — كلمة <span class=\"en\">perne</span> معناها بكرة الخيط، و<span class=\"en\">gyre</span> هي اللولب/الدورة في فكر ييتس. يعني تعالوا لافّين في دوامة، زي حركة القدر.</div>","n":1,"i":25,"a":"analysis-06-022","x":"05cd6ab1"},{"t":"learn","h":"<div class=\"u\">«كلّي قلبي» <span class=\"en\">(Consume my heart away)</span>: القلب عيان من الشهوة <span class=\"en\">(sick with desire)</span> ومربوط بحيوان بيموت <span class=\"en\">(fastened to a dying animal)</span> — يعني الجسد. ومش عارف نفسه.</div>","n":1,"i":26,"a":"analysis-06-023","x":"16c7167f"},{"t":"learn","h":"<div class=\"u\">والطلب الأخير: «لمّني جوه صنعة الأبدية» <span class=\"en\">(the artifice of eternity)</span>. كلمة <span class=\"en\">artifice</span> هنا مش «تزييف» — هي الشيء المصنوع بإيد، عكس الشيء اللي بيتولد من الطبيعة.</div>","n":1,"i":27,"a":"analysis-06-024","x":"7de95357"},{"t":"section","h":"المقطع الرابع: الطير الذهبي (<span dir=\"ltr\">25-32</span>)","n":1,"i":28},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">25-28</span>:</div><div class=\"u\"><span class=\"en\">Once out of nature I shall never take / My bodily form from any natural thing, / But such a form as Grecian goldsmiths make / Of hammered gold and gold enamelling</span></div>","n":2,"i":29,"a":"analysis-06-025","x":"0e4d0c33"},{"t":"learn","h":"<div class=\"u\">«لما أخرج من الطبيعة مش هاخد شكلي من أي حاجة طبيعية» — قرار واضح: مش عايز يرجع طير حقيقي ولا شجرة. عايز شكل من صنع صايغ يوناني، دهب مطروق ومطلي.</div>","n":1,"i":30,"a":"analysis-06-026","x":"d67b9568"},{"t":"learn","h":"<div class=\"u\">ولاحظ إن الشكل الجديد مش روح خالصة: هو <span class=\"en\">gold</span> و<span class=\"en\">enamelling</span>، يعني مادة برضه، بس مادة مش بتموت. ييتس مش بيهرب من المادة، بيهرب من الفناء.</div>","n":1,"i":31,"a":"analysis-06-027","x":"67aded02"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">29-32</span>:</div><div class=\"u\"><span class=\"en\">To keep a drowsy Emperor awake; / Or set upon a golden bough to sing / To lords and ladies of Byzantium / Of what is past, or passing, or to come.</span></div>","n":2,"i":32,"a":"analysis-06-028","x":"2d7ac64e"},{"t":"learn","h":"<div class=\"u\">الطير الذهبي وظيفته: يفضل الإمبراطور النعسان صاحي. يعني الفن هنا بيصحّي اللي عنده كل حاجة وما بقاش حاسس بحاجة.</div>","n":1,"i":33,"a":"analysis-06-029","x":"52ad205a"},{"t":"learn","h":"<div class=\"u\">وبيغني «عن اللي فات، واللي بيعدّي، واللي جاي» — فوق الزمن. ده تعريف الفن عند ييتس: حاجة شايفة التلات أزمنة مع بعض.</div>","n":1,"i":34,"a":"analysis-06-030","x":"46df35ee"},{"t":"learn","h":"<div class=\"u\">وفي الآخر سؤال للمناقشة: الطير ده حر ولا في قفص؟ بيغني للأمراء والستات، على غصن دهب، لمصلحة حد تاني. بعض القراءات بتشوف إن الخلود هنا مش حرية كاملة.</div>","n":1,"i":35,"a":"analysis-06-031","x":"8b87d62a"},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":36},{"t":"learn","h":"<div class=\"u\">الصور الأساسية: الدهب والنار والفسيفساء والطير. كلها بتشترك في حاجة واحدة — بتلمع، وبتفضل. ضدها صور الطبيعة: الطير الحقيقي، السمك، الهدوم المرقعة.</div>","n":1,"i":37,"a":"analysis-06-032","x":"249a23f0"},{"t":"learn","h":"<div class=\"u\">البناء: أربع مقاطع = أربع مراحل: رفض بلد الشباب ← تشخيص حالة الشيخوخة ← الصلاة والطلب ← الشكل النهائي. القصيدة رحلة بتتحرك في اتجاه واحد، ومفيش رجوع.</div>","n":1,"i":38,"a":"analysis-06-033","x":"f5e3d99a"},{"t":"learn","h":"<div class=\"u\">الموضوعات: الفن ضد الطبيعة <span class=\"en\">(art vs nature)</span>، الجسد ضد الروح <span class=\"en\">(body vs soul)</span>، الخلود ضد الفناء، وتكلفة الدوام: عشان تبقى، لازم تسيب الحياة.</div>","n":1,"i":39,"a":"analysis-06-034","x":"3defb785"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":40},{"t":"mc","h":"","q":"«Monuments of unageing intellect» بتشير لإيه؟","opts":["أعمال فنية وفكرية بتفضل من غير ما تهرم","مباني تاريخية في بيزنطة","كتب فلسفة يونانية بس"],"ans":0,"why":"أعمال الفن والفكر اللي مش بتخضع للشيخوخة.","n":1,"i":41,"ex":["صح: المقصود الفن والفكر المصنوع اللي بيقى عبر الزمن، ضد أجيال الطبيعة اللي بتموت.","غلط: مفيش وصف لمباني؛ الكلمة مجازية عن الأعمال اللي مش بتهرم.","غلط: الكلام عام على الفن والفكر، مش محصور في الفلسفة اليونانية."]},{"t":"mc","h":"","q":"«perne in a gyre» مرتبطة بإيه في فكر ييتس؟","opts":["الدورات الحلزونية اللي بيشرحها في A Vision","رقصة شعبية إيرلندية","حركة الكواكب في التنجيم"],"ans":0,"why":"بالدورات (gyres) في نظريته التاريخية.","n":1,"i":42,"ex":["صح: gyre هي اللولب/الدورة، وهي أساس نظريته في التاريخ في A Vision.","غلط: مفيش رقص هنا؛ الحركة رمزية.","غلط: الفلك مالوش علاقة بالمصطلح في سياق ييتس."]},{"t":"mc","h":"","q":"الطير الذهبي في المقطع الأخير بيرمز لإيه؟","opts":["فن أبدي مش خاضع لشروط الطبيعة","الحرية اللي بتيجي مع الطيران","سلطة الإمبراطور"],"ans":0,"why":"فن أبدي خارج الطبيعة والزمن.","n":1,"i":43,"ex":["صح: الطير مصنوع من دهب، مبيهرمش، وبيغني فوق الزمن — فن خرج من الطبيعة.","غلط: الطير هنا آلة فنية، مش طير حقيقي، ومفيش كلام عن حرية.","غلط: الإمبراطور مستفيد من الفن، مش هو المقصود بالرمز."]},{"t":"mc","h":"","q":"«fastened to a dying animal» بيوصف إيه؟","opts":["القلب مربوط بالجسد الفاني","الإنسان اللي بيحب الحيوانات","مرض الجسد"],"ans":0,"why":"ارتباط القلب بالجسد الفاني.","n":1,"i":44,"ex":["صح: القلب عيان من الشهوة ومربوط بالجسد اللي بيموت، وده سبب طلبه الخروج من الطبيعة.","غلط: التعبير مجازي عن الجسد البشري مش عن علاقة بحيوانات.","غلط: مش وصف مرضي، هو وصف وجودي."]},{"t":"tf","h":"","q":"ييتس كتب القصيدة وهو عايش في بيزنطة.","ans":false,"why":"غلط: ييتس ما زارش بيزنطة أبدًا. المدينة عنده رمز لوحدة الفن والدين والحياة، عرفها من الفسيفساء والكتب.","n":1,"i":45,"ex":["غلط. بيزنطة في القصيدة رمز، والرحلة روحية مش جغرافية.","صح، الجملة غلط: ييتس ما سافرش للمدينة."]},{"t":"tf","h":"","q":"المقطع الأخير بيقدّم الخلود الفني كحل من غير أي خسارة.","ans":false,"why":"غلط: الطير الذهبي بقي آلة بتغني لمصلحة حد تاني، ودفع تمنه خروجه من الطبيعة والحياة.","n":1,"i":46,"ex":["غلط. القصيدة فيها توتر: الخلود بيمنع الموت، بس بيمنع الحياة كمان.","صح، الجملة غلط: في القصيدة إحساس بالتكلفة مش احتفال."]},{"t":"recall","h":"","q":"اشرح إزاي القصيدة بتبني رحلة من بلد الشباب لفن أبدي.","a":"المقطع الأول بيرسم بلد الشباب: حضن، طير، سمك، أجيال بتتولد وتموت في «موسيقى حسية»، وفيها الكل بيتجاهل «آثار العقل اللي مش بيهرم». المقطع التاني بيشخص حالة العجوز: بالطو مرقع على عصاية، والحل إن الروح تغني وتدرس أعمال الفن، فتبدأ الرحلة لبيزنطة. المقطع التالت بيحوّل الرحلة لصلاة: الحكماء يخرجوا من النار والفسيفساء ويكونوا أساتذة غنا للروح، ويحرقوا القلب المربوط بجسد فاني، ويلمّوه في «صنعة الأبدية». المقطع الرابع بيحدد الشكل: طير من دهب مطروق على غصن دهب، بيغني للأمراء والستات عن الماضي والحاضر والجاي. يعني الرحلة تطور: رفض ← تشخيص ← صلاة ← تحول.","n":1,"i":47},{"t":"recall","h":"","q":"إيه الفرق بين «sensual music» و«artifice of eternity»؟","a":"الموسيقى الحسية هي موسيقى الطبيعة: الجسد والحواس والتكاثر، كلها مرتبطة بزمن وموت — «Whatever is begotten, born, and dies». اللي بيدخل فيها بيتجاهل الفن. أما «صنعة الأبدية» فهي الشيء المصنوع بإيد الإنسان، اللي بيخرج من دايرة التوالد والموت، والرمز بتاعه الطير الذهبي. الفرق بينهم مش بين حقيقي ومزيف، الفرق بين حياة بتموت وحياة مش بتموت — والقصيدة بتعرض تمن الاتنين.","n":1,"i":48},{"t":"write","h":"","q":"حلّل صورة الجسد في القصيدة.","key":"analysis-06:1","a":"الجسد في القصيدة بيتعرض في صورتين. في الأول جسد شباب: «The young / In one another’s arms»، أجساد بتلمس وبتتكاثر، وده اللي بيخلي المقطع الأول حار وحيوي. وفي المقابل جسد العجوز: «a paltry thing, / A tattered coat upon a stick» — هدوم على عصاية، فزاعة، حاجة اتسابت. وبعدين «fastened to a dying animal»: القلب مربوط بحيوان بيموت، يعني الجسد سجن مش بيت. المقطع الأخير بيحل المشكلة بحل جذري: شكل من دهب، «out of nature» — جسد مش بيتنفس بس مش بيموت. التطور ده هو حجة القصيدة: الجسد مشكلة، والفن طريقة لتحويله لمادة مش بتفنى.","n":1,"i":49},{"t":"write","h":"","q":"ناقش إيجابيات وسلبيات الخلود الفني زي ما القصيدة بتعرضهم.","key":"analysis-06:2","a":"الإيجابيات واضحة: الفن بيخرج من الزمن، «Monuments of unageing intellect» بتفضل، والطير الذهبي بيغني عن «what is past, or passing, or to come» — يعني بيشوف التلات أزمنة مع بعض، وده اللي الجسد الفاني مش قادر عليه. الفن كمان بيصحّي «a drowsy Emperor»، فله وظيفة اجتماعية. لكن القصيدة مش بتحتفل: الطير مصنوع، «artifice»، وواقف على غصن دهب بيغني لمصلحة حد تاني، فبقى تحفة في قصر. والثمن إنه خرج من الطبيعة نهائيًا: مفيش شهوة، مفيش أجيال، مفيش حياة. فالقصيدة بتوازن بين رغبة في الدوام وخوف من الموت اللي بييجي معاه — والجواب مش محسوم، وده اللي بيخليها قصيدة كبيرة.","n":1,"i":50},{"t":"end","h":"","teaser":"<div class=\"u\">كده Sailing to Byzantium خلصت: بلد للشباب، راجل عجوز، صلاة لنار وفسيفساء، وطير من دهب بيغني فوق الزمن.</div><div class=\"u\">الدرس الجاي: Helen لـ H.D. — نفس اسم هيلين اللي شفناها في ليدا، بس نظرة مختلفة تمامًا.</div>","extra":"المصادر: Yeats, “Sailing to Byzantium” (The Tower, 1928)؛ Yeats, A Vision (1925) لفكرة الدورات ووحدة الثقافة البيزنطية؛ الفسيفساء البيزنطية في رافينا وصقلية؛ إشارة بليك في صورة الروح اللي بتصفّق.","i":51}];</script>
