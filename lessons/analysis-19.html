<h1>تحليل ١٩: I Hear America Singing لوالتمن — أمريكا وهي بتغني</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">تحليل ١٩ من ٢٢</span><span class="tag"><span class="em">🖋️</span> تحليل القصائد المهمة</span></div>

<script>window.LESSON_ID="analysis-19";window.STEPS=[{"t":"learn","h":"<div class=\"u\">من غرفة موت في نيو إنجلاند، لأمريكا كلها بتغني. القصيدة دي مش عن فرد، هي عن جوقة.</div><div class=\"u\">القصيدة: I Hear America Singing لوالتمن — قصيدة قصيرة، 11 سطر، وكلها أصوات شغل.</div>","n":2,"i":0,"a":"analysis-19-001","x":"fcf43f05"},{"t":"section","h":"والتمن والسياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">والت والتمن <span class=\"en\">(Walt Whitman)</span>، 1819-1892، أمريكي، صاحب <span class=\"en\">Leaves of Grass</span>. اتكلمنا عنه في البلوك الحديث، وهنا بقى التركيز على الصوت الأمريكي والديمقراطية.</div>","n":1,"i":2,"a":"analysis-19-002","x":"9e8705a8"},{"t":"learn","h":"<div class=\"u\">القصيدة ظهرت أول مرة كرقم 20 في قسم <span class=\"en\">Chants Democratic</span> في طبعة 1860، والنسخة المشهورة من طبعة 1867.</div>","n":1,"i":3,"a":"analysis-19-003","x":"3d7bf326"},{"t":"learn","h":"<div class=\"u\">المشهد: الشاعر بيسمع أمريكا بتغني. مفيش مكان محدد، ولا وقت محدد — الأصوات بتيجي من ورشة، من مركب، من بيت، ومن حقل. الشغل هو اللي بيربطهم.</div>","n":1,"i":4,"a":"analysis-19-004","x":"f905e7f6"},{"t":"learn","h":"<div class=\"u\">الشكل: شعر حر <span class=\"en\">(free verse)</span> — مفيش وزن منتظم ولا قافية. السطور طويلة، بطول نفَس واحد، والقائمة <span class=\"en\">(catalog)</span> هي البناء.</div>","n":1,"i":5,"a":"analysis-19-005","x":"e7c7c4d3"},{"t":"tf","h":"","q":"القصيدة موزونة ومقفّاة بانتظام.","ans":false,"why":"غلط: شعر حر — مفيش وزن منتظم ولا قافية، والإيقاع من التكرار والقائمة.","n":1,"i":6,"ex":["غلط. القصيدة free verse.","صح، الجملة غلط: مفيش قافية منتظمة."]},{"t":"section","h":"السطور <span dir=\"ltr\">1-3</span>: البداية والميكانيكي والنجار","n":1,"i":7},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-3</span>:</div><div class=\"u\"><span class=\"en\">I hear America singing, the varied carols I hear, / Those of mechanics, each one singing his as it should be blithe and strong, / The carpenter singing his as he measures his plank or beam,</span></div>","n":2,"i":8,"a":"analysis-19-006","x":"53953bfd"},{"t":"learn","h":"<div class=\"u\">«بسمع أمريكا بتغني، الأناشيد المتنوعة اللي بسمعها»: كلمة <span class=\"en\">varied</span> من أول سطر هي الفكرة — مش صوت واحد، أصوات كتير. وكلمة <span class=\"en\">carols</span> دينية في الأصل، وهنا معناها أغاني فرح.</div>","n":1,"i":9,"a":"analysis-19-007","x":"8a5028c5"},{"t":"learn","h":"<div class=\"u\">«الميكانيكي كل واحد بيغني غناه، زي ما المفروض يكون: مبسوط وقوي»: الغنا هنا مش ترف، هو جزء من الشغل. والضمير <span class=\"en\">his</span> بيأكد إن كل واحد ليه صوته.</div>","n":1,"i":10,"a":"analysis-19-008","x":"ad6cfc43"},{"t":"learn","h":"<div class=\"u\">والنجار بيغني وهو بيقيس الخشب. الملاحظة دقيقة: الشغل نفسه هو اللي بيولّد الإيقاع — القياس، والنشر، والخبط.</div>","n":1,"i":11,"a":"analysis-19-009","x":"d7050671"},{"t":"section","h":"السطور <span dir=\"ltr\">4-7</span>: الحرف والمراكب والحقول","n":1,"i":12},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">4-5</span>:</div><div class=\"u\"><span class=\"en\">The mason singing his as he makes ready for work, or leaves off work, / The boatman singing what belongs to him in his boat, the deckhand singing on the steamboat deck,</span></div>","n":2,"i":13,"a":"analysis-19-010","x":"99b7bbeb"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">6-7</span>:</div><div class=\"u\"><span class=\"en\">The shoemaker singing as he sits on his bench, the hatter singing as he stands, / The wood-cutter’s song, the ploughboy’s on his way in the morning, or at noon intermission or at sundown,</span></div>","n":2,"i":14,"a":"analysis-19-011","x":"1f8b9177"},{"t":"learn","h":"<div class=\"u\">القائمة بتتوسع: بنّاء، صاحب مركب، بحّار على سطح باخرة، صانع أحذية قاعد، صانع قبعات واقف. كل حرفة ليها وضع جسماني مختلف — قاعد، واقف، ماشي.</div>","n":1,"i":15,"a":"analysis-19-012","x":"20589d4d"},{"t":"learn","h":"<div class=\"u\">ولاحظ إن الشغل بيبدأ وينتهي، والغنا مع الاتنين: «makes ready for work, or leaves off work». الغنا مش في وقت الشغل بس، هو في حياة الشغّال كلها.</div>","n":1,"i":16,"a":"analysis-19-013","x":"48d478d4"},{"t":"learn","h":"<div class=\"u\">والوقت بيظهر هنا: الصبح، والاستراحة نص النهار، والغروب. القصيدة بتحط الغنا على مدار اليوم كله، زي ما بتحطه على كل المهن.</div>","n":1,"i":17,"a":"analysis-19-014","x":"3b1196a8"},{"t":"section","h":"السطور <span dir=\"ltr\">8-11</span>: البيت والليل","n":1,"i":18},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">8-11</span>:</div><div class=\"u\"><span class=\"en\">The delicious singing of the mother, or of the young wife at work, or of the girl sewing or washing, / Each singing what belongs to him or her and to none else, / The day what belongs to the day—at night the party of young fellows, robust, friendly, / Singing with open mouths their strong melodious songs.</span></div>","n":2,"i":19,"a":"analysis-19-015","x":"a913aa21"},{"t":"mc","h":"","q":"«Each singing what belongs to him or her and to none else» معناها إيه؟","opts":["كل واحد بيغني اللي بيخصه هو، وصوته مش تابع لغيره","كل واحد بيغني نفس الأغنية","الأغاني ملك الشاعر"],"ans":0,"why":"كل واحد ليه صوته وشغله الخاص.","n":1,"i":20,"ex":["صح: الفردية جوه الجوقة هي فكرة القصيدة الأساسية.","غلط: القصيدة بتقول العكس — الأصوات مختلفة.","غلط: مفيش ملكية للشاعر هنا؛ الأغاني للناس."]},{"t":"learn","h":"<div class=\"u\">وبعد الشغل اليدوي في الورش، الصوت بيدخل البيت: الأم، والزوجة الشابة، والبنت اللي بتخيط أو بتغسل. القصيدة بتوسّع تعريف الشغل عشان يشمل البيت.</div>","n":1,"i":21,"a":"analysis-19-016","x":"d52d7816"},{"t":"tf","h":"","q":"القصيدة بتحتفل بالعمل اليدوي.","ans":true,"why":"صح: كل الحرف اليدوية موجودة، والغنا مرتبط بالشغل نفسه.","n":1,"i":22,"ex":["صح، الجملة صح: العمل هو محور القصيدة.","غلط. الشغل هو الموضوع الأساسي."]},{"t":"learn","h":"<div class=\"u\">والسطر المفتاحي: «كل واحد بيغني اللي بيخصه هو أو هي، ومش بيخص حد تاني» <span class=\"en\">(to none else)</span>. ده أساس الديمقراطية في القصيدة: جوقة من أصوات فردية، مش صوت واحد بيمثل الكل.</div>","n":1,"i":23,"a":"analysis-19-017","x":"1aa8a080"},{"t":"mc","h":"","q":"مين اللي بيغني في القصيدة؟","opts":["شغّالين في حرف مختلفة، وستات في البيت، وشباب بالليل","مطربين محترفين","جنود"],"ans":0,"why":"شغّالين وستات وشباب.","n":1,"i":24,"ex":["صح: ميكانيكي، نجار، بنّاء، صياد، إسكافي، وأم وزوجة وبنت، وبعدين الشباب.","غلط: مفيش مطربين محترفين في القصيدة.","غلط: مفيش أي ذكر للجيش."]},{"t":"learn","h":"<div class=\"u\">«النهار للي بيخص النهار — وبالليل جماعة الشباب، أقوياء وودودين، بيغنوا ببق مفتوح أغانيهم القوية الجميلة»: الليل بقى للاحتفال، والشباب بيكمّلوا الجوقة.</div>","n":1,"i":25,"a":"analysis-19-018","x":"2c27f575"},{"t":"learn","h":"<div class=\"u\">و«ببق مفتوح» <span class=\"en\">(with open mouths)</span> صورة جسدية للغنا: مش صوت خافت ولا خجل، هو إعلان.</div>","n":1,"i":26,"a":"analysis-19-019","x":"806d25e8"},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":27},{"t":"learn","h":"<div class=\"u\">القائمة <span class=\"en\">(catalog)</span>: القصيدة مبنية على تعداد. كل سطر بيضيف حرفة، والقوة جاية من التراكم — نفس أسلوب والتمن في Leaves of Grass.</div>","n":1,"i":28,"a":"analysis-19-020","x":"a4fc7f9a"},{"t":"learn","h":"<div class=\"u\">التكرار <span class=\"en\">(anaphora)</span> في كلمة <span class=\"en\">singing</span>: بتتكرر في كل سطر تقريبًا، فالكلمة نفسها بتبقى إيقاع زي الطبلة.</div>","n":1,"i":29,"a":"analysis-19-021","x":"bf625c1a"},{"t":"learn","h":"<div class=\"u\">السطور الطويلة: مفيش وزن منتظم، والسطر بيطول لحد ما الفكرة تخلص. ده بيخلي القصيدة تبدو زي كلام بيتقال بنفَس واحد — قريب من الخطابة.</div>","n":1,"i":30,"a":"analysis-19-022","x":"32211c74"},{"t":"mc","h":"","q":"السطور الطويلة بلا وزن منتظم بتعمل إيه؟","opts":["بتدّي إحساس بكلام بنفَس واحد قريب من الخطابة","بتصعّب القراءة عن قصد","بتخلي القصيدة أغنية"],"ans":0,"why":"إحساس بكلام بنفَس واحد.","n":1,"i":31,"ex":["صح: الإيقاع جاي من التعداد والتكرار مش من الوزن.","غلط: مفيش تعقيد مقصود؛ البساطة أساس الأسلوب.","غلط: الأغنية هنا موضوع القصيدة، مش شكلها."]},{"t":"learn","h":"<div class=\"u\">الموضوعات: كرامة العمل، والديمقراطية كأصوات متعددة، والهوية الأمريكية، والفرح في الشغل. وبعض القراءات بتشوف إن الصورة مثالية أكتر من الواقع: الستات هنا في البيت، ومفيش عمالة قسرية ولا فقر.</div>","n":1,"i":32,"a":"analysis-19-023","x":"c6e8de5d"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":33},{"t":"mc","h":"","q":"إيه شكل القصيدة؟","opts":["شعر حر بلا وزن منتظم ولا قافية، مبني على قائمة","سونيتة","شعر موزون مقفّى"],"ans":0,"why":"شعر حر مبني على قائمة.","n":1,"i":34,"ex":["صح: free verse + catalog، والسطور طويلة بطول نفَس واحد.","غلط: مفيش شكل سونيتة هنا.","غلط: مفيش وزن ولا قافية منتظمة."]},{"t":"recall","h":"","q":"اشرح إزاي القصيدة بتبني صورة أمريكا من الأصوات.","a":"القصيدة بتبدأ بإعلان: «I hear America singing» — أمريكا بتغني، والأغاني «varied». وبعدين بتعدّ المهن: ميكانيكي، نجار، بنّاء، صاحب مركب، بحّار، إسكافي، صانع قبعات، حطّاب، وراعي محراث. وبعدين بتوسّع الدايرة للبيت: الأم، والزوجة الشابة، والبنت اللي بتخيط أو بتغسل. وفي الآخر الشباب بالليل بيغنوا ببق مفتوح. الرابط بينهم إن كل واحد بيغني «what belongs to him or her and to none else» — يعني أمريكا عند والتمن مش صوت واحد، هي مجموع أصوات مستقلة بتشتغل. والصورة بتكتمل بالوقت: صبح، نص نهار، غروب، وليل.","n":1,"i":35},{"t":"recall","h":"","q":"إيه وظيفة التكرار والقائمة في القصيدة؟","a":"القائمة هي البناء: كل سطر بيضيف حرفة جديدة، فالقصيدة بتتقدم بالتراكم مش بالحكاية. والتكرار في «singing» بيعمل إيقاع بديل عن الوزن — زي طبلة بتضرب في كل سطر. وكمان التكرار بيثبت الفكرة: الغنا مش حدث، هو حالة مستمرة في كل مكان. ولما القائمة توصل للستات في البيت، بيبقى التعداد نفسه بيوسّع تعريف العمل من غير ما الشاعر يقول «وأنا كمان بقصد الستات». يعني الشكل بيعمل الشغل بدل الشرح.","n":1,"i":36},{"t":"write","h":"","q":"حلّل القائمة (catalog) ودورها في القصيدة.","key":"analysis-19:1","a":"القائمة عند والتمن مش تفصيل أسلوبي، هي طريقة تفكير. القصيدة بتعدّ المهن واحدة ورا التانية بترتيب شبه عشوائي: ميكانيكي، نجار، بنّاء، صاحب مركب، بحّار، إسكافي، صانع قبعات، حطّاب، راعي محراث، وبعدين الستات في البيت. الترتيب ده بيدي إحساس بالامتلاء بدل التسلسل. وكل بند في القائمة فيه تفصيل جسماني صغير: بيقيس الخشب، قاعد على الدكة، واقف، ماشي في طريقه. التفاصيل دي بتمنع القائمة من إنها تبقى أسماء جافة. والقائمة بتحقق فكرة الديمقراطية شكليًا: مفيش حرفة أهم من حرفة، وكلها في نفس المستوى من السطر.","n":1,"i":37},{"t":"write","h":"","q":"ناقش القصيدة كتعبير ديمقراطي، وحدود الصورة دي.","key":"analysis-19:2","a":"القصيدة ديمقراطية في بنيتها: مفيش بطل، مفيش ترتيب هرمي، وكل حرفة بتاخد سطرها. والسطر المفتاحي «Each singing what belongs to him or her and to none else» بيحط الفردية كأساس للجماعة — أمريكا جوقة من أصوات مستقلة. وكلمة «or her» مهمة، لأنها بتدخل الستات في الصورة. لكن الصورة ليها حدود: الستات ظهرن في أدوار البيت (أم، زوجة، بنت بتخيط أو بتغسل) مش في الورش، ومفيش في القصيدة عمالة قسرية ولا فقر ولا بطالة، وكل الشغّالين مبسوطين. فالصورة مثالية، وهي تعبير عن أمل ديمقراطي أكتر من وصف اجتماعي. وبعض القراءات بتشوف إن القصيدة بتعمل أمريكا كفكرة، وبعضها بيشوف إن جمالها في نية الاحتفال مش في دقته.","n":1,"i":38},{"t":"end","h":"","teaser":"<div class=\"u\">كده I Hear America Singing خلصت: ميكانيكي ونجار وبنّاء وستات في البيت، وكله بيغني.</div><div class=\"u\">الدرس الجاي: Live-Oak Growing لوالتمن — شجرة بلوط وحيدة، والشاعر بيقارن نفسه بيها.</div>","extra":"المصادر: Walt Whitman, “I Hear America Singing” (Leaves of Grass, 1860/1867)؛ مصطلحات: free verse, catalog, anaphora.","i":39}];</script>
