<script>window.LESSON_ID="poetry-15";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة أداة ممتعة: إزاي الشاعر بيخلي الحاجات (الموت، الرياح، البحر) تتصرف زي البني آدمين! <span class=\"em\"><span class=\"em\">😮</span></span></div>", "n": 1, "i": 0, "a": "poetry-15-001", "x": "0f784538"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: النقطة الأولى — إيه هو الـ <span class=\"en\">personification</span>؟ <span class=\"em\"><span class=\"em\">🤔</span></span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١) التعريف</div><div class=\"u\">١.١ الـ <span class=\"en\">personification</span> (تشخيص) = إنك تتكلم عن حاجة مش إنسان (فكرة، شيء، مكان، طبيعة) كأنها إنسان: بتحس وبتتكلم وبتتحرك زي البشر.</div><div class=\"u\">١.٢ الكلمة جاية من <span class=\"en\">person</span> يعني \"شخص\".</div><div class=\"u\">١.٣ هو نوع من الاستعارة (الدرس اللي فات): بنقول \"الشمس هي إنسان\" بدون <span class=\"en\">like.</span></div><div class=\"u\">٢) أمثلة بسيطة (من تأليفي للتوضيح) <span class=\"em\"><span class=\"em\">🌞</span></span></div>", "n": 5, "i": 2, "a": "poetry-15-002", "x": "de91b481"}, {"t": "learn", "h": "<div class=\"u\">٢.١ \"<span class=\"en\">The wind whispered through the trees.</span>\" (الرياح همست) <span class=\"em\"><span class=\"em\">←</span></span> الرياح مش بتهمس، دي صفة إنسان.</div><div class=\"u\">٢.٢ \"<span class=\"en\">The sun smiled down on us.</span>\" (الشمس ابتسمت)</div><div class=\"u\">٢.٣ \"<span class=\"en\">Time is a thief.</span>\" (الوقت حرامي) <span class=\"em\"><span class=\"em\">←</span></span> الوقت مش حرامي بس بنديله صفة إنسان.</div><div class=\"u\">٢.٤ بالعربي: \"الليل يمد ستاره\"، \"الأرض بتنادينا\"، \"الشمس بتصحى\".</div>", "n": 4, "i": 3, "a": "poetry-15-003", "x": "5c4ea5b5"}, {"t": "mc", "h": "", "q": "أنهي جملة فيها <span class=\"en\">personification</span>؟", "nq": 1, "opts": ["<span class=\"en\">The wind whispered through the trees</span>", "<span class=\"en\">The wind was cold</span>", "<span class=\"en\">The wind is like a wolf</span>"], "ans": 0, "why": "<span class=\"en\">The wind whispered through the trees</span>", "ex": ["صح: الرياح مش بتهمس، دي صفة إنسان.", "غلط: ده وصف عادي.", "غلط: ده تشبيه فيه <span class=\"en\">like</span>."], "i": 4}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: النقطة التانية — اللي بيتشخص عادةً (حسب المصدر) <span class=\"em\"><span class=\"em\">📚</span></span>", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">١) أنواع اللي الشعراء بيشخصوه</div><div class=\"u\">١.١ أماكن: مدن، بلاد، قارات (مصر \"الأم\"، لندن \"السيدة\").</div><div class=\"u\">١.٢ عناصر الطبيعة: الأشجار، الفصول، الرياح، الأربع عناصر.</div><div class=\"u\">١.٣ أفكار مجردة: الموت، الفضائل، الخطايا، والإلهام (الـ <span class=\"en\">Muses</span> التسعة، آلهة الإلهام عند اليونان).</div><div class=\"u\">٢) ليه؟</div><div class=\"u\">٢.١ بيقرّب الفكرة المجردة (الموت) لعقلك: ساعات الموت بقى \"ضيف\" بتتكلم معاه.</div>", "n": 6, "i": 6, "a": "poetry-15-004", "x": "92e60e18"}, {"t": "mc", "h": "", "q": "من اللي الشعراء بيشخّصوه عادةً؟", "nq": 1, "opts": ["أماكن وعناصر طبيعة وأفكار مجردة زي الموت", "البشر بس", "الأرقام بس"], "ans": 0, "why": "أماكن وعناصر طبيعة وأفكار مجردة زي الموت", "ex": ["صح: أماكن، طبيعة، أفكار مجردة (الموت، الإلهام).", "غلط: التشخيص معناه تتكلم عن حاجة مش إنسان كأنها إنسان.", "غلط: الأرقام مش من الأمثلة."], "i": 7}, {"t": "learn", "h": "<div class=\"u\">٢.٢ بيدّي مشاعر للحاجات: الريح بتصرخ = الجو مخيف.</div><div class=\"u\">٢.٣ في الحضارات القديمة: اليونانيين والرومان كان عندهم آلهة هي تجسيد لأفكار (البحر، الشمس، النصر، الموت).</div>", "n": 2, "i": 8, "a": "poetry-15-005", "x": "8e611649"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: النقطة التالتة — مثال كبير: الموت ضيف <span class=\"em\"><span class=\"em\">🎩🐎</span></span>", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">١) <span class=\"en\">Emily Dickinson</span>، قصيدة \"<span class=\"en\">Because I could not stop for Death</span>\":</div><div class=\"u\">\"<span class=\"en\">Because I could not stop for Death</span> — / <span class=\"en\">He kindly stopped for me</span> — / <span class=\"en\">The Carriage held but just Ourselves</span> — / <span class=\"en\">And Immortality.</span>\"</div><div class=\"u\">٢) الشرح خطوة خطوة</div><div class=\"u\">٢.١ \"<span class=\"en\">Death</span>\" بيوقف عربية خيل (<span class=\"en\">carriage</span>) قدامها ويشيل الشاعرة: ده بيتصرف زي رجل مهذب.</div>", "n": 4, "i": 10, "a": "poetry-15-007", "x": "aa960b3a"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Because I could not stop for Death</span> لـ <span class=\"en\">Emily Dickinson</span>، الموت بيتصرف زي...", "nq": 1, "opts": ["رجل مهذب بيوقف عربية ويشيلها", "وحش مخيف بيطاردها", "طبيب بيعالجها"], "ans": 0, "why": "رجل مهذب بيوقف عربية ويشيلها", "ex": ["صح: <span class=\"en\">He kindly stopped for me</span>، فعل وصفة إنسان محترم.", "غلط: القصيدة بتصور الموت مهذب مش مطارد.", "غلط: مفيش علاقة بالعلاج."], "i": 11}, {"t": "learn", "h": "<div class=\"u\">٢.٢ \"<span class=\"en\">kindly stopped for me</span>\": فعل \"<span class=\"en\">stopped</span>\" وصفة \"<span class=\"en\">kindly</span>\" (بلطف): صفات إنسان محترم.</div><div class=\"u\">٢.٣ \"<span class=\"en\">Immortality</span>\" برضه راكب معاهم كأنه شخص ثالث.</div><div class=\"u\">٢.٤ القصيدة بتشخّص الموت كـ \"ضيف رجل\" بياخد الشاعرة في رحلة هادية لقبرها، وبتشخّص الخلود برضه.</div><div class=\"u\">٣) المعنى والإحساس (قراءة)</div>", "n": 4, "i": 12, "a": "poetry-15-008", "x": "e4c20d98"}, {"t": "mc", "h": "", "q": "إيه الحاجة التانية اللي اتشخصت في نفس القصيدة؟", "nq": 1, "opts": ["<span class=\"en\">Immortality</span>", "<span class=\"en\">Carriage</span>", "<span class=\"en\">Ourselves</span>"], "ans": 0, "why": "<span class=\"en\">Immortality</span>", "ex": ["صح: <span class=\"en\">Immortality</span> (الخلود) راكب معاهم كأنه شخص ثالث.", "غلط: العربية شيء عادي في القصيدة.", "غلط: دي كلمة ضمير."], "i": 13}, {"t": "learn", "h": "<div class=\"u\">٣.١ الموت اللي بنخاف منه بقى مهذب وهادي. ده بيغيّر إحساسنا بالموت من رعب لهدوء (دي قراءة، وفيه ناس بتشوفه بنبرة هادية، حسب النقاد).</div><div class=\"u\">٣.٢ تشبيه: كأن حد بيعزمك على مشوار في عربيته، مش خاطف.</div>", "n": 2, "i": 14, "a": "poetry-15-009", "x": "92b24369"}, {"t": "learn", "h": "<div class=\"lead\">٤) مثال تاني من <span class=\"en\">Shakespeare</span> (<span class=\"en\">Sonnet 18</span>):</div><div class=\"u\">\"<span class=\"en\">Nor shall Death brag thou wander'st in his shade</span>\"</div><div class=\"u\">(ولا يتفاخر الموت إنك بتتمشى في ضله.)</div><div class=\"u\">٤.١ الموت هنا \"بيتفاخر\" (<span class=\"en\">brag</span>): ده فعل إنساني.</div><div class=\"u\">٤.٢ شكسبير بيقول: الموت مش هيقدر يتفاخر عليكي، لأن القصيدة هتخليكي خالدة. ده تحدي للموت، تخيل ملاكم بيستفز خصمه.</div>", "n": 4, "i": 15, "a": "poetry-15-010", "x": "c92f2b88"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Sonnet</span> 18: <span class=\"en\">Nor shall Death brag thou wander'st in his shade</span>، إيه الفعل الإنساني اللي اتنسب للموت؟", "nq": 1, "opts": ["<span class=\"en\">brag</span> (يتفاخر)", "<span class=\"en\">wander</span>", "<span class=\"en\">shade</span>"], "ans": 0, "why": "<span class=\"en\">brag</span> (يتفاخر)", "ex": ["صح: الموت بيتفاخر، وده فعل إنساني.", "غلط: <span class=\"en\">wander</span> ده فعل الحبيبة.", "غلط: <span class=\"en\">shade</span> اسم يعني ضل."], "i": 16}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: النقطة الرابعة — إزاي ألاقي التشخيص؟ وأحلله <span class=\"em\"><span class=\"em\">🔍</span></span>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">١) سؤالين سحريين</div><div class=\"u\">١.١ هل الحاجة دي مش إنسان؟ (ريح، موت، وقت)</div><div class=\"u\">١.٢ هل الشاعر بيديها فعل أو صفة أو إحساس إنساني؟ (تهمس، تبتسم، تتفاخر، تزور)</div><div class=\"u\">لو الإجابة نعم للاتنين، يبقى <span class=\"en\">personification.</span></div><div class=\"u\">٢) خطوات التحليل</div><div class=\"u\">٢.١ إيه الحاجة المشخّصة؟ ٢.٢ إيه الصفة الإنسانية؟ ٢.٣ إيه الإحساس اللي بيخلقه؟ ٢.٤ ليه اختار الشاعر الصورة دي؟</div><div class=\"u\">٣) فرق مهم <span class=\"em\"><span class=\"em\">⚠️</span></span></div>", "n": 7, "i": 18, "a": "poetry-15-011", "x": "8b8d620e"}, {"t": "learn", "h": "<div class=\"u\">٣.١ التشخيص ≠ <span class=\"en\">allegory</span> (القصة الرمزية). التشخيص = بيشخص حاجة واحدة. الـ <span class=\"en\">allegory</span> = قصة كاملة مليانة رموز. الاتنين بيتلخبطوا كتير حتى عند الدارسين.</div><div class=\"u\">٣.٢ التشخيص ≠ التشبيه: فيه مش بنقول \"زي إنسان\"، بنعامل الحاجة كإنسان.</div>", "n": 2, "i": 19, "a": "poetry-15-012", "x": "07fa0626"}, {"t": "mc", "h": "", "q": "الفرق بين <span class=\"en\">personification</span> و <span class=\"en\">allegory</span> إن...", "nq": 1, "opts": ["التشخيص بيشخص حاجة واحدة، والـ <span class=\"en\">allegory</span> قصة كاملة رمزية", "هما نفس الحاجة", "الـ <span class=\"en\">allegory</span> كلمة واحدة بس"], "ans": 0, "why": "التشخيص بيشخص حاجة واحدة، والـ <span class=\"en\">allegory</span> قصة كاملة رمزية", "ex": ["صح: التشخيص لحاجة واحدة، والـ <span class=\"en\">allegory</span> قصة رمزية كاملة.", "غلط: بيتلخبطوا كتير بس مش نفس الحاجة.", "غلط: الـ <span class=\"en\">allegory</span> قصة مش كلمة."], "i": 20}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅</span></span>", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">١) الملخص</div><div class=\"u\">١.١ <span class=\"en\">personification</span> = حاجة مش إنسان بتتصرف كإنسان.</div><div class=\"u\">١.٢ بيتشخّص: أماكن، طبيعة، أفكار (الموت، الإلهام).</div><div class=\"u\">١.٣ <span class=\"en\">Dickinson</span>: الموت ضيف مهذب. <span class=\"en\">Shakespeare</span>: الموت \"بيتفاخر\".</div><div class=\"u\">١.٤ سؤالين: مش إنسان؟ وله صفة إنسانية؟</div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">✏️</span></span> تمرين</div><div class=\"u\">٢.١ طلّع التشخيص من: \"<span class=\"en\">The sun smiled down on us</span>\" و \"<span class=\"en\">Time is a thief</span>\"، وقول الصفة الإنسانية.</div>", "n": 7, "i": 22, "a": "poetry-15-013", "x": "44816f7c"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ في \"<span class=\"en\">Because I could not stop for Death</span>\": إيه الحاجتين المشخّصتين؟ (فكر: <span class=\"en\">Death</span> و ...)</div><div class=\"u\">٢.٣ اكتب ٣ جمل تشخيص من تأليفك عن حاجة من يومك (الميكروباص، الكورة، الامتحان) وحلل واحدة بالأربع خطوات.</div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح. <span class=\"em\"><span class=\"em\">✍️</span></span></div>", "n": 3, "i": 23, "a": "poetry-15-014", "x": "d441ee02"}, {"t": "recall", "h": "", "q": "إيه هو الـ <span class=\"en\">personification</span> بجملة واحدة؟", "a": "إنك تتكلم عن حاجة مش إنسان كأنها إنسان.", "n": 1, "i": 24}, {"t": "recall", "h": "", "q": "في \"<span class=\"en\">The wind whispered through the trees</span>\": إيه الصفة الإنسانية؟", "a": "<span class=\"en\">whispered</span> (بتهمس).", "n": 1, "i": 25}, {"t": "recall", "h": "", "q": "في قصيدة <span class=\"en\">Dickinson</span>: إيه الحاجتين المشخّصتين؟", "a": "<span class=\"en\">Death</span> (الموت) و <span class=\"en\">Immortality</span> (الخلود).", "n": 1, "i": 26}, {"t": "tf", "h": "", "q": "صح ولا غلط: التشخيص هو نفسه التشبيه لأن فيه <span class=\"en\">like.</span>", "ans": false, "why": "غلط. التشبيه بيقارن بـ <span class=\"en\">like/as</span>، والتشخيص بيعامل الحاجة كإنسان من غير مقارنة صريحة.", "n": 1, "i": 27, "ex": ["الجملة غلط. التشبيه بيقارن بـ <span class=\"en\">like</span>/<span class=\"en\">as</span>، والتشخيص بيعامل الحاجة كإنسان من غير مقارنة صريحة.", "صح، الجملة غلط. التشبيه بيقارن بـ <span class=\"en\">like</span>/<span class=\"en\">as</span>، والتشخيص بيعامل الحاجة كإنسان من غير مقارنة صريحة."]}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳</span></span> الدرس الجاي (الدرس ١٦): الصورة (<span class=\"en\">imagery</span>): الشاعر بيرسم بالكلمات، الحواس الخمسة.", "extra": "", "i": 28}];</script>
