<h1>الدرس ١٥: personification — التشخيص <span class="em">🧑‍🎤</span></h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس 15 من 16</span><span class="tag"><span class="em">📖</span> كورس الشعر</span></div>

<script>window.LESSON_ID="poetry-15";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة أداة ممتعة: إزاي الشاعر بيخلي الحاجات (الموت، الرياح، البحر) تتصرف زي البني آدمين! <span class=\"em\"><span class=\"em\">😮</span></span></div>", "n": 1, "i": 0, "a": "poetry-15-001", "x": "0f784538"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: النقطة الأولى — إيه هو الـ <span class=\"en\">personification</span>؟ <span class=\"em\"><span class=\"em\">🤔</span></span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١) التعريف</div><div class=\"u\">١.١ الـ <span class=\"en\">personification</span> (تشخيص) = إنك تتكلم عن حاجة مش إنسان (فكرة، شيء، مكان، طبيعة) كأنها إنسان: بتحس وبتتكلم وبتتحرك زي البشر.</div><div class=\"u\">١.٢ الكلمة جاية من <span class=\"en\">person</span> يعني \"شخص\". (<span class=\"en\">Wikipedia</span>: تمثيل أي شيء أو كائن أو فكرة كشخص أو بصفات شخص.)</div><div class=\"u\">١.٣ هو نوع من الاستعارة (الدرس اللي فات): بنقول \"الشمس هي إنسان\" بدون <span class=\"en\">like.</span></div><div class=\"u\">٢) أمثلة بسيطة (من تأليفي للتوضيح) <span class=\"em\"><span class=\"em\">🌞</span></span></div>", "n": 5, "i": 2, "a": "poetry-15-002", "x": "de91b481"}, {"t": "learn", "h": "<div class=\"u\">٢.١ \"<span class=\"en\">The wind whispered through the trees.</span>\" (الرياح همست) <span class=\"em\"><span class=\"em\">←</span></span> الرياح مش بتهمس، دي صفة إنسان.</div><div class=\"u\">٢.٢ \"<span class=\"en\">The sun smiled down on us.</span>\" (الشمس ابتسمت)</div><div class=\"u\">٢.٣ \"<span class=\"en\">Time is a thief.</span>\" (الوقت حرامي) <span class=\"em\"><span class=\"em\">←</span></span> الوقت مش حرامي بس بنديله صفة إنسان.</div><div class=\"u\">٢.٤ بالعربي: \"الليل يمد ستاره\"، \"الأرض بتنادينا\"، \"الشمس بتصحى\".</div>", "n": 4, "i": 3, "a": "poetry-15-003", "x": "5c4ea5b5"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: النقطة التانية — اللي بيتشخص عادةً (حسب المصدر) <span class=\"em\"><span class=\"em\">📚</span></span>", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">١) أنواع اللي الشعراء بيشخصوه</div><div class=\"u\">١.١ أماكن: مدن، بلاد، قارات (مصر \"الأم\"، لندن \"السيدة\").</div><div class=\"u\">١.٢ عناصر الطبيعة: الأشجار، الفصول، الرياح، الأربع عناصر.</div><div class=\"u\">١.٣ أفكار مجردة: الموت، الفضائل، الخطايا، والإلهام (الـ <span class=\"en\">Muses</span> التسعة، آلهة الإلهام عند اليونان).</div><div class=\"u\">٢) ليه؟</div><div class=\"u\">٢.١ بيقرّب الفكرة المجردة (الموت) لعقلك: ساعات الموت بقى \"ضيف\" بتتكلم معاه.</div>", "n": 6, "i": 5, "a": "poetry-15-004", "x": "92e60e18"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ بيدّي مشاعر للحاجات: الريح بتصرخ = الجو مخيف.</div><div class=\"u\">٢.٣ في الحضارات القديمة: اليونانيين والرومان كان عندهم آلهة هي تجسيد لأفكار (البحر، الشمس، النصر، الموت). (المصدر: <span class=\"en\">Wikipedia - Personification</span>)</div>", "n": 2, "i": 6, "a": "poetry-15-005", "x": "8e611649"}, {"t": "learn", "h": "<div class=\"u\">٣) <span class=\"em\"><span class=\"em\">🖼️</span></span> صورة مقترحة للكتاب: لوحة <span class=\"en\">Botticelli</span> \"<span class=\"en\">Calumny of Apelles</span>\" (حوالي ١٤٩٤-١٤٩٥) فيها ٨ شخصيات مشخّصة (أمل، ندم، خيانة، افتراء، خداع...): <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Personification\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Personification</a></div>", "n": 1, "i": 7, "a": "poetry-15-006", "x": "8b9beab5", "hide": true}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: النقطة التالتة — مثال كبير: الموت ضيف <span class=\"em\"><span class=\"em\">🎩🐎</span></span>", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">١) <span class=\"en\">Emily Dickinson</span>، قصيدة \"<span class=\"en\">Because I could not stop for Death</span>\":</div><div class=\"u\">\"<span class=\"en\">Because I could not stop for Death</span> — / <span class=\"en\">He kindly stopped for me</span> — / <span class=\"en\">The Carriage held but just Ourselves</span> — / <span class=\"en\">And Immortality.</span>\"</div><div class=\"u\">٢) الشرح خطوة خطوة</div><div class=\"u\">٢.١ \"<span class=\"en\">Death</span>\" بيوقف عربية خيل (<span class=\"en\">carriage</span>) قدامها ويشيل الشاعرة: ده بيتصرف زي رجل مهذب.</div>", "n": 4, "i": 9, "a": "poetry-15-007", "x": "aa960b3a"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ \"<span class=\"en\">kindly stopped for me</span>\": فعل \"<span class=\"en\">stopped</span>\" وصفة \"<span class=\"en\">kindly</span>\" (بلطف): صفات إنسان محترم.</div><div class=\"u\">٢.٣ \"<span class=\"en\">Immortality</span>\" برضه راكب معاهم كأنه شخص ثالث.</div><div class=\"u\">٢.٤ <span class=\"en\">Wikipedia</span> بتقول: القصيدة بتشخّص الموت كـ \"ضيف رجل\" بياخد الشاعرة في رحلة هادية لقبرها، وبتشخّص الخلود برضه.</div><div class=\"u\">٣) المعنى والإحساس (قراءة)</div>", "n": 4, "i": 10, "a": "poetry-15-008", "x": "e4c20d98"}, {"t": "learn", "h": "<div class=\"u\">٣.١ الموت اللي بنخاف منه بقى مهذب وهادي. ده بيغيّر إحساسنا بالموت من رعب لهدوء (دي قراءة، وفيه ناس بتشوفه بنبرة هادية، حسب النقاد).</div><div class=\"u\">٣.٢ تشبيه: كأن حد بيعزمك على مشوار في عربيته، مش خاطف.</div>", "n": 2, "i": 11, "a": "poetry-15-009", "x": "92b24369"}, {"t": "learn", "h": "<div class=\"lead\">٤) مثال تاني من <span class=\"en\">Shakespeare</span> (<span class=\"en\">Sonnet 18</span>):</div><div class=\"u\">\"<span class=\"en\">Nor shall Death brag thou wander'st in his shade</span>\"</div><div class=\"u\">(ولا يتفاخر الموت إنك بتتمشى في ضله.)</div><div class=\"u\">٤.١ الموت هنا \"بيتفاخر\" (<span class=\"en\">brag</span>): ده فعل إنساني.</div><div class=\"u\">٤.٢ شكسبير بيقول: الموت مش هيقدر يتفاخر عليكي، لأن القصيدة هتخليكي خالدة. ده تحدي للموت، تخيل ملاكم بيستفز خصمه.</div>", "n": 4, "i": 12, "a": "poetry-15-010", "x": "c92f2b88"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: النقطة الرابعة — إزاي ألاقي التشخيص؟ وأحلله <span class=\"em\"><span class=\"em\">🔍</span></span>", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">١) سؤالين سحريين</div><div class=\"u\">١.١ هل الحاجة دي مش إنسان؟ (ريح، موت، وقت)</div><div class=\"u\">١.٢ هل الشاعر بيديها فعل أو صفة أو إحساس إنساني؟ (تهمس، تبتسم، تتفاخر، تزور)</div><div class=\"u\">لو الإجابة نعم للاتنين، يبقى <span class=\"en\">personification.</span></div><div class=\"u\">٢) خطوات التحليل</div><div class=\"u\">٢.١ إيه الحاجة المشخّصة؟ ٢.٢ إيه الصفة الإنسانية؟ ٢.٣ إيه الإحساس اللي بيخلقه؟ ٢.٤ ليه اختار الشاعر الصورة دي؟</div><div class=\"u\">٣) فرق مهم <span class=\"em\"><span class=\"em\">⚠️</span></span></div>", "n": 7, "i": 14, "a": "poetry-15-011", "x": "8b8d620e"}, {"t": "learn", "h": "<div class=\"u\">٣.١ التشخيص ≠ <span class=\"en\">allegory</span> (القصة الرمزية). التشخيص = بيشخص حاجة واحدة. الـ <span class=\"en\">allegory</span> = قصة كاملة مليانة رموز. الاتنين بيتلخبطوا كتير حتى عند الدارسين. (المصدر: <span class=\"en\">Wikipedia - Personification.</span>)</div><div class=\"u\">٣.٢ التشخيص ≠ التشبيه: فيه مش بنقول \"زي إنسان\"، بنعامل الحاجة كإنسان.</div>", "n": 2, "i": 15, "a": "poetry-15-012", "x": "07fa0626"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅</span></span>", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">١) الملخص</div><div class=\"u\">١.١ <span class=\"en\">personification</span> = حاجة مش إنسان بتتصرف كإنسان.</div><div class=\"u\">١.٢ بيتشخّص: أماكن، طبيعة، أفكار (الموت، الإلهام).</div><div class=\"u\">١.٣ <span class=\"en\">Dickinson</span>: الموت ضيف مهذب. <span class=\"en\">Shakespeare</span>: الموت \"بيتفاخر\".</div><div class=\"u\">١.٤ سؤالين: مش إنسان؟ وله صفة إنسانية؟</div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">✏️</span></span> تمرين</div><div class=\"u\">٢.١ طلّع التشخيص من: \"<span class=\"en\">The sun smiled down on us</span>\" و \"<span class=\"en\">Time is a thief</span>\"، وقول الصفة الإنسانية.</div>", "n": 7, "i": 17, "a": "poetry-15-013", "x": "44816f7c"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ في \"<span class=\"en\">Because I could not stop for Death</span>\": إيه الحاجتين المشخّصتين؟ (فكر: <span class=\"en\">Death</span> و ...)</div><div class=\"u\">٢.٣ اكتب ٣ جمل تشخيص من تأليفك عن حاجة من يومك (الميكروباص، الكورة، الامتحان) وحلل واحدة بالأربع خطوات.</div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح. <span class=\"em\"><span class=\"em\">✍️</span></span></div>", "n": 3, "i": 18, "a": "poetry-15-014", "x": "d441ee02"}, {"t": "recall", "h": "", "q": "إيه هو الـ <span class=\"en\">personification</span> بجملة واحدة؟", "a": "إنك تتكلم عن حاجة مش إنسان كأنها إنسان.", "n": 1, "i": 19}, {"t": "recall", "h": "", "q": "في \"<span class=\"en\">The wind whispered through the trees</span>\": إيه الصفة الإنسانية؟", "a": "<span class=\"en\">whispered</span> (بتهمس).", "n": 1, "i": 20}, {"t": "recall", "h": "", "q": "في قصيدة <span class=\"en\">Dickinson</span>: إيه الحاجتين المشخّصتين؟", "a": "<span class=\"en\">Death</span> (الموت) و <span class=\"en\">Immortality</span> (الخلود).", "n": 1, "i": 21}, {"t": "tf", "h": "", "q": "صح ولا غلط: التشخيص هو نفسه التشبيه لأن فيه <span class=\"en\">like.</span>", "ans": false, "why": "غلط. التشبيه بيقارن بـ <span class=\"en\">like/as</span>، والتشخيص بيعامل الحاجة كإنسان من غير مقارنة صريحة.", "n": 1, "i": 22, "ex": ["الجملة غلط. التشبيه بيقارن بـ <span class=\"en\">like</span>/<span class=\"en\">as</span>، والتشخيص بيعامل الحاجة كإنسان من غير مقارنة صريحة.", "صح، الجملة غلط. التشبيه بيقارن بـ <span class=\"en\">like</span>/<span class=\"en\">as</span>، والتشخيص بيعامل الحاجة كإنسان من غير مقارنة صريحة."]}, {"t": "write", "h": "", "q": "(الفكرة) اشرح بأسلوبك يعني إيه <span class=\"en\">personification</span>، وليه الشعراء بيستخدموه (٣ أسباب)، وهات مثالين من عندك.", "key": "poetry-15:5", "n": 1, "i": 23}, {"t": "write", "h": "", "q": "(تحليل) حلل \"<span class=\"en\">He kindly stopped for me</span>\" و \"<span class=\"en\">Nor shall Death brag thou wander'st in his shade</span>\" بالأربع خطوات: الحاجة المشخّصة، الصفة الإنسانية، الإحساس، ليه اختارها الشاعر؟", "key": "poetry-15:6", "n": 1, "i": 24}, {"t": "write", "h": "", "q": "(إبداع) اكتب ٣ جمل تشخيص عن حاجة من يومك (الامتحان، الميكروباص، الكورة)، وحلل واحدة، وفرّق بين التشخيص والتشبيه بمثال.", "key": "poetry-15:7", "n": 1, "i": 25}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳</span></span> الدرس الجاي (الدرس ١٦): الصورة (<span class=\"en\">imagery</span>): الشاعر بيرسم بالكلمات، الحواس الخمسة.", "extra": "<span class=\"em\"><span class=\"em\">🔗</span></span> للتوسع (اتأكدت منهم): <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Personification\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Personification</a> ، <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Because_I_could_not_stop_for_Death\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Because_I_could_not_stop_for_Death</a>", "i": 26}];</script>
