<h1>الدرس M9: زيوس / جوبيتر، ملك الآلهة والشعر</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس M9</span><span class="tag"><span class="em">🏛️</span> كورس الميثولوجيا</span></div>

<script>window.LESSON_ID="myth-m9";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">🎣</span></span> أول حاجة: إيماءة واحدة تهز جبل</div><div class=\"u\">تخيل راجل عنده سلطة لدرجة إنه ميحتاجش يتكلم كتير ولا يهدد. بس يومل براسه، إيماءة صغيرة كده، فيهز الجبل اللي عايشين عليه الآلهة كلها.</div>", "n": 2, "i": 0, "a": "myth-m9-001", "x": "9e03c5d9"}, {"t": "learn", "h": "<div class=\"u\">مش خيال ده، ده مشهد حقيقي في الإلياذة. زيوس بيقول لتيتيس لما طلبت منه طلب: كلمتي مابترجعش، ولما أومأ براسي يبقى العهد اتختم. وبعدين يومل، فـ\"الجبل الكبير أوليمبوس اهتز\". (<span class=\"en\">Iliad 1.528-530</span>)</div><div class=\"u\">النهارده هنعرف مين زيوس: إزاي نجا من بطن أبوه، إزاي كسب عرش السما، وليه الشعراء الإنجليز من 700 سنة لحد دلوقتي مابيعرفوش يكتبوا من غيره.</div>", "n": 2, "i": 1, "a": "myth-m9-002", "x": "d7c265fb"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">👶</span></span> أولاً: الطفل اللي هرب من بطن أبوه</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ البيت المرعب</div><div class=\"li\">أبو زيوس هو كرونوس (<span class=\"en\">Cronus</span>)، ملك التييتنز (العمالقة الأوائل). وكرونوس سمع نبوءة من أبوه أورانوس والأرض جايا: ابن من ولادك هيقلعك من العرش، زي ما انت قلعت أبوك.</div><div class=\"li\">فكرونوس لقى حل بسيط ومرعب: كل ما مراته ريا (<span class=\"en\">Rhea</span>) تخلف، يبلع الطفل. بلع هيستيا، وديميتر، وهيرا، وهاديس، وبوسيدون. خمس أطفال في بطن أبوهم.</div>", "n": 4, "i": 2, "a": "myth-m9-003", "x": "1dbb95ba"}, {"t": "learn", "h": "<div class=\"li\">المصدر: هسيود، الثيوجونيا 453 وما بعدها (ترجمة <span class=\"en\">Evelyn-White</span>).</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ خطة الأم <span class=\"em\"><span class=\"em\">🗿</span></span></div><div class=\"li\">لما حان ميلاد زيوس، أصغر الولاد، ريا استغاثت بأبويها: الأرض (جايا) والسما (أورانوس).</div><div class=\"li\">الخطة: ريا تولد سراً في جزيرة كريت، والأرض تخبي الطفل في كهف في جبل إيجيون، وتديل كرونوس حجر ملفوف في قماط على إنه المولود.</div>", "n": 4, "i": 3, "a": "myth-m9-004", "x": "05c61cce"}, {"t": "learn", "h": "<div class=\"li\">كرونوس بلع الحجر من غير ما يبص. \"التعيس! ماكانش عارف إن مكان الحجر اتساب ابنه، غير مغلوب ولا مضايق\". (الثيوجونيا 453-491)</div><div class=\"li\"><span class=\"em\"><span class=\"em\">🔄</span></span> من الحياة: زي واحد بيبدل موبايل صاحبه المكسر بقالب طوب ملفوف في الكرتونة. الخدعة نجحت لأن الطمع عمى كرونوس عن التفتيش.</div><div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ الحجر اللي بقى أثر</div>", "n": 3, "i": 4, "a": "myth-m9-005", "x": "fca24632"}, {"t": "mc", "h": "", "q": "إيه الخدعة اللي عملتها ريا عشان تنقذ زيوس؟", "nq": 1, "opts": ["ادّت كرونوس حجر ملفوف في قماط على إنه المولود", "هربت بكل أولادها لكريت", "قتلت كرونوس وهو نايم"], "ans": 0, "why": "ادّت كرونوس حجر ملفوف في قماط على إنه المولود", "ex": ["صح: وكرونوس بلع الحجر من غير ما يبص.", "غلط: زيوس بس اللي اتخبّى.", "غلط: الخدعة كانت بالحجر."], "i": 5}, {"t": "learn", "h": "<div class=\"li\">لما زيوس كبر وغلب أبوه، كرونوس تقيأ اللي بلعه: أول حاجة طلعت الحجر (آخر حاجة اتبلعت)، وبعدين الأخوة الخمسة.</div><div class=\"li\">زيوس ثبت الحجر ده في دلفي (بيثو)، تحت جبل بارناسوس، \"علامة وأعجوبة للبشر\". يعني حجر الخدعة بقى مزار. (الثيوجونيا 492-500)</div><div class=\"li\">وأول شغلانة سياسية لزيوس: حرر عمومه المسجونين، السيكلوبس (عين واحدة) والهيكاتونخيريس (مية إيد).</div>", "n": 3, "i": 6, "a": "myth-m9-006", "x": "8dc20c3b"}, {"t": "learn", "h": "<div class=\"li\">ردوا له الجميل فوراً: ادوله الرعد والصاعقة والبرق، اللي كانت الأرض مخبياهم. \"بيهم بيحكم البشر والآلهة\". (الثيوجونيا 501-506)</div><div class=\"u\"><span class=\"em\"><span class=\"em\">⚔️</span></span> ثانياً: حرب العشر سنين (التيتانوماخيا)</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ الجيشان</div><div class=\"li\">من ناحية: التييتنز، الجيل القديم، على جبل أوثريس.</div><div class=\"li\">ومن الناحية التانية: زيوس وإخواته، ولاد كرونوس، على جبل أوليمبوس.</div>", "n": 5, "i": 7, "a": "myth-m9-007", "x": "06b92372"}, {"t": "learn", "h": "<div class=\"li\">\"فضلوا يتحاربوا بعناد عشر سنين كاملة، والصراع الصعب مالوش نهاية\". (الثيوجونيا 617-638، نسخة هسيود)</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ ورقة النصر</div><div class=\"li\">زيوس نزل العالم السفلي وحرر الهيكاتونخيريس: كائنات لكل واحد مية إيد وخمسين راس.</div><div class=\"li\">عشان يتخيل الحجم: كل واحد فيهم بيرمي صخور بمية إيد في نفس اللحظة. دي كانت المدفعية الثقيلة بتاعة الجيش. (الثيوجونيا 617 وما بعدها)</div><div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ النتيجة</div>", "n": 5, "i": 8, "a": "myth-m9-008", "x": "e1e52184"}, {"t": "learn", "h": "<div class=\"li\">التييتنز اتغلبوا واتحبسوا في التارتاروس، أعمق نقطة في الكون (العالم السفلي اللي اتكلمنا عنه قبل كده).</div><div class=\"li\">ومن يومها، بدأ عصر الأوليمبيين، الجيل الجديد بقيادة زيوس.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🎲</span></span> ثالثاً: القرعة الكونية</div><div class=\"li\">بعد النصر، الأخوة التلاتة قسموا المملكة. بوسيدون نفسه بيحكي في الإلياذة، الكتاب 15:</div>", "n": 4, "i": 9, "a": "myth-m9-009", "x": "5bcea71e"}, {"t": "mc", "h": "", "q": "فين اتحبس التييتنز بعد ما اتغلبوا؟", "nq": 1, "opts": ["في التارتاروس، أعمق نقطة في الكون", "على جبل أوليمبوس", "في جزيرة كريت"], "ans": 0, "why": "في التارتاروس، أعمق نقطة في الكون", "ex": ["صح: ومن يومها بدأ عصر الأوليمبيين.", "غلط: أوليمبوس بقى بيت زيوس وإخواته.", "غلط: كريت هي مكان ولادة زيوس."], "i": 10}, {"t": "learn", "h": "<div class=\"u\">\"إحنا تلاتة إخوة، ولاد كرونوس وريا: زيوس وأنا، وتالتهم هاديس مولى الأموات. والكون كله اتقسم تلاتة، وكل واحد ليه نصيبه. أنا لما القرعة اتهزت كسبت البحر الرمادي مسكناً للأبد، وهاديس كسب الظلام الكئيب، وزيوس كسب السما الواسعة وسط الهواء والسحاب.\" (<span class=\"en\">Iliad 15.187-193</span>، ترجمة <span class=\"en\">Murray</span>)</div>", "n": 1, "i": 11, "a": "myth-m9-010", "x": "9876d8fd"}, {"t": "learn", "h": "<div class=\"li\">يعني: البحر لبوسيدون، العالم السفلي لهاديس، السما لزيوس. والأرض وأوليمبوس مشتركة بين الكل.</div><div class=\"li\"><span class=\"em\"><span class=\"em\">⚠️</span></span> ملحوظة \"الأسطورة نسخ\": الشاعر الإسكندراني كاليماخوس بعدها بقرون سخر من قصة القرعة: \"مين اللي يعمل قرعة على أوليمبوس والهاوية؟ زيوس بقى ملك بأفعال إيديه، مش بالحظ\".</div><div class=\"li\">شفت؟ حتى فكرة القرعة نفسها ليها معارضين قدام.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">👑</span></span> رابعاً: أبو الآلهة والبشر</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ اللقب الرسمي</div>", "n": 5, "i": 12, "a": "myth-m9-011", "x": "0187d419"}, {"t": "mc", "h": "", "q": "إزاي اتقسم الكون بين الإخوة التلاتة بحسب بوسيدون في الإلياذة؟", "nq": 1, "opts": ["البحر لبوسيدون، العالم السفلي لهاديس، السما لزيوس", "البحر لزيوس، السما لهاديس", "السما لبوسيدون، البحر لهاديس"], "ans": 0, "why": "البحر لبوسيدون، العالم السفلي لهاديس، السما لزيوس", "ex": ["صح: وبالقرعة.", "غلط: زيوس خد السما.", "غلط: هاديس خد العالم السفلي."], "i": 13}, {"t": "learn", "h": "<div class=\"li\">في الثيوجونيا، هسيود بيسمي زيوس \"أبو الآلهة والبشر\".</div><div class=\"li\">اللقب ده، <span class=\"en\">father of gods and men</span>، هتلاقيه متكرر في كل قصيدة ملحمية يونانية، وبعدها في كل شعر إنجليزي كلاسيكي.</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ مشهد التيتيس والإيماءة <span class=\"em\"><span class=\"em\">🤝</span></span></div><div class=\"li\">في أول الإلياذة، البحرية تيتيس (أم أخيل) بتطلع أوليمبوس ترجو زيوس ينتقم لابنها. شاعر إنجليزي وصف المشهد، ألكسندر بوب في ترجمته المشهورة للإلياذة (1715-1720):</div>", "n": 4, "i": 14, "a": "myth-m9-012", "x": "ca283c12"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">_____ of gods and men</div>", "opts": ["sleepless", "worlds", "father"], "ans": 2, "why": "<span class=\"en\">father of gods and men</span>", "i": 15}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Suppliant the goddess stood</span>: <span class=\"en\">one hand she placed</span></div><div class=\"u\"><span class=\"en\">Beneath his beard,</span> <span class=\"en\">and one his knees embraced.</span>\"</div><div class=\"u\">(واقفة كمتوسلة: إيد تحت دقنه، وإيد بتعانق ركبته. دي كانت وضعية التوسل الرسمية عند الإغريق.)</div><div class=\"li\">زيوس وافق، وبعدين يقول الجملة اللي تلخص سلطته: كلمتي لما أومأ عليها براسي مابترجعش ولا بتتحنى. وبعدين:</div>", "n": 4, "i": 16, "a": "myth-m9-013", "x": "15abbf08"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">As he spoke the son of Kronos bowed his dark brows,</span> <span class=\"en\">and the ambrosial locks swayed on his immortal head,</span> <span class=\"en\">till vast Olympus reeled.</span>\"</div><div class=\"u\">(ومل براسه، فتمايلت خصل شعره الخالدة، حتى أوليمبوس العظيم اهتز.) (<span class=\"en\">Iliad 1.528-530</span>، ترجمة <span class=\"en\">Butler</span>)</div><div class=\"li\">الدرس: سلطة زيوس مش في الصاعقة، في الكلمة. إيماءة زيوس = عقد مقدس لا يُفسخ.</div><div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ الميزان الذهبي <span class=\"em\"><span class=\"em\">⚖️</span></span></div>", "n": 4, "i": 17, "a": "myth-m9-014", "x": "76db1fe8"}, {"t": "mc", "h": "", "q": "سلطة زيوس في مشهد تيتيس مبنية على إيه؟", "nq": 1, "opts": ["إيماءة وكلمة ما بترجعش", "الصاعقة بس", "جيش كبير"], "ans": 0, "why": "إيماءة وكلمة ما بترجعش", "ex": ["صح: وبعدها أوليمبوس اهتز.", "غلط: المشهد مش عن الصاعقة.", "غلط: مفيش جيش في المشهد."], "i": 18}, {"t": "learn", "h": "<div class=\"li\">في الإلياذة الكتاب التامن، والمعركة والاقفة، زيوس بيطلع ميزان من دهب:</div><div class=\"u\">\"<span class=\"en\">Then verily the Father lifted on high his golden scales,</span> <span class=\"en\">and set therein two fates of grievous death,</span> <span class=\"en\">one for the horse-taming Trojans,</span> <span class=\"en\">and one for the brazen-coated Achaeans.</span>.. <span class=\"en\">and down sank the day of doom of the Achaeans.</span>\"</div>", "n": 2, "i": 19, "a": "myth-m9-015", "x": "00473f05"}, {"t": "learn", "h": "<div class=\"u\">(الأب رفع ميزانه الذهبي، وحط فيه قدرين للموت: واحد للطرواديين وواحد للإغريق، فهبطت كفة الإغريق.) (<span class=\"en\">Iliad 8.69-77</span>، ترجمة <span class=\"en\">Murray</span>)</div><div class=\"li\">الصورة دي، الميزان اللي فيه مصير الشعوب، هتفضل شغالة في الفن والشعر والزخرفة لحد النهارده. كل ما تشوف ميزان عدالة، افتكر إن الأصل الأدبي ليه هنا: ميزان المصير.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🎭</span></span> خامساً: زيوس عند التراجيديين، من القوة للحكمة</div>", "n": 3, "i": 20, "a": "myth-m9-016", "x": "039da974"}, {"t": "learn", "h": "<div class=\"li\">إسخيلوس، مؤسس المسرح التراجيدي، في مسرحية \"أجاممنون\" (458 قبل الميلاد)، بيخلي الكورس يغني أغنية غريبة ومؤثرة:</div><div class=\"u\">\"<span class=\"en\">Zeus,</span> <span class=\"en\">whoever he may be,</span> <span class=\"en\">if by this name it pleases him to be invoked,</span> <span class=\"en\">by this name I call to him.</span> <span class=\"en\">As I weigh all things in the balance,</span> <span class=\"en\">I have nothing to compare save Zeus.</span>..\"</div>", "n": 2, "i": 21, "a": "myth-m9-017", "x": "85986d87"}, {"t": "learn", "h": "<div class=\"u\">(زيوس، أياً كان مين هو، لو الاسم ده بيرضيه، بالاسم ده بنده عليه. مهما وزنت كل حاجة في الميزان، مفيش حاجة تتقارن بيه إلا زيوس.) (<span class=\"en\">Agamemnon 160-166</span>، ترجمة <span class=\"en\">Smyth</span>)</div><div class=\"li\">وبعدين تجي الجملة الأشهر في المسرحية كلها: زيوس \"وضع قانون ثابت إن الحكمة تجي بالألم\"، <span class=\"en\">wisdom comes by suffering</span>، باليوناني <span class=\"en\">pathei mathos.</span></div>", "n": 2, "i": 22, "a": "myth-m9-018", "x": "e54478ae"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">wisdom _____ by suffering</div>", "opts": ["comes", "slaves", "balance"], "ans": 0, "why": "<span class=\"en\">wisdom comes by suffering</span>", "i": 23}, {"t": "learn", "h": "<div class=\"li\">لاحظ التطور: زيوس هنا مش راجل الصواعق بس، ده بقى رمز للنظام الأخلاقي للكون: اللي بيعلم البشر بالمعاناة. دي نقطة هتنفعك جداً لما تذاكر التراجيديا.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🏛️</span></span> سادساً: زيوس يتنقل لروما، ويدخل اللغة</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ <span class=\"en\">Jupiter</span> / <span class=\"en\">Jove</span></div><div class=\"li\">الرومان سموه جوبيتر (<span class=\"en\">Jupiter</span>)، وفي الشعر الإنجليزي هتلاقيه غالباً باسم مختصر: <span class=\"en\">Jove</span> (جوف).</div>", "n": 4, "i": 24, "a": "myth-m9-019", "x": "def0f54c"}, {"t": "mc", "h": "", "q": "إيه معنى الفكرة اللي عند إسخيلوس: <span class=\"en\">wisdom comes by suffering</span>؟", "nq": 1, "opts": ["الحكمة بتيجي بالألم", "الحكمة بتيجي بالقوة", "الحكمة بتيجي بالفلوس"], "ans": 0, "why": "الحكمة بتيجي بالألم", "ex": ["صح: وباليوناني <span class=\"en\">pathei mathos</span>.", "غلط: النص بيقول الألم.", "غلط: النص بيقول الألم."], "i": 25}, {"t": "learn", "h": "<div class=\"li\">اسم زيوس واسم جوبيتر بيرجعوا الاتنين لجذر هندوأوروبي قديم جداً (*<span class=\"en\">dyeu-</span>) معناه \"السما المضيئة / نور النهار\". يعني من الاسم نفسه، زيوس هو إله السما.</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ <span class=\"en\">by Jove</span>!</div><div class=\"li\">تعبير إنجليزي قديم للقسم: <span class=\"en\">by Jove</span>! (أقسم بجوف!). وكان قسم حقيقي وبعدين بقى تعبير مهذب للدهشة.</div>", "n": 3, "i": 26, "a": "myth-m9-020", "x": "df7435fc"}, {"t": "learn", "h": "<div class=\"li\">شكسبير نفسه استخدمه: في \"<span class=\"en\">Love's Labour's Lost</span>\" (5.2): \"<span class=\"en\">By Jove,</span> <span class=\"en\">I always took three threes for nine.</span>\" وفي \"<span class=\"en\">Antony and Cleopatra</span>\" (3.13): \"<span class=\"en\">Favours,</span> <span class=\"en\">by Jove that thunders</span>!\"</div><div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ <span class=\"en\">jovial</span> = مرح</div><div class=\"li\">كلمة <span class=\"en\">jovial</span> (بشوش، مرح، قلبه أبيض) جاية من <span class=\"en\">Jove</span>! ليه؟ لأن المنجمين القدام كانوا معتقدين إن اللي اتولد تحت تأثير كوكب المشتري (<span class=\"en\">Jupiter</span>) بيبقى مزاجه مرح.</div>", "n": 3, "i": 27, "a": "myth-m9-021", "x": "9d28a923"}, {"t": "learn", "h": "<div class=\"li\">الكلمة دخلت الإنجليزي في 1580<span class=\"en\">s</span> بمعنى \"تحت تأثير كوكب المشتري\" وبعدين بقت \"مرح\".</div><div class=\"li\">يعني لما تقول عن حد <span class=\"en\">jovial</span>، انت حرفياً بتقول \"مزاجه زيوسي\".</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📜</span></span> الأسطورة في الشعر الإنجليزي</div>", "n": 3, "i": 28, "a": "myth-m9-022", "x": "431336a5"}, {"t": "mc", "h": "", "q": "كلمة <span class=\"en\">jovial</span> (مرح) جاية من إيه؟", "nq": 1, "opts": ["من <span class=\"en\">Jove</span>، لأن المنجمين ربطوها بكوكب المشتري", "من اسم شاعر", "من كلمة فرنسية معناها جميل"], "ans": 0, "why": "من <span class=\"en\">Jove</span>، لأن المنجمين ربطوها بكوكب المشتري", "ex": ["صح: دخلت الإنجليزي في القرن الـ16.", "غلط: الأصل <span class=\"en\">Jove</span>.", "غلط: الأصل <span class=\"en\">Jove</span>."], "i": 29}, {"t": "learn", "h": "<div class=\"lead\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ ألكسندر بوب، ترجمة الإلياذة (1715-1720):</div><div class=\"u\">مشهد تيتيس المتوسلة (فوق)، من أشهر ترجمات الإلياذة على الإطلاق، واللي خلت هوميروس \"يتكلم إنجليزي\" لجيل كامل.</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ شكسبير، الملك لير (الفصل التاني، المشهد الرابع):</div><div class=\"u\">لير بيرفض يستدعي عقاب السما على بناته، فيقول:</div><div class=\"u\">\"<span class=\"en\">I do not bid the thunder-bearer shoot,</span></div><div class=\"u\"><span class=\"en\">Nor tell tales of thee to high-judging Jove.</span>\"</div>", "n": 5, "i": 30, "a": "myth-m9-023", "x": "e60019f4"}, {"t": "learn", "h": "<div class=\"u\">(مش هطلب من حامل الرعد يضرب، ولا هشكيكي لجوف القاضي العادل.)</div><div class=\"li\">\"<span class=\"en\">thunder-bearer</span>\" = حامل الرعد = زيوس نفسه.</div><div class=\"li\">لير بينادي زيوس رغم إن المسرحية في بريطانيا الأسطورية قبل المسيحية، ودي ملحوظة شكسبيرية ممتعة: زيوس هو \"الإله الافتراضي\" لأي مأساة كلاسيكية.</div>", "n": 3, "i": 31, "a": "myth-m9-024", "x": "c403d4f4"}, {"t": "learn", "h": "<div class=\"lead\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ جون كيتس، \"<span class=\"en\">Hyperion</span>\" (نشرت 1820):</div><div class=\"u\">القصيدة عن سقوط التييتنز وصعود الأوليمبيين، يعني قصة فصلنا ده بالظبط. أوشيانوس، أحكم التييتنز، بيقول لإخواته المهزومين:</div><div class=\"u\">\"<span class=\"en\">We fall by course of Nature's law,</span> <span class=\"en\">not force</span></div><div class=\"u\"><span class=\"en\">Of thunder,</span> <span class=\"en\">or of Jove.</span>\"</div><div class=\"u\">(إحنا بنسقع بقانون الطبيعة، مش بقوة الرعد ولا جوف.)</div>", "n": 4, "i": 32, "a": "myth-m9-025", "x": "4f3cd1ec"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">We fall by _____ of Nature&#x27;s law,</div>", "opts": ["thunder", "course", "pleases"], "ans": 1, "why": "<span class=\"en\">We fall by course of Nature&#x27;s law,</span>", "i": 33}, {"t": "learn", "h": "<div class=\"li\">العبقرية هنا: كيتس بيخلي حتى المهزومين يعترفوا إن زيوس مكسبش بالقوة، كسب لأن ده قانون التطور. الجيل الجديد بيجي، دايماً.</div>", "n": 1, "i": 34, "a": "myth-m9-026", "x": "af8a6153"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Hyperion</span> لكيتس، إيه سبب سقوط التييتنز؟", "nq": 1, "opts": ["قانون الطبيعة، مش بس قوة الرعد", "خيانة من جوبيتر", "طوفان"], "ans": 0, "why": "قانون الطبيعة، مش بس قوة الرعد", "ex": ["صح: الجيل الجديد بيجي دايماً.", "غلط: النص بيقول قانون الطبيعة.", "غلط: مفيش طوفان في المقطع."], "i": 35}, {"t": "learn", "h": "<div class=\"lead\">4<span class=\"em\"><span class=\"em\">️</span></span>⃣ برسي شيلي، \"<span class=\"en\">Prometheus Unbound</span>\" (1820):</div><div class=\"u\">شيلي بيخلي جوبيتر هو الطاغية الشرير في المسرحية الشعرية، وبروميثيوس المقيد بيفتتح الكلام بمخاطبته ساخراً:</div><div class=\"u\">\"<span class=\"en\">Monarch of Gods and Daemons,</span> <span class=\"en\">and all Spirits</span></div><div class=\"u\"><span class=\"en\">But One,</span> <span class=\"en\">who throng those bright and rolling worlds</span></div><div class=\"u\"><span class=\"en\">Which Thou and I alone of living things</span></div><div class=\"u\"><span class=\"en\">Behold with sleepless eyes</span>: <span class=\"en\">regard this Earth</span></div>", "n": 5, "i": 36, "a": "myth-m9-027", "x": "94ba1fef"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Made multitudinous with thy slaves.</span>..\"</div><div class=\"u\">(يا ملك الآلهة والأرواح... بص على الأرض اللي مليتها عبيد ليك...)</div><div class=\"li\">عند الرومانتيكيين، زيوس بقى رمز الاستبداد، وبروميثيوس رمز الحرية. فاكر قصة بروميثيوس؟ نفس السلسلة، وبايرون كمان كتب قصيدة \"<span class=\"en\">Prometheus</span>\" (1816) بنفس الروح.</div>", "n": 3, "i": 37, "a": "myth-m9-028", "x": "f9a4ddd4"}, {"t": "mc", "h": "", "q": "عند الرومانتيكيين زي شيلي، جوبيتر بقى رمز لإيه؟", "nq": 1, "opts": ["الاستبداد", "الحب", "المطر"], "ans": 0, "why": "الاستبداد", "ex": ["صح: وبروميثيوس رمز الحرية.", "غلط: ده مش دوره عندهم.", "غلط: ده مش دوره عندهم."], "i": 38}, {"t": "learn", "h": "<div class=\"u\">5<span class=\"em\"><span class=\"em\">️</span></span>⃣ المرجع الكلاسيكي: هوميروس (الإيماءة، <span class=\"en\">Iliad 1.528-530</span>) وهسيود (الميلاد، <span class=\"en\">Theogony 453-506</span>) وإسخيلوس (أغنية أجاممنون)، كلهم فوق بترجمات إنجليزية موثقة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">👨‍👧‍👦</span></span> سابعاً: لمحة عن عيلة زيوس (خريطة الدروس الجاية)</div><div class=\"li\">مراته وأخته: هيرا، ملكة الآلهة. (هنقابل غيرتها المشهورة في فصول كتير.)</div>", "n": 3, "i": 39, "a": "myth-m9-029", "x": "ad359254"}, {"t": "learn", "h": "<div class=\"li\">أولاده الآلهة: أثينا (طلعت من راسه كاملة بالسلاح بعد ما بلع أمها ميتيس)، أبولو وأرتميس التوأم، أريس، هيرميس، ديونيسوس، وبيرسيفوني.</div><div class=\"li\">قصص حبه الشهيرة مع البشر والتحولات: إيو وأوروبا وليدا وجانيميد، وألكميني أم هرقل.</div><div class=\"li\">خلي بالك: أغلب الدروس الجاية مبنية على زيوس. هو مش بس ملك، ده \"الشبكة\" اللي شابكة الأساطير كلها ببعض.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🧠</span></span> ثامناً: الفكرة العامة</div>", "n": 4, "i": 40, "a": "myth-m9-030", "x": "597209d2"}, {"t": "learn", "h": "<div class=\"u\">عرش زيوس اتبنى على أربع مراحل، وكل مرحلة ليها درس:</div><div class=\"u\">1) الحيلة: الحجر بدل الطفل. البداية دايماً ذكاء، مش قوة.</div><div class=\"u\">2) القوة: عشر سنين حرب ضد التييتنز. مفيش عرش ببلاش.</div><div class=\"u\">3) القسمة العادلة: القرعة بين الأخوة. الملك الحكيم بيوزع قبل ما يحكم.</div><div class=\"u\">4) الكلمة المقدسة: الإيماءة اللي مابترجعش. السلطة الأخيرة هي مصداقية الكلمة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">🔤</span></span> كلمات إنجليزي من الفصل</div><div class=\"li\"><span class=\"en\">thunderbolt</span>: الصاعقة.</div>", "n": 7, "i": 41, "a": "myth-m9-031", "x": "b2d94083"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">thunder-bearer</span>: حامل الرعد (لقب زيوس).</div><div class=\"li\"><span class=\"en\">suppliant</span>: متوسل / طالب رحمة.</div><div class=\"li\"><span class=\"en\">to nod</span>: يومئ براسه.</div><div class=\"li\"><span class=\"en\">fate</span>: القدر / المصير.</div><div class=\"li\"><span class=\"en\">golden scales</span>: الميزان الذهبي.</div><div class=\"li\"><span class=\"en\">to draw lots</span>: يعمل قرعة.</div><div class=\"li\"><span class=\"en\">jovial</span>: مرح، بشوش (من <span class=\"en\">Jove</span>).</div><div class=\"li\"><span class=\"en\">by Jove</span>!: أقسم بجوف!</div><div class=\"li\"><span class=\"en\">sovereignty</span>: سيادة / ملك.</div><div class=\"li\"><span class=\"en\">Titan</span>: تيتان، عملاق من الجيل القديم.</div><div class=\"li\"><span class=\"en\">oath</span>: قسم / يمين.</div>", "n": 11, "i": 42, "a": "myth-m9-032", "x": "dee757b4"}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 43}];</script>
