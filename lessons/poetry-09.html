<script>window.LESSON_ID="poetry-09";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة أمتع درس في وحدة الصوت. قول كل مثال بصوت عالي، الدرس ده بيتسمع مش بيتقرا.<\/div>", "n": 1, "i": 0, "a": "poetry-09-001", "x": "a91fa7ab"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: إيه هي الـ <span class=\"en\">onomatopoeia<\/span>؟", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">كلمة صوتها بيقلد الصوت اللي بتصفه.<\/div><div class=\"li\"><span class=\"en\">buzz<\/span> (النحلة: بزززز)<\/div><div class=\"li\"><span class=\"en\">bang<\/span> (انفجار أو طلقة)<\/div><div class=\"li\"><span class=\"en\">splash<\/span> (حاجة بتقع في المية)<\/div><div class=\"li\"><span class=\"en\">hiss<\/span> (ثعبان أو بخار: هسسس)<\/div><div class=\"li\"><span class=\"en\">tick-tock<\/span> (الساعة)<\/div><div class=\"li\"><span class=\"en\">meow<\/span> (مواء القطة)<\/div><div class=\"u\">بالعربي عندنا نفس الفكرة: طقطقة، مواء، نقنقة، خرير المية. الإنجليزي بس سماها بالاسم اليوناني الكبير ده.<\/div><div class=\"u\">جرب: اقفل عينيك وقول <span class=\"en\">splash.<\/span> سمعت المية؟ يبقى الكلمة نجحت.<\/div>", "n": 9, "i": 2, "a": "poetry-09-002", "x": "0d98fc17"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: قصيدة الأجراس", "n": 1, "i": 3}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Edgar Allan Poe<\/span> (بتاع <span class=\"en\">The Raven<\/span>) كتب قصيدة كلها أصوات أجراس اسمها <span class=\"en\">The Bells<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">How they tinkle,<\/span> <span class=\"en\">tinkle,<\/span> <span class=\"en\">tinkle,<\/span><\/div><div class=\"u\"><span class=\"en\">In the icy air of night<\/span>!\"<\/div><div class=\"u\"><span class=\"en\">tinkle<\/span> صوتها رنين فعلاً، وتكرارها ٣ مرات بيخلي ودنك تسمع الجرس.<\/div><div class=\"u\">\"<span class=\"en\">From the jingling and the tinkling of the bells<\/span>\": القصيدة نفسها بقت جرس.<\/div>", "n": 5, "i": 4, "a": "poetry-09-003", "x": "10928973"}, {"t": "learn", "h": "<div class=\"u\">والأحلى: القصيدة ٤ أجزاء، وكل جزء أغمق من اللي قبله. بتبدأ برنين مبهج وتخلص بـ \"<span class=\"en\">the moaning and the groaning<\/span>\" (أنين وتوجع). يعني <span class=\"en\">Poe<\/span> خلّى الصوت نفسه يحكي قصة.<\/div>", "n": 1, "i": 5, "a": "poetry-09-004", "x": "aaf8c0c1"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: <span class=\"en\">sound symbolism<\/span>، أصوات ليها شخصية", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"lead\">حتى الكلمات العادية أصواتها بتحمل إحساس:<\/div><div class=\"li\"><span class=\"en\">slide,<\/span> <span class=\"en\">slip,<\/span> <span class=\"en\">slime,<\/span> <span class=\"en\">slither<\/span>: كلهم <span class=\"en\">sl<\/span>، وكلهم انزلاق أو لزوجة.<\/div><div class=\"li\"><span class=\"en\">crack,<\/span> <span class=\"en\">crash,<\/span> <span class=\"en\">crunch<\/span>: الـ <span class=\"en\">cr<\/span> حاد، وكلهم كسر وتحطيم.<\/div><div class=\"u\">الشاعر لما يختار كلمة بيختار صوتها وشخصيتها مش معناها بس.<\/div>", "n": 3, "i": 7, "a": "poetry-09-005", "x": "86a4e24b"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: ليه مهمة في الشعر؟", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">١- بتحط الصوت في ودانك: <span class=\"en\">tinkle tinkle<\/span> بدل \"سمعت جرس\".<\/div><div class=\"u\">٢- بتخلي المشهد حي، سينما بصوت وصورة.<\/div><div class=\"u\">٣- سهلة الحفظ: أغاني الأطفال مليانة <span class=\"en\">quack<\/span> و <span class=\"en\">moo<\/span> و <span class=\"en\">beep.<\/span><\/div><div class=\"u\">بس زي البهارات، لو كترت بتبوظ الأكل. <span class=\"en\">The Bells<\/span> نفسها اتنقدت إنها بقت ميكانيكية من كتر الصوت.<\/div>", "n": 4, "i": 9, "a": "poetry-09-006", "x": "f1457d2e"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: ملخص + تمرين", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">١- <span class=\"en\">onomatopoeia<\/span>: كلمة صوتها زي معناها.<\/div><div class=\"u\">٢- <span class=\"en\">Poe<\/span> بنى قصيدة كاملة على صوت واحد.<\/div><div class=\"u\">٣- <span class=\"en\">sl<\/span> للانزلاق، <span class=\"en\">cr<\/span> للكسر.<\/div><div class=\"u\">٤- باعتدال.<\/div>", "n": 4, "i": 11, "a": "poetry-09-007", "x": "8cfac7c8"}, {"t": "learn", "h": "<div class=\"lead\">١- طلّع كلمات الـ <span class=\"en\">onomatopoeia<\/span> من:<\/div><div class=\"u\">\"<span class=\"en\">How they tinkle,<\/span> <span class=\"en\">tinkle,<\/span> <span class=\"en\">tinkle,<\/span> / <span class=\"en\">In the icy air of night<\/span>!\"<\/div><div class=\"u\">\"<span class=\"en\">From the jingling and the tinkling of the bells<\/span>\"<\/div><div class=\"u\">٢- صوت الـ <span class=\"en\">sl<\/span> بيحسسك بإيه؟ هات كلمتين من عيلته.<\/div><div class=\"u\">٣- اكتب سطرين من تأليفك عن مشهد في البيت أو الشارع فيهم كلمة <span class=\"en\">onomatopoeia<\/span> واحدة على الأقل.<\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.<\/div>", "n": 5, "i": 12, "a": "poetry-09-008", "x": "d5bdb100"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس ١٠: القافية الداخلية والناقصة وقافية العين، وإزاي الشعراء بيغشوا في القافية بشطارة.<\/div>", "n": 1, "i": 13, "a": "poetry-09-009", "x": "e41b7cb7"}, {"t": "recall", "h": "", "q": "إيه معنى <span class=\"en\">onomatopoeia<\/span> بكلمتين؟", "a": "كلمة صوتها بيقلد الصوت اللي بتصفه.", "n": 1, "i": 14}, {"t": "recall", "h": "", "q": "أنهي كلمة من دول <span class=\"en\">onomatopoeia<\/span>: <span class=\"en\">table,<\/span> <span class=\"en\">splash,<\/span> <span class=\"en\">window?<\/span>", "a": "<span class=\"en\">splash.<\/span> <span class=\"en\">table<\/span> و <span class=\"en\">window<\/span> كلمات عادية صوتها مالوش علاقة بمعناها.", "n": 1, "i": 15}, {"t": "recall", "h": "", "q": "اسم قصيدة <span class=\"en\">Poe<\/span> اللي كلها أصوات أجراس إيه؟", "a": "<span class=\"en\">The Bells.<\/span>", "n": 1, "i": 16}, {"t": "tf", "h": "", "q": "صح ولا غلط: كلمات <span class=\"en\">slide<\/span> و <span class=\"en\">slip<\/span> و <span class=\"en\">slime<\/span> بتشترك في صوت الـ <span class=\"en\">cr.<\/span>", "ans": false, "why": "غلط. دول عيلة الـ <span class=\"en\">sl<\/span> (انزلاق). الـ <span class=\"en\">cr<\/span> بتاعة الكسر: <span class=\"en\">crack,<\/span> <span class=\"en\">crash,<\/span> <span class=\"en\">crunch.<\/span>", "n": 1, "i": 17, "ex": ["الجملة غلط. دول عيلة الـ <span class=\"en\">sl<\/span> (انزلاق). الـ <span class=\"en\">cr<\/span> بتاعة الكسر: <span class=\"en\">crack<\/span>, <span class=\"en\">crash<\/span>, <span class=\"en\">crunch<\/span>.", "صح، الجملة غلط. دول عيلة الـ <span class=\"en\">sl<\/span> (انزلاق). الـ <span class=\"en\">cr<\/span> بتاعة الكسر: <span class=\"en\">crack<\/span>, <span class=\"en\">crash<\/span>, <span class=\"en\">crunch<\/span>."]}, {"t": "write", "h": "", "q": "اشرح بأسلوبك يعني إيه <span class=\"en\">onomatopoeia<\/span>، وهات ٥ أمثلة من عندك (عربي أو إنجليزي)، وقول الصوت اللي كل واحدة بتقلده.", "key": "poetry-09:5", "n": 1, "i": 18}, {"t": "write", "h": "", "q": "اشرح إزاي قصيدة <span class=\"en\">The Bells<\/span> بتستخدم الأصوات. اقتبس سطر واحد من اللي خدناها، وقول كلمات الـ <span class=\"en\">onomatopoeia<\/span> فيه، واشرح إزاي الأجراس بتتغير من أول القصيدة لآخرها.", "key": "poetry-09:6", "n": 1, "i": 19}, {"t": "write", "h": "", "q": "اشرح يعني إيه <span class=\"en\">sound symbolism<\/span> وهات مثال من عيلتين كلمات، وبعدين قول: ليه الإكثار من الـ <span class=\"en\">onomatopoeia<\/span> ممكن يبوظ القصيدة؟", "key": "poetry-09:7", "n": 1, "i": 20}, {"t": "end", "h": "", "teaser": "", "extra": "(المصدر: <span class=\"en\">Wikisource<\/span> و <span class=\"en\">Wikipedia)<\/span>", "i": 21}];</script>
