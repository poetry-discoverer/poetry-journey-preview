<h1>تحليل ١٣: Crossing the Bar لتينيسون — الموت كعبور</h1>

<script>window.LESSON_ID="analysis-13";window.STEPS=[{"t":"learn","h":"<div class=\"u\">من قصة طويلة عن ست في برج، لست سطور قليلة عن راجل عجوز بيركب قارب. نفس الشاعر، ومزاج مختلف تمامًا.</div><div class=\"u\">القصيدة: Crossing the Bar، أربع مقاطع، كل واحد أربع سطور.</div>","n":2,"i":0,"a":"analysis-13-001","x":"5f3aef1d"},{"t":"section","h":"السياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">تينيسون كتب القصيدة سنة 1889، وكان عنده 80 سنة. القصيدة قصيرة وهادية، وطلب إنها تتطبع في آخر مجموعاته — يعني اعتبرها خاتمته.</div>","n":1,"i":2,"a":"analysis-13-002","x":"36aa46af"},{"t":"tf","h":"","q":"تينيسون طلب إن القصيدة تبقى آخر قصيدة في مجموعاته.","ans":true,"why":"صح: كتبها 1889 وطلب وضعها في آخر المجموعة، واعتبروها خاتمته.","n":1,"i":3,"ex":["صح، الجملة صح: ده معروف عن القصيدة.","غلط. الطلب ده موثق."]},{"t":"learn","h":"<div class=\"u\">كتبها وهو بيركب قارب بين جزيرة وايت والساحل، وقت الغروب. المشهد الحقيقي: شمس غاربة، نجمة، مد، وجرس مساء — وده اللي بنى عليه الاستعارة.</div>","n":1,"i":4,"a":"analysis-13-003","x":"d06178b3"},{"t":"learn","h":"<div class=\"u\">«البار» <span class=\"en\">(bar)</span> هو الحاجز الرملي عند مدخل الميناء. القارب لازم يعديه عشان يطلع البحر. في القصيدة، العبور ده هو الموت.</div>","n":1,"i":5,"a":"analysis-13-004","x":"b0d3984b"},{"t":"mc","h":"","q":"«the bar» في القصيدة إيه؟","opts":["الحاجز الرملي عند مدخل الميناء، واستعارة للموت","حانة","حدود بلد"],"ans":0,"why":"حاجز رملي عند الميناء = الموت.","n":1,"i":6,"ex":["صح: العبور من الميناء للبحر هو الموت، والبار حاجزه.","غلط: «bar» هنا حاجز رملي، مش مكان شرب.","غلط: مفيش حدود سياسية في القصيدة."]},{"t":"learn","h":"<div class=\"u\">الشكل: أربع رباعيات <span class=\"en\">(quatrains)</span>، والسطور بتتبادل طويل وقصير <span class=\"en\">(tetrameter وtrimeter)</span>، والقافية <span class=\"en\">abab</span>. الإيقاع ده بيمشي زي الموج.</div>","n":1,"i":7,"a":"analysis-13-005","x":"4b6115ff"},{"t":"learn","h":"<div class=\"u\">والعنوان نفسه فعل مستمر: «crossing» — عبور جاري، مش موت لحظة واحدة. والقصيدة كلها بتوصف الاستعداد للعبور، مش العبور نفسه.</div>","n":1,"i":8,"a":"analysis-13-006","x":"33ae70ad"},{"t":"section","h":"المقطع الأول (<span dir=\"ltr\">1-4</span>)","n":1,"i":9},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">Sunset and evening star, / And one clear call for me! / And may there be no moaning of the bar, / When I put out to sea,</span></div>","n":2,"i":10,"a":"analysis-13-007","x":"2410274b"},{"t":"learn","h":"<div class=\"u\">وكلمة <span class=\"en\">one</span> مهمة: «نداء واحد واضح». مش أصوات كتير ولا ضجة — نداء شخصي، والقصيدة كلها بتحافظ على النبرة الشخصية الهادية دي.</div>","n":1,"i":11,"a":"analysis-13-008","x":"f15fa451"},{"t":"learn","h":"<div class=\"u\">«غروب ونجمة المساء، ونداء واحد واضح ليّا» — البداية وقت انتقال: نهار بيروح وليل بييجي. والنداء <span class=\"en\">(call)</span> مش صوت رعب، هو دعوة.</div>","n":1,"i":12,"a":"analysis-13-009","x":"bb651391"},{"t":"learn","h":"<div class=\"u\">«وياريت مفيش أنين من البار» <span class=\"en\">(moaning of the bar)</span>: ده صوت الميّة وهي بتعدي على الرمل. الصوت في الحقيقة حزين، والشاعر بيطلب إنه مايبقاش موجود — يعني بيطلب موت هادي من غير مقاومة.</div>","n":1,"i":13,"a":"analysis-13-010","x":"34ae00cf"},{"t":"section","h":"المقطع التاني (<span dir=\"ltr\">5-8</span>)","n":1,"i":14},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">5-8</span>:</div><div class=\"u\"><span class=\"en\">But such a tide as moving seems asleep, / Too full for sound and foam, / When that which drew from out the boundless deep / Turns again home.</span></div>","n":2,"i":15,"a":"analysis-13-011","x":"e92c6c4b"},{"t":"learn","h":"<div class=\"u\">«بس مد كأنه نايم وهو بيتحرك، مليان أكتر من إنه يعمل صوت ورغاوي»: مش مطلوب بحر هادي ميت، مطلوب مد كامل ساكن القوة. القوة الهادية أقوى من الصخب.</div>","n":1,"i":16,"a":"analysis-13-012","x":"c557316d"},{"t":"learn","h":"<div class=\"u\">«اللي طلع من العمق اللامحدود بيرجع بيته» <span class=\"en\">(Turns again home)</span>: صورة الحياة كلها كمد بيطلع من البحر ويرجع له. الموت هنا رجوع، مش نهاية.</div>","n":1,"i":17,"a":"analysis-13-013","x":"1711d3c1"},{"t":"mc","h":"","q":"«Turns again home» بتوصف إيه؟","opts":["اللي طلع من العمق بيرجع لأصله","القارب بيرجع للميناء","الشمس بترجع تطلع"],"ans":0,"why":"رجوع الإنسان لأصله.","n":1,"i":18,"ex":["صح: الحياة كلها مد بيطلع من البحر ويرجع، فالموت رجوع.","غلط: القارب طالع البحر مش راجع للميناء.","غلط: الغروب صورة في المقطع الأول بس، مش المقصود هنا."]},{"t":"section","h":"المقطع التالت (<span dir=\"ltr\">9-12</span>)","n":1,"i":19},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">9-12</span>:</div><div class=\"u\"><span class=\"en\">Twilight and evening bell, / And after that the dark! / And may there be no sadness of farewell, / When I embark;</span></div>","n":2,"i":20,"a":"analysis-13-014","x":"bddc0034"},{"t":"learn","h":"<div class=\"u\">«شفق وجرس المساء، وبعد كده الضلمة!» — علامة التعجب بعد «الضلمة» بتخليها حقيقة كبيرة، مش مجاز. الشاعر مش بيجمّلها.</div>","n":1,"i":21,"a":"analysis-13-015","x":"c24c63b0"},{"t":"learn","h":"<div class=\"u\">وطلب تاني: «ياريت مفيش حزن وداع» <span class=\"en\">(no sadness of farewell)</span>. مش طلب إنه مايموتش، طلب إن الوداع مايبقاش درامي. ودي شجاعة مختلفة عن التفاؤل.</div>","n":1,"i":22,"a":"analysis-13-016","x":"5700b4c2"},{"t":"section","h":"المقطع الرابع (<span dir=\"ltr\">13-16</span>)","n":1,"i":23},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">13-16</span>:</div><div class=\"u\"><span class=\"en\">For tho’ from out our bourne of Time and Place / The flood may bear me far, / I hope to see my Pilot face to face / When I have cross’d the bar.</span></div>","n":2,"i":24,"a":"analysis-13-017","x":"3f566844"},{"t":"learn","h":"<div class=\"u\">«حتى لو الفيضان شالني بعيد بره حدود الزمان والمكان» <span class=\"en\">(bourne of Time and Place)</span>: الموت خروج من شرطين بنعيش فيهم، الزمن والمكان.</div>","n":1,"i":25,"a":"analysis-13-018","x":"0982cadd"},{"t":"learn","h":"<div class=\"u\">«أتمنى أشوف ريّسي <span class=\"en\">(my Pilot)</span> وش لوش» — الريّس هو الله. و«أتمنى» <span class=\"en\">(I hope)</span> مش «أنا متأكد»: القصيدة كلها إيمان هادي بلا يقين صارخ.</div>","n":1,"i":26,"a":"analysis-13-019","x":"63be3950"},{"t":"mc","h":"","q":"«my Pilot» بيرمز لمين؟","opts":["الله","القبطان الحقيقي للقارب","أبوه"],"ans":0,"why":"الله.","n":1,"i":27,"ex":["صح: الريّس اللي هيشوفه وش لوش بعد العبور هو الله.","غلط: القبطان البشري مش المقصود؛ الشاعر نفسه راكب.","غلط: مفيش ذكر لأبيه في القصيدة."]},{"t":"tf","h":"","q":"القصيدة بتعبّر عن خوف من الموت.","ans":false,"why":"غلط: فيها قبول هادي وطلب صريح إن الوداع يبقى بلا حزن، والأمل في لقاء الريّس.","n":1,"i":28,"ex":["غلط. النبرة هادية ومطمئنة، مش خائفة.","صح، الجملة غلط: القصيدة عن استقبال الموت بهدوء."]},{"t":"learn","h":"<div class=\"u\">وآخر كلمة: «لما أكون عدّيت البار» <span class=\"en\">(cross’d the bar)</span>. القصيدة بتقفل على فعل مكتمل: العبور.</div>","n":1,"i":29,"a":"analysis-13-020","x":"fdc4b457"},{"t":"learn","h":"<div class=\"u\">لاحظ فين بتقع السطور القصيرة: <span class=\"en\">sea, home, embark, bar</span> — كل مقطع بيقفل على كلمة مفتاحية. الإيقاع بيبطّأ عند الكلمة المهمة، وده بيخليها تثبت.</div>","n":1,"i":30,"a":"analysis-13-021","x":"ea7f7279"},{"t":"learn","h":"<div class=\"u\">وربط بالدرس اللي فات: في The Lady of Shalott القارب كان نهاية مأساوية على نفس النهر، وهنا القارب عبور هادي. تينيسون استخدم نفس الصورة، ومعناها اتقلب من موت مرفوض لموت مقبول.</div>","n":1,"i":31,"a":"analysis-13-022","x":"f760f33d"},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":32},{"t":"learn","h":"<div class=\"u\">الاستعارة الممتدة <span class=\"en\">(extended metaphor)</span>: الموت رحلة بحرية كاملة — نداء، مد، جرس، ضلمة، وريّس. الاستعارة متماسكة من أول سطر لآخر سطر، وده سر قوتها.</div>","n":1,"i":33,"a":"analysis-13-023","x":"eec472c8"},{"t":"learn","h":"<div class=\"u\">الوزن: سطر طويل وسطر قصير بالتبادل. السطور القصيرة بتحس كأنها نفَس مقطوع بهدوء، والسطور الطويلة بتكمل الفكرة — إيقاعه زي موج مش زي خطبة.</div>","n":1,"i":34,"a":"analysis-13-024","x":"b1509674"},{"t":"mc","h":"","q":"تبادل السطور الطويلة والقصيرة بيعمل إيه؟","opts":["إيقاع متناوب زي الموج","بيخلي القصيدة غير موزونة","بيسرّع القراءة"],"ans":0,"why":"إيقاع موجي متناوب.","n":1,"i":35,"ex":["صح: 4 تفاعيل ثم 3، فالحركة متموجة وهادية.","غلط: القصيدة موزونة، النقص في عدد التفعيلات مش في الوزن.","غلط: التبادل بيبطّأ الإيقاع مش بيسرّعه."]},{"t":"learn","h":"<div class=\"u\">الموضوعات: الموت كرجوع، والهدوء كموقف من النهاية، والإيمان الهادي، والتفريق بين الحزن والخوف. وبعض القراءات بتشوف إن القصيدة مش عن الموت نفسه، لكن عن طريقة استقباله.</div>","n":1,"i":36,"a":"analysis-13-025","x":"0c113276"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":37},{"t":"recall","h":"","q":"اشرح استعارة الرحلة البحرية في القصيدة.","a":"القصيدة بتبني الموت كرحلة بحرية كاملة: البداية وقت الغروب مع نجمة المساء ونداء واضح، بعدين المد اللي بيتحرك كأنه نايم ومليان أكتر من إنه يعمل صوت، بعدين جرس المساء والضلمة، وأخيرًا العبور نفسه «when I have cross’d the bar» ولقاء الريّس. كل عنصر في المشهد ليه وظيفة: النداء هو الدعوة، والمد هو القوة الهادية، والضلمة هي المجهول، والريّس هو الله. والاستعارة متماسكة، وده اللي بيخلي الموت مش نهاية مخيفة لكن عبور لمكان تاني.","n":1,"i":38},{"t":"recall","h":"","q":"ليه القصيدة هادية رغم إنها عن الموت؟","a":"الهدوء مقصود وبيمشي على مستويين. الأول الطلبات: «may there be no moaning of the bar» و«no sadness of farewell» — الشاعر بيطلب موت من غير صخب ولا وداع درامي. والتاني الصور: مد «seems asleep» و«Too full for sound and foam»، يعني قوة ساكنة مش بحر هائج. وحتى الإيمان فيها مكتوب بصيغة أمل «I hope to see my Pilot face to face» مش يقين صارخ. فالهدوء مش إنكار للموت — القصيدة بتقول «And after that the dark!» بعلامة تعجب — هو طريقة استقبال، وبعض القراءات بتشوف إن ده موضوع القصيدة الحقيقي.","n":1,"i":39},{"t":"write","h":"","q":"حلّل صورة البحر والمد في القصيدة.","key":"analysis-13:1","a":"البحر في القصيدة مش مكان رعب، هو أصل ومرجع. المد بيطلع من «the boundless deep» وبيرجع «home»، فالحياة نفسها بتتصور كحركة مد وجزر. والمد المطلوب مش هادي بالمعنى السلبي: «such a tide as moving seems asleep, / Too full for sound and foam» — قوة كاملة من غير صخب. وده بيدّي صورة للموت كطاقة مش كاضمحلال. كمان البحر بيمثل اللامحدود: «from out our bourne of Time and Place / The flood may bear me far» — الفيضان بيشيله بره حدود الزمان والمكان. فالصورة بتشتغل على محورين: الرجوع (home) والعبور (cross’d) — الاتنين مع بعض، وده اللي بيدي القصيدة توازنها.","n":1,"i":40},{"t":"write","h":"","q":"ناقش إزاي القصيدة بتحوّل الموت لعبور.","key":"analysis-13:2","a":"التحويل بيحصل بالاستعارة والبنية مع بعض. الاستعارة بتخلي الموت فعلًا بحريًا له خطوات: نداء، انتظار مد، جرس، ضلمة، عبور. وكل خطوة ليها صورة حسية، فالمجهول بيبقى متخيل. والبنية بتدعم ده: أربع مقاطع، كل واحد بيضيف مرحلة، وآخر مقطع بيحط الغاية «to see my Pilot face to face». وكلمة «cross’d» في آخر سطر بتقفل الحركة بفعل مكتمل. النتيجة إن الموت مش فناء، هو انتقال من ضفة لضفة، ومن «Time and Place» لحضور مباشر. وبعض القراءات بتشوف إن العبور هنا ديني بالأساس (الريّس = الله)، وبعضها بيقراه كتعبير عن قبول إنساني عام للنهاية — والقصيدة بتسيب المساحة للاتنين.","n":1,"i":41},{"t":"end","h":"","teaser":"<div class=\"u\">كده Crossing the Bar خلصت: غروب، مد نايم، جرس مساء، وعبور هادي للبار.</div><div class=\"u\">الدرس الجاي: Meeting at Night لروبرت براوننج — لقاء ليلي في تلات مقاطع قصيرة.</div>","extra":"المصادر: Tennyson, “Crossing the Bar” (1889)؛ مصطلحات: extended metaphor, quatrain, tetrameter/trimeter, abab.","i":42}];</script>
