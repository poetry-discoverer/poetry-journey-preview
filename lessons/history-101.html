<script>window.LESSON_ID="history-101";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">انت خدت في الكورس الأدوات: الصوت والإيقاع والقافية والشكل. النهاردة هنحكي الحكاية نفسها: الشعر الإنجليزي اتولد إزاي وعدّى بإيه مرحلة ورا مرحلة. قسمتها ٤ أجزاء عشان كل جزء يتقري على راحتك، ووراهم صوت بيشرح كل جزء.</div>", "n": 1, "i": 0, "a": "history-101-001", "x": "345a5cd1", "en": "Today we tell the story of English poetry: how it was born and how it changed. It comes in 4 short parts, and a voice explains each one."}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🗺️</span></span> الخريطة الكاملة:</div><div class=\"u\">١. العصر القديم <span class=\"en\">Old English</span> (حوالي ٦٥٠ لـ ١١٠٠): الشعر كان بيتقال مش بيتكتب، شعراء بيغنوا في قصور الملوك. أعظم أثر: ملحمة <span class=\"en\">Beowulf</span> عن بطل بيحارب وحوش وتنين. لغتها إنجليزي قديم شبه الألماني، مفيش قافية خالص، الموسيقى كلها <span class=\"en\">alliteration</span> (تكرار أول الحرف).</div>", "n": 1, "i": 1, "a": "history-101-002", "x": "15e7d6e9", "en": "Old English (about 650 to 1100): poems were spoken, not written. The big work is Beowulf: a hero fights monsters and a dragon. It has no rhyme. The music comes from repeating the first sound of words."}, {"t": "mc", "h": "", "q": "إيه اللي بيميز شعر <span class=\"en\">Old English</span>؟", "nq": 1, "opts": ["قافية في آخر كل سطر", "تكرار أول الحرف <span class=\"en\">alliteration</span> ومفيش قافية", "شعر حر من غير أي قاعدة"], "ans": 1, "why": "تكرار أول الحرف <span class=\"en\">alliteration</span> ومفيش قافية", "ex": ["غلط: مفيش قافية خالص في الفترة دي.", "صح: الموسيقى كلها من تكرار أول الحرف.", "غلط: كان له نظام موسيقي، بس مش قافية."], "i": 2}, {"t": "learn", "h": "<div class=\"u\">٢. العصر الوسيط <span class=\"en\">Middle English</span> (حوالي ١١٠٠ لـ ١٥٠٠): بعد الغزو النورماندي اللغة اتلخبطت واتولدت إنجليزية جديدة. النجم: <span class=\"en\">Geoffrey Chaucer</span> صاحب <span class=\"en\">The Canterbury Tales</span> (حوالي ١٣٨٧)، مجموعة حكايات على لسان حجاج رايحين كانتربري. بيتلقب \"أبو الشعر الإنجليزي\" لأنه رسّخ السطر الخماسي <span class=\"en\">iambic pentameter</span> والقافية في الإنجليزية.</div>", "n": 1, "i": 3, "a": "history-101-003", "x": "2627728b", "en": "Middle English (about 1100 to 1500): after the Norman invasion the language changed. The star is Chaucer and his Canterbury Tales. He is called the father of English poetry because he made the five-beat line and rhyme normal."}, {"t": "mc", "h": "", "q": "ليه <span class=\"en\">Chaucer</span> بيتلقب أبو الشعر الإنجليزي؟", "nq": 1, "opts": ["لأنه اخترع الشعر الإنجليزي من الصفر", "لأنه رسّخ السطر الخماسي <span class=\"en\">iambic pentameter</span> والقافية", "لأنه كتب <span class=\"en\">Beowulf</span>"], "ans": 1, "why": "لأنه رسّخ السطر الخماسي <span class=\"en\">iambic pentameter</span> والقافية", "ex": ["غلط: الشعر كان موجود قبله.", "صح: ده اللي رسّخه في الإنجليزية.", "غلط: <span class=\"en\">Beowulf</span> من العصر القديم، قبله بقرون."], "i": 4}, {"t": "learn", "h": "<div class=\"u\">٣. القرن ١٦: عصر النهضة، السونيت والبلانك فيرس بيدخلوا إنجلترا.</div><div class=\"u\">٤. القرن ١٧: الميتافيزيقيون وملحمة ميلتون.</div><div class=\"u\">٥. القرن ١٨: عصر العقل والكلاسيكية الجديدة.</div><div class=\"u\">٦. القرن ١٩: الرومانسية وبعدين العصر الفيكتوري.</div><div class=\"u\">٧. القرن ٢٠: الحداثة والشعر الحر.</div><div class=\"u\">٨. النهاردة: تنوع كامل، مفيش مذهب واحد حاكم.</div>", "n": 6, "i": 5, "a": "history-101-004", "x": "14e41b51", "en": "Then: the 1500s (sonnets come to England), the 1600s (Milton), the 1700s (reason and order), the 1800s (Romantic, then Victorian), the 1900s (Modernism, free verse), and today (every style)."}, {"t": "tf", "h": "", "q": "الشعر الإنجليزي بدأ بالحداثة في القرن ٢٠.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: الحداثة مرحلة متأخرة.", "صح: بدأ من العصر القديم <span class=\"en\">Old English</span> حوالي ٦٥٠."], "i": 6}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">⭐</span></span> القاعدة الذهبية اللي هتفهم بيها التاريخ كله: كل جيل بيثور على اللي قبله. الرومانسيون ثاروا على عقلانية القرن ١٨، والحداثيون ثاروا على عاطفية الفيكتوريين. الشعر الإنجليزي بندول بين العقل والإحساس، وكل تأرجح بيطلع عباقرة.</div>", "n": 1, "i": 7, "a": "history-101-005", "x": "d0c26010", "en": "The golden rule: every generation turns against the one before it. Poetry swings between reason and feeling, and each swing brings great poets."}, {"t": "mc", "h": "", "q": "إيه القاعدة الذهبية في تاريخ الشعر اللي الدرس ذكرها؟", "nq": 1, "opts": ["كل جيل بيثور على اللي قبله", "كل جيل بينسخ اللي قبله بالظبط", "الشعر مبيتغيرش"], "ans": 0, "why": "كل جيل بيثور على اللي قبله", "ex": ["صح: زي الرومانسيين على عقلانية القرن ١٨.", "غلط: العكس هو اللي بيحصل.", "غلط: الشعر بيتأرجح بين العقل والإحساس."], "i": 8}, {"t": "end", "h": "", "teaser": "الجزء الجاي: القرن ١٦ و ١٧ بالشعراء والأمثلة.", "extra": "", "i": 9}];</script>
