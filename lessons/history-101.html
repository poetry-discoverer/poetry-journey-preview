<script>window.LESSON_ID="history-101";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">انت خدت في الكورس الأدوات: الصوت والإيقاع والقافية والشكل. النهاردة هنحكي الحكاية نفسها: الشعر الإنجليزي اتولد إزاي وعدّى بإيه مرحلة ورا مرحلة. قسمتها ٤ أجزاء عشان كل جزء يتقري على راحتك، ووراهم صوت بيشرح كل جزء.<\/div>", "n": 1, "i": 0, "a": "history-101-001", "x": "345a5cd1"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🗺️<\/span><\/span> الخريطة الكاملة:<\/div><div class=\"u\">١. العصر القديم <span class=\"en\">Old English<\/span> (حوالي ٦٥٠ لـ ١١٠٠): الشعر كان بيتقال مش بيتكتب، شعراء بيغنوا في قصور الملوك. أعظم أثر: ملحمة <span class=\"en\">Beowulf<\/span> عن بطل بيحارب وحوش وتنين. لغتها إنجليزي قديم شبه الألماني، مفيش قافية خالص، الموسيقى كلها <span class=\"en\">alliteration<\/span> (تكرار أول الحرف).<\/div>", "n": 1, "i": 1, "a": "history-101-002", "x": "15e7d6e9"}, {"t": "learn", "h": "<div class=\"u\">٢. العصر الوسيط <span class=\"en\">Middle English<\/span> (حوالي ١١٠٠ لـ ١٥٠٠): بعد الغزو النورماندي اللغة اتلخبطت واتولدت إنجليزية جديدة. النجم: <span class=\"en\">Geoffrey Chaucer<\/span> صاحب <span class=\"en\">The Canterbury Tales<\/span> (حوالي ١٣٨٧)، مجموعة حكايات على لسان حجاج رايحين كانتربري. بيتلقب \"أبو الشعر الإنجليزي\" لأنه رسّخ السطر الخماسي <span class=\"en\">iambic pentameter<\/span> والقافية في الإنجليزية.<\/div>", "n": 1, "i": 2, "a": "history-101-003", "x": "2627728b"}, {"t": "learn", "h": "<div class=\"u\">٣. القرن ١٦: عصر النهضة، السونيت والبلانك فيرس بيدخلوا إنجلترا.<\/div><div class=\"u\">٤. القرن ١٧: الميتافيزيقيون وملحمة ميلتون.<\/div><div class=\"u\">٥. القرن ١٨: عصر العقل والكلاسيكية الجديدة.<\/div><div class=\"u\">٦. القرن ١٩: الرومانسية وبعدين العصر الفيكتوري.<\/div><div class=\"u\">٧. القرن ٢٠: الحداثة والشعر الحر.<\/div><div class=\"u\">٨. النهاردة: تنوع كامل، مفيش مذهب واحد حاكم.<\/div>", "n": 6, "i": 3, "a": "history-101-004", "x": "14e41b51"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">⭐<\/span><\/span> القاعدة الذهبية اللي هتفهم بيها التاريخ كله: كل جيل بيثور على اللي قبله. الرومانسيون ثاروا على عقلانية القرن ١٨، والحداثيون ثاروا على عاطفية الفيكتوريين. الشعر الإنجليزي بندول بين العقل والإحساس، وكل تأرجح بيطلع عباقرة.<\/div>", "n": 1, "i": 4, "a": "history-101-005", "x": "d0c26010"}, {"t": "end", "h": "", "teaser": "الجزء الجاي: القرن ١٦ و ١٧ بالشعراء والأمثلة.", "extra": "", "i": 5}];</script>
