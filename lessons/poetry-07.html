<script>window.LESSON_ID="poetry-07";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">الدرس اللي فات اتعلمنا الـ <span class=\"en\">iamb<\/span> (دا-<span class=\"en\">DUM<\/span>). النهاردة نكمل عيلة الأقدام، وكل قدم ليه \"إحساس\" مختلف.<\/div>", "n": 1, "i": 0, "a": "poetry-07-001", "x": "d72887c3"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: الـ <span class=\"en\">trochee<\/span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">لو عكسنا الـ <span class=\"en\">iamb<\/span>؟ قوي-ضعيف: <span class=\"en\">DUM-da.<\/span> ده <span class=\"en\">trochee.<\/span><\/div>", "n": 1, "i": 2, "a": "poetry-07-002", "x": "6a6a6247"}, {"t": "learn", "h": "<div class=\"lead\">كلمات <span class=\"en\">trochee<\/span>:<\/div><div class=\"li\"><span class=\"en\">TA-ble<\/span><\/div><div class=\"li\"><span class=\"en\">WA-ter<\/span><\/div><div class=\"li\"><span class=\"en\">HAP-py<\/span><\/div><div class=\"li\"><span class=\"en\">TI-ger<\/span> (النمر نفسه!)<\/div><div class=\"u\">معظم الكلمات اللي نبرها في الأول <span class=\"en\">trochee<\/span>، واللي نبرها في الآخر <span class=\"en\">iamb.<\/span> إحساسه: قوي ومباشر، بيستخدم في الأناشيد والتعاويذ.<\/div>", "n": 5, "i": 3, "a": "poetry-07-003", "x": "b556b29f"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: النمر كان <span class=\"en\">trochee<\/span>!", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">قصيدة <span class=\"en\">The Tyger<\/span> مكتوبة بالـ <span class=\"en\">trochee<\/span> مش الـ <span class=\"en\">iamb<\/span>:<\/div><div class=\"u\"><span class=\"en\">TY-ger<\/span> | <span class=\"en\">TY-ger<\/span> | <span class=\"en\">BUR-ning<\/span> | <span class=\"en\">BRIGHT<\/span><\/div><div class=\"u\">٤ أقدام <span class=\"en\">trochee<\/span> = <span class=\"en\">trochaic tetrameter<\/span> (<span class=\"en\">tetra<\/span> = ٤).<\/div><div class=\"u\">الدقات: <span class=\"en\">TY,<\/span> <span class=\"en\">TY,<\/span> <span class=\"en\">BUR,<\/span> <span class=\"en\">BRIGHT<\/span> = ٤، زي ما عديناها في الدرس ٤. (المقطع الأخير مقصوص، تفصيلة هنرجعلها.)<\/div>", "n": 4, "i": 5, "a": "poetry-07-004", "x": "d63cb661"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: الـ <span class=\"en\">anapest<\/span>، الحصان الجاري", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">٣ مقاطع: ضعيف-ضعيف-قوي، <span class=\"en\">da-da-DUM.<\/span> زي حصان: طق طق طقوق.<\/div><div class=\"li\"><span class=\"en\">un-der-STAND<\/span><\/div><div class=\"li\"><span class=\"en\">in-ter-VENE<\/span><\/div><div class=\"li\"><span class=\"en\">on the RUN<\/span><\/div><div class=\"li\"><span class=\"en\">in the DARK<\/span><\/div><div class=\"u\">إحساسه خفيف وسريع، زي أغاني الأطفال.<\/div>", "n": 6, "i": 7, "a": "poetry-07-005", "x": "fcd263e4"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: الـ <span class=\"en\">dactyl<\/span>، الفالس", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">قوي-ضعيف-ضعيف: <span class=\"en\">DUM-da-da.<\/span> زي الفالس.<\/div><div class=\"li\"><span class=\"en\">HAP-pi-ly<\/span><\/div><div class=\"li\"><span class=\"en\">MUR-mur-ing<\/span><\/div><div class=\"li\"><span class=\"en\">PO-e-try<\/span> (الشعر نفسه <span class=\"en\">dactyl<\/span>!)<\/div>", "n": 4, "i": 9, "a": "poetry-07-006", "x": "67ff649f"}, {"t": "learn", "h": "<div class=\"lead\">الجدول:<\/div><div class=\"li\"><span class=\"en\">iamb<\/span>: <span class=\"en\">da-DUM<\/span> (<span class=\"en\">aLIVE<\/span>)، طبيعي<\/div><div class=\"li\"><span class=\"en\">trochee<\/span>: <span class=\"en\">DUM-da<\/span> (<span class=\"en\">TAble<\/span>)، قوي ومباشر<\/div><div class=\"li\"><span class=\"en\">anapest<\/span>: <span class=\"en\">da-da-DUM<\/span> (<span class=\"en\">underSTAND<\/span>)، جري وسرعة<\/div><div class=\"li\"><span class=\"en\">dactyl<\/span>: <span class=\"en\">DUM-da-da<\/span> (<span class=\"en\">HAPpily<\/span>)، رقص ونزول<\/div>", "n": 4, "i": 10, "a": "poetry-07-007", "x": "6ef26506"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: الأطوال + ملخص + تمرين", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"li\">٢ قدم: <span class=\"en\">dimeter<\/span><\/div><div class=\"li\">٣: <span class=\"en\">trimeter<\/span><\/div><div class=\"li\">٤: <span class=\"en\">tetrameter<\/span><\/div><div class=\"li\">٥: <span class=\"en\">pentameter<\/span><\/div><div class=\"li\">٦: <span class=\"en\">hexameter<\/span><\/div><div class=\"u\">الوصف الكامل = نوع القدم + العدد: <span class=\"en\">iambic pentameter<\/span>، <span class=\"en\">trochaic tetrameter.<\/span><\/div>", "n": 6, "i": 12, "a": "poetry-07-008", "x": "da7e402b"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️<\/span><\/span> تمرين:<\/div><div class=\"u\">١- حدد نوع القدم: <span class=\"en\">mother,<\/span> <span class=\"en\">about,<\/span> <span class=\"en\">beautiful,<\/span> <span class=\"en\">seventeen.<\/span><\/div><div class=\"u\">٢- سطر \"<span class=\"en\">Tyger Tyger,<\/span> <span class=\"en\">burning bright<\/span>\" وزنه إيه بالكامل؟<\/div><div class=\"u\">٣- اكتب سطر من تأليفك على وزن <span class=\"en\">trochee<\/span> (<span class=\"en\">DUM-da DUM-da<\/span>).<\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس ٨: <span class=\"en\">alliteration<\/span> و <span class=\"en\">assonance<\/span> و <span class=\"en\">consonance.<\/span><\/div>", "n": 5, "i": 13, "a": "poetry-07-009", "x": "be5a2e27"}, {"t": "recall", "h": "", "q": "الـ <span class=\"en\">trochee<\/span> ترتيب مقاطعه إيه؟", "a": "قوي-ضعيف (<span class=\"en\">DUM-da)<\/span>، عكس الـ <span class=\"en\">iamb.<\/span>", "n": 1, "i": 14}, {"t": "recall", "h": "", "q": "نوع قدم الكلمات دي إيه: <span class=\"en\">TA-ble<\/span> و <span class=\"en\">HAP-py<\/span> و <span class=\"en\">WA-ter<\/span>؟", "a": "<span class=\"en\">trochee<\/span>: التلاتة نبرهم في الأول.", "n": 1, "i": 15}, {"t": "recall", "h": "", "q": "اكتب الوصف الكامل لوزن \"<span class=\"en\">Tyger Tyger,<\/span> <span class=\"en\">burning bright<\/span>\" (نوع القدم + العدد).", "a": "<span class=\"en\">trochaic tetrameter<\/span> (<span class=\"en\">TY-ger<\/span> | <span class=\"en\">TY-ger<\/span> | <span class=\"en\">BUR-ning<\/span> | <span class=\"en\">BRIGHT)<\/span>.", "n": 1, "i": 16}, {"t": "tf", "h": "", "q": "صح ولا غلط: الـ <span class=\"en\">dactyl<\/span> ترتيبها ضعيف-ضعيف-قوي.", "ans": false, "why": "غلط. ضعيف-ضعيف-قوي ده الـ <span class=\"en\">anapest.<\/span> الـ <span class=\"en\">dactyl<\/span> قوي-ضعيف-ضعيف.", "n": 1, "i": 17, "ex": ["الجملة غلط. ضعيف-ضعيف-قوي ده الـ <span class=\"en\">anapest<\/span>. الـ <span class=\"en\">dactyl<\/span> قوي-ضعيف-ضعيف.", "صح، الجملة غلط. ضعيف-ضعيف-قوي ده الـ <span class=\"en\">anapest<\/span>. الـ <span class=\"en\">dactyl<\/span> قوي-ضعيف-ضعيف."]}, {"t": "write", "h": "", "q": "اشرح الأربع أنواع (<span class=\"en\">iamb,<\/span> <span class=\"en\">trochee,<\/span> <span class=\"en\">anapest,<\/span> <span class=\"en\">dactyl)<\/span>: الترتيب، مثال كلمة، والإحساس.", "key": "poetry-07:5", "n": 1, "i": 18}, {"t": "write", "h": "", "q": "ليه الوصف الكامل للوزن من جزأين: نوع القدم وعدد الأقدام؟ ادّي مثالين كاملين (واحد من شكسبير وواحد من <span class=\"en\">Blake)<\/span> واشرح معناهم.", "key": "poetry-07:6", "n": 1, "i": 19}, {"t": "write", "h": "", "q": "تخيل ٣ مشاهد: ماتش كورة حماسي، مطر هادي على الشباك، حصان بيجري في الصحرا. لكل مشهد اختار قدم من الأربعة وقول ليه.", "key": "poetry-07:7", "n": 1, "i": 20}, {"t": "end", "h": "", "teaser": "", "extra": "(المصدر: ويكيبيديا بتقول إن وزنها في الأغلب <span class=\"en\">trochaic tetrameter<\/span>: <a class=\"en\" href=\"https://en.wikipedia.org/wiki/The_Tyger\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/The_Tyger<\/a>)", "i": 21}];</script>
