<h1>القواعد 4: الصحة النحوية والمقبولية</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: من الصفر</span><span class="tag">درس ٤</span><span class="tag"><span class="em">🧩</span> القواعد الأكاديمية</span></div>

<script>window.LESSON_ID="grammar-04";window.STEPS=[{"t":"section","h":"جملتين مختلفين","n":1,"i":0},{"t":"learn","h":"<div class=\"u\">أهلًا بيك في الدرس الرابع. اسمع الجملتين دول. الأولى: <span class=\"en\">The boy kicked the ball</span>. والتانية: <span class=\"en\">Ball the kicked boy the</span>. الأولى سليمة. والتانية مش جملة إنجليزية أصلًا. بس فيه جمل في النص، ترتيبها سليم لكن غريبة. زي: <span class=\"en\">The ball kicked the boy</span>. الكورة ضربت الولد؟ البناء سليم، والمعنى غريب.</div>","n":1,"i":1,"a":"grammar-04-001","x":"4fad5e44"},{"t":"learn","h":"<div class=\"u\">وفيه كمان جمل سليمة جدًا، بس صعبة الفهم من أول مرة. يعني عندنا سؤالين مختلفين. السؤال الأول: هل الجملة مبنية صح؟ ده اسمه الصحة النحوية، <span class=\"en\">grammaticality</span>. والسؤال التاني: هل الناس بتقبلها وتفهمها بسهولة؟ ده اسمه المقبولية، <span class=\"en\">acceptability</span>.</div>","n":1,"i":2,"a":"grammar-04-002","x":"bed38734"},{"t":"section","h":"أربع زوايا","n":1,"i":3},{"t":"learn","h":"<div class=\"u\">نبدأ بالشكل، <span class=\"en\">form</span>. الصحة النحوية بتخص بناء الجملة ومطابقته للقواعد. المقبولية بتخص الجملة كلها: بنائها ومعناها وسهولة معالجتها. الوظيفة، <span class=\"en\">function</span>. الصحة النحوية مفهوم نظري بنستخدمه لوصف نظام اللغة. المقبولية حكم عملي بيطلعه الناطق، وده البيانات اللي بنشتغل بيها.</div>","n":1,"i":4,"a":"grammar-04-003","x":"838c1b92"},{"t":"learn","h":"<div class=\"u\">المعنى، <span class=\"en\">meaning</span>. جملة ممكن تبقى سليمة نحويًا ومعناها غريب. زي <span class=\"en\">Colorless green ideas sleep furiously</span>. تشومسكي كتبها في <span class=\"en\">Syntactic Structures</span> سنة 1957. والاستعمال، <span class=\"en\">use</span>. المقبولية بتتأثر بالسياق والذاكرة والمعنى والأسلوب.</div>","n":1,"i":5,"a":"grammar-04-004","x":"b1c64b3b"},{"t":"section","h":"أربع حالات","n":1,"i":6},{"t":"learn","h":"<div class=\"u\">ممكن نرتب الجمل في أربع حالات. سليمة ومقبولة: <span class=\"en\">The boy kicked the ball</span>. سليمة نحويًا وغير مقبولة: <span class=\"en\">Colorless green ideas sleep furiously</span>. غير سليمة نحويًا وغير مقبولة: <span class=\"en\">Ball the kicked boy the</span>.</div>","n":1,"i":7,"a":"grammar-04-005","x":"9c1a725a"},{"t":"learn","h":"<div class=\"u\">والحالة الرابعة مهمة: جملة غير سليمة نحويًا، لكن مقبولة ومفهومة، زي <span class=\"en\">Me want water</span> من متعلم. ده بيبين إن الناس بتفهم جمل مش مطابقة للقواعد المعيارية.</div>","n":1,"i":8,"a":"grammar-04-006","x":"7c9b643f"},{"t":"section","h":"علامات الأحكام","n":1,"i":9},{"t":"learn","h":"<div class=\"u\">اللسانيين بيكتبوا قدام الجملة علامة تعبر عن حكمهم. النجمة، <span class=\"en\">asterisk</span>: جملة غير سليمة نحويًا. علامة الاستفهام: جملة حدّية ومشكوك فيها. وعلامة الشباك، <span class=\"en\">hash</span>: سليمة بنائيًا بس غريبة المعنى. العلامات دي أدوات عمل، مش حقائق نهائية. وفي الأبحاث الحديثة بتتقاس المقبولية بتدريج، من واحد لسبعة مثلًا، بدل صح وغلط.</div>","n":1,"i":10,"a":"grammar-04-007","x":"a80e6840"},{"t":"section","h":"جملة بتخدعك","n":1,"i":11},{"t":"learn","h":"<div class=\"u\">خد الجملة دي: <span class=\"en\">The horse raced past the barn fell</span>. دماغك بيقرا <span class=\"en\">raced</span> كفعل رئيسي: الحصان جرى. وبعدين تقابل <span class=\"en\">fell</span> وتتلخبط. المعنى الصح: الحصان اللي اتسابق جنب الحظيرة وقع. الجملة سليمة نحويًا، فيها <span class=\"en\">reduced relative clause</span>، بس معالجتها صعبة. ودي اسمها <span class=\"en\">garden-path sentence</span>، جملة المتاهة. وبتبين إن المقبولية مش بتتحدد بالقواعد وحدها.</div>","n":1,"i":12,"a":"grammar-04-008","x":"99265dd8"},{"t":"section","h":"الطبقة المتقدمة","n":1,"i":13},{"t":"learn","h":"<div class=\"u\">الباحثين <span class=\"en\">Sch</span>ü<span class=\"en\">tze</span> و<span class=\"en\">Sprouse</span> سنة 2014 بيوضحوا إن المصطلح التقليدي <span class=\"en\">grammaticality judgments</span> مضلل. القواعد بناء ذهني مش ظاهر للوعي، فالناطق مش بيقدر يحكم عليه مباشرة. اللي بيحكم عليه هو رد فعله الحدسي على الجملة، ورد الفعل ده بيتأثر بعوامل كتير غير القواعد.</div>","n":1,"i":14,"a":"grammar-04-009","x":"56ec50f2"},{"t":"learn","h":"<div class=\"u\">عشان كده المصطلح الأدق <span class=\"en\">acceptability judgments</span>. والمهمة البحثية إننا نفصل بين الأثر النحوي والأثر غير النحوي: ذاكرة، معنى، تكرار، أسلوب.</div>","n":1,"i":15,"a":"grammar-04-010","x":"644cb309"},{"t":"section","h":"مصادر التباين","n":1,"i":16},{"t":"learn","h":"<div class=\"u\">الاختلاف في الأحكام بييجي من أسباب كتير. المعالجة: زي <span class=\"en\">center-embedding</span> و<span class=\"en\">garden path</span>. المعقولية: الجملة غريبة المعنى بتتحس غريبة. التكرار: التركيب النادر بيتحس أقل قبولًا. والتنويع: ناطق من لهجة ممكن يقبل اللي ناطق من لهجة تانية مش بيقبله، وده تباين حقيقي مش غلط. وأخيرًا التقييم الاجتماعي: مقبول عند ناس ومرفوض عند مدرس.</div>","n":1,"i":17,"a":"grammar-04-011","x":"104b89f3"},{"t":"section","h":"منهجية البحث","n":1,"i":18},{"t":"learn","h":"<div class=\"u\">البحث المضبوط محتاج عدد كبير من الجمل والمشاركين، وجمل تعبئة، وقياس بتدريج، وإنك متعتمدش على حكم الباحث لوحده. المنهج ده اتطور بعد نقد قديم، إن اللسانيين بيعتمدوا على أحكام قليلة وغير مضبوطة، وده نقد <span class=\"en\">Sch</span>ü<span class=\"en\">tze</span> سنة 1996.</div>","n":1,"i":19,"a":"grammar-04-012","x":"60b86ffe"},{"t":"section","h":"مصطلحات الدرس","n":1,"i":20},{"t":"learn","h":"<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. <span class=\"en\">Grammaticality</span>: الصحة النحوية. <span class=\"en\">Acceptability</span>: المقبولية. <span class=\"en\">Acceptability judgment</span>: حكم المقبولية. <span class=\"en\">Ungrammatical</span>: غير نحوية. <span class=\"en\">Anomalous</span>: سليمة البناء وغريبة المعنى. <span class=\"en\">Garden-path sentence</span>: جملة المتاهة. <span class=\"en\">Reduced relative clause</span>: جملة وصل مختزلة. <span class=\"en\">Processing</span>: المعالجة. <span class=\"en\">Intuition</span>: الحدس. <span class=\"en\">Gradience</span>: التدرج.</div>","n":1,"i":21,"a":"grammar-04-013","x":"53cf045b"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Marginal</span>: حدّي. <span class=\"en\">Well-formed</span>: سليم البناء.</div>","n":1,"i":22,"a":"grammar-04-014","x":"104dc4e7"},{"t":"section","h":"الخلاصة","n":1,"i":23},{"t":"learn","h":"<div class=\"u\">أربع نقط. واحد: الصحة النحوية بناء، والمقبولية رد فعل على الجملة كلها. اتنين: جملة ممكن تبقى سليمة وغير مقبولة، أو العكس. تلاتة: الحكم الحدسي بيتأثر بالمعالجة والمعنى والتنويع، مش النحو وحده. أربعة: العلامات أدوات عمل، والبحث الجيد بيقيس بتدريج. الدرس الجاي: مستويات اللغة الخمسة بتفصيل أكتر.</div>","n":1,"i":24,"a":"grammar-04-015","x":"774ff0c9"},{"t":"section","h":"الكويز","n":1,"i":25},{"t":"mc","q":"<span class=\"en\">Colorless green ideas sleep furiously</span> جملة:","opts":["سليمة نحويًا وغريبة المعنى","غير نحوية","مقبولة تمامًا"],"ans":0,"why":"البناء سليم والمعنى غير منطقي.","ex":["صح: <span class=\"en\">grammatical</span> لكن <span class=\"en\">anomalous</span> في المعنى.","غلط: البناء سليم: صفتين واسم وفعل وظرف.","غلط: المعنى يجعلها غير مقبولة."],"n":1,"i":26,"h":""},{"t":"mc","q":"ليه <span class=\"en\">The horse raced past the barn fell</span> صعبة؟","opts":["غير نحوية","<span class=\"en\">garden-path</span>: بتخدعك أثناء القراءة","ناقصها فعل"],"ans":1,"why":"سليمة نحويًا، والصعوبة في المعالجة.","ex":["غلط: هي سليمة نحويًا.","صح: بنفهم <span class=\"en\">raced</span> كفعل رئيسي وبعدين نتلخبط عند <span class=\"en\">fell</span>.","غلط: فيها فعل: <span class=\"en\">fell</span>."],"n":1,"i":27,"h":""},{"t":"mc","q":"علامة # قدام جملة معناها:","opts":["غير نحوية","سليمة بنائيًا وغريبة المعنى","حدّية"],"ans":1,"why":"# للجمل السليمة الغريبة المعنى.","ex":["غلط: دي علامة النجمة.","صح: # للشذوذ في المعنى.","غلط: دي علامة ?."],"n":1,"i":28,"h":""},{"t":"mc","q":"ليه المصطلح الأدق <span class=\"en\">acceptability judgments</span> مش <span class=\"en\">grammaticality judgments</span>؟","opts":["القواعد غير ظاهرة للوعي، والناطق بيحكم برد فعله","لأن الجمل كلها مقبولة","لأن النحو مش مهم"],"ans":0,"why":"الحكم رد فعل حدسي بيتأثر بعوامل كتير.","ex":["صح: الحكم على الجملة كلها، مش على القواعد مباشرة.","غلط: مش كل الجمل مقبولة.","غلط: النحو مهم، لكنه مش العامل الوحيد."],"n":1,"i":29,"h":""},{"t":"tf","q":"<span class=\"en\">Me want water</span> جملة غير نحوية لكنها ممكن تكون مفهومة.","ans":true,"why":"صح: الفهم لا يتطلب مطابقة القواعد المعيارية.","ex":["صح: غير نحوية في المعيار ومفهومة.","غلط: الجملة مفهومة فعلًا."],"n":1,"i":30,"h":""},{"t":"tf","q":"الصحة النحوية والمقبولية نفس المفهوم.","ans":false,"why":"غلط: الأولى بناء، والتانية رد فعل على الجملة كلها.","ex":["غلط: مختلفين.","صح، الجملة غلط: ممكن جملة تبقى سليمة وغير مقبولة."],"n":1,"i":31,"h":""},{"t":"recall","q":"اذكر ٣ مصادر لتباين أحكام المقبولية.","a":"المعالجة (الذاكرة)، المعقولية (المعنى)، التكرار، التنويع بين اللهجات، التقييم الاجتماعي. (أي ٣)","n":1,"i":32,"h":""},{"t":"recall","q":"اشرح الحالات الأربعة للجملة من ناحية الصحة النحوية والمقبولية بمثال لكل حالة.","a":"سليمة ومقبولة: <span class=\"en\">The boy kicked the ball</span>. سليمة وغير مقبولة: <span class=\"en\">Colorless green ideas sleep furiously</span>. غير نحوية وغير مقبولة: <span class=\"en\">Ball the kicked boy the</span>. غير نحوية ومقبولة: <span class=\"en\">Me want water</span> من متعلم.","n":1,"i":33,"h":""},{"t":"write","q":"اشرح جملة <span class=\"en\">garden-path</span> بمثال، واذكر ليه بتخدع القارئ (٣-٤ جمل).","key":"grammar-04:1","a":"مثال: <span class=\"en\">The horse raced past the barn fell</span>. القارئ بيفهم <span class=\"en\">raced</span> كفعل رئيسي، وبعدين يقابل <span class=\"en\">fell</span> فيتلخبط. الجملة سليمة نحويًا (<span class=\"en\">reduced relative clause</span>)، بس المعالجة صعبة. فالمقبولية مش بتتحدد بالقواعد وحدها.","n":1,"i":34,"h":""},{"t":"write","q":"اقترح طريقة لفصل أثر المعالجة عن أثر النحو في حكم المقبولية (٤-٥ جمل).","key":"grammar-04:2","a":"أقدّم جمل بنفس البناء النحوي وأغيّر عامل المعالجة بس: الطول أو التضمين. مثلًا جمل مع تضمين وجمل من غيره. بعدين أقيس المقبولية بتدريج من ١ لـ ٧ على عدد كبير من المشاركين، مع جمل تعبئة. لو الحكم اتغير بتغير المعالجة بس، الأثر معالجة مش نحو.","n":1,"i":35,"h":""},{"t":"end","h":"","teaser":"<div class=\"u\">الدرس الجاي: مستويات اللغة الخمسة بتفصيل أكتر.</div><div class=\"u\">هنشوف إزاي كل مستوى بيتحلل لوحده، وإزاي بيتفاعلوا مع بعض.</div>","extra":"المصادر: Chomsky, Syntactic Structures (1957); Schütze and Sprouse, Judgment data (2014); Schütze, The Empirical Base of Linguistics (1996); Altmann on garden-path sentences.","i":36}];</script>
