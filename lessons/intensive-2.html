<script>window.LESSON_ID="intensive-2";window.STEPS=[{"t": "section", "h": "1) كارل يونغ (<span class=\"en\">Carl Jung<\/span>): اللاوعي الجمعي", "i": 0}, {"t": "learn", "h": "<div class=\"u\">كان <span class=\"en\">Carl Jung<\/span> (1875-1961) طبيباً نفسياً سويسرياً عمل مع فرويد ثم افترق عنه حوالي عام 1913. من أسباب الخلاف أنه فهم الـ <span class=\"en\">libido<\/span> كطاقة نفسية عامة، لا كطاقة جنسية فقط. وسمّى مدرسته التحليل النفسي التحليلي (<span class=\"en\">Analytical Psychology<\/span>).<\/div>", "n": 1, "a": "intensive-2-001", "x": "6ae9fed6", "i": 1}, {"t": "learn", "h": "<div class=\"u\">من أشهر أفكاره اللاوعي الجمعي (<span class=\"en\">Collective Unconscious<\/span>): طبقة عميقة مشتركة بين البشر، فيها صور وأنماط قديمة تسمى النماذج الأصلية (<span class=\"en\">Archetypes<\/span>). من أمثلتها: الظل (<span class=\"en\">Shadow<\/span>)، والأنيما والأنيموس (<span class=\"en\">Anima<\/span> / <span class=\"en\">Animus<\/span>)، والأم العظمى (<span class=\"en\">Great Mother<\/span>)، والحكيم العجوز (<span class=\"en\">Wise Old Man<\/span>)، والمحتال (<span class=\"en\">Trickster<\/span>).<\/div>", "n": 1, "a": "intensive-2-002", "x": "10a23d4c", "i": 2}, {"t": "mc", "h": "", "q": "ما الذي رفضه <span class=\"en\">Jung<\/span> من نظرة <span class=\"en\">Freud<\/span>؟", "opts": ["وجود اللاوعي", "حصر الـ <span class=\"en\">libido<\/span> في الطاقة الجنسية فقط", "أهمية الأحلام"], "ans": 1, "why": "حصر الـ <span class=\"en\">libido<\/span> في الطاقة الجنسية فقط", "i": 3, "ex": ["غلط: <span class=\"en\">Jung<\/span> آمن بوجود اللاوعي، وأضاف إليه اللاوعي الجمعي.", "صح: فهم <span class=\"en\">Jung<\/span> الـ <span class=\"en\">libido<\/span> كطاقة نفسية عامة، لا جنسية فقط. وكان هذا من أسباب الخلاف حوالي 1913.", "غلط: <span class=\"en\">Jung<\/span> اهتم بالأحلام جداً كذلك."]}, {"t": "learn", "h": "<div class=\"u\">وعند يونغ تتكرر هذه الأنماط في الأساطير والأحلام والأدب. لذلك يسأل الناقد اليونغي: أي نموذج أصلي يظهر في القصيدة؟ هل هناك رحلة بطل، أو مواجهة مع الظل؟ وهذا يربطك مباشرة بكورس الميثولوجيا: قصص مثل <span class=\"en\">Chaos<\/span> و<span class=\"en\">Prometheus<\/span> و<span class=\"en\">Pandora<\/span> تُقرأ عنده كأنماط إنسانية متكررة.<\/div>", "n": 1, "a": "intensive-2-003", "x": "04d63465", "i": 4}, {"t": "section", "h": "2) جاك لاكان (<span class=\"en\">Jacques Lacan<\/span>): اللغة والذات", "i": 5}, {"t": "learn", "h": "<div class=\"u\">كان <span class=\"en\">Jacques Lacan<\/span> (1901-1981) محللاً نفسياً فرنسياً دعا إلى \"العودة إلى فرويد\" بالاستعانة بعلم اللغة. وأشهر عبارة له: \"اللاوعي مبني مثل لغة\" (<span class=\"en\">the unconscious is structured like a language<\/span>). أي أن رغباتنا المكبوتة تظهر عبر الكلمات والصور والانزلاقات اللغوية، لا عبر شيء بعيد عن اللغة.<\/div>", "n": 1, "a": "intensive-2-004", "x": "62da095e", "i": 6}, {"t": "learn", "h": "<div class=\"u\">مرحلة المرآة (<span class=\"en\">Mirror Stage<\/span>): قدّمها <span class=\"en\">Lacan<\/span> في مؤتمر عام 1936، وأعاد صياغتها عام 1949. يرى أن الطفل في الشهور الأولى من حياته يرى صورته في المرآة، فيحس بوحدة وكمال لا يملكهما جسده فعلاً بعد. فتتكوّن \"الأنا\" من صورة خارجية، وفي هذا بذرة اغتراب.<\/div>", "n": 1, "a": "intensive-2-005", "x": "9eab3c70", "i": 7}, {"t": "mc", "h": "", "q": "ما معنى <span class=\"en\">Archetype<\/span> عند <span class=\"en\">Jung<\/span>؟", "opts": ["اسم كتاب لـ <span class=\"en\">Freud<\/span>", "نمط أو صورة أصلية متكررة في الأساطير والأحلام والأدب", "نوع من الوزن الشعري"], "ans": 1, "why": "نمط أو صورة أصلية متكررة في الأساطير والأحلام والأدب", "i": 8, "ex": ["غلط: <span class=\"en\">Archetype<\/span> مفهوم عند <span class=\"en\">Jung<\/span>، وليس عنواناً لكتاب <span class=\"en\">Freud<\/span>.", "صح: <span class=\"en\">Archetype<\/span> نمط أصلي مشترك، مثل الظل أو الأم العظمى، يظهر في الأساطير والأحلام والأدب.", "غلط: الأوزان مثل <span class=\"en\">iambic pentameter<\/span>، وهي موضوع كورس الشعر."]}, {"t": "learn", "h": "<div class=\"u\">ثلاثة مستويات عند <span class=\"en\">Lacan<\/span>: الخيالي (<span class=\"en\">the Imaginary<\/span>): عالم الصور والمرآة. والرمزي (<span class=\"en\">the Symbolic<\/span>): عالم اللغة والقانون والأسماء. والواقعي (<span class=\"en\">the Real<\/span>): ما يقاوم التسمية والتصوير. أما الرغبة (<span class=\"en\">Desire<\/span>) فلا تُشبَع نهائياً لأنها تدور حول ما ينقصنا (<span class=\"en\">lack<\/span>)، وهذا يفسر عند بعض النقاد لماذا يكتب الشعر ويبحث عن شيء مفقود.<\/div>", "n": 1, "a": "intensive-2-006", "x": "e44362ca", "i": 9}, {"t": "learn", "h": "<div class=\"u\">وتأثر <span class=\"en\">Lacan<\/span> بعلم اللغة: الكلمة (<span class=\"en\">signifier<\/span>) تحيل إلى كلمة أخرى، فيتحرك المعنى ولا يثبت بسهولة. وقد قدّم قراءة شهيرة لـ <span class=\"en\">Hamlet<\/span> في محاضرته \"<span class=\"en\">Desire and the Interpretation of Desire in Hamlet<\/span>\" (1959)، ركّز فيها على علاقة رغبة هاملت برغبة أمه.<\/div>", "n": 1, "a": "intensive-2-007", "x": "c8f208d9", "i": 10}, {"t": "mc", "h": "", "q": "ماذا قصد <span class=\"en\">Lacan<\/span> بقوله إن اللاوعي \"مبني مثل لغة\"؟", "opts": ["أن اللغة تلغي اللاوعي", "أن الرغبات المكبوتة تظهر عبر الكلمات والصور", "أن اللاوعي يتكلم الإنجليزية"], "ans": 1, "why": "أن الرغبات المكبوتة تظهر عبر الكلمات والصور", "i": 11, "ex": ["غلط: عكس المعنى: اللغة هي الطريق الذي يظهر منه اللاوعي.", "صح: يرى <span class=\"en\">Lacan<\/span> أن اللاوعي يعمل مثل اللغة، فتظهر الرغبات في الكلمات والصور والزلات.", "غلط: العبارة مجازية عن البنية، وليست عن لغة بعينها."]}, {"t": "section", "h": "3) جوليا كريستيفا (<span class=\"en\">Julia Kristeva<\/span>): الإيقاع والمعنى", "i": 12}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Julia Kristeva<\/span> (مولودة عام 1941) مفكرة وناقدة بلغارية-فرنسية. في كتابها <span class=\"en\">Revolution in Poetic Language<\/span> (1974) فرّقت بين مستويين في اللغة: الـ <span class=\"en\">Symbolic<\/span>: النحو والمعنى المنظم. والـ <span class=\"en\">Semiotic<\/span>: الإيقاع والنغمة والصوت، وتربطه بمرحلة ما قبل الكلام وعلاقة الطفل بأمه.<\/div>", "n": 1, "a": "intensive-2-008", "x": "788dc174", "i": 13}, {"t": "learn", "h": "<div class=\"u\">ترى <span class=\"en\">Kristeva<\/span> أن الشعر مكان خاص يتحرك فيه الـ <span class=\"en\">Semiotic<\/span> داخل الـ <span class=\"en\">Symbolic<\/span> ويهزّه. وهذا مفيد جداً لدارس الشعر، لأنه يعطي لغة لما تعلمته في كورس الشعر: الإيقاع (<span class=\"en\">rhythm<\/span>)، والقافية (<span class=\"en\">rhyme<\/span>)، والتكرار (<span class=\"en\">alliteration<\/span> و<span class=\"en\">assonance<\/span>)، وصوت الكلمات (<span class=\"en\">onomatopoeia<\/span>). فليس الصوت زينة، بل جزء من المعنى.<\/div>", "n": 1, "a": "intensive-2-009", "x": "4d3adac6", "i": 14}, {"t": "learn", "h": "<div class=\"u\">ومن مفاهيمها أيضاً الاشمئزاز (<span class=\"en\">Abjection<\/span>) في <span class=\"en\">Powers of Horror<\/span> (1980): الإحساس تجاه ما يهدد حدود الذات مثل الجسد والموت. ومفهوم التناص (<span class=\"en\">Intertextuality<\/span>): كل نص يتكوّن من نصوص أخرى. وقد استخدمت المصطلح أول مرة في كتاباتها في الستينيات متأثرة بأفكار <span class=\"en\">Mikhail Bakhtin<\/span>.<\/div>", "n": 1, "a": "intensive-2-010", "x": "5a90e63b", "i": 15}, {"t": "mc", "h": "", "q": "أي مستوى عند <span class=\"en\">Kristeva<\/span> يضم الإيقاع والنغمة والصوت؟", "opts": ["<span class=\"en\">Semiotic<\/span>", "<span class=\"en\">Symbolic<\/span>", "<span class=\"en\">Abjection<\/span>"], "ans": 0, "why": "<span class=\"en\">Semiotic<\/span>", "i": 16, "ex": ["صح: <span class=\"en\">Semiotic<\/span> عند <span class=\"en\">Kristeva<\/span> هو مستوى الإيقاع والنغمة والصوت، وهو سابق على المعنى المنظم.", "غلط: <span class=\"en\">Symbolic<\/span> هو النحو والمعنى المنظم.", "غلط: <span class=\"en\">Abjection<\/span> هو إحساس الاشمئزاز مما يهدد حدود الذات، وليس مستوى لغوياً."]}, {"t": "mc", "h": "", "q": "في مرحلة المرآة عند <span class=\"en\">Lacan<\/span>: يرى الطفل صورته فيحس بـ _____ لا يملكه جسده بعد.", "opts": ["ألم", "وحدة وكمال", "جوع"], "ans": 1, "why": "وحدة وكمال", "i": 17, "ex": ["غلط: المرحلة ليست عن الألم، بل عن صورة الذات.", "صح: يرى الطفل صورة متكاملة في المرآة بينما جسده لم يكتمل تحكمه بعد.", "غلط: الجوع حاجة جسدية، وليس موضوع مرحلة المرآة."]}, {"t": "mc", "h": "", "q": "عند <span class=\"en\">Kristeva<\/span>: الإيقاع والنغمة والصوت جزء من الـ _____.", "opts": ["<span class=\"en\">Superego<\/span>", "<span class=\"en\">Semiotic<\/span>", "<span class=\"en\">Archetype<\/span>"], "ans": 1, "why": "<span class=\"en\">Semiotic<\/span>", "i": 18, "ex": ["غلط: <span class=\"en\">Superego<\/span> مفهوم عند <span class=\"en\">Freud<\/span>.", "صح: هذه عناصر الـ <span class=\"en\">Semiotic<\/span> عندها.", "غلط: <span class=\"en\">Archetype<\/span> مفهوم عند <span class=\"en\">Jung<\/span>."]}, {"t": "write", "h": "", "q": "اذكر فكرة واحدة من <span class=\"en\">Jung<\/span> أو <span class=\"en\">Lacan<\/span> أو <span class=\"en\">Kristeva<\/span>، وكيف تُستخدم في قراءة قصيدة.", "a": "مثال: عند <span class=\"en\">Jung<\/span> نسأل أي <span class=\"en\">Archetype<\/span> يظهر (مثل الظل أو رحلة البطل). وعند <span class=\"en\">Kristeva<\/span> ننظر إلى الإيقاع والصوت كجزء من المعنى.", "key": "intensive-2:essay", "i": 19}, {"t": "end", "h": "", "teaser": "ما درسته: <span class=\"en\">Jung<\/span> (اللاوعي الجمعي والنماذج الأصلية)، <span class=\"en\">Lacan<\/span> (مرحلة المرآة والمستويات الثلاثة والرغبة)، <span class=\"en\">Kristeva<\/span> (<span class=\"en\">Semiotic<\/span> و<span class=\"en\">Symbolic<\/span> و<span class=\"en\">Abjection<\/span> والتناص). الدرس القادم: <span class=\"en\">Bloom<\/span> و<span class=\"en\">Frye<\/span>.", "extra": "المصادر: Lacan, The Mirror Stage (1936/1949) <a href=\"https://plato.stanford.edu/Entries/lacan/\" target=\"_blank\" rel=\"noopener\">https://plato.stanford.edu/Entries/lacan/<\/a> ; Kristeva, Revolution in Poetic Language (1974); Powers of Horror (1980).", "i": 20}];</script>
