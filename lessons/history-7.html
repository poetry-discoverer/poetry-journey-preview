<script>window.LESSON_ID="history-7";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"ألغاز العصر القديم + قفلة محطة العصر القديم (مراجعة وامتحان)\"<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🧩<\/span><\/span> درس النهاردة نصين: النص الأول لطيف ومسلّي: ألغاز العصر القديم. والنص التاني جاد: نقفل محطة العصر القديم كلها بمراجعة سريعة وامتحان المحطة.<\/div><div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: ليه ألغاز؟ <span class=\"em\"><span class=\"em\">🤔<\/span><\/span><\/div>", "n": 3, "i": 0, "a": "history-7-001", "x": "3133288a"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الفكرة:<\/div><div class=\"li\">الأنجلو-ساكسون كانوا بيحبوا اللعب بالكلام زينا بالظبط. القاعة بالليل محتاجة تسلية، والألغاز كانت من أحلى ألعابها.<\/div><div class=\"li\">مثال يومي: فاكر لعبة \"أقولك على حاجة وانت تخمن\" واحنا صغيرين؟ \"أخضر في البيت، أسود في السوق، أحمر في النار\" (الشاي)؟ نفس المتعة عندهم.<\/div>", "n": 2, "i": 1, "a": "history-7-002", "x": "029b8a35"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> بطاقة المجموعة:<\/div><div class=\"li\">كتاب <span class=\"en\">Exeter Book<\/span> (صاحبنا من درس 2) فيه حوالي 94 لغز (الدارسون بيتناقشوا في العدد بالظبط لأن حدود القصايد مش واضحة دايماً).<\/div><div class=\"li\">مكتوبة كلها بشعر <span class=\"en\">alliterative<\/span> زي ما اتعلمنا.<\/div><div class=\"li\">ملحوظة طريفة: المخطوطة مفيهاش الحلول! الحلول اللي عندنا النهاردة شغل دارسين عبر قرون، وفي ألغاز لسه عليها خلاف لحد دلوقتي.<\/div>", "n": 3, "i": 2, "a": "history-7-003", "x": "74038d00"}, {"t": "learn", "h": "<div class=\"li\">أغلب الألغاز بتخلص بجملة شبه ثابتة: \"قول أنا مين!\" (<span class=\"en\">Say what I am called<\/span>). يعني كانت بتتقال كتسلية صوتية في القعدة.<\/div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: نماذج من الألغاز <span class=\"em\"><span class=\"em\">🎁<\/span><\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> النموذج الأشهر: لغز 47 (الحل: عثة الكتب)<\/div>", "n": 3, "i": 3, "a": "history-7-004", "x": "8789c35b"}, {"t": "learn", "h": "<div class=\"lead\">\"<span class=\"en\">A moth ate words<\/span>\" بيبدأ هكذا:<\/div><div class=\"u\">\"<span class=\"en\">Mo<\/span>ðð<span class=\"en\">e word fr<\/span>æ<span class=\"en\">t.<\/span> <span class=\"en\">Me<\/span> þæ<span class=\"en\">t<\/span> þ<span class=\"en\">uhte wr<\/span>ǣ<span class=\"en\">tlicu wyrd<\/span>\"<\/div><div class=\"u\">المعنى: \"عثة أكلت كلمات. شفت ده قدر غريب وعجيب: إن دودة تبلع قصيدة إنسان، حرامي في الضلمة ياكل كلام مجيد وأساسه قوي. والحرامي ده مازداش حكمة ولا حبة، رغم إنه بلع الكلام كله.\"<\/div><div class=\"li\">شايف الروح؟ ده لغز ونكتة فلسفية في نفس الوقت: اللي بياكل الكتب مش بيتعلم منها حاجة.<\/div>", "n": 3, "i": 4, "a": "history-7-005", "x": "bf101df1"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> نماذج تانية (بلا أرقام عشان الترقيم عليه خلاف):<\/div><div class=\"li\">لغز العاصفة: صوت مرعب بيهز البيوت والبحر، مين أنا؟<\/div><div class=\"li\">لغز الدرع: \"أنا وحيد، متجرح بالسيوف، متضرب بالدروع، متعب من الحرب\"، مين أنا؟ (لاحظ: الجماد بيتكلم عن نفسه، زي الصليب في الدرس اللي فات!)<\/div><div class=\"li\">لغز البصلة: بتفصيلها وطبقاتها.<\/div><div class=\"li\">ولغز البجعة، والسيف، والعجلة.<\/div>", "n": 5, "i": 5, "a": "history-7-006", "x": "69f9dd36"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> سر المتعة:<\/div><div class=\"li\">الحلول أغلبها حاجات يومية بسيطة: درع، عثة، بصلة، عاصفة. العبقرية إنك تشوف المألوف بعين جديدة.<\/div><div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: ليه الألغاز مهمة أدبياً؟ <span class=\"em\"><span class=\"em\">🌟<\/span><\/span><\/div><div class=\"u\">١. التشخيص (<span class=\"en\">personification<\/span>): الجماد بيتكلم بصيغة \"أنا\". نفس الفكرة اللي شفناها في <span class=\"en\">The Dream of the Rood.<\/span><\/div><div class=\"u\">٢. شبيه الـ <span class=\"en\">kenning<\/span>: اللغز كله وصف ملتف للحاجة بدل اسمها، يعني تدريب عملي على عين الشاعر.<\/div>", "n": 4, "i": 6, "a": "history-7-007", "x": "71ea1e6b"}, {"t": "learn", "h": "<div class=\"u\">٣. شباك على الحياة اليومية: الألغاز بتحكي عن أدوات ومطبخ وطبيعة، فبتورينا تفاصيل عاشوها الملاحم ما تهتمش بيها.<\/div><div class=\"u\">٤. الذكاء الاجتماعي: الألغاز لعبة قعدة، يعني الأدب عندهم مش بس جد وبطولة، فيه مرح وهزار.<\/div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: قفلة محطة العصر القديم، المراجعة السريعة <span class=\"em\"><span class=\"em\">📦<\/span><\/span><\/div>", "n": 3, "i": 7, "a": "history-7-008", "x": "c676cadd"}, {"t": "learn", "h": "<div class=\"lead\">خد المحطة كلها في سطور:<\/div><div class=\"li\">درس 2: دنيا العصر (أنجلو-ساكسون، ممالك، فايكنج، أديرة) + الـ <span class=\"en\">scop<\/span> + القاعة + <span class=\"en\">alliteration<\/span> و<span class=\"en\">kenning.<\/span><\/div><div class=\"li\">دروس 3-4: <span class=\"en\">Beowulf<\/span>: جرندل وأمه والتنين، والقيم الخمس (<span class=\"en\">comitatus<\/span>، <span class=\"en\">wyrd<\/span>، <span class=\"en\">lof<\/span>، الكرم، العزلة).<\/div><div class=\"li\">درس 5: الرثاءات: <span class=\"en\">The Wanderer<\/span> و<span class=\"en\">The Seafarer<\/span>، وصوت \"الأنا\"، و<span class=\"en\">ubi sunt.<\/span><\/div>", "n": 3, "i": 8, "a": "history-7-009", "x": "4e41fdcf"}, {"t": "learn", "h": "<div class=\"li\">درس 6: الشعر الديني: <span class=\"en\">Caedmon<\/span> أول شاعر معروف بالاسم، و<span class=\"en\">The Dream of the Rood<\/span> والصليب المتكلم.<\/div><div class=\"li\">درس 7: الألغاز وروح المرح.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> لو لخصت المحطة في جملة: شعر شفهي بطولي اتكتب بأيد رهبان، موسيقاه <span class=\"en\">alliteration<\/span>، قلبه القاعة، وهمومه الشرف والقدر والمجد والعزلة.<\/div>", "n": 3, "i": 9, "a": "history-7-010", "x": "265d4f8e"}, {"t": "write", "h": "", "q": "ارسم بكلامك صورة يوم كامل في الـ <span class=\"en\">mead-hall<\/span>: مين موجود، بيعملوا إيه، ودور الـ <span class=\"en\">scop<\/span> فيهم.", "key": "history-7:1", "n": 1, "i": 10}, {"t": "write", "h": "", "q": "قارن بين <span class=\"en\">Beowulf<\/span> و<span class=\"en\">The Wanderer<\/span> من حيث: نوع البطل، مكان الحدث، والسؤال الكبير اللي كل قصيدة بتسأله.", "key": "history-7:2", "n": 1, "i": 11}, {"t": "write", "h": "", "q": "اشرح 3 مصطلحات لأي حد مش في الكورس: <span class=\"en\">alliteration<\/span>، <span class=\"en\">kenning<\/span>، <span class=\"en\">ubi sunt.<\/span> مع مثال لكل واحد.", "key": "history-7:3", "n": 1, "i": 12}, {"t": "write", "h": "", "q": "حكاية <span class=\"en\">Caedmon<\/span> بتحكيها لصاحبك في دقيقتين: هتقول إيه؟", "key": "history-7:4", "n": 1, "i": 13}, {"t": "write", "h": "", "q": "سؤال تفكير: لو اختفت كل مخطوطات العصر القديم ما عدا واحدة، تختار تنجو <span class=\"en\">Exeter Book<\/span> ولا مخطوطة <span class=\"en\">Beowulf<\/span>؟ ليه؟ (مفيش إجابة غلط، المهم حجتك.)", "key": "history-7:5", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📢<\/span><\/span> المحطة الجاية الدرس الجاي: سنة 1066، الغزو النورماندي، واللغة اللي هتتولد من اللخبطة. بداية العصر الوسيط.<\/div>", "n": 1, "i": 15, "a": "history-7-011", "x": "23bbc407"}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 16}];</script>
