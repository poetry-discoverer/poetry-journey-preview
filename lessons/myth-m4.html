<h1>الدرس M4: الطوفان الإغريقي — Deucalion وPyrrha</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس M4</span><span class="tag"><span class="em">🏛️</span> كورس الميثولوجيا</span></div>

<script>window.LESSON_ID="myth-m4";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 1) ليه الحكاية دي هتبقى مألوفة ليك؟</div><div class=\"li\">كل حضارة قديمة عندها قصة طوفان: عندنا قصة سيدنا نوح في القرآن والتوراة، والإغريق عندهم نسختهم.</div><div class=\"li\">وهتلاقي نفس الهيكل: فساد البشر <span class=\"em\"><span class=\"em\">←</span></span> غضب إلهي <span class=\"em\"><span class=\"em\">←</span></span> طوفان <span class=\"em\"><span class=\"em\">←</span></span> ناجي صالح <span class=\"em\"><span class=\"em\">←</span></span> بشرية جديدة. مقارنة القصص دي مهارة امتحان بحد ذاتها.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 2) السبب: الملك <span class=\"en\">Lycaon</span></div>", "n": 4, "i": 0, "a": "myth-m4-001", "x": "af1d2fb1"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Zeus</span> نزل يتفقد البشر متنكراً، فاختبره ملك اسمه <span class=\"en\">Lycaon</span>: قدّم له لحم إنسان في الأكل عشان يشوف هيعرف ولا لأ.</div><div class=\"li\"><span class=\"en\">Zeus</span> غضب: حرق قصره وحوّل <span class=\"en\">Lycaon</span> نفسه لذئب.</div><div class=\"li\">من الحكاية دي جت كلمة <span class=\"en\">lycanthropy</span> (التحول لذئب) — ومنها كل أفلام المستذئبين (<span class=\"en\">werewolf</span>) لحد النهارده.</div><div class=\"li\">وقرر <span class=\"en\">Zeus</span>: البشرية الفاسدة دي لازم تتغسل.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 3) الطوفان</div>", "n": 5, "i": 1, "a": "myth-m4-002", "x": "4721d9ce"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Zeus</span> (ومعه <span class=\"en\">Poseidon</span> في نسخة <span class=\"en\">Ovid</span>) فتح السما والبحر، فغرقت الأرض كلها: الجبال بقت جزر والأسماك بتعوم فوق الغيطان.</div><div class=\"li\">مين الناجي الوحيد؟ <span class=\"en\">Deucalion</span> ابن <span class=\"en\">Prometheus</span> (اللي هناخده الدرس الجاي) ومراته <span class=\"en\">Pyrrha</span> بنت <span class=\"en\">Epimetheus.</span></div><div class=\"li\">زوجين صالحين، ركبوا مركب صغيرة وطافوا فوق المية، لحد ما وقفوا على قمة جبل <span class=\"en\">Parnassus</span> — افتكر الجبل ده من <span class=\"en\">M1</span>: جبل الـ <span class=\"en\">Muses.</span></div>", "n": 3, "i": 2, "a": "myth-m4-003", "x": "0c90f889"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 4) نبوءة <span class=\"en\">Themis</span>: أحلى لغز في الدرس</div><div class=\"u\">لما المية نشفت وشافوا الأرض فاضية، وقفوا قدام معبد آلهة اسمها <span class=\"en\">Themis</span> (العدل/الناموس) وسألوها: إزاي نرجّع البشر؟ (من نص <span class=\"en\">Ovid</span> بترجمة <span class=\"en\">Brookes More</span>):</div><div class=\"u\">\"<span class=\"en\">Depart from me and veil your brows</span>; <span class=\"en\">ungird your robes,</span> <span class=\"en\">and cast behind you as you go,</span> <span class=\"en\">the bones of your great mother.</span>\"</div>", "n": 3, "i": 3, "a": "myth-m4-004", "x": "f3ae85e7"}, {"t": "learn", "h": "<div class=\"u\">(\"ارحلوا عني وغطّوا رؤوسكم، وحلّوا أحزمتكم، وارموا ورا ظهوركم وانتوا ماشيين عظام أمكم الكبيرة.\")</div><div class=\"li\"><span class=\"en\">Pyrrha</span> اتهلعت: أنبّش قبور؟ أدنّس عظام أمي؟ ورفضت.</div><div class=\"li\">بس <span class=\"en\">Deucalion</span> فكّر وفك اللغز:</div><div class=\"u\">\"<span class=\"en\">Our mother is the Earth,</span> <span class=\"en\">and I may judge the stones of earth are bones that we should cast behind us as we go.</span>\"</div><div class=\"u\">(\"أمنا هي الأرض، وعظامها هي حجارة الأرض — دي اللي نرميها.\")</div>", "n": 5, "i": 4, "a": "myth-m4-005", "x": "67d730f8"}, {"t": "learn", "h": "<div class=\"li\">درس امتحاني: النبوءات في الأسطورة دايماً متلغزة، والبطل الذكي هو اللي بيفك الرمز مش اللي بياخد الكلام حرفياً.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 5) البشرية التانية من الحجر</div><div class=\"u\">رميا الحجارة وراهم، والحجارة لانت وكبرت واتشكلت ناس — الأول \"زي تمثال رخام لسه بيتنحت\":</div>", "n": 3, "i": 5, "a": "myth-m4-006", "x": "9a8bc269"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">every stone Deucalion threw should take the form of man,</span> <span class=\"en\">and those by Pyrrha cast should woman's form assume</span>: <span class=\"en\">so are we hardy to endure and prove by toil and deeds from what we sprung.</span>\"</div><div class=\"u\">(حجارة <span class=\"en\">Deucalion</span> بقت رجالة وحجارة <span class=\"en\">Pyrrha</span> بقت ستات: \"وعشان كده احنا جيل صلب بيتحمل وبيثبت بالشغل والتعب أصلنا منين\".)</div>", "n": 2, "i": 6, "a": "myth-m4-007", "x": "ee600a8e"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">_____ stone Deucalion threw should take the form of man,</div>", "opts": ["should", "every", "stood"], "ans": 1, "why": "<span class=\"en\">every stone Deucalion threw should take the form of man,</span>", "i": 7, "ex": ["غلط: <span class=\"en\">should</span> موجودة بعد <span class=\"en\">Deucalion threw</span> في الجملة نفسها، وتكرارها في البداية يفسد التركيب.", "صح: <span class=\"en\">every stone Deucalion threw should take the form of man</span>، أي: كل حجر رماه <span class=\"en\">Deucalion</span> يتحول إلى هيئة إنسان.", "غلط: <span class=\"en\">stood</span> فعل (وقف)، ولا يأتي قبل الاسم <span class=\"en\">stone</span> هنا."]}, {"t": "learn", "h": "<div class=\"li\">لاحظ الفكرة: الجيل الجديد \"جاي من حجر\" عشان كده قاسي وبيكدح — تفسير رمزي للشقاء الإنساني.</div><div class=\"li\">ومن ولادهم جه <span class=\"en\">Hellen</span>، ومنه اتسمى اليونانيون أنفسهم \"<span class=\"en\">Hellenes</span>\" وبلدهم <span class=\"en\">Hellas</span> — اسم اليونان الحقيقي لحد النهارده.</div>", "n": 2, "i": 8, "a": "myth-m4-008", "x": "221addc9"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 6) الأسطورة في الشعر الإنجليزي:</div><div class=\"u\">أ) <span class=\"en\">Milton</span>، <span class=\"en\">Paradise Lost</span> الكتاب 11 (الأسطر 11-14): آدم واقف يصلي نادماً بعد الخطيئة، فميلتون يشبهه:</div><div class=\"u\">\"...<span class=\"en\">with prayers</span> / ...<span class=\"en\">Deucalion and chaste Pyrrha,</span> <span class=\"en\">to restore</span> / <span class=\"en\">The race of mankind drowned,</span> <span class=\"en\">before the shrine</span> / <span class=\"en\">Of Themis stood devout.</span>\"</div>", "n": 2, "i": 9, "a": "myth-m4-009", "x": "b40e1a32"}, {"t": "learn", "h": "<div class=\"u\">(زي <span class=\"en\">Deucalion</span> و<span class=\"en\">Pyrrha</span> العفيفة وقفوا متدينين قدام مذبح <span class=\"en\">Themis</span> عشان يرجّعوا البشرية المغرقة.)</div>", "n": 1, "i": 10, "a": "myth-m4-010", "x": "27a3306d"}, {"t": "learn", "h": "<div class=\"u\">والعبقرية إن ميلتون قبلها بسطور كتب: \"<span class=\"en\">Prevenient Grace descending had remov'd</span> / <span class=\"en\">The stonie from thir hearts,</span> &<span class=\"en\">amp</span>; <span class=\"en\">made new flesh</span>\" — النعمة النازلة شالت الحجر من قلوبهم وعملتهم لحم جديد. يعني عكس <span class=\"en\">Ovid</span> بالظبط: عند <span class=\"en\">Ovid</span> الحجر بقى بشر، عند ميلتون القلوب الحجرية هي اللي لانت. الأسطورة الوثنية اتعمّدت تاني — نفس حركة <span class=\"en\">M1</span> و<span class=\"en\">M3.</span></div>", "n": 1, "i": 11, "a": "myth-m4-011", "x": "7a3f5ae5"}, {"t": "learn", "h": "<div class=\"u\">ب) في <span class=\"en\">Ovid</span> نفسه (المصدر الأصلي): الخاتمة اللي فوق (\"<span class=\"en\">so are we hardy to endure.</span>..\") بتيجي في الامتحان كتير لأنها ربط الأسطورة بشقاء البشر.</div>", "n": 1, "i": 12, "a": "myth-m4-012", "x": "9fd218d9"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 7) المقارنة مع قصة نوح (سؤال كلاسيكي):</div><div class=\"li\">متشابه: غضب إلهي من الفساد <span class=\"em\"><span class=\"em\">←</span></span> طوفان <span class=\"em\"><span class=\"em\">←</span></span> ناجي صالح بأهله <span class=\"em\"><span class=\"em\">←</span></span> إعادة عمارة الأرض.</div><div class=\"li\">مختلف: عندنا السفينة والحيوانات والوعد، وعندهم النبوءة المتلغزة والحجارة. عندهم البشر الجداد \"من حجر\"، وعندنا البشر من نسل نوح.</div>", "n": 2, "i": 13, "a": "myth-m4-013", "x": "a3df8b17"}, {"t": "learn", "h": "<div class=\"li\">في الامتحان: اسم النوع ده \"<span class=\"en\">flood myth</span>\" وأسطورة <span class=\"en\">Deucalion</span> هي النسخة الإغريقية-الرومانية اللي الشعراء الإنجليز بيرجعولها.</div>", "n": 1, "i": 14, "a": "myth-m4-014", "x": "55c3d4b0"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 8) كلمات من درس النهارده:</div><div class=\"u\"><span class=\"en\">lycanthropy</span> / <span class=\"en\">werewolf</span> • <span class=\"en\">diluvial/antediluvian</span> (قبل الطوفان — بتتقال كناية عن حاجة قديمة أوي: \"<span class=\"en\">antediluvian ideas</span>\") • <span class=\"en\">Parnassus</span> • <span class=\"en\">Themis</span> (رمز العدالة بالميزان في المحاكم لحد النهارده).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">✏️</span></span> كويز <span class=\"en\">M4</span> (بعد ٣٠ دقيقة — جاوب مقالي أو بفويس):</div>", "n": 2, "i": 15, "a": "myth-m4-015", "x": "8b5f83df"}, {"t": "learn", "h": "<div class=\"u\">١) احكِ قصة <span class=\"en\">Lycaon</span>، وقول إيه الكلمة الإنجليزية اللي طلعت منها واللي لسه بنستخدمها في أفلام الرعب.</div><div class=\"u\">٢) اكتب نص نبوءة <span class=\"en\">Themis</span>، واشرح إزاي <span class=\"en\">Deucalion</span> فك اللغز، وليه ده \"درس في قراءة الرموز\".</div><div class=\"u\">٣) ترجم واشرح الجملة الختامية من <span class=\"en\">Ovid</span> (\"<span class=\"en\">so are we hardy to endure.</span>..\") — إيه تفسير الأسطورة لشقاء البشر؟</div>", "n": 3, "i": 16, "a": "myth-m4-016", "x": "0d0b670e"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">so are we hardy to _____.</div>", "opts": ["endure", "chaste", "stone"], "ans": 0, "why": "<span class=\"en\">so are we hardy to endure.</span>", "i": 17, "ex": ["صح: <span class=\"en\">so are we hardy to endure</span>، أي: لذلك نحن أقوياء نتحمل. الفكرة أن البشر خرجوا من الحجارة فصاروا صلبين.", "غلط: <span class=\"en\">chaste</span> تعني عفيفاً، ولا تأتي بعد <span class=\"en\">hardy to</span>.", "غلط: <span class=\"en\">stone</span> اسم، وبعد <span class=\"en\">to</span> نحتاج فعلاً (<span class=\"en\">endure</span>) لا اسماً."]}, {"t": "learn", "h": "<div class=\"u\">٤) إزاي ميلتون استخدم <span class=\"en\">Deucalion</span> و<span class=\"en\">Pyrrha</span> في <span class=\"en\">Paradise Lost</span> الكتاب 11؟ وإيه \"الانعكاس\" اللي عمله بالحجارة؟</div><div class=\"u\">٥) قارن بين الطوفان الإغريقي وقصة سيدنا نوح في ٣ نقاط تشابه ونقطتين اختلاف.</div>", "n": 2, "i": 18, "a": "myth-m4-017", "x": "89c3ab24"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🔗</span></span> روابط:</div><div class=\"li\"><span class=\"en\">Ovid,</span> <span class=\"en\">Metamorphoses</span> الكتاب 1 (ترجمة <span class=\"en\">Brookes More</span> — قصة الطوفان كاملة): <a class=\"en\" href=\"https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.02.0028%3Abook%3D1\" target=\"_blank\" rel=\"noopener\">https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.02.0028%3Abook%3D1</a></div><div class=\"li\"><span class=\"en\">Paradise Lost</span> الكتاب 11 (1674): <a class=\"en\" href=\"https://www.poetryfoundation.org/poems/45747/paradise-lost-book-11-1674-version\" target=\"_blank\" rel=\"noopener\">https://www.poetryfoundation.org/poems/45747/paradise-lost-book-11-1674-version</a></div>", "n": 2, "i": 19, "a": "myth-m4-018", "x": "a74e80cd"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Ovid</span> الكتاب 1 بالإنجليزي (نسخة تانية للمقارنة): <a class=\"en\" href=\"https://www.theoi.com/Text/OvidMetamorphoses1.html\" target=\"_blank\" rel=\"noopener\">https://www.theoi.com/Text/OvidMetamorphoses1.html</a></div>", "n": 1, "i": 20, "a": "myth-m4-019", "x": "90fc300c"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🖼️</span></span> صور مقترحة للكتاب:</div><div class=\"li\">\"<span class=\"en\">Jupiter and Lycaon</span>\" (تحول الملك لذئب) — رسومات قديمة على <span class=\"en\">Wikimedia Commons</span></div><div class=\"li\">\"<span class=\"en\">Deucalion and Pyrrha</span>\" — اللوحات الكلاسيكية لرمي الحجارة (<span class=\"en\">Wikimedia Commons</span>)</div>", "n": 2, "i": 21, "a": "myth-m4-020", "x": "137bfd82", "hide": true}, {"t": "end", "h": "", "teaser": "", "extra": "(المصادر: <span class=\"en\">Ovid,</span> <span class=\"en\">Metamorphoses</span> الكتاب 1 (ترجمة <span class=\"en\">Brookes More 1922</span> — النص الكامل على <span class=\"en\">Perseus)</span>؛ <span class=\"en\">Paradise Lost</span> الكتاب 11 (<span class=\"en\">Poetry Foundation)</span>. كل الاقتباسات متراجعة)", "i": 22}];</script>
