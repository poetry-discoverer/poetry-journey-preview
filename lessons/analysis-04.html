<script>window.LESSON_ID="analysis-04";window.STEPS=[{"t":"learn","h":"<div class=\"u\">في الدرس اللي فات: رجال جوفاء محشوين قش، أصوات ناشفة، عيون في الحلم، وفزاعة بتتصرف زي الريح. الجزء ده هو النزول: من الحلم لأرض ميتة، ومنها للنهاية.</div><div class=\"u\">تلات أقسام: أرض الصبار (III)، الوادي المجوف (IV)، والترنيمة الأخيرة (V).</div>","n":2,"i":0,"a":"analysis-04-001","x":"675a0ca8"},{"t":"section","h":"القسم الثالث: أرض الصبار (<span dir=\"ltr\">39-51</span>)","n":1,"i":1},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">39-44</span>:</div><div class=\"u\"><span class=\"en\">This is the dead land / This is cactus land / Here the stone images / Are raised, here they receive / The supplication of a dead man’s hand / Under the twinkle of a fading star.</span></div>","n":2,"i":2,"a":"analysis-04-002","x":"465e5fb2"},{"t":"learn","h":"<div class=\"u\">«ده البلد الميت، ده بلد الصبار». تكرار <span class=\"en\">(anaphora)</span> بيثبّت المكان: صحراء. والصبار نبات بيعيش على لا شيء — حياة قاسية، مش موت كامل.</div><div class=\"u\">«صور حجرية» <span class=\"en\">(stone images)</span> = أصنام. واللي بيصلي ليها «إيد راجل ميت» — صلاة من ميت لأصنام، يعني عبادة بلا روح.</div>","n":2,"i":3,"a":"analysis-04-003","x":"b37af1c1"},{"t":"learn","h":"<div class=\"u\">وفي الآخر «تحت وميض نجمة بتموت» <span class=\"en\">(a fading star)</span>. كل مصادر النور هنا ضعيفة: شمس على عمود مكسور، نجمة بتخبو. مفيش نور كامل في القصيدة.</div>","n":1,"i":4,"a":"analysis-04-004","x":"b10090b6"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">45-51</span>:</div><div class=\"u\"><span class=\"en\">Is it like this / In death’s other kingdom / Waking alone / At the hour when we are / Trembling with tenderness / Lips that would kiss / Form prayers to broken stone.</span></div>","n":2,"i":5,"a":"analysis-04-005","x":"2bbb9a4e"},{"t":"learn","h":"<div class=\"u\">سؤال: هل الحكاية كده في مملكة الموت التانية؟ «نصحى لوحدنا»، وفي اللحظة اللي بنرتجف فيها من الحنية، الشفايف اللي كانت هتبوس... بتصلي لحجر مكسور.</div><div class=\"u\">ده أكثر مكان إنساني في القصيدة: حنية حقيقية. والمأساة إنها بتتحول لعبادة فاشلة — الحب مش لاقي مكان، فيروح للصخر.</div>","n":2,"i":6,"a":"analysis-04-006","x":"3c54c942"},{"t":"learn","h":"<div class=\"u\">«حجر مكسور» <span class=\"en\">(broken stone)</span> بيربط بالمذبح أو الصنم المهدوم. يعني حتى الدين بقى أطلال، والصلاة بتطلع لحاجة مش موجودة.</div>","n":1,"i":7,"a":"analysis-04-007","x":"fc1c326a"},{"t":"section","h":"القسم الرابع: الوادي المجوف (<span dir=\"ltr\">52-67</span>)","n":1,"i":8},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">52-56</span>:</div><div class=\"u\"><span class=\"en\">The eyes are not here / There are no eyes here / In this valley of dying stars / In this hollow valley / This broken jaw of our lost kingdoms.</span></div>","n":2,"i":9,"a":"analysis-04-008","x":"9c8afe6e"},{"t":"learn","h":"<div class=\"u\">العيون اختفت. وفي وادي النجوم الميتة، المكان نفسه بقى «فك مكسور لممالكنا الضايعة» <span class=\"en\">(broken jaw)</span> — صورة جمجمة، وممالك اتكسرت زي ما الفك بيتكسر.</div><div class=\"u\">لاحظ الفرق: في القسم التاني العيون كانت في الحلم؛ هنا مفيش عيون خالص. الغياب بقى كامل.</div>","n":2,"i":10,"a":"analysis-04-009","x":"05f15ac7"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">57-60</span>:</div><div class=\"u\"><span class=\"en\">In this last of meeting places / We grope together / And avoid speech / Gathered on this beach of the tumid river.</span></div>","n":2,"i":11,"a":"analysis-04-010","x":"4433de52"},{"t":"learn","h":"<div class=\"u\">«آخر مكان للقاء»: إحنا بنتحسس بعض في الضلمة و«بنتجنب الكلام»، متجمعين على شط النهر المنتفخ <span class=\"en\">(the tumid river)</span>.</div><div class=\"u\">النهر ده هو حدود عالم الموت في التراث الكلاسيكي والدانتي (ستيكس/أخيرون). و«بنتجنب الكلام» هي خلاصة مشكلة التواصل في القصيدة كلها: قرب بلا لغة.</div>","n":2,"i":12,"a":"analysis-04-011","x":"796fc00d"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">61-67</span>:</div><div class=\"u\"><span class=\"en\">Sightless, unless / The eyes reappear / As the perpetual star / Multifoliate rose / Of death’s twilight kingdom / The hope only / Of empty men.</span></div>","n":2,"i":13,"a":"analysis-04-012","x":"2fe8e0b7"},{"t":"learn","h":"<div class=\"u\">إحنا عميان «إلا لو» العيون رجعت كنجمة دايمة وكوردة متعددة الأوراق <span class=\"en\">(multifoliate rose)</span>.</div><div class=\"u\">الوردة دي من <span class=\"en\">Paradiso</span> لدانتي: الوردة اللي بيقعد عليها المباركون في الجنة. يعني الأمل الوحيد هو صورة من الجنة — لكنه «أمل الرجال الفاضيين بس».</div>","n":2,"i":14,"a":"analysis-04-013","x":"cc9b5617"},{"t":"section","h":"القسم الخامس: الترنيمة والنهاية (<span dir=\"ltr\">68-98</span>)","n":1,"i":15},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">68-71</span>:</div><div class=\"u\"><span class=\"en\">Here we go round the prickly pear / Prickly pear prickly pear / Here we go round the prickly pear / At five o’clock in the morning.</span></div>","n":2,"i":16,"a":"analysis-04-014","x":"323f04c0"},{"t":"learn","h":"<div class=\"u\">ده على وزن ترنيمة أطفال إنجليزية <span class=\"en\">(Here we go round the mulberry bush)</span>، بس الشجرة بقت صبار شائك. رقصة دائرية بتاعة عيال في أرض ميتة.</div><div class=\"u\">و«الساعة خمسة الصبح» — وقت الأرق واليأس، قبل الفجر. الحركة دائرية: برضه مفيش تقدم.</div>","n":2,"i":17,"a":"analysis-04-015","x":"046f5f39"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">72-76</span>:</div><div class=\"u\"><span class=\"en\">Between the idea / And the reality / Between the motion / And the act / Falls the Shadow</span></div>","n":2,"i":18,"a":"analysis-04-016","x":"09ad5188"},{"t":"learn","h":"<div class=\"u\">الظل <span class=\"en\">(the Shadow)</span> بيقع بين الفكرة والواقع، وبين الحركة والفعل. يعني: المسافة بين النية والتنفيذ. وده تعريف الشلل اللي شفناه في Prufrock، هنا بقى قانون.</div><div class=\"u\">لاحظ التركيب: «بين... وبين... يقع الظل». بيتكرر تلات مرات بتوسّع — زي تعويذة.</div>","n":2,"i":19,"a":"analysis-04-017","x":"8cb6a47b"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">77-83</span>:</div><div class=\"u\"><span class=\"en\">For Thine is the Kingdom / Between the conception / And the creation / Between the emotion / And the response / Falls the Shadow / Life is very long</span></div>","n":2,"i":20,"a":"analysis-04-018","x":"1f2cd74b"},{"t":"learn","h":"<div class=\"u\">«<span class=\"en\">For Thine is the Kingdom</span>» من الصلاة الربانية (لك الملك). بس مبتكمّلش: «لك الملك والقوة والمجد». الصلاة مقطوعة، واللي فاضل جزء.</div><div class=\"u\">وبعدها «الحياة طويلة جدًا» <span class=\"en\">(Life is very long)</span> — جملة عادية بتوقع زي حجر. مش شكوى، ده إقرار بثقل الوقت.</div>","n":2,"i":21,"a":"analysis-04-019","x":"7e0bba04"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">84-91</span>:</div><div class=\"u\"><span class=\"en\">Between the desire / And the spasm / Between the potency / And the existence / Between the essence / And the descent / Falls the Shadow / For Thine is the Kingdom</span></div>","n":2,"i":22,"a":"analysis-04-020","x":"79d5b625"},{"t":"learn","h":"<div class=\"u\">توسّع أخير: بين الرغبة والتشنّج، بين القدرة والوجود، بين الجوهر والنزول — يقع الظل. المقاطع بقت أقصر وأسرع، والظل بيغطي كل حاجة: الجسد، والإرادة، والوجود نفسه.</div>","n":1,"i":23,"a":"analysis-04-021","x":"5cc8dfeb"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">92-94</span>:</div><div class=\"u\"><span class=\"en\">For Thine is / Life is / For Thine is the</span></div>","n":2,"i":24,"a":"analysis-04-022","x":"8093553d"},{"t":"learn","h":"<div class=\"u\">تلات شظايا مكسورة: «لك...»، «الحياة...»، «لك الـ...». الجمل مبتكملش. دي لحظة انهيار اللغة نفسها — زي حالة فقدان اللغة <span class=\"en\">(aphasia)</span> أو صلاة حد بيموت.</div><div class=\"u\">وده مش عبث: القصيدة بتعمل الفراغ على مستوى الجملة، مش بس المعنى.</div>","n":2,"i":25,"a":"analysis-04-023","x":"bc6e488b"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">95-98</span>:</div><div class=\"u\"><span class=\"en\">This is the way the world ends / This is the way the world ends / This is the way the world ends / Not with a bang but a whimper.</span></div>","n":2,"i":26,"a":"analysis-04-024","x":"f121a429"},{"t":"learn","h":"<div class=\"u\">تلات تكرارات، وبعدها الحكم: «مش بفرقعة، لكن بنحيب» <span class=\"en\">(Not with a bang but a whimper)</span>.</div><div class=\"u\">الفرقعة <span class=\"en\">(bang)</span> = نهاية درامية، انفجار، نهاية أسطورية. النحيب <span class=\"en\">(whimper)</span> = صوت ضعيف من كائن بيموت. يعني نهاية العالم مش كارثة كبيرة، لكن تلاشي بطيء.</div>","n":2,"i":27,"a":"analysis-04-025","x":"82994a37"},{"t":"learn","h":"<div class=\"u\">والسطر ده بيرجع للاستهلالين: دمية Guy Fawkes بتحترق ببطء مش بتنفجر، وكورتز، آخر كلامه كان «The horror! The horror!». القصيدة كلها بتحقق السطر الأخير من أول كلمة فيها.</div>","n":1,"i":28,"a":"analysis-04-026","x":"770c2a5d"},{"t":"section","h":"الأدوات البلاغية","n":1,"i":29},{"t":"learn","h":"<div class=\"li\">الإحالة <span class=\"en\">(allusion)</span>: دانتي (الوردة المتعددة، النهر)، الصلاة الربانية، ترنيمة الأطفال، Conrad، Guy Fawkes.</div><div class=\"li\">الرمز <span class=\"en\">(symbol)</span>: الصبار، الحجر المكسور، العيون، الوردة، الظل، النهر.</div><div class=\"li\">التكرار والتعاويذ: «<span class=\"en\">Between… and… Falls the Shadow</span>»، «<span class=\"en\">This is the way the world ends</span>».</div>","n":3,"i":30,"a":"analysis-04-027","x":"e8db1cf7"},{"t":"learn","h":"<div class=\"li\">القطع <span class=\"en\">(fragmentation)</span>: «<span class=\"en\">For Thine is / Life is / For Thine is the</span>» — جمل من غير نهاية.</div><div class=\"li\">التناقض الدرامي <span class=\"en\">(anticlimax / bathos)</span>: نهاية العالم بنحيب، مش بفرقعة.</div><div class=\"li\">الشعر الحر بإيقاع ترنيمة: الوزن مش منتظم، لكن النَفَس متساوي زي الورد.</div>","n":3,"i":31,"a":"analysis-04-028","x":"18e7a099"},{"t":"section","h":"الموضوعات","n":1,"i":32},{"t":"learn","h":"<div class=\"u\">الفراغ الروحي والعبادة الفاشلة: صلاة لإيد ميتة، شفايف بتصلي لحجر مكسور، وصلاة ربانية مقطوعة. والمسافة بين النية والفعل (الظل). والعزلة: نتحسس بعض ونتجنب الكلام.</div>","n":1,"i":33,"a":"analysis-04-029","x":"9b20c13e"},{"t":"learn","h":"<div class=\"u\">والنهاية: عالم بينتهي بضعف مش بانفجار. القصيدة مش بتعظ النهاية — هي بتشاور على ناس عايشين بعد النهاية أصلًا، في مملكة الشفق.</div>","n":1,"i":34,"a":"analysis-04-030","x":"0842b797"},{"t":"section","h":"أسئلة امتحان","n":1,"i":35},{"t":"learn","h":"<div class=\"lead\">سؤال ١: ناقش السطر الأخير «Not with a bang but a whimper» كخلاصة للقصيدة.</div><div class=\"u\">عناصر: التناقض مع النهاية الملحمية؛ الربط بدمية القش المحترقة وكورِتز؛ النحيب = صوت ضعيف من كائن بيموت؛ والنهاية الشخصية (موت الفرد) زي نهاية العالم.</div>","n":2,"i":36,"a":"analysis-04-031","x":"dfcdf9f6"},{"t":"learn","h":"<div class=\"lead\">سؤال ٢: إزاي بيشتغل تكرار «Falls the Shadow»؟</div><div class=\"u\">عناصر: التركيب «بين... وبين... يقع الظل»؛ الظل = المسافة بين النية والتنفيذ؛ التوسّع من الفكرة/الواقع للجسد/الوجود؛ والإيقاع التعاويذي.</div>","n":2,"i":37,"a":"analysis-04-032","x":"62e42300"},{"t":"learn","h":"<div class=\"lead\">سؤال ٣: ناقش الصور الدينية في القصيدة.</div><div class=\"u\">عناصر: «<span class=\"en\">For Thine is the Kingdom</span>» المقطوعة، «<span class=\"en\">prayers to broken stone</span>»، «<span class=\"en\">multifoliate rose</span>» من دانتي، والصلاة اللي بتنهار في <span dir=\"ltr\">92-94</span>. الدين حاضر كأمل ضعيف وكأطلال.</div>","n":2,"i":38,"a":"analysis-04-033","x":"3dc42ab3"},{"t":"learn","h":"<div class=\"lead\">سؤال ٤: القصيدة صورة لما بعد الحرب العالمية الأولى — ناقش.</div><div class=\"u\">عناصر: أرض ميتة وصبار، ممالك ضايعة، عمود مكسور، نجوم بتموت، ناس بتتحسس في الضلمة. والفراغ الروحي بدل اليقين اللي انهار.</div>","n":2,"i":39,"a":"analysis-04-034","x":"1304210b"},{"t":"section","h":"الكويز","n":1,"i":40},{"t":"mc","h":"","q":"«This is cactus land» بتشير لإيه؟","opts":["أرض ميتة بتنمو فيها حياة قاسية على لا شيء","حدائق إنجليزية","صحراء فيها مية"],"ans":0,"why":"أرض ميتة فيها حياة قاسية.","n":1,"i":41,"ex":["صح: الصبار بيعيش على القليل — حياة قاسية في أرض ميتة، مش موت كامل.","غلط: النص بيقول «dead land» قبلها مباشرة، وده عكس الجنينة.","غلط: مفيش مية في القسم؛ النهر بيظهر بعد كده كنهر موت."]},{"t":"mc","h":"","q":"«Lips that would kiss / Form prayers to broken stone» بتعبّر عن إيه؟","opts":["الحب بيتحول لعبادة فاشلة","قبلة حقيقية","صلاة مقبولة"],"ans":0,"why":"الحب بيتحول لصلاة فاشلة لحجر مكسور.","n":1,"i":42,"ex":["صح: الحنية والرغبة بيتحولوا لصلاة لحجر مكسور — عبادة بلا روح.","غلط: مفيش قبلة في النص؛ الشفايف «كانت هتبوس» وبعدها بتصلي.","غلط: الصلاة هنا لحجر مكسور، يعني فاشلة مش مقبولة."]},{"t":"mc","h":"","q":"«Multifoliate rose» في القسم الرابع جاية من فين؟","opts":["Paradiso لدانتي","قصايد فروست","الكتاب المقدس"],"ans":0,"why":"من Paradiso لدانتي.","n":1,"i":43,"ex":["صح: الوردة المتعددة الأوراق هي وردة المباركين في Paradiso لدانتي.","غلط: فروست مش من عالم القصيدة هنا خالص.","غلط: الصورة دانتية مش إنجيلية، رغم إن الصلاة الربانية موجودة في القسم الخامس."]},{"t":"mc","h":"","q":"«Falls the Shadow» بيعبّر عن إيه؟","opts":["المسافة بين النية والتنفيذ","غروب الشمس","ظل شجرة"],"ans":0,"why":"المسافة بين النية والتنفيذ.","n":1,"i":44,"ex":["صح: الظل بيقع بين الفكرة والواقع، والحركة والفعل — يعني العجز عن التحويل.","غلط: الظل هنا مجازي، مش مشهد طبيعة.","غلط: مفيش شجر في القسم؛ الصورة كلها مجازية."]},{"t":"tf","h":"","q":"القصيدة بتخلص بانفجار كبير.","ans":false,"why":"غلط: «Not with a bang but a whimper» — نهاية ضعيفة مش انفجار.","n":1,"i":45,"ex":["غلط. النص بيقول «not with a bang but a whimper».","صح، الجملة غلط: النهاية نحيب مش فرقعة."]},{"t":"tf","h":"","q":"«For Thine is / Life is / For Thine is the» بتوضح انهيار اللغة نفسها.","ans":true,"why":"صح: شظايا جمل مبتكملش — الصلاة بتنهار على مستوى الجملة.","n":1,"i":46,"ex":["صح، الجملة صح: الجمل مقطوعة وده انهيار لغوي مقصود.","غلط. الشظايا مقصودة، ومش خطأ طباعة."]},{"t":"recall","h":"","q":"إيه اللي بيحصل للعيون في القسم الرابع، وإيه أمل الرجال الفاضيين؟","a":"العيون مش موجودة خالص في الوادي («The eyes are not here»)، والرجال بقوا عميان. الأمل الوحيد إن العيون ترجع كنجمة دايمة وكوردة متعددة الأوراق في مملكة الشفق — يعني أمل ديني مستحيل، و«أمل الرجال الفاضيين» بس.","n":1,"i":47},{"t":"recall","h":"","q":"إزاي بترتبط ترنيمة «Here we go round the prickly pear» بمعنى القصيدة؟","a":"على وزن ترنيمة أطفال، بس الشجرة صبار شائك. رقصة دائرية بتاعة عيال في أرض ميتة، الساعة خمسة الصبح (وقت الأرق). الحركة دائرية بلا تقدم، وده حال الرجال الجوفاء: نشاط شكله لعب ومفيهوش حياة.","n":1,"i":48},{"t":"write","h":"","q":"ناقش السطر الأخير وعلاقته بالاستهلالين وباقي القصيدة.","key":"analysis-04:1","a":"السطر الأخير «This is the way the world ends / Not with a bang but a whimper» بيحوّل النهاية من كارثة درامية لصوت ضعيف. وهو بيكمّل الاستهلالين: دمية Guy Fawkes بتحترق ببطء مش بتنفجر، وKurtz آخر كلامه «The horror! The horror!». والقصيدة كلها بتحقق ده: صلاة مقطوعة، جمل مبتكملش، رقصة دائرية، وأرض ميتة. بعض القراءات بتشوف إن النهاية مش حدث، هي حالة — والرجال الجوفاء عايشين فيها أصلًا. والتكرار التلاتي قبل السطر الأخير بيدي إحساس بالترنيمة اللي بتنتهي بنحيب.","n":1,"i":49},{"t":"write","h":"","q":"حلّل الصور الدينية في القصيدة ووظيفتها.","key":"analysis-04:2","a":"الدين حاضر كأطلال: «prayers to broken stone» صلاة لحجر مكسور، و«For Thine is the Kingdom» جزء من الصلاة الربانية من غير تكملتها، و«multifoliate rose» وردة دانتي اللي بتبقى مجرد أمل للفاضيين، وفي الآخر الشظايا «For Thine is / Life is / For Thine is the» بتوضح انهيار اللغة نفسها. الوظيفة: إليوت بيستخدم لغة الصلاة عشان يوري إن الوسيلة الوحيدة للنجاة موجودة كأثر، مش كتجربة حية. الحرمان أدق من الإنكار: القصيدة مش بتقول مفيش إله، بتقول إحنا مش قادرين نصلي.","n":1,"i":50},{"t":"end","h":"","teaser":"<div class=\"u\">كده The Hollow Men خلصت: أرض ميتة، عيون غايبة، ظل بين كل نية وفعل، ونهاية بنحيب مش بفرقعة.</div><div class=\"u\">الدرس الجاي: Leda and the Swan لييتس — أسطورة، عنف، وتاريخ في 14 سطر.</div>","extra":"المصادر: Eliot, “The Hollow Men” (1925); Dante, Paradiso (الوردة المتعددة) وInferno (نهر الموتى); الصلاة الربانية (متى 6); ترنيمة Here we go round the mulberry bush.","i":51}];</script>
