<h1>تحليل ٣: The Hollow Men لإليوت — القسمان الأول والثاني (السطور <span dir="ltr">1-38</span>)</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">تحليل ٣ من ٥</span><span class="tag"><span class="em">🖋️</span> تحليل القصائد المهمة</span></div>

<script>window.LESSON_ID="analysis-03";window.STEPS=[{"t":"learn","h":"<div class=\"u\">القصيدة التانية في المقرر، وأشهر قصيدة عن الفراغ الروحي بعد الحرب العالمية الأولى. نُشرت 1925، وطولها 98 سطرًا في خمسة أقسام.</div><div class=\"u\">إحنا هناخد القسمين الأول والتاني (السطور <span dir=\"ltr\">1-38</span>)، وفي الدرس اللي بعده الأقسام التلاتة الباقية.</div>","n":2,"i":0,"a":"analysis-03-001","x":"1b642d0e"},{"t":"learn","h":"<div class=\"u\">قبل النص فيه استهلالين (<span class=\"en\">epigraphs</span>)، والاتنين مهمين جدًا: واحد من رواية <span class=\"en\">Heart of Darkness</span> لـ <span class=\"en\">Conrad</span>، والتاني من عادة إنجليزية شعبية. هنبدأ بيهم.</div>","n":1,"i":1,"a":"analysis-03-002","x":"38f025bd"},{"t":"section","h":"الاستهلال الأول: كورِتز","n":1,"i":2},{"t":"learn","h":"<div class=\"lead\">الاستهلال الأول:</div><div class=\"u\"><span class=\"en\">Mistah Kurtz—he dead.</span></div>","n":2,"i":3,"a":"analysis-03-003","x":"5efd0dfa"},{"t":"learn","h":"<div class=\"u\">ده كلام خادم أفريقي في رواية <span class=\"en\">Heart of Darkness</span> لـ <span class=\"en\">Joseph Conrad</span>، اللي اتنشرت مسلسلة سنة 1899 وكتاب سنة 1902، بيعلن موت <span class=\"en\">Kurtz</span>: راجل أبيض راح أفريقيا بمهمة «حضارية» وطلع منها جشع ووحشي.</div><div class=\"u\">الكلام مكسّر (<span class=\"en\">Mistah</span> بدل <span class=\"en\">Mister</span>) عشان يبان لسان الخادم، وده اللي بيخلي الخبر يقع زي طلقة.</div>","n":2,"i":4,"a":"analysis-03-004","x":"a400bc26"},{"t":"learn","h":"<div class=\"u\">ليه إليوت بدأ بكده؟ لأن Kurtz هو «الراجل الأجوف» الأصلي: مشروع كبير، مبادئ عالية، وطلع فراغ. القصيدة بتقول إن الحضارة الحديثة نفسها بقيت كده: شكل من غير جوهر.</div>","n":1,"i":5,"a":"analysis-03-005","x":"68582d19"},{"t":"section","h":"الاستهلال الثاني: الرجل القديم","n":1,"i":6},{"t":"learn","h":"<div class=\"lead\">الاستهلال الثاني:</div><div class=\"u\"><span class=\"en\">A penny for the Old Guy</span></div>","n":2,"i":7,"a":"analysis-03-006","x":"60903487"},{"t":"learn","h":"<div class=\"u\">دي عادة إنجليزية في 5 نوفمبر: عيد <span class=\"en\">Guy Fawkes</span>، اللي حاول يفجّر البرلمان سنة 1605. الأطفال بيعملوا دمية من قش (اسمها <span class=\"en\">the Guy</span>) ويطوفوا بيها ويقولوا «<span class=\"en\">a penny for the Old Guy</span>»، وبعدين يحرقوها.</div><div class=\"u\">يعني: دمية راسها قش، بتحمل شكل إنسان ومفيهاش إنسان. وده بالظبط اللي هيبدأ بيه النص: «<span class=\"en\">Headpiece filled with straw</span>».</div>","n":2,"i":8,"a":"analysis-03-007","x":"d859c551"},{"t":"learn","h":"<div class=\"u\">الاستهلالان مع بعض بيقولوا: إحنا دُمى محشوة، وشخصيات عظيمة ماتت وطلعت فراغ، ومفيش انفجار — فيه احتراق بطيء.</div>","n":1,"i":9,"a":"analysis-03-008","x":"741c1a67"},{"t":"section","h":"السياق والحقبة","n":1,"i":10},{"t":"learn","h":"<div class=\"u\">السياق: بعد الحرب العالمية الأولى (1914-1918) بسبع سنين، أوروبا خسرت ملايين، والإيمان القديم اتكسر. إليوت نفسه كان في لندن، ونشر <span class=\"en\">The Waste Land</span> 1922، وبعدها بسنين دخل الكنيسة الأنجليكانية (1927).</div><div class=\"u\">القصيدة دي بتقع بين الاتنين: يأس كامل، لكن فيها بقايا صلاة.</div>","n":2,"i":11,"a":"analysis-03-009","x":"9fbaf373"},{"t":"learn","h":"<div class=\"u\">لاحظ الشكل: مفيش وزن منتظم ولا مقاطع مقفولة، لكن فيه تكرار وإيقاع تعاويذي (<span class=\"en\">incantatory</span>) — زي حد بيقرا ورد أو ترنيمة. التكرار هو الموسيقى هنا.</div>","n":1,"i":12,"a":"analysis-03-010","x":"22976fb5"},{"t":"section","h":"القسم الأول: رجال جوفاء (<span dir=\"ltr\">1-18</span>)","n":1,"i":13},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-4</span>:</div><div class=\"u\"><span class=\"en\">We are the hollow men / We are the stuffed men / Leaning together / Headpiece filled with straw. Alas!</span></div>","n":2,"i":14,"a":"analysis-03-011","x":"bd6739df"},{"t":"learn","h":"<div class=\"u\">مفارقة (<span class=\"en\">paradox</span>): «جوفاء» و«محشوة» في نفس الوقت. جوفاء من الجوهر، محشوة بالقش. والقش مش مجرد صورة: راس الدمية اللي في الاستهلال التاني.</div><div class=\"u\">و«متساندين على بعض» (<span class=\"en\">leaning together</span>) — ناس محتاجة بعضها عشان تقف، مش عشان تتكلم.</div>","n":2,"i":15,"a":"analysis-03-012","x":"46f0bec6"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">5-10</span>:</div><div class=\"u\"><span class=\"en\">Our dried voices, when / We whisper together / Are quiet and meaningless / As wind in dry grass / Or rats’ feet over broken glass / In our dry cellar</span></div>","n":2,"i":16,"a":"analysis-03-013","x":"c0848662"},{"t":"learn","h":"<div class=\"u\">أصواتنا ناشفة، ووشوشتنا «هادي وعديم المعنى» زي ريح في حشيش ناشف، أو خطوات جرذان على زجاج مكسور في قبو ناشف.</div><div class=\"u\">الصور كلها جافة ومكسّرة: حشيش ناشف، زجاج مكسور، قبو. مفيش ماء ولا نبات حي. وده فرق كبير عن الشعر الرومانسي اللي بيشوف الطبيعة حية.</div>","n":2,"i":17,"a":"analysis-03-014","x":"900277c7"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">11-12</span>:</div><div class=\"u\"><span class=\"en\">Shape without form, shade without colour, / Paralysed force, gesture without motion;</span></div>","n":2,"i":18,"a":"analysis-03-015","x":"3c7e62c8"},{"t":"learn","h":"<div class=\"u\">تلات تركيبات من نفس النوع: شكل بلا صورة، ظل بلا لون، قوة مشلولة، إشارة بلا حركة. كل واحد فيه شيء ونفي صفته في نفس السطر.</div><div class=\"u\">ده تعريف الفراغ بأدق شكل: مش غياب، لكن وجود ناقص. وده أسلوب بلاغي اسمه <span class=\"en\">oxymoron</span> ممتد.</div>","n":2,"i":19,"a":"analysis-03-016","x":"53266647"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">13-18</span>:</div><div class=\"u\"><span class=\"en\">Those who have crossed / With direct eyes, to death’s other Kingdom / Remember us—if at all—not as lost / Violent souls, but only / As the hollow men / The stuffed men.</span></div>","n":2,"i":20,"a":"analysis-03-017","x":"1fba5c83"},{"t":"learn","h":"<div class=\"u\">«اللي عبروا بعيون مباشرة» — اللي ماتوا وشافوا الحقيقة وش لوش، وده عكسنا إحنا. وبنطلب منهم يفتكرونا «لو افتكرونا أصلًا» — مش كأرواح عنيفة ضالة، لكن كرجال جوفاء بس.</div><div class=\"u\">«<span class=\"en\">if at all</span>» بين شرطتين — أدق تفصيلة في القسم: حتى الأمل في الذكرى ضعيف. ومملكتان هنا: مملكة الموت الحقيقية، ومملكة الحلم اللي هتظهر في القسم التاني.</div>","n":2,"i":21,"a":"analysis-03-018","x":"dbe1c8fc"},{"t":"section","h":"القسم الثاني: عيون في الحلم (<span dir=\"ltr\">19-38</span>)","n":1,"i":22},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">19-28</span>:</div><div class=\"u\"><span class=\"en\">Eyes I dare not meet in dreams / In death’s dream kingdom / These do not appear: / There, the eyes are / Sunlight on a broken column / There, is a tree swinging / And voices are / In the wind’s singing / More distant and more solemn / Than a dying star.</span></div>","n":2,"i":23,"a":"analysis-03-019","x":"8ca1931c"},{"t":"learn","h":"<div class=\"u\">«عيون مش بجرؤ أقابلها في الأحلام» — عيون الحكم أو الضمير أو اللي فاتوا. وفي مملكة حلم الموت، العيون نفسها مش موجودة: فيه عمود مكسور عليه شمس، وشجرة بتتحرك، وأصوات في غنا الريح.</div><div class=\"u\">العمود المكسور (<span class=\"en\">broken column</span>) = أثر حضارة ساقطة. والشمس عليه = ضوء على خرابة.</div>","n":2,"i":24,"a":"analysis-03-020","x":"2f7ea88c"},{"t":"learn","h":"<div class=\"u\">الأصوات هنا «أبعد وأكثر جلالًا من نجمة بتموت». لاحظ التناقض: جلال وبُعد، لكن مصدره حاجة بتموت (<span class=\"en\">a dying star</span>). كل جمال في القصيدة مخلوط بفناء.</div>","n":1,"i":25,"a":"analysis-03-021","x":"cc1d9899"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">29-36</span>:</div><div class=\"u\"><span class=\"en\">Let me be no nearer / In death’s dream kingdom / Let me also wear / Such deliberate disguises / Rat’s coat, crowskin, crossed staves / In a field / Behaving as the wind behaves / No nearer—</span></div>","n":2,"i":26,"a":"analysis-03-022","x":"b378ba62"},{"t":"learn","h":"<div class=\"u\">الطلب: خليني مش أقرب. وأنا كمان ألبس تنكّر مدبّر: جاكيت جرذ، جلد غراب، عصي متصالبة في أرض. يعني: أنا عايز أبقى فزاعة (<span class=\"en\">scarecrow</span>).</div><div class=\"u\">الفزاعة: شكل إنسان في حقل، ومفيهاش إنسان — زي دمية الاستهلال، زي «الرجال المحشوين». و«يتصرف زي ما الريح تتصرف» = بلا إرادة.</div>","n":2,"i":27,"a":"analysis-03-023","x":"0be55e96"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">37-38</span>:</div><div class=\"u\"><span class=\"en\">Not that final meeting / In the twilight kingdom</span></div>","n":2,"i":28,"a":"analysis-03-024","x":"ce6ef15d"},{"t":"learn","h":"<div class=\"u\">القسم بيقفل على رفض اللقاء الأخير في «مملكة الشفق» (<span class=\"en\">the twilight kingdom</span>). الشفق = بين النور والظلام، وده المكان اللي القصيدة كلها عايشة فيه: لا حياة ولا موت.</div>","n":1,"i":29,"a":"analysis-03-025","x":"e8507ce9"},{"t":"section","h":"الأدوات البلاغية","n":1,"i":30},{"t":"learn","h":"<div class=\"li\">المفارقة (<span class=\"en\">paradox</span>): جوفاء/محشوة (<span dir=\"ltr\">1-2</span>)، قوة مشلولة (12).</div><div class=\"li\">التشبيه (<span class=\"en\">simile</span>): أصواتنا زي ريح في حشيش ناشف، وزي جرذان على زجاج مكسور (<span dir=\"ltr\">7-10</span>).</div><div class=\"li\">الرمز (<span class=\"en\">symbol</span>): القش، الفزاعة، العيون، النجمة الميتة، العمود المكسور، الشفق.</div>","n":3,"i":31,"a":"analysis-03-026","x":"0ee2f418"},{"t":"learn","h":"<div class=\"li\">الإحالة (<span class=\"en\">allusion</span>): <span class=\"en\">Conrad</span> في الاستهلال الأول، و<span class=\"en\">Guy Fawkes</span> في التاني.</div><div class=\"li\">التكرار والتعاويذ (<span class=\"en\">repetition / incantation</span>): «<span class=\"en\">We are the…</span>»، «<span class=\"en\">There, the…</span>»، «<span class=\"en\">Let me…</span>»، «<span class=\"en\">No nearer</span>».</div><div class=\"li\">الجناس الناقص (<span class=\"en\">pararhyme</span>) والقوافي الغائبة: أصوات متشابهة مش متطابقة، زي حياة ناقصة.</div>","n":3,"i":32,"a":"analysis-03-027","x":"e360be30"},{"t":"section","h":"الموضوعات","n":1,"i":33},{"t":"learn","h":"<div class=\"u\">الفراغ الروحي: ناس شكلها إنسان ومفيهاش جوهر. الشلل: قوة بلا حركة، إشارة بلا اتجاه. الخوف من الحكم: العيون اللي مش بيجرؤ يقابلها. والرفض: «خليني مش أقرب» من اللقاء الأخير.</div>","n":1,"i":34,"a":"analysis-03-028","x":"997db5f7"},{"t":"learn","h":"<div class=\"u\">والخلفية كلها: حضارة بعد الحرب، خرابة (العمود المكسور)، وإيمان بيموت (النجمة الميتة). القصيدة مش بتشرح اليأس — هي بتعمله بالصوت والإيقاع.</div>","n":1,"i":35,"a":"analysis-03-029","x":"1bf4f638"},{"t":"section","h":"أسئلة امتحان","n":1,"i":36},{"t":"learn","h":"<div class=\"lead\">سؤال ١: ناقش وظيفة الاستهلالين في القصيدة.</div><div class=\"u\">عناصر: كورِتز = الرجل الأجوف الأصلي وموت المشروع الحضاري؛ «<span class=\"en\">A penny for the Old Guy</span>» = دمية قش بتحمل شكل إنسان؛ الاتنين بيقدموا صورة «الرجل المحشو» قبل ما النص يقولها.</div>","n":2,"i":37,"a":"analysis-03-030","x":"ac1a384f"},{"t":"learn","h":"<div class=\"lead\">سؤال ٢: حلّل صورة الأصوات في السطور <span dir=\"ltr\">5-10</span>.</div><div class=\"u\">عناصر: «ناشفة»، «وشوشة»، «عديمة المعنى»، ريح في حشيش ناشف، جرذان على زجاج مكسور. الوظيفة: الصوت البشري بقى ضجيج طبيعة ميتة.</div>","n":2,"i":38,"a":"analysis-03-031","x":"a732fdeb"},{"t":"learn","h":"<div class=\"lead\">سؤال ٣: إزاي بيعبّر إليوت عن الشلل الروحي؟</div><div class=\"u\">عناصر: «<span class=\"en\">Paralysed force, gesture without motion</span>» (12)، متساندين على بعض (3)، «خليني مش أقرب» (29)، والفزاعة اللي بتتصرف زي الريح (35).</div>","n":2,"i":39,"a":"analysis-03-032","x":"01cc8628"},{"t":"learn","h":"<div class=\"lead\">سؤال ٤: ناقش صورة الفزاعة في القسم الثاني.</div><div class=\"u\">عناصر: تنكّر مدبّر، جاكيت جرذ وجلد غراب وعصي متصالبة، «يتصرف زي الريح»؛ الرمز: إنسان بلا إرادة وبلا هوية، وامتداد لدمية القش.</div>","n":2,"i":40,"a":"analysis-03-033","x":"ed19c385"},{"t":"section","h":"الكويز","n":1,"i":41},{"t":"mc","h":"","q":"الاستهلال الأول «Mistah Kurtz—he dead» من فين؟","opts":["رواية Heart of Darkness لـ Conrad","مسرحية Hamlet","قصيدة The Waste Land"],"ans":0,"why":"من Heart of Darkness لـ Joseph Conrad.","n":1,"i":42,"ex":["صح: من رواية Conrad (اتنشرت مسلسلة 1899 وكتاب 1902)، والخادم بيعلن موت Kurtz.","غلط: Hamlet اتذكرت في Prufrock، مش هنا، والجملة نثر من رواية.","غلط: The Waste Land قصيدة لإليوت نفسه، لكن الجملة مش منها."]},{"t":"mc","h":"","q":"«A penny for the Old Guy» بيرجع لعادة إيه؟","opts":["حرق دمية Guy Fawkes في 5 نوفمبر","عيد الميلاد الإنجليزي","سوق قديم في لندن"],"ans":0,"why":"حرق دمية Guy Fawkes، ودي أول صورة لدمية القش.","n":1,"i":43,"ex":["صح: الأطفال بيعملوا دمية قش وبيطوفوا بيها ويطلبوا قرش، وبعدين يحرقوها.","غلط: مفيش علاقة بالكريسماس، والعادة بتاعة 5 نوفمبر.","غلط: العادة مش سوق؛ هي دمية وطواف وحرق."]},{"t":"mc","h":"","q":"إزاي القصيدة بتوصف أصوات الرجال الجوفاء؟","opts":["ناشفة وعديمة المعنى زي ريح في حشيش ناشف","عالية وجميلة زي مزيكا","صامتة تمامًا"],"ans":0,"why":"ناشفة وعديمة المعنى زي ريح في حشيش ناشف.","n":1,"i":44,"ex":["صح: «dried voices… quiet and meaningless as wind in dry grass» (<span dir=\"ltr\">5-8</span>).","غلط: النص بيقول العكس — الصوت «هادي وعديم المعنى».","غلط: فيه صوت، لكنه بلا معنى؛ مش صمت كامل."]},{"t":"mc","h":"","q":"«Shape without form, shade without colour» أسلوبها إيه؟","opts":["مفارقة (oxymoron) بتعرّف الفراغ بوجود ناقص","تشبيه كامل","سؤال بلاغي"],"ans":0,"why":"مفارقة بتعرّف الفراغ.","n":1,"i":45,"ex":["صح: كل تركيب فيه شيء ونفي صفته في نفس السطر: شكل بلا صورة، ظل بلا لون.","غلط: مفيش «زي» ولا أداة تشبيه في السطر.","غلط: الجملة خبرية مش سؤال."]},{"t":"tf","h":"","q":"الفزاعة في القسم الثاني رمز لإنسان بلا إرادة.","ans":true,"why":"صح: تنكّر من جلد وجرذ وعصي، و«بيتصرف زي ما الريح تتصرف» — حركة بلا إرادة.","n":1,"i":46,"ex":["صح، الجملة صح: الفزاعة شكل إنسان بلا إرادة، وامتداد لدمية القش.","غلط. النص بيقول «Behaving as the wind behaves»، يعني بلا إرادة."]},{"t":"tf","h":"","q":"القسم الثاني بينتهي بقبول اللقاء الأخير.","ans":false,"why":"غلط: بينتهي بالرفض «Not that final meeting» — يعني مش عايز اللقاء.","n":1,"i":47,"ex":["غلط. النص بيقول «Not that final meeting in the twilight kingdom» — رفض.","صح، الجملة غلط: هو بيرفض اللقاء الأخير."]},{"t":"recall","h":"","q":"إيه الفرق بين «مملكة الموت» و«مملكة حلم الموت» في القسمين الأول والتاني؟","a":"مملكة الموت التانية (<span dir=\"ltr\">13-14</span>) هي اللي عبرها اللي ماتوا «بعيون مباشرة»، يعني الحقيقة. ومملكة حلم الموت (20) هي عالم الحلم والشفق اللي إحنا فيه: صور بديلة (شمس على عمود مكسور، شجرة، أصوات في الريح) من غير مواجهة. الأولى حكم، والتانية تهرب.","n":1,"i":48},{"t":"recall","h":"","q":"اذكر رمزين في القسم الأول ووظيفة كل واحد.","a":"القش في الراس (4): الإنسان محشو مادة بلا جوهر، وامتداد لدمية Guy Fawkes. والعمود المكسور (23): أثر حضارة ساقطة، والشمس عليه بتوري الخرابة مش بتحييها. وكمان النجمة الميتة (28): جلال من مصدر فانٍ.","n":1,"i":49},{"t":"write","h":"","q":"حلّل الاستهلالين ووظيفتهما في بناء معنى القصيدة.","key":"analysis-03:1","a":"الاستهلالان بيقدموا صورة الإنسان الأجوف قبل النص. الأول من Conrad: Kurtz مات، ومشروعه الحضاري طلع فراغ — يعني الحضارة الحديثة نفسها «شكل بلا جوهر». والتاني من عادة Guy Fawkes: دمية قش بيطلبوا لها قرش وبيحرقوها — صورة الرجل المحشو قش. الاتنين بيعملوا حاجتين: بيأكدوا إن الفراغ مش حالة فردية لكن حالة عصر، وبيحطوا صورة القش اللي هتتكرر في السطور 4 و36 (الفزاعة). والاستهلالان كمان بيقولوا إن النهاية مش انفجار، لكن احتراق بطيء — وده اللي هيقفله السطر الأخير في القصيدة.","n":1,"i":50},{"t":"write","h":"","q":"ناقش صورة الفزاعة والفزع من العيون في القسم الثاني.","key":"analysis-03:2","a":"العيون في القسم الثاني هي عيون الحكم اللي بيخاف يقابلها في الحلم، وفي «مملكة حلم الموت» بتحل محلها صور بديلة: شمس على عمود مكسور، شجرة، وأصوات في الريح. بعدها بيطلب إنه ما يقربش، ويلبس تنكّر: جاكيت جرذ، جلد غراب، عصي متصالبة في حقل، ويتصرف زي الريح. ده تعريف الفزاعة: شكل إنسان في حقل بلا إنسان جواه، بيتحرك بالريح مش بإرادته. والتنكّر نفسه اعتراف: عايز يختفي في هيئة أقل من إنسان عشان يهرب من اللقاء الأخير في مملكة الشفق. فالقسم كله حركة هروب من مواجهة، مش مواجهة.","n":1,"i":51},{"t":"end","h":"","teaser":"<div class=\"u\">كده القسمان الأول والتاني خلصوا: الرجال الجوفاء، الأصوات الناشفة، العيون، والفزاعة.</div><div class=\"u\">الدرس الجاي: الأقسام التالت والرابع والخامس — أرض الصبار، النهر المنتفخ، الوردة المتعددة الأوراق، و«نهاية العالم مش بفرقعة لكن بنحيب».</div>","extra":"المصادر: Eliot, “The Hollow Men” (1925); Conrad, Heart of Darkness (1899 مسلسلة، 1902 كتاب); Eliot, The Waste Land (1922); The Gunpowder Plot (1605) وتقليد 5 نوفمبر.","i":52}];</script>
