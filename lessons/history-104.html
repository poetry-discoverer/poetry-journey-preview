<script>window.LESSON_ID="history-104";window.STEPS=[{"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">💥<\/span><\/span> القرن ٢٠ (الحداثة <span class=\"en\">Modernism<\/span>):<\/div><div class=\"u\">السمات: كسر القواعد القديمة. الـ <span class=\"en\">free verse<\/span> (الشعر الحر) بقى الأساس، والقصيدة بقت متكسرة ومربكة عمدًا عشان تعبر عن عالم طلع من حرب عالمية، ورموز وإحالات كتير، وصعوبة مقصودة.<\/div><div class=\"u\">البداية حركة الـ <span class=\"en\">Imagism<\/span> حوالي ١٩١٢ مع <span class=\"en\">Ezra Pound<\/span>: الصورة الواحدة الدقيقة بلا حشو.<\/div>", "n": 2, "i": 0, "a": "history-104-001", "x": "57036b48"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">T.S.<\/span> <span class=\"en\">Eliot<\/span> كتب <span class=\"en\">The Waste Land<\/span> (١٩٢٢) أشهر قصيدة في القرن، وافتتحها بمفارقة:<\/div><div class=\"u\">\"<span class=\"en\">April is the cruellest month<\/span>\"<\/div><div class=\"u\">\"أبريل أقسى الشهور\" (الربيع اللي كان دايمًا رمز الأمل بقى قاسي)<\/div>", "n": 3, "i": 1, "a": "history-104-002", "x": "2987a811"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">W.B.<\/span> <span class=\"en\">Yeats<\/span> في <span class=\"en\">The Second Coming<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">Things fall apart<\/span>; <span class=\"en\">the centre cannot hold<\/span>\"<\/div><div class=\"u\">\"كل حاجة بتتفكك، والمركز مش قادر يمسك\"<\/div><div class=\"u\">وشعراء الحرب زي <span class=\"en\">Wilfred Owen<\/span> فضحوا كذبة المجد الحربي وسموا المثل القديم \"الموت في سبيل الوطن شرف\" بلقب \"الكذبة القديمة\".<\/div>", "n": 3, "i": 2, "a": "history-104-003", "x": "df8042b5"}, {"t": "learn", "h": "<div class=\"u\">بعد ١٩٤٥: <span class=\"en\">W.H.<\/span> <span class=\"en\">Auden<\/span>، وجيل <span class=\"en\">The Movement<\/span> بزعامة <span class=\"en\">Philip Larkin<\/span> رجّع الوضوح والحياة اليومية، وبعدين الشعر الاعترافي <span class=\"en\">Confessional<\/span> مع <span class=\"en\">Sylvia Plath<\/span>: القصيدة كسيرة ذاتية جريئة. وآخر القرن مفيش مذهب واحد، تنوع كامل.<\/div>", "n": 1, "i": 3, "a": "history-104-004", "x": "6725d7cc"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🐉<\/span><\/span> الميثولوجيا والشعر الإنجليزي:<\/div><div class=\"u\">ليه الشعراء مهووسين بالأساطير؟ لأنها حكايات جاهزة القارئ فاهمها، ورموز تختصر معاني ضخمة في صورة واحدة، وبتدي القصيدة عمق آلاف السنين.<\/div><div class=\"u\">أمثلة عبر العصور: شكسبير (<span class=\"en\">Venus and Adonis<\/span>)، <span class=\"en\">Milton<\/span> خلط اليوناني بالديني في <span class=\"en\">Paradise Lost<\/span>، <span class=\"en\">Keats<\/span> بيخاطب إناء يوناني قديم في <span class=\"en\">Ode on a Grecian Urn<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">Beauty is truth,<\/span> <span class=\"en\">truth beauty<\/span>\"<\/div>", "n": 3, "i": 4, "a": "history-104-005", "x": "50ced945"}, {"t": "learn", "h": "<div class=\"u\">\"الجمال هو الحقيقة، والحقيقة هي الجمال\"<\/div><div class=\"u\"><span class=\"en\">Shelley<\/span> كتب <span class=\"en\">Prometheus Unbound<\/span> عن التيتان اللي سرق النار، <span class=\"en\">Tennyson<\/span> حيّا أوديسيوس العجوز اللي رافض يستقر في <span class=\"en\">Ulysses<\/span>:<\/div><div class=\"u\">\"<span class=\"en\">To strive,<\/span> <span class=\"en\">to seek,<\/span> <span class=\"en\">to find,<\/span> <span class=\"en\">and not to yield<\/span>\"<\/div><div class=\"u\">\"نكافح، ندور، نلاقي، وممنستسلمش\"<\/div><div class=\"u\"><span class=\"en\">Yeats<\/span> كتب <span class=\"en\">Leda and the Swan<\/span> عن زيوس، و<span class=\"en\">Eliot<\/span> بنى <span class=\"en\">The Waste Land<\/span> كلها على أسطورة الكأس المقدسة.<\/div>", "n": 5, "i": 5, "a": "history-104-006", "x": "38f1ea9b"}, {"t": "learn", "h": "<div class=\"u\">الخلاصة: الميثولوجيا مش رفاهية، هي اللغة المشتركة اللي الشاعر بيكلم بيها قارئه عبر القرون.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📚<\/span><\/span> وحاجات زيادة تكمل الصورة، خريطة الأنواع الكبيرة:<\/div><div class=\"u\"><span class=\"en\">epic<\/span> ملحمة (<span class=\"en\">Paradise Lost<\/span>) / <span class=\"en\">sonnet<\/span> سونيت ١٤ سطر / <span class=\"en\">ode<\/span> أود: قصيدة تأمل طويلة في موضوع واحد / <span class=\"en\">elegy<\/span> رثاء / <span class=\"en\">ballad<\/span> أغنية شعبية حكائية / <span class=\"en\">dramatic monologue<\/span> منولوج درامي / <span class=\"en\">free verse<\/span> الشعر الحر.<\/div>", "n": 3, "i": 6, "a": "history-104-007", "x": "40bc0c7d"}, {"t": "learn", "h": "<div class=\"u\">ترتيب قراءة مقترح لو عايز تمشي مع التاريخ: <span class=\"en\">Chaucer<\/span> <span class=\"em\"><span class=\"em\">←<\/span><\/span> سونيت شكسبير <span class=\"em\"><span class=\"em\">←<\/span><\/span> <span class=\"en\">Donne<\/span> <span class=\"em\"><span class=\"em\">←<\/span><\/span> <span class=\"en\">Milton<\/span> <span class=\"em\"><span class=\"em\">←<\/span><\/span> <span class=\"en\">Pope<\/span> <span class=\"em\"><span class=\"em\">←<\/span><\/span> <span class=\"en\">Wordsworth<\/span> <span class=\"em\"><span class=\"em\">←<\/span><\/span> <span class=\"en\">Keats<\/span> <span class=\"em\"><span class=\"em\">←<\/span><\/span> <span class=\"en\">Tennyson<\/span> <span class=\"em\"><span class=\"em\">←<\/span><\/span> <span class=\"en\">Eliot.<\/span> كل اسم من دول عهد لوحده.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🌙<\/span><\/span><\/div>", "n": 2, "i": 7, "a": "history-104-008", "x": "990829d9"}, {"t": "end", "h": "", "teaser": "", "extra": "المصادر الأربعة: اليوناني-الروماني (الأكبر)، الكتاب المقدس، أساطير الشمال <span class=\"en\">Norse<\/span>، وأسطورة الملك آرثر.", "i": 8}];</script>
