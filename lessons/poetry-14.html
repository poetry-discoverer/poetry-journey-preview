<script>window.LESSON_ID="poetry-14";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة أخت التشبيه الكبيرة: الاستعارة. نفس الفكرة بس من غير <span class=\"en\">like.</span> بسيطة جداً لو مشيت معايا خطوة خطوة <span class=\"em\"><span class=\"em\">👇</span></span></div>", "n": 1, "i": 0, "a": "poetry-14-001", "x": "c59761e4"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: إيه هي الـ <span class=\"en\">metaphor</span>؟ <span class=\"em\"><span class=\"em\">🤔</span></span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١) التعريف ببساطة</div><div class=\"u\">١.١ الـ <span class=\"en\">metaphor</span> (استعارة) = تقول إن حاجة \"هي\" حاجة تانية، مع إنها مش كده حرفياً.</div><div class=\"u\">١.٢ يعني بتقارن من غير كلمة <span class=\"en\">like</span> أو <span class=\"en\">as.</span> المقارنة ضمنية (مخفية)، مش صريحة زي التشبيه.</div><div class=\"u\">١.٣ الكلمة نفسها استعارة! أصلها يوناني: <span class=\"en\">metaphora</span> = \"نقل\" أو \"حمل من مكان لمكان\".</div><div class=\"u\">٢) الفرق بينها وبين التشبيه</div>", "n": 5, "i": 2, "a": "poetry-14-002", "x": "476acfb9"}, {"t": "learn", "h": "<div class=\"u\">٢.١ تشبيه: \"<span class=\"en\">Odysseus is like a weasel</span>\" (أوديسيوس زي ابن عرس) فيه <span class=\"en\">like.</span></div><div class=\"u\">٢.٢ استعارة: \"<span class=\"en\">Odysseus is a weasel</span>\" من غير <span class=\"en\">like.</span></div><div class=\"u\">٢.٣ تشبيه: \"<span class=\"en\">Time is like a river</span>\" <span class=\"em\"><span class=\"em\">←</span></span> استعارة: \"<span class=\"en\">Time is a river</span>\".</div><div class=\"u\">٢.٤ الاستعارة أقوى وأقصر وأجرأ: بتقول \"هو ده\" مش \"شبه ده\".</div>", "n": 4, "i": 3, "a": "poetry-14-003", "x": "fa24b5ce"}, {"t": "mc", "h": "", "q": "أنهي جملة استعارة (<span class=\"en\">metaphor</span>)؟", "nq": 1, "opts": ["<span class=\"en\">Time is a river</span>", "<span class=\"en\">Time is like a river</span>", "<span class=\"en\">Time is as slow as a river</span>"], "ans": 0, "why": "<span class=\"en\">Time is a river</span>", "ex": ["صح: بتقول إن الوقت هو نهر، من غير <span class=\"en\">like</span> أو <span class=\"en\">as</span>.", "غلط: فيها <span class=\"en\">like</span>، يعني تشبيه.", "غلط: فيها <span class=\"en\">as</span>، يعني تشبيه."], "i": 4}, {"t": "mc", "h": "", "q": "الكلمة <span class=\"en\">metaphor</span> أصلها اليوناني <span class=\"en\">metaphora</span> معناه...", "nq": 1, "opts": ["نقل أو حمل من مكان لمكان", "شعر", "صورة"], "ans": 0, "why": "نقل أو حمل من مكان لمكان", "ex": ["صح: <span class=\"en\">metaphora</span> = نقل، والكلمة نفسها استعارة.", "غلط: الشعر كلمة تانية.", "غلط: الصورة هي <span class=\"en\">image</span>."], "i": 5}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: أجزاء الاستعارة <span class=\"em\"><span class=\"em\">🧩</span></span>", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">١) الـ <span class=\"en\">tenor</span> والـ <span class=\"en\">vehicle</span></div><div class=\"u\">١.١ الـ <span class=\"en\">tenor</span> (المشبّه): الموضوع اللي بنتكلم عنه.</div><div class=\"u\">١.٢ الـ <span class=\"en\">vehicle</span> (المشبّه به): الحاجة اللي بنستعير صفاتها.</div><div class=\"u\">١.٣ المصطلحات دي من الناقد <span class=\"en\">I.</span> <span class=\"en\">A.</span> <span class=\"en\">Richards</span> سنة ١٩٣٦. وفيه تسميات تانية: <span class=\"en\">ground</span> و <span class=\"en\">figure</span>، أو <span class=\"en\">target</span> و <span class=\"en\">source.</span></div><div class=\"u\">٢) مثال: \"<span class=\"en\">Pat is a tornado</span>\"</div><div class=\"u\">٢.١ <span class=\"en\">Pat</span> = <span class=\"en\">tenor.</span> <span class=\"en\">tornado</span> (إعصار) = <span class=\"en\">vehicle.</span></div>", "n": 6, "i": 7, "a": "poetry-14-004", "x": "f58889a8"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ الإعصار فيه صفات: قوة، سرعة، خطر، دمار.</div><div class=\"u\">٢.٣ كل قارئ ممكن يفهم حاجة: \"باتي مدمرة بقوة\" أو \"الأمور بتفلت منها\". الاستعارة بتفتح أكتر من معنى، وده سر جمالها.</div><div class=\"u\">٣) مثال تاني: \"<span class=\"en\">the ship plowed the seas</span>\" (السفينة حرثت البحار)</div><div class=\"u\">٣.١ السفينة = <span class=\"en\">tenor</span>، المحراث = <span class=\"en\">vehicle.</span> الصفة: بتشق الماية زي ما المحراث بيشق الأرض.</div>", "n": 4, "i": 8, "a": "poetry-14-005", "x": "747465ff"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Pat is a tornado</span>، إيه الـ <span class=\"en\">vehicle</span>؟", "nq": 1, "opts": ["<span class=\"en\">tornado</span>", "<span class=\"en\">Pat</span>", "<span class=\"en\">is</span>"], "ans": 0, "why": "<span class=\"en\">tornado</span>", "ex": ["صح: الإعصار هو المشبّه به اللي بنستعير صفاته.", "غلط: <span class=\"en\">Pat</span> هو الـ <span class=\"en\">tenor</span>.", "غلط: <span class=\"en\">is</span> كلمة ربط."], "i": 9}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: استعارة شكسبير الشهيرة <span class=\"em\"><span class=\"em\">🌍🎭</span></span>", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"lead\">١) النص (<span class=\"en\">As You Like It</span>، الفصل ٢ مشهد ٧):</div><div class=\"u\">\"<span class=\"en\">All the world's a stage,</span> / <span class=\"en\">And all the men and women merely players</span>; / <span class=\"en\">They have their exits and their entrances</span> / <span class=\"en\">And one man in his time plays many parts,</span> / <span class=\"en\">His Acts being seven ages.</span>\"</div><div class=\"u\">٢) الشرح خطوة خطوة</div><div class=\"u\">٢.١ \"العالم مسرح\" (<span class=\"en\">World</span> = <span class=\"en\">tenor</span>، <span class=\"en\">stage</span> = <span class=\"en\">vehicle</span>).</div>", "n": 3, "i": 11, "a": "poetry-14-006", "x": "6bc1fdd3"}, {"t": "mc", "h": "", "q": "<span class=\"en\">All the world's a stage</span> من أي مسرحية لشكسبير؟", "nq": 1, "opts": ["<span class=\"en\">As You Like It</span>", "<span class=\"en\">Hamlet</span>", "<span class=\"en\">Macbeth</span>"], "ans": 0, "why": "<span class=\"en\">As You Like It</span>", "ex": ["صح: من <span class=\"en\">As You Like It</span>، الفصل ٢ مشهد ٧.", "غلط: <span class=\"en\">Hamlet</span> مسرحية تانية.", "غلط: <span class=\"en\">Macbeth</span> مسرحية تانية."], "i": 12}, {"t": "learn", "h": "<div class=\"u\">٢.٢ والناس \"ممثلين\" (<span class=\"en\">men and women</span> = <span class=\"en\">tenor</span> تاني، <span class=\"en\">players</span> = <span class=\"en\">vehicle</span> تاني). استعارة جوه استعارة.</div><div class=\"u\">٢.٣ \"<span class=\"en\">exits and entrances</span>\" = الولادة والموت.</div><div class=\"u\">٢.٤ \"<span class=\"en\">seven ages</span>\" = ٧ أدوار في حياة الإنسان، زي ٧ فصول في مسرحية.</div><div class=\"u\">٣) المعنى والإحساس</div><div class=\"u\">٣.١ العالم مش مسرح حرفياً، بس شكسبير بيقارن: ناس بتجيء وتمشي وتلعب أدوار.</div>", "n": 5, "i": 13, "a": "poetry-14-007", "x": "89e37951"}, {"t": "mc", "h": "", "q": "في الاستعارة دي، الـ <span class=\"en\">exits and entrances</span> بتمثل...", "nq": 1, "opts": ["الولادة والموت", "الدخول والخروج من البيت بس", "بداية ونهاية الفصل الدراسي"], "ans": 0, "why": "الولادة والموت", "ex": ["صح: دخول وخروج الإنسان من الدنيا، يعني ولادة وموت.", "غلط: المعنى مجازي مش حرفي.", "غلط: مفيش علاقة بالدراسة."], "i": 14}, {"t": "learn", "h": "<div class=\"u\">٣.٢ بيخليك تفكر في حياتك كأنها عرض، ويمكن تحس إنها قصيرة أو إن الأدوار بتتغير.</div>", "n": 1, "i": 15, "a": "poetry-14-008", "x": "adec798c"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: ليه الاستعارة في كل مكان؟ <span class=\"em\"><span class=\"em\">🗣️</span></span>", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">١) في كلامنا اليومي</div><div class=\"u\">١.١ \"الوقت دهب\" (<span class=\"en\">Time is money</span>).</div><div class=\"u\">١.٢ \"بيطير من الفرحة\"، \"قلبه حجر\".</div><div class=\"u\">١.٣ حتى كلمة <span class=\"en\">window</span> أصلها \"<span class=\"en\">wind eye</span>\" يعني \"عين الهوا\" (استعارة قديمة نسيناها).</div><div class=\"u\">٢) في الشعر</div><div class=\"u\">٢.١ بتختصر: بدل جملة طويلة، كلمة واحدة بصورة.</div><div class=\"u\">٢.٢ بتصنع إحساس: \"قلبه حجر\" أقوى من \"هو قاسي\".</div>", "n": 7, "i": 17, "a": "poetry-14-009", "x": "4bd0f884"}, {"t": "learn", "h": "<div class=\"u\">٢.٣ بتقول الحاجة المجردة (حزن، وقت، موت) بحاجة نشوفها (ليل، نهر، ظلام).</div><div class=\"u\">٣) إزاي أحلل استعارة؟ (٤ خطوات)</div><div class=\"u\">٣.١ إيه الـ <span class=\"en\">tenor</span>؟ ٣.٢ إيه الـ <span class=\"en\">vehicle</span>؟ ٣.٣ إيه الصفات اللي اتنقلت؟ ٣.٤ إيه الإحساس؟</div><div class=\"u\">٤) <span class=\"em\"><span class=\"em\">⚠️</span></span> استعارة \"ميتة\" (<span class=\"en\">dead metaphor</span>) هي اللي كترت لحد ما بقت عادية (<span class=\"en\">leg of the table</span> = رجل الترابيزة). الشاعر الشاطر بيعمل استعارة جديدة تحس بيها.</div>", "n": 4, "i": 18, "a": "poetry-14-010", "x": "94933c60"}, {"t": "mc", "h": "", "q": "الاستعارة الميتة (<span class=\"en\">dead metaphor</span>) زي <span class=\"en\">leg of the table</span> هي...", "nq": 1, "opts": ["استعارة كترت لحد ما بقت عادية", "استعارة جديدة جداً", "استعارة من غير <span class=\"en\">tenor</span>"], "ans": 0, "why": "استعارة كترت لحد ما بقت عادية", "ex": ["صح: كترت لحد ما بقت عادية ومحدش بيحس بيها.", "غلط: دي قديمة مش جديدة.", "غلط: لسه فيها مشبّه ومشبّه به بس منسية."], "i": 19}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅</span></span>", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">١) الملخص</div><div class=\"u\">١.١ <span class=\"en\">metaphor</span> = حاجة \"هي\" حاجة، من غير <span class=\"en\">like/as.</span></div><div class=\"u\">١.٢ <span class=\"en\">tenor</span> و <span class=\"en\">vehicle.</span></div><div class=\"u\">١.٣ الاستعارة أقصر وأقوى من التشبيه وبتفتح معاني.</div><div class=\"u\">١.٤ شكسبير: \"<span class=\"en\">All the world's a stage</span>\".</div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">✏️</span></span> تمرين</div><div class=\"u\">٢.١ حوّل التشبيه ده لاستعارة: \"<span class=\"en\">Her smile was like sunshine.</span>\"</div><div class=\"u\">٢.٢ طلّع <span class=\"en\">tenor</span> و<span class=\"en\">vehicle</span> من \"<span class=\"en\">Pat is a tornado</span>\" ومن \"<span class=\"en\">All the world's a stage</span>\".</div>", "n": 8, "i": 21, "a": "poetry-14-011", "x": "9c34147e"}, {"t": "learn", "h": "<div class=\"u\">٢.٣ اكتب ٣ استعارات من تأليفك (الكورة، الأكل، الدراسة)، وحلل واحدة بالأربع خطوات.</div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح. <span class=\"em\"><span class=\"em\">✍️</span></span></div>", "n": 2, "i": 22, "a": "poetry-14-012", "x": "3b9e7eb0"}, {"t": "recall", "h": "", "q": "إيه الفرق بين \"<span class=\"en\">Time is like a river</span>\" و \"<span class=\"en\">Time is a river</span>\"؟", "a": "الأولى تشبيه (فيها <span class=\"en\">like)</span>، والتانية استعارة (من غير <span class=\"en\">like</span>، بتقول \"هو\" مباشرة).", "n": 1, "i": 23}, {"t": "recall", "h": "", "q": "في \"<span class=\"en\">All the world's a stage</span>\": مين الـ <span class=\"en\">tenor</span> ومين الـ <span class=\"en\">vehicle</span>؟", "a": "<span class=\"en\">tenor</span> = <span class=\"en\">the world</span>، <span class=\"en\">vehicle</span> = <span class=\"en\">a stage</span> (والتاني: <span class=\"en\">men and women</span> = <span class=\"en\">tenor</span>، <span class=\"en\">players</span> = <span class=\"en\">vehicle)</span>.", "n": 1, "i": 24}, {"t": "recall", "h": "", "q": "إيه المقصود بـ <span class=\"en\">dead metaphor</span>؟", "a": "استعارة كترت لحد ما بقت عادية ومحدش بيحس إنها استعارة (زي \"رجل الترابيزة\").", "n": 1, "i": 25}, {"t": "tf", "h": "", "q": "صح ولا غلط: الاستعارة لازم فيها كلمة <span class=\"en\">like.</span>", "ans": false, "why": "غلط. التشبيه هو اللي فيه <span class=\"en\">like/as</span>، الاستعارة من غيرهم.", "n": 1, "i": 26, "ex": ["الجملة غلط. التشبيه هو اللي فيه <span class=\"en\">like</span>/<span class=\"en\">as</span>، الاستعارة من غيرهم.", "صح، الجملة غلط. التشبيه هو اللي فيه <span class=\"en\">like</span>/<span class=\"en\">as</span>، الاستعارة من غيرهم."]}, {"t": "write", "h": "", "q": "<b>مقارنة:</b> قارن بين الـ <span class=\"en\">simile</span> والـ <span class=\"en\">metaphor</span>: التعريف، وإيه الفرق في القوة والإحساس، ومثال لكل واحد.", "a": "<div class=\"u\">الـ <span class=\"en\">simile</span> بيقارن بين شيئين باستخدام أداة زي <span class=\"en\">like</span> أو <span class=\"en\">as</span>. مثال: <span class=\"en\">My love is like a red, red rose</span>.</div><div class=\"u\">الـ <span class=\"en\">metaphor</span> بيقول إن الشيء هو الشيء التاني مباشرة من غير أداة. مثال: <span class=\"en\">All the world's a stage</span>.</div><div class=\"u\">الـ <span class=\"en\">simile</span> بيخلّي القارئ شايف إن فيه مقارنة وبيسيب مسافة بين الاتنين، فهو أهدى وأوضح. والـ <span class=\"en\">metaphor</span> أقوى وأكتر تركيزاً لأنه بيدمج الاتنين في صورة واحدة.</div><div class=\"u\">الخلاصة: الاتنين مقارنة، لكن الـ <span class=\"en\">simile</span> بيعلن المقارنة والـ <span class=\"en\">metaphor</span> بيخبّيها.</div>", "key": "poetry-14:CMP", "n": 1, "i": 27}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳</span></span> الدرس الجاي (١٥): <span class=\"en\">personification</span> (التشخيص): إننا نخلي الحاجات تتصرف زي البني آدمين.", "extra": "", "i": 28}];</script>
