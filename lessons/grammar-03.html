<h1>القواعد 3: الكفاءة والأداء</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: من الصفر</span><span class="tag">درس ٣</span><span class="tag"><span class="em">🧩</span> القواعد الأكاديمية</span></div>

<script>window.LESSON_ID="grammar-03";window.STEPS=[{"t":"section","h":"سواق شاطر وإيد بترتعش","n":1,"i":0},{"t":"learn","h":"<div class=\"u\">أهلًا بيك في الدرس التالت. تخيل سواق شاطر، سايق من عشرين سنة. في يوم إيده ارتعشت وخبط في الرصيف. هل نسي إزاي يسوق؟ طبعًا لأ. هو عارف، بس الأداء النهارده كان وحش. اللغة زي كده بالظبط. فيه حاجتين مختلفتين: اللي إنت عارفه، واللي بيطلع منك فعلًا. الأولى اسمها الكفاءة، <span class=\"en\">competence</span>. دي معرفتك الضمنية بنظام اللغة، اللي في دماغك.</div>","n":1,"i":1,"a":"grammar-03-001","x":"e90a2793"},{"t":"learn","h":"<div class=\"u\">والتانية الأداء، <span class=\"en\">performance</span>. ده اللي بيطلع منك فعلًا، كلام أو كتابة، بكل اللخبطة والتعب والتهته. لو لخبطت في كلمة وإنت مرهق، ده أداء. مش معناه إنك مش عارف اللغة.</div>","n":1,"i":2,"a":"grammar-03-002","x":"e47a0a81"},{"t":"section","h":"أربع زوايا","n":1,"i":3},{"t":"learn","h":"<div class=\"u\">نبدأ بالشكل، <span class=\"en\">form</span>. الكفاءة معرفة مجردة، مش بتتشاف. الأداء ملفوظات، <span class=\"en\">utterances</span>، تقدر تسجلها وتكتبها. الوظيفة، <span class=\"en\">function</span>. الكفاءة هي اللي اللساني بيحاول يبني لها نظرية. والأداء هو الدليل اللي بنجمعه، لأنه الوحيد اللي بنقدر نسمعه.</div>","n":1,"i":4,"a":"grammar-03-003","x":"e1966a2e"},{"t":"learn","h":"<div class=\"u\">المعنى، <span class=\"en\">meaning</span>. الكفاءة بتفسر ليه بتفهم جملة جديدة. والأداء بيفسر ليه جملة سليمة ممكن تطلع ناقصة أو ملخبطة. والاستعمال، <span class=\"en\">use</span>. الأداء بيتأثر بالتعب والذاكرة والتوتر والموقف. أما الكفاءة فثابتة نسبيًا.</div>","n":1,"i":5,"a":"grammar-03-004","x":"52c6fc26"},{"t":"section","h":"من فين جت الفكرة","n":1,"i":6},{"t":"learn","h":"<div class=\"u\">سوسير، <span class=\"en\">Saussure</span>، قبل تشومسكي فرّق بين <span class=\"en\">langue</span>، النظام المشترك، و<span class=\"en\">parole</span>، الكلام الفردي الفعلي. وتشومسكي في كتاب <span class=\"en\">Aspects of the Theory of Syntax</span> سنة 1965 سمّاها <span class=\"en\">competence</span> و<span class=\"en\">performance</span>. والفرق إن الكفاءة عند تشومسكي معرفة في دماغ الفرد، مش نظام اجتماعي زي <span class=\"en\">langue</span>.</div>","n":1,"i":7,"a":"grammar-03-005","x":"f00f84c3"},{"t":"section","h":"أخطاء الأداء","n":1,"i":8},{"t":"learn","h":"<div class=\"u\">أخطاء الأداء الشائعة تلات أنواع. الأول زلة اللسان، <span class=\"en\">slip of the tongue</span>. زي ما تقول <span class=\"en\">a lack of pies</span> وإنت قاصد <span class=\"en\">a pack of lies</span>. ولما تبدل أصوات كلمتين كده اسمها <span class=\"en\">spoonerism</span>. التاني التردد، <span class=\"en\">hesitation</span>. زي <span class=\"en\">um</span> و<span class=\"en\">uh</span>. والتالت بداية خاطئة، <span class=\"en\">false start</span>. زي <span class=\"en\">I went to</span>، <span class=\"en\">I mean we went</span>. دي كلها أداء. اللي بيقولها عارف القاعدة.</div>","n":1,"i":9,"a":"grammar-03-006","x":"208d4f9a"},{"t":"section","h":"error مقابل mistake","n":1,"i":10},{"t":"learn","h":"<div class=\"u\">فيه فرق مهم في تعلم اللغة، شرحه <span class=\"en\">Corder</span> سنة 1967. الـ <span class=\"en\">mistake</span>، الزلة: المتكلم عارف الصح وغلط بسبب تعب أو تسرع، وبيصحح نفسه لو نبهته. أما الـ <span class=\"en\">error</span>، الخطأ: المتكلم مش عارف القاعدة، أو عمم قاعدة غلط. زي <span class=\"en\">He goed</span>. بيكرر الغلط ومش بيحس بيه.</div>","n":1,"i":11,"a":"grammar-03-007","x":"2399d022"},{"t":"learn","h":"<div class=\"u\">والـ <span class=\"en\">error</span> هو اللي بيعرفنا إيه اللي ناقص في كفاءة المتعلم. ونظام المتعلم المؤقت ده، اللي بين لغته الأولى واللغة اللي بيتعلمها، اسمه <span class=\"en\">interlanguage</span>، اللغة البينية. وبيتغير كل ما يتعلم أكتر.</div>","n":1,"i":12,"a":"grammar-03-008","x":"08c6e952"},{"t":"section","h":"جملة سليمة بس صعبة","n":1,"i":13},{"t":"learn","h":"<div class=\"u\">دلوقتي الطبقة المتقدمة. خد الجملة دي: <span class=\"en\">The rat the cat the dog chased killed ate the malt</span>. الجملة سليمة نحويًا. فيها جمل نسبية متداخلة في النص، اسمها <span class=\"en\">center-embedding</span>. بس إنت مش قادر تفهمها بسهولة.</div>","n":1,"i":14,"a":"grammar-03-009","x":"95c12523"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Miller</span> و<span class=\"en\">Chomsky</span> سنة 1963 قالوا إن المشكلة مش في القواعد. المشكلة في حدود الذاكرة العاملة وقت المعالجة. يعني الجملة مقبولة في الكفاءة، ومرفوضة في الأداء. وده مثال قوي على الفرق بين <span class=\"en\">grammaticality</span>، الصحة النحوية، و<span class=\"en\">acceptability</span>، المقبولية.</div>","n":1,"i":15,"a":"grammar-03-010","x":"7fb4d36e"},{"t":"section","h":"انتقادات وبدائل","n":1,"i":16},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Hymes</span> سنة 1972 قال إن الكفاءة عند تشومسكي ضيقة. المتكلم محتاج كمان <span class=\"en\">communicative competence</span>: يعرف يتكلم إمتى ومع مين وبأي طريقة، مش بس يبني جمل سليمة. والمنهج القائم على الاستعمال، <span class=\"en\">usage-based</span>، بيرفض الفصل الحاد. بيقول إن الكفاءة بتتشكل من الاستعمال نفسه.</div>","n":1,"i":17,"a":"grammar-03-011","x":"321a371b"},{"t":"learn","h":"<div class=\"u\">ومشكلة المنهج: الكفاءة مش بتتلاحظ مباشرة. بنستنتجها من أحكام المقبولية ومن الأداء، فالدليل غير مباشر.</div>","n":1,"i":18,"a":"grammar-03-012","x":"85977e9a"},{"t":"section","h":"مصطلحات الدرس","n":1,"i":19},{"t":"learn","h":"<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. <span class=\"en\">Competence</span>: الكفاءة. <span class=\"en\">Performance</span>: الأداء. <span class=\"en\">Langue</span> و<span class=\"en\">parole</span>: النظام والكلام الفردي. <span class=\"en\">Slip of the tongue</span>: زلة لسان. <span class=\"en\">Spoonerism</span>: قلب أصوات. <span class=\"en\">Hesitation</span>: تردد. <span class=\"en\">False start</span>: بداية خاطئة. <span class=\"en\">Mistake</span>: زلة. <span class=\"en\">Error</span>: خطأ. <span class=\"en\">Interlanguage</span>: اللغة البينية للمتعلم. <span class=\"en\">Center-embedding</span>: تضمين مركزي.</div>","n":1,"i":20,"a":"grammar-03-013","x":"504d0ed7"},{"t":"learn","h":"<div class=\"u\"><span class=\"en\">Working memory</span>: الذاكرة العاملة. <span class=\"en\">Communicative competence</span>: الكفاءة التواصلية.</div>","n":1,"i":21,"a":"grammar-03-014","x":"48e3de9d"},{"t":"section","h":"الخلاصة","n":1,"i":22},{"t":"learn","h":"<div class=\"u\">أربع نقط. واحد: الكفاءة معرفة، والأداء استعمال. اتنين: أخطاء الأداء، زي الزلات والتردد، مش دليل على جهل. تلاتة: <span class=\"en\">error</span> من نقص معرفة، و<span class=\"en\">mistake</span> زلة. أربعة: جملة سليمة ممكن تبقى صعبة بسبب الذاكرة، مش بسبب القواعد. الدرس الجاي: الصحة النحوية والمقبولية بتفصيل أكتر.</div>","n":1,"i":23,"a":"grammar-03-015","x":"1aaeb3c2"},{"t":"section","h":"الكويز","n":1,"i":24},{"t":"mc","q":"سواق شاطر إيده ارتعشت وخبط في الرصيف. ده مثال على:","opts":["نقص كفاءة","مشكلة أداء","قاعدة معيارية"],"ans":1,"why":"هو عارف السواقة، والمشكلة في التنفيذ.","ex":["غلط: هو عارف يسوق من عشرين سنة.","صح: المعرفة موجودة، والتنفيذ هو اللي اتلخبط.","غلط: القاعدة المعيارية موضوع الدرس اللي فات."],"n":1,"i":25,"h":""},{"t":"mc","q":"مين اللي فرّق بين <span class=\"en\">langue</span> و <span class=\"en\">parole</span>؟","opts":["<span class=\"en\">Saussure</span>","<span class=\"en\">Corder</span>","<span class=\"en\">Hymes</span>"],"ans":0,"why":"سوسير قبل تشومسكي.","ex":["صح: <span class=\"en\">Saussure</span>: النظام المشترك مقابل الكلام الفردي.","غلط: <span class=\"en\">Corder</span> اشتغل على أخطاء المتعلمين.","غلط: <span class=\"en\">Hymes</span> اقترح الكفاءة التواصلية."],"n":1,"i":26,"h":""},{"t":"mc","q":"«<span class=\"en\">He goed</span>» من متعلم بيكرر الغلطة ومش حاسس بيها. ده:","opts":["<span class=\"en\">mistake</span>","<span class=\"en\">error</span>","<span class=\"en\">spoonerism</span>"],"ans":1,"why":"ده عدم معرفة أو تعميم قاعدة غلط.","ex":["غلط: الـ <span class=\"en\">mistake</span> بيعرف صاحبه الصح.","صح: <span class=\"en\">error</span>: تعميم قاعدة الماضي المنتظم على فعل شاذ.","غلط: الـ <span class=\"en\">spoonerism</span> تبديل أصوات في الكلام."],"n":1,"i":27,"h":""},{"t":"mc","q":"ليه <span class=\"en\">The rat the cat the dog chased killed ate the malt</span> صعبة الفهم؟","opts":["القواعد غلط","حدود الذاكرة العاملة","كلماتها نادرة"],"ans":1,"why":"سليمة نحويًا، والصعوبة في المعالجة.","ex":["غلط: الجملة سليمة نحويًا.","صح: <span class=\"en\">center-embedding</span> بيحمّل الذاكرة العاملة.","غلط: الكلمات عادية."],"n":1,"i":28,"h":""},{"t":"tf","q":"زلة اللسان معناها إن المتكلم مش عارف القاعدة.","ans":false,"why":"غلط: دي أداء، والمتكلم عارف.","ex":["غلط: المتكلم عارف القاعدة، والزلة أداء.","صح، الجملة غلط: الزلة مش دليل على جهل."],"n":1,"i":29,"h":""},{"t":"tf","q":"<span class=\"en\">Hymes</span> شاف إن مفهوم الكفاءة عند تشومسكي ضيق.","ans":true,"why":"صح: لازم نضيف الاستعمال المناسب.","ex":["صح: اقترح الكفاءة التواصلية.","غلط: <span class=\"en\">Hymes</span> انتقد المفهوم فعلًا."],"n":1,"i":30,"h":""},{"t":"recall","q":"إيه الفرق بين <span class=\"en\">competence</span> و <span class=\"en\">performance</span>؟","a":"&<span class=\"en\">lt</span>;<span class=\"en\">span class</span>=\"<span class=\"en\">en</span>\"&<span class=\"en\">gt</span>;<span class=\"en\">competence</span>&<span class=\"en\">lt</span>;/<span class=\"en\">span</span>&<span class=\"en\">gt</span>; معرفتك الضمنية بالنظام. &<span class=\"en\">lt</span>;<span class=\"en\">span class</span>=\"<span class=\"en\">en</span>\"&<span class=\"en\">gt</span>;<span class=\"en\">performance</span>&<span class=\"en\">lt</span>;/<span class=\"en\">span</span>&<span class=\"en\">gt</span>; استعمالك الفعلي في الكلام والكتابة.","n":1,"i":31,"h":""},{"t":"recall","q":"اذكر ٣ أنواع من أخطاء الأداء.","a":"زلة لسان (<span class=\"en\">slip of the tongue</span>)، تردد (<span class=\"en\">hesitation</span>)، بداية خاطئة (<span class=\"en\">false start</span>).","n":1,"i":32,"h":""},{"t":"write","q":"اشرح ليه الجملة <span class=\"en\">The rat the cat the dog chased killed ate the malt</span> مقبولة في الكفاءة ومرفوضة في الأداء (٣-٤ جمل).","key":"grammar-03:1","a":"الجملة سليمة نحويًا لأنها جمل نسبية متداخلة. لكن فهمها بيحمّل الذاكرة العاملة. فالمشكلة في المعالجة مش في القواعد، يعني مقبولة في الكفاءة ومرفوضة في الأداء.","n":1,"i":33,"h":""},{"t":"write","q":"صمم تجربة بسيطة تفرق بين مشكلة معرفة ومشكلة ذاكرة (٤-٥ جمل).","key":"grammar-03:2","a":"أدّي المشاركين جملة طويلة متداخلة وأسأل عن فهمها. بعدين أديهم نفس المعنى مقسوم لجمل أقصر. لو فهموا المقسومة، المشكلة في الذاكرة. لو لسه مش فاهمين، المشكلة في المعرفة. وأقارن النتيجة بحكم المقبولية.","n":1,"i":34,"h":""},{"t":"end","h":"","teaser":"<div class=\"u\">الدرس الجاي: الصحة النحوية والمقبولية.</div><div class=\"u\">هنفرق بين جملة غلط نحويًا وجملة سليمة بس غريبة، وإزاي نحكم.</div>","extra":"المصادر: Chomsky, Aspects of the Theory of Syntax (1965); Saussure, Cours de linguistique générale; Hymes, On Communicative Competence (1972); Corder, The Significance of Learners' Errors (1967); Miller and Chomsky (1963).","i":35}];</script>
