<script>window.LESSON_ID="history-3";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Beowulf<\/span> ج1: الحكاية والعالم (أعظم ملحمة إنجليزية قديمة)\"<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🐉<\/span><\/span> الدرس اللي فات عرفنا دنيا العصر القديم والـ <span class=\"en\">scop<\/span> والـ <span class=\"en\">alliteration.<\/span> النهاردة هنعيش أعظم كنز في العصر كله: ملحمة <span class=\"en\">Beowulf.<\/span> الدرس ده جزء 1: الحكاية وعالمها. وجزء 2 الجاي: الوحوش الباقية ونهاية البطل.<\/div><div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: قبل الحكاية، بطاقة الملحمة <span class=\"em\"><span class=\"em\">🪪<\/span><\/span><\/div>", "n": 3, "i": 0, "a": "history-3-001", "x": "1091bf5c"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الأرقام الأساسية:<\/div><div class=\"li\">الاسم: <span class=\"en\">Beowulf<\/span> (بيوولف)، على اسم بطلها.<\/div><div class=\"li\">الشاعر: مجهول. محدش يعرف مين كتبها.<\/div><div class=\"li\">الطول: حوالي 3182 سطر.<\/div><div class=\"li\">اللغة: إنجليزي قديم، اللي اتعلمنا شكله الدرس اللي فات.<\/div><div class=\"li\">الأحداث: بتحصل في الدنمارك وجنوب السويد، حوالي القرن السادس. ملحوظة مهمة: الأحداث مش في إنجلترا أصلاً، بس القصيدة اتكتبت في إنجلترا بلغة إنجلترا.<\/div>", "n": 5, "i": 1, "a": "history-3-002", "x": "3f9182e2"}, {"t": "learn", "h": "<div class=\"li\">مثال يومي: زي فيلم مصري أحداثه كلها في بلد تانية، بس اللسان والروح مصريين.<\/div>", "n": 1, "i": 2, "a": "history-3-003", "x": "c04ac067"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> حكاية وصولها لينا (دراما لوحدها):<\/div><div class=\"li\">القصيدة عاشت شفهية زمان، وبعدين اتكتبت، ووصلتنا في مخطوطة واحدة بس من حوالي سنة 1000.<\/div><div class=\"li\">المخطوطة دي كادت تحترق في حريق مكتبة سنة 1731، ونجت بحروف متفحمة على الحواف.<\/div><div class=\"li\">يعني اللي بنقراه النهاردة نجا من النار. لو المخطوطة دي كانت راحت، كان زمان الملحمة كلها راحت معاها.<\/div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: خريطة الشخصيات (احفظها قبل الحكاية) <span class=\"em\"><span class=\"em\">🧾<\/span><\/span><\/div>", "n": 4, "i": 3, "a": "history-3-004", "x": "0cb93615"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> زي ما بتبص على قائمة الممثلين قبل المسلسل، دول أبطالنا:<\/div><div class=\"li\"><span class=\"en\">Hrothgar<\/span> (هرودجار): ملك الدانماركيين، عجوز حكيم وكريم.<\/div><div class=\"li\"><span class=\"en\">Wealhtheow<\/span>: الملكة مراته.<\/div><div class=\"li\"><span class=\"en\">Heorot<\/span> (هيروت): القاعة العظيمة اللي بناها، اللي اتكلمنا عن فكرتها الدرس اللي فات.<\/div><div class=\"li\"><span class=\"en\">Grendel<\/span> (جرندل): الوحش الساكن في المستنقعات. القصيدة بتقول إنه من نسل قابيل، يعني ملعون ومطرود من رحمة ربنا ومن فرحة البشر.<\/div>", "n": 5, "i": 4, "a": "history-3-005", "x": "c89c3fac"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Beowulf<\/span>: البطل، راجل من شعب الـ <span class=\"en\">Geats<\/span> في جنوب السويد، وابن أخت ملكهم <span class=\"en\">Hygelac.<\/span><\/div><div class=\"li\"><span class=\"en\">Unferth<\/span>: واحد من بلاط الملك هيعترض على بطلنا، هنشوف ليه.<\/div><div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: الحكاية، الجزء الأول <span class=\"em\"><span class=\"em\">📖<\/span><\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> المشهد 1: بناء هيروت<\/div><div class=\"li\"><span class=\"en\">Hrothgar<\/span> انتصر وغني، فقرر يبني أعظم قاعة شراب في الدنيا، اسمها <span class=\"en\">Heorot.<\/span><\/div><div class=\"li\">فيها بيوزع الكنوز على رجالته (افتكر <span class=\"en\">ring-giver<\/span>)، والـ <span class=\"en\">scop<\/span> بيغني فيها عن خلق الدنيا.<\/div>", "n": 6, "i": 5, "a": "history-3-006", "x": "10862de8"}, {"t": "learn", "h": "<div class=\"li\">الصورة: نور وموسيقى وكرم وولاء. أجمل مكان في العالم.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> المشهد 2: الوحش بيتعذب<\/div><div class=\"li\">في الضلمة والمستنقعات عايش <span class=\"en\">Grendel<\/span>، كائن وحشي معزول.<\/div><div class=\"li\">صوت الغنا والفرح اللي جاي من هيروت بيعذبه، لأنه محروم منها زي ما قابيل اتحرم.<\/div><div class=\"li\">فبينزل بالليل يهجم القاعة وياكل الرجال وهما نايمين. ويفضل كده 12 سنة كاملة. القاعة الجميلة بقت خرابة محدش يقربها بالليل.<\/div>", "n": 5, "i": 6, "a": "history-3-007", "x": "922d0cd3"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> المشهد 3: البطل يسمع ويجي<\/div><div class=\"li\">عبر البحر، في أرض الـ <span class=\"en\">Geats<\/span>، شاب اسمه <span class=\"en\">Beowulf<\/span> سمع بالمصيبة. أقوى راجل في زمانه، قبضة إيده بقوة 30 راجل.<\/div><div class=\"li\">اختار 14 من أشجع رجالته وركب البحر (افتكر الـ <span class=\"en\">kenning<\/span>: <span class=\"en\">whale-road<\/span>) لحد الدنمارك.<\/div><div class=\"li\">حارس الشاطئ وقفه، فقاله بمنتهى الهدوء: احنا جايين نساعد الملك مش نحاربه. الثقة دي هي أول صفة في البطل.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> المشهد 4: الدخول والتحدي<\/div>", "n": 5, "i": 7, "a": "history-3-008", "x": "78af0820"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Hrothgar<\/span> استقبله بحب، لأنه كان يعرف أبوه <span class=\"en\">Ecgtheow<\/span> وساعده زمان. (شايف الدنيا صغيرة والمعروف بيرجع؟)<\/div><div class=\"li\">بس في واحد اسمه <span class=\"en\">Unferth<\/span> قام يهزأه: افتكر لما اتنافست انت و<span class=\"en\">Breca<\/span> في السباحة في البحر وخسرت؟<\/div><div class=\"li\">رد <span class=\"en\">Beowulf<\/span> بهدوء وثقة: الحكاية مش كده، احنا كنا صغيرين واتنافسنا، وأنا غرقت في المعركة مش في السباحة، وقتلت وحوش بحر وهي بتشدني لتحت. الليلة هتشوف بعينك.<\/div>", "n": 3, "i": 8, "a": "history-3-009", "x": "602ba3c6"}, {"t": "learn", "h": "<div class=\"li\">درس أسلوبي: البطل في العصر ده بيتكلم بفخر واضح (اسمها <span class=\"en\">boast<\/span>)، ومش ده غرور، ده بروتوكول: لازم تثبت إنك أهل قبل المعركة.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> المشهد 5: العهد<\/div><div class=\"li\"><span class=\"en\">Beowulf<\/span> قال عبارة مفتاحية: بما إن <span class=\"en\">Grendel<\/span> مبيستخدمش سلاح، أنا كمان هحاربه بإيديا الفاضية. دي فكرة العدل في القتال: الشرف ميكسبش لو المعركة مش متكافئة.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> المشهد 6: الليلة<\/div>", "n": 4, "i": 9, "a": "history-3-010", "x": "c2d7d179"}, {"t": "learn", "h": "<div class=\"li\">نام الرجال في القاعة، و<span class=\"en\">Grendel<\/span> جه في الضلمة زي العادة. دخل وخطف واحد وكسره.<\/div><div class=\"li\">بس لما مد إيده على <span class=\"en\">Beowulf<\/span>، لقى أقوى قبضة في الدنيا بتقفل عليه. أول مرة في حياته الوحش يحس بالخوف.<\/div><div class=\"li\">صراع هز القاعة كلها، ولحد ما الذراع اتقلعت من كتف <span class=\"en\">Grendel<\/span>، والوحش هرب ينزف لحد مستنقعه يموت هناك.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> المشهد 7: الصبح<\/div><div class=\"li\">الفرح عمّ. علقوا ذراع الوحش تحت سقف هيروت تذكار.<\/div>", "n": 5, "i": 10, "a": "history-3-011", "x": "a26ad62e"}, {"t": "learn", "h": "<div class=\"li\">الهدايا والغناء، والـ <span class=\"en\">scop<\/span> غنى أغاني أبطال قدام زي <span class=\"en\">Sigemund<\/span> قاتل التنين. (احفظ التنين ده، هيرجع في الجزء التاني.)<\/div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: فهم العالم، القيم اللي بتحرك الحكاية <span class=\"em\"><span class=\"em\">⚖️<\/span><\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> القيمة 1: الولاء المتبادل (اسمها <span class=\"en\">comitatus<\/span>)<\/div><div class=\"li\">الملك يحمي ويكافئ، والرجالة يحاربوا ويفضلوا أوفياء للموت. عقد شرف مش ورقة.<\/div>", "n": 4, "i": 11, "a": "history-3-012", "x": "10947d30"}, {"t": "learn", "h": "<div class=\"li\">مثال يومي: زي الجدعنة المتبادلة في العيلة أو الشلة، اللي ياخد لازم يرد الجميل.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> القيمة 2: القدر (<span class=\"en\">wyrd<\/span>)<\/div><div class=\"li\">الإنسان يجاهد، بس النهاية بإيد القدر. <span class=\"en\">Beowulf<\/span> بيقول المعنى ده قبل المعركة: اللي هيفررر، يفر.<\/div><div class=\"li\">مثال يومي: \"اعقلها وتوكل\" بروح ألمانية قديمة.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> القيمة 3: المجد (<span class=\"en\">lof<\/span>)<\/div>", "n": 5, "i": 12, "a": "history-3-013", "x": "974c9fcc"}, {"t": "learn", "h": "<div class=\"li\">الموت جاي لا محالة، فاللي يفضل هو اسمك الحلو في كلام الناس. دي فكرة الخلود الوحيدة في العالم ده.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> القيمة 4: الكرم<\/div><div class=\"li\">الملك البخيل ملك فاشل. توزيع الكنوز هو لغة القيادة.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> القيمة 5: العزلة أسوأ عقوبة<\/div><div class=\"li\"><span class=\"en\">Grendel<\/span> مش شرير وبس، ده تعيس: مطرود من القاعة والفرح والجماعة. في العالم ده، العزلة عن الناس هي جهنم نفسها.<\/div>", "n": 5, "i": 13, "a": "history-3-014", "x": "102cd47f"}, {"t": "learn", "h": "<div class=\"li\">مثال يومي: واحد معزول عن كل قعدة ومناسبة، حتى لو معاه فلوس، حياته تعبانة.<\/div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: ليه القصيدة دي عظيمة؟ <span class=\"em\"><span class=\"em\">🌟<\/span><\/span><\/div><div class=\"li\">البنية: بتبدأ بجنازة (ملك اسمه <span class=\"en\">Scyld<\/span> اتودع في مركب)، وهتنتهي بجنازة. دائرة كاملة: الناس بتيجي وتمشي، واللي يفضل هو السمعة.<\/div><div class=\"li\">الوحش مرسوم بنفس: مش مجرد عضلات، ده غربة وغيرة من الفرح.<\/div>", "n": 4, "i": 14, "a": "history-3-015", "x": "7e618083"}, {"t": "learn", "h": "<div class=\"li\">وكل اللي اتعلمناه الدرس اللي فات ظهر حي: الـ <span class=\"en\">scop<\/span> بيغني في هيروت، والـ <span class=\"en\">mead-hall<\/span> مركز الحياة، والـ <span class=\"en\">kenning<\/span> والـ <span class=\"en\">alliteration<\/span> في كل سطر.<\/div>", "n": 1, "i": 15, "a": "history-3-016", "x": "5a370b8b"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🔗<\/span><\/span> لو حابب تبص:<\/div><div class=\"li\">النص كامل بالقديم والترجمة على <span class=\"en\">ebeowulf.uky.edu<\/span><\/div><div class=\"li\">مقال المكتبة البريطانية عن المخطوطة المحروقة على <span class=\"en\">bl.uk<\/span><\/div>", "n": 2, "i": 16, "a": "history-3-017", "x": "69a4c9a1"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📝<\/span><\/span> كويز الدرس 3 (مقالي أو بالصوت):<\/div><div class=\"u\">١. ليه غريب إن أعظم ملحمة \"إنجليزية\" أحداثها مش في إنجلترا؟ وضح الصورة بمثال.<\/div><div class=\"u\">٢. احكي حكاية المخطوطة اللي وصلتنا، وليه نعتبر نفسنا محظوظين؟<\/div><div class=\"u\">٣. ليه <span class=\"en\">Beowulf<\/span> قرر يحارب <span class=\"en\">Grendel<\/span> بلا سلاح؟ أي قيمة من قيم العصر بتوضحها الحركة دي؟<\/div><div class=\"u\">٤. اشرح بكلماتك قيمتين من قيم عالم <span class=\"en\">Beowulf<\/span>، ومع كل واحدة مثال من حياتنا.<\/div>", "n": 4, "i": 17, "a": "history-3-018", "x": "4c1ed73b"}, {"t": "learn", "h": "<div class=\"u\">٥. <span class=\"en\">Unferth<\/span> سخر من <span class=\"en\">Beowulf<\/span>، فرد عليه بأسلوب معين. صف الرد وقول ليه كان مقبول وقتها إن البطل \"يفتخر\" جهاراً.<\/div>", "n": 1, "i": 18, "a": "history-3-019", "x": "bc20adb3"}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">🐉<\/span><\/span> <span class=\"en\">Beowulf<\/span> ج2، أم الوحش، والتنين، وموت البطل.", "extra": "", "i": 19}];</script>
