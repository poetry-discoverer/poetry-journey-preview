<script>window.LESSON_ID="grammar-08";window.STEPS=[{"t": "section", "h": "الكلمة تتفكك", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في الدرس التامن. الكلمة ممكن تتفكك لأجزاء صغيرة، وكل جزء ليه معنى. خد كلمة <span class=\"en\">unhappiness</span>. <span class=\"en\">un</span> معناها لأ. <span class=\"en\">happy</span> معناها سعيد. و<span class=\"en\">ness</span> معناها حالة. يعني حالة عدم السعادة.</div>", "n": 1, "i": 1, "a": "grammar-08-001", "x": "bb6b5976"}, {"t": "mc", "q": "كام مورفيم في كلمة <span class=\"en\">unhappiness</span>؟", "opts": ["اتنين", "تلاتة", "واحد"], "ans": 1, "why": "<span class=\"en\">un</span> + <span class=\"en\">happy</span> + <span class=\"en\">ness</span>.", "ex": ["غلط: فيها تلات أجزاء.", "صح: <span class=\"en\">un</span> و <span class=\"en\">happy</span> و <span class=\"en\">ness</span>.", "غلط: الكلمة مركبة."], "n": 1, "i": 2, "h": ""}, {"t": "learn", "h": "<div class=\"u\">كل جزء من دول اسمه مورفيم، <span class=\"en\">morpheme</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a morpheme is the smallest piece of a word that has meaning</span>. وكلمة <span class=\"en\">cats</span> فيها مورفيمين: <span class=\"en\">cat</span> و<span class=\"en\">s</span>. أما <span class=\"en\">dog</span> فمورفيم واحد.</div>", "n": 1, "i": 3, "a": "grammar-08-002", "x": "8f624cfb"}, {"t": "section", "h": "حر ومقيّد", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">المورفيم الحر، <span class=\"en\">free morpheme</span>، يقف لوحده كلمة، زي <span class=\"en\">happy</span> و<span class=\"en\">cat</span> و<span class=\"en\">run</span>. والمقيّد، <span class=\"en\">bound morpheme</span>، مش بيقف لوحده، لازم يتلزق بغيره، زي <span class=\"en\">un</span> و<span class=\"en\">ness</span> و<span class=\"en\">s</span> و<span class=\"en\">ed</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a free morpheme can be a word alone</span>, <span class=\"en\">and a bound morpheme must attach to another part</span>.</div>", "n": 1, "i": 5, "a": "grammar-08-003", "x": "6e0104e6"}, {"t": "section", "h": "الجذر والأفكسات", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">الجذر، <span class=\"en\">root</span>، هو القلب اللي بيشيل المعنى الأساسي. في <span class=\"en\">unhappiness</span> الجذر هو <span class=\"en\">happy</span>. والأفكس، <span class=\"en\">affix</span>، هو اللي بيتلزق بالجذر. لو جه قبله اسمه <span class=\"en\">prefix</span>، سابقة، زي <span class=\"en\">un</span> و<span class=\"en\">re</span>. ولو جه بعده اسمه <span class=\"en\">suffix</span>، لاحقة، زي <span class=\"en\">ness</span> و<span class=\"en\">er</span> و<span class=\"en\">ed</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the root carries the main meaning</span>. <span class=\"en\">Prefixes go before it</span>, <span class=\"en\">suffixes go after it</span>.</div>", "n": 1, "i": 7, "a": "grammar-08-004", "x": "adfae621"}, {"t": "tf", "q": "الـ <span class=\"en\">prefix</span> بييجي بعد الجذر.", "ans": false, "why": "غلط: السابقة قبل الجذر.", "ex": ["غلط: اللاحقة (<span class=\"en\">suffix</span>) هي اللي بعده.", "صح، الجملة غلط: السابقة قبل الجذر."], "n": 1, "i": 8, "h": ""}, {"t": "learn", "h": "<div class=\"u\">والجزء اللي بنضيف له الأفكس اسمه <span class=\"en\">base</span> أو <span class=\"en\">stem</span>. في <span class=\"en\">unhappiness</span>، الـ <span class=\"en\">base</span> اللي بنضيف له <span class=\"en\">ness</span> هو <span class=\"en\">unhappy</span>.</div>", "n": 1, "i": 9, "a": "grammar-08-005", "x": "f62b12fe"}, {"t": "section", "h": "تصريف واشتقاق", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">التصريف، <span class=\"en\">inflection</span>، بيغير الصيغة النحوية من غير ما يغير القسم أو المعنى الأساسي. زي <span class=\"en\">cat</span> و<span class=\"en\">cats</span>، و<span class=\"en\">walk</span> و<span class=\"en\">walked</span>. والاشتقاق، <span class=\"en\">derivation</span>، بيعمل كلمة جديدة وغالبًا بيغير القسم. زي <span class=\"en\">happy</span> صفة و<span class=\"en\">happiness</span> اسم. <span class=\"en\">In simple English</span>: <span class=\"en\">inflection changes the grammar form</span>, <span class=\"en\">and derivation makes a new word</span>.</div>", "n": 1, "i": 11, "a": "grammar-08-006", "x": "32f0c83d"}, {"t": "mc", "q": "<span class=\"en\">cat</span> إلى <span class=\"en\">cats</span> ده:", "opts": ["<span class=\"en\">derivation</span>", "<span class=\"en\">inflection</span>", "<span class=\"en\">conversion</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it changes the grammar form only</span>.", "ex": ["غلط: الاشتقاق بيعمل كلمة جديدة.", "صح: تصريف للجمع.", "غلط: <span class=\"en\">conversion</span> تغيير قسم من غير تغير شكل."], "n": 1, "i": 12, "h": ""}, {"t": "mc", "q": "<span class=\"en\">happy</span> إلى <span class=\"en\">happiness</span> ده:", "opts": ["<span class=\"en\">inflection</span>", "<span class=\"en\">derivation</span>", "<span class=\"en\">allomorph</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">new word</span>, <span class=\"en\">new class</span>.", "ex": ["غلط: ده مش تصريف.", "صح: اشتقاق: صفة بقت اسم.", "غلط: <span class=\"en\">allomorph</span> شكل مورفيم."], "n": 1, "i": 13, "h": ""}, {"t": "learn", "h": "<div class=\"u\">والإنجليزي فيه تمانية أفكسات تصريفية بس. <span class=\"en\">s</span> الجمع، و<span class=\"en\">s</span> الملكية، و<span class=\"en\">s</span> الغائب، و<span class=\"en\">ed</span> الماضي، و<span class=\"en\">ing</span>، و<span class=\"en\">en</span> اسم المفعول، و<span class=\"en\">er</span> المقارنة، و<span class=\"en\">est</span> التفضيل.</div>", "n": 1, "i": 14, "a": "grammar-08-007", "x": "9ee19329"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">الشكل: مورفيم حر أو مقيّد، وسابقة أو لاحقة. الوظيفة: تصريفي نحوي، أو اشتقاقي معجمي. المعنى: كل مورفيم ليه معنى أو وظيفة نحوية. والاستعمال: الاشتقاق بيكوّن كلمات جديدة، زي <span class=\"en\">googleable</span>.</div>", "n": 1, "i": 16, "a": "grammar-08-008", "x": "dc959807"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">مش كل مورفيم قطعة واضحة تتلزق. جمع <span class=\"en\">man</span> هو <span class=\"en\">men</span>، تغيير داخلي. وماضي <span class=\"en\">sing</span> هو <span class=\"en\">sang</span>. وفيه <span class=\"en\">cranberry morphs</span>: <span class=\"en\">cran</span> في <span class=\"en\">cranberry</span> مالهاش معنى لوحدها. دي بتبين إن تعريف المورفيم بإنه أصغر وحدة بمعنى فيه مشاكل. <span class=\"en\">In simple English</span>: <span class=\"en\">some words do not break into clean pieces</span>, <span class=\"en\">so the idea of morpheme has limits</span>.</div>", "n": 1, "i": 18, "a": "grammar-08-009", "x": "0b7f1862"}, {"t": "tf", "q": "جمع <span class=\"en\">man</span> هو <span class=\"en\">men</span>، وده مثال على إن المورفيم مش دايمًا قطعة واضحة.", "ans": true, "why": "صح: التغيير داخلي.", "ex": ["صح: تغيير داخلي مش قطعة.", "غلط: الحالة دي بالظبط مشكلة للمورفيم."], "n": 1, "i": 19, "h": ""}, {"t": "learn", "h": "<div class=\"u\">و<span class=\"en\">Hockett</span> سنة 1954 فرّق بين نموذجين. <span class=\"en\">Item-and-Arrangement</span>: الكلمة مورفيمات متراصة. و<span class=\"en\">Item-and-Process</span>: الكلمة بتتولد من عمليات على الجذر. وفيه نموذج تالت قديم، <span class=\"en\">Word-and-Paradigm</span>: الكلمة كلها هي الوحدة، وبتتعلم ضمن جدول تصريف.</div>", "n": 1, "i": 20, "a": "grammar-08-010", "x": "54b09438"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. <span class=\"en\">Morpheme</span>: مورفيم. <span class=\"en\">In simple English</span>: <span class=\"en\">the smallest piece with meaning</span>. <span class=\"en\">Free morpheme</span>: مورفيم حر. <span class=\"en\">In simple English</span>: <span class=\"en\">it can stand alone</span>. <span class=\"en\">Bound morpheme</span>: مورفيم مقيّد. <span class=\"en\">In simple English</span>: <span class=\"en\">it cannot stand alone</span>.</div>", "n": 1, "i": 22, "a": "grammar-08-011", "x": "a6f74349"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Root</span>: جذر. <span class=\"en\">In simple English</span>: <span class=\"en\">the core of the word</span>. <span class=\"en\">Prefix</span>: سابقة. <span class=\"en\">In simple English</span>: <span class=\"en\">it goes before the root</span>. <span class=\"en\">Suffix</span>: لاحقة. <span class=\"en\">In simple English</span>: <span class=\"en\">it goes after the root</span>. <span class=\"en\">Base</span>: قاعدة. <span class=\"en\">In simple English</span>: <span class=\"en\">what an affix is added to</span>.</div>", "n": 1, "i": 23, "a": "grammar-08-012", "x": "68f8979f"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Inflection</span>: تصريف. <span class=\"en\">In simple English</span>: <span class=\"en\">it changes the grammar form</span>. <span class=\"en\">Derivation</span>: اشتقاق. <span class=\"en\">In simple English</span>: <span class=\"en\">it makes a new word</span>. <span class=\"en\">Allomorph</span>: ألومورف، شكل من أشكال المورفيم. <span class=\"en\">Cranberry morph</span>: مورفيم فريد في كلمة واحدة.</div>", "n": 1, "i": 24, "a": "grammar-08-013", "x": "f9632e88"}, {"t": "mc", "q": "«<span class=\"en\">cran-</span>» في <span class=\"en\">cranberry</span> هي:", "opts": ["جذر حر", "مورفيم فريد (<span class=\"en\">cranberry morph</span>)", "لاحقة تصريفية"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it appears in only one word</span>.", "ex": ["غلط: مش بتقف لوحدها.", "صح: مالهاش معنى لوحدها وبتظهر في كلمة واحدة.", "غلط: مش لاحقة."], "n": 1, "i": 25, "h": ""}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: المورفيم أصغر وحدة بمعنى أو وظيفة نحوية. اتنين: الجذر والأفكسات، سابقة ولاحقة. تلاتة: التصريف نحوي، والاشتقاق معجمي. أربعة: المورفيم مش دايمًا قطعة واضحة. <span class=\"en\">In short</span>: <span class=\"en\">words are built from small meaningful parts</span>. الدرس الجاي: الاشتقاق والتصريف بتفصيل أكتر.</div>", "n": 1, "i": 27, "a": "grammar-08-014", "x": "c6e81bf1"}, {"t": "section", "h": "الكويز", "n": 1, "i": 28}, {"t": "recall", "q": "اذكر ٣ أفكسات تصريفية في الإنجليزي.", "a": "-<span class=\"en\">s</span> (الجمع)، -<span class=\"en\">ed</span> (الماضي)، -<span class=\"en\">ing</span>، -<span class=\"en\">er</span> (المقارنة)، -<span class=\"en\">est</span>، -<span class=\"en\">en</span>. (أي ٣). <span class=\"en\">In simple English</span>: <span class=\"en\">small endings that change grammar</span>.", "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "إيه الجذر والأفكسات في <span class=\"en\">disagreement</span>؟", "a": "الجذر <span class=\"en\">agree</span>، والأفكسات <span class=\"en\">dis-</span> (سابقة) و -<span class=\"en\">ment</span> (لاحقة). <span class=\"en\">In simple English</span>: <span class=\"en\">dis- before</span>, -<span class=\"en\">ment after</span>.", "n": 1, "i": 30, "h": ""}, {"t": "write", "q": "اشرح الفرق بين <span class=\"en\">inflection</span> و <span class=\"en\">derivation</span> بمثال لكل واحد (٣-٤ جمل).", "key": "grammar-08:1", "a": "التصريف بيغير الصيغة النحوية من غير ما يغير القسم، زي <span class=\"en\">cat</span> و<span class=\"en\">cats</span>. الاشتقاق بيعمل كلمة جديدة وغالبًا بيغير القسم، زي <span class=\"en\">happy</span> و<span class=\"en\">happiness</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">inflection is grammar</span>, <span class=\"en\">derivation is new words</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "ناقش ليه <span class=\"en\">men</span> مشكلة لفكرة المورفيم (٣-٤ جمل).", "key": "grammar-08:2", "a": "جمع <span class=\"en\">man</span> هو <span class=\"en\">men</span> بتغيير الحرف الداخلي، مش بإضافة قطعة زي <span class=\"en\">s</span>. فمفيش مورفيم واضح للجمع. ده بيبين إن فكرة أصغر وحدة بمعنى مش دايمًا بتتطبق. <span class=\"en\">In simple English</span>: <span class=\"en\">some words change inside</span>, <span class=\"en\">not by adding a piece</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "قارن بين نموذج <span class=\"en\">Item-and-Arrangement</span> ونموذج <span class=\"en\">Item-and-Process</span> في وصف الكلمة.", "key": "grammar-08:3", "a": "نموذج <span class=\"en\">Item-and-Arrangement</span> بيشوف الكلمة كأنها مورفيمات متراصة، مثل <span class=\"en\">un + happy + ness</span>، وده بيشتغل كويس مع الأفكسات الواضحة. نموذج <span class=\"en\">Item-and-Process</span> بيشوف الكلمة كأنها ناتجة عن عمليات على الجذر، زي تغيير الحرف الداخلي في <span class=\"en\">sing</span> و<span class=\"en\">sang</span>. الأول أبسط في الأمثلة المنتظمة، والتاني أنسب للأشكال الشاذة. والفرق ده ناقشه <span class=\"en\">Hockett</span> (1954).", "n": 1, "i": 33, "h": ""}, {"t": "write", "q": "قارن بين <span class=\"en\">inflection</span> و <span class=\"en\">derivation</span> من ناحية القسم والمعنى.", "key": "grammar-08:4", "a": "التصريف بيغير الصيغة النحوية من غير ما يغير القسم، زي <span class=\"en\">cat</span> و<span class=\"en\">cats</span>. والاشتقاق بيعمل كلمة جديدة وغالبًا بيغير القسم، زي <span class=\"en\">happy</span> و<span class=\"en\">happiness</span>. التصريف منتظم وعدده قليل في الإنجليزي (8 أفكسات). الاشتقاق أكتر وأقل انتظامًا. يعني التصريف نحوي، والاشتقاق معجمي.", "n": 1, "i": 34, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الاشتقاق والتصريف بتفصيل أكتر.</div><div class=\"u\">هنشوف إزاي بنصنع كلمات جديدة وإزاي الكلمة بتغير شكلها.</div>", "extra": "المصادر: Hockett (1954); Bauer (1983); Haspelmath and Sims (2010); Blevins (2006).", "i": 35}];</script>
