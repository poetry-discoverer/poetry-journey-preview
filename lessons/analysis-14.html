<script>window.LESSON_ID="analysis-14";window.STEPS=[{"t":"learn","h":"<div class=\"u\">من موت هادي على قارب، لراجل بيركب قارب في الليل عشان يقابل حبيبته. نفس صورة الماء، ومزاج مختلف خالص.</div><div class=\"u\">القصيدة: Meeting at Night لروبرت براوننج — 12 سطر بس، مقطعين، وكل حاجة فيها حركة.</div>","n":2,"i":0,"a":"analysis-14-001","x":"1e79820f"},{"t":"section","h":"السياق","n":1,"i":1},{"t":"learn","h":"<div class=\"u\">روبرت براوننج <span class=\"en\">(Robert Browning)</span>، 1812-1889، شاعر فيكتوري، وجوز إليزابيث باريت براوننج اللي خدناها في الدرس ١١. اشتهر بالمونولوج الدرامي <span class=\"en\">(dramatic monologue)</span>.</div>","n":1,"i":2,"a":"analysis-14-002","x":"fdb49176"},{"t":"learn","h":"<div class=\"u\">القصيدة اتنشرت في مجموعة <span class=\"en\">Dramatic Romances and Lyrics</span> سنة 1845، ومعاها قصيدة تانية اسمها <span class=\"en\">Parting at Morning</span> بيكملوا بعض.</div>","n":1,"i":3,"a":"analysis-14-003","x":"a082944c"},{"t":"learn","h":"<div class=\"u\">المشهد: عاشق بيعدّي البحر في قارب، بعدين بيمشي على شط، وبعدين بيقطع حقول لحد ما يوصل لبيت، ويخبط على الشباك. مفيش أسماء ولا حكاية — حركة وحواس بس.</div>","n":1,"i":4,"a":"analysis-14-004","x":"f91191f6"},{"t":"learn","h":"<div class=\"u\">الشكل: مقطعين، كل واحد ستة سطور، والقافية <span class=\"en\">abccba</span> — قافية محيطة، أول سطر بيقفل مع آخر سطر في نفس المقطع.</div>","n":1,"i":5,"a":"analysis-14-005","x":"09a10383"},{"t":"section","h":"المقطع الأول (<span dir=\"ltr\">1-6</span>)","n":1,"i":6},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">1-3</span>:</div><div class=\"u\"><span class=\"en\">The gray sea and the long black land; / And the yellow half-moon large and low: / And the startled little waves that leap / In fiery ringlets from their sleep,</span></div>","n":2,"i":7,"a":"analysis-14-006","x":"9beb0891"},{"t":"learn","h":"<div class=\"u\">تلات ألوان في تلات سطور: بحر رمادي، أرض سودا، وقمر نصّ أصفر. الصورة كلها ليلية، والقمر «كبير وواطي» — قريب من الأفق، وده اللي بيدّي إحساس بالدفء مش بالبرد.</div>","n":1,"i":8,"a":"analysis-14-007","x":"9bb1b326"},{"t":"learn","h":"<div class=\"u\">«الموجات الصغيرة المتفزعة بتنط في خصل نارية من نومها» <span class=\"en\">(startled… fiery ringlets)</span>: الموج هنا كائن بيتفزع ويتحرك، والضوء على الموج شبه شعر ناري. تشخيص <span class=\"en\">(personification)</span>.</div>","n":1,"i":9,"a":"analysis-14-008","x":"19f5c01d"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">4-6</span>:</div><div class=\"u\"><span class=\"en\">As I gain the cove with pushing prow, / And quench its speed i’ the slushy sand.</span></div>","n":2,"i":10,"a":"analysis-14-009","x":"eed85c84"},{"t":"learn","h":"<div class=\"u\">«لما أوصل الخليج بمقدمة القارب الدافعة، وأطفي سرعته في الرمل الطيني». كلمة <span class=\"en\">quench</span> (يطفئ) عادة بتستخدم مع النار، وهنا مع السرعة — كأن السرعة لهب بيتطفي على الرمل.</div>","n":1,"i":11,"a":"analysis-14-010","x":"27e079ae"},{"t":"learn","h":"<div class=\"u\">ولاحظ الفعل <span class=\"en\">pushing</span>: القارب مش بس ماشي، هو بيدفع. الحركة في القصيدة دايمًا ليها مقاومة، وده اللي بيدّي إحساس بالجهد والشوق.</div>","n":1,"i":12,"a":"analysis-14-011","x":"092e06ed"},{"t":"learn","h":"<div class=\"u\">و«And» بتتكرر في أول تلات سطور — الربط المتكرر <span class=\"en\">(polysyndeton)</span> ده بيخلي الصور تتراكم ورا بعض بسرعة، زي عين بتشوف في الضلمة.</div>","n":1,"i":13,"a":"analysis-14-012","x":"7180624b"},{"t":"section","h":"المقطع التاني (<span dir=\"ltr\">7-12</span>)","n":1,"i":14},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">7-9</span>:</div><div class=\"u\"><span class=\"en\">Then a mile of warm sea-scented beach; / Three fields to cross till a farm appears; / A tap at the pane, the quick sharp scratch</span></div>","n":2,"i":15,"a":"analysis-14-013","x":"65ef4a1f"},{"t":"learn","h":"<div class=\"u\">المسافات اتقالت بالأرقام: ميل، وتلات حقول. القصيدة بتحسب الخطوات زي ما الليدي في شالوت حسبت تلات خطوات — بس هنا الحساب بيروح ناحية الحياة مش ناحية الموت.</div>","n":1,"i":16,"a":"analysis-14-014","x":"8bea39a6"},{"t":"mc","h":"","q":"المسافات في القصيدة (ميل، تلات حقول) بتعمل إيه؟","opts":["بتقيس قرب الوصول وبتزيد التشويق","بتوصف الريف الإنجليزي","بتدل على تعب الشاعر"],"ans":0,"why":"بتقرّب اللقاء وبتزيد التشويق.","n":1,"i":17,"ex":["صح: كل مسافة بتقرّب اللقاء، فالإيقاع بيتسارع ناحية الخبطة على الشباك.","غلط: الوصف الريفي مش المقصود الأساسي.","غلط: التعب موجود كإحساس لكن الوظيفة البنائية هي التقريب."]},{"t":"learn","h":"<div class=\"u\">«شط دافي ريحته بحر»: لمس وشم، مش بصر بس. الحواس في القصيدة بتتبدل من منظر لمنظر أقرب: بحر، شط، حقول، بيت، شباك.</div>","n":1,"i":18,"a":"analysis-14-015","x":"293f9e9b"},{"t":"learn","h":"<div class=\"lead\">السطور <span dir=\"ltr\">10-12</span>:</div><div class=\"u\"><span class=\"en\">And blue spurt of a lighted match, / And a voice less loud, through joys and fears, / Than the two hearts beating each to each!</span></div>","n":2,"i":19,"a":"analysis-14-016","x":"c3b932a9"},{"t":"mc","h":"","q":"«the blue spurt of a lighted match» بيمثل إيه؟","opts":["لحظة اللقاء والضوء الوحيد في المشهد","خوف العاشق","بداية حريق"],"ans":0,"why":"لحظة اللقاء.","n":1,"i":20,"ex":["صح: شرارة الكبريت هي لحظة الاتصال، وضوءها الصغير بيدّي الحميمية.","غلط: مفيش إشارة للخوف هنا؛ الخوف مذكور في السطر اللي بعده مع الفرح.","غلط: مفيش أي إشارة لحريق."]},{"t":"learn","h":"<div class=\"u\">«وشرارة زرقا من عود كبريت مولّع» — الضوء الوحيد في المقطع التاني. ضوء صغير جدًا، وده اللي بيخلي اللحظة حميمة.</div>","n":1,"i":21,"a":"analysis-14-017","x":"a30ed881"},{"t":"learn","h":"<div class=\"u\">و«صوت أقل علو من دقة القلبين»: الكلام أقل من الإحساس. القصيدة بتخلص على صوت جوه الجسم، مش على كلمة حب — وده أذكى ختام ممكن لقصيدة عن لقاء.</div>","n":1,"i":22,"a":"analysis-14-018","x":"c86f6f00"},{"t":"mc","h":"","q":"السطر الأخير بيعمل إيه؟","opts":["بيحط القلبين فوق الكلام والصور","بيوصف صوت الباب","بيختم بالوداع"],"ans":0,"why":"بيختم بالإحساس مش بالكلام.","n":1,"i":23,"ex":["صح: «a voice less loud… than the two hearts beating» — الإحساس أقوى من الكلام.","غلط: الصوت هنا صوت الحبيبة، مش صوت باب.","غلط: القصيدة بتنتهي عند اللقاء مش الوداع (الوداع في القصيدة التانية)."]},{"t":"learn","h":"<div class=\"u\">وللقصيدة توأم: <span class=\"en\">Parting at Morning</span> — نفس الراجل بعد اللقاء، النهار طلع، وهو بيمشي. الاتنين مع بعض بيقفلوا دايرة الليل والنهار.</div>","n":1,"i":24,"a":"analysis-14-019","x":"36d83259"},{"t":"learn","h":"<div class=\"u\">وفيها مفيش شرح للمشاعر ولا مستمع بيتكلم: صوت واحد بيحكي والقارئ بيشوف من عينه. ده المونولوج الدرامي <span class=\"en\">(dramatic monologue)</span> في أصغر صوره.</div>","n":1,"i":25,"a":"analysis-14-020","x":"935ba0ed"},{"t":"section","h":"الأدوات والموضوعات","n":1,"i":26},{"t":"learn","h":"<div class=\"u\">الصور الحسية <span class=\"en\">(sensory imagery)</span>: ألوان (رمادي، أسود، أصفر، أزرق)، لمس (رمل طيني، شط دافي)، شم (ريحة البحر)، سمع (خبطة على الشباك، خرم عود الكبريت، دقة القلب). القصيدة بتستخدم كل الحواس عشان اللحظة تبقى محسوسة.</div>","n":1,"i":27,"a":"analysis-14-021","x":"a517ae12"},{"t":"tf","h":"","q":"القصيدة بتستخدم أكتر من حاسة واحدة.","ans":true,"why":"صح: بصر (الألوان والقمر)، لمس (الرمل الطيني والشط الدافي)، شم (ريحة البحر)، سمع (الخبطة والكبريت ودقة القلب).","n":1,"i":28,"ex":["صح، الجملة صح: الحواس متعددة وده أساس قوة القصيدة.","غلط. الحواس واضحة في كل مقطع."]},{"t":"learn","h":"<div class=\"u\">الحركة والتقدم: كل سطر بيقرّب. بحر ← خليج ← شط ← حقول ← مزرعة ← شباك ← كبريت ← قلبين. مفيش سطر واقف، وده اللي بيخلق التشويق.</div>","n":1,"i":29,"a":"analysis-14-022","x":"dd773cff"},{"t":"tf","h":"","q":"القصيدة بتذكر اسم الحبيبة.","ans":false,"why":"غلط: مفيش أسماء خالص — لا للعاشق ولا للحبيبة. وده اللي بيخلي القصيدة عامة وقابلة للتعميم.","n":1,"i":30,"ex":["غلط. النص كله من غير أسماء.","صح، الجملة غلط: مفيش أسماء في القصيدة."]},{"t":"learn","h":"<div class=\"u\">القافية المحيطة <span class=\"en\">(abccba)</span>: أول سطر بيقفل مع آخر سطر في المقطع، فكل مقطع بيبقى دايرة مقفولة. القافية نفسها بتحاكي الوصول واللقاء.</div>","n":1,"i":31,"a":"analysis-14-023","x":"97b9ef9a"},{"t":"mc","h":"","q":"إيه نظام القافية في القصيدة؟","opts":["abccba — قافية محيطة في كل مقطع","abab","شعر حر من غير قافية"],"ans":0,"why":"abccba، قافية محيطة.","n":1,"i":32,"ex":["صح: أول سطر بيقفل مع آخر سطر (land/sand، beach/each)، وده اللي بيدّي شكل الدايرة.","غلط: abab مش النظام هنا.","غلط: القصيدة مقفّاة بانتظام."]},{"t":"learn","h":"<div class=\"u\">الموضوعات: الشوق، واللقاء السري في الليل، والحب كرحلة ليها تعب، والجسد أصدق من الكلام. وبعض القراءات بتشوف إن القصيدة مش عن الحب الرومانسي بس، لكن عن قوة الرغبة وهي بتتحرك.</div>","n":1,"i":33,"a":"analysis-14-024","x":"1ae6f23d"},{"t":"section","h":"أسئلة الامتحان","n":1,"i":34},{"t":"recall","h":"","q":"اشرح رحلة العاشق في القصيدة.","a":"الرحلة بتبدأ في البحر: بحر رمادي وأرض سودا وقمر نصّ أصفر، والموج بيتحرك زي خصل نارية. بعدين بيوصل الخليج بمقدمة القارب وبيطفي سرعته في الرمل الطيني. بعد كده بيمشي ميل على شط دافي ريحته بحر، ويقطع تلات حقول لحد ما تظهر مزرعة. وأخيرًا خبطة على الشباك، وخرم عود كبريت، وصوت واطي، ودقة قلبين. كل مرحلة أقرب من اللي قبلها، والقصيدة بتخلص في أضيق نقطة: قلبين بيدقوا لبعض.","n":1,"i":35},{"t":"recall","h":"","q":"إزاي القصيدة بتبني التشويق من غير ما تحكي حكاية؟","a":"بالتقدم في المكان والحواس. كل سطر بيزوّد القرب: بحر، خليج، شط، حقول، مزرعة، شباك. والقافية المحيطة (abccba) بتقفل كل مقطع زي دايرة، فالقارئ بيحس إنه وصل وبعدين لازم يكمل. والمسافات المذكورة بالأرقام (ميل، تلات حقول) بتخلي الوصول محسوب. كمان فيه أسرار: مفيش أسماء ولا تفسير، واللقاء في الليل، والخبطة على الشباك من غير إعلان. وكل ده بيخلق توقع، والختام بيحل التوقع في إحساس جسدي مش في كلمة.","n":1,"i":36},{"t":"write","h":"","q":"حلّل الصور الحسية في القصيدة.","key":"analysis-14:1","a":"القصيدة مبنية على الحواس أكتر من أي شيء تاني. البصر: «gray sea»، «long black land»، «yellow half-moon large and low»، والشرارة الزرقا للكبريت. اللمس: «slushy sand» و«warm sea-scented beach». الشم: ريحة البحر في الشط. السمع: الخبطة على الشباك، خرم عود الكبريت، والصوت الواطي، ودقة القلبين. التشخيص بيزود الحياة: الموج «startled» وبيتنط من نومه. وكلمة «quench» بتستعار من النار للسرعة، فالقارب بيبقى له لهب بيتطفي. النتيجة إن اللقاء مش بيتوصف، هو بيتحس — والقارئ بيمشي المسافة مع العاشق.","n":1,"i":37},{"t":"write","h":"","q":"ناقش العلاقة بين شكل القصيدة (abccba) ومعناها.","key":"analysis-14:2","a":"القافية المحيطة abccba بتخلي كل مقطع مقفول من الطرفين: السطر الأول بيرجع في السادس (land/sand في الأول، beach/each في التاني). الشكل ده بيحاكي حركة الرحلة: انطلاق ثم رجوع، أو بعُد ثم قرب. وفي نفس الوقت، القافية الداخلية (cc) في وسط المقطع بتعمل نقطة ارتكاز (leap/sleep، scratch/match) — وده بيخلّي المقطع يحس كأنه خطوة: يبدأ، يثبت، يرجع. والمقطعين الاتنين بنفس الشكل، فالقصيدة بتبقى مرحلتين متوازيتين: البحر والبر. والختام بالسطر السادس بيرجع للقافية الأولى، فالحب بيقفل دايرة — زي ما اللقاء بيكمل المسافة.","n":1,"i":38},{"t":"end","h":"","teaser":"<div class=\"u\">كده Meeting at Night خلصت: بحر رمادي، شط دافي، خبطة على الشباك، وقلبين بيدقوا.</div><div class=\"u\">الدرس الجاي: A Birthday لكريستينا روزيتي — قصيدة عن الفرح نفسه.</div>","extra":"المصادر: Robert Browning, “Meeting at Night” (Dramatic Romances and Lyrics, 1845)؛ القصيدة المرافقة: “Parting at Morning”؛ مصطلحات: sensory imagery, enclosed rhyme, personification.","i":39}];</script>
