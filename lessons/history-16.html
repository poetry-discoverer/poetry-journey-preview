<h1>الدرس 16: Edmund Spenser، الراعي اللي كتب The Shepheardes Calender</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> تمهيدي</span><span class="tag">الدرس 16</span><span class="tag"><span class="em">📜</span> تاريخ الشعر</span></div>

<script>window.LESSON_ID="history-16", "history-17", "history-18", "history-19", "history-20", "history-21", "history-13", "history-14", "history-15";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">🐑 في الدرس اللي فات شفنا <span class=\"en\">Sidney<\/span> وهو بيدافع عن الشعر ويقول: الشاعر صانع مش كداب.<\/div><div class=\"u\">النهاردة هنقابل شاعر عمل حاجة غريبة: طلّع كتاب كامل بيقول للقارئ \"أنا شاعر جديد، ووريث <span class=\"en\">Chaucer<\/span>، وخدوني بجدية\". اسمه <span class=\"en\">Edmund Spenser<\/span>، والكتاب اسمه <span class=\"en\">The Shepheardes Calender<\/span>.<\/div>", "n": 2, "a": "history-16-001", "x": "ad5129cb", "en": "In the last lesson we saw Sidney defend poetry and say: the poet is a maker, not a liar. Today we meet a poet who did something unusual: he put out a whole book telling the reader, I am a new poet, the heir of Chaucer, take me seriously. His name is Edmund Spenser, and the book is The Shepheardes Calender.", "i": 1}, {"t": "learn", "h": "<div class=\"u\">الكتاب ده مهم لأنه من أول المرات في إنجلترا اللي شاعر يقدّم نفسه كـ \"شاعر جديد\" بالشكل ده، مش كواحد بيكتب في وقت فراغه.<\/div><div class=\"u\">يعني <span class=\"en\">Spenser<\/span> ما كتبش قصايد وبس. هو عمل \"حدث ثقافي\".<\/div>", "n": 2, "a": "history-16-002", "x": "d6aaa1a8", "en": "This book matters because it is one of the first times in England that a poet presents himself as a new poet in this way, not as someone who writes in his spare time. So Spenser did not only write poems. He made a cultural event.", "i": 2}, {"t": "section", "h": "النقطة 1: <span class=\"en\">Spenser<\/span>، الراجل اللي جاي من تحت", "i": 3}, {"t": "learn", "h": "<div class=\"u\">حياته الأولى:<\/div><div class=\"li\">اتولد في لندن، في <span class=\"en\">East Smithfield<\/span>، حوالي سنة 1552. التاريخ بالظبط مش معروف: المصادر بتقول 1552 أو 1553.<\/div><div class=\"li\">أبوه على الأغلب كان تاجر قماش، يعني مش نبيل ولا قريب من البلاط.<\/div><div class=\"li\">اتعلم في <span class=\"en\">Merchant Taylors' School<\/span> في لندن، ودرس اللاتيني واليوناني والعبري.<\/div>", "n": 4, "a": "history-16-003", "x": "d114aab6", "en": "His early life. He was born in London, in East Smithfield, around 1552. The exact date is not known: sources say 1552 or 1553. His father was most likely a cloth man, so not a noble and not close to the court. He studied at Merchant Taylors' School in London, and learned Latin, Greek and Hebrew.", "i": 4}, {"t": "learn", "h": "<div class=\"li\">دخل <span class=\"en\">Pembroke College<\/span> في <span class=\"en\">Cambridge<\/span> سنة 1569 كـ <span class=\"en\">sizar<\/span>، يعني طالب بيدفع مصاريف أقل مقابل شغل خدمة في الكلية.<\/div><div class=\"li\">هناك اتعرف على <span class=\"en\">Gabriel Harvey<\/span>، باحث كبير وصاحبه طول العمر، واللي كتب له مقدمة الكتاب.<\/div><div class=\"li\">خد الماجستير سنة 1576.<\/div>", "n": 3, "a": "history-16-004", "x": "0099b254", "en": "He entered Pembroke College, Cambridge, in 1569 as a sizar, a student who paid lower fees in return for service work in the college. There he met Gabriel Harvey, a leading scholar and his lifelong friend, the man to whom the book's introduction is addressed. He took his master's degree in 1576.", "i": 5}, {"t": "learn", "h": "<div class=\"u\">الشغل:<\/div><div class=\"li\">سنة 1578 اشتغل لفترة قصيرة سكرتير عند <span class=\"en\">John Young<\/span>، أسقف <span class=\"en\">Rochester<\/span>.<\/div><div class=\"li\">وفي 1579 نشر <span class=\"en\">The Shepheardes Calender<\/span>، وفي نفس الفترة تقريباً اتجوز <span class=\"en\">Machabyas Childe<\/span>.<\/div>", "n": 3, "a": "history-16-005", "x": "abe7edc1", "en": "Work. In 1578 he worked for a short time as secretary to John Young, Bishop of Rochester. In 1579 he published The Shepheardes Calender, and around the same time he married Machabyas Childe.", "i": 6}, {"t": "learn", "h": "<div class=\"u\">أيرلندا، وهي اللي غيّرت كل حاجة:<\/div><div class=\"li\">في 1580 سافر أيرلندا سكرتير لـ <span class=\"en\">Arthur Grey<\/span>، اللورد النايب الجديد.<\/div><div class=\"li\">والأرجح إنه كان موجود في حصار <span class=\"en\">Smerwick<\/span>، اللي انتهى بقتل الأسرى. يعني <span class=\"en\">Spenser<\/span> مش شاعر عايش في برج عاجي: هو شاف حرب قاسية.<\/div>", "n": 3, "a": "history-16-006", "x": "a655d199", "en": "Ireland, which changed everything. In 1580 he went to Ireland as secretary to Arthur Grey, the new Lord Deputy. He was most likely present at the siege of Smerwick, which ended with the killing of prisoners. So Spenser was not a poet living in an ivory tower: he saw a harsh war.", "i": 7}, {"t": "learn", "h": "<div class=\"li\">بعد ما <span class=\"en\">Grey<\/span> رجع إنجلترا، <span class=\"en\">Spenser<\/span> فضل في أيرلندا واخد منصب وأرض في مشروع استيطان <span class=\"en\">Munster<\/span>، على أراضي اتسحبت من الأيرلنديين بعد ثورة <span class=\"en\">Desmond<\/span>.<\/div><div class=\"li\">وفي أواخر الثمانينات استقر في <span class=\"en\">Kilcolman<\/span>، قريب من <span class=\"en\">Doneraile<\/span> في <span class=\"en\">Cork<\/span>.<\/div><div class=\"li\">يعني عاش جزء كبير من حياته كموظف استعماري، وبيكتب شعر في نفس الوقت. وده تناقض حقيقي، هنشوفه مع <span class=\"en\">The Faerie Queene<\/span>.<\/div>", "n": 3, "a": "history-16-007", "x": "44036b6e", "en": "After Grey went back to England, Spenser stayed in Ireland and received a post and land in the Munster plantation, on land taken from the Irish after the Desmond rebellion. In the late 1580s he settled at Kilcolman, near Doneraile in County Cork. So he lived much of his life as a colonial official while writing poetry. This is a real contradiction, and we will see it with The Faerie Queene.", "i": 8}, {"t": "learn", "h": "<div class=\"u\">الشهرة:<\/div><div class=\"li\">سنة 1590 نشر أول تلات كتب من <span class=\"en\">The Faerie Queene<\/span>، وسافر لندن، وواضح إن <span class=\"en\">Raleigh<\/span> ساعده.<\/div><div class=\"li\">الملكة إدّته معاش 50 جنيه في السنة، ومبلغ محترم وقتها.<\/div><div class=\"li\">بس هو كان عايز منصب في البلاط ومخدش. ونشر بعدها <span class=\"en\">Mother Hubberd's Tale<\/span>، قصيدة ساخرة، والدارسين شايفين فيها تلميح لـ <span class=\"en\">Lord Burghley<\/span>، الوزير الأول.<\/div>", "n": 4, "a": "history-16-008", "x": "ceef29c2", "en": "Fame. In 1590 he published the first three books of The Faerie Queene and went to London, and Raleigh clearly helped him. The queen gave him a pension of 50 pounds a year, a respectable sum then. But he wanted a post at court and did not get one. After that he published Mother Hubberd's Tale, a satirical poem, which scholars read as hinting at Lord Burghley, the chief minister.", "i": 9}, {"t": "learn", "h": "<div class=\"u\">النهاية:<\/div><div class=\"li\">سنة 1594 اتجوز <span class=\"en\">Elizabeth Boyle<\/span>، وكتب لها سلسلة <span class=\"en\">Amoretti<\/span> وقصيدة <span class=\"en\">Epithalamion<\/span>، واتنشروا 1595.<\/div><div class=\"li\">في 1596 نشر تاني تلات كتب من <span class=\"en\">Faerie Queene<\/span>. وكتب كتاب نثر عن أيرلندا، <span class=\"en\">A View of the Present State of Ireland<\/span>، بيدعو فيه لإجراءات قاسية ضد الأيرلنديين وعاداتهم. والكتاب ما اتنشرش في حياته، واتنشر سنة 1633.<\/div>", "n": 3, "a": "history-16-009", "x": "e87b6b56", "en": "The end. In 1594 he married Elizabeth Boyle, and wrote for her the sequence Amoretti and the poem Epithalamion, published in 1595. In 1596 he published the second three books of The Faerie Queene. He also wrote a prose book about Ireland, A View of the Present State of Ireland, which calls for harsh measures against the Irish and their customs. The book was not published in his lifetime, but in 1633.", "i": 10}, {"t": "learn", "h": "<div class=\"li\">في 1598، في ثورة <span class=\"en\">Tyrone<\/span> (حرب التسع سنين)، قلعته في <span class=\"en\">Kilcolman<\/span> اتحرقت، و<span class=\"en\">Spenser<\/span> هرب لإنجلترا. وفيه رواية من <span class=\"en\">Ben Jonson<\/span> إن طفل صغير من عياله مات في الحريق، بس الرواية دي مش مؤكدة.<\/div><div class=\"li\">ومات في لندن في 13 يناير 1599، وعنده حوالي 46 سنة. و<span class=\"en\">Ben Jonson<\/span> قال إنه مات \"من قلة الخبز\"، بس دي رواية مشكوك فيها.<\/div>", "n": 2, "a": "history-16-010", "x": "93e05f08", "en": "In 1598, in Tyrone's rebellion (the Nine Years' War), his castle at Kilcolman was burned, and Spenser fled to England. There is a report from Ben Jonson that a small child of his died in the fire, but this report is not certain. He died in London on 13 January 1599, aged about 46. Ben Jonson said he died for lack of bread, but this account is doubtful.", "i": 11}, {"t": "learn", "h": "<div class=\"li\">واتدفن في <span class=\"en\">Westminster Abbey<\/span> جنب <span class=\"en\">Chaucer<\/span>، والمكان ده بقى <span class=\"en\">Poets' Corner<\/span>.<\/div><div class=\"li\">وفيه حكاية مشهورة إن الشعرا رموا أقلامهم في قبره. حكاية جميلة، بس مش موثقة.<\/div><div class=\"u\">مثال من حياتنا: طالب من مدرسة عادية بيدفع مصاريفه بالشغل في الكلية، وبعد سنين يبقى كاتب كبير في بلده، وفي الآخر يتدفن جنب أعظم كاتب فيها. ده مسار <span class=\"en\">Spenser<\/span>.<\/div>", "n": 3, "a": "history-16-011", "x": "7077f140", "en": "He was buried in Westminster Abbey next to Chaucer, and this place became Poets' Corner. There is a famous story that the poets threw their pens into his grave. A beautiful story, but not documented. An example from our life: a student from an ordinary school pays his fees with work in the college, and years later becomes a major writer in his country, and in the end is buried next to its greatest writer. That is Spenser's path.", "i": 12}, {"t": "mc", "h": "", "q": "إيه نوع الطالب اللي كان <span class=\"en\">Spenser<\/span> في <span class=\"en\">Cambridge<\/span>؟", "nq": 1, "opts": ["<span class=\"en\">sizar<\/span>: بيدفع مصاريف أقل مقابل شغل خدمة", "ابن نبيل بيدفع كامل", "مدرّس"], "ans": 0, "why": "<span class=\"en\">sizar<\/span>: بيدفع مصاريف أقل مقابل شغل خدمة", "ex": ["صح.", "غلط: أبوه كان تاجر قماش على الأغلب.", "غلط."], "i": 13}, {"t": "tf", "h": "", "q": "كتاب <span class=\"en\">A View of the Present State of Ireland<\/span> اتنشر في حياة <span class=\"en\">Spenser<\/span>.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: اتنشر سنة 1633 بعد موته.", "صح: ما اتنشرش في حياته، وطلع سنة 1633."], "i": 14}, {"t": "mc", "h": "", "q": "فين اتدفن <span class=\"en\">Spenser<\/span>؟", "nq": 1, "opts": ["<span class=\"en\">Westminster Abbey<\/span> جنب <span class=\"en\">Chaucer<\/span>", "في أيرلندا", "في <span class=\"en\">Cambridge<\/span>"], "ans": 0, "why": "<span class=\"en\">Westminster Abbey<\/span> جنب <span class=\"en\">Chaucer<\/span>", "ex": ["صح: وبقى المكان ده <span class=\"en\">Poets' Corner<\/span>.", "غلط: مات في لندن.", "غلط."], "i": 15}, {"t": "section", "h": "النقطة 2: إيه هو الـ <span class=\"en\">pastoral<\/span>، وليه الرعاة؟", "i": 16}, {"t": "learn", "h": "<div class=\"u\">التعريف:<\/div><div class=\"li\">الـ <span class=\"en\">pastoral<\/span> (القصيدة الرعوية) نوع شعري بيحكي عن رعاة غنم في الطبيعة، بيعزفوا وبيغنّوا وبيحبوا.<\/div><div class=\"li\">ووحدتها الأساسية اسمها <span class=\"en\">eclogue<\/span>، يعني قصيدة قصيرة، غالباً حوار بين راعيين في العراء.<\/div>", "n": 3, "a": "history-16-012", "x": "1130a5f6", "en": "The definition. The pastoral is a kind of poetry about shepherds in nature, who play, sing and love. Its basic unit is called an eclogue, a short poem, often a dialogue between two shepherds in the open air.", "i": 17}, {"t": "learn", "h": "<div class=\"u\">من فين جت؟<\/div><div class=\"li\">من الشاعر اليوناني <span class=\"en\">Theocritus<\/span>، في القرن التالت قبل الميلاد.<\/div><div class=\"li\">ومن <span class=\"en\">Virgil<\/span>، اللي كتب <span class=\"en\">Eclogues<\/span> في القرن الأول قبل الميلاد، وبقت هي النموذج.<\/div><div class=\"li\">وفي عصر النهضة، فيه شاعر لاتيني اسمه <span class=\"en\">Mantuan<\/span> كتب قصايد رعوية، و<span class=\"en\">Spenser<\/span> اتأثر بيه كمان.<\/div>", "n": 4, "a": "history-16-013", "x": "a60536f7", "en": "Where did it come from? From the Greek poet Theocritus, in the 3rd century BC. And from Virgil, who wrote the Eclogues in the 1st century BC, and they became the model. In the Renaissance, a Latin poet called Mantuan wrote pastoral poems, and Spenser was influenced by him too.", "i": 18}, {"t": "learn", "h": "<div class=\"u\">ليه الرعاة بالذات؟<\/div><div class=\"li\">أولاً: الراعي بسيط، فالكلام على لسانه بيبقى حر. متقدرش تقول \"الأسقف فاسد\"، بس تقدر تقول \"الراعي ده سايب غنمه ونايم\".<\/div><div class=\"li\">تانياً: الراعي قريب من الطبيعة، فالطبيعة بتبقى مرايا للحالة النفسية. الشتا حزن، والربيع أمل.<\/div>", "n": 3, "a": "history-16-014", "x": "92ec518a", "en": "Why shepherds? First, a shepherd is simple, so speech in his mouth is free. You cannot say the bishop is corrupt, but you can say this shepherd left his flock and is asleep. Second, a shepherd is close to nature, so nature becomes a mirror for the mind. Winter is sadness, spring is hope.", "i": 19}, {"t": "learn", "h": "<div class=\"li\">تالتاً: الراعي بيعزف مزمار، والشاعر بيكتب شعر. فالمزمار هو القصيدة، والمزمار المكسور هو الشاعر اللي فقد موهبته أو حظه.<\/div><div class=\"li\">رابعاً: <span class=\"en\">Virgil<\/span> كتب <span class=\"en\">Eclogues<\/span> الأول، وبعدها <span class=\"en\">Georgics<\/span>، وبعدها <span class=\"en\">Aeneid<\/span>. فالرعاة كانوا أول درجة في سلم الشاعر الكبير. و<span class=\"en\">Spenser<\/span> مشي على نفس السلم.<\/div>", "n": 2, "a": "history-16-015", "x": "699a66b9", "en": "Third, a shepherd plays a pipe, and a poet writes poetry. So the pipe is the poem, and the broken pipe is the poet who lost his gift or his luck. Fourth, Virgil wrote the Eclogues first, then the Georgics, then the Aeneid. So shepherds were the first step on the ladder of a great poet. And Spenser walked the same ladder.", "i": 20}, {"t": "learn", "h": "<div class=\"u\">مثال من حياتنا: في مصر، لما حد عايز يتكلم عن مسؤول كبير من غير ما يسميه، بيقول \"الحاج\" أو \"المعلم\" أو \"الباشا\"، والناس تفهم.<\/div><div class=\"u\">ده بالظبط اللي بيعمله الشاعر الرعوي: بيحط قناع، ويقول اللي عايز يقوله، والناس الفاهمة تفهم.<\/div>", "n": 2, "a": "history-16-016", "x": "467bc028", "en": "An example from our life: in Egypt, when someone wants to talk about a big official without naming him, he says the Hajj or the Mallem or the Pasha, and people understand. This is exactly what the pastoral poet does: he puts on a mask, says what he wants to say, and people who understand, understand.", "i": 21}, {"t": "mc", "h": "", "q": "إيه الـ <span class=\"en\">eclogue<\/span>؟", "nq": 1, "opts": ["قصيدة رعوية قصيرة، غالباً حوار بين راعيين", "قصيدة ملحمية طويلة", "مسرحية"], "ans": 0, "why": "قصيدة رعوية قصيرة، غالباً حوار بين راعيين", "ex": ["صح.", "غلط: دي ملحمة.", "غلط."], "i": 22}, {"t": "mc", "h": "", "q": "ليه الشاعر بيستخدم الرعاة؟", "nq": 1, "opts": ["عشان يقول كلام جريء بلغة بسيطة ومقنّعة", "عشان مفيش حد يقرا", "عشان يترجم من العربي"], "ans": 0, "why": "عشان يقول كلام جريء بلغة بسيطة ومقنّعة", "ex": ["صح.", "غلط.", "غلط."], "i": 23}, {"t": "section", "h": "النقطة 3: الكتاب نفسه، لأنه جزء من المعنى", "i": 24}, {"t": "learn", "h": "<div class=\"u\">الكتاب ده مش مجموعة قصايد مترامية. هو \"منتج\" متصمم بعناية. الحاجات اللي حوالين القصايد:<\/div><div class=\"li\">صفحة العنوان فيها إهداء لـ <span class=\"en\">Philip Sidney<\/span>. واسم <span class=\"en\">Spenser<\/span> نفسه مش مكتوب عليها!<\/div><div class=\"li\">بدل اسمه فيه قصيدة اسمها <span class=\"en\">To His Booke<\/span>، موقعة بـ \"<span class=\"en\">Immerito<\/span>\"، ومعناها \"اللي مش مستاهل\". الشاعر بيقول: أنا مش مستاهل، وأنا هثبت العكس.<\/div>", "n": 3, "a": "history-16-017", "x": "d95d687c", "en": "This book is not a loose set of poems. It is a carefully designed product. The things around the poems: the title page has a dedication to Philip Sidney, and the name of Spenser himself is not written on it! Instead there is a poem called To His Booke, signed Immerito, which means the unworthy one. The poet says: I am unworthy, and I will prove the opposite.", "i": 25}, {"t": "learn", "h": "<div class=\"li\">بعدها رسالة إهداء من شخص اسمه \"<span class=\"en\">E.K<\/span>.\" لـ <span class=\"en\">Gabriel Harvey<\/span>، بتشرح مشروع الكتاب، وبعدها \"الدليل العام\" (<span class=\"en\">General Argument<\/span>).<\/div><div class=\"li\">وبعدين 12 قصيدة، لكل شهر واحدة. وكل قصيدة قبلها صورة محفورة (<span class=\"en\">woodcut<\/span>)، وبعدها <span class=\"en\">argument<\/span> قصير، وشعار (<span class=\"en\">emblem<\/span>)، وشروح (<span class=\"en\">glosses<\/span>).<\/div>", "n": 2, "a": "history-16-018", "x": "5e09e847", "en": "Then comes a dedicatory letter from a person called E.K. to Gabriel Harvey, which explains the project of the book, and after it the General Argument. Then twelve poems, one for each month. Each poem has a woodcut picture before it, and after it a short argument, an emblem, and glosses.", "i": 26}, {"t": "learn", "h": "<div class=\"u\">مين <span class=\"en\">E.K<\/span>.؟<\/div><div class=\"li\">محدش عارف بالظبط. فيه رأي إنه <span class=\"en\">Spenser<\/span> نفسه، وفيه رأي إنه صاحبه <span class=\"en\">Edward Kirke<\/span>.<\/div><div class=\"li\">المهم إن <span class=\"en\">E.K<\/span>. شخصية أدبية: بيمدح الشاعر، وبيشرح وبيقارن، وأحياناً شروحه فيها أخطاء.<\/div><div class=\"li\">يعني <span class=\"en\">Spenser<\/span> كتب كتاب، وكتب معاه \"نقد\" للكتاب. كل ده عشان يفرض نفسه كشاعر كبير.<\/div>", "n": 4, "a": "history-16-019", "x": "6ba426f5", "en": "Who is E.K.? Nobody knows for sure. One view says he is Spenser himself, another says he is his friend Edward Kirke. What matters is that E.K. works as a literary character: he praises the poet, explains and compares, and sometimes his notes contain mistakes. So Spenser wrote a book, and wrote with it a commentary on the book. All this to make himself accepted as a major poet.", "i": 27}, {"t": "learn", "h": "<div class=\"u\">الشكل:<\/div><div class=\"li\">12 قصيدة، 12 شهر، سنة كاملة، وكل شهر بشكل شعري مختلف. وده إعلان: أنا أقدر أكتب كل الأشكال.<\/div><div class=\"li\">والسنة بتمشي من يناير (شتا وحزن) لحد ديسمبر (النهاية)، وفي نفس الوقت حياة الشاعر بتمشي من الشباب للشيخوخة.<\/div><div class=\"li\">والكتاب نجح، وطلعت له خمس طبعات بين 1579 و1597.<\/div>", "n": 4, "a": "history-16-020", "x": "422dc0fb", "en": "The form. Twelve poems, twelve months, a full year, and each month in a different poetic form. This is a declaration: I can write all forms. The year moves from January (winter and sadness) to December (the end), and at the same time the poet's life moves from youth to old age. And the book was a success, with five editions between 1579 and 1597.", "i": 28}, {"t": "learn", "h": "<div class=\"u\">مثال من حياتنا: ألبوم غنائي معاه كتيّب فيه كلام المخرج عن كل أغنية، وصور، وتعليقات. ده مش مجرد ألبوم، ده إصدار فاخر بيقول لك: خدني بجدية. الكتاب ده عمل نفس الحاجة سنة 1579.<\/div>", "n": 1, "a": "history-16-021", "x": "ace09e51", "en": "An example from our life: a music album with a booklet containing the director's words about each song, pictures and comments. This is not just an album, it is a luxury edition that tells you: take me seriously. This book did the same thing in 1579.", "i": 29}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\">Immerito<\/span>؟", "nq": 1, "opts": ["اللي مش مستاهل", "الشاعر الجديد", "الراعي"], "ans": 0, "why": "اللي مش مستاهل", "ex": ["صح: التوقيع تحت قصيدة <span class=\"en\">To His Booke<\/span>.", "غلط.", "غلط."], "i": 30}, {"t": "tf", "h": "", "q": "اسم <span class=\"en\">Spenser<\/span> مكتوب بالكامل على صفحة عنوان <span class=\"en\">The Shepheardes Calender<\/span>.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: اسمه ما كانش على صفحة العنوان.", "صح: اسمه مش عليها، والكتاب طلع باسم مستعار."], "i": 31}, {"t": "mc", "h": "", "q": "مين <span class=\"en\">E.K<\/span>.؟", "nq": 1, "opts": ["محدش عارف بالظبط: يمكن <span class=\"en\">Spenser<\/span> نفسه أو صاحبه <span class=\"en\">Edward Kirke<\/span>", "<span class=\"en\">Sidney<\/span>", "<span class=\"en\">Harvey<\/span>"], "ans": 0, "why": "محدش عارف بالظبط: يمكن <span class=\"en\">Spenser<\/span> نفسه أو صاحبه <span class=\"en\">Edward Kirke<\/span>", "ex": ["صح.", "غلط: <span class=\"en\">Sidney<\/span> اتهدى له الكتاب.", "غلط: <span class=\"en\">Harvey<\/span> اتكتب له الإهداء."], "i": 32}, {"t": "section", "h": "النقطة 4: <span class=\"en\">Colin Clout<\/span>، الشخصية اللي بتحكي", "i": 33}, {"t": "learn", "h": "<div class=\"u\">مين <span class=\"en\">Colin<\/span>؟<\/div><div class=\"li\">راعي وشاعر، وهو <span class=\"en\">Spenser<\/span> في القناع.<\/div><div class=\"li\">والاسم مش من اختراعه: جه من قصيدة ساخرة ضد رجال الدين اسمها <span class=\"en\">Colyn Cloute<\/span> لـ <span class=\"en\">John Skelton<\/span>، من أوائل القرن السادس عشر. يعني <span class=\"en\">Spenser<\/span> واخد اسم له تاريخ في النقد السياسي.<\/div>", "n": 3, "a": "history-16-022", "x": "15ce5f8d", "en": "Who is Colin? A shepherd and a poet, and he is Spenser behind a mask. The name is not his invention: it came from a satirical poem against the clergy called Colyn Cloute by John Skelton, from the early 16th century. So Spenser took a name with a history in political criticism.", "i": 34}, {"t": "learn", "h": "<div class=\"u\">أول قصيدة، يناير:<\/div><div class=\"u\">\"<span class=\"en\">A Shepheards boye<\/span> (<span class=\"en\">no better doe him call<\/span>)<\/div><div class=\"u\"><span class=\"en\">When Winters wasteful spight was almost spent<\/span>,<\/div><div class=\"u\"><span class=\"en\">All in a sunneshine day, as did befall<\/span>,<\/div><div class=\"u\"><span class=\"en\">Led forth his flock, that had been long ypent<\/span>.<\/div><div class=\"u\"><span class=\"en\">So faynt they woxe, and feeble in the folde<\/span>,<\/div><div class=\"u\"><span class=\"en\">That now vnnethes their feete could them vphold<\/span>.\"<\/div>", "n": 7, "a": "history-16-023", "x": "8b8d6fa4", "en": "First poem, January: A Shepheards boye (no better doe him call) When Winters wasteful spight was almost spent, All in a sunneshine day, as did befall, Led forth his flock, that had been long ypent. So faynt they woxe, and feeble in the folde, That now vnnethes their feete could them vphold.", "i": 35}, {"t": "learn", "h": "<div class=\"u\">يعني: راعي صغير (مفيش وصف أحسن من كده)، لما شدة الشتا كانت خلصت تقريباً، في يوم شمس، طلّع قطيعه اللي كان محبوس فترة طويلة. وكانوا ضعفوا لدرجة إن رجليهم بالعافية شايلاهم.<\/div><div class=\"li\">الراعي بيوصف نفسه بـ <span class=\"en\">boye<\/span>، يعني صغير، من غير ما يدّعي مقام.<\/div><div class=\"li\">والقطيع ضعيف، والدنيا لسه باردة. وده وصف للطبيعة ولحالته النفسية في نفس الوقت.<\/div>", "n": 3, "a": "history-16-024", "x": "a1e51f85", "en": "It means: a young shepherd (no better name for him), when the harshness of winter was almost over, on a sunny day, led out his flock that had been shut in for a long time. They had grown so weak that their feet could hardly hold them up. The shepherd calls himself a boy, small, without claiming a rank. The flock is weak and the world is still cold. This describes nature and his mood at the same time.", "i": 36}, {"t": "learn", "h": "<div class=\"li\">وبعد كده بيقول إنه بيحب واحدة اسمها <span class=\"en\">Rosalinde<\/span>، وإنها مش بترد، وإنه كسر مزماره.<\/div><div class=\"li\">يعني أول قصيدة في الكتاب هي قصة فشل: فشل في الحب، وفشل في الشعر.<\/div><div class=\"li\">وده بداية ذكية: <span class=\"en\">Spenser<\/span> بيبدأ من تحت خالص، وبعد 12 شهر القارئ هو اللي هيكتشف قيمته. نفس منطق <span class=\"en\">Immerito<\/span>.<\/div>", "n": 3, "a": "history-16-025", "x": "8f7781c4", "en": "After that he says he loves a woman called Rosalinde, that she does not answer, and that he broke his pipe. So the first poem in the book is a story of failure: failure in love and failure in poetry. This is a clever start: Spenser begins at the very bottom, and after twelve months the reader is the one who discovers his value. The same logic as Immerito.", "i": 37}, {"t": "mc", "h": "", "q": "إيه اللي بيحصل في قصيدة يناير؟", "nq": 1, "opts": ["راعي حزين بيحب <span class=\"en\">Rosalinde<\/span> ومش بترد، وبيكسر مزماره", "ملكة بتدخل المدينة", "معركة"], "ans": 0, "why": "راعي حزين بيحب <span class=\"en\">Rosalinde<\/span> ومش بترد، وبيكسر مزماره", "ex": ["صح.", "غلط.", "غلط."], "i": 38}, {"t": "mc", "h": "", "q": "الاسم <span class=\"en\">Colin Clout<\/span> جه منين؟", "nq": 1, "opts": ["من قصيدة ساخرة لـ <span class=\"en\">Skelton<\/span> اسمها <span class=\"en\">Colyn Cloute<\/span>", "من <span class=\"en\">Virgil<\/span>", "من <span class=\"en\">Chaucer<\/span>"], "ans": 0, "why": "من قصيدة ساخرة لـ <span class=\"en\">Skelton<\/span> اسمها <span class=\"en\">Colyn Cloute<\/span>", "ex": ["صح.", "غلط.", "غلط."], "i": 39}, {"t": "section", "h": "النقطة 5: أبريل، أغنية <span class=\"en\">Elisa<\/span>، والملكة اللي بقت راعية", "i": 40}, {"t": "learn", "h": "<div class=\"u\">في قصيدة أبريل، راعيين اسمهم <span class=\"en\">Hobbinoll<\/span> و<span class=\"en\">Thenot<\/span> بيتكلموا، و<span class=\"en\">Hobbinoll<\/span> بيغني أغنية <span class=\"en\">Colin<\/span> عن <span class=\"en\">Elisa<\/span>، \"ملكة الرعاة\". والأغنية دي من أشهر حاجات الكتاب:<\/div><div class=\"u\">\"<span class=\"en\">See, where she sits vpon the grassie greene<\/span>,<\/div><div class=\"u\">(<span class=\"en\">O seemly sight<\/span>)<\/div><div class=\"u\"><span class=\"en\">Yclad in Scarlot like a mayden Queene<\/span>,<\/div><div class=\"u\"><span class=\"en\">And Ermines white<\/span>.\"<\/div>", "n": 5, "a": "history-16-026", "x": "56a98bb8", "en": "In the April poem, two shepherds named Hobbinoll and Thenot talk, and Hobbinoll sings Colin's song about Elisa, the queen of shepherds. This song is one of the most famous things in the book: See, where she sits vpon the grassie greene, (O seemly sight) Yclad in Scarlot like a mayden Queene, And Ermines white.", "i": 41}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Vpon her head a Cremosin coronet<\/span>,<\/div><div class=\"u\"><span class=\"en\">With Damaske roses and Dafadillies set<\/span>:<\/div><div class=\"u\"><span class=\"en\">Bayleaues betweene<\/span>,<\/div><div class=\"u\"><span class=\"en\">And Primroses greene<\/span><\/div><div class=\"u\"><span class=\"en\">Embellish the sweete Violet<\/span>.\"<\/div><div class=\"u\">يعني: بص، هي قاعدة على العشب الأخضر، لابسة قرمزي زي ملكة عذراء، وفراء أبيض. وعلى راسها تاج قرمزي مركّب فيه ورود دمشقية ونرجس، وأوراق غار بينهم، وزهور برايمروز خضرا بتزيّن البنفسجة الحلوة.<\/div>", "n": 6, "a": "history-16-027", "x": "11ee4a3c", "en": "Vpon her head a Cremosin coronet, With Damaske roses and Dafadillies set: Bayleaues betweene, And Primroses greene Embellish the sweete Violet. It means: look, she sits on the green grass, dressed in crimson like a virgin queen, and white fur. On her head is a crimson crown set with damask roses and daffodils, bay leaves between them, and green primroses decorating the sweet violet.", "i": 42}, {"t": "learn", "h": "<div class=\"u\">مين <span class=\"en\">Elisa<\/span>؟<\/div><div class=\"li\">هي <span class=\"en\">Queen Elizabeth<\/span>. القارئ فاهم إن القصيدة بتتكلم عن ملكة إنجلترا، وهي ظاهرياً راعية قاعدة على العشب. وده جوهر الـ <span class=\"en\">pastoral<\/span>: السطح بسيط، والمعنى سياسي.<\/div><div class=\"li\">\"<span class=\"en\">Scarlot<\/span>\" و\"<span class=\"en\">Ermines<\/span>\" ألوان الملوك. والراعية لابسة تاج. يعني الصورة نفسها بتقول: دي مش راعية عادية.<\/div>", "n": 3, "a": "history-16-028", "x": "d7f2765c", "en": "Who is Elisa? She is Queen Elizabeth. The reader understands that the poem speaks about the queen of England, while on the surface she is a shepherdess sitting on the grass. This is the core of the pastoral: the surface is simple, and the meaning is political. Scarlet and ermine are the colours of kings, and the shepherdess wears a crown. So the picture itself says: this is no ordinary shepherdess.", "i": 43}, {"t": "learn", "h": "<div class=\"li\">وفي نفس الأغنية بيقول إنها بنت <span class=\"en\">Pan<\/span> و<span class=\"en\">Syrinx<\/span>، يعني من آلهة الطبيعة والرعاة. يعني <span class=\"en\">Spenser<\/span> بيحط الملكة جوه أسطورة يونانية، في صورة مدح عالي جداً.<\/div><div class=\"li\">وكتير من الدارسين بيقروا الورد الأحمر والأبيض كإشارة لعيلة <span class=\"en\">Tudor<\/span>، اللي جت من اتحاد بيت <span class=\"en\">Lancaster<\/span> وبيت <span class=\"en\">York<\/span>. وهي قراءة شائعة، مش حاجة الشاعر قالها صراحة.<\/div>", "n": 2, "a": "history-16-029", "x": "c2d96889", "en": "In the same song he says she is the daughter of Pan and Syrinx, so from the gods of nature and shepherds. So Spenser puts the queen inside a Greek myth, in a very high form of praise. And many scholars read the red and white roses as a reference to the Tudor family, which came from the union of the houses of Lancaster and York. This is a common reading, not something the poet says openly.", "i": 44}, {"t": "learn", "h": "<div class=\"u\">مثال من حياتنا: أغنية مدح لرئيس، بس بتتكلم عن \"ست قاعدة في جنينة\" ومحدش بيسميه. اللي يفهم، يفهم. واللي مش فاهم، يفتكرها أغنية عن جنينة. ده أمان للشاعر، وجمال للقصيدة.<\/div>", "n": 1, "a": "history-16-030", "x": "b45ecfe0", "en": "An example from our life: a song praising a president, but it speaks about a woman sitting in a garden and nobody names him. Whoever understands, understands. And whoever does not, thinks it is a song about a garden. This is safety for the poet, and beauty for the poem.", "i": 45}, {"t": "mc", "h": "", "q": "مين <span class=\"en\">Elisa<\/span> في أبريل؟", "nq": 1, "opts": ["الملكة <span class=\"en\">Elizabeth<\/span>", "<span class=\"en\">Rosalinde<\/span>", "أم <span class=\"en\">Spenser<\/span>"], "ans": 0, "why": "الملكة <span class=\"en\">Elizabeth<\/span>", "ex": ["صح.", "غلط: <span class=\"en\">Rosalinde<\/span> حبيبة <span class=\"en\">Colin<\/span> في يناير.", "غلط."], "i": 46}, {"t": "tf", "h": "", "q": "أغنية <span class=\"en\">Elisa<\/span> مدح للملكة في شكل راعية، والسطح بسيط والمعنى سياسي.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: وده جوهر الـ <span class=\"en\">pastoral<\/span>.", "غلط: ده فعلاً اللي بيحصل."], "i": 47}, {"t": "section", "h": "النقطة 6: مايو، التعلب والجدي، والسياسة الخطيرة", "i": 48}, {"t": "learn", "h": "<div class=\"u\">في مايو، راعيين: <span class=\"en\">Piers<\/span> و<span class=\"en\">Palinode<\/span>. و<span class=\"en\">E.K<\/span>. بيقول في المقدمة إنهم بيمثلوا شكلين من القساوسة: البروتستانتي والكاثوليكي.<\/div><div class=\"li\"><span class=\"en\">Palinode<\/span> بيقول: الدنيا مايو والناس بتحتفل، وليه إحنا حزينين؟ و<span class=\"en\">Piers<\/span> بيرد: إحنا رجال دين، ولازم نعيش غير الناس العادية.<\/div>", "n": 2, "a": "history-16-031", "x": "a937b653", "en": "In May, two shepherds: Piers and Palinode. E.K. says in the introduction that they stand for two kinds of clergymen: the Protestant and the Catholic. Palinode says: it is May and people are celebrating, so why are we sad? And Piers answers: we are men of the church, and we must live differently from ordinary people.", "i": 49}, {"t": "learn", "h": "<div class=\"li\">وفيه اسم <span class=\"en\">Algrind<\/span>. أغلب الدارسين بيقروه إشارة لـ <span class=\"en\">Edmund Grindal<\/span>، رئيس أساقفة <span class=\"en\">Canterbury<\/span>، اللي الملكة أوقفته سنة 1577 لأنه رفض ينفذ أوامرها في قمع الوعظ.<\/div><div class=\"li\">يعني <span class=\"en\">Spenser<\/span> ذكر اسماً مستعاراً لأسقف مغضوب عليه، في كتاب مطبوع. ده مش هزار.<\/div>", "n": 2, "a": "history-16-032", "x": "64b638b5", "en": "There is also the name Algrind. Most scholars read it as a reference to Edmund Grindal, Archbishop of Canterbury, whom the queen suspended in 1577 because he refused to carry out her orders to suppress preaching. So Spenser mentioned a disguised name for a bishop in disgrace, in a printed book. This is no joke.", "i": 50}, {"t": "learn", "h": "<div class=\"u\">حكاية التعلب والجدي:<\/div><div class=\"li\"><span class=\"en\">Piers<\/span> بيحكي: أم الجدي سابت ابنها في البيت وقالت له: اقفل الباب ومتفتحش لحد.<\/div><div class=\"li\">والتعلب جه، بس مش بشكل تعلب:<\/div><div class=\"u\">\"<span class=\"en\">Not as a Foxe, for then he had be kend<\/span>, / <span class=\"en\">But all as a poore pedler he did wend<\/span>, / <span class=\"en\">Bearing a trusse of tryfles at hys backe<\/span>, / <span class=\"en\">As bells, and babes, and glasses in hys packe<\/span>.\"<\/div>", "n": 4, "a": "history-16-033", "x": "1257ac85", "en": "The story of the fox and the kid. Piers tells: the kid's mother left her son at home and told him: lock the door and open it to nobody. And the fox came, but not in the shape of a fox: Not as a Foxe, for then he had be kend, But all as a poore pedler he did wend, Bearing a trusse of tryfles at hys backe, As bells, and babes, and glasses in hys packe.", "i": 51}, {"t": "learn", "h": "<div class=\"u\">يعني: مش بشكل تعلب لأنه ساعتها كان هيتعرف، لكن زي بياع متجول فقير، شايل على ضهره حزمة حاجات تافهة: أجراس وعرايس ومرايات.<\/div><div class=\"li\">والجدي فتح الباب عشان الحاجات الحلوة، والتعلب دخل وأكله.<\/div><div class=\"li\">والمعنى كما بيقروه: الخطر بييجي في شكل جميل ومغري، مش شكل مخيف. وكتير بيقروا التعلب كإشارة للكنيسة الكاثوليكية.<\/div>", "n": 3, "a": "history-16-034", "x": "f849843c", "en": "It means: not in the shape of a fox, because then he would have been recognised, but like a poor travelling seller, carrying on his back a bundle of trifles: bells, dolls and mirrors. The kid opened the door for the pretty things, and the fox came in and ate him. The meaning as it is read: danger comes in a beautiful and tempting shape, not a frightening one. And many read the fox as a sign of the Catholic Church.", "i": 52}, {"t": "learn", "h": "<div class=\"u\">ليه ده خطير في 1579؟<\/div><div class=\"li\">لأن نفس الناشر، <span class=\"en\">Hugh Singleton<\/span>، كان نشر قبلها بكام شهر كتاب <span class=\"en\">The Discovery of a Gaping Gulf<\/span> لـ <span class=\"en\">John Stubbs<\/span>، اللي هاجم فيه جواز الملكة من <span class=\"en\">Duc d'Alen<\/span>ç<span class=\"en\">on<\/span>.<\/div><div class=\"li\">والعقوبة كانت قاسية: <span class=\"en\">Stubbs<\/span> اتقطعت إيده اليمين في السوق.<\/div><div class=\"li\">يعني <span class=\"en\">Spenser<\/span> كتب في موضوع ديني سياسي حساس، بلغة مشفرة. عارف إنه بيلعب بالنار.<\/div>", "n": 4, "a": "history-16-035", "x": "1c2d9d17", "en": "Why was this dangerous in 1579? Because the same publisher, Hugh Singleton, had a few months earlier published The Discovery of a Gaping Gulf by John Stubbs, which attacked the queen's marriage to the Duc d'Alençon. And the punishment was harsh: Stubbs had his right hand cut off in the market. So Spenser wrote on a sensitive religious and political subject, in coded language. He knew he was playing with fire.", "i": 53}, {"t": "mc", "h": "", "q": "مين <span class=\"en\">Piers<\/span> و<span class=\"en\">Palinode<\/span> في مايو بحسب <span class=\"en\">E.K<\/span>.؟", "nq": 1, "opts": ["شكلين من القساوسة: بروتستانتي وكاثوليكي", "أخوين", "ملكين"], "ans": 0, "why": "شكلين من القساوسة: بروتستانتي وكاثوليكي", "ex": ["صح.", "غلط.", "غلط."], "i": 54}, {"t": "mc", "h": "", "q": "إيه معنى حكاية التعلب اللي جه في شكل بياع؟", "nq": 1, "opts": ["الخطر بييجي في شكل جميل ومغري", "التعلب صاحب الجدي", "البياع غني"], "ans": 0, "why": "الخطر بييجي في شكل جميل ومغري", "ex": ["صح.", "غلط.", "غلط."], "i": 55}, {"t": "tf", "h": "", "q": "<span class=\"en\">Stubbs<\/span> اتعاقب بقطع إيده لأنه هاجم جواز الملكة، وده كان قبل نشر <span class=\"en\">Calender<\/span> بكام شهر.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: ولهذا <span class=\"en\">Spenser<\/span> استخدم لغة مقنّعة.", "غلط: ده اللي حصل."], "i": 56}, {"t": "section", "h": "النقطة 7: أكتوبر، والشعر بيدافع عن نفسه", "i": 57}, {"t": "learn", "h": "<div class=\"u\">في أكتوبر، <span class=\"en\">Cuddie<\/span> (الشاعر) بيشتكي لـ <span class=\"en\">Piers<\/span>: أنا بغني وبعزف من زمان، ومفيش فايدة ولا فلوس. الشعر تعب والناس بتاخد المتعة وأنا مش باخد حاجة.<\/div><div class=\"u\">و<span class=\"en\">Piers<\/span> بيرد: المجد أحسن من الفلوس. وبعدين بيقوله:<\/div><div class=\"u\">\"<span class=\"en\">Abandon then the base and viler clowne<\/span>, / <span class=\"en\">Lyft vp thy selfe out of the lowly dust<\/span>: / <span class=\"en\">And sing of bloody Mars, of wars, of giusts<\/span>\"<\/div>", "n": 3, "a": "history-16-036", "x": "6400861c", "en": "In October, Cuddie, the poet, complains to Piers: I have been singing and playing for a long time, and there is no use and no money. Poetry is tired, people take the pleasure and I take nothing. And Piers answers: glory is better than money. Then he tells him: Abandon then the base and viler clowne, Lyft vp thy selfe out of the lowly dust: And sing of bloody Mars, of wars, of giusts.", "i": 58}, {"t": "learn", "h": "<div class=\"u\">يعني: سيب الراجل الوضيع الحقير، وارفع نفسك من التراب الواطي، وغنّي عن المريخ الدامي، وعن الحروب والمبارزات.<\/div><div class=\"li\"><span class=\"en\">Piers<\/span> بيقول للشاعر: سيب القصايد الصغيرة واكتب حاجة كبيرة، اكتب ملحمة.<\/div><div class=\"li\">وكتير بيشوفوا في ده تمهيد لـ <span class=\"en\">The Faerie Queene<\/span>، الملحمة اللي <span class=\"en\">Spenser<\/span> هيكتبها بعد كده.<\/div>", "n": 3, "a": "history-16-037", "x": "acdc2b74", "en": "It means: leave the low, base man, lift yourself out of the lowly dust, and sing of bloody Mars, of wars and of jousts. Piers tells the poet: leave the small poems and write something big, write an epic. And many see in this a preparation for The Faerie Queene, the epic that Spenser would write afterwards.", "i": 59}, {"t": "learn", "h": "<div class=\"u\">وفي مقدمة أكتوبر (<span class=\"en\">argument<\/span>)، بيتقال إن الشعر \"مش فن، لكن هبة إلهية وإلهام سماوي\": \"<span class=\"en\">no arte, but a diuine gift and heauenly instinct<\/span>\".<\/div><div class=\"li\">يعني بيدافع عن الشعر بإنه حاجة مقدسة، مش تسلية. وده قريب من اللي <span class=\"en\">Sidney<\/span> قاله في <span class=\"en\">Defence of Poesy<\/span>.<\/div><div class=\"li\">والاتنين كتبوا في نفس السنين تقريباً. ودي كانت فترة اهتمام كبير بالدفاع عن الشعر في إنجلترا.<\/div>", "n": 3, "a": "history-16-038", "x": "658fa121", "en": "In the introduction to October, the argument, poetry is called not art, but a divine gift and heavenly instinct. So it defends poetry as something sacred, not entertainment. This is close to what Sidney said in the Defence of Poesy. Both wrote in nearly the same years. It was a time of strong interest in defending poetry in England.", "i": 60}, {"t": "mc", "h": "", "q": "إيه اللي بيشتكي منه <span class=\"en\">Cuddie<\/span> في أكتوبر؟", "nq": 1, "opts": ["إن الشعر مفيهوش فلوس ولا تقدير", "إن الأغنام ضاعت", "إن الملكة ماتت"], "ans": 0, "why": "إن الشعر مفيهوش فلوس ولا تقدير", "ex": ["صح.", "غلط.", "غلط."], "i": 61}, {"t": "mc", "h": "", "q": "إيه نصيحة <span class=\"en\">Piers<\/span> للشاعر؟", "nq": 1, "opts": ["يرفع نفسه ويكتب شعر كبير عن الحروب والبطولة", "يبطل شعر", "يكتب عن الطبيعة بس"], "ans": 0, "why": "يرفع نفسه ويكتب شعر كبير عن الحروب والبطولة", "ex": ["صح: وكتير بيشوفوها تمهيد لـ <span class=\"en\">Faerie Queene<\/span>.", "غلط.", "غلط."], "i": 62}, {"t": "section", "h": "النقطة 8: ليه الكتاب ده مهم في تاريخ الشعر الإنجليزي؟", "i": 63}, {"t": "learn", "h": "<div class=\"u\">أولاً: \"الشاعر الجديد\". الكتاب بيقدّم <span class=\"en\">Spenser<\/span> كوريث لـ <span class=\"en\">Chaucer<\/span>، ومقارن بـ <span class=\"en\">Virgil<\/span>. ده إعلان منصب، مش تواضع.<\/div><div class=\"u\">ثانياً: اللغة القديمة. <span class=\"en\">Spenser<\/span> كتب بكلمات قديمة قصداً، زي <span class=\"en\">yclad<\/span> بدل <span class=\"en\">clothed<\/span>، من <span class=\"en\">Chaucer<\/span>، عشان يبان وريث تقليد إنجليزي قديم.<\/div>", "n": 2, "a": "history-16-039", "x": "bc8cb711", "en": "First: the new poet. The book presents Spenser as an heir of Chaucer, compared with Virgil. This is a claim to a position, not modesty. Second: old language. Spenser deliberately used old words, like yclad instead of clothed, from Chaucer, to look like the heir of an old English tradition.", "i": 64}, {"t": "learn", "h": "<div class=\"li\">ناس مدحته وناس اتضايقت. <span class=\"en\">Sidney<\/span> في <span class=\"en\">Defence of Poesy<\/span> قال إن الـ <span class=\"en\">Calender<\/span> فيه شعر \"يستاهل القراءة\"، بس ما وافقش على استخدام لغة ريفية قديمة، لأن <span class=\"en\">Theocritus<\/span> و<span class=\"en\">Virgil<\/span> و<span class=\"en\">Sannazaro<\/span> ما عملوش كده.<\/div><div class=\"u\">ثالثاً: الشكل. 12 شكل شعري في كتاب واحد، فالشعر الإنجليزي اتدرب على أشكال كتير في وقت قصير.<\/div>", "n": 2, "a": "history-16-040", "x": "23578c47", "en": "Some people praised him and some were bothered. Sidney, in the Defence of Poesy, said the Calender has poetry in it worth reading, but he did not approve of using an old rustic language, because Theocritus, Virgil and Sannazaro did not do so. Third: form. Twelve poetic forms in one book, so English poetry practised many forms in a short time.", "i": 65}, {"t": "learn", "h": "<div class=\"u\">رابعاً: النقد جزء من العمل. <span class=\"en\">E.K<\/span>. والـ <span class=\"en\">glosses<\/span> والـ <span class=\"en\">emblems<\/span> خلّوا الكتاب زي نظام تعليمي: القارئ بيقرا القصيدة وتفسيرها، وبيتعلم إزاي يقرا الشعر.<\/div><div class=\"u\">خامساً: الطريق لـ <span class=\"en\">Faerie Queene<\/span>. الرعاة والرمز والملكة واللغة القديمة والملحمة القادمة، كلها كانت بروفة. وده موضوع الدرس الجاي.<\/div>", "n": 2, "a": "history-16-041", "x": "b755a0c3", "en": "Fourth: criticism as part of the work. E.K., the glosses and the emblems made the book like a teaching system: the reader reads the poem and its explanation, and learns how to read poetry. Fifth: the road to the Faerie Queene. The shepherds, the symbols, the queen, the old language and the coming epic were all a rehearsal. And this is the subject of the next lesson.", "i": 66}, {"t": "learn", "h": "<div class=\"u\">مثال من حياتنا: مطرب جديد، أول ألبوم ليه مش أحلى ألبوم في السوق، لكنه أول ألبوم بيقول للجمهور: أنا المطرب الجديد اللي هتتكلموا عنه. ده اللي عمله <span class=\"en\">Spenser<\/span>، بمقدمة ونقد وشرح و12 شكل شعري.<\/div>", "n": 1, "a": "history-16-042", "x": "f0a87f9b", "en": "An example from our life: a new singer whose first album is not the best in the market, but it is the first album that tells the public: I am the new singer you will be talking about. That is what Spenser did, with an introduction, criticism, commentary and twelve poetic forms.", "i": 67}, {"t": "mc", "h": "", "q": "إيه رأي <span class=\"en\">Sidney<\/span> في لغة <span class=\"en\">Spenser<\/span> في الـ <span class=\"en\">Calender<\/span>؟", "nq": 1, "opts": ["فيه شعر يستاهل القراءة، بس ما وافقش على اللغة الريفية القديمة", "رفض الكتاب كله", "قلّده"], "ans": 0, "why": "فيه شعر يستاهل القراءة، بس ما وافقش على اللغة الريفية القديمة", "ex": ["صح.", "غلط: قال إنه يستاهل القراءة.", "غلط."], "i": 68}, {"t": "mc", "h": "", "q": "إيه وظيفة <span class=\"en\">E.K<\/span>. والـ <span class=\"en\">glosses<\/span> في الكتاب؟", "nq": 1, "opts": ["يشرحوا ويقدّموا الكتاب ويبنوا صورة الشاعر الجديد", "يترجموا للاتيني", "يبيعوا الكتاب"], "ans": 0, "why": "يشرحوا ويقدّموا الكتاب ويبنوا صورة الشاعر الجديد", "ex": ["صح.", "غلط.", "غلط."], "i": 69}, {"t": "section", "h": "الخلاصة", "i": 70}, {"t": "learn", "h": "<div class=\"u\">الخلاصة:<\/div><div class=\"li\"><span class=\"en\">Spenser<\/span> جه من خلفية متواضعة، اتعلم بمصاريف قليلة، وعاش على الشعر والوظايف، واتدفن جنب <span class=\"en\">Chaucer<\/span>.<\/div><div class=\"li\"><span class=\"en\">The Shepheardes Calender<\/span> (1579): 12 قصيدة رعوية، واحدة لكل شهر، بشروح <span class=\"en\">E.K<\/span>.، وإهداء لـ <span class=\"en\">Sidney<\/span>.<\/div><div class=\"li\">الـ <span class=\"en\">pastoral<\/span> نوع قديم من <span class=\"en\">Theocritus<\/span> و<span class=\"en\">Virgil<\/span>، بيخلي الشاعر يقول كلام خطير بلغة بسيطة.<\/div><div class=\"li\"><span class=\"en\">Colin Clout<\/span> هو قناع <span class=\"en\">Spenser<\/span>.<\/div>", "n": 5, "a": "history-16-043", "x": "79ab6290", "en": "In short: Spenser came from a modest background, studied with small fees, lived on poetry and jobs, and was buried next to Chaucer. The Shepheardes Calender (1579): twelve pastoral poems, one for each month, with E.K.'s notes and a dedication to Sidney. The pastoral is an old kind from Theocritus and Virgil that lets the poet say dangerous things in simple language. Colin Clout is Spenser's mask.", "i": 71}, {"t": "learn", "h": "<div class=\"li\">أبريل فيها أغنية <span class=\"en\">Elisa<\/span>: مدح للملكة في صورة راعية.<\/div><div class=\"li\">مايو فيها حكاية التعلب والجدي وإشارة لأسقف مغضوب عليه، وده كان فيه خطر حقيقي في 1579.<\/div><div class=\"li\">أكتوبر فيها دفاع عن الشعر وتمهيد لملحمة جاية.<\/div><div class=\"li\">والكتاب ده من أهم الإعلانات عن شاعر جديد في الشعر الإنجليزي.<\/div>", "n": 4, "a": "history-16-044", "x": "a979dc5a", "en": "April has the song of Elisa: praise of the queen in the form of a shepherdess. May has the fable of the fox and the kid and a reference to a bishop in disgrace, which carried real danger in 1579. October has a defence of poetry and a preparation for a coming epic. And this book is one of the most important announcements of a new poet in English poetry.", "i": 72}, {"t": "learn", "h": "<div class=\"u\">للمراجعة:<\/div><div class=\"li\">احكي حياة <span class=\"en\">Spenser<\/span> في خمس سطور.<\/div><div class=\"li\">إيه الـ <span class=\"en\">pastoral<\/span> وليه الرعاة؟<\/div><div class=\"li\">إيه اللي حوالين نص <span class=\"en\">Calender<\/span>؟ (صفحة العنوان، <span class=\"en\">Immerito<\/span>، <span class=\"en\">E.K<\/span>.، <span class=\"en\">woodcuts<\/span>، <span class=\"en\">glosses<\/span>)<\/div><div class=\"li\">مين التعلب والجدي، وليه الحكاية خطيرة؟<\/div>", "n": 5, "a": "history-16-045", "x": "5f08993b", "en": "For review. Tell the life of Spenser in five lines. What is the pastoral and why shepherds? What surrounds the text of the Calender? (title page, Immerito, E.K., woodcuts, glosses) Who are the fox and the kid, and why was the story dangerous?", "i": 73}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"en\">The Faerie Queene<\/span>، ملحمة إنجليزية، وفارس اسمه <span class=\"en\">Holiness<\/span>، وملكة اسمها <span class=\"en\">Gloriana<\/span>، وإنجلترا كلها في صورة حكاية.", "extra": "", "i": 74}];</script>
