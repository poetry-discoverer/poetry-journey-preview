<script>window.LESSON_ID="myth-m6";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 1) <span class=\"en\">Hades</span>: الإله والمكان بنفس الاسم</div><div class=\"li\">من درس <span class=\"en\">Chaos</span>: لما اتقسمت الدنيا، <span class=\"en\">Hades</span> أخد العالم السفلي. فكلمة \"<span class=\"en\">Hades</span>\" معناها الشخص والمكان معاً.</div><div class=\"li\">مثال من حياتنا: عشان تفهم الخريطة دي، تخيّل معبر حدودي قديم: فيه نهر لازم تعدّيه، ومعدّية عليها وكيل بيفتش، وكلب حراسة، وقضاة بيحكموا عليك، و3 وجهات نهائية.</div><div class=\"li\">كل تفصيلة في الأسطورة ليها دور في \"الإجراءات\".</div>", "n": 4, "i": 0, "a": "myth-m6-001", "x": "dd2e9877"}, {"t": "mc", "h": "", "q": "كلمة <span class=\"en\">Hades</span> معناها...", "nq": 1, "opts": ["الإله والمكان (العالم السفلي) بنفس الاسم", "الإله بس", "النهر بس"], "ans": 0, "why": "الإله والمكان (العالم السفلي) بنفس الاسم", "ex": ["صح: الاسم للشخص والمكان معاً.", "غلط: كمان هو اسم المكان.", "غلط: النهر له أسماء تانية."], "i": 1}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 2) الأنهار الخمسة (احفظ اسم كل واحد ومعناه)</div><div class=\"li\"><span class=\"en\">Styx</span> (ستيكس): نهر الكراهية. أهميته الكبرى: الآلهة نفسها بتحلف بيه، والقسم بيه مابيتكسرش.</div><div class=\"li\">(في <span class=\"en\">Theogony</span>: <span class=\"en\">Styx</span> — بنت <span class=\"en\">Oceanus</span> من الـ <span class=\"en\">Titans</span> — وقفت مع <span class=\"en\">Zeus</span> في حرب الـ <span class=\"en\">Titanomachy</span> من درس <span class=\"en\">Chaos</span>، فكافأها بشرف إن يكون اسمها قسم الآلهة. اللي يحنث من الآلهة بقسم <span class=\"en\">Styx</span> يقع غشي عليه سنة كاملة.)</div><div class=\"li\"><span class=\"en\">Acheron</span>: نهر الحزن.</div>", "n": 4, "i": 2, "a": "myth-m6-002", "x": "f44c7c28"}, {"t": "mc", "h": "", "q": "الآلهة نفسها بتحلف بنهر...", "nq": 1, "opts": ["<span class=\"en\">Styx</span>", "<span class=\"en\">Cocytus</span>", "<span class=\"en\">Lethe</span>"], "ans": 0, "why": "<span class=\"en\">Styx</span>", "ex": ["صح: <span class=\"en\">Styx</span>، والقسم بيه مبيتكسرش.", "غلط: <span class=\"en\">Cocytus</span> نهر العويل.", "غلط: <span class=\"en\">Lethe</span> نهر النسيان."], "i": 3}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Cocytus</span>: نهر العويل والندب.</div><div class=\"li\"><span class=\"en\">Phlegethon</span>: نهر النار الملتهبة.</div><div class=\"li\"><span class=\"en\">Lethe</span>: نهر النسيان. اللي يشرب منه بينسى حياته كلها.</div><div class=\"li\">قاعدة الحفظ: ٤ أنهار عواطف (كره، حزن، عويل، نار) وواحد ذاكرة (نسيان).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 3) <span class=\"en\">Charon</span> والعملة</div><div class=\"li\"><span class=\"en\">Charon</span> راجل عجوز قبيح، المعدّي (<span class=\"en\">ferryman</span>): بينقل الأرواح بمركبه عبر النهر.</div>", "n": 6, "i": 4, "a": "myth-m6-003", "x": "fd927b01"}, {"t": "mc", "h": "", "q": "نهر <span class=\"en\">Lethe</span> هو نهر...", "nq": 1, "opts": ["النسيان", "النار", "العويل"], "ans": 0, "why": "النسيان", "ex": ["صح: اللي يشرب منه بينسى حياته كلها.", "غلط: النار هو <span class=\"en\">Phlegethon</span>.", "غلط: العويل هو <span class=\"en\">Cocytus</span>."], "i": 5}, {"t": "learn", "h": "<div class=\"li\">مش ببلاش: الأجرة <span class=\"en\">obol</span> (عملة فضية صغيرة). وعشان كده الإغريق كانوا بيحطوا عملة في بق الميت أو على عينه قبل الدفن — عادة جنائزية حقيقية موثقة أثرياً، والأسطورة بتشرحها.</div><div class=\"li\">اللي ميتدفنش؟ روحه تفضل تائهة على البر ماتعدّيش. (في <span class=\"en\">Aeneid</span> الكتاب 6، بحّار اسمه <span class=\"en\">Palinurus</span> مات من غير دفن، ف<span class=\"en\">Charon</span> رفض يشيله، وقعد يستنى على البر.)</div>", "n": 2, "i": 6, "a": "myth-m6-004", "x": "31de9a9c"}, {"t": "mc", "h": "", "q": "أجرة <span class=\"en\">Charon</span> كانت...", "nq": 1, "opts": ["<span class=\"en\">obol</span> (عملة فضية صغيرة)", "ذهب كتير", "خاتم"], "ans": 0, "why": "<span class=\"en\">obol</span> (عملة فضية صغيرة)", "ex": ["صح: وعشان كده الإغريق حطوا عملة في بق الميت.", "غلط: كانت عملة صغيرة.", "غلط: مش المذكور."], "i": 7}, {"t": "learn", "h": "<div class=\"li\">الفكرة العميقة: الدفن عند الإغريق مش رفاهية، دي تأشيرة عبور. ومنها دراما <span class=\"en\">Antigone</span> كلها بعدين.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 4) <span class=\"en\">Cerberus</span>: كلب البوابة</div><div class=\"li\">كلب بـ 3 رؤوس (وفي <span class=\"en\">Hesiod</span>: خمسين رأس!) وذيله ثعبان، واقف على مدخل <span class=\"en\">Hades.</span></div><div class=\"li\">وظيفته: يستقبل الداخلين بودّ... ويمزق اللي يحاول يخرج. البوابة سهلة دخول، مستحيلة خروج.</div><div class=\"li\">هرقل هينزله في مهمته الأخيرة، وأورفيوس هينوّمه بالموسيقى.</div>", "n": 5, "i": 8, "a": "myth-m6-005", "x": "0b3272d3"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 5) القضاة التلاتة</div><div class=\"li\"><span class=\"en\">Minos</span> و<span class=\"en\">Rhadamanthys</span> و<span class=\"en\">Aeacus</span> — تلات ملوك اتعرفوا بالعدل في حياتهم، فبقوا قضاة بعد الموت.</div><div class=\"li\"><span class=\"en\">Minos</span> ده ملك كريت، صاحب قصة الـ <span class=\"en\">Minotaur</span> اللي هتيجي بعدين — شوف كل حاجة بترتبط.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 6) الوجهات التلات (النهاية بتاعتك)</div><div class=\"li\"><span class=\"en\">Tartarus</span>: الهاوية العميقة — سجن العقاب للأشرار الكبار (زي الـ <span class=\"en\">Titans</span> من درس <span class=\"en\">Chaos</span>، و<span class=\"en\">Sisyphus</span> و<span class=\"en\">Tantalus</span> درسين الجايين).</div>", "n": 5, "i": 9, "a": "myth-m6-006", "x": "215b2483"}, {"t": "mc", "h": "", "q": "القضاة التلاتة في العالم السفلي هم...", "nq": 1, "opts": ["<span class=\"en\">Minos</span> و<span class=\"en\">Rhadamanthys</span> و<span class=\"en\">Aeacus</span>", "<span class=\"en\">Zeus</span> و<span class=\"en\">Hera</span> و<span class=\"en\">Hades</span>", "<span class=\"en\">Clotho</span> و<span class=\"en\">Lachesis</span> و<span class=\"en\">Atropos</span>"], "ans": 0, "why": "<span class=\"en\">Minos</span> و<span class=\"en\">Rhadamanthys</span> و<span class=\"en\">Aeacus</span>", "ex": ["صح: تلات ملوك اتعرفوا بالعدل.", "غلط: دول آلهة.", "غلط: دول الـ <span class=\"en\">Fates</span>."], "i": 10}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Asphodel Meadows</span> (حقول الأصفودل): للناس العادية — لا عقاب ولا نعيم، أرواح رمادية بتعيش نسخة باهتة من الحياة.</div><div class=\"li\">ودي أهم تفصيلة: عند الإغريق الأقدمين، مصير معظم الناس \"ظل باهت\" مش عذاب ولا جنة — ده اللي هيوجع <span class=\"en\">Achilles</span> في الاقتباس تحت.</div><div class=\"li\"><span class=\"en\">Elysium</span> / <span class=\"en\">Isles of the Blest</span>: جنة الأبطال — نفس \"جزر المباركين\" اللي اتقالت قبل كده (عصر الأبطال).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 7) <span class=\"en\">Lethe</span> والنسيان</div>", "n": 4, "i": 11, "a": "myth-m6-007", "x": "3d3ddb2d"}, {"t": "mc", "h": "", "q": "عند الإغريق الأقدمين، مصير معظم الناس العاديين كان...", "nq": 1, "opts": ["ظل باهت في <span class=\"en\">Asphodel Meadows</span>", "جنة", "عذاب في <span class=\"en\">Tartarus</span>"], "ans": 0, "why": "ظل باهت في <span class=\"en\">Asphodel Meadows</span>", "ex": ["صح: لا عقاب ولا نعيم.", "غلط: النعيم للقليلين.", "غلط: العذاب للمذنبين."], "i": 12}, {"t": "learn", "h": "<div class=\"li\">شربة من <span class=\"en\">Lethe</span> = فورمات كامل للذاكرة.</div><div class=\"li\">الفيلسوف <span class=\"en\">Plato</span> في آخر كتاب \"الجمهورية\" (أسطورة <span class=\"en\">Er</span>) خلّى الأرواح بتشرب من <span class=\"en\">Lethe</span> قبل ما ترجع تتولد من جديد — عشان كده مابتفتكرش حياتها القديمة.</div><div class=\"li\">منها الكلمة الإنجليزية: <span class=\"en\">lethargy/lethargic</span> (الخمول والنسيان من نفس العيلة).</div>", "n": 3, "i": 13, "a": "myth-m6-008", "x": "7490f75d"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 8) الأسطورة في الشعر الإنجليزي:</div><div class=\"u\">أ) <span class=\"en\">Milton</span>، <span class=\"en\">Paradise Lost</span> الكتاب 2 (577-581): ميلتون وضع أنهار اليونان جوه الجحيم المسيحي، وسمّاهم واحد واحد:</div><div class=\"u\">\"<span class=\"en\">Abhorr</span>è<span class=\"en\">d Styx,</span> <span class=\"en\">the flood of deadly hate</span>;</div><div class=\"u\"><span class=\"en\">Sad Acheron of sorrow,</span> <span class=\"en\">black and deep</span>;</div><div class=\"u\"><span class=\"en\">Cocytus,</span> <span class=\"en\">named of lamentation loud</span></div><div class=\"u\"><span class=\"en\">Heard on the rueful stream</span>; <span class=\"en\">fierce Phlegethon,</span></div><div class=\"u\"><span class=\"en\">Whose waves of torrent fire inflame with rage.</span>\"</div>", "n": 6, "i": 14, "a": "myth-m6-009", "x": "9525f248"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">the _____ of deadly hate</div>", "opts": ["flood", "torrent", "enter"], "ans": 0, "why": "<span class=\"en\">the flood of deadly hate</span>", "i": 15, "ex": ["صح، دي الكلمة اللي في القصيدة.", "\"torrent\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"flood\".", "\"enter\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"flood\"."]}, {"t": "learn", "h": "<div class=\"u\">(ستيكس الملعونة نهر الكراهية القاتلة، أخيرون الحزين أسود عميق، كوسيتوس اللي اسمه من العويل، وفليجيثون الناري...) رابع استخدام نشوفه لميلتون بيعمّد الكلاسيك (بعد <span class=\"en\">M1</span> و<span class=\"en\">M3</span> و<span class=\"en\">M4</span>).</div><div class=\"u\">ب) <span class=\"en\">Keats</span>، أول ستانزا من \"<span class=\"en\">Ode to a Nightingale</span>\" (1819):</div><div class=\"u\">\"<span class=\"en\">Or emptied some dull opiate to the drains</span></div><div class=\"u\"><span class=\"en\">One minute past,</span> <span class=\"en\">and Lethe-wards had sunk</span>\"</div>", "n": 4, "i": 16, "a": "myth-m6-010", "x": "dc635b6b"}, {"t": "learn", "h": "<div class=\"u\">(\"كأني شربت مخدّر ثقيل لآخر قطرة... وغرقت ناحية <span class=\"en\">Lethe.</span>\") كلمة واحدة \"<span class=\"en\">Lethe-wards</span>\" = جرعة نسيان كاملة. دي قوة الـ <span class=\"en\">allusion</span>: اتجاه واحد بيلخص كل أسطورة النسيان.</div><div class=\"u\">ج) <span class=\"en\">Dante</span>، <span class=\"en\">Inferno</span> الكانتو 3 — الكتابة على بوابة الجحيم، بترجمة <span class=\"en\">Cary</span> الإنجليزية (1814):</div><div class=\"u\">\"<span class=\"en\">All hope abandon,</span> <span class=\"en\">ye who enter here.</span>\"</div>", "n": 3, "i": 17, "a": "myth-m6-011", "x": "39f1310c"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Ode to a Nightingale</span> لـ <span class=\"en\">Keats</span> (1819)، كلمة <span class=\"en\">Lethe-wards</span> بتشير لـ...", "nq": 1, "opts": ["الاتجاه ناحية النسيان", "الاتجاه ناحية النار", "الاتجاه ناحية المدينة"], "ans": 0, "why": "الاتجاه ناحية النسيان", "ex": ["صح: <span class=\"en\">Lethe</span> نهر النسيان.", "غلط: النار هو <span class=\"en\">Phlegethon</span>.", "غلط: مفيش مدينة."], "i": 18}, {"t": "learn", "h": "<div class=\"u\">(\"اخلعوا كل أمل يا داخلين.\") ومباشرة بعد البوابة، <span class=\"en\">Charon</span> نفسه بيظهر بمركبه — <span class=\"en\">Dante</span> بنى جحيمه على خريطة <span class=\"en\">Virgil</span> (<span class=\"en\">Aeneid 6</span>) اللي مبنية على هوميروس. سلسلة واحدة.</div><div class=\"u\">د) <span class=\"en\">Homer</span>، <span class=\"en\">Odyssey</span> الكتاب 11 (ترجمة <span class=\"en\">Murray</span>، 11.489-491): أوديسيوس نزل يكلم الأرواح، فقابل روح <span class=\"en\">Achilles</span> أعظم بطل، فقاله أوجع سطر في الأدب القديم:</div>", "n": 2, "i": 19, "a": "myth-m6-012", "x": "917e49bf"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">I should choose,</span> <span class=\"en\">so I might live on earth,</span> <span class=\"en\">to serve as the hireling of another,</span> <span class=\"en\">of some portionless man whose livelihood was but small,</span> <span class=\"en\">rather than to be lord over all the dead that have perished.</span>\"</div>", "n": 1, "i": 20, "a": "myth-m6-013", "x": "3f18fab6"}, {"t": "learn", "h": "<div class=\"u\">(\"أفضّل أعيش على الأرض أجير عند راجل فقير مالوش شي، عن إني أكون ملك على كل الموتى.\") المجد البطولي كله ميستاهلش شمس الحياة. سطر بيقلب فكرة \"الموت المجيد\" اللي الإلياذة نفسها بناها — ولاحظ: ده موقفه في حقول الأصفودل الباهتة (نقطة 6).</div>", "n": 1, "i": 21, "a": "myth-m6-014", "x": "c04077d6"}, {"t": "mc", "h": "", "q": "في <span class=\"en\">Odyssey</span> الكتاب 11، <span class=\"en\">Achilles</span> بيقول إنه يفضل...", "nq": 1, "opts": ["يبقى أجير عند فقير على الأرض عن إنه ملك على الموتى", "يفضل ملك على الموتى", "يرجع لطروادة"], "ans": 0, "why": "يبقى أجير عند فقير على الأرض عن إنه ملك على الموتى", "ex": ["صح: المجد البطولي مش أحسن من الحياة.", "غلط: ده عكس ما قاله.", "غلط: مش المذكور."], "i": 22}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 9) كلمات من درس النهارده:</div><div class=\"u\"><span class=\"en\">Stygian</span> (مظلم كالستيكس: \"<span class=\"en\">Stygian darkness</span>\") • <span class=\"en\">Elysian</span> (نعيمي: \"<span class=\"en\">Elysian fields</span>\") • <span class=\"en\">lethargic</span> • \"<span class=\"en\">cross the Styx</span>\" (يعني يموت — تعبير إنجليزي شائع) • <span class=\"en\">Charon's obol.</span></div>", "n": 1, "i": 23, "a": "myth-m6-015", "x": "f94e648f"}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 24}];</script>
