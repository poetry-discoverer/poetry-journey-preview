<h1>الدرس ٤: الإيقاع (rhythm) — ضربات القلب بتاعة القصيدة</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس 4 من 16</span><span class="tag"><span class="em">📖</span> كورس الشعر</span></div>

<script>window.LESSON_ID="poetry-04";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">الدرس اللي فات اتكلمنا عن القافية، مزيكا آخر السطر. النهاردة هنسمع مزيكا تانية جوه السطر نفسه: الإيقاع. خد وقتك في كل صفحة، وجرب كل مثال بصوتك.<\/div>", "n": 1, "i": 0, "a": "poetry-04-001", "x": "8295499e"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ١: إيه هو الإيقاع؟ والمقاطع الصوتية (<span class=\"en\">syllables<\/span>)", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">قول معايا: شمال.. يمين.. شمال.. يمين.. دي مشيتك، ليها إيقاع منتظم. وسمع قلبك: تك.. تك.. تك.. إيقاع تاني. الإيقاع (<span class=\"en\">rhythm<\/span>) ببساطة: صوت منتظم بيتكرر، فيه دقة قوية ودقة ضعيفة.<\/div><div class=\"u\">عشان نفهم إيقاع الشعر لازم نعرف حاجة صغيرة الأول: الـ <span class=\"en\">syllable<\/span> (المقطع الصوتي). دي وحدة الصوت جوه الكلمة:<\/div><div class=\"li\"><span class=\"en\">cat<\/span>: مقطع واحد.<\/div><div class=\"li\"><span class=\"en\">water<\/span>: مقطعين، <span class=\"en\">wa-ter.<\/span><\/div><div class=\"li\"><span class=\"en\">beautiful<\/span>: تلاتة، <span class=\"en\">beau-ti-ful.<\/span><\/div>", "n": 5, "i": 2, "a": "poetry-04-002", "x": "4ee26081"}, {"t": "learn", "h": "<div class=\"u\">خد بالك من فخ مهم: بالعربي بنقول \"مقطع\" على الاتنين، بس بالإنجليزي فيه فرق:<\/div><div class=\"li\"><span class=\"en\">syllable<\/span> = مقطع صوتي جوه الكلمة.<\/div><div class=\"li\"><span class=\"en\">stanza<\/span> = مقطع القصيدة (الدرس ٢).<\/div><div class=\"u\">دول حاجتين مختلفتين تماماً، متحطهمش في بعض.<\/div><div class=\"u\">طيب الإيقاع بييجي منين؟ الإنجليزي لغة فيها مقاطع قوية (بنقولها بنَفَس أقوى) ومقاطع ضعيفة. لما القوية والضعيفة يتظبطوا بنظام، يطلع إيقاع حلو.<\/div>", "n": 5, "i": 3, "a": "poetry-04-003", "x": "50a4ea67"}, {"t": "learn", "h": "<div class=\"lead\">جرب دلوقتي: دق على رجلك وقول بصوت عالي:<\/div><div class=\"u\"><span class=\"en\">TY-ger TY-ger BUR-ning BRIGHT<\/span><\/div><div class=\"u\">عد الدقات القوية: ٤. سمعت الإيقاع؟ دي مزيكا السطر.<\/div>", "n": 2, "i": 4, "a": "poetry-04-004", "x": "80424e38"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٢: الوقفات (<span class=\"en\">pauses<\/span>)", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">الإيقاع مش بس دقات، دي كمان وقفات. زي المزيكا: السكتة جزء من اللحن.<\/div><div class=\"u\">احنا اتفقنا في الدرس ٢ إننا نقف وقفة صغيرة في آخر كل مقطع. طيب تعالى نبص جوه السطر نفسه: علامات الترقيم (الفاصلة , والنقطة .) بتعمل وقفات صغيرة في نص السطر.<\/div><div class=\"u\">بص على أول سطر من قصيدة <span class=\"en\">The Raven<\/span> (الغراب) للشاعر الأمريكي <span class=\"en\">Edgar Allan Poe<\/span>:<\/div>", "n": 3, "i": 6, "a": "poetry-04-005", "x": "c50f7fed"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Once upon a midnight dreary,<\/span> <span class=\"en\">while I pondered,<\/span> <span class=\"en\">weak and weary,<\/span>\"<\/div><div class=\"u\">لو قرأتها بصوتك هتلاقي نفسك واقف وقفتين صغيرين عند الفواصل: <span class=\"en\">Once upon a midnight dreary<\/span> (وقفة) <span class=\"en\">while I pondered<\/span> (وقفة) <span class=\"en\">weak and weary.<\/span><\/div><div class=\"u\">الوقفات دي مش صدفة: الشاعر حطها عشان تديك وقت تسمع كل صورة لوحدها: نص الليل، بعدين التفكير، بعدين التعب. الوقفة أداة في إيد الشاعر زي الدقة بالظبط.<\/div>", "n": 3, "i": 7, "a": "poetry-04-006", "x": "6bc22c1f"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٣: التكرار (<span class=\"en\">repetition<\/span>) — لما الكلمة تتقال مرتين", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">لما تكون خايف بتقول: \"يا ساتر يا ساتر\". محدش قالك تكررها، بس التكرار طلع لوحده لأنه بيزود الإحساس. الشعراء بيعملوا نفس الحاجة عن قصد: <span class=\"en\">repetition<\/span> (تكرار) يعني الشاعر يعيد نفس الكلمة أو الجملة عشان تثبت في ودنك وقلبك.<\/div><div class=\"u\">اسمع المثال الحلو ده من <span class=\"en\">The Raven.<\/span> الراجل قاعد لوحده نص الليل، وفجأة سمع حاجة:<\/div><div class=\"u\">\"<span class=\"en\">suddenly there came a tapping,<\/span><\/div>", "n": 3, "i": 9, "a": "poetry-04-007", "x": "2b6460fb"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">As of some one gently rapping,<\/span> <span class=\"en\">rapping at my chamber door.<\/span>\"<\/div><div class=\"u\">ترجمتها: فجأة جه صوت طقطقة، زي حد بيطق برفق، طق طق على باب أوضتي.<\/div><div class=\"u\">خد بالك: <span class=\"en\">tapping<\/span> وبعدين <span class=\"en\">rapping,<\/span> <span class=\"en\">rapping.<\/span> الصوت اتكرر زي الطقطقة نفسها بالظبط! لما تقراها بصوتك بتحس إنك سامع الباب فعلاً. دي شطارة التكرار.<\/div>", "n": 3, "i": 10, "a": "poetry-04-008", "x": "9beb101a"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٤: الريفرين (<span class=\"en\">refrain<\/span>) — كورس القصيدة", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">أي أغنية بتحبها فيها جزء بيتعاد كل شوية: الكورس. الشعر فيه نفس الحاجة واسمها <span class=\"en\">refrain<\/span> (ريفرين): سطر أو جملة بترجع تتقال كل شوية في القصيدة.<\/div><div class=\"u\">أشهر مثال في الشعر الإنجليزي: قصيدة <span class=\"en\">The Raven<\/span> بتاعتنا (كتبها <span class=\"en\">Edgar Allan Poe<\/span> سنة ١٨٤٥). في آخر كل مقطع تقريباً، الغراب بيقول نفس الكلمة:<\/div><div class=\"u\"><span class=\"en\">Quoth the Raven<\/span> \"<span class=\"en\">Nevermore.<\/span>\"<\/div>", "n": 3, "i": 12, "a": "poetry-04-009", "x": "eae86c3b"}, {"t": "learn", "h": "<div class=\"u\">يعني: قال الغراب: \"أبداً.\" وكل مرة بتتقال، بتقلب أكتر.<\/div><div class=\"u\">تعالى نقرا أول مقطع من القصيدة كله (المصدر: <span class=\"en\">Poetry Foundation<\/span>):<\/div><div class=\"u\"><span class=\"en\">Once upon a midnight dreary,<\/span> <span class=\"en\">while I pondered,<\/span> <span class=\"en\">weak and weary,<\/span><\/div><div class=\"u\"><span class=\"en\">Over many a quaint and curious volume of forgotten lore<\/span>—<\/div><div class=\"u\"><span class=\"en\">While I nodded,<\/span> <span class=\"en\">nearly napping,<\/span> <span class=\"en\">suddenly there came a tapping,<\/span><\/div>", "n": 5, "i": 13, "a": "poetry-04-010", "x": "2eae16d5"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">As of some one gently rapping,<\/span> <span class=\"en\">rapping at my chamber door.<\/span><\/div><div class=\"u\">المعنى ببساطة: \"في نص ليلة كئيبة، وأنا قاعد أفكر تعبان ومرهق، فوق كتب قديمة غريبة، وكنت بهز راسي وعلى وشك أغفى، فجأة سمعت طقطقة، زي حد بيطق برفق، طق طق على باب أوضتي.\"<\/div>", "n": 2, "i": 14, "a": "poetry-04-011", "x": "82130165"}, {"t": "learn", "h": "<div class=\"lead\">ليه الريفرين مهم؟ ٣ أسباب:<\/div><div class=\"u\">١- بيثبت الفكرة الأساسية في دماغك، زي كورس الأغنية.<\/div><div class=\"u\">٢- كل مرة يتقال، معناه بيكبر ويتعمق حسب اللي حصل قبله.<\/div><div class=\"u\">٣- بيدي القصيدة هيكل: ودنك بتعرف إن المقطع خلص لما تسمعه.<\/div>", "n": 3, "i": 15, "a": "poetry-04-012", "x": "d0dc2e21"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄<\/span><\/span> صفحة ٥: ملخص الدرس + تمرين", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"lead\">النهاردة اتعلمنا ٤ حاجات:<\/div><div class=\"u\">١- الإيقاع (<span class=\"en\">rhythm<\/span>): مقاطع قوية وضعيفة بتتظبط بنظام، والـ <span class=\"en\">syllable<\/span> هو المقطع الصوتي جوه الكلمة (متلخبطش بينه وبين الـ <span class=\"en\">stanza<\/span>!).<\/div><div class=\"u\">٢- الوقفات (<span class=\"en\">pauses<\/span>): السكتة جزء من المزيكا، وعلامات الترقيم بتعمل وقفات جوه السطر.<\/div><div class=\"u\">٣- التكرار (<span class=\"en\">repetition<\/span>): إعادة كلمة أو جملة عشان تزود الإحساس (<span class=\"en\">tapping,<\/span> <span class=\"en\">rapping,<\/span> <span class=\"en\">rapping<\/span>).<\/div>", "n": 3, "i": 17, "a": "poetry-04-013", "x": "22b6fc7c"}, {"t": "learn", "h": "<div class=\"u\">٤- الريفرين (<span class=\"en\">refrain<\/span>): كورس القصيدة، سطر بيتعاد (<span class=\"en\">Quoth the Raven<\/span> \"<span class=\"en\">Nevermore.<\/span>\").<\/div>", "n": 1, "i": 18, "a": "poetry-04-014", "x": "0bfc409a"}, {"t": "learn", "h": "<div class=\"lead\">١- عد الدقات القوية في السطرين دول:<\/div><div class=\"u\"><span class=\"en\">Tyger Tyger,<\/span> <span class=\"en\">burning bright<\/span><\/div><div class=\"u\"><span class=\"en\">Shall I compare thee to a summer's day?<\/span><\/div><div class=\"u\">٢- إيه الريفرين في قصيدة <span class=\"en\">The Raven<\/span>؟ اكتبه بالإنجليزي.<\/div><div class=\"u\">٣- اكتب سطرين من تأليفك فيهم تكرار كلمة واحدة عشان تزود الإحساس (زي: أنا تعبان، تعبان من الشغل).<\/div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.<\/div>", "n": 5, "i": 19, "a": "poetry-04-015", "x": "723c689d"}, {"t": "recall", "h": "", "q": "عد الدقات القوية في السطر ده: \"<span class=\"en\">Tyger Tyger,<\/span> <span class=\"en\">burning bright<\/span>\"", "a": "٤ دقات قوية: <span class=\"en\">TY-ger TY-ger BUR-ning BRIGHT.<\/span>", "n": 1, "i": 20}, {"t": "recall", "h": "", "q": "إيه اسم السطر اللي بيتكرر في القصيدة كل شوية زي كورس الأغنية؟", "a": "الريفرين (<span class=\"en\">refrain)<\/span>.", "n": 1, "i": 21}, {"t": "recall", "h": "", "q": "إيه الريفرين بتاع قصيدة <span class=\"en\">The Raven<\/span>؟ اكتبه بالإنجليزي.", "a": "<span class=\"en\">Quoth the Raven<\/span> \"<span class=\"en\">Nevermore.<\/span>\" (قال الغراب: \"أبداً.\")", "n": 1, "i": 22}, {"t": "tf", "h": "", "q": "صح ولا غلط: الوقفات في القصيدة شكل ومالهاش دور في المعنى.", "ans": false, "why": "غلط. الوقفة أداة في إيد الشاعر زي الدقة بالظبط: بتديك وقت تشوف كل صورة لوحدها وبتظبط إيقاع القراءة.", "n": 1, "i": 23, "ex": ["الجملة غلط. الوقفة أداة في إيد الشاعر زي الدقة بالظبط: بتديك وقت تشوف كل صورة لوحدها وبتظبط إيقاع القراءة.", "صح، الجملة غلط. الوقفة أداة في إيد الشاعر زي الدقة بالظبط: بتديك وقت تشوف كل صورة لوحدها وبتظبط إيقاع القراءة."]}, {"t": "write", "h": "", "q": "اشرح بأسلوبك إيه هو الإيقاع (<span class=\"en\">rhythm)<\/span>، وإيه الفرق بين الـ <span class=\"en\">syllable<\/span> والـ <span class=\"en\">stanza<\/span>؟ (افتكر الفخ: الاتنين بنترجمهم \"مقطع\" بالعربي!) وهات مثال كلمة من عندك وقسّمها لمقاطع صوتية.", "key": "poetry-04:5", "n": 1, "i": 24}, {"t": "write", "h": "", "q": "اشرح بأسلوبك الفرق بين الـ <span class=\"en\">repetition<\/span> والـ <span class=\"en\">refrain<\/span>، وهات مثال على كل واحد من قصيدة <span class=\"en\">The Raven.<\/span> وليه برأيك <span class=\"en\">Poe<\/span> اختار يخلي الغراب يقول \"<span class=\"en\">Nevermore<\/span>\" في آخر كل مقطع؟ بيعمل إيه في إحساس القارئ؟", "key": "poetry-04:6", "n": 1, "i": 25}, {"t": "write", "h": "", "q": "اكتب سطرين من تأليفك فيهم تكرار كلمة واحدة عشان تزود الإحساس، وقولي: حطيت وقفة فين في سطورك؟ وليه هناك بالذات؟", "key": "poetry-04:7", "n": 1, "i": 26}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳<\/span><\/span> الدرس الجاي (الدرس ٥) هنبدأ وحدة جديدة: الصوت والموسيقى بعمق، أولها المقاطع الصوتية والنَّبْر.", "extra": "", "i": 27}];</script>
