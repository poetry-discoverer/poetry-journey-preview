<script>window.LESSON_ID="poetry-08";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">لحد دلوقتي اتكلمنا عن القافية (آخر السطر) والإيقاع (دقات السطر). النهاردة مزيكا تالتة: تكرار الأصوات جوه الكلمات نفسها.</div>", "n": 1, "i": 0, "a": "poetry-08-001", "x": "a7ce9929"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: الـ <span class=\"en\">alliteration</span>، تكرار أول صوت", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">كلمات ورا بعض بتبدأ بنفس الصوت.</div><div class=\"u\">\"<span class=\"en\">Peter Piper picked a peck of pickled peppers</span>\" (حرف <span class=\"en\">P</span> ٦ مرات!)</div>", "n": 2, "i": 2, "a": "poetry-08-002", "x": "4abc887b"}, {"t": "learn", "h": "<div class=\"lead\">ومن <span class=\"en\">The Raven</span>:</div><div class=\"u\">\"<span class=\"en\">Once upon a midnight dreary,</span> <span class=\"en\">while I pondered,</span> <span class=\"en\">weak and weary</span>\" (الـ <span class=\"en\">w</span>: <span class=\"en\">weak-weary</span>)</div><div class=\"u\">\"<span class=\"en\">While I nodded,</span> <span class=\"en\">nearly napping</span>\" (الـ <span class=\"en\">n</span>: <span class=\"en\">nodded-nearly-napping</span>)</div><div class=\"u\">إحساسها: بتربط الكلمات زي الخيط، وبتتحفظ بسرعة.</div>", "n": 3, "i": 3, "a": "poetry-08-003", "x": "21c9865a"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">alliteration</span> هو تكرار...", "nq": 1, "opts": ["أول صوت في كلمات ورا بعض", "صوت متحرك في آخر السطر", "كلمة كاملة مرتين"], "ans": 0, "why": "أول صوت في كلمات ورا بعض", "ex": ["صح: زي <span class=\"en\">Peter Piper picked</span>، حرف <span class=\"en\">P</span> في أول الكلمات.", "غلط: ده أقرب للقافية، والـ <span class=\"en\">alliteration</span> بيكون في أول الكلمات.", "غلط: ده التكرار العادي (<span class=\"en\">repetition</span>)."], "i": 4}, {"t": "mc", "h": "", "q": "في <span class=\"en\">weak and weary</span>، الصوت المتكرر في أول الكلمتين هو...", "nq": 1, "opts": ["الـ <span class=\"en\">w</span>", "الـ <span class=\"en\">k</span>", "الـ <span class=\"en\">s</span>"], "ans": 0, "why": "الـ <span class=\"en\">w</span>", "ex": ["صح: <span class=\"en\">weak</span> و <span class=\"en\">weary</span> بيبدأوا بصوت <span class=\"en\">w</span>.", "غلط: مفيش <span class=\"en\">k</span> في أول الكلمتين.", "غلط: مفيش <span class=\"en\">s</span> في أول الكلمتين."], "i": 5}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: الـ <span class=\"en\">assonance</span>، تكرار صوت المتحرك", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">صوت متحرك (<span class=\"en\">a,</span> <span class=\"en\">e,</span> <span class=\"en\">i,</span> <span class=\"en\">o,</span> <span class=\"en\">u</span>) بيتكرر جوه الكلام، مش شرط في الأول.</div><div class=\"u\">\"<span class=\"en\">Try to fly high in the night sky</span>\" (صوت /<span class=\"en\">a</span>ɪ/ خمس مرات)</div><div class=\"u\">\"<span class=\"en\">The fleet feet of the sweet geese</span>\" (صوت إي)</div><div class=\"u\">الفرق عن القافية: القافية جرس في آخر السطر، والـ <span class=\"en\">assonance</span> نغمة ماشية جوه السطر.</div>", "n": 4, "i": 7, "a": "poetry-08-004", "x": "0b5925e7"}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">assonance</span> هو تكرار صوت...", "nq": 1, "opts": ["متحرك جوه الكلام، مش شرط في الأول", "ساكن في آخر السطر", "حرف في أول الكلمة"], "ans": 0, "why": "متحرك جوه الكلام، مش شرط في الأول", "ex": ["صح: زي <span class=\"en\">The fleet feet of the sweet geese</span>، صوت إي بيتكرر.", "غلط: ده أقرب للـ <span class=\"en\">consonance</span>.", "غلط: ده الـ <span class=\"en\">alliteration</span>."], "i": 8}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: الـ <span class=\"en\">consonance</span>، تكرار صوت الساكن", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">صوت ساكن (<span class=\"en\">t,</span> <span class=\"en\">k,</span> <span class=\"en\">s,</span> <span class=\"en\">m</span>) بيتكرر جوه الكلمات أو في آخرها.</div><div class=\"li\">\"<span class=\"en\">pitter patter</span>\" (المطر على الشباك)</div><div class=\"li\">\"<span class=\"en\">He struck a streak of bad luck</span>\" (الـ <span class=\"en\">k</span>)</div><div class=\"li\">\"<span class=\"en\">The lumpy bumpy road home</span>\" (الـ <span class=\"en\">m</span>)</div>", "n": 4, "i": 10, "a": "poetry-08-005", "x": "cb46b23e"}, {"t": "mc", "h": "", "q": "<span class=\"en\">pitter patter</span> مثال على...", "nq": 1, "opts": ["<span class=\"en\">consonance</span>", "<span class=\"en\">assonance</span>", "<span class=\"en\">refrain</span>"], "ans": 0, "why": "<span class=\"en\">consonance</span>", "ex": ["صح: تكرار صوت ساكن (<span class=\"en\">t</span>) جوه الكلمات، يعني <span class=\"en\">consonance</span>.", "غلط: الـ <span class=\"en\">assonance</span> تكرار صوت متحرك.", "غلط: الـ <span class=\"en\">refrain</span> سطر بيتعاد."], "i": 11}, {"t": "learn", "h": "<div class=\"lead\">الفرق:</div><div class=\"li\"><span class=\"en\">alliteration</span>: أول صوت في الكلمة</div><div class=\"li\"><span class=\"en\">assonance</span>: صوت متحرك في أي مكان</div><div class=\"li\"><span class=\"en\">consonance</span>: صوت ساكن في أي مكان</div>", "n": 3, "i": 12, "a": "poetry-08-006", "x": "c55f782c"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: ليه الشعراء بيستخدموها؟", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">١- مزيكا: السطر بيتغنى حتى من غير قافية.</div><div class=\"u\">٢- ربط المعنى: كلمتين بنفس الصوت = \"دول مع بعض\".</div><div class=\"u\">٣- إحساس: الـ <span class=\"en\">s</span> ناعم وهادي، والـ <span class=\"en\">k</span> والـ <span class=\"en\">t</span> حاد وسريع. مشهد هادي = أصوات ناعمة، مشهد مخيف = أصوات حادة.</div><div class=\"u\">\"<span class=\"en\">Tyger Tyger,</span> <span class=\"en\">burning bright</span>\": الـ <span class=\"en\">T</span> والـ <span class=\"en\">B</span> متكررين، والأصوات حادة لأن النمر مخيف. <span class=\"en\">Blake</span> كان قاصد.</div>", "n": 4, "i": 14, "a": "poetry-08-007", "x": "3264cfc2"}, {"t": "mc", "h": "", "q": "أنهي أصوات بتحس بيها حادة وسريعة؟", "nq": 1, "opts": ["الـ <span class=\"en\">k</span> والـ <span class=\"en\">t</span>", "الـ <span class=\"en\">s</span>", "الـ <span class=\"en\">m</span>"], "ans": 0, "why": "الـ <span class=\"en\">k</span> والـ <span class=\"en\">t</span>", "ex": ["صح: الـ <span class=\"en\">k</span> والـ <span class=\"en\">t</span> حادين، فبيناسبوا مشهد مخيف زي النمر.", "غلط: الـ <span class=\"en\">s</span> ناعم وهادي.", "غلط: الـ <span class=\"en\">m</span> أقرب للأصوات الناعمة."], "i": 15}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">✏️</span></span> تمرين:</div><div class=\"u\">١- طلّع الـ <span class=\"en\">alliteration</span> من: \"<span class=\"en\">weak and weary</span>\" و \"<span class=\"en\">nodded,</span> <span class=\"en\">nearly napping</span>\" (إيه الحرف المتكرر؟)</div><div class=\"u\">٢- إيه صوت الـ <span class=\"en\">assonance</span> في: \"<span class=\"en\">Try to fly high in the night sky</span>\"؟</div><div class=\"u\">٣- اكتب ٣ سطور من تأليفك عن يومك: واحد <span class=\"en\">alliteration</span>، واحد <span class=\"en\">assonance</span>، واحد <span class=\"en\">consonance.</span></div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">⏳</span></span> الدرس ٩: الأونوماتوبيا (<span class=\"en\">buzz,</span> <span class=\"en\">bang,</span> <span class=\"en\">splash</span>).</div>", "n": 5, "i": 17, "a": "poetry-08-008", "x": "08940244"}, {"t": "recall", "h": "", "q": "الـ <span class=\"en\">alliteration</span> تكرار أنهي جزء من الكلمة؟", "a": "أول الكلمة (الصوت الأول).", "n": 1, "i": 18}, {"t": "recall", "h": "", "q": "إيه الصوت المتكرر (<span class=\"en\">assonance)</span> في: \"<span class=\"en\">The fleet feet of the sweet geese</span>\"؟", "a": "صوت الـ \"إي\" (/<span class=\"en\">i</span>ː/): <span class=\"en\">fleet-feet-sweet-geese.</span>", "n": 1, "i": 19}, {"t": "recall", "h": "", "q": "النوع ده إيه: \"<span class=\"en\">struck - streak - luck</span>\" (تكرار صوت الـ <span class=\"en\">k</span> في الآخر)؟", "a": "<span class=\"en\">consonance</span> (تكرار صوت ساكن).", "n": 1, "i": 20}, {"t": "tf", "h": "", "q": "صح ولا غلط: صوت الـ <span class=\"en\">S</span> ناعم وهادي، فالشاعر يستخدمه في مشهد مخيف وعنيف.", "ans": false, "why": "غلط. الـ <span class=\"en\">S</span> ناعم وهادي، يناسب مشهد هادي. المشهد المخيف يناسبه أصوات حادة زي <span class=\"en\">K</span> و <span class=\"en\">T.</span>", "n": 1, "i": 21, "ex": ["الجملة غلط. الـ <span class=\"en\">S</span> ناعم وهادي، يناسب مشهد هادي. المشهد المخيف يناسبه أصوات حادة زي <span class=\"en\">K</span> و <span class=\"en\">T</span>.", "صح، الجملة غلط. الـ <span class=\"en\">S</span> ناعم وهادي، يناسب مشهد هادي. المشهد المخيف يناسبه أصوات حادة زي <span class=\"en\">K</span> و <span class=\"en\">T</span>."]}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 22}];</script>
