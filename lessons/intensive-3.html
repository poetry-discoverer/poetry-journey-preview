<script>window.LESSON_ID="intensive-3";window.STEPS=[{"t": "section", "h": "1) هارولد بلوم (<span class=\"en\">Harold Bloom<\/span>) وقلق التأثر", "i": 0}, {"t": "learn", "h": "<div class=\"u\">كان <span class=\"en\">Harold Bloom<\/span> (1930-2019) ناقداً أمريكياً من أبرز من تأثروا بفرويد في دراسة الشعر. في كتابه <span class=\"en\">The Anxiety of Influence<\/span> (1973) اقترح أن الشاعر القوي (<span class=\"en\">strong poet<\/span>) يشعر بقلق من تأثير الشعراء السابقين عليه، لأنه يريد أن يكون أصيلاً، لكنه مدين لهم.<\/div>", "n": 1, "a": "intensive-3-001", "x": "f74cd5e6", "i": 1}, {"t": "learn", "h": "<div class=\"u\">واستعار <span class=\"en\">Bloom<\/span> من <span class=\"en\">Freud<\/span> صورة العلاقة بين الأب والابن: الشاعر الجديد يشبه الابن الذي يحتاج أن يتجاوز الأب (الشاعر السابق) ليجد صوته. لذلك يرى أن الشاعر القوي \"يسيء قراءة\" (<span class=\"en\">misreads<\/span> / <span class=\"en\">misprision<\/span>) سلفه عن قصد، فيعيد تفسيره بطريقة تفتح له مساحة جديدة.<\/div>", "n": 1, "a": "intensive-3-002", "x": "38e55cfd", "i": 2}, {"t": "mc", "h": "", "q": "ما المقصود بـ \"قلق التأثر\" عند <span class=\"en\">Bloom<\/span>؟", "opts": ["خوف الشاعر من النقاد", "شعور الشاعر القوي بالضغط من تأثير السابقين", "قلق القارئ من القصائد الصعبة"], "ans": 1, "why": "شعور الشاعر القوي بالضغط من تأثير السابقين", "i": 3, "ex": ["غلط: القلق عند <span class=\"en\">Bloom<\/span> تجاه الشعراء السابقين، وليس النقاد.", "صح: يريد الشاعر أن يكون أصيلاً لكنه مدين لمن سبقه، وهذا هو القلق.", "غلط: المفهوم يخص علاقة الشاعر بسلفه."]}, {"t": "learn", "h": "<div class=\"u\">وضع <span class=\"en\">Bloom<\/span> ست نسب تعديلية (<span class=\"en\">revisionary ratios<\/span>) تصف طرق هذه الإساءة: <span class=\"en\">clinamen<\/span> (انحراف عن السلف)، <span class=\"en\">tessera<\/span> (إكمال له)، <span class=\"en\">kenosis<\/span> (تفريغ للذات)، <span class=\"en\">daemonization<\/span>، <span class=\"en\">askesis<\/span>، <span class=\"en\">apophrades<\/span> (عودة الموتى). والمهم لك الآن فكرة واحدة: الشعر حوار بين الشعراء عبر الزمن، لا عمل منعزل.<\/div>", "n": 1, "a": "intensive-3-003", "x": "2fdddd29", "i": 4}, {"t": "learn", "h": "<div class=\"u\">مثال يستشهد به الدارسون: <span class=\"en\">Keats<\/span> و<span class=\"en\">Milton<\/span>. كتب <span class=\"en\">Keats<\/span> في رسالة إلى <span class=\"en\">Reynolds<\/span> في 21 سبتمبر 1819 أنه تخلى عن قصيدته <span class=\"en\">Hyperion<\/span> لأنها تحمل \"<span class=\"en\">Miltonic inversions<\/span>\" كثيرة، وفي الصيغة المعاد كتابتها <span class=\"en\">The Fall of Hyperion<\/span> بحث عن صوت أبعد عن <span class=\"en\">Milton<\/span>. وفي كورس التاريخ ستجد <span class=\"en\">Milton<\/span> و<span class=\"en\">Romantics<\/span> في فترات متتابعة، وهذا خط التأثر الذي يبني عليه <span class=\"en\">Bloom<\/span>.<\/div>", "n": 1, "a": "intensive-3-004", "x": "33f2de44", "i": 5}, {"t": "section", "h": "2) نورثروب فراي (<span class=\"en\">Northrop Frye<\/span>) والنقد الأسطوري", "i": 6}, {"t": "learn", "h": "<div class=\"u\">كان <span class=\"en\">Northrop Frye<\/span> (1912-1991) ناقداً كندياً. في كتابه <span class=\"en\">Anatomy of Criticism<\/span> (1957) عرض نظاماً شاملاً لقراءة الأدب، وفيه المقال الثالث عن النقد الأسطوري (<span class=\"en\">Archetypal<\/span> / <span class=\"en\">Myth Criticism<\/span>). فكرته أن الأدب كله يتكوّن من أنماط وقصص متكررة، تعود في النهاية إلى الأسطورة.<\/div>", "n": 1, "a": "intensive-3-005", "x": "14a3c5cf", "i": 7}, {"t": "tf", "h": "", "q": "يرى <span class=\"en\">Bloom<\/span> أن الشاعر القوي يتجنب أي علاقة بالشعراء السابقين تماماً.", "ans": false, "why": "غلط", "i": 8, "ex": ["غلط: عند <span class=\"en\">Bloom<\/span> الشاعر القوي يتصارع مع سلفه ويعيد قراءته، ولا يتجنبه.", "صح أن الجملة غلط: العلاقة بالسلف عند <span class=\"en\">Bloom<\/span> هي موضوع النظرية."]}, {"t": "learn", "h": "<div class=\"u\">ربط <span class=\"en\">Frye<\/span> أربعة أنماط للحبكة (<span class=\"en\">mythoi<\/span>) بالفصول الأربعة: الربيع للكوميديا (<span class=\"en\">comedy<\/span>)، والصيف للرومانس (<span class=\"en\">romance<\/span>)، والخريف للتراجيديا (<span class=\"en\">tragedy<\/span>)، والشتاء للسخرية (<span class=\"en\">irony<\/span> / <span class=\"en\">satire<\/span>). والفكرة أن القصة تدور مثل السنة: ولادة وازدهار وسقوط وموت، ثم بداية جديدة.<\/div>", "n": 1, "a": "intensive-3-006", "x": "9f73af13", "i": 9}, {"t": "learn", "h": "<div class=\"u\">ويختلف <span class=\"en\">Frye<\/span> عن المنهج النفسي: لا يبحث في رغبات المؤلف الخفية، بل في الأنماط الأدبية المشتركة بين النصوص. لكنهما يلتقيان مع <span class=\"en\">Jung<\/span> في فكرة النماذج الأصلية. وهذا الدرس جسر مباشر إلى كورس الميثولوجيا، لأن كل أسطورة هناك (مثل <span class=\"en\">Persephone<\/span> و<span class=\"en\">Prometheus<\/span>) يمكن قراءتها كنمط.<\/div>", "n": 1, "a": "intensive-3-007", "x": "a3fa9257", "i": 10}, {"t": "mc", "h": "", "q": "أي فصل يرتبط بالتراجيديا عند <span class=\"en\">Frye<\/span>؟", "opts": ["الخريف", "الشتاء", "الربيع"], "ans": 0, "why": "الخريف", "i": 11, "ex": ["صح: عند <span class=\"en\">Frye<\/span> الخريف للتراجيديا، لأنه فصل السقوط.", "غلط: الشتاء للسخرية (<span class=\"en\">irony<\/span> / <span class=\"en\">satire<\/span>).", "غلط: الربيع للكوميديا."]}, {"t": "learn", "h": "<div class=\"u\">كيف تستخدم الفكرتين في تحليل قصيدة؟ مع <span class=\"en\">Bloom<\/span> تسأل: من الشاعر السابق الذي تردّ عليه هذه القصيدة؟ ومع <span class=\"en\">Frye<\/span> تسأل: أي نمط يظهر؟ رحلة، سقوط، موت وبعث؟ وفي الحالتين اربط إجابتك بسطر من النص، واذكر أنها قراءة من منظور محدد.<\/div>", "n": 1, "a": "intensive-3-008", "x": "8f4aee87", "i": 12}, {"t": "mc", "h": "", "q": "ما موضوع المقال الثالث في <span class=\"en\">Anatomy of Criticism<\/span> الذي ذكرناه؟", "opts": ["النقد الأسطوري", "تاريخ الطباعة", "علم العروض"], "ans": 0, "why": "النقد الأسطوري", "i": 13, "ex": ["صح: المقال الثالث عن النقد الأسطوري أو الأنماط الأصلية (<span class=\"en\">Archetypal Criticism<\/span>).", "غلط: لا علاقة للكتاب بتاريخ الطباعة.", "غلط: العروض موضوع آخر، وليس عنوان مقال في الكتاب."]}, {"t": "mc", "h": "", "q": "عند <span class=\"en\">Bloom<\/span>: الشاعر القوي يسيء قراءة سلفه عن قصد، وهذا اسمه _____.", "opts": ["<span class=\"en\">misprision<\/span>", "<span class=\"en\">onomatopoeia<\/span>", "<span class=\"en\">symbolism<\/span>"], "ans": 0, "why": "<span class=\"en\">misprision<\/span>", "i": 14, "ex": ["صح: <span class=\"en\">misprision<\/span> تعني إساءة القراءة المقصودة، وهي مفهوم مركزي عند <span class=\"en\">Bloom<\/span>.", "غلط: <span class=\"en\">onomatopoeia<\/span> كلمة تحاكي الصوت، مثل <span class=\"en\">buzz<\/span>.", "غلط: <span class=\"en\">symbolism<\/span> مدرسة شعرية ومفهوم الرمز."]}, {"t": "mc", "h": "", "q": "أنماط الحبكة الأربعة عند <span class=\"en\">Frye<\/span> مرتبطة بـ _____.", "opts": ["أنواع القوافي", "الفصول الأربعة", "الأوزان الشعرية"], "ans": 1, "why": "الفصول الأربعة", "i": 15, "ex": ["غلط: لا علاقة للأنماط بالقافية.", "صح: ربط <span class=\"en\">Frye<\/span> الأنماط الأربعة بالفصول: ربيع، صيف، خريف، شتاء.", "غلط: لا علاقة للأنماط بالأوزان."]}, {"t": "write", "h": "", "q": "اذكر سؤالاً واحداً يطرحه ناقد <span class=\"en\">Bloom<\/span> وسؤالاً يطرحه ناقد <span class=\"en\">Frye<\/span> على القصيدة.", "a": "ناقد <span class=\"en\">Bloom<\/span>: من الشاعر السابق الذي تردّ عليه القصيدة؟ ناقد <span class=\"en\">Frye<\/span>: أي نمط أسطوري أو فصل يظهر (رحلة، سقوط، موت وبعث)؟", "key": "intensive-3:essay", "i": 16}, {"t": "end", "h": "", "teaser": "ما درسته: <span class=\"en\">Bloom<\/span> وقلق التأثر وإساءة القراءة، <span class=\"en\">Frye<\/span> والفصول والأنماط، وجسر إلى التاريخ والميثولوجيا. الدرس القادم: مناهج أخرى باختصار.", "extra": "المصادر: Bloom, The Anxiety of Influence (1973) <a href=\"https://en.wikipedia.org/wiki/The_Anxiety_of_Influence\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/The_Anxiety_of_Influence<\/a> ; Frye, Anatomy of Criticism (1957) <a href=\"https://en.wikipedia.org/wiki/Anatomy_of_Criticism\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Anatomy_of_Criticism<\/a> ; Keats, letter to Reynolds, 21 Sept 1819 <a href=\"https://doi.org/10.1093/res/hgae030.\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1093/res/hgae030.<\/a>", "i": 17}];</script>
