<script>window.LESSON_ID="history-6";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"الشعر الديني القديم: <span class=\"en\">Caedmon<\/span> أول شاعر نعرف اسمه، و<span class=\"en\">The Dream of the Rood<\/span>\"<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">✝️<\/span><\/span> في الدروس اللي فاتت شفنا الشعر البطولي (<span class=\"en\">Beowulf<\/span>) وشعر الحنين (الرثاءات). النهاردة الصنف التالت من أصناف العصر القديم: الشعر الديني. وهنقابل فيه حكايتين من أجمل حكايات الأدب كله: راعي بقر مبيعرفش يغني بقى أول شاعر إنجليزي معروف بالاسم، وقصيدة الصليب نفسه هو اللي بيتكلم فيها.<\/div>", "n": 2, "i": 0, "a": "history-6-001", "x": "412b7222"}, {"t": "learn", "h": "<div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: ليه الشعر الديني موجود أصلاً؟<\/div>", "n": 1, "i": 1, "a": "history-6-002", "x": "cdd1a6f6"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> افتكر من درس 2:<\/div><div class=\"li\">المسيحية دخلت إنجلترا سنة 597، والأديرة بقت مراكز الكتابة.<\/div><div class=\"li\">اللي بيكتب ويحفظ الشعر هم الرهبان.<\/div><div class=\"li\">طبيعي إذن إن جزء كبير من اللي وصلنا يكون شعر ديني: قصص من الكتاب المقدس وحياة القديسين، بس مكتوب بنفس موسيقى الشعر القديم (الـ <span class=\"en\">alliteration<\/span> والأساليب اللي اتعلمناها).<\/div>", "n": 3, "i": 2, "a": "history-6-003", "x": "d44e4870"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> مثال يومي:<\/div><div class=\"u\">زي ما المدرسة اللي بتلمّذ فيها بتأثر في طريقتك، \"المدرسة\" الوحيدة المتاحة ساعتها كانت الدير، فكل الأدب طالع منها أو من تحت عينها.<\/div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: حكاية <span class=\"en\">Caedmon<\/span>، المعجزة اللي بدأت الشعر <span class=\"em\"><span class=\"em\">🐄<\/span><\/span><\/div>", "n": 2, "i": 3, "a": "history-6-004", "x": "ae270a0c"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> مصدر الحكاية:<\/div><div class=\"li\">الحكاية دي محفوظة في كتاب واحد: \"التاريخ الكنسي للشعب الإنجليزي\" للمؤرخ البيه <span class=\"en\">Bede<\/span>، اتكتب سنة 731، وتحديداً في الجزء الرابع، الفصل 24.<\/div><div class=\"li\">يعني الحكاية مش أسطورة متداولة، دي مدونة في أهم كتاب تاريخ للعصر.<\/div>", "n": 2, "i": 4, "a": "history-6-005", "x": "07b4710a"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> البطل:<\/div><div class=\"li\"><span class=\"en\">Caedmon<\/span> (كايدمون): راجل كبير في السن، عامل بسيط بيرعى بقر دير <span class=\"en\">Whitby<\/span> في شمال إنجلترا، في زمن رئيسة الدير الأميرة <span class=\"en\">Hild<\/span> (هيلدا).<\/div><div class=\"li\">أمي تماماً، وعمره ما اتعلم أغنية في حياته.<\/div>", "n": 2, "i": 5, "a": "history-6-006", "x": "bb2cb017"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> المشهد المؤلم:<\/div><div class=\"li\">في الحفلات كان العرف إن القيثارة تعدي من إيد لإيد، وكل واحد يغني دوره. (افتكر الـ <span class=\"en\">scop<\/span> والقاعة من درس 2!)<\/div><div class=\"li\"><span class=\"en\">Caedmon<\/span> كل ما يشوف القيثارة جاية ناحيته، يقوم من السفر ويمشي في هدوء، محرج إنه مبيعرفش يغني.<\/div><div class=\"li\">مثال يومي: زي اللي بيهرب من لعبة \"الصراحة\" في القعدة لما الدور يقرب منه.<\/div>", "n": 3, "i": 6, "a": "history-6-007", "x": "c094ad58"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> ليلة المعجزة:<\/div><div class=\"li\">ليلة من الليالي هرب زي العادة، وراح ينام في إسطبل البقر (كان نوبتجي حراسته الليلة دي).<\/div><div class=\"li\">في المنام وقفله واحد وناداه باسمه: \"يا <span class=\"en\">Caedmon<\/span>، غنيلي حاجة.\"<\/div><div class=\"li\">قاله: \"مبعرفش أغني، عشان كده أنا هربان أصلاً.\"<\/div><div class=\"li\">قاله: \"لأ، هتغني.\" سأله: \"أغني إيه؟\" قاله: \"غني عن بدء الخليقة.\"<\/div><div class=\"li\">وفي نفس اللحظة، <span class=\"en\">Caedmon<\/span> غنى أبيات عمره ما سمعها، مديح لله الخالق.<\/div>", "n": 5, "i": 7, "a": "history-6-008", "x": "b1df2964"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الصبح:<\/div><div class=\"li\">حكى للمسؤولين، ولرئيسة الدير <span class=\"en\">Hild<\/span> نفسها. جربوه: قالوله حكاية من الكتاب المقدس، فرجع تاني يوم حولها شعر.<\/div><div class=\"li\"><span class=\"en\">Hild<\/span> قررت قرار تاريخي: خلته يدخل الدير راهب، وشغلته بقى يحول قصص الكتاب المقدس لشعر إنجليزي.<\/div><div class=\"li\">وعشان كده <span class=\"en\">Caedmon<\/span> بيتسمى أول شاعر إنجليزي نعرفه بالاسم.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الكنز اللي فضل: <span class=\"en\">Caedmon's Hymn<\/span><\/div>", "n": 4, "i": 8, "a": "history-6-009", "x": "45f5dfd8"}, {"t": "learn", "h": "<div class=\"li\">الأغنية اللي غناها في المنام محفوظة لحد النهاردة: 9 سطور، وأولها:<\/div><div class=\"u\">\"<span class=\"en\">Nu sculon herigean heofonrices Weard<\/span>\"<\/div><div class=\"u\">يعني: \"النهاردة لازم نسبّح حارس مملكة السماوات.\"<\/div><div class=\"li\">تفصيلة حلوة من <span class=\"en\">Bede<\/span> نفسه: هو كتب المعنى باللاتيني بس، وقال ملحوظة مشهورة: استحالة تترجم شعر حرفياً من لغة للتانية من غير ما يفقد شوية من جماله ووقاره.<\/div><div class=\"li\">يعني <span class=\"en\">Bede<\/span> فهم أزمة الترجمة قبلنا بـ 1300 سنة!<\/div>", "n": 5, "i": 9, "a": "history-6-010", "x": "957f53b4"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Nu sculon herigean _____ Weard<\/div>", "opts": ["herigean", "heofonrices", "swefna"], "ans": 1, "why": "<span class=\"en\">Nu sculon herigean heofonrices Weard<\/span>", "i": 10, "ex": ["غلط: <span class=\"en\">herigean<\/span> موجودة أصلاً في السطر (تعني: نمجّد)، وتكرارها لا يعطي معنى.", "صح: من <span class=\"en\">Caedmon's Hymn<\/span>: <span class=\"en\">Nu sculon herigean heofonrices Weard<\/span>، أي: الآن نمجّد حارس مملكة السماء (<span class=\"en\">heofonrices<\/span> = مملكة السماء).", "غلط: <span class=\"en\">swefna<\/span> في الإنجليزية القديمة تتصل بالأحلام. لا معنى لعبارة 'حارس الأحلام' هنا، فالترنيمة عن الله حارس السماء."]}, {"t": "learn", "h": "<div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: <span class=\"en\">The Dream of the Rood<\/span> (حلم الصليب) <span class=\"em\"><span class=\"em\">🌲<\/span><\/span><\/div>", "n": 1, "i": 11, "a": "history-6-011", "x": "ca9377ee"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> بطاقة القصيدة:<\/div><div class=\"li\">156 سطر، محفوظة في <span class=\"en\">Vercelli Book<\/span> (الكتاب التاني اللي عرفناه في درس 2).<\/div><div class=\"li\">وجزء منها منحوت بالرونز (حروف قديمة) على صليب حجري شهير اسمه <span class=\"en\">Ruthwell Cross<\/span> في اسكتلندا. يعني القصيدة محفوظة في كتاب ومنحوتة على حجر في نفس الوقت.<\/div>", "n": 2, "i": 12, "a": "history-6-012", "x": "675246d2"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الفكرة العبقرية:<\/div><div class=\"li\">القصيدة حلم: واحد شاف في المنام صليب. بس مش أي صليب: الصليب بيتكلم!<\/div><div class=\"li\">أول سطر بيناديك:<\/div><div class=\"u\">\"<span class=\"en\">Hw<\/span>æ<span class=\"en\">t<\/span>! <span class=\"en\">Ic swefna cyst secgan wylle<\/span>\"<\/div><div class=\"u\">يعني: \"اسمع! هحكي أحسن حلم شفته.\"<\/div><div class=\"li\">والصليب يحكي بنفسه قصة الصلب من وجهة نظره هو: إزاي اتقطع من غابته، وإزاي حملوه على كتفه، وإزاي شاف ربه يطلع عليه، وإزاي اهتز واتلطخ بالدم، وبعدين إزاي اتكرم وبقى علامة الفداء.<\/div>", "n": 5, "i": 13, "a": "history-6-013", "x": "95986836"}, {"t": "learn", "h": "<div class=\"li\">\"<span class=\"en\">Rood<\/span>\" كلمة إنجليزية قديمة معناها الصليب.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> ليه دي صادمة وجميلة؟<\/div><div class=\"li\">أولاً: منح صوت لجماد. زي ما تشوف مسلسل الراوي فيه حاجة مش إنسان.<\/div><div class=\"li\">ثانياً: المسيح هنا مش مرسوم ضعيف، مرسوم بطل شاب راكب المعركة بإرادته، والصليب هو \"التابع الوفي\" بتاعه. شايف قيم <span class=\"en\">comitatus<\/span> بتاعت <span class=\"en\">Beowulf<\/span>؟<\/div><div class=\"li\">هنا بتخدم قصة دينية. نفس موسيقى العصر، كلمات جديدة.<\/div>", "n": 5, "i": 14, "a": "history-6-014", "x": "d854bcfd"}, {"t": "learn", "h": "<div class=\"li\">ثالثاً: دي أقدم \"رؤيا منامية\" (<span class=\"en\">dream vision<\/span>) كبيرة في الإنجليزية، والفورم دي هيبقى له مستقبل طويل (هنقابله تاني في العصر الوسيط).<\/div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: إيه اللي يتعلم من الدرس ده؟ <span class=\"em\"><span class=\"em\">🌟<\/span><\/span><\/div><div class=\"u\">١. الشعر الإنجليزي اتولد بمعجزة حسب رواية عصره: أول شاعر معروف بالاسم مكنش شاعر محترف، كان راعي عجوز مبيعرفش يغني. الرسالة: الشعر موهبة بتيجي من فوق، مش حرفة بس.<\/div>", "n": 3, "i": 15, "a": "history-6-015", "x": "50aded16"}, {"t": "learn", "h": "<div class=\"u\">٢. الأديرة هي اللي حفظت وصنعت الأدب المكتوب.<\/div><div class=\"u\">٣. الخليط اللي اتعلمناه في <span class=\"en\">Beowulf<\/span> (بطولة + إيمان) هنا بقى هو الموضوع نفسه: المسيح بطل، والصليب تابع وفيه.<\/div><div class=\"u\">٤. لما تلاقي في الامتحان \"<span class=\"en\">dream vision<\/span>\" أو \"شاعر مجهول في <span class=\"en\">Vercelli/Exeter<\/span>\" اعرف إنك في العصر القديم.<\/div>", "n": 3, "i": 16, "a": "history-6-016", "x": "730d0ff3"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📝<\/span><\/span> كويز الدرس 6 (مقالي أو بالصوت):<\/div><div class=\"u\">١. احكي حكاية <span class=\"en\">Caedmon<\/span> كاملة من أول هروبه من القاعة لحد قرار <span class=\"en\">Hild.<\/span><\/div><div class=\"u\">٢. مين <span class=\"en\">Bede<\/span>؟ وإيه الكتاب اللي وصلتنا منه الحكاية؟<\/div><div class=\"u\">٣. اكتب (أو احكي) أول سطر من نشيد <span class=\"en\">Caedmon<\/span> وترجمه، وقول ليه <span class=\"en\">Bede<\/span> رفض يترجم النشيد حرفياً.<\/div><div class=\"u\">٤. في <span class=\"en\">The Dream of the Rood<\/span> مين الراوي؟ وليه اختيار الراوي ده عبقري؟<\/div>", "n": 4, "i": 17, "a": "history-6-017", "x": "1bfd22ee"}, {"t": "learn", "h": "<div class=\"u\">٥. قارن: إزاي قيم عالم <span class=\"en\">Beowulf<\/span> (الولاء والبطولة) ظهرت في قصيدة دينية؟ ادي مثال واحد واضح.<\/div>", "n": 1, "i": 18, "a": "history-6-018", "x": "5c6772ff"}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">🧩<\/span><\/span> ألغاز العصر القديم ونهاية المحطة الأولى: مراجعة كاملة للمستوى الأول وامتحانه.", "extra": "<span class=\"em\"><span class=\"em\">🔗<\/span><\/span> مصادر الدرس:<ul><li>حكاية <span class=\"en\">Caedmon<\/span> من <span class=\"en\">Bede<\/span> (كتاب 4 فصل 24) بترقيم النسخ العلمية الحديثة.<\/li><li>تفاصيل <span class=\"en\">The Dream of the Rood<\/span> و<span class=\"en\">Ruthwell Cross<\/span> من موسوعة أكسفورد وصفحة أكسفورد للشعر القديم.<\/li><\/ul>", "i": 19}];</script>
