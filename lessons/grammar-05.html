<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: من الصفر</span><span class="tag">درس ٥</span><span class="tag"><span class="em">🧩</span> القواعد الأكاديمية</span></div>

<script>window.LESSON_ID="grammar-05";window.STEPS=[{"t": "section", "h": "مصنع بخمس أقسام", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في الدرس الخامس. لما تقول جملة، بتحصل خمس حاجات في نفس الوقت. تخيل مصنع بخمس أقسام.</div>", "n": 1, "i": 1, "a": "grammar-05-001", "x": "44203cda"}, {"t": "learn", "h": "<div class=\"u\">القسم الأول الأصوات، <span class=\"en\">phonology</span>: الحروف والنطق. التاني الكلمات، <span class=\"en\">morphology</span>: بناء الكلمة من أجزاء. التالت الجملة، <span class=\"en\">syntax</span>: ترتيب الكلمات. الرابع المعنى، <span class=\"en\">semantics</span>: إيه معنى الجملة حرفيًا. والخامس الاستخدام، <span class=\"en\">pragmatics</span>: إيه اللي المتكلم يقصده فعلًا.</div>", "n": 1, "i": 2, "a": "grammar-05-002", "x": "5f20277a"}, {"t": "learn", "h": "<div class=\"u\">مثال: واحد قالك وانتو على السفرة: عندك ملح؟ الأصوات والكلمات والجملة والمعنى كلهم بيقولوا سؤال. بس الاستخدام بيقول: ادّيني الملح.</div>", "n": 1, "i": 3, "a": "grammar-05-003", "x": "e382b168"}, {"t": "mc", "q": "«عندك ملح؟» والمقصود «ادّيني الملح». ده مستوى:", "opts": ["<span class=\"en\">syntax</span>", "<span class=\"en\">semantics</span>", "<span class=\"en\">pragmatics</span>"], "ans": 2, "why": "المعنى المقصود في السياق.", "ex": ["غلط: النحو بيقول إنها سؤال.", "غلط: الدلالة بتقول سؤال عن وجود الملح.", "صح: <span class=\"en\">pragmatics</span>: المعنى المقصود في المقام."], "n": 1, "i": 4, "h": ""}, {"t": "section", "h": "الأصوات والصرف", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">الأصوات، <span class=\"en\">phonology</span>، هي نظام الأصوات اللي بتفرق بين المعاني. مثال: جمع الاسم في الإنجليزي بيتنطق بتلات أشكال. <span class=\"en\">s</span> في <span class=\"en\">cats</span>، و<span class=\"en\">z</span> في <span class=\"en\">dogs</span>، و<span class=\"en\">iz</span> في <span class=\"en\">buses</span>. والاختيار بيعتمد على الصوت الأخير في الكلمة.</div>", "n": 1, "i": 6, "a": "grammar-05-004", "x": "965d377b"}, {"t": "learn", "h": "<div class=\"u\">الصرف، <span class=\"en\">morphology</span>، هو بناء الكلمة من مورفيمات. كلمة <span class=\"en\">unhappiness</span> مكونة من <span class=\"en\">un</span> و<span class=\"en\">happy</span> و<span class=\"en\">ness</span>. والمورفيم بتاع الجمع واحد، بس له أشكال، اسمها <span class=\"en\">allomorphs</span>.</div>", "n": 1, "i": 7, "a": "grammar-05-005", "x": "0ed83474"}, {"t": "mc", "q": "في كلمة <span class=\"en\">unhappiness</span>، إيه عدد المورفيمات؟", "opts": ["اتنين", "تلاتة", "واحد"], "ans": 1, "why": "<span class=\"en\">un</span> + <span class=\"en\">happy</span> + <span class=\"en\">ness</span>.", "ex": ["غلط: فيه تلات أجزاء.", "صح: <span class=\"en\">un</span> و <span class=\"en\">happy</span> و <span class=\"en\">ness</span>.", "غلط: الكلمة مركبة."], "n": 1, "i": 8, "h": ""}, {"t": "section", "h": "النحو والدلالة والتداولية", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">النحو، <span class=\"en\">syntax</span>، ترتيب الكلمات وتكوين العبارات والجمل. <span class=\"en\">The dog bit the man</span> مش <span class=\"en\">The man bit the dog</span>. الدلالة، <span class=\"en\">semantics</span>، المعنى الحرفي للكلمات والجمل، بغض النظر عن السياق. كلمة <span class=\"en\">bachelor</span> معناها رجل غير متزوج. والتداولية، <span class=\"en\">pragmatics</span>، هي المعنى في السياق. نفس الجملة معناها يختلف حسب مين قالها ولمين.</div>", "n": 1, "i": 10, "a": "grammar-05-006", "x": "cbe549c4"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">لكل مستوى أربع زوايا. الشكل، الوظيفة، المعنى، الاستعمال. في الأصوات: الشكل أصوات، والوظيفة تمييز الكلمات. في الصرف: الشكل مورفيمات، والوظيفة بناء كلمات. في النحو: الشكل عبارات وجمل، والوظيفة بناء علاقات بين الكلمات. وفي الدلالة: الشكل معاني، والوظيفة وصف العالم. وفي التداولية: الشكل ملفوظات، والوظيفة تحقيق نية المتكلم.</div>", "n": 1, "i": 12, "a": "grammar-05-007", "x": "bdfffdf2"}, {"t": "section", "h": "التداخل بين المستويات", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">المستويات مش جزر منفصلة. فيه تداخل بين الصرف والأصوات: المورفيم واحد، والنطق بيتغير. وفيه تداخل بين النحو والدلالة: <span class=\"en\">Colorless green ideas sleep furiously</span>، النحو سليم والدلالة غريبة. وفيه تداخل بين الدلالة والتداولية. جملة <span class=\"en\">Some students passed</span> معناها الحرفي على الأقل البعض نجح، لكن في الاستخدام بتفهمها إن مش كلهم نجحوا.</div>", "n": 1, "i": 14, "a": "grammar-05-008", "x": "d3c05542"}, {"t": "mc", "q": "جمع <span class=\"en\">cats</span> بينطق /<span class=\"en\">s</span>/ وجمع <span class=\"en\">dogs</span> بينطق /<span class=\"en\">z</span>/. ده موضوع:", "opts": ["الواجهة بين الصرف والأصوات", "التداولية", "الدلالة وحدها"], "ans": 0, "why": "المورفيم واحد والنطق بيتغير.", "ex": ["صح: <span class=\"en\">allomorphs</span> للجمع، والاختيار صوتي.", "غلط: مفيش مقصد متكلم هنا.", "غلط: مش مسألة معنى."], "n": 1, "i": 15, "h": ""}, {"t": "tf", "q": "جملة <span class=\"en\">Some students passed</span> معناها الحرفي «مش كلهم».", "ans": false, "why": "غلط: المعنى الحرفي «على الأقل بعض»، و«مش كلهم» استلزام.", "ex": ["غلط: «مش كلهم» بتيجي من الاستخدام.", "صح، الجملة غلط: الحرفي «على الأقل بعض»."], "n": 1, "i": 16, "h": ""}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">في التداولية، <span class=\"en\">Austin</span> سنة 1962 لاحظ إن الكلام مش بس وصف، ممكن يكون فعل. لما تقول <span class=\"en\">I promise</span>، إنت بتعمل وعد. دي اسمها <span class=\"en\">speech acts</span>، أفعال الكلام.</div>", "n": 1, "i": 18, "a": "grammar-05-009", "x": "12c626d8"}, {"t": "mc", "q": "مين صاحب فكرة <span class=\"en\">speech acts</span>؟", "opts": ["<span class=\"en\">Grice</span>", "<span class=\"en\">Austin</span>", "<span class=\"en\">Chomsky</span>"], "ans": 1, "why": "<span class=\"en\">Austin 1962</span>.", "ex": ["غلط: <span class=\"en\">Grice</span> صاحب مبدأ التعاون والاستلزام.", "صح: <span class=\"en\">Austin</span>، كتاب <span class=\"en\">How to Do Things with Words</span>.", "غلط: تشومسكي اشتغل على النحو التوليدي."], "n": 1, "i": 19, "h": ""}, {"t": "learn", "h": "<div class=\"u\">و<span class=\"en\">Grice</span> سنة 1975 قال إن المحادثة بتمشي على مبدأ التعاون، <span class=\"en\">Cooperative Principle</span>. وعلى أساسه بنفهم <span class=\"en\">implicature</span>: معنى بنفهمه من غير ما يتقال حرفيًا. لو واحد سألك فين المحل، وقلت له فيه بنزينة في آخر الشارع، هيفهم إن المحل هناك.</div>", "n": 1, "i": 20, "a": "grammar-05-010", "x": "bab55daf"}, {"t": "section", "h": "ليه المستويات مش منفصلة تمامًا", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">سؤال بحثي كبير: هل كل مستوى نظام مستقل، <span class=\"en\">modular</span>، ولا بيتداخلوا؟ بعض النظريات بتفصل النحو عن الدلالة بحدة، وبعضها بتجمعهم. والأبحاث بتتكتب على الواجهات، <span class=\"en\">interfaces</span>، بين مستويين، زي <span class=\"en\">syntax-semantics</span> و<span class=\"en\">semantics-pragmatics</span> و<span class=\"en\">morphology-phonology</span>.</div>", "n": 1, "i": 22, "a": "grammar-05-011", "x": "5d7ae11a"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس بسرعة. <span class=\"en\">Phonology</span>: علم الأصوات الوظيفي. <span class=\"en\">Phoneme</span>: فونيم، أصغر وحدة صوتية بتفرق المعنى. <span class=\"en\">Morphology</span>: الصرف. <span class=\"en\">Morpheme</span>: مورفيم. <span class=\"en\">Allomorph</span>: ألومورف، شكل من أشكال المورفيم. <span class=\"en\">Syntax</span>: النحو. <span class=\"en\">Semantics</span>: الدلالة. <span class=\"en\">Pragmatics</span>: التداولية. <span class=\"en\">Speech act</span>: فعل كلام. <span class=\"en\">Implicature</span>: استلزام تخاطبي.</div>", "n": 1, "i": 24, "a": "grammar-05-012", "x": "b8d47ac1"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Cooperative Principle</span>: مبدأ التعاون. <span class=\"en\">Interface</span>: واجهة بين مستويين. <span class=\"en\">Modularity</span>: استقلال المستويات.</div>", "n": 1, "i": 25, "a": "grammar-05-013", "x": "62872907"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: اللغة خمس مستويات: أصوات، صرف، نحو، دلالة، تداولية. اتنين: لكل مستوى شكل ووظيفة ومعنى واستخدام. تلاتة: المستويات بتتداخل، والبحث بيتكتب على الواجهات. أربعة: التداولية بتفسر المعنى المقصود عن طريق أفعال الكلام والاستلزام. الدرس الجاي: الكلمة والجملة والملفوظ.</div>", "n": 1, "i": 27, "a": "grammar-05-014", "x": "9d08c584"}, {"t": "tf", "q": "المستويات الخمسة منفصلة تمامًا عن بعض.", "ans": false, "why": "غلط: بتتداخل، والبحث بيتكتب على الواجهات.", "ex": ["غلط: فيه واجهات زي <span class=\"en\">syntax-semantics</span>.", "صح، الجملة غلط: المستويات بتتفاعل."], "n": 1, "i": 28, "h": ""}, {"t": "section", "h": "الكويز", "n": 1, "i": 29}, {"t": "recall", "q": "اذكر المستويات الخمسة بالترتيب.", "a": "<span class=\"en\">phonology</span> (الأصوات)، <span class=\"en\">morphology</span> (الصرف)، <span class=\"en\">syntax</span> (النحو)، <span class=\"en\">semantics</span> (الدلالة)، <span class=\"en\">pragmatics</span> (التداولية).", "n": 1, "i": 30, "h": ""}, {"t": "recall", "q": "اشرح الـ <span class=\"en\">implicature</span> بمثال.", "a": "معنى بنفهمه من غير ما يتقال حرفيًا. مثال: لو سألك واحد فين المحل وقلت فيه بنزينة في آخر الشارع، هيفهم إن المحل هناك.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "طبّق المستويات الخمسة على جملة «<span class=\"en\">Can you pass the salt</span>?» (٥ جمل).", "key": "grammar-05:1", "a": "صوتيًا: أصوات الجملة وتنغيمها كسؤال. صرفيًا: <span class=\"en\">can</span> فعل مساعد و<span class=\"en\">pass</span> فعل و<span class=\"en\">salt</span> اسم. نحويًا: شكلها سؤال بنمط <span class=\"en\">yes</span>/<span class=\"en\">no</span>. دلاليًا: سؤال عن القدرة. تداوليًا: طلب مؤدب لمناولة الملح.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "ناقش بجمل قليلة: هل المستويات نظام مستقل أم متداخل؟ (٤-٥ جمل).", "key": "grammar-05:2", "a": "بعض النظريات بتعتبر كل مستوى نظام مستقل (<span class=\"en\">modular</span>). لكن فيه واجهات بين المستويات، زي الجمع (صرف وأصوات)، وزي <span class=\"en\">some</span> (دلالة وتداولية). فالبحث بيتكتب على الواجهات دي، والسؤال لسه مفتوح.", "n": 1, "i": 33, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكلمة والجملة والملفوظ.</div><div class=\"u\">هنفرق بين <span class=\"en\">word</span> و<span class=\"en\">phrase</span> و<span class=\"en\">clause</span> و<span class=\"en\">sentence</span> و<span class=\"en\">utterance</span>.</div>", "extra": "المصادر: Austin (1962); Grice (1975); standard phonetics textbook descriptions of English plural allomorphs.", "i": 34}];</script>
