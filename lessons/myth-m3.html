<h1>الدرس M3: أعمار البشر الخمسة (Hesiod)</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس M3</span><span class="tag"><span class="em">🏛️</span> كورس الميثولوجيا</span></div>

<script>window.LESSON_ID="myth-m3";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 1) الفكرة في سطر: الإنسان بينزل مش بيطلع</div><div class=\"li\">مثال من حياتنا: جدك بيقول \"زمان كان الناس أحنّ على بعض والعيشة أرخص والدنيا أمان\". كل جيل بيقول الكلام ده.</div><div class=\"li\">الفكرة دي عمرها أكتر من 2700 سنة، وأول واحد كتبها شاعر إغريقي اسمه <span class=\"en\">Hesiod</span>: البشرية مش بتتقدم، البشرية بتنزل من عصر أحلى لعصر أسوأ.</div>", "n": 3, "i": 0, "a": "myth-m3-001", "x": "95eb49b7"}, {"t": "learn", "h": "<div class=\"li\">كل عصر اسمه معدن: ذهب <span class=\"em\"><span class=\"em\">←</span></span> فضة <span class=\"em\"><span class=\"em\">←</span></span> برونز <span class=\"em\"><span class=\"em\">←</span></span> (أبطال) <span class=\"em\"><span class=\"em\">←</span></span> حديد. لاحظ: المعدن بيرخص، يعني القيمة بتقل.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 2) العصر الذهبي (<span class=\"en\">The Golden Age</span>)</div><div class=\"u\"><span class=\"en\">Hesiod</span> بيقول بالحرف (<span class=\"en\">Works and Days 109-120</span>):</div>", "n": 3, "i": 1, "a": "myth-m3-002", "x": "cee7344d"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">First of all the deathless gods who dwell on Olympus made a golden race of mortal men who lived in the time of Cronos when he was reigning in heaven.</span> <span class=\"en\">And they lived like gods without sorrow of heart,</span> <span class=\"en\">remote and free from toil and grief</span>: <span class=\"en\">miserable age rested not on them.</span>..\"</div><div class=\"li\">زمان ما <span class=\"en\">Cronos</span> (<span class=\"en\">Saturn</span>) كان لسه الملك — افتكر الدرس اللي فات.</div>", "n": 2, "i": 2, "a": "myth-m3-003", "x": "858014ef"}, {"t": "learn", "h": "<div class=\"li\">عاشوا زي الآلهة: لا شغل، لا شقى، لا شيخوخة. الأرض بتطلّع أكل لوحدها.</div><div class=\"li\">لما ماتوا، ماتوا \"كأنهم ناموا\"، وبقوا أرواح طيبة حارسة للبشر.</div><div class=\"li\">ملحوظة مهمة للامتحان: لما تقرا \"<span class=\"en\">golden age</span>\" في أي نص إنجليزي، دي الإشارة الأصلية.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 3) العصر الفضي (<span class=\"en\">The Silver Age</span>)</div><div class=\"li\">\"أقل نبلاً بكتير\" حسب تعبير <span class=\"en\">Hesiod.</span></div><div class=\"li\">الطفل بيفضل طفل يلعب جنب أمه مية سنة، وبعدين يعيش شوية صغيرين في هم.</div>", "n": 6, "i": 3, "a": "myth-m3-004", "x": "3a39a0d7"}, {"t": "learn", "h": "<div class=\"li\">خطيتهم: ماعبدوش الآلهة ولا قدموا قربان، فـ <span class=\"en\">Zeus</span> خبّاهم تحت الأرض.</div><div class=\"li\">القاعدة: النزول مش بس في الجسم، النزول في الأخلاق.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 4) العصر البرونزي (<span class=\"en\">The Bronze Age</span>)</div><div class=\"li\">اتخلقوا من أشجار الدردار (<span class=\"en\">ash trees</span>)، وكل همهم الحرب والعنف.</div><div class=\"li\">أكلوا بعض ودمّروا بعض، فنزلوا العالم السفلي بلا اسم ولا ذكر.</div><div class=\"li\">لاحظ التصعيد: الذهبيين بقوا حراس، الفضيين اتخبّوا، البرونزيين راحوا بالكلية.</div>", "n": 6, "i": 4, "a": "myth-m3-005", "x": "f135d5b6"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 5) عصر الأبطال (<span class=\"en\">The Age of Heroes</span>) — الاستثناء الوحيد</div><div class=\"li\"><span class=\"en\">Hesiod</span> بيكسر سلسلة المعادن هنا ويحط عصر \"أنبل وأعدل\" من اللي قبله: عصر أنصاف الآلهة.</div><div class=\"li\">دول أبطال طروادة وحرب طيبة (<span class=\"en\">Oedipus</span> وعيلته — هناخدهم في المستوى الرابع).</div><div class=\"li\">ماتوا في الحروب، و<span class=\"en\">Zeus</span> نقلهم لـ \"جزر المباركين\" (<span class=\"en\">Isles of the Blest</span>) على أطراف الأرض.</div>", "n": 4, "i": 5, "a": "myth-m3-006", "x": "41542978"}, {"t": "learn", "h": "<div class=\"li\">ليه الاستثناء ده مهم؟ لأنه بيثبت إن <span class=\"en\">Hesiod</span> بيشرح الملاحم اللي الناس بتحفظها (هوميروس)، مش بس بيبكي على الماضي.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 6) العصر الحديدي (<span class=\"en\">The Iron Age</span>) — عصرنا احنا</div><div class=\"li\"><span class=\"en\">Hesiod</span> بيقول: يا ريتني مت قبله أو اتولدت بعده.</div><div class=\"li\">شغل وهم نهار، وهلاك ليل. الأب هيخاصم ابنه، والضيف هيخون مضيفه، والقوة هتبقى هي العدل.</div>", "n": 4, "i": 6, "a": "myth-m3-007", "x": "93bff72e"}, {"t": "learn", "h": "<div class=\"li\">آخر حاجة حزينة: في الآخر هتهاجر من الأرض آخر إلهين باقيين مع البشر: <span class=\"en\">Aidos</span> (الحياء) و<span class=\"en\">Nemesis</span> (الغضب العادل)، ويسيبوا البشر لوحدهم.</div><div class=\"li\">الصورة دي — \"العدالة بتسيب الأرض\" — هي اللي هتكبر وتدخل الشعر الإنجليزي (شوف قسم الشعر تحت).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌</span></span> 7) نسخة <span class=\"en\">Ovid</span> (أوفيد) — مختلفة في نقطتين</div>", "n": 3, "i": 7, "a": "myth-m3-008", "x": "791c62f7"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Ovid</span> في <span class=\"en\">Metamorphoses</span> الكتاب 1 عنده أربعة عصور بس: شال عصر الأبطال خالص (ذهبي، فضي، برونزي، حديدي).</div><div class=\"li\">وفي نسخته التدهور سببه فساد البشر نفسهم، والتفاصيل ألطف وأشعر.</div>", "n": 2, "i": 8, "a": "myth-m3-009", "x": "157b3521"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 8) الأسطورة في الشعر الإنجليزي:</div><div class=\"u\">أ) ترجمة <span class=\"en\">Golding</span> لـ <span class=\"en\">Ovid</span> (1567) — ترجمة شكسبير — وصف العصر الذهبي:</div><div class=\"u\">\"<span class=\"en\">Then sprang up first the golden age,</span> <span class=\"en\">which of itself maintained</span></div><div class=\"u\"><span class=\"en\">The truth and right of everything unforced and unconstrained.</span></div><div class=\"u\"><span class=\"en\">There was no fear of punishment,</span> <span class=\"en\">there was no threatening law.</span>..\"</div>", "n": 4, "i": 9, "a": "myth-m3-010", "x": "e6c02bb3"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Then sprang up _____ the golden age,</div>", "opts": ["first", "rested", "magnus"], "ans": 0, "why": "<span class=\"en\">Then sprang up first the golden age,</span>", "i": 10, "ex": ["صح: <span class=\"en\">Then sprang up first the golden age</span>، أي: ثم ظهر أولاً العصر الذهبي. الكلمة <span class=\"en\">first</span> تعني أن العصر الذهبي جاء في البداية.", "غلط: <span class=\"en\">rested</span> تعني استراح، ولا تناسب بعد <span class=\"en\">sprang up</span>.", "غلط: <span class=\"en\">magnus</span> كلمة لاتينية (عظيم)، وليست من النص الإنجليزي."]}, {"t": "learn", "h": "<div class=\"u\">(العصر الذهبي قام الأول، بيحافظ على الحق والعدل من نفسه، من غير قانون ولا تهديد). الصورة: مجتمع مفيش محتاج قاضي أصلاً.</div><div class=\"u\">ب) السلسلة الرومانية: <span class=\"en\">Virgil</span>، <span class=\"en\">Eclogue</span> الرابعة (حوالي 40 ق.م): نبوءة رجوع العصر الذهبي:</div><div class=\"u\">\"<span class=\"en\">iam redit et Virgo,</span> <span class=\"en\">redeunt Saturnia regna</span>\"</div>", "n": 3, "i": 11, "a": "myth-m3-011", "x": "c6f35422"}, {"t": "learn", "h": "<div class=\"u\">(\"العذراء رجعت بالفعل، وحُكم زحل بيرجع\"). الـ <span class=\"en\">Virgo</span> (العذراء) هنا هي <span class=\"en\">Astraea</span>، آلهة العدل اللي سابت الأرض آخر العصر الحديدي. والسطر قبله \"<span class=\"en\">magnus ab integro saeclorum nascitur ordo</span>\" (نظام عظيم للعصور بيتولد من جديد) — منه اتاخد شعار الدولار الأمريكي <span class=\"en\">novus ordo seclorum.</span></div>", "n": 1, "i": 12, "a": "myth-m3-012", "x": "f88a69c3"}, {"t": "learn", "h": "<div class=\"u\">ج) <span class=\"en\">Dryden</span>، قصيدة \"<span class=\"en\">Astraea Redux</span>\" (1660): بيحتفل برجوع الملك تشارلز التاني للعرش: \"العدالة رجعت\" = الملك رجع. العنوان نفسه <span class=\"en\">allusion</span> كامل: رجوع <span class=\"en\">Astraea</span> = رجوع العصر الذهبي. مثال نموذجي إزاي أسطورة بتتستخدم في السياسة.</div><div class=\"u\">د) <span class=\"en\">Milton</span>، \"<span class=\"en\">On the Morning of Christ's Nativity</span>\" (1629): ميلاد المسيح هيصلّح العالم:</div><div class=\"u\">\"<span class=\"en\">Time will run back,</span> <span class=\"en\">and fetch the age of gold</span>\"</div>", "n": 3, "i": 13, "a": "myth-m3-013", "x": "14031b5b"}, {"t": "learn", "h": "<div class=\"u\">(الزمن هيرجع لورا ويجيب عصر الذهب). ميلتون بيستخدم أسطورة وثنية عشان يقول وعد مسيحي — نفس حركته مع الـ \"<span class=\"en\">Heav'nly Muse</span>\" في <span class=\"en\">M1.</span></div><div class=\"u\">هـ) <span class=\"en\">Shelley</span>، الكورس الختامي لملحمة \"<span class=\"en\">Hellas</span>\" (1822):</div><div class=\"u\">\"<span class=\"en\">The world's great age begins anew,</span></div><div class=\"u\"><span class=\"en\">The golden years return</span>\"</div>", "n": 4, "i": 14, "a": "myth-m3-014", "x": "d185be99"}, {"t": "learn", "h": "<div class=\"u\">(عصر العالم العظيم بيبدأ من جديد، سنين الذهب بترجع). <span class=\"en\">Shelley</span> الثوري بيحلم بعودة العصر الذهبي بثورة إنسانية مش بمعجزة.</div>", "n": 1, "i": 15, "a": "myth-m3-015", "x": "a482460a"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌</span></span> 9) كلمات وتعبيرات من درس النهارده:</div><div class=\"u\">\"<span class=\"en\">the golden age of.</span>..\" بقت تعبير إنجليزي عادي لحد النهارده: <span class=\"en\">the golden age of television</span> / <span class=\"en\">of Hollywood</span> — أي فترة القمة في أي حاجة. • <span class=\"en\">Saturnia regna</span> (حُكم زحل) • <span class=\"en\">Astraea</span> (اسم بنات وكويكب ومجلات).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">✏️</span></span> كويز <span class=\"en\">M3</span> (بعد ٣٠ دقيقة — جاوب مقالي أو بفويس):</div>", "n": 2, "i": 16, "a": "myth-m3-016", "x": "c37e5f11"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">the _____ age of.</div>", "opts": ["golden", "miserable", "great"], "ans": 0, "why": "<span class=\"en\">the golden age of.</span>", "i": 17, "ex": ["صح: الجملة تتحدث عن العصر الذهبي (<span class=\"en\">the golden age</span>)، أول عصور البشر في أسطورة <span class=\"en\">Ovid</span>.", "غلط: <span class=\"en\">miserable</span> تعني بائساً، وهي عكس العصر الذهبي الذي كان زمن سلام ورخاء.", "غلط: <span class=\"en\">great</span> صفة صحيحة نحوياً، لكن اسم العصر في الأسطورة هو <span class=\"en\">the golden age</span>، لا <span class=\"en\">the great age</span>."]}, {"t": "learn", "h": "<div class=\"u\">١) اكتب الأعمار الخمسة بالترتيب، وقول مين العصر اللي بيكسر السلسلة وليه.</div><div class=\"u\">٢) اشرح بالتفصيل حياة العصر الذهبي عند <span class=\"en\">Hesiod</span>، وإيه مصير أهله بعد الموت.</div><div class=\"u\">٣) إيه الفرق بين نسخة <span class=\"en\">Hesiod</span> ونسخة <span class=\"en\">Ovid</span> (نقطتين)؟</div><div class=\"u\">٤) وصّل السلسلة: <span class=\"en\">Astraea</span> عند <span class=\"en\">Hesiod</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Virgil</span> <span class=\"em\"><span class=\"em\">←</span></span> <span class=\"en\">Dryden.</span> ليه عنوان \"<span class=\"en\">Astraea Redux</span>\" اختيار سياسي ذكي؟</div>", "n": 4, "i": 18, "a": "myth-m3-017", "x": "ae7f4dd9"}, {"t": "learn", "h": "<div class=\"u\">٥) ترجم واشرح \"<span class=\"en\">Time will run back,</span> <span class=\"en\">and fetch the age of gold</span>\"، وقول إزاي ميلتون بيستخدم أسطورة وثنية في قصيدة مسيحية.</div>", "n": 1, "i": 19, "a": "myth-m3-018", "x": "48aac934"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🔗</span></span> روابط:</div><div class=\"li\"><span class=\"en\">Hesiod,</span> <span class=\"en\">Works and Days</span> (ترجمة <span class=\"en\">Evelyn-White</span>، الأسطر 109-201): <a class=\"en\" href=\"https://www.theoi.com/Text/HesiodWorksDays.html\" target=\"_blank\" rel=\"noopener\">https://www.theoi.com/Text/HesiodWorksDays.html</a></div><div class=\"li\"><span class=\"en\">Dryden,</span> <span class=\"en\">Astraea Redux</span> النص الكامل: <a class=\"en\" href=\"https://poets.org/poem/astraea-redux\" target=\"_blank\" rel=\"noopener\">https://poets.org/poem/astraea-redux</a></div><div class=\"li\"><span class=\"en\">Shelley,</span> <span class=\"en\">Hellas</span>: <span class=\"en\">Chorus</span>: <a class=\"en\" href=\"https://www.poetryfoundation.org/poems/45121/hellas-chorus\" target=\"_blank\" rel=\"noopener\">https://www.poetryfoundation.org/poems/45121/hellas-chorus</a></div>", "n": 3, "i": 20, "a": "myth-m3-019", "x": "1bdcb70e"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Milton,</span> <span class=\"en\">On the Morning of Christ's Nativity</span>: <a class=\"en\" href=\"https://www.poetryfoundation.org/poems/44735/on-the-morning-of-christs-nativity\" target=\"_blank\" rel=\"noopener\">https://www.poetryfoundation.org/poems/44735/on-the-morning-of-christs-nativity</a></div><div class=\"li\"><span class=\"en\">Virgil,</span> <span class=\"en\">Eclogue 4</span> (نص لاتيني مع شرح): <a class=\"en\" href=\"https://users.pfw.edu/flemingd/MYTHNOTES/Eclogue4.htm\" target=\"_blank\" rel=\"noopener\">https://users.pfw.edu/flemingd/MYTHNOTES/Eclogue4.htm</a></div>", "n": 2, "i": 21, "a": "myth-m3-020", "x": "289bd148"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🖼️</span></span> صور مقترحة للكتاب:</div><div class=\"li\">\"<span class=\"en\">The Golden Age</span>\" لـ <span class=\"en\">Lucas Cranach the Elder</span> (<span class=\"en\">Wikimedia Commons</span>)</div><div class=\"li\">\"<span class=\"en\">The Golden Age</span>\" فسيفساء <span class=\"en\">Pietro da Cortona</span> في <span class=\"en\">Palazzo Pitti</span> (<span class=\"en\">Wikimedia Commons</span>)</div><div class=\"li\">تمثال <span class=\"en\">Astraea</span> أو أي رسم لـ <span class=\"en\">Virgo/Dike</span> وهي صاعدة للسماء</div>", "n": 3, "i": 22, "a":
