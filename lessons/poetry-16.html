<script>window.LESSON_ID="poetry-16";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">النهاردة هنتعلم إزاي الشاعر \"يرسم\" بالكلمات، وبيخليك تشوف وتسمع وتشم وتدوق وتلمس من غير ما تتحرك من مكانك! <span class=\"em\"><span class=\"em\">👀👂👃👅✋</span></span></div>", "n": 1, "i": 0, "a": "poetry-16-001", "x": "18249c9a"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ١: النقطة الأولى — إيه هو الـ <span class=\"en\">imagery</span>؟ <span class=\"em\"><span class=\"em\">🤔</span></span>", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١) التعريف</div><div class=\"u\">١.١ الـ <span class=\"en\">imagery</span> (الصورة الشعرية) = لغة بتخاطب الحواس: كلمات بتخليك تتخيل صورة أو إحساس في دماغك.</div><div class=\"u\">١.٢ كلمة <span class=\"en\">image</span> يعني صورة، بس مش لازم تتشاف بالعين، ممكن صوت أو ريحة أو طعم.</div><div class=\"u\">١.٣ الاسم اليوناني القديم ليها: <span class=\"en\">enargia</span> (إنارجيا). (المصدر: <span class=\"en\">Wikipedia - Imagery</span>)</div><div class=\"u\">٢) مقارنة بسيطة (من تأليفي للتوضيح)</div>", "n": 5, "i": 2, "a": "poetry-16-002", "x": "db5b503b"}, {"t": "learn", "h": "<div class=\"u\">٢.١ بدل ما تقول \"الأكل حلو\" (معلومة)، تقول \"ريحة الفراخ المحمرة بتملا الشارع، والجلد مقرمش سخن\" (صورة بتخليك تحس).</div><div class=\"u\">٢.٢ بدل \"كان الجو بارد\"، \"الهوا كان بيقرص وشي زي سكاكين التلج\". كده مش بس عرفت، حسّيت.</div><div class=\"u\">٣) لو الشاعر قالك الإحساس مباشرة، ده \"قول\". لو خلاك تحس، ده <span class=\"en\">imagery.</span> وكلمة السر في الشعر: <span class=\"en\">Show,</span> <span class=\"en\">don't tell</span> (وريني، متقولش).</div>", "n": 3, "i": 3, "a": "poetry-16-003", "x": "d53ea9d7"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٢: النقطة التانية — الحواس الخمسة وأنواع الصور <span class=\"em\"><span class=\"em\">🖐️</span></span>", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">١) خمسة أنواع أساسية (حسب <span class=\"en\">Wikipedia</span>)</div><div class=\"u\">١.١ <span class=\"em\"><span class=\"em\">👀</span></span> <span class=\"en\">visual</span> (بصرية): ألوان، شكل، مشهد. أكتر نوع شائع.</div><div class=\"u\">١.٢ <span class=\"em\"><span class=\"em\">👂</span></span> <span class=\"en\">auditory</span> (سمعية): أصوات، موسيقى، ضجة. (ساعات بتيجي في شكل <span class=\"en\">onomatopoeia</span> اللي خدناها.)</div><div class=\"u\">١.٣ <span class=\"em\"><span class=\"em\">👃</span></span> <span class=\"en\">olfactory</span> (شمّية): ريحة، عطر.</div><div class=\"u\">١.٤ <span class=\"em\"><span class=\"em\">👅</span></span> <span class=\"en\">gustatory</span> (ذوقية): طعم.</div><div class=\"u\">١.٥ <span class=\"em\"><span class=\"em\">✋</span></span> <span class=\"en\">tactile</span> (لمسية): ملمس، سخونة، برودة، نعومة.</div><div class=\"u\">٢) أنواع تانية</div><div class=\"u\">٢.١ <span class=\"en\">kinesthetic</span>: حركة (جري، رقص).</div>", "n": 8, "i": 5, "a": "poetry-16-004", "x": "437b83f2"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ <span class=\"en\">organic</span>: إحساس جسم الشخصية: جوع، عطش، تعب، ألم.</div><div class=\"u\">٢.٣ <span class=\"en\">color imagery</span>: إنك تتخيل لون وهو مش قدامك.</div><div class=\"u\">٣) تمرين تفكير سريع <span class=\"em\"><span class=\"em\">🧠</span></span>: بص حوالين دلوقتي: إيه الصورة الشمّية في الأوضة؟ إيه الصوت الأقرب؟ كده إنت بتعمل <span class=\"en\">imagery</span>!</div>", "n": 3, "i": 6, "a": "poetry-16-005", "x": "06bfdd23"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٣: النقطة التالتة — أمثلة من قصايد معانا <span class=\"em\"><span class=\"em\">📜</span></span>", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">١) <span class=\"em\"><span class=\"em\">👀</span></span> بصري: <span class=\"en\">The Red Wheelbarrow</span> (<span class=\"en\">William Carlos Williams</span>):</div><div class=\"u\">\"<span class=\"en\">so much depends</span> / <span class=\"en\">upon</span> // <span class=\"en\">a red wheel</span> / <span class=\"en\">barrow</span> // <span class=\"en\">glazed with rain</span> / <span class=\"en\">water</span> // <span class=\"en\">beside the white</span> / <span class=\"en\">chickens</span>\"</div><div class=\"u\">١.١ أحمر (<span class=\"en\">red</span>)، أبيض (<span class=\"en\">white</span>)، لامع بالمطر (<span class=\"en\">glazed with rain water</span>). صورة بصرية في ٨ سطور بس، من غير أي تفسير.</div>", "n": 3, "i": 8, "a": "poetry-16-006", "x": "d53c60f8"}, {"t": "learn", "h": "<div class=\"lead\">٢) <span class=\"em\"><span class=\"em\">👂</span></span> سمعي: <span class=\"en\">The Raven</span> (<span class=\"en\">Poe</span>):</div><div class=\"u\">\"<span class=\"en\">suddenly there came a tapping,</span> / <span class=\"en\">As of some one gently rapping,</span> <span class=\"en\">rapping at my chamber door.</span>\"</div><div class=\"u\">٢.١ <span class=\"en\">tapping</span> و<span class=\"en\">rapping</span>: صوت دق خفيف على الباب، وتكراره (<span class=\"en\">rapping,</span> <span class=\"en\">rapping</span>) بيخليك تسمعه.</div>", "n": 2, "i": 9, "a": "poetry-16-007", "x": "f38896f3"}, {"t": "learn", "h": "<div class=\"lead\">٣) <span class=\"em\"><span class=\"em\">✋</span></span> لمسي (برودة): <span class=\"en\">The Bells</span> (<span class=\"en\">Poe</span>):</div><div class=\"u\">\"<span class=\"en\">How they tinkle,</span> <span class=\"en\">tinkle,</span> <span class=\"en\">tinkle,</span> / <span class=\"en\">In the icy air of night</span>!\"</div><div class=\"u\">٣.١ <span class=\"en\">tinkle</span> = صوت (سمعي)، و <span class=\"en\">icy air</span> = هوا ساقع (لمسي). يعني الجرس والبرد مع بعض. صورتين في سطرين.</div>", "n": 2, "i": 10, "a": "poetry-16-008", "x": "29ebe849"}, {"t": "learn", "h": "<div class=\"lead\">٤) <span class=\"em\"><span class=\"em\">✋👀</span></span> <span class=\"en\">Shakespeare</span>، <span class=\"en\">Sonnet 18</span>:</div><div class=\"u\">\"<span class=\"en\">Rough winds do shake the darling buds of May</span>\"</div><div class=\"u\">٤.١ <span class=\"en\">rough</span> = خشن (لمسي). <span class=\"en\">shake</span> = رج (حركة). <span class=\"en\">darling buds</span> = براعم حلوة (بصرية).</div><div class=\"u\">\"<span class=\"en\">Sometime too hot the eye of heaven shines,</span> / <span class=\"en\">And often is his gold complexion dimmed</span>\"</div><div class=\"u\">٤.٢ <span class=\"en\">too hot</span> = سخونة (لمسي)، <span class=\"en\">eye of heaven</span> = الشمس (استعارة ومشخّصة!)، <span class=\"en\">gold complexion</span> = لونها الدهبي (بصرية).</div>", "n": 4, "i": 11, "a": "poetry-16-009", "x": "54ebd953"}, {"t": "learn", "h": "<div class=\"u\">٤.٣ لاحظ: شكسبير بيستخدم الحواس عشان يقول إن الصيف قصير وبيتغير، وحبيبه (المخاطب) أحلى.</div>", "n": 1, "i": 12, "a": "poetry-16-010", "x": "79c8814a"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٤: النقطة الرابعة — إزاي الصورة بتشتغل مع باقي الأدوات؟ <span class=\"em\"><span class=\"em\">🔗</span></span>", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">١) مع التشبيه والاستعارة: بيدّوا الصورة تفاصيل (زي \"<span class=\"en\">gold complexion</span>\" استعارة + صورة بصرية). (<span class=\"en\">Wikipedia</span>: <span class=\"en\">imagery</span> مع <span class=\"en\">metaphors/similes</span> بتدي <span class=\"en\">specificity.</span>)</div><div class=\"u\">٢) مع الإيقاع: بيصنع جو ويظبط السرعة (الدق <span class=\"en\">tapping,</span> <span class=\"en\">rapping</span>).</div><div class=\"u\">٣) مع الرمز (<span class=\"en\">symbolism</span>): الصورة ممكن تكون رمز، زي الوردة في <span class=\"en\">Sick Rose</span> (أحمر = حب؟ وجع؟ قراءة).</div><div class=\"u\">٤) خطوات تحليل <span class=\"en\">imagery</span></div>", "n": 4, "i": 14, "a": "poetry-16-011", "x": "fa830250"}, {"t": "learn", "h": "<div class=\"u\">٤.١ حدد الجملة. ٤.٢ حدد الحاسة (بصر؟ سمع؟ ...). ٤.٣ إيه الإحساس اللي الصورة بتعمله؟ ٤.٤ ليه اختار الشاعر الصورة دي؟ إيه الجو (<span class=\"en\">mood</span>)؟</div><div class=\"u\">٥) نصيحة <span class=\"em\"><span class=\"em\">⚡</span></span>: الصورة الواحدة قد تلمس أكتر من حاسة. دي اسمها <span class=\"en\">multi-sensory</span> (متعددة الحواس)، زي \"<span class=\"en\">icy air</span>\" و \"<span class=\"en\">tinkle</span>\".</div>", "n": 2, "i": 15, "a": "poetry-16-012", "x": "991a749a"}, {"t": "section", "h": "<span class=\"em\"><span class=\"em\">📄</span></span> صفحة ٥: ملخص + تمرين <span class=\"em\"><span class=\"em\">✅</span></span>", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">١) الملخص</div><div class=\"u\">١.١ <span class=\"en\">imagery</span> = كلام بيخاطب الحواس.</div><div class=\"u\">١.٢ ٥ أنواع: بصر، سمع، شم، ذوق، لمس. وكمان حركة وإحساس جسم.</div><div class=\"u\">١.٣ <span class=\"en\">Show,</span> <span class=\"en\">don't tell.</span></div><div class=\"u\">١.٤ بيتشغل مع التشبيه والاستعارة والإيقاع والرمز.</div><div class=\"u\">٢) <span class=\"em\"><span class=\"em\">✏️</span></span> تمرين</div><div class=\"u\">٢.١ حدد الحاسة في: \"<span class=\"en\">A red wheel barrow glazed with rain water</span>\" و \"<span class=\"en\">icy air of night</span>\" و \"<span class=\"en\">gently rapping</span>\".</div>", "n": 7, "i": 17, "a": "poetry-16-013", "x": "7c2dc830"}, {"t": "learn", "h": "<div class=\"u\">٢.٢ حوّل الجملة دي لصورة تخاطب حاستين على الأقل: \"المطعم كان حلو\".</div><div class=\"u\">٢.٣ اكتب ٤ سطور بتصف مكان بتحبه (أوضتك، الكافيه، الشارع) فيها ٣ حواس مختلفة. وحدد كل حاسة.</div><div class=\"u\">اكتب إجابتك بنفسك الأول، وبعدين راجعها مع الشرح. <span class=\"em\"><span class=\"em\">✍️</span></span></div>", "n": 4, "i": 18, "a": "poetry-16-014", "x": "f2facf22"}, {"t": "recall", "h": "", "q": "اذكر الحواس الخمسة اللي بيخاطبها الـ <span class=\"en\">imagery</span> بالإنجليزي.", "a": "<span class=\"en\">sight</span> (<span class=\"en\">visual)</span>، <span class=\"en\">hearing</span> (<span class=\"en\">auditory)</span>، <span class=\"en\">smell</span> (<span class=\"en\">olfactory)</span>، <span class=\"en\">taste</span> (<span class=\"en\">gustatory)</span>، <span class=\"en\">touch</span> (<span class=\"en\">tactile)</span>.", "n": 1, "i": 19}, {"t": "recall", "h": "", "q": "في \"<span class=\"en\">How they tinkle,</span> <span class=\"en\">tinkle,</span> <span class=\"en\">tinkle,</span> / <span class=\"en\">In the icy air of night</span>!\": إيه الحاسة في <span class=\"en\">tinkle</span>؟ وفي <span class=\"en\">icy air</span>؟", "a": "<span class=\"en\">tinkle</span> = سمعية (صوت). <span class=\"en\">icy air</span> = لمسية (برودة).", "n": 1, "i": 20}, {"t": "recall", "h": "", "q": "يعني إيه <span class=\"en\">Show,</span> <span class=\"en\">don't tell</span>؟", "a": "يعني الشاعر يخليك تحس بالمشهد (يوريك) بدل ما يقولك الإحساس مباشرة.", "n": 1, "i": 21}, {"t": "tf", "h": "", "q": "صح ولا غلط: الصورة الشعرية لازم تتشاف بالعين بس.", "ans": false, "why": "غلط. ممكن صوت أو ريحة أو طعم أو لمس.", "n": 1, "i": 22, "ex": ["الجملة غلط. ممكن صوت أو ريحة أو طعم أو لمس.", "صح، الجملة غلط. ممكن صوت أو ريحة أو طعم أو لمس."]}, {"t": "write", "h": "", "q": "(الفكرة) اشرح بأسلوبك يعني إيه <span class=\"en\">imagery</span> وليه الشعراء بيستخدموها. حوّل جملة \"الجو كان حلو\" لصورة بتخاطب حاستين على الأقل.", "key": "poetry-16:5", "n": 1, "i": 23}, {"t": "write", "h": "", "q": "(تحليل) حلل سطرين من <span class=\"en\">Sonnet 18</span>: \"<span class=\"en\">Rough winds do shake the darling buds of May</span>\" و \"<span class=\"en\">Sometime too hot the eye of heaven shines</span>\". حدد الحواس في كل واحد، وقول إيه الإحساس اللي بيخلقه.", "key": "poetry-16:6", "n": 1, "i": 24}, {"t": "write", "h": "", "q": "(إبداع) اكتب ٤ سطور بتصف مكان بتحبه فيها ٣ حواس مختلفة، وحدد كل حاسة.", "key": "poetry-16:7", "n": 1, "i": 25}, {"t": "end", "h": "", "teaser": "<span class=\"em\"><span class=\"em\">⏳</span></span> الدرس الجاي (الدرس ١٧): <span class=\"en\">symbolism</span> (الرمز): الحاجة اللي معناها أكبر من نفسها.", "extra": "<span class=\"em\"><span class=\"em\">🔗</span></span> للتوسع (اتأكدت منه): <a class=\"en\" href=\"https://en.wikipedia.org/wiki/Imagery\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Imagery</a><span class=\"em\"><span class=\"em\">📚</span></span> المصادر: <span class=\"en\">Wikipedia - Imagery</span>، <span class=\"en\">Poetry Foundation</span> (<span class=\"en\">The Red Wheelbarrow</span>، <span class=\"en\">The Raven)</span>، <span class=\"en\">Wikisource</span> (<span class=\"en\">The Bells)</span>، <span class=\"en\">Wikipedia - Sonnet 18.</span>", "i": 26}];</script>
