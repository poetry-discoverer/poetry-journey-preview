<h1>الدرس 8: سنة 1066: الغزو النورماندي وميلاد الإنجليزية الوسيطة</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> تمهيدي</span><span class="tag">الدرس 8</span><span class="tag"><span class="em">📜</span> تاريخ الشعر</span></div>
</div>

<div id="player" data-lesson="history-8"></div>
<script src="../audio/manifest.js" onerror="void 0"></script>
<script>window.LESSON_ID="history-8";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">\"سنة 1066: الغزو النورماندي وميلاد الإنجليزية الوسيطة\"<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⚔️<\/span><\/span> قفلنا محطة العصر القديم. النهاردة نفتح محطة جديدة بأشهر سنة في تاريخ إنجلترا كلها: 1066. معركة واحدة هتغير اللغة والشعر والبلد، وبعدها هتتولد الإنجليزية الوسيطة، اللغة اللي هيكتب بيها <span class=\"en\">Chaucer.<\/span><\/div><div class=\"u\">النقطة 1<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: إيه اللي حصل في 1066؟<\/div>", "n": 3, "i": 0, "a": "history-8-001", "x": "cae23139"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الحكاية في سطور:<\/div><div class=\"li\">ملك إنجلترا مات من غير وريث واضح، والعرش بقى عليه عينين.<\/div><div class=\"li\"><span class=\"en\">William<\/span> دوق <span class=\"en\">Normandy<\/span> (في شمال فرنسا) جاب مراكبه وعبّر البحر.<\/div><div class=\"li\">يوم 14 أكتوبر 1066: معركة <span class=\"en\">Hastings<\/span> في جنوب إنجلترا. الملك الإنجليزي <span class=\"en\">Harold<\/span> اتقتل، و<span class=\"en\">William<\/span> انتصر، وبقى ملك إنجلترا. الناس بتسميه <span class=\"en\">William the Conqueror<\/span> (ويليام الفاتح).<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> ليه دي لحظة مفصلية؟<\/div>", "n": 4, "i": 1, "a": "history-8-002", "x": "2337e343"}, {"t": "learn", "h": "<div class=\"li\">مش مجرد ملك جديد: طبقة حاكمة كاملة جديدة، بتتكلم لغة تانية (الفرنسية النورماندية)، هتحل محل النخبة الإنجليزية في البلاط والكنيسة والقانون.<\/div><div class=\"li\">مثال يومي من تاريخنا: زي لما دولة تحتل بلد واللغة الرسمية في المحاكم والمدارس تتغير. إحنا عارفين الإحساس ده من تاريخنا الحديث كويس.<\/div><div class=\"u\">النقطة 2<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: تلتمية سنة بثلاث لغات <span class=\"em\"><span class=\"em\">🗣️<\/span><\/span><\/div>", "n": 3, "i": 2, "a": "history-8-003", "x": "934548c0"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الخريطة اللغوية بعد الغزو:<\/div><div class=\"li\">الفرنسية النورماندية: لغة البلاط والطبقة الحاكمة والقانون والأدب الراقي.<\/div><div class=\"li\">اللاتينية: لغة الكنيسة والعلم والوثائق (زي ما هي في أوروبا كلها).<\/div><div class=\"li\">الإنجليزية: لغة الناس العادية، في الشارع والحقل والبيت. اتطردت من المحاكم والبرلمان والجامعة لحوالي 300 سنة.<\/div>", "n": 3, "i": 3, "a": "history-8-004", "x": "979580e9"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> الحقيقة المهمة:<\/div><div class=\"li\">الإنجليزية مماتتش، بس بقت لغة \"مش رسمية\". يعني محدش بيعلّمها ولا بيكتب بيها قوانين، فبقت تتغير بحرية زي أي لهجة شعبية من غير حارس.<\/div><div class=\"li\">وبعد حوالي 3 قرون، لما الإنجليزية رجعت تتوج لغة قومية في نص القرن 14، كانت بقت لغة تانية خالص.<\/div><div class=\"li\">اسمها الجديد: <span class=\"en\">Middle English<\/span> (الإنجليزية الوسيطة)، وبنقول تقريباً من 1100 لـ 1500.<\/div>", "n": 3, "i": 4, "a": "history-8-005", "x": "abdde3a7"}, {"t": "learn", "h": "<div class=\"u\">النقطة 3<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: إزاي اللغة اتغيرت بالظبط؟ <span class=\"em\"><span class=\"em\">🔧<\/span><\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> التغيير 1: النهايات ضاعت<\/div><div class=\"li\">الإنجليزي القديم كان مليان تصريفات ونهايات للاسم والفعل (حالات إعرابية معقدة). في الفترة دي النهايات دي اتبسطت ومعظمها مات، والمعنى بقى بيتفهم من ترتيب الكلمات.<\/div><div class=\"li\">مثال يومي: زي الفرق بين الفصحى المليانة إعراب والعامية اللي بتوصل المعنى بترتيب الجملة.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> التغيير 2: غزو الكلمات الفرنسية<\/div>", "n": 5, "i": 5, "a": "history-8-006", "x": "4a0f6b9a"}, {"t": "learn", "h": "<div class=\"li\">آلاف الكلمات الفرنسية دخلت الإنجليزية: كلمات قانون وجيش وموضة وأكل ودين.<\/div><div class=\"li\">أشهر مثال في كتب اللغة، واحفظه: الحيوان الحي اسمه إنجليزي (<span class=\"en\">cow,<\/span> <span class=\"en\">pig,<\/span> <span class=\"en\">sheep<\/span>) لأن اللي بيرعيه فلاح ساكسوني، بس الأكل على السفرة اسمه فرنسي (<span class=\"en\">beef,<\/span> <span class=\"en\">pork,<\/span> <span class=\"en\">mutton<\/span>) لأن اللي بياكله سيد نورماندي.<\/div><div class=\"li\">الكلمة نفسها بتحكي مين بيشتغل ومين بياكل!<\/div>", "n": 3, "i": 6, "a": "history-8-007", "x": "0603770d"}, {"t": "learn", "h": "<div class=\"li\">وفي ثنائيات لحد النهاردة: <span class=\"en\">freedom/liberty<\/span>، <span class=\"en\">wood/forest.<\/span><\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> التغيير 3: مفيش معيار واحد<\/div><div class=\"li\">اللغة الرسمية القديمة (إنجليزي ويسكس بتاع الملك ألفريد) وقعت من مكانتها، فبقت كل منطقة بتكتب بلهجتها. مفيش \"إنجليزي الملك\" لفترة.<\/div><div class=\"u\">النقطة 4<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: إيه اللي اتكتب في الفترة الانتقالية؟ <span class=\"em\"><span class=\"em\">📜<\/span><\/span><\/div>", "n": 4, "i": 7, "a": "history-8-008", "x": "ec381faa"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> نصوص مفتاحية (احفظ الأسماء دي):<\/div><div class=\"li\"><span class=\"en\">Peterborough Chronicle<\/span>: استمرار \"السجلات الأنجلو-ساكسونية\" بالإنجليزي جوه دير، وقف فجأة سنة 1154. آخر نص مهم بالإنجليزي القديم، وبتوّضح فيه اللغة وهي بتتحول تحت عينك.<\/div><div class=\"li\"><span class=\"en\">Ormulum<\/span>: نص ديني من النص التاني من القرن 12، كاتبه راهب اسمه <span class=\"en\">Orrm<\/span>، مشهور بنظام هجاء غريب اخترعه.<\/div>", "n": 2, "i": 8, "a": "history-8-009", "x": "8790c614"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Layamon's Brut<\/span>: قصيدة طويلة بتحكي تاريخ بريطانيا الأسطوري، ومن أوائل النصوص اللي بتحكي عن الملك <span class=\"en\">Arthur<\/span> بالإنجليزي.<\/div><div class=\"li\"><span class=\"en\">The Owl and the Nightingale<\/span>: قصيدة ظريفة، مناظرة بين بومة وعندليب، كل واحدة بتدافع عن نفسها. (زي مناظرة بين اتنين في القهوة، بس بشعر!)<\/div>", "n": 2, "i": 9, "a": "history-8-010", "x": "c6534c83"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">📌<\/span><\/span> أهم تغيير في موسيقى الشعر:<\/div><div class=\"li\">من فرنسا دخلت الإنجليزية حاجتين جداد: القافية في آخر السطر، وعدّ المقاطع.<\/div><div class=\"li\">يعني بعد قرون من الـ <span class=\"en\">alliteration<\/span> بس، بقى فيه موسيقى جديدة ممكنة. والاتنين هيعيشوا جنب بعض، وهنشوف الـ <span class=\"en\">alliteration<\/span> بترجع بقوة في القرن 14.<\/div><div class=\"u\">النقطة 5<span class=\"em\"><span class=\"em\">️<\/span><\/span>⃣: ليه الدرس ده مهم؟ <span class=\"em\"><span class=\"em\">🌟<\/span><\/span><\/div>", "n": 3, "i": 10, "a": "history-8-011", "x": "b84501b4"}, {"t": "learn", "h": "<div class=\"u\">١. من غير 1066 مكنش هيبقى فيه <span class=\"en\">Chaucer<\/span> بالشكل اللي هنشوفه: اللغة الجديدة هي اللي هتديه أدواته.<\/div><div class=\"u\">٢. فكرة عامة في تاريخ الأدب: اللغات بتتغير بالأحداث مش بالقرارات. معركة واحدة غيرت موسيقى الشعر الإنجليزي للأبد.<\/div><div class=\"u\">٣. افتكر القاعدة الذهبية <span class=\"em\"><span class=\"em\">⭐<\/span><\/span>: المره دي مش جيل بيثور على جيل، دي لغة بتثور على لغة. النتيجة: شعر إنجليزي جديد هيتولد في القرن 14.<\/div>", "n": 3, "i": 11, "a": "history-8-012", "x": "9880afcf"}, {"t": "write", "h": "", "q": "احكي أحداث سنة 1066 في 3 جمل: مين حارب مين، فين، وإيه النتيجة.", "key": "history-8:1", "n": 1, "i": 12}, {"t": "write", "h": "", "q": "ارسم خريطة اللغات التلاتة في إنجلترا بعد الغزو: أي لغة لمين؟", "key": "history-8:2", "n": 1, "i": 13}, {"t": "write", "h": "", "q": "اشرح بمثال <span class=\"en\">cow/beef<\/span> إزاي اللغة بتحكي قصة اجتماعية. وهات ثنائية تانية من الدرس.", "key": "history-8:3", "n": 1, "i": 14}, {"t": "write", "h": "", "q": "اذكر تغييرين حصلوا للغة الإنجليزية نفسها (مش بس كلمات جديدة).", "key": "history-8:4", "n": 1, "i": 15}, {"t": "write", "h": "", "q": "إيه الحاجتين الموسيقيتين اللي دخلوا الشعر الإنجليزي من فرنسا؟ وليه ده غيّر المستقبل؟", "key": "history-8:5", "n": 1, "i": 16}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"em\"><span class=\"em\">👑<\/span><\/span> <span class=\"en\">Chaucer<\/span> ج1: حياته ودنياه، الراجل اللي هيلقبوه أبو الشعر الإنجليزي.", "extra": "<span class=\"em\"><span class=\"em\">🔗<\/span><\/span> المصادر:<ul><li>وصف الفترة من كتاب <span class=\"en\">Henry A.<\/span> <span class=\"en\">Beers<\/span> الكلاسيكي \"<span class=\"en\">From Chaucer to Tennyson<\/span>\" (متاح على <span class=\"en\">online-literature.com)<\/span><\/li><li>تفاصيل الإنجليزية الوسيطة ونصوصها من مقال <span class=\"en\">Wikipedia<\/span> الموسع <span class=\"en\">Middle English.<\/span><\/li><\/ul>", "i": 17}];</script>
