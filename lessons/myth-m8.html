<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: A1</span><span class="tag">الدرس M8</span><span class="tag"><span class="em">🏛️</span> كورس الميثولوجيا</span></div>

<script>window.LESSON_ID="myth-m8";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">سلسلة \"الأساطير للشعر الإنجليزي\" | المستوى: 1 (<span class=\"en\">A1-A2</span>) <span class=\"em\"><span class=\"em\">🌱</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">────────────────────</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">🎣</span></span> أول حاجة: تخيل الإحساس ده</div><div class=\"u\">إنك عطشان جداً وقاعد قدام تلاجة مفتوحة مليانة مية ساقعة، بس كل ما تمد إيدك على زجاجة، التلاجة تتباعد خطوة. وتفضل كده ساعة، وساعتين، مليون سنة. <span class=\"em\"><span class=\"em\">😱</span></span></div><div class=\"u\">ده بالظبط عقاب طنطالوس، بطل النهارده الأول.</div>", "n": 5, "i": 0, "a": "myth-m8-001", "x": "d2a60731"}, {"t": "learn", "h": "<div class=\"u\">وفي نفس المكان، في واحد مربوط في عجلة نار بتلف من غير ما تقف أبداً، وواحدة وستين أخت بيصبوا مية في برميل مخروم.</div><div class=\"u\">أهلاً بيك في أعمق حتة في العالم السفلي عند الإغريق: التارتاروس.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">📍</span></span> إحنا فين في الحكاية؟</div><div class=\"li\">في الفصل السادس (<span class=\"en\">M6</span>) خدنا جولة في جغرافيا العالم السفلي، وعرفنا إن التارتاروس هو أعمق نقطة فيه، مكان عقاب الكبار.</div>", "n": 4, "i": 1, "a": "myth-m8-002", "x": "fbb11d9d"}, {"t": "learn", "h": "<div class=\"li\">في الفصل السابع (<span class=\"en\">M7</span>) شفنا سيزيف بيطلع الحجر الجبل وينزل بيه، للأبد.</div><div class=\"li\">النهارده هنقابل التلاتة التانيين من أشهر سكان التارتاروس: طنطالوس، إكسيون، وبنات داناوس.</div><div class=\"li\">لفتة حلوة: الشاعر الروماني أوفيد جمعهم كلهم في مشهد واحد في الكتاب الرابع من \"التحولات\" (<span class=\"en\">Metamorphoses 4</span>)، كأنهم زنازين جنب بعض في نفس العنبر.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">────────────────────</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">🍇</span></span> أولاً: طنطالوس (<span class=\"en\">Tantalus</span>)</div>", "n": 5, "i": 2, "a": "myth-m8-003", "x": "7f44f5ac"}, {"t": "learn", "h": "<div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ مين الراجل ده؟</div><div class=\"li\">ابن زيوس نفسه، ملك غني جداً في آسيا الصغرى (منطقة فريجيا وليديا، تركيا دلوقتي).</div><div class=\"li\">أبو بيلوبس ونيوبي. خد بالك من اسم بيلوبس ده، هنرجعله تحت.</div><div class=\"li\">حصل على شرف شبه مستحيل: كان ضيف ثابت على مائدة الآلهة في الأوليمبوس، بياكل ويشرب معاهم ويسمع كلامهم.</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ عمل إيه غلط؟ (تلات نسخ، وكلها أوحش من بعض)</div>", "n": 5, "i": 3, "a": "myth-m8-004", "x": "d3d6ed20"}, {"t": "mc", "h": "", "q": "<span class=\"en\">Tantalus</span> كان...", "nq": 1, "opts": ["ابن <span class=\"en\">Zeus</span> وضيف على مائدة الآلهة", "ابن <span class=\"en\">Hades</span>", "إله البحر"], "ans": 0, "why": "ابن <span class=\"en\">Zeus</span> وضيف على مائدة الآلهة", "ex": ["صح: ملك غني في آسيا الصغرى، أبو <span class=\"en\">Pelops</span> و<span class=\"en\">Niobe</span>.", "غلط: مش المذكور.", "غلط: مش المذكور."], "i": 4}, {"t": "learn", "h": "<div class=\"li\">نسخة 1: فشّ أسرار الآلهة للبشر. اللي بيسمعه على المائدة بقى على كل لسان في السوق. (المصدر: أبولودوروس، <span class=\"en\">Epitome 2.1</span>)</div><div class=\"li\">نسخة 2: سرق النكتار والأمبروزيا، يعني أكل وشرب الخلود بتاع الآلهة، ووزعه على أصحابه من البشر. (المصدر: بندار، الأوليمبية الأولى <span class=\"en\">Olympian 1</span>)</div>", "n": 2, "i": 5, "a": "myth-m8-005", "x": "1d292c3e"}, {"t": "learn", "h": "<div class=\"li\">نسخة 3، وهي الأشهر والأفظع: قرر يختبر الآلهة، هل هما فعلاً عارفين كل حاجة؟ فعملهم عزومة وحط لهم في الأكل ابنه بيلوبس، مسلوق ومقطع. <span class=\"em\"><span class=\"em\">😨</span></span> (المصدر: أبولودوروس، <span class=\"en\">Epitome 2.3</span>)</div><div class=\"li\">الآلهة فهموا الخدعة فوراً وماكلوش، ما عدا ديميتر، كانت شاغلها حزنها على بنتها المفقودة، فأكلت من كتف الولد من غير ما تنتبه.</div>", "n": 2, "i": 6, "a": "myth-m8-006", "x": "0df734cd"}, {"t": "mc", "h": "", "q": "إيه أشهر نسخة عن جريمة <span class=\"en\">Tantalus</span>؟", "nq": 1, "opts": ["قدم ابنه <span class=\"en\">Pelops</span> للآلهة في الأكل ليختبرهم", "سرق النار", "هرب من <span class=\"en\">Tartarus</span>"], "ans": 0, "why": "قدم ابنه <span class=\"en\">Pelops</span> للآلهة في الأكل ليختبرهم", "ex": ["صح: النسخة الأشهر والأفظع.", "غلط: ده <span class=\"en\">Prometheus</span>.", "غلط: مش المذكور."], "i": 7}, {"t": "learn", "h": "<div class=\"li\">الآلهة رجعوا بيلوبس للحياة أحلى من الأول، وعوضوا الكتف المأكول بكتف من العاج. (المصدر: هيجينوس <span class=\"en\">Fabulae 83</span>، وأوفيد <span class=\"en\">Metamorphoses 6</span>)</div><div class=\"li\"><span class=\"em\"><span class=\"em\">⚠️</span></span> ملحوظة \"الأسطورة نسخ\": الشاعر بندار نفسه رفض قصة العشا دي تماماً وقال إنها إشاعة اخترعها جيران حسودين، والغلط الحقيقي عنده هو سرقة النكتار.</div><div class=\"li\">شفت؟ حتى القدماء كانوا بيتخانقوا على النسخ.</div><div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ العقاب: الصورة الأيقونية <span class=\"em\"><span class=\"em\">🖼️</span></span></div>", "n": 4, "i": 8, "a": "myth-m8-007", "x": "fd34c627"}, {"t": "learn", "h": "<div class=\"li\">هوميروس شافه في الأوديسية، الكتاب الحداشر، واقف في بحيرة والمية واصلة لذقنه:</div><div class=\"u\">\"<span class=\"en\">And I saw Tantalus in bitter torment,</span> <span class=\"en\">standing in a pool,</span> <span class=\"en\">and the water came nigh unto his chin.</span>\" (<span class=\"en\">Odyssey 11.582-584</span>، ترجمة <span class=\"en\">Murray</span>)</div><div class=\"li\">كل ما ينزل يشرب، المية تنشف وتسيب الطين الأسود. وفوق راسه شجر محمل بالتفاح والرمان والتين والزيتون، كل ما يمد إيده، الريح تطير الفروع للسحاب.</div>", "n": 3, "i": 9, "a": "myth-m8-008", "x": "b27d59c1"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">And I saw Tantalus in _____ torment,</div>", "opts": ["evermore", "bitter", "weren"], "ans": 1, "why": "<span class=\"en\">And I saw Tantalus in bitter torment,</span>", "i": 10, "ex": ["\"evermore\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"bitter\".", "صح، دي الكلمة اللي في القصيدة.", "\"weren\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"bitter\"."]}, {"t": "learn", "h": "<div class=\"li\">أبولودوروس بيزود كمان صخرة ضخمة معلقة فوق راسه ممكن تقع في أي لحظة. (<span class=\"en\">Epitome 2.1</span>)</div><div class=\"li\"><span class=\"em\"><span class=\"em\">🔄</span></span> من الحياة: زي حد صايم قاعد يتفرج على إعلانات الأكل، أو زي واحد الموبايل بتاعه 1% والشاحن قدامه بس مش بيوصل. العذاب مش في الغياب، العذاب في القرب.</div><div class=\"u\">4<span class=\"em\"><span class=\"em\">️</span></span>⃣ كلمة دخلت اللغة للأبد <span class=\"em\"><span class=\"em\">🔤</span></span></div><div class=\"li\">من اسمه جت كلمة إنجليزية مهمة جداً: <span class=\"en\">tantalize</span></div>", "n": 4, "i": 11, "a": "myth-m8-009", "x": "647abf32"}, {"t": "mc", "h": "", "q": "عقاب <span class=\"en\">Tantalus</span> هو...", "nq": 1, "opts": ["يشوف الأكل والشرب من غير ما يوصلهم", "يرفع حجر", "يلف على عجلة"], "ans": 0, "why": "يشوف الأكل والشرب من غير ما يوصلهم", "ex": ["صح: كل ما ينزل يشرب، المية تنشف.", "غلط: ده <span class=\"en\">Sisyphus</span>.", "غلط: ده <span class=\"en\">Ixion</span>."], "i": 12}, {"t": "learn", "h": "<div class=\"li\">معناها: تغري حد بحاجة هو نفسه فيها، وتقربها منه، وبعدين تبعدها عنه. تعذيب بالإغراء.</div><div class=\"li\">الكلمة ظهرت في الإنجليزي في أواخر القرن الستاشر (حوالي 1590<span class=\"en\">s</span>).</div><div class=\"li\">مثال: \"<span class=\"en\">The smell of fresh bread tantalized the hungry crowd.</span>\" ريحة العيش الطازة عذبت الناس الجيعانة.</div><div class=\"u\">5<span class=\"em\"><span class=\"em\">️</span></span>⃣ الإرث المظلم <span class=\"em\"><span class=\"em\">👨‍👦</span></span></div><div class=\"li\">افتكر اسم بيلوبس؟ ابن طنطالوس اللي اتسلخ واتسلق ورجع للحياة؟</div>", "n": 5, "i": 13, "a": "myth-m8-010", "x": "22962d05"}, {"t": "mc", "h": "", "q": "كلمة <span class=\"en\">tantalize</span> أصلها من...", "nq": 1, "opts": ["<span class=\"en\">Tantalus</span>", "<span class=\"en\">Sisyphus</span>", "<span class=\"en\">Ixion</span>"], "ans": 0, "why": "<span class=\"en\">Tantalus</span>", "ex": ["صح: تغري حد بحاجة وتبعدها عنه.", "غلط: مش منه.", "غلط: مش منه."], "i": 14}, {"t": "learn", "h": "<div class=\"li\">من نسل بيلوبس هيجي أتريوس، ومنه أجاممنون ومينيلاوس، يعني بيت أتريوس كله، أشهر عيلة ملعونة في المسرح اليوناني. هنقابلهم في فصول لاحقة. الخيانة بدأت من الأكل، زي ما هتشوف.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">────────────────────</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">🔥</span></span> ثانياً: إكسيون (<span class=\"en\">Ixion</span>)</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ مين هو؟</div><div class=\"li\">ملك اللابيث، شعب في ثيساليا (شمال اليونان).</div><div class=\"li\">متجوز ديا وأبو بيريثوس، اللي هيبقى صاحب ثيسيوس البطل بعدين.</div>", "n": 6, "i": 15, "a": "myth-m8-011", "x": "09fd37eb"}, {"t": "learn", "h": "<div class=\"li\">ملحوظة نسخ: هوميروس في الإلياذة (14.317-318) بيخلي زيوس يقول إن بيريثوس ابنه هو من مرات إكسيون. برضه، الأسطورة نسخ.</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ الذنب الأول: أول دم قريب في التاريخ <span class=\"em\"><span class=\"em\">🩸</span></span></div><div class=\"li\">إكسيون وعد حماة، ديونيوس، بهدايا عرس غالية مقابل بنته ديا، وبعد الجواز مشى كلامه.</div><div class=\"li\">لما الحما طالب بحقه، إكسيون عزمه على وليمة، وجهز له حفرة مليانة نار ووقعه فيها. (المصدر: ديودورس 4.69)</div>", "n": 4, "i": 16, "a": "myth-m8-012", "x": "47f476ef"}, {"t": "learn", "h": "<div class=\"li\">ليه دي جريمة مختلفة؟ لأن القتيل قريبه، حماة يعني عيلة. بندار بيقول إن إكسيون هو أول واحد في البشر يسفك دم قريب بالخديعة. (<span class=\"en\">Pythian 2</span>)</div><div class=\"li\">الجريمة كانت بشعة لدرجة إن محدش في البشر كله كان مستعد يطهره منها.</div><div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ الغلطة الكبرى: كفران النعمة <span class=\"em\"><span class=\"em\">🐍</span></span></div>", "n": 3, "i": 17, "a": "myth-m8-013", "x": "450dd640"}, {"t": "learn", "h": "<div class=\"li\">هنا ييجي المشهد اللي يجنن: زيوس نفسه رحمه. طهره من الذنب، ورفعه لفوق، وعزمه على مائدته في الأوليمبوس. تخيل: قاتل قريبه قاعد ياكل مع الآلهة.</div><div class=\"li\">رد الجميل؟ إكسيون شاف هيرا، مرات زيوس ومضيفته، وحاول يغازلها.</div><div class=\"li\">زيوس عارف، فعمل اختبار: صنع سحابة على صورة هيرا بالظبط، اسمها نيفيلي (<span class=\"en\">Nephele</span>، يعني سحابة)، وحطها في طريقه. إكسيون وقع في الفخ وافتخر، واتفضح.</div>", "n": 3, "i": 18, "a": "myth-m8-014", "x": "57652246"}, {"t": "learn", "h": "<div class=\"li\">(المصدر: أبولودوروس، <span class=\"en\">Epitome 1.20</span> وبندار، <span class=\"en\">Pythian 2</span>)</div><div class=\"li\"><span class=\"em\"><span class=\"em\">🔄</span></span> من الحياة: زي واحد صاحبه سنده في أزمة، دخله بيته وقاله \"اعتبر البيت بيتك\"، وبعدين يلاقيه بيحاول ياخد مراته.</div><div class=\"li\">الإغريق كانوا شايفين إن كفران النعمة، <span class=\"en\">ingratitude</span>، من أقبح الذنوب على الإطلاق.</div><div class=\"u\">4<span class=\"em\"><span class=\"em\">️</span></span>⃣ النتيجة الغريبة: أبو الكينتاورز <span class=\"em\"><span class=\"em\">🐎</span></span></div><div class=\"li\">من السحابة نيفيلي جاء ابن وحش اسمه كينتاوروس.</div>", "n": 5, "i": 19, "a": "myth-m8-015", "x": "6ed2ee9f"}, {"t": "learn", "h": "<div class=\"li\">كينتاوروس اتجاوز مع خيول ماجنيسيا عند جبل بيليون، فطلعت سلالة الكينتاورز: المخلوقات نص إنسان نص حصان. (المصدر: بندار، <span class=\"en\">Pythian 2</span>)</div><div class=\"li\">بندار وصفهم وصف عبقري: من ناحية الأم \"الجزء التحتاني\" حصان، ومن ناحية الأب \"الجزء الفوقاني\" إنسان.</div><div class=\"li\">يعني كل كينتاور هتقابله في أي قصيدة إنجليزية، من كيرون معلم أخيل لحد نيسوس، اسأل عن جده: سحابة وغدار.</div>", "n": 3, "i": 20, "a": "myth-m8-016", "x": "07eaa5d3"}, {"t": "learn", "h": "<div class=\"u\">5<span class=\"em\"><span class=\"em\">️</span></span>⃣ العقاب: العجلة اللي مبتقفش <span class=\"em\"><span class=\"em\">🎡🔥</span></span></div><div class=\"li\">زيوس أمر بربط إكسيون، إيديه ورجليه، على عجلة ليها جناحات ونار، بتلف في الظلام بلا توقف، للأبد.</div><div class=\"li\">والعجلة مش ساكتة. بندار بيقول إن إكسيون بيصرخ من فوقها رسالة للبشر كلهم: \"رد الجميل لصاحبه!\"</div>", "n": 3, "i": 21, "a": "myth-m8-017", "x": "59577176"}, {"t": "mc", "h": "", "q": "عقاب <span class=\"en\">Ixion</span> هو...", "nq": 1, "opts": ["الربط على عجلة نار بتلف بلا توقف", "حمل المية في برميل", "شرب نهر"], "ans": 0, "why": "الربط على عجلة نار بتلف بلا توقف", "ex": ["صح: وبيصرخ: رد المعروف لصاحبه.", "غلط: ده عقاب بنات <span class=\"en\">Danaus</span>.", "غلط: ده <span class=\"en\">Lethe</span>."], "i": 22}, {"t": "learn", "h": "<div class=\"u\">بالإنجليزي في ترجمة <span class=\"en\">Sandys</span>: \"<span class=\"en\">Ixion,</span> <span class=\"en\">as he whirleth round and round on his winged wheel.</span>.. <span class=\"en\">teacheth the lesson that men should requite the benefactor with fresh tokens of warm gratitude.</span>\"</div><div class=\"li\">شفت العبقرية؟ العقاب نفسه بقى درس أخلاقي متنقل، إكسيون بقى منبه بشري ضد كفران النعمة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">────────────────────</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">🏺</span></span> ثالثاً: بنات داناوس (<span class=\"en\">The Danaids</span>)</div>", "n": 4, "i": 23, "a": "myth-m8-018", "x": "8c471be9"}, {"t": "mc", "h": "", "q": "إيه الدرس اللي بتعلمه عجلة <span class=\"en\">Ixion</span>؟", "nq": 1, "opts": ["ارد الجميل لصاحب المعروف", "اكسر القواعد", "اهرب"], "ans": 0, "why": "ارد الجميل لصاحب المعروف", "ex": ["صح: كفران النعمة من أقبح الذنوب.", "غلط: ده عكس الدرس.", "غلط: مش الدرس."], "i": 24}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">as he _____ round and round on his winged wheel.</div>", "opts": ["whirleth", "brethren", "revenge"], "ans": 0, "why": "<span class=\"en\">as he whirleth round and round on his winged wheel.</span>", "i": 25, "ex": ["صح، دي الكلمة اللي في القصيدة.", "\"brethren\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"whirleth\".", "\"revenge\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"whirleth\"."]}, {"t": "learn", "h": "<div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ الخلفية: عيلتين متخانقين <span class=\"em\"><span class=\"em\">👨‍👩‍👧‍👦</span></span></div><div class=\"li\">أخوين توأم تقريباً في كل حاجة إلا الظروف: داناوس عنده 50 بنت، وأخوه أيجيبتوس عنده 50 ولد.</div><div class=\"li\">أيجيبتوس عايز يجوز ولاده لبنات أخوه، وداناوس خايف منهم، فهرب ببناته الخمسين من مصر لمدينة أرجوس في اليونان.</div><div class=\"li\">(بالمناسبة، الجد البعيد للعيلة هو بيلوس ملك مصر، عشان كده بيتقال عليهم كمان <span class=\"en\">Belides</span>).</div>", "n": 4, "i": 26, "a": "myth-m8-019", "x": "96f37f12"}, {"t": "learn", "h": "<div class=\"li\">ولاد أيجيبتوس الخمسين لحقوهم لحد أرجوس وطلبوا الجواز رسمي. داناوس وافق، ظاهرياً. (المصدر: أبولودوروس، <span class=\"en\">Library 2.1.5</span>)</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ ليلة العرس الدموية <span class=\"em\"><span class=\"em\">🔪</span></span></div><div class=\"li\">في ليلة الدخلة، داناوس وزع على كل بنت خنجر، وأمرهم: لما جوزك ينام، اقتليه.</div><div class=\"li\">49 بنت نفذوا الأمر. قتلوا أزواجهن وهم نايمين، ودفنوا الرؤوس في مستنقع ليرنا.</div>", "n": 4, "i": 27, "a": "myth-m8-020", "x": "a16b3cca"}, {"t": "learn", "h": "<div class=\"li\">بنت واحدة بس رفضت: هيبرمنيسترا (<span class=\"en\">Hypermnestra</span>)، أكبرهم. جوزها لينكيوس احترمها ليلة الدخلة ومايمسهاش، فهي عفت عنه وساعدته يهرب.</div><div class=\"li\">عقابها عند أبوها؟ حبسها. وبعدين لما هدى، سامحها وجوزها للينكيوس رسمي، وباقي البنات جوزهم للفائزين في سباق رياضي. (المصدر: أبولودوروس، <span class=\"en\">Library 2.1.5</span>)</div><div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ العقاب: البرميل اللي ميتملاش <span class=\"em\"><span class=\"em\">🏺</span></span></div>", "n": 3, "i": 28, "a": "myth-m8-021", "x": "217da785"}, {"t": "mc", "h": "", "q": "أي بنت من بنات <span class=\"en\">Danaus</span> رفضت قتل جوزها؟", "nq": 1, "opts": ["<span class=\"en\">Hypermnestra</span>", "<span class=\"en\">Aegina</span>", "<span class=\"en\">Pyrrha</span>"], "ans": 0, "why": "<span class=\"en\">Hypermnestra</span>", "ex": ["صح: جوزها <span class=\"en\">Lynceus</span> احترمها فعفت عنه.", "غلط: <span class=\"en\">Aegina</span> بنت إله النهر <span class=\"en\">Asopus</span>.", "غلط: <span class=\"en\">Pyrrha</span> مراة <span class=\"en\">Deucalion</span>."], "i": 29}, {"t": "learn", "h": "<div class=\"li\">في العالم السفلي، الـ49 أخت محكوم عليهم بشغلانة بلا نهاية: يحملوا المية في أواني ومناخل مخرومة، ويصبوا في برميل بلا قاع، فالمية بتضيع قبل ما توصل، ويرجعوا من الأول.</div><div class=\"li\">للأبد.</div><div class=\"li\">أوفيد شافهم في المشهد الجماعي بتاع الكتاب الرابع من التحولات، جنب طنطالوس وسيزيف وإكسيون بالظبط.</div><div class=\"li\">تفصيلة مهمة من أبولودوروس: أثينا وهيرميس طهروا البنات من دم الجريمة بأمر زيوس.</div>", "n": 4, "i": 30, "a": "myth-m8-022", "x": "e83ca180"}, {"t": "mc", "h": "", "q": "إيه عقاب بنات <span class=\"en\">Danaus</span> في العالم السفلي؟", "nq": 1, "opts": ["حمل المية في أواني مخرومة لبرميل بلا قاع", "عجلة نار", "حجر"], "ans": 0, "why": "حمل المية في أواني مخرومة لبرميل بلا قاع", "ex": ["صح: ويرجعوا من الأول للأبد.", "غلط: ده <span class=\"en\">Ixion</span>.", "غلط: ده <span class=\"en\">Sisyphus</span>."], "i": 31}, {"t": "learn", "h": "<div class=\"li\">يعني الإغريق نفسهم كانوا محتارين في الحكم عليهم: نفذوا أمر الأب، بس قتلوا أزواجهم. الالتباس الأخلاقي ده هو اللي خلى القصة تعيش.</div><div class=\"u\">4<span class=\"em\"><span class=\"em\">️</span></span>⃣ لفتة من أجمل اللفتات <span class=\"em\"><span class=\"em\">🎵</span></span></div><div class=\"li\">في الكتاب العاشر من التحولات، لما أورفيوس نزل العالم السفلي يعزف ويغني عشان يرجع مراته، العذاب كله وقف لحظة: حجر سيزيف وقف، عجلة إكسيون وقفت، وبنات داناوس حطوا الجرار.</div><div class=\"li\">(<span class=\"en\">Ovid,</span> <span class=\"en\">Metamorphoses 10</span>)</div>", "n": 4, "i": 32, "a": "myth-m8-023", "x": "5f7204a8"}, {"t": "learn", "h": "<div class=\"li\">يعني الموسيقى قدرت تعمل اللي الأبدية ما عملتهوش. هنقابل أورفيوس في فصل لاحق.</div>", "n": 1, "i": 33, "a": "myth-m8-024", "x": "bcc28b76"}, {"t": "learn", "h": "<div class=\"lead\">5<span class=\"em\"><span class=\"em\">️</span></span>⃣ <span class=\"em\"><span class=\"em\">🔄</span></span> من الحياة:</div><div class=\"li\">شغل بلا نتيجة: زي واحد بيذاكر طول السنة من ملخص مسرب غلط، مجهود كله بيروح في الفاضي.</div><div class=\"li\">أو زي محل بيصرف فلوس على الديكور كل يوم والزباين مابتدخلش. البرميل المخروم موجود في كل حتة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">────────────────────</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">🧠</span></span> رابعاً: ليه التلاتة في فصل واحد؟ الفكرة العبقرية</div><div class=\"u\">بص على العقوبات التلاتة، هتلاقي قانون ذهبي: العقاب هو الذنب، بس مقلوب.</div>", "n": 5, "i": 34, "a": "myth-m8-025", "x": "0cdc1720"}, {"t": "learn", "h": "<div class=\"li\">طنطالوس خان مائدة الآلهة وفسد الأكل، فاتعاقب بإنه يشوف الأكل والشرب من غير ما يوصلهم.</div><div class=\"li\">إكسيون خان ولي نعمته، فاتربط في عجلة بتنادي ليل نهار: \"رد الجميل لصاحبه\".</div><div class=\"li\">الدانايدات حولوا ليلة بناء البيت لمجزرة، فاتحبسوا في شغل بيت مابيكتملش: ملء برميل مستحيل يتملى.</div>", "n": 3, "i": 35, "a": "myth-m8-026", "x": "29a33079"}, {"t": "learn", "h": "<div class=\"li\">الدرس الإغريقي: الذنوب اللي بتكسر القوانين المقدسة، الضيافة والقرابة والجواز، ذنوب لانهائية الطبيعة، فعقابها لانهائي. مش قسوة، رمزية.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">────────────────────</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">📜</span></span> الأسطورة في الشعر الإنجليزي</div><div class=\"u\">1<span class=\"em\"><span class=\"em\">️</span></span>⃣ روبرت براوننج، قصيدة \"<span class=\"en\">Ixion</span>\" (1883، من مجموعة <span class=\"en\">Jocoseria</span>):</div>", "n": 4, "i": 36, "a": "myth-m8-027", "x": "39ac2ce0"}, {"t": "learn", "h": "<div class=\"u\">قصيدة كاملة براوننج بيخلي فيها إكسيون يتكلم بنفسه من على العجلة، ويدافع عن نفسه وعن البشرية كلها قدام زيوس. الافتتاحية:</div><div class=\"u\">\"<span class=\"en\">High in the dome,</span> <span class=\"en\">suspended,</span> <span class=\"en\">of Hell,</span> <span class=\"en\">sad triumph,</span> <span class=\"en\">behold us</span>!</div><div class=\"u\"><span class=\"en\">Here the revenge of a God,</span> <span class=\"en\">there the amends of a Man.</span>\"</div><div class=\"u\">وفي السطور 27-30 براوننج بيجمع كل معاقبي الفصل ده واللي فاته في جملتين:</div>", "n": 4, "i": 37, "a": "myth-m8-028", "x": "256bb87b"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Here the _____ of a God,</div>", "opts": ["brethren", "revenge", "their"], "ans": 1, "why": "<span class=\"en\">Here the revenge of a God,</span>", "i": 38, "ex": ["\"brethren\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"revenge\".", "صح، دي الكلمة اللي في القصيدة.", "\"their\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"revenge\"."]}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Sisuphos,</span> <span class=\"en\">teaches thy stone</span> — <span class=\"en\">Tantalos,</span> <span class=\"en\">teaches thy thirst.</span>..</div><div class=\"u\"><span class=\"en\">Sisuphos scouts low fraud,</span> <span class=\"en\">and to Tantalos treason is folly.</span>\"</div><div class=\"u\">يعني: سيزيف حجره بيعلمه، وطنطالوس عطشه بيعلمه. العذاب نفسه مدرسة.</div><div class=\"u\">2<span class=\"em\"><span class=\"em\">️</span></span>⃣ شكسبير، الملك لير (الفصل الرابع، المشهد السابع):</div><div class=\"u\">لير لما بيفوق من جنونه ويشوف بنته كورديليا، بيقول:</div><div class=\"u\">\"<span class=\"en\">Thou art a soul in bliss,</span> <span class=\"en\">but I am bound</span></div>", "n": 6, "i": 39, "a": "myth-m8-029", "x": "890dcb00"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Upon a wheel of fire,</span> <span class=\"en\">that mine own tears</span></div><div class=\"u\"><span class=\"en\">Do scald like molten lead.</span>\"</div><div class=\"u\">(انتي روح في النعيم، بس أنا مربوط على عجلة نار، دموعي بتحرقني زي الرصاص المداب.)</div><div class=\"u\"><span class=\"em\"><span class=\"em\">⚠️</span></span> ملحوظة: شكسبير مش بيسمي إكسيون بالاسم، بس صورة \"الرجل المربوط على عجلة النار\" إشارة معروفة للأسطورة. دي <span class=\"en\">allusion</span> غير مباشرة، وده أول مثال ليك على الإشارة من غير تسمية.</div>", "n": 4, "i": 40, "a": "myth-m8-030", "x": "879a98a4"}, {"t": "learn", "h": "<div class=\"u\">3<span class=\"em\"><span class=\"em\">️</span></span>⃣ تشوسر، \"أسطورة هيبرمنيسترا\" (من كتاب <span class=\"en\">The Legend of Good Women</span>، حوالي 1380<span class=\"en\">s</span>):</div><div class=\"u\">تشوسر حكى قصة البنت الوحيدة اللي عفت عن جوزها. بيبدأ كده:</div><div class=\"u\">\"<span class=\"en\">In Grece whylom weren brethren two,</span></div><div class=\"u\"><span class=\"en\">Of whiche that oon was called Danao.</span>..\"</div><div class=\"u\">(في اليونان زمان كان في أخوين...)</div>", "n": 5, "i": 41, "a": "myth-m8-031", "x": "1d2d97bd"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">⚠️</span></span> ملحوظة مذهلة: تشوسر قلب الأدوار! عنده داناوس هو أبو الولاد ولينكيوس ابنه، وأيجيبتوس هو أبو هيبرمنيسترا، عكس أبولودوروس تماماً. درس عملي: الشعراء بياخدوا النسخة اللي تخدم قصتهم. الأسطورة مش نص مقدس، الأسطورة مادة خام.</div><div class=\"u\">4<span class=\"em\"><span class=\"em\">️</span></span>⃣ ترجمة جولدنج لأوفيد (1567)، الترجمة اللي شكسبير نفسه قراها:</div><div class=\"u\">\"<span class=\"en\">And Danaus daughters forbicause they did their cousins kill,</span></div>", "n": 3, "i": 42, "a": "myth-m8-032", "x": "366b4a28"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Drew water into running tubbes which evermore did spill.</span>\"</div><div class=\"u\">(وبنات داناوس، لأنهم قتلوا قرايبهم، بيحملوا المية في أواني بتسرب على طول.)</div><div class=\"u\">5<span class=\"em\"><span class=\"em\">️</span></span>⃣ الأصل الكلاسيكي: هوميروس، الأوديسية 11.582-592، أول ظهور لطنطالوس في الأدب، أوديسيوس شافه بعينه في العالم السفلي (ترجمة <span class=\"en\">Murray</span> فوق في الفصل).</div><div class=\"u\"><span class=\"em\"><span class=\"em\">────────────────────</span></span></div><div class=\"u\"><span class=\"em\"><span class=\"em\">🔤</span></span> كلمات إنجليزي من الفصل</div>", "n": 5, "i": 43, "a": "myth-m8-033", "x": "7e504f82"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">tantalize</span>: يغريك بحاجة ويحرمك منها (من طنطالوس نفسه).</div><div class=\"li\"><span class=\"en\">torment</span>: عذاب.</div><div class=\"li\"><span class=\"en\">benefactor</span>: صاحب المعروف، ولي النعمة.</div><div class=\"li\"><span class=\"en\">ingratitude</span>: كفران النعمة.</div><div class=\"li\"><span class=\"en\">kindred blood</span>: دم القرابة، دم العيلة.</div><div class=\"li\"><span class=\"en\">wheel of fire</span>: عجلة النار.</div><div class=\"li\"><span class=\"en\">sieve</span>: منخل، غربال.</div><div class=\"li\"><span class=\"en\">leaky jar</span>: جرة مخرومة بتسرب.</div><div class=\"li\"><span class=\"en\">eternal punishment</span>: عقاب أبدي.</div><div class=\"li\"><span class=\"en\">to purify</span>: يطهر من الذنب.</div><div class=\"li\"><span class=\"en\">wedding night</span>: ليلة الدخلة.</div>", "n": 11, "i": 44, "a": "myth-m8-034", "x": "51ab40b3"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">to repay kindness with betrayal</span>: يرد المعروف بالخيانة.</div><div class=\"u\"><span class=\"em\"><span class=\"em\">────────────────────</span></span></div><div class=\"li\">خوسيه دي ريبيرا، لوحة \"طنطالوس\" (حوالي 1632، متحف البرادو، مدريد): ابحث في كومنز عن \"<span class=\"en\">Ribera Tantalus Prado</span>\".</div><div class=\"li\">خوسيه دي ريبيرا، لوحة \"إكسيون\" (حوالي 1632، البرادو): ابحث عن \"<span class=\"en\">Ribera Ixion Prado</span>\".</div><div class=\"li\">جون ويليام ووترهاوس، لوحة \"<span class=\"en\">The Dana</span>ï<span class=\"en\">des</span>\" (1903): ابحث عن \"<span class=\"en\">Waterhouse Danaides</span>\".</div>", "n": 5, "i": 45, "a": "myth-m8-035", "x": "125a6e0f"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">to _____ kindness with betrayal</div>", "opts": ["tubbes", "revenge", "repay"], "ans": 2, "why": "<span class=\"en\">to repay kindness with betrayal</span>", "i": 46, "ex": ["\"tubbes\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"repay\".", "\"revenge\" مش هي الكلمة في القصيدة، ومعناها ما يركّبش مع باقي الجملة. الكلمة الصح \"repay\".", "صح، دي الكلمة اللي في القصيدة."]}, {"t": "learn", "h": "<div class=\"li\">أوغست رودان، تمثال \"<span class=\"en\">Dana</span>ï<span class=\"en\">d</span>\" (حوالي 1889): ابحث عن \"<span class=\"en\">Rodin Danaid</span>\".</div><div class=\"li\">نقش لبرنار بيكار عن عقاب طنطالوس أو إكسيون (1731، من سلسلة <span class=\"en\">Temple of the Muses</span>): ابحث عن \"<span class=\"en\">Picart Tantalus engraving</span>\".</div><div class=\"u\"><span class=\"em\"><span class=\"em\">────────────────────</span></span></div><div class=\"li\">بندار، الأوليمبية والبيثية، <span class=\"en\">Pythian 2</span> (قصة إكسيون، ترجمة <span class=\"en\">Sandys</span>):</div>", "n": 5, "i": 47, "a": "myth-m8-036", "x": "cdd9974d"}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 48}];</script>
